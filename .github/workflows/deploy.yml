# Auto-deploy to Cloudflare Pages on every push to main.
# Requires repo secret CLOUDFLARE_API_TOKEN (Cloudflare dashboard →
# My Profile → API Tokens → Create Token → "Cloudflare Pages — Edit" template).
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy
        run: npx wrangler pages deploy dist --project-name=sparkflow --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b674efb0e3f344e3fcadb45e737497a7
