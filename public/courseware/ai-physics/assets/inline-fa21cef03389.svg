<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#0f172a"/>
  <rect x="70" y="70" width="1060" height="535" rx="34" fill="#f8fafc"/>
  <text x="110" y="145" fill="#0f766e" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700">07 交付迭代</text>
  <text x="110" y="205" fill="#0f172a" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="52" font-weight="800">从可运行到可复用、可推广</text>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" fill="#134e4a">
    <text x="130" y="310">交付：可访问平台、实验清单、操作说明</text>
    <text x="130" y="370">培训：教师试用、课堂案例、提示词模板</text>
    <text x="130" y="430">迭代：反馈收集、缺陷修复、资源扩展</text>
  </g>
  <g fill="#14b8a6" opacity=".92">
    <rect x="790" y="285" width="260" height="64" rx="16"/>
    <rect x="830" y="375" width="220" height="64" rx="16"/>
    <rect x="870" y="465" width="180" height="64" rx="16"/>
  </g>
  <text x="110" y="555" fill="#475569" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24">产出：上线包、培训材料、运营指标、二期路线图</text>
</svg>
