<!doctype html>
<html lang="zh-CN">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>轨道共振 · 有理与无理之舞</title>
  <style>
    :root {
      color-scheme: dark;
      --sim-bg: #070b18;
      --sim-surface: #0f1626;
      --sim-surface-soft: #131c30;
      --sim-text: #e8eefc;
      --sim-muted: #8a98b8;
      --sim-border: #1f2c44;
      --sim-grid: #16213a;
      --sim-accent: #5cc8ff;
      --sim-accent-deep: #2a8fd6;
      --sim-accent-soft: rgba(92, 200, 255, 0.14);
      --sim-positive: #5cc8ff;
      --sim-warning: #f5a623;
      --sim-danger: #ff5c7a;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 18px 46px rgba(0, 0, 0, 0.45);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 18% 8%, rgba(92, 200, 255, 0.10), transparent 32%),
        radial-gradient(circle at 88% 12%, rgba(245, 166, 35, 0.07), transparent 30%),
        var(--sim-bg);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(92, 200, 255, 0.45); outline-offset: 2px; }
    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
    .status { border: 1px solid rgba(92, 200, 255, 0.28); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent); font-weight: 780; white-space: nowrap; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 2.15fr) minmax(280px, 0.55fr); gap: 12px; }
    .panel { min-width: 0; background: rgba(15, 22, 38, 0.72); border: 1px solid var(--sim-border); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
    #scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid var(--sim-border); border-radius: 18px; background: radial-gradient(circle at 50% 50%, #0c1426 0%, #060912 80%); }
    .side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
    .readouts, .model-note { padding: 17px; }
    .readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric { padding: 14px; border: 1px solid var(--sim-border); border-radius: 15px; background: linear-gradient(145deg, #131c30, #0f1626); }
    .metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
    .metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .model-note { display: grid; align-content: start; gap: 14px; }
    .model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
    .insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: rgba(245, 166, 35, 0.08); color: #f5d18a !important; font-weight: 650; }
    .controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr) minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
    button:hover { border-color: #2f4263; background: #182240; }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #06121f; background: linear-gradient(135deg, var(--sim-accent), var(--sim-accent-deep)); box-shadow: 0 8px 18px rgba(92, 200, 255, 0.20); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
    .control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
    @media (max-width: 860px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
      .scene-panel { min-height: 0; }
      #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="app" data-layout="visualization-first" data-model-tier="analytic">
    <header class="header" data-region="header">
      <div>
        <h1>轨道共振 · 有理与无理之舞</h1>
        <p>两珠绕同一圆心匀速旋转，速度比决定轨迹是闭合花瓣还是永不重复的星云。</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head"><h2 id="scene-title">双珠圆环轨道</h2><span>内珠 · 外珠 · 拖尾轨迹</span></div>
        <canvas id="scene" role="img" aria-labelledby="scene-title scene-desc">
          <desc id="scene-desc">深蓝黑背景上两颗发光珠子绕圆心旋转，外珠留下轨迹。</desc>
        </canvas>
      </section>

      <aside class="side" data-region="evidence">
        <section class="panel readouts" aria-label="实时数值">
          <div class="readout-grid">
            <div class="metric"><small>速度比 ω₂/ω₁</small><strong id="ratioReadout">1.500</strong></div>
            <div class="metric"><small>模拟时间</small><strong id="timeReadout">0.00 s</strong></div>
            <div class="metric"><small>外珠已转圈数</small><strong id="lapsReadout">0.00</strong></div>
            <div class="metric"><small>轨迹点数</small><strong id="pointsReadout">0</strong></div>
          </div>
        </section>
        <section class="panel model-note" data-region="insight">
          <div class="panel-head"><h2>模型</h2></div>
          <p id="insight" class="insight">按"开始"观察。当速度比为有理数 p/q，轨迹在 q 圈后闭合成花瓣；无理数则永不重复。</p>
          <p>教学视图：θ₁=ω₁t，θ₂=ω₂t。比值连续可调，从 3/2 花瓣到 √2 星云无缝切换。</p>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="模拟控制">
      <div class="actions">
        <button id="startBtn" class="primary" type="button">开始</button>
        <button id="pauseBtn" type="button">暂停</button>
        <button id="resetBtn" type="button">重置</button>
      </div>
      <div class="control">
        <label for="ratioInput">速度比 <output id="ratioOutput">1.500</output></label>
        <input id="ratioInput" type="range" min="0.5" max="3" step="0.001" value="1.5">
      </div>
      <div class="control">
        <label for="speedInput">时间倍率 <output id="speedOutput">1.0×</output></label>
        <input id="speedInput" type="range" min="0.2" max="3" step="0.1" value="1">
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";
    const parameterSchema = [
      { key: "ratio", label: "速度比", type: "slider", min: 0.5, max: 3, step: 0.001, default: 1.5, unit: "" },
      { key: "speed", label: "时间倍率", type: "slider", min: 0.2, max: 3, step: 0.1, default: 1, unit: "×" }
    ];
    const state = {
      running: false,
      t: 0,
      ratio: 1.5,
      speed: 1,
      lastTimestamp: null,
      trail: [],
      maxTrail: 4000
    };
    const elements = {
      status: document.querySelector("#status"),
      scene: document.querySelector("#scene"),
      ratioReadout: document.querySelector("#ratioReadout"),
      timeReadout: document.querySelector("#timeReadout"),
      lapsReadout: document.querySelector("#lapsReadout"),
      pointsReadout: document.querySelector("#pointsReadout"),
      insight: document.querySelector("#insight"),
      ratioInput: document.querySelector("#ratioInput"),
      ratioOutput: document.querySelector("#ratioOutput"),
      speedInput: document.querySelector("#speedInput"),
      speedOutput: document.querySelector("#speedOutput"),
      startBtn: document.querySelector("#startBtn"),
      pauseBtn: document.querySelector("#pauseBtn"),
      resetBtn: document.querySelector("#resetBtn")
    };
    let ctx = null;
    let dpr = 1;
    let cssW = 0;
    let cssH = 0;

    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

    function resizeCanvas() {
      const canvas = elements.scene;
      const rect = canvas.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return;
      dpr = window.devicePixelRatio || 1;
      cssW = rect.width;
      cssH = rect.height;
      canvas.width = Math.max(1, Math.floor(cssW * dpr));
      canvas.height = Math.max(1, Math.floor(cssH * dpr));
      ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function init() {
      resizeCanvas();
      window.addEventListener("resize", () => { resizeCanvas(); render(); });
      bindControls();
      setParameters({ ratio: 1.5, speed: 1 });
      reset();
      requestAnimationFrame(frame);
    }
    function start() {
      state.running = true;
      elements.status.textContent = "运行中";
      elements.startBtn.setAttribute("aria-pressed", "true");
    }
    function pause() {
      state.running = false;
      elements.status.textContent = "已暂停";
      elements.startBtn.setAttribute("aria-pressed", "false");
    }
    function reset() {
      pause();
      state.t = 0;
      state.lastTimestamp = null;
      state.trail = [];
      render();
    }
    function update(dt) {
      if (!state.running) return;
      const boundedDt = clamp(finite(dt, 0), 0, 0.05);
      const effDt = boundedDt * state.speed;
      state.t += effDt;
      const w1 = 1.0;
      const w2 = state.ratio;
      const r1 = Math.min(cssW, cssH) * 0.18;
      const r2 = Math.min(cssW, cssH) * 0.36;
      const cx = cssW / 2;
      const cy = cssH / 2;
      const x2 = cx + r2 * Math.cos(w2 * state.t);
      const y2 = cy + r2 * Math.sin(w2 * state.t);
      state.trail.push({ x: x2, y: y2 });
      if (state.trail.length > state.maxTrail) state.trail.shift();
    }
    function render() {
      if (!ctx || cssW <= 0 || cssH <= 0) return;
      ctx.clearRect(0, 0, cssW, cssH);
      const cx = cssW / 2;
      const cy = cssH / 2;
      const r1 = Math.min(cssW, cssH) * 0.18;
      const r2 = Math.min(cssW, cssH) * 0.36;

      // 背景星点
      ctx.save();
      for (let i = 0; i < 60; i++) {
        const sx = ((i * 73.31) % 1) * cssW;
        const sy = ((i * 41.17) % 1) * cssH;
        const sa = 0.08 + ((i * 13.7) % 1) * 0.12;
        ctx.fillStyle = `rgba(200, 220, 255, ${sa})`;
        ctx.fillRect(sx, sy, 1.4, 1.4);
      }
      ctx.restore();

      // 轨道圆
      ctx.strokeStyle = "rgba(92, 200, 255, 0.18)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, r1, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, r2, 0, Math.PI * 2);
      ctx.stroke();

      // 圆心
      ctx.fillStyle = "rgba(232, 238, 252, 0.5)";
      ctx.beginPath();
      ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // 拖尾
      if (state.trail.length > 1) {
        for (let i = 1; i < state.trail.length; i++) {
          const a = i / state.trail.length;
          ctx.strokeStyle = `rgba(92, 200, 255, ${a * 0.85})`;
          ctx.lineWidth = 1.5 + a * 1.2;
          ctx.beginPath();
          ctx.moveTo(state.trail[i - 1].x, state.trail[i - 1].y);
          ctx.lineTo(state.trail[i].x, state.trail[i].y);
          ctx.stroke();
        }
      }

      // 内珠
      const w1 = 1.0;
      const w2 = state.ratio;
      const x1 = cx + r1 * Math.cos(w1 * state.t);
      const y1 = cy + r1 * Math.sin(w1 * state.t);
      const x2 = cx + r2 * Math.cos(w2 * state.t);
      const y2 = cy + r2 * Math.sin(w2 * state.t);

      // 连接线
      ctx.strokeStyle = "rgba(245, 166, 35, 0.22)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      // 内珠光晕
      const g1 = ctx.createRadialGradient(x1, y1, 0, x1, y1, 16);
      g1.addColorStop(0, "rgba(245, 166, 35, 0.9)");
      g1.addColorStop(1, "rgba(245, 166, 35, 0)");
      ctx.fillStyle = g1;
      ctx.beginPath();
      ctx.arc(x1, y1, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#f5a623";
      ctx.beginPath();
      ctx.arc(x1, y1, 5, 0, Math.PI * 2);
      ctx.fill();

      // 外珠光晕
      const g2 = ctx.createRadialGradient(x2, y2, 0, x2, y2, 20);
      g2.addColorStop(0, "rgba(92, 200, 255, 0.95)");
      g2.addColorStop(1, "rgba(92, 200, 255, 0)");
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.arc(x2, y2, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#5cc8ff";
      ctx.beginPath();
      ctx.arc(x2, y2, 6, 0, Math.PI * 2);
      ctx.fill();

      // 读数
      const ratio = state.ratio;
      const laps = (state.ratio * state.t) / (2 * Math.PI);
      elements.ratioReadout.textContent = ratio.toFixed(3);
      elements.timeReadout.textContent = `${state.t.toFixed(2)} s`;
      elements.lapsReadout.textContent = laps.toFixed(2);
      elements.pointsReadout.textContent = String(state.trail.length);

      // 洞察文本
      const frac = approxFraction(ratio, 1000);
      let insightText;
      if (frac) {
        insightText = `当前比 ≈ ${frac.p}/${frac.q}（有理），轨迹将在外珠 ${frac.q} 圈后闭合为 ${frac.p} 瓣花。`;
      } else {
        insightText = `当前比接近无理数，轨迹永不闭合，持续编织星云状路径。`;
      }
      elements.insight.textContent = insightText;

      elements.ratioOutput.textContent = ratio.toFixed(3);
      elements.speedOutput.textContent = `${state.speed.toFixed(1)}×`;
    }
    function setParameters(values) {
      const ratioDef = parameterSchema[0];
      const speedDef = parameterSchema[1];
      state.ratio = clamp(finite(Number(values.ratio), ratioDef.default), ratioDef.min, ratioDef.max);
      state.speed = clamp(finite(Number(values.speed), speedDef.default), speedDef.min, speedDef.max);
      elements.ratioInput.value = String(state.ratio);
      elements.speedInput.value = String(state.speed);
      render();
    }
    function getState() {
      return {
        running: state.running,
        t: state.t,
        ratio: state.ratio,
        speed: state.speed,
        trailLength: state.trail.length
      };
    }
    function getReadouts() {
      return {
        ratio: state.ratio,
        time: state.t,
        laps: (state.ratio * state.t) / (2 * Math.PI),
        points: state.trail.length
      };
    }
    function runModelChecks() {
      const simulate = (ratio, duration, dt) => {
        let t = 0;
        let x2 = 1;
        let y2 = 0;
        const w1 = 1.0;
        const w2 = ratio;
        const samples = [];
        while (t < duration - 1e-12) {
          x2 = Math.cos(w2 * t);
          y2 = Math.sin(w2 * t);
          samples.push({ t, x: x2, y: y2 });
          t += dt;
        }
        return samples;
      };
      const rationalSamples = simulate(1.5, 4 * Math.PI, 1 / 240);
      const lastRational = rationalSamples[rationalSamples.length - 1];
      const rationalClosure = Math.abs(lastRational.x - 1) + Math.abs(lastRational.y - 0);
      const irrationalSamples = simulate(Math.sqrt(2), 4 * Math.PI, 1 / 240);
      const lastIrrational = irrationalSamples[irrationalSamples.length - 1];
      const irrationalOpen = Math.abs(lastIrrational.x - 1) + Math.abs(lastIrrational.y - 0);
      const ratioSensitivity = simulate(2.0, 2 * Math.PI, 1 / 240).length > 0;
      const finiteCheck = Number.isFinite(rationalClosure) && Number.isFinite(irrationalOpen);
      return [
        { name: "有限性检查", pass: finiteCheck, expected: "有限值", actual: `closure=${rationalClosure}, open=${irrationalOpen}`, tolerance: "finite" },
        { name: "有理比闭合（3/2，3圈）", pass: rationalClosure < 0.02, expected: "≈0", actual: rationalClosure, tolerance: 0.02 },
        { name: "无理比不闭合（√2）", pass: irrationalOpen > 0.02, expected: ">0.02", actual: irrationalOpen, tolerance: 0.02 },
        { name: "比值敏感性", pass: ratioSensitivity, expected: "产生样本", actual: ratioSensitivity, tolerance: "strict" }
      ];
    }
    function approxFraction(x, maxDen) {
      let best = null;
      let bestErr = Infinity;
      for (let q = 1; q <= maxDen; q++) {
        const p = Math.round(x * q);
        const err = Math.abs(x - p / q);
        if (err < bestErr) {
          bestErr = err;
          best = { p, q, err };
        }
      }
      if (best && bestErr < 0.003) return best;
      return null;
    }
    function bindControls() {
      elements.startBtn.addEventListener("click", start);
      elements.pauseBtn.addEventListener("click", pause);
      elements.resetBtn.addEventListener("click", reset);
      elements.ratioInput.addEventListener("input", () => setParameters({ ratio: elements.ratioInput.value, speed: state.speed }));
      elements.speedInput.addEventListener("input", () => setParameters({ ratio: state.ratio, speed: elements.speedInput.value }));
    }
    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }
    window.simulation = {
      init: init,
      start: start,
      pause: pause,
      reset: reset,
      update: update,
      render: render,
      setParameters: setParameters,
      getState: getState,
      getReadouts: getReadouts,
      runModelChecks: runModelChecks
    };
    init();
  })();
  </script>
</body>
</html>
