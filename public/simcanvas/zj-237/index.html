<title>纸张折叠的宇宙</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #04060c;
  --sim-surface: #0a0f1a;
  --sim-surface-soft: #0d1320;
  --sim-text: #e8eefc;
  --sim-muted: #6b7891;
  --sim-border: #1a2236;
  --sim-grid: #131a2a;
  --sim-accent: #5eead4;
  --sim-accent-deep: #2dd4bf;
  --sim-accent-soft: rgba(94, 234, 212, 0.12);
  --sim-positive: #5eead4;
  --sim-warning: #fbbf24;
  --sim-danger: #f87171;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--sim-bg); color: var(--sim-text); }
body { font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
.app { width: 100%; height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
.header { padding: 14px 24px 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.header h1 { font-size: clamp(1.1rem, 1.8vw, 1.5rem); font-weight: 700; letter-spacing: -0.02em; }
.header .formula { color: var(--sim-muted); font-size: clamp(0.78rem, 1vw, 0.95rem); font-variant-numeric: tabular-nums; }
.header .formula b { color: var(--sim-accent); font-weight: 600; }
.header .status { border: 1px solid rgba(94,234,212,.28); border-radius: 999px; padding: 6px 14px; background: var(--sim-accent-soft); color: var(--sim-accent); font-weight: 700; white-space: nowrap; font-size: 0.82rem; }

#stage { display: block; width: 100%; height: 100%; }
.controls { padding: 10px 24px 14px; display: grid; grid-template-columns: auto 1fr 1fr auto; gap: 28px; align-items: center; border-top: 1px solid var(--sim-border); background: linear-gradient(180deg, transparent, rgba(0,0,0,0.3)); }
.actions { display: flex; gap: 8px; }
button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
button:hover { border-color: #2a3550; background: #131c2e; }
button:active { transform: scale(.97); }
button.primary { border-color: var(--sim-accent-deep); color: #04060c; background: linear-gradient(135deg, var(--sim-accent), var(--sim-accent-deep)); box-shadow: 0 8px 18px rgba(94,234,212,.20); }
button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
.ctrl { display: flex; flex-direction: column; gap: 6px; }
.ctrl-label { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.78rem; color: var(--sim-muted); }
.ctrl-label .name { font-weight: 600; color: var(--sim-text); }
.ctrl-label .val { color: var(--sim-accent); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; background: var(--sim-border); border-radius: 2px; outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; background: var(--sim-accent); border-radius: 50%; cursor: pointer; border: 2px solid var(--sim-bg); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; background: var(--sim-accent); border-radius: 50%; cursor: pointer; border: 2px solid var(--sim-bg); }
input[type=range]:focus-visible { outline: 2px solid var(--sim-accent); outline-offset: 4px; }

.readout .thickness-val { font-size: clamp(1rem, 1.6vw, 1.3rem); font-weight: 700; color: var(--sim-text); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

@media (max-width: 760px) {
  .controls { grid-template-columns: 1fr; gap: 10px; padding: 10px 14px 12px; }

}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <h1>纸张折叠的宇宙</h1>
    <div class="formula">厚度 = <b id="t0Display">0.0001</b> 米 × 2 的 <b id="nDisplay">0</b> 次方</div>
    <div id="status" class="status" role="status" aria-live="polite">运行中</div>
  </header>
  <div class="stage-wrap" data-region="stage">
    <canvas id="stage"></canvas>
  </div>
  <section class="controls" data-region="controls" aria-label="模拟控件">
    <div class="actions">
      <button id="startBtn" class="primary" type="button" aria-pressed="true">开始</button>
      <button id="pauseBtn" type="button" aria-pressed="false">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="ctrl">
      <label class="ctrl-label" for="nSlider"><span class="name">折叠次数 n</span><span class="val" id="nVal">0</span></label>
      <input id="nSlider" type="range" min="0" max="110" step="1" value="0" aria-label="折叠次数">
    </div>
    <div class="ctrl">
      <label class="ctrl-label" for="t0Slider"><span class="name">初始厚度</span><span class="val" id="t0Val">0.0001 m</span></label>
      <input id="t0Slider" type="range" min="0.00005" max="0.001" step="0.00005" value="0.0001" aria-label="初始厚度">
    </div>
    <div class="readout" data-region="evidence">
      <div class="thickness-label">当前厚度</div>
      <div class="thickness-val" id="thicknessReadout">0.0001 m</div>
      <div class="milestone" id="milestoneReadout">起点 · 一张纸</div>
    </div>
  </section>
  <aside class="insight" data-region="insight" aria-label="模型说明">
    <p id="insightText">每多折一次，厚度翻倍。指数增长让一张纸在 103 次折叠后超过可观测宇宙直径。</p>
  </aside>
</div>
<script>
(() => {
  "use strict";
  const MILESTONES = [
    { t: 0.0001, label: "一张纸", short: "纸" },
    { t: 0.01, label: "1 厘米 · 指甲盖", short: "1cm" },
    { t: 0.1, label: "10 厘米 · 手掌", short: "10cm" },
    { t: 1, label: "1 米 · 课桌高度", short: "1m" },
    { t: 3, label: "3 米 · 房间一层", short: "3m" },
    { t: 10, label: "10 米 · 三层楼", short: "10m" },
    { t: 100, label: "100 米 · 足球场", short: "100m" },
    { t: 1000, label: "1 公里", short: "1km" },
    { t: 8848, label: "珠穆朗玛峰 8848 米", short: "珠峰" },
    { t: 40000, label: "4 万米 · 气球高度", short: "气球" },
    { t: 100000, label: "10 万米 · 卡门线", short: "卡门线" },
    { t: 408000, label: "国际空间站轨道 408 公里", short: "空间站" },
    { t: 1000000, label: "1000 公里 · 低轨", short: "1000km" },
    { t: 384400000, label: "地月距离 38.4 万公里", short: "月球" },
    { t: 1.496e11, label: "日地距离 1.5 亿公里", short: "太阳" },
    { t: 9.461e15, label: "1 光年", short: "1ly" },
    { t: 4.0e16, label: "比邻星 4.2 光年", short: "比邻星" },
    { t: 1.0e18, label: "100 光年 · 邻近恒星", short: "100ly" },
    { t: 1.0e20, label: "1 万光年 · 银河系内", short: "1万ly" },
    { t: 1.0e21, label: "10 万光年 · 银河系直径", short: "银河系" },
    { t: 1.0e22, label: "100 万光年", short: "100万ly" },
    { t: 8.8e26, label: "可观测宇宙 930 亿光年", short: "宇宙" }
  ];
  const state = {
    running: true, n: 0, t0: 0.0001,
    animN: 0, animDir: 1, animPhase: 0,
    lastTime: null, canvasW: 0, canvasH: 0, dpr: 1
  };
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const els = {
    nSlider: document.getElementById('nSlider'),
    t0Slider: document.getElementById('t0Slider'),
    nVal: document.getElementById('nVal'),
    t0Val: document.getElementById('t0Val'),
    t0Display: document.getElementById('t0Display'),
    nDisplay: document.getElementById('nDisplay'),
    thicknessReadout: document.getElementById('thicknessReadout'),
    milestoneReadout: document.getElementById('milestoneReadout'),
    insightText: document.getElementById('insightText'),
    status: document.getElementById('status'),
    startBtn: document.getElementById('startBtn'),
    pauseBtn: document.getElementById('pauseBtn'),
    resetBtn: document.getElementById('resetBtn')
  };
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function thickness(n, t0) { return t0 * Math.pow(2, n); }
  function nearestMilestone(t) {
    let best = MILESTONES[0], idx = 0;
    for (let i = 0; i < MILESTONES.length; i++) {
      if (t >= MILESTONES[i].t) { best = MILESTONES[i]; idx = i; }
      else break;
    }
    return { milestone: best, index: idx };
  }
  function formatThickness(t) {
    if (t < 0.01) return (t * 1000).toFixed(3) + ' 毫米';
    if (t < 1) return (t * 100).toFixed(2) + ' 厘米';
    if (t < 1000) return t.toFixed(2) + ' 米';
    if (t < 1e6) return (t / 1000).toFixed(2) + ' 公里';
    if (t < 1.496e11) return (t / 1e6).toFixed(2) + ' 千公里';
    if (t < 9.461e15) return (t / 1.496e11).toFixed(2) + ' AU';
    if (t < 1e21) return (t / 9.461e15).toFixed(2) + ' 光年';
    return (t / 9.461e15).toExponential(2) + ' 光年';
  }
  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    state.dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.floor(rect.width * state.dpr));
    canvas.height = Math.max(1, Math.floor(rect.height * state.dpr));
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    state.canvasW = rect.width;
    state.canvasH = rect.height;
  }
  function drawPaperStack(cx, cy, n, t) {
    const maxLayers = Math.min(n, 14);
    const baseW = 220, baseH = 8;
    const layerH = Math.max(1.4, Math.min(3.2, 60 / Math.max(1, maxLayers)));
    const totalH = maxLayers * layerH + baseH;
    const startY = cy + 100;
    const topY = startY - totalH;
    const stackLeft = cx - baseW / 2;
    const stackRight = cx + baseW / 2;
    ctx.strokeStyle = 'rgba(94, 234, 212, 0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(stackLeft, startY + 2);
    ctx.lineTo(stackRight, startY + 2);
    ctx.stroke();
    for (let i = 0; i < maxLayers; i++) {
      const y = startY - i * layerH - baseH;
      const w = baseW * (1 - i * 0.012);
      const x = cx - w / 2;
      const alpha = 0.35 + 0.5 * (1 - i / Math.max(1, maxLayers));
      ctx.fillStyle = `rgba(94, 234, 212, ${alpha})`;
      ctx.fillRect(x, y, w, baseH);
      ctx.strokeStyle = 'rgba(13, 19, 32, 0.7)';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(x, y, w, baseH);
    }
    ctx.fillStyle = 'rgba(94, 234, 212, 0.95)';
    ctx.font = '600 11px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`${maxLayers} 层 (2^${maxLayers})`, cx, topY - 10);
    if (n > 14) {
      ctx.fillStyle = 'rgba(251, 191, 36, 0.9)';
      ctx.font = '600 10px ui-sans-serif, system-ui, sans-serif';
      ctx.fillText(`+ ${n - 14} 层超出可视`, cx, topY - 24);
    }
    ctx.fillStyle = 'rgba(232, 238, 252, 0.55)';
    ctx.font = '500 11px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('折纸几何示意', stackLeft, topY - 36);
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(94, 234, 212, 0.85)';
    ctx.font = '700 13px ui-sans-serif, system-ui, sans-serif';
    ctx.fillText(formatThickness(t), cx, startY + 22);
  }
  function drawLogBar(cx, topY, bottomY, barW, t, near) {
    const minLog = Math.log10(0.0001);
    const maxLog = Math.log10(8.8e26);
    const logT = clamp(Math.log10(Math.max(1e-30, t)), minLog, maxLog);
    const fillH = ((logT - minLog) / (maxLog - minLog)) * (bottomY - topY);
    const fillTop = bottomY - fillH;
    const grad = ctx.createLinearGradient(0, bottomY, 0, topY);
    grad.addColorStop(0, 'rgba(94, 234, 212, 0.95)');
    grad.addColorStop(0.5, 'rgba(45, 212, 191, 0.7)');
    grad.addColorStop(1, 'rgba(251, 191, 36, 0.55)');
    ctx.fillStyle = grad;
    ctx.fillRect(cx - barW / 2, fillTop, barW, fillH);
    ctx.strokeStyle = 'rgba(94, 234, 212, 0.9)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(cx - barW / 2, fillTop, barW, fillH);
    ctx.fillStyle = 'rgba(232, 238, 252, 0.95)';
    ctx.beginPath();
    ctx.arc(cx, fillTop, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(94, 234, 212, 0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, fillTop, 9, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(232, 238, 252, 0.55)';
    ctx.font = '500 11px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('对数尺度高度柱', cx - barW / 2 - 8, topY - 14);
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(232, 238, 252, 0.95)';
    ctx.font = '700 12px ui-sans-serif, system-ui, sans-serif';
    ctx.fillText(formatThickness(t), cx, fillTop - 14);
    for (let i = 0; i < MILESTONES.length; i++) {
      const m = MILESTONES[i];
      const lm = Math.log10(m.t);
      const y = bottomY - ((lm - minLog) / (maxLog - minLog)) * (bottomY - topY);
      const isCurrent = i === near.index;
      const isPassed = i < near.index;
      ctx.strokeStyle = isCurrent ? 'rgba(251, 191, 36, 0.85)' : 'rgba(107, 120, 145, 0.4)';
      ctx.lineWidth = isCurrent ? 1.5 : 1;
      ctx.setLineDash(isCurrent ? [] : [3, 4]);
      ctx.beginPath();
      ctx.moveTo(cx - barW / 2 - 4, y);
      ctx.lineTo(cx + barW / 2 + 4, y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = isCurrent ? 'rgba(251, 191, 36, 1)' : isPassed ? 'rgba(94, 234, 212, 0.8)' : 'rgba(107, 120, 145, 0.6)';
      ctx.font = (isCurrent ? '700 ' : '500 ') + '11px ui-sans-serif, system-ui, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(m.short, cx - barW / 2 - 8, y + 4);
    }
    ctx.fillStyle = 'rgba(107, 120, 145, 0.5)';
    ctx.font = '500 10px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('0.1 毫米', cx - barW / 2 - 8, bottomY + 14);
    ctx.fillText('930 亿光年', cx - barW / 2 - 8, topY - 4);
  }
  function drawDivider(x) {
    ctx.strokeStyle = 'rgba(26, 34, 54, 0.8)';
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 6]);
    ctx.beginPath();
    ctx.moveTo(x, 20);
    ctx.lineTo(x, state.canvasH - 20);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  function drawScene() {
    const W = state.canvasW, H = state.canvasH;
    ctx.fillStyle = '#04060c';
    ctx.fillRect(0, 0, W, H);
    const nInt = Math.round(state.animN);
    const t = thickness(nInt, state.t0);
    const near = nearestMilestone(t);
    const leftCx = W * 0.28;
    const rightCx = W * 0.68;
    const topY = 50;
    const bottomY = H - 40;
    const barW = Math.min(48, W * 0.05);
    drawDivider((leftCx + rightCx) / 2);
    drawPaperStack(leftCx, H * 0.5, nInt, t);
    drawLogBar(rightCx, topY, bottomY, barW, t, near);
    ctx.fillStyle = 'rgba(251, 191, 36, 0.95)';
    ctx.font = '700 13px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`n = ${nInt}`, W / 2, 28);
    ctx.fillStyle = 'rgba(94, 234, 212, 0.85)';
    ctx.font = '600 11px ui-sans-serif, system-ui, sans-serif';
    ctx.fillText('最近里程碑', W / 2, H - 18);
    ctx.fillStyle = 'rgba(251, 191, 36, 1)';
    ctx.font = '700 12px ui-sans-serif, system-ui, sans-serif';
    ctx.fillText(near.milestone.label, W / 2, H - 4);
  }
  function updateReadouts() {
    const nInt = Math.round(state.animN);
    const t = thickness(nInt, state.t0);
    const near = nearestMilestone(t);
    els.nVal.textContent = nInt;
    els.t0Val.textContent = state.t0.toFixed(5) + ' m';
    els.t0Display.textContent = state.t0.toFixed(5);
    els.nDisplay.textContent = nInt;
    els.thicknessReadout.textContent = formatThickness(t);
    els.milestoneReadout.textContent = near.milestone.label;
    if (nInt === 0) {
      els.insightText.textContent = '每多折一次，厚度翻倍。指数增长让一张纸在 103 次折叠后超过可观测宇宙直径。';
    } else if (nInt < 14) {
      els.insightText.textContent = `已折叠 ${nInt} 次，厚度 ${formatThickness(t)}。每次折叠让厚度翻倍，增长正在加速。`;
    } else if (nInt < 42) {
      els.insightText.textContent = `n=${nInt}：纸张已超越日常尺度，进入工程与地理量级。对数柱直观显示跨越幅度。`;
    } else if (nInt < 51) {
      els.insightText.textContent = `n=${nInt}：厚度 ${formatThickness(t)}，已抵达地月空间。指数增长让遥远距离变得可达。`;
    } else if (nInt < 103) {
      els.insightText.textContent = `n=${nInt}：厚度 ${formatThickness(t)}，进入星际与星系尺度。线性直觉在此完全失效。`;
    } else {
      els.insightText.textContent = `n=${nInt}：厚度 ${formatThickness(t)}，已触及可观测宇宙边界。103 次折叠，一张纸抵达宇宙。`;
    }
  }
  function render() { drawScene(); updateReadouts(); }
  function update(dt) {
    if (!state.running) return;
    if (state.animN < state.n - 0.001) {
      const diff = state.n - state.animN;
      const speed = Math.max(0.5, Math.min(8, diff * 0.4));
      state.animN = Math.min(state.n, state.animN + speed * dt);
    } else if (state.animN > state.n + 0.001) {
      const diff = state.animN - state.n;
      const speed = Math.max(0.5, Math.min(8, diff * 0.4));
      state.animN = Math.max(state.n, state.animN - speed * dt);
    } else {
      state.animN = state.n;
    }
  }
  function frame(ts) {
    if (state.lastTime === null) state.lastTime = ts;
    const dt = Math.min(0.05, (ts - state.lastTime) / 1000);
    state.lastTime = ts;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  function start() {
    state.running = true;
    els.status.textContent = '运行中';
    els.startBtn.setAttribute('aria-pressed', 'true');
    els.pauseBtn.setAttribute('aria-pressed', 'false');
  }
  function pause() {
    state.running = false;
    els.status.textContent = '已暂停';
    els.startBtn.setAttribute('aria-pressed', 'false');
    els.pauseBtn.setAttribute('aria-pressed', 'true');
  }
  function reset() {
    pause();
    state.n = 0;
    state.animN = 0;
    els.nSlider.value = '0';
    render();
  }
  function setParameters(values) {
    if (values.n !== undefined) state.n = clamp(parseInt(values.n) || 0, 0, 110);
    if (values.t0 !== undefined) state.t0 = clamp(parseFloat(values.t0) || 0.0001, 0.00005, 0.001);
  }
  function getState() { return { running: state.running, n: state.n, t0: state.t0, animN: state.animN, thickness: thickness(Math.round(state.animN), state.t0) }; }
  function getReadouts() {
    const t = thickness(Math.round(state.animN), state.t0);
    const near = nearestMilestone(t);
    return { n: Math.round(state.animN), t0: state.t0, thickness: t, nearestMilestone: near.milestone.label };
  }
  function runModelChecks() {
    const cases = [
      { n: 0, expected: 0.0001 },
      { n: 1, expected: 0.0002 },
      { n: 7, expected: 0.0128 },
      { n: 14, expected: 1.6384 },
      { n: 42, expected: 0.0001 * Math.pow(2, 42) },
      { n: 51, expected: 0.0001 * Math.pow(2, 51) },
      { n: 103, expected: 0.0001 * Math.pow(2, 103) }
    ];
    return cases.map(c => {
      const actual = thickness(c.n, 0.0001);
      const pass = Math.abs(actual - c.expected) < c.expected * 1e-10;
      return { name: `n=${c.n}`, pass, expected: c.expected, actual, tolerance: "1e-10 relative" };
    });
  }
  function bindControls() {
    els.startBtn.addEventListener('click', start);
    els.pauseBtn.addEventListener('click', pause);
    els.resetBtn.addEventListener('click', reset);
    els.nSlider.addEventListener('input', () => setParameters({ n: els.nSlider.value }));
    els.t0Slider.addEventListener('input', () => setParameters({ t0: els.t0Slider.value }));
    window.addEventListener('resize', resize);
  }
  function init() {
    resize();
    bindControls();
    setParameters({ n: 0, t0: 0.0001 });
    requestAnimationFrame(frame);
  }
  window.simulation = { init, start, pause, reset, setParameters, getState, getReadouts, runModelChecks, render, update };
  init();
})();
</script>
