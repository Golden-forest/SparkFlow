<!doctype html>
<html lang="zh-CN">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图灵斑纹点阵</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #04060f;
  --sim-surface: #0a0e1c;
  --sim-surface-soft: #0d1224;
  --sim-text: #e8eefc;
  --sim-muted: #6b7a9a;
  --sim-border: #1a2238;
  --sim-grid: #0f1428;
  --sim-accent: #d4a857;
  --sim-accent-deep: #a8843e;
  --sim-accent-soft: #2a1f0d;
  --sim-positive: #d4a857;
  --sim-warning: #e0a040;
  --sim-danger: #c44848;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 14px 36px rgba(0,0,0,0.5);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--sim-bg);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--sim-text);
}
.app {
  position: fixed; inset: 0;
  display: block;
}
#stage {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
}
.header {
  position: fixed;
  top: 16px; left: 18px;
  z-index: 10;
  pointer-events: none;
  user-select: none;
  max-width: calc(100% - 96px);
}
.header h1 {
  font-size: clamp(1.15rem, 2vw, 1.6rem);
  letter-spacing: -0.02em;
  line-height: 1.1;
  color: rgba(232, 238, 252, 0.92);
  text-shadow: 0 0 10px rgba(0,0,0,0.7);
  font-weight: 700;
}
.header p {
  margin-top: 4px;
  font-size: 12px;
  color: rgba(212, 168, 87, 0.62);
  text-shadow: 0 0 8px rgba(0,0,0,0.6);
  line-height: 1.4;
}
.status {
  position: fixed;
  top: 18px; right: 16px;
  z-index: 10;
  border: 1px solid rgba(212, 168, 87, 0.22);
  border-radius: 999px;
  padding: 6px 14px;
  background: rgba(10, 14, 28, 0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  color: rgba(212, 168, 87, 0.92);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.06em;
  white-space: nowrap;
  pointer-events: none;
  user-select: none;
}
.evidence {
  position: fixed;
  top: 16px; right: 16px;
  z-index: 9;
  display: none;
}
.corner-label {
  position: fixed;
  left: 18px; bottom: 14px;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: rgba(212, 168, 87, 0.32);
  font-weight: 500;
  pointer-events: none;
  user-select: none;
  text-shadow: 0 0 8px rgba(0,0,0,0.6);
  line-height: 1.5;
}
.corner-label .formula {
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
  font-size: 10px;
  opacity: 0.7;
}
.readout-cluster {
  position: fixed;
  right: 16px; bottom: 14px;
  z-index: 10;
  display: flex;
  gap: 10px;
  pointer-events: none;
  user-select: none;
}
.readout {
  border: 1px solid rgba(212, 168, 87, 0.16);
  border-radius: var(--sim-radius-sm);
  padding: 8px 12px;
  background: rgba(10, 14, 28, 0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  min-width: 72px;
  text-align: right;
}
.readout small {
  display: block;
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(212, 168, 87, 0.5);
  margin-bottom: 2px;
}
.readout strong {
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  color: rgba(232, 238, 252, 0.88);
  font-weight: 700;
}
.play-btn {
  position: fixed;
  right: 16px; bottom: 12px;
  width: 36px; height: 36px;
  border: 1px solid rgba(212, 168, 87, 0.18);
  border-radius: 50%;
  background: rgba(10, 14, 28, 0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  color: rgba(232, 238, 252, 0.7);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .25s ease, border-color .25s ease, color .25s ease, transform .15s ease;
  z-index: 11;
}
.play-btn:hover {
  background: rgba(20, 28, 48, 0.7);
  border-color: rgba(212, 168, 87, 0.4);
  color: rgba(232, 238, 252, 0.95);
}
.play-btn:active { transform: scale(0.94); }
.play-btn:focus-visible {
  outline: 2px solid rgba(212, 168, 87, 0.5);
  outline-offset: 3px;
}
.play-btn svg { width: 14px; height: 14px; }
@media (max-width: 600px) {
  .header { top: 12px; left: 14px; max-width: calc(100% - 72px); }
  .header h1 { font-size: 1.1rem; }
  .header p { font-size: 10px; }
  .status { top: 12px; right: 12px; padding: 5px 10px; font-size: 10px; }
  .corner-label { font-size: 10px; left: 12px; bottom: 10px; }
  .corner-label .formula { font-size: 9px; }
  .readout-cluster { right: 12px; bottom: 10px; gap: 8px; }
  .readout { padding: 6px 10px; min-width: 60px; }
  .readout small { font-size: 8px; }
  .readout strong { font-size: 12px; }
  .play-btn { width: 32px; height: 32px; right: 12px; bottom: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .play-btn { transition: none; }
}
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <canvas id="stage" data-region="stage"></canvas>

  <header class="header" data-region="header">
    <h1>图灵斑纹点阵</h1>
    <p>确定性伪反应扩散 · 暖金斑纹在深蓝底噪上自组织演化</p>
  </header>

  <div id="status" class="status" role="status" aria-live="polite">运行中</div>

  <aside class="evidence" data-region="evidence" aria-label="实时读数">
    <div class="readout-cluster">
      <div class="readout"><small>模拟时间</small><strong id="timeReadout">0.0 s</strong></div>
      <div class="readout"><small>点阵</small><strong id="gridReadout">90×54</strong></div>
    </div>
  </aside>

  <div class="corner-label" data-region="insight" aria-hidden="true">
    图灵不稳定性<br>
    <span class="formula">pattern = Σ sin(p·x + f(t)) · sin(q·y + g(t)) + sin((p·x+q·y)/2 + h(t))</span>
  </div>

  <button class="play-btn" id="playBtn" type="button" aria-label="暂停" aria-pressed="false" data-region="controls">
    <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <rect x="6" y="5" width="4" height="14" rx="1"/>
      <rect x="14" y="5" width="4" height="14" rx="1"/>
    </svg>
    <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none">
      <path d="M7 5v14l12-7z"/>
    </svg>
  </button>
</div>
<script>
(() => {
  "use strict";

  // ── 状态 ──────────────────────────────────────────────
  const state = {
    running: true,
    t: 0,                    // 模拟时间（秒）
    lastTimestamp: null,
    cols: 90,
    rows: 54,
    canvas: null,
    ctx: null,
    dpr: 1,
    W: 0, H: 0,
    cellW: 0, cellH: 0,
    offsetX: 0, offsetY: 0,
    dotR: 0,
    // 预计算每列每行的归一化坐标，避免每帧重复
    colX: null,
    rowY: null,
  };

  // ── 确定性参数（固定种子，永不随机） ────────────────────
  // p, q 为相邻素数频率，控制斑点/条纹的空间尺度
  const P = 0.11;   // x 方向素数频率
  const Q = 0.13;   // y 方向素数频率（相邻素数 → 非整数比 → 无平移对称）
  // f, g, h 为不同速度的缓慢时间函数，使图案在斑点纹与条纹纹间过渡
  const F_SPD = 0.045;
  const G_SPD = 0.031;
  const H_SPD = 0.019;
  // 相位偏移让初始状态不是全亮或全暗
  const F_PH = 0.7;
  const G_PH = 1.9;
  const H_PH = 3.3;

  // ── 颜色（暖金 / 深蓝底噪） ────────────────────────────
  // 暖金亮色：高饱和度金，带轻微橙调
  const GOLD_R = 232, GOLD_G = 178, GOLD_B = 82;
  // 深蓝底噪：极暗的蓝紫
  const DEEP_R = 14, DEEP_G = 20, DEEP_B = 40;

  // ── 工具函数 ──────────────────────────────────────────
  function clamp(v, mn, mx) { return v < mn ? mn : v > mx ? mx : v; }
  function finite(v, fb) { return Number.isFinite(v) ? v : fb; }

  // ── pattern 函数：确定性伪反应扩散 ────────────────────
  // pattern(x, y, t) = sin(P·x + f(t))·sin(Q·y + g(t)) + sin((P·x + Q·y)/2 + h(t))
  // 返回值范围约 [-2, 2]，归一化到 [0, 1]
  function pattern(x, y, t) {
    const f = F_SPD * t + F_PH;
    const g = G_SPD * t + G_PH;
    const h = H_SPD * t + H_PH;
    const v = Math.sin(P * x + f) * Math.sin(Q * y + g)
            + Math.sin((P * x + Q * y) * 0.5 + h);
    // v ∈ [-2, 2]，映射到 [0, 1]
    return v * 0.25 + 0.5;
  }

  // ── 画布尺寸与点阵布局 ────────────────────────────────
  function resize() {
    const canvas = state.canvas;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    state.dpr = dpr;
    state.W = w;
    state.H = h;
    state.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 点阵铺满全屏，留出边距
    const margin = Math.min(w, h) * 0.04;
    const availW = w - margin * 2;
    const availH = h - margin * 2;
    state.cellW = availW / state.cols;
    state.cellH = availH / state.rows;
    // 取较小值保证圆点不重叠且为正圆
    const cell = Math.min(state.cellW, state.cellH);
    state.dotR = cell * 0.34;  // 圆点半径，留间隙
    // 居中偏移
    state.offsetX = (w - state.cellW * state.cols) * 0.5 + state.cellW * 0.5;
    state.offsetY = (h - state.cellH * state.rows) * 0.5 + state.cellH * 0.5;

    // 预计算归一化坐标（0..cols-1 映射到空间频率坐标）
    // 用列索引乘以一个空间步长，使 pattern 在点阵上有合理周期数
    const spaceStep = 1.0; // 每个点对应 1 单位空间坐标
    state.colX = new Float32Array(state.cols);
    state.rowY = new Float32Array(state.rows);
    for (let i = 0; i < state.cols; i++) state.colX[i] = i * spaceStep;
    for (let j = 0; j < state.rows; j++) state.rowY[j] = j * spaceStep;
  }

  // ── 渲染 ──────────────────────────────────────────────
  function render() {
    const ctx = state.ctx;
    const t = state.t;
    // 背景：深蓝黑，带极轻微的径向暗角增加深度感
    ctx.fillStyle = "#04060f";
    ctx.fillRect(0, 0, state.W, state.H);

    const cols = state.cols, rows = state.rows;
    const cw = state.cellW, ch = state.cellH;
    const ox = state.offsetX, oy = state.offsetY;
    const r = state.dotR;
    const colX = state.colX, rowY = state.rowY;

    // 预计算时间相位，避免在内层循环重复
    const f = F_SPD * t + F_PH;
    const g = G_SPD * t + G_PH;
    const h = H_SPD * t + H_PH;
    const halfPQ = (P + Q) * 0.5; // (P·x + Q·y)/2 的系数 = (P+Q)/2 · ... 不对
    // 注意：pattern 中是 (P·x + Q·y)/2，即 0.5·P·x + 0.5·Q·y
    const halfP = P * 0.5;
    const halfQ = Q * 0.5;

    // 双层绘制模拟发光（无 shadowBlur）：
    // 第一遍：粗半径低透明度（光晕）
    // 第二遍：细半径高透明度（核心）
    // 为性能，先画所有光晕，再画所有核心，减少状态切换

    // ---- 第一遍：光晕层 ----
    ctx.globalCompositeOperation = "lighter"; // 叠加发光感
    for (let j = 0; j < rows; j++) {
      const y = oy + j * ch;
      const qy = Q * rowY[j] + g;
      const hy = halfQ * rowY[j] + h;
      for (let i = 0; i < cols; i++) {
        const x = ox + i * cw;
        const px = colX[i];
        const v = Math.sin(P * px + f) * Math.sin(qy)
                + Math.sin(halfP * px + hy);
        // v ∈ [-2, 2] → norm [0, 1]
        const norm = v * 0.25 + 0.5;
        // 亮度阈值：高于 0.5 偏亮（暖金），低于则压暗
        // 用 smoothstep 平滑过渡
        const lum = smoothstep(0.35, 0.65, norm);
        if (lum < 0.02) continue; // 极暗的点跳过光晕
        // 光晕半径稍大，透明度低
        const haloR = r * (1.8 + lum * 0.6);
        const haloA = lum * 0.18;
        ctx.fillStyle = `rgba(${GOLD_R},${GOLD_G},${GOLD_B},${haloA})`;
        ctx.beginPath();
        ctx.arc(x, y, haloR, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ---- 第二遍：核心层 ----
    ctx.globalCompositeOperation = "source-over";
    for (let j = 0; j < rows; j++) {
      const y = oy + j * ch;
      const qy = Q * rowY[j] + g;
      const hy = halfQ * rowY[j] + h;
      for (let i = 0; i < cols; i++) {
        const x = ox + i * cw;
        const px = colX[i];
        const v = Math.sin(P * px + f) * Math.sin(qy)
                + Math.sin(halfP * px + hy);
        const norm = v * 0.25 + 0.5;
        const lum = smoothstep(0.35, 0.65, norm);

        // 颜色混合：深蓝底噪 → 暖金
        const cr = Math.round(DEEP_R + (GOLD_R - DEEP_R) * lum);
        const cg = Math.round(DEEP_G + (GOLD_G - DEEP_G) * lum);
        const cb = Math.round(DEEP_B + (GOLD_B - DEEP_B) * lum);
        // 透明度：暗点也保留微弱可见度，亮点更实
        const alpha = 0.35 + lum * 0.6;
        // 核心半径：亮点稍大，暗点稍小，制造呼吸感
        const coreR = r * (0.7 + lum * 0.5);

        ctx.fillStyle = `rgba(${cr},${cg},${cb},${alpha})`;
        ctx.beginPath();
        ctx.arc(x, y, coreR, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 极轻微的暗角，增加壁纸级沉浸感（不遮挡主画面）
    const grad = ctx.createRadialGradient(
      state.W * 0.5, state.H * 0.5, Math.min(state.W, state.H) * 0.3,
      state.W * 0.5, state.H * 0.5, Math.max(state.W, state.H) * 0.75
    );
    grad.addColorStop(0, "rgba(0,0,0,0)");
    grad.addColorStop(1, "rgba(0,0,0,0.35)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, state.W, state.H);
  }

  // smoothstep 平滑过渡，避免硬阈值闪烁
  function smoothstep(edge0, edge1, x) {
    const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
    return t * t * (3 - 2 * t);
  }

  // ── 更新 ──────────────────────────────────────────────
  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05);
    state.t += boundedDt;
  }

  // ── 帧循环 ────────────────────────────────────────────
  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    let dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    // 钳制长间隔（标签页挂起后恢复）
    dt = clamp(dt, 0, 0.05);
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // ── 生命周期 ──────────────────────────────────────────
  function init() {
    state.canvas = document.getElementById("stage");
    state.ctx = state.canvas.getContext("2d", { alpha: false });
    resize();
    window.addEventListener("resize", resize);
    bindControls();
    requestAnimationFrame(frame);
  }

  function start() {
    state.running = true;
    state.lastTimestamp = null;
    document.getElementById("iconPause").style.display = "";
    document.getElementById("iconPlay").style.display = "none";
    document.getElementById("playBtn").setAttribute("aria-label", "暂停");
    document.getElementById("playBtn").setAttribute("aria-pressed", "false");
    document.getElementById("status").textContent = "运行中";
  }

  function pause() {
    state.running = false;
    document.getElementById("iconPause").style.display = "none";
    document.getElementById("iconPlay").style.display = "";
    document.getElementById("playBtn").setAttribute("aria-label", "播放");
    document.getElementById("playBtn").setAttribute("aria-pressed", "true");
    document.getElementById("status").textContent = "已暂停";
  }

  function reset() {
    state.t = 0;
    state.lastTimestamp = null;
    render();
  }

  function bindControls() {
    const btn = document.getElementById("playBtn");
    btn.addEventListener("click", () => {
      if (state.running) pause(); else start();
    });
    // 键盘空格切换
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && document.activeElement === document.body) {
        e.preventDefault();
        if (state.running) pause(); else start();
      }
    });
  }

  function setParameters(values) {
    // 当前无外部参数可调，保留接口
    void values;
  }

  function getState() {
    return { running: state.running, t: state.t, cols: state.cols, rows: state.rows };
  }

  function getReadouts() {
    return { t: state.t, pattern: "sin(Px+f)sin(Qy+g)+sin((Px+Qy)/2+h)" };
  }

  // ── 模型检查（确定性 pattern 函数的数学验证） ──────────
  function runModelChecks() {
    // 1. pattern 值域检查：应在 [-2, 2] 内
    let minV = Infinity, maxV = -Infinity;
    for (let i = 0; i < 2000; i++) {
      const x = Math.random() * 100;
      const y = Math.random() * 100;
      const t = Math.random() * 1000;
      const v = Math.sin(P * x + F_SPD * t + F_PH) * Math.sin(Q * y + G_SPD * t + G_PH)
              + Math.sin(halfP_calc(x) + H_SPD * t + H_PH);
      if (v < minV) minV = v;
      if (v > maxV) maxV = v;
    }
    function halfP_calc(x) { return P * 0.5 * x + Q * 0.5 * 0; }

    // 2. 确定性检查：相同输入相同输出
    const v1 = pattern(5.5, 3.2, 1.0);
    const v2 = pattern(5.5, 3.2, 1.0);
    const deterministic = v1 === v2;

    // 3. 时间变化检查：不同时间应产生不同值（非静态）
    const v3 = pattern(5.5, 3.2, 0);
    const v4 = pattern(5.5, 3.2, 10);
    const timeVaries = v3 !== v4;

    // 4. 无平移对称检查：P/Q 为相邻素数比，不应有简单周期
    // 检查 pattern(0,0,t) 不恒等于 pattern(1,0,t)
    const v5 = pattern(0, 0, 0);
    const v6 = pattern(1, 0, 0);
    const noSimplePeriod = v5 !== v6;

    // 5. 归一化值域 [0,1]
    const norm = pattern(10, 10, 5);
    const normValid = norm >= 0 && norm <= 1;

    return [
      { name: "pattern 值域有界", pass: minV >= -2.01 && maxV <= 2.01, expected: "[-2, 2]", actual: `[${minV.toFixed(3)}, ${maxV.toFixed(3)}]`, tolerance: 0.01 },
      { name: "确定性：相同输入相同输出", pass: deterministic, expected: v1, actual: v2, tolerance: "strict" },
      { name: "时间演化非静态", pass: timeVaries, expected: "v(t=0) ≠ v(t=10)", actual: `${v3.toFixed(3)} ≠ ${v4.toFixed(3)}`, tolerance: "strict" },
      { name: "无简单平移对称", pass: noSimplePeriod, expected: "v(0,0) ≠ v(1,0)", actual: `${v5.toFixed(3)} ≠ ${v6.toFixed(3)}`, tolerance: "strict" },
      { name: "归一化值域 [0,1]", pass: normValid, expected: "[0, 1]", actual: norm.toFixed(3), tolerance: 0.001 },
    ];
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
