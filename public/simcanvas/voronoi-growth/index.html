<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>状态响应仿真</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #eef3f8;
      --sim-surface: #ffffff;
      --sim-surface-soft: #f8fafc;
      --sim-text: #172033;
      --sim-muted: #657188;
      --sim-border: #dfe6ef;
      --sim-grid: #e8edf4;
      --sim-accent: #0f9fba;
      --sim-accent-deep: #08758a;
      --sim-accent-soft: #d9f4f7;
      --sim-positive: #0f9fba;
      --sim-warning: #f59e0b;
      --sim-danger: #dc2626;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
        var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
    .status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 12px; }
    .app[data-layout="visualization-first"] .main { grid-template-columns: minmax(0, 2.15fr) minmax(280px, 0.55fr); }
    .app[data-layout="comparison"] .main { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .app[data-layout="experiment"] .main { grid-template-columns: minmax(0, 1.55fr) minmax(320px, 0.85fr); }
    .panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
    #scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); }
    .side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
    .readouts, .model-note { padding: 17px; }
    .readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric { padding: 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
    .metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
    .metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .model-note { display: grid; align-content: start; gap: 14px; }
    .model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
    .insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; }
    .controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr) minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
    button:hover { border-color: #c7d2e2; background: #eef3f9; }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
    .control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
    .grid-line { stroke: var(--sim-grid); stroke-width: 1; }
    .axis { stroke: #9aa7ba; stroke-width: 1.5; }
    #trace { fill: none; stroke: var(--sim-accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 3px 4px rgba(15,159,186,.18)); }
    #markerHalo { fill: rgba(15,159,186,.14); }
    #marker { fill: var(--sim-positive); stroke: white; stroke-width: 3; }
    #targetLine { stroke: var(--sim-warning); stroke-width: 2.5; stroke-dasharray: 7 7; }
    #targetText { fill: #a35d00; font-size: 12px; font-weight: 750; }
    .axis-label { fill: var(--sim-muted); font-size: 12px; }
    @media (max-width: 860px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main, .app[data-layout] .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
      .scene-panel { min-height: 0; }
      #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <!-- SimCanvas stable shell: preserve data-region structure unless the confirmed wireframe changes it. -->
  <div class="app" data-layout="scene-first" data-model-tier="analytic">
    <header class="header" data-region="header">
      <div>
        <h1>状态响应仿真</h1>
        <p>调整目标值与响应速率，观察状态如何随时间演化。</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head"><h2 id="scene-title">状态响应曲线</h2><span>状态 x 随仿真时间变化</span></div>
        <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
          <desc id="scene-desc">显示当前状态逼近所选目标的曲线图。</desc>
          <defs>
            <linearGradient id="traceGlow" x1="0" x2="1"><stop stop-color="#0f9fba"></stop><stop offset="1" stop-color="#08758a"></stop></linearGradient>
          </defs>
          <g id="grid"></g>
          <line class="axis" x1="58" y1="360" x2="724" y2="360"></line>
          <line class="axis" x1="58" y1="30" x2="58" y2="360"></line>
          <text class="axis-label" x="700" y="389">时间</text>
          <text class="axis-label" x="18" y="35">状态</text>
          <line id="targetLine" x1="58" y1="96" x2="724" y2="96"></line>
          <text id="targetText" x="716" y="87" text-anchor="end">目标 8.0</text>
          <polyline id="trace" points="" stroke="url(#traceGlow)"></polyline>
          <circle id="markerHalo" cx="58" cy="360" r="15"></circle>
          <circle id="marker" cx="58" cy="360" r="7"></circle>
        </svg>
      </section>

      <aside class="side" data-region="evidence">
        <section class="panel readouts" aria-label="实时数值">
          <div class="readout-grid">
            <div class="metric"><small>状态 x</small><strong id="stateReadout">0.00</strong></div>
            <div class="metric"><small>时间</small><strong id="timeReadout">0.00 s</strong></div>
          </div>
        </section>
        <section class="panel model-note" data-region="insight">
          <div class="panel-head"><h2>模型说明</h2></div>
          <p id="insight" class="insight">按下开始。状态离目标越远，变化越快。</p>
          <p>教学视图：dx/dt = rate × (target - x)。目标线与轨迹使不断缩小的差距可见。</p>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="仿真控制">
      <div class="actions">
        <button id="startBtn" class="primary" type="button">开始</button>
        <button id="pauseBtn" type="button">暂停</button>
        <button id="resetBtn" type="button">重置</button>
      </div>
      <div class="control">
        <label for="targetInput">目标 <output id="targetOutput">8.0</output></label>
        <input id="targetInput" type="range" min="1" max="10" step="0.5" value="8">
      </div>
      <div class="control">
        <label for="rateInput">响应速率 <output id="rateOutput">0.8 s⁻¹</output></label>
        <input id="rateInput" type="range" min="0.1" max="2" step="0.1" value="0.8">
      </div>
    </section>
  </div>

  <script>
  "use strict";

  // 顶层声明，使 window.simulation 赋值在静态分析中可识别
  window.simulation = {
    init: init,
    start: start,
    pause: pause,
    reset: reset,
    update: update,
    render: render,
    setParameters: setParameters,
    getState: getState,
    getReadouts: getReadouts,
    runModelChecks: runModelChecks
  };

  var parameterSchema = [
    { key: "target", label: "目标", type: "slider", min: 1, max: 10, step: 0.5, default: 8, unit: "" },
    { key: "rate", label: "响应速率", type: "slider", min: 0.1, max: 2, step: 0.1, default: 0.8, unit: "s⁻¹" }
  ];

  var state = { running: false, t: 0, x: 0, target: 8, rate: 0.8, lastTimestamp: null, history: [{ t: 0, x: 0 }] };

  var elements = {
    status: document.querySelector("#status"),
    trace: document.querySelector("#trace"),
    marker: document.querySelector("#marker"),
    markerHalo: document.querySelector("#markerHalo"),
    targetLine: document.querySelector("#targetLine"),
    targetText: document.querySelector("#targetText"),
    insight: document.querySelector("#insight"),
    grid: document.querySelector("#grid"),
    stateReadout: document.querySelector("#stateReadout"),
    timeReadout: document.querySelector("#timeReadout"),
    targetInput: document.querySelector("#targetInput"),
    targetOutput: document.querySelector("#targetOutput"),
    rateInput: document.querySelector("#rateInput"),
    rateOutput: document.querySelector("#rateOutput"),
    startBtn: document.querySelector("#startBtn"),
    pauseBtn: document.querySelector("#pauseBtn"),
    resetBtn: document.querySelector("#resetBtn")
  };

  function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
  function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

  function initGrid() {
    var lines = [];
    for (var i = 0; i <= 10; i += 1) {
      var x = 58 + i * 66.6;
      var y = 360 - i * 33;
      lines.push('<line class="grid-line" x1="' + x + '" y1="30" x2="' + x + '" y2="360"></line>');
      lines.push('<line class="grid-line" x1="58" y1="' + y + '" x2="724" y2="' + y + '"></line>');
    }
    elements.grid.innerHTML = lines.join("");
  }

  function init() {
    initGrid();
    bindControls();
    setParameters({ target: 8, rate: 0.8 });
    reset();
    requestAnimationFrame(frame);
  }

  function start() {
    state.running = true;
    elements.status.textContent = "运行中";
    elements.startBtn.setAttribute("aria-pressed", "true");
  }

  function pause() {
    state.running = false;
    elements.status.textContent = "已暂停";
    elements.startBtn.setAttribute("aria-pressed", "false");
  }

  function reset() {
    pause();
    state.t = 0;
    state.x = 0;
    state.lastTimestamp = null;
    state.history = [{ t: 0, x: 0 }];
    render();
  }

  function update(dt) {
    if (!state.running) return;
    var boundedDt = clamp(finite(dt, 0), 0, 0.05);
    state.x += state.rate * (state.target - state.x) * boundedDt;
    state.x = finite(state.x, 0);
    state.t += boundedDt;
    if (state.history.length === 0 || state.t - state.history[state.history.length - 1].t >= 0.04) {
      state.history.push({ t: state.t, x: state.x });
      if (state.history.length > 500) state.history.shift();
    }
  }

  function render() {
    var maxTime = Math.max(10, state.t);
    var maxState = 10;
    var point = function(sample) {
      return (58 + (sample.t / maxTime) * 666) + "," + (360 - (sample.x / maxState) * 330);
    };
    elements.trace.setAttribute("points", state.history.map(point).join(" "));
    var current = point({ t: state.t, x: state.x }).split(",");
    elements.marker.setAttribute("cx", current[0]);
    elements.marker.setAttribute("cy", current[1]);
    elements.markerHalo.setAttribute("cx", current[0]);
    elements.markerHalo.setAttribute("cy", current[1]);
    var targetY = 360 - (state.target / maxState) * 330;
    elements.targetLine.setAttribute("y1", targetY);
    elements.targetLine.setAttribute("y2", targetY);
    elements.targetText.setAttribute("y", Math.max(42, targetY - 9));
    elements.targetText.textContent = "目标 " + state.target.toFixed(1);
    var delta = state.target - state.x;
    var gap = Math.abs(delta);
    elements.insight.textContent = !state.running && state.t === 0
      ? "按下开始。状态离目标越远，变化越快。"
      : gap > 3
        ? "远离目标：轨迹" + (delta >= 0 ? "上升" : "下降") + "迅速，因为差距很大。"
        : gap > 0.45
          ? "更近了：差距缩小，轨迹" + (delta >= 0 ? "上升" : "下降") + "变慢。"
          : "接近平衡：状态趋近目标但不越过。";
    elements.stateReadout.textContent = state.x.toFixed(2);
    elements.timeReadout.textContent = state.t.toFixed(2) + " s";
    elements.targetOutput.textContent = state.target.toFixed(1);
    elements.rateOutput.textContent = state.rate.toFixed(1) + " s⁻¹";
  }

  function setParameters(values) {
    var targetDef = parameterSchema[0];
    var rateDef = parameterSchema[1];
    state.target = clamp(finite(Number(values.target), targetDef.default), targetDef.min, targetDef.max);
    state.rate = clamp(finite(Number(values.rate), rateDef.default), rateDef.min, rateDef.max);
    elements.targetInput.value = String(state.target);
    elements.rateInput.value = String(state.rate);
    render();
  }

  function getState() {
    return {
      running: state.running,
      t: state.t,
      x: state.x,
      target: state.target,
      rate: state.rate,
      lastTimestamp: state.lastTimestamp,
      history: state.history.map(function(sample) { return { t: sample.t, x: sample.x }; })
    };
  }

  function getReadouts() {
    return { state: state.x, time: state.t, target: state.target, rate: state.rate };
  }

  function runModelChecks() {
    var simulate = function(dt, duration, opts) {
      opts = opts || {};
      var x0 = opts.x0 !== undefined ? opts.x0 : 0;
      var target = opts.target !== undefined ? opts.target : 8;
      var rate = opts.rate !== undefined ? opts.rate : 0.8;
      var x = x0;
      for (var t = 0; t < duration - 1e-12; t += dt) {
        x += rate * (target - x) * dt;
      }
      return x;
    };
    var exact = 8 * (1 - Math.exp(-0.8 * 2));
    var coarseError = Math.abs(simulate(1 / 60, 2) - exact);
    var fineError = Math.abs(simulate(1 / 240, 2) - exact);
    var decreasingActual = simulate(1 / 240, 2, { x0: 8, target: 2 });
    var decreasingExact = 2 + 6 * Math.exp(-0.8 * 2);
    var slowRate = simulate(1 / 240, 2, { rate: 0.4 });
    var fastRate = simulate(1 / 240, 2, { rate: 1.2 });
    return [
      { name: "有限解析参考", pass: Number.isFinite(fineError), expected: "有限误差", actual: fineError, tolerance: "finite" },
      { name: "步长减半收敛", pass: fineError < coarseError, expected: "细误差 < 粗误差", actual: fineError + " < " + coarseError, tolerance: "strict" },
      { name: "两秒参考值", pass: fineError < 0.015, expected: exact, actual: simulate(1 / 240, 2), tolerance: 0.015 },
      { name: "反向递减情形", pass: Math.abs(decreasingActual - decreasingExact) < 0.015, expected: decreasingExact, actual: decreasingActual, tolerance: 0.015 },
      { name: "速率敏感性", pass: fastRate > slowRate, expected: "更高速率更快趋近目标", actual: fastRate + " > " + slowRate, tolerance: "strict" },
      { name: "零差距边界", pass: simulate(1 / 240, 2, { x0: 0, target: 0 }) === 0, expected: 0, actual: simulate(1 / 240, 2, { x0: 0, target: 0 }), tolerance: 0 }
    ];
  }

  function bindControls() {
    elements.startBtn.addEventListener("click", start);
    elements.pauseBtn.addEventListener("click", pause);
    elements.resetBtn.addEventListener("click", reset);
    elements.targetInput.addEventListener("input", function() {
      setParameters({ target: elements.targetInput.value, rate: state.rate });
    });
    elements.rateInput.addEventListener("input", function() {
      setParameters({ target: state.target, rate: elements.rateInput.value });
    });
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    var dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  init();
  </script>
</body>
</html>
