<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数学的表白 · 心形线</title>
<style>
:root{
  color-scheme:dark;
  --sim-bg:#04060c;
  --sim-surface:#0a0f1a;
  --sim-surface-soft:#0e1422;
  --sim-text:#e8eefc;
  --sim-muted:#7a8aa3;
  --sim-border:#1a2236;
  --sim-grid:rgba(120,150,200,.06);
  --sim-accent:#ff5a5a;
  --sim-accent-deep:#c8323a;
  --sim-accent-soft:rgba(255,90,90,.16);
  --sim-positive:#ff5a5a;
  --sim-warning:#f0a040;
  --sim-danger:#dc2626;
  --sim-radius-sm:10px;
  --sim-radius-md:16px;
  --sim-radius-lg:22px;
  --sim-shadow:0 14px 36px rgba(0,0,0,.5);
  --sim-space-1:4px;--sim-space-2:8px;--sim-space-3:12px;
  --sim-space-4:16px;--sim-space-5:24px;--sim-space-6:32px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(circle at 50% 42%,rgba(40,18,28,.55),transparent 55%),
    radial-gradient(circle at 18% 88%,rgba(20,30,60,.4),transparent 50%),
    radial-gradient(circle at 82% 12%,rgba(30,20,50,.35),transparent 48%),
    var(--sim-bg);
  color:var(--sim-text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid rgba(255,90,90,.55);outline-offset:2px}

.app{
  width:100%;height:100dvh;height:100vh;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  gap:0;padding:0;
}

/* ===== Header ===== */
.header{
  padding:22px 28px 6px;text-align:center;
  opacity:0;animation:fadeUp .9s ease .15s forwards;
}
.header h1{
  margin:0;font-size:clamp(1.5rem,2.6vw,2rem);
  font-weight:300;letter-spacing:.18em;
  background:linear-gradient(90deg,#ffd0d0,#ff7a7a 50%,#ffd0d0);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.header p{margin:6px 0 0;font-size:.78rem;letter-spacing:.32em;color:var(--sim-muted);text-transform:uppercase}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== Stage ===== */
.stage{
  position:relative;min-height:0;overflow:hidden;
}
#scene{display:block;width:100%;height:100%}

/* ===== Evidence / Insight ===== */
.evidence-insight{
  position:absolute;left:18px;bottom:18px;
  display:flex;flex-direction:column;gap:10px;
  max-width:300px;pointer-events:none;z-index:5;
}
.evidence{
  background:rgba(10,15,26,.72);
  border:1px solid rgba(255,90,90,.18);
  border-radius:var(--sim-radius-md);
  padding:12px 14px;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;
  pointer-events:auto;
}
.evidence .metric small{display:block;color:var(--sim-muted);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px}
.evidence .metric strong{font-size:1.05rem;font-variant-numeric:tabular-nums;font-weight:500}
.insight{
  background:rgba(10,15,26,.72);
  border:1px solid rgba(255,90,90,.18);
  border-left:3px solid var(--sim-accent);
  border-radius:0 var(--sim-radius-md) var(--sim-radius-md) 0;
  padding:11px 14px;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  font-size:.82rem;line-height:1.5;color:#ffd8d8;
  pointer-events:auto;
}

/* ===== Controls ===== */
.controls{
  padding:14px 22px 22px;
  display:flex;align-items:center;justify-content:center;
  gap:22px;flex-wrap:wrap;
  opacity:0;animation:fadeUp .9s ease 1.9s forwards;
}
.ctrl-group{display:flex;align-items:center;gap:12px;min-width:260px}
.ctrl-group label{
  font-size:.72rem;letter-spacing:.16em;color:var(--sim-muted);
  text-transform:uppercase;white-space:nowrap;
}
.ctrl-group output{
  font-variant-numeric:tabular-nums;font-size:.95rem;
  color:var(--sim-text);min-width:42px;text-align:right;font-weight:500;
}
input[type="range"]{
  -webkit-appearance:none;appearance:none;
  flex:1;height:4px;border-radius:2px;
  background:linear-gradient(90deg,var(--sim-accent-deep),var(--sim-accent));
  outline:none;cursor:pointer;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:#fff;border:2px solid var(--sim-accent);
  box-shadow:0 0 0 4px rgba(255,90,90,.18);transition:transform .15s;
}
input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.18)}
input[type="range"]::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;background:#fff;
  border:2px solid var(--sim-accent);box-shadow:0 0 0 4px rgba(255,90,90,.18);
}
button{
  border:1px solid rgba(255,90,90,.32);
  background:rgba(255,90,90,.08);color:var(--sim-text);
  padding:9px 18px;border-radius:999px;font-size:.82rem;
  letter-spacing:.1em;cursor:pointer;font-weight:500;
  transition:background .18s,border-color .18s,transform .12s;
}
button:hover{background:rgba(255,90,90,.18);border-color:rgba(255,90,90,.55)}
button:active{transform:scale(.96)}
button.primary{
  background:linear-gradient(135deg,var(--sim-accent-deep),var(--sim-accent));
  border-color:var(--sim-accent);color:#fff;
}

@media (max-width:640px){
  .header{padding:14px 14px 4px}
  .header h1{letter-spacing:.1em}
  .header p{letter-spacing:.18em;font-size:.66rem}
  .controls{padding:10px 14px 16px;gap:14px}
  .ctrl-group{min-width:0;flex:1 1 100%;justify-content:space-between}
  .evidence-insight{left:10px;bottom:10px;max-width:200px}
  .evidence{padding:8px 10px;gap:6px 10px}
  .evidence .metric strong{font-size:.9rem}
  .insight{font-size:.72rem;padding:8px 10px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-delay:0s !important}
}
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <h1>数学的表白 · 心形线</h1>
    <p>r = 1 − a · sin θ</p>
  </header>

  <section class="stage" data-region="stage">
    <canvas id="scene" aria-label="心形线极坐标动画"></canvas>
    <aside class="evidence-insight">
      <div class="evidence" data-region="evidence" aria-label="实时数据">
        <div class="metric"><small>参数 a</small><strong id="aReadout">1.00</strong></div>
        <div class="metric"><small>朝向</small><strong id="orientReadout">sin</strong></div>
        <div class="metric"><small>描线进度</small><strong id="progressReadout">0%</strong></div>
        <div class="metric"><small>状态</small><strong id="phaseReadout">描线中</strong></div>
      </div>
      <div class="insight" data-region="insight" id="insightText">参数 a 控制心形凹陷深度：a=0 为正圆，a 越大心形越尖锐。</div>
    </aside>
  </section>

  <section class="controls" data-region="controls" aria-label="参数控制">
    <div class="ctrl-group">
      <label for="aInput">a</label>
      <input id="aInput" type="range" min="0" max="2" step="0.01" value="1">
      <output id="aOutput">1.00</output>
    </div>
    <button id="startBtn" class="primary" type="button">开始</button>
    <button id="pauseBtn" type="button">暂停</button>
    <button id="resetBtn" type="button">重置</button>
    <button id="orientBtn" type="button">切换朝向</button>
    <button id="redrawBtn" type="button">重绘</button>
  </section>
</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const aInput = document.getElementById('aInput');
const aOutput = document.getElementById('aOutput');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');
const orientBtn = document.getElementById('orientBtn');
const redrawBtn = document.getElementById('redrawBtn');
const statusEl = document.querySelector('.header p');
const aReadout = document.getElementById('aReadout');
const orientReadout = document.getElementById('orientReadout');
const progressReadout = document.getElementById('progressReadout');
const phaseReadout = document.getElementById('phaseReadout');
const insightText = document.getElementById('insightText');

// ---- 确定性伪随机（固定种子）----
function makeRng(seed){
  let s = seed >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

// ---- 状态 ----
const state = {
  a: 1,                 // 参数 a
  orient: 'sin',        // 'sin' 或 'cos'
  t: 0,                 // 累计时间（秒）
  drawT: 0,             // 当前描线进度 [0,1]，一周为 1
  drawing: true,        // 是否在描线
  running: true,        // 是否运行
  holdT: 0,             // 描完后的定格时长
  particles: [],        // 粒子拖尾
  lastTs: null,
  introT: 0,            // 开场静态帧计时
  rng: makeRng(20240214),
  W: 0, H: 0, cx: 0, cy: 0, scale: 1,
  dpr: 1,
};

// ---- 极坐标半径函数 ----
function rOf(theta, a, orient){
  return orient === 'sin' ? (1 - a * Math.sin(theta)) : (1 - a * Math.cos(theta));
}

// ---- 极坐标转屏幕坐标 ----
function toScreen(theta, a, orient){
  const r = rOf(theta, a, orient);
  const mx = r * Math.cos(theta);
  const my = r * Math.sin(theta);
  return {
    x: state.cx + mx * state.scale,
    y: state.cy - my * state.scale
  };
}

// ---- 缓动 ----
function easeInOut(t){ return t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2; }
function clamp(v,a,b){ return Math.min(b, Math.max(a, v)); }

// ---- 尺寸 ----
function resize(){
  const rect = canvas.parentElement.getBoundingClientRect();
  state.dpr = Math.min(window.devicePixelRatio || 1, 2);
  state.W = rect.width;
  state.H = rect.height;
  canvas.width = Math.max(1, Math.floor(state.W * state.dpr));
  canvas.height = Math.max(1, Math.floor(state.H * state.dpr));
  canvas.style.width = state.W + 'px';
  canvas.style.height = state.H + 'px';
  ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
  state.cx = state.W / 2;
  state.cy = state.H / 2 + Math.min(state.W, state.H) * 0.05;
  const maxR = 1 + state.a;
  const fit = Math.min(state.W, state.H) * 0.34;
  state.scale = fit / Math.max(maxR, 0.5);
}

// ---- 粒子 ----
function spawnParticle(x, y){
  const ang = state.rng() * Math.PI * 2;
  const sp = 0.3 + state.rng() * 1.2;
  state.particles.push({
    x, y,
    vx: Math.cos(ang) * sp,
    vy: Math.sin(ang) * sp - 0.2,
    life: 1,
    decay: 0.012 + state.rng() * 0.02,
    size: 1 + state.rng() * 1.8,
  });
}
function updateParticles(dt){
  for(let i=state.particles.length-1;i>=0;i--){
    const p = state.particles[i];
    p.x += p.vx * dt * 60;
    p.y += p.vy * dt * 60;
    p.vy += 0.02 * dt * 60;
    p.life -= p.decay * dt * 60;
    if(p.life <= 0) state.particles.splice(i,1);
  }
}

// ---- 背景绘制 ----
function drawBackground(){
  ctx.save();
  ctx.strokeStyle = 'rgba(120,150,200,.05)';
  ctx.lineWidth = 1;
  const step = 48;
  ctx.beginPath();
  for(let x = (state.cx % step); x < state.W; x += step){
    ctx.moveTo(x, 0); ctx.lineTo(x, state.H);
  }
  for(let y = (state.cy % step); y < state.H; y += step){
    ctx.moveTo(0, y); ctx.lineTo(state.W, y);
  }
  ctx.stroke();
  const g = ctx.createRadialGradient(state.cx, state.cy, 0, state.cx, state.cy, Math.min(state.W,state.H)*0.5);
  g.addColorStop(0, 'rgba(255,80,80,0.05)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,state.W,state.H);
  ctx.restore();
}

// ---- 绘制心形曲线 ----
function drawCurve(progress, glow){
  const a = state.a;
  const orient = state.orient;
  const steps = 600;
  const endTheta = progress * Math.PI * 2;

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.beginPath();
  for(let i=0;i<=steps;i++){
    const th = (i/steps) * endTheta;
    const p = toScreen(th, a, orient);
    if(i===0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = `rgba(255,70,70,${glow ? 0.22 : 0.14})`;
  ctx.lineWidth = glow ? 16 : 10;
  ctx.stroke();

  ctx.strokeStyle = `rgba(255,110,110,${glow ? 0.35 : 0.22})`;
  ctx.lineWidth = glow ? 8 : 5;
  ctx.stroke();

  ctx.strokeStyle = glow ? '#ff8a8a' : '#ff5a5a';
  ctx.lineWidth = glow ? 2.2 : 1.8;
  ctx.stroke();

  if(glow){
    ctx.strokeStyle = `rgba(255,140,140,${0.18 + 0.12*Math.sin(state.t*2)})`;
    ctx.lineWidth = 22;
    ctx.stroke();
  }
  ctx.restore();
}

// ---- 绘制光点 ----
function drawDot(x, y, intensity){
  ctx.save();
  const g1 = ctx.createRadialGradient(x, y, 0, x, y, 22);
  g1.addColorStop(0, `rgba(255,140,140,${0.55*intensity})`);
  g1.addColorStop(0.4, `rgba(255,80,80,${0.28*intensity})`);
  g1.addColorStop(1, 'rgba(255,40,40,0)');
  ctx.fillStyle = g1;
  ctx.beginPath(); ctx.arc(x, y, 22, 0, Math.PI*2); ctx.fill();

  const g2 = ctx.createRadialGradient(x, y, 0, x, y, 6);
  g2.addColorStop(0, '#ffffff');
  g2.addColorStop(0.5, '#ffd0d0');
  g2.addColorStop(1, '#ff5a5a');
  ctx.fillStyle = g2;
  ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// ---- 绘制粒子 ----
function drawParticles(){
  ctx.save();
  for(const p of state.particles){
    const alpha = clamp(p.life, 0, 1);
    ctx.fillStyle = `rgba(255,${120+Math.floor(40*p.life)},${120+Math.floor(40*p.life)},${alpha*0.7})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

// ---- 绘制公式 ----
function drawFormula(alpha){
  if(alpha <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  const txt = state.orient === 'sin' ? 'r = 1 − a · sin θ' : 'r = 1 − a · cos θ';
  ctx.font = `300 ${clamp(state.W*0.03, 18, 30)}px ui-sans-serif,system-ui,sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const fx = state.cx;
  const fy = state.cy - state.scale * 0.15;
  ctx.fillStyle = 'rgba(255,90,90,0.25)';
  ctx.fillText(txt, fx+1, fy+1);
  ctx.fillStyle = '#ffe0e0';
  ctx.fillText(txt, fx, fy);
  ctx.restore();
}

// ---- 绘制结尾字幕 ----
function drawEnding(alpha){
  if(alpha <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  const txt = '数学不说话，但它会画心';
  ctx.font = `300 ${clamp(state.W*0.022, 14, 20)}px ui-sans-serif,system-ui,sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(200,210,230,0.9)';
  ctx.fillText(txt, state.cx, state.cy + state.scale * 1.35);
  ctx.restore();
}

// ---- 主更新 ----
function update(dt){
  if(!state.running) return;
  state.t += dt;
  state.introT += dt;

  if(state.drawing){
    const drawDuration = 6;
    state.drawT += dt / drawDuration;
    if(state.drawT >= 1){
      state.drawT = 1;
      state.drawing = false;
      state.holdT = 0;
    }
    if(state.drawT > 0 && state.drawT < 1){
      const th = easeInOut(state.drawT) * Math.PI * 2;
      const p = toScreen(th, state.a, state.orient);
      spawnParticle(p.x, p.y);
      if(state.rng() < 0.5) spawnParticle(p.x, p.y);
    }
  } else {
    state.holdT += dt;
    if(state.rng() < 0.08){
      const th = state.rng() * Math.PI * 2;
      const p = toScreen(th, state.a, state.orient);
      spawnParticle(p.x, p.y);
    }
    if(state.holdT > 5){
      state.drawing = true;
      state.drawT = 0;
      state.holdT = 0;
      state.particles.length = 0;
    }
  }
  updateParticles(dt);
}

// ---- 主渲染 ----
function render(){
  ctx.clearRect(0,0,state.W,state.H);
  drawBackground();

  const drawProgress = state.drawing ? easeInOut(state.drawT) : 1;
  const isGlowing = !state.drawing;

  drawCurve(drawProgress, isGlowing);
  drawParticles();

  if(state.drawing && state.drawT > 0){
    const th = drawProgress * Math.PI * 2;
    const p = toScreen(th, state.a, state.orient);
    drawDot(p.x, p.y, 1);
  } else if(!state.drawing){
    const fade = clamp(1 - state.holdT / 1.2, 0, 1);
    if(fade > 0){
      const th = Math.PI * 2;
      const p = toScreen(th, state.a, state.orient);
      drawDot(p.x, p.y, fade * 0.6);
    }
  }

  let formulaAlpha = 0;
  if(!state.drawing){
    formulaAlpha = clamp((state.holdT - 0.4) / 1.0, 0, 1);
  }
  drawFormula(formulaAlpha);

  let endAlpha = 0;
  if(!state.drawing){
    endAlpha = clamp((state.holdT - 1.2) / 1.2, 0, 1);
  }
  drawEnding(endAlpha);

  // 更新读数
  aReadout.textContent = state.a.toFixed(2);
  orientReadout.textContent = state.orient;
  progressReadout.textContent = Math.round(drawProgress * 100) + '%';
  phaseReadout.textContent = state.running ? (state.drawing ? '描线中' : '定格中') : '已暂停';

  // 更新洞察
  if(state.a < 0.05){
    insightText.textContent = 'a=0：r 恒为 1，曲线退化为正圆。';
  } else if(state.a < 0.5){
    insightText.textContent = 'a 较小：心形凹陷浅，接近圆。';
  } else if(state.a <= 1.2){
    insightText.textContent = 'a≈1：经典心形线，θ=π/2 处 r=0 形成凹口。';
  } else {
    insightText.textContent = 'a 较大：心形更尖锐，尖端更深。';
  }
}

// ---- 帧循环 ----
function frame(ts){
  if(state.lastTs === null) state.lastTs = ts;
  let dt = (ts - state.lastTs) / 1000;
  state.lastTs = ts;
  dt = clamp(dt, 0, 0.05);
  update(dt);
  render();
  requestAnimationFrame(frame);
}

// ---- 生命周期 ----
function init(){
  resize();
  setParameters({ a: 1, orient: 'sin' });
  reset();
  requestAnimationFrame(frame);
}
function start(){
  state.running = true;
  startBtn.setAttribute('aria-pressed', 'true');
  pauseBtn.setAttribute('aria-pressed', 'false');
}
function pause(){
  state.running = false;
  startBtn.setAttribute('aria-pressed', 'false');
  pauseBtn.setAttribute('aria-pressed', 'true');
}
function reset(){
  pause();
  state.t = 0;
  state.drawT = 0;
  state.drawing = true;
  state.holdT = 0;
  state.introT = 0;
  state.particles.length = 0;
  state.lastTs = null;
  state.rng = makeRng(20240214);
  render();
}

// ---- 控件 ----
function setParameters(values){
  if(values.a !== undefined){
    state.a = clamp(Number(values.a) || 0, 0, 2);
    aInput.value = String(state.a);
    aOutput.textContent = state.a.toFixed(2);
  }
  if(values.orient !== undefined){
    state.orient = values.orient;
    statusEl.textContent = values.orient === 'sin' ? 'r = 1 − a · sin θ' : 'r = 1 − a · cos θ';
  }
  resize();
  render();
}
function setOrient(o){
  setParameters({ a: state.a, orient: o });
}
function redraw(){
  state.drawing = true;
  state.drawT = 0;
  state.holdT = 0;
  state.particles.length = 0;
}

aInput.addEventListener('input', () => setParameters({ a: aInput.value, orient: state.orient }));
startBtn.addEventListener('click', start);
pauseBtn.addEventListener('click', pause);
resetBtn.addEventListener('click', reset);
orientBtn.addEventListener('click', () => {
  setOrient(state.orient === 'sin' ? 'cos' : 'sin');
  redraw();
});
redrawBtn.addEventListener('click', redraw);

window.addEventListener('resize', () => { resize(); render(); });

// ---- 模型校验 ----
function runModelChecks(){
  const checks = [];
  // a=0 时 r 恒为 1（正圆）
  checks.push({name:'a=0 圆形', pass: Math.abs(rOf(0,0,'sin')-1)<1e-9 && Math.abs(rOf(Math.PI/2,0,'sin')-1)<1e-9, expected:1, actual:rOf(0,0,'sin'), tolerance:1e-9});
  // a=1, θ=π/2, sin: r = 1 - 1 = 0（凹口）
  checks.push({name:'a=1 凹口 r=0', pass: Math.abs(rOf(Math.PI/2,1,'sin')-0)<1e-9, expected:0, actual:rOf(Math.PI/2,1,'sin'), tolerance:1e-9});
  // a=1, θ=3π/2, sin: r = 1 - (-1) = 2（尖端）
  checks.push({name:'a=1 尖端 r=2', pass: Math.abs(rOf(3*Math.PI/2,1,'sin')-2)<1e-9, expected:2, actual:rOf(3*Math.PI/2,1,'sin'), tolerance:1e-9});
  // cos 朝向：θ=0 时 r = 1 - a
  checks.push({name:'cos θ=0 r=1-a', pass: Math.abs(rOf(0,1,'cos')-0)<1e-9, expected:0, actual:rOf(0,1,'cos'), tolerance:1e-9});
  // a 单调影响：a 越大，θ=3π/2 处 r 越大
  const r1 = rOf(3*Math.PI/2,1,'sin');
  const r2 = rOf(3*Math.PI/2,1.5,'sin');
  checks.push({name:'a 增大尖端更深', pass: r2 > r1, expected:'r(1.5)>r(1)', actual:`${r2}>${r1}`, tolerance:'strict'});
  // 周期性：θ 与 θ+2π 的 r 相同
  checks.push({name:'2π 周期性', pass: Math.abs(rOf(1.0,1,'sin')-rOf(1.0+2*Math.PI,1,'sin'))<1e-9, expected:'r(θ)=r(θ+2π)', actual:'相等', tolerance:1e-9});
  return checks;
}

function getState(){
  return {
    a: state.a,
    orient: state.orient,
    t: state.t,
    drawT: state.drawT,
    drawing: state.drawing,
    running: state.running,
    holdT: state.holdT,
    particleCount: state.particles.length
  };
}

function getReadouts(){
  return {
    a: state.a,
    orient: state.orient,
    drawT: state.drawT,
    drawing: state.drawing,
    running: state.running,
    progress: state.drawing ? easeInOut(state.drawT) : 1
  };
}

// 暴露接口
window.simulation = {
  init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks,
  setOrient, redraw, rOf, toScreen
};

init();
})();
</script>
