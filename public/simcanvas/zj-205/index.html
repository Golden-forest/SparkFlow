<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>胡克定律实验 · 弹力与伸长的关系</title>
<style>
:root{
  color-scheme:dark;
  --sim-bg:#070d1a;
  --sim-surface:#0f1a2e;
  --sim-surface-soft:#162338;
  --sim-text:#e8f0fb;
  --sim-muted:#8da3c0;
  --sim-border:#243a5e;
  --sim-grid:#1b2a44;
  --sim-accent:#22d3ee;
  --sim-accent-deep:#0891b2;
  --sim-accent-soft:#0e3a4a;
  --sim-positive:#34d399;
  --sim-warning:#fbbf24;
  --sim-danger:#f87171;
  --sim-radius-sm:10px;
  --sim-radius-md:16px;
  --sim-radius-lg:22px;
  --sim-shadow:0 18px 46px rgba(0,0,0,.45);
  --sim-space-1:4px;--sim-space-2:8px;--sim-space-3:12px;
  --sim-space-4:16px;--sim-space-5:24px;--sim-space-6:32px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;min-width:320px;color:var(--sim-text);
  background:
    radial-gradient(circle at 8% 0%,rgba(34,211,238,.10),transparent 30%),
    radial-gradient(circle at 95% 5%,rgba(251,191,36,.08),transparent 28%),
    var(--sim-bg);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
button,input{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid rgba(34,211,238,.45);outline-offset:2px}
.app{width:min(1560px,100%);height:100vh;margin:0 auto;padding:14px 18px 12px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;overflow:hidden}
.header{display:flex;justify-content:space-between;align-items:center;gap:18px;min-height:50px}
.header h1{margin:0 0 4px;font-size:clamp(1.5rem,2.2vw,2rem);letter-spacing:-.03em;line-height:1}
.header p{margin:0;color:var(--sim-muted);font-size:.88rem}
.status{border:1px solid rgba(34,211,238,.3);border-radius:999px;padding:8px 14px;background:var(--sim-accent-soft);color:var(--sim-accent);font-weight:700;white-space:nowrap;font-size:.85rem}
.status.warn{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.12);color:var(--sim-warning)}
.status.danger{border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.12);color:var(--sim-danger)}
.main{min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);gap:10px}
.panel{min-width:0;background:var(--sim-surface);border:1px solid var(--sim-border);border-radius:var(--sim-radius-lg);box-shadow:var(--sim-shadow)}
.scene-panel{min-height:0;padding:12px;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.panel-head h2{margin:0;font-size:.95rem}
.panel-head span{color:var(--sim-muted);font-size:.72rem}
canvas{display:block;width:100%;height:100%;border-radius:14px;background:linear-gradient(160deg,#0a1426 0%,#0d1a30 60%,#0a1426 100%)}
.side{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px}
.chart-panel{min-height:0;padding:12px;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
#chart{min-height:0}
.readouts{padding:12px}
.readout-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{padding:10px;border:1px solid var(--sim-border);border-radius:12px;background:var(--sim-surface-soft)}
.metric small{display:block;margin-bottom:3px;color:var(--sim-muted);font-size:.68rem;letter-spacing:.02em}
.metric strong{font-size:1.15rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block}
.metric.accent strong{color:var(--sim-accent)}
.metric.warn strong{color:var(--sim-warning)}
.insight{padding:10px 12px;border-left:3px solid var(--sim-warning);border-radius:0 10px 10px 0;background:rgba(251,191,36,.08);color:#fcd34d;font-weight:600;font-size:.82rem;line-height:1.5}
.controls{padding:10px 14px;display:grid;grid-template-columns:auto minmax(160px,1fr) minmax(160px,1fr);gap:18px;align-items:center;border-radius:16px}
.actions{display:flex;gap:8px}
button{border:1px solid var(--sim-border);border-radius:var(--sim-radius-sm);padding:9px 14px;color:var(--sim-text);background:var(--sim-surface-soft);cursor:pointer;font-weight:700;transition:transform .14s,background .14s,border-color .14s;font-size:.85rem}
button:hover{border-color:#3a5278;background:#1c2d48}
button:active{transform:scale(.96)}
button.primary{border-color:var(--sim-accent-deep);color:#021620;background:linear-gradient(135deg,var(--sim-accent),var(--sim-accent-deep));box-shadow:0 6px 16px rgba(34,211,238,.22)}
button.primary:hover{background:linear-gradient(135deg,#3de4f5,var(--sim-accent))}
button.danger{border-color:#7f1d1d;color:var(--sim-danger);background:rgba(127,29,29,.15)}
button.danger:hover{background:rgba(127,29,29,.28)}
button:disabled{opacity:.4;cursor:not-allowed}
.control label{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px;font-size:.78rem;font-weight:600}
.control output{color:var(--sim-accent);font-variant-numeric:tabular-nums;font-weight:700}
input[type=range]{width:100%;accent-color:var(--sim-accent);height:6px}
@media (max-width:900px){
  .app{height:auto;min-height:100vh;overflow:visible;padding:10px}
  .main{grid-template-columns:1fr}
  .controls{grid-template-columns:1fr}
  .scene-panel{min-height:0}
  canvas{aspect-ratio:760/420}
  #chart{aspect-ratio:560/360}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="rule-based">
  <header class="header" data-region="header">
    <div>
      <h1>胡克定律实验 · 弹力与伸长的关系</h1>
      <p>逐个加挂砝码，弹簧伸长；右侧 F-x 图像同步描点与线性拟合，超过弹性限度后图线弯曲。</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">就绪</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head"><h2 id="scene-title">演示区 · 铁架台装置</h2><span>标尺 / 弹簧形变 / 砝码堆叠</span></div>
      <canvas id="scene" role="img" aria-label="铁架台悬挂弹簧与砝码的装置示意图"></canvas>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel chart-panel" aria-labelledby="chart-title">
        <div class="panel-head"><h2 id="chart-title">数据分析区 · F-x 图像</h2><span>描点 · 过原点线性拟合</span></div>
        <canvas id="chart" role="img" aria-label="弹力与伸长关系图像"></canvas>
      </section>
      <section class="panel readouts">
        <div class="readout-grid">
          <div class="metric accent"><small>弹力 F</small><strong id="FReadout">0.00 N</strong></div>
          <div class="metric accent"><small>伸长 x</small><strong id="xReadout">0.0 cm</strong></div>
          <div class="metric"><small>砝码数</small><strong id="nReadout">0</strong></div>
          <div class="metric accent"><small>劲度 k</small><strong id="kReadout">25.0 N/m</strong></div>
          <div class="metric warn"><small>拟合斜率</small><strong id="slopeReadout">— N/m</strong></div>
          <div class="metric"><small>砝码质量</small><strong id="mReadout">50 g</strong></div>
        </div>
      </section>
    </aside>

    <section class="panel insight-panel" data-region="insight" aria-label="观察提示">
      <div id="insight" class="insight">点击「加砝码」开始采集数据。线性区内 F = k*x，斜率即劲度系数。</div>
    </section>
  </main>

  <section class="panel controls" data-region="controls" aria-label="实验控件">
    <div class="actions">
      <button id="addBtn" class="primary" type="button">加砝码</button>
      <button id="removeBtn" type="button">撤砝码</button>
      <button id="resetBtn" class="danger" type="button">重置</button>
    </div>
    <div class="control">
      <label for="kInput">劲度系数 k <output id="kOutput">25.0 N/m</output></label>
      <input id="kInput" type="range" min="10" max="200" step="1" value="25">
    </div>
    <div class="control">
      <label for="mInput">砝码质量 <output id="mOutput">50 g</output></label>
      <input id="mInput" type="range" min="20" max="200" step="10" value="50">
    </div>
  </section>
</div>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const canvas=$("scene"),ctx=canvas.getContext("2d");
const chartCanvas=$("chart"),cctx=chartCanvas.getContext("2d");

const params={k:25,mass:50};
const state={
  weights:[],          // 已加载砝码 {m, anim:0..1, target:1}
  history:[],          // 采集点 {n, m_total, F, x, region:'linear'|'softening'|'plateau'}
  animTime:0,
  lastTs:null,
  running:false,
  reducedMotion:window.matchMedia('(prefers-reduced-motion:reduce)').matches
};

// 弹性限度（以伸长量为界，随 k 缩放，使不同 k 下都能演示超限）
function elasticLimitX(){ return 0.18 + params.k*0.0012; } // 约 0.21~0.42 m
function plateauX(){ return elasticLimitX()*1.8; }

// 核心：给定总力（砝码总重力）计算伸长 x
function computeXclean(F){
  const k=params.k;
  const xl=elasticLimitX();
  const Fl=k*xl;                 // 线性区上限弹力
  if(F<=Fl) return F/k;
  const xp=plateauX();
  const Fp=Fl;                   // 软化区起点弹力=线性终点
  // 软化区：dF/dx 从 k 线性衰减到 k/6
  const slopeEnd=k/6;
  const avgSlope=(k+slopeEnd)/2;
  const Fsoft=avgSlope*(xp-xl);  // 软化区弹力增量
  if(F<=Fp+Fsoft){
    // 反解：F = Fl + ∫(k - (k-slopeEnd)*u) dx, u=(x-xl)/(xp-xl)
    // 数值二分
    let lo=xl,hi=xp;
    for(let i=0;i<40;i++){
      const mid=(lo+hi)/2;
      const u=(mid-xl)/(xp-xl);
      const s=k-(k-slopeEnd)*u;
      const Fmid=Fl+s*(mid-xl);
      if(Fmid<F) lo=mid; else hi=mid;
    }
    return (lo+hi)/2;
  }
  // 平台区：几乎不增加力，x 继续增长但 F 缓慢上升
  const Fplateau=Fp+Fsoft;
  const extra=F-Fplateau;
  return xp + extra/(slopeEnd*0.3);
}

function regionOf(x){
  const xl=elasticLimitX(), xp=plateauX();
  if(x<=xl+1e-6) return 'linear';
  if(x<=xp+1e-6) return 'softening';
  return 'plateau';
}

function totalMass(){return state.weights.reduce((s,w)=>s+w.m,0);}
function totalF(){return totalMass()*9.8/1000;} // N
function currentX(){return computeXclean(totalF());}

// ---- 动画 ----
function addWeight(){
  if(state.weights.length>=12){return;}
  state.weights.push({m:params.mass,anim:0,target:1});
  // 采集数据点
  const F=totalF(), x=currentX();
  state.history.push({n:state.weights.length,m_total:totalMass(),F,x,region:regionOf(x)});
}
function removeWeight(){
  if(state.weights.length===0)return;
  state.weights.pop();
  state.history.pop();
}
function reset(){
  state.weights=[];state.history=[];state.animTime=0;
}

// ---- 绘制装置 ----
function setupCanvas(cv,c){
  const dpr=window.devicePixelRatio||1;
  const r=cv.getBoundingClientRect();
  cv.width=r.width*dpr;cv.height=r.height*dpr;
  c.setTransform(dpr,0,0,dpr,0,0);
  return {w:r.width,h:r.height};
}
function drawScene(){
  const {w,h}=setupCanvas(canvas,ctx);
  ctx.clearRect(0,0,w,h);
  const cx=w*0.42;
  const baseY=h*0.10;   // 弹簧顶（横杆）
  const groundY=h*0.92;
  const rulerX=cx-w*0.13;

  // 背景刻度网格（淡）
  ctx.strokeStyle='rgba(36,58,94,.35)';ctx.lineWidth=1;
  for(let i=0;i<6;i++){
    const y=baseY+(groundY-baseY)*i/5;
    ctx.beginPath();ctx.moveTo(rulerX-30,y);ctx.lineTo(w-20,y);ctx.stroke();
  }

  // 铁架台
  drawStand(cx,baseY,groundY,w);

  // 标尺
  drawRuler(rulerX,baseY,groundY);

  // 弹簧
  const x=currentX();
  const springLen=Math.max(20, x*420); // 像素：1m→420px 缩放，但 x 约0~0.5m
  const hookY=baseY+10;
  const panY=hookY+springLen;
  drawSpring(cx,hookY,panY);

  // 砝码堆 + 下落动画
  drawWeights(cx,panY,groundY);

  // 力箭头
  if(state.weights.length>0){
    drawForceArrow(cx,panY,totalF());
  }

  // 状态色带
  drawRegionBar(w,h,x);

  // 标注
  ctx.fillStyle='#e8f0fb';ctx.font='600 13px ui-sans-serif,system-ui';
  ctx.textAlign='left';
  ctx.fillText('当前 F = '+totalF().toFixed(2)+' N',16,h-58);
  ctx.fillText('当前 x = '+(x*100).toFixed(1)+' cm',16,h-40);
  ctx.fillText('砝码数：'+state.weights.length,16,h-22);
}
function drawStand(cx,baseY,groundY,w){
  const colX=cx+w*0.16;
  ctx.strokeStyle='#475569';ctx.lineWidth=6;ctx.lineCap='round';
  // 立柱
  ctx.beginPath();ctx.moveTo(colX,baseY-4);ctx.lineTo(colX,groundY);ctx.stroke();
  // 底座
  ctx.fillStyle='#334155';
  ctx.fillRect(colX-40,groundY-6,80,12);
  ctx.fillStyle='#475569';
  ctx.fillRect(colX-36,groundY-4,72,4);
  // 横杆
  ctx.strokeStyle='#475569';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(colX,baseY);ctx.lineTo(cx-8,baseY);ctx.stroke();
  // 悬挂钩
  ctx.strokeStyle='#64748b';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(cx,baseY);ctx.lineTo(cx,baseY+10);ctx.stroke();
}
function drawRuler(rulerX,baseY,groundY){
  ctx.save();
  ctx.fillStyle='#1e293b';
  ctx.fillRect(rulerX-10,baseY,14,groundY-baseY);
  ctx.fillStyle='#e8f0fb';ctx.font='10px ui-sans-serif';ctx.textAlign='right';
  ctx.strokeStyle='#64748b';ctx.lineWidth=1;
  const H=groundY-baseY;
  for(let cm=0;cm<=50;cm+=5){
    const y=baseY+H*cm/50;
    ctx.beginPath();ctx.moveTo(rulerX-10,y);ctx.lineTo(rulerX,y);ctx.stroke();
    if(cm%10===0){
      ctx.fillText(cm+'',rulerX-13,y+3);
    }
  }
  ctx.fillStyle='#8da3c0';ctx.font='600 10px ui-sans-serif';
  ctx.save();ctx.translate(rulerX-26,baseY+H/2);ctx.rotate(-Math.PI/2);
  ctx.textAlign='center';ctx.fillText('x / cm',0,0);ctx.restore();
  ctx.restore();
}
function drawSpring(cx,topY,bottomY){
  const len=bottomY-topY;
  if(len<8){ctx.strokeStyle='#94a3b8';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(cx,topY);ctx.lineTo(cx,bottomY);ctx.stroke();return;}
  const coils=12;
  const radius=Math.max(6,14-len*0.02);
  const color = regionOf(currentX())==='linear' ? '#22d3ee' : regionOf(currentX())==='softening' ? '#fbbf24' : '#f87171';
  // 双层描边模拟发光
  ctx.strokeStyle='rgba(34,211,238,.18)';ctx.lineWidth=radius*2.2;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();springPath(cx,topY,bottomY,coils,radius);ctx.stroke();
  ctx.strokeStyle=color;ctx.lineWidth=3.2;
  ctx.beginPath();springPath(cx,topY,bottomY,coils,radius);ctx.stroke();
}
function springPath(cx,topY,bottomY,coils,r){
  const seg=coils*12;
  const len=bottomY-topY;
  ctx.moveTo(cx,topY);
  for(let i=0;i<=seg;i++){
    const t=i/seg;
    const y=topY+len*t;
    const ang=t*coils*Math.PI*2;
    const x=cx+Math.sin(ang)*r;
    ctx.lineTo(x,y);
  }
}
function drawWeights(cx,panY,groundY){
  // 托盘
  ctx.fillStyle='#475569';
  ctx.fillRect(cx-22,panY,44,5);
  // 砝码堆叠
  const baseW=40,baseH=14;
  state.weights.forEach((wgt,i)=>{
    const a=wgt.anim;
    const ease=state.reducedMotion?1:(1-Math.pow(1-a,3)); // easeOutCubic
    const stackY=panY+5+i*baseH;
    const dropFrom=stackY-120;
    const y=dropFrom+(stackY-dropFrom)*ease;
    const alpha=Math.min(1,ease*1.5);
    ctx.save();ctx.globalAlpha=alpha;
    // 砝码主体
    const grad=ctx.createLinearGradient(cx-baseW/2,y,cx+baseW/2,y);
    grad.addColorStop(0,'#64748b');grad.addColorStop(.5,'#94a3b8');grad.addColorStop(1,'#475569');
    ctx.fillStyle=grad;
    ctx.fillRect(cx-baseW/2,y,baseW,baseH);
    ctx.strokeStyle='#334155';ctx.lineWidth=1.5;
    ctx.strokeRect(cx-baseW/2,y,baseW,baseH);
    // 标注质量
    ctx.fillStyle='#0f172a';ctx.font='700 9px ui-sans-serif';ctx.textAlign='center';
    ctx.fillText(wgt.m+'g',cx,y+10);
    ctx.restore();
  });
}
function drawForceArrow(cx,panY,F){
  const len=Math.min(60, 10+F*8);
  const y=panY+22;
  ctx.strokeStyle='#f87171';ctx.lineWidth=3;ctx.lineCap='round';
  // 双层描边发光
  ctx.strokeStyle='rgba(248,113,113,.25)';ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(cx,y);ctx.lineTo(cx,y+len);ctx.stroke();
  ctx.strokeStyle='#f87171';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(cx,y);ctx.lineTo(cx,y+len);ctx.stroke();
  // 箭头
  ctx.fillStyle='#f87171';
  ctx.beginPath();ctx.moveTo(cx,y+len+8);ctx.lineTo(cx-5,y+len);ctx.lineTo(cx+5,y+len);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fca5a5';ctx.font='600 11px ui-sans-serif';ctx.textAlign='left';
  ctx.fillText('F = '+F.toFixed(2)+'N',cx+10,y+len/2+4);
}
function drawRegionBar(w,h,x){
  const reg=regionOf(x);
  const label = reg==='linear'?'线性区 · 胡克定律适用':reg==='softening'?'软化区 · 超出弹性限度':'平台区 · 接近断裂';
  const color = reg==='linear'?'#34d399':reg==='softening'?'#fbbf24':'#f87171';
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.fillRect(w-170,12,158,26);
  ctx.fillStyle=color;
  ctx.fillRect(w-170,12,4,26);
  ctx.fillStyle='#e8f0fb';ctx.font='700 11px ui-sans-serif';ctx.textAlign='left';
  ctx.fillText(label,w-158,28);
}

// ---- 绘制 F-x 图像 ----
function drawChart(){
  const {w,h}=setupCanvas(chartCanvas,cctx);
  cctx.clearRect(0,0,w,h);
  const pad={l:52,r:18,t:14,b:38};
  const pw=w-pad.l-pad.r, ph=h-pad.t-pad.b;

  // 自适应量程
  let maxX=0.5,maxF=12;
  state.history.forEach(p=>{maxX=Math.max(maxX,p.x);maxF=Math.max(maxF,p.F);});
  maxX=Math.max(0.5,maxX*1.15);
  maxF=Math.max(12,maxF*1.15);
  const xToPx=v=>pad.l+(v/maxX)*pw;
  const fToPx=v=>pad.t+ph-(v/maxF)*ph;

  // 网格
  cctx.strokeStyle='rgba(36,58,94,.6)';cctx.lineWidth=1;
  for(let i=0;i<=5;i++){
    const x=pad.l+pw*i/5, y=pad.t+ph*i/5;
    cctx.beginPath();cctx.moveTo(x,pad.t);cctx.lineTo(x,pad.t+ph);cctx.stroke();
    cctx.beginPath();cctx.moveTo(pad.l,y);cctx.lineTo(pad.l+pw,y);cctx.stroke();
  }
  // 刻度数字
  cctx.fillStyle='#8da3c0';cctx.font='10px ui-sans-serif';cctx.textAlign='center';
  for(let i=0;i<=5;i++){
    cctx.fillText((maxX*i/5*100).toFixed(0),pad.l+pw*i/5,pad.t+ph+14);
  }
  cctx.textAlign='right';
  for(let i=0;i<=5;i++){
    cctx.fillText((maxF*i/5).toFixed(1),pad.l-6,pad.t+ph-ph*i/5+3);
  }
  // 轴
  cctx.strokeStyle='#64748b';cctx.lineWidth=1.5;
  cctx.beginPath();cctx.moveTo(pad.l,pad.t);cctx.lineTo(pad.l,pad.t+ph);cctx.lineTo(pad.l+pw,pad.t+ph);cctx.stroke();
  // 轴标签
  cctx.fillStyle='#e8f0fb';cctx.font='600 12px ui-sans-serif';
  cctx.textAlign='center';
  cctx.fillText('x / cm',pad.l+pw/2,h-8);
  cctx.save();cctx.translate(14,pad.t+ph/2);cctx.rotate(-Math.PI/2);
  cctx.fillText('F / N',0,0);cctx.restore();

  // 理论直线 F=kx（仅线性区范围）
  const xl=elasticLimitX();
  cctx.strokeStyle='rgba(34,211,238,.25)';cctx.lineWidth=1.5;cctx.setLineDash([4,4]);
  cctx.beginPath();
  cctx.moveTo(xToPx(0),fToPx(0));
  cctx.lineTo(xToPx(xl),fToPx(params.k*xl));
  cctx.stroke();
  cctx.setLineDash([]);

  // 拟合：仅取线性区点做过原点线性回归
  const linearPts=state.history.filter(p=>p.region==='linear');
  let slope=null;
  if(linearPts.length>=1){
    let sxx=0,sxy=0;
    linearPts.forEach(p=>{sxx+=p.x*p.x;sxy+=p.x*p.F;});
    slope=sxx>0?sxy/sxx:params.k;
  }
  // 画拟合直线
  if(slope!==null){
    cctx.strokeStyle='rgba(52,211,153,.2)';cctx.lineWidth=6;
    cctx.beginPath();cctx.moveTo(xToPx(0),fToPx(0));cctx.lineTo(xToPx(maxX),fToPx(slope*maxX));cctx.stroke();
    cctx.strokeStyle='#34d399';cctx.lineWidth=2;
    cctx.beginPath();cctx.moveTo(xToPx(0),fToPx(0));cctx.lineTo(xToPx(maxX),fToPx(slope*maxX));cctx.stroke();
  }

  // 数据点连线
  if(state.history.length>1){
    cctx.strokeStyle='rgba(232,240,251,.35)';cctx.lineWidth=1.5;
    cctx.beginPath();
    state.history.forEach((p,i)=>{
      const px=xToPx(p.x),py=fToPx(p.F);
      if(i===0)cctx.moveTo(px,py);else cctx.lineTo(px,py);
    });
    cctx.stroke();
  }
  // 数据点
  state.history.forEach(p=>{
    const px=xToPx(p.x),py=fToPx(p.F);
    const c=p.region==='linear'?'#22d3ee':p.region==='softening'?'#fbbf24':'#f87171';
    cctx.fillStyle='rgba(0,0,0,.4)';cctx.beginPath();cctx.arc(px,py,7,0,Math.PI*2);cctx.fill();
    cctx.fillStyle=c;cctx.beginPath();cctx.arc(px,py,5,0,Math.PI*2);cctx.fill();
    cctx.strokeStyle='#0a1426';cctx.lineWidth=1.5;cctx.stroke();
    // 编号
    cctx.fillStyle='#e8f0fb';cctx.font='700 9px ui-sans-serif';cctx.textAlign='left';
    cctx.fillText(''+p.n,px+7,py-7);
  });

  // 图例 + 方程
  cctx.font='600 11px ui-sans-serif';cctx.textAlign='left';
  cctx.fillStyle='#22d3ee';cctx.fillRect(pad.l+6,pad.t+4,10,10);
  cctx.fillStyle='#e8f0fb';cctx.fillText('线性区数据',pad.l+20,pad.t+13);
  cctx.fillStyle='#fbbf24';cctx.fillRect(pad.l+90,pad.t+4,10,10);
  cctx.fillText('软化区',pad.l+104,pad.t+13);
  cctx.fillStyle='#f87171';cctx.fillRect(pad.l+150,pad.t+4,10,10);
  cctx.fillText('平台区',pad.l+164,pad.t+13);

  if(slope!==null){
    cctx.fillStyle='#34d399';cctx.fillRect(pad.l+6,pad.t+22,10,10);
    cctx.fillStyle='#e8f0fb';
    cctx.fillText('拟合 F = '+slope.toFixed(1)+'*x',pad.l+20,pad.t+31);
    cctx.fillStyle='#8da3c0';
    cctx.fillText('斜率 = k = '+slope.toFixed(1)+' N/m',pad.l+20,pad.t+45);
  }
  // 弹性限度竖线
  cctx.strokeStyle='rgba(251,191,36,.4)';cctx.lineWidth=1;cctx.setLineDash([3,3]);
  cctx.beginPath();cctx.moveTo(xToPx(xl),pad.t);cctx.lineTo(xToPx(xl),pad.t+ph);cctx.stroke();
  cctx.setLineDash([]);
  cctx.fillStyle='#fbbf24';cctx.font='600 9px ui-sans-serif';cctx.textAlign='left';
  cctx.fillText('弹性限度',xToPx(xl)+4,pad.t+10);
}

// ---- 读数与提示 ----
function updateReadouts(){
  const F=totalF(),x=currentX();
  $('FReadout').textContent=F.toFixed(2)+' N';
  $('xReadout').textContent=(x*100).toFixed(1)+' cm';
  $('nReadout').textContent=state.weights.length;
  $('kReadout').textContent=params.k.toFixed(1)+' N/m';
  $('mReadout').textContent=params.mass+' g';
  const linearPts=state.history.filter(p=>p.region==='linear');
  if(linearPts.length>=1){
    let sxx=0,sxy=0;
    linearPts.forEach(p=>{sxx+=p.x*p.x;sxy+=p.x*p.F;});
    const slope=sxx>0?sxy/sxx:params.k;
    $('slopeReadout').textContent=slope.toFixed(1)+' N/m';
  } else { $('slopeReadout').textContent='— N/m'; }

  const reg=regionOf(x);
  const st=$('status');
  st.className='status'+(reg==='softening'?' warn':reg==='plateau'?' danger':'');
  st.textContent = state.weights.length===0?'就绪':reg==='linear'?'采集中 · 线性区':reg==='softening'?'采集中 · 超弹性限度':'采集中 · 平台区';

  const ins=$('insight');
  if(state.weights.length===0){
    ins.textContent='点击「加砝码」开始采集数据。线性区内 F = k*x，斜率即劲度系数。';
    ins.style.borderLeftColor='var(--sim-warning)';ins.style.background='rgba(251,191,36,.08)';ins.style.color='#fcd34d';
  } else if(reg==='linear'){
    ins.textContent='线性区：弹力与伸长成正比，F = k*x。拟合斜率应接近滑块设定的 k 值。';
    ins.style.borderLeftColor='var(--sim-positive)';ins.style.background='rgba(52,211,153,.08)';ins.style.color='#6ee7b7';
  } else if(reg==='softening'){
    ins.textContent='超出弹性限度：弹簧发生塑性形变，图线开始弯曲，斜率减小，胡克定律不再适用。';
    ins.style.borderLeftColor='var(--sim-warning)';ins.style.background='rgba(251,191,36,.1)';ins.style.color='#fcd34d';
  } else {
    ins.textContent='平台区：伸长急剧增加而弹力几乎不变，弹簧接近永久形变或断裂。';
    ins.style.borderLeftColor='var(--sim-danger)';ins.style.background='rgba(248,113,113,.1)';ins.style.color='#fca5a5';
  }
}

// ---- 动画循环 ----
function frame(ts){
  if(state.lastTs===null)state.lastTs=ts;
  const dt=Math.min(0.05,(ts-state.lastTs)/1000);
  state.lastTs=ts;
  state.animTime+=dt;
  // 砝码下落动画
  state.weights.forEach(w=>{
    if(w.anim<1){
      w.anim=Math.min(1,w.anim+dt/0.45);
    }
  });
  drawScene();
  drawChart();
  updateReadouts();
  requestAnimationFrame(frame);
}

// ---- 控件 ----
function bindControls(){
  $('addBtn').addEventListener('click',addWeight);
  $('removeBtn').addEventListener('click',removeWeight);
  $('resetBtn').addEventListener('click',reset);
  $('kInput').addEventListener('input',e=>{
    params.k=parseFloat(e.target.value);
    $('kOutput').textContent=params.k.toFixed(1)+' N/m';
    // k 改变后重新采集所有点（保持砝码数，重算 x）
    state.history=state.weights.map((w,i)=>{const F=(i+1)*w.m*9.8/1000;const x=computeXclean(F);return {n:i+1,m_total:(i+1)*w.m,F,x,region:regionOf(x)};});
  });
  $('mInput').addEventListener('input',e=>{
    params.mass=parseFloat(e.target.value);
    $('mOutput').textContent=params.mass+' g';
    state.history=state.weights.map((w,i)=>{const F=(i+1)*params.mass*9.8/1000;const x=computeXclean(F);return {n:i+1,m_total:(i+1)*params.mass,F,x,region:regionOf(x)};});
    // 同步已加载砝码的质量显示
    state.weights.forEach(w=>w.m=params.mass);
  });
}

// ---- 模型检查 ----
function runModelChecks(){
  const k=params.k;
  const xl=elasticLimitX();
  // 1. 线性区斜率
  const F1=k*xl*0.5;
  const x1=computeXclean(F1);
  const slopeCheck=Math.abs(x1-F1/k)<1e-6;
  // 2. 过原点
  const origin=computeXclean(0);
  // 3. 线性区 F=kx 精确
  const linErr=Math.abs(computeXclean(k*0.1)-0.1);
  // 4. 超限后斜率下降
  const Fsoft=k*xl*1.2;
  const xsoft=computeXclean(Fsoft);
  const slopeSoft=(Fsoft-k*xl)/(xsoft-xl);
  const softCheck=slopeSoft<k;
  // 5. 平台区斜率更小
  const Fplat=k*xl*1.6;
  const xplat=computeXclean(Fplat);
  const slopePlat=(Fplat-k*xl)/(xplat-xl);
  const platCheck=slopePlat<slopeSoft;
  // 6. 撤码回归线性（reset 后 x=0）
  return [
    {name:'线性区 F=kx 精确',pass:linErr<1e-6,expected:'x=0.1',actual:x1.toFixed(4),tolerance:'1e-6'},
    {name:'过原点',pass:Math.abs(origin)<1e-9,expected:0,actual:origin,tolerance:'1e-9'},
    {name:'线性区斜率=k',pass:slopeCheck,expected:k,actual:(F1/x1).toFixed(4),tolerance:'1e-6'},
    {name:'软化区斜率<k',pass:softCheck,expected:'< '+k,actual:slopeSoft.toFixed(2),tolerance:'strict'},
    {name:'平台区斜率<软化区',pass:platCheck,expected:'< '+slopeSoft.toFixed(2),actual:slopePlat.toFixed(2),tolerance:'strict'},
    {name:'k 改变后弹性限度移动',pass:elasticLimitX()>0,expected:'>0',actual:elasticLimitX().toFixed(3),tolerance:'finite'}
  ];
}

function init(){bindControls();reset();requestAnimationFrame(frame);}
function start(){state.running=true;}
function pause(){state.running=false;}
function update(dt){
  if(!state.running)return;
  const boundedDt=Math.min(0.05,Math.max(0,dt));
  state.animTime+=boundedDt;
  state.weights.forEach(w=>{
    if(w.anim<1){
      w.anim=Math.min(1,w.anim+boundedDt/0.45);
    }
  });
}
function render(){
  drawScene();
  drawChart();
  updateReadouts();
}
function setParameters(values){
  if(values.k!==undefined){
    const v=parseFloat(values.k);
    if(Number.isFinite(v)){params.k=Math.min(200,Math.max(10,v));$('kInput').value=params.k;$('kOutput').textContent=params.k.toFixed(1)+' N/m';}
  }
  if(values.mass!==undefined){
    const v=parseFloat(values.mass);
    if(Number.isFinite(v)){params.mass=Math.min(200,Math.max(20,v));$('mInput').value=params.mass;$('mOutput').textContent=params.mass+' g';}
  }
  state.history=state.weights.map((w,i)=>{const F=(i+1)*w.m*9.8/1000;const x=computeXclean(F);return {n:i+1,m_total:(i+1)*w.m,F,x,region:regionOf(x)};});
  render();
}
function getState(){return {...state,params:{...params}};}
function getReadouts(){return {F:totalF(),x:currentX(),k:params.k,mass:params.mass,n:state.weights.length};}

window.simulation={init,start,pause,reset,update,render,setParameters,getState,getReadouts,runModelChecks,addWeight,removeWeight};
init();
})();
</script>
