  <title>傅里叶级数逼近方波 · SimCanvas</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #f4f7fb;
      --sim-surface: #ffffff;
      --sim-surface-soft: #f8fafc;
      --sim-text: #172033;
      --sim-muted: #657188;
      --sim-border: #dfe6ef;
      --sim-grid: #e8edf4;
      --sim-accent: #0f9fba;
      --sim-accent-deep: #08758a;
      --sim-accent-soft: #d9f4f7;
      --sim-positive: #0f9fba;
      --sim-warning: #d97706;
      --sim-danger: #dc2626;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 14px 36px rgba(28, 43, 70, 0.09);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
      --sim-target: #64748b;
      --sim-approx: #0f9fba;
      --sim-error: #d97706;
      --sim-harmonic: #6366f1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.10), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(217, 119, 6, 0.08), transparent 26%),
        var(--sim-bg);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(15, 159, 186, 0.4); outline-offset: 2px; }

    .app {
      width: min(1560px, 100%);
      height: 100vh;
      margin: 0 auto;
      padding: var(--sim-space-3) var(--sim-space-4) var(--sim-space-3);

    .header {

    .header h1 {

    }
    .header p {

    }
    .status {
      border: 1px solid rgba(15, 159, 186, 0.25);

      padding: 8px 16px;

    .main {

    }
    .panel {
      min-width: 0;
      background: rgba(255, 255, 255, 0.96);

    .scene-panel {
      min-height: 420px;

    }
    .panel-head {

    #scene {
      width: 100%;

    .metric {

      border: 1px solid rgba(15, 159, 186, 0.12);

    .metric small {

    }
    .model-note {

      overflow-y: auto;
    }
    .model-note h2 {
      margin: 0;

    .model-note p {

    .insight {

    .controls {
      padding: var(--sim-space-3) var(--sim-space-4);

    button {
      border: 1px solid var(--sim-border);

    }

    button.primary {
      border-color: var(--sim-accent-deep);
      color: #fff;
      background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent));

    button[aria-pressed="true"] {
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.4);
    }
    .control label {
      display: flex;
      justify-content: space-between;
      gap: var(--sim-space-3);
      margin-bottom: 5px;
      font-size: 0.78rem;

      color: var(--sim-text);
    }
    .control output {
      color: var(--sim-accent-deep);
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--sim-accent);
      height: 6px;
    }

    .grid-line { stroke: var(--sim-grid); stroke-width: 1; }
    .axis { stroke: #9aa7ba; stroke-width: 1.5; }
    .axis-label { fill: var(--sim-muted); font-size: 12px; }
    .target-line { stroke: var(--sim-target); stroke-width: 2.5; stroke-dasharray: 8 5; fill: none; opacity: 0.7; }
    .error-band { fill: rgba(217, 119, 6, 0.10); stroke: none; }
    .approx-line { fill: none; stroke: var(--sim-approx); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 2px 3px rgba(15, 159, 186, 0.18)); }
    .harmonic-line { fill: none; stroke: var(--sim-harmonic); stroke-width: 1.5; opacity: 0.35; stroke-dasharray: 4 3; }
    .marker-dot { fill: var(--sim-approx); stroke: white; stroke-width: 2; }

    @media (max-width: 980px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: var(--sim-space-3); }
      .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; gap: var(--sim-space-3); }
      .scene-panel { min-height: 0; }
      #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>

<body>
  <div class="app" data-layout="visualization-first" data-model-tier="analytic">
    <header class="header" data-region="header">
      <div>
        <h1>傅里叶级数逼近方波</h1>
        <p>奇次正弦谐波逐项叠加——观察波形如何从单一正弦逐步逼近理想方波。</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">自动递增中</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head">
          <h2 id="scene-title">叠加波形</h2>
          <span>目标方波（灰虚线）· 当前逼近（青）· 误差带（橙）</span>
        </div>
        <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
          <desc id="scene-desc">波形图：灰色虚线为目标方波，青色实线为当前 N 项谐波叠加的逼近波形，橙色阴影标示逼近误差区域。</desc>
          <defs>
            <linearGradient id="approxGrad" x1="0" x2="1">
              <stop offset="0%" stop-color="#0f9fba"/>
              <stop offset="100%" stop-color="#08758a"/>
            </linearGradient>
          </defs>
          <g id="grid"></g>
          <line class="axis" x1="60" y1="210" x2="740" y2="210"></line>
          <line class="axis" x1="60" y1="30" x2="60" y2="390"></line>
          <text class="axis-label" x="735" y="405" text-anchor="end">相位 t / T</text>
          <text class="axis-label" x="14" y="36">+1</text>
          <text class="axis-label" x="14" y="214">0</text>
          <text class="axis-label" x="14" y="394">−1</text>
          <path id="targetPath" class="target-line"></path>
          <path id="errorBand" class="error-band"></path>
          <path id="harmonic1Path" class="harmonic-line"></path>
          <path id="approxPath" class="approx-line" stroke="url(#approxGrad)"></path>
          <circle id="marker" class="marker-dot" cx="60" cy="210" r="5"></circle>
        </svg>
      </section>

      <aside class="side" data-region="evidence">
        <section class="panel readouts" aria-label="实时数值">
          <div class="readout-grid">
            <div class="metric"><small>谐波项数 N</small><strong id="nReadout">1</strong></div>
            <div class="metric"><small>最高次频率</small><strong id="freqReadout">1·f</strong></div>
            <div class="metric"><small>最大过冲</small><strong id="overshootReadout">0.00%</strong></div>
            <div class="metric"><small>逼近误差</small><strong id="errorReadout">0.000</strong></div>
          </div>
        </section>
        <section class="panel model-note" data-region="insight">
          <div class="panel-head"><h2>观察要点</h2></div>
          <p id="insight" class="insight">N=1：单一基频正弦波。随着 N 增加，更多奇次谐波加入，波形逐步逼近方波。</p>
          <p>模型：方波傅里叶级数 f(t) = (4/π)·Σ sin((2k−1)t)/(2k−1)，k=1..N。即使 N→∞，跳变点附近仍残留约 9% 过冲——这是吉布斯现象。</p>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="模拟控制">
      <div class="actions">
        <button id="playBtn" class="primary" type="button">暂停递增</button>
        <button id="resetBtn" type="button">重置</button>
      </div>
      <div class="control">
        <label for="nInput">谐波项数 N <output id="nOutput">1</output></label>
        <input id="nInput" type="range" min="1" max="50" step="1" value="1">
      </div>
      <div class="control">
        <label for="speedInput">递增速度 <output id="speedOutput">1.0 项/秒</output></label>
        <input id="speedInput" type="range" min="0.2" max="5" step="0.1" value="1">
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";

    const parameterSchema = [
      { key: "n", label: "谐波项数 N", type: "slider", min: 1, max: 50, step: 1, default: 1, unit: "" },
      { key: "speed", label: "递增速度", type: "slider", min: 0.2, max: 5, step: 0.1, default: 1, unit: "项/秒" }
    ];

    const state = {
      running: true,
      t: 0,
      n: 1,
      speed: 1,
      lastTimestamp: null,
      autoIncrement: true,
      markerPhase: 0
    };

    const elements = {
      status: document.querySelector("#status"),
      grid: document.querySelector("#grid"),
      targetPath: document.querySelector("#targetPath"),
      errorBand: document.querySelector("#errorBand"),
      harmonic1Path: document.querySelector("#harmonic1Path"),
      approxPath: document.querySelector("#approxPath"),
      marker: document.querySelector("#marker"),
      nReadout: document.querySelector("#nReadout"),
      freqReadout: document.querySelector("#freqReadout"),
      overshootReadout: document.querySelector("#overshootReadout"),
      errorReadout: document.querySelector("#errorReadout"),
      insight: document.querySelector("#insight"),
      nInput: document.querySelector("#nInput"),
      nOutput: document.querySelector("#nOutput"),
      speedInput: document.querySelector("#speedInput"),
      speedOutput: document.querySelector("#speedOutput"),
      playBtn: document.querySelector("#playBtn"),
      resetBtn: document.querySelector("#resetBtn")
    };

    const PLOT = {
      x0: 60, x1: 740, width: 680,
      y0: 30, y1: 390, height: 360,
      yMid: 210, yScale: 180
    };

    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

    function fourierValue(phase, n) {
      let sum = 0;
      for (let k = 1; k <= n; k += 1) {
        const harmonic = 2 * k - 1;
        sum += Math.sin(harmonic * phase) / harmonic;
      }
      return (4 / Math.PI) * sum;
    }

    function targetValue(phase) {
      const s = Math.sin(phase);
      return s > 0 ? 1 : (s < 0 ? -1 : 0);
    }

    function initGrid() {
      const lines = [];
      for (let i = 0; i <= 8; i += 1) {
        const x = PLOT.x0 + (i / 8) * PLOT.width;
        lines.push('<line class="grid-line" x1="' + x + '" y1="' + PLOT.y0 + '" x2="' + x + '" y2="' + PLOT.y1 + '"></line>');
      }
      for (let i = 0; i <= 4; i += 1) {
        const y = PLOT.y0 + (i / 4) * PLOT.height;
        lines.push('<line class="grid-line" x1="' + PLOT.x0 + '" y1="' + y + '" x2="' + PLOT.x1 + '" y2="' + y + '"></line>');
      }
      elements.grid.innerHTML = lines.join("");
    }

    function phaseToX(phase) {
      const normalized = ((phase % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      return PLOT.x0 + (normalized / (2 * Math.PI)) * PLOT.width;
    }

    function valueToY(v) {
      return PLOT.yMid - v * PLOT.yScale;
    }

    // 修复：采样区间改为半开区间 [0, 2π)，路径不闭合，消除首尾斜线
    function buildPath(samples, valueFn) {
      let d = "";
      for (let i = 0; i < samples; i += 1) {
        const phase = (i / samples) * 2 * Math.PI;
        const x = phaseToX(phase);
        const y = valueToY(valueFn(phase));
        d += (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1) + " ";
      }
      return d;
    }

    function buildTargetPath() {
      const samples = 400;
      let d = "";
      for (let i = 0; i < samples; i += 1) {
        const phase = (i / samples) * 2 * Math.PI;
        const x = phaseToX(phase);
        const y = valueToY(targetValue(phase));
        d += (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1) + " ";
      }
      return d;
    }

    function buildErrorBand(n) {
      const samples = 400;
      let top = "", bottom = "";
      for (let i = 0; i < samples; i += 1) {
        const phase = (i / samples) * 2 * Math.PI;
        const x = phaseToX(phase);
        const tv = targetValue(phase);
        const av = fourierValue(phase, n);
        const topY = valueToY(Math.max(tv, av));
        const bottomY = valueToY(Math.min(tv, av));
        top += (i === 0 ? "M" : "L") + x.toFixed(1) + " " + topY.toFixed(1) + " ";
        bottom += "L" + x.toFixed(1) + " " + bottomY.toFixed(1) + " ";
      }
      // 闭合误差带：从最后一点回到第一点的底部，形成封闭区域
      return top + bottom + "Z";
    }

    function computeMaxOvershoot(n) {
      let maxOvershoot = 0;
      for (let i = 1; i <= 2000; i += 1) {
        const phase = (i / 2000) * Math.PI * 0.5;
        if (phase < 0.001) continue;
        const val = fourierValue(phase, n);
        if (val > 1) {
          const overshoot = val - 1;
          if (overshoot > maxOvershoot) maxOvershoot = overshoot;
        }
      }
      return maxOvershoot;
    }

    function computeErrorMetric(n) {
      let sumSq = 0;
      let count = 0;
      const samples = 500;
      for (let i = 0; i < samples; i += 1) {
        const phase = (i / samples) * 2 * Math.PI;
        const diff = fourierValue(phase, n) - targetValue(phase);
        sumSq += diff * diff;
        count += 1;
      }
      return Math.sqrt(sumSq / count);
    }

    function init() {
      initGrid();
      bindControls();
      setParameters({ n: 1, speed: 1 });
      reset();
      requestAnimationFrame(frame);
    }

    function start() {
      state.autoIncrement = true;
      state.running = true;
      state.lastTimestamp = null;
      elements.status.textContent = "自动递增中";
      elements.playBtn.textContent = "暂停递增";
      elements.playBtn.setAttribute("aria-pressed", "true");
    }

    function pause() {
      state.autoIncrement = false;
      state.running = false;
      elements.status.textContent = "已暂停";
      elements.playBtn.textContent = "继续递增";
      elements.playBtn.setAttribute("aria-pressed", "false");
    }

    function reset() {
      state.autoIncrement = true;
      state.running = true;
      state.t = 0;
      state.n = 1;
      state.markerPhase = 0;
      state.lastTimestamp = null;
      elements.status.textContent = "自动递增中";
      elements.playBtn.textContent = "暂停递增";
      elements.playBtn.setAttribute("aria-pressed", "true");
      elements.nInput.value = "1";
      render();
    }

    function update(dt) {
      const boundedDt = clamp(finite(dt, 0), 0, 0.05);
      state.t += boundedDt;
      state.markerPhase = (state.markerPhase + boundedDt * 0.5) % (2 * Math.PI);

      if (state.autoIncrement && state.running) {
        const oldN = state.n;
        const newN = state.n + state.speed * boundedDt;
        state.n = clamp(newN, 1, 50);
        const intN = Math.round(state.n);
        const oldIntN = Math.round(oldN);
        if (intN !== oldIntN && intN >= 1 && intN <= 50) {
          elements.nInput.value = String(intN);
        }
      }
    }

    function render() {
      const n = Math.max(1, Math.round(state.n));

      elements.targetPath.setAttribute("d", buildTargetPath());
      elements.errorBand.setAttribute("d", buildErrorBand(n));
      elements.approxPath.setAttribute("d", buildPath(400, (p) => fourierValue(p, n)));
      elements.harmonic1Path.setAttribute("d", buildPath(400, (p) => Math.sin(p)));

      const mx = phaseToX(state.markerPhase);
      const mv = fourierValue(state.markerPhase, n);
      const my = valueToY(mv);
      elements.marker.setAttribute("cx", mx.toFixed(1));
      elements.marker.setAttribute("cy", my.toFixed(1));

      const maxOvershoot = computeMaxOvershoot(n);
      const errorMetric = computeErrorMetric(n);
      const highestHarmonic = 2 * n - 1;

      elements.nReadout.textContent = String(n);
      elements.freqReadout.textContent = highestHarmonic + "·f";
      elements.overshootReadout.textContent = (maxOvershoot * 100).toFixed(2) + "%";
      elements.errorReadout.textContent = errorMetric.toFixed(3);

      elements.nOutput.textContent = String(n);
      elements.speedOutput.textContent = state.speed.toFixed(1) + " 项/秒";

      let insightText = "";
      if (n === 1) {
        insightText = "N=1：单一基频正弦波。随着 N 增加，更多奇次谐波加入，波形逐步逼近方波。";
      } else if (n <= 3) {
        insightText = "N=" + n + "：波形开始出现平顶趋势，但过渡仍然圆滑。";
      } else if (n <= 10) {
        insightText = "N=" + n + "：过渡变陡，平顶趋于水平。跳变点附近的振铃逐渐集中。";
      } else if (n <= 25) {
        insightText = "N=" + n + "：波形已相当接近方波。注意跳变点附近的过冲——这就是吉布斯现象。";
      } else {
        insightText = "N=" + n + "：高阶叠加。过冲宽度变窄但高度趋于极限约 8.95%，不随 N 增大而消失。";
      }
      elements.insight.textContent = insightText;
    }

    function setParameters(values) {
      const nDef = parameterSchema[0], speedDef = parameterSchema[1];
      if (values.n !== undefined) {
        state.n = clamp(finite(Number(values.n), nDef.default), nDef.min, nDef.max);
      }
      if (values.speed !== undefined) {
        state.speed = clamp(finite(Number(values.speed), speedDef.default), speedDef.min, speedDef.max);
      }
      elements.nInput.value = String(Math.round(state.n));
      elements.speedInput.value = String(state.speed);
      render();
    }

    function getState() {
      return {
        running: state.running,
        autoIncrement: state.autoIncrement,
        t: state.t,
        n: Math.round(state.n),
        speed: state.speed,
        markerPhase: state.markerPhase
      };
    }

    function getReadouts() {
      const n = Math.round(state.n);
      return {
        n: n,
        highestFrequency: 2 * n - 1,
        maxOvershoot: computeMaxOvershoot(n),
        errorMetric: computeErrorMetric(n)
      };
    }

    function runModelChecks() {
      const checks = [];

      // 1. N=1 时 fourierValue = (4/π) sin(t)
      const v1 = fourierValue(Math.PI / 4, 1);
      const expected1 = (4 / Math.PI) * Math.sin(Math.PI / 4);
      checks.push({
        name: "N=1 等于 (4/π)·sin(t)",
        pass: Math.abs(v1 - expected1) < 1e-12,
        expected: expected1.toFixed(8),
        actual: v1.toFixed(8),
        tolerance: "1e-12"
      });

      // 2. N=2 时 fourierValue = (4/π)·(sin(t) + sin(3t)/3)
      const v2 = fourierValue(Math.PI / 6, 2);
      const expected2 = (4 / Math.PI) * (Math.sin(Math.PI / 6) + Math.sin(Math.PI / 2) / 3);
      checks.push({
        name: "N=2 等于 (4/π)·(sin(t)+sin(3t)/3)",
        pass: Math.abs(v2 - expected2) < 1e-12,
        expected: expected2.toFixed(8),
        actual: v2.toFixed(8),
        tolerance: "1e-12"
      });

      // 3. t=π/2 处逼近值应趋于 1（方波峰值）
      const vHalf = fourierValue(Math.PI / 2, 50);
      checks.push({
        name: "t=π/2 处 N=50 逼近 1",
        pass: Math.abs(vHalf - 1) < 0.01,
        expected: "1.0 ± 0.01",
        actual: vHalf.toFixed(6),
        tolerance: "0.01"
      });

      // 4. 奇对称性: f(-t) = -f(t)
      const vPos = fourierValue(0.7, 10);
      const vNeg = fourierValue(-0.7, 10);
      checks.push({
        name: "奇对称性 f(−t) = −f(t)",
        pass: Math.abs(vPos + vNeg) < 1e-12,
        expected: "f(0.7) + f(−0.7) = 0",
        actual: (vPos + vNeg).toExponential(4),
        tolerance: "1e-12"
      });

      // 5. 半周期平移对称性: f(t+π) = -f(t)
      const vA = fourierValue(0.4, 8);
      const vB = fourierValue(0.4 + Math.PI, 8);
      checks.push({
        name: "半周期对称 f(t+π) = −f(t)",
        pass: Math.abs(vA + vB) < 1e-12,
        expected: "f(0.4) + f(0.4+π) = 0",
        actual: (vA + vB).toExponential(4),
        tolerance: "1e-12"
      });

      // 6. 单调收敛: N 增大时 t=π/4 处逼近值更接近 1
      const approxN5 = fourierValue(Math.PI / 4, 5);
      const approxN20 = fourierValue(Math.PI / 4, 20);
      const errN5 = Math.abs(approxN5 - 1);
      const errN20 = Math.abs(approxN20 - 1);
      checks.push({
        name: "单调收敛 t=π/4 处误差随 N 减小",
        pass: errN20 < errN5,
        expected: "err(N=20) < err(N=5)",
        actual: "err(20)=" + errN20.toFixed(6) + " < err(5)=" + errN5.toFixed(6),
        tolerance: "strict"
      });

      // 7. 吉布斯过冲: N=20 时过冲应存在且小于 0.20
      const overshoot20 = computeMaxOvershoot(20);
      checks.push({
        name: "吉布斯现象 N=20 过冲存在且有界",
        pass: overshoot20 > 0.01 && overshoot20 < 0.20,
        expected: "0.01 < 过冲 < 0.20",
        actual: overshoot20.toFixed(6),
        tolerance: "(0.01, 0.20)"
      });

      // 8. 吉布斯极限: N=50 过冲应接近理论值 ~0.0895
      const overshoot50 = computeMaxOvershoot(50);
      checks.push({
        name: "吉布斯极限 N=50 过冲接近 8.95%",
        pass: overshoot50 > 0.07 && overshoot50 < 0.11,
        expected: "0.07 < 过冲 < 0.11 (理论 ~0.0895)",
        actual: overshoot50.toFixed(6),
        tolerance: "(0.07, 0.11)"
      });

      // 9. N 增大时过冲趋于稳定（不无限增长）
      const overshoot10 = computeMaxOvershoot(10);
      const overshoot30 = computeMaxOvershoot(30);
      checks.push({
        name: "过冲不随 N 无限增长",
        pass: overshoot30 <= overshoot10 * 1.5,
        expected: "过冲(30) ≤ 1.5 × 过冲(10)",
        actual: "ov(30)=" + overshoot30.toFixed(4) + ", ov(10)=" + overshoot10.toFixed(4),
        tolerance: "1.5x"
      });

      // 10. 跳变点处 f(0) = 0（级数收敛到中点）
      const vJump = fourierValue(0, 50);
      checks.push({
        name: "跳变点 f(0) = 0（收敛到中点）",
        pass: Math.abs(vJump) < 1e-12,
        expected: "0",
        actual: vJump.toExponential(4),
        tolerance: "1e-12"
      });

      return checks;
    }

    function bindControls() {
      elements.playBtn.addEventListener("click", () => {
        if (state.autoIncrement) { pause(); } else { start(); }
      });
      elements.resetBtn.addEventListener("click", reset);
      elements.nInput.addEventListener("input", () => {
        state.autoIncrement = false;
        state.running = false;
        elements.status.textContent = "已暂停";
        elements.playBtn.textContent = "继续递增";
        elements.playBtn.setAttribute("aria-pressed", "false");
        setParameters({ n: elements.nInput.value, speed: state.speed });
      });
      elements.speedInput.addEventListener("input", () => {
        setParameters({ n: state.n, speed: elements.speedInput.value });
      });
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    window.simulation = {
      init: init,
      start: start,
      pause: pause,
      reset: reset,
      update: update,
      render: render,
      setParameters: setParameters,
      getState: getState,
      getReadouts: getReadouts,
      runModelChecks: runModelChecks
    };

    init();
  })();
  </script>
</body>
</html>
