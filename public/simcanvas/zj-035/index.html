<!doctype html>
<html lang="zh-CN">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>凸透镜成像规律实验台</title>
<style>
:root {
  color-scheme: light;
  --sim-bg: #eef3f8;
  --sim-surface: #ffffff;
  --sim-surface-soft: #f8fafc;
  --sim-text: #172033;
  --sim-muted: #657188;
  --sim-border: #dfe6ef;
  --sim-grid: #e8edf4;
  --sim-accent: #0f9fba;
  --sim-accent-deep: #08758a;
  --sim-accent-soft: #d9f4f7;
  --sim-positive: #0f9fba;
  --sim-warning: #f59e0b;
  --sim-danger: #dc2626;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
  --sim-object: #d97706;
  --sim-image: #08758a;
  --sim-virtual: #7c3aed;
  --sim-ray: #0f9fba;
  --sim-axis: #94a3b8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--sim-text);
  background:
    radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
    radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
    var(--sim-bg);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
.app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
.header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
.header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
.header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
.status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 12px; }
.panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
.scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.panel-head h2 { margin: 0; font-size: 1rem; }
.panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
#scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); }
.side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
.readouts, .model-note { padding: 17px; }
.readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.metric { padding: 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
.metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
.metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.model-note { display: grid; align-content: start; gap: 14px; }
.model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
.insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; }
.controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr) minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
.actions { display: flex; gap: 8px; }
button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
button:hover { border-color: #c7d2e2; background: #eef3f9; }
button:active { transform: scale(.97); }
button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
.control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
.control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
@media (max-width: 860px) {
  .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
  .main { grid-template-columns: 1fr; }
  .controls { grid-template-columns: 1fr; }
  .scene-panel { min-height: 0; }
  #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>凸透镜成像规律实验台</h1>
      <p>调节物距与焦距，观察实像倒立缩小/等大/放大与虚像正立放大的成像规律</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head"><h2 id="scene-title">光路图</h2><span>薄透镜近轴近似 · 两条特征光线</span></div>
      <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
        <desc id="scene-desc">凸透镜成像光路：物体箭头、透镜、主光轴、两条特征光线与像箭头。</desc>
        <line id="axisLine" stroke="var(--sim-axis)" stroke-width="1.5" stroke-dasharray="6 5"></line>
        <line id="lensBody" stroke="var(--sim-accent-deep)" stroke-width="4" stroke-linecap="round"></line>
        <circle id="lensCenter" r="4" fill="var(--sim-accent-deep)"></circle>
        <circle id="focalLeft" r="5" fill="var(--sim-warning)" stroke="#fff" stroke-width="2"></circle>
        <circle id="focalRight" r="5" fill="var(--sim-warning)" stroke="#fff" stroke-width="2"></circle>
        <text id="focalLeftLabel" font-size="12" fill="#a35d00" font-weight="700">F</text>
        <text id="focalRightLabel" font-size="12" fill="#a35d00" font-weight="700">F'</text>
        <text id="focalLeftLabel2" font-size="11" fill="var(--sim-muted)">2F</text>
        <text id="focalRightLabel2" font-size="11" fill="var(--sim-muted)">2F'</text>
        <circle id="focalLeft2" r="3" fill="var(--sim-muted)"></circle>
        <circle id="focalRight2" r="3" fill="var(--sim-muted)"></circle>
        <g id="objectGroup"></g>
        <g id="imageGroup"></g>
        <g id="raysGroup"></g>
      </svg>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel readouts" aria-label="实时读数">
        <div class="readout-grid">
          <div class="metric"><small>物距 u</small><strong id="uReadout">15.0 cm</strong></div>
          <div class="metric"><small>焦距 f</small><strong id="fReadout">10.0 cm</strong></div>
          <div class="metric"><small>像距 v</small><strong id="vReadout">30.0 cm</strong></div>
          <div class="metric"><small>放大率 m</small><strong id="mReadout">-2.00</strong></div>
        </div>
      </section>
      <section class="panel model-note" data-region="insight">
        <div class="panel-head"><h2>观察要点</h2></div>
        <p id="insight" class="insight">物距大于 2 倍焦距时，透镜右侧形成倒立缩小的实像。</p>
        <p>教学模型：薄透镜近轴近似，1/u + 1/v = 1/f，放大率 m = -v/u。m&lt;0 为倒立实像（箭头朝下），m&gt;0 为正立虚像（箭头朝上）。</p>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="仿真控制">
    <div class="actions">
      <button id="startBtn" class="primary" type="button">开始</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control">
      <label for="uInput">物距 u <output id="uOutput">15.0 cm</output></label>
      <input id="uInput" type="range" min="3" max="35" step="0.5" value="15">
    </div>
    <div class="control">
      <label for="fInput">焦距 f <output id="fOutput">10.0 cm</output></label>
      <input id="fInput" type="range" min="5" max="20" step="0.5" value="10">
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const parameterSchema = [
    { key: "u", label: "物距", type: "slider", min: 3, max: 35, step: 0.5, default: 15, unit: "cm" },
    { key: "f", label: "焦距", type: "slider", min: 5, max: 20, step: 0.5, default: 10, unit: "cm" }
  ];

  const SCENE = {
    width: 760, height: 420,
    axisY: 210,
    lensX: 380,
    scale: 7.0,
    objH: 50
  };

  const state = {
    running: false,
    t: 0,
    u: 15,
    f: 10,
    v: 30,
    m: -2.0,
    isVirtual: false,
    noImage: false,
    lastTimestamp: null,
    scanDir: 1
  };

  const elements = {
    status: document.getElementById("status"),
    axisLine: document.getElementById("axisLine"),
    lensBody: document.getElementById("lensBody"),
    lensCenter: document.getElementById("lensCenter"),
    focalLeft: document.getElementById("focalLeft"),
    focalRight: document.getElementById("focalRight"),
    focalLeftLabel: document.getElementById("focalLeftLabel"),
    focalRightLabel: document.getElementById("focalRightLabel"),
    focalLeft2: document.getElementById("focalLeft2"),
    focalRight2: document.getElementById("focalRight2"),
    focalLeftLabel2: document.getElementById("focalLeftLabel2"),
    focalRightLabel2: document.getElementById("focalRightLabel2"),
    objectGroup: document.getElementById("objectGroup"),
    imageGroup: document.getElementById("imageGroup"),
    raysGroup: document.getElementById("raysGroup"),
    uReadout: document.getElementById("uReadout"),
    fReadout: document.getElementById("fReadout"),
    vReadout: document.getElementById("vReadout"),
    mReadout: document.getElementById("mReadout"),
    insight: document.getElementById("insight"),
    uInput: document.getElementById("uInput"),
    uOutput: document.getElementById("uOutput"),
    fInput: document.getElementById("fInput"),
    fOutput: document.getElementById("fOutput"),
    startBtn: document.getElementById("startBtn"),
    pauseBtn: document.getElementById("pauseBtn"),
    resetBtn: document.getElementById("resetBtn")
  };

  function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
  function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

  function computeOptics(u, f) {
    const safeU = clamp(finite(u, 15), 0.5, 100);
    const safeF = clamp(finite(f, 10), 0.5, 100);
    const inv = 1 / safeF - 1 / safeU;
    if (Math.abs(inv) < 1e-7) {
      return { v: Infinity, m: Infinity, isVirtual: false, noImage: true };
    }
    const v = 1 / inv;
    const m = -v / safeU;
    return { v, m, isVirtual: v < 0, noImage: false };
  }

  function init() {
    bindControls();
    setParameters({ u: 15, f: 10 });
    reset();
    requestAnimationFrame(frame);
  }

  function start() {
    state.running = true;
    elements.status.textContent = "演示扫描中";
    elements.startBtn.setAttribute("aria-pressed", "true");
  }

  function pause() {
    state.running = false;
    elements.status.textContent = "已暂停";
    elements.startBtn.setAttribute("aria-pressed", "false");
  }

  function reset() {
    pause();
    state.t = 0;
    state.scanDir = 1;
    setParameters({ u: 15, f: 10 });
  }

  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05);
    state.t += boundedDt;
    let newU = state.u + state.scanDir * boundedDt * 3.0;
    if (newU > 34) { newU = 34; state.scanDir = -1; }
    if (newU < 4) { newU = 4; state.scanDir = 1; }
    setParameters({ u: newU, f: state.f });
  }

  function render() {
    const f = state.f;
    const u = state.u;
    const lensX = SCENE.lensX;
    const axisY = SCENE.axisY;
    const scale = SCENE.scale;

    elements.axisLine.setAttribute("x1", 20);
    elements.axisLine.setAttribute("y1", axisY);
    elements.axisLine.setAttribute("x2", SCENE.width - 20);
    elements.axisLine.setAttribute("y2", axisY);

    const lensHalfH = 130;
    elements.lensBody.setAttribute("x1", lensX);
    elements.lensBody.setAttribute("y1", axisY - lensHalfH);
    elements.lensBody.setAttribute("x2", lensX);
    elements.lensBody.setAttribute("y2", axisY + lensHalfH);
    elements.lensCenter.setAttribute("cx", lensX);
    elements.lensCenter.setAttribute("cy", axisY);

    const fPx = f * scale;
    elements.focalLeft.setAttribute("cx", lensX - fPx);
    elements.focalLeft.setAttribute("cy", axisY);
    elements.focalRight.setAttribute("cx", lensX + fPx);
    elements.focalRight.setAttribute("cy", axisY);
    elements.focalLeftLabel.setAttribute("x", lensX - fPx - 6);
    elements.focalLeftLabel.setAttribute("y", axisY + 22);
    elements.focalRightLabel.setAttribute("x", lensX + fPx - 2);
    elements.focalRightLabel.setAttribute("y", axisY + 22);

    const f2Px = 2 * fPx;
    elements.focalLeft2.setAttribute("cx", lensX - f2Px);
    elements.focalLeft2.setAttribute("cy", axisY);
    elements.focalRight2.setAttribute("cx", lensX + f2Px);
    elements.focalRight2.setAttribute("cy", axisY);
    elements.focalLeftLabel2.setAttribute("x", lensX - f2Px - 12);
    elements.focalLeftLabel2.setAttribute("y", axisY - 8);
    elements.focalRightLabel2.setAttribute("x", lensX + f2Px - 12);
    elements.focalRightLabel2.setAttribute("y", axisY - 8);

    renderObject();
    renderImage();
    renderRays();
    renderReadouts();
  }

  function renderObject() {
    const objX = SCENE.lensX - state.u * SCENE.scale;
    const objH = SCENE.objH;
    const topY = SCENE.axisY - objH;
    const baseY = SCENE.axisY;
    elements.objectGroup.innerHTML =
      '<line x1="' + objX + '" y1="' + baseY + '" x2="' + objX + '" y2="' + topY + '" stroke="var(--sim-object)" stroke-width="4" stroke-linecap="round"></line>' +
      '<polygon points="' + (objX - 8) + ',' + (topY + 2) + ' ' + (objX + 8) + ',' + (topY + 2) + ' ' + objX + ',' + (topY - 10) + '" fill="var(--sim-object)"></polygon>' +
      '<text x="' + (objX - 14) + '" y="' + (baseY + 18) + '" font-size="13" fill="var(--sim-object)" font-weight="700">物</text>';
  }

  function renderImage() {
    if (state.noImage) {
      elements.imageGroup.innerHTML = '<text x="' + (SCENE.lensX + 60) + '" y="' + (SCENE.axisY - 40) + '" font-size="14" fill="var(--sim-danger)" font-weight="700">u≈f 物体在焦点处，不成像</text>';
      return;
    }

    const imgX = SCENE.lensX + state.v * SCENE.scale;
    const imgH = state.m * SCENE.objH;
    const topY = SCENE.axisY - imgH;

    if (state.isVirtual) {
      const baseY = SCENE.axisY;
      elements.imageGroup.innerHTML =
        '<line x1="' + imgX + '" y1="' + baseY + '" x2="' + imgX + '" y2="' + topY + '" stroke="var(--sim-virtual)" stroke-width="4" stroke-dasharray="6 4" stroke-linecap="round"></line>' +
        '<polygon points="' + (imgX - 8) + ',' + (topY + 2) + ' ' + (imgX + 8) + ',' + (topY + 2) + ' ' + imgX + ',' + (topY - 9) + '" fill="var(--sim-virtual)"></polygon>' +
        '<text x="' + (imgX + 10) + '" y="' + (topY - 4) + '" font-size="13" fill="var(--sim-virtual)" font-weight="700">虚像(正立)</text>';
    } else {
      const baseY = SCENE.axisY;
      elements.imageGroup.innerHTML =
        '<line x1="' + imgX + '" y1="' + baseY + '" x2="' + imgX + '" y2="' + topY + '" stroke="var(--sim-image)" stroke-width="4" stroke-linecap="round"></line>' +
        '<polygon points="' + (imgX - 8) + ',' + (topY - 2) + ' ' + (imgX + 8) + ',' + (topY - 2) + ' ' + imgX + ',' + (topY + 10) + '" fill="var(--sim-image)"></polygon>' +
        '<text x="' + (imgX + 10) + '" y="' + (topY + 14) + '" font-size="13" fill="var(--sim-image)" font-weight="700">实像(倒立)</text>';
    }
  }

  function renderRays() {
    if (state.noImage) {
      elements.raysGroup.innerHTML = "";
      return;
    }

    const objX = SCENE.lensX - state.u * SCENE.scale;
    const objTopY = SCENE.axisY - SCENE.objH;
    const lensX = SCENE.lensX;
    const axisY = SCENE.axisY;
    const fPx = state.f * SCENE.scale;
    const imgX = SCENE.lensX + state.v * SCENE.scale;
    const imgTopY = SCENE.axisY - state.m * SCENE.objH;
    const rightEdge = SCENE.width - 15;
    const leftEdge = 15;

    let rays = "";

    if (state.isVirtual) {
      const extEndX = leftEdge;
      const extEndY = axisY + (objTopY - axisY) * ((extEndX - lensX) / (objX - lensX));
      rays +=
        '<line x1="' + objX + '" y1="' + objTopY + '" x2="' + lensX + '" y2="' + objTopY + '" stroke="var(--sim-ray)" stroke-width="2" opacity="0.85"></line>' +
        '<line x1="' + lensX + '" y1="' + objTopY + '" x2="' + rightEdge + '" y2="' + (axisY + (objTopY - axisY) * ((rightEdge - lensX) / (lensX - (lensX - fPx)))) + '" stroke="var(--sim-ray)" stroke-width="2" opacity="0.85"></line>' +
        '<line x1="' + lensX + '" y1="' + objTopY + '" x2="' + extEndX + '" y2="' + extEndY + '" stroke="var(--sim-virtual)" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.7"></line>' +
        '<line x1="' + objX + '" y1="' + objTopY + '" x2="' + lensX + '" y2="' + axisY + '" stroke="var(--sim-ray)" stroke-width="2" opacity="0.85"></line>' +
        '<line x1="' + lensX + '" y1="' + axisY + '" x2="' + imgX + '" y2="' + imgTopY + '" stroke="var(--sim-ray)" stroke-width="2" opacity="0.85"></line>' +
        '<line x1="' + lensX + '" y1="' + axisY + '" x2="' + extEndX + '" y2="' + (axisY + (imgTopY - axisY) * ((extEndX - lensX) / (imgX - lensX))) + '" stroke="var(--sim-virtual)" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.7"></line>';
    } else {
      const ray1EndX = rightEdge;
      const ray1Slope = (axisY - objTopY) / fPx;
      const ray1EndY = objTopY + ray1Slope * (ray1EndX - lensX);
      rays +=
        '<line x1="' + objX + '" y1="' + objTopY + '" x2="' + lensX + '" y2="' + objTopY + '" stroke="var(--sim-ray)" stroke-width="2" opacity="0.85"></line>' +
        '<line x1="' + lensX + '" y1="' + objTopY + '" x2="' + ray1EndX + '" y2="' + ray1EndY + '" stroke="var(--sim-ray)" stroke-width="2" opacity="0.85"></line>';

      const ray2EndX = rightEdge;
      const ray2Slope = (imgTopY - axisY) / (imgX - lensX);
      const ray2EndY = axisY + ray2Slope * (ray2EndX - lensX);
      rays +=
        '<line x1="' + objX + '" y1="' + objTopY + '" x2="' + lensX + '" y2="' + axisY + '" stroke="var(--sim-ray)" stroke-width="2" opacity="0.85"></line>' +
        '<line x1="' + lensX + '" y1="' + axisY + '" x2="' + ray2EndX + '" y2="' + ray2EndY + '" stroke="var(--sim-ray)" stroke-width="2" opacity="0.85"></line>';
    }

    elements.raysGroup.innerHTML = rays;
  }

  function renderReadouts() {
    elements.uReadout.textContent = state.u.toFixed(1) + " cm";
    elements.fReadout.textContent = state.f.toFixed(1) + " cm";
    if (state.noImage) {
      elements.vReadout.textContent = "∞";
      elements.mReadout.textContent = "∞";
    } else {
      elements.vReadout.textContent = state.v.toFixed(1) + " cm";
      elements.mReadout.textContent = state.m.toFixed(2);
    }
    elements.uOutput.textContent = state.u.toFixed(1) + " cm";
    elements.fOutput.textContent = state.f.toFixed(1) + " cm";

    let insightText = "";
    if (state.noImage) {
      insightText = "物体位于焦点处，折射光线平行射出，无法成像。";
    } else if (state.isVirtual) {
      insightText = "物距小于焦距：右侧无实像，折射光线的反向延长线在物体同侧形成正立放大的虚像。";
    } else if (Math.abs(state.u - 2 * state.f) < 0.3) {
      insightText = "物距等于 2 倍焦距：透镜右侧形成倒立等大的实像。";
    } else if (state.u > 2 * state.f) {
      insightText = "物距大于 2 倍焦距：透镜右侧形成倒立缩小的实像。";
    } else {
      insightText = "焦距小于物距小于 2 倍焦距：透镜右侧形成倒立放大的实像。";
    }
    elements.insight.textContent = insightText;
  }

  function setParameters(values) {
    const uDef = parameterSchema[0];
    const fDef = parameterSchema[1];
    state.u = clamp(finite(Number(values.u), uDef.default), uDef.min, uDef.max);
    state.f = clamp(finite(Number(values.f), fDef.default), fDef.min, fDef.max);
    const result = computeOptics(state.u, state.f);
    state.v = result.v;
    state.m = result.m;
    state.isVirtual = result.isVirtual;
    state.noImage = result.noImage;
    elements.uInput.value = String(state.u);
    elements.fInput.value = String(state.f);
    render();
  }

  function getState() {
    return {
      running: state.running,
      t: state.t,
      u: state.u,
      f: state.f,
      v: state.v,
      m: state.m,
      isVirtual: state.isVirtual,
      noImage: state.noImage,
      scanDir: state.scanDir
    };
  }

  function getReadouts() {
    return {
      u: state.u,
      f: state.f,
      v: state.v,
      m: state.m,
      isVirtual: state.isVirtual,
      noImage: state.noImage
    };
  }

  function runModelChecks() {
    const cases = [
      { u: 30, f: 10, label: "u>2f 倒立缩小实像" },
      { u: 20, f: 10, label: "u=2f 倒立等大实像" },
      { u: 15, f: 10, label: "f<u<2f 倒立放大实像" },
      { u: 6, f: 10, label: "u<f 正立放大虚像" }
    ];
    const results = cases.map(function(c) {
      const r = computeOptics(c.u, c.f);
      const expectedV = 1 / (1 / c.f - 1 / c.u);
      const expectedM = -expectedV / c.u;
      const vOk = Math.abs(r.v - expectedV) < 1e-9;
      const mOk = Math.abs(r.m - expectedM) < 1e-9;
      const virtualOk = r.isVirtual === (expectedV < 0);
      let dirOk = false;
      if (r.noImage) {
        dirOk = true;
      } else if (r.isVirtual) {
        dirOk = r.m > 0;
      } else {
        dirOk = r.m < 0;
      }
      return {
        name: c.label,
        pass: vOk && mOk && virtualOk && dirOk,
        expected: "v=" + expectedV.toFixed(4) + ", m=" + expectedM.toFixed(4) + ", virtual=" + (expectedV < 0),
        actual: "v=" + r.v.toFixed(4) + ", m=" + r.m.toFixed(4) + ", virtual=" + r.isVirtual,
        tolerance: 1e-9
      };
    });

    const boundary = computeOptics(10, 10);
    results.push({
      name: "u=f 边界(不成像)",
      pass: boundary.noImage,
      expected: "noImage=true",
      actual: "noImage=" + boundary.noImage,
      tolerance: "strict"
    });

    const u2f = computeOptics(20, 10);
    results.push({
      name: "u=2f 等大实像 |m|=1",
      pass: Math.abs(Math.abs(u2f.m) - 1) < 1e-9,
      expected: "|m|=1",
      actual: "|m|=" + Math.abs(u2f.m),
      tolerance: 1e-9
    });

    return results;
  }

  function bindControls() {
    elements.startBtn.addEventListener("click", start);
    elements.pauseBtn.addEventListener("click", pause);
    elements.resetBtn.addEventListener("click", reset);
    elements.uInput.addEventListener("input", function() {
      setParameters({ u: elements.uInput.value, f: state.f });
    });
    elements.fInput.addEventListener("input", function() {
      setParameters({ u: state.u, f: elements.fInput.value });
    });
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  window.simulation = {
    init: init,
    start: start,
    pause: pause,
    reset: reset,
    update: update,
    render: render,
    setParameters: setParameters,
    getState: getState,
    getReadouts: getReadouts,
    runModelChecks: runModelChecks
  };

  init();
})();
</script>
</body>
</html>
