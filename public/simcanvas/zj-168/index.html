<!doctype html>
<html lang="zh">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breathing Cube Sea</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #050810;
  --sim-surface: #0a1020;
  --sim-surface-soft: #0f1830;
  --sim-text: #d8e6f8;
  --sim-muted: #5a6d8a;
  --sim-border: rgba(80,120,180,0.18);
  --sim-grid: rgba(60,90,140,0.10);
  --sim-accent: #4dd0e1;
  --sim-accent-deep: #00838f;
  --sim-accent-soft: rgba(77,208,225,0.16);
  --sim-positive: #4dd0e1;
  --sim-warning: #ffb74d;
  --sim-danger: #ef5350;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 14px 36px rgba(0,0,0,0.5);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: var(--sim-bg);
  overflow: hidden;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color: var(--sim-text);
}
.app {
  position: fixed; inset: 0;
  display: block;
  overflow: hidden;
}
#scene {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  background: radial-gradient(ellipse at 50% 55%, #0a1428 0%, #050810 70%, #02040a 100%);
}
.header {
  position: absolute;
  top: 18px; left: 22px;
  z-index: 5;
  pointer-events: none;
  user-select: none;
}
.header h1 {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: rgba(200, 225, 245, 0.82);
  text-shadow: 0 0 10px rgba(0,0,0,0.6);
}
.header p {
  margin-top: 3px;
  font-size: 11px;
  color: rgba(120, 160, 200, 0.55);
  letter-spacing: 0.03em;
}
.status {
  position: absolute;
  top: 20px; right: 22px;
  z-index: 5;
  border: 1px solid rgba(77, 208, 225, 0.28);
  border-radius: 999px;
  padding: 6px 14px;
  background: rgba(77, 208, 225, 0.10);
  color: var(--sim-accent);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  pointer-events: none;
  user-select: none;
}
.evidence {
  position: absolute;
  left: 22px; bottom: 20px;
  z-index: 5;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
  user-select: none;
}
.readouts {
  display: flex;
  gap: 18px;
  font-size: 11px;
  color: rgba(180, 210, 240, 0.55);
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 8px rgba(0,0,0,0.6);
}
.readouts .metric { display: flex; gap: 6px; align-items: baseline; }
.readouts .metric small { color: rgba(120, 150, 180, 0.5); }
.readouts .metric strong { color: rgba(200, 225, 245, 0.78); font-weight: 600; }
.formula {
  font-size: 12px;
  color: rgba(180, 210, 240, 0.42);
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 8px rgba(0,0,0,0.6);
}
.formula .var { color: rgba(120, 200, 220, 0.55); }
.play-btn {
  position: absolute;
  right: 22px; bottom: 20px;
  width: 38px; height: 38px;
  border: 1px solid rgba(120, 180, 220, 0.22);
  background: rgba(10, 18, 32, 0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.25s ease, border-color 0.25s ease, transform 0.15s ease;
  padding: 0;
  z-index: 6;
}
.play-btn:hover {
  background: rgba(20, 36, 60, 0.7);
  border-color: rgba(120, 180, 220, 0.4);
}
.play-btn:active { transform: scale(0.94); }
.play-btn:focus-visible {
  outline: 2px solid rgba(77, 208, 225, 0.5);
  outline-offset: 3px;
}
.play-btn svg {
  width: 14px; height: 14px;
  fill: rgba(200, 225, 245, 0.78);
}
@media (max-width: 600px) {
  .header { top: 14px; left: 14px; }
  .header h1 { font-size: 13px; }
  .header p { font-size: 10px; }
  .status { top: 14px; right: 14px; font-size: 10px; padding: 5px 11px; }
  .evidence { left: 14px; bottom: 14px; gap: 8px; }
  .readouts { font-size: 10px; gap: 12px; }
  .formula { font-size: 10px; }
  .play-btn { right: 14px; bottom: 14px; width: 34px; height: 34px; }
}
@media (prefers-reduced-motion: reduce) {
  .play-btn { transition: none; }
}
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <canvas id="scene" data-region="stage" aria-label="3D cube array wave visualization"></canvas>
  <header class="header" data-region="header">
    <h1>Breathing Cube Sea</h1>
    <p>径向衰减波动驱动的立方体阵列</p>
  </header>
  <div id="status" class="status" role="status" aria-live="polite">Running</div>
  <aside class="evidence" data-region="evidence">
    <div class="readouts" aria-label="Live values">
      <div class="metric"><small>t</small><strong id="timeReadout">0.00 s</strong></div>
      <div class="metric"><small>yaw</small><strong id="yawReadout">0.0°</strong></div>
    </div>
    <div class="formula" data-region="insight" aria-hidden="true">
      h = A · sin(<span class="var">k</span>·r − <span class="var">ω</span>t) · e<sup>−r/<span class="var">λ</span></sup>
    </div>
  </aside>
  <button id="playBtn" class="play-btn" data-region="controls" type="button" aria-label="暂停" title="暂停 / 播放">
    <svg id="playIcon" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  </button>
</div>
<script>
(() => {
  "use strict";

  // ─── 参数 ─────────────────────────────────────────────
  const N = 14;
  const SPACING = 1.0;
  const HALF = (N - 1) * SPACING / 2;
  // [Modify] 拉远视距 + 降低俯仰角，让 14×14 阵列完整落入屏幕
  const VIEW_DIST = 20;   // was 14
  const PITCH = 0.42;     // was 0.62
  const YAW_RATE = 0.045;
  const CAM_HEIGHT = 6.0; // was 7.5

  // 波浪参数：λ 使波浪在到达阵列边缘前自然衰减
  const WAVE = {
    A: 1.35,
    k: 0.95,
    omega: 1.4,
    lambda: 4.5
  };

  // ─── 状态 ─────────────────────────────────────────────
  const state = {
    running: true,
    t: 0,
    yaw: 0,
    lastTs: null,
    needsResize: true,
    W: 0, H: 0, DPR: 1
  };

  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d", { alpha: false });
  const playBtn = document.getElementById("playBtn");
  const playIcon = document.getElementById("playIcon");
  const statusEl = document.getElementById("status");
  const timeReadout = document.getElementById("timeReadout");
  const yawReadout = document.getElementById("yawReadout");

  // ─── 工具 ─────────────────────────────────────────────
  const clamp = (v, mn, mx) => Math.min(mx, Math.max(mn, v));
  const finite = (v, fb) => Number.isFinite(v) ? v : fb;

  // ─── 波浪函数 ─────────────────────────────────────────
  function waveHeight(x, z, t) {
    const r = Math.sqrt(x * x + z * z);
    return WAVE.A * Math.sin(WAVE.k * r - WAVE.omega * t) * Math.exp(-r / WAVE.lambda);
  }

  // ─── 透视投影 ────────────────────────────────────────
  // 世界坐标 (x, y, z) -> 屏幕坐标 (sx, sy)
  // 先绕 Y 轴旋转 yaw，再绕 X 轴俯仰 pitch，再透视除法
  function project(x, y, z, yaw, cx, cy, scale) {
    const cy_ = Math.cos(yaw), sy_ = Math.sin(yaw);
    const x1 = x * cy_ - z * sy_;
    const z1 = x * sy_ + z * cy_;
    const y1 = y;
    const cp = Math.cos(PITCH), sp = Math.sin(PITCH);
    const y2 = y1 * cp - z1 * sp;
    const z2 = y1 * sp + z1 * cp;
    const x2 = x1;
    const zCam = z2 + VIEW_DIST;
    const safeZ = Math.max(0.5, zCam);
    const f = VIEW_DIST / safeZ;
    return {
      sx: cx + x2 * f * scale,
      sy: cy - (y2 + CAM_HEIGHT) * f * scale,
      depth: zCam
    };
  }

  // ─── 颜色：高度 -> 深蓝→青色 ─────────────────────────
  // h ∈ [-A, A]，映射到 [0, 1]
  function heightColor(h, alpha) {
    const t = clamp((h / WAVE.A + 1) * 0.5, 0, 1);
    // 深蓝 (10, 30, 70) -> 中蓝 (30, 110, 180) -> 青色 (90, 230, 240)
    let r, g, b;
    if (t < 0.5) {
      const u = t * 2;
      r = 10 + u * 20;
      g = 30 + u * 80;
      b = 70 + u * 110;
    } else {
      const u = (t - 0.5) * 2;
      r = 30 + u * 60;
      g = 110 + u * 120;
      b = 180 + u * 60;
    }
    return `rgba(${r|0},${g|0},${b|0},${alpha})`;
  }

  // ─── 立方体几何 ──────────────────────────────────────
  // 返回 8 顶点 + 12 边 + 顶面四角
  function cubeVertices(x, z, h) {
    const s = SPACING * 0.42;
    const y0 = 0;
    const y1 = Math.max(0.05, h + 0.5);
    return [
      { x: x - s, y: y0, z: z - s }, // 0 底-左后
      { x: x + s, y: y0, z: z - s }, // 1 底-右后
      { x: x + s, y: y0, z: z + s }, // 2 底-右前
      { x: x - s, y: y0, z: z + s }, // 3 底-左前
      { x: x - s, y: y1, z: z - s }, // 4 顶-左后
      { x: x + s, y: y1, z: z - s }, // 5 顶-右后
      { x: x + s, y: y1, z: z + s }, // 6 顶-右前
      { x: x - s, y: y1, z: z + s }  // 7 顶-左前
    ];
  }

  const CUBE_EDGES = [
    [0,1],[1,2],[2,3],[3,0], // 底面
    [4,5],[5,6],[6,7],[7,4], // 顶面
    [0,4],[1,5],[2,6],[3,7]  // 竖边
  ];

  // ─── 渲染 ────────────────────────────────────────────
  function resizeIfNeeded() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth;
    const h = window.innerHeight;
    if (state.DPR !== dpr || state.W !== w || state.H !== h || state.needsResize) {
      canvas.width = Math.max(1, Math.floor(w * dpr));
      canvas.height = Math.max(1, Math.floor(h * dpr));
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      state.W = w; state.H = h; state.DPR = dpr;
      state.needsResize = false;
    }
  }

  function render() {
    resizeIfNeeded();
    const W = state.W, H = state.H;
    const cx = W * 0.5;
    // [Modify] 画面垂直居中，避免下方空旷
    const cy = H * 0.52;
    // [Modify] 配合视距拉远后的投影尺度
    const scale = Math.min(W, H) * 0.075;

    // 清屏（带轻微径向暗角）
    ctx.fillStyle = "#050810";
    ctx.fillRect(0, 0, W, H);

    // 中心微光底（径向渐变模拟环境光）
    const bgGrad = ctx.createRadialGradient(cx, cy * 0.95, 0, cx, cy * 0.95, Math.max(W, H) * 0.55);
    bgGrad.addColorStop(0, "rgba(20, 50, 90, 0.22)");
    bgGrad.addColorStop(0.5, "rgba(10, 25, 50, 0.10)");
    bgGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // 收集所有立方体的投影信息
    const cubes = [];
    for (let zi = 0; zi < N; zi++) {
      for (let xi = 0; xi < N; xi++) {
        const x0 = xi * SPACING - HALF;
        const z0 = zi * SPACING - HALF;
        const h = waveHeight(x0, z0, state.t);
        const verts = cubeVertices(x0, z0, h);
        const proj = verts.map(v => project(v.x, v.y, v.z, state.yaw, cx, cy, scale));
        // 用立方体中心的深度做排序键
        const centerWorld = project(x0, (h + 0.5) * 0.5, z0, state.yaw, cx, cy, scale);
        cubes.push({
          proj,
          h,
          depth: centerWorld.depth,
          x0, z0
        });
      }
    }

    // 远到近排序（depth 大的远）
    cubes.sort((a, b) => b.depth - a.depth);

    // 绘制每个立方体
    for (const c of cubes) {
      drawCube(c.proj, c.h);
    }

    // 更新读数
    timeReadout.textContent = state.t.toFixed(2) + " s";
    yawReadout.textContent = ((state.yaw * 180 / Math.PI) % 360).toFixed(1) + "°";
  }

  function drawCube(p, h) {
    // p: 8 个投影顶点
    // 顶面四角: 4,5,6,7
    const top = [p[4], p[5], p[6], p[7]];

    // ── 1. 顶面填充（高度颜色）──
    ctx.beginPath();
    ctx.moveTo(top[0].sx, top[0].sy);
    for (let i = 1; i < 4; i++) ctx.lineTo(top[i].sx, top[i].sy);
    ctx.closePath();
    ctx.fillStyle = heightColor(h, 0.92);
    ctx.fill();

    // ── 2. 侧面填充（暗化）──
    // 前面 3,2,6,7
    ctx.beginPath();
    ctx.moveTo(p[3].sx, p[3].sy);
    ctx.lineTo(p[2].sx, p[2].sy);
    ctx.lineTo(p[6].sx, p[6].sy);
    ctx.lineTo(p[7].sx, p[7].sy);
    ctx.closePath();
    ctx.fillStyle = heightColor(h, 0.35);
    ctx.fill();

    // 右面 1,2,6,5
    ctx.beginPath();
    ctx.moveTo(p[1].sx, p[1].sy);
    ctx.lineTo(p[2].sx, p[2].sy);
    ctx.lineTo(p[6].sx, p[6].sy);
    ctx.lineTo(p[5].sx, p[5].sy);
    ctx.closePath();
    ctx.fillStyle = heightColor(h, 0.22);
    ctx.fill();

    // ── 3. 双层发光线框 ──
    // 粗线低透明度（外层光晕）
    ctx.strokeStyle = heightColor(h, 0.22);
    ctx.lineWidth = 3.2;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    drawEdges(p);

    // 细线高透明度（核心亮线）
    ctx.strokeStyle = heightColor(h, 0.88);
    ctx.lineWidth = 1.1;
    drawEdges(p);
  }

  function drawEdges(p) {
    ctx.beginPath();
    for (let i = 0; i < CUBE_EDGES.length; i++) {
      const [a, b] = CUBE_EDGES[i];
      const pa = p[a], pb = p[b];
      ctx.moveTo(pa.sx, pa.sy);
      ctx.lineTo(pb.sx, pb.sy);
    }
    ctx.stroke();
  }

  // ─── 主循环 ──────────────────────────────────────────
  function frame(ts) {
    if (state.lastTs === null) state.lastTs = ts;
    let dt = (ts - state.lastTs) / 1000;
    state.lastTs = ts;
    dt = clamp(finite(dt, 0), 0, 0.05);
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // ─── 模型更新 ────────────────────────────────────────
  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05);
    state.t += boundedDt;
    state.yaw += YAW_RATE * boundedDt;
  }

  // ─── 参数设置 ────────────────────────────────────────
  function setParameters(values) {
    // 当前无外部可调参数，保留接口以满足运行时契约
    if (values && typeof values === "object") {
      // 预留：未来可扩展振幅、频率等
    }
  }

  // ─── 控件 ────────────────────────────────────────────
  function setPlaying(playing) {
    state.running = playing;
    playBtn.setAttribute("aria-label", playing ? "暂停" : "播放");
    playBtn.title = playing ? "暂停" : "播放";
    statusEl.textContent = playing ? "Running" : "Paused";
    if (playing) {
      // 暂停图标（两条竖线）
      playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
    } else {
      // 播放图标（三角形）
      playIcon.innerHTML = '<path d="M7 5 L19 12 L7 19 Z"/>';
    }
  }

  playBtn.addEventListener("click", () => setPlaying(!state.running));

  // 键盘：空格切换播放
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" && document.activeElement !== playBtn) {
      e.preventDefault();
      setPlaying(!state.running);
    }
  });

  // resize 监听
  window.addEventListener("resize", () => { state.needsResize = true; });

  // ─── 生命周期接口 ────────────────────────────────────
  function init() {
    resizeIfNeeded();
    setPlaying(true);
    requestAnimationFrame(frame);
  }
  function start() { setPlaying(true); }
  function pause() { setPlaying(false); }
  function reset() {
    state.t = 0;
    state.yaw = 0;
    render();
  }
  function getState() {
    return { t: state.t, yaw: state.yaw, running: state.running };
  }
  function getReadouts() {
    return { time: state.t, yaw: state.yaw, running: state.running };
  }
  function runModelChecks() {
    // 波浪函数确定性检查
    const h1 = waveHeight(0, 0, 0);
    const h2 = waveHeight(0, 0, 0);
    const centerZero = Math.abs(h1) < 1e-6; // r=0, sin(0)=0 -> h=0
    const r0_any_t = waveHeight(0, 0, 5.0);
    const centerAlwaysZero = Math.abs(r0_any_t) < 1e-6;
    // 衰减：远处振幅应小于近处
    const nearAmp = Math.abs(waveHeight(1.0, 0, 0));
    const farAmp = Math.abs(waveHeight(5.0, 0, 0));
    const decay = farAmp < nearAmp;
    // 时间周期性：omega=1.4 -> T = 2π/1.4 ≈ 4.488
    const T = 2 * Math.PI / WAVE.omega;
    const h_t0 = waveHeight(1.5, 1.5, 0);
    const h_tT = waveHeight(1.5, 1.5, T);
    const periodic = Math.abs(h_t0 - h_tT) < 1e-6;
    // 有限性
    const finiteCheck = Number.isFinite(waveHeight(3, 4, 100));
    return [
      { name: "中心 r=0 处 h=0", pass: centerZero, expected: 0, actual: h1, tolerance: 1e-6 },
      { name: "中心任意时刻 h=0", pass: centerAlwaysZero, expected: 0, actual: r0_any_t, tolerance: 1e-6 },
      { name: "距离衰减", pass: decay, expected: "farAmp < nearAmp", actual: `${farAmp} < ${nearAmp}`, tolerance: "strict" },
      { name: "时间周期性", pass: periodic, expected: h_t0, actual: h_tT, tolerance: 1e-6 },
      { name: "有限性", pass: finiteCheck, expected: "finite", actual: waveHeight(3,4,100), tolerance: "finite" }
    ];
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
