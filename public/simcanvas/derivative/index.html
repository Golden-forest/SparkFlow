<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>导数的几何意义</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #eef3f8;
      --sim-surface: #ffffff;
      --sim-surface-soft: #f8fafc;
      --sim-text: #172033;
      --sim-muted: #657188;
      --sim-border: #dfe6ef;
      --sim-grid: #e8edf4;
      --sim-accent: #0f9fba;
      --sim-accent-deep: #08758a;
      --sim-accent-soft: #d9f4f7;
      --sim-positive: #0f9fba;
      --sim-warning: #f59e0b;
      --sim-danger: #dc2626;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
      --sim-curve: #1e3a5f;
      --sim-tangent: #dc2626;
      --sim-secant: #0f9fba;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
        var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
    .status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 2.15fr) minmax(280px, 0.55fr); gap: 12px; }
    .panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
    #scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); touch-action: none; }
    .side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
    .readouts, .model-note { padding: 17px; }
    .readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric { padding: 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
    .metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
    .metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .metric.tangent { border-color: rgba(220,38,38,.2); background: linear-gradient(145deg, #fff5f5, #fdf0f0); }
    .metric.tangent strong { color: var(--sim-tangent); }
    .metric.secant { border-color: rgba(15,159,186,.2); background: linear-gradient(145deg, #f0fbfc, #eaf8fa); }
    .metric.secant strong { color: var(--sim-accent-deep); }
    .metric.diff { grid-column: span 2; border-color: rgba(245,158,11,.25); background: linear-gradient(145deg, #fffbeb, #fef3c7); }
    .metric.diff strong { color: #92400e; }
    .model-note { display: grid; align-content: start; gap: 14px; }
    .model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
    .insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; }
    .controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr) minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
    button:hover { border-color: #c7d2e2; background: #eef3f9; }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
    .control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
    .grid-line { stroke: var(--sim-grid); stroke-width: 1; }
    .axis { stroke: #9aa7ba; stroke-width: 1.5; }
    .axis-label { fill: var(--sim-muted); font-size: 13px; }
    .curve-path { fill: none; stroke: var(--sim-curve); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .tangent-line { stroke: var(--sim-tangent); stroke-width: 2.8; stroke-linecap: round; }
    .secant-line { stroke: var(--sim-secant); stroke-width: 2.2; stroke-dasharray: 8 6; stroke-linecap: round; }
    .point-p { fill: var(--sim-tangent); stroke: white; stroke-width: 3; cursor: grab; }
    .point-p:active { cursor: grabbing; }
    .point-q { fill: var(--sim-secant); stroke: white; stroke-width: 3; cursor: grab; }
    .point-q:active { cursor: grabbing; }
    .point-halo { fill: rgba(15,159,186,.14); pointer-events: none; }
    .point-label { font-size: 14px; font-weight: 800; pointer-events: none; }
    .slope-label { font-size: 12px; font-weight: 700; pointer-events: none; }
    .legend { display: flex; gap: 16px; font-size: 0.78rem; color: var(--sim-muted); flex-wrap: wrap; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
    .legend .l-curve { background: var(--sim-curve); height: 4px; }
    .legend .l-tangent { background: var(--sim-tangent); }
    .legend .l-secant { background: repeating-linear-gradient(90deg, var(--sim-secant) 0 5px, transparent 5px 9px); }
    @media (max-width: 860px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
      .scene-panel { min-height: 0; }
      #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="app" data-layout="visualization-first" data-model-tier="analytic">
    <header class="header" data-region="header">
      <div>
        <h1>导数的几何意义</h1>
        <p>拖动 P 点改变位置，拖动 Q 点逼近 P，观察割线斜率趋向切线斜率。</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head">
          <h2 id="scene-title">曲线 · 切线 · 割线</h2>
          <div class="legend">
            <span><i class="l-curve"></i>函数曲线</span>
            <span><i class="l-tangent"></i>切线（导数）</span>
            <span><i class="l-secant"></i>割线</span>
          </div>
        </div>
        <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
          <desc id="scene-desc">函数曲线上的 P 点处有红色切线，邻近 Q 点与 P 连成蓝色虚线割线。Q 趋近 P 时割线与切线重合。</desc>
          <g id="grid"></g>
          <line class="axis" x1="60" y1="380" x2="740" y2="380"></line>
          <line class="axis" x1="60" y1="20" x2="60" y2="380"></line>
          <text class="axis-label" x="730" y="402" text-anchor="end">x</text>
          <text class="axis-label" x="48" y="28" text-anchor="end">y</text>
          <path id="curve" class="curve-path" d=""></path>
          <line id="tangentLine" class="tangent-line" x1="0" y1="0" x2="0" y2="0"></line>
          <line id="secantLine" class="secant-line" x1="0" y1="0" x2="0" y2="0"></line>
          <circle id="haloP" class="point-halo" cx="0" cy="0" r="16"></circle>
          <circle id="haloQ" class="point-halo" cx="0" cy="0" r="16"></circle>
          <circle id="pointP" class="point-p" cx="0" cy="0" r="8"></circle>
          <circle id="pointQ" class="point-q" cx="0" cy="0" r="8"></circle>
          <text id="labelP" class="point-label" fill="#dc2626" x="0" y="0">P</text>
          <text id="labelQ" class="point-label" fill="#08758a" x="0" y="0">Q</text>
          <text id="tangentSlopeLabel" class="slope-label" fill="#dc2626" x="0" y="0"></text>
          <text id="secantSlopeLabel" class="slope-label" fill="#08758a" x="0" y="0"></text>
        </svg>
      </section>

      <aside class="side" data-region="evidence">
        <section class="panel readouts" aria-label="实时数值">
          <div class="readout-grid">
            <div class="metric tangent"><small>切线斜率 f′(x₀)</small><strong id="tangentReadout">0.00</strong></div>
            <div class="metric secant"><small>割线斜率 k</small><strong id="secantReadout">0.00</strong></div>
            <div class="metric"><small>P 点 x 坐标</small><strong id="pReadout">0.00</strong></div>
            <div class="metric"><small>Q 点 x 坐标</small><strong id="qReadout">0.00</strong></div>
            <div class="metric diff"><small>斜率差 |k − f′(x₀)|</small><strong id="diffReadout">0.00</strong></div>
          </div>
        </section>
        <section class="panel model-note" data-region="insight">
          <div class="panel-head"><h2>观察要点</h2></div>
          <p id="insight" class="insight">拖动 Q 点向 P 靠近，割线（蓝虚线）逐渐与切线（红实线）重合，斜率差趋向零。</p>
          <p>教学视图：割线斜率 = [f(x₀+h) − f(x₀)] / h；当 h→0 时，割线斜率 → f′(x₀)，即导数。切线是割线的极限位置。</p>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="模拟控制">
      <div class="actions">
        <button id="approachBtn" class="primary" type="button">Q 逼近 P</button>
        <button id="resetBtn" type="button">重置</button>
      </div>
      <div class="control">
        <label for="funcInput">函数 <output id="funcOutput">二次函数</output></label>
        <input id="funcInput" type="range" min="0" max="1" step="1" value="0">
      </div>
      <div class="control">
        <label for="speedInput">逼近速度 <output id="speedOutput">1.0×</output></label>
        <input id="speedInput" type="range" min="0.3" max="3" step="0.1" value="1">
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";
    const parameterSchema = [
      { key: "func", label: "函数", type: "slider", min: 0, max: 1, step: 1, default: 0, unit: "" },
      { key: "speed", label: "逼近速度", type: "slider", min: 0.3, max: 3, step: 0.1, default: 1, unit: "×" }
    ];

    // 坐标系参数
    const X_MIN = -3, X_MAX = 3;
    const Y_MIN = -2, Y_MAX = 6;
    const SVG_W = 760, SVG_H = 420;
    const PAD_L = 60, PAD_R = 20, PAD_T = 20, PAD_B = 40;
    const PLOT_W = SVG_W - PAD_L - PAD_R;
    const PLOT_H = SVG_H - PAD_T - PAD_B;

    // 函数定义
    const functions = [
      { name: "二次函数", f: (x) => x * x, df: (x) => 2 * x, xMin: -3, xMax: 3 },
      { name: "正弦函数", f: (x) => 2 * Math.sin(x) + 2, df: (x) => 2 * Math.cos(x), xMin: -3, xMax: 3 }
    ];

    const state = {
      running: false,
      funcIndex: 0,
      xP: 1.0,
      xQ: 2.0,
      approachDir: -1,
      speed: 1,
      lastTimestamp: null
    };

    const elements = {
      status: document.querySelector("#status"),
      curve: document.querySelector("#curve"),
      tangentLine: document.querySelector("#tangentLine"),
      secantLine: document.querySelector("#secantLine"),
      pointP: document.querySelector("#pointP"),
      pointQ: document.querySelector("#pointQ"),
      haloP: document.querySelector("#haloP"),
      haloQ: document.querySelector("#haloQ"),
      labelP: document.querySelector("#labelP"),
      labelQ: document.querySelector("#labelQ"),
      tangentSlopeLabel: document.querySelector("#tangentSlopeLabel"),
      secantSlopeLabel: document.querySelector("#secantSlopeLabel"),
      grid: document.querySelector("#grid"),
      tangentReadout: document.querySelector("#tangentReadout"),
      secantReadout: document.querySelector("#secantReadout"),
      pReadout: document.querySelector("#pReadout"),
      qReadout: document.querySelector("#qReadout"),
      diffReadout: document.querySelector("#diffReadout"),
      insight: document.querySelector("#insight"),
      funcInput: document.querySelector("#funcInput"),
      funcOutput: document.querySelector("#funcOutput"),
      speedInput: document.querySelector("#speedInput"),
      speedOutput: document.querySelector("#speedOutput"),
      approachBtn: document.querySelector("#approachBtn"),
      resetBtn: document.querySelector("#resetBtn"),
      scene: document.querySelector("#scene")
    };

    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

    // 数学坐标 -> SVG 坐标
    function toSvgX(x) { return PAD_L + ((x - X_MIN) / (X_MAX - X_MIN)) * PLOT_W; }
    function toSvgY(y) { return PAD_T + ((Y_MAX - y) / (Y_MAX - Y_MIN)) * PLOT_H; }

    function getFunc() { return functions[state.funcIndex]; }

    function initGrid() {
      const lines = [];
      // 垂直网格线
      for (let x = Math.ceil(X_MIN); x <= X_MAX; x++) {
        if (x === 0) continue;
        const sx = toSvgX(x);
        lines.push(`<line class="grid-line" x1="${sx}" y1="${PAD_T}" x2="${sx}" y2="${PAD_T + PLOT_H}"></line>`);
      }
      // 水平网格线
      for (let y = Math.ceil(Y_MIN); y <= Y_MAX; y++) {
        if (y === 0) continue;
        const sy = toSvgY(y);
        lines.push(`<line class="grid-line" x1="${PAD_L}" y1="${sy}" x2="${PAD_L + PLOT_W}" y2="${sy}"></line>`);
      }
      // 坐标刻度
      for (let x = Math.ceil(X_MIN); x <= X_MAX; x++) {
        if (x === 0) continue;
        const sx = toSvgX(x);
        lines.push(`<text class="axis-label" x="${sx}" y="${PAD_T + PLOT_H + 16}" text-anchor="middle">${x}</text>`);
      }
      for (let y = Math.ceil(Y_MIN); y <= Y_MAX; y++) {
        if (y === 0) continue;
        const sy = toSvgY(y);
        lines.push(`<text class="axis-label" x="${PAD_L - 8}" y="${sy + 4}" text-anchor="end">${y}</text>`);
      }
      elements.grid.innerHTML = lines.join("");
    }

    function buildCurvePath() {
      const fn = getFunc();
      const samples = 200;
      const points = [];
      for (let i = 0; i <= samples; i++) {
        const x = fn.xMin + (i / samples) * (fn.xMax - fn.xMin);
        const y = fn.f(x);
        if (Number.isFinite(y)) {
          points.push(`${toSvgX(x).toFixed(2)},${toSvgY(y).toFixed(2)}`);
        }
      }
      elements.curve.setAttribute("d", "M " + points.join(" L "));
    }

    function tangentEndpoints(x0) {
      const fn = getFunc();
      const y0 = fn.f(x0);
      const slope = fn.df(x0);
      // 切线长度覆盖绘图区
      const halfLen = 2.5;
      const x1 = x0 - halfLen, x2 = x0 + halfLen;
      const y1 = y0 - slope * halfLen, y2 = y0 + slope * halfLen;
      return { x1, y1, x2, y2, slope, y0 };
    }

    function secantEndpoints(xP, xQ) {
      const fn = getFunc();
      const yP = fn.f(xP);
      const yQ = fn.f(xQ);
      const h = xQ - xP;
      const slope = Math.abs(h) < 1e-9 ? fn.df(xP) : (yQ - yP) / h;
      // 延长割线
      const halfLen = 2.5;
      const x1 = xP - halfLen, x2 = xP + halfLen;
      const y1 = yP - slope * halfLen, y2 = yP + slope * halfLen;
      return { x1, y1, x2, y2, slope, yP, yQ };
    }

    function render() {
      const fn = getFunc();
      const yP = fn.f(state.xP);
      const yQ = fn.f(state.xQ);
      const tan = tangentEndpoints(state.xP);
      const sec = secantEndpoints(state.xP, state.xQ);

      // 切线
      elements.tangentLine.setAttribute("x1", toSvgX(tan.x1));
      elements.tangentLine.setAttribute("y1", toSvgY(tan.y1));
      elements.tangentLine.setAttribute("x2", toSvgX(tan.x2));
      elements.tangentLine.setAttribute("y2", toSvgY(tan.y2));

      // 割线
      elements.secantLine.setAttribute("x1", toSvgX(sec.x1));
      elements.secantLine.setAttribute("y1", toSvgY(sec.y1));
      elements.secantLine.setAttribute("x2", toSvgX(sec.x2));
      elements.secantLine.setAttribute("y2", toSvgY(sec.y2));

      // P 点
      const pSvgX = toSvgX(state.xP), pSvgY = toSvgY(yP);
      elements.pointP.setAttribute("cx", pSvgX);
      elements.pointP.setAttribute("cy", pSvgY);
      elements.haloP.setAttribute("cx", pSvgX);
      elements.haloP.setAttribute("cy", pSvgY);
      elements.labelP.setAttribute("x", pSvgX + 12);
      elements.labelP.setAttribute("y", pSvgY - 12);

      // Q 点
      const qSvgX = toSvgX(state.xQ), qSvgY = toSvgY(yQ);
      elements.pointQ.setAttribute("cx", qSvgX);
      elements.pointQ.setAttribute("cy", qSvgY);
      elements.haloQ.setAttribute("cx", qSvgX);
      elements.haloQ.setAttribute("cy", qSvgY);
      elements.labelQ.setAttribute("x", qSvgX + 12);
      elements.labelQ.setAttribute("y", qSvgY - 12);

      // 斜率标签
      elements.tangentSlopeLabel.setAttribute("x", toSvgX(tan.x2) - 10);
      elements.tangentSlopeLabel.setAttribute("y", toSvgY(tan.y2) - 6);
      elements.tangentSlopeLabel.textContent = `f′=${tan.slope.toFixed(2)}`;

      elements.secantSlopeLabel.setAttribute("x", toSvgX(sec.x1) + 6);
      elements.secantSlopeLabel.setAttribute("y", toSvgY(sec.y1) + 14);
      elements.secantSlopeLabel.textContent = `k=${sec.slope.toFixed(2)}`;

      // 读数
      elements.tangentReadout.textContent = tan.slope.toFixed(3);
      elements.secantReadout.textContent = sec.slope.toFixed(3);
      elements.pReadout.textContent = state.xP.toFixed(3);
      elements.qReadout.textContent = state.xQ.toFixed(3);
      const diff = Math.abs(sec.slope - tan.slope);
      elements.diffReadout.textContent = diff.toFixed(3);

      // 洞察文本
      const h = state.xQ - state.xP;
      const gap = Math.abs(h);
      if (gap < 0.02) {
        elements.insight.textContent = "Q 已逼近 P：割线与切线几乎重合，斜率差趋向零——导数即割线斜率的极限。";
      } else if (gap < 0.15) {
        elements.insight.textContent = "Q 非常接近 P：割线斜率已接近切线斜率，差值快速缩小。";
      } else if (gap < 0.6) {
        elements.insight.textContent = "Q 正在靠近 P：割线开始转向切线方向，斜率差逐渐减小。";
      } else {
        elements.insight.textContent = "拖动 Q 点向 P 靠近，割线（蓝虚线）逐渐与切线（红实线）重合，斜率差趋向零。";
      }

      elements.funcOutput.textContent = fn.name;
      elements.speedOutput.textContent = `${state.speed.toFixed(1)}×`;
    }

    function update(dt) {
      if (!state.running) return;
      const boundedDt = clamp(finite(dt, 0), 0, 0.05);
      const fn = getFunc();
      // Q 向 P 逼近：指数衰减
      const h = state.xQ - state.xP;
      const gap = Math.abs(h);
      if (gap < 0.005) {
        state.running = false;
        elements.status.textContent = "已收敛";
        elements.approachBtn.setAttribute("aria-pressed", "false");
        elements.approachBtn.textContent = "Q 逼近 P";
        render();
        return;
      }
      // 逼近速度随距离指数衰减
      const decay = Math.exp(-state.speed * boundedDt * 2.5);
      state.xQ = state.xP + h * decay;
      // 防止越过 P
      if (Math.sign(state.xQ - state.xP) !== Math.sign(h)) {
        state.xQ = state.xP;
      }
      render();
    }

    function start() {
      const h = state.xQ - state.xP;
      if (Math.abs(h) < 0.01) {
        // Q 已在 P，重新放置
        state.xQ = state.xP + 1.5;
      }
      state.running = true;
      elements.status.textContent = "逼近中";
      elements.approachBtn.setAttribute("aria-pressed", "true");
      elements.approachBtn.textContent = "暂停逼近";
    }

    function pause() {
      state.running = false;
      elements.status.textContent = "已暂停";
      elements.approachBtn.setAttribute("aria-pressed", "false");
      elements.approachBtn.textContent = "Q 逼近 P";
    }

    function toggleApproach() {
      if (state.running) pause();
      else start();
    }

    function reset() {
      pause();
      state.xP = 1.0;
      state.xQ = 2.0;
      state.funcIndex = 0;
      state.speed = 1;
      elements.funcInput.value = "0";
      elements.speedInput.value = "1";
      buildCurvePath();
      render();
    }

    function setParameters(values) {
      if (values.func !== undefined) {
        const idx = clamp(Math.round(Number(values.func)), 0, 1);
        if (idx !== state.funcIndex) {
          state.funcIndex = idx;
          buildCurvePath();
        }
      }
      if (values.speed !== undefined) {
        state.speed = clamp(finite(Number(values.speed), 1), 0.3, 3);
      }
      render();
    }

    function getState() {
      return { ...state };
    }

    function getReadouts() {
      const fn = getFunc();
      const tan = tangentEndpoints(state.xP);
      const sec = secantEndpoints(state.xP, state.xQ);
      return {
        xP: state.xP,
        xQ: state.xQ,
        tangentSlope: tan.slope,
        secantSlope: sec.slope,
        diff: Math.abs(sec.slope - tan.slope)
      };
    }

    function runModelChecks() {
      const fn0 = functions[0];
      const fn1 = functions[1];
      const checks = [];

      // 二次函数导数验证
      checks.push({
        name: "二次函数 f(x)=x² 在 x=1 的导数 = 2",
        pass: Math.abs(fn0.df(1) - 2) < 1e-9,
        expected: 2,
        actual: fn0.df(1),
        tolerance: 1e-9
      });

      // 正弦函数导数验证
      checks.push({
        name: "正弦函数 f(x)=2sin(x)+2 在 x=0 的导数 = 2",
        pass: Math.abs(fn1.df(0) - 2) < 1e-9,
        expected: 2,
        actual: fn1.df(0),
        tolerance: 1e-9
      });

      // 割线斜率极限验证：h→0 时割线斜率 → 切线斜率
      const x0 = 1.0;
      const tanSlope = fn0.df(x0);
      let allConverge = true;
      for (const h of [0.1, 0.01, 0.001]) {
        const secSlope = (fn0.f(x0 + h) - fn0.f(x0)) / h;
        if (Math.abs(secSlope - tanSlope) > Math.abs(h) + 1e-6) {
          allConverge = false;
        }
      }
      checks.push({
        name: "h→0 时割线斜率 → 切线斜率（二次函数）",
        pass: allConverge,
        expected: `趋向 ${tanSlope}`,
        actual: `h=0.1: ${((fn0.f(1.1)-fn0.f(1))/0.1).toFixed(4)}, h=0.01: ${((fn0.f(1.01)-fn0.f(1))/0.01).toFixed(4)}`,
        tolerance: "收敛"
      });

      // 对称性验证：二次函数在 x=-1 导数 = -2
      checks.push({
        name: "二次函数在 x=-1 的导数 = -2（对称性）",
        pass: Math.abs(fn0.df(-1) - (-2)) < 1e-9,
        expected: -2,
        actual: fn0.df(-1),
        tolerance: 1e-9
      });

      // 正弦函数在 x=π/2 的导数 = 0（极值点）
      checks.push({
        name: "正弦函数在 x=π/2 的导数 = 0（极值点）",
        pass: Math.abs(fn1.df(Math.PI / 2)) < 1e-9,
        expected: 0,
        actual: fn1.df(Math.PI / 2),
        tolerance: 1e-9
      });

      return checks;
    }

    // 拖动逻辑
    let dragging = null;
    function svgPointFromEvent(evt) {
      const pt = elements.scene.createSVGPoint();
      pt.x = evt.clientX;
      pt.y = evt.clientY;
      const ctm = elements.scene.getScreenCTM();
      if (!ctm) return null;
      const svgPt = pt.matrixTransform(ctm.inverse());
      // SVG 坐标 -> 数学 x 坐标
      const x = X_MIN + ((svgPt.x - PAD_L) / PLOT_W) * (X_MAX - X_MIN);
      return x;
    }

    function onPointerDown(evt) {
      const target = evt.target;
      if (target === elements.pointP) {
        dragging = "P";
        pause();
      } else if (target === elements.pointQ) {
        dragging = "Q";
        pause();
      } else {
        return;
      }
      evt.preventDefault();
      elements.scene.setPointerCapture(evt.pointerId);
    }

    function onPointerMove(evt) {
      if (!dragging) return;
      const x = svgPointFromEvent(evt);
      if (x === null || !Number.isFinite(x)) return;
      const fn = getFunc();
      if (dragging === "P") {
        state.xP = clamp(x, fn.xMin + 0.1, fn.xMax - 0.1);
        // 保持 Q 在 P 的同一侧
        if (Math.abs(state.xQ - state.xP) < 0.05) {
          state.xQ = state.xP + 0.5;
        }
      } else if (dragging === "Q") {
        // Q 不能等于 P
        let xq = clamp(x, fn.xMin, fn.xMax);
        if (Math.abs(xq - state.xP) < 0.02) {
          xq = state.xP + (xq >= state.xP ? 0.02 : -0.02);
        }
        state.xQ = xq;
      }
      render();
    }

    function onPointerUp(evt) {
      dragging = null;
      try { elements.scene.releasePointerCapture(evt.pointerId); } catch (e) {}
    }

    function bindControls() {
      elements.approachBtn.addEventListener("click", toggleApproach);
      elements.resetBtn.addEventListener("click", reset);
      elements.funcInput.addEventListener("input", () => setParameters({ func: elements.funcInput.value }));
      elements.speedInput.addEventListener("input", () => setParameters({ speed: elements.speedInput.value }));

      elements.scene.addEventListener("pointerdown", onPointerDown);
      elements.scene.addEventListener("pointermove", onPointerMove);
      elements.scene.addEventListener("pointerup", onPointerUp);
      elements.scene.addEventListener("pointercancel", onPointerUp);
    }

    function init() {
      initGrid();
      bindControls();
      buildCurvePath();
      setParameters({ func: 0, speed: 1 });
      reset();
      requestAnimationFrame(frame);
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      requestAnimationFrame(frame);
    }

    window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
    init();
  })();
  </script>
</body>
</html>
