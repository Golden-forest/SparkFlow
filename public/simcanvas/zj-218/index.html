<style>
:root {
  color-scheme: light;
  --sim-bg: #f4f7fb;
  --sim-surface: #ffffff;
  --sim-surface-soft: #f8fafc;
  --sim-text: #172033;
  --sim-muted: #657188;
  --sim-border: #dfe6ef;
  --sim-grid: #e8edf4;
  --sim-accent: #0f9fba;
  --sim-accent-deep: #08758a;
  --sim-accent-soft: #d9f4f7;

  --sim-warning: #d97706;
  --sim-danger: #dc2626;
  --sim-radius-sm: 10px;

  background:

  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 14px 18px 12px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; overflow: hidden; }

.controls { padding: 10px 12px; display: grid; grid-template-columns: auto minmax(150px, 1fr) minmax(150px, 1fr) minmax(150px, 1fr); gap: 14px; align-items: center; border-radius: 17px; }
.actions { display: flex; gap: 8px; }
button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }

button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }

@media (max-width: 980px) {

  .controls { grid-template-columns: 1fr; }

<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>双缝干涉实验</h1>
      <p>单色光通过双缝在光屏形成明暗相间条纹 · 拖动参数观察条纹与程差的变化</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">运行中</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head"><h2 id="scene-title">侧视光路与光屏条纹</h2><span>光源 → 双缝 → 光屏 · 亮纹颜色随波长</span></div>
      <canvas id="scene" width="760" height="420" role="img" aria-label="双缝干涉侧视光路示意与光屏条纹"></canvas>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel formula-panel">
        <h2>公式</h2>
        <div class="formula-line">delta y = lambda * L / d</div>
        <p class="formula-note">相邻亮纹间距 delta y 与缝屏距 L 成正比，与缝间距 d 成反比，与波长 lambda 成正比。下方图像逐点描出 delta y 随 L 的变化。</p>
      </section>
      <section class="panel chart-panel">
        <div class="panel-head"><h2>delta y - L 关系图</h2><span>实时描点 · 反算波长</span></div>
        <canvas id="chart" width="380" height="240" role="img" aria-label="delta y 随 L 变化的直线图"></canvas>
      </section>
      <section class="panel insight-panel" data-region="insight">
        <p id="insight">拖动滑块观察：增大 L 条纹变疏，增大 d 条纹变密，增大 lambda 条纹变疏且颜色改变。</p>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="模拟控件">
    <div class="actions">
      <button id="startBtn" class="primary" type="button" aria-pressed="true">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control">
      <label for="lambdaInput">波长 lambda <output id="lambdaOutput">550 nm</output></label>
      <input id="lambdaInput" type="range" min="400" max="700" step="5" value="550">
    </div>
    <div class="control">
      <label for="LInput">缝屏距 L <output id="LOutput">1.00 m</output></label>
      <input id="LInput" type="range" min="0.5" max="2.0" step="0.05" value="1.0">
    </div>
    <div class="control">
      <label for="dInput">缝间距 d <output id="dOutput">0.20 mm</output></label>
      <input id="dInput" type="range" min="0.05" max="0.5" step="0.01" value="0.2">
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const parameterSchema = [
    { key: "lambda", label: "波长 lambda", type: "slider", min: 400, max: 700, step: 5, default: 550, unit: "nm" },
    { key: "L", label: "缝屏距 L", type: "slider", min: 0.5, max: 2.0, step: 0.05, default: 1.0, unit: "m" },
    { key: "d", label: "缝间距 d", type: "slider", min: 0.05, max: 0.5, step: 0.01, default: 0.2, unit: "mm" }
  ];

  const state = {
    running: true,
    t: 0,
    lambda: 550,   // nm
    L: 1.0,         // m
    d: 0.2,         // mm
    lastTimestamp: null,
    history: [{ L: 1.0, dy: 0 }]
  };

  const elements = {
    status: document.querySelector("#status"),
    scene: document.querySelector("#scene"),
    chart: document.querySelector("#chart"),
    insight: document.querySelector("#insight"),
    lambdaInput: document.querySelector("#lambdaInput"), lambdaOutput: document.querySelector("#lambdaOutput"),
    LInput: document.querySelector("#LInput"), LOutput: document.querySelector("#LOutput"),
    dInput: document.querySelector("#dInput"), dOutput: document.querySelector("#dOutput"),
    startBtn: document.querySelector("#startBtn"), resetBtn: document.querySelector("#resetBtn")
  };

  const sceneCtx = elements.scene.getContext("2d");
  const chartCtx = elements.chart.getContext("2d");

  // ---------- 工具 ----------
  function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
  function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

  function wavelengthToRGB(wl) {
    let r = 0, g = 0, b = 0;
    if (wl >= 380 && wl < 440) { r = -(wl - 440) / 60; g = 0; b = 1; }
    else if (wl >= 440 && wl < 490) { r = 0; g = (wl - 440) / 50; b = 1; }
    else if (wl >= 490 && wl < 510) { r = 0; g = 1; b = -(wl - 510) / 20; }
    else if (wl >= 510 && wl < 580) { r = (wl - 510) / 70; g = 1; b = 0; }
    else if (wl >= 580 && wl < 645) { r = 1; g = -(wl - 645) / 65; b = 0; }
    else if (wl >= 645 && wl <= 780) { r = 1; g = 0; b = 0; }
    let factor = 1;
    if (wl >= 380 && wl < 420) factor = 0.3 + 0.7 * (wl - 380) / 40;
    else if (wl >= 700 && wl <= 780) factor = 0.3 + 0.7 * (780 - wl) / 80;
    r = Math.round(255 * Math.pow(r * factor, 0.8));
    g = Math.round(255 * Math.pow(g * factor, 0.8));
    b = Math.round(255 * Math.pow(b * factor, 0.8));
    return { r, g, b };
  }
  function rgbStr(c, a) { return `rgba(${c.r},${c.g},${c.b},${a == null ? 1 : a})`; }
  function hexStr(c) {
    const h = (n) => n.toString(16).padStart(2, "0");
    return `#${h(c.r)}${h(c.g)}${h(c.b)}`;
  }

  // ---------- 模型 ----------
  // delta y = lambda * L / d
  // lambda 单位 nm，L 单位 m，d 单位 mm
  // 统一转 SI: lambda_m = lambda * 1e-9, d_m = d * 1e-3
  // delta_y_m = lambda_m * L / d_m = (lambda * 1e-9) * L / (d * 1e-3) = (lambda * L / d) * 1e-6 m = (lambda * L / d) 微米
  function computeFringeSpacing(lambda_nm, L_m, d_mm) {
    return (lambda_nm * L_m / d_mm) * 1e-6; // 单位 m
  }
  function computeLambdaFromFringe(dy_m, L_m, d_mm) {
    // dy = lambda * L / d * 1e-6  =>  lambda = dy * d / L / 1e-6 = dy * d / L * 1e6
    // dy 单位 m, d 单位 mm, L 单位 m => dy(m) * d(mm) / L(m) * 1e6 = dy * d / L * 1e6 (nm)
    return dy_m * d_mm / L_m * 1e6; // nm
  }

  // ---------- 主场景绘制 ----------
  function drawScene() {
    const ctx = sceneCtx;
    const W = elements.scene.width;
    const H = elements.scene.height;
    ctx.clearRect(0, 0, W, H);

    // 背景
    ctx.fillStyle = "#050810";
    ctx.fillRect(0, 0, W, H);

    const color = wavelengthToRGB(state.lambda);

    // 布局
    const sourceX = 60;
    const slitX = 280;
    const screenX = 660;
    const axisY = 210;
    const slitGap = 36; // 像素，示意
    const slitTopY = axisY - slitGap / 2;
    const slitBotY = axisY + slitGap / 2;

    // 光屏区域
    const screenTop = 50;
    const screenBot = 370;
    const screenW = 16;

    // ---- 光源 ----
    ctx.fillStyle = "#1a2030";
    ctx.beginPath();
    ctx.arc(sourceX, axisY, 12, 0, Math.PI * 2);
    ctx.fill();
    // 光源发光（双层描边模拟）
    ctx.strokeStyle = rgbStr(color, 0.35);
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(sourceX, axisY, 16, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = rgbStr(color, 0.9);
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(sourceX, axisY, 12, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = "#e8eefc";
    ctx.font = "11px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.fillText("光源", sourceX, axisY + 30);
    ctx.fillStyle = rgbStr(color, 0.85);
    ctx.fillText(`lambda = ${state.lambda} nm`, sourceX, axisY + 44);

    // ---- 光源到双缝的入射光 ----
    ctx.strokeStyle = rgbStr(color, 0.55);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sourceX + 12, axisY);
    ctx.lineTo(slitX - 4, axisY);
    ctx.stroke();
    // 入射光波纹（确定性时间函数）
    ctx.strokeStyle = rgbStr(color, 0.3);
    ctx.lineWidth = 1.5;
    for (let k = 0; k < 8; k++) {
      const phase = (state.t * 2 - k * 0.5) % 4;
      const x = sourceX + 14 + phase * 50;
      if (x < slitX - 6) {
        ctx.beginPath();
        ctx.arc(x, axisY, 6, -Math.PI / 2.5, Math.PI / 2.5);
        ctx.stroke();
      }
    }

    // ---- 双缝挡板 ----
    ctx.fillStyle = "#2a3450";
    ctx.fillRect(slitX - 5, 40, 10, slitTopY - 40);
    ctx.fillRect(slitX - 5, slitBotY, 10, screenBot - slitBotY);
    // 缝口发光
    ctx.strokeStyle = rgbStr(color, 0.5);
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(slitX - 5, slitTopY - 2);
    ctx.lineTo(slitX + 5, slitTopY - 2);
    ctx.moveTo(slitX - 5, slitBotY + 2);
    ctx.lineTo(slitX + 5, slitBotY + 2);
    ctx.stroke();

    // ---- 双缝到光屏的两束光 ----
    // 上缝光线
    ctx.strokeStyle = rgbStr(color, 0.5);
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(slitX, slitTopY);
    ctx.lineTo(screenX, axisY);
    ctx.stroke();
    // 下缝光线
    ctx.beginPath();
    ctx.moveTo(slitX, slitBotY);
    ctx.lineTo(screenX, axisY);
    ctx.stroke();

    // ---- 程差三角形 ----
    // 从下缝作平行于上缝光线的线段，长度 = d (示意)
    const dx = screenX - slitX;
    const dyUpper = axisY - slitTopY;
    const len = Math.sqrt(dx * dx + dyUpper * dyUpper);
    const ux = dx / len, uy = dyUpper / len;
    // 程差起点：下缝沿上缝光线方向走 d (示意用 slitGap)
    const pathStartX = slitX;
    const pathStartY = slitBotY;
    const pathEndX = slitX + ux * slitGap;
    const pathEndY = slitBotY + uy * slitGap;
    // 程差线段（从上缝到该点）
    ctx.strokeStyle = "#f59e0b";
    ctx.lineWidth = 2.5;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(slitX, slitTopY);
    ctx.lineTo(pathEndX, pathEndY);
    ctx.stroke();
    ctx.setLineDash([]);
    // 程差标记
    const midX = (slitX + pathEndX) / 2;
    const midY = (slitTopY + pathEndY) / 2;
    ctx.fillStyle = "#f59e0b";
    ctx.font = "bold 11px ui-sans-serif, system-ui";
    ctx.textAlign = "left";
    ctx.fillText("程差 delta", midX + 6, midY - 4);

    // ---- 光屏 ----
    ctx.fillStyle = "#0a0f1a";
    ctx.fillRect(screenX - screenW / 2, screenTop, screenW, screenBot - screenTop);
    ctx.strokeStyle = "#3a4458";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(screenX - screenW / 2, screenTop, screenW, screenBot - screenTop);

    // ---- 光屏条纹 ----
    // delta y 像素映射：让条纹间距在 8~40 像素之间可见
    const dy_m = computeFringeSpacing(state.lambda, state.L, state.d);
    // 物理范围：lambda 400~700, L 0.5~2, d 0.05~0.5
    // dy_min = 400*0.5/0.5 * 1e-6 = 4e-6 m = 4 微米
    // dy_max = 700*2/0.05 * 1e-6 = 2.8e-2 m = 28000 微米
    // 用对数映射到像素
    const dyMicron = dy_m * 1e6;
    const logDy = Math.log10(Math.max(0.1, dyMicron));
    // log10(0.1)=-1, log10(28000)≈4.45
    const logMin = -1, logMax = 4.5;
    const norm = (logDy - logMin) / (logMax - logMin); // 0~1
    const dyPx = 8 + norm * 32; // 8~40 像素

    // 绘制条纹
    const stripeW = 8;
    for (let y = screenTop + 4; y < screenBot - 4; y += 1) {
      const offset = y - axisY;
      const phase = (offset / dyPx) * Math.PI;
      const intensity = Math.cos(phase);
      const I = intensity * intensity; // 0~1
      if (I > 0.02) {
        ctx.fillStyle = rgbStr(color, 0.15 + I * 0.85);
        ctx.fillRect(screenX - stripeW / 2, y, stripeW, 1);
      } else {
        ctx.fillStyle = "rgba(10, 15, 26, 1)";
        ctx.fillRect(screenX - stripeW / 2, y, stripeW, 1);
      }
    }

    // 光屏右侧的亮纹位置标记
    ctx.fillStyle = "#e8eefc";
    ctx.font = "10px ui-sans-serif, system-ui";
    ctx.textAlign = "left";
    ctx.fillText("光屏", screenX + 12, screenTop + 10);
    ctx.fillStyle = rgbStr(color, 0.9);
    ctx.fillText(`条纹间距`, screenX + 12, screenTop + 24);
    ctx.fillText(`${(dy_m * 1e6).toFixed(2)} 微米`, screenX + 12, screenTop + 38);
    ctx.fillStyle = "#9aa7ba";
    ctx.fillText(`= ${(dy_m * 1e3).toFixed(3)} mm`, screenX + 12, screenTop + 52);

    // ---- 标注 ----
    ctx.fillStyle = "#9aa7ba";
    ctx.font = "11px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.fillText("双缝", slitX, 32);
    ctx.fillStyle = "#f59e0b";
    ctx.fillText(`d = ${state.d.toFixed(2)} mm`, slitX, screenBot + 14);

    // L 标注
    ctx.strokeStyle = "#5a6478";
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(slitX, screenBot + 4);
    ctx.lineTo(screenX, screenBot + 4);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#9aa7ba";
    ctx.fillText(`L = ${state.L.toFixed(2)} m`, (slitX + screenX) / 2, screenBot + 14);

    // ---- 顶部信息 ----
    ctx.fillStyle = "#e8eefc";
    ctx.font = "bold 13px ui-sans-serif, system-ui";
    ctx.textAlign = "left";
    ctx.fillText(`delta y = lambda * L / d = ${(dy_m * 1e6).toFixed(2)} 微米`, 16, 22);
    ctx.fillStyle = "#657188";
    ctx.font = "11px ui-sans-serif, system-ui";
    ctx.fillText(`反算波长 lambda = ${computeLambdaFromFringe(dy_m, state.L, state.d).toFixed(1)} nm`, 16, 38);
  }

  // ---------- 图像绘制 ----------
  function drawChart() {
    const ctx = chartCtx;
    const W = elements.chart.width;
    const H = elements.chart.height;
    ctx.clearRect(0, 0, W, H);

    // 背景
    ctx.fillStyle = "#fbfdff";
    ctx.fillRect(0, 0, W, H);

    const padL = 52, padR = 16, padT = 14, padB = 38;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    // 坐标范围
    const Lmin = 0.5, Lmax = 2.0;
    // delta y 范围：用当前 lambda, d 计算 L=Lmax 时的 dy 作为上限
    const dyMax = computeFringeSpacing(state.lambda, Lmax, state.d) * 1e6; // 微米
    const yMax = Math.max(10, dyMax * 1.1);

    // 网格
    ctx.strokeStyle = "#e8edf4";
    ctx.lineWidth = 1;
    const xSteps = 6, ySteps = 5;
    for (let i = 0; i <= xSteps; i++) {
      const x = padL + (i / xSteps) * plotW;
      ctx.beginPath();
      ctx.moveTo(x, padT);
      ctx.lineTo(x, padT + plotH);
      ctx.stroke();
    }
    for (let j = 0; j <= ySteps; j++) {
      const y = padT + plotH - (j / ySteps) * plotH;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + plotW, y);
      ctx.stroke();
    }

    // 坐标轴
    ctx.strokeStyle = "#9aa7ba";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(padL, padT);
    ctx.lineTo(padL, padT + plotH);
    ctx.lineTo(padL + plotW, padT + plotH);
    ctx.stroke();

    // 轴刻度文字
    ctx.fillStyle = "#657188";
    ctx.font = "10px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    for (let i = 0; i <= xSteps; i++) {
      const Lval = Lmin + (i / xSteps) * (Lmax - Lmin);
      const x = padL + (i / xSteps) * plotW;
      ctx.fillText(Lval.toFixed(1), x, padT + plotH + 14);
    }
    ctx.textAlign = "right";
    for (let j = 0; j <= ySteps; j++) {
      const yval = (j / ySteps) * yMax;
      const y = padT + plotH - (j / ySteps) * plotH;
      ctx.fillText(yval.toFixed(1), padL - 6, y + 3);
    }

    // 轴标签
    ctx.fillStyle = "#172033";
    ctx.font = "bold 11px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.fillText("L / m", padL + plotW / 2, H - 6);
    ctx.save();
    ctx.translate(14, padT + plotH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText("delta y / 微米", 0, 0);
    ctx.restore();

    // 理论直线 delta y = lambda * L / d
    const color = wavelengthToRGB(state.lambda);
    ctx.strokeStyle = rgbStr(color, 0.35);
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    for (let i = 0; i <= 60; i++) {
      const L = Lmin + (i / 60) * (Lmax - Lmin);
      const dy = computeFringeSpacing(state.lambda, L, state.d) * 1e6;
      const px = padL + ((L - Lmin) / (Lmax - Lmin)) * plotW;
      const py = padT + plotH - (dy / yMax) * plotH;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // 历史数据点（逐点采集）
    state.history.forEach((pt, idx) => {
      const px = padL + ((pt.L - Lmin) / (Lmax - Lmin)) * plotW;
      const py = padT + plotH - (Math.min(pt.dy * 1e6, yMax) / yMax) * plotH;
      // 连线
      if (idx > 0) {
        const prev = state.history[idx - 1];
        const ppx = padL + ((prev.L - Lmin) / (Lmax - Lmin)) * plotW;
        const ppy = padT + plotH - (Math.min(prev.dy * 1e6, yMax) / yMax) * plotH;
        ctx.strokeStyle = rgbStr(color, 0.6);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(ppx, ppy);
        ctx.lineTo(px, py);
        ctx.stroke();
      }
      // 描点
      ctx.fillStyle = hexStr(color);
      ctx.beginPath();
      ctx.arc(px, py, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1;
      ctx.stroke();
    });

    // 当前点高亮
    const curDy = computeFringeSpacing(state.lambda, state.L, state.d);
    const cpx = padL + ((state.L - Lmin) / (Lmax - Lmin)) * plotW;
    const cpy = padT + plotH - (Math.min(curDy * 1e6, yMax) / yMax) * plotH;
    ctx.strokeStyle = rgbStr(color, 0.4);
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(cpx, cpy, 6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = hexStr(color);
    ctx.beginPath();
    ctx.arc(cpx, cpy, 4, 0, Math.PI * 2);
    ctx.fill();

    // 图例
    ctx.font = "10px ui-sans-serif, system-ui";
    ctx.textAlign = "left";
    const legX = padL + 8, legY = padT + 12;
    ctx.fillStyle = rgbStr(color, 0.5);
    ctx.fillRect(legX, legY, 14, 3);
    ctx.fillStyle = "#657188";
    ctx.fillText("理论直线", legX + 20, legY + 6);
    ctx.fillStyle = hexStr(color);
    ctx.beginPath();
    ctx.arc(legX + 7, legY + 16, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#657188";
    ctx.fillText("实测点", legX + 20, legY + 20);

    // 斜率标注
    const slope = (state.lambda / state.d) * 1e-6 * 1e6; // = lambda/d (微米/m)
    ctx.fillStyle = "#172033";
    ctx.font = "bold 10px ui-sans-serif, system-ui";
    ctx.textAlign = "right";
    ctx.fillText(`斜率 k = lambda/d = ${slope.toFixed(2)} 微米/m`, padL + plotW - 4, padT + 12);
    ctx.fillStyle = "#657188";
    ctx.font = "10px ui-sans-serif, system-ui";
    ctx.fillText(`截距 = 0（过原点，正比关系）`, padL + plotW - 4, padT + 26);

    // 反算波长
    const lambdaMeasured = computeLambdaFromFringe(curDy, state.L, state.d);
    ctx.fillStyle = "#08758a";
    ctx.font = "bold 11px ui-sans-serif, system-ui";
    ctx.fillText(`反算波长 = ${lambdaMeasured.toFixed(1)} nm`, padL + plotW - 4, padT + 42);
  }

  // ---------- 生命周期 ----------
  function init() {
    bindControls();
    setParameters({ lambda: 550, L: 1.0, d: 0.2 });
    reset();
    requestAnimationFrame(frame);
  }
  function start() {
    state.running = true;
    elements.status.textContent = "运行中";
    elements.startBtn.textContent = "暂停";
    elements.startBtn.setAttribute("aria-pressed", "true");
  }
  function pause() {
    state.running = false;
    elements.status.textContent = "已暂停";
    elements.startBtn.textContent = "继续";
    elements.startBtn.setAttribute("aria-pressed", "false");
  }
  function reset() {
    state.t = 0;
    state.lastTimestamp = null;
    state.history = [{ L: state.L, dy: computeFringeSpacing(state.lambda, state.L, state.d) }];
    render();
  }
  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05);
    state.t += boundedDt;
    // 逐点采集：每 0.15s 采一个点，扫描 L
    // 让 L 在 [0.5, 2.0] 间往复扫描
    const cycle = 8;
    const phase = (state.t % cycle) / cycle;
    const sweep = phase < 0.5 ? phase * 2 : 2 - phase * 2;
    const Lsweep = 0.5 + sweep * 1.5;
    const dy = computeFringeSpacing(state.lambda, Lsweep, state.d);
    if (state.history.length === 0 || state.t - (state.history[state.history.length - 1].t || 0) >= 0.15) {
      state.history.push({ L: Lsweep, dy, t: state.t });
      if (state.history.length > 200) state.history.shift();
    }
  }
  function render() {
    drawScene();
    drawChart();
    updateInsight();
    updateOutputs();
  }
  function updateInsight() {
    const dy = computeFringeSpacing(state.lambda, state.L, state.d);
    const dyMicron = dy * 1e6;
    elements.insight.textContent =
      `当前 delta y = ${dyMicron.toFixed(2)} 微米。增大 L 条纹变疏，增大 d 条纹变密，增大 lambda 条纹变疏且颜色改变。`;
  }
  function updateOutputs() {
    elements.lambdaOutput.textContent = `${state.lambda} nm`;
    elements.LOutput.textContent = `${state.L.toFixed(2)} m`;
    elements.dOutput.textContent = `${state.d.toFixed(2)} mm`;
  }
  function setParameters(values) {
    const lDef = parameterSchema[0], LDef = parameterSchema[1], dDef = parameterSchema[2];
    state.lambda = clamp(finite(Number(values.lambda), lDef.default), lDef.min, lDef.max);
    state.L = clamp(finite(Number(values.L), LDef.default), LDef.min, LDef.max);
    state.d = clamp(finite(Number(values.d), dDef.default), dDef.min, dDef.max);
    elements.lambdaInput.value = String(state.lambda);
    elements.LInput.value = String(state.L);
    elements.dInput.value = String(state.d);
    // 参数改变后清空历史，重新采集
    state.history = [{ L: state.L, dy: computeFringeSpacing(state.lambda, state.L, state.d) }];
    render();
  }
  function getState() {
    return { ...state, history: state.history.map(p => ({ ...p })) };
  }
  function getReadouts() {
    const dy = computeFringeSpacing(state.lambda, state.L, state.d);
    return {
      lambda: state.lambda,
      L: state.L,
      d: state.d,
      dy: dy,
      dyMicron: dy * 1e6,
      lambdaMeasured: computeLambdaFromFringe(dy, state.L, state.d)
    };
  }
  function runModelChecks() {
    // delta y = lambda * L / d
    // 单位：lambda(nm), L(m), d(mm) => dy(m) = lambda*L/d * 1e-6
    const cases = [
      { name: "基本公式", lambda: 550, L: 1.0, d: 0.2, expected: 550 * 1.0 / 0.2 * 1e-6, tol: 1e-12 },
      { name: "L 增大 dy 增大", lambda: 550, L: 2.0, d: 0.2, expected: 550 * 2.0 / 0.2 * 1e-6, tol: 1e-12 },
      { name: "d 增大 dy 减小", lambda: 550, L: 1.0, d: 0.4, expected: 550 * 1.0 / 0.4 * 1e-6, tol: 1e-12 },
      { name: "lambda 增大 dy 增大", lambda: 700, L: 1.0, d: 0.2, expected: 700 * 1.0 / 0.2 * 1e-6, tol: 1e-12 },
      { name: "反算波长闭环", lambda: 600, L: 1.5, d: 0.15, expected: 600, tol: 1e-9 }
    ];
    return cases.map(c => {
      const dy = computeFringeSpacing(c.lambda, c.L, c.d);
      let actual, pass;
      if (c.name === "反算波长闭环") {
        actual = computeLambdaFromFringe(dy, c.L, c.d);
        pass = Math.abs(actual - c.expected) < c.tol;
      } else {
        actual = dy;
        pass = Math.abs(actual - c.expected) < c.tol;
      }
      return {
        name: c.name,
        pass,
        expected: c.expected,
        actual,
        tolerance: c.tol
      };
    });
  }
  function bindControls() {
    elements.startBtn.addEventListener("click", () => { state.running ? pause() : start(); });
    elements.resetBtn.addEventListener("click", reset);
    elements.lambdaInput.addEventListener("input", () => setParameters({ lambda: Number(elements.lambdaInput.value), L: state.L, d: state.d }));
    elements.LInput.addEventListener("input", () => setParameters({ lambda: state.lambda, L: Number(elements.LInput.value), d: state.d }));
    elements.dInput.addEventListener("input", () => setParameters({ lambda: state.lambda, L: state.L, d: Number(elements.dInput.value) }));
  }
  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
