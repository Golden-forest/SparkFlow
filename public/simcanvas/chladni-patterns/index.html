<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>克拉尼振动图形</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #070b18;
      --sim-surface: #111a2e;
      --sim-surface-soft: #0d1424;
      --sim-text: #e8eefc;
      --sim-muted: #8a97b5;
      --sim-border: #1f2c44;
      --sim-grid: #182238;
      --sim-accent: #0f9fba;
      --sim-accent-deep: #08758a;
      --sim-accent-soft: #0a2a33;
      --sim-positive: #0f9fba;
      --sim-warning: #f59e0b;
      --sim-danger: #dc2626;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 18px 46px rgba(0, 0, 0, 0.45);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.10), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.08), transparent 26%),
        var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
    .status { border: 1px solid rgba(15,159,186,.28); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent); font-weight: 780; white-space: nowrap; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 2.15fr) minmax(280px, 0.55fr); gap: 12px; }
    .panel { min-width: 0; background: rgba(17, 26, 46, .94); border: 1px solid rgba(31, 44, 68, .55); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
    #scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.18); border-radius: 18px; background: #050810; }
    .side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
    .readouts, .model-note { padding: 17px; }
    .readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric { padding: 14px; border: 1px solid rgba(15,159,186,.18); border-radius: 15px; background: linear-gradient(145deg, #0d1424, #0a101e); }
    .metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
    .metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .model-note { display: grid; align-content: start; gap: 14px; }
    .model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
    .insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: rgba(245, 158, 11, 0.08); color: #f5b945 !important; font-weight: 650; }
    .controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr) minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
    button:hover { border-color: #2a3a58; background: #131c30; }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
    .control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
    .mode-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .mode-grid button { padding: 8px 4px; font-size: 0.78rem; text-align: center; }
    .mode-grid button.active { border-color: var(--sim-accent); background: var(--sim-accent-soft); color: var(--sim-accent); }
    @media (max-width: 860px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
      .scene-panel { min-height: 0; }
      #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="app" data-layout="visualization-first" data-model-tier="analytic">
    <header class="header" data-region="header">
      <div>
        <h1>克拉尼振动图形</h1>
        <p>调节频率与振幅，观察金属板上沙粒聚集到振动节线，形成对称几何图案。</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head"><h2 id="scene-title">振动板与沙粒分布</h2><span>方形板 · 四边自由支撑</span></div>
        <canvas id="scene" width="760" height="420" role="img" aria-labelledby="scene-title scene-desc">
          <desc id="scene-desc">深色方形振动板，沙粒聚集在驻波节线附近，形成对称的克拉尼图案。</desc>
        </canvas>
      </section>

      <aside class="side" data-region="evidence">
        <section class="panel readouts" aria-label="实时数值">
          <div class="readout-grid">
            <div class="metric"><small>频率 f</small><strong id="freqReadout">0.00 Hz</strong></div>
            <div class="metric"><small>振幅 A</small><strong id="ampReadout">0.00</strong></div>
            <div class="metric"><small>模态 (n, m)</small><strong id="modeReadout">1, 1</strong></div>
            <div class="metric"><small>节线数</small><strong id="nodesReadout">0</strong></div>
          </div>
        </section>
        <section class="panel model-note" data-region="insight">
          <div class="panel-head"><h2>模型与观察</h2></div>
          <p id="insight" class="insight">按下"开始"激发振动。沙粒会从波腹（振幅最大处）弹向波节（静止线），逐渐勾勒出节线几何。</p>
          <p>教学视图：板按 z = A·sin(nπx/L)·sin(mπy/L)·cos(2πft) 振动。沙粒沿 |z| 梯度向节线迁移，节线即 sin(nπx/L)·sin(mπy/L)=0 的位置。</p>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="模拟控制">
      <div class="actions">
        <button id="startBtn" class="primary" type="button">开始</button>
        <button id="pauseBtn" type="button">暂停</button>
        <button id="resetBtn" type="button">重置</button>
      </div>
      <div class="control">
        <label for="freqInput">频率 <output id="freqOutput">440 Hz</output></label>
        <input id="freqInput" type="range" min="50" max="2000" step="10" value="440">
      </div>
      <div class="control">
        <label for="ampInput">振幅 <output id="ampOutput">1.0</output></label>
        <input id="ampInput" type="range" min="0.2" max="2" step="0.1" value="1">
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";
    const parameterSchema = [
      { key: "freq", label: "频率", type: "slider", min: 50, max: 2000, step: 10, default: 440, unit: "Hz" },
      { key: "amp", label: "振幅", type: "slider", min: 0.2, max: 2, step: 0.1, default: 1, unit: "" }
    ];
    const state = {
      running: false, t: 0, freq: 440, amp: 1, modeN: 1, modeM: 1,
      lastTimestamp: null, particles: [], imgData: null, nodeCount: 0
    };
    const elements = {
      status: document.querySelector("#status"), scene: document.querySelector("#scene"),
      freqReadout: document.querySelector("#freqReadout"), ampReadout: document.querySelector("#ampReadout"),
      modeReadout: document.querySelector("#modeReadout"), nodesReadout: document.querySelector("#nodesReadout"),
      insight: document.querySelector("#insight"),
      freqInput: document.querySelector("#freqInput"), freqOutput: document.querySelector("#freqOutput"),
      ampInput: document.querySelector("#ampInput"), ampOutput: document.querySelector("#ampOutput"),
      startBtn: document.querySelector("#startBtn"), pauseBtn: document.querySelector("#pauseBtn"), resetBtn: document.querySelector("#resetBtn")
    };
    const ctx = elements.scene.getContext("2d");
    const W = 760, H = 420;
    const plateX = 80, plateY = 30, plateW = 600, plateH = 360;

    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

    function plateZ(u, v, t) {
      return state.amp * Math.sin(state.modeN * Math.PI * u) * Math.sin(state.modeM * Math.PI * v) * Math.cos(2 * Math.PI * state.freq * t * 0.0008);
    }

    function initParticles() {
      state.particles = [];
      for (let i = 0; i < 1800; i++) {
        state.particles.push({
          u: Math.random(), v: Math.random(),
          px: 0, py: 0
        });
      }
    }

    function initGrid() {
      ctx.fillStyle = "#050810";
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "#182238";
      ctx.lineWidth = 1;
      for (let i = 0; i <= 10; i++) {
        const x = plateX + (i / 10) * plateW;
        ctx.beginPath(); ctx.moveTo(x, plateY); ctx.lineTo(x, plateY + plateH); ctx.stroke();
        const y = plateY + (i / 10) * plateH;
        ctx.beginPath(); ctx.moveTo(plateX, y); ctx.lineTo(plateX + plateW, y); ctx.stroke();
      }
      ctx.strokeStyle = "#1f2c44";
      ctx.lineWidth = 2;
      ctx.strokeRect(plateX, plateY, plateW, plateH);
    }

    function init() {
      initGrid(); initParticles(); bindControls();
      setParameters({ freq: 440, amp: 1 }); reset(); requestAnimationFrame(frame);
    }

    function start() {
      state.running = true; elements.status.textContent = "振动中";
      elements.startBtn.setAttribute("aria-pressed", "true");
    }
    function pause() {
      state.running = false; elements.status.textContent = "已暂停";
      elements.startBtn.setAttribute("aria-pressed", "false");
    }
    function reset() {
      pause(); state.t = 0; state.lastTimestamp = null;
      state.modeN = 1; state.modeM = 1; initParticles(); render();
    }

    function update(dt) {
      if (!state.running) return;
      const boundedDt = clamp(finite(dt, 0), 0, 0.05);
      state.t += boundedDt;
      const eps = 0.01;
      const k = 0.018;
      for (const p of state.particles) {
        const z = plateZ(p.u, p.v, state.t);
        const du = (plateZ(p.u + eps, p.v, state.t) - z) / eps;
        const dv = (plateZ(p.u, p.v + eps, state.t) - z) / eps;
        const gradMag = Math.sqrt(du * du + dv * dv) + 1e-6;
        p.u -= k * du / gradMag + (Math.random() - 0.5) * 0.004;
        p.v -= k * dv / gradMag + (Math.random() - 0.5) * 0.004;
        p.u = clamp(p.u, 0.005, 0.995);
        p.v = clamp(p.v, 0.005, 0.995);
      }
    }

    function render() {
      initGrid();
      ctx.fillStyle = "#d4a04a";
      for (const p of state.particles) {
        p.px = plateX + p.u * plateW;
        p.py = plateY + p.v * plateH;
        ctx.fillRect(p.px - 0.6, p.py - 0.6, 1.4, 1.4);
      }
      const n = state.modeN, m = state.modeM;
      const nodeCount = (n - 1) + (m - 1);
      state.nodeCount = nodeCount;
      const z0 = plateZ(0.5, 0.5, state.t);
      let insightText;
      if (!state.running && state.t === 0) {
        insightText = "按下\"开始\"激发振动。沙粒会从波腹（振幅最大处）弹向波节（静止线），逐渐勾勒出节线几何。";
      } else if (nodeCount === 0) {
        insightText = "模态 (1,1)：板中心为唯一波腹，四边为节线，沙粒向边缘聚集。";
      } else {
        insightText = `模态 (${n},${m})：板上有 ${nodeCount} 条内部节线，沙粒正沿 |z| 梯度向这些静止线迁移。`;
      }
      elements.insight.textContent = insightText;
      elements.freqReadout.textContent = `${state.freq.toFixed(0)} Hz`;
      elements.ampReadout.textContent = state.amp.toFixed(2);
      elements.modeReadout.textContent = `${n}, ${m}`;
      elements.nodesReadout.textContent = `${nodeCount}`;
      elements.freqOutput.textContent = `${state.freq.toFixed(0)} Hz`;
      elements.ampOutput.textContent = state.amp.toFixed(1);
    }

    function setParameters(values) {
      const freqDef = parameterSchema[0], ampDef = parameterSchema[1];
      state.freq = clamp(finite(Number(values.freq), freqDef.default), freqDef.min, freqDef.max);
      state.amp = clamp(finite(Number(values.amp), ampDef.default), ampDef.min, ampDef.max);
      const ratio = state.freq / 440;
      let n = 1, m = 1;
      if (ratio > 1.85) { n = 2; m = 1; }
      if (ratio > 2.7) { n = 2; m = 2; }
      if (ratio > 3.6) { n = 3; m = 2; }
      if (ratio > 4.5) { n = 3; m = 3; }
      state.modeN = n; state.modeM = m;
      elements.freqInput.value = String(state.freq);
      elements.ampInput.value = String(state.amp);
      render();
    }

    function getState() {
      return {
        running: state.running, t: state.t, freq: state.freq, amp: state.amp,
        modeN: state.modeN, modeM: state.modeM, nodeCount: state.nodeCount,
        particleCount: state.particles.length
      };
    }

    function getReadouts() {
      return {
        freq: state.freq, amp: state.amp, modeN: state.modeN, modeM: state.modeM,
        nodes: state.nodeCount, time: state.t
      };
    }

    function runModelChecks() {
      const z11 = plateZ(0.5, 0.5, 0);
      const z22 = (function () {
        const oldN = state.modeN, oldM = state.modeM;
        state.modeN = 2; state.modeM = 2;
        const z = plateZ(0.25, 0.25, 0);
        state.modeN = oldN; state.modeM = oldM;
        return z;
      })();
      const zEdge = plateZ(0, 0.5, 0);
      const zCenter22 = (function () {
        const oldN = state.modeN, oldM = state.modeM;
        state.modeN = 2; state.modeM = 2;
        const z = plateZ(0.5, 0.5, 0);
        state.modeN = oldN; state.modeM = oldM;
        return z;
      })();
      return [
        { name: "模态(1,1)中心为波腹", pass: Math.abs(z11 - state.amp) < 1e-6, expected: state.amp, actual: z11, tolerance: 1e-6 },
        { name: "模态(2,2)四分之一点为波腹", pass: Math.abs(z22 - state.amp) < 1e-6, expected: state.amp, actual: z22, tolerance: 1e-6 },
        { name: "模态(2,2)中心为节线交点", pass: Math.abs(zCenter22) < 1e-6, expected: 0, actual: zCenter22, tolerance: 1e-6 },
        { name: "板边缘为节线", pass: Math.abs(zEdge) < 1e-6, expected: 0, actual: zEdge, tolerance: 1e-6 },
        { name: "振幅缩放正确", pass: Math.abs(plateZ(0.5, 0.5, 0) - state.amp) < 1e-6, expected: state.amp, actual: plateZ(0.5, 0.5, 0), tolerance: 1e-6 }
      ];
    }

    function bindControls() {
      elements.startBtn.addEventListener("click", start);
      elements.pauseBtn.addEventListener("click", pause);
      elements.resetBtn.addEventListener("click", reset);
      elements.freqInput.addEventListener("input", () => setParameters({ freq: elements.freqInput.value, amp: state.amp }));
      elements.ampInput.addEventListener("input", () => setParameters({ freq: state.freq, amp: elements.ampInput.value }));
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt); render(); requestAnimationFrame(frame);
    }

    window.simulation = {
      init: init, start: start, pause: pause, reset: reset,
      update: update, render: render, setParameters: setParameters,
      getState: getState, getReadouts: getReadouts, runModelChecks: runModelChecks
    };
    init();
  })();
  </script>
</body>
</html>
