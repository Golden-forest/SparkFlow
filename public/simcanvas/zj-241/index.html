<!doctype html>
<html lang="zh-CN">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三孔平抛射程实验</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #050810;
  --sim-surface: #0a0f1c;
  --sim-surface-soft: #0e1424;
  --sim-text: #e8eefc;
  --sim-muted: #6b7a96;
  --sim-border: #1a2238;
  --sim-grid: #131a2c;
  --sim-accent: #5fb4d8;
  --sim-accent-deep: #3a8fb8;
  --sim-accent-soft: #1a2f44;
  --sim-positive: #5fb4d8;
  --sim-warning: #d4a04a;
  --sim-danger: #d46a4a;
  --sim-radius-sm: 8px;
  --sim-radius-md: 12px;
  --sim-radius-lg: 16px;
  --sim-shadow: 0 8px 24px rgba(0,0,0,0.4);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--sim-bg); color: var(--sim-text); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: transparent; border: none; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--sim-accent); outline-offset: 2px; }
input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--sim-border); border-radius: 1px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; background: var(--sim-accent); border-radius: 50%; margin-top: -5px; }
input[type=range]::-moz-range-track { height: 2px; background: var(--sim-border); border-radius: 1px; }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; background: var(--sim-accent); border-radius: 50%; border: none; }

.app { width: 100vw; height: 100vh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }

.header { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 12px 24px; background: linear-gradient(to bottom, rgba(10,15,28,0.98), rgba(10,15,28,0.7)); border-bottom: 1px solid var(--sim-border); min-height: 52px; }
.header h1 { font-size: clamp(1.1rem, 1.8vw, 1.5rem); letter-spacing: -0.02em; line-height: 1.1; font-weight: 700; }
.header p { margin-top: 3px; color: var(--sim-muted); font-size: 0.78rem; letter-spacing: 0.02em; }
.status { border: 1px solid rgba(95,180,216,0.25); border-radius: 999px; padding: 7px 14px; background: var(--sim-accent-soft); color: var(--sim-accent); font-weight: 700; white-space: nowrap; font-size: 0.78rem; letter-spacing: 0.04em; }

.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 320px); gap: 12px; padding: 12px 16px; overflow: hidden; }
.stage-wrap { position: relative; min-height: 0; overflow: hidden; border-radius: var(--sim-radius-md); border: 1px solid var(--sim-border); background: var(--sim-surface); }
#scene { display: block; width: 100%; height: 100%; }

.side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; overflow: hidden; }
.panel { background: var(--sim-surface); border: 1px solid var(--sim-border); border-radius: var(--sim-radius-md); padding: 14px 16px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.panel-head h2 { font-size: 0.82rem; font-weight: 700; letter-spacing: 0.02em; }
.panel-head span { color: var(--sim-muted); font-size: 0.68rem; }
.readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.metric { padding: 10px 12px; border: 1px solid rgba(95,180,216,0.12); border-radius: 10px; background: var(--sim-surface-soft); }
.metric small { display: block; margin-bottom: 3px; color: var(--sim-muted); font-size: 0.66rem; letter-spacing: 0.04em; }
.metric strong { font-size: 1.05rem; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; font-weight: 700; }
.hole-list { display: grid; gap: 6px; margin-top: 4px; }
.hole-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; background: var(--sim-surface-soft); border: 1px solid var(--sim-border); font-size: 0.72rem; }
.hole-dot { width: 8px; height: 8px; border-radius: 50%; }
.hole-row .range-val { font-variant-numeric: tabular-nums; color: var(--sim-text); font-weight: 700; }
.hole-row.farthest { border-color: var(--sim-warning); background: rgba(212,160,74,0.08); }
.hole-row.farthest .range-val { color: var(--sim-warning); }
.model-note { display: grid; align-content: start; gap: 10px; overflow-y: auto; }
.model-note p { color: var(--sim-muted); line-height: 1.5; font-size: 0.74rem; }
.insight { padding: 11px 13px; border-left: 3px solid var(--sim-warning); border-radius: 0 10px 10px 0; background: rgba(212,160,74,0.08); color: var(--sim-warning); font-weight: 700; font-size: 0.78rem; line-height: 1.45; }

.controls { padding: 14px 24px 18px; display: flex; align-items: center; gap: 28px; background: linear-gradient(to top, rgba(5,8,16,0.98), rgba(5,8,16,0.7)); border-top: 1px solid var(--sim-border); flex-wrap: wrap; }
.guess-group { display: flex; gap: 8px; align-items: center; }
.guess-btn { padding: 9px 18px; border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); color: var(--sim-muted); font-size: 13px; font-weight: 600; letter-spacing: 0.04em; transition: all 0.2s ease; background: var(--sim-surface-soft); }
.guess-btn:hover { border-color: var(--sim-accent); color: var(--sim-text); }
.guess-btn.selected { border-color: var(--sim-accent); color: var(--sim-accent); background: var(--sim-accent-soft); }
.guess-btn.revealed-correct { border-color: var(--sim-warning); color: var(--sim-warning); background: rgba(212,160,74,0.12); box-shadow: inset 0 0 0 1px rgba(212,160,74,0.3); }
.guess-btn.revealed-wrong { opacity: 0.35; }
.guess-btn.revealed-other-correct { border-color: var(--sim-warning); color: var(--sim-warning); background: rgba(212,160,74,0.08); }
.guess-btn:disabled { cursor: default; }
.guess-label { font-size: 11px; color: var(--sim-muted); letter-spacing: 0.18em; text-transform: uppercase; margin-right: 4px; }
.divider { width: 1px; height: 28px; background: var(--sim-border); }
.slider-group { display: flex; gap: 24px; align-items: center; flex: 1; min-width: 0; }
.slider-item { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.slider-item label { display: flex; justify-content: space-between; font-size: 11px; color: var(--sim-muted); letter-spacing: 0.08em; }
.slider-item .val { color: var(--sim-text); font-variant-numeric: tabular-nums; }
.slider-item input { width: 160px; }

@media (max-width: 860px) {
  .app { height: auto; min-height: 100vh; overflow: visible; }
  .main { grid-template-columns: 1fr; }
  .stage-wrap { min-height: 0; }
  #scene { height: auto; aspect-ratio: 760 / 420; }
  .side { grid-template-rows: auto auto; }
  .controls { padding: 10px 14px 14px; gap: 14px; flex-direction: column; align-items: stretch; }
  .divider { display: none; }
  .slider-group { flex-direction: column; gap: 10px; align-items: stretch; }
  .slider-item input { width: 100%; }
  .guess-group { justify-content: center; }
}
@media (max-width: 480px) {
  .guess-btn { padding: 8px 12px; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>三孔平抛射程实验</h1>
      <p>调节水位与水箱高度，猜测哪个孔喷得最远，揭示 h=y 时射程最大的规律。</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">运行中</div>
  </header>

  <main class="main">
    <div class="stage-wrap" data-region="stage">
      <canvas id="scene" aria-label="三孔平抛射程实验舞台"></canvas>
    </div>

    <aside class="side" data-region="evidence">
      <section class="panel" aria-label="实时数据">
        <div class="panel-head"><h2>实时数据</h2><span>各孔射程</span></div>
        <div class="readout-grid">
          <div class="metric"><small>水箱总高</small><strong id="readH">1.00 m</strong></div>
          <div class="metric"><small>水面高度</small><strong id="readWater">0.60 m</strong></div>
        </div>
        <div class="hole-list" id="holeList"></div>
      </section>
      <section class="panel model-note" data-region="insight">
        <div class="panel-head"><h2>模型说明</h2></div>
        <p id="insight" class="insight">拖动滑块调节水位，点击下方按钮猜测哪个孔喷得最远。</p>
        <p>教学视图：v = √(2gh)，t = √(2y/g)，射程 x = v·t = 2√(h·y)。当孔位于水面与地面正中（h=y）时射程最大。</p>
      </section>
    </aside>
  </main>

  <section class="controls" data-region="controls" aria-label="实验控件">
    <div class="guess-group">
      <span class="guess-label">猜哪个最远</span>
      <button id="btnTop" class="guess-btn" type="button">上孔</button>
      <button id="btnMid" class="guess-btn" type="button">中孔</button>
      <button id="btnBot" class="guess-btn" type="button">下孔</button>
    </div>
    <div class="divider"></div>
    <div class="slider-group">
      <div class="slider-item">
        <label>水箱总高 <span class="val" id="valH">1.0 m</span></label>
        <input id="sliderH" type="range" min="0.6" max="2.0" step="0.05" value="1.0" aria-label="水箱总高">
      </div>
      <div class="slider-item">
        <label>水面高度 <span class="val" id="valWater">0.6 m</span></label>
        <input id="sliderWater" type="range" min="0.3" max="1.9" step="0.05" value="0.6" aria-label="水面高度">
      </div>
    </div>
  </section>
</div>
<script>
(() => {
  "use strict";
  const G = 9.81;
  const parameterSchema = [
    { key: "H", label: "水箱总高", type: "slider", min: 0.6, max: 2.0, step: 0.05, default: 1.0, unit: "m" },
    { key: "water", label: "水面高度", type: "slider", min: 0.3, max: 1.9, step: 0.05, default: 0.6, unit: "m" }
  ];
  const state = {
    running: true,
    t: 0,
    H: 1.0,
    water: 0.6,
    guess: null,
    revealed: false,
    lastTimestamp: null,
    history: []
  };
  const elements = {
    canvas: document.getElementById("scene"),
    btnTop: document.getElementById("btnTop"),
    btnMid: document.getElementById("btnMid"),
    btnBot: document.getElementById("btnBot"),
    sliderH: document.getElementById("sliderH"),
    sliderWater: document.getElementById("sliderWater"),
    valH: document.getElementById("valH"),
    valWater: document.getElementById("valWater"),
    status: document.getElementById("status"),
    readH: document.getElementById("readH"),
    readWater: document.getElementById("readWater"),
    holeList: document.getElementById("holeList"),
    insight: document.getElementById("insight")
  };
  const ctx = elements.canvas.getContext("2d");
  let dpr = 1, cssW = 0, cssH = 0;

  function clamp(v, mn, mx) { return Math.min(mx, Math.max(mn, v)); }
  function finite(v, fb) { return Number.isFinite(v) ? v : fb; }

  function getHoles() {
    return [
      { name: "top", label: "上孔", yWorld: state.water * 0.85, color: "#5fb4d8" },
      { name: "mid", label: "中孔", yWorld: state.water * 0.50, color: "#a8d4a0" },
      { name: "bot", label: "下孔", yWorld: state.water * 0.15, color: "#d4a04a" }
    ];
  }
  function computeTrajectory(h) {
    const depth = state.water - h.yWorld;
    if (depth <= 0.001) return { points: [], range: 0, v: 0, depth: 0, fallTime: 0, valid: false };
    const v = Math.sqrt(2 * G * depth);
    const fallTime = Math.sqrt(2 * h.yWorld / G);
    const range = v * fallTime;
    const points = [];
    const steps = 80;
    for (let i = 0; i <= steps; i++) {
      const tt = (i / steps) * fallTime;
      points.push({ x: v * tt, y: h.yWorld - 0.5 * G * tt * tt });
    }
    return { points, range, v, depth, fallTime, valid: true };
  }
  function getFarthestHole(holes, trajs) {
    let idx = -1, maxR = -1;
    for (let i = 0; i < holes.length; i++) {
      if (trajs[i].valid && trajs[i].range > maxR) { maxR = trajs[i].range; idx = i; }
    }
    return idx;
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    const rect = elements.canvas.getBoundingClientRect();
    cssW = rect.width; cssH = rect.height;
    elements.canvas.width = Math.max(1, Math.floor(cssW * dpr));
    elements.canvas.height = Math.max(1, Math.floor(cssH * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function getLayout() {
    const padL = 64, padR = 40, padT = 36, padB = 56;
    const w = Math.max(100, cssW - padL - padR);
    const h = Math.max(100, cssH - padT - padB);
    const tankW = clamp(w * 0.16, 38, 78);
    const tankLeft = padL + w * 0.05;
    const tankRight = tankLeft + tankW;
    const groundY = padT + h;
    const topY = groundY - state.H * (h / Math.max(state.H, 0.5));
    const pxPerM = (groundY - topY) / Math.max(state.H, 0.5);
    const groundX0 = tankRight;
    const groundX1 = padL + w;
    return { padL, padR, padT, padB, w, h, tankW, tankLeft, tankRight, groundY, topY, pxPerM, groundX0, groundX1 };
  }

  function drawBackground() {
    ctx.fillStyle = "#050810";
    ctx.fillRect(0, 0, cssW, cssH);
    const grad = ctx.createLinearGradient(0, 0, 0, cssH);
    grad.addColorStop(0, "rgba(20,30,55,0.5)");
    grad.addColorStop(0.5, "rgba(8,12,22,0.2)");
    grad.addColorStop(1, "rgba(5,8,16,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, cssW, cssH);
  }
  function drawGrid(L) {
    const stepPx = L.pxPerM * 0.5;
    if (stepPx < 8) return;
    ctx.strokeStyle = "rgba(95,180,216,0.04)";
    ctx.lineWidth = 1;
    const xStart = Math.ceil(L.padL / stepPx) * stepPx;
    for (let x = xStart; x < cssW; x += stepPx) {
      ctx.beginPath(); ctx.moveTo(x, L.padT); ctx.lineTo(x, L.groundY); ctx.stroke();
    }
    const yStart = Math.ceil(L.topY / stepPx) * stepPx;
    for (let y = yStart; y < L.groundY; y += stepPx) {
      ctx.beginPath(); ctx.moveTo(L.padL, y); ctx.lineTo(cssW - L.padR, y); ctx.stroke();
    }
  }
  function drawGround(L) {
    ctx.strokeStyle = "rgba(95,180,216,0.45)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(L.padL, L.groundY); ctx.lineTo(cssW - L.padR, L.groundY);
    ctx.stroke();
    ctx.strokeStyle = "rgba(95,180,216,0.10)";
    for (let x = L.padL; x < cssW - L.padR; x += 8) {
      ctx.beginPath(); ctx.moveTo(x, L.groundY); ctx.lineTo(x - 5, L.groundY + 5); ctx.stroke();
    }
  }
  function drawScale(L) {
    ctx.fillStyle = "rgba(232,238,252,0.55)";
    ctx.font = '11px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    const maxM = Math.ceil((cssW - L.padR - L.groundX0) / L.pxPerM);
    for (let m = 0; m <= maxM; m++) {
      const x = L.groundX0 + m * L.pxPerM;
      if (x > cssW - L.padR - 4) break;
      ctx.strokeStyle = "rgba(95,180,216,0.35)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, L.groundY); ctx.lineTo(x, L.groundY + 5); ctx.stroke();
      if (m === 0 || m % 1 === 0) ctx.fillText(m + "m", x, L.groundY + 8);
    }
  }
  function drawTank(L) {
    const x0 = L.tankLeft, x1 = L.tankRight;
    const yTop = L.topY, yBot = L.groundY;
    const waterY = L.groundY - state.water * L.pxPerM;
    ctx.fillStyle = "rgba(95,180,216,0.04)";
    ctx.fillRect(x0, yTop, x1 - x0, yBot - yTop);
    ctx.fillStyle = "rgba(95,180,216,0.14)";
    ctx.fillRect(x0, waterY, x1 - x0, yBot - waterY);
    const wg = ctx.createLinearGradient(0, waterY, 0, yBot);
    wg.addColorStop(0, "rgba(95,180,216,0.22)");
    wg.addColorStop(1, "rgba(95,180,216,0.06)");
    ctx.fillStyle = wg;
    ctx.fillRect(x0, waterY, x1 - x0, yBot - waterY);
    ctx.strokeStyle = "rgba(95,180,216,0.55)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x0, yTop); ctx.lineTo(x0, yBot); ctx.lineTo(x1, yBot); ctx.lineTo(x1, yTop);
    ctx.stroke();
    ctx.strokeStyle = "rgba(95,180,216,0.7)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x0, waterY); ctx.lineTo(x1, waterY);
    ctx.stroke();
    ctx.fillStyle = "rgba(232,238,252,0.5)";
    ctx.font = '10px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    ctx.textAlign = "left"; ctx.textBaseline = "bottom";
    ctx.fillText("水位 " + state.water.toFixed(2) + "m", x0 + 4, waterY - 3);
    ctx.textBaseline = "top";
    ctx.fillText("H=" + state.H.toFixed(2) + "m", x0 + 4, yTop + 4);
    const holes = getHoles();
    for (const h of holes) {
      const hy = L.groundY - h.yWorld * L.pxPerM;
      ctx.strokeStyle = h.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x1 - 4, hy); ctx.lineTo(x1 + 4, hy);
      ctx.stroke();
    }
  }
  function drawTrajectory(L, hole, traj, isFarthest, isRevealed) {
    if (!traj.valid || traj.points.length < 2) return;
    const hy = L.groundY - hole.yWorld * L.pxPerM;
    const pts = traj.points.map(p => ({
      x: L.tankRight + p.x * L.pxPerM,
      y: L.groundY - p.y * L.pxPerM
    }));
    let alpha = 0.85, lw = 2;
    if (state.revealed) {
      if (isFarthest) { alpha = 1.0; lw = 3.2; }
      else { alpha = 0.22; lw = 1.5; }
    }
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = "rgba(0,0,0,0.5)";
    ctx.lineWidth = lw + 2;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
    ctx.strokeStyle = hole.color;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
    ctx.globalAlpha = 1;
    const end = pts[pts.length - 1];
    ctx.fillStyle = hole.color;
    ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.arc(end.x, end.y, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = hole.color;
    ctx.lineWidth = 1;
    ctx.globalAlpha = alpha * 0.5;
    ctx.beginPath();
    ctx.moveTo(end.x, L.groundY - 3); ctx.lineTo(end.x, L.groundY + 3);
    ctx.stroke();
    ctx.globalAlpha = 1;
    if (state.revealed && isFarthest) {
      ctx.fillStyle = "rgba(212,160,74,0.9)";
      ctx.font = 'bold 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.fillText("最远 " + traj.range.toFixed(2) + "m", end.x, L.groundY - 8);
    } else if (state.revealed) {
      ctx.fillStyle = "rgba(232,238,252,0.4)";
      ctx.font = '10px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.fillText(traj.range.toFixed(2) + "m", end.x, L.groundY - 6);
    }
    const v = traj.v;
    const arrowLen = Math.min(28, v * 4);
    if (arrowLen > 4) {
      ctx.strokeStyle = hole.color;
      ctx.fillStyle = hole.color;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.moveTo(L.tankRight + 5, hy);
      ctx.lineTo(L.tankRight + 5 + arrowLen, hy);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(L.tankRight + 5 + arrowLen, hy);
      ctx.lineTo(L.tankRight + 5 + arrowLen - 4, hy - 3);
      ctx.lineTo(L.tankRight + 5 + arrowLen - 4, hy + 3);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  function drawFormula(L) {
    if (!state.revealed) return;
    const holes = getHoles();
    const trajs = holes.map(computeTrajectory);
    const fIdx = getFarthestHole(holes, trajs);
    if (fIdx < 0) return;
    const fH = holes[fIdx], fT = trajs[fIdx];
    const x = L.padL + 16;
    const y = L.padT + 16;
    ctx.font = '13px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillStyle = "rgba(232,238,252,0.85)";
    ctx.fillText("v = sqrt(2 * g * h)", x, y);
    ctx.fillStyle = "rgba(107,122,150,0.85)";
    ctx.fillText("h = 孔到水面高度, 射出速度随 h 增大", x, y + 18);
    ctx.fillStyle = "rgba(232,238,252,0.85)";
    ctx.fillText("t = sqrt(2 * y / g)", x, y + 38);
    ctx.fillStyle = "rgba(107,122,150,0.85)";
    ctx.fillText("y = 孔到地面高度, 落地时间随 y 减小", x, y + 56);
    ctx.fillStyle = "rgba(232,238,252,0.85)";
    ctx.fillText("x = v * t = 2 * sqrt(h * y)", x, y + 76);
    ctx.fillStyle = "rgba(212,160,74,0.95)";
    ctx.font = 'bold 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    ctx.fillText("h = y 时 x 最大, 即孔位于水面与地面正中", x, y + 96);
    ctx.font = '11px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    ctx.fillStyle = fH.color;
    ctx.fillText(fH.label + ": h=" + fT.depth.toFixed(2) + "m, y=" + fH.yWorld.toFixed(2) + "m, x=" + fT.range.toFixed(2) + "m", x, y + 118);
  }
  function drawHint(L) {
    if (state.revealed) return;
    ctx.fillStyle = "rgba(232,238,252,0.4)";
    ctx.font = '12px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillText("拖动滑块调节水位, 点击下方按钮猜测哪个孔喷得最远", L.padL + 16, L.padT + 16);
  }
  function drawWaterSurface(L) {
    const waterY = L.groundY - state.water * L.pxPerM;
    const phase = state.t * 1.8;
    ctx.strokeStyle = "rgba(95,180,216,0.4)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = L.tankLeft; x <= L.tankRight; x += 2) {
      const y = waterY + Math.sin(x * 0.18 + phase) * 0.8;
      if (x === L.tankLeft) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  function render() {
    if (cssW < 2 || cssH < 2) return;
    const L = getLayout();
    const holes = getHoles();
    const trajs = holes.map(computeTrajectory);
    const fIdx = getFarthestHole(holes, trajs);
    drawBackground();
    drawGrid(L);
    drawGround(L);
    drawScale(L);
    drawTank(L);
    drawWaterSurface(L);
    for (let i = 0; i < holes.length; i++) {
      drawTrajectory(L, holes[i], trajs[i], i === fIdx, state.revealed);
    }
    drawFormula(L);
    drawHint(L);
    renderReadouts(holes, trajs, fIdx);
  }
  function renderReadouts(holes, trajs, fIdx) {
    elements.readH.textContent = state.H.toFixed(2) + " m";
    elements.readWater.textContent = state.water.toFixed(2) + " m";
    let html = "";
    for (let i = 0; i < holes.length; i++) {
      const h = holes[i], t = trajs[i];
      const cls = i === fIdx && state.revealed ? "hole-row farthest" : "hole-row";
      html += '<div class="' + cls + '">';
      html += '<span class="hole-dot" style="background:' + h.color + '"></span>';
      html += '<span>' + h.label + ' · h=' + (t.valid ? t.depth.toFixed(2) : "0.00") + 'm</span>';
      html += '<span class="range-val">' + (t.valid ? t.range.toFixed(2) : "0.00") + ' m</span>';
      html += '</div>';
    }
    elements.holeList.innerHTML = html;
    if (state.revealed && fIdx >= 0) {
      const fH = holes[fIdx];
      const correct = state.guess === fIdx;
      elements.insight.textContent = correct
        ? "猜对了！" + fH.label + "喷得最远。当孔位于水面与地面正中（h=y）时射程最大。"
        : "猜错了。" + fH.label + "喷得最远。当孔位于水面与地面正中（h=y）时射程最大。";
    } else {
      elements.insight.textContent = "拖动滑块调节水位，点击下方按钮猜测哪个孔喷得最远。";
    }
    elements.status.textContent = state.running ? "运行中" : "已暂停";
  }
  function update(dt) {
    if (!state.running) return;
    const b = clamp(finite(dt, 0), 0, 0.05);
    state.t += b;
  }
  function frame(ts) {
    if (state.lastTimestamp === null) state.lastTimestamp = ts;
    const dt = (ts - state.lastTimestamp) / 1000;
    state.lastTimestamp = ts;
    update(dt); render();
    requestAnimationFrame(frame);
  }
  function start() { state.running = true; render(); }
  function pause() { state.running = false; render(); }
  function setParameters(values) {
    const hDef = parameterSchema[0], wDef = parameterSchema[1];
    state.H = clamp(finite(Number(values.H), hDef.default), hDef.min, hDef.max);
    state.water = clamp(finite(Number(values.water), wDef.default), wDef.min, wDef.max);
    if (state.water > state.H) state.water = state.H;
    elements.sliderH.value = String(state.H);
    elements.sliderWater.value = String(state.water);
    elements.sliderWater.min = String(Math.max(0.3, state.H * 0.3));
    elements.sliderWater.max = String(state.H);
    elements.valH.textContent = state.H.toFixed(2) + " m";
    elements.valWater.textContent = state.water.toFixed(2) + " m";
    if (state.revealed) updateGuessButtons();
    render();
  }
  function getState() { return { ...state }; }
  function getReadouts() {
    const holes = getHoles();
    const trajs = holes.map(computeTrajectory);
    return {
      H: state.H, water: state.water,
      holes: holes.map((h, i) => ({ name: h.name, yWorld: h.yWorld, range: trajs[i].range, v: trajs[i].v }))
    };
  }
  function runModelChecks() {
    const exact = (depth, y) => 2 * Math.sqrt(depth * y);
    const cases = [];
    cases.push({ name: "analytic reference (0.5,0.5)", pass: Math.abs(exact(0.5, 0.5) - 1.0) < 1e-9, expected: 1.0, actual: exact(0.5, 0.5), tolerance: 1e-9 });
    cases.push({ name: "analytic reference (0.75,0.75)", pass: Math.abs(exact(0.75, 0.75) - 1.5) < 1e-9, expected: 1.5, actual: exact(0.75, 0.75), tolerance: 1e-9 });
    cases.push({ name: "max range at h=y=H/2", pass: Math.abs(exact(0.5, 0.5) - 2 * 0.5) < 1e-9, expected: 1.0, actual: exact(0.5, 0.5), tolerance: 1e-9 });
    cases.push({ name: "symmetry (0.3,0.3) < (0.5,0.5)", pass: exact(0.3, 0.3) < exact(0.5, 0.5), expected: "0.6 < 1.0", actual: exact(0.3, 0.3).toFixed(3) + " < " + exact(0.5, 0.5).toFixed(3), tolerance: "strict" });
    cases.push({ name: "depth=0 -> range=0", pass: exact(0, 1) === 0, expected: 0, actual: exact(0, 1), tolerance: 0 });
    cases.push({ name: "y=0 -> range=0", pass: exact(0.5, 0) === 0, expected: 0, actual: exact(0.5, 0), tolerance: 0 });
    return cases;
  }
  function updateGuessButtons() {
    const holes = getHoles();
    const trajs = holes.map(computeTrajectory);
    const fIdx = getFarthestHole(holes, trajs);
    const btns = [elements.btnTop, elements.btnMid, elements.btnBot];
    for (let i = 0; i < 3; i++) {
      btns[i].classList.remove("selected", "revealed-correct", "revealed-wrong", "revealed-other-correct");
      btns[i].disabled = state.revealed;
      if (state.revealed) {
        if (i === fIdx) btns[i].classList.add(i === state.guess ? "revealed-correct" : "revealed-other-correct");
        else if (i === state.guess) btns[i].classList.add("revealed-wrong");
      } else if (i === state.guess) {
        btns[i].classList.add("selected");
      }
    }
  }
  function makeGuess(idx) {
    if (state.revealed) return;
    state.guess = idx;
    state.revealed = true;
    updateGuessButtons();
    render();
  }
  function reset() {
    state.guess = null; state.revealed = false;
    updateGuessButtons(); render();
  }
  function bindControls() {
    elements.btnTop.addEventListener("click", () => makeGuess(0));
    elements.btnMid.addEventListener("click", () => makeGuess(1));
    elements.btnBot.addEventListener("click", () => makeGuess(2));
    elements.sliderH.addEventListener("input", () => {
      const newH = Number(elements.sliderH.value);
      const newWater = Math.min(state.water, newH);
      setParameters({ H: newH, water: newWater });
      if (state.revealed) { state.guess = null; state.revealed = false; updateGuessButtons(); }
    });
    elements.sliderWater.addEventListener("input", () => {
      setParameters({ H: state.H, water: Number(elements.sliderWater.value) });
      if (state.revealed) { state.guess = null; state.revealed = false; updateGuessButtons(); }
    });
    window.addEventListener("resize", () => { resize(); render(); });
  }
  function init() {
    resize(); bindControls(); setParameters({ H: 1.0, water: 0.6 });
    updateGuessButtons(); requestAnimationFrame(frame);
  }
  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
