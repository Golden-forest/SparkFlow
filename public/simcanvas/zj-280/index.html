<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <h1>潮汐的真相<span class="sub">· 为什么一天两次涨潮</span></h1>
    <div class="act-indicator" id="actIndicator">第 1 幕 / 共 3 幕</div>
  </header>
  <main class="main">
    <div class="stage-wrap" data-region="stage">
      <canvas id="scene"></canvas>
      <div class="subtitle" id="subtitle"></div>
    </div>
    <aside class="side" data-region="evidence">
      <section class="readouts" aria-label="实时数据">
        <div class="readout-grid">
          <div class="metric"><small>当前幕</small><strong id="actReadout">1</strong></div>
          <div class="metric"><small>模拟时间</small><strong id="timeReadout">0.0 s</strong></div>
          <div class="metric"><small>地月距离</small><strong id="distReadout">1.00</strong></div>
          <div class="metric"><small>自转速度</small><strong id="spinReadout">1.0×</strong></div>
        </div>
      </section>
      <section class="insight-panel" data-region="insight" aria-label="模型说明">
        <h2>模型说明</h2>
        <div class="insight" id="insight">第1幕：直觉误解 — 月球只吸引朝月侧海水，形成单侧鼓包。</div>
        <div class="model-note">
          <p>潮汐力不是月球引力本身，而是引力随距离变化产生的<span style="color:var(--sim-accent)">差值</span>。</p>
          <p class="formula">F_tide ≈ 2GM_moon · R / d³</p>
          <p>近月侧引力 &gt; 地心引力 → 净力朝月；远月侧引力 &lt; 地心引力 → 净力背月。两侧同时鼓起。</p>
        </div>
      </section>
    </aside>
  </main>
  <section class="controls" data-region="controls" aria-label="模拟控制">
    <div class="act-buttons">
      <button class="act-btn active" data-act="1" type="button">第1幕 直觉误解</button>
      <button class="act-btn" data-act="2" type="button">第2幕 引力差真相</button>
      <button class="act-btn" data-act="3" type="button">第3幕 一天两潮</button>
    </div>
    <div class="run-buttons">
      <button id="startBtn" class="run-btn primary" type="button">开始</button>
      <button id="pauseBtn" class="run-btn" type="button">暂停</button>
      <button id="resetBtn" class="run-btn" type="button">重置</button>
    </div>
    <div class="slider-group">
      <label for="distSlider">地月距离</label>
      <input id="distSlider" type="range" min="0.6" max="1.6" step="0.05" value="1.0">
      <output id="distOutput">1.00</output>
    </div>
    <div class="slider-group">
      <label for="spinSlider">自转速度</label>
      <input id="spinSlider" type="range" min="0.2" max="3.0" step="0.1" value="1.0">
      <output id="spinOutput">1.0</output>
    </div>
  </section>
</div>
<script>
(() => {
  "use strict";

  // ===== 确定性伪随机（固定种子）=====
  function mulberry32(seed) {
    return function() {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rng = mulberry32(20241001);
  const STARS = [];
  for (let i = 0; i < 180; i++) {
    STARS.push({
      x: rng(), y: rng(),
      r: 0.3 + rng() * 1.4,
      tw: rng() * Math.PI * 2,
      tws: 0.5 + rng() * 1.5
    });
  }

  // ===== Canvas 初始化 =====
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const subtitleEl = document.getElementById('subtitle');
  const actIndicator = document.getElementById('actIndicator');
  const distSlider = document.getElementById('distSlider');
  const distOutput = document.getElementById('distOutput');
  const spinSlider = document.getElementById('spinSlider');
  const spinOutput = document.getElementById('spinOutput');
  const actButtons = document.querySelectorAll('.act-btn');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const actReadout = document.getElementById('actReadout');
  const timeReadout = document.getElementById('timeReadout');
  const distReadout = document.getElementById('distReadout');
  const spinReadout = document.getElementById('spinReadout');
  const insightEl = document.getElementById('insight');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    W = Math.max(320, rect.width);
    H = Math.max(240, rect.height);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);

  // ===== 状态 =====
  const state = {
    act: 1,
    targetAct: 1,
    actTransition: 1,
    distance: 1.0,
    spinSpeed: 1.0,
    earthRotation: 0,
    moonOrbit: 0,
    introTimer: 0,
    started: false,
    running: false,
    lastTs: null,
    simTime: 0,
    phase: 0
  };

  // ===== 几何参数 =====
  function getGeo() {
    const cx = W / 2;
    const cy = H / 2;
    const minDim = Math.min(W, H);
    const earthR = Math.max(28, minDim * 0.085);
    const moonR = earthR * 0.27;
    const baseDist = minDim * 0.32;
    const moonDist = baseDist * state.distance;
    return { cx, cy, earthR, moonR, moonDist, minDim };
  }

  // ===== 颜色辅助 =====
  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return [r, g, b];
  }
  function rgba(hex, a) {
    const [r,g,b] = hexToRgb(hex);
    return `rgba(${r},${g},${b},${a})`;
  }

  // ===== 缓动函数 =====
  const ease = {
    inOut: t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2,
    out: t => 1 - Math.pow(1-t, 3),
    inOutCubic: t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2
  };

  // ===== 绘制：星空 =====
  function drawStars(t) {
    for (const s of STARS) {
      const x = s.x * W;
      const y = s.y * H;
      const tw = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * s.tws + s.tw));
      ctx.fillStyle = `rgba(200,220,255,${tw * 0.7})`;
      ctx.beginPath();
      ctx.arc(x, y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ===== 绘制：细网格 =====
  function drawGrid() {
    ctx.strokeStyle = 'rgba(120,160,220,0.05)';
    ctx.lineWidth = 1;
    const step = 60;
    ctx.beginPath();
    for (let x = 0; x <= W; x += step) {
      ctx.moveTo(x, 0); ctx.lineTo(x, H);
    }
    for (let y = 0; y <= H; y += step) {
      ctx.moveTo(0, y); ctx.lineTo(W, y);
    }
    ctx.stroke();
  }

  // ===== 绘制：地球本体 =====
  function drawEarthBody(cx, cy, R, rotation) {
    ctx.save();
    ctx.strokeStyle = 'rgba(0,160,220,0.18)';
    ctx.lineWidth = 18;
    ctx.beginPath();
    ctx.arc(cx, cy, R + 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(0,180,240,0.25)';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(cx, cy, R + 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    const grad = ctx.createRadialGradient(
      cx - R*0.35, cy - R*0.35, R*0.1,
      cx, cy, R
    );
    grad.addColorStop(0, '#3a9dd6');
    grad.addColorStop(0.5, '#1a5f9e');
    grad.addColorStop(0.85, '#0a3a6a');
    grad.addColorStop(1, '#062844');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = 'rgba(60,140,90,0.55)';
    const continents = [
      [[0.1,-0.4],[0.5,-0.3],[0.6,0.0],[0.3,0.2],[-0.1,0.1]],
      [[-0.5,-0.2],[-0.2,-0.5],[0.0,-0.3],[-0.3,0.1]],
      [[-0.6,0.2],[-0.3,0.4],[0.0,0.5],[-0.2,0.3]]
    ];
    for (const c of continents) {
      ctx.beginPath();
      ctx.moveTo(c[0][0]*R, c[0][1]*R);
      for (let i = 1; i < c.length; i++) {
        ctx.lineTo(c[i][0]*R, c[i][1]*R);
      }
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    const rim = ctx.createRadialGradient(cx, cy, R*0.7, cx, cy, R);
    rim.addColorStop(0, 'rgba(0,0,0,0)');
    rim.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = rim;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fill();
  }

  // ===== 绘制：水壳 =====
  function drawWaterShell(cx, cy, R, bulge, axisAngle, highlight) {
    const eps = bulge * 0.22;
    const a = R * (1 + eps);
    const b = R * (1 - eps * 0.5);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(axisAngle);

    if (highlight) {
      ctx.strokeStyle = 'rgba(0,212,255,0.22)';
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.ellipse(0, 0, a + 2, b + 2, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(0,212,255,0.35)';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.ellipse(0, 0, a + 1, b + 1, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    const wgrad = ctx.createRadialGradient(0, 0, R*0.9, 0, 0, a);
    if (highlight) {
      wgrad.addColorStop(0, 'rgba(0,180,220,0.0)');
      wgrad.addColorStop(0.7, 'rgba(0,200,240,0.15)');
      wgrad.addColorStop(1, 'rgba(0,220,255,0.55)');
    } else {
      wgrad.addColorStop(0, 'rgba(40,120,180,0.0)');
      wgrad.addColorStop(0.7, 'rgba(60,140,200,0.12)');
      wgrad.addColorStop(1, 'rgba(80,160,220,0.35)');
    }
    ctx.fillStyle = wgrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, a, b, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = highlight ? 'rgba(0,230,255,0.85)' : 'rgba(100,180,220,0.5)';
    ctx.lineWidth = highlight ? 2 : 1.2;
    ctx.beginPath();
    ctx.ellipse(0, 0, a, b, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();

    return { a, b };
  }

  // ===== 绘制：月球 =====
  function drawMoon(cx, cy, R) {
    ctx.strokeStyle = 'rgba(200,200,220,0.12)';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.arc(cx, cy, R + 3, 0, Math.PI * 2);
    ctx.stroke();

    const grad = ctx.createRadialGradient(
      cx - R*0.3, cy - R*0.3, R*0.1,
      cx, cy, R
    );
    grad.addColorStop(0, '#c8c8d0');
    grad.addColorStop(0.6, '#888894');
    grad.addColorStop(1, '#444450');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.clip();
    const craters = [
      [-0.3, -0.2, 0.18], [0.2, 0.1, 0.14], [-0.1, 0.35, 0.1],
      [0.35, -0.3, 0.08], [0.0, -0.4, 0.07], [-0.4, 0.1, 0.09]
    ];
    for (const [dx, dy, cr] of craters) {
      ctx.fillStyle = 'rgba(60,60,70,0.4)';
      ctx.beginPath();
      ctx.arc(cx + dx*R, cy + dy*R, cr*R, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    const rim = ctx.createRadialGradient(cx, cy, R*0.7, cx, cy, R);
    rim.addColorStop(0, 'rgba(0,0,0,0)');
    rim.addColorStop(1, 'rgba(0,0,0,0.4)');
    ctx.fillStyle = rim;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fill();
  }

  // ===== 绘制：箭头 =====
  function drawArrow(x1, y1, x2, y2, color, width, headSize) {
    width = width || 2;
    headSize = headSize || 6;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    const ang = Math.atan2(y2 - y1, x2 - x1);
    const hx = x2 - Math.cos(ang) * headSize;
    const hy = y2 - Math.sin(ang) * headSize;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(hx, hy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(
      hx - Math.cos(ang - 0.5) * headSize * 0.7,
      hy - Math.sin(ang - 0.5) * headSize * 0.7
    );
    ctx.lineTo(
      hx - Math.cos(ang + 0.5) * headSize * 0.7,
      hy - Math.sin(ang + 0.5) * headSize * 0.7
    );
    ctx.closePath();
    ctx.fill();
  }

  // ===== 绘制：大叉 =====
  function drawBigCross(cx, cy, R, alpha) {
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    const len = R * 1.6;
    const w = R * 0.18;
    ctx.strokeStyle = 'rgba(255,68,102,0.35)';
    ctx.lineWidth = w + 8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - len*0.7, cy - len*0.7);
    ctx.lineTo(cx + len*0.7, cy + len*0.7);
    ctx.moveTo(cx + len*0.7, cy - len*0.7);
    ctx.lineTo(cx - len*0.7, cy + len*0.7);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,80,110,0.95)';
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(cx - len*0.7, cy - len*0.7);
    ctx.lineTo(cx + len*0.7, cy + len*0.7);
    ctx.moveTo(cx + len*0.7, cy - len*0.7);
    ctx.lineTo(cx - len*0.7, cy + len*0.7);
    ctx.stroke();
    ctx.restore();
  }

  // ===== 绘制：标签 =====
  function drawLabel(text, x, y, color, size, align) {
    align = align || 'center';
    size = size || 13;
    ctx.save();
    ctx.font = `${size}px ui-sans-serif, system-ui, sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.lineWidth = 3.5;
    ctx.strokeText(text, x, y);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  // ===== 第一幕：直觉误解 =====
  function drawAct1(t, alpha) {
    const geo = getGeo();
    const { cx, cy, earthR, moonR, moonDist } = geo;

    const moonX = cx + moonDist;
    const moonY = cy;

    ctx.save();
    ctx.globalAlpha = alpha * 0.3;
    ctx.strokeStyle = 'rgba(120,160,220,0.4)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(moonX, moonY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha;
    const bulge = 0.15;
    const offset = earthR * 0.12;
    ctx.translate(cx + offset, cy);
    ctx.strokeStyle = 'rgba(100,180,220,0.5)';
    ctx.lineWidth = 1.5;
    ctx.fillStyle = 'rgba(60,140,200,0.18)';
    ctx.beginPath();
    for (let i = 0; i <= 64; i++) {
      const a = (i / 64) * Math.PI * 2;
      const r = earthR * (1.05 + bulge * Math.cos(a) * (Math.cos(a) > 0 ? 1.2 : 0.3));
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha;
    drawEarthBody(cx, cy, earthR, 0);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha;
    drawMoon(moonX, moonY, moonR);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha;
    const bulgeX = cx + earthR * 1.15;
    const bulgeY = cy;
    drawLabel('海水鼓包', bulgeX + 20, bulgeY - 16, 'rgba(100,200,240,0.9)', 12, 'left');
    ctx.globalAlpha = alpha * 0.7;
    drawArrow(bulgeX + 16, bulgeY - 8, bulgeX + 4, bulgeY - 2, 'rgba(100,200,240,0.7)', 1.5, 5);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha * 0.8;
    const arrowLen = earthR * 0.6;
    drawArrow(cx + earthR * 0.3, cy, cx + earthR * 0.3 + arrowLen, cy, 'rgba(255,170,0,0.85)', 2.5, 8);
    drawLabel('月球引力', cx + earthR * 0.3 + arrowLen + 8, cy - 12, 'rgba(255,170,0,0.9)', 11, 'left');
    ctx.restore();

    const crossTimer = Math.max(0, t - 2);
    const crossAlpha = Math.min(1, crossTimer / 0.6) * alpha;
    drawBigCross(cx, cy, earthR, crossAlpha);
  }

  // ===== 第二幕：引力差真相 =====
  function drawAct2(t, alpha) {
    const geo = getGeo();
    const { cx, cy, earthR, moonR, moonDist } = geo;
    const moonX = cx + moonDist;
    const moonY = cy;
    const axisAngle = 0;

    ctx.save();
    ctx.globalAlpha = alpha * 0.25;
    ctx.strokeStyle = 'rgba(120,160,220,0.5)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 5]);
    ctx.beginPath();
    ctx.moveTo(cx - earthR * 1.5, cy);
    ctx.lineTo(moonX, moonY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha * 0.9;
    const samplePoints = [
      { x: cx - earthR, y: cy, label: '远月侧' },
      { x: cx - earthR * 0.5, y: cy, label: '' },
      { x: cx, y: cy, label: '地心' },
      { x: cx + earthR * 0.5, y: cy, label: '' },
      { x: cx + earthR, y: cy, label: '近月侧' }
    ];
    const dists = samplePoints.map(p => {
      const dx = moonX - p.x;
      const dy = moonY - p.y;
      return Math.sqrt(dx*dx + dy*dy);
    });
    const gravs = dists.map(d => 1 / (d * d));
    const maxG = Math.max(...gravs);
    const maxArrowLen = earthR * 0.55;

    for (let i = 0; i < samplePoints.length; i++) {
      const p = samplePoints[i];
      const gNorm = gravs[i] / maxG;
      const len = maxArrowLen * gNorm;
      const dx = moonX - p.x;
      const dy = moonY - p.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      const ux = dx / d, uy = dy / d;
      const x2 = p.x + ux * len;
      const y2 = p.y + uy * len;
      const warmth = gNorm;
      const r = Math.round(100 + warmth * 155);
      const g = Math.round(160 + warmth * 30);
      const b = Math.round(220 - warmth * 120);
      drawArrow(p.x, p.y, x2, y2, `rgba(${r},${g},${b},0.9)`, 2, 6);
    }

    drawLabel('近月侧', cx + earthR, cy + earthR * 0.5 + 14, 'rgba(255,180,80,0.95)', 11, 'center');
    drawLabel('地心', cx, cy + earthR * 0.5 + 14, 'rgba(180,200,220,0.9)', 11, 'center');
    drawLabel('远月侧', cx - earthR, cy + earthR * 0.5 + 14, 'rgba(100,180,240,0.95)', 11, 'center');
    drawLabel('引力最大', cx + earthR, cy - earthR * 0.7 - 14, 'rgba(255,180,80,0.85)', 10, 'center');
    drawLabel('引力最小', cx - earthR, cy - earthR * 0.7 - 14, 'rgba(100,180,240,0.85)', 10, 'center');
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha * 0.95;
    const netLen = earthR * 0.35;
    drawArrow(cx + earthR, cy, cx + earthR + netLen, cy, 'rgba(0,230,255,0.95)', 3, 8);
    drawLabel('净力差 朝月', cx + earthR + netLen + 10, cy - 10, 'rgba(0,230,255,0.95)', 11, 'left');

    drawArrow(cx - earthR, cy, cx - earthR - netLen, cy, 'rgba(0,230,255,0.95)', 3, 8);
    drawLabel('净力差 背月', cx - earthR - netLen - 10, cy - 10, 'rgba(0,230,255,0.95)', 11, 'right');
    ctx.restore();

    const bulgeProgress = Math.min(1, t * 0.8);
    const bulge = ease.out(bulgeProgress) * 0.85;
    ctx.save();
    ctx.globalAlpha = alpha;
    drawWaterShell(cx, cy, earthR * 1.08, bulge, axisAngle, true);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha;
    drawEarthBody(cx, cy, earthR, 0);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha;
    drawMoon(moonX, moonY, moonR);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha * 0.9;
    const bumpR = earthR * 1.08 * (1 + bulge * 0.22);
    drawLabel('潮汐隆起', cx + bumpR + 14, cy - 8, 'rgba(0,230,255,0.95)', 11, 'left');
    drawLabel('潮汐隆起', cx - bumpR - 14, cy - 8, 'rgba(0,230,255,0.95)', 11, 'right');
    ctx.restore();
  }

  // ===== 第三幕：一天两潮 =====
  function drawAct3(t, alpha) {
    const geo = getGeo();
    const { cx, cy, earthR, moonR, moonDist, minDim } = geo;

    const moonOrbitAngle = state.moonOrbit;
    const moonX = cx + moonDist * Math.cos(moonOrbitAngle * 0.15);
    const moonY = cy + moonDist * 0.1 * Math.sin(moonOrbitAngle * 0.15);
    const axisAngle = Math.atan2(moonY - cy, moonX - cx);

    ctx.save();
    ctx.globalAlpha = alpha * 0.2;
    ctx.strokeStyle = 'rgba(120,160,220,0.5)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 5]);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(moonX, moonY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    const distFactor = 1 / (state.distance * state.distance);
    const bulge = 0.7 * distFactor;
    ctx.save();
    ctx.globalAlpha = alpha;
    drawWaterShell(cx, cy, earthR * 1.08, bulge, axisAngle, true);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha;
    drawEarthBody(cx, cy, earthR, state.earthRotation);
    ctx.restore();

    const pointAngle = state.earthRotation;
    const px = cx + Math.cos(pointAngle) * earthR * 1.02;
    const py = cy + Math.sin(pointAngle) * earthR * 1.02;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = 'rgba(255,170,0,0.25)';
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 4]);
    ctx.beginPath();
    ctx.arc(cx, cy, earthR * 1.02, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,200,80,0.95)';
    ctx.strokeStyle = 'rgba(255,170,0,0.6)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(px, py, 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,220,120,1)';
    ctx.beginPath();
    ctx.arc(px, py, 3.5, 0, Math.PI * 2);
    ctx.fill();
    drawLabel('地表点', px + 10, py - 10, 'rgba(255,200,80,0.95)', 10, 'left');
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha;
    drawMoon(moonX, moonY, moonR);
    ctx.restore();

    drawSunTideInset(t, alpha);

    ctx.save();
    ctx.globalAlpha = alpha * 0.85;
    drawLabel('一天穿过两个隆起 = 两次涨潮', cx, cy + earthR * 1.7, 'rgba(0,230,255,0.9)', 12, 'center');
    ctx.restore();
  }

  // ===== 太阳潮汐叠加小图 =====
  function drawSunTideInset(t, alpha) {
    const insetW = Math.min(220, W * 0.22);
    const insetH = insetW * 0.6;
    const ix = W - insetW - 20;
    const iy = 20;

    ctx.save();
    ctx.globalAlpha = alpha * 0.95;

    ctx.fillStyle = 'rgba(10,20,40,0.7)';
    ctx.strokeStyle = 'rgba(120,160,220,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(ix, iy, insetW, insetH, 8);
    } else {
      ctx.rect(ix, iy, insetW, insetH);
    }
    ctx.fill();
    ctx.stroke();

    drawLabel('日月叠加', ix + insetW / 2, iy + 14, 'rgba(200,220,240,0.9)', 11, 'center');

    const phaseY = iy + insetH * 0.55;
    const phaseR = Math.min(14, insetH * 0.18);
    const phases = [
      { name: '朔·望', x: ix + insetW * 0.25, big: true },
      { name: '上弦', x: ix + insetW * 0.5, big: false },
      { name: '下弦', x: ix + insetW * 0.75, big: false }
    ];

    for (const p of phases) {
      ctx.fillStyle = 'rgba(60,140,200,0.7)';
      ctx.beginPath();
      ctx.arc(p.x, phaseY, phaseR, 0, Math.PI * 2);
      ctx.fill();
      const b = p.big ? 0.5 : 0.2;
      ctx.strokeStyle = p.big ? 'rgba(0,230,255,0.9)' : 'rgba(100,180,220,0.5)';
      ctx.lineWidth = p.big ? 2 : 1.2;
      ctx.beginPath();
      ctx.ellipse(p.x, phaseY, phaseR * (1 + b * 0.3), phaseR * (1 - b * 0.15), 0, 0, Math.PI * 2);
      ctx.stroke();
      drawLabel(p.name, p.x, phaseY + phaseR + 12, p.big ? 'rgba(0,230,255,0.95)' : 'rgba(160,180,200,0.8)', 9, 'center');
      if (p.big) {
        drawLabel('大潮', p.x, phaseY - phaseR - 10, 'rgba(0,230,255,0.95)', 9, 'center');
      } else {
        drawLabel('小潮', p.x, phaseY - phaseR - 10, 'rgba(160,180,200,0.8)', 9, 'center');
      }
    }

    ctx.restore();
  }

  // ===== 字幕更新 =====
  const SUBTITLES = {
    1: '这是大多数人的想象 — 但它是<span class="em-danger">错</span>的。月球并非只吸引正对它的那一面海水。',
    2: '潮汐不是月球的引力，而是引力的<span class="em">差</span>。近月侧多出朝月净力，远月侧多出背月净力，两侧同时鼓起。',
    3: '地球自转让地表每个点一天穿过两个隆起 = <span class="em">两次涨潮</span>。朔望时日月叠加成<span class="em-warn">大潮</span>，上下弦时相互削弱成小潮。'
  };
  const INSIGHTS = {
    1: '第1幕：直觉误解 — 月球只吸引朝月侧海水，形成单侧鼓包。这是错的。',
    2: '第2幕：引力差真相 — 近月侧净力朝月，远月侧净力背月，两侧同时隆起。',
    3: '第3幕：一天两潮 — 地球自转使每个地表点一天穿过两个隆起，产生两次涨潮。'
  };
  let lastSubAct = 0;
  function updateSubtitle() {
    if (lastSubAct !== state.act) {
      lastSubAct = state.act;
      subtitleEl.classList.remove('visible');
      setTimeout(() => {
        subtitleEl.innerHTML = SUBTITLES[state.act] || '';
        subtitleEl.classList.add('visible');
      }, 300);
      insightEl.textContent = INSIGHTS[state.act] || '';
    }
  }

  // ===== 主渲染 =====
  function render(ts) {
    if (state.lastTs === null) state.lastTs = ts;
    const dt = Math.min(0.05, (ts - state.lastTs) / 1000);
    state.lastTs = ts;

    if (state.running) {
      state.simTime += dt;
    }

    if (!state.started) {
      state.introTimer += dt;
      if (state.introTimer >= 2.0) {
        state.started = true;
      }
    }

    if (state.running && state.started) {
      if (state.act === 3) {
        state.earthRotation += dt * state.spinSpeed * 0.8;
        state.moonOrbit += dt * state.spinSpeed * 0.3;
      } else if (state.act === 2) {
        state.earthRotation += dt * 0.1;
      }
    }

    if (state.actTransition < 1) {
      state.actTransition = Math.min(1, state.actTransition + dt * 2.5);
    }

    ctx.fillStyle = 'rgba(5,8,16,1)';
    ctx.fillRect(0, 0, W, H);

    drawStars(state.simTime);
    drawGrid();

    if (!state.started) {
      ctx.save();
      ctx.fillStyle = 'rgba(232,238,252,0.95)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `bold ${Math.min(32, W * 0.03)}px ui-sans-serif, system-ui, sans-serif`;
      ctx.fillText('潮汐的真相', W / 2, H / 2 - 12);
      ctx.font = `${Math.min(16, W * 0.018)}px ui-sans-serif, system-ui, sans-serif`;
      ctx.fillStyle = 'rgba(122,138,168,0.9)';
      ctx.fillText('为什么一天两次涨潮', W / 2, H / 2 + 16);
      ctx.restore();
      updateReadouts();
      requestAnimationFrame(render);
      return;
    }

    const alpha = ease.inOutCubic(state.actTransition);
    const localT = state.simTime;

    if (state.act === 1) {
      drawAct1(localT, alpha);
    } else if (state.act === 2) {
      drawAct2(localT, alpha);
    } else if (state.act === 3) {
      drawAct3(localT, alpha);
    }

    updateSubtitle();
    updateReadouts();
    requestAnimationFrame(render);
  }

  // ===== 读数更新 =====
  function updateReadouts() {
    actReadout.textContent = String(state.act);
    timeReadout.textContent = state.simTime.toFixed(1) + ' s';
    distReadout.textContent = state.distance.toFixed(2);
    spinReadout.textContent = state.spinSpeed.toFixed(1) + '×';
  }

  // ===== 幕切换 =====
  function switchAct(n) {
    if (n === state.act) return;
    state.act = n;
    state.actTransition = 0;
    state.simTime = 0;
    state.earthRotation = 0;
    state.moonOrbit = 0;
    actIndicator.textContent = `第 ${n} 幕 / 共 3 幕`;
    actButtons.forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.act) === n);
    });
    subtitleEl.classList.remove('visible');
    lastSubAct = 0;
  }

  // ===== 运行时钩子 =====
  function init() {
    resize();
    setTimeout(resize, 100);
    bindControls();
    setParameters({ distance: 1.0, spinSpeed: 1.0 });
    requestAnimationFrame(render);
  }

  function start() {
    state.running = true;
    startBtn.setAttribute('aria-pressed', 'true');
    pauseBtn.setAttribute('aria-pressed', 'false');
  }

  function pause() {
    state.running = false;
    startBtn.setAttribute('aria-pressed', 'false');
    pauseBtn.setAttribute('aria-pressed', 'true');
  }

  function reset() {
    pause();
    state.simTime = 0;
    state.earthRotation = 0;
    state.moonOrbit = 0;
    state.actTransition = 1;
    state.introTimer = 0;
    state.started = false;
    state.lastTs = null;
    switchAct(1);
    state.actTransition = 1;
    render();
  }

  function update(dt) {
    const boundedDt = Math.min(0.05, Math.max(0, dt));
    if (!state.running) return;
    state.simTime += boundedDt;
    if (!state.started) {
      state.introTimer += boundedDt;
      if (state.introTimer >= 2.0) state.started = true;
    }
    if (state.started) {
      if (state.act === 3) {
        state.earthRotation += boundedDt * state.spinSpeed * 0.8;
        state.moonOrbit += boundedDt * state.spinSpeed * 0.3;
      } else if (state.act === 2) {
        state.earthRotation += boundedDt * 0.1;
      }
    }
    if (state.actTransition < 1) {
      state.actTransition = Math.min(1, state.actTransition + boundedDt * 2.5);
    }
  }

  function setParameters(values) {
    if (values.distance !== undefined) {
      const v = parseFloat(values.distance);
      state.distance = Number.isFinite(v) ? Math.min(1.6, Math.max(0.6, v)) : 1.0;
      distSlider.value = String(state.distance);
      distOutput.textContent = state.distance.toFixed(2);
    }
    if (values.spinSpeed !== undefined) {
      const v = parseFloat(values.spinSpeed);
      state.spinSpeed = Number.isFinite(v) ? Math.min(3.0, Math.max(0.2, v)) : 1.0;
      spinSlider.value = String(state.spinSpeed);
      spinOutput.textContent = state.spinSpeed.toFixed(1);
    }
  }

  function getState() {
    return {
      act: state.act,
      running: state.running,
      started: state.started,
      simTime: state.simTime,
      earthRotation: state.earthRotation,
      moonOrbit: state.moonOrbit,
      distance: state.distance,
      spinSpeed: state.spinSpeed,
      actTransition: state.actTransition
    };
  }

  function getReadouts() {
    return {
      act: state.act,
      time: state.simTime,
      distance: state.distance,
      spinSpeed: state.spinSpeed
    };
  }

  // ===== 模型检查 =====
  function runModelChecks() {
    function grav(r) { return 1 / (r * r); }
    const r = 60, d = 1;
    const nearDiff = grav(r - d) - grav(r);
    const farDiff = grav(r) - grav(r + d);
    const nearDir = nearDiff > 0 ? 'toward-moon' : 'away';
    const farDir = farDiff > 0 ? 'toward-moon' : 'away';
    const farNetSign = (grav(r + d) - grav(r)) < 0;

    return [
      {
        name: '引力 1/r² 衰减',
        pass: grav(2) > grav(4) && grav(4) > grav(8),
        expected: '引力随距离单调递减',
        actual: `g(2)=${grav(2).toFixed(4)}, g(4)=${grav(4).toFixed(4)}, g(8)=${grav(8).toFixed(4)}`,
        tolerance: '严格'
      },
      {
        name: '近月侧净力朝月',
        pass: nearDiff > 0,
        expected: 'F(r-d) - F(r) > 0',
        actual: nearDiff.toFixed(6),
        tolerance: '严格'
      },
      {
        name: '远月侧净力背月',
        pass: farNetSign,
        expected: 'F(r+d) - F(r) < 0 → 背月',
        actual: (grav(r + d) - grav(r)).toFixed(6),
        tolerance: '严格'
      },
      {
        name: '两侧同时产生净力差',
        pass: nearDiff > 0 && farNetSign,
        expected: '近侧朝月 + 远侧背月',
        actual: `近=${nearDiff.toFixed(4)}(朝月), 远=${(grav(r+d)-grav(r)).toFixed(4)}(背月)`,
        tolerance: '严格'
      },
      {
        name: '距离增大潮汐减弱',
        pass: (grav(r-d)-grav(r)) > (grav(r*2-d)-grav(r*2)),
        expected: '近距差 > 远距差',
        actual: `d=60: ${(grav(r-d)-grav(r)).toFixed(6)}, d=120: ${(grav(r*2-d)-grav(r*2)).toFixed(6)}`,
        tolerance: '严格'
      }
    ];
  }

  // ===== 控件绑定 =====
  function bindControls() {
    actButtons.forEach(b => {
      b.addEventListener('click', () => switchAct(parseInt(b.dataset.act)));
    });
    startBtn.addEventListener('click', start);
    pauseBtn.addEventListener('click', pause);
    resetBtn.addEventListener('click', reset);
    distSlider.addEventListener('input', () => {
      state.distance = parseFloat(distSlider.value);
      distOutput.textContent = state.distance.toFixed(2);
    });
    spinSlider.addEventListener('input', () => {
      state.spinSpeed = parseFloat(spinSlider.value);
      spinOutput.textContent = state.spinSpeed.toFixed(1);
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === '1') switchAct(1);
      else if (e.key === '2') switchAct(2);
      else if (e.key === '3') switchAct(3);
    });
  }

  // ===== 暴露运行时接口 =====
  window.simulation = {
    init, start, pause, reset, update, render,
    setParameters, getState, getReadouts, runModelChecks,
    switchAct, state
  };

  init();
})();
</script>
</body>
</html>
