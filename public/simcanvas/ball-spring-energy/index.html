nergies{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;height:180px}.energy-column{display:flex;flex-direction:column;align-items:center;gap:7px}.energy-well{height:112px;width:42px;background:var(--sim-surface-soft);position:relative;border-radius:7px;overflow:hidden}.energy-fill{position:absolute;bottom:0;width:100%;border-radius:6px 6px 0 0;background:var(--quantity-color)}.energy-column b{font-size:18px}.energy-column label{font-size:14px}.motion-row{margin:13px 0}.motion-head{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px}.motion-head b{font-size:18px}.track{height:10px;background:var(--sim-surface-soft);border-radius:4px;position:relative;overflow:hidden}.track.signed:after{content:'';position:absolute;height:100%;width:1px;background:var(--sim-muted);left:50%}.track-fill{height:100%;position:absolute;left:0;background:var(--quantity-color);border-radius:3px}#allView{flex:0 0 auto}#singleView{min-height:230px;flex:0 0 auto}#singleView[hidden],#allView[hidden]{display:none}#singleValue{font-size:52px;letter-spacing:-2px;margin:0 0 4px;line-height:1.2}#singleUnit{font-size:17px;color:var(--sim-muted);letter-spacing:0}.single-meter{height:116px;display:flex;align-items:center;justify-content:center;background:var(--sim-surface-soft);border-radius:var(--sim-radius-md);margin-top:18px}.single-meter svg{width:100%;height:100%}.plot-wrap{flex:1;min-height:160px;border-top:1px solid var(--sim-border);padding-top:15px;display:flex;flex-direction:column}#plot{width:100%;height:100%;min-height:135px;flex:1;display:block}.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px}.legend span:before{content:'';display:inline-block;width:14px;height:3px;background:var(--quantity-color);margin:0 5px 3px 0}.controls{border-top:1px solid var(--sim-border);padding-top:16px;display:grid;grid-template-columns:auto auto minmax(140px,1fr) auto;gap:20px;align-items:center}.actions{display:flex;gap:8px}.primary{background:linear-gradient(90deg,var(--sim-accent-deep),var(--sim-accent));color:#fff;box-shadow:0 5px 14px #14544028;min-width:103px}.primary:hover{background:var(--sim-accent-deep)}.jumps{display:flex;gap:5px}.jumps button{width:42px;padding:8px}.scrub{display:flex;flex-direction:column;gap:4px}.scrub label{font-size:12px;display:flex;justify-content:space-between}input[type=range]{width:100%;accent-color:var(--sim-accent);cursor:pointer}.rate{display:flex;align-items:center;gap:8px;font-size:12px}svg text{font-family:inherit}#apparatus .guide{stroke:var(--sim-border);stroke-dasharray:5 7}#apparatus .point{font-size:22px;font-style:italic;font-weight:600}.vector{stroke-width:5;stroke-linecap:round}.vector-label{font-size:19px;font-weight:650}.point-active{fill:var(--sim-accent);font-weight:800}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

</div><script>
/* Physics contract: analytic, textbook SI; downward y, A=0, O=-h.
   One ball; unilateral massless Hooke spring, Fs=-k max(y,0), gravity +mg.
   First descent only: free fall -> compression at y=0 -> stop at v=0 (C).
   Initial y=-h,v=0; no impact loss at first touch, no drag, no rebound shown.
   Epg=mg(c-y); Ek+Epg+Es constant. Exact event times; no integration step.
   Playback rate changes wall-clock mapping only. Arrows amplified with shared scales.
   Spec: classroom demonstration, scene-first, selectable seven quantities, no insight.
*/
const P={m:1,g:9.8,k:49,h:.4};
function constants(p=P){const b=p.m*p.g/p.k,w=Math.sqrt(p.k/p.m),vA=Math.sqrt(2*p.g*p.h),tA=Math.sqrt(2*p.h/p.g),c=b+Math.sqrt(b*b+2*b*p.h);return {b,w,vA,tA,c,tB:tA+Math.atan2(b*w,vA)/w,tC:tA+(Math.PI-Math.atan2(vA,b*w))/w};}
function sample(t,p=P){const q=constants(p);t=Math.max(0,Math.min(q.tC,t));let y,v;if(t<q.tA){y=-p.h+.5*p.g*t*t;v=p.g*t;}else{const z=q.w*(t-q.tA);y=q.b*(1-Math.cos(z))+q.vA/q.w*Math.sin(z);v=q.b*q.w*Math.sin(z)+q.vA*Math.cos(z);}if(Math.abs(t-q.tC)<1e-12){y=q.c;v=0;}const x=Math.max(0,y),F=p.k*x,a=p.g-F/p.m,Ek=.5*p.m*v*v,Eg=p.m*p.g*(q.c-y),Es=.5*p.k*x*x;return {t,y,v,a,F,Ek,Eg,Es,Em:Ek+Eg+Es,phase:t<q.tA?'Free fall':t<q.tB?'Compressing · accelerating':t<q.tC?'Compressing · slowing':'Lowest point'};}
function runModelChecks(){const out=[],check=(name,actual,expected,tol=1e-9)=>out.push({name,pass:Math.abs(actual-expected)<=tol,actual,expected,tolerance:tol});for(const p of [P,{m:.5,g:9.8,k:80,h:.2},{m:2,g:10,k:50,h:0}]){const q=constants(p),a=sample(q.tA,p),b=sample(q.tB,p),c=sample(q.tC,p);check('O rest',sample(0,p).v,0);check('A spring force',a.F,0);check('A speed',a.v,Math.sqrt(2*p.g*p.h));check('B acceleration',b.a,0);check('B equilibrium compression',b.y,q.b);check('C velocity',c.v,0);check('C energy-root compression',c.y,q.b+Math.sqrt(q.b*q.b+2*q.b*p.h));let drift=0,peak=0;for(let i=0;i<=1000;i++){const s=sample(q.tC*i/1000,p);drift=Math.max(drift,Math.abs(s.Em-sample(0,p).Em));peak=Math.max(peak,s.v);}check('Energy conservation (1001 samples)',drift,0);out.push({name:'B is speed maximum',pass:b.v>=peak-1e-9,actual:b.v,expected:peak,tolerance:1e-9});out.push({name:'C acceleration upward',pass:c.a<0,actual:c.a,expected:'< 0'});const e=1e-8;check('A continuous velocity',sample(Math.max(0,q.tA-e),p).v,sample(q.tA+e,p).v,3e-6);}return out;}

const Q=constants(),E0=sample(0).Em,vmax=sample(Q.tB).v,amax=Math.abs(sample(Q.tC).a),Fmax=sample(Q.tC).F;
const metrics=[{key:'Ek',symbol:'Eₖ',name:'Kinetic energy',unit:'J',color:'#bb791c',max:E0},{key:'Eg',symbol:'EₚG',name:'Gravitational potential energy',unit:'J',color:'#247fbd',max:E0},{key:'Es',symbol:'Eₚₛ',name:'Elastic potential energy',unit:'J',color:'#8b61af',max:E0},{key:'Em',symbol:'Eₘ',name:'Total mechanical energy',unit:'J',color:'#22775f',max:E0},{key:'v',symbol:'v',name:'Velocity',unit:'m/s',color:'#247fbd',max:vmax},{key:'a',symbol:'a',name:'Acceleration',unit:'m/s²',color:'#c65643',max:amax,signed:true},{key:'F',symbol:'Fₛ',name:'Spring force · magnitude',unit:'N',color:'#8b61af',max:Fmax}];
const $=id=>document.getElementById(id),events={O:0,A:Q.tA,B:Q.tB,C:Q.tC};let state=sample(0),running=false,selected='all',rate=.1,last=null;
function fmt(n){return (Math.abs(n)<.0005?0:n).toFixed(2)}
function Y(y){return 235+400*y}
function init(){ $('tabs').innerHTML='<button data-key="all" class="active" aria-pressed="true">All</button>'+metrics.map(m=>`<button data-key="${m.key}" aria-label="${m.name}" aria-pressed="false">${m.symbol}</button>`).join('');$('energies').innerHTML=metrics.slice(0,4).map(m=>`<div class="energy-column" style="--quantity-color:${m.color}"><b id="value-${m.key}">0</b><div class="energy-well"><div class="energy-fill" id="bar-${m.key}"></div></div><label>${m.symbol}</label></div>`).join('');$('motion').innerHTML=metrics.slice(4).map(m=>`<div class="motion-row" style="--quantity-color:${m.color}"><div class="motion-head"><span>${m.symbol} <span class="small">${m.unit}</span></span><b id="value-${m.key}"></b></div><div class="track ${m.signed?'signed':''}"><div id="bar-${m.key}" class="track-fill"></div></div></div>`).join('');$('points').innerHTML=Object.entries(events).map(([name,t])=>{const s=sample(t),y=Y(s.y);return `<line class="guide" x1="155" x2="555" y1="${y}" y2="${y}"/><text id="point-${name}" class="point" x="565" y="${y+7}">${name}</text>`}).join('');render();}
function start(){if(state.t>=Q.tC-1e-12)state=sample(0);running=true;last=null;render()}
function pause(){running=false;render()}
function reset(){running=false;state=sample(0);last=null;render()}
function update(dt){if(running){state=sample(state.t+Math.min(.05,Math.max(0,dt))*rate);if(state.t>=Q.tC)running=false;}}
function setParameters(values){if(Number.isFinite(values.rate)&&values.rate>=.05&&values.rate<=1){rate=values.rate;$('speed').value=String(rate)}}
function seek(t){running=false;state=sample(t);last=null;render()}
function arrow(key,x,y,delta,label){const group=$(key==='v'?'velocityVector':key==='a'?'accelerationVector':'forceVector');group.style.display=Math.abs(delta)<.05?'none':'';const line=$(key+'Line');for(const [k,val]of Object.entries({x1:x,x2:x,y1:y,y2:y+delta}))line.setAttribute(k,val);const text=$(key+'Label');text.setAttribute('x',x+(key==='v'?-26:14));text.setAttribute('y',y+delta/2+6);text.textContent=label;}
function render(){const s=state,ballY=Y(s.y),top=Y(Math.max(0,s.y))+23;let path=`M324 ${top+4}L324 ${top+12}`;const span=600-top-24;for(let i=0;i<21;i++){const x=i===20?324:i%2===0?347:301;path+=`L${x} ${top+12+span*(i+1)/21}`}path+='L324 600';$('spring').setAttribute('d',path);$('cap').setAttribute('y1',top);$('cap').setAttribute('y2',top);$('ball').setAttribute('transform',`translate(324 ${ballY})`);arrow('v',238,ballY,s.v/vmax*102,'v');arrow('a',408,ballY,s.a/amax*100,'a');arrow('f',350,ballY,-s.F/Fmax*104,'Fₛ');$('sceneTime').textContent=s.t.toFixed(3)+' s';const point=Object.entries(events).find(([,t])=>Math.abs(t-s.t)<1e-9)?.[0];$('status').textContent=point?`${running?'Playing':'Paused'} · ${point}`:s.phase;for(const [name,t]of Object.entries(events)){ $('point-'+name).setAttribute('fill',Math.abs(t-s.t)<1e-9?'#22775f':'#677772');document.querySelector(`[data-jump="${name}"]`).classList.toggle('active',Math.abs(t-s.t)<1e-9)}
for(const m of metrics){$('value-'+m.key).textContent=fmt(s[m.key]);const fill=$('bar-'+m.key),ratio=s[m.key]/m.max;fill.style[m.key[0]==='E'?'height':'width']=`${Math.abs(ratio)*(m.signed?50:100)}%`;if(m.signed)fill.style.left=`${ratio<0?50-Math.abs(ratio)*50:50}%`;}
$('progress').value=s.t/Q.tC*1000;$('progressValue').textContent=Math.round(s.t/Q.tC*100)+'%';$('playBtn').textContent=running?'Pause':s.t>=Q.tC?'Replay':s.t===0?'Start':'Resume';$('allView').hidden=selected!=='all';$('singleView').hidden=selected==='all';
if(selected!=='all'){const m=metrics.find(m=>m.key===selected),value=s[m.key],r=value/m.max;$('singleTitle').textContent=m.name;$('singleValue').innerHTML=`${fmt(value)} <span id="singleUnit">${m.unit}</span>`;$('singleValue').style.color=m.color;$('singleDirection').textContent=m.key==='a'?(Math.abs(value)<1e-7?'Zero acceleration':value>0?'↓ Downward':'↑ Upward'):m.key==='v'?(value<1e-7?'At rest':'↓ Downward'):m.key==='F'?(value<1e-7?'No contact force':'↑ Upward on the ball'):'Same energy scale';if(m.key[0]==='E')$('singleMeter').innerHTML=`<svg viewBox="0 0 400 110"><rect x="28" y="35" width="344" height="32" rx="5" fill="#d9ded7"/><rect x="28" y="35" width="${344*r}" height="32" rx="5" fill="${m.color}"/><text x="28" y="92" font-size="13" fill="#677772">0</text><text x="372" y="92" text-anchor="end" font-size="13" fill="#677772">${fmt(E0)} J</text></svg>`;else{const direction=m.key==='F'?-1:Math.sign(value),len=Math.abs(r)*39,tip=55+direction*len;$('singleMeter').innerHTML=`<svg viewBox="0 0 400 110"><line x1="40" y1="16" x2="40" y2="94" stroke="#d4dcd3"/><circle cx="180" cy="55" r="7" fill="${m.color}"/>${len>.1?`<path d="M180 55L180 ${tip}" stroke="${m.color}" stroke-width="5"/><path d="M172 ${tip-direction*10}L180 ${tip}L188 ${tip-direction*10}" fill="none" stroke="${m.color}" stroke-width="4"/>`:''}<text x="225" y="61" font-size="22" fill="${m.color}">${m.symbol}</text></svg>`}}
drawPlot();$('accessibleState').textContent=`${s.phase}; time ${s.t.toFixed(3)} seconds; velocity ${fmt(s.v)}; acceleration ${fmt(s.a)}; spring force ${fmt(s.F)}; kinetic energy ${fmt(s.Ek)}; gravitational energy ${fmt(s.Eg)}; spring energy ${fmt(s.Es)}; total ${fmt(s.Em)}`;

function drawPlot(){const list=selected==='all'?metrics.slice(0,4):[metrics.find(m=>m.key===selected)],m=list[0],W=Math.max(300,$('plot').clientWidth),H=Math.max(135,$('plot').clientHeight),left=44,right=W-22,top=27,bottom=H-29,low=m.signed?-m.max:0,high=m.max,x=t=>left+t/Q.tC*(right-left),y=v=>bottom-(v-low)/(high-low)*(bottom-top);$('plot').setAttribute('viewBox',`0 0 ${W} ${H}`);let html='';for(let i=0;i<3;i++){const val=low+(high-low)*i/2,py=y(val);html+=`<line x1="${left}" x2="${right}" y1="${py}" y2="${py}" stroke="#dce1d8"/><text x="${left-8}" y="${py+4}" text-anchor="end" font-size="12" fill="#677772">${val.toFixed(1)}</text>`}for(const [name,t]of Object.entries(events)){const px=x(t);html+=`<line x1="${px}" x2="${px}" y1="${top}" y2="${bottom}" stroke="#cbd4c9" stroke-dasharray="3 5"/><text x="${px}" y="16" text-anchor="middle" font-size="13" fill="#677772">${name}</text><text x="${px}" y="${H-7}" text-anchor="middle" font-size="12" fill="#677772">${t.toFixed(2)}</text>`}for(const met of list){let d='';const n=Math.ceil(state.t/Q.tC*240);for(let i=0;i<=n;i++){const t=n?state.t*i/n:0,ss=sample(t);d+=`${i?'L':'M'}${x(t).toFixed(2)} ${y(ss[met.key]).toFixed(2)}`}html+=`<path data-curve="${met.key}" d="${d}" fill="none" stroke="${met.color}" stroke-width="2.8"/><circle data-dot="${met.key}" cx="${x(state.t)}" cy="${y(state[met.key])}" r="4" fill="${met.color}"/>`;}html+=`<line x1="${x(state.t)}" x2="${x(state.t)}" y1="${top}" y2="${bottom}" stroke="#243834" opacity=".25"/>`;$('plot').innerHTML=html;$('plotTitle').textContent=selected==='all'?'Energy history':m.symbol+' · history';$('legend').innerHTML=list.map(m=>`<span style="--quantity-color:${m.color}">${m.symbol} / ${m.unit}</span>`).join('');}
