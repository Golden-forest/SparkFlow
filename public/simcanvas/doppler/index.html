<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多普勒效应演示</title>
<style>
:root {
  color-scheme: light;
  --sim-bg: #eef3f8;
  --sim-surface: #ffffff;
  --sim-surface-soft: #f8fafc;
  --sim-text: #172033;
  --sim-muted: #657188;
  --sim-border: #dfe6ef;
  --sim-grid: #e8edf4;
  --sim-accent: #0f9fba;
  --sim-accent-deep: #08758a;
  --sim-accent-soft: #d9f4f7;
  --sim-positive: #0f9fba;
  --sim-warning: #f59e0b;
  --sim-danger: #dc2626;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
  --sim-front: #dc2626;
  --sim-front-soft: rgba(220, 38, 38, 0.10);
  --sim-back: #2563eb;
  --sim-back-soft: rgba(37, 99, 235, 0.10);
  --sim-wave: #0f9fba;
  --sim-wave-soft: rgba(15, 159, 186, 0.16);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--sim-text);
  background:
    radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
    radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
    var(--sim-bg);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
.app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
.header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
.header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
.header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
.status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 12px; }
.panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
.scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.panel-head h2 { margin: 0; font-size: 1rem; }
.panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
#scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); }
.side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; }
.chart-panel { padding: 14px 16px 10px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; min-height: 200px; }
#pitchChart { width: 100%; height: 100%; min-height: 150px; display: block; }
.readouts { padding: 17px; }
.readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.metric { padding: 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
.metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
.metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.metric.front { border-color: rgba(220, 38, 38, 0.22); background: linear-gradient(145deg, #fff5f5, #fef0f0); }
.metric.front strong { color: var(--sim-front); }
.metric.back { border-color: rgba(37, 99, 235, 0.22); background: linear-gradient(145deg, #f5f8ff, #f0f4ff); }
.metric.back strong { color: var(--sim-back); }
.model-note { padding: 14px 17px; display: grid; align-content: start; gap: 10px; }
.model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
.insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; }
.controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
.actions { display: flex; gap: 8px; }
button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
button:hover { border-color: #c7d2e2; background: #eef3f9; }
button:active { transform: scale(.97); }
button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
.control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
.control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
.grid-line { stroke: var(--sim-grid); stroke-width: 1; }
.axis { stroke: #9aa7ba; stroke-width: 1.5; }
.axis-label { fill: var(--sim-muted); font-size: 12px; }
.legend { display: flex; gap: 14px; font-size: 0.78rem; color: var(--sim-muted); }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 14px; height: 4px; border-radius: 2px; }
@media (max-width: 860px) {
  .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
  .main, .app[data-layout] .main { grid-template-columns: 1fr; }
  .controls { grid-template-columns: 1fr; }
  .scene-panel { min-height: 0; }
  #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
  .chart-panel { min-height: 160px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>多普勒效应演示</h1>
      <p>声源运动如何改变观测频率 · 拖动滑块调节车速，观察波前压缩与拉伸</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head">
        <h2 id="scene-title">声波传播与波前分布</h2>
        <div class="legend">
          <span class="legend-item"><span class="legend-dot" style="background:var(--sim-wave)"></span>声波波前</span>
          <span class="legend-item"><span class="legend-dot" style="background:var(--sim-front)"></span>前方（高音）</span>
          <span class="legend-item"><span class="legend-dot" style="background:var(--sim-back)"></span>后方（低音）</span>
        </div>
      </div>
      <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
        <desc id="scene-desc">一辆救护车从左向右移动并持续发出圆形声波。波前在车前方被压缩、在后方被拉伸，体现多普勒效应。</desc>
        <defs>
          <radialGradient id="ambuBody" cx="0.35" cy="0.35">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="0.7" stop-color="#f1f5f9"/>
            <stop offset="1" stop-color="#cbd5e1"/>
          </radialGradient>
        </defs>
        <line class="axis" x1="20" y1="340" x2="740" y2="340" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
        <g id="frontZone" opacity="0.5">
          <rect x="540" y="40" width="200" height="300" fill="var(--sim-front-soft)" rx="8"/>
          <text x="640" y="60" text-anchor="middle" fill="var(--sim-front)" font-size="11" font-weight="700">前方压缩区</text>
        </g>
        <g id="backZone" opacity="0.5">
          <rect x="20" y="40" width="200" height="300" fill="var(--sim-back-soft)" rx="8"/>
          <text x="120" y="60" text-anchor="middle" fill="var(--sim-back)" font-size="11" font-weight="700">后方拉伸区</text>
        </g>
        <g id="waves"></g>
        <g id="observer" transform="translate(80, 340)">
          <circle r="9" fill="var(--sim-back)" stroke="white" stroke-width="2.5"/>
          <text y="-16" text-anchor="middle" font-size="11" fill="var(--sim-muted)" font-weight="600">静止观察者</text>
        </g>
        <g id="source" transform="translate(380, 340)">
          <g id="ambulance">
            <rect x="-30" y="-22" width="60" height="22" rx="3" fill="url(#ambuBody)" stroke="#64748b" stroke-width="1"/>
            <rect x="-22" y="-20" width="14" height="10" rx="1" fill="#0ea5e9" opacity="0.6"/>
            <rect x="-6" y="-20" width="14" height="10" rx="1" fill="#0ea5e9" opacity="0.6"/>
            <rect x="10" y="-20" width="14" height="10" rx="1" fill="#0ea5e9" opacity="0.6"/>
            <rect x="-30" y="-34" width="60" height="14" rx="2" fill="#dc2626" stroke="#991b1b" stroke-width="1"/>
            <text x="0" y="-24" text-anchor="middle" font-size="9" fill="white" font-weight="800">+</text>
            <circle cx="-18" cy="0" r="7" fill="#1e293b"/>
            <circle cx="-18" cy="0" r="3.5" fill="#94a3b8"/>
            <circle cx="18" cy="0" r="7" fill="#1e293b"/>
            <circle cx="18" cy="0" r="3.5" fill="#94a3b8"/>
          </g>
        </g>
      </svg>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel chart-panel">
        <div class="panel-head"><h2>音调曲线</h2><span>观测频率随时间变化</span></div>
        <svg id="pitchChart" viewBox="0 0 360 200" role="img" aria-label="音调曲线图">
          <g id="chartGrid"></g>
          <line class="axis" x1="40" y1="170" x2="350" y2="170"/>
          <line class="axis" x1="40" y1="20" x2="40" y2="170"/>
          <line x1="40" y1="95" x2="350" y2="95" stroke="var(--sim-muted)" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
          <text class="axis-label" x="345" y="190" text-anchor="end">时间</text>
          <text class="axis-label" x="10" y="28">高音</text>
          <text class="axis-label" x="10" y="99">原频</text>
          <text class="axis-label" x="10" y="168">低音</text>
          <polyline id="frontTrace" fill="none" stroke="var(--sim-front)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline id="backTrace" fill="none" stroke="var(--sim-back)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="345" y="40" text-anchor="end" font-size="10" fill="var(--sim-front)" font-weight="700">前方 f'</text>
          <text x="345" y="160" text-anchor="end" font-size="10" fill="var(--sim-back)" font-weight="700">后方 f'</text>
        </svg>
      </section>

      <section class="panel readouts">
        <div class="readout-grid">
          <div class="metric"><small>车速比 v/c</small><strong id="vcReadout">0.50</strong></div>
          <div class="metric"><small>车速</small><strong id="vReadout">170 m/s</strong></div>
          <div class="metric front"><small>前方频率 f'</small><strong id="frontReadout">680 Hz</strong></div>
          <div class="metric back"><small>后方频率 f'</small><strong id="backReadout">227 Hz</strong></div>
        </div>
      </section>

      <section class="panel model-note" data-region="insight">
        <p id="insight" class="insight">按"开始"启动救护车。波前在车前方堆积变密（高音），后方拉开变疏（低音）。</p>
        <p>教学模型：f' = f₀ · c / (c ∓ v)。声源朝观察者运动时取"−"（前方频率升高），远离时取"+"（后方频率降低）。声速 c = 340 m/s，源频率 f₀ = 453 Hz。</p>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="模拟控制">
    <div class="actions">
      <button id="startBtn" class="primary" type="button">开始</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control">
      <label for="speedInput">救护车速度 <output id="speedOutput">0.50 c</output></label>
      <input id="speedInput" type="range" min="0" max="0.95" step="0.01" value="0.5">
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";
  const C_SOUND = 340;
  const F0 = 453;
  const parameterSchema = [
    { key: "speed", label: "救护车速度", type: "slider", min: 0, max: 0.95, step: 0.01, default: 0.5, unit: "c" }
  ];
  const SCENE_W = 760, SCENE_H = 420, TRACK_Y = 340;
  const SOURCE_START_X = 380, SOURCE_END_X = 660;
  const WAVE_INTERVAL = 0.18;
  const MAX_WAVES = 60;
  const CHART_W = 360, CHART_H = 200, CHART_PAD_L = 40, CHART_PAD_R = 10, CHART_PAD_T = 20, CHART_PAD_B = 30;
  const CHART_PLOT_W = CHART_W - CHART_PAD_L - CHART_PAD_R;
  const CHART_PLOT_H = CHART_H - CHART_PAD_T - CHART_PAD_B;
  const CHART_Y_MID = CHART_PAD_T + CHART_PLOT_H / 2;
  const CHART_WINDOW = 12;
  const CHART_MAX_SAMPLES = 300;

  const state = {
    running: false, t: 0, sourceX: SOURCE_START_X, speed: 0.5,
    waves: [], nextWaveT: 0, lastTimestamp: null,
    chartHistory: []
  };

  const elements = {
    status: document.querySelector("#status"),
    waves: document.querySelector("#waves"),
    source: document.querySelector("#source"),
    frontTrace: document.querySelector("#frontTrace"),
    backTrace: document.querySelector("#backTrace"),
    chartGrid: document.querySelector("#chartGrid"),
    insight: document.querySelector("#insight"),
    vcReadout: document.querySelector("#vcReadout"),
    vReadout: document.querySelector("#vReadout"),
    frontReadout: document.querySelector("#frontReadout"),
    backReadout: document.querySelector("#backReadout"),
    speedInput: document.querySelector("#speedInput"),
    speedOutput: document.querySelector("#speedOutput"),
    startBtn: document.querySelector("#startBtn"),
    pauseBtn: document.querySelector("#pauseBtn"),
    resetBtn: document.querySelector("#resetBtn")
  };

  function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
  function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

  function initChartGrid() {
    const lines = [];
    for (let i = 0; i <= 4; i++) {
      const y = CHART_PAD_T + (i / 4) * CHART_PLOT_H;
      lines.push(`<line class="grid-line" x1="${CHART_PAD_L}" y1="${y}" x2="${CHART_W - CHART_PAD_R}" y2="${y}"/>`);
    }
    for (let i = 0; i <= 6; i++) {
      const x = CHART_PAD_L + (i / 6) * CHART_PLOT_W;
      lines.push(`<line class="grid-line" x1="${x}" y1="${CHART_PAD_T}" x2="${x}" y2="${CHART_H - CHART_PAD_B}"/>`);
    }
    elements.chartGrid.innerHTML = lines.join("");
  }

  function init() {
    initChartGrid();
    bindControls();
    setParameters({ speed: 0.5 });
    reset();
    requestAnimationFrame(frame);
  }

  function start() {
    state.running = true;
    elements.status.textContent = "运行中";
    elements.startBtn.setAttribute("aria-pressed", "true");
  }

  function pause() {
    state.running = false;
    elements.status.textContent = "已暂停";
    elements.startBtn.setAttribute("aria-pressed", "false");
  }

  function reset() {
    pause();
    state.t = 0;
    state.sourceX = SOURCE_START_X;
    state.waves = [];
    state.nextWaveT = 0;
    state.lastTimestamp = null;
    state.chartHistory = [];
    render();
  }

  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05);
    state.t += boundedDt;
    const v = state.speed * C_SOUND;
    const pxPerSec = (SOURCE_END_X - SOURCE_START_X) / (SOURCE_END_X / v);
    state.sourceX = clamp(state.sourceX + pxPerSec * boundedDt, SOURCE_START_X, SOURCE_END_X);
    while (state.t >= state.nextWaveT) {
      state.waves.push({ birthT: state.nextWaveT, birthX: SOURCE_START_X + pxPerSec * state.nextWaveT });
      state.nextWaveT += WAVE_INTERVAL;
    }
    const maxRadius = Math.hypot(SCENE_W, SCENE_H);
    state.waves = state.waves.filter(w => (state.t - w.birthT) * C_SOUND * 0.36 < maxRadius);
    if (state.waves.length > MAX_WAVES) state.waves = state.waves.slice(-MAX_WAVES);
    if (state.chartHistory.length === 0 || state.t - state.chartHistory[state.chartHistory.length - 1].t >= 0.05) {
      state.chartHistory.push({ t: state.t, front: dopplerFront(state.speed), back: dopplerBack(state.speed) });
      if (state.chartHistory.length > CHART_MAX_SAMPLES) state.chartHistory.shift();
    }
  }

  function dopplerFront(speedRatio) {
    const v = speedRatio * C_SOUND;
    return v < C_SOUND ? F0 * C_SOUND / (C_SOUND - v) : Infinity;
  }
  function dopplerBack(speedRatio) {
    const v = speedRatio * C_SOUND;
    return F0 * C_SOUND / (C_SOUND + v);
  }

  function render() {
    renderScene();
    renderChart();
    renderReadouts();
    renderInsight();
  }

  function renderScene() {
    elements.source.setAttribute("transform", `translate(${state.sourceX}, ${TRACK_Y})`);
    const SCALE = 0.36;
    const ns = "http://www.w3.org/2000/svg";
    const frag = document.createDocumentFragment();
    for (const w of state.waves) {
      const age = state.t - w.birthT;
      if (age <= 0) continue;
      const r = age * C_SOUND * SCALE;
      if (r < 1) continue;
      const cx = w.birthX;
      const cy = TRACK_Y;
      const opacity = Math.max(0.06, 0.55 - r / 700);
      const circle = document.createElementNS(ns, "circle");
      circle.setAttribute("cx", cx);
      circle.setAttribute("cy", cy);
      circle.setAttribute("r", r.toFixed(1));
      circle.setAttribute("fill", "none");
      circle.setAttribute("stroke", "var(--sim-wave)");
      circle.setAttribute("stroke-width", "1.6");
      circle.setAttribute("opacity", opacity.toFixed(3));
      frag.appendChild(circle);
    }
    elements.waves.replaceChildren(frag);
  }

  function renderChart() {
    const fMax = dopplerFront(0.95);
    const fMin = dopplerBack(0.95);
    const logMax = Math.log(fMax / F0);
    const logMin = Math.log(F0 / fMin);
    const logRange = logMax + logMin;
    const mapY = (f) => {
      if (!Number.isFinite(f)) return CHART_PAD_T;
      const logF = Math.log(f / F0);
      const norm = (logF + logMin) / logRange;
      return CHART_PAD_T + (1 - clamp(norm, 0, 1)) * CHART_PLOT_H;
    };
    const tEnd = Math.max(state.t, CHART_WINDOW);
    const tStart = Math.max(0, tEnd - CHART_WINDOW);
    const mapX = (t) => CHART_PAD_L + clamp((t - tStart) / CHART_WINDOW, 0, 1) * CHART_PLOT_W;
    const toPoints = (key) => state.chartHistory
      .filter(s => s.t >= tStart)
      .map(s => `${mapX(s.t).toFixed(1)},${mapY(s[key]).toFixed(1)}`)
      .join(" ");
    elements.frontTrace.setAttribute("points", toPoints("front"));
    elements.backTrace.setAttribute("points", toPoints("back"));
  }

  function renderReadouts() {
    elements.vcReadout.textContent = state.speed.toFixed(2);
    elements.vReadout.textContent = `${(state.speed * C_SOUND).toFixed(0)} m/s`;
    const fFront = dopplerFront(state.speed);
    const fBack = dopplerBack(state.speed);
    elements.frontReadout.textContent = Number.isFinite(fFront) ? `${fFront.toFixed(0)} Hz` : "∞ Hz";
    elements.backReadout.textContent = `${fBack.toFixed(0)} Hz`;
    elements.speedOutput.textContent = `${state.speed.toFixed(2)} c`;
  }

  function renderInsight() {
    let text;
    if (!state.running && state.t === 0) {
      text = "按"开始"启动救护车。波前在车前方堆积变密（高音），后方拉开变疏（低音）。";
    } else if (state.speed < 0.15) {
      text = "车速很低：波前接近同心圆，前后频率差异很小。";
    } else if (state.speed < 0.5) {
      text = "中速行驶：前方波前开始堆积，后方波前拉开，音调差异可辨。";
    } else if (state.speed < 0.8) {
      text = "高速行驶：前方波前明显密集（高音），后方明显稀疏（低音）。";
    } else {
      text = "接近声速：前方波前几乎叠成"声墙"，频率急剧升高；后方极度稀疏。";
    }
    elements.insight.textContent = text;
  }

  function setParameters(values) {
    const def = parameterSchema[0];
    state.speed = clamp(finite(Number(values.speed), def.default), def.min, def.max);
    elements.speedInput.value = String(state.speed);
    render();
  }

  function getState() {
    return {
      running: state.running, t: state.t, sourceX: state.sourceX, speed: state.speed,
      waveCount: state.waves.length,
      frontFreq: dopplerFront(state.speed), backFreq: dopplerBack(state.speed)
    };
  }

  function getReadouts() {
    return {
      t: state.t, speed: state.speed, v: state.speed * C_SOUND,
      frontFreq: dopplerFront(state.speed), backFreq: dopplerBack(state.speed),
      sourceX: state.sourceX, waveCount: state.waves.length
    };
  }

  function runModelChecks() {
    const fFront = (s) => F0 * C_SOUND / (C_SOUND - s * C_SOUND);
    const fBack = (s) => F0 * C_SOUND / (C_SOUND + s * C_SOUND);
    const expectedFront = (s) => F0 / (1 - s);
    const expectedBack = (s) => F0 / (1 + s);
    const cases = [
      { name: "静止声源前后频率", speed: 0, expF: F0, expB: F0 },
      { name: "半速声源", speed: 0.5, expF: F0 / 0.5, expB: F0 / 1.5 },
      { name: "0.9c 声源", speed: 0.9, expF: F0 / 0.1, expB: F0 / 1.9 },
      { name: "0.95c 声源", speed: 0.95, expF: F0 / 0.05, expB: F0 / 1.95 }
    ];
    const results = cases.map(c => ({
      name: c.name,
      pass: Math.abs(fFront(c.speed) - c.expF) < 1e-9 && Math.abs(fBack(c.speed) - c.expB) < 1e-9,
      expected: `f'=${c.expF.toFixed(1)}, f″=${c.expB.toFixed(1)}`,
      actual: `f'=${fFront(c.speed).toFixed(1)}, f″=${fBack(c.speed).toFixed(1)}`,
      tolerance: "1e-9"
    }));
    const monotonic = fFront(0.3) > fFront(0.1) && fFront(0.6) > fFront(0.3) && fFront(0.9) > fFront(0.6);
    results.push({
      name: "前方频率随车速单调递增",
      pass: monotonic,
      expected: "f'(0.1) < f'(0.3) < f'(0.6) < f'(0.9)",
      actual: `${fFront(0.1).toFixed(0)} < ${fFront(0.3).toFixed(0)} < ${fFront(0.6).toFixed(0)} < ${fFront(0.9).toFixed(0)}`,
      tolerance: "strict"
    });
    const backMono = fBack(0.3) < fBack(0.1) && fBack(0.6) < fBack(0.3) && fBack(0.9) < fBack(0.6);
    results.push({
      name: "后方频率随车速单调递减",
      pass: backMono,
      expected: "f″(0.1) > f″(0.3) > f″(0.6) > f″(0.9)",
      actual: `${fBack(0.1).toFixed(0)} > ${fBack(0.3).toFixed(0)} > ${fBack(0.6).toFixed(0)} > ${fBack(0.9).toFixed(0)}`,
      tolerance: "strict"
    });
    const symmetry = Math.abs(fFront(0.5) * fBack(0.5) - F0 * F0);
    results.push({
      name: "对称性 f'·f″ = f₀²",
      pass: symmetry < 1e-6,
      expected: `${(F0 * F0).toFixed(0)}`,
      actual: `${(fFront(0.5) * fBack(0.5)).toFixed(1)}`,
      tolerance: "1e-6"
    });
    return results;
  }

  function bindControls() {
    elements.startBtn.addEventListener("click", start);
    elements.pauseBtn.addEventListener("click", pause);
    elements.resetBtn.addEventListener("click", reset);
    elements.speedInput.addEventListener("input", () => setParameters({ speed: elements.speedInput.value }));
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
