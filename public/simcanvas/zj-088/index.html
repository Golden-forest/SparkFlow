<!doctype html>
<html lang="zh-CN">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle Typography · 粒子文字</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #050810;
  --sim-surface: #0b1020;
  --sim-surface-soft: #121828;
  --sim-text: #e8eefc;
  --sim-muted: #6b7a99;
  --sim-border: #1e2a44;
  --sim-grid: #16203a;
  --sim-accent: #22d3ee;
  --sim-accent-deep: #0891b2;
  --sim-accent-soft: #0e3a4a;
  --sim-positive: #22d3ee;
  --sim-warning: #f59e0b;
  --sim-danger: #ef4444;
  --sim-radius-sm: 8px;
  --sim-radius-md: 12px;
  --sim-radius-lg: 16px;
  --sim-shadow: 0 8px 32px rgba(0,0,0,0.5);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  background: var(--sim-bg);
  color: var(--sim-text);
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--sim-accent); outline-offset: 2px; }

.app {
  width: 100vw; height: 100vh; height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 0;
  overflow: hidden;
}

.header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 20px;
  border-bottom: 1px solid var(--sim-border);
  background: rgba(11,16,32,0.6);
  backdrop-filter: blur(8px);
  z-index: 2;
}
.header-left { display: flex; align-items: baseline; gap: 14px; }
.header h1 {
  margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em;
}
.header h1 .accent { color: var(--sim-accent); }
.header p { margin: 0; color: var(--sim-muted); font-size: 0.78rem; }
.status {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 12px;
  border: 1px solid var(--sim-accent-soft);
  border-radius: 999px;
  background: rgba(34,211,238,0.08);
  color: var(--sim-accent);
  font-size: 0.78rem; font-weight: 600;
  white-space: nowrap;
}
.status .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--sim-accent);
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

.main {
  display: block;
  min-height: 0;
  overflow: hidden;
}
.stage-wrap {
  position: relative;
  min-height: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--sim-bg);
}
#scene {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  cursor: crosshair;
  touch-action: none;
}
.stage-hint {
  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
  color: var(--sim-muted); font-size: 0.75rem;
  pointer-events: none;
  opacity: 0.7;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.stage-hint kbd {
  display: inline-block; padding: 1px 6px;
  border: 1px solid var(--sim-border); border-radius: 4px;
  background: rgba(255,255,255,0.04);
  font-size: 0.7rem; color: var(--sim-text);
}

.evidence {
  position: absolute; top: 14px; right: 14px;
  display: flex; flex-direction: column; gap: 8px;
  padding: 12px 14px;
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-md);
  background: rgba(11,16,32,0.72);
  backdrop-filter: blur(10px);
  z-index: 3;
  min-width: 168px;
  pointer-events: none;
}
.evidence .ev-row {
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
}
.evidence .ev-label {
  font-size: 0.68rem; color: var(--sim-muted); font-weight: 600;
  letter-spacing: 0.02em;
}
.evidence .ev-value {
  font-size: 0.92rem; font-weight: 700; color: var(--sim-text);
  font-variant-numeric: tabular-nums;
}
.evidence .ev-value.accent { color: var(--sim-accent); }

.insight {
  position: absolute; bottom: 14px; left: 14px;
  max-width: 320px;
  padding: 10px 14px;
  border: 1px solid var(--sim-border);
  border-left: 3px solid var(--sim-accent);
  border-radius: var(--sim-radius-md);
  background: rgba(11,16,32,0.72);
  backdrop-filter: blur(10px);
  color: var(--sim-text);
  font-size: 0.78rem; line-height: 1.5;
  z-index: 3;
  pointer-events: none;
}
.insight .insight-title {
  display: block; margin-bottom: 3px;
  font-size: 0.68rem; font-weight: 700; color: var(--sim-accent);
  letter-spacing: 0.04em; text-transform: uppercase;
}

.controls {
  display: flex; align-items: center; gap: 18px;
  padding: 10px 20px;
  border-top: 1px solid var(--sim-border);
  background: rgba(11,16,32,0.7);
  backdrop-filter: blur(8px);
  z-index: 2;
}
.actions { display: flex; gap: 6px; }
button {
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-sm);
  padding: 7px 14px;
  background: var(--sim-surface-soft);
  color: var(--sim-text);
  cursor: pointer;
  font-weight: 600; font-size: 0.82rem;
  transition: background .15s, border-color .15s, transform .1s;
}
button:hover { background: #1a2238; border-color: #2a3a5a; }
button:active { transform: scale(0.96); }
button.primary {
  border-color: var(--sim-accent-deep);
  background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent));
  color: #04141a;
}
button.primary:hover { filter: brightness(1.1); }
.divider { width: 1px; height: 24px; background: var(--sim-border); }
.control { display: flex; flex-direction: column; gap: 3px; min-width: 130px; }
.control label {
  display: flex; justify-content: space-between; gap: 8px;
  font-size: 0.72rem; color: var(--sim-muted); font-weight: 600;
}
.control output { color: var(--sim-accent); font-variant-numeric: tabular-nums; }
input[type="range"] {
  width: 100%; height: 4px;
  -webkit-appearance: none; appearance: none;
  background: var(--sim-border); border-radius: 2px;
  outline: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--sim-accent); cursor: pointer;
  border: 2px solid var(--sim-bg);
}
input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--sim-accent); cursor: pointer;
  border: 2px solid var(--sim-bg);
}
.spacer { flex: 1; }
.phase-indicator {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.75rem; color: var(--sim-muted);
}
.phase-indicator strong { color: var(--sim-text); font-weight: 700; }

@media (max-width: 720px) {
  .header { padding: 8px 12px; }
  .header p { display: none; }
  .controls { padding: 8px 12px; gap: 10px; flex-wrap: wrap; }
  .control { min-width: 100px; }
  .divider { display: none; }
  .spacer { display: none; }
  .phase-indicator { display: none; }
  .stage-hint { font-size: 0.68rem; }
  .evidence { top: 8px; right: 8px; padding: 8px 10px; min-width: 130px; }
  .evidence .ev-value { font-size: 0.82rem; }
  .insight { bottom: 8px; left: 8px; right: 8px; max-width: none; font-size: 0.72rem; }
}
@media (prefers-reduced-motion: reduce) {
  .status .dot { animation: none; }
}
</style>
</head>
<body>
<div class="app" data-layout="visualization-first" data-model-tier="continuous-ode">
  <header class="header" data-region="header">
    <div class="header-left">
      <h1>粒子文字 <span class="accent">Particle Typography</span></h1>
      <p>移动鼠标驱散 · 点击释放冲击波 · 粒子自动重组文字</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">
      <span class="dot"></span><span id="statusText">就绪</span>
    </div>
  </header>

  <main class="main">
    <section class="stage-wrap" data-region="stage">
      <canvas id="scene" role="img" aria-label="粒子文字动画舞台"></canvas>
      <aside class="evidence" data-region="evidence" aria-label="实时数据">
        <div class="ev-row"><span class="ev-label">阶段</span><span class="ev-value accent" id="evPhase">Sim</span></div>
        <div class="ev-row"><span class="ev-label">粒子数</span><span class="ev-value" id="evParticles">6000</span></div>
        <div class="ev-row"><span class="ev-label">冲击波</span><span class="ev-value" id="evShocks">0</span></div>
        <div class="ev-row"><span class="ev-label">时间</span><span class="ev-value" id="evTime">0.0 s</span></div>
      </aside>
      <div class="insight" data-region="insight" aria-live="polite">
        <span class="insight-title">观察</span>
        <span id="insightText">按「开始」启动。粒子受弹簧力牵引向文字目标点，鼠标靠近时被推开，点击释放向外冲击波。</span>
      </div>
      <div class="stage-hint">
        <kbd>移动</kbd> 鼠标驱散粒子 · <kbd>点击</kbd> 释放冲击波
      </div>
    </section>
  </main>

  <section class="controls" data-region="controls" aria-label="模拟控制">
    <div class="actions">
      <button id="startBtn" class="primary" type="button">开始</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="divider"></div>
    <div class="control">
      <label for="countInput">粒子数 <output id="countOutput">6000</output></label>
      <input id="countInput" type="range" min="2000" max="12000" step="500" value="6000">
    </div>
    <div class="control">
      <label for="radiusInput">鼠标半径 <output id="radiusOutput">90 px</output></label>
      <input id="radiusInput" type="range" min="40" max="200" step="5" value="90">
    </div>
    <div class="spacer"></div>
    <div class="phase-indicator">
      阶段 <strong id="phaseLabel">Sim</strong>
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const parameterSchema = [
    { key: "count", label: "粒子数", type: "slider", min: 2000, max: 12000, step: 500, default: 6000, unit: "" },
    { key: "mouseRadius", label: "鼠标半径", type: "slider", min: 40, max: 200, step: 5, default: 90, unit: "px" }
  ];

  const state = {
    running: false,
    time: 0,
    lastTimestamp: null,
    particles: [],
    mouse: { x: -9999, y: -9999, active: false },
    shockwaves: [],
    phase: "sim",
    phaseTime: 0,
    phaseDurations: { sim: 5.5, scatter: 1.2, canvas: 5.5, scatter2: 1.2 },
    textSequence: ["Sim", "Canvas"],
    textIndex: 0,
    targets: [],
    scatterTargets: [],
    breathPhase: 0,
    params: { count: 6000, mouseRadius: 90 }
  };

  const PHYS = {
    spring: 0.045,
    damping: 0.88,
    mouseForce: 2.8,
    shockForce: 14,
    shockRadius: 220,
    breathAmp: 1.6,
    breathFreq: 1.8
  };

  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d", { alpha: false });
  const els = {
    statusText: document.getElementById("statusText"),
    phaseLabel: document.getElementById("phaseLabel"),
    countInput: document.getElementById("countInput"),
    countOutput: document.getElementById("countOutput"),
    radiusInput: document.getElementById("radiusInput"),
    radiusOutput: document.getElementById("radiusOutput"),
    startBtn: document.getElementById("startBtn"),
    pauseBtn: document.getElementById("pauseBtn"),
    resetBtn: document.getElementById("resetBtn"),
    evPhase: document.getElementById("evPhase"),
    evParticles: document.getElementById("evParticles"),
    evShocks: document.getElementById("evShocks"),
    evTime: document.getElementById("evTime"),
    insightText: document.getElementById("insightText")
  };

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function finite(v, fb) { return Number.isFinite(v) ? v : fb; }

  let dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.floor(rect.width * dpr);
    canvas.height = Math.floor(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (state.particles.length > 0) {
      sampleTextTargets();
      assignTargets();
    }
  }

  function sampleTextTargets() {
    const rect = canvas.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    if (w < 10 || h < 10) return;

    const off = document.createElement("canvas");
    off.width = Math.floor(w);
    off.height = Math.floor(h);
    const octx = off.getContext("2d");

    const text = state.textSequence[state.textIndex];
    let fontSize = Math.floor(h * 0.5);
    octx.font = `900 ${fontSize}px ui-sans-serif, system-ui, -apple-system, sans-serif`;
    let measured = octx.measureText(text).width;
    const maxW = w * 0.82;
    if (measured > maxW) {
      fontSize = Math.floor(fontSize * (maxW / measured));
      octx.font = `900 ${fontSize}px ui-sans-serif, system-ui, -apple-system, sans-serif`;
      measured = octx.measureText(text).width;
    }
    octx.fillStyle = "#fff";
    octx.textAlign = "center";
    octx.textBaseline = "middle";
    octx.fillText(text, w / 2, h / 2);

    const data = octx.getImageData(0, 0, off.width, off.height).data;
    const points = [];
    const targetCount = state.params.count;
    let step = 3;
    let est = 0;
    for (let y = 0; y < off.height; y += 3) {
      for (let x = 0; x < off.width; x += 3) {
        if (data[(y * off.width + x) * 4 + 3] > 128) est++;
      }
    }
    if (est > 0) {
      step = Math.max(2, Math.round(Math.sqrt(est / targetCount) * 3));
    }
    for (let y = 0; y < off.height; y += step) {
      for (let x = 0; x < off.width; x += step) {
        if (data[(y * off.width + x) * 4 + 3] > 128) {
          points.push({ x: x + (Math.random() - 0.5) * step, y: y + (Math.random() - 0.5) * step });
        }
      }
    }
    state.targets = points;
  }

  function generateScatterTargets(n) {
    const rect = canvas.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const arr = new Array(n);
    for (let i = 0; i < n; i++) {
      arr[i] = { x: Math.random() * w, y: Math.random() * h };
    }
    return arr;
  }

  function assignTargets() {
    const n = state.particles.length;
    if (state.targets.length === 0) return;
    const indices = new Array(state.targets.length);
    for (let i = 0; i < indices.length; i++) indices[i] = i;
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = indices[i]; indices[i] = indices[j]; indices[j] = tmp;
    }
    for (let i = 0; i < n; i++) {
      const t = state.targets[indices[i % state.targets.length]];
      state.particles[i].tx = t.x;
      state.particles[i].ty = t.y;
    }
  }

  function assignScatterTargets() {
    const n = state.particles.length;
    for (let i = 0; i < n; i++) {
      const t = state.scatterTargets[i];
      state.particles[i].tx = t.x;
      state.particles[i].ty = t.y;
    }
  }

  function initParticles() {
    const rect = canvas.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const n = state.params.count;
    state.particles = new Array(n);
    for (let i = 0; i < n; i++) {
      state.particles[i] = {
        x: Math.random() * w,
        y: Math.random() * h,
        vx: 0, vy: 0,
        tx: 0, ty: 0,
        hue: 180 + Math.random() * 25,
        sat: 80 + Math.random() * 20,
        lit: 55 + Math.random() * 20
      };
    }
    state.scatterTargets = generateScatterTargets(n);
    sampleTextTargets();
    assignTargets();
  }

  function nextPhase() {
    const phases = ["sim", "scatter", "canvas", "scatter2"];
    const idx = phases.indexOf(state.phase);
    state.phase = phases[(idx + 1) % phases.length];
    state.phaseTime = 0;

    if (state.phase === "scatter" || state.phase === "scatter2") {
      assignScatterTargets();
      els.phaseLabel.textContent = "炸散";
    } else if (state.phase === "sim") {
      state.textIndex = 0;
      sampleTextTargets();
      assignTargets();
      els.phaseLabel.textContent = "Sim";
    } else if (state.phase === "canvas") {
      state.textIndex = 1;
      sampleTextTargets();
      assignTargets();
      els.phaseLabel.textContent = "Canvas";
    }
  }

  function update(dt) {
    if (!state.running) return;
    const dts = clamp(finite(dt, 0), 0, 0.05);
    state.time += dts;
    state.phaseTime += dts;
    state.breathPhase += dts * PHYS.breathFreq;

    const dur = state.phaseDurations[state.phase];
    if (state.phaseTime >= dur) {
      nextPhase();
    }

    const ps = state.particles;
    const n = ps.length;
    const mr = state.params.mouseRadius;
    const mr2 = mr * mr;
    const mx = state.mouse.x, my = state.mouse.y;
    const mouseActive = state.mouse.active;
    const breath = Math.sin(state.breathPhase) * PHYS.breathAmp;
    const breathX = Math.cos(state.breathPhase * 0.7) * PHYS.breathAmp * 0.6;

    const shocks = state.shockwaves;
    for (let i = shocks.length - 1; i >= 0; i--) {
      shocks[i].age += dts;
      if (shocks[i].age > shocks[i].life) shocks.splice(i, 1);
    }

    const rect = canvas.getBoundingClientRect();
    const cw = rect.width, ch = rect.height;

    for (let i = 0; i < n; i++) {
      const p = ps[i];

      let dx = p.tx - p.x;
      let dy = p.ty - p.y;
      let ax = dx * PHYS.spring;
      let ay = dy * PHYS.spring;

      if (state.phase === "sim" || state.phase === "canvas") {
        ax += breath * 0.015;
        ay += breathX * 0.015;
      }

      if (mouseActive) {
        const rx = p.x - mx;
        const ry = p.y - my;
        const r2 = rx * rx + ry * ry;
        if (r2 < mr2 && r2 > 0.5) {
          const r = Math.sqrt(r2);
          const force = (1 - r / mr) * PHYS.mouseForce;
          ax += (rx / r) * force;
          ay += (ry / r) * force;
        }
      }

      for (let s = 0; s < shocks.length; s++) {
        const sw = shocks[s];
        const rx = p.x - sw.x;
        const ry = p.y - sw.y;
        const r = Math.sqrt(rx * rx + ry * ry);
        const waveR = sw.age * sw.speed;
        const band = 50;
        if (r > 0.5 && Math.abs(r - waveR) < band) {
          const intensity = (1 - Math.abs(r - waveR) / band) * (1 - sw.age / sw.life);
          const f = intensity * PHYS.shockForce;
          ax += (rx / r) * f;
          ay += (ry / r) * f;
        }
      }

      p.vx = (p.vx + ax) * PHYS.damping;
      p.vy = (p.vy + ay) * PHYS.damping;
      p.x += p.vx;
      p.y += p.vy;

      if (p.x < 0) { p.x = 0; p.vx *= -0.5; }
      else if (p.x > cw) { p.x = cw; p.vx *= -0.5; }
      if (p.y < 0) { p.y = 0; p.vy *= -0.5; }
      else if (p.y > ch) { p.y = ch; p.vy *= -0.5; }
    }
  }

  function render() {
    const rect = canvas.getBoundingClientRect();
    const w = rect.width, h = rect.height;

    ctx.fillStyle = "rgba(5, 8, 16, 0.22)";
    ctx.fillRect(0, 0, w, h);

    const ps = state.particles;
    const n = ps.length;

    for (let i = 0; i < n; i++) {
      const p = ps[i];
      const speed = Math.abs(p.vx) + Math.abs(p.vy);
      const intensity = clamp(speed * 0.15, 0, 1);
      const lit = p.lit + intensity * 25;
      const hue = p.hue - intensity * 15;
      ctx.fillStyle = `hsl(${hue},${p.sat}%,${clamp(lit, 40, 85)}%)`;
      ctx.fillRect(p.x - 1, p.y - 1, 2.2, 2.2);
    }

    for (let i = 0; i < state.shockwaves.length; i++) {
      const sw = state.shockwaves[i];
      const r = sw.age * sw.speed;
      const alpha = (1 - sw.age / sw.life) * 0.5;
      ctx.strokeStyle = `rgba(34, 211, 238, ${alpha})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = `rgba(245, 158, 11, ${alpha * 0.6})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, r * 0.7, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (state.mouse.active) {
      const grad = ctx.createRadialGradient(
        state.mouse.x, state.mouse.y, 0,
        state.mouse.x, state.mouse.y, state.params.mouseRadius
      );
      grad.addColorStop(0, "rgba(34, 211, 238, 0.10)");
      grad.addColorStop(1, "rgba(34, 211, 238, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(state.mouse.x, state.mouse.y, state.params.mouseRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(34, 211, 238, 0.25)";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(state.mouse.x, state.mouse.y, state.params.mouseRadius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    els.evPhase.textContent = els.phaseLabel.textContent;
    els.evParticles.textContent = String(state.particles.length);
    els.evShocks.textContent = String(state.shockwaves.length);
    els.evTime.textContent = `${state.time.toFixed(1)} s`;

    const shockActive = state.shockwaves.length > 0;
    const mouseActive = state.mouse.active;
    if (!state.running && state.time === 0) {
      els.insightText.textContent = "按「开始」启动。粒子受弹簧力牵引向文字目标点，鼠标靠近时被推开，点击释放向外冲击波。";
    } else if (shockActive) {
      els.insightText.textContent = "冲击波以环形向外传播，途经粒子被径向推开；波过后弹簧力将粒子重新拉回目标。";
    } else if (mouseActive) {
      els.insightText.textContent = "鼠标半径内的粒子被排斥远离指针；移开后，弹簧力让它们回归文字形状。";
    } else if (state.phase === "scatter" || state.phase === "scatter2") {
      els.insightText.textContent = "炸散阶段：目标点切换为随机位置，粒子向新目标扩散。";
    } else {
      els.insightText.textContent = "粒子在文字目标点附近做轻微呼吸式振荡，形成稳定的文字形状。";
    }
  }

  function init() {
    resize();
    initParticles();
    bindControls();
    bindPointer();
    render();
    requestAnimationFrame(frame);
  }
  function start() {
    state.running = true;
    els.statusText.textContent = "运行中";
    els.startBtn.setAttribute("aria-pressed", "true");
  }
  function pause() {
    state.running = false;
    els.statusText.textContent = "已暂停";
    els.startBtn.setAttribute("aria-pressed", "false");
  }
  function reset() {
    pause();
    state.time = 0;
    state.phase = "sim";
    state.phaseTime = 0;
    state.textIndex = 0;
    state.shockwaves = [];
    initParticles();
    els.phaseLabel.textContent = "Sim";
    els.statusText.textContent = "就绪";
    render();
  }
  function setParameters(values) {
    const countDef = parameterSchema[0];
    const radiusDef = parameterSchema[1];
    if (values.count !== undefined) {
      const newCount = clamp(finite(Number(values.count), countDef.default), countDef.min, countDef.max);
      if (newCount !== state.params.count) {
        state.params.count = newCount;
        initParticles();
      }
      els.countOutput.textContent = String(state.params.count);
      els.countInput.value = String(state.params.count);
    }
    if (values.mouseRadius !== undefined) {
      state.params.mouseRadius = clamp(finite(Number(values.mouseRadius), radiusDef.default), radiusDef.min, radiusDef.max);
      els.radiusOutput.textContent = `${state.params.mouseRadius} px`;
      els.radiusInput.value = String(state.params.mouseRadius);
    }
  }
  function getState() {
    return {
      running: state.running,
      time: state.time,
      phase: state.phase,
      phaseTime: state.phaseTime,
      textIndex: state.textIndex,
      particleCount: state.particles.length,
      targetCount: state.targets.length,
      shockwaveCount: state.shockwaves.length,
      mouseActive: state.mouse.active
    };
  }
  function getReadouts() {
    return {
      time: state.time,
      phase: state.phase,
      particles: state.particles.length,
      mouseRadius: state.params.mouseRadius
    };
  }

  function runModelChecks() {
    function simulateParticle(target, steps) {
      let x = 0, y = 0, vx = 0, vy = 0;
      const spring = PHYS.spring, damping = PHYS.damping;
      for (let i = 0; i < steps; i++) {
        const ax = (target.x - x) * spring;
        const ay = (target.y - y) * spring;
        vx = (vx + ax) * damping;
        vy = (vy + ay) * damping;
        x += vx; y += vy;
      }
      return { x, y, dist: Math.hypot(target.x - x, target.y - y) };
    }
    const target = { x: 100, y: 50 };
    const near = simulateParticle(target, 300);
    const nearer = simulateParticle(target, 600);
    const stable = simulateParticle(target, 1000);

    function simulateRepel(mx, my) {
      let x = 100, y = 100, vx = 0, vy = 0;
      const mr = 90, mr2 = mr * mr;
      for (let i = 0; i < 10; i++) {
        let ax = (100 - x) * PHYS.spring;
        let ay = (100 - y) * PHYS.spring;
        const rx = x - mx, ry = y - my;
        const r2 = rx * rx + ry * ry;
        if (r2 < mr2 && r2 > 0.5) {
          const r = Math.sqrt(r2);
          const force = (1 - r / mr) * PHYS.mouseForce;
          ax += (rx / r) * force;
          ay += (ry / r) * force;
        }
        vx = (vx + ax) * PHYS.damping;
        vy = (vy + ay) * PHYS.damping;
        x += vx; y += vy;
      }
      return { x, y, dx: x - 100, dy: y - 100 };
    }
    const repel = simulateRepel(110, 100);
    const repelCorrect = repel.dx < -0.5;

    function simulateShock() {
      let x = 200, y = 200, vx = 0, vy = 0;
      const sw = { x: 100, y: 200, age: 0, life: 0.6, speed: 600 };
      for (let step = 0; step < 30; step++) {
        let ax = (200 - x) * PHYS.spring;
        let ay = (200 - y) * PHYS.spring;
        sw.age = step * 0.02;
        const waveR = sw.age * sw.speed;
        const rx = x - sw.x, ry = y - sw.y;
        const r = Math.sqrt(rx * rx + ry * ry);
        const band = 50;
        if (r > 0.5 && Math.abs(r - waveR) < band) {
          const intensity = (1 - Math.abs(r - waveR) / band) * (1 - sw.age / sw.life);
          const f = intensity * PHYS.shockForce;
          ax += (rx / r) * f;
          ay += (ry / r) * f;
        }
        vx = (vx + ax) * PHYS.damping;
        vy = (vy + ay) * PHYS.damping;
        x += vx; y += vy;
      }
      return { x, y, dx: x - 200 };
    }
    const shock = simulateShock();
    const shockCorrect = shock.dx > 0.5;

    let allFinite = true;
    for (let i = 0; i < state.particles.length; i++) {
      const p = state.particles[i];
      if (!Number.isFinite(p.x) || !Number.isFinite(p.y) || !Number.isFinite(p.vx) || !Number.isFinite(p.vy)) {
        allFinite = false; break;
      }
    }

    return [
      { name: "弹簧收敛：300步后接近目标", pass: near.dist < 30, expected: "dist < 30", actual: near.dist, tolerance: 30 },
      { name: "弹簧收敛：600步后更近", pass: nearer.dist < near.dist, expected: "nearer < near", actual: `${nearer.dist} < ${near.dist}`, tolerance: "strict" },
      { name: "弹簧收敛：1000步后稳定", pass: stable.dist < 5, expected: "dist < 5", actual: stable.dist, tolerance: 5 },
      { name: "鼠标排斥方向正确", pass: repelCorrect, expected: "粒子远离鼠标", actual: `dx=${repel.dx}`, tolerance: "strict" },
      { name: "冲击波推力方向正确", pass: shockCorrect, expected: "粒子远离波源", actual: `dx=${shock.dx}`, tolerance: "strict" },
      { name: "所有粒子状态有限", pass: allFinite, expected: "all finite", actual: allFinite ? "finite" : "has non-finite", tolerance: "finite" }
    ];
  }

  function bindControls() {
    els.startBtn.addEventListener("click", start);
    els.pauseBtn.addEventListener("click", pause);
    els.resetBtn.addEventListener("click", reset);
    els.countInput.addEventListener("input", () => setParameters({ count: els.countInput.value }));
    els.radiusInput.addEventListener("input", () => setParameters({ mouseRadius: els.radiusInput.value }));
  }
  function bindPointer() {
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX - rect.left, y: t.clientY - rect.top };
    }
    canvas.addEventListener("mousemove", (e) => {
      const p = getPos(e);
      state.mouse.x = p.x; state.mouse.y = p.y; state.mouse.active = true;
    });
    canvas.addEventListener("mouseleave", () => { state.mouse.active = false; });
    canvas.addEventListener("click", (e) => {
      const p = getPos(e);
      state.shockwaves.push({ x: p.x, y: p.y, age: 0, life: 0.6, speed: 600 });
    });
    canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      const p = getPos(e);
      state.mouse.x = p.x; state.mouse.y = p.y; state.mouse.active = true;
    }, { passive: false });
    canvas.addEventListener("touchend", () => { state.mouse.active = false; });
    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      const p = getPos(e);
      state.mouse.x = p.x; state.mouse.y = p.y; state.mouse.active = true;
      state.shockwaves.push({ x: p.x, y: p.y, age: 0, life: 0.6, speed: 600 });
    }, { passive: false });
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { resize(); }, 150);
  });

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
