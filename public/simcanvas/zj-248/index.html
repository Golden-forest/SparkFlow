<!doctype html>
<html lang="zh-CN">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雨滴的真相</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #050810;
  --sim-surface: #0c1322;
  --sim-surface-soft: #131c30;
  --sim-text: #e8eefc;
  --sim-muted: #7e8da8;
  --sim-border: #1f2c44;
  --sim-grid: #142036;
  --sim-accent: #4dd0e1;
  --sim-accent-deep: #0097a7;
  --sim-accent-soft: rgba(77, 208, 225, 0.14);
  --sim-positive: #4dd0e1;
  --sim-warning: #ffb74d;
  --sim-danger: #ef5350;
  --sim-radius-sm: 8px;
  --sim-radius-md: 12px;
  --sim-radius-lg: 16px;
  --sim-shadow: 0 0 0 1px rgba(77, 208, 225, 0.08);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--sim-bg);
  color: var(--sim-text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
.app {
  width: 100vw; height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: var(--sim-space-2);
  padding: var(--sim-space-3) var(--sim-space-4) var(--sim-space-3);
}
.header {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 0 var(--sim-space-2);
}
.header h1 {
  font-size: clamp(1.1rem, 1.8vw, 1.5rem);
  font-weight: 300; letter-spacing: 0.04em;
  color: var(--sim-text);
}
.header h1 .accent { color: var(--sim-accent); font-weight: 500; }
.status {
  font-size: 0.7rem; color: var(--sim-muted);
  letter-spacing: 0.08em; text-transform: uppercase;
}
.main { min-height: 0; position: relative; display: grid; grid-template-columns: 1fr 280px; gap: var(--sim-space-2); }
#scene {
  width: 100%; height: 100%; display: block;
}
.side-panel {
  display: grid; grid-template-rows: auto 1fr; gap: var(--sim-space-2);
  min-height: 0;
}
.panel {
  background: var(--sim-surface);
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-md);
  padding: var(--sim-space-3);
  min-width: 0;
}
.panel h2 {
  font-size: 0.75rem; color: var(--sim-muted);
  letter-spacing: 0.08em; text-transform: uppercase;
  margin-bottom: var(--sim-space-2);
  font-weight: 500;
}
.readout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sim-space-2); }
.metric { display: flex; flex-direction: column; gap: 2px; }
.metric small { font-size: 0.65rem; color: var(--sim-muted); letter-spacing: 0.05em; }
.metric strong { font-size: 1.1rem; color: var(--sim-text); font-weight: 500; }
.metric.accent strong { color: var(--sim-accent); }
.insight-box {
  padding: var(--sim-space-3);
  background: var(--sim-surface-soft);
  border-left: 3px solid var(--sim-accent);
  border-radius: 0 var(--sim-radius-sm) var(--sim-radius-sm) 0;
  font-size: 0.8rem; line-height: 1.5; color: var(--sim-text);
}
.controls {
  display: flex; align-items: center; justify-content: center;
  gap: clamp(20px, 4vw, 48px);
  padding: var(--sim-space-2) var(--sim-space-3);
  background: var(--sim-surface);
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-md);
}
.actions { display: flex; gap: var(--sim-space-2); }
button {
  background: var(--sim-surface-soft);
  border: 1px solid var(--sim-border);
  color: var(--sim-text);
  padding: 8px 16px;
  border-radius: var(--sim-radius-sm);
  font-size: 0.75rem; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
  letter-spacing: 0.05em;
}
button:hover { border-color: var(--sim-accent); color: var(--sim-accent); }
button.primary {
  background: var(--sim-accent); color: var(--sim-bg);
  border-color: var(--sim-accent);
}
button.primary:hover { background: var(--sim-accent-deep); border-color: var(--sim-accent-deep); color: var(--sim-text); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.control {
  display: flex; flex-direction: column; gap: 6px;
  min-width: 180px;
}
.control label {
  display: flex; justify-content: space-between;
  font-size: 0.72rem; color: var(--sim-muted);
  letter-spacing: 0.05em;
}
.control output {
  color: var(--sim-accent); font-weight: 600;
  font-variant-numeric: tabular-nums;
}
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 2px;
  background: var(--sim-border);
  border-radius: 1px; outline: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--sim-accent);
  border: 2px solid var(--sim-bg);
  cursor: pointer;
  transition: transform 0.15s;
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--sim-accent);
  border: 2px solid var(--sim-bg);
  cursor: pointer;
}
input[type="range"]:focus-visible {
  outline: 2px solid var(--sim-accent); outline-offset: 4px;
}
@media (max-width: 860px) {
  .main { grid-template-columns: 1fr; }
  .side-panel { display: none; }
}
@media (max-width: 600px) {
  .controls { flex-wrap: wrap; gap: 16px; }
  .control { min-width: 140px; flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>

<body>
<div class="app" data-layout="visualization-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <h1>雨滴的<span class="accent">真相</span></h1>
    <div id="status" class="status" role="status" aria-live="polite">运行中</div>
  </header>
  <main class="main">
    <section class="stage" data-region="stage" aria-label="雨滴形状随直径变化的可视化">
      <canvas id="scene" role="img" aria-label="雨滴形状随直径变化的可视化"></canvas>
    </section>
    <aside class="side-panel">
      <section class="panel" data-region="evidence" aria-label="实时数据">
        <h2>实时数据</h2>
        <div class="readout-grid">
          <div class="metric"><small>直径</small><strong id="diameterReadout">3.0 mm</strong></div>
          <div class="metric accent"><small>末速度</small><strong id="velocityReadout">8.0 m/s</strong></div>
          <div class="metric"><small>形状</small><strong id="shapeReadout">汉堡包形</strong></div>
          <div class="metric"><small>慢放倍率</small><strong id="slowmoReadout">0.30x</strong></div>
        </div>
      </section>
      <section class="panel" data-region="insight" aria-label="模型说明">
        <h2>观察要点</h2>
        <div class="insight-box" id="insightText">小雨滴接近球形，大雨滴受气压变扁，超大时碎裂。雨滴并非泪滴形。</div>
      </section>
    </aside>
  </main>
  <section class="controls" data-region="controls" aria-label="模拟控件">
    <div class="actions">
      <button id="startBtn" class="primary" type="button">开始</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control">
      <label for="diameterInput">直径 <output id="diameterOutput">3.0 mm</output></label>
      <input id="diameterInput" type="range" min="0.5" max="6" step="0.1" value="3.0" aria-label="雨滴直径">
    </div>
    <div class="control">
      <label for="slowmoInput">慢放 <output id="slowmoOutput">0.30x</output></label>
      <input id="slowmoInput" type="range" min="0.1" max="1" step="0.05" value="0.3" aria-label="慢放倍率">
    </div>
  </section>
</div>
<script>
(() => {
  "use strict";

  // ============ 物理模型 ============
  function terminalVelocity(d) {
    const dMeters = d * 0.001;
    const g = 9.8;
    const Cd = 0.5;
    const rhoWater = 1000;
    const rhoAir = 1.225;
    const A = Math.PI * Math.pow(dMeters / 2, 2);
    const mass = (4/3) * Math.PI * Math.pow(dMeters / 2, 3) * rhoWater;
    const v = Math.sqrt((2 * mass * g) / (Cd * rhoAir * A));
    return Math.min(v, 9.8);
  }

  function shapeParams(d) {
    let flatness = 0;
    let oscillation = 0;
    let breakup = false;
    if (d < 1.0) {
      flatness = 0;
    } else if (d < 4.0) {
      flatness = ((d - 1.0) / 3.0) * 0.5;
    } else {
      flatness = 0.5;
      oscillation = Math.min((d - 4.0) / 2.0, 1.0) * 0.35;
      if (d > 4.8) breakup = true;
    }
    return { flatness, oscillation, breakup };
  }

  function shapeLabel(d) {
    if (d < 1.0) return "球形";
    if (d < 2.2) return "微扁球形";
    if (d < 4.0) return "汉堡包形";
    if (d < 4.8) return "振荡形";
    return "碎裂形";
  }

  // ============ 状态 ============
  const state = {
    running: true,
    diameter: 3.0,
    slowmo: 0.3,
    simTime: 0,
    lastTimestamp: null,
    canvasW: 0,
    canvasH: 0,
    dpr: 1,
  };

  // ============ 画布 ============
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    state.dpr = dpr;
    state.canvasW = rect.width;
    state.canvasH = rect.height;
    canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ============ 绘制工具 ============
  function drawDropShape(cx, cy, rx, ry, flatness, oscPhase, oscAmp, alpha) {
    ctx.globalAlpha = alpha;
    const segments = 80;
    const points = [];
    for (let i = 0; i <= segments; i++) {
      const theta = (i / segments) * Math.PI * 2;
      const cosT = Math.cos(theta);
      const sinT = Math.sin(theta);
      let x = cx + cosT * rx;
      let y = cy + sinT * ry;
      if (sinT > 0.1) {
        const dentFactor = (sinT - 0.1) / 0.9;
        const dent = dentFactor * dentFactor * flatness * ry * 1.8;
        y += dent;
      }
      if (oscAmp > 0) {
        const osc = Math.sin(oscPhase + theta * 2) * oscAmp * rx;
        x += osc * Math.abs(sinT);
      }
      points.push({ x, y });
    }
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.closePath();
    const grad = ctx.createLinearGradient(cx, cy - ry, cx, cy + ry);
    grad.addColorStop(0, "rgba(120, 200, 230, 0.85)");
    grad.addColorStop(0.5, "rgba(77, 208, 225, 0.7)");
    grad.addColorStop(1, "rgba(0, 151, 167, 0.85)");
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = "rgba(77, 208, 225, 0.9)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.strokeStyle = "rgba(180, 235, 245, 0.4)";
    ctx.lineWidth = 0.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(cx - rx * 0.35, cy - ry * 0.4, rx * 0.25, ry * 0.18, -0.3, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawTeardrop(cx, cy, size, alpha) {
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(cx, cy - size);
    ctx.bezierCurveTo(cx + size * 0.55, cy - size * 0.3, cx + size * 0.7, cy + size * 0.5, cx, cy + size * 0.8);
    ctx.bezierCurveTo(cx - size * 0.7, cy + size * 0.5, cx - size * 0.55, cy - size * 0.3, cx, cy - size);
    ctx.closePath();
    const grad = ctx.createLinearGradient(cx, cy - size, cx, cy + size);
    grad.addColorStop(0, "rgba(239, 83, 80, 0.5)");
    grad.addColorStop(1, "rgba(239, 83, 80, 0.7)");
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = "rgba(239, 83, 80, 0.8)";
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawCross(cx, cy, size, alpha) {
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = "#ef5350";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx - size, cy - size);
    ctx.lineTo(cx + size, cy + size);
    ctx.moveTo(cx + size, cy - size);
    ctx.lineTo(cx - size, cy + size);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawCheck(cx, cy, size, alpha) {
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = "#4dd0e1";
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(cx - size * 0.6, cy);
    ctx.lineTo(cx - size * 0.15, cy + size * 0.5);
    ctx.lineTo(cx + size * 0.7, cy - size * 0.5);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawText(text, x, y, size, color, align, weight) {
    ctx.font = `${weight || 400} ${size}px ui-sans-serif, system-ui, sans-serif`;
    ctx.fillStyle = color;
    ctx.textAlign = align || "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, x, y);
  }

  function drawDashedLine(x1, y1, x2, y2, color, alpha) {
    ctx.globalAlpha = alpha !== undefined ? alpha : 1;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  // ============ 场景渲染 ============
  function render() {
    const W = state.canvasW;
    const H = state.canvasH;
    if (W < 10 || H < 10) return;

    ctx.clearRect(0, 0, W, H);

    const topH = Math.min(H * 0.20, 100);
    const topY = topH / 2;
    const cellW = W / 3;

    const leftCx = cellW * 0.5;
    const teardropSize = Math.min(cellW * 0.12, topH * 0.28);
    drawTeardrop(leftCx - 30, topY, teardropSize, 0.85);
    drawCross(leftCx + 30, topY, teardropSize * 0.5, 0.9);
    drawText("错误：泪滴形", leftCx, topY + topH * 0.35, 11, "#ef5350", "center", 500);

    drawDashedLine(cellW, topH * 0.15, cellW, topH * 0.85, "#1f2c44", 0.6);

    const rightCx = cellW * 2.5;
    const realSize = teardropSize * 0.9;
    drawDropShape(rightCx - 30, topY, realSize * 0.7, realSize * 0.7, 0.15, 0, 0, 0.85);
    drawCheck(rightCx + 30, topY, realSize * 0.45, 0.9);
    drawText("真实：由表面张力与气压塑造", rightCx, topY + topH * 0.35, 11, "#4dd0e1", "center", 500);

    drawDashedLine(0, topH + 6, W, topH + 6, "#1f2c44", 0.5);

    const centerTop = topH + 12;
    const centerBottom = H - Math.min(H * 0.18, 90);
    const centerH = centerBottom - centerTop;
    const centerCx = W / 2;
    const centerCy = centerTop + centerH / 2;

    drawDashedLine(centerCx, centerTop + 10, centerCx, centerBottom - 10, "#1a2540", 0.5);

    const cycleT = (state.simTime * 0.4) % 1;
    const dropY = centerTop + 30 + cycleT * (centerH - 60);

    const d = state.diameter;
    const sp = shapeParams(d);
    const v = terminalVelocity(d);
    const baseSize = Math.min(centerH * 0.22, W * 0.06) * (0.5 + d / 6 * 0.5);
    const oscPhase = state.simTime * 4;

    if (sp.breakup) {
      const breakupPhase = (state.simTime * 1.5) % 1;
      drawDropShape(centerCx, dropY, baseSize * (1 - breakupPhase * 0.3), baseSize * (1 - breakupPhase * 0.3), sp.flatness, oscPhase, sp.oscillation, 1 - breakupPhase * 0.5);
      const numDrops = 6;
      for (let i = 0; i < numDrops; i++) {
        const angle = (i / numDrops) * Math.PI * 2 + oscPhase * 0.3;
        const dist = baseSize * (0.8 + breakupPhase * 1.5);
        const sx = centerCx + Math.cos(angle) * dist;
        const sy = dropY + Math.sin(angle) * dist * 0.6 + breakupPhase * 20;
        const sr = baseSize * 0.15 * (1 - breakupPhase * 0.3);
        if (sr > 1) {
          drawDropShape(sx, sy, sr, sr, 0, 0, 0, 0.7 - breakupPhase * 0.3);
        }
      }
    } else {
      drawDropShape(centerCx, dropY, baseSize, baseSize, sp.flatness, oscPhase, sp.oscillation, 1);
    }

    const labelX = centerCx + baseSize + 30;
    const labelY = dropY - baseSize - 10;
    drawDashedLine(centerCx + baseSize, dropY, labelX - 5, labelY + 10, "#4dd0e1", 0.4);
    drawText(`直径 ${d.toFixed(1)} mm`, labelX, labelY, 13, "#e8eefc", "left", 500);
    drawText(`速度 ${v.toFixed(1)} m/s`, labelX, labelY + 20, 13, "#4dd0e1", "left", 500);
    drawText(`形状 ${shapeLabel(d)}`, labelX, labelY + 40, 13, "#7e8da8", "left", 400);

    const bottomH = H - centerBottom - 6;
    const bottomY = centerBottom + 6 + bottomH / 2;
    const compareCases = [
      { d: 0.8, label: "小球" },
      { d: 3.0, label: "汉堡包" },
      { d: 5.5, label: "碎裂" },
    ];
    const caseW = W / 3;

    drawDashedLine(0, centerBottom + 6, W, centerBottom + 6, "#1f2c44", 0.5);

    compareCases.forEach((tc, i) => {
      const cx = caseW * (i + 0.5);
      const sp2 = shapeParams(tc.d);
      const v2 = terminalVelocity(tc.d);
      const size = Math.min(bottomH * 0.28, caseW * 0.1) * (0.6 + tc.d / 6 * 0.4);
      const oscPhase2 = state.simTime * 3 + i * 1.5;

      if (sp2.breakup) {
        const bp2 = (state.simTime * 1.2 + i * 0.3) % 1;
        drawDropShape(cx, bottomY - 5, size * (1 - bp2 * 0.25), size * (1 - bp2 * 0.25), sp2.flatness, oscPhase2, sp2.oscillation, 1 - bp2 * 0.4);
        for (let j = 0; j < 4; j++) {
          const ang = (j / 4) * Math.PI * 2 + oscPhase2 * 0.5;
          const dist = size * (0.7 + bp2 * 1.2);
          const sx = cx + Math.cos(ang) * dist;
          const sy = bottomY - 5 + Math.sin(ang) * dist * 0.5 + bp2 * 15;
          const sr = size * 0.13 * (1 - bp2 * 0.2);
          if (sr > 1) drawDropShape(sx, sy, sr, sr, 0, 0, 0, 0.6 - bp2 * 0.2);
        }
      } else {
        drawDropShape(cx, bottomY - 5, size, size, sp2.flatness, oscPhase2, sp2.oscillation, 1);
      }

      drawText(tc.label, cx, bottomY + size + 8, 11, "#7e8da8", "center", 500);
      drawText(`${tc.d.toFixed(1)} mm`, cx, bottomY + size + 24, 10, "#4dd0e1", "center", 400);
      drawText(`${v2.toFixed(1)} m/s`, cx, bottomY + size + 38, 10, "#7e8da8", "center", 400);
    });
  }

  // ============ 更新 ============
  function update(dt) {
    if (!state.running) return;
    const boundedDt = Math.max(0, Math.min(dt, 0.05));
    state.simTime += boundedDt * state.slowmo;
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // ============ 生命周期 ============
  function start() {
    state.running = true;
    document.getElementById("status").textContent = "运行中";
    document.getElementById("startBtn").setAttribute("aria-pressed", "true");
    document.getElementById("pauseBtn").setAttribute("aria-pressed", "false");
  }

  function pause() {
    state.running = false;
    document.getElementById("status").textContent = "已暂停";
    document.getElementById("startBtn").setAttribute("aria-pressed", "false");
    document.getElementById("pauseBtn").setAttribute("aria-pressed", "true");
  }

  function reset() {
    pause();
    state.simTime = 0;
    state.lastTimestamp = null;
    render();
  }

  function setParameters(values) {
    if (values.diameter !== undefined) {
      const v = parseFloat(values.diameter);
      if (Number.isFinite(v)) {
        state.diameter = Math.max(0.5, Math.min(6, v));
        document.getElementById("diameterInput").value = String(state.diameter);
        document.getElementById("diameterOutput").textContent = `${state.diameter.toFixed(1)} mm`;
      }
    }
    if (values.slowmo !== undefined) {
      const v = parseFloat(values.slowmo);
      if (Number.isFinite(v)) {
        state.slowmo = Math.max(0.1, Math.min(1, v));
        document.getElementById("slowmoInput").value = String(state.slowmo);
        document.getElementById("slowmoOutput").textContent = `${state.slowmo.toFixed(2)}x`;
      }
    }
    render();
  }

  function getState() {
    return {
      diameter: state.diameter,
      slowmo: state.slowmo,
      simTime: state.simTime,
      running: state.running,
      terminalVelocity: terminalVelocity(state.diameter),
      shapeLabel: shapeLabel(state.diameter),
    };
  }

  function getReadouts() {
    return {
      diameter: state.diameter,
      velocity: terminalVelocity(state.diameter),
      shape: shapeLabel(state.diameter),
      slowmo: state.slowmo,
    };
  }

  function runModelChecks() {
    const v0_5 = terminalVelocity(0.5);
    const v1 = terminalVelocity(1.0);
    const v3 = terminalVelocity(3.0);
    const v5 = terminalVelocity(5.0);
    const v6 = terminalVelocity(6.0);

    const s0_8 = shapeParams(0.8);
    const s3 = shapeParams(3.0);
    const s5_5 = shapeParams(5.5);

    return [
      { name: "末速度随直径单调递增", pass: v3 > v1 && v5 > v3, expected: "v(5) > v(3) > v(1)", actual: `v(1)=${v1.toFixed(2)}, v(3)=${v3.toFixed(2)}, v(5)=${v5.toFixed(2)}`, tolerance: "strict" },
      { name: "末速度有上界", pass: v6 <= 9.8 + 0.01, expected: "<= 9.8 m/s", actual: v6.toFixed(2), tolerance: 0.01 },
      { name: "小球为球形", pass: s0_8.flatness === 0 && !s0_8.breakup, expected: "flatness=0, breakup=false", actual: `flatness=${s0_8.flatness}, breakup=${s0_8.breakup}`, tolerance: "strict" },
      { name: "中滴为汉堡包形", pass: s3.flatness > 0 && !s3.breakup, expected: "flatness>0, breakup=false", actual: `flatness=${s3.flatness.toFixed(2)}, breakup=${s3.breakup}`, tolerance: "strict" },
      { name: "大滴会碎裂", pass: s5_5.breakup, expected: "breakup=true", actual: `breakup=${s5_5.breakup}`, tolerance: "strict" },
      { name: "形状标签正确", pass: shapeLabel(0.8) === "球形" && shapeLabel(3.0) === "汉堡包形" && shapeLabel(5.5) === "碎裂形", expected: "球形/汉堡包形/碎裂形", actual: `${shapeLabel(0.8)}/${shapeLabel(3.0)}/${shapeLabel(5.5)}`, tolerance: "strict" },
    ];
  }

  // ============ 控件 ============
  function bindControls() {
    const diameterInput = document.getElementById("diameterInput");
    const slowmoInput = document.getElementById("slowmoInput");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");

    diameterInput.addEventListener("input", () => setParameters({ diameter: diameterInput.value }));
    slowmoInput.addEventListener("input", () => setParameters({ slowmo: slowmoInput.value }));
    startBtn.addEventListener("click", start);
    pauseBtn.addEventListener("click", pause);
    resetBtn.addEventListener("click", reset);
  }

  function init() {
    resizeCanvas();
    bindControls();
    window.addEventListener("resize", resizeCanvas);
    requestAnimationFrame(frame);
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
