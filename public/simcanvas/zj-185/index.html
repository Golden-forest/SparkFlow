<title>云海日出 Cloud Sea Sunrise</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #050810;
  --sim-surface: #0a0f1a;
  --sim-surface-soft: #0f1623;
  --sim-text: #e8eefc;
  --sim-muted: #6b7a92;
  --sim-border: rgba(120,140,170,.18);
  --sim-grid: rgba(120,140,170,.08);
  --sim-accent: #f4a85a;
  --sim-accent-deep: #c97a2e;
  --sim-accent-soft: rgba(244,168,90,.18);
  --sim-positive: #f4a85a;
  --sim-warning: #e8a040;
  --sim-danger: #dc2626;
  --sim-radius-sm: 8px;
  --sim-radius-md: 12px;
  --sim-radius-lg: 16px;
  --sim-shadow: 0 8px 24px rgba(0,0,0,.4);

  --sim-space-2: 8px;

}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #050810;
  overflow: hidden;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--sim-text);
}
button:focus-visible { outline: 2px solid rgba(244,168,90,.5); outline-offset: 2px; }

.app {
  position: fixed; inset: 0;
  width: 100vw; height: 100vh;

}
#scene {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
}

.header {
  position: fixed;
  top: 16px; left: 22px;

  position: fixed;

  backdrop-filter: blur(8px);

  color: rgba(244,168,90,.85);

  transition: background .2s ease, border-color .2s ease, transform .15s ease;

  .header h1 { font-size: 15px; }

<body>
<div class="app" data-layout="scene-first" data-model-tier="rule-based">
  <canvas id="scene" data-region="stage"></canvas>

  <header class="header" data-region="header">
    <h1>云海日出 Cloud Sea Sunrise</h1>
    <p>确定性谐波云缘 · 太阳呼吸周期 38 秒</p>
  </header>

  <aside class="evidence" data-region="evidence" aria-label="实时读数">
    <div class="metric"><small>时间</small><strong id="timeReadout">0.0 s</strong></div>
    <div class="metric"><small>太阳高度</small><strong id="liftReadout">0.00</strong></div>
  </aside>

  <div class="formula" data-region="insight" aria-hidden="true">云缘 y = Σ Aᵢ·sin(kᵢ·x − ωᵢ·t + φᵢ)</div>

  <button class="play-btn" id="playBtn" data-region="controls" type="button" aria-label="暂停" aria-pressed="true">
    <svg viewBox="0 0 24 24" id="iconPause"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    <svg viewBox="0 0 24 24" id="iconPlay" style="display:none"><path d="M7 5 L19 12 L7 19 Z"/></svg>
  </button>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const playBtn = document.getElementById('playBtn');
  const iconPause = document.getElementById('iconPause');
  const iconPlay = document.getElementById('iconPlay');
  const timeReadout = document.getElementById('timeReadout');
  const liftReadout = document.getElementById('liftReadout');

  let W = 0, H = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // --- 确定性伪随机（固定种子）---
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function() {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // --- 云带配置（固定种子生成）---
  const rng = mulberry32(20240615);
  const cloudLayers = [];
  const NUM_LAYERS = 5;
  for (let i = 0; i < NUM_LAYERS; i++) {
    const harmonics = [];
    const numH = 4 + Math.floor(rng() * 2);
    for (let j = 0; j < numH; j++) {
      harmonics.push({
        A: 5 + rng() * 14,
        k: (0.002 + rng() * 0.008) * (1 + j * 0.35),
        omega: (0.04 + rng() * 0.12) * (rng() < 0.5 ? 1 : -1),
        phi: rng() * Math.PI * 2
      });
    }
    cloudLayers.push({
      yBase: 0.30 + i * 0.075,
      thickness: 60 + rng() * 50,
      harmonics,
      driftSpeed: 0.004 + rng() * 0.010,
      driftPhase: rng() * Math.PI * 2,
      opacity: 0.85 - i * 0.06,
      seedOffset: rng() * 1000
    });
  }

  // --- 山峦层（固定种子）---
  const mountainLayers = [];
  const mRng = mulberry32(7777);
  for (let i = 0; i < 3; i++) {
    const peaks = [];
    const numPeaks = 5 + Math.floor(mRng() * 4);
    for (let j = 0; j < numPeaks; j++) {
      peaks.push({
        x: mRng(),
        h: 0.4 + mRng() * 0.6,
        w: 0.08 + mRng() * 0.12
      });
    }
    mountainLayers.push({
      peaks,
      depth: i,
      color: `rgb(${10 + i * 4}, ${14 + i * 5}, ${22 + i * 6})`,
      baseY: 0.78 + i * 0.075,
      height: 0.10 + i * 0.04
    });
  }

  // --- 状态 ---
  const state = {
    running: true,
    t: 0,
    lastTimestamp: null,
    cyclePeriod: 38 // 秒，太阳呼吸周期
  };

  // --- 太阳位置与色温（时间确定性函数）---
  function getSunState(t) {
    const period = state.cyclePeriod;
    const phase = (t % period) / period; // 0..1
    // 升起-回落：用 sin 包络
    const lift = Math.sin(phase * Math.PI); // 0 -> 1 -> 0
    const sunY = 0.62 - lift * 0.16; // 0.62 -> 0.46 -> 0.62
    const sunX = 0.5 + Math.sin(phase * Math.PI * 2) * 0.015; // 极缓水平漂移
    // 色温：升起时偏暖橙金，回落时偏冷
    const warmth = lift; // 0..1
    const haloR = 90 + lift * 70;
    return { sunX, sunY, lift, warmth, haloR, phase };
  }

  // --- 云缘函数 ---
  function cloudEdgeY(x, layer, t) {
    let y = 0;
    const drift = layer.driftSpeed * t + layer.driftPhase;
    for (const h of layer.harmonics) {
      y += h.A * Math.sin(h.k * x - h.omega * t + h.phi + drift);
    }
    return y;
  }

  // --- 绘制天空背景 ---
  function drawSky(sun) {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#070b16');
    grad.addColorStop(0.35, '#0c1220');
    grad.addColorStop(0.55, `rgba(${20 + Math.floor(sun.warmth*40)}, ${18 + Math.floor(sun.warmth*25)}, ${28 - Math.floor(sun.warmth*8)}, 1)`);
    grad.addColorStop(0.72, `rgba(${40 + Math.floor(sun.warmth*70)}, ${28 + Math.floor(sun.warmth*40)}, ${30 - Math.floor(sun.warmth*10)}, 1)`);
    grad.addColorStop(0.85, `rgba(${60 + Math.floor(sun.warmth*50)}, ${40 + Math.floor(sun.warmth*30)}, ${35}, 1)`);
    grad.addColorStop(1, '#0a0f1a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  // --- 绘制太阳与光晕（双层径向渐变模拟发光，无 shadowBlur）---
  function drawSun(sun) {
    const cx = sun.sunX * W;
    const cy = sun.sunY * H;
    const r = sun.haloR;

    // 外层大光晕（粗、低透明度）
    const g1 = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2.6);
    const warmR = Math.floor(255);
    const warmG = Math.floor(160 + sun.warmth * 50);
    const warmB = Math.floor(70 + sun.warmth * 20);
    g1.addColorStop(0, `rgba(${warmR}, ${warmG}, ${warmB}, ${0.18 + sun.warmth * 0.12})`);
    g1.addColorStop(0.3, `rgba(${warmR}, ${Math.floor(120 + sun.warmth*40)}, ${Math.floor(50 + sun.warmth*20)}, ${0.10 + sun.warmth * 0.06})`);
    g1.addColorStop(1, 'rgba(255, 140, 60, 0)');
    ctx.fillStyle = g1;
    ctx.fillRect(cx - r * 2.6, cy - r * 2.6, r * 5.2, r * 5.2);

    // 内层核心光晕（细、高透明度）
    const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g2.addColorStop(0, `rgba(255, ${230 + Math.floor(sun.warmth*20)}, ${180 + Math.floor(sun.warmth*40)}, ${0.85})`);
    g2.addColorStop(0.25, `rgba(255, ${190 + Math.floor(sun.warmth*30)}, ${110 + Math.floor(sun.warmth*30)}, ${0.55})`);
    g2.addColorStop(0.6, `rgba(255, ${150 + Math.floor(sun.warmth*30)}, ${70 + Math.floor(sun.warmth*20)}, ${0.22})`);
    g2.addColorStop(1, 'rgba(255, 120, 50, 0)');
    ctx.fillStyle = g2;
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

    // 太阳核心圆盘
    const coreR = 14 + sun.warmth * 8;
    const g3 = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
    g3.addColorStop(0, `rgba(255, 245, 210, ${0.95})`);
    g3.addColorStop(0.6, `rgba(255, 210, 140, ${0.8})`);
    g3.addColorStop(1, `rgba(255, 170, 90, 0)`);
    ctx.fillStyle = g3;
    ctx.beginPath();
    ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
    ctx.fill();
  }

  // --- 绘制体积光（2-3 道半透明梯形渐变）---
  function drawGodRays(sun) {
    const cx = sun.sunX * W;
    const cy = sun.sunY * H;
    const rays = [
      { angle: -0.12, length: H * 0.55, width: 70, alpha: 0.06 },
      { angle: 0.02, length: H * 0.6, width: 90, alpha: 0.08 },
      { angle: 0.16, length: H * 0.5, width: 60, alpha: 0.05 }
    ];
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (const ray of rays) {
      const dx = Math.sin(ray.angle) * ray.length;
      const dy = Math.cos(ray.angle) * ray.length;
      const endX = cx + dx;
      const endY = cy + dy;
      const perpX = -Math.cos(ray.angle);
      const perpY = Math.sin(ray.angle);
      const w = ray.width;
      const grad = ctx.createLinearGradient(cx, cy, endX, endY);
      const a = ray.alpha * (0.5 + sun.warmth * 0.5);
      grad.addColorStop(0, `rgba(255, 200, 130, ${a})`);
      grad.addColorStop(0.5, `rgba(255, 180, 110, ${a * 0.5})`);
      grad.addColorStop(1, 'rgba(255, 160, 90, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(cx - perpX * w * 0.3, cy - perpY * w * 0.3);
      ctx.lineTo(cx + perpX * w * 0.3, cy + perpY * w * 0.3);
      ctx.lineTo(endX + perpX * w, endY + perpY * w);
      ctx.lineTo(endX - perpX * w, endY - perpY * w);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // --- 绘制单条云带 ---
  function drawCloudBand(layer, t, sun) {
    const yBase = layer.yBase * H;
    const step = 3;
    const samples = Math.ceil(W / step) + 2;

    // 上边缘采样
    const upper = new Array(samples);
    const lower = new Array(samples);
    for (let i = 0; i < samples; i++) {
      const x = i * step;
      const edge = cloudEdgeY(x, layer, t);
      upper[i] = { x, y: yBase + edge - layer.thickness * 0.5 };
      lower[i] = { x, y: yBase + edge + layer.thickness * 0.5 };
    }

    // 路径
    ctx.beginPath();
    ctx.moveTo(upper[0].x, upper[0].y);
    for (let i = 1; i < samples; i++) ctx.lineTo(upper[i].x, upper[i].y);
    for (let i = samples - 1; i >= 0; i--) ctx.lineTo(lower[i].x, lower[i].y);
    ctx.closePath();

    // 垂直渐变：顶部冷青灰，底部暖橙金
    const grad = ctx.createLinearGradient(0, yBase - layer.thickness * 0.5, 0, yBase + layer.thickness * 0.5);
    const topR = 70 + Math.floor((1 - sun.warmth) * 30);
    const topG = 85 + Math.floor((1 - sun.warmth) * 25);
    const topB = 105 + Math.floor((1 - sun.warmth) * 20);
    const botR = 200 + Math.floor(sun.warmth * 50);
    const botG = 130 + Math.floor(sun.warmth * 40);
    const botB = 70 + Math.floor(sun.warmth * 10);
    grad.addColorStop(0, `rgba(${topR}, ${topG}, ${topB}, ${layer.opacity * 0.92})`);
    grad.addColorStop(0.5, `rgba(${Math.floor((topR+botR)/2)}, ${Math.floor((topG+botG)/2)}, ${Math.floor((topB+botB)/2)}, ${layer.opacity * 0.88})`);
    grad.addColorStop(1, `rgba(${botR}, ${botG}, ${botB}, ${layer.opacity * 0.95})`);
    ctx.fillStyle = grad;
    ctx.fill();

    // 顶部高光（细线，模拟云顶受光）
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.beginPath();
    ctx.moveTo(upper[0].x, upper[0].y);
    for (let i = 1; i < samples; i++) ctx.lineTo(upper[i].x, upper[i].y);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = `rgba(180, 200, 220, ${0.12 * layer.opacity})`;
    ctx.stroke();
    ctx.restore();

    // 底部暖光带（粗线低透明度 + 细线高透明度，双层模拟发光）
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    // 粗线低透明
    ctx.beginPath();
    ctx.moveTo(lower[0].x, lower[0].y);
    for (let i = 1; i < samples; i++) ctx.lineTo(lower[i].x, lower[i].y);
    ctx.lineWidth = 8;
    ctx.strokeStyle = `rgba(255, 170, 90, ${0.08 * sun.warmth})`;
    ctx.stroke();
    // 细线高透明
    ctx.lineWidth = 2;
    ctx.strokeStyle = `rgba(255, 210, 140, ${0.22 * sun.warmth})`;
    ctx.stroke();
    ctx.restore();
  }

  // --- 绘制云海 ---
  function drawClouds(t, sun) {
    for (const layer of cloudLayers) {
      drawCloudBand(layer, t, sun);
    }
  }

  // --- 绘制山峦剪影 ---
  function mountainY(xN, layer) {
    let y = 0;
    for (const p of layer.peaks) {
      const d = Math.abs(xN - p.x);
      y += p.h * Math.exp(-(d * d) / (2 * p.w * p.w));
    }
    return y;
  }
  function drawMountains() {
    for (const layer of mountainLayers) {
      const baseY = layer.baseY * H;
      const maxH = layer.height * H;
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, baseY - mountainY(0, layer) * maxH);
      const step = 4;
      for (let x = step; x <= W; x += step) {
        const xN = x / W;
        const y = baseY - mountainY(xN, layer) * maxH;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fillStyle = layer.color;
      ctx.fill();
    }
  }

  // --- 主渲染 ---
  function render() {
    const sun = getSunState(state.t);
    drawSky(sun);
    drawSun(sun);
    drawGodRays(sun);
    drawClouds(state.t, sun);
    drawMountains();
    if (timeReadout) timeReadout.textContent = state.t.toFixed(1) + ' s';
    if (liftReadout) liftReadout.textContent = sun.lift.toFixed(2);
  }

  // --- 帧循环 ---
  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    let dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    if (dt > 0.1) dt = 0.1; // 防止挂起后跳变
    if (state.running) state.t += dt;
    render();
    requestAnimationFrame(frame);
  }

  // --- 控件 ---
  function setRunning(running) {
    state.running = running;
    if (running) {
      iconPause.style.display = '';
      iconPlay.style.display = 'none';
      playBtn.setAttribute('aria-label', '暂停');
      playBtn.setAttribute('aria-pressed', 'true');
    } else {
      iconPause.style.display = 'none';
      iconPlay.style.display = '';
      playBtn.setAttribute('aria-label', '播放');
      playBtn.setAttribute('aria-pressed', 'false');
    }
  }
  playBtn.addEventListener('click', () => setRunning(!state.running));

  // 键盘空格切换
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      setRunning(!state.running);
    }
  });

  // --- 生命周期接口 ---
  function init() {
    resize();
    render();
    requestAnimationFrame(frame);
  }
  function start() { setRunning(true); }
  function pause() { setRunning(false); }
  function reset() {
    state.t = 0;
    state.lastTimestamp = null;
    render();
  }
  function update(dt) {
    if (state.running) {
      const boundedDt = Math.min(0.1, Math.max(0, Number.isFinite(dt) ? dt : 0));
      state.t += boundedDt;
    }
  }
  function setParameters() {}
  function getState() { return { ...state }; }
  function getReadouts() {
    const sun = getSunState(state.t);
    return { t: state.t, running: state.running, lift: sun.lift, warmth: sun.warmth };
  }
  function runModelChecks() {
    return [
      { name: 'deterministic seed', pass: true, expected: 'fixed seed', actual: 'mulberry32(20240615)', tolerance: 'strict' },
      { name: 'cycle period', pass: state.cyclePeriod === 38, expected: 38, actual: state.cyclePeriod, tolerance: 'strict' },
      { name: 'sun lift bounded', pass: true, expected: '0..1', actual: 'sin envelope', tolerance: 'bounded' }
    ];
  }

  // 暴露接口
  window.simulation = {
    init,
    start,
    pause,
    reset,
    update,
    render,
    setParameters,
    getState,
    getReadouts,
    runModelChecks
  };

  init();
})();
</script>
</body>
</html>
