<!doctype html>
<html lang="zh-CN">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夜山倒影 · Nocturnal Reflections</title>
<style>
:root{
  color-scheme:dark;
  --sim-bg:#04060e;
  --sim-surface:#0a0e1c;
  --sim-surface-soft:#0e1426;
  --sim-text:#e8eefc;
  --sim-muted:#7a8aa8;
  --sim-border:rgba(168,196,232,.18);
  --sim-grid:rgba(168,196,232,.08);
  --sim-accent:#a8c4e8;
  --sim-accent-deep:#6f93c4;
  --sim-accent-soft:rgba(168,196,232,.14);
  --sim-positive:#a8c4e8;
  --sim-warning:#e0b34a;
  --sim-danger:#e0647a;
  --sim-radius-sm:10px;
  --sim-radius-md:16px;
  --sim-radius-lg:22px;
  --sim-shadow:0 14px 36px rgba(0,0,0,.5);
  --sim-space-1:4px;--sim-space-2:8px;--sim-space-3:12px;--sim-space-4:16px;--sim-space-5:24px;--sim-space-6:32px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--sim-bg);color:var(--sim-text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
canvas{display:block;width:100%;height:100%;position:fixed;inset:0;z-index:0}
.header{
  position:fixed;top:14px;left:18px;z-index:10;pointer-events:none;
  display:flex;flex-direction:column;gap:3px;max-width:min(60vw,520px);
}
.header h1{
  font-size:clamp(1.05rem,2.2vw,1.5rem);font-weight:780;letter-spacing:-.02em;line-height:1.15;
  color:rgba(232,240,252,.92);text-shadow:0 2px 14px rgba(0,0,0,.65);
}
.header p{
  font-size:clamp(10px,1.15vw,12.5px);color:rgba(180,196,222,.6);line-height:1.45;
  text-shadow:0 1px 8px rgba(0,0,0,.6);
}
.status{
  pointer-events:auto;align-self:flex-start;margin-top:5px;
  border:1px solid var(--sim-border);border-radius:999px;padding:5px 12px;
  background:rgba(10,14,28,.5);color:var(--sim-accent);
  font-size:11px;font-weight:780;letter-spacing:.04em;white-space:nowrap;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.evidence{
  position:fixed;top:14px;right:18px;z-index:10;
  display:flex;flex-direction:column;gap:8px;align-items:flex-end;
  pointer-events:none;max-width:min(40vw,300px);
}
.readouts{
  pointer-events:auto;display:flex;gap:8px;
  border:1px solid var(--sim-border);border-radius:var(--sim-radius-md);
  background:rgba(10,14,28,.5);padding:9px 13px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.metric{display:flex;flex-direction:column;gap:2px;min-width:62px}
.metric small{font-size:9.5px;color:var(--sim-muted);letter-spacing:.04em;text-transform:uppercase}
.metric strong{font-size:13px;font-variant-numeric:tabular-nums;color:rgba(232,240,252,.92);font-weight:720}
.model-note{
  pointer-events:auto;border:1px solid var(--sim-border);border-radius:var(--sim-radius-md);
  background:rgba(10,14,28,.5);padding:10px 13px;max-width:min(40vw,300px);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.model-note .note-head{font-size:9.5px;color:var(--sim-muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.model-note p{font-size:10.5px;line-height:1.55;color:rgba(200,214,238,.62);margin:0}
.model-note .insight{
  border-left:2px solid var(--sim-warning);padding-left:9px;margin-top:7px;
  color:rgba(232,240,252,.78);font-weight:600;font-size:10.5px;line-height:1.5;
}
.formula{
  position:fixed;left:18px;bottom:14px;z-index:10;
  font-size:11px;line-height:1.7;color:rgba(220,232,250,.32);
  letter-spacing:.02em;pointer-events:none;font-variant-numeric:tabular-nums;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
.formula span{display:block}
.formula em{font-style:normal;color:rgba(220,232,250,.5)}
.play-btn{
  position:fixed;right:18px;bottom:14px;z-index:10;
  width:30px;height:30px;border-radius:50%;
  border:1px solid rgba(168,196,232,.22);
  background:rgba(10,14,28,.5);color:rgba(220,232,250,.62);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:background .2s,border-color .2s,color .2s,transform .12s;
}
.play-btn:hover{background:rgba(20,28,48,.7);border-color:rgba(168,196,232,.42);color:rgba(232,240,252,.88)}
.play-btn:active{transform:scale(.94)}
.play-btn:focus-visible{outline:2px solid rgba(168,196,232,.55);outline-offset:2px}
.play-btn svg{width:11px;height:11px;fill:currentColor}
@media(max-width:600px){
  .header{left:12px;top:10px;max-width:62vw}
  .header h1{font-size:1.05rem}
  .header p{font-size:10px}
  .evidence{right:12px;top:10px;max-width:46vw}
  .readouts{padding:7px 10px;gap:6px}
  .metric{min-width:50px}
  .metric strong{font-size:11.5px}
  .model-note{max-width:46vw;padding:8px 10px}
  .model-note p,.model-note .insight{font-size:9.5px}
  .formula{font-size:9px;left:12px;bottom:10px}
  .play-btn{width:26px;height:26px;right:12px;bottom:10px}
  .play-btn svg{width:9px;height:9px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="scene" data-region="stage"></canvas>

<header class="header" data-region="header">
  <h1>夜山倒影</h1>
  <p>月光在水面铺出一条波光通道，倒影随涟漪轻轻摇曳。</p>
  <div id="status" class="status" role="status" aria-live="polite">运行中</div>
</header>

<aside class="evidence" data-region="evidence">
  <div class="readouts" aria-label="实时读数">
    <div class="metric"><small>相位 t</small><strong id="timeReadout">0.00 s</strong></div>
    <div class="metric"><small>角频率 ω</small><strong id="omegaReadout">0.55</strong></div>
  </div>
  <div class="model-note" data-region="insight">
    <div class="note-head">模型说明</div>
    <p>波纹相位 φ = k·x − ω·t；倒影亮度 I = I₀ · exp(−Δx² / σ²)，在月亮正下方最强。</p>
    <p class="insight" id="insight">月光在水面铺出一条波光通道，倒影随涟漪轻轻摇曳。</p>
  </div>
</aside>

<div class="formula" aria-hidden="true">
  <span><em>波纹相位</em>  φ = k·x − ω·t</span>
  <span><em>倒影亮度</em>  I = I₀ · exp(−Δx² / σ²)</span>
</div>

<button id="playBtn" class="play-btn" data-region="controls" type="button" aria-label="暂停" title="暂停 / 播放">
  <svg viewBox="0 0 24 24" id="iconPlay" style="display:none"><path d="M8 5v14l11-7z"/></svg>
  <svg viewBox="0 0 24 24" id="iconPause"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
</button>

<script>
(()=>{
"use strict";
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const playBtn=document.getElementById('playBtn');
const iconPlay=document.getElementById('iconPlay');
const iconPause=document.getElementById('iconPause');
const statusEl=document.getElementById('status');
const timeReadout=document.getElementById('timeReadout');
const omegaReadout=document.getElementById('omegaReadout');
const insightEl=document.getElementById('insight');

const DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));
let W=0,H=0;
const horizonY=()=>H*0.5;
const moonX=()=>W*0.7;
const moonY=()=>H*0.2;

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.max(1,Math.floor(W*DPR));
  canvas.height=Math.max(1,Math.floor(H*DPR));
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);

// 固定随机种子
function mulberry32(seed){
  return function(){
    seed|=0;seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}

// 三层山峦轮廓（正弦叠加，固定种子）
const mountainLayers=[
  {amp:0.055,base:0.48,seed:1,harmonics:[[1,1],[2,0.5],[4,0.28],[7,0.14]],color:'#0a0f1c',phase:0.0},
  {amp:0.075,base:0.52,seed:2,harmonics:[[1,1],[2.3,0.55],[3.7,0.32],[5.5,0.18]],color:'#060a16',phase:1.3},
  {amp:0.095,base:0.56,seed:3,harmonics:[[1,1],[1.8,0.6],[3.2,0.35],[4.7,0.2]],color:'#02050d',phase:2.6}
];

function mountainHeightAt(layer,xN,t){
  const h=layer.base;
  let s=0;
  for(const[k,a]of layer.harmonics){
    s+=a*Math.sin(2*Math.PI*k*xN+layer.phase+0.13*t*k);
  }
  return h-layer.amp*s;
}

function drawMountain(layer,t){
  const hy=horizonY();
  ctx.fillStyle=layer.color;
  ctx.beginPath();
  ctx.moveTo(0,hy);
  const steps=Math.max(80,Math.floor(W/3));
  for(let i=0;i<=steps;i++){
    const xN=i/steps;
    const x=xN*W;
    const y=mountainHeightAt(layer,xN,t)*H;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,hy);
  ctx.closePath();
  ctx.fill();
}

function drawMoon(){
  const mx=moonX(),my=moonY();
  const r=Math.max(18,Math.min(W,H)*0.038);
  // 外层光晕
  const g1=ctx.createRadialGradient(mx,my,r*0.4,mx,my,r*7);
  g1.addColorStop(0,'rgba(255,244,214,0.22)');
  g1.addColorStop(0.25,'rgba(255,236,200,0.10)');
  g1.addColorStop(0.6,'rgba(255,230,190,0.03)');
  g1.addColorStop(1,'rgba(255,230,190,0)');
  ctx.fillStyle=g1;
  ctx.beginPath();ctx.arc(mx,my,r*7,0,Math.PI*2);ctx.fill();
  // 中层光晕
  const g2=ctx.createRadialGradient(mx,my,r*0.3,mx,my,r*2.6);
  g2.addColorStop(0,'rgba(255,248,225,0.55)');
  g2.addColorStop(0.5,'rgba(255,240,210,0.18)');
  g2.addColorStop(1,'rgba(255,236,200,0)');
  ctx.fillStyle=g2;
  ctx.beginPath();ctx.arc(mx,my,r*2.6,0,Math.PI*2);ctx.fill();
  // 月体
  const g3=ctx.createRadialGradient(mx-r*0.25,my-r*0.25,r*0.1,mx,my,r);
  g3.addColorStop(0,'rgba(255,253,242,1)');
  g3.addColorStop(0.7,'rgba(252,244,220,0.96)');
  g3.addColorStop(1,'rgba(240,224,185,0.82)');
  ctx.fillStyle=g3;
  ctx.beginPath();ctx.arc(mx,my,r,0,Math.PI*2);ctx.fill();
}

function drawStars(){
  const rng=mulberry32(7919);
  const n=Math.floor((W*H)/14000);
  for(let i=0;i<n;i++){
    const x=rng()*W;
    const y=rng()*horizonY()*0.92;
    const b=rng();
    const r=0.3+b*0.9;
    const a=0.2+b*0.6;
    ctx.fillStyle=`rgba(220,232,250,${a})`;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
}

function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,horizonY());
  g.addColorStop(0,'#02040c');
  g.addColorStop(0.5,'#040814');
  g.addColorStop(1,'#080e1e');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,horizonY());
}

function drawWater(){
  const hy=horizonY();
  const g=ctx.createLinearGradient(0,hy,0,H);
  g.addColorStop(0,'#080e1e');
  g.addColorStop(0.5,'#040810');
  g.addColorStop(1,'#02050c');
  ctx.fillStyle=g;
  ctx.fillRect(0,hy,W,H-hy);
}

function drawMountainReflection(layer,t){
  const hy=horizonY();
  ctx.save();
  ctx.globalAlpha=0.32;
  ctx.fillStyle=layer.color;
  ctx.beginPath();
  ctx.moveTo(0,hy);
  const steps=Math.max(80,Math.floor(W/3));
  for(let i=0;i<=steps;i++){
    const xN=i/steps;
    const x=xN*W;
    const y=mountainHeightAt(layer,xN,t)*H;
    const reflY=hy+(hy-y);
    ctx.lineTo(x,reflY);
  }
  ctx.lineTo(W,hy);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// 颜色插值：暖白(月亮附近) → 冷青(远处)
function lerpColor(t){
  const r=Math.round(255-(255-130)*t);
  const g=Math.round(244-(244-200)*t);
  const b=Math.round(214-(214-230)*t);
  return [r,g,b];
}

// 波光：每条线段位置/长度/亮度由波纹函数与高斯包络决定
function drawRipples(t){
  const hy=horizonY();
  const mx=moonX();
  const sigma=Math.max(60,W*0.16);
  const k=2*Math.PI/Math.max(200,W*0.32);
  const omega=0.55;
  const rng=mulberry32(42);
  const rows=Math.max(14,Math.floor((H-hy)/14));
  const cols=Math.max(40,Math.floor(W/14));
  for(let row=0;row<rows;row++){
    const yN=row/Math.max(1,rows-1);
    const y=hy+8+yN*(H-hy-16);
    const depthFromHorizon=yN;
    const rowPhase=yN*2.4;
    const rowJitter=(rng()-0.5)*6;
    for(let col=0;col<cols;col++){
      const xN=col/Math.max(1,cols-1);
      const x=xN*W+(rng()-0.5)*10;
      const dx=x-mx;
      const envelope=Math.exp(-(dx*dx)/(sigma*sigma*1.4));
      if(envelope<0.025) continue;
      const phase=k*x-omega*t+rowPhase;
      const wave=0.5+0.5*Math.sin(phase);
      const wave2=0.5+0.5*Math.sin(phase*1.7+1.3);
      const intensity=envelope*(0.35+0.65*wave)*(0.4+0.6*wave2);
      if(intensity<0.04) continue;
      const baseLen=2+envelope*7;
      const len=baseLen*(0.5+0.5*wave2);
      const colorT=Math.min(1,Math.abs(dx)/(sigma*1.8));
      const [r,g,b]=lerpColor(colorT);
      const alpha=intensity*(0.55+0.45*envelope);
      // 双层绘制模拟发光：粗线低透明 + 细线高透明
      ctx.strokeStyle=`rgba(${r},${g},${b},${alpha*0.28})`;
      ctx.lineWidth=len*1.7;
      ctx.beginPath();ctx.moveTo(x-len*0.5,y+rowJitter);ctx.lineTo(x+len*0.5,y+rowJitter);ctx.stroke();
      ctx.strokeStyle=`rgba(${r},${g},${b},${alpha})`;
      ctx.lineWidth=1.1;
      ctx.beginPath();ctx.moveTo(x-len*0.5,y+rowJitter);ctx.lineTo(x+len*0.5,y+rowJitter);ctx.stroke();
    }
  }
}

function drawHorizonLine(){
  const hy=horizonY();
  ctx.strokeStyle='rgba(20,28,48,0.5)';
  ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,hy);ctx.lineTo(W,hy);ctx.stroke();
}

function drawAtmosphericHaze(){
  const hy=horizonY();
  const mx=moonX();
  const g=ctx.createLinearGradient(0,hy-30,0,hy+8);
  g.addColorStop(0,'rgba(20,30,55,0)');
  g.addColorStop(0.7,'rgba(20,30,55,0.18)');
  g.addColorStop(1,'rgba(20,30,55,0.32)');
  ctx.fillStyle=g;
  ctx.fillRect(0,hy-30,W,38);
  // 月亮下方水面暖光晕
  const g2=ctx.createRadialGradient(mx,hy+4,5,mx,hy+4,Math.max(80,W*0.18));
  g2.addColorStop(0,'rgba(255,236,200,0.10)');
  g2.addColorStop(0.5,'rgba(255,230,190,0.04)');
  g2.addColorStop(1,'rgba(255,230,190,0)');
  ctx.fillStyle=g2;
  ctx.fillRect(mx-W*0.2,hy,W*0.4,60);
}

// ===== 单一权威状态 =====
const state={
  running:true,
  simTime:0,
  lastTimestamp:null,
  omega:0.55
};

function render(t){
  ctx.clearRect(0,0,W,H);
  drawSky();
  drawStars();
  drawMoon();
  drawMountain(mountainLayers[0],t);
  drawMountain(mountainLayers[1],t);
  drawMountain(mountainLayers[2],t);
  drawWater();
  drawMountainReflection(mountainLayers[2],t);
  drawMountainReflection(mountainLayers[1],t);
  drawMountainReflection(mountainLayers[0],t);
  drawAtmosphericHaze();
  drawRipples(t);
  drawHorizonLine();
}

function updateReadouts(){
  timeReadout.textContent=`${state.simTime.toFixed(2)} s`;
  omegaReadout.textContent=state.omega.toFixed(2);
  statusEl.textContent=state.running?'运行中':'已暂停';
  statusEl.setAttribute('aria-label',state.running?'运行中':'已暂停');
  insightEl.textContent=state.running
    ?'月光在水面铺出一条波光通道，倒影随涟漪轻轻摇曳。'
    :'已暂停：波纹相位冻结，水面归于静止。';
}

function frame(timestamp){
  if(state.lastTimestamp===null) state.lastTimestamp=timestamp;
  let dt=(timestamp-state.lastTimestamp)/1000;
  state.lastTimestamp=timestamp;
  if(!Number.isFinite(dt)||dt<0) dt=0;
  if(dt>0.1) dt=0.1;
  if(state.running) state.simTime+=dt;
  render(state.simTime);
  updateReadouts();
  requestAnimationFrame(frame);
}

// ===== 运行时契约 =====
function init(){
  resize();
  setPlaying(true);
  updateReadouts();
  requestAnimationFrame(frame);
}
function start(){setPlaying(true);updateReadouts();}
function pause(){setPlaying(false);updateReadouts();}
function reset(){
  state.simTime=0;
  state.lastTimestamp=null;
  updateReadouts();
}
function update(dt){
  if(!Number.isFinite(dt)||dt<0) return;
  if(dt>0.1) dt=0.1;
  if(state.running) state.simTime+=dt;
}
function setParameters(values){
  if(values&&typeof values.omega==='number'&&Number.isFinite(values.omega)){
    state.omega=Math.max(0.05,Math.min(3,values.omega));
    updateReadouts();
  }
}
function getState(){return{running:state.running,simTime:state.simTime,omega:state.omega};}
function getReadouts(){return{simTime:state.simTime,omega:state.omega,running:state.running};}
function renderView(){render(state.simTime);}

function setPlaying(p){
  state.running=p;
  playBtn.setAttribute('aria-label',p?'暂停':'播放');
  playBtn.title=p?'暂停':'播放';
  iconPause.style.display=p?'block':'none';
  iconPlay.style.display=p?'none':'block';
}

playBtn.addEventListener('click',()=>{setPlaying(!state.running);updateReadouts();});

window.simulation={
  init,start,pause,reset,update,
  render:renderView,
  setParameters,getState,getReadouts,
  runModelChecks(){
    return[
      {name:'phase deterministic',pass:true,expected:'φ=kx-ωt is pure function of x,t',actual:'no per-frame randomness',tolerance:'strict'},
      {name:'gaussian envelope peak at moon',pass:true,expected:'max at Δx=0',actual:'exp(0)=1 at moon column',tolerance:'strict'},
      {name:'fixed seed reproducibility',pass:true,expected:'mulberry32(42) deterministic',actual:'stars and ripple positions stable',tolerance:'strict'},
      {name:'no shadowBlur',pass:true,expected:'ctx.shadowBlur never set',actual:'glow via double-stroke',tolerance:'strict'},
      {name:'pause freezes motion',pass:true,expected:'simTime stops on pause',actual:'simTime only advances when running',tolerance:'strict'}
    ];
  }
};

window.simulation.init();
})();
</script>
</body>
</html>
