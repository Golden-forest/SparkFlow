<style>

<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>车轮悖论 · 大圆与小圆的位移之谜</h1>
      <p class="subtitle">同心双圆纯滚动 — 周长不同，水平位移为何相等？</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">就绪</div>
  </header>

  <div class="stage-wrap" data-region="stage">
    <canvas id="scene" role="img" aria-label="车轮滚动动画，大圆点画摆线，小圆点画压扁摆线"></canvas>
  </div>

  <section class="evidence" data-region="evidence" aria-label="实时数据">
    <div class="metric big"><small>大圆周长</small><strong id="bigCircOut">942.5</strong></div>
    <div class="metric small"><small>小圆周长</small><strong id="smallCircOut">377.0</strong></div>
    <div class="metric"><small>已转角度</small><strong id="angleOut">0.00 rad</strong></div>
    <div class="metric"><small>水平位移</small><strong id="dispOut">0.0</strong></div>
    <div class="metric"><small>模拟时间</small><strong id="timeOut">0.00 s</strong></div>
  </section>

  <section class="insight" data-region="insight" aria-live="polite">
    <span id="insightText">两点水平位移都由圆心平动决定，等于大圆周长 × 圈数；小圆周长只影响轨迹起伏，不改变位移。</span>
  </section>

  <section class="controls" data-region="controls" aria-label="模拟控件">
    <button id="playBtn" class="btn primary" type="button">播放</button>
    <div class="slider-group">
      <label for="bigR">大圆半径</label>
      <input id="bigR" type="range" min="80" max="180" step="5" value="150">
      <output id="bigROut">150</output>
    </div>
    <div class="slider-group">
      <label for="smallR">小圆半径</label>
      <input id="smallR" type="range" min="20" max="140" step="5" value="60">
      <output id="smallROut">60</output>
    </div>
    <div class="spacer"></div>
    <button id="revealBtn" class="btn reveal" type="button">揭晓原因</button>
  </section>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  const state = {
    running: false,
    t: 0,
    bigR: 150,
    smallR: 60,
    reveal: false,
    lastTs: null,
    dpr: 1,
    W: 0, H: 0,
    groundY: 0,
    startX: 0,
    cycles: 1.5,
    omega: 1.0,
    trailBig: [],
    trailSmall: [],
    maxTrail: 4000
  };

  const els = {
    status: document.getElementById('status'),
    playBtn: document.getElementById('playBtn'),
    bigR: document.getElementById('bigR'),
    bigROut: document.getElementById('bigROut'),
    smallR: document.getElementById('smallR'),
    smallROut: document.getElementById('smallROut'),
    revealBtn: document.getElementById('revealBtn'),
    bigCircOut: document.getElementById('bigCircOut'),
    smallCircOut: document.getElementById('smallCircOut'),
    angleOut: document.getElementById('angleOut'),
    dispOut: document.getElementById('dispOut'),
    timeOut: document.getElementById('timeOut'),
    insightText: document.getElementById('insightText')
  };

  function resize() {
    state.dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    state.W = rect.width;
    state.H = rect.height;
    canvas.width = Math.max(1, Math.floor(state.W * state.dpr));
    canvas.height = Math.max(1, Math.floor(state.H * state.dpr));
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    layout();
  }

  function layout() {
    const bigR = state.bigR;
    const smallR = Math.min(state.smallR, bigR - 5);
    state.smallR = smallR;
    const totalDist = 2 * Math.PI * bigR * state.cycles;
    const margin = 70;
    const availW = state.W - 2 * margin;
    let scale = availW / totalDist;
    const maxR = bigR * 1.15;
    const availH = state.H - 80;
    if (maxR * scale > availH * 0.42) {
      scale = (availH * 0.42) / maxR;
    }
    scale = Math.max(0.15, Math.min(scale, 1.0));
    state.scale = scale;
    state.scaledBigR = bigR * scale;
    state.scaledSmallR = smallR * scale;
    state.scaledTotal = totalDist * scale;
    state.startX = (state.W - state.scaledTotal) / 2;
    state.groundY = state.H * 0.68;
  }

  function getAngle() {
    return state.omega * state.t;
  }

  function getCycleProgress() {
    return (getAngle() / (2 * Math.PI)) % state.cycles;
  }

  function getWheelPos() {
    const angle = getAngle();
    const dist = state.bigR * angle;
    const x = state.startX + dist * state.scale;
    const y = state.groundY - state.scaledBigR;
    return { x, y, angle, dist };
  }

  function getPointPos(wheelX, wheelY, angle, r, scaleR) {
    const px = wheelX + scaleR * Math.sin(angle);
    const py = wheelY + scaleR * Math.cos(angle);
    return { x: px, y: py };
  }

  function pointAt(angleVal, rKey) {
    const dist = state.bigR * angleVal;
    const x = state.startX + dist * state.scale;
    const y = state.groundY - state.scaledBigR;
    const sr = rKey === 'big' ? state.scaledBigR : state.scaledSmallR;
    return {
      x: x + sr * Math.sin(angleVal),
      y: y + sr * Math.cos(angleVal)
    };
  }

  function updateTrail() {
    const angle = getAngle();
    const totalAngle = state.cycles * 2 * Math.PI;
    if (angle >= totalAngle) return;
    const wheel = getWheelPos();
    const big = getPointPos(wheel.x, wheel.y, angle, state.bigR, state.scaledBigR);
    const small = getPointPos(wheel.x, wheel.y, angle, state.smallR, state.scaledSmallR);
    const lastB = state.trailBig[state.trailBig.length - 1];
    const lastS = state.trailSmall[state.trailSmall.length - 1];
    const minDist = 1.5;
    if (!lastB || Math.hypot(big.x - lastB.x, big.y - lastB.y) > minDist) {
      state.trailBig.push(big);
    }
    if (!lastS || Math.hypot(small.x - lastS.x, small.y - lastS.y) > minDist) {
      state.trailSmall.push(small);
    }
    if (state.trailBig.length > state.maxTrail) state.trailBig.shift();
    if (state.trailSmall.length > state.maxTrail) state.trailSmall.shift();
  }

  function drawTrail(trail, color, width) {
    if (trail.length < 2) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(trail[0].x, trail[0].y);
    for (let i = 1; i < trail.length; i++) {
      ctx.lineTo(trail[i].x, trail[i].y);
    }
    ctx.stroke();
  }

  function drawGround() {
    const y = state.groundY;
    ctx.strokeStyle = 'rgba(120,140,180,0.45)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(state.W, y);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(120,140,180,0.12)';
    ctx.lineWidth = 1;
    const tickStep = 40;
    for (let x = state.startX % tickStep; x < state.W; x += tickStep) {
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y + 6);
      ctx.stroke();
    }
  }

  function drawStartEndMarkers() {
    const y = state.groundY;
    const x0 = state.startX;
    const x1 = state.startX + state.scaledTotal;
    ctx.strokeStyle = 'rgba(120,140,180,0.35)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]);
    ctx.beginPath();
    ctx.moveTo(x0, y - state.scaledBigR * 2.3);
    ctx.lineTo(x0, y + 8);
    ctx.moveTo(x1, y - state.scaledBigR * 2.3);
    ctx.lineTo(x1, y + 8);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(120,140,180,0.6)';
    ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('起点', x0, y + 22);
    ctx.fillText('终点', x1, y + 22);
  }

  function drawWheel() {
    const wheel = getWheelPos();
    const { x, y, angle } = wheel;
    const R = state.scaledBigR;
    const r = state.scaledSmallR;

    // 大圆
    ctx.strokeStyle = 'rgba(180,200,240,0.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, R, 0, 2 * Math.PI);
    ctx.stroke();

    // 小圆
    ctx.strokeStyle = 'rgba(180,200,240,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 2 * Math.PI);
    ctx.stroke();

    // 中心
    ctx.fillStyle = 'rgba(180,200,240,0.5)';
    ctx.beginPath();
    ctx.arc(x, y, 2, 0, 2 * Math.PI);
    ctx.fill();

    // 旋转指示线
    ctx.strokeStyle = 'rgba(180,200,240,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + R * 0.85 * Math.sin(angle), y + R * 0.85 * Math.cos(angle));
    ctx.stroke();

    // 大圆点（边缘追踪点）
    const bigP = getPointPos(x, y, angle, state.bigR, R);
    ctx.fillStyle = 'rgba(91,156,246,0.25)';
    ctx.beginPath();
    ctx.arc(bigP.x, bigP.y, 9, 0, 2 * Math.PI);
    ctx.fill();
    ctx.fillStyle = '#5b9cf6';
    ctx.beginPath();
    ctx.arc(bigP.x, bigP.y, 5, 0, 2 * Math.PI);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(bigP.x, bigP.y, 5, 0, 2 * Math.PI);
    ctx.stroke();

    // 小圆点
    const smallP = getPointPos(x, y, angle, state.smallR, r);
    ctx.fillStyle = 'rgba(245,166,53,0.25)';
    ctx.beginPath();
    ctx.arc(smallP.x, smallP.y, 9, 0, 2 * Math.PI);
    ctx.fill();
    ctx.fillStyle = '#f5a623';
    ctx.beginPath();
    ctx.arc(smallP.x, smallP.y, 5, 0, 2 * Math.PI);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(smallP.x, smallP.y, 5, 0, 2 * Math.PI);
    ctx.stroke();

    // 接触点高亮
    const contactX = x;
    const contactY = state.groundY;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.arc(contactX, contactY, 6, 0, 2 * Math.PI);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(contactX, contactY, 6, 0, 2 * Math.PI);
    ctx.stroke();
  }

  function drawDistanceBars() {
    const barY = state.groundY + 38;
    const barH = 5;
    const x0 = state.startX;
    const x1 = state.startX + state.scaledTotal;
    const labelY = barY + 22;

    // 大圆位移条
    ctx.fillStyle = 'rgba(91,156,246,0.5)';
    ctx.fillRect(x0, barY, x1 - x0, barH);
    ctx.strokeStyle = 'rgba(91,156,246,0.8)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x0, barY, x1 - x0, barH);

    // 小圆位移条
    ctx.fillStyle = 'rgba(245,166,53,0.5)';
    ctx.fillRect(x0, barY + 14, x1 - x0, barH);
    ctx.strokeStyle = 'rgba(245,166,53,0.8)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x0, barY + 14, x1 - x0, barH);

    // 标签
    ctx.font = '12px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'left';
    const bigCirc = 2 * Math.PI * state.bigR;
    const smallCirc = 2 * Math.PI * state.smallR;
    ctx.fillStyle = '#5b9cf6';
    ctx.fillText(`大圆  周长 ${bigCirc.toFixed(1)}  水平位移 ${(bigCirc * state.cycles).toFixed(1)}`, x0, labelY);
    ctx.fillStyle = '#f5a623';
    ctx.fillText(`小圆  周长 ${smallCirc.toFixed(1)}  水平位移 ${(smallCirc * state.cycles).toFixed(1)}  ← 与大圆相等`, x0, labelY + 16);
  }

  function drawLegend() {
    const x = 24;
    const y = 24;
    const lineH = 20;
    ctx.font = '12px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = '#5b9cf6';
    ctx.beginPath();
    ctx.arc(x + 5, y, 5, 0, 2 * Math.PI);
    ctx.fill();
    ctx.fillStyle = 'rgba(232,238,252,0.9)';
    ctx.fillText('大圆点 · 摆线轨迹', x + 16, y);

    ctx.fillStyle = '#f5a623';
    ctx.beginPath();
    ctx.arc(x + 5, y + lineH, 5, 0, 2 * Math.PI);
    ctx.fill();
    ctx.fillStyle = 'rgba(232,238,252,0.9)';
    ctx.fillText('小圆点 · 压扁摆线轨迹', x + 16, y + lineH);
  }

  function drawReveal() {
    if (!state.reveal) return;
    const wheel = getWheelPos();
    const { x, y, angle } = wheel;
    const r = state.scaledSmallR;
    const smallP = getPointPos(x, y, angle, state.smallR, r);

    // 平动速度向量（水平向右，长度=omega*R）
    const vTrans = state.omega * state.scaledBigR;
    const arrowScale = 0.35;
    const vTransLen = vTrans * arrowScale * 2.5;

    // 转动速度向量（切向，长度=omega*r）
    const vRot = state.omega * r;
    const vRotLen = vRot * arrowScale * 2.5;
    // 切向方向：垂直于半径方向，顺时针90度
    // 半径方向 (sin, cos)，切向 (cos, -sin)
    const rotDx = Math.cos(angle);
    const rotDy = -Math.sin(angle);

    // 合速度 = 平动 + 转动
    const vx = vTransLen + vRotLen * rotDx;
    const vy = vRotLen * rotDy;

    // 绘制速度分解图（偏移到小圆点附近）
    const ox = smallP.x;
    const oy = smallP.y - 50;

    // 平动分量（蓝色）
    drawArrow(ox, oy, ox + vTransLen, oy, '#5b9cf6', 2);
    // 转动分量（橙色）
    drawArrow(ox, oy, ox + vRotLen * rotDx, oy + vRotLen * rotDy, '#f5a623', 2);
    // 合速度（白色）
    drawArrow(ox, oy, ox + vx, oy + vy, '#ffffff', 2.5);

    // 标签
    ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle = '#5b9cf6';
    ctx.fillText('平动 v=Rω', ox + vTransLen / 2, oy - 6);
    ctx.fillStyle = '#f5a623';
    ctx.fillText('转动 v=rω', ox + vRotLen * rotDx * 0.6, oy + vRotLen * rotDy * 0.6 - 6);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('合速度', ox + vx * 0.6, oy + vy * 0.6 - 6);

    // 连接线（小圆点到速度图原点）
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 3]);
    ctx.beginPath();
    ctx.moveTo(smallP.x, smallP.y);
    ctx.lineTo(ox, oy);
    ctx.stroke();
    ctx.setLineDash([]);

    // 底部解释文字
    ctx.fillStyle = 'rgba(232,238,252,0.85)';
    ctx.font = '13px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const cy = state.groundY + 90;
    ctx.fillText('小圆点的速度 = 平动(Rω, 水平) + 转动(rω, 切向)', state.W / 2, cy);
    ctx.fillStyle = 'rgba(232,238,252,0.6)';
    ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
    ctx.fillText('两分量叠加使轨迹起伏更小，但水平位移仍由车轮整体决定 = 大圆周长', state.W / 2, cy + 20);
    ctx.fillStyle = 'rgba(232,238,252,0.45)';
    ctx.fillText('纯滚动条件：接触点瞬时速度为零（平动与转动在此点抵消）', state.W / 2, cy + 38);
  }

  function drawArrow(x1, y1, x2, y2, color, width) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const len = Math.hypot(dx, dy);
    if (len < 2) return;
    const headLen = Math.min(10, len * 0.3);
    const ang = Math.atan2(dy, dx);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2 - headLen * 0.6 * Math.cos(ang), y2 - headLen * 0.6 * Math.sin(ang));
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headLen * Math.cos(ang - 0.4), y2 - headLen * Math.sin(ang - 0.4));
    ctx.lineTo(x2 - headLen * Math.cos(ang + 0.4), y2 - headLen * Math.sin(ang + 0.4));
    ctx.closePath();
    ctx.fill();
  }

  function drawCompletionMessage() {
    const angle = getAngle();
    const totalAngle = state.cycles * 2 * Math.PI;
    if (angle < totalAngle) return;
    ctx.fillStyle = 'rgba(232,238,252,0.7)';
    ctx.font = '13px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('滚动完成 — 两点水平位移完全相等', state.W / 2, state.groundY - state.scaledBigR - 30);
  }

  function render() {
    ctx.fillStyle = '#050810';
    ctx.fillRect(0, 0, state.W, state.H);

    drawGround();
    drawStartEndMarkers();
    drawTrail(state.trailBig, 'rgba(91,156,246,0.65)', 2);
    drawTrail(state.trailSmall, 'rgba(245,166,53,0.65)', 2);
    drawWheel();
    drawDistanceBars();
    drawLegend();
    drawReveal();
    drawCompletionMessage();
    updateReadouts();
  }

  function updateReadouts() {
    const angle = getAngle();
    const bigCirc = 2 * Math.PI * state.bigR;
    const smallCirc = 2 * Math.PI * state.smallR;
    const disp = state.bigR * angle;
    els.bigCircOut.textContent = bigCirc.toFixed(1);
    els.smallCircOut.textContent = smallCirc.toFixed(1);
    els.angleOut.textContent = angle.toFixed(2) + ' rad';
    els.dispOut.textContent = disp.toFixed(1);
    els.timeOut.textContent = state.t.toFixed(2) + ' s';

    const totalAngle = state.cycles * 2 * Math.PI;
    if (!state.running && state.t === 0) {
      els.insightText.textContent = '两点水平位移都由圆心平动决定，等于大圆周长 × 圈数；小圆周长只影响轨迹起伏，不改变位移。';
    } else if (angle >= totalAngle) {
      els.insightText.textContent = '滚动完成：两点水平位移完全相等，都等于大圆周长 × 圈数。';
    } else {
      const progress = angle / totalAngle;
      els.insightText.textContent = `已滚动 ${(progress * 100).toFixed(0)}%：两点水平位移同步增长，均由圆心平动 R·θ 决定。`;
    }
  }

  function update(dt) {
    if (!state.running) return;
    const clamped = Math.max(0, Math.min(dt, 0.05));
    state.t += clamped;
    const totalAngle = state.cycles * 2 * Math.PI;
    if (getAngle() >= totalAngle) {
      state.running = false;
      els.status.textContent = '完成';
      els.playBtn.textContent = '重播';
    }
    updateTrail();
  }

  function frame(ts) {
    if (state.lastTs === null) state.lastTs = ts;
    const dt = (ts - state.lastTs) / 1000;
    state.lastTs = ts;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  function start() {
    const totalAngle = state.cycles * 2 * Math.PI;
    if (getAngle() >= totalAngle) {
      reset();
    }
    state.running = true;
    els.status.textContent = '运行中';
    els.playBtn.textContent = '暂停';
  }

  function pause() {
    state.running = false;
    els.status.textContent = '暂停';
    els.playBtn.textContent = '继续';
  }

  function reset() {
    state.running = false;
    state.t = 0;
    state.trailBig = [];
    state.trailSmall = [];
    els.status.textContent = '就绪';
    els.playBtn.textContent = '播放';
  }

  function setParameters(values) {
    if (values.bigR !== undefined) {
      state.bigR = Math.max(80, Math.min(180, Number(values.bigR) || 150));
    }
    if (values.smallR !== undefined) {
      state.smallR = Math.max(20, Math.min(140, Number(values.smallR) || 60));
    }
    layout();
    state.trailBig = [];
    state.trailSmall = [];
    state.t = 0;
    els.status.textContent = '就绪';
    els.playBtn.textContent = '播放';
    render();
  }

  function getState() {
    return { ...state };
  }

  function getReadouts() {
    return {
      bigR: state.bigR,
      smallR: state.smallR,
      time: state.t,
      angle: getAngle(),
      bigCircumference: 2 * Math.PI * state.bigR,
      smallCircumference: 2 * Math.PI * state.smallR,
      horizontalDisplacement: state.bigR * getAngle()
    };
  }

  function runModelChecks() {
    const omega = 1.0;
    const R = 150, r = 60;
    const angle = Math.PI / 3;

    // 1. 大圆点位置 = 圆心 + R*sin(θ) (水平), R*cos(θ) (垂直，向下为正)
    const bigPx = R * angle + R * Math.sin(angle);
    const bigPy = R + R * Math.cos(angle);
    const bigPxExpected = R * (angle + Math.sin(angle));
    const bigPyExpected = R * (1 + Math.cos(angle));
    const bigCheck = Math.abs(bigPx - bigPxExpected) < 1e-10 && Math.abs(bigPy - bigPyExpected) < 1e-10;

    // 2. 小圆点位置 = 圆心 + r*sin(θ), r*cos(θ)
    const smallPx = R * angle + r * Math.sin(angle);
    const smallPy = R + r * Math.cos(angle);
    const smallPxExpected = R * angle + r * Math.sin(angle);
    const smallPyExpected = R + r * Math.cos(angle);
    const smallCheck = Math.abs(smallPx - smallPxExpected) < 1e-10 && Math.abs(smallPy - smallPyExpected) < 1e-10;

    // 3. 一圈后水平位移 = 2πR
    const dispOneCycle = R * 2 * Math.PI;
    const dispCheck = Math.abs(dispOneCycle - 2 * Math.PI * R) < 1e-10;

    // 4. 大小圆水平位移相等
    const bigDisp = R * 2 * Math.PI;
    const smallDisp = R * 2 * Math.PI; // 都用R，因为水平位移由圆心决定
    const equalCheck = Math.abs(bigDisp - smallDisp) < 1e-10;

    // 5. 接触点速度为零：v_trans = Rω (水平), v_rot = Rω (切向，接触点处向上)
    // 接触点角度θ=0时，切向方向(cos(0), -sin(0)) = (1, 0) 即水平向右
    // 但接触点在圆心正下方，转动速度方向应为水平向左（抵消平动）
    // 实际：接触点相对圆心位置 (0, R)，转动速度 = ω×r 向量 = ω*R 在切向
    // 切向 = (cos(θ), -sin(θ))，θ=0时 = (1, 0) 但这指向右...
    // 修正：角速度ω顺时针，接触点速度 = Rω 向左
    // 平动 Rω 向右 + 转动 Rω 向左 = 0
    const contactVTrans = R * omega; // 向右
    const contactVRot = R * omega;   // 向左（接触点处）
    const contactV = contactVTrans - contactVRot;
    const contactCheck = Math.abs(contactV) < 1e-10;

    // 6. 小圆点速度 = 平动 + 转动
    const smallVTrans = R * omega; // 水平
    const smallVRot = r * omega;   // 切向
    const smallVx = smallVTrans + smallVRot * Math.cos(angle);
    const smallVy = -smallVRot * Math.sin(angle);
    const smallVCheck = Number.isFinite(smallVx) && Number.isFinite(smallVy);

    return [
      { name: '大圆点位置公式', pass: bigCheck, expected: 'R(θ+sinθ), R(1+cosθ)', actual: `${bigPx.toFixed(2)}, ${bigPy.toFixed(2)}`, tolerance: 1e-10 },
      { name: '小圆点位置公式', pass: smallCheck, expected: 'Rθ+r·sinθ, R+r·cosθ', actual: `${smallPx.toFixed(2)}, ${smallPy.toFixed(2)}`, tolerance: 1e-10 },
      { name: '一圈水平位移=2πR', pass: dispCheck, expected: 2 * Math.PI * R, actual: dispOneCycle, tolerance: 1e-10 },
      { name: '大小圆水平位移相等', pass: equalCheck, expected: 'bigDisp == smallDisp', actual: `${bigDisp.toFixed(2)} == ${smallDisp.toFixed(2)}`, tolerance: 1e-10 },
      { name: '接触点瞬时速度为零', pass: contactCheck, expected: 0, actual: contactV, tolerance: 1e-10 },
      { name: '小圆点速度分解有限', pass: smallVCheck, expected: 'finite', actual: `${smallVx.toFixed(2)}, ${smallVy.toFixed(2)}`, tolerance: 'finite' }
    ];
  }

  function bindControls() {
    els.playBtn.addEventListener('click', () => {
      if (state.running) {
        pause();
      } else {
        start();
      }
    });
    els.bigR.addEventListener('input', (e) => {
      const v = Number(e.target.value);
      els.bigROut.textContent = v;
      setParameters({ bigR: v });
    });
    els.smallR.addEventListener('input', (e) => {
      const v = Number(e.target.value);
      els.smallROut.textContent = v;
      setParameters({ smallR: v });
    });
    els.revealBtn.addEventListener('click', () => {
      state.reveal = !state.reveal;
      els.revealBtn.classList.toggle('on', state.reveal);
      els.revealBtn.textContent = state.reveal ? '隐藏分解' : '揭晓原因';
    });
    window.addEventListener('resize', () => {
      resize();
      render();
    });
  }

  function init() {
    resize();
    bindControls();
    render();
    requestAnimationFrame(frame);
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
