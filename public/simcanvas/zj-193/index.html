<title>氢原子电子云</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #050810;
  --sim-surface: #0a1020;
  --sim-surface-soft: #0f1830;
  --sim-text: #e8eefc;
  --sim-muted: #5a6a88;
  --sim-border: rgba(120,160,220,0.12);
  --sim-grid: rgba(120,160,220,0.06);
  --sim-accent: #4dd0e1;
  --sim-accent-deep: #00838f;
  --sim-accent-soft: rgba(77,208,225,0.15);
  --sim-positive: #4dd0e1;
  --sim-warning: #ffb74d;
  --sim-danger: #ef5350;
  --sim-radius-sm: 8px;
  --sim-radius-md: 12px;
  --sim-radius-lg: 16px;
  --sim-shadow: 0 8px 32px rgba(0,0,0,0.4);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: var(--sim-bg);
  overflow: hidden;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--sim-text);
}
body { position: fixed; inset: 0; }
#scene {
  display: block;
  width: 100vw; height: 100vh;
  cursor: crosshair;
}
.header {
  position: fixed;
  top: 18px; left: 22px;
  z-index: 10;
  user-select: none;
  pointer-events: none;
  text-shadow: 0 1px 6px rgba(0,0,0,0.85);
}
.header h1 {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: rgba(232,238,252,0.92);
  line-height: 1.2;
}
.header p {
  margin-top: 4px;
  font-size: 11px;
  letter-spacing: 0.06em;
  color: rgba(180,200,230,0.5);
  font-weight: 400;
}
.status {
  position: fixed;
  top: 18px; right: 22px;
  z-index: 10;
  border: 1px solid rgba(77,208,225,0.22);
  border-radius: 999px;
  padding: 7px 14px;
  background: rgba(10,18,32,0.55);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--sim-accent);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.08em;
  white-space: nowrap;
  user-select: none;
}
.ui {
  position: fixed;
  bottom: 20px; left: 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  z-index: 10;
  user-select: none;
  pointer-events: none;
}
.ui > * { pointer-events: auto; }
.play-btn {
  width: 38px; height: 38px;
  border: 1px solid rgba(120,180,220,0.18);
  border-radius: 50%;
  background: rgba(10,18,32,0.55);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: rgba(220,235,255,0.75);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.25s, border-color 0.25s, color 0.25s;
}
.play-btn:hover {
  background: rgba(20,38,64,0.75);
  border-color: rgba(120,180,220,0.35);
  color: rgba(240,250,255,0.95);
}
.play-btn:focus-visible {
  outline: 2px solid rgba(77,208,225,0.5);

}
.play-btn svg { width: 13px; height: 13px; fill: currentColor; }
.label {
  font-size: 11px;

  white-space: nowrap;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}
.label .orbital {
  color: rgba(220,240,255,0.65);

}
.label .sep { margin: 0 6px; opacity: 0.4; }
.evidence {
  position: fixed;
  bottom: 20px; right: 20px;

  align-items: flex-end;

}
.metric {
  border: 1px solid rgba(120,160,220,0.14);
  border-radius: var(--sim-radius-sm);

  -webkit-backdrop-filter: blur(10px);
  padding: 9px 14px;
  min-width: 120px;
  text-align: right;
}
.metric small {
  display: block;
  font-size: 10px;
  letter-spacing: 0.08em;
  color: rgba(180,200,230,0.5);
  margin-bottom: 3px;
}
.metric strong {
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  color: rgba(232,238,252,0.92);
  font-weight: 700;
}
@media (max-width: 600px) {
  .ui { bottom: 14px; left: 14px; gap: 10px; }
  .play-btn { width: 34px; height: 34px; }
  .label { font-size: 10px; }
  .header { top: 12px; left: 14px; }
  .header h1 { font-size: 15px; }
  .header p { font-size: 10px; }
  .status { top: 12px; right: 14px; padding: 6px 11px; font-size: 10px; }
  .evidence { bottom: 14px; right: 14px; }
  .metric { min-width: 100px; padding: 7px 11px; }
  .metric strong { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  .play-btn { transition: none; }
}
</style>

<body>
<header class="header" data-region="header">
  <h1>氢原子电子云</h1>
  <p>1s · 2p · 3d 概率密度可视化</p>
  <div id="status" class="status" role="status" aria-live="polite">运行中</div>
</header>

<canvas id="scene" data-region="stage" aria-label="氢原子电子云动态可视化"></canvas>

<aside class="evidence" data-region="evidence" aria-label="实时数据">
  <div class="metric"><small>当前轨道</small><strong id="orbitalReadout">1s</strong></div>
  <div class="metric"><small>模拟时间</small><strong id="timeReadout">0.0 s</strong></div>
</aside>

<div class="ui" data-region="controls">
  <button class="play-btn" id="playBtn" type="button" aria-label="暂停"></button>
  <div class="label" data-region="insight">
    <span class="orbital" id="orbitalLabel">1s</span>
    <span class="sep">·</span>
    <span>|ψ|² 概率密度决定点的疏密</span>
  </div>
</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d', { alpha: false });
const playBtn = document.getElementById('playBtn');
const orbitalLabel = document.getElementById('orbitalLabel');
const orbitalReadout = document.getElementById('orbitalReadout');
const timeReadout = document.getElementById('timeReadout');
const statusEl = document.getElementById('status');

// ── 配置 ──────────────────────────────────────────────
const NUM_POINTS = 5000;
const ORBITAL_DURATION = 10;        // 每种轨道 10 秒
const TRANSITION_DURATION = 1.2;   // 淡出淡入各 0.6s
const CYCLE = ORBITAL_DURATION + TRANSITION_DURATION; // 11.2s
const NUM_ORBITALS = 3;
const ORBITAL_NAMES = ['1s', '2p', '3d'];

// ── 状态 ──────────────────────────────────────────────
let W = 0, H = 0, cx = 0, cy = 0, scale = 1;
let dpr = 1;
let running = true;
let simTime = 0;
let lastFrameTime = null;

// ── 确定性 PRNG（线性同余，固定种子）─────────────────
function makeRng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

// ── 3D 向量工具 ───────────────────────────────────────
function rotateY(p, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [p[0]*c + p[2]*s, p[1], -p[0]*s + p[2]*c];
}
function rotateX(p, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [p[0], p[1]*c - p[2]*s, p[1]*s + p[2]*c];
}
function rotateZ(p, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [p[0]*c - p[1]*s, p[0]*s + p[1]*c, p[2]];
}

// ── 轨道概率密度采样 ──────────────────────────────────
function sample1s(rng) {
  for (let i = 0; i < 50; i++) {
    const r = -Math.log(1 - rng() * 0.999) * 0.7;
    if (r > 4) continue;
    const accept = r * r * Math.exp(-2 * r) / 0.135;
    if (rng() < accept) {
      const u = rng() * 2 - 1;
      const phi = rng() * Math.PI * 2;
      const s = Math.sqrt(1 - u*u);
      return [r * s * Math.cos(phi), r * s * Math.sin(phi), r * u];
    }
  }
  return [0,0,0];
}

function sample2p(rng) {
  for (let i = 0; i < 80; i++) {
    const r = rng() * 12;
    const pr = r*r*r*r * Math.exp(-r) / 29.8;
    if (rng() < pr) {
      for (let j = 0; j < 20; j++) {
        const u = rng() * 2 - 1;
        if (rng() < Math.abs(u)) {
          const phi = rng() * Math.PI * 2;
          const s = Math.sqrt(1 - u*u);
          return [r * s * Math.cos(phi), r * s * Math.sin(phi), r * u];
        }
      }
    }
  }
  return [0,0,0];
}

function sample3d(rng) {
  for (let i = 0; i < 100; i++) {
    const r = rng() * 22;
    const pr = Math.pow(r, 6) * Math.exp(-2*r/3) / 1.0e5;
    if (rng() < pr && pr > 1e-8) {
      for (let j = 0; j < 30; j++) {
        const u = rng() * 2 - 1;
        const y = (3*u*u - 1);
        const accept = y * y;
        if (rng() < accept) {
          const phi = rng() * Math.PI * 2;
          const s = Math.sqrt(1 - u*u);
          return [r * s * Math.cos(phi), r * s * Math.sin(phi), r * u];
        }
      }
    }
  }
  return [0,0,0];
}

const orbitals = [];
(function generateOrbitals() {
  const configs = [
    { sampler: sample1s, seed: 12345, scale: 1.0 },
    { sampler: sample2p, seed: 67890, scale: 0.42 },
    { sampler: sample3d, seed: 99999, scale: 0.20 }
  ];
  for (const cfg of configs) {
    const rng = makeRng(cfg.seed);
    const pts = new Float32Array(NUM_POINTS * 3);
    for (let i = 0; i < NUM_POINTS; i++) {
      const p = cfg.sampler(rng);
      pts[i*3]   = p[0] * cfg.scale;
      pts[i*3+1] = p[1] * cfg.scale;
      pts[i*3+2] = p[2] * cfg.scale;
    }
    orbitals.push(pts);
  }
})();

// ── 颜色 ──────────────────────────────────────────────
function colorForDepth(depth, lobe, alpha) {
  let r, g, b;
  if (lobe === 0) {
    const t = depth;
    r = Math.round(20 + t * 60);
    g = Math.round(80 + t * 140);
    b = Math.round(180 + t * 75);
  } else {
    const t = depth;
    r = Math.round(60 + t * 180);
    g = Math.round(180 + t * 60);
    b = Math.round(200 - t * 80);
  }
  return `rgba(${r},${g},${b},${alpha})`;
}

// ── 透视投影 ──────────────────────────────────────────
const VIEW_DIST = 3.5;

function project(p) {
  const z = p[2] + VIEW_DIST;
  if (z < 0.1) return null;
  const inv = 1 / z;
  return [
    cx + p[0] * scale * inv,
    cy - p[1] * scale * inv,
    z
  ];
}

// ── 渲染缓冲 ──────────────────────────────────────────
const projected = new Float32Array(NUM_POINTS * 4);
const indices = new Int32Array(NUM_POINTS);

// ── 主渲染 ────────────────────────────────────────────
function render() {
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
  bg.addColorStop(0, '#070b18');
  bg.addColorStop(0.6, '#04060e');
  bg.addColorStop(1, '#020306');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const tInCycle = simTime % CYCLE;
  let orbitalIdx, alpha;
  if (tInCycle < ORBITAL_DURATION) {
    orbitalIdx = Math.floor(simTime / CYCLE) % NUM_ORBITALS;
    alpha = 1;
  } else {
    const transT = (tInCycle - ORBITAL_DURATION) / TRANSITION_DURATION;
    const baseIdx = Math.floor(simTime / CYCLE) % NUM_ORBITALS;
    if (transT < 0.5) {
      orbitalIdx = baseIdx;
      alpha = 1 - transT * 2;
    } else {
      orbitalIdx = (baseIdx + 1) % NUM_ORBITALS;
      alpha = (transT - 0.5) * 2;
    }
  }
  alpha = Math.max(0, Math.min(1, alpha));

  if (orbitalLabel.textContent !== ORBITAL_NAMES[orbitalIdx]) {
    orbitalLabel.textContent = ORBITAL_NAMES[orbitalIdx];
  }
  orbitalReadout.textContent = ORBITAL_NAMES[orbitalIdx];
  timeReadout.textContent = simTime.toFixed(1) + ' s';
  statusEl.textContent = running ? '运行中' : '已暂停';

  const rotY = simTime * 0.25;
  const rotX = Math.sin(simTime * 0.18) * 0.35 + 0.15;
  const rotZ = Math.sin(simTime * 0.07) * 0.12;

  const breathFreq = 1.8;
  const breathAmp = 0.08;

  const pts = orbitals[orbitalIdx];

  for (let i = 0; i < NUM_POINTS; i++) {
    let x = pts[i*3];
    let y = pts[i*3+1];
    let z = pts[i*3+2];

    const r = Math.sqrt(x*x + y*y + z*z);
    const phase = r * 6;
    const breath = 1 + breathAmp * Math.sin(simTime * breathFreq + phase);
    x *= breath; y *= breath; z *= breath;

    let p = [x, y, z];
    p = rotateZ(p, rotZ);
    p = rotateX(p, rotX);
    p = rotateY(p, rotY);

    const proj = project(p);
    if (proj === null) {
      projected[i*4] = -1e9;
      continue;
    }
    projected[i*4]   = proj[0];
    projected[i*4+1] = proj[1];
    projected[i*4+2] = proj[2];
    projected[i*4+3] = z >= 0 ? 0 : 1;
  }

  for (let i = 0; i < NUM_POINTS; i++) indices[i] = i;
  const depthMin = VIEW_DIST - 2.5;
  const depthMax = VIEW_DIST + 25;
  const numBuckets = 64;
  const buckets = new Array(numBuckets);
  for (let i = 0; i < numBuckets; i++) buckets[i] = [];
  for (let i = 0; i < NUM_POINTS; i++) {
    if (projected[i*4] < -1e8) continue;
    let b = Math.floor((projected[i*4+2] - depthMin) / (depthMax - depthMin) * numBuckets);
    if (b < 0) b = 0;
    if (b >= numBuckets) b = numBuckets - 1;
    buckets[b].push(i);
  }
  let sortedIdx = 0;
  for (let b = 0; b < numBuckets; b++) {
    for (const idx of buckets[b]) {
      indices[sortedIdx++] = idx;
    }
  }
  const validCount = sortedIdx;

  ctx.globalCompositeOperation = 'lighter';
  for (let n = 0; n < validCount; n++) {
    const i = indices[n];
    const sx = projected[i*4];
    const sy = projected[i*4+1];
    const depth = projected[i*4+2];
    const lobe = projected[i*4+3];
    if (sx < -1e8) continue;

    const depthN = Math.max(0, Math.min(1, 1 - (depth - depthMin) / (depthMax - depthMin)));
    const size = 1.2 + depthN * 1.8;
    const a = alpha * (0.04 + depthN * 0.06);

    ctx.fillStyle = colorForDepth(depthN, lobe, a);
    ctx.beginPath();
    ctx.arc(sx, sy, size * 2.2, 0, Math.PI * 2);
    ctx.fill();
  }

  for (let n = 0; n < validCount; n++) {
    const i = indices[n];
    const sx = projected[i*4];
    const sy = projected[i*4+1];
    const depth = projected[i*4+2];
    const lobe = projected[i*4+3];
    if (sx < -1e8) continue;

    const depthN = Math.max(0, Math.min(1, 1 - (depth - depthMin) / (depthMax - depthMin)));
    const size = 0.6 + depthN * 1.0;
    const a = alpha * (0.5 + depthN * 0.4);

    ctx.fillStyle = colorForDepth(depthN, lobe, a);
    ctx.beginPath();
    ctx.arc(sx, sy, size, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'lighter';
  const coreR = 14 + Math.sin(simTime * 2.5) * 2;
  const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR * 3);
  coreGrad.addColorStop(0, `rgba(255,250,220,${0.9 * alpha})`);
  coreGrad.addColorStop(0.2, `rgba(255,220,150,${0.5 * alpha})`);
  coreGrad.addColorStop(0.5, `rgba(200,180,120,${0.15 * alpha})`);
  coreGrad.addColorStop(1, 'rgba(100,80,40,0)');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, coreR * 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = `rgba(255,255,240,${alpha})`;
  ctx.beginPath();
  ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalCompositeOperation = 'source-over';
}

// ── 模型更新 ──────────────────────────────────────────
function update(dt) {
  if (!running) return;
  let boundedDt = dt;
  if (!Number.isFinite(boundedDt)) boundedDt = 0;
  if (boundedDt > 0.1) boundedDt = 0.1;
  if (boundedDt < 0) boundedDt = 0;
  simTime += boundedDt;
}

// ── 动画循环 ──────────────────────────────────────────
function frame(timestamp) {
  if (lastFrameTime === null) lastFrameTime = timestamp;
  let dt = (timestamp - lastFrameTime) / 1000;
  lastFrameTime = timestamp;
  if (dt > 0.1) dt = 0.1;
  if (dt < 0) dt = 0;

  update(dt);
  render();
  requestAnimationFrame(frame);
}

// ── 尺寸适配 ──────────────────────────────────────────
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2;
  cy = H / 2;
  const targetRadius = Math.min(W, H) * 0.38;
  const maxR = 4.4;
  const avgDepth = VIEW_DIST + maxR * 0.6;
  scale = targetRadius * avgDepth / maxR;
}

window.addEventListener('resize', resize);

// ── 播放/暂停按钮 ─────────────────────────────────────
const playIcon = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const pauseIcon = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

function updatePlayBtn() {
  if (running) {
    playBtn.innerHTML = pauseIcon;
    playBtn.setAttribute('aria-label', '暂停');
    statusEl.textContent = '运行中';
  } else {
    playBtn.innerHTML = playIcon;
    playBtn.setAttribute('aria-label', '播放');
    statusEl.textContent = '已暂停';
  }
}

playBtn.addEventListener('click', () => {
  running = !running;
  updatePlayBtn();
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    running = !running;
    updatePlayBtn();
  }
});

// ── 生命周期钩子 ─────────────────────────────────────
function init() {
  resize();
  updatePlayBtn();
  requestAnimationFrame(frame);
}

function start() {
  running = true;
  updatePlayBtn();
}

function pause() {
  running = false;
  updatePlayBtn();
}

function reset() {
  simTime = 0;
  running = false;
  updatePlayBtn();
  render();
}

function setParameters(values) {
  // 当前无可调参数；保留接口以满足契约并支持未来扩展
  if (values && typeof values === 'object') {
    // no-op: 保留以兼容验证器调用
  }
}

function getState() {
  const tInCycle = simTime % CYCLE;
  let orbitalIdx;
  if (tInCycle < ORBITAL_DURATION) {
    orbitalIdx = Math.floor(simTime / CYCLE) % NUM_ORBITALS;
  } else {
    const transT = (tInCycle - ORBITAL_DURATION) / TRANSITION_DURATION;
    const baseIdx = Math.floor(simTime / CYCLE) % NUM_ORBITALS;
    orbitalIdx = transT < 0.5 ? baseIdx : (baseIdx + 1) % NUM_ORBITALS;
  }
  return {
    running,
    simTime,
    orbitalIdx,
    orbital: ORBITAL_NAMES[orbitalIdx]
  };
}

function getReadouts() {
  const s = getState();
  return {
    orbital: s.orbital,
    simTime: s.simTime,
    running: s.running
  };
}

function runModelChecks() {
  const checks = [];
  for (let oi = 0; oi < NUM_ORBITALS; oi++) {
    const pts = orbitals[oi];
    let valid = 0;
    let maxR = 0;
    for (let i = 0; i < NUM_POINTS; i++) {
      const x = pts[i*3], y = pts[i*3+1], z = pts[i*3+2];
      const r = Math.sqrt(x*x + y*y + z*z);
      if (Number.isFinite(r)) {
        valid++;
        if (r > maxR) maxR = r;
      }
    }
    checks.push({
      name: `orbital ${oi} point count`,
      pass: valid === NUM_POINTS,
      expected: NUM_POINTS,
      actual: valid,
      tolerance: 'exact'
    });
    checks.push({
      name: `orbital ${oi} finite max radius`,
      pass: Number.isFinite(maxR) && maxR > 0 && maxR < 100,
      expected: '0 < maxR < 100',
      actual: maxR,
      tolerance: 'range'
    });
  }
  const pts0 = orbitals[0];
  let sx=0, sy=0, sz=0;
  for (let i = 0; i < NUM_POINTS; i++) {
    sx += pts0[i*3]*pts0[i*3];
    sy += pts0[i*3+1]*pts0[i*3+1];
    sz += pts0[i*3+2]*pts0[i*3+2];
  }
  const meanVar = (sx+sy+sz)/3;
  const asym = Math.max(Math.abs(sx-meanVar), Math.abs(sy-meanVar), Math.abs(sz-meanVar)) / meanVar;
  checks.push({
    name: '1s spherical symmetry',
    pass: asym < 0.15,
    expected: 'axis variance within 15%',
    actual: `${asym.toFixed(3)} deviation`,
    tolerance: 0.15
  });
  const pts1 = orbitals[1];
  sx=0; sy=0; sz=0;
  for (let i = 0; i < NUM_POINTS; i++) {
    sx += pts1[i*3]*pts1[i*3];
    sy += pts1[i*3+1]*pts1[i*3+1];
    sz += pts1[i*3+2]*pts1[i*3+2];
  }
  checks.push({
    name: '2p z-axis dominance',
    pass: sz > sx * 2 && sz > sy * 2,
    expected: 'z variance > 2x x and y',
    actual: `z=${sz.toFixed(1)}, x=${sx.toFixed(1)}, y=${sy.toFixed(1)}`,
    tolerance: 'strict'
  });
  return checks;
}

// ── 暴露 API（供验证）────────────────────────────────
window.simulation = {
  init,
  start,
  pause,
  reset,
  update,
  render,
  setParameters,
  getState,
  getReadouts,
  runModelChecks
};

init();
})();
