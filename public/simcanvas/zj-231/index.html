<!doctype html>
<html lang="zh-CN">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动量守恒定律验证</title>
<style>
:root {
  color-scheme: light;
  --sim-bg: #eef3f8;
  --sim-surface: #ffffff;
  --sim-surface-soft: #f8fafc;
  --sim-text: #172033;
  --sim-muted: #657188;
  --sim-border: #dfe6ef;
  --sim-grid: #e8edf4;
  --sim-accent: #0f9fba;
  --sim-accent-deep: #08758a;
  --sim-accent-soft: #d9f4f7;
  --sim-positive: #0f9fba;
  --sim-warning: #f59e0b;
  --sim-danger: #dc2626;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
  --sim-cart1: #e85d3a;
  --sim-cart1-soft: #fde4dc;
  --sim-cart2: #2f7de0;
  --sim-cart2-soft: #d8e7fb;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--sim-text);
  background:
    radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
    radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
    var(--sim-bg);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input, select { font: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
.app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
.header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
.header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
.header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
.status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 12px; }
.panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
.scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.panel-head h2 { margin: 0; font-size: 1rem; }
.panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
#scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); }
.side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
.readouts, .model-note { padding: 17px; }
.readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.metric { padding: 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
.metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
.metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.metric.cart1-card { border-color: rgba(232,93,58,.25); background: linear-gradient(145deg, #fef5f1, #fdeee8); }
.metric.cart1-card strong { color: var(--sim-cart1); }
.metric.cart2-card { border-color: rgba(47,125,224,.25); background: linear-gradient(145deg, #f1f6fd, #e8f0fc); }
.metric.cart2-card strong { color: var(--sim-cart2); }
.metric.total-card { grid-column: span 2; border-color: rgba(15,159,186,.30); background: linear-gradient(145deg, #eef9fb, #e0f3f6); }
.metric.total-card strong { color: var(--sim-accent-deep); font-size: 1.7rem; }
.metric.total-card .delta { font-size: 0.78rem; color: var(--sim-muted); margin-left: 8px; }
.metric.total-card .delta.bad { color: var(--sim-danger); font-weight: 700; }
.model-note { display: grid; align-content: start; gap: 14px; }
.model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
.insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; }
.chart-panel { padding: 14px; display: grid; grid-template-rows: auto minmax(120px, 1fr); gap: 8px; overflow: hidden; }
.chart-panel h3 { margin: 0; font-size: 0.85rem; color: var(--sim-muted); }
#barChart { width: 100%; height: 100%; min-height: 120px; display: block; }
.controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(140px, 1fr) minmax(140px, 1fr) minmax(140px, 1fr) minmax(140px, 1fr) minmax(130px, 1fr); gap: 14px; align-items: center; border-radius: 17px; }
.actions { display: flex; gap: 8px; }
button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
button:hover { border-color: #c7d2e2; background: #eef3f9; }
button:active { transform: scale(.97); }
button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
.control label { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 5px; font-size: 0.78rem; font-weight: 700; }
.control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
select { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 8px 10px; background: var(--sim-surface-soft); color: var(--sim-text); cursor: pointer; font-weight: 600; }
.grid-line { stroke: var(--sim-grid); stroke-width: 1; }
.axis { stroke: #9aa7ba; stroke-width: 1.5; }
.axis-label { fill: var(--sim-muted); font-size: 12px; }
.legend-text { fill: var(--sim-muted); font-size: 11px; }
.phase-text { fill: var(--sim-muted); font-size: 13px; font-weight: 700; }
@media (max-width: 1100px) {
  .controls { grid-template-columns: auto 1fr 1fr; }
  .controls .control:nth-child(4), .controls .control:nth-child(5), .controls .control:nth-child(6) { grid-column: span 1; }
}
@media (max-width: 860px) {
  .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
  .main { grid-template-columns: 1fr; }
  .controls { grid-template-columns: 1fr; }
  .scene-panel { min-height: 0; }
  #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>动量守恒定律验证</h1>
      <p>调节质量与初速度，观察碰撞前后动量向量与总动量如何变化</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">就绪</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head"><h2 id="scene-title">无摩擦碰撞轨道</h2><span>一维对心碰撞 · 实时动量向量</span></div>
      <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
        <desc id="scene-desc">两辆小车在水平轨道上运动并碰撞，速度向量箭头显示方向与大小。</desc>
        <defs>
          <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L8,5 L0,10 z" fill="#e85d3a"></path></marker>
          <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L8,5 L0,10 z" fill="#2f7de0"></path></marker>
          <linearGradient id="trackGrad" x1="0" x2="0"><stop stop-color="#d8e0ea"></stop><stop offset="1" stop-color="#c4cfdd"></stop></linearGradient>
          <linearGradient id="cart1Grad" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#f47a55"></stop><stop offset="1" stop-color="#d44a25"></stop></linearGradient>
          <linearGradient id="cart2Grad" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#4a8de8"></stop><stop offset="1" stop-color="#1f6dc8"></stop></linearGradient>
        </defs>
        <g id="grid"></g>
        <rect x="40" y="300" width="680" height="6" fill="url(#trackGrad)" rx="2"></rect>
        <g id="trackMarks"></g>
        <line class="axis" x1="40" y1="306" x2="720" y2="306" opacity="0.3"></line>
        <text class="axis-label" x="50" y="325">0</text>
        <text class="axis-label" x="370" y="325" text-anchor="middle">位置 →</text>
        <text class="axis-label" x="710" y="325" text-anchor="end">10 m</text>
        <g id="cart1Group">
          <rect id="cart1Body" x="0" y="0" width="60" height="44" fill="url(#cart1Grad)" rx="6" stroke="#b83a18" stroke-width="1.5"></rect>
          <circle id="cart1WheelL" cx="14" cy="46" r="6" fill="#333"></circle>
          <circle id="cart1WheelR" cx="46" cy="46" r="6" fill="#333"></circle>
          <text id="cart1Label" x="30" y="26" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">m₁</text>
        </g>
        <g id="cart2Group">
          <rect id="cart2Body" x="0" y="0" width="60" height="44" fill="url(#cart2Grad)" rx="6" stroke="#15509e" stroke-width="1.5"></rect>
          <circle id="cart2WheelL" cx="14" cy="46" r="6" fill="#333"></circle>
          <circle id="cart2WheelR" cx="46" cy="46" r="6" fill="#333"></circle>
          <text id="cart2Label" x="30" y="26" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">m₂</text>
        </g>
        <line id="v1Arrow" x1="0" y1="0" x2="0" y2="0" stroke="#e85d3a" stroke-width="4" marker-end="url(#arrowRed)" opacity="0"></line>
        <line id="v2Arrow" x1="0" y1="0" x2="0" y2="0" stroke="#2f7de0" stroke-width="4" marker-end="url(#arrowBlue)" opacity="0"></line>
        <text id="v1Label" x="0" y="0" fill="#b83a18" font-size="12" font-weight="700" text-anchor="middle" opacity="0"></text>
        <text id="v2Label" x="0" y="0" fill="#15509e" font-size="12" font-weight="700" text-anchor="middle" opacity="0"></text>
        <text id="phaseText" class="phase-text" x="380" y="40" text-anchor="middle">碰撞前</text>
        <g id="collisionFlash" opacity="0">
          <circle id="flashRing1" cx="0" cy="0" r="0" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.8"></circle>
          <circle id="flashRing2" cx="0" cy="0" r="0" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.5"></circle>
        </g>
      </svg>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel readouts" aria-label="动量读数">
        <div class="readout-grid">
          <div class="metric cart1-card"><small>小车1动量 p₁ = m₁·v₁</small><strong id="p1Readout">0.00</strong></div>
          <div class="metric cart2-card"><small>小车2动量 p₂ = m₂·v₂</small><strong id="p2Readout">0.00</strong></div>
          <div class="metric total-card"><small>系统总动量 p总 = p₁ + p₂</small><strong id="pTotalReadout">0.00<span class="delta" id="pDelta"></span></strong></div>
        </div>
      </section>
      <section class="panel chart-panel" data-region="insight">
        <h3>碰撞前后动量对比</h3>
        <svg id="barChart" viewBox="0 0 300 160" role="img" aria-label="动量条形图">
          <line class="axis" x1="20" y1="130" x2="290" y2="130"></line>
          <text class="axis-label" x="15" y="135" text-anchor="end">0</text>
          <g id="bars"></g>
          <text class="legend-text" x="80" y="150" text-anchor="middle">碰撞前</text>
          <text class="legend-text" x="220" y="150" text-anchor="middle">碰撞后</text>
        </svg>
        <p id="insight" class="insight" style="margin-top:8px;">按"开始"观察碰撞。注意总动量在碰撞前后保持不变。</p>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="模拟控制">
    <div class="actions">
      <button id="startBtn" class="primary" type="button">开始</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control">
      <label for="m1Input">小车1质量 m₁ <output id="m1Output">2.0 kg</output></label>
      <input id="m1Input" type="range" min="0.5" max="6" step="0.5" value="2">
    </div>
    <div class="control">
      <label for="m2Input">小车2质量 m₂ <output id="m2Output">3.0 kg</output></label>
      <input id="m2Input" type="range" min="0.5" max="6" step="0.5" value="3">
    </div>
    <div class="control">
      <label for="v1Input">小车1初速 v₁ <output id="v1Output">+3.0 m/s</output></label>
      <input id="v1Input" type="range" min="0" max="6" step="0.5" value="3">
    </div>
    <div class="control">
      <label for="v2Input">小车2初速 v₂ <output id="v2Output">-2.0 m/s</output></label>
      <input id="v2Input" type="range" min="-6" max="0" step="0.5" value="-2">
    </div>
    <div class="control">
      <label for="typeSelect">碰撞类型</label>
      <select id="typeSelect">
        <option value="elastic">弹性碰撞 (e=1)</option>
        <option value="inelastic">非弹性碰撞 (e=0)</option>
        <option value="partial">部分弹性 (e=0.5)</option>
      </select>
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";
  const parameterSchema = [
    { key: "m1", label: "m₁", type: "slider", min: 0.5, max: 6, step: 0.5, default: 2, unit: "kg" },
    { key: "m2", label: "m₂", type: "slider", min: 0.5, max: 6, step: 0.5, default: 3, unit: "kg" },
    { key: "v1", label: "v₁", type: "slider", min: 0, max: 6, step: 0.5, default: 3, unit: "m/s" },
    { key: "v2", label: "v₂", type: "slider", min: -6, max: 0, step: 0.5, default: -2, unit: "m/s" }
  ];
  const state = {
    running: false, t: 0, lastTimestamp: null,
    m1: 2, m2: 3, v1: 3, v2: -2,
    x1: 1.5, x2: 8.5,
    cv1: 3, cv2: -2,
    phase: "before", collisionType: "elastic", e: 1.0,
    collided: false, flashT: 0,
    p1Before: 0, p2Before: 0, pTotalBefore: 0,
    p1After: 0, p2After: 0, pTotalAfter: 0,
    history: []
  };
  const SCENE = { x0: 40, x1: 720, yTrack: 300, cartW: 60, cartH: 44, scale: 68 };
  const elements = {
    status: document.querySelector("#status"),
    cart1Group: document.querySelector("#cart1Group"),
    cart2Group: document.querySelector("#cart2Group"),
    v1Arrow: document.querySelector("#v1Arrow"), v2Arrow: document.querySelector("#v2Arrow"),
    v1Label: document.querySelector("#v1Label"), v2Label: document.querySelector("#v2Label"),
    phaseText: document.querySelector("#phaseText"),
    flashGroup: document.querySelector("#collisionFlash"),
    flashRing1: document.querySelector("#flashRing1"), flashRing2: document.querySelector("#flashRing2"),
    p1Readout: document.querySelector("#p1Readout"), p2Readout: document.querySelector("#p2Readout"),
    pTotalReadout: document.querySelector("#pTotalReadout"), pDelta: document.querySelector("#pDelta"),
    bars: document.querySelector("#bars"),
    insight: document.querySelector("#insight"),
    m1Input: document.querySelector("#m1Input"), m1Output: document.querySelector("#m1Output"),
    m2Input: document.querySelector("#m2Input"), m2Output: document.querySelector("#m2Output"),
    v1Input: document.querySelector("#v1Input"), v1Output: document.querySelector("#v1Output"),
    v2Input: document.querySelector("#v2Input"), v2Output: document.querySelector("#v2Output"),
    typeSelect: document.querySelector("#typeSelect"),
    startBtn: document.querySelector("#startBtn"), pauseBtn: document.querySelector("#pauseBtn"), resetBtn: document.querySelector("#resetBtn")
  };

  function clamp(v, mn, mx) { return Math.min(mx, Math.max(mn, v)); }
  function finite(v, fb) { return Number.isFinite(v) ? v : fb; }

  function posToPx(x) { return SCENE.x0 + x * SCENE.scale; }

  function computeCollision(v1, v2, m1, m2, e) {
    const v1New = ((m1 - e * m2) * v1 + (1 + e) * m2 * v2) / (m1 + m2);
    const v2New = ((m2 - e * m1) * v2 + (1 + e) * m1 * v1) / (m1 + m2);
    return { v1New, v2New };
  }

  function initGrid() {
    const marks = [];
    for (let i = 0; i <= 10; i++) {
      const x = SCENE.x0 + i * SCENE.scale;
      marks.push(`<line class="grid-line" x1="${x}" y1="298" x2="${x}" y2="304"></line>`);
      if (i % 2 === 0) marks.push(`<text class="axis-label" x="${x}" y="320" text-anchor="middle">${i}</text>`);
    }
    document.querySelector("#trackMarks").innerHTML = marks.join("");
  }

  function init() {
    initGrid();
    bindControls();
    setParameters({ m1: 2, m2: 3, v1: 3, v2: -2 });
    elements.typeSelect.value = "elastic";
    state.collisionType = "elastic"; state.e = 1.0;
    elements.typeSelect.addEventListener("change", () => {
      const val = elements.typeSelect.value;
      state.collisionType = val;
      state.e = val === "elastic" ? 1.0 : val === "inelastic" ? 0.0 : 0.5;
      if (state.collided) { applyCollisionVelocities(); render(); }
    });
    reset();
    requestAnimationFrame(frame);
  }

  function start() {
    if (state.collided && (Math.abs(state.cv1) < 0.01 && Math.abs(state.cv2) < 0.01)) { reset(); }
    state.running = true;
    elements.status.textContent = "运行中";
    elements.startBtn.setAttribute("aria-pressed", "true");
  }
  function pause() {
    state.running = false;
    elements.status.textContent = "已暂停";
    elements.startBtn.setAttribute("aria-pressed", "false");
  }
  function reset() {
    pause();
    state.t = 0; state.lastTimestamp = null;
    state.x1 = 1.5; state.x2 = 8.5;
    state.cv1 = state.v1; state.cv2 = state.v2;
    state.phase = "before"; state.collided = false; state.flashT = 0;
    state.p1Before = state.m1 * state.v1;
    state.p2Before = state.m2 * state.v2;
    state.pTotalBefore = state.p1Before + state.p2Before;
    state.p1After = state.p1Before; state.p2After = state.p2Before; state.pTotalAfter = state.pTotalBefore;
    state.history = [];
    render();
  }

  function applyCollisionVelocities() {
    const { v1New, v2New } = computeCollision(state.cv1, state.cv2, state.m1, state.m2, state.e);
    state.cv1 = v1New; state.cv2 = v2New;
    state.p1After = state.m1 * state.cv1;
    state.p2After = state.m2 * state.cv2;
    state.pTotalAfter = state.p1After + state.p2After;
  }

  function update(dt) {
    if (!state.running) return;
    const bdt = clamp(finite(dt, 0), 0, 0.05);
    state.t += bdt;

    if (state.flashT > 0) {
      state.flashT = Math.max(0, state.flashT - bdt);
    }

    const halfW = (SCENE.cartW / 2) / SCENE.scale;
    const gap = state.x2 - state.x1 - 2 * halfW;

    if (!state.collided && gap <= 0 && state.cv1 > state.cv2) {
      state.collided = true;
      state.phase = "after";
      state.flashT = 0.5;
      applyCollisionVelocities();
    }

    state.x1 += state.cv1 * bdt;
    state.x2 += state.cv2 * bdt;

    const maxX = 10 - halfW;
    const minX = halfW;
    if (state.x1 < minX) { state.x1 = minX; state.cv1 = Math.abs(state.cv1) * 0.3; }
    if (state.x1 > maxX) { state.x1 = maxX; state.cv1 = -Math.abs(state.cv1) * 0.3; }
    if (state.x2 < minX) { state.x2 = minX; state.cv2 = Math.abs(state.cv2) * 0.3; }
    if (state.x2 > maxX) { state.x2 = maxX; state.cv2 = -Math.abs(state.cv2) * 0.3; }

    if (Math.abs(state.cv1) < 0.005 && Math.abs(state.cv2) < 0.005) {
      state.cv1 = 0; state.cv2 = 0;
      if (state.running) { pause(); elements.status.textContent = "已完成"; }
    }
  }

  function render() {
    const halfW = SCENE.cartW / 2;
    const cx1 = posToPx(state.x1);
    const cx2 = posToPx(state.x2);
    const yTop = SCENE.yTrack - SCENE.cartH;

    elements.cart1Group.setAttribute("transform", `translate(${cx1 - halfW}, ${yTop})`);
    elements.cart2Group.setAttribute("transform", `translate(${cx2 - halfW}, ${yTop})`);

    const arrowY = SCENE.yTrack - SCENE.cartH - 18;
    const v1 = state.cv1, v2 = state.cv2;
    const arrowLen = (v) => clamp(Math.abs(v) * 18, 0, 80) * Math.sign(v);

    if (Math.abs(v1) > 0.05) {
      const aLen = arrowLen(v1);
      elements.v1Arrow.setAttribute("x1", cx1); elements.v1Arrow.setAttribute("y1", arrowY);
      elements.v1Arrow.setAttribute("x2", cx1 + aLen); elements.v1Arrow.setAttribute("y2", arrowY);
      elements.v1Arrow.setAttribute("opacity", "0.9");
      elements.v1Label.setAttribute("x", cx1 + aLen / 2);
      elements.v1Label.setAttribute("y", arrowY - 6);
      elements.v1Label.textContent = `v₁=${v1.toFixed(1)}`;
      elements.v1Label.setAttribute("opacity", "1");
    } else {
      elements.v1Arrow.setAttribute("opacity", "0");
      elements.v1Label.setAttribute("opacity", "0");
    }

    if (Math.abs(v2) > 0.05) {
      const aLen = arrowLen(v2);
      elements.v2Arrow.setAttribute("x1", cx2); elements.v2Arrow.setAttribute("y1", arrowY);
      elements.v2Arrow.setAttribute("x2", cx2 + aLen); elements.v2Arrow.setAttribute("y2", arrowY);
      elements.v2Arrow.setAttribute("opacity", "0.9");
      elements.v2Label.setAttribute("x", cx2 + aLen / 2);
      elements.v2Label.setAttribute("y", arrowY - 6);
      elements.v2Label.textContent = `v₂=${v2.toFixed(1)}`;
      elements.v2Label.setAttribute("opacity", "1");
    } else {
      elements.v2Arrow.setAttribute("opacity", "0");
      elements.v2Label.setAttribute("opacity", "0");
    }

    elements.phaseText.textContent = state.collided ? "碰撞后" : "碰撞前";

    if (state.flashT > 0) {
      const flashX = (cx1 + halfW + cx2 - halfW) / 2;
      const flashY = SCENE.yTrack - SCENE.cartH / 2;
      const progress = 1 - state.flashT / 0.5;
      const r1 = 10 + progress * 40;
      const r2 = 5 + progress * 55;
      elements.flashRing1.setAttribute("cx", flashX); elements.flashRing1.setAttribute("cy", flashY);
      elements.flashRing1.setAttribute("r", r1);
      elements.flashRing2.setAttribute("cx", flashX); elements.flashRing2.setAttribute("cy", flashY);
      elements.flashRing2.setAttribute("r", r2);
      elements.flashGroup.setAttribute("opacity", String(state.flashT / 0.5));
    } else {
      elements.flashGroup.setAttribute("opacity", "0");
    }

    const p1 = state.m1 * state.cv1;
    const p2 = state.m2 * state.cv2;
    const pTotal = p1 + p2;
    elements.p1Readout.textContent = p1.toFixed(2);
    elements.p2Readout.textContent = p2.toFixed(2);
    elements.pTotalReadout.firstChild.textContent = pTotal.toFixed(2);
    const delta = pTotal - state.pTotalBefore;
    if (state.collided && Math.abs(delta) > 0.01) {
      elements.pDelta.textContent = `Δ=${delta > 0 ? "+" : ""}${delta.toFixed(2)}`;
      elements.pDelta.classList.add("bad");
    } else {
      elements.pDelta.textContent = state.collided ? " ✓守恒" : "";
      elements.pDelta.classList.remove("bad");
    }

    renderBars();

    if (!state.collided) {
      elements.insight.textContent = "碰撞前：两小车相向而行。总动量 p总 = p₁ + p₂ 已确定，碰撞不会改变它。";
    } else if (state.collisionType === "inelastic") {
      elements.insight.textContent = "完全非弹性碰撞：两车粘合后同速运动，动量仍守恒但动能损失最大。";
    } else if (state.collisionType === "elastic") {
      elements.insight.textContent = "弹性碰撞：动量与动能均守恒，两车速度由质量比重新分配。";
    } else {
      elements.insight.textContent = "部分弹性碰撞：动量守恒，但部分动能转化为热能，恢复系数 e=0.5。";
    }
  }

  function renderBars() {
    const maxAbs = Math.max(0.5, Math.abs(state.p1Before), Math.abs(state.p2Before), Math.abs(state.p1After), Math.abs(state.p2After), Math.abs(state.pTotalBefore));
    const scale = 100 / maxAbs;
    const zeroY = 130;
    const barW = 28;
    const x1Before = 30, x2Before = 65, x1After = 170, x2After = 205, xTotalBefore = 110, xTotalAfter = 250;

    const bar = (x, val, color, label) => {
      const h = Math.abs(val) * scale;
      const y = val >= 0 ? zeroY - h : zeroY;
      return `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="${color}" rx="2"></rect>
              <text class="legend-text" x="${x + barW/2}" y="${val >= 0 ? y - 4 : y + h + 12}" text-anchor="middle">${label}</text>`;
    };

    elements.bars.innerHTML =
      bar(x1Before, state.p1Before, "#e85d3a", `p₁`) +
      bar(x2Before, state.p2Before, "#2f7de0", `p₂`) +
      bar(xTotalBefore, state.pTotalBefore, "#08758a", `p总`) +
      bar(x1After, state.p1After, "#e85d3a", `p₁`) +
      bar(x2After, state.p2After, "#2f7de0", `p₂`) +
      bar(xTotalAfter, state.pTotalAfter, "#08758a", `p总`);
  }

  function setParameters(values) {
    const m1Def = parameterSchema[0], m2Def = parameterSchema[1], v1Def = parameterSchema[2], v2Def = parameterSchema[3];
    state.m1 = clamp(finite(Number(values.m1), m1Def.default), m1Def.min, m1Def.max);
    state.m2 = clamp(finite(Number(values.m2), m2Def.default), m2Def.min, m2Def.max);
    state.v1 = clamp(finite(Number(values.v1), v1Def.default), v1Def.min, v1Def.max);
    state.v2 = clamp(finite(Number(values.v2), v2Def.default), v2Def.min, v2Def.max);
    elements.m1Input.value = String(state.m1); elements.m2Input.value = String(state.m2);
    elements.v1Input.value = String(state.v1); elements.v2Input.value = String(state.v2);
    if (!state.running) reset(); else render();
  }

  function getState() {
    return { ...state, history: state.history.slice() };
  }
  function getReadouts() {
    return {
      p1: state.m1 * state.cv1, p2: state.m2 * state.cv2,
      pTotal: state.m1 * state.cv1 + state.m2 * state.cv2,
      pTotalBefore: state.pTotalBefore, pTotalAfter: state.pTotalAfter,
      v1: state.cv1, v2: state.cv2, x1: state.x1, x2: state.x2
    };
  }

  function runModelChecks() {
    const cases = [];
    const test = (m1, m2, v1, v2, e) => {
      const { v1New, v2New } = computeCollision(v1, v2, m1, m2, e);
      const pBefore = m1 * v1 + m2 * v2;
      const pAfter = m1 * v1New + m2 * v2New;
      return { v1New, v2New, pBefore, pAfter, dp: Math.abs(pAfter - pBefore) };
    };

    const elastic1 = test(2, 3, 3, -2, 1.0);
    cases.push({ name: "弹性碰撞动量守恒", pass: elastic1.dp < 1e-9, expected: "pAfter=pBefore", actual: `Δp=${elastic1.dp.toExponential(2)}`, tolerance: "1e-9" });

    const inelastic1 = test(2, 3, 3, -2, 0.0);
    cases.push({ name: "完全非弹性动量守恒", pass: inelastic1.dp < 1e-9, expected: "pAfter=pBefore", actual: `Δp=${inelastic1.dp.toExponential(2)}`, tolerance: "1e-9" });

    cases.push({ name: "完全非弹性同速", pass: Math.abs(inelastic1.v1New - inelastic1.v2New) < 1e-9, expected: "v1'=v2'", actual: `${inelastic1.v1New.toFixed(4)} vs ${inelastic1.v2New.toFixed(4)}`, tolerance: "1e-9" });

    const partial = test(1, 4, 5, -1, 0.5);
    cases.push({ name: "部分弹性动量守恒", pass: partial.dp < 1e-9, expected: "pAfter=pBefore", actual: `Δp=${partial.dp.toExponential(2)}`, tolerance: "1e-9" });

    const equalMass = test(2, 2, 4, -2, 1.0);
    cases.push({ name: "等质量弹性速度交换", pass: Math.abs(equalMass.v1New - (-2)) < 1e-9 && Math.abs(equalMass.v2New - 4) < 1e-9, expected: "v1'=-2, v2'=4", actual: `${equalMass.v1New.toFixed(4)}, ${equalMass.v2New.toFixed(4)}`, tolerance: "1e-9" });

    const heavy = test(10, 1, 2, 0, 1.0);
    cases.push({ name: "重碰轻弹性(轻车弹出)", pass: heavy.v2New > heavy.v1New && heavy.v1New > 0, expected: "v2'>v1'>0", actual: `${heavy.v1New.toFixed(3)}, ${heavy.v2New.toFixed(3)}`, tolerance: "qualitative" });

    const energyElastic = test(2, 3, 3, -2, 1.0);
    const keBefore = 0.5 * 2 * 9 + 0.5 * 3 * 4;
    const keAfter = 0.5 * 2 * energyElastic.v1New ** 2 + 0.5 * 3 * energyElastic.v2New ** 2;
    cases.push({ name: "弹性碰撞动能守恒", pass: Math.abs(keAfter - keBefore) < 1e-6, expected: keBefore.toFixed(4), actual: keAfter.toFixed(4), tolerance: "1e-6" });

    const keInelasticAfter = 0.5 * 2 * inelastic1.v1New ** 2 + 0.5 * 3 * inelastic1.v2New ** 2;
    const keInelasticBefore = 0.5 * 2 * 9 + 0.5 * 3 * 4;
    cases.push({ name: "非弹性动能损失", pass: keInelasticAfter < keInelasticBefore, expected: "KE_after < KE_before", actual: `${keInelasticAfter.toFixed(2)} < ${keInelasticBefore.toFixed(2)}`, tolerance: "strict" });

    return cases;
  }

  function bindControls() {
    elements.startBtn.addEventListener("click", start);
    elements.pauseBtn.addEventListener("click", pause);
    elements.resetBtn.addEventListener("click", reset);
    elements.m1Input.addEventListener("input", () => setParameters({ m1: elements.m1Input.value, m2: state.m2, v1: state.v1, v2: state.v2 }));
    elements.m2Input.addEventListener("input", () => setParameters({ m1: state.m1, m2: elements.m2Input.value, v1: state.v1, v2: state.v2 }));
    elements.v1Input.addEventListener("input", () => setParameters({ m1: state.m1, m2: state.m2, v1: elements.v1Input.value, v2: state.v2 }));
    elements.v2Input.addEventListener("input", () => setParameters({ m1: state.m1, m2: state.m2, v1: state.v1, v2: elements.v2Input.value }));
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt); render();
    requestAnimationFrame(frame);
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
