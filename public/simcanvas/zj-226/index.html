  <title>一维弹性碰撞 · 动量守恒验证</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #eef3f8;
      --sim-surface: #ffffff;
      --sim-surface-soft: #f8fafc;
      --sim-text: #172033;
      --sim-muted: #657188;
      --sim-border: #dfe6ef;
      --sim-grid: #e8edf4;
      --sim-accent: #0f9fba;
      --sim-accent-deep: #08758a;
      --sim-accent-soft: #d9f4f7;
      --sim-positive: #0f9fba;
      --sim-warning: #f59e0b;
      --sim-danger: #dc2626;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
        var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
    .status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 12px; }
    .panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
    #scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); }
    .side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
    .readouts, .model-note { padding: 17px; }
    .readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric { padding: 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
    .metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
    .metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .model-note { display: grid; align-content: start; gap: 14px; }
    .model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
    .insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; }
    .controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr) minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
    button:hover { border-color: #c7d2e2; background: #eef3f9; }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
    .control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
    .grid-line { stroke: var(--sim-grid); stroke-width: 1; }
    .axis { stroke: #9aa7ba; stroke-width: 1.5; }
    .ball-a { fill: var(--sim-accent); stroke: var(--sim-accent-deep); stroke-width: 2; }
    .ball-b { fill: var(--sim-warning); stroke: #a35d00; stroke-width: 2; }
    .ball-label { font-size: 13px; font-weight: 800; fill: #fff; text-anchor: middle; dominant-baseline: central; }
    .track-line { stroke: var(--sim-border); stroke-width: 2; }
    .v-arrow-a { stroke: var(--sim-accent-deep); stroke-width: 3; fill: none; marker-end: url(#arrowA); }
    .v-arrow-b { stroke: #a35d00; stroke-width: 3; fill: none; marker-end: url(#arrowB); }
    .axis-label { fill: var(--sim-muted); font-size: 12px; }
    .legend-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.78rem; color: var(--sim-muted); }
    .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
    @media (max-width: 860px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
      .scene-panel { min-height: 0; }
      #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

<body>
  <div class="app" data-layout="scene-first" data-model-tier="analytic">
    <header class="header" data-region="header">
      <div>
        <h1>一维弹性碰撞 · 动量守恒验证</h1>
        <p>调整两球质量与初速度，观察碰撞前后动量与动能是否同时守恒。</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head">
          <h2 id="scene-title">碰撞轨道</h2>
          <span>一维水平轨道 · 速度向量按比例显示</span>
        </div>
        <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
          <desc id="scene-desc">两个小球在一维轨道上运动并发生弹性碰撞，速度箭头随状态更新。</desc>
          <defs>
            <marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#08758a"></path></marker>
            <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#a35d00"></path></marker>
          </defs>
          <g id="grid"></g>
          <line class="track-line" x1="40" y1="280" x2="720" y2="280"></line>
          <line class="axis" x1="40" y1="360" x2="720" y2="360"></line>
          <text class="axis-label" x="700" y="389">位置 x</text>
          <g id="ballLayer"></g>
          <g id="arrowLayer"></g>
        </svg>
      </section>

      <aside class="side" data-region="evidence">
        <section class="panel readouts" aria-label="实时数值">
          <div class="readout-grid">
            <div class="metric"><small>球A速度 v₁</small><strong id="v1Readout">0.00</strong></div>
            <div class="metric"><small>球B速度 v₂</small><strong id="v2Readout">0.00</strong></div>
            <div class="metric"><small>总动量 p</small><strong id="pReadout">0.00</strong></div>
            <div class="metric"><small>总动能 E</small><strong id="eReadout">0.00</strong></div>
          </div>
        </section>
        <section class="panel model-note" data-region="insight">
          <div class="panel-head"><h2>守恒判读</h2></div>
          <p id="insight" class="insight">按"开始"启动。碰撞瞬间总动量与总动能应保持不变。</p>
          <p>模型：一维弹性碰撞，动量守恒 m₁v₁+m₂v₂=const，动能守恒 ½m₁v₁²+½m₂v₂²=const。碰撞后速度由解析公式给出。</p>
          <div class="legend-row">
            <span><span class="legend-dot" style="background:var(--sim-accent)"></span>球A (m₁)</span>
            <span><span class="legend-dot" style="background:var(--sim-warning)"></span>球B (m₂)</span>
          </div>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="模拟控制">
      <div class="actions">
        <button id="startBtn" class="primary" type="button">开始</button>
        <button id="pauseBtn" type="button">暂停</button>
        <button id="resetBtn" type="button">重置</button>
      </div>
      <div class="control">
        <label for="m1Input">球A质量 m₁ <output id="m1Output">1.0 kg</output></label>
        <input id="m1Input" type="range" min="0.5" max="5" step="0.5" value="1">
      </div>
      <div class="control">
        <label for="m2Input">球B质量 m₂ <output id="m2Output">1.0 kg</output></label>
        <input id="m2Input" type="range" min="0.5" max="5" step="0.5" value="1">
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";
    const parameterSchema = [
      { key: "m1", label: "球A质量", type: "slider", min: 0.5, max: 5, step: 0.5, default: 1, unit: "kg" },
      { key: "m2", label: "球B质量", type: "slider", min: 0.5, max: 5, step: 0.5, default: 1, unit: "kg" }
    ];
    const state = {
      running: false,
      t: 0,
      x1: 120,
      x2: 580,
      v1: 2.0,
      v2: -1.5,
      m1: 1,
      m2: 1,
      collided: false,
      lastTimestamp: null,
      history: []
    };
    const elements = {
      status: document.querySelector("#status"),
      ballLayer: document.querySelector("#ballLayer"),
      arrowLayer: document.querySelector("#arrowLayer"),
      grid: document.querySelector("#grid"),
      insight: document.querySelector("#insight"),
      v1Readout: document.querySelector("#v1Readout"),
      v2Readout: document.querySelector("#v2Readout"),
      pReadout: document.querySelector("#pReadout"),
      eReadout: document.querySelector("#eReadout"),
      m1Input: document.querySelector("#m1Input"),
      m1Output: document.querySelector("#m1Output"),
      m2Input: document.querySelector("#m2Input"),
      m2Output: document.querySelector("#m2Output"),
      startBtn: document.querySelector("#startBtn"),
      pauseBtn: document.querySelector("#pauseBtn"),
      resetBtn: document.querySelector("#resetBtn")
    };

    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

    function initGrid() {
      const lines = [];
      for (let i = 0; i <= 10; i += 1) {
        const x = 40 + i * 68;
        lines.push(`<line class="grid-line" x1="${x}" y1="40" x2="${x}" y2="360"></line>`);
      }
      for (let j = 0; j <= 4; j += 1) {
        const y = 40 + j * 80;
        lines.push(`<line class="grid-line" x1="40" y1="${y}" x2="720" y2="${y}"></line>`);
      }
      elements.grid.innerHTML = lines.join("");
    }

    function radiusForMass(m) { return 14 + Math.sqrt(m) * 6; }

    function resolveCollision(s) {
      const m1 = s.m1, m2 = s.m2, u1 = s.v1, u2 = s.v2;
      const v1New = ((m1 - m2) * u1 + 2 * m2 * u2) / (m1 + m2);
      const v2New = ((m2 - m1) * u2 + 2 * m1 * u1) / (m1 + m2);
      s.v1 = v1New;
      s.v2 = v2New;
      s.collided = true;
    }

    function init() {
      initGrid();
      bindControls();
      setParameters({ m1: 1, m2: 1 });
      reset();
      requestAnimationFrame(frame);
    }

    function start() {
      state.running = true;
      elements.status.textContent = "运行中";
      elements.startBtn.setAttribute("aria-pressed", "true");
    }

    function pause() {
      state.running = false;
      elements.status.textContent = "已暂停";
      elements.startBtn.setAttribute("aria-pressed", "false");
    }

    function reset() {
      pause();
      state.t = 0;
      state.x1 = 120;
      state.x2 = 580;
      state.v1 = 2.0;
      state.v2 = -1.5;
      state.collided = false;
      state.lastTimestamp = null;
      state.history = [{ t: 0, p: totalMomentum(state), e: totalEnergy(state) }];
      render();
    }

    function totalMomentum(s) { return s.m1 * s.v1 + s.m2 * s.v2; }
    function totalEnergy(s) { return 0.5 * s.m1 * s.v1 * s.v1 + 0.5 * s.m2 * s.v2 * s.v2; }

    function update(dt) {
      if (!state.running) return;
      const boundedDt = clamp(finite(dt, 0), 0, 0.05);
      state.x1 += state.v1 * boundedDt * 30;
      state.x2 += state.v2 * boundedDt * 30;
      state.t += boundedDt;
      const r1 = radiusForMass(state.m1);
      const r2 = radiusForMass(state.m2);
      if (!state.collided && state.x1 + r1 >= state.x2 - r2 && state.v1 > state.v2) {
        resolveCollision(state);
        const overlap = (state.x1 + r1) - (state.x2 - r2);
        state.x1 -= overlap / 2;
        state.x2 += overlap / 2;
      }
      if (state.x1 < 40 + r1) { state.x1 = 40 + r1; state.v1 = Math.abs(state.v1); state.collided = true; }
      if (state.x2 > 720 - r2) { state.x2 = 720 - r2; state.v2 = -Math.abs(state.v2); state.collided = true; }
      if (state.history.length === 0 || state.t - state.history[state.history.length - 1].t >= 0.05) {
        state.history.push({ t: state.t, p: totalMomentum(state), e: totalEnergy(state) });
        if (state.history.length > 400) state.history.shift();
      }
    }

    function render() {
      const r1 = radiusForMass(state.m1);
      const r2 = radiusForMass(state.m2);
      const yBall = 280;
      elements.ballLayer.innerHTML =
        `<circle class="ball-a" cx="${state.x1}" cy="${yBall}" r="${r1}"></circle>` +
        `<text class="ball-label" x="${state.x1}" y="${yBall}">A</text>` +
        `<circle class="ball-b" cx="${state.x2}" cy="${yBall}" r="${r2}"></circle>` +
        `<text class="ball-label" x="${state.x2}" y="${yBall}">B</text>`;
      const arrowScale = 18;
      const a1End = state.x1 + state.v1 * arrowScale + (state.v1 >= 0 ? r1 + 6 : -(r1 + 6));
      const a2End = state.x2 + state.v2 * arrowScale + (state.v2 >= 0 ? r2 + 6 : -(r2 + 6));
      let arrows = "";
      if (Math.abs(state.v1) > 0.01) {
        arrows += `<line class="v-arrow-a" x1="${state.x1 + (state.v1 >= 0 ? r1 + 4 : -(r1 + 4))}" y1="${yBall - 32}" x2="${a1End}" y2="${yBall - 32}"></line>`;
      }
      if (Math.abs(state.v2) > 0.01) {
        arrows += `<line class="v-arrow-b" x1="${state.x2 + (state.v2 >= 0 ? r2 + 4 : -(r2 + 4))}" y1="${yBall - 32}" x2="${a2End}" y2="${yBall - 32}"></line>`;
      }
      elements.arrowLayer.innerHTML = arrows;
      const p = totalMomentum(state);
      const e = totalEnergy(state);
      elements.v1Readout.textContent = state.v1.toFixed(2);
      elements.v2Readout.textContent = state.v2.toFixed(2);
      elements.pReadout.textContent = p.toFixed(2);
      elements.eReadout.textContent = e.toFixed(2);
      elements.m1Output.textContent = `${state.m1.toFixed(1)} kg`;
      elements.m2Output.textContent = `${state.m2.toFixed(1)} kg`;
      let msg;
      if (!state.running && state.t === 0) {
        msg = "按\"开始\"启动。碰撞瞬间总动量与总动能应保持不变。";
      } else if (state.collided) {
        msg = "碰撞已发生：动量与动能均守恒，速度按质量重新分配。";
      } else {
        msg = "两球接近中：碰撞前总动量与总动能恒定，等待接触瞬间。";
      }
      elements.insight.textContent = msg;
    }

    function setParameters(values) {
      const m1Def = parameterSchema[0], m2Def = parameterSchema[1];
      state.m1 = clamp(finite(Number(values.m1), m1Def.default), m1Def.min, m1Def.max);
      state.m2 = clamp(finite(Number(values.m2), m2Def.default), m2Def.min, m2Def.max);
      elements.m1Input.value = String(state.m1);
      elements.m2Input.value = String(state.m2);
      render();
    }

    function getState() {
      return {
        running: state.running,
        t: state.t,
        x1: state.x1,
        x2: state.x2,
        v1: state.v1,
        v2: state.v2,
        m1: state.m1,
        m2: state.m2,
        collided: state.collided,
        history: state.history.map((s) => ({ ...s }))
      };
    }

    function getReadouts() {
      return {
        v1: state.v1,
        v2: state.v2,
        momentum: totalMomentum(state),
        energy: totalEnergy(state),
        m1: state.m1,
        m2: state.m2,
        time: state.t
      };
    }

    function runModelChecks() {
      const collide = (m1, m2, u1, u2) => {
        const v1 = ((m1 - m2) * u1 + 2 * m2 * u2) / (m1 + m2);
        const v2 = ((m2 - m1) * u2 + 2 * m1 * u1) / (m1 + m2);
        return { v1, v2 };
      };
      const c1 = collide(1, 1, 2, -1);
      const c2 = collide(2, 1, 3, 0);
      const c3 = collide(1, 3, 4, -2);
      const c4 = collide(5, 1, 0, 3);
      const pBefore1 = 1 * 2 + 1 * (-1);
      const pAfter1 = 1 * c1.v1 + 1 * c1.v2;
      const eBefore1 = 0.5 * 1 * 4 + 0.5 * 1 * 1;
      const eAfter1 = 0.5 * 1 * c1.v1 * c1.v1 + 0.5 * 1 * c1.v2 * c1.v2;
      const pBefore2 = 2 * 3 + 1 * 0;
      const pAfter2 = 2 * c2.v1 + 1 * c2.v2;
      const eBefore2 = 0.5 * 2 * 9;
      const eAfter2 = 0.5 * 2 * c2.v1 * c2.v1 + 0.5 * 1 * c2.v2 * c2.v2;
      const pBefore3 = 1 * 4 + 3 * (-2);
      const pAfter3 = 1 * c3.v1 + 3 * c3.v2;
      const eBefore3 = 0.5 * 1 * 16 + 0.5 * 3 * 4;
      const eAfter3 = 0.5 * 1 * c3.v1 * c3.v1 + 0.5 * 3 * c3.v2 * c3.v2;
      const pBefore4 = 5 * 0 + 1 * 3;
      const pAfter4 = 5 * c4.v1 + 1 * c4.v2;
      const eBefore4 = 0.5 * 1 * 9;
      const eAfter4 = 0.5 * 5 * c4.v1 * c4.v1 + 0.5 * 1 * c4.v2 * c4.v2;
      return [
        { name: "等质量交换速度", pass: Math.abs(c1.v1 - (-1)) < 1e-9 && Math.abs(c1.v2 - 2) < 1e-9, expected: "v1=-1, v2=2", actual: `v1=${c1.v1}, v2=${c1.v2}`, tolerance: 1e-9 },
        { name: "动量守恒(等质量)", pass: Math.abs(pBefore1 - pAfter1) < 1e-9, expected: pBefore1, actual: pAfter1, tolerance: 1e-9 },
        { name: "动能守恒(等质量)", pass: Math.abs(eBefore1 - eAfter1) < 1e-9, expected: eBefore1, actual: eAfter1, tolerance: 1e-9 },
        { name: "动量守恒(m1=2,m2=1)", pass: Math.abs(pBefore2 - pAfter2) < 1e-9, expected: pBefore2, actual: pAfter2, tolerance: 1e-9 },
        { name: "动能守恒(m1=2,m2=1)", pass: Math.abs(eBefore2 - eAfter2) < 1e-9, expected: eBefore2, actual: eAfter2, tolerance: 1e-9 },
        { name: "动量守恒(m1=1,m2=3)", pass: Math.abs(pBefore3 - pAfter3) < 1e-9, expected: pBefore3, actual: pAfter3, tolerance: 1e-9 },
        { name: "动能守恒(m1=1,m2=3)", pass: Math.abs(eBefore3 - eAfter3) < 1e-9, expected: eBefore3, actual: eAfter3, tolerance: 1e-9 },
        { name: "动量守恒(静止重球被击)", pass: Math.abs(pBefore4 - pAfter4) < 1e-9, expected: pBefore4, actual: pAfter4, tolerance: 1e-9 },
        { name: "动能守恒(静止重球被击)", pass: Math.abs(eBefore4 - eAfter4) < 1e-9, expected: eBefore4, actual: eAfter4, tolerance: 1e-9 }
      ];
    }

    function bindControls() {
      elements.startBtn.addEventListener("click", start);
      elements.pauseBtn.addEventListener("click", pause);
      elements.resetBtn.addEventListener("click", reset);
      elements.m1Input.addEventListener("input", () => setParameters({ m1: elements.m1Input.value, m2: state.m2 }));
      elements.m2Input.addEventListener("input", () => setParameters({ m1: state.m1, m2: elements.m2Input.value }));
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    window.simulation = {
      init: init,
      start: start,
      pause: pause,
      reset: reset,
      update: update,
      render: render,
      setParameters: setParameters,
      getState: getState,
      getReadouts: getReadouts,
      runModelChecks: runModelChecks
    };

    init();
  })();
  </script>
</body>
</html>
