<style>

<body>
<div class="app" data-layout="visualization-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>最小作用量原理 · 自然界如何选择路径</h1>
      <div class="subtitle">光走时间最短的路径 · 膜取面积最小的形态 · 同一原理</div>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">运行中</div>
  </header>

  <main class="main">
    <section class="stage-wrap" data-region="stage" aria-label="光的折射演示">
      <span class="stage-label">上半屏 · 光的折射</span>
      <span class="stage-hint">点击路径揭晓耗时</span>
      <canvas id="canvasTop" role="img" aria-label="三条候选路径的折射演示"></canvas>
    </section>

    <section class="stage-wrap" data-region="evidence" aria-label="肥皂膜最小面积类比">
      <span class="stage-label">下半屏 · 肥皂膜类比</span>
      <canvas id="canvasBot" role="img" aria-label="肥皂膜收缩到最小面积的动画"></canvas>
    </section>
  </main>

  <section class="insight-bar" data-region="insight" aria-label="教学洞察">
    <p><span class="insight-label">洞察</span><span id="insightText">光与肥皂膜遵循同一原理：自然界在所有可能路径中，选择使作用量取极值的路径——光的最短时间，膜的最小面积。</span></p>
  </section>

  <section class="controls" data-region="controls" aria-label="参数控制">
    <div class="control">
      <label class="control-label" for="ratioInput">
        <span>介质2 / 介质1 光速比  v2 / v1</span>
        <span class="control-value" id="ratioVal">1.50</span>
      </label>
      <input id="ratioInput" type="range" min="1.05" max="3.0" step="0.05" value="1.5" aria-label="光速比 v2/v1">
    </div>
    <div class="control">
      <label class="control-label" for="bposInput">
        <span>B 点水平位置</span>
        <span class="control-value" id="bposVal">0.70</span>
      </label>
      <input id="bposInput" type="range" min="0.25" max="0.92" step="0.01" value="0.70" aria-label="B点水平位置">
    </div>
    <button id="startBtn" class="btn primary" type="button" aria-pressed="true">开始</button>
    <button id="resetBtn" class="btn" type="button">重置动画</button>
  </section>
</div>

<script>
(() => {
  "use strict";

  // ===== 状态 =====
  const state = {
    ratio: 1.5,       // v2 / v1
    bPos: 0.70,       // B 点水平位置（0..1）
    running: true,
    time: 0,
    lastTs: null,
    selectedPath: -1,
    cycleT: 0,
    cycleLen: 7.5,
    paths: null,
    soap: null,
    topCanvas: null,
    botCanvas: null,
    topCtx: null,
    botCtx: null,
    dpr: 1,
  };

  const parameterSchema = [
    { key: "ratio", label: "光速比 v2/v1", type: "slider", min: 1.05, max: 3.0, step: 0.05, default: 1.5, unit: "" },
    { key: "bPos", label: "B点位置", type: "slider", min: 0.25, max: 0.92, step: 0.01, default: 0.70, unit: "" }
  ];

  // ===== 工具 =====
  function clamp(v, mn, mx) { return Math.min(mx, Math.max(mn, v)); }
  function finite(v, fb) { return Number.isFinite(v) ? v : fb; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeInOut(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; }

  // ===== 几何与物理 =====
  function computePaths(ratio, bPos) {
    // 画布坐标系：x ∈ [0,1], y ∈ [0,1]，y=0.5 为介质分界
    const A = { x: 0.10, y: 0.16 };
    const B = { x: 0.10 + bPos * 0.80, y: 0.84 };
    const I = { x: A.x + (B.x - A.x) * 0.5, y: 0.5 };

    // 真实折射：Snell n1 sin θ1 = n2 sin θ2，n ∝ 1/v
    // sin θ1 = (xP - A.x) / |A-P|，sin θ2 = (B.x - xP) / |P-B|
    // (xP - A.x)/sqrt((xP-A.x)^2 + h1^2) = (1/ratio) * (B.x - xP)/sqrt((B.x-xP)^2 + h2^2)
    const h1 = I.y - A.y;
    const h2 = B.y - I.y;
    let xP = I.x;
    for (let iter = 0; iter < 80; iter++) {
      const dx1 = xP - A.x;
      const dx2 = B.x - xP;
      if (dx1 <= 1e-6 || dx2 <= 1e-6) break;
      const r1 = Math.sqrt(dx1*dx1 + h1*h1);
      const r2 = Math.sqrt(dx2*dx2 + h2*h2);
      const sin1 = dx1 / r1;
      const sin2 = dx2 / r2;
      const f = sin1 - sin2 / ratio;
      const df = (h1*h1) / Math.pow(r1, 3) + (h2*h2 / ratio) / Math.pow(r2, 3);
      if (Math.abs(df) < 1e-12) break;
      const step = f / df;
      xP -= step;
      if (Math.abs(step) < 1e-9) break;
    }
    xP = clamp(xP, A.x + 0.001, B.x - 0.001);
    const P_real = { x: xP, y: I.y };

    // 三条路径
    const paths = [
      {
        id: 0, name: "直线", color: "#7a8aa8",
        P: I, A: A, B: B,
        isReal: false,
      },
      {
        id: 1, name: "真实折射", color: "#5fd4e8",
        P: P_real, A: A, B: B,
        isReal: true,
      },
      {
        id: 2, name: "极端弯折", color: "#9a7ad8",
        P: { x: A.x + (B.x - A.x) * 0.88, y: I.y }, A: A, B: B,
        isReal: false,
      }
    ];

    // 计算每条路径的长度与时间
    for (const p of paths) {
      const d1 = Math.hypot(p.P.x - A.x, p.P.y - A.y);
      const d2 = Math.hypot(B.x - p.P.x, B.y - p.P.y);
      p.d1 = d1; p.d2 = d2;
      p.totalLen = d1 + d2;
      // v1 = 1, v2 = ratio
      p.time = d1 / 1.0 + d2 / ratio;
      // 角度（从法线，法线为竖直方向）
      p.theta1 = Math.atan2(p.P.x - A.x, A.y - I.y + (I.y - A.y)); // 简化
      p.theta1 = Math.atan2(p.P.x - A.x, I.y - A.y);
      p.theta2 = Math.atan2(B.x - p.P.x, B.y - I.y);
    }

    // 排名（按时间升序）
    const sorted = [...paths].sort((a, b) => a.time - b.time);
    paths.forEach(p => {
      p.rank = sorted.indexOf(p) + 1;
    });

    return { paths, A, B, I, P_real };
  }

  // ===== 肥皂膜状态 =====
  function initSoap() {
    const N = 48;
    const pts = [];
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2;
      const r = 0.32 + 0.10 * Math.sin(a * 3 + 1.2) + 0.06 * Math.cos(a * 5 + 0.4);
      pts.push({
        x: 0.5 + r * Math.cos(a),
        y: 0.5 + r * Math.sin(a) * 0.85,
        vx: 0, vy: 0
      });
    }
    return { pts, area: 0, perim: 0, t: 0 };
  }

  function stepSoap(soap, dt) {
    const pts = soap.pts;
    const N = pts.length;
    // 平均曲率流：dX/dt = κ * n，离散形式
    const k = 0.55; // 收缩速率
    const newPts = [];
    for (let i = 0; i < N; i++) {
      const prev = pts[(i - 1 + N) % N];
      const cur = pts[i];
      const next = pts[(i + 1) % N];
      // 离散拉普拉斯
      const lx = (prev.x + next.x) / 2 - cur.x;
      const ly = (prev.y + next.y) / 2 - cur.y;
      // 朝向质心拉力 + 平滑
      const cx = 0.5, cy = 0.5;
      const tox = cx - cur.x;
      const toy = cy - cur.y;
      const dist = Math.hypot(tox, toy) + 1e-6;
      // 速度 = 曲率主项 + 向心约束
      const vx = k * lx + 0.02 * tox;
      const vy = k * ly + 0.02 * toy;
      newPts.push({
        x: cur.x + vx * dt,
        y: cur.y + vy * dt,
        vx, vy
      });
    }
    // 防止过小：当平均半径小于阈值时重置
    let avgR = 0;
    for (const p of newPts) avgR += Math.hypot(p.x - 0.5, p.y - 0.5);
    avgR /= N;
    if (avgR < 0.06) {
      // 重置为初始扰动膜
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2;
        const r = 0.32 + 0.10 * Math.sin(a * 3 + 1.2) + 0.06 * Math.cos(a * 5 + 0.4);
        newPts[i].x = 0.5 + r * Math.cos(a);
        newPts[i].y = 0.5 + r * Math.sin(a) * 0.85;
        newPts[i].vx = 0; newPts[i].vy = 0;
      }
    }
    soap.pts = newPts;
    // 计算面积（鞋带公式）
    let area = 0;
    for (let i = 0; i < N; i++) {
      const j = (i + 1) % N;
      area += newPts[i].x * newPts[j].y;
      area -= newPts[j].x * newPts[i].y;
    }
    soap.area = Math.abs(area / 2);
    // 周长
    let perim = 0;
    for (let i = 0; i < N; i++) {
      const j = (i + 1) % N;
      perim += Math.hypot(newPts[j].x - newPts[i].x, newPts[j].y - newPts[i].y);
    }
    soap.perim = perim;
    soap.t += dt;
  }

  // ===== 渲染：上半屏 =====
  function renderTop(ctx, W, H, paths, A, B, I, P_real, cycleT, selectedPath) {
    ctx.clearRect(0, 0, W, H);

    // 介质背景
    const g1 = ctx.createLinearGradient(0, 0, 0, H * 0.5);
    g1.addColorStop(0, "rgba(20, 30, 55, 0.55)");
    g1.addColorStop(1, "rgba(30, 45, 75, 0.35)");
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, W, H * 0.5);

    const g2 = ctx.createLinearGradient(0, H * 0.5, 0, H);
    g2.addColorStop(0, "rgba(50, 70, 50, 0.30)");
    g2.addColorStop(1, "rgba(30, 50, 35, 0.50)");
    ctx.fillStyle = g2;
    ctx.fillRect(0, H * 0.5, W, H * 0.5);

    // 分界线
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, H * 0.5);
    ctx.lineTo(W, H * 0.5);
    ctx.stroke();

    // 介质标签
    ctx.fillStyle = "rgba(170, 190, 220, 0.55)";
    ctx.font = "600 11px ui-sans-serif, system-ui, sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText("介质 1 · 慢  v1", 14, 12);
    ctx.fillStyle = "rgba(150, 200, 160, 0.55)";
    ctx.fillText("介质 2 · 快  v2 = " + state.ratio.toFixed(2) + " v1", 14, H * 0.5 + 12);

    // 法线虚线（在真实拐点处）
    const Px = P_real.x * W;
    ctx.strokeStyle = "rgba(255,255,255,0.10)";
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 5]);
    ctx.beginPath();
    ctx.moveTo(Px, H * 0.28);
    ctx.lineTo(Px, H * 0.72);
    ctx.stroke();
    ctx.setLineDash([]);

    // 三条路径
    const drawPath = (p, alpha) => {
      const ax = p.A.x * W, ay = p.A.y * H;
      const px = p.P.x * W, py = p.P.y * H;
      const bx = p.B.x * W, by = p.B.y * H;

      // 双层描边模拟发光
      ctx.strokeStyle = p.color;
      ctx.globalAlpha = alpha * 0.25;
      ctx.lineWidth = 7;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(px, py);
      ctx.lineTo(bx, by);
      ctx.stroke();

      ctx.globalAlpha = alpha;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(px, py);
      ctx.lineTo(bx, by);
      ctx.stroke();
      ctx.globalAlpha = 1;
    };

    // 先画非选中
    paths.forEach((p, i) => {
      if (i === selectedPath) return;
      const a = 0.55;
      drawPath(p, a);
    });
    // 选中路径最后画（最亮）
    if (selectedPath >= 0 && paths[selectedPath]) {
      drawPath(paths[selectedPath], 1.0);
    }

    // 光点动画沿真实路径移动
    const animT = (cycleT % 1.0);
    const realPath = paths[1];
    const seg1Len = realPath.d1;
    const seg2Len = realPath.d2;
    const totalLen = seg1Len + seg2Len;
    const tCut = seg1Len / totalLen;
    let lx, ly;
    if (animT < tCut) {
      const tt = animT / tCut;
      lx = lerp(realPath.A.x, realPath.P.x, tt);
      ly = lerp(realPath.A.y, realPath.P.y, tt);
    } else {
      const tt = (animT - tCut) / (1 - tCut);
      lx = lerp(realPath.P.x, realPath.B.x, tt);
      ly = lerp(realPath.P.y, realPath.B.y, tt);
    }
    const lxPx = lx * W, lyPx = ly * H;
    // 光点双层
    ctx.fillStyle = "rgba(95, 212, 232, 0.18)";
    ctx.beginPath();
    ctx.arc(lxPx, lyPx, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#5fd4e8";
    ctx.beginPath();
    ctx.arc(lxPx, lyPx, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(lxPx, lyPx, 1.8, 0, Math.PI * 2);
    ctx.fill();

    // A、B 点
    const drawEndpoint = (x, y, label) => {
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.beginPath();
      ctx.arc(x, y, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#e8eefc";
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(232, 238, 252, 0.85)";
      ctx.font = "700 13px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, x, y - 16);
    };
    drawEndpoint(A.x * W, A.y * H, "A");
    drawEndpoint(B.x * W, B.y * H, "B");

    // 拐点 P（真实）
    const PxR = P_real.x * W, PyR = P_real.y * H;
    ctx.fillStyle = "rgba(95, 212, 232, 0.25)";
    ctx.beginPath();
    ctx.arc(PxR, PyR, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#5fd4e8";
    ctx.beginPath();
    ctx.arc(PxR, PyR, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(95, 212, 232, 0.85)";
    ctx.font = "600 11px ui-sans-serif, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("P", PxR, PyR - 14);

    // 角度弧（真实路径）
    const drawAngleArc = (cx, cy, startAng, endAng, color, label) => {
      const r = 26;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(cx, cy, r, startAng, endAng);
      ctx.stroke();
      if (label) {
        const midAng = (startAng + endAng) / 2;
        const lx2 = cx + Math.cos(midAng) * (r + 14);
        const ly2 = cy + Math.sin(midAng) * (r + 14);
        ctx.fillStyle = color;
        ctx.font = "600 11px ui-sans-serif, system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, lx2, ly2);
      }
    };
    // θ1：在 P 处，从法线（向上，-π/2）到 PA 方向
    const angPA = Math.atan2(A.y - P_real.y, A.x - P_real.x); // 向左上
    drawAngleArc(PxR, PyR, -Math.PI/2, angPA, "rgba(95, 212, 232, 0.7)", "θ1");
    // θ2：从法线（向下，π/2）到 PB 方向
    const angPB = Math.atan2(B.y - P_real.y, B.x - P_real.x);
    drawAngleArc(PxR, PyR, Math.PI/2, angPB, "rgba(95, 212, 232, 0.7)", "θ2");

    // Snell 公式（左下角）
    ctx.fillStyle = "rgba(232, 238, 252, 0.75)";
    ctx.font = "600 12px ui-sans-serif, system-ui, sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "bottom";
    const sin1 = Math.sin(realPath.theta1);
    const sin2 = Math.sin(realPath.theta2);
    ctx.fillText("n1 sin(θ1) = n2 sin(θ2)", 14, H - 14);
    ctx.fillStyle = "rgba(170, 190, 220, 0.55)";
    ctx.font = "400 11px ui-sans-serif, system-ui, sans-serif";
    ctx.fillText("sin(θ1)=" + sin1.toFixed(3) + "  sin(θ2)=" + sin2.toFixed(3) + "  比值=" + (sin1/sin2).toFixed(3), 14, H - 30);

    // 耗时条形图（底部嵌入）
    const barH = 38;
    const barY = H - barH - 50;
    const barPad = 24;
    const barW = (W - barPad * 4) / 3;
    const maxTime = Math.max(...paths.map(p => p.time));

    paths.forEach((p, i) => {
      const bx = barPad + i * (barW + barPad);
      // 背景
      ctx.fillStyle = "rgba(255,255,255,0.04)";
      ctx.fillRect(bx, barY, barW, barH);
      // 填充
      const fillW = (p.time / maxTime) * (barW - 4);
      const isSelected = (i === selectedPath);
      ctx.fillStyle = isSelected ? p.color : "rgba(120, 140, 170, 0.45)";
      ctx.fillRect(bx + 2, barY + 2, fillW, barH - 4);
      // 标签
      ctx.fillStyle = isSelected ? "#e8eefc" : "rgba(170, 190, 220, 0.7)";
      ctx.font = "600 11px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText(p.name, bx + 6, barY + 5);
      // 时间值
      ctx.font = "700 12px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(p.time.toFixed(3), bx + barW - 6, barY + 5);
      // 排名（如果选中）
      if (isSelected) {
        ctx.fillStyle = p.rank === 1 ? "#5fd4e8" : "rgba(232, 238, 252, 0.6)";
        ctx.font = "700 10px ui-sans-serif, system-ui, sans-serif";
        ctx.textAlign = "right";
        ctx.textBaseline = "bottom";
        ctx.fillText("第 " + p.rank + " 名 · 最短", bx + barW - 6, barY + barH - 4);
      }
    });

    // 提示文字
    if (selectedPath < 0) {
      ctx.fillStyle = "rgba(170, 190, 220, 0.4)";
      ctx.font = "400 10px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      ctx.fillText("点击任意路径揭晓耗时排名", W / 2, H - 8);
    }
  }

  // ===== 渲染：下半屏（肥皂膜）=====
  function renderBot(ctx, W, H, soap) {
    ctx.clearRect(0, 0, W, H);

    // 背景
    const g = ctx.createRadialGradient(W*0.5, H*0.5, 10, W*0.5, H*0.5, Math.max(W, H)*0.7);
    g.addColorStop(0, "rgba(20, 30, 50, 0.4)");
    g.addColorStop(1, "rgba(5, 8, 16, 0.6)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 等周圆参考（虚线）
    const cx = W * 0.5, cy = H * 0.5;
    const refR = Math.min(W, H) * 0.20;
    ctx.strokeStyle = "rgba(95, 212, 232, 0.10)";
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 6]);
    ctx.beginPath();
    ctx.arc(cx, cy, refR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // 膜边界
    const pts = soap.pts;
    const N = pts.length;
    const toPx = (p) => ({ x: p.x * W, y: p.y * H });

    // 双层描边模拟发光
    ctx.strokeStyle = "rgba(95, 212, 232, 0.18)";
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const p = toPx(pts[i % N]);
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();

    ctx.strokeStyle = "#5fd4e8";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const p = toPx(pts[i % N]);
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();

    // 膜内部填充（淡）
    ctx.fillStyle = "rgba(95, 212, 232, 0.04)";
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const p = toPx(pts[i]);
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.fill();

    // 收缩方向箭头（几个采样点）
    const arrowCount = 8;
    for (let i = 0; i < arrowCount; i++) {
      const idx = Math.floor(i * N / arrowCount);
      const p = pts[idx];
      const next = pts[(idx + 1) % N];
      const prev = pts[(idx - 1 + N) % N];
      const tx = (next.x - prev.x);
      const ty = (next.y - prev.y);
      const tlen = Math.hypot(tx, ty) + 1e-6;
      // 内法线
      const nx = -ty / tlen;
      const ny = tx / tlen;
      // 朝向质心
      const tox = 0.5 - p.x;
      const toy = 0.5 - p.y;
      const dot = nx * tox + ny * toy;
      const sgn = dot > 0 ? 1 : -1;
      const px = p.x * W, py = p.y * H;
      const ex = px + sgn * nx * 14;
      const ey = py + sgn * ny * 14;
      ctx.strokeStyle = "rgba(95, 212, 232, 0.35)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(ex, ey);
      ctx.stroke();
      // 箭头
      const ang = Math.atan2(ey - py, ex - px);
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(ex - 4 * Math.cos(ang - 0.4), ey - 4 * Math.sin(ang - 0.4));
      ctx.moveTo(ex, ey);
      ctx.lineTo(ex - 4 * Math.cos(ang + 0.4), ey - 4 * Math.sin(ang + 0.4));
      ctx.stroke();
    }

    // 面积与周长读数
    ctx.fillStyle = "rgba(232, 238, 252, 0.75)";
    ctx.font = "600 12px ui-sans-serif, system-ui, sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText("面积 = " + soap.area.toFixed(4), 14, 12);
    ctx.fillStyle = "rgba(170, 190, 220, 0.55)";
    ctx.font = "400 11px ui-sans-serif, system-ui, sans-serif";
    ctx.fillText("周长 = " + soap.perim.toFixed(4), 14, 30);

    // 等周不等式提示
    const iso = soap.perim * soap.perim / (4 * Math.PI * soap.area);
    ctx.fillStyle = "rgba(170, 190, 220, 0.55)";
    ctx.font = "400 11px ui-sans-serif, system-ui, sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "top";
    ctx.fillText("L² / (4πA) = " + iso.toFixed(3) + "  → 1 为圆", W - 14, 12);

    // 底部说明
    ctx.fillStyle = "rgba(170, 190, 220, 0.45)";
    ctx.font = "400 11px ui-sans-serif, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.fillText("肥皂膜自动收缩到最小面积 · 与光走最短时间同源于最小作用量原理", W / 2, H - 10);
  }

  // ===== 生命周期钩子 =====
  function start() {
    state.running = true;
    const el = document.getElementById("status");
    if (el) el.textContent = "运行中";
    const btn = document.getElementById("startBtn");
    if (btn) { btn.textContent = "暂停"; btn.setAttribute("aria-pressed", "true"); }
  }
  function pause() {
    state.running = false;
    const el = document.getElementById("status");
    if (el) el.textContent = "已暂停";
    const btn = document.getElementById("startBtn");
    if (btn) { btn.textContent = "继续"; btn.setAttribute("aria-pressed", "false"); }
  }
  function reset() {
    state.cycleT = 0;
    state.selectedPath = -1;
    state.soap = initSoap();
    render();
  }
  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05);
    state.time += boundedDt;
    state.cycleT = (state.cycleT + boundedDt) % state.cycleLen;
    stepSoap(state.soap, boundedDt);
  }
  function render() {
    const top = state.topCanvas;
    const bot = state.botCanvas;
    if (top && state.topCtx) {
      const W = top.width / state.dpr;
      const H = top.height / state.dpr;
      const r = computePaths(state.ratio, state.bPos);
      state.paths = r.paths;
      renderTop(state.topCtx, W, H, r.paths, r.A, r.B, r.I, r.P_real, state.cycleT, state.selectedPath);
    }
    if (bot && state.botCtx) {
      const W = bot.width / state.dpr;
      const H = bot.height / state.dpr;
      renderBot(state.botCtx, W, H, state.soap);
    }
  }

  // ===== 主循环 =====
  function frame(ts) {
    if (state.lastTs === null) state.lastTs = ts;
    let dt = (ts - state.lastTs) / 1000;
    state.lastTs = ts;
    dt = clamp(finite(dt, 0), 0, 0.05);

    update(dt);
    render();

    requestAnimationFrame(frame);
  }

  // ===== 交互 =====
  function handleCanvasClick(e) {
    const rect = state.topCanvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    if (!state.paths) return;
    // 找最近的路径（点到折线距离）
    let bestIdx = -1;
    let bestDist = Infinity;
    state.paths.forEach((p, i) => {
      const d = pointToPolylineDist(x, y, [p.A, p.P, p.B]);
      if (d < bestDist) {
        bestDist = d;
        bestIdx = i;
      }
    });
    if (bestDist < 0.08) {
      state.selectedPath = (state.selectedPath === bestIdx) ? -1 : bestIdx;
    } else {
      state.selectedPath = -1;
    }
  }

  function pointToPolylineDist(px, py, pts) {
    let minD = Infinity;
    for (let i = 0; i < pts.length - 1; i++) {
      const d = pointToSegmentDist(px, py, pts[i], pts[i+1]);
      if (d < minD) minD = d;
    }
    return minD;
  }
  function pointToSegmentDist(px, py, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx*dx + dy*dy;
    if (len2 < 1e-12) return Math.hypot(px - a.x, py - a.y);
    let t = ((px - a.x) * dx + (py - a.y) * dy) / len2;
    t = clamp(t, 0, 1);
    const cx = a.x + t * dx, cy = a.y + t * dy;
    return Math.hypot(px - cx, py - cy);
  }

  // ===== 初始化 =====
  function setupCanvas(canvas) {
    const dpr = window.devicePixelRatio || 1;
    state.dpr = dpr;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
  }

  function resizeCanvases() {
    state.topCanvas = document.getElementById("canvasTop");
    state.botCanvas = document.getElementById("canvasBot");
    state.topCtx = setupCanvas(state.topCanvas);
    state.botCtx = setupCanvas(state.botCanvas);
  }

  function bindControls() {
    const ratioInput = document.getElementById("ratioInput");
    const bposInput = document.getElementById("bposInput");
    const ratioVal = document.getElementById("ratioVal");
    const bposVal = document.getElementById("bposVal");
    const resetBtn = document.getElementById("resetBtn");
    const startBtn = document.getElementById("startBtn");

    ratioInput.addEventListener("input", () => {
      const v = clamp(finite(Number(ratioInput.value), 1.5), 1.05, 3.0);
      state.ratio = v;
      ratioVal.textContent = v.toFixed(2);
    });
    bposInput.addEventListener("input", () => {
      const v = clamp(finite(Number(bposInput.value), 0.70), 0.25, 0.92);
      state.bPos = v;
      bposVal.textContent = v.toFixed(2);
    });
    resetBtn.addEventListener("click", () => {
      reset();
    });
    startBtn.addEventListener("click", () => {
      if (state.running) {
        pause();
      } else {
        start();
      }
    });
    state.topCanvas.addEventListener("click", handleCanvasClick);
    window.addEventListener("resize", () => {
      resizeCanvases();
    });
  }

  function init() {
    state.soap = initSoap();
    resizeCanvases();
    bindControls();
    requestAnimationFrame(frame);
  }

  function setParameters(values) {
    if (values.ratio !== undefined) state.ratio = clamp(finite(Number(values.ratio), 1.5), 1.05, 3.0);
    if (values.bPos !== undefined) state.bPos = clamp(finite(Number(values.bPos), 0.70), 0.25, 0.92);
  }
  function getState() {
    return { ratio: state.ratio, bPos: state.bPos, time: state.time, selectedPath: state.selectedPath };
  }
  function getReadouts() {
    const r = computePaths(state.ratio, state.bPos);
    return {
      ratio: state.ratio,
      bPos: state.bPos,
      realPathTime: r.paths[1].time,
      straightTime: r.paths[0].time,
      extremeTime: r.paths[2].time,
      soapArea: state.soap.area,
      soapPerim: state.soap.perim
    };
  }
  function runModelChecks() {
    // Snell 定律验证
    const r = computePaths(1.5, 0.70);
    const p = r.paths[1];
    const sin1 = Math.sin(p.theta1);
    const sin2 = Math.sin(p.theta2);
    const n1 = 1.0, n2 = 1.0 / 1.5;
    const snellErr = Math.abs(n1 * sin1 - n2 * sin2);

    // 真实路径时间应最短
    const times = r.paths.map(pp => pp.time);
    const realIsMin = Math.min(...times) === r.paths[1].time;

    // 不同 ratio 下 Snell 仍成立
    const r2 = computePaths(2.0, 0.50);
    const p2 = r2.paths[1];
    const sin1b = Math.sin(p2.theta1);
    const sin2b = Math.sin(p2.theta2);
    const snellErr2 = Math.abs(sin1 - sin2 / 1.5);
    const snellErrB = Math.abs(sin1b - sin2b / 2.0);

    // 极端弯折路径时间应大于真实
    const extremeSlower = r.paths[2].time > r.paths[1].time;
    // 直线路径时间应大于真实
    const straightSlower = r.paths[0].time > r.paths[1].time;

    // 肥皂膜面积应单调减小（在收缩阶段）
    const s0 = initSoap();
    let area0 = 0;
    {
      const N = s0.pts.length;
      let a = 0;
      for (let i = 0; i < N; i++) {
        const j = (i + 1) % N;
        a += s0.pts[i].x * s0.pts[j].y - s0.pts[j].x * s0.pts[i].y;
      }
      area0 = Math.abs(a / 2);
    }
    stepSoap(s0, 0.5);
    let area1 = 0;
    {
      const N = s0.pts.length;
      let a = 0;
      for (let i = 0; i < N; i++) {
        const j = (i + 1) % N;
        a += s0.pts[i].x * s0.pts[j].y - s0.pts[j].x * s0.pts[i].y;
      }
      area1 = Math.abs(a / 2);
    }
    const areaDecreasing = area1 < area0;

    return [
      { name: "Snell 定律 n1 sin θ1 = n2 sin θ2 (ratio=1.5)", pass: snellErr < 1e-6, expected: "n1 sin θ1 ≈ n2 sin θ2", actual: "误差 " + snellErr.toExponential(3), tolerance: 1e-6 },
      { name: "Snell 定律 (ratio=2.0)", pass: snellErrB < 1e-6, expected: "sin θ1 = sin θ2 / 2", actual: "误差 " + snellErrB.toExponential(3), tolerance: 1e-6 },
      { name: "真实折射路径时间最短", pass: realIsMin, expected: "realPath.time = min", actual: "real=" + r.paths[1].time.toFixed(4) + " straight=" + r.paths[0].time.toFixed(4) + " extreme=" + r.paths[2].time.toFixed(4), tolerance: "strict" },
      { name: "直线路径慢于真实", pass: straightSlower, expected: "straight > real", actual: r.paths[0].time + " > " + r.paths[1].time, tolerance: "strict" },
      { name: "极端弯折路径慢于真实", pass: extremeSlower, expected: "extreme > real", actual: r.paths[2].time + " > " + r.paths[1].time, tolerance: "strict" },
      { name: "肥皂膜面积单调减小", pass: areaDecreasing, expected: "area1 < area0", actual: area0.toFixed(4) + " → " + area1.toFixed(4), tolerance: "strict" }
    ];
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
