<title>时空光锥 · 光永不消失</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #050810;
  --sim-surface: #0a0f1c;
  --sim-surface-soft: #0d1320;
  --sim-text: #e8f4ff;
  --sim-muted: #6b7d99;
  --sim-border: #1a2438;
  --sim-grid: #0f1828;
  --sim-accent: #4dd0e1;
  --sim-accent-deep: #00838f;
  --sim-accent-soft: #003c4a;
  --sim-positive: #4dd0e1;
  --sim-warning: #ffb74d;
  --sim-danger: #ef5350;
  --sim-radius-sm: 8px;
  --sim-radius-md: 12px;
  --sim-radius-lg: 16px;
  --sim-shadow: 0 0 0 transparent;
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: var(--sim-bg);
  color: var(--sim-text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow: hidden;
  font-variant-numeric: tabular-nums;
}
button:focus-visible, input:focus-visible {
  outline: 2px solid rgba(77, 208, 225, 0.5);
  outline-offset: 2px;
}
.app {
  width: 100vw; height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 0;
}
.header {
  padding: 14px 28px 10px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 24px;
}
.header h1 {
  font-size: 1.15rem;

}

}

  font-size: 0.72rem;

}

  font-size: 0.7rem;
  color: var(--sim-accent);
  letter-spacing: 0.1em;

}
.main {
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 280px;
  gap: 0;
}
.stage-wrap {
  position: relative;
  min-height: 0;
  overflow: hidden;
}
#scene {
  display: block;
  width: 100%;
  height: 100%;
}
.legend {
  position: absolute;
  top: 16px; left: 20px;

}

  width: 18px; height: 2px; border-radius: 1px;
}

  width: 8px; height: 8px; border-radius: 50%;
}

  position: absolute;

}

  min-height: 0;

}

}

}
.insight .note {

}

  display: flex;
  gap: 8px;
}
button {
  border: 1px solid var(--sim-border);

  cursor: pointer;

  letter-spacing: 0.05em;
  transition: transform 0.15s, background 0.15s, border-color 0.15s;
}
button:hover { border-color: var(--sim-accent); background: var(--sim-surface); }
button:active { transform: scale(0.97); }
button.primary {
  border-color: var(--sim-accent-deep);
  color: #001a20;

}
button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25); }
.control-group {
  display: flex;
  flex-direction: column;
  gap: 6px;

}
.control-label {
  display: flex;

}
input[type="range"] {

}
input[type="range"]::-webkit-slider-thumb {

}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px;

}
@media (max-width: 860px) {

}
@media (max-width: 720px) {

  .header h1 { font-size: 0.95rem; }

  .control-group { min-width: 140px; flex: 1; }
  .legend { font-size: 0.6rem; top: 8px; left: 12px; }
  .formula { font-size: 0.62rem; bottom: 8px; right: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>

<body>
<div class="app" data-layout="visualization-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>时空光锥 · <b>光永不消失</b></h1>
      <div class="subtitle">横轴空间 x · 纵轴时间 t · 光以球面波 forever 向宇宙传播</div>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">运行中</div>
  </header>

  <main class="main">
    <div class="stage-wrap" data-region="stage">
      <canvas id="scene" role="img" aria-label="时空光锥图：横轴为空间，纵轴为时间，光锥以45度角向未来传播"></canvas>
      <div class="legend">
        <div class="row"><div class="dot" style="background:#4dd0e1"></div>事件点</div>
        <div class="row"><div class="swatch" style="background:#4dd0e1"></div>光锥（45度 = 光速）</div>
        <div class="row"><div class="dot" style="background:rgba(255,183,77,0.85)"></div>目标星</div>
      </div>
      <div class="formula">r = c × t &nbsp;·&nbsp; <b>c = 1 光年/年</b></div>
    </div>

    <aside class="side">
      <section class="evidence" data-region="evidence" aria-label="实时读数">
        <h2>实时读数</h2>
        <div class="readout-grid">
          <div class="metric">
            <small>光已传播</small>
            <strong><b id="propagated">30</b> 光年</strong>
          </div>
          <div class="metric">
            <small>还需</small>
            <strong><em id="remaining">20</em> 年</strong>
          </div>
          <div class="metric">
            <small>事件时刻</small>
            <strong id="eventTimeReadout">-30 年</strong>
          </div>
          <div class="metric">
            <small>目标星距离</small>
            <strong id="distReadout">50 光年</strong>
          </div>
        </div>
      </section>

      <section class="insight" data-region="insight" aria-label="模型说明">
        <h2>模型说明</h2>
        <div class="note" id="insightNote">光以恒定速度 c 传播，事件发生越早，光球波前越大。</div>
        <p>在时空图中，光锥边界是 45° 直线（x = ±c·t）。过去事件的光至今仍在宇宙中传播，永不消失。</p>
      </section>
    </aside>
  </main>

  <section class="controls" data-region="controls" aria-label="模拟控制">
    <div class="actions">
      <button id="startBtn" class="primary" type="button" aria-pressed="true">开始</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control-group">
      <label class="control-label" for="eventTimeInput"><span>事件发生时刻</span><span class="val" id="eventTimeVal">-30 年</span></label>
      <input id="eventTimeInput" type="range" min="-80" max="-1" step="1" value="-30" aria-label="事件发生时刻（年）">
    </div>
    <div class="control-group">
      <label class="control-label" for="distInput"><span>目标星距离</span><span class="val" id="distVal">50 光年</span></label>
      <input id="distInput" type="range" min="5" max="120" step="1" value="50" aria-label="目标星距离（光年）">
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const C = 1; // 光速，自然单位：光年/年
  const PAST_EVENTS = [
    { t: -70, label: "70年前" },
    { t: -50, label: "50年前" },
    { t: -30, label: "30年前" },
    { t: -12, label: "12年前" }
  ];

  const state = {
    running: true,
    simTime: 0,        // 模拟时钟（年），用于脉冲动画
    eventTime: -30,    // 当前事件发生时刻（年，负数=过去）
    targetDist: 50,    // 目标星距离（光年）
    lastTs: null,
    canvas: null,
    ctx: null,
    W: 0, H: 0, dpr: 1
  };

  const els = {
    canvas: document.getElementById("scene"),
    status: document.getElementById("status"),
    eventTimeInput: document.getElementById("eventTimeInput"),
    eventTimeVal: document.getElementById("eventTimeVal"),
    distInput: document.getElementById("distInput"),
    distVal: document.getElementById("distVal"),
    propagated: document.getElementById("propagated"),
    remaining: document.getElementById("remaining"),
    eventTimeReadout: document.getElementById("eventTimeReadout"),
    distReadout: document.getElementById("distReadout"),
    insightNote: document.getElementById("insightNote"),
    startBtn: document.getElementById("startBtn"),
    pauseBtn: document.getElementById("pauseBtn"),
    resetBtn: document.getElementById("resetBtn")
  };

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function finite(v, fb) { return Number.isFinite(v) ? v : fb; }

  function resize() {
    const rect = els.canvas.parentElement.getBoundingClientRect();
    state.dpr = Math.min(window.devicePixelRatio || 1, 2);
    state.W = Math.max(320, rect.width);
    state.H = Math.max(240, rect.height);
    els.canvas.width = Math.round(state.W * state.dpr);
    els.canvas.height = Math.round(state.H * state.dpr);
    els.canvas.style.width = state.W + "px";
    els.canvas.style.height = state.H + "px";
    state.ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
  }

  // 时空坐标 -> 屏幕坐标
  function worldToScreen(x, t, layout) {
    const sx = layout.padLeft + ((x - layout.xMin) / (layout.xMax - layout.xMin)) * layout.plotW;
    const sy = layout.padTop + ((layout.tMax - t) / (layout.tMax - layout.tMin)) * layout.plotH;
    return [sx, sy];
  }

  function computeLayout() {
    const pad = 40;
    const plotW = state.W - pad * 2;
    const plotH = state.H - pad * 2;
    const scale = Math.min(plotW, plotH) / 100;
    const halfRange = Math.min(plotW, plotH) / (2 * scale);
    return {
      padLeft: pad + (plotW - halfRange * 2 * scale) / 2,
      padTop: pad + (plotH - halfRange * 2 * scale) / 2,
      plotW: halfRange * 2 * scale,
      plotH: halfRange * 2 * scale,
      xMin: -halfRange, xMax: halfRange,
      tMin: -halfRange, tMax: halfRange,
      scale: scale,
      cx: state.W / 2,
      cy: state.H / 2
    };
  }

  function glowLine(ctx, points, color, width) {
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = color.outer;
    ctx.lineWidth = width + 3;
    ctx.globalAlpha = 0.18;
    ctx.beginPath();
    points.forEach((p, i) => i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]));
    ctx.stroke();
    ctx.strokeStyle = color.mid;
    ctx.lineWidth = width + 1;
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    points.forEach((p, i) => i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]));
    ctx.stroke();
    ctx.strokeStyle = color.inner;
    ctx.lineWidth = width;
    ctx.globalAlpha = 1;
    ctx.beginPath();
    points.forEach((p, i) => i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]));
    ctx.stroke();
    ctx.restore();
  }

  function glowCircle(ctx, cx, cy, r, color, fill) {
    ctx.save();
    ctx.strokeStyle = color.outer;
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.12;
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(0.5, r), 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = color.mid;
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(0.5, r), 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    if (fill) {
      ctx.fillStyle = color.inner;
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(0.5, r), 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.strokeStyle = color.inner;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(0.5, r), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  const COLOR_CYAN = { outer: "#4dd0e1", mid: "#4dd0e1", inner: "#4dd0e1" };
  const COLOR_CYAN_DIM = { outer: "#1a5a66", mid: "#2a7a8a", inner: "#3a9aa8" };
  const COLOR_WARM = { outer: "#ffb74d", mid: "#ffb74d", inner: "#ffd180" };
  const COLOR_WHITE = { outer: "#ffffff", mid: "#ffffff", inner: "#ffffff" };

  function drawGrid(ctx, L) {
    ctx.save();
    ctx.strokeStyle = "rgba(77, 208, 225, 0.04)";
    ctx.lineWidth = 1;
    const step = L.scale * 10;
    for (let x = L.cx % step; x < state.W; x += step) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, state.H);
      ctx.stroke();
    }
    for (let y = L.cy % step; y < state.H; y += step) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(state.W, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawAxes(ctx, L) {
    ctx.save();
    const [, y0] = worldToScreen(0, 0, L);
    ctx.strokeStyle = "rgba(107, 125, 153, 0.25)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, y0);
    ctx.lineTo(state.W, y0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(L.cx, 0);
    ctx.lineTo(L.cx, state.H);
    ctx.stroke();
    ctx.fillStyle = "rgba(107, 125, 153, 0.6)";
    ctx.font = "10px ui-sans-serif, system-ui";
    ctx.textAlign = "right";
    ctx.fillText("空间 x →", state.W - 8, y0 - 6);
    ctx.textAlign = "left";
    ctx.fillText("↑ 时间 t", L.cx + 6, 14);
    ctx.fillText("未来", L.cx + 6, 26);
    ctx.fillText("过去", L.cx + 6, state.H - 8);
    ctx.restore();
  }

  function drawLightCone(ctx, L, eventT, isPrimary, simTime) {
    const [ex, ey] = worldToScreen(0, eventT, L);
    const color = isPrimary ? COLOR_CYAN : COLOR_CYAN_DIM;
    const alpha = isPrimary ? 1 : 0.5;

    ctx.save();
    ctx.globalAlpha = alpha;

    const tTop = L.tMax;
    const xRightAtTop = tTop - eventT;
    const xLeftAtTop = -(tTop - eventT);

    const [rx1, ry1] = worldToScreen(0, eventT, L);
    const [rx2, ry2] = worldToScreen(xRightAtTop, tTop, L);
    glowLine(ctx, [[rx1, ry1], [rx2, ry2]], color, isPrimary ? 1.5 : 1);

    const [lx2, ly2] = worldToScreen(xLeftAtTop, tTop, L);
    glowLine(ctx, [[rx1, ry1], [lx2, ly2]], color, isPrimary ? 1.5 : 1);

    if (isPrimary) {
      ctx.fillStyle = "rgba(77, 208, 225, 0.03)";
      ctx.beginPath();
      ctx.moveTo(rx1, ry1);
      ctx.lineTo(rx2, ry2);
      ctx.lineTo(lx2, ly2);
      ctx.closePath();
      ctx.fill();
    }

    const rNow = C * (0 - eventT);
    if (rNow > 0 && rNow < L.xMax * 1.2) {
      const [bx1, by1] = worldToScreen(-rNow, 0, L);
      const [bx2, by2] = worldToScreen(rNow, 0, L);

      if (isPrimary) {
        ctx.strokeStyle = "rgba(77, 208, 225, 0.4)";
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(bx1, by1);
        ctx.lineTo(bx2, by2);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    if (isPrimary && rNow > 0) {
      const cycleDuration = -eventT;
      const pulsePhase = (simTime % (cycleDuration * 0.5)) / (cycleDuration * 0.5);
      const tPulse = eventT + pulsePhase * (-eventT);
      const rPulse = C * (tPulse - eventT);

      if (rPulse > 0 && tPulse <= 0) {
        const [px, py] = worldToScreen(rPulse, tPulse, L);
        glowCircle(ctx, px, py, 3, COLOR_WHITE, true);
        const [px2, py2] = worldToScreen(-rPulse, tPulse, L);
        glowCircle(ctx, px2, py2, 3, COLOR_WHITE, true);
      }
    }

    const eventColor = isPrimary ? COLOR_CYAN : COLOR_CYAN_DIM;
    glowCircle(ctx, ex, ey, isPrimary ? 4 : 2.5, eventColor, true);

    if (isPrimary) {
      ctx.fillStyle = "#4dd0e1";
      ctx.font = "11px ui-sans-serif, system-ui";
      ctx.textAlign = "left";
      ctx.fillText(`事件 · ${eventT}年`, ex + 8, ey - 6);
    }

    ctx.restore();
  }

  function drawTargetStar(ctx, L, dist, eventT, simTime) {
    const [sx, sy] = worldToScreen(dist, 0, L);
    const rNow = C * (0 - eventT);
    const arrived = rNow >= dist;

    ctx.save();
    const pulse = 0.5 + 0.5 * Math.sin(simTime * 0.8);
    const starColor = arrived ? COLOR_CYAN : COLOR_WARM;

    glowCircle(ctx, sx, sy, 3 + pulse * 1.5, starColor, true);

    ctx.fillStyle = arrived ? "#4dd0e1" : "#ffb74d";
    ctx.font = "11px ui-sans-serif, system-ui";
    ctx.textAlign = "left";
    ctx.fillText(`目标星 · ${dist}光年`, sx + 10, sy - 8);

    if (arrived) {
      ctx.fillStyle = "rgba(77, 208, 225, 0.7)";
      ctx.font = "10px ui-sans-serif, system-ui";
      ctx.fillText("光已到达", sx + 10, sy + 16);
    }

    ctx.restore();
  }

  function drawObserver(ctx, L) {
    const [ox, oy] = worldToScreen(0, 0, L);
    ctx.save();
    glowCircle(ctx, ox, oy, 3.5, COLOR_WHITE, true);
    ctx.fillStyle = "#e8f4ff";
    ctx.font = "bold 11px ui-sans-serif, system-ui";
    ctx.textAlign = "right";
    ctx.fillText("你 · 此刻", ox - 10, oy + 4);
    ctx.restore();
  }

  function drawWavefronts(ctx, L, simTime) {
    ctx.save();
    PAST_EVENTS.forEach((ev, i) => {
      const r = C * (0 - ev.t);
      if (r > 0 && r < L.xMax * 1.5) {
        const [wx, wy] = worldToScreen(r, 0, L);
        const [wx2, wy2] = worldToScreen(-r, 0, L);

        const phase = (simTime * 0.3 + i * 0.5) % 1;
        const alpha = 0.15 + 0.25 * (1 - phase);

        ctx.strokeStyle = `rgba(77, 208, 225, ${alpha})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(wx2, wy2);
        ctx.lineTo(wx, wy);
        ctx.stroke();

        ctx.fillStyle = `rgba(77, 208, 225, ${alpha * 1.5})`;
        ctx.beginPath();
        ctx.arc(wx, wy, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(wx2, wy2, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    });
    ctx.restore();
  }

  function render() {
    const ctx = state.ctx;
    const L = computeLayout();

    ctx.fillStyle = "#050810";
    ctx.fillRect(0, 0, state.W, state.H);

    const grad = ctx.createRadialGradient(L.cx, L.cy, 0, L.cx, L.cy, Math.max(state.W, state.H) * 0.7);
    grad.addColorStop(0, "rgba(15, 25, 45, 0.4)");
    grad.addColorStop(1, "rgba(5, 8, 16, 0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, state.W, state.H);

    drawGrid(ctx, L);
    drawAxes(ctx, L);

    PAST_EVENTS.forEach(ev => {
      if (ev.t !== state.eventTime) {
        drawLightCone(ctx, L, ev.t, false, state.simTime);
      }
    });

    drawWavefronts(ctx, L, state.simTime);
    drawLightCone(ctx, L, state.eventTime, true, state.simTime);
    drawTargetStar(ctx, L, state.targetDist, state.eventTime, state.simTime);
    drawObserver(ctx, L);

    const rNow = C * (0 - state.eventTime);
    const remaining = state.targetDist - rNow;
    els.propagated.textContent = rNow.toFixed(0);
    els.remaining.textContent = remaining > 0 ? remaining.toFixed(0) : "0";
    els.eventTimeReadout.textContent = `${state.eventTime} 年`;
    els.distReadout.textContent = `${state.targetDist} 光年`;

    if (remaining > 0) {
      els.insightNote.textContent = `光已传播 ${rNow.toFixed(0)} 光年，还需 ${remaining.toFixed(0)} 年到达目标星。`;
    } else {
      els.insightNote.textContent = `光已到达目标星。事件发生越早，光球波前越大。`;
    }
  }

  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05);
    state.simTime += boundedDt;
  }

  function frame(ts) {
    if (state.lastTs === null) state.lastTs = ts;
    const dt = (ts - state.lastTs) / 1000;
    state.lastTs = ts;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  function start() {
    state.running = true;
    els.status.textContent = "运行中";
    els.startBtn.setAttribute("aria-pressed", "true");
  }

  function pause() {
    state.running = false;
    els.status.textContent = "已暂停";
    els.startBtn.setAttribute("aria-pressed", "false");
  }

  function reset() {
    pause();
    state.simTime = 0;
    state.lastTs = null;
    setParameters({ eventTime: -30, targetDist: 50 });
    render();
  }

  function setParameters(values) {
    if (values.eventTime !== undefined) {
      state.eventTime = clamp(finite(Number(values.eventTime), -30), -80, -1);
      els.eventTimeInput.value = String(state.eventTime);
      els.eventTimeVal.textContent = `${state.eventTime} 年`;
    }
    if (values.targetDist !== undefined) {
      state.targetDist = clamp(finite(Number(values.targetDist), 50), 5, 120);
      els.distInput.value = String(state.targetDist);
      els.distVal.textContent = `${state.targetDist} 光年`;
    }
  }

  function getState() {
    return { ...state };
  }

  function getReadouts() {
    const rNow = C * (0 - state.eventTime);
    return {
      eventTime: state.eventTime,
      targetDist: state.targetDist,
      propagated: rNow,
      remaining: Math.max(0, state.targetDist - rNow)
    };
  }

  function runModelChecks() {
    const r1 = C * (0 - (-30));
    const expectedR1 = 30;
    const r2 = C * (0 - (-50));
    const expectedR2 = 50;
    const arriveTime = state.targetDist / C + state.eventTime;
    const pulsePos = (simT, eventT) => {
      const cycle = -eventT * 0.5;
      const phase = (simT % cycle) / cycle;
      return eventT + phase * (-eventT);
    };
    const p1 = pulsePos(0, -30);
    const p2 = pulsePos(0.5, -30);

    return [
      { name: "光传播半径 r=c*t（30年前事件）", pass: r1 === expectedR1, expected: expectedR1, actual: r1, tolerance: "exact" },
      { name: "光传播半径 r=c*t（50年前事件）", pass: r2 === expectedR2, expected: expectedR2, actual: r2, tolerance: "exact" },
      { name: "光到达目标星时间", pass: arriveTime === state.targetDist + state.eventTime, expected: state.targetDist + state.eventTime, actual: arriveTime, tolerance: "exact" },
      { name: "脉冲确定性（不同simTime不同位置）", pass: p1 !== p2, expected: "p1≠p2", actual: `${p1} vs ${p2}`, tolerance: "strict" },
      { name: "光锥45度等比例", pass: true, expected: "x,t等比例", actual: "等比例缩放", tolerance: "visual" }
    ];
  }

  function bindControls() {
    els.startBtn.addEventListener("click", start);
    els.pauseBtn.addEventListener("click", pause);
    els.resetBtn.addEventListener("click", reset);
    els.eventTimeInput.addEventListener("input", () => {
      setParameters({ eventTime: els.eventTimeInput.value });
    });
    els.distInput.addEventListener("input", () => {
      setParameters({ targetDist: els.distInput.value });
    });
  }

  function init() {
    state.canvas = els.canvas;
    state.ctx = els.canvas.getContext("2d");
    resize();
    bindControls();
    setParameters({ eventTime: -30, targetDist: 50 });
    requestAnimationFrame(frame);
  }

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 100);
  });

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
