<style>

<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>Fibonacci Phyllotaxis · 斐波那契螺旋叶序</h1>
      <p>Vogel 模型 · 拖动发散角，偏离 137.5° 螺旋立即瓦解</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">Running</div>
  </header>

  <main class="main">
    <section class="stage" data-region="stage" aria-label="斐波那契种子分布">
      <canvas id="scene" aria-label="Fibonacci spiral seed pattern"></canvas>
      <div class="hint" id="hint">拖动下方滑块微调发散角 · 偏离 137.5° 螺旋立即瓦解</div>
    </section>

    <aside class="side" data-region="evidence">
      <section class="evidence" aria-label="实时数值">
        <h2>Live Values</h2>
        <div class="readout-grid">
          <div class="metric"><small>Angle α</small><strong id="angleReadout">137.50°</strong></div>
          <div class="metric"><small>Seeds</small><strong id="seedsReadout">0</strong></div>
          <div class="metric"><small>Δ from golden</small><strong id="deltaReadout">0.00°</strong></div>
          <div class="metric"><small>Sim time</small><strong id="timeReadout">0.00 s</strong></div>
        </div>
      </section>
      <section class="insight" data-region="insight" aria-label="观察提示">
        <h2>Insight</h2>
        <p id="insightText">黄金角 137.5° 让每颗种子的方位角与圆周比无理相关，避免径向对齐，形成最均匀的密堆。偏离它，螺旋臂立刻显现。</p>
      </section>
    </aside>
  </main>

  <section class="controls" data-region="controls" aria-label="发散角控制">
    <div class="actions">
      <button id="startBtn" class="primary" type="button" aria-pressed="true">Start</button>
      <button id="pauseBtn" type="button">Pause</button>
      <button id="resetBtn" type="button">Reset</button>
    </div>
    <div class="slider-wrap">
      <div class="slider-row">
        <label for="angleInput">Divergence angle in degrees</label>
        <input id="angleInput" type="range" min="136" max="139" step="0.01" value="137.5" aria-label="发散角（度）">
      </div>
      <div class="tick-row">
        <span>136°</span><span>137°</span><span class="golden">137.5°</span><span>138°</span><span>139°</span>
      </div>
    </div>
    <div class="value-block">
      <span class="val" id="angleVal">137.50°</span>
      <span class="delta" id="deltaVal">黄金角</span>
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const GOLDEN_ANGLE = 137.5;
  const TOTAL_SEEDS = 620;
  const SEED_DURATION_MS = 1100;
  const SPAWN_INTERVAL_MS = 16;
  const FULL_GROW_MS = TOTAL_SEEDS * SPAWN_INTERVAL_MS + SEED_DURATION_MS;

  const state = {
    angleDeg: GOLDEN_ANGLE,
    time: 0,
    running: true,
    lastTimestamp: null,
    width: 0, height: 0, dpr: 1,
    centerX: 0, centerY: 0, scale: 1,
    needsResize: true,
    hintFaded: false
  };

  const elements = {
    canvas: document.getElementById("scene"),
    angleInput: document.getElementById("angleInput"),
    angleVal: document.getElementById("angleVal"),
    deltaVal: document.getElementById("deltaVal"),
    hint: document.getElementById("hint"),
    status: document.getElementById("status"),
    startBtn: document.getElementById("startBtn"),
    pauseBtn: document.getElementById("pauseBtn"),
    resetBtn: document.getElementById("resetBtn"),
    angleReadout: document.getElementById("angleReadout"),
    seedsReadout: document.getElementById("seedsReadout"),
    deltaReadout: document.getElementById("deltaReadout"),
    timeReadout: document.getElementById("timeReadout"),
    insightText: document.getElementById("insightText")
  };
  const ctx = elements.canvas.getContext("2d");

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function finite(v, fallback) { return Number.isFinite(v) ? v : fallback; }

  function seedPosition(n, angleRad, scale) {
    const r = scale * Math.sqrt(n + 1);
    const theta = n * angleRad;
    return { x: r * Math.cos(theta), y: r * Math.sin(theta) };
  }

  function resize() {
    const w = elements.canvas.clientWidth;
    const h = elements.canvas.clientHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    elements.canvas.width = Math.max(1, Math.floor(w * dpr));
    elements.canvas.height = Math.max(1, Math.floor(h * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    state.width = w; state.height = h; state.dpr = dpr;
    state.centerX = w / 2; state.centerY = h / 2;
    const maxR = Math.sqrt(TOTAL_SEEDS) * 6;
    const targetR = Math.min(w, h) * 0.42;
    state.scale = Math.max(0.5, targetR / maxR) * 6;
    state.needsResize = false;
  }

  function render() {
    if (state.needsResize) resize();
    const w = state.width, h = state.height;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, h);

    const cx = state.centerX, cy = state.centerY;
    const angleRad = state.angleDeg * Math.PI / 180;
    const scale = state.scale;

    const centerGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(w, h) * 0.45);
    centerGlow.addColorStop(0, "rgba(255,212,126,0.05)");
    centerGlow.addColorStop(0.5, "rgba(255,212,126,0.015)");
    centerGlow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = centerGlow;
    ctx.fillRect(0, 0, w, h);

    ctx.globalCompositeOperation = "lighter";
    const t = state.time;
    let visibleCount = 0;
    for (let n = 0; n < TOTAL_SEEDS; n++) {
      const birthTime = n * SPAWN_INTERVAL_MS;
      const ageMs = t - birthTime;
      if (ageMs < 0) break;
      visibleCount++;

      const pos = seedPosition(n, angleRad, scale);
      const px = cx + pos.x;
      const py = cy + pos.y;

      let p = ageMs / SEED_DURATION_MS;
      if (p > 1) p = 1;
      const ease = 1 - Math.pow(1 - p, 3);

      const distFactor = Math.sqrt(n + 1) / Math.sqrt(TOTAL_SEEDS);
      const baseR = 1.6 + distFactor * 2.4;
      const r = baseR * ease;
      if (r < 0.3) continue;

      const glowR = r * 3.2;
      const grad = ctx.createRadialGradient(px, py, 0, px, py, glowR);
      grad.addColorStop(0, `rgba(255,248,225,${0.95 * ease})`);
      grad.addColorStop(0.25, `rgba(255,212,126,${0.75 * ease})`);
      grad.addColorStop(0.6, `rgba(255,170,80,${0.22 * ease})`);
      grad.addColorStop(1, "rgba(255,140,40,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(px, py, glowR, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";

    const delta = state.angleDeg - GOLDEN_ANGLE;
    const gap = Math.abs(delta);
    elements.angleReadout.textContent = state.angleDeg.toFixed(2) + "°";
    elements.seedsReadout.textContent = String(visibleCount);
    elements.deltaReadout.textContent = (delta >= 0 ? '+' : '') + delta.toFixed(2) + '°';
    elements.timeReadout.textContent = (state.time / 1000).toFixed(2) + ' s';

    if (!state.running) {
      elements.insightText.textContent = '已暂停。调整发散角可即时对比：137.5° 均匀密堆，偏离后螺旋臂立刻显现。';
    } else if (gap < 0.005) {
      elements.insightText.textContent = '黄金角 137.5° 让每颗种子的方位角与圆周比无理相关，避免径向对齐，形成最均匀的密堆。';
    } else if (gap < 0.2) {
      elements.insightText.textContent = '微小偏离已开始产生可见螺旋臂，但分布仍较均匀。';
    } else {
      elements.insightText.textContent = '明显偏离黄金角：种子沿少数径向臂对齐，密堆被破坏。';
    }
  }

  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.1);
    state.time += boundedDt * 1000;
    if (state.time > FULL_GROW_MS + 1800) state.time = 0;
    if (!state.hintFaded && state.time > 600) {
      elements.hint.classList.add("fade");
      state.hintFaded = true;
    }
  }

  function start() {
    state.running = true;
    elements.status.textContent = "Running";
    elements.startBtn.setAttribute("aria-pressed", "true");
  }
  function pause() {
    state.running = false;
    elements.status.textContent = "Paused";
    elements.startBtn.setAttribute("aria-pressed", "false");
  }
  function reset() {
    pause();
    state.time = 0;
    state.lastTimestamp = null;
    state.hintFaded = false;
    elements.hint.classList.remove("fade");
    render();
  }

  function setParameters(values) {
    if (values && typeof values.angleDeg !== "undefined") {
      const deg = finite(Number(values.angleDeg), GOLDEN_ANGLE);
      state.angleDeg = clamp(deg, 136, 139);
      elements.angleInput.value = String(state.angleDeg);
    }
    const delta = state.angleDeg - GOLDEN_ANGLE;
    elements.angleVal.textContent = state.angleDeg.toFixed(2) + '°';
    if (Math.abs(delta) < 0.005) {
      elements.deltaVal.textContent = '黄金角';
      elements.deltaVal.classList.add('golden');
    } else {
      const sign = delta > 0 ? '+' : '';
      elements.deltaVal.textContent = `${sign}${delta.toFixed(2)}°`;
      elements.deltaVal.classList.remove('golden');
    }
    render();
  }

  function getState() {
    return {
      angleDeg: state.angleDeg,
      time: state.time,
      running: state.running,
      width: state.width,
      height: state.height,
      scale: state.scale
    };
  }

  function getReadouts() {
    const delta = state.angleDeg - GOLDEN_ANGLE;
    const visibleCount = Math.max(0, Math.min(TOTAL_SEEDS, Math.floor(state.time / SPAWN_INTERVAL_MS) + 1));
    return {
      angleDeg: state.angleDeg,
      delta: delta,
      seeds: visibleCount,
      time: state.time / 1000,
      running: state.running
    };
  }

  function runModelChecks() {
    const checks = [];
    const p0 = seedPosition(0, 137.5 * Math.PI / 180, 6);
    checks.push({
      name: 'seed 0 at origin',
      pass: Math.abs(p0.x) < 1e-9 && Math.abs(p0.y) < 1e-9,
      expected: '(0, 0)',
      actual: `(${p0.x}, ${p0.y})`,
      tolerance: 'exact'
    });
    const p1 = seedPosition(0, 137.5 * Math.PI / 180, 6);
    const p4 = seedPosition(3, 137.5 * Math.PI / 180, 6);
    const r1 = Math.hypot(p1.x, p1.y);
    const r4 = Math.hypot(p4.x, p4.y);
    checks.push({
      name: 'radius √n scaling (r(4)/r(1)=2)',
      pass: Math.abs(r4 / r1 - 2) < 1e-9,
      expected: '2',
      actual: (r4 / r1).toFixed(10),
      tolerance: '1e-9'
    });
    const a = 137.5 * Math.PI / 180;
    const pn = seedPosition(10, a, 6);
    const expectedTheta = 10 * a;
    const actualTheta = Math.atan2(pn.y, pn.x);
    let thetaDiff = actualTheta - expectedTheta;
    while (thetaDiff > Math.PI) thetaDiff -= 2 * Math.PI;
    while (thetaDiff < -Math.PI) thetaDiff += 2 * Math.PI;
    checks.push({
      name: 'angle accumulation θ=10α',
      pass: Math.abs(thetaDiff) < 1e-9,
      expected: expectedTheta.toFixed(6),
      actual: actualTheta.toFixed(6),
      tolerance: '1e-9'
    });
    const phi = (1 + Math.sqrt(5)) / 2;
    const goldenFromPhi = 360 / (phi * phi);
    checks.push({
      name: '137.5° ≈ 360°/φ²',
      pass: Math.abs(goldenFromPhi - 137.5) < 0.1,
      expected: '137.5°',
      actual: goldenFromPhi.toFixed(4) + '°',
      tolerance: '0.1°'
    });
    function neighborStats(angleDeg) {
      const ar = angleDeg * Math.PI / 180;
      const pts = [];
      for (let i = 0; i < 200; i++) pts.push(seedPosition(i, ar, 6));
      const dists = [];
      for (let i = 1; i < 200; i++) {
        let minD = Infinity;
        for (let j = 0; j < 200; j++) {
          if (i === j) continue;
          const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
          if (d < minD) minD = d;
        }
        dists.push(minD);
      }
      const mean = dists.reduce((s, d) => s + d, 0) / dists.length;
      const variance = dists.reduce((s, d) => s + (d - mean) ** 2, 0) / dists.length;
      return { mean, std: Math.sqrt(variance), cv: Math.sqrt(variance) / mean };
    }
    const golden = neighborStats(137.5);
    const off = neighborStats(137.0);
    checks.push({
      name: 'golden angle yields more uniform packing (lower CV)',
      pass: golden.cv < off.cv,
      expected: `CV(137.5°) < CV(137.0°)`,
      actual: `CV(137.5°)=${golden.cv.toFixed(4)}, CV(137.0°)=${off.cv.toFixed(4)}`,
      tolerance: 'strict'
    });
    return checks;
  }

  function bindControls() {
    elements.angleInput.addEventListener("input", () => {
      setParameters({ angleDeg: parseFloat(elements.angleInput.value) });
    });
    elements.startBtn.addEventListener("click", start);
    elements.pauseBtn.addEventListener("click", pause);
    elements.resetBtn.addEventListener("click", reset);
    window.addEventListener("resize", () => { state.needsResize = true; });
  }

  function init() {
    resize();
    bindControls();
    setParameters({ angleDeg: GOLDEN_ANGLE });
    requestAnimationFrame(frame);
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  window.simulation = {
    init, start, pause, reset, update, render,
    setParameters, getState, getReadouts, runModelChecks,
    setAngle: (deg) => setParameters({ angleDeg: deg })
  };

  init();
})();
</script>
</body>
</html>
