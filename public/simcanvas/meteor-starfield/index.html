<!doctype html>
<html lang="zh">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starry Sky — 确定性星空壁纸</title>
<style>
:root{
  color-scheme:dark;
  --sim-bg:#050810;
  --sim-surface:#0b1020;
  --sim-surface-soft:#121a2e;
  --sim-text:#e8eefc;
  --sim-muted:#7a8aa8;
  --sim-border:#1e2940;
  --sim-grid:#141d33;
  --sim-accent:#5fc8ff;
  --sim-accent-deep:#2a8fd6;
  --sim-accent-soft:#0d2a44;
  --sim-positive:#5fc8ff;
  --sim-warning:#f5b942;
  --sim-danger:#ef5b6b;
  --sim-radius-sm:10px;
  --sim-radius-md:16px;
  --sim-radius-lg:22px;
  --sim-shadow:0 14px 36px rgba(0,0,0,.45);
  --sim-space-1:4px;
  --sim-space-2:8px;
  --sim-space-3:12px;
  --sim-space-4:16px;
  --sim-space-5:24px;
  --sim-space-6:32px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--sim-bg);color:var(--sim-text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
#scene{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0}
.app{position:fixed;inset:0;pointer-events:none;z-index:1;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr;gap:0}
.header{pointer-events:none;padding:var(--sim-space-4) var(--sim-space-5);display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sim-space-4)}
.header-text h1{margin:0 0 4px;font-size:clamp(1.1rem,1.8vw,1.5rem);letter-spacing:-.02em;line-height:1.1;color:var(--sim-text);text-shadow:0 2px 8px rgba(0,0,0,.6)}
.header-text p{margin:0;font-size:.78rem;color:var(--sim-muted);text-shadow:0 1px 4px rgba(0,0,0,.6)}
.status{pointer-events:none;border:1px solid rgba(95,200,255,.22);border-radius:999px;padding:6px 12px;background:rgba(13,42,68,.55);color:var(--sim-accent);font-weight:700;font-size:.72rem;white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.stage{position:relative;pointer-events:none;min-height:0}
.evidence{pointer-events:none;position:absolute;left:var(--sim-space-5);bottom:calc(var(--sim-space-6) + 52px);max-width:340px;padding:var(--sim-space-3) var(--sim-space-4);border:1px solid rgba(95,200,255,.14);border-radius:var(--sim-radius-md);background:rgba(11,16,32,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:var(--sim-shadow)}
.evidence h2{margin:0 0 6px;font-size:.82rem;color:var(--sim-accent);font-weight:700}
.evidence p{margin:0;font-size:.72rem;line-height:1.5;color:var(--sim-muted)}
.evidence code{color:var(--sim-text);font-size:.7rem;background:rgba(95,200,255,.08);padding:1px 5px;border-radius:4px}
.insight{pointer-events:none;position:absolute;right:var(--sim-space-5);bottom:calc(var(--sim-space-6) + 52px);max-width:300px;padding:var(--sim-space-3) var(--sim-space-4);border-left:3px solid var(--sim-warning);border-radius:0 var(--sim-radius-sm) var(--sim-radius-sm) 0;background:rgba(18,26,46,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--sim-text);font-weight:600;font-size:.74rem;line-height:1.45}
.controls{pointer-events:none;position:absolute;right:var(--sim-space-5);bottom:var(--sim-space-5);display:flex;gap:var(--sim-space-2);align-items:center}
.controls .actions{pointer-events:auto;display:flex;gap:var(--sim-space-2)}
button{border:1px solid rgba(95,200,255,.2);border-radius:999px;padding:9px 14px;color:var(--sim-text);background:rgba(11,16,32,.6);cursor:pointer;font-weight:700;font-size:.78rem;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .16s ease,background .16s ease,border-color .16s ease}
button:hover{border-color:rgba(95,200,255,.4);background:rgba(18,26,46,.75)}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid rgba(95,200,255,.4);outline-offset:2px}
button.primary{border-color:var(--sim-accent-deep);color:#fff;background:linear-gradient(135deg,var(--sim-accent-deep),var(--sim-accent))}
button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.control{pointer-events:auto;display:flex;flex-direction:column;gap:4px;min-width:140px}
.control label{display:flex;justify-content:space-between;gap:8px;font-size:.72rem;font-weight:700;color:var(--sim-muted)}
.control output{color:var(--sim-text);font-variant-numeric:tabular-nums}
input[type="range"]{width:100%;accent-color:var(--sim-accent);pointer-events:auto}
.formula{position:absolute;left:var(--sim-space-5);bottom:var(--sim-space-5);pointer-events:none;font-size:11px;color:var(--sim-muted);opacity:.32;font-family:ui-monospace,"SF Mono",monospace;line-height:1.4}
@media(max-width:640px){
  .evidence,.insight{display:none}
  .controls{right:var(--sim-space-4);bottom:var(--sim-space-4)}
  .control{min-width:110px}
  .header{padding:var(--sim-space-3) var(--sim-space-4)}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div class="header-text">
      <h1>Starry Sky</h1>
      <p>确定性时间驱动的星空闪烁与偶发流星</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">Running</div>
  </header>
  <main class="stage" data-region="stage" aria-label="星空场景">
    <div class="formula">A(t) = A₀ · (1 + sin(ωt + φ)) / 2<br>meteor: Poisson λ = 1/5 s⁻¹</div>
  </main>
  <aside class="evidence" data-region="evidence">
    <h2>Live values</h2>
    <p>星星 <code id="starCount">0</code> · 流星 <code id="meteorCount">0</code><br>模拟时间 <code id="timeReadout">0.0 s</code></p>
  </aside>
  <div class="insight" data-region="insight" id="insight">每颗星按正弦相位独立闪烁；流星按泊松过程偶发划过，方向锁定左上→右下。</div>
  <section class="controls" data-region="controls" aria-label="Simulation controls">
    <div class="actions">
      <button id="startBtn" class="primary" type="button" aria-pressed="true">Play</button>
      <button id="pauseBtn" type="button">Pause</button>
      <button id="resetBtn" type="button">Reset</button>
    </div>
    <div class="control">
      <label for="meteorRateInput">Meteor rate <output id="meteorRateOutput">0.20</output></label>
      <input id="meteorRateInput" type="range" min="0.05" max="1" step="0.05" value="0.2">
    </div>
  </section>
</div>
<script>
(() => {
  "use strict";
  const parameterSchema = [
    { key: "meteorRate", label: "Meteor rate", type: "slider", min: 0.05, max: 1, step: 0.05, default: 0.2, unit: "s⁻¹" }
  ];
  const state = {
    running: true,
    simTime: 0,
    lastTimestamp: null,
    stars: [],
    meteors: [],
    ridges: [],
    nextMeteorTime: 0,
    meteorRate: 0.2,
    drift: 0,
    reducedMotion: false
  };
  const elements = {
    canvas: document.querySelector("#scene"),
    status: document.querySelector("#status"),
    starCount: document.querySelector("#starCount"),
    meteorCount: document.querySelector("#meteorCount"),
    timeReadout: document.querySelector("#timeReadout"),
    meteorRateInput: document.querySelector("#meteorRateInput"),
    meteorRateOutput: document.querySelector("#meteorRateOutput"),
    startBtn: document.querySelector("#startBtn"),
    pauseBtn: document.querySelector("#pauseBtn"),
    resetBtn: document.querySelector("#resetBtn")
  };
  const ctx = elements.canvas.getContext("2d");
  function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
  function finite(v, fallback) { return Number.isFinite(v) ? v : fallback; }
  function makeRNG(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }
  function generateStars(w, h) {
    const rng = makeRNG(1337);
    const layers = [
      { count: Math.floor(w * h / 6000), rMin: 0.3, rMax: 0.8, speedMin: 0.3, speedMax: 0.8, drift: 0 },
      { count: Math.floor(w * h / 12000), rMin: 0.6, rMax: 1.4, speedMin: 0.5, speedMax: 1.2, drift: 0 },
      { count: Math.floor(w * h / 28000), rMin: 1.0, rMax: 2.2, speedMin: 0.4, speedMax: 1.0, drift: 0.15 }
    ];
    const stars = [];
    for (let l = 0; l < layers.length; l++) {
      const L = layers[l];
      for (let i = 0; i < L.count; i++) {
        stars.push({
          x: rng() * w,
          y: rng() * h * 0.82,
          baseR: L.rMin + rng() * (L.rMax - L.rMin),
          phase: rng() * Math.PI * 2,
          speed: L.speedMin + rng() * (L.speedMax - L.speedMin),
          layer: l,
          drift: L.drift,
          hue: rng() < 0.15 ? (rng() < 0.5 ? 30 : 210) : 0
        });
      }
    }
    return stars;
  }
  function generateRidges(w, h) {
    const rng = makeRNG(999);
    const ridges = [];
    const configs = [
      { baseY: h * 0.78, amp: h * 0.06, color: "rgba(8,12,24,0.92)", step: 40 },
      { baseY: h * 0.85, amp: h * 0.05, color: "rgba(14,20,38,0.96)", step: 50 },
      { baseY: h * 0.92, amp: h * 0.04, color: "rgba(20,28,52,1)", step: 60 }
    ];
    for (const c of configs) {
      const pts = [];
      let x = -20;
      while (x <= w + 20) {
        const y = c.baseY + Math.sin(x * 0.008 + rng() * 6) * c.amp + (rng() - 0.5) * c.amp * 0.6;
        pts.push({ x, y });
        x += c.step + rng() * 20;
      }
      ridges.push({ points: pts, color: c.color });
    }
    return ridges;
  }
  function spawnMeteor(w, h) {
    const startX = w * (0.3 + Math.random() * 0.65);
    const startY = -20;
    const angle = Math.PI * 0.28 + (Math.random() - 0.5) * 0.12;
    const speed = 600 + Math.random() * 400;
    const len = 120 + Math.random() * 180;
    return {
      x: startX, y: startY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0,
      maxLife: len / speed * 1.5,
      brightness: 0.7 + Math.random() * 0.3,
      trail: []
    };
  }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth;
    const h = window.innerHeight;
    elements.canvas.width = w * dpr;
    elements.canvas.height = h * dpr;
    elements.canvas.style.width = w + "px";
    elements.canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    state.stars = generateStars(w, h);
    state.ridges = generateRidges(w, h);
  }
  function init() {
    state.reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    resize();
    bindControls();
    setParameters({ meteorRate: 0.2 });
    reset();
    requestAnimationFrame(frame);
  }
  function start() {
    state.running = true;
    elements.status.textContent = "Running";
    elements.startBtn.setAttribute("aria-pressed", "true");
  }
  function pause() {
    state.running = false;
    state.lastTimestamp = null;
    elements.status.textContent = "Paused";
    elements.startBtn.setAttribute("aria-pressed", "false");
  }
  function reset() {
    state.simTime = 0;
    state.meteors = [];
    state.drift = 0;
    state.nextMeteorTime = 2 + Math.random() * 3;
    state.lastTimestamp = null;
    render();
  }
  function update(dt) {
    if (!state.running || state.reducedMotion) return;
    const bdt = clamp(finite(dt, 0), 0, 0.05);
    state.simTime += bdt;
    state.drift += bdt * 2;
    if (state.simTime >= state.nextMeteorTime) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      state.meteors.push(spawnMeteor(w, h));
      state.nextMeteorTime = state.simTime + (1 / state.meteorRate) * (0.5 + Math.random());
    }
    for (let i = state.meteors.length - 1; i >= 0; i--) {
      const m = state.meteors[i];
      m.life += bdt;
      m.x += m.vx * bdt;
      m.y += m.vy * bdt;
      m.trail.push({ x: m.x, y: m.y, t: state.simTime });
      if (m.trail.length > 30) m.trail.shift();
      if (m.life > m.maxLife || m.x > window.innerWidth + 100 || m.y > window.innerHeight + 100) {
        state.meteors.splice(i, 1);
      }
    }
  }
  function render() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, "#050810");
    grad.addColorStop(0.5, "#080d1c");
    grad.addColorStop(1, "#0c1226");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    const neb = ctx.createRadialGradient(w * 0.3, h * 0.15, 0, w * 0.3, h * 0.15, w * 0.5);
    neb.addColorStop(0, "rgba(40,60,120,0.08)");
    neb.addColorStop(1, "rgba(40,60,120,0)");
    ctx.fillStyle = neb;
    ctx.fillRect(0, 0, w, h);
    const neb2 = ctx.createRadialGradient(w * 0.75, h * 0.25, 0, w * 0.75, h * 0.25, w * 0.35);
    neb2.addColorStop(0, "rgba(80,40,100,0.06)");
    neb2.addColorStop(1, "rgba(80,40,100,0)");
    ctx.fillStyle = neb2;
    ctx.fillRect(0, 0, w, h);
    for (const star of state.stars) {
      const omega = star.speed * 2;
      const brightness = (1 + Math.sin(omega * state.simTime + star.phase)) / 2;
      const r = star.baseR * (0.6 + brightness * 0.6);
      const dx = star.layer === 2 ? state.drift * star.drift : 0;
      const sx = ((star.x + dx) % w + w) % w;
      const alpha = 0.3 + brightness * 0.7;
      const haloR = r * 4;
      const halo = ctx.createRadialGradient(sx, star.y, 0, sx, star.y, haloR);
      if (star.hue === 30) {
        halo.addColorStop(0, `rgba(255,220,160,${alpha * 0.4})`);
        halo.addColorStop(1, "rgba(255,220,160,0)");
      } else if (star.hue === 210) {
        halo.addColorStop(0, `rgba(160,200,255,${alpha * 0.4})`);
        halo.addColorStop(1, "rgba(160,200,255,0)");
      } else {
        halo.addColorStop(0, `rgba(220,235,255,${alpha * 0.4})`);
        halo.addColorStop(1, "rgba(220,235,255,0)");
      }
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(sx, star.y, haloR, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = star.hue === 30
        ? `rgba(255,240,210,${alpha})`
        : star.hue === 210
          ? `rgba(210,230,255,${alpha})`
          : `rgba(240,248,255,${alpha})`;
      ctx.beginPath();
      ctx.arc(sx, star.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const m of state.meteors) {
      const lifeFrac = m.life / m.maxLife;
      const fade = lifeFrac < 0.15 ? lifeFrac / 0.15 : lifeFrac > 0.8 ? (1 - lifeFrac) / 0.2 : 1;
      for (let i = 1; i < m.trail.length; i++) {
        const p0 = m.trail[i - 1];
        const p1 = m.trail[i];
        const tFrac = i / m.trail.length;
        const a = tFrac * fade * m.brightness;
        ctx.strokeStyle = `rgba(200,230,255,${a * 0.6})`;
        ctx.lineWidth = tFrac * 2.5;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.stroke();
      }
      const headR = 3 * fade;
      const head = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, headR * 4);
      head.addColorStop(0, `rgba(255,255,255,${fade * m.brightness})`);
      head.addColorStop(0.4, `rgba(200,230,255,${fade * m.brightness * 0.5})`);
      head.addColorStop(1, "rgba(200,230,255,0)");
      ctx.fillStyle = head;
      ctx.beginPath();
      ctx.arc(m.x, m.y, headR * 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${fade * m.brightness})`;
      ctx.beginPath();
      ctx.arc(m.x, m.y, headR, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const ridge of state.ridges) {
      ctx.fillStyle = ridge.color;
      ctx.beginPath();
      ctx.moveTo(ridge.points[0].x, window.innerHeight);
      for (const p of ridge.points) ctx.lineTo(p.x, p.y);
      ctx.lineTo(ridge.points[ridge.points.length - 1].x, window.innerHeight);
      ctx.closePath();
      ctx.fill();
    }
    elements.starCount.textContent = state.stars.length;
    elements.meteorCount.textContent = state.meteors.length;
    elements.timeReadout.textContent = state.simTime.toFixed(1) + " s";
    elements.meteorRateOutput.textContent = state.meteorRate.toFixed(2);
  }
  function setParameters(values) {
    const def = parameterSchema[0];
    state.meteorRate = clamp(finite(Number(values.meteorRate), def.default), def.min, def.max);
    elements.meteorRateInput.value = String(state.meteorRate);
    render();
  }
  function getState() {
    return {
      running: state.running,
      simTime: state.simTime,
      meteorRate: state.meteorRate,
      starCount: state.stars.length,
      meteorCount: state.meteors.length,
      nextMeteorTime: state.nextMeteorTime,
      drift: state.drift
    };
  }
  function getReadouts() {
    return {
      simTime: state.simTime,
      starCount: state.stars.length,
      meteorCount: state.meteors.length,
      meteorRate: state.meteorRate
    };
  }
  function runModelChecks() {
    const rng1 = makeRNG(1337);
    const rng2 = makeRNG(1337);
    let deterministic = true;
    for (let i = 0; i < 100; i++) {
      if (rng1() !== rng2()) { deterministic = false; break; }
    }
    const omega = 0.8 * 2;
    const t = 1.0;
    const phase = 0.5;
    const brightness = (1 + Math.sin(omega * t + phase)) / 2;
    const brightnessRange = brightness >= 0 && brightness <= 1;
    const testMeteor = spawnMeteor(1000, 800);
    const directionOk = testMeteor.vx > 0 && testMeteor.vy > 0;
    const intervals = [];
    let simT = 0;
    let nextM = 2;
    const rate = 0.2;
    for (let i = 0; i < 20; i++) {
      simT = nextM;
      nextM = simT + (1 / rate) * 0.75;
      intervals.push(nextM - simT);
    }
    const avgInterval = intervals.reduce((a, b) => a + b, 0) / intervals.length;
    const intervalOk = avgInterval >= 4 && avgInterval <= 6;
    const savedRunning = state.running;
    const savedTime = state.simTime;
    state.running = false;
    const beforePause = state.simTime;
    update(0.1);
    const afterPause = state.simTime;
    const pauseOk = beforePause === afterPause;
    state.running = savedRunning;
    state.simTime = savedTime;
    return [
      { name: "deterministic PRNG (seed 1337)", pass: deterministic, expected: "two runs identical", actual: deterministic ? "identical" : "diverged", tolerance: "strict" },
      { name: "brightness formula range [0,1]", pass: brightnessRange, expected: "0 ≤ A ≤ 1", actual: brightness, tolerance: "strict" },
      { name: "meteor direction (dx>0, dy>0)", pass: directionOk, expected: "vx>0, vy>0", actual: `vx=${testMeteor.vx.toFixed(1)}, vy=${testMeteor.vy.toFixed(1)}`, tolerance: "strict" },
      { name: "meteor interval avg 4–6s", pass: intervalOk, expected: "4–6s", actual: avgInterval.toFixed(2) + "s", tolerance: "range" },
      { name: "pause freezes simTime", pass: pauseOk, expected: "simTime unchanged", actual: `before=${beforePause}, after=${afterPause}`, tolerance: "strict" },
      { name: "no shadowBlur used", pass: ctx.shadowBlur === 0, expected: "shadowBlur === 0", actual: ctx.shadowBlur, tolerance: "strict" }
    ];
  }
  function bindControls() {
    elements.startBtn.addEventListener("click", start);
    elements.pauseBtn.addEventListener("click", pause);
    elements.resetBtn.addEventListener("click", reset);
    elements.meteorRateInput.addEventListener("input", () => setParameters({ meteorRate: elements.meteorRateInput.value }));
    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resize, 150);
    });
  }
  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  window.simulation = {
    init: init,
    start: start,
    pause: pause,
    reset: reset,
    update: update,
    render: render,
    setParameters: setParameters,
    getState: getState,
    getReadouts: getReadouts,
    runModelChecks: runModelChecks
  };
  init();
})();
</script>
</body>
</html>
