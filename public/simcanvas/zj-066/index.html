<!doctype html>
<html lang="zh-CN">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赫罗图 · H-R Diagram</title>
<style>
:root {
  color-scheme: light;
  --sim-bg: #eef3f8;
  --sim-surface: #ffffff;
  --sim-surface-soft: #f8fafc;
  --sim-text: #172033;
  --sim-muted: #657188;
  --sim-border: #dfe6ef;
  --sim-grid: #e8edf4;
  --sim-accent: #0f9fba;
  --sim-accent-deep: #08758a;
  --sim-accent-soft: #d9f4f7;
  --sim-positive: #0f9fba;
  --sim-warning: #f59e0b;
  --sim-danger: #dc2626;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--sim-text);
  background:
    radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
    radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
    var(--sim-bg);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
.app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
.header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
.header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
.header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
.status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 2.15fr) minmax(280px, 0.55fr); gap: 12px; }
.panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
.scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.panel-head h2 { margin: 0; font-size: 1rem; }
.panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
#scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); touch-action: none; }
.side { min-height: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 12px; }
.readouts { padding: 17px; }
.readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.metric { padding: 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
.metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
.metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.type-switch { padding: 17px; }
.type-switch h3 { margin: 0 0 12px; font-size: 0.92rem; }
.type-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.type-btn { padding: 10px 8px; border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); background: var(--sim-surface-soft); cursor: pointer; font-weight: 700; font-size: 0.82rem; transition: all .16s ease; display: flex; align-items: center; gap: 6px; justify-content: center; }
.type-btn:hover { border-color: #c7d2e2; background: #eef3f9; }
.type-btn.active { border-color: var(--sim-accent-deep); background: var(--sim-accent-soft); color: var(--sim-accent-deep); }
.type-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.model-note { display: grid; align-content: start; gap: 14px; padding: 17px; }
.model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
.insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; line-height: 1.5; font-size: 0.9rem; }
.controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr) minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
.actions { display: flex; gap: 8px; }
button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
button:hover { border-color: #c7d2e2; background: #eef3f9; }
button:active { transform: scale(.97); }
button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
.control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
.control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
.axis-label { fill: var(--sim-muted); font-size: 12px; font-weight: 600; }
.axis-title { fill: var(--sim-text); font-size: 14px; font-weight: 700; }
.grid-line { stroke: var(--sim-grid); stroke-width: 1; }
.axis { stroke: #9aa7ba; stroke-width: 1.5; }
.tick-label { fill: var(--sim-muted); font-size: 11px; }
.ms-band { fill: rgba(15,159,186,0.10); stroke: rgba(15,159,186,0.30); stroke-width: 1.5; stroke-dasharray: 6 4; }
.giant-region { fill: rgba(245,158,11,0.07); }
.wd-region { fill: rgba(220,38,38,0.06); }
.star-sample { cursor: pointer; transition: opacity .2s; }
.star-sample:hover { opacity: 0.7; }
.star-label { font-size: 11px; fill: var(--sim-muted); font-weight: 600; pointer-events: none; }
#starMarker { cursor: grab; }
#starMarker:active { cursor: grabbing; }
#starHalo { fill: rgba(15,159,186,0.18); }
#starCore { fill: var(--sim-positive); stroke: white; stroke-width: 3; }
#trailLine { fill: none; stroke: rgba(15,159,186,0.35); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4 3; }
.legend-item { font-size: 11px; fill: var(--sim-muted); font-weight: 600; }
@media (max-width: 860px) {
  .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
  .main, .app[data-layout] .main { grid-template-columns: 1fr; }
  .controls { grid-template-columns: 1fr; }
  .scene-panel { min-height: 0; }
  #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app" data-layout="visualization-first" data-model-tier="qualitative">
  <header class="header" data-region="header">
    <div>
      <h1>赫罗图 · H-R Diagram</h1>
      <p>拖动恒星或调节温度与光度，观察它在光度—温度平面上的位置与所属族群。</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">已就绪</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head"><h2 id="scene-title">光度 — 表面温度平面</h2><span>横轴温度反向（左热右冷） · 纵轴光度对数</span></div>
      <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
        <desc id="scene-desc">赫罗图：横轴为表面温度（反向，左高右低），纵轴为光度（对数刻度）。主序带、巨星区、白矮星区以不同颜色标注。</desc>
        <defs>
          <radialGradient id="starGlow">
            <stop offset="0%" stop-color="rgba(15,159,186,0.35)"/>
            <stop offset="100%" stop-color="rgba(15,159,186,0)"/>
          </radialGradient>
        </defs>
        <g id="regions"></g>
        <g id="grid"></g>
        <g id="axes"></g>
        <g id="samples"></g>
        <polyline id="trailLine" points=""/>
        <circle id="starHalo" cx="380" cy="210" r="16"/>
        <circle id="starCore" cx="380" cy="210" r="8"/>
      </svg>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel readouts" aria-label="恒星读数">
        <div class="readout-grid">
          <div class="metric"><small>表面温度</small><strong id="tempReadout">5800 K</strong></div>
          <div class="metric"><small>光度 (L/L☉)</small><strong id="lumReadout">1.0</strong></div>
          <div class="metric"><small>绝对星等 M</small><strong id="magReadout">+4.83</strong></div>
          <div class="metric"><small>半径 (R/R☉)</small><strong id="radReadout">1.0</strong></div>
        </div>
      </section>
      <section class="panel type-switch" aria-label="恒星族群切换">
        <h3>恒星族群</h3>
        <div class="type-buttons">
          <button class="type-btn active" data-type="mainSequence" type="button"><span class="type-dot" style="background:#0f9fba"></span>主序</button>
          <button class="type-btn" data-type="giants" type="button"><span class="type-dot" style="background:#f59e0b"></span>巨星</button>
          <button class="type-btn" data-type="supergiants" type="button"><span class="type-dot" style="background:#dc2626"></span>超巨星</button>
          <button class="type-btn" data-type="whiteDwarfs" type="button"><span class="type-dot" style="background:#7c8ba1"></span>白矮星</button>
        </div>
      </section>
      <section class="panel model-note" data-region="insight">
        <div class="panel-head"><h2>洞察</h2></div>
        <p id="insight" class="insight">当前恒星位于主序带。主序星的光度主要由质量决定：质量越大，温度越高、光度越大。</p>
        <p>教学视图：温度轴反向（左热右冷）以匹配传统赫罗图。光度与半径均取对数压缩。主序带高亮显示恒星一生中氢燃烧阶段的分布。</p>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="模拟控制">
    <div class="actions">
      <button id="startBtn" class="primary" type="button">开始</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control">
      <label for="tempInput">表面温度 <output id="tempOutput">5800 K</output></label>
      <input id="tempInput" type="range" min="2500" max="40000" step="100" value="5800">
    </div>
    <div class="control">
      <label for="lumInput">光度 (L/L☉) <output id="lumOutput">1.0</output></label>
      <input id="lumInput" type="range" min="0.001" max="100000" step="0.001" value="1">
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  // ── 坐标映射 ──────────────────────────────────────────
  // viewBox: 760 × 420
  // 绘图区: x ∈ [70, 720], y ∈ [30, 360]
  const PLOT = { x0: 70, x1: 720, y0: 30, y1: 360 };
  const TEMP_MIN = 40000, TEMP_MAX = 2500;   // 反向：左热右冷
  const LOG_L_MIN = -5, LOG_L_MAX = 6;

  function tempToX(temp) {
    const t = Math.max(TEMP_MAX, Math.min(TEMP_MIN, temp));
    // 反向：高温→左(x0)，低温→右(x1)
    const ratio = Math.log(t / TEMP_MAX) / Math.log(TEMP_MIN / TEMP_MAX);
    return PLOT.x0 + ratio * (PLOT.x1 - PLOT.x0);
  }
  function xToTemp(x) {
    const ratio = (x - PLOT.x0) / (PLOT.x1 - PLOT.x0);
    return TEMP_MAX * Math.pow(TEMP_MIN / TEMP_MAX, ratio);
  }
  function lumToY(lum) {
    const ll = Math.log10(Math.max(1e-10, lum));
    const c = Math.max(LOG_L_MIN, Math.min(LOG_L_MAX, ll));
    const ratio = (c - LOG_L_MIN) / (LOG_L_MAX - LOG_L_MIN);
    // 高光度→上(y0)，低光度→下(y1)
    return PLOT.y1 - ratio * (PLOT.y1 - PLOT.y0);
  }
  function yToLum(y) {
    const ratio = (PLOT.y1 - y) / (PLOT.y1 - PLOT.y0);
    return Math.pow(10, LOG_L_MIN + ratio * (LOG_L_MAX - LOG_L_MIN));
  }

  // ── 物理换算 ──────────────────────────────────────────
  // 绝对星等 M = M☉ - 2.5 log10(L/L☉), M☉ = 4.83
  function luminosityToAbsMag(lum) { return 4.83 - 2.5 * Math.log10(Math.max(1e-10, lum)); }
  // 半径 (Stefan-Boltzmann): L = 4πR²σT⁴ → R/R☉ = sqrt(L/L☉) × (T☉/T)², T☉=5772K
  function computeRadius(temp, lum) {
    const T_SUN = 5772;
    return Math.sqrt(Math.max(1e-10, lum)) * Math.pow(T_SUN / Math.max(1, temp), 2);
  }
  function classifyStar(temp, lum) {
    const rad = computeRadius(temp, lum);
    const ll = Math.log10(Math.max(1e-10, lum));
    if (rad < 0.1 && temp > 8000) return "whiteDwarf";
    if (rad > 100 && ll > 4) return "supergiant";
    if (rad > 10) return "giant";
    return "mainSequence";
  }
  function tempToColor(temp) {
    // 简化恒星色温映射
    if (temp > 25000) return "#9bb5ff";
    if (temp > 10000) return "#aabfff";
    if (temp > 7500) return "#cad7ff";
    if (temp > 6000) return "#fff4ea";
    if (temp > 5000) return "#fff2a1";
    if (temp > 3700) return "#ffd2a1";
    return "#ff9966";
  }

  // ── 预置恒星样本 ──────────────────────────────────────
  const STAR_SAMPLES = [
    { name: "太阳", temp: 5800, lum: 1, type: "mainSequence" },
    { name: "天狼星A", temp: 9940, lum: 25, type: "mainSequence" },
    { name: "参宿七", temp: 12100, lum: 120000, type: "supergiant" },
    { name: "参宿四", temp: 3500, lum: 126000, type: "supergiant" },
    { name: "心宿二", temp: 3660, lum: 70000, type: "supergiant" },
    { name: "毕宿五", temp: 3910, lum: 400, type: "giant" },
    { name: "大角星", temp: 4286, lum: 170, type: "giant" },
    { name: "天狼星B", temp: 25000, lum: 0.026, type: "whiteDwarf" },
    { name: "波江座40B", temp: 16800, lum: 0.014, type: "whiteDwarf" },
    { name: "织女星", temp: 9602, lum: 40, type: "mainSequence" },
    { name: "参宿一", temp: 33600, lum: 46000, type: "supergiant" },
    { name: "南河三B", temp: 7740, lum: 0.00056, type: "whiteDwarf" },
  ];

  // ── 状态 ──────────────────────────────────────────────
  const state = {
    running: false,
    temp: 5800,
    lum: 1,
    activeType: "mainSequence",
    showTypes: { mainSequence: true, giants: true, supergiants: true, whiteDwarfs: true },
    trail: [{ temp: 5800, lum: 1 }],
    lastTimestamp: null,
    animPhase: 0,
  };

  const el = {
    status: document.querySelector("#status"),
    tempReadout: document.querySelector("#tempReadout"),
    lumReadout: document.querySelector("#lumReadout"),
    magReadout: document.querySelector("#magReadout"),
    radReadout: document.querySelector("#radReadout"),
    insight: document.querySelector("#insight"),
    tempInput: document.querySelector("#tempInput"),
    tempOutput: document.querySelector("#tempOutput"),
    lumInput: document.querySelector("#lumInput"),
    lumOutput: document.querySelector("#lumOutput"),
    startBtn: document.querySelector("#startBtn"),
    pauseBtn: document.querySelector("#pauseBtn"),
    resetBtn: document.querySelector("#resetBtn"),
    starHalo: document.querySelector("#starHalo"),
    starCore: document.querySelector("#starCore"),
    trailLine: document.querySelector("#trailLine"),
    regions: document.querySelector("#regions"),
    grid: document.querySelector("#grid"),
    axes: document.querySelector("#axes"),
    samples: document.querySelector("#samples"),
    scene: document.querySelector("#scene"),
  };

  // ── 绘制网格与坐标轴 ──────────────────────────────────
  function initGrid() {
    const lines = [];
    // 温度刻度（反向）
    const tempTicks = [40000, 30000, 20000, 10000, 7500, 6000, 5000, 4000, 3000, 2500];
    tempTicks.forEach(t => {
      const x = tempToX(t);
      lines.push(`<line class="grid-line" x1="${x}" y1="${PLOT.y0}" x2="${x}" y2="${PLOT.y1}"/>`);
    });
    // 光度刻度（对数）
    const lumTicks = [1e5, 1e4, 1e3, 1e2, 1e1, 1, 1e-1, 1e-2, 1e-3, 1e-4];
    lumTicks.forEach(l => {
      const y = lumToY(l);
      lines.push(`<line class="grid-line" x1="${PLOT.x0}" y1="${y}" x2="${PLOT.x1}" y2="${y}"/>`);
    });
    el.grid.innerHTML = lines.join("");
  }

  function initAxes() {
    const parts = [];
    // 轴线
    parts.push(`<line class="axis" x1="${PLOT.x0}" y1="${PLOT.y1}" x2="${PLOT.x1}" y2="${PLOT.y1}"/>`);
    parts.push(`<line class="axis" x1="${PLOT.x0}" y1="${PLOT.y0}" x2="${PLOT.x0}" y2="${PLOT.y1}"/>`);
    // 温度刻度标签
    const tempTicks = [40000, 30000, 20000, 10000, 7500, 6000, 5000, 4000, 3000, 2500];
    tempTicks.forEach(t => {
      const x = tempToX(t);
      const label = t >= 1000 ? `${(t/1000).toFixed(0)}k` : `${t}`;
      parts.push(`<text class="tick-label" x="${x}" y="${PLOT.y1 + 16}" text-anchor="middle">${label}</text>`);
    });
    // 光度刻度标签
    const lumTicks = [1e5, 1e4, 1e3, 1e2, 1e1, 1, 1e-1, 1e-2, 1e-3];
    lumTicks.forEach(l => {
      const y = lumToY(l);
      const exp = Math.round(Math.log10(l));
      parts.push(`<text class="tick-label" x="${PLOT.x0 - 8}" y="${y + 4}" text-anchor="end">10${superscript(exp)}</text>`);
    });
    // 轴标题
    parts.push(`<text class="axis-title" x="${(PLOT.x0+PLOT.x1)/2}" y="${PLOT.y1 + 38}" text-anchor="middle">表面温度 (K) ←热  冷→</text>`);
    parts.push(`<text class="axis-title" x="20" y="${(PLOT.y0+PLOT.y1)/2}" text-anchor="middle" transform="rotate(-90 20 ${(PLOT.y0+PLOT.y1)/2})">光度 L/L☉</text>`);
    el.axes.innerHTML = parts.join("");
  }

  function superscript(n) {
    const map = { "-":"⁻", "0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹" };
    return String(n).split("").map(c => map[c] || c).join("");
  }

  // ── 绘制区域带 ────────────────────────────────────────
  function initRegions() {
    const parts = [];
    // 主序带：从 (40000K, 1e5) 到 (2500K, 1e-4) 的弯曲带
    const msPoints = [
      [40000, 8e5], [30000, 3e5], [20000, 5e4], [10000, 80], [7500, 20], [6000, 2], [5000, 0.3], [4000, 0.08], [3000, 0.01], [2500, 0.002]
    ];
    const msUpper = msPoints.map(([t,l]) => `${tempToX(t)},${lumToY(l)}`).join(" ");
    const msLower = [...msPoints].reverse().map(([t,l]) => {
      const ll = Math.log10(l);
      return `${tempToX(t)},${lumToY(Math.pow(10, ll - 0.9))}`;
    }).join(" ");
    parts.push(`<polygon class="ms-band" points="${msUpper} ${msLower}"/>`);
    // 巨星区
    parts.push(`<rect class="giant-region" x="${tempToX(7000)}" y="${lumToY(1e4)}" width="${tempToX(3000)-tempToX(7000)}" height="${lumToY(50)-lumToY(1e4)}"/>`);
    // 超巨星区
    parts.push(`<rect class="giant-region" x="${tempToX(40000)}" y="${lumToY(1e6)}" width="${tempToX(2500)-tempToX(40000)}" height="${lumToY(1e4)-lumToY(1e6)}"/>`);
    // 白矮星区
    parts.push(`<rect class="wd-region" x="${tempToX(40000)}" y="${lumToY(1)}" width="${tempToX(5000)-tempToX(40000)}" height="${lumToY(1e-4)-lumToY(1)}"/>`);
    // 区域标签
    parts.push(`<text class="legend-item" x="${tempToX(10000)}" y="${lumToY(3e4)}" text-anchor="middle" fill="#08758a" font-weight="700">主序带</text>`);
    parts.push(`<text class="legend-item" x="${tempToX(5000)}" y="${lumToY(2e3)}" text-anchor="middle" fill="#b45309">巨星</text>`);
    parts.push(`<text class="legend-item" x="${tempToX(15000)}" y="${lumToY(3e5)}" text-anchor="middle" fill="#b91c1c">超巨星</text>`);
    parts.push(`<text class="legend-item" x="${tempToX(20000)}" y="${lumToY(0.05)}" text-anchor="middle" fill="#64748b">白矮星</text>`);
    el.regions.innerHTML = parts.join("");
  }

  // ── 绘制样本恒星 ──────────────────────────────────────
  function renderSamples() {
    const parts = [];
    STAR_SAMPLES.forEach(s => {
      const x = tempToX(s.temp);
      const y = lumToY(s.lum);
      const color = tempToColor(s.temp);
      const r = s.type === "whiteDwarf" ? 3 : s.type === "supergiant" ? 7 : 5;
      parts.push(`<circle class="star-sample" data-type="${s.type}" cx="${x}" cy="${y}" r="${r}" fill="${color}" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>`);
      parts.push(`<text class="star-label" x="${x + r + 3}" y="${y + 3}">${s.name}</text>`);
    });
    el.samples.innerHTML = parts.join("");
  }

  function updateSampleVisibility() {
    document.querySelectorAll(".star-sample").forEach(c => {
      const t = c.getAttribute("data-type");
      c.style.opacity = state.showTypes[t] ? "1" : "0.15";
    });
  }

  // ── 渲染主标记 ────────────────────────────────────────
  function render() {
    const x = tempToX(state.temp);
    const y = lumToY(state.lum);
    const color = tempToColor(state.temp);
    el.starCore.setAttribute("cx", x);
    el.starCore.setAttribute("cy", y);
    el.starCore.setAttribute("fill", color);
    el.starHalo.setAttribute("cx", x);
    el.starHalo.setAttribute("cy", y);
    // 轨迹
    if (state.trail.length > 1) {
      el.trailLine.setAttribute("points", state.trail.map(p => `${tempToX(p.temp)},${lumToY(p.lum)}`).join(" "));
    } else {
      el.trailLine.setAttribute("points", "");
    }
    // 读数
    const mag = luminosityToAbsMag(state.lum);
    const rad = computeRadius(state.temp, state.lum);
    el.tempReadout.textContent = `${Math.round(state.temp)} K`;
    el.lumReadout.textContent = state.lum >= 100 ? state.lum.toFixed(0) : state.lum >= 1 ? state.lum.toFixed(2) : state.lum.toExponential(2);
    el.magReadout.textContent = `${mag >= 0 ? "+" : ""}${mag.toFixed(2)}`;
    el.radReadout.textContent = rad >= 100 ? rad.toFixed(0) : rad >= 1 ? rad.toFixed(2) : rad.toExponential(2);
    el.tempOutput.textContent = `${Math.round(state.temp)} K`;
    el.lumOutput.textContent = state.lum >= 100 ? state.lum.toFixed(0) : state.lum >= 1 ? state.lum.toFixed(2) : state.lum.toExponential(2);
    // 洞察
    updateInsight();
  }

  function updateInsight() {
    const region = classifyStar(state.temp, state.lum);
    const rad = computeRadius(state.temp, state.lum);
    const mag = luminosityToAbsMag(state.lum);
    let text = "";
    switch (region) {
      case "mainSequence":
        text = `当前恒星位于主序带。主序星通过核心氢聚变产能，光度主要由质量决定。半径≈${formatRad(rad)}，M=${mag.toFixed(1)}。`;
        break;
      case "giant":
        text = `当前恒星位于巨星支。它已离开主序，外壳膨胀冷却，半径达${formatRad(rad)}太阳半径。`;
        break;
      case "supergiant":
        text = `当前恒星位于超巨星区。这是质量最大、光度最高的恒星，半径达${formatRad(rad)}太阳半径，寿命短暂。`;
        break;
      case "whiteDwarf":
        text = `当前恒星位于白矮星区。它是低光度、高温度的恒星残骸，半径仅${formatRad(rad)}太阳半径，不再进行核聚变。`;
        break;
    }
    el.insight.textContent = text;
  }

  function formatRad(r) {
    if (r >= 100) return r.toFixed(0);
    if (r >= 1) return r.toFixed(1);
    return r.toExponential(2);
  }

  // ── 拖动交互 ──────────────────────────────────────────
  let dragging = false;
  function getSVGPoint(evt) {
    const pt = el.scene.createSVGPoint();
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    pt.x = clientX; pt.y = clientY;
    return pt.matrixTransform(el.scene.getScreenCTM().inverse());
  }
  function onPointerDown(evt) {
    evt.preventDefault();
    dragging = true;
    onPointerMove(evt);
  }
  function onPointerMove(evt) {
    if (!dragging) return;
    evt.preventDefault();
    const p = getSVGPoint(evt);
    const x = Math.max(PLOT.x0, Math.min(PLOT.x1, p.x));
    const y = Math.max(PLOT.y0, Math.min(PLOT.y1, p.y));
    state.temp = xToTemp(x);
    state.lum = yToLum(y);
    el.tempInput.value = String(Math.round(state.temp));
    el.lumInput.value = state.lum >= 1 ? String(state.lum) : String(state.lum);
    addTrailPoint();
    render();
  }
  function onPointerUp() { dragging = false; }

  function addTrailPoint() {
    const last = state.trail[state.trail.length - 1];
    if (!last || Math.abs(last.temp - state.temp) / state.temp > 0.02 || Math.abs(Math.log10(Math.max(1e-10,last.lum)) - Math.log10(Math.max(1e-10,state.lum))) > 0.05) {
      state.trail.push({ temp: state.temp, lum: state.lum });
      if (state.trail.length > 80) state.trail.shift();
    }
  }

  // ── 动画：演示恒星演化 ────────────────────────────────
  // 简化演化路径：主序→红巨星→白矮星
  const evolutionPath = [
    { temp: 5800, lum: 1, label: "主序（类太阳）" },
    { temp: 4900, lum: 3, label: "亚巨星" },
    { temp: 3800, lum: 200, label: "红巨星" },
    { temp: 3200, lum: 3000, label: "渐近巨星支" },
    { temp: 100000, lum: 0.1, label: "行星状星云核心" },
    { temp: 25000, lum: 0.02, label: "白矮星" },
    { temp: 8000, lum: 0.003, label: "冷却白矮星" },
  ];

  function update(dt) {
    if (!state.running) return;
    state.animPhase += dt * 0.15;
    const totalSegs = evolutionPath.length - 1;
    const seg = Math.floor(state.animPhase) % totalSegs;
    const frac = state.animPhase - Math.floor(state.animPhase);
    const a = evolutionPath[seg];
    const b = evolutionPath[seg + 1];
    // 对数插值
    const logLumA = Math.log10(a.lum);
    const logLumB = Math.log10(b.lum);
    const logTempA = Math.log10(a.temp);
    const logTempB = Math.log10(b.temp);
    state.temp = Math.pow(10, logTempA + (logTempB - logTempA) * frac);
    state.lum = Math.pow(10, logLumA + (logLumB - logLumA) * frac);
    el.tempInput.value = String(Math.round(state.temp));
    el.lumInput.value = state.lum >= 1 ? String(state.lum) : String(state.lum);
    addTrailPoint();
    render();
    // 更新状态标签
    const labelIdx = Math.round(state.animPhase) % evolutionPath.length;
    el.status.textContent = evolutionPath[labelIdx].label;
  }

  // ── 控制 ──────────────────────────────────────────────
  function start() {
    state.running = true;
    el.status.textContent = "演化中";
    el.startBtn.setAttribute("aria-pressed", "true");
  }
  function pause() {
    state.running = false;
    el.status.textContent = "已暂停";
    el.startBtn.setAttribute("aria-pressed", "false");
  }
  function reset() {
    pause();
    state.temp = 5800;
    state.lum = 1;
    state.trail = [{ temp: 5800, lum: 1 }];
    state.animPhase = 0;
    el.tempInput.value = "5800";
    el.lumInput.value = "1";
    el.status.textContent = "已就绪";
    render();
  }
  function setParameters(values) {
    if (values.temp !== undefined) state.temp = Math.max(2500, Math.min(40000, Number(values.temp) || 5800));
    if (values.lum !== undefined) state.lum = Math.max(0.001, Math.min(100000, Number(values.lum) || 1));
    if (state.running) pause();
    addTrailPoint();
    render();
  }
  function getState() { return { ...state, trail: state.trail.map(p => ({ ...p })) }; }
  function getReadouts() {
    return {
      temp: state.temp,
      lum: state.lum,
      absMag: luminosityToAbsMag(state.lum),
      radius: computeRadius(state.temp, state.lum),
      region: classifyStar(state.temp, state.lum),
    };
  }

  function runModelChecks() {
    const checks = [];
    // 1. 太阳半径≈1
    const rSun = computeRadius(5772, 1);
    checks.push({ name: "太阳半径≈1", pass: Math.abs(rSun - 1) < 0.05, expected: 1, actual: rSun, tolerance: 0.05 });
    // 2. 太阳绝对星等≈4.83
    const mSun = luminosityToAbsMag(1);
    checks.push({ name: "太阳绝对星等≈4.83", pass: Math.abs(mSun - 4.83) < 0.1, expected: 4.83, actual: mSun, tolerance: 0.1 });
    // 3. 温度反向轴：高温在左
    const xHot = tempToX(40000);
    const xCold = tempToX(2500);
    checks.push({ name: "温度轴反向（高温在左）", pass: xHot < xCold, expected: "x(40000K) < x(2500K)", actual: `${xHot} < ${xCold}`, tolerance: "strict" });
    // 4. 光度对数轴：高光度在上
    const yBright = lumToY(1e5);
    const yDim = lumToY(1e-4);
    checks.push({ name: "光度轴对数（高光度在上）", pass: yBright < yDim, expected: "y(1e5) < y(1e-4)", actual: `${yBright} < ${yDim}`, tolerance: "strict" });
    // 5. 分类逻辑
    checks.push({ name: "太阳分类为主序", pass: classifyStar(5800, 1) === "mainSequence", expected: "mainSequence", actual: classifyStar(5800, 1), tolerance: "strict" });
    checks.push({ name: "参宿四分类为超巨星", pass: classifyStar(3500, 126000) === "supergiant", expected: "supergiant", actual: classifyStar(3500, 126000), tolerance: "strict" });
    checks.push({ name: "天狼星B分类为白矮星", pass: classifyStar(25000, 0.026) === "whiteDwarf", expected: "whiteDwarf", actual: classifyStar(25000, 0.026), tolerance: "strict" });
    // 6. 坐标往返一致性
    const t1 = 10000;
    const x1 = tempToX(t1);
    const t1r = xToTemp(x1);
    checks.push({ name: "温度坐标往返一致", pass: Math.abs(t1 - t1r) / t1 < 0.01, expected: t1, actual: t1r, tolerance: 0.01 });
    const l1 = 100;
    const y1 = lumToY(l1);
    const l1r = yToLum(y1);
    checks.push({ name: "光度坐标往返一致", pass: Math.abs(Math.log10(l1) - Math.log10(l1r)) < 0.01, expected: l1, actual: l1r, tolerance: 0.01 });
    return checks;
  }

  // ── 绑定 ──────────────────────────────────────────────
  function bindControls() {
    el.startBtn.addEventListener("click", start);
    el.pauseBtn.addEventListener("click", pause);
    el.resetBtn.addEventListener("click", reset);
    el.tempInput.addEventListener("input", () => {
      state.temp = Number(el.tempInput.value);
      if (state.running) pause();
      addTrailPoint();
      render();
    });
    el.lumInput.addEventListener("input", () => {
      state.lum = Number(el.lumInput.value);
      if (state.running) pause();
      addTrailPoint();
      render();
    });
    // 拖动
    el.starCore.addEventListener("mousedown", onPointerDown);
    el.starHalo.addEventListener("mousedown", onPointerDown);
    el.scene.addEventListener("mousedown", (e) => {
      // 点击绘图区也可移动恒星
      if (e.target === el.scene || e.target.tagName === "rect" || e.target.classList.contains("ms-band")) {
        onPointerDown(e);
      }
    });
    window.addEventListener("mousemove", onPointerMove);
    window.addEventListener("mouseup", onPointerUp);
    el.starCore.addEventListener("touchstart", onPointerDown, { passive: false });
    el.scene.addEventListener("touchstart", (e) => {
      if (e.target === el.scene || e.target.tagName === "rect" || e.target.classList.contains("ms-band")) {
        onPointerDown(e);
      }
    }, { passive: false });
    window.addEventListener("touchmove", onPointerMove, { passive: false });
    window.addEventListener("touchend", onPointerUp);
    // 族群切换
    document.querySelectorAll(".type-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const type = btn.getAttribute("data-type");
        state.showTypes[type] = !state.showTypes[type];
        btn.classList.toggle("active", state.showTypes[type]);
        updateSampleVisibility();
      });
    });
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = Math.min(0.05, (timestamp - state.lastTimestamp) / 1000);
    state.lastTimestamp = timestamp;
    update(dt);
    requestAnimationFrame(frame);
  }

  function init() {
    initRegions();
    initGrid();
    initAxes();
    renderSamples();
    bindControls();
    render();
    requestAnimationFrame(frame);
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
