  <style>

<body>
  <div class="app" data-layout="visualization-first" data-model-tier="analytic">
    <header class="header" data-region="header">
      <div class="header-left">
        <h1>莫比乌斯环 · 只有一个面的世界</h1>
        <p>沿中线走完一圈，回到原点却已遍历"两面"——因为没有对面可翻越</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">第一幕 · 爬行</div>
    </header>

    <section class="stage-wrap" data-region="stage">
      <canvas id="scene" aria-label="莫比乌斯环三维透视动画"></canvas>
      <div class="overlay">
        <div class="act-label">第 <strong id="actNum">一</strong> 幕 · <span id="actName">沿中线爬行</span></div>
        <div class="readout">
          <div class="label">已走弧长</div>
          <div class="value" id="distReadout">0.00 / 1.00 圈</div>
        </div>
      </div>
    </section>

    <section class="evidence" data-region="evidence" aria-label="实时读数与观察">
      <div class="readouts">
        <div class="metric"><small>当前幕</small><strong id="actReadout">一 · 爬行</strong></div>
        <div class="metric"><small>弧长 / 剪开</small><strong id="progressReadout">0.00 / 1.00 圈</strong></div>
        <div class="metric"><small>扭转次数</small><strong id="twistReadout">1 次</strong></div>
        <div class="metric"><small>自转速度</small><strong id="speedReadout">1.0×</strong></div>
      </div>
      <div class="insight" data-region="insight" id="insightText">蚂蚁沿中线爬行：走完一整圈 u∈[0,2π] 才回到起点，因为只有一个面，没有对面可翻越。</div>
    </section>

    <section class="controls" data-region="controls" aria-label="参数控制">
      <div class="control">
        <label for="twistInput" class="control-label">
          <span>扭转次数</span>
          <span class="val" id="twistVal">1 次（半圈）</span>
        </label>
        <input id="twistInput" type="range" min="0" max="2" step="1" value="1" aria-label="扭转次数">
      </div>
      <div class="control">
        <label for="speedInput" class="control-label">
          <span>自转速度</span>
          <span class="val" id="speedVal">1.0×</span>
        </label>
        <input id="speedInput" type="range" min="0" max="2.5" step="0.1" value="1.0" aria-label="自转速度">
      </div>
      <div class="btn-group">
        <button id="replayBtn" type="button">重播本幕</button>
        <button id="skipBtn" class="primary" type="button">跳到剪开</button>
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";

    // ========== 参数 schema ==========
    const parameterSchema = [
      { key: "twists", label: "扭转次数", type: "slider", min: 0, max: 2, step: 1, default: 1, unit: "次" },
      { key: "speed", label: "自转速度", type: "slider", min: 0, max: 2.5, step: 0.1, default: 1.0, unit: "×" }
    ];

    // ========== 状态 ==========
    const state = {
      running: true,
      t: 0,              // 全局动画时间（秒）
      twists: 1,
      speed: 1.0,
      lastTimestamp: null,
      act: 1,            // 1 = 爬行, 2 = 剪开
      actTime: 0,        // 当前幕的局部时间
      antProgress: 0,    // 蚂蚁沿中线的进度 [0,1]
      cutProgress: 0,    // 剪开进度 [0,1]
      trail: [],         // 蚂蚁拖尾
      introAlpha: 0,     // 开场标题淡入
      actTransition: 1,  // 幕间淡入淡出
      skipRequested: false
    };

    // ========== 几何参数 ==========
    const R = 1.0;           // 环半径
    const W = 0.42;          // 带宽
    const CAM_DIST = 4.2;    // 相机距离
    const FOCAL = 2.6;       // 焦距
    const TILT = 0.28;       // 俯视角（约16度）

    // ========== Canvas ==========
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    let cw = 0, ch = 0, dpr = 1;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = canvas.getBoundingClientRect();
      cw = rect.width;
      ch = rect.height;
      canvas.width = Math.floor(cw * dpr);
      canvas.height = Math.floor(ch * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);

    // ========== 几何函数 ==========

    // 带子参数方程：u∈[0,2π] 环向，v∈[-W/2,W/2] 横向
    // n=1 莫比乌斯，n=0 普通环，n=2 双面扭转环
    function surfacePoint(u, v, n) {
      const nu = n * u / 2;
      const cosNu = Math.cos(nu);
      const sinNu = Math.sin(nu);
      const cosU = Math.cos(u);
      const sinU = Math.sin(u);
      return {
        x: (R + v * cosNu) * cosU,
        y: (R + v * cosNu) * sinU,
        z: v * sinNu
      };
    }

    // 中线点（v=0）
    function midlinePoint(u) {
      return { x: R * Math.cos(u), y: R * Math.sin(u), z: 0 };
    }

    // 3D 旋转（绕 Y 轴）+ 倾斜 + 透视投影
    function project(p, rotY) {
      const cosY = Math.cos(rotY);
      const sinY = Math.sin(rotY);
      // 绕 Y 轴旋转
      const x1 = p.x * cosY + p.z * sinY;
      const y1 = p.y;
      const z1 = -p.x * sinY + p.z * cosY;
      // 倾斜（绕 X 轴）
      const cosT = Math.cos(TILT);
      const sinT = Math.sin(TILT);
      const y2 = y1 * cosT - z1 * sinT;
      const z2 = y1 * sinT + z1 * cosT;
      // 透视
      const depth = CAM_DIST - z2;
      if (depth < 0.1) return { x: 0, y: 0, depth: 0.1, valid: false };
      const scale = FOCAL / depth;
      return {
        x: cw / 2 + x1 * scale * 180,
        y: ch / 2 - y2 * scale * 180,
        depth: depth,
        scale: scale,
        valid: true
      };
    }

    // ========== 绘制 ==========

    function drawBackground() {
      // 径向渐变背景
      const grad = ctx.createRadialGradient(cw / 2, ch * 0.45, 0, cw / 2, ch * 0.45, Math.max(cw, ch) * 0.7);
      grad.addColorStop(0, "#0a1228");
      grad.addColorStop(0.5, "#060a18");
      grad.addColorStop(1, "#000000");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, cw, ch);

      // 细网格（不透明度 6%）
      ctx.strokeStyle = "rgba(80, 110, 160, 0.06)";
      ctx.lineWidth = 1;
      const gridSize = 60;
      ctx.beginPath();
      for (let x = (cw / 2) % gridSize; x < cw; x += gridSize) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, ch);
      }
      for (let y = (ch / 2) % gridSize; y < ch; y += gridSize) {
        ctx.moveTo(0, y);
        ctx.lineTo(cw, y);
      }
      ctx.stroke();
    }

    // 绘制带子（分前后两半，画家算法）
    function drawBand(rotY, n, cutProgress) {
      const segments = 80;
      const halfWidth = W / 2;
      const vSteps = 6;

      // 收集所有四边形面片
      const quads = [];

      for (let i = 0; i < segments; i++) {
        const u0 = (i / segments) * Math.PI * 2;
        const u1 = ((i + 1) / segments) * Math.PI * 2;

        // 剪开时，带子从 u=0 处断开，两半各自展开
        // 简化：剪开后整环变长，这里用 cutProgress 插值展示
        const isCut = cutProgress > 0;

        for (let j = 0; j < vSteps; j++) {
          const v0 = -halfWidth + (j / vSteps) * W;
          const v1 = -halfWidth + ((j + 1) / vSteps) * W;

          // 剪开后，带子展开：半径增大，宽度可见
          let rFactor = 1.0;
          let wFactor = 1.0;
          if (isCut) {
            // 剪开后半径增大（长度翻倍的视觉暗示）
            rFactor = 1.0 + cutProgress * 0.35;
            wFactor = 1.0 - cutProgress * 0.15;
          }

          const p0 = surfacePoint(u0, v0 * wFactor, n);
          const p1 = surfacePoint(u1, v0 * wFactor, n);
          const p2 = surfacePoint(u1, v1 * wFactor, n);
          const p3 = surfacePoint(u0, v1 * wFactor, n);

          // 应用半径缩放
          p0.x *= rFactor; p0.y *= rFactor;
          p1.x *= rFactor; p1.y *= rFactor;
          p2.x *= rFactor; p2.y *= rFactor;
          p3.x *= rFactor; p3.y *= rFactor;

          const proj0 = project(p0, rotY);
          const proj1 = project(p1, rotY);
          const proj2 = project(p2, rotY);
          const proj3 = project(p3, rotY);

          if (!proj0.valid || !proj1.valid || !proj2.valid || !proj3.valid) continue;

          // 平均深度（用于排序）
          const avgDepth = (proj0.depth + proj1.depth + proj2.depth + proj3.depth) / 4;

          // 计算法线方向（粗略，用于背面剔除和光照）
          const e1x = p1.x - p0.x, e1y = p1.y - p0.y, e1z = p1.z - p0.z;
          const e2x = p3.x - p0.x, e2y = p3.y - p0.y, e2z = p3.z - p0.z;
          const nx = e1y * e2z - e1z * e2y;
          const ny = e1z * e2x - e1x * e2z;
          const nz = e1x * e2y - e1y * e2x;
          const nlen = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
          const nxn = nx / nlen, nyn = ny / nlen, nzn = nz / nlen;

          // 光照方向（从右上方）
          const lx = 0.5, ly = 0.5, lz = 0.7;
          const dot = nxn * lx + nyn * ly + nzn * lz;
          const lightFactor = 0.4 + 0.6 * Math.max(0, dot);

          quads.push({
            pts: [proj0, proj1, proj2, proj3],
            depth: avgDepth,
            light: lightFactor,
            u: (u0 + u1) / 2
          });
        }
      }

      // 按深度排序（远到近）
      quads.sort((a, b) => b.depth - a.depth);

      // 绘制
      for (const q of quads) {
        ctx.beginPath();
        ctx.moveTo(q.pts[0].x, q.pts[0].y);
        ctx.lineTo(q.pts[1].x, q.pts[1].y);
        ctx.lineTo(q.pts[2].x, q.pts[2].y);
        ctx.lineTo(q.pts[3].x, q.pts[3].y);
        ctx.closePath();

        // 填充：青色，深度调整明度
        const depthFactor = Math.max(0.3, Math.min(1, (CAM_DIST + 1.5 - q.depth) / 3));
        const l = q.light * depthFactor;
        const r = Math.floor(0 + 60 * l);
        const g = Math.floor(80 + 150 * l);
        const b = Math.floor(120 + 135 * l);
        ctx.fillStyle = `rgba(${r},${g},${b},0.92)`;
        ctx.fill();

        // 边线（细）
        ctx.strokeStyle = `rgba(${Math.floor(40 + 80 * l)},${Math.floor(140 + 80 * l)},${Math.floor(180 + 75 * l)},0.5)`;
        ctx.lineWidth = 0.6;
        ctx.stroke();
      }
    }

    // 绘制中线（虚线参考）
    function drawMidline(rotY, n, cutProgress) {
      const steps = 120;
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const u = (i / steps) * Math.PI * 2;
        const p = surfacePoint(u, 0, n);
        // 剪开后半径变化
        if (cutProgress > 0) {
          const rFactor = 1.0 + cutProgress * 0.35;
          p.x *= rFactor; p.y *= rFactor;
        }
        const proj = project(p, rotY);
        if (!proj.valid) continue;
        if (i === 0) ctx.moveTo(proj.x, proj.y);
        else ctx.lineTo(proj.x, proj.y);
      }
      // 外层粗半透明描边（发光模拟）
      ctx.strokeStyle = "rgba(0, 212, 255, 0.18)";
      ctx.lineWidth = 5;
      ctx.stroke();
      // 内层实色
      ctx.strokeStyle = "rgba(0, 212, 255, 0.55)";
      ctx.lineWidth = 1.2;
      ctx.setLineDash([4, 6]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 绘制蚂蚁（金色光点）+ 拖尾
    function drawAnt(rotY, n) {
      if (state.act !== 1 && state.actTransition >= 1) return;

      const u = state.antProgress * Math.PI * 2;
      const p = surfacePoint(u, 0, n);
      const proj = project(p, rotY);
      if (!proj.valid) return;

      // 拖尾
      for (let i = 0; i < state.trail.length; i++) {
        const tp = state.trail[i];
        const tProj = project(tp, rotY);
        if (!tProj.valid) continue;
        const alpha = (i / state.trail.length) * 0.6;
        const radius = 1.5 + (i / state.trail.length) * 2;
        ctx.beginPath();
        ctx.arc(tProj.x, tProj.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 200, 60, ${alpha})`;
        ctx.fill();
      }

      // 蚂蚁光点：外层粗半透明（发光）
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, 12, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 200, 60, 0.15)";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(proj.x, proj.y, 7, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 200, 60, 0.35)";
      ctx.fill();

      // 内层实色
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 230, 100, 1)";
      ctx.fill();

      // 中心高光
      ctx.beginPath();
      ctx.arc(proj.x - 0.8, proj.y - 0.8, 1.2, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 255, 220, 1)";
      ctx.fill();
    }

    // 绘制蚂蚁走过的亮金色路径
    function drawAntPath(rotY, n) {
      if (state.act !== 1 || state.antProgress < 0.01) return;

      const steps = Math.max(2, Math.floor(state.antProgress * 120));
      const pts = [];
      for (let i = 0; i <= steps; i++) {
        const u = (i / 120) * Math.PI * 2;
        const p = surfacePoint(u, 0, n);
        const proj = project(p, rotY);
        if (proj.valid) pts.push(proj);
      }

      if (pts.length < 2) return;

      // 外层粗半透明描边（发光）
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.strokeStyle = "rgba(255, 200, 60, 0.25)";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.stroke();

      // 内层实色
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.strokeStyle = "rgba(255, 220, 80, 0.85)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // 绘制剪刀光线（第二幕）
    function drawCutBeam(rotY, n) {
      if (state.act !== 2 || state.cutProgress >= 1) return;

      const u = state.cutProgress * Math.PI * 2;
      const p = surfacePoint(u, 0, n);
      const proj = project(p, rotY);
      if (!proj.valid) return;

      // 光线脉冲（外层）
      const pulse = 0.5 + 0.5 * Math.sin(state.t * 8);
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, 18 + pulse * 6, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 100, 100, ${0.08 + pulse * 0.06})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(proj.x, proj.y, 10, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 150, 150, 0.3)";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(proj.x, proj.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 255, 255, 1)";
      ctx.fill();

      // 已剪开部分用红色虚线标出
      if (state.cutProgress > 0.01) {
        const cutSteps = Math.max(2, Math.floor(state.cutProgress * 120));
        ctx.beginPath();
        for (let i = 0; i <= cutSteps; i++) {
          const cu = (i / 120) * Math.PI * 2;
          const cp = surfacePoint(cu, 0, n);
          const cproj = project(cp, rotY);
          if (!cproj.valid) continue;
          if (i === 0) ctx.moveTo(cproj.x, cproj.y);
          else ctx.lineTo(cproj.x, cproj.y);
        }
        ctx.strokeStyle = "rgba(255, 80, 80, 0.3)";
        ctx.lineWidth = 5;
        ctx.stroke();
        ctx.strokeStyle = "rgba(255, 120, 120, 0.8)";
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // 绘制开场标题
    function drawIntro() {
      if (state.introAlpha >= 1) return;
      const alpha = 1 - state.introAlpha;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "rgba(232, 241, 255, 0.9)";
      ctx.font = "300 1.8rem ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("只有一个面的世界", cw / 2, ch / 2 - 20);
      ctx.font = "400 0.9rem ui-sans-serif, system-ui";
      ctx.fillStyle = "rgba(107, 122, 153, 0.8)";
      ctx.fillText("莫比乌斯环 · Möbius Band", cw / 2, ch / 2 + 16);
      ctx.restore();
    }

    // 绘制结尾字幕
    function drawEnding() {
      if (state.act !== 2 || state.cutProgress < 0.7) return;
      const alpha = Math.min(1, (state.cutProgress - 0.7) / 0.2);
      ctx.save();
      ctx.globalAlpha = alpha * 0.9;
      ctx.fillStyle = "rgba(232, 241, 255, 0.95)";
      ctx.font = "300 1.3rem ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("有些路走完一圈才发现", cw / 2, ch / 2 - 16);
      ctx.fillText("根本没有对面", cw / 2, ch / 2 + 16);
      ctx.restore();
    }

    // ========== 更新 ==========

    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    function update(dt) {
      if (!state.running) return;
      const boundedDt = Math.min(Math.max(dt, 0), 0.05);

      state.t += boundedDt * state.speed;

      // 开场淡出
      if (state.introAlpha < 1) {
        state.introAlpha = Math.min(1, state.introAlpha + boundedDt / 2.0);
      }

      // 幕间过渡
      if (state.actTransition < 1) {
        state.actTransition = Math.min(1, state.actTransition + boundedDt / 0.8);
      }

      state.actTime += boundedDt * state.speed;

      if (state.act === 1) {
        // 第一幕：蚂蚁爬行，14秒走完一圈
        const crawlDuration = 14;
        const rawProgress = state.actTime / crawlDuration;
        state.antProgress = easeInOut(Math.min(1, rawProgress));

        // 记录拖尾
        const u = state.antProgress * Math.PI * 2;
        const p = surfacePoint(u, 0, state.twists);
        state.trail.push({ x: p.x, y: p.y, z: p.z });
        if (state.trail.length > 30) state.trail.shift();

        // 爬完一圈，切换到第二幕
        if (rawProgress >= 1 && state.actTransition >= 1) {
          state.act = 2;
          state.actTime = 0;
          state.actTransition = 0;
          state.cutProgress = 0;
        }
      } else if (state.act === 2) {
        // 第二幕：剪开，8秒
        const cutDuration = 8;
        state.cutProgress = easeInOut(Math.min(1, state.actTime / cutDuration));

        // 剪完后等待 4 秒，重置循环
        if (state.actTime > cutDuration + 4) {
          resetActs();
        }
      }
    }

    function resetActs() {
      state.act = 1;
      state.actTime = 0;
      state.antProgress = 0;
      state.cutProgress = 0;
      state.trail = [];
      state.actTransition = 0;
    }

    // ========== 渲染 ==========

    function render() {
      ctx.clearRect(0, 0, cw, ch);
      drawBackground();

      // 自转角度
      const rotY = state.t * 0.15;

      // 幕间淡入淡出遮罩
      let alpha = 1;
      if (state.actTransition < 1) {
        // 0->0.5 淡出，0.5->1 淡入
        alpha = state.actTransition < 0.5
          ? 1 - state.actTransition * 2
          : (state.actTransition - 0.5) * 2;
      }

      ctx.save();
      ctx.globalAlpha = alpha;

      drawBand(rotY, state.twists, state.cutProgress);
      drawMidline(rotY, state.twists, state.cutProgress);

      if (state.act === 1) {
        drawAntPath(rotY, state.twists);
        drawAnt(rotY, state.twists);
      } else if (state.act === 2) {
        drawCutBeam(rotY, state.twists);
      }

      ctx.restore();

      drawIntro();
      drawEnding();
      updateOverlay();
      updateEvidence();
    }

    function updateOverlay() {
      const actNumEl = document.getElementById("actNum");
      const actNameEl = document.getElementById("actName");
      const distEl = document.getElementById("distReadout");
      const statusEl = document.getElementById("status");

      if (state.act === 1) {
        actNumEl.textContent = "一";
        actNameEl.textContent = "沿中线爬行";
        statusEl.textContent = "第一幕 · 爬行";
        distEl.textContent = `${state.antProgress.toFixed(2)} / 1.00 圈`;
      } else {
        actNumEl.textContent = "二";
        actNameEl.textContent = "沿中线剪开";
        statusEl.textContent = "第二幕 · 剪开";
        const cutPct = (state.cutProgress * 100).toFixed(0);
        distEl.textContent = `剪开 ${cutPct}%`;
      }
    }

    function updateEvidence() {
      const actReadout = document.getElementById("actReadout");
      const progressReadout = document.getElementById("progressReadout");
      const twistReadout = document.getElementById("twistReadout");
      const speedReadout = document.getElementById("speedReadout");
      const insightText = document.getElementById("insightText");

      if (state.act === 1) {
        actReadout.textContent = "一 · 爬行";
        progressReadout.textContent = `${state.antProgress.toFixed(2)} / 1.00 圈`;
        if (state.antProgress < 0.01) {
          insightText.textContent = "蚂蚁沿中线爬行：走完一整圈 u∈[0,2π] 才回到起点，因为只有一个面，没有对面可翻越。";
        } else if (state.antProgress < 0.5) {
          insightText.textContent = "蚂蚁正在前进：注意它始终贴着同一条带子表面，没有"翻到背面"的动作。";
        } else if (state.antProgress < 0.99) {
          insightText.textContent = "已过半圈：带子的扭转使蚂蚁悄无声息地"换边"，但它从未离开表面。";
        } else {
          insightText.textContent = "回到起点：一圈走完，蚂蚁遍历了整条带子——这就是"只有一个面"。";
        }
      } else {
        actReadout.textContent = "二 · 剪开";
        const cutPct = (state.cutProgress * 100).toFixed(0);
        progressReadout.textContent = `剪开 ${cutPct}%`;
        if (state.cutProgress < 0.01) {
          insightText.textContent = "沿中线剪开：观察剪开后的形状——莫比乌斯环不会变成两个环，而是变成一条更长的双面环。";
        } else if (state.cutProgress < 0.7) {
          insightText.textContent = "正在剪开：带子展开变长，半径增大，宽度收窄——这是长度翻倍的视觉暗示。";
        } else {
          insightText.textContent = "剪开完成：得到一条双面扭转环，长度为原来的两倍——单面性被破坏了。";
        }
      }

      const twistLabels = ["0 次", "1 次", "2 次"];
      twistReadout.textContent = twistLabels[state.twists] || `${state.twists} 次`;
      speedReadout.textContent = `${state.speed.toFixed(1)}×`;
    }

    // ========== 生命周期 ==========

    function start() { state.running = true; }
    function pause() { state.running = false; }
    function reset() {
      state.t = 0;
      state.actTime = 0;
      state.act = 1;
      state.antProgress = 0;
      state.cutProgress = 0;
      state.trail = [];
      state.actTransition = 1;
      state.introAlpha = 0;
      state.lastTimestamp = null;
    }
    function setParameters(values) {
      if (values.twists !== undefined) {
        state.twists = Math.min(2, Math.max(0, Number(values.twists) || 1));
      }
      if (values.speed !== undefined) {
        state.speed = Math.min(2.5, Math.max(0, Number(values.speed) || 1.0));
      }
      updateControlLabels();
    }
    function getState() {
      return { ...state, trail: state.trail.map(p => ({ ...p })) };
    }
    function getReadouts() {
      return {
        act: state.act,
        antProgress: state.antProgress,
        cutProgress: state.cutProgress,
        twists: state.twists,
        speed: state.speed,
        time: state.t
      };
    }

    function updateControlLabels() {
      const twistLabels = ["0 次（普通环）", "1 次（莫比乌斯环）", "2 次（双面扭转环）"];
      document.getElementById("twistVal").textContent = twistLabels[state.twists] || `${state.twists} 次`;
      document.getElementById("speedVal").textContent = `${state.speed.toFixed(1)}×`;
    }

    // ========== 模型校验 ==========

    function runModelChecks() {
      // 校验1：n=0 时带子是普通环，法线方向一致
      // 校验2：n=1 时带子是莫比乌斯环，u=0 和 u=2π 处法线翻转
      // 校验3：n=2 时法线在 u=0 和 u=2π 处一致
      // 校验4：中线点在 v=0 时 z=0
      // 校验5：蚂蚁走完 u∈[0,2π] 回到起点

      const checks = [];

      // 检查1：v=0 时 z 恒为 0（中线在赤道面）
      let zZero = true;
      for (let i = 0; i <= 20; i++) {
        const u = (i / 20) * Math.PI * 2;
        const p = surfacePoint(u, 0, 1);
        if (Math.abs(p.z) > 1e-10) { zZero = false; break; }
      }
      checks.push({
        name: "中线 z=0（v=0 时 z 恒为零）",
        pass: zZero,
        expected: "z = 0",
        actual: zZero ? "z = 0" : "z ≠ 0",
        tolerance: "1e-10"
      });

      // 检查2：n=1 时 u=0 与 u=2π 的法线方向相反（单面性）
      // 法线方向由 ∂P/∂u × ∂P/∂v 给出
      function normalAt(u, n) {
        const du = 0.001;
        const dv = 0.001;
        const p = surfacePoint(u, 0, n);
        const pu = surfacePoint(u + du, 0, n);
        const pv = surfacePoint(u, dv, n);
        const ex = pu.x - p.x, ey = pu.y - p.y, ez = pu.z - p.z;
        const fx = pv.x - p.x, fy = pv.y - p.y, fz = pv.z - p.z;
        const nx = ey * fz - ez * fy;
        const ny = ez * fx - ex * fz;
        const nz = ex * fy - ey * fx;
        const len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
        return { x: nx / len, y: ny / len, z: nz / len };
      }

      const n0_start = normalAt(0.01, 1);
      const n0_end = normalAt(Math.PI * 2 - 0.01, 1);
      const dot1 = n0_start.x * n0_end.x + n0_start.y * n0_end.y + n0_start.z * n0_end.z;
      checks.push({
        name: "n=1 法线翻转（u=0 与 u=2π 法线点积为负）",
        pass: dot1 < -0.5,
        expected: "点积 < 0（法线反向）",
        actual: `点积 = ${dot1.toFixed(4)}`,
        tolerance: "< -0.5"
      });

      // 检查3：n=0 时法线一致（双面）
      const n0s = normalAt(0.01, 0);
      const n0e = normalAt(Math.PI * 2 - 0.01, 0);
      const dot0 = n0s.x * n0e.x + n0s.y * n0e.y + n0s.z * n0e.z;
      checks.push({
        name: "n=0 法线一致（普通环双面）",
        pass: dot0 > 0.5,
        expected: "点积 > 0（法线同向）",
        actual: `点积 = ${dot0.toFixed(4)}`,
        tolerance: "> 0.5"
      });

      // 检查4：n=2 时法线一致（双面扭转）
      const n2s = normalAt(0.01, 2);
      const n2e = normalAt(Math.PI * 2 - 0.01, 2);
      const dot2 = n2s.x * n2e.x + n2s.y * n2e.y + n2s.z * n2e.z;
      checks.push({
        name: "n=2 法线一致（双面扭转环）",
        pass: dot2 > 0.5,
        expected: "点积 > 0（法线同向）",
        actual: `点积 = ${dot2.toFixed(4)}`,
        tolerance: "> 0.5"
      });

      // 检查5：蚂蚁走完一圈回到起点坐标
      const start = surfacePoint(0, 0, 1);
      const end = surfacePoint(Math.PI * 2, 0, 1);
      const dist = Math.sqrt(
        (start.x - end.x) ** 2 + (start.y - end.y) ** 2 + (start.z - end.z) ** 2
      );
      checks.push({
        name: "蚂蚁走完 u∈[0,2π] 回到起点",
        pass: dist < 1e-10,
        expected: "距离 = 0",
        actual: `距离 = ${dist.toExponential(3)}`,
        tolerance: "1e-10"
      });

      // 检查6：投影函数对原点返回中心附近
      const originProj = project({ x: 0, y: 0, z: 0 }, 0);
      checks.push({
        name: "投影原点位于画面中心",
        pass: Math.abs(originProj.x - cw / 2) < 1 && Math.abs(originProj.y - ch / 2) < 1,
        expected: `(${cw / 2}, ${ch / 2})`,
        actual: `(${originProj.x.toFixed(1)}, ${originProj.y.toFixed(1)})`,
        tolerance: "1px"
      });

      return checks;
    }

    // ========== 事件绑定 ==========

    function bindControls() {
      const twistInput = document.getElementById("twistInput");
      const speedInput = document.getElementById("speedInput");
      const replayBtn = document.getElementById("replayBtn");
      const skipBtn = document.getElementById("skipBtn");

      twistInput.addEventListener("input", () => {
        setParameters({ twists: twistInput.value });
        // 改变扭转次数时重置当前幕
        resetActs();
      });
      speedInput.addEventListener("input", () => {
        setParameters({ speed: speedInput.value });
      });
      replayBtn.addEventListener("click", () => {
        resetActs();
      });
      skipBtn.addEventListener("click", () => {
        if (state.act === 1) {
          state.act = 2;
          state.actTime = 0;
          state.actTransition = 0;
          state.cutProgress = 0;
          state.antProgress = 1;
        } else {
          resetActs();
        }
      });
    }

    // ========== 主循环 ==========

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    // ========== 初始化 ==========

    function init() {
      resize();
      bindControls();
      setParameters({ twists: 1, speed: 1.0 });
      reset();
      requestAnimationFrame(frame);
    }

    window.simulation = {
      init, start, pause, reset, update, render,
      setParameters, getState, getReadouts, runModelChecks
    };

    init();
  })();
  </script>
</body>
