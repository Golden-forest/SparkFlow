<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>匀变速直线运动 · 频闪与 v-t 图像</h1>
      <p>拖动 v0 与 a，观察小车运动、频闪等时分布与 v-t 图像的同步对应</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head"><h2 id="scene-title">演示区 · 频闪小车</h2><span>等时间间隔记录位置（模拟打点计时器）</span></div>
      <canvas id="scene" role="img" aria-labelledby="scene-title scene-desc">
        <desc id="scene-desc">水平轨道上一辆小车做匀变速直线运动，上方频闪点等时记录位置。</desc>
      </canvas>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel chart-panel" aria-label="v-t 图像">
        <div class="panel-head"><h2>数据分析 · v-t 图像</h2><span>逐点采集 · 斜率 = a · 面积 = x</span></div>
        <canvas id="chart" role="img" aria-label="速度-时间图像"></canvas>
      </section>
      <section class="panel readouts" aria-label="实时读数">
        <div class="readout-grid">
          <div class="metric"><small>时间 t</small><strong id="tReadout">0.00 s</strong></div>
          <div class="metric"><small>位移 x</small><strong id="xReadout">0.00 m</strong><span class="formula">x = v0*t + 0.5*a*t^2</span></div>
          <div class="metric"><small>速度 v</small><strong id="vReadout">0.00 m/s</strong><span class="formula">v = v0 + a*t</span></div>
          <div class="metric"><small>加速度 a</small><strong id="aReadout">0.00 m/s^2</strong></div>
        </div>
      </section>
      <section class="panel insight-panel" data-region="insight" aria-label="观察提示">
        <div class="panel-head"><h2>观察提示</h2></div>
        <p id="insight" class="insight">按“开始”后观察：频闪点间距随时间如何变化，与 v-t 图像斜率如何对应。</p>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="控件">
    <div class="actions">
      <button id="startBtn" class="primary" type="button">开始</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control">
      <label for="v0Input">初速度 v0 <output id="v0Output">0.0 m/s</output></label>
      <input id="v0Input" type="range" min="0" max="10" step="0.1" value="0">
    </div>
    <div class="control">
      <label for="aInput">加速度 a <output id="aOutput">0.0 m/s^2</output></label>
      <input id="aInput" type="range" min="-3" max="3" step="0.1" value="0">
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";
  const parameterSchema = [
    { key: "v0", label: "初速度 v0", type: "slider", min: 0, max: 10, step: 0.1, default: 0, unit: "m/s" },
    { key: "a", label: "加速度 a", type: "slider", min: -3, max: 3, step: 0.1, default: 0, unit: "m/s^2" }
  ];
  const state = {
    running: false, t: 0, v0: 0, a: 0,
    lastTimestamp: null, history: [], flashSamples: [],
    trackStartM: 0, trackEndM: 20, trackLenM: 20,
    wrapCount: 0, lastSampleT: -1, lastSampleX: 0
  };
  const elements = {
    status: document.querySelector("#status"),
    scene: document.querySelector("#scene"), chart: document.querySelector("#chart"),
    tReadout: document.querySelector("#tReadout"), xReadout: document.querySelector("#xReadout"),
    vReadout: document.querySelector("#vReadout"), aReadout: document.querySelector("#aReadout"),
    v0Input: document.querySelector("#v0Input"), v0Output: document.querySelector("#v0Output"),
    aInput: document.querySelector("#aInput"), aOutput: document.querySelector("#aOutput"),
    startBtn: document.querySelector("#startBtn"), pauseBtn: document.querySelector("#pauseBtn"), resetBtn: document.querySelector("#resetBtn"),
    insight: document.querySelector("#insight")
  };
  const sceneCtx = elements.scene.getContext("2d");
  const chartCtx = elements.chart.getContext("2d");
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const flashInterval = 0.5;

  function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
  function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }
  function roundRect(ctx, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, Math.min(w, h) / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function setupCanvas(canvas, ctx) {
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(1, rect.width), h = Math.max(1, rect.height);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w, h };
  }

  function physicsAt(t) {
    const x = state.v0 * t + 0.5 * state.a * t * t;
    const v = state.v0 + state.a * t;
    return { x, v };
  }
  function getDisplayX() {
    const p = physicsAt(state.t);
    let x = p.x;
    while (x < state.trackStartM - 0.5) { x += state.trackLenM; state.wrapCount++; }
    while (x > state.trackEndM + 0.5) { x -= state.trackLenM; state.wrapCount--; }
    return { x, v: p.v, rawX: p.x };
  }

  function init() {
    bindControls();
    setParameters({ v0: 0, a: 0 });
    reset();
    requestAnimationFrame(frame);
  }
  function start() {
    state.running = true;
    elements.status.textContent = "运行中";
    elements.startBtn.setAttribute("aria-pressed", "true");
  }
  function pause() {
    state.running = false;
    elements.status.textContent = "已暂停";
    elements.startBtn.setAttribute("aria-pressed", "false");
  }
  function reset() {
    pause();
    state.t = 0; state.lastTimestamp = null;
    state.history = []; state.flashSamples = [];
    state.wrapCount = 0; state.lastSampleT = -1; state.lastSampleX = 0;
    render();
  }
  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05);
    state.t += boundedDt;
    const p = physicsAt(state.t);
    let displayX = p.x;
    while (displayX < state.trackStartM - 0.5) { displayX += state.trackLenM; state.wrapCount++; }
    while (displayX > state.trackEndM + 0.5) { displayX -= state.trackLenM; state.wrapCount--; }
    state.history.push({ t: state.t, v: p.v });
    if (state.history.length > 2000) state.history.shift();
    const nextSampleT = (Math.floor(state.t / flashInterval) + 1) * flashInterval;
    if (state.t >= nextSampleT - 1e-9 && state.lastSampleT < nextSampleT - 1e-9) {
      const sp = physicsAt(nextSampleT);
      let sx = sp.x;
      while (sx < state.trackStartM - 0.5) sx += state.trackLenM;
      while (sx > state.trackEndM + 0.5) sx -= state.trackLenM;
      state.flashSamples.push({ t: nextSampleT, x: sx, v: sp.v });
      if (state.flashSamples.length > 80) state.flashSamples.shift();
      state.lastSampleT = nextSampleT;
      state.lastSampleX = sx;
    }
  }
  function render() {
    const sceneSize = setupCanvas(elements.scene, sceneCtx);
    const chartSize = setupCanvas(elements.chart, chartCtx);
    renderScene(sceneCtx, sceneSize.w, sceneSize.h);
    renderChart(chartCtx, chartSize.w, chartSize.h);
    const p = physicsAt(state.t);
    let displayX = p.x;
    while (displayX < state.trackStartM - 0.5) displayX += state.trackLenM;
    while (displayX > state.trackEndM + 0.5) displayX -= state.trackLenM;
    elements.tReadout.textContent = state.t.toFixed(2) + " s";
    elements.xReadout.textContent = p.x.toFixed(2) + " m";
    elements.vReadout.textContent = p.v.toFixed(2) + " m/s";
    elements.aReadout.textContent = state.a.toFixed(2) + " m/s^2";
    elements.v0Output.textContent = state.v0.toFixed(1) + " m/s";
    elements.aOutput.textContent = state.a.toFixed(1) + " m/s^2";
    updateInsight(p);
  }
  function updateInsight(p) {
    if (!state.running && state.t === 0) {
      elements.insight.textContent = "按“开始”后观察：频闪点间距随时间如何变化，与 v-t 图像斜率如何对应。";
      return;
    }
    if (Math.abs(state.a) < 0.05) {
      elements.insight.textContent = "a ≈ 0：小车匀速运动，频闪点等距分布，v-t 图像是水平直线。";
    } else if (state.a > 0) {
      elements.insight.textContent = "a > 0：小车匀加速，频闪点间距逐渐变大，v-t 图像斜率为正。";
    } else {
      elements.insight.textContent = "a < 0：小车匀减速，频闪点间距逐渐变小，v-t 图像斜率为负。";
    }
  }
  function renderScene(ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    const padX = 36, padTop = 50, padBottom = 92;
    const trackY = h - padBottom;
    const trackW = w - 2 * padX;
    const mToPx = trackW / state.trackLenM;
    ctx.save();
    ctx.fillStyle = "rgba(15,159,186,0.05)";
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
    ctx.strokeStyle = "#c8d4e0";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= 20; i++) {
      const xM = state.trackStartM + i;
      const px = padX + (xM - state.trackStartM) * mToPx;
      ctx.moveTo(px, trackY + 22);
      ctx.lineTo(px, trackY + 30);
    }
    ctx.stroke();
    ctx.fillStyle = "#657188";
    ctx.font = "11px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    for (let i = 0; i <= 20; i += 2) {
      const xM = state.trackStartM + i;
      const px = padX + (xM - state.trackStartM) * mToPx;
      ctx.fillText(xM + " m", px, trackY + 44);
    }
    ctx.strokeStyle = "#9aa7ba";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(padX, trackY);
    ctx.lineTo(padX + trackW, trackY);
    ctx.stroke();
    ctx.strokeStyle = "#b8c4d2";
    ctx.lineWidth = 1;
    for (let i = 0; i < 40; i++) {
      const px = padX + (i / 40) * trackW;
      ctx.beginPath();
      ctx.moveTo(px, trackY);
      ctx.lineTo(px - 5, trackY + 10);
      ctx.stroke();
    }
    ctx.fillStyle = "#657188";
    ctx.font = "bold 12px ui-sans-serif, system-ui";
    ctx.textAlign = "left";
    ctx.fillText("频闪位置点（每 " + flashInterval.toFixed(1) + " s 一次，模拟打点计时器）", padX, 24);
    ctx.fillStyle = "#08758a";
    ctx.font = "bold 13px ui-sans-serif, system-ui";
    ctx.fillText("v = v0 + a*t", padX, 42);
    ctx.textAlign = "right";
    ctx.fillText("x = v0*t + 0.5*a*t^2", padX + trackW, 42);
    const flashY = trackY - 48;
    ctx.strokeStyle = "rgba(15,159,186,0.18)";
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 3]);
    for (const s of state.flashSamples) {
      const px = padX + (s.x - state.trackStartM) * mToPx;
      ctx.beginPath();
      ctx.moveTo(px, flashY);
      ctx.lineTo(px, trackY);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    for (const s of state.flashSamples) {
      const px = padX + (s.x - state.trackStartM) * mToPx;
      ctx.fillStyle = "rgba(15,159,186,0.10)";
      ctx.beginPath();
      ctx.arc(px, flashY, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#08758a";
      ctx.beginPath();
      ctx.arc(px, flashY, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(px - 1.5, flashY - 1.5, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    const disp = getDisplayX();
    const carX = padX + (disp.x - state.trackStartM) * mToPx;
    const carY = trackY - 16;
    const carW = 58, carH = 30;
    ctx.save();
    ctx.translate(carX, carY);
    ctx.fillStyle = "#0f9fba";
    roundRect(ctx, -carW / 2, -carH / 2, carW, carH, 6);
    ctx.fill();
    ctx.strokeStyle = "#08758a";
    ctx.lineWidth = 1.5;
    roundRect(ctx, -carW / 2, -carH / 2, carW, carH, 6);
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.28)";
    roundRect(ctx, -carW / 2 + 4, -carH / 2 + 3, carW - 8, 7, 3);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.beginPath();
    ctx.moveTo(-2, -carH / 2 + 4);
    ctx.lineTo(8, -carH / 2 + 4);
    ctx.lineTo(4, -carH / 2 + 13);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#172033";
    ctx.beginPath();
    ctx.arc(-carW / 2 + 13, carH / 2 - 2, 6, 0, Math.PI * 2);
    ctx.arc(carW / 2 - 13, carH / 2 - 2, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#657188";
    ctx.beginPath();
    ctx.arc(-carW / 2 + 13, carH / 2 - 2, 2.5, 0, Math.PI * 2);
    ctx.arc(carW / 2 - 13, carH / 2 - 2, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    const arrowLen = clamp(Math.abs(disp.v) * 6, 0, 80);
    if (arrowLen > 4) {
      const dir = disp.v >= 0 ? 1 : -1;
      const aY = carY - carH / 2 - 14;
      ctx.strokeStyle = "#d97706";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(carX, aY);
      ctx.lineTo(carX + dir * arrowLen, aY);
      ctx.stroke();
      ctx.fillStyle = "#d97706";
      ctx.beginPath();
      ctx.moveTo(carX + dir * arrowLen, aY);
      ctx.lineTo(carX + dir * (arrowLen - 8), aY - 5);
      ctx.lineTo(carX + dir * (arrowLen - 8), aY + 5);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#80510a";
      ctx.font = "bold 11px ui-sans-serif, system-ui";
      ctx.textAlign = dir > 0 ? "left" : "right";
      ctx.fillText("v = " + disp.v.toFixed(2) + " m/s", carX + dir * (arrowLen + 6), aY + 4);
    }
    if (state.wrapCount > 0) {
      ctx.fillStyle = "rgba(220,38,38,0.85)";
      ctx.font = "bold 11px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText("小车已循环 " + state.wrapCount + " 次（轨道循环显示）", w / 2, 18);
    }
  }
  function renderChart(ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    const padL = 52, padR = 18, padT = 16, padB = 42;
    const plotW = w - padL - padR;
    const plotH = h - padT - padB;
    const maxV = 16, minV = -16;
    const maxT = 10;
    const tToPx = (t) => padL + clamp(t / maxT, 0, 1) * plotW;
    const vToPx = (v) => padT + (1 - (v - minV) / (maxV - minV)) * plotH;
    ctx.fillStyle = "rgba(15,159,186,0.03)";
    ctx.fillRect(padL, padT, plotW, plotH);
    ctx.strokeStyle = "#e8edf4";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= 10; i++) {
      const px = padL + (i / 10) * plotW;
      ctx.moveTo(px, padT);
      ctx.lineTo(px, padT + plotH);
    }
    for (let i = 0; i <= 8; i++) {
      const py = padT + (i / 8) * plotH;
      ctx.moveTo(padL, py);
      ctx.lineTo(padL + plotW, py);
    }
    ctx.stroke();
    const v0Px = vToPx(state.v0);
    ctx.strokeStyle = "rgba(245,158,11,0.35)";
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(padL, v0Px);
    ctx.lineTo(padL + plotW, v0Px);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#a35d00";
    ctx.font = "10px ui-sans-serif, system-ui";
    ctx.textAlign = "left";
    ctx.fillText("v0=" + state.v0.toFixed(1), padL + 4, v0Px - 4);
    ctx.strokeStyle = "#9aa7ba";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(padL, padT);
    ctx.lineTo(padL, padT + plotH);
    ctx.lineTo(padL + plotW, padT + plotH);
    ctx.stroke();
    ctx.fillStyle = "#657188";
    ctx.font = "10px ui-sans-serif, system-ui";
    ctx.textAlign = "right";
    for (let v = -16; v <= 16; v += 4) {
      const py = vToPx(v);
      if (py < padT - 1 || py > padT + plotH + 1) continue;
      ctx.fillText(v.toString(), padL - 6, py + 3);
      ctx.strokeStyle = "#9aa7ba";
      ctx.beginPath();
      ctx.moveTo(padL - 3, py);
      ctx.lineTo(padL, py);
      ctx.stroke();
    }
    ctx.textAlign = "center";
    for (let t = 0; t <= 10; t += 2) {
      const px = tToPx(t);
      ctx.fillText(t.toString(), px, padT + plotH + 16);
      ctx.strokeStyle = "#9aa7ba";
      ctx.beginPath();
      ctx.moveTo(px, padT + plotH);
      ctx.lineTo(px, padT + plotH + 3);
      ctx.stroke();
    }
    ctx.fillStyle = "#172033";
    ctx.font = "bold 11px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.fillText("t / s", padL + plotW / 2, h - 8);
    ctx.save();
    ctx.translate(14, padT + plotH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText("v / (m/s)", 0, 0);
    ctx.restore();
    if (state.history.length >= 2) {
      const first = state.history[0];
      const last = state.history[state.history.length - 1];
      const x1 = tToPx(first.t), y1 = vToPx(first.v);
      const x2 = tToPx(last.t), y2 = vToPx(last.v);
      if (Math.abs(x2 - x1) > 0.5) {
        const slope = (y2 - y1) / (x2 - x1);
        const x0 = padL;
        const y0 = y1 - slope * (x1 - x0);
        const xEnd = padL + plotW;
        const yEnd = y0 + slope * (xEnd - x0);
        ctx.save();
        ctx.beginPath();
        ctx.rect(padL, padT, plotW, plotH);
        ctx.clip();
        ctx.fillStyle = "rgba(15,159,186,0.14)";
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineTo(x2, vToPx(0));
        ctx.lineTo(x1, vToPx(0));
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "rgba(8,117,138,0.45)";
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(xEnd, yEnd);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }
    }
    if (state.history.length >= 2) {
      ctx.strokeStyle = "#0f9fba";
      ctx.lineWidth = 2.5;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.beginPath();
      let started = false;
      for (const s of state.history) {
        const px = tToPx(s.t);
        const py = vToPx(s.v);
        if (!started) { ctx.moveTo(px, py); started = true; }
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    for (let i = 0; i < state.history.length; i++) {
      const s = state.history[i];
      const px = tToPx(s.t);
      const py = vToPx(s.v);
      if (px < padL - 2 || px > padL + plotW + 2) continue;
      if (py < padT - 2 || py > padT + plotH + 2) continue;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(px, py, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#08758a";
      ctx.beginPath();
      ctx.arc(px, py, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
    if (state.history.length > 0) {
      const last = state.history[state.history.length - 1];
      const px = tToPx(last.t);
      const py = vToPx(last.v);
      if (px >= padL && px <= padL + plotW && py >= padT && py <= padT + plotH) {
        ctx.fillStyle = "rgba(220,38,38,0.18)";
        ctx.beginPath();
        ctx.arc(px, py, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#dc2626";
        ctx.beginPath();
        ctx.arc(px, py, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(px, py, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.fillStyle = "#08758a";
    ctx.font = "bold 11px ui-sans-serif, system-ui";
    ctx.textAlign = "left";
    ctx.fillText("斜率 = 加速度 a = " + state.a.toFixed(2) + " m/s^2", padL + 8, padT + 14);
    const areaX = state.v0 * state.t + 0.5 * state.a * state.t * state.t;
    ctx.fillStyle = "#80510a";
    ctx.fillText("着色面积 = 位移 x = " + areaX.toFixed(2) + " m", padL + 8, padT + 30);
    ctx.fillStyle = "#657188";
    ctx.font = "10px ui-sans-serif, system-ui";
    ctx.fillText("v = v0 + a*t", padL + 8, padT + 46);
  }
  function setParameters(values) {
    const v0Def = parameterSchema[0], aDef = parameterSchema[1];
    state.v0 = clamp(finite(Number(values.v0), v0Def.default), v0Def.min, v0Def.max);
    state.a = clamp(finite(Number(values.a), aDef.default), aDef.min, aDef.max);
    elements.v0Input.value = String(state.v0);
    elements.aInput.value = String(state.a);
    state.history = [];
    state.flashSamples = [];
    state.wrapCount = 0;
    state.lastSampleT = -1;
    if (state.running) {
      state.t = 0;
    }
    render();
  }
  function getState() {
    return { ...state, history: state.history.map(s => ({ ...s })) };
  }
  function getReadouts() {
    const p = physicsAt(state.t);
    return { t: state.t, x: p.x, v: p.v, a: state.a, v0: state.v0 };
  }
  function runModelChecks() {
    const sim = (t, v0, a) => v0 * t + 0.5 * a * t * t;
    const simV = (t, v0, a) => v0 + a * t;
    const cases = [
      { name: "静止: v0=0,a=0 -> x=0,v=0", pass: sim(2, 0, 0) === 0 && simV(2, 0, 0) === 0, expected: "x=0,v=0", actual: "x=" + sim(2,0,0) + ",v=" + simV(2,0,0), tolerance: "exact" },
      { name: "匀速: v0=5,a=0 -> x=10,v=5", pass: Math.abs(sim(2, 5, 0) - 10) < 1e-9 && Math.abs(simV(2, 5, 0) - 5) < 1e-9, expected: "x=10,v=5", actual: "x=" + sim(2,5,0) + ",v=" + simV(2,5,0), tolerance: 1e-9 },
      { name: "匀加速: v0=0,a=2,t=3 -> x=9,v=6", pass: Math.abs(sim(3, 0, 2) - 9) < 1e-9 && Math.abs(simV(3, 0, 2) - 6) < 1e-9, expected: "x=9,v=6", actual: "x=" + sim(3,0,2) + ",v=" + simV(3,0,2), tolerance: 1e-9 },
      { name: "匀减速: v0=6,a=-2,t=2 -> x=8,v=2", pass: Math.abs(sim(2, 6, -2) - 8) < 1e-9 && Math.abs(simV(2, 6, -2) - 2) < 1e-9, expected: "x=8,v=2", actual: "x=" + sim(2,6,-2) + ",v=" + simV(2,6,-2), tolerance: 1e-9 },
      { name: "v-t 斜率 = a", pass: Math.abs((simV(2, 0, 2) - simV(1, 0, 2)) / 1 - 2) < 1e-9, expected: "斜率=2", actual: (simV(2,0,2)-simV(1,0,2))/1, tolerance: 1e-9 },
      { name: "面积 = 位移 (v0=4,a=1,t=2 -> 面积=10)", pass: Math.abs(0.5 * 2 * (simV(0, 4, 1) + simV(2, 4, 1)) - sim(2, 4, 1)) < 1e-9, expected: 10, actual: 0.5 * 2 * (4 + 6), tolerance: 1e-9 }
    ];
    return cases;
  }
  function bindControls() {
    elements.startBtn.addEventListener("click", start);
    elements.pauseBtn.addEventListener("click", pause);
    elements.resetBtn.addEventListener("click", reset);
    elements.v0Input.addEventListener("input", () => setParameters({ v0: elements.v0Input.value, a: state.a }));
    elements.aInput.addEventListener("input", () => setParameters({ v0: state.v0, a: elements.aInput.value }));
  }
  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
