<!doctype html>
<html lang="zh-CN">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开普勒定律演示</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #050818;
  --sim-surface: #0d1228;
  --sim-surface-soft: #131938;
  --sim-text: #e8eefc;
  --sim-muted: #8a96b8;
  --sim-border: #283056;
  --sim-grid: #1a2244;
  --sim-accent: #f5b942;
  --sim-accent-deep: #c8901a;
  --sim-accent-soft: rgba(245,185,66,0.14);
  --sim-positive: #4ade80;
  --sim-warning: #f59e0b;
  --sim-danger: #ef4444;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 14px 40px rgba(0,0,0,0.5);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
  --sim-law1: #60a5fa;
  --sim-law2: #4ade80;
  --sim-law3: #f5b942;
  --sim-planet-active: #5eead4;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-width: 320px; color: var(--sim-text);
  background: radial-gradient(ellipse at 50% 0%, #0a0f28 0%, var(--sim-bg) 70%);
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input, select { font: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(96,165,250,0.5); outline-offset: 2px; }
.app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 14px 18px 12px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; overflow: hidden; }
.header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 48px; flex-wrap: wrap; }
.header h1 { margin: 0 0 4px; font-size: clamp(1.4rem, 2.2vw, 1.9rem); letter-spacing: -0.03em; line-height: 1; }
.header p { margin: 0; color: var(--sim-muted); font-size: 0.82rem; }
.status { border: 1px solid rgba(245,185,66,0.25); border-radius: 999px; padding: 7px 14px; background: var(--sim-accent-soft); color: var(--sim-accent); font-weight: 700; white-space: nowrap; font-size: 0.82rem; }
.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 10px; }
.panel { min-width: 0; background: rgba(13,18,40,0.88); border: 1px solid var(--sim-border); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
.scene-panel { min-height: 380px; padding: 12px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.panel-head h2 { margin: 0; font-size: 0.95rem; }
.panel-head span { color: var(--sim-muted); font-size: 0.72rem; }
#scene { width: 100%; height: 100%; min-height: 340px; display: block; border: 1px solid rgba(96,165,250,0.12); border-radius: 16px; background: radial-gradient(ellipse at 50% 50%, #0a1030 0%, #050818 100%); }
.side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
.readouts { padding: 14px; }
.readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.metric { padding: 12px; border: 1px solid rgba(96,165,250,0.1); border-radius: 12px; background: rgba(19,25,56,0.6); }
.metric small { display: block; margin-bottom: 3px; color: var(--sim-muted); font-size: 0.7rem; }
.metric strong { font-size: 1.2rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.model-note { display: grid; align-content: start; gap: 10px; padding: 14px; overflow-y: auto; }
.model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.82rem; }
.insight { padding: 12px 14px; border-left: 3px solid var(--sim-accent); border-radius: 0 12px 12px 0; background: rgba(245,185,66,0.08); color: var(--sim-accent) !important; font-weight: 600; font-size: 0.85rem; line-height: 1.5; }
.law-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.68rem; font-weight: 700; margin-left: 6px; vertical-align: middle; }
.law-badge[data-law="1"] { background: rgba(96,165,250,0.18); color: var(--sim-law1); }
.law-badge[data-law="2"] { background: rgba(74,222,128,0.18); color: var(--sim-law2); }
.law-badge[data-law="3"] { background: rgba(245,185,66,0.18); color: var(--sim-law3); }
.controls { padding: 10px 12px; display: grid; grid-template-columns: auto auto minmax(150px, 1fr) minmax(150px, 1fr) minmax(120px, 1fr); gap: 14px; align-items: center; border-radius: 16px; }
.actions { display: flex; gap: 6px; }
.law-switcher { display: flex; gap: 4px; }
button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 8px 12px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 700; font-size: 0.82rem; transition: transform .14s ease, background .14s ease, border-color .14s ease; }
button:hover { border-color: #3a4470; background: #1a2244; }
button:active { transform: scale(.97); }
button.primary { border-color: var(--sim-accent-deep); color: #1a1300; background: linear-gradient(135deg, var(--sim-accent), var(--sim-accent-deep)); box-shadow: 0 6px 16px rgba(245,185,66,0.2); }
button.law-btn { padding: 8px 10px; font-size: 0.78rem; }
button.law-btn.active[data-law="1"] { border-color: var(--sim-law1); color: var(--sim-law1); background: rgba(96,165,250,0.15); box-shadow: inset 0 0 0 1px rgba(96,165,250,0.3); }
button.law-btn.active[data-law="2"] { border-color: var(--sim-law2); color: var(--sim-law2); background: rgba(74,222,128,0.15); box-shadow: inset 0 0 0 1px rgba(74,222,128,0.3); }
button.law-btn.active[data-law="3"] { border-color: var(--sim-law3); color: var(--sim-law3); background: rgba(245,185,66,0.15); box-shadow: inset 0 0 0 1px rgba(245,185,66,0.3); }
.control label { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 4px; font-size: 0.76rem; font-weight: 700; }
.control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
#orbitPath { fill: none; stroke: rgba(96,165,250,0.35); stroke-width: 1.5; stroke-dasharray: 5 4; }
#sweptArea { fill: rgba(74,222,128,0.18); stroke: rgba(74,222,128,0.5); stroke-width: 1; }
#sun { filter: drop-shadow(0 0 12px rgba(245,185,66,0.6)); }
#sunCore { fill: #fbbf24; }
#sunGlow { fill: rgba(245,185,66,0.2); }
#planet { filter: drop-shadow(0 0 6px rgba(94,234,212,0.5)); }
#planetBody { fill: #5eead4; stroke: #99f6e4; stroke-width: 1.5; }
#velocityArrow { stroke: #4ade80; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
#velocityLabel { fill: #4ade80; font-size: 11px; font-weight: 700; }
.focus-marker { fill: rgba(96,165,250,0.6); }
.focus-label { fill: var(--sim-muted); font-size: 11px; }
.axis-label { fill: var(--sim-muted); font-size: 11px; }
.periapsis-label, .apoapsis-label { fill: var(--sim-muted); font-size: 10px; font-weight: 600; }
.trail-dot { fill: rgba(94,234,212,0.3); }
.multi-orbit { fill: none; stroke-width: 1.2; stroke-dasharray: 4 3; opacity: 0.5; }
.multi-planet { filter: drop-shadow(0 0 4px currentColor); }
.multi-label { font-size: 9px; font-weight: 600; }
#scatterPoint { fill: #5eead4; stroke: #fff; stroke-width: 1.5; filter: drop-shadow(0 0 5px rgba(94,234,212,0.5)); }
.scatter-ref { stroke: #fff; stroke-width: 1; opacity: 0.7; }
.scatter-ref-label { font-size: 8px; fill: var(--sim-muted); font-variant-numeric: tabular-nums; }
#scatterLine { fill: none; stroke: rgba(245,185,66,0.4); stroke-width: 1.5; stroke-dasharray: 4 3; }
.scatter-axis { stroke: var(--sim-border); stroke-width: 1; }
.scatter-grid { stroke: var(--sim-grid); stroke-width: 0.5; }
.scatter-label { fill: var(--sim-muted); font-size: 9px; }
.scatter-tick { fill: var(--sim-muted); font-size: 8px; font-variant-numeric: tabular-nums; }
#areaChart { width: 100%; height: 100%; min-height: 120px; display: block; }
#scatterChart { width: 100%; height: 100%; min-height: 120px; display: block; }
@media (max-width: 860px) {
  .app { height: auto; min-height: 100vh; overflow: visible; padding: 10px; }
  .main { grid-template-columns: 1fr; }
  .controls { grid-template-columns: 1fr; }
  .scene-panel { min-height: 0; }
  #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>开普勒定律演示</h1>
      <p>切换三条定律，调节半长轴、偏心率与中心质量，观察行星轨道运动</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head">
        <h2 id="scene-title">行星轨道<span class="law-badge" id="lawBadge" data-law="1">第一定律</span></h2>
        <span id="sceneSubtitle">椭圆轨道 · 太阳位于焦点</span>
      </div>
      <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
        <desc id="scene-desc">行星沿椭圆轨道围绕太阳运行，太阳位于椭圆的一个焦点上。第三定律模式下多颗行星同时运行。</desc>
        <defs>
          <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4ade80"/>
          </marker>
          <radialGradient id="sunGradient">
            <stop offset="0%" stop-color="#fde68a"/>
            <stop offset="40%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#d97706"/>
          </radialGradient>
        </defs>
        <g id="stars"></g>
        <g id="multiOrbitGroup"></g>
        <ellipse id="orbitPath" cx="380" cy="210" rx="200" ry="0"></ellipse>
        <path id="sweptArea" d=""></path>
        <g id="trailGroup"></g>
        <circle id="sunGlow" cx="380" cy="210" r="18"></circle>
        <circle id="sun" cx="380" cy="210" r="9" fill="url(#sunGradient)"></circle>
        <circle id="planet" cx="580" cy="210" r="6">
          <circle id="planetBody" cx="0" cy="0" r="6"/>
        </circle>
        <line id="velocityArrow" x1="0" y1="0" x2="0" y2="0" style="display:none"/>
        <text id="velocityLabel" x="0" y="0" style="display:none">v</text>
        <circle class="focus-marker" id="focus2" cx="180" cy="210" r="3" style="display:none"/>
        <text class="focus-label" id="focus2Label" x="160" y="200" style="display:none">F₂</text>
        <text class="focus-label" id="focus1Label" x="392" y="206">F₁（太阳）</text>
        <line id="semiMajorAxis" x1="180" y1="210" x2="580" y2="210" stroke="rgba(96,165,250,0.2)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>
        <text class="periapsis-label" id="periapsisLabel" x="580" y="232" style="display:none">近日点</text>
        <text class="apoapsis-label" id="apoapsisLabel" x="180" y="232" style="display:none">远日点</text>
      </svg>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel readouts" aria-label="实时数据">
        <div class="readout-grid">
          <div class="metric"><small>半长轴 a</small><strong id="aReadout">2.00 AU</strong></div>
          <div class="metric"><small>偏心率 e</small><strong id="eReadout">0.50</strong></div>
          <div class="metric"><small>周期 T</small><strong id="tReadout">2.83 yr</strong></div>
          <div class="metric"><small>模拟时间</small><strong id="simTimeReadout">0.00 yr</strong></div>
          <div class="metric"><small>当前距离 r</small><strong id="rReadout">1.00 AU</strong></div>
          <div class="metric"><small>当前速度 v</small><strong id="vReadout">— AU/yr</strong></div>
        </div>
      </section>
      <section class="panel model-note" data-region="insight">
        <div class="panel-head"><h2>证据与解读</h2></div>
        <div id="lawEvidenceArea">
          <svg id="areaChart" viewBox="0 0 300 150" style="display:none">
            <text x="150" y="20" text-anchor="middle" fill="#8a96b8" font-size="11" font-weight="700">等时扫过面积验证</text>
            <line class="scatter-axis" x1="40" y1="120" x2="280" y2="120"/>
            <line class="scatter-axis" x1="40" y1="30" x2="40" y2="120"/>
            <text class="scatter-label" x="150" y="142" text-anchor="middle">时间区间</text>
            <text class="scatter-label" x="14" y="75" text-anchor="middle" transform="rotate(-90 14 75)">扫过面积</text>
            <rect id="bar1" x="55" y="60" width="40" height="60" fill="rgba(74,222,128,0.3)" stroke="#4ade80" stroke-width="1"/>
            <rect id="bar2" x="130" y="60" width="40" height="60" fill="rgba(74,222,128,0.3)" stroke="#4ade80" stroke-width="1"/>
            <rect id="bar3" x="205" y="60" width="40" height="60" fill="rgba(74,222,128,0.3)" stroke="#4ade80" stroke-width="1"/>
            <text class="scatter-tick" id="bar1Label" x="75" y="135" text-anchor="middle">0–⅓T</text>
            <text class="scatter-tick" id="bar2Label" x="150" y="135" text-anchor="middle">⅓–⅔T</text>
            <text class="scatter-tick" id="bar3Label" x="225" y="135" text-anchor="middle">⅔–T</text>
            <text class="scatter-tick" id="bar1Val" x="75" y="55" text-anchor="middle">—</text>
            <text class="scatter-tick" id="bar2Val" x="150" y="55" text-anchor="middle">—</text>
            <text class="scatter-tick" id="bar3Val" x="225" y="55" text-anchor="middle">—</text>
          </svg>
          <svg id="scatterChart" viewBox="0 0 300 150" style="display:none">
            <text x="150" y="20" text-anchor="middle" fill="#8a96b8" font-size="11" font-weight="700">T² – a³ 关系图</text>
            <line class="scatter-axis" x1="40" y1="120" x2="280" y2="120"/>
            <line class="scatter-axis" x1="40" y1="30" x2="40" y2="120"/>
            <g id="scatterGrid"></g>
            <g id="scatterRefGroup"></g>
            <line id="scatterLine" x1="40" y1="120" x2="280" y2="30"/>
            <text class="scatter-label" x="160" y="142" text-anchor="middle">a³ (AU³)</text>
            <text class="scatter-label" x="14" y="75" text-anchor="middle" transform="rotate(-90 14 75)">T² (yr²)</text>
            <text class="scatter-tick" x="40" y="132" text-anchor="middle">0</text>
            <text class="scatter-tick" x="280" y="132" text-anchor="middle">125</text>
            <text class="scatter-tick" x="34" y="123" text-anchor="end">0</text>
            <text class="scatter-tick" x="34" y="33" text-anchor="end">25</text>
            <circle id="scatterPoint" cx="40" cy="120" r="5"/>
          </svg>
        </div>
        <p id="insight" class="insight">选择一条定律开始观察。第一定律：行星轨道是椭圆，太阳位于椭圆的一个焦点上，而非中心。</p>
        <p id="modelNote" style="font-size:0.78rem; color: var(--sim-muted); line-height:1.5;">教学模型：使用开普勒方程数值求解轨道位置，单位为天文单位（AU）与年。GM = 4π² 时周期 T = a^(3/2)。</p>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="模拟控制">
    <div class="actions">
      <button id="startBtn" class="primary" type="button">启动</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="law-switcher">
      <button class="law-btn active" data-law="1" type="button">第一定律</button>
      <button class="law-btn" data-law="2" type="button">第二定律</button>
      <button class="law-btn" data-law="3" type="button">第三定律</button>
    </div>
    <div class="control">
      <label for="aInput">半长轴 a <output id="aOutput">2.0 AU</output></label>
      <input id="aInput" type="range" min="1" max="5" step="0.1" value="2">
    </div>
    <div class="control">
      <label for="eInput">偏心率 e <output id="eOutput">0.50</output></label>
      <input id="eInput" type="range" min="0" max="0.85" step="0.01" value="0.5">
    </div>
    <div class="control">
      <label for="mInput">时间倍率 <output id="mOutput">1.0×</output></label>
      <input id="mInput" type="range" min="0.1" max="5" step="0.1" value="1">
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const GM = 4 * Math.PI * Math.PI;
  const parameterSchema = [
    { key: "a", label: "半长轴", type: "slider", min: 1, max: 5, step: 0.1, default: 2, unit: "AU" },
    { key: "e", label: "偏心率", type: "slider", min: 0, max: 0.85, step: 0.01, default: 0.5, unit: "" },
    { key: "timeScale", label: "时间倍率", type: "slider", min: 0.1, max: 5, step: 0.1, default: 1, unit: "×" }
  ];

  // Reference planets for Law 3: preset semi-major axes (e=0 for simplicity)
  // Colors chosen for dark background visibility
  const referencePlanets = [
    { a: 1.0, color: "#f87171", label: "a=1.0" },
    { a: 1.5, color: "#fb923c", label: "a=1.5" },
    { a: 2.5, color: "#a78bfa", label: "a=2.5" },
    { a: 3.5, color: "#f472b6", label: "a=3.5" },
    { a: 5.0, color: "#818cf8", label: "a=5.0" }
  ];

  const state = {
    running: false,
    law: 1,
    a: 2, e: 0.5, timeScale: 1,
    t: 0, M: 0, E: 0,
    r: 2, theta: 0, v: 0,
    lastTimestamp: null,
    trail: [],
    sweptSegments: [],
    areaBars: [0, 0, 0],
    areaBarTimes: [0, 0, 0],
    currentAreaIndex: 0,
    period: 0,
    // Law 3 multi-planet phases (each starts at a different mean anomaly)
    refPhases: referencePlanets.map((_, i) => (i * 0.7) % (2 * Math.PI))
  };

  const elements = {
    status: document.querySelector("#status"),
    lawBadge: document.querySelector("#lawBadge"),
    sceneSubtitle: document.querySelector("#sceneSubtitle"),
    orbitPath: document.querySelector("#orbitPath"),
    sweptArea: document.querySelector("#sweptArea"),
    trailGroup: document.querySelector("#trailGroup"),
    multiOrbitGroup: document.querySelector("#multiOrbitGroup"),
    sun: document.querySelector("#sun"),
    sunGlow: document.querySelector("#sunGlow"),
    planet: document.querySelector("#planet"),
    planetBody: document.querySelector("#planetBody"),
    velocityArrow: document.querySelector("#velocityArrow"),
    velocityLabel: document.querySelector("#velocityLabel"),
    focus2: document.querySelector("#focus2"),
    focus2Label: document.querySelector("#focus2Label"),
    focus1Label: document.querySelector("#focus1Label"),
    semiMajorAxis: document.querySelector("#semiMajorAxis"),
    periapsisLabel: document.querySelector("#periapsisLabel"),
    apoapsisLabel: document.querySelector("#apoapsisLabel"),
    stars: document.querySelector("#stars"),
    areaChart: document.querySelector("#areaChart"),
    scatterChart: document.querySelector("#scatterChart"),
    scatterGrid: document.querySelector("#scatterGrid"),
    scatterRefGroup: document.querySelector("#scatterRefGroup"),
    scatterLine: document.querySelector("#scatterLine"),
    scatterPoint: document.querySelector("#scatterPoint"),
    bar1: document.querySelector("#bar1"), bar2: document.querySelector("#bar2"), bar3: document.querySelector("#bar3"),
    bar1Val: document.querySelector("#bar1Val"), bar2Val: document.querySelector("#bar2Val"), bar3Val: document.querySelector("#bar3Val"),
    insight: document.querySelector("#insight"),
    modelNote: document.querySelector("#modelNote"),
    aReadout: document.querySelector("#aReadout"),
    eReadout: document.querySelector("#eReadout"),
    tReadout: document.querySelector("#tReadout"),
    simTimeReadout: document.querySelector("#simTimeReadout"),
    rReadout: document.querySelector("#rReadout"),
    vReadout: document.querySelector("#vReadout"),
    aInput: document.querySelector("#aInput"), aOutput: document.querySelector("#aOutput"),
    eInput: document.querySelector("#eInput"), eOutput: document.querySelector("#eOutput"),
    mInput: document.querySelector("#mInput"), mOutput: document.querySelector("#mOutput"),
    startBtn: document.querySelector("#startBtn"),
    pauseBtn: document.querySelector("#pauseBtn"),
    resetBtn: document.querySelector("#resetBtn"),
    lawBtns: document.querySelectorAll(".law-btn")
  };

  function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
  function finite(v, fallback) { return Number.isFinite(v) ? v : fallback; }

  function solveKepler(M, e) {
    let E = M;
    for (let i = 0; i < 30; i++) {
      const f = E - e * Math.sin(E) - M;
      const fp = 1 - e * Math.cos(E);
      const dE = f / fp;
      E -= dE;
      if (Math.abs(dE) < 1e-10) break;
    }
    return E;
  }

  function computePosition(a, e, M) {
    const E = solveKepler(M, e);
    const b = a * Math.sqrt(1 - e * e);
    const x = a * (Math.cos(E) - e);
    const y = b * Math.sin(E);
    const r = a * (1 - e * Math.cos(E));
    const theta = Math.atan2(y, x);
    const dEdt = Math.sqrt(GM / (a * a * a)) / (1 - e * Math.cos(E));
    const vx = -a * Math.sin(E) * dEdt;
    const vy = b * Math.cos(E) * dEdt;
    const v = Math.sqrt(vx * vx + vy * vy);
    return { x, y, r, theta, E, v, vx, vy };
  }

  function computePeriod(a) { return Math.pow(a, 1.5); }

  function initStars() {
    const stars = [];
    for (let i = 0; i < 80; i++) {
      const x = Math.random() * 760;
      const y = Math.random() * 420;
      const r = Math.random() * 0.8 + 0.3;
      const o = Math.random() * 0.5 + 0.2;
      stars.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="white" opacity="${o.toFixed(2)}"/>`);
    }
    elements.stars.innerHTML = stars.join("");
  }

  function initScatterGrid() {
    const lines = [];
    for (let i = 1; i <= 4; i++) {
      const x = 40 + i * 48;
      const y = 120 - i * 22.5;
      lines.push(`<line class="scatter-grid" x1="${x}" y1="30" x2="${x}" y2="120"/>`);
      lines.push(`<line class="scatter-grid" x1="40" y1="${y}" x2="280" y2="${y}"/>`);
    }
    elements.scatterGrid.innerHTML = lines.join("");
  }

  function init() {
    initStars();
    initScatterGrid();
    bindControls();
    setParameters({ a: 2, e: 0.5, timeScale: 1 });
    setLaw(1);
    reset();
    requestAnimationFrame(frame);
  }

  function start() {
    state.running = true;
    elements.status.textContent = "运行中";
    elements.startBtn.setAttribute("aria-pressed", "true");
  }
  function pause() {
    state.running = false;
    elements.status.textContent = "已暂停";
    elements.startBtn.setAttribute("aria-pressed", "false");
  }
  function reset() {
    pause();
    state.t = 0;
    state.M = 0;
    state.E = 0;
    state.trail = [];
    state.sweptSegments = [];
    state.areaBars = [0, 0, 0];
    state.areaBarTimes = [0, 0, 0];
    state.currentAreaIndex = 0;
    // Reset reference planet phases
    state.refPhases = referencePlanets.map((_, i) => (i * 0.7) % (2 * Math.PI));
    const pos = computePosition(state.a, state.e, 0);
    state.r = pos.r;
    state.theta = pos.theta;
    state.v = pos.v;
    render();
  }

  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05) * state.timeScale;
    if (boundedDt <= 0) return;

    const n = Math.sqrt(GM / (state.a * state.a * state.a));
    state.M += n * boundedDt;
    state.M = state.M % (2 * Math.PI);
    state.t += boundedDt;

    const pos = computePosition(state.a, state.e, state.M);
    state.r = pos.r;
    state.theta = pos.theta;
    state.E = pos.E;
    state.v = pos.v;

    // Trail
    state.trail.push({ x: pos.x, y: pos.y, t: state.t });
    if (state.trail.length > 200) state.trail.shift();

    // Update reference planet phases for Law 3
    if (state.law === 3) {
      for (let i = 0; i < referencePlanets.length; i++) {
        const refA = referencePlanets[i].a;
        const refN = Math.sqrt(GM / (refA * refA * refA));
        state.refPhases[i] = (state.refPhases[i] + refN * boundedDt) % (2 * Math.PI);
      }
    }

    // Swept area tracking for Law 2
    if (state.law === 2) {
      const lastSeg = state.sweptSegments.length > 0 ? state.sweptSegments[state.sweptSegments.length - 1] : null;
      if (lastSeg) {
        const dtheta = pos.theta - lastSeg.theta;
        if (Math.abs(dtheta) > 0.02) {
          state.sweptSegments.push({ x: pos.x, y: pos.y, theta: pos.theta, r: pos.r });
        }
      } else {
        state.sweptSegments.push({ x: pos.x, y: pos.y, theta: pos.theta, r: pos.r });
      }
      if (state.sweptSegments.length > 60) state.sweptSegments.shift();

      // Area bar accumulation
      const period = state.period;
      if (period > 0) {
        const cycleTime = state.t % period;
        const segIndex = Math.floor(cycleTime / (period / 3));
        if (segIndex >= 0 && segIndex < 3) {
          if (segIndex !== state.currentAreaIndex) {
            state.currentAreaIndex = segIndex;
          }
          // Accumulate approximate area for this segment
          if (lastSeg) {
            const dtheta = pos.theta - lastSeg.theta;
            const rAvg = (pos.r + lastSeg.r) / 2;
            const dA = 0.5 * rAvg * rAvg * Math.abs(dtheta);
            state.areaBars[segIndex] += dA;
            state.areaBarTimes[segIndex] += boundedDt;
          }
        }
      }
    }
  }

  function render() {
    const cx = 380, cy = 210;
    const scale = 65;
    const a = state.a;
    const e = state.e;
    const b = a * Math.sqrt(1 - e * e);
    const c = a * e;

    // Orbit ellipse: center at (cx - c*scale, cy) so sun (focus) is at (cx, cy)
    const orbitCx = cx - c * scale;
    const orbitRx = a * scale;
    const orbitRy = b * scale;
    elements.orbitPath.setAttribute("cx", orbitCx);
    elements.orbitPath.setAttribute("cy", cy);
    elements.orbitPath.setAttribute("rx", orbitRx);
    elements.orbitPath.setAttribute("ry", orbitRy);

    // Sun position (focus F1)
    elements.sun.setAttribute("cx", cx);
    elements.sun.setAttribute("cy", cy);
    elements.sunGlow.setAttribute("cx", cx);
    elements.sunGlow.setAttribute("cy", cy);
    elements.focus1Label.setAttribute("x", cx + 12);
    elements.focus1Label.setAttribute("y", cy - 12);

    // Planet position
    const pos = computePosition(a, e, state.M);
    const px = cx + pos.x * scale;
    const py = cy + pos.y * scale;
    elements.planet.setAttribute("cx", px);
    elements.planet.setAttribute("cy", py);

    // Trail
    const trailDots = state.trail.slice(-60).map((s, i) => {
      const tx = cx + s.x * scale;
      const ty = cy + s.y * scale;
      const opacity = (i / 60) * 0.5;
      return `<circle class="trail-dot" cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="1.5" opacity="${opacity.toFixed(2)}"/>`;
    }).join("");
    elements.trailGroup.innerHTML = trailDots;

    // Law-specific rendering
    renderLawSpecific(cx, cy, scale, pos, px, py, a, e, b, c);

    // Readouts
    elements.aReadout.textContent = `${a.toFixed(2)} AU`;
    elements.eReadout.textContent = e.toFixed(2);
    const T = computePeriod(a);
    state.period = T;
    elements.tReadout.textContent = `${T.toFixed(2)} yr`;
    elements.simTimeReadout.textContent = `${state.t.toFixed(2)} yr`;
    elements.rReadout.textContent = `${pos.r.toFixed(2)} AU`;
    elements.vReadout.textContent = `${pos.v.toFixed(2)} AU/yr`;

    // Insight text
    updateInsight(pos, a, e, T);

    // Parameter outputs
    elements.aOutput.textContent = `${a.toFixed(1)} AU`;
    elements.eOutput.textContent = e.toFixed(2);
    elements.mOutput.textContent = `${state.timeScale.toFixed(1)}×`;
  }

  function renderLawSpecific(cx, cy, scale, pos, px, py, a, e, b, c) {
    // Reset all
    elements.velocityArrow.style.display = "none";
    elements.velocityLabel.style.display = "none";
    elements.focus2.style.display = "none";
    elements.focus2Label.style.display = "none";
    elements.semiMajorAxis.style.display = "none";
    elements.periapsisLabel.style.display = "none";
    elements.apoapsisLabel.style.display = "none";
    elements.sweptArea.setAttribute("d", "");
    elements.areaChart.style.display = "none";
    elements.scatterChart.style.display = "none";
    elements.multiOrbitGroup.innerHTML = "";

    if (state.law === 1) {
      // Show second focus, semi-major axis, periapsis/apoapsis
      const focus2x = cx - 2 * c * scale;
      elements.focus2.setAttribute("cx", focus2x);
      elements.focus2.setAttribute("cy", cy);
      elements.focus2.style.display = "";
      elements.focus2Label.setAttribute("x", focus2x - 20);
      elements.focus2Label.setAttribute("y", cy - 12);
      elements.focus2Label.style.display = "";

      elements.semiMajorAxis.setAttribute("x1", cx - c * scale - a * scale);
      elements.semiMajorAxis.setAttribute("y1", cy);
      elements.semiMajorAxis.setAttribute("x2", cx - c * scale + a * scale);
      elements.semiMajorAxis.setAttribute("y2", cy);
      elements.semiMajorAxis.style.display = "";

      // Periapsis (closest, at +x side from center, which is cx + (a-c)*scale from sun... actually at E=0, x = a(1-e), so px = cx + a(1-e)*scale)
      const periX = cx + a * (1 - e) * scale;
      elements.periapsisLabel.setAttribute("x", periX - 20);
      elements.periapsisLabel.setAttribute("y", cy + 28);
      elements.periapsisLabel.style.display = "";

      const apoX = cx - a * (1 + e) * scale;
      elements.apoapsisLabel.setAttribute("x", apoX - 20);
      elements.apoapsisLabel.setAttribute("y", cy + 28);
      elements.apoapsisLabel.style.display = "";

    } else if (state.law === 2) {
      // Show swept area polygon
      if (state.sweptSegments.length > 1) {
        const pts = [`M ${cx} ${cy}`];
        for (const s of state.sweptSegments) {
          pts.push(`L ${(cx + s.x * scale).toFixed(1)} ${(cy + s.y * scale).toFixed(1)}`);
        }
        pts.push("Z");
        elements.sweptArea.setAttribute("d", pts.join(" "));
      }

      // Velocity arrow
      const vScale = 12;
      const vx = pos.vx * vScale;
      const vy = pos.vy * vScale;
      elements.velocityArrow.setAttribute("x1", px);
      elements.velocityArrow.setAttribute("y1", py);
      elements.velocityArrow.setAttribute("x2", px + vx);
      elements.velocityArrow.setAttribute("y2", py + vy);
      elements.velocityArrow.style.display = "";
      elements.velocityLabel.setAttribute("x", px + vx + 6);
      elements.velocityLabel.setAttribute("y", py + vy + 4);
      elements.velocityLabel.style.display = "";

      // Area chart
      elements.areaChart.style.display = "";
      const maxBar = Math.max(state.areaBars[0], state.areaBars[1], state.areaBars[2], 0.01);
      const barH1 = (state.areaBars[0] / maxBar) * 60;
      const barH2 = (state.areaBars[1] / maxBar) * 60;
      const barH3 = (state.areaBars[2] / maxBar) * 60;
      elements.bar1.setAttribute("y", 120 - barH1);
      elements.bar1.setAttribute("height", barH1);
      elements.bar2.setAttribute("y", 120 - barH2);
      elements.bar2.setAttribute("height", barH2);
      elements.bar3.setAttribute("y", 120 - barH3);
      elements.bar3.setAttribute("height", barH3);
      elements.bar1Val.textContent = state.areaBars[0].toFixed(2);
      elements.bar2Val.textContent = state.areaBars[1].toFixed(2);
      elements.bar3Val.textContent = state.areaBars[2].toFixed(2);

    } else if (state.law === 3) {
      // Multi-planet orbits and bodies
      const multiParts = [];
      for (let i = 0; i < referencePlanets.length; i++) {
        const ref = referencePlanets[i];
        const refA = ref.a;
        const refE = 0; // circular for clarity
        const refB = refA;
        const refC = 0;
        const refOrbitCx = cx; // sun at center for circular
        const refOrbitRx = refA * scale;
        const refOrbitRy = refB * scale;

        // Orbit ellipse (circle)
        multiParts.push(`<ellipse class="multi-orbit" cx="${refOrbitCx}" cy="${cy}" rx="${refOrbitRx.toFixed(1)}" ry="${refOrbitRy.toFixed(1)}" stroke="${ref.color}"/>`);

        // Planet position
        const refM = state.refPhases[i];
        const refPos = computePosition(refA, refE, refM);
        const rpx = cx + refPos.x * scale;
        const rpy = cy + refPos.y * scale;
        multiParts.push(`<circle class="multi-planet" cx="${rpx.toFixed(1)}" cy="${rpy.toFixed(1)}" r="4" fill="${ref.color}" style="color:${ref.color}"/>`);
        // Label near planet
        multiParts.push(`<text class="multi-label" x="${(rpx + 6).toFixed(1)}" y="${(rpy - 6).toFixed(1)}" fill="${ref.color}">${ref.label}</text>`);
      }
      elements.multiOrbitGroup.innerHTML = multiParts.join("");

      // Scatter chart T² vs a³
      elements.scatterChart.style.display = "";

      // Reference points on scatter
      const refScatterParts = [];
      for (let i = 0; i < referencePlanets.length; i++) {
        const ref = referencePlanets[i];
        const aCubed = Math.pow(ref.a, 3);
        const tSquared = Math.pow(computePeriod(ref.a), 2);
        const sx = 40 + (aCubed / 125) * 240;
        const sy = 120 - (tSquared / 25) * 90;
        refScatterParts.push(`<circle class="scatter-ref" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="3.5" fill="${ref.color}"/>`);
        refScatterParts.push(`<text class="scatter-ref-label" x="${(sx + 5).toFixed(1)}" y="${(sy + 3).toFixed(1)}" fill="${ref.color}">${ref.label}</text>`);
      }
      elements.scatterRefGroup.innerHTML = refScatterParts.join("");

      // Current adjustable planet point
      const aCubed = Math.pow(state.a, 3);
      const tSquared = Math.pow(computePeriod(state.a), 2);
      // Scale: a³ range 0-125, T² range 0-25
      const sx = 40 + (aCubed / 125) * 240;
      const sy = 120 - (tSquared / 25) * 90;
      elements.scatterPoint.setAttribute("cx", sx);
      elements.scatterPoint.setAttribute("cy", sy);

      // The line y = x (since T² = a³ when GM = 4π²)
      elements.scatterLine.setAttribute("x1", 40);
      elements.scatterLine.setAttribute("y1", 120);
      elements.scatterLine.setAttribute("x2", 280);
      elements.scatterLine.setAttribute("y2", 30);
    }
  }

  function updateInsight(pos, a, e, T) {
    if (state.law === 1) {
      if (e < 0.05) {
        elements.insight.textContent = "偏心率接近 0：轨道近似为圆，太阳位于圆心。这是圆轨道的极限情形。";
      } else {
        elements.insight.textContent = `椭圆轨道：太阳位于焦点 F₁，而非椭圆中心。偏心率 e=${e.toFixed(2)} 越大，椭圆越扁。`;
      }
    } else if (state.law === 2) {
      const r = pos.r;
      if (r < a * (1 - e * 0.5)) {
        elements.insight.textContent = "近日点附近：距离短，速度快。绿色面积块在相等时间内与远日点扫过相同面积。";
      } else if (r > a * (1 + e * 0.5)) {
        elements.insight.textContent = "远日点附近：距离长，速度慢。但扫过面积的速率不变——这是等面积定律。";
      } else {
        elements.insight.textContent = "行星在轨道中段：速度介于近日点（最快）与远日点（最慢）之间，面积速率始终恒定。";
      }
    } else {
      elements.insight.textContent = `当前 a=${a.toFixed(1)} AU → T=${T.toFixed(2)} yr。T²=${(T*T).toFixed(2)}，a³=${(a*a*a).toFixed(2)}，比值 T²/a³ ≈ ${(T*T/(a*a*a)).toFixed(3)}（理论值 1.000）。所有行星的点都落在同一条过原点的直线上。`;
    }
  }

  function setLaw(law) {
    state.law = law;
    elements.lawBadge.setAttribute("data-law", String(law));
    elements.lawBadge.textContent = `第${law === 1 ? "一" : law === 2 ? "二" : "三"}定律`;
    elements.lawBtns.forEach(btn => {
      btn.classList.toggle("active", parseInt(btn.dataset.law) === law);
    });
    const subtitles = {
      1: "椭圆轨道 · 太阳位于焦点",
      2: "等面积定律 · 相等时间扫过相等面积",
      3: "周期定律 · 多行星共演 · T² 与 a³ 成正比"
    };
    elements.sceneSubtitle.textContent = subtitles[law];

    // Reset area tracking when switching to law 2
    if (law === 2) {
      state.sweptSegments = [];
      state.areaBars = [0, 0, 0];
      state.areaBarTimes = [0, 0, 0];
      state.currentAreaIndex = 0;
    }
    render();
  }

  function setParameters(values) {
    const aDef = parameterSchema[0], eDef = parameterSchema[1], mDef = parameterSchema[2];
    const prevA = state.a;
    state.a = clamp(finite(Number(values.a), aDef.default), aDef.min, aDef.max);
    state.e = clamp(finite(Number(values.e), eDef.default), eDef.min, eDef.max);
    state.timeScale = clamp(finite(Number(values.timeScale), mDef.default), mDef.min, mDef.max);
    elements.aInput.value = String(state.a);
    elements.eInput.value = String(state.e);
    elements.mInput.value = String(state.timeScale);
    // If a changed, reset orbital state to avoid inconsistent phase
    if (Math.abs(prevA - state.a) > 0.01) {
      state.t = 0;
      state.M = 0;
      state.trail = [];
      state.sweptSegments = [];
      state.areaBars = [0, 0, 0];
      state.areaBarTimes = [0, 0, 0];
      state.currentAreaIndex = 0;
    }
    render();
  }

  function getState() {
    return { ...state, trail: [...state.trail], sweptSegments: [...state.sweptSegments] };
  }

  function getReadouts() {
    return {
      a: state.a, e: state.e, T: computePeriod(state.a),
      t: state.t, r: state.r, v: state.v,
      M: state.M, E: state.E, theta: state.theta,
      law: state.law, timeScale: state.timeScale
    };
  }

  function runModelChecks() {
    // Check 1: Kepler equation solver convergence
    const testE = solveKepler(1.0, 0.5);
    const keplerResidual = testE - 0.5 * Math.sin(testE) - 1.0;

    // Check 2: Period formula T = a^(3/2)
    const T2 = computePeriod(2);
    const T2Expected = Math.pow(2, 1.5);

    // Check 3: T²/a³ = 1 for all test cases
    const ratios = [1, 2, 3, 4, 5].map(a => {
      const T = computePeriod(a);
      return (T * T) / (a * a * a);
    });
    const ratioMaxDev = Math.max(...ratios.map(r => Math.abs(r - 1)));

    // Check 4: Position at periapsis (M=0) should be r = a(1-e)
    const periPos = computePosition(2, 0.5, 0);
    const periRExpected = 2 * (1 - 0.5);

    // Check 5: Position at apoapsis (M=π) should be r = a(1+e)
    const apoPos = computePosition(2, 0.5, Math.PI);
    const apoRExpected = 2 * (1 + 0.5);

    // Check 6: Vis-viva equation: v² = GM(2/r - 1/a)
    const midPos = computePosition(2, 0.5, 1.0);
    const vExpected = Math.sqrt(GM * (2 / midPos.r - 1 / 2));
    const vError = Math.abs(midPos.v - vExpected);

    // Check 7: Angular momentum conservation L = r × v_perp should be constant
    // At periapsis: r=a(1-e), v = sqrt(GM/a * (1+e)/(1-e))
    // At apoapsis: r=a(1+e), v = sqrt(GM/a * (1-e)/(1+e))
    // L = r * v at both points (since v is perpendicular at apsides)
    const vPeri = Math.sqrt(GM / 2 * (1 + 0.5) / (1 - 0.5));
    const vApo = Math.sqrt(GM / 2 * (1 - 0.5) / (1 + 0.5));
    const LPeri = periRExpected * vPeri;
    const LApo = apoRExpected * vApo;
    const LError = Math.abs(LPeri - LApo) / LPeri;

    // Check 8: Area rate consistency (qualitative - areas should be roughly equal)
    // Simulate one full orbit and check area bars
    const simArea = (a, e, duration, dt) => {
      const n = Math.sqrt(GM / (a * a * a));
      const period = 2 * Math.PI / n;
      const third = period / 3;
      let bars = [0, 0, 0];
      let M = 0;
      let prevPos = computePosition(a, e, 0);
      for (let t = 0; t < duration; t += dt) {
        M += n * dt;
        const pos = computePosition(a, e, M);
        const dtheta = pos.theta - prevPos.theta;
        const rAvg = (pos.r + prevPos.r) / 2;
        const dA = 0.5 * rAvg * rAvg * Math.abs(dtheta);
        const cycleT = t % period;
        const idx = Math.floor(cycleT / third);
        if (idx >= 0 && idx < 3) bars[idx] += dA;
        prevPos = pos;
      }
      return bars;
    };
    const bars = simArea(2, 0.5, computePeriod(2), 1/240);
    const areaMaxDev = Math.max(...bars.map(b => Math.abs(b - bars[0]) / bars[0]));

    // Check 9: Law 3 multi-planet — all reference points lie on T²=a³ line
    const refLineErrors = referencePlanets.map(ref => {
      const T = computePeriod(ref.a);
      return Math.abs(T * T - Math.pow(ref.a, 3));
    });
    const refLineMaxErr = Math.max(...refLineErrors);

    // Check 10: Law 3 current planet also on the line
    const curT = computePeriod(state.a);
    const curLineErr = Math.abs(curT * curT - Math.pow(state.a, 3));

    return [
      { name: "开普勒方程求解收敛", pass: Math.abs(keplerResidual) < 1e-8, expected: "残差 < 1e-8", actual: keplerResidual, tolerance: 1e-8 },
      { name: "周期公式 T=a^(3/2)", pass: Math.abs(T2 - T2Expected) < 1e-10, expected: T2Expected, actual: T2, tolerance: 1e-10 },
      { name: "T²/a³ = 1 (GM=4π²)", pass: ratioMaxDev < 1e-10, expected: "所有比值 = 1", actual: ratios, tolerance: 1e-10 },
      { name: "近日点距离 r=a(1-e)", pass: Math.abs(periPos.r - periRExpected) < 0.001, expected: periRExpected, actual: periPos.r, tolerance: 0.001 },
      { name: "远日点距离 r=a(1+e)", pass: Math.abs(apoPos.r - apoRExpected) < 0.001, expected: apoRExpected, actual: apoPos.r, tolerance: 0.001 },
      { name: "活力公式 v²=GM(2/r-1/a)", pass: vError < 0.001, expected: vExpected, actual: midPos.v, tolerance: 0.001 },
      { name: "角动量守恒 L_peri=L_apo", pass: LError < 0.001, expected: LPeri, actual: LApo, tolerance: 0.001 },
      { name: "等面积定律（三段面积一致）", pass: areaMaxDev < 0.02, expected: "三段面积偏差 < 2%", actual: `偏差 ${ (areaMaxDev * 100).toFixed(2) }%`, tolerance: 0.02 },
      { name: "第三定律参考点均在 T²=a³ 直线上", pass: refLineMaxErr < 1e-10, expected: "偏差 < 1e-10", actual: refLineMaxErr, tolerance: 1e-10 },
      { name: "第三定律当前行星在直线上", pass: curLineErr < 1e-10, expected: "偏差 < 1e-10", actual: curLineErr, tolerance: 1e-10 }
    ];
  }

  function bindControls() {
    elements.startBtn.addEventListener("click", start);
    elements.pauseBtn.addEventListener("click", pause);
    elements.resetBtn.addEventListener("click", reset);
    elements.lawBtns.forEach(btn => {
      btn.addEventListener("click", () => setLaw(parseInt(btn.dataset.law)));
    });
    elements.aInput.addEventListener("input", () => setParameters({ a: elements.aInput.value, e: state.e, timeScale: state.timeScale }));
    elements.eInput.addEventListener("input", () => setParameters({ a: state.a, e: elements.eInput.value, timeScale: state.timeScale }));
    elements.mInput.addEventListener("input", () => setParameters({ a: state.a, e: state.e, timeScale: elements.mInput.value }));
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, setLaw, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
