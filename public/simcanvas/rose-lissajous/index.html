<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>玫瑰线 / 利萨如曲线</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #eef3f8;
      --sim-surface: #ffffff;
      --sim-surface-soft: #f8fafc;
      --sim-text: #172033;
      --sim-muted: #657188;
      --sim-border: #dfe6ef;
      --sim-grid: #e8edf4;
      --sim-accent: #0f9fba;
      --sim-accent-deep: #08758a;
      --sim-accent-soft: #d9f4f7;
      --sim-positive: #0f9fba;
      --sim-warning: #f59e0b;
      --sim-danger: #dc2626;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
        var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
    .status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 2.15fr) minmax(280px, 0.55fr); gap: 12px; }
    .panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
    #scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); }
    .side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
    .readouts, .model-note { padding: 17px; }
    .readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric { padding: 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
    .metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
    .metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .model-note { display: grid; align-content: start; gap: 14px; }
    .model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
    .insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; }
    .controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr) minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
    button:hover { border-color: #c7d2e2; background: #eef3f9; }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
    .control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
    .grid-line { stroke: var(--sim-grid); stroke-width: 1; }
    .axis { stroke: #9aa7ba; stroke-width: 1.5; }
    #trace { fill: none; stroke: var(--sim-accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 3px 4px rgba(15,159,186,.18)); }
    #markerHalo { fill: rgba(15,159,186,.14); }
    #marker { fill: var(--sim-positive); stroke: white; stroke-width: 3; }
    .axis-label { fill: var(--sim-muted); font-size: 12px; }
    @media (max-width: 860px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
      .scene-panel { min-height: 0; }
      #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="app" data-layout="visualization-first" data-model-tier="analytic">
    <header class="header" data-region="header">
      <div>
        <h1>玫瑰线 / 利萨如曲线</h1>
        <p>调节频率比与相位，观察参数曲线如何随时间生长。</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head"><h2 id="scene-title">参数曲线</h2><span>x = sin(a·t + φ)，y = sin(b·t)</span></div>
        <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
          <desc id="scene-desc">一条随时间逐步绘出的参数曲线，当前绘制点以高亮圆点标示。</desc>
          <defs>
            <linearGradient id="traceGlow" x1="0" x2="1"><stop stop-color="#0f9fba"></stop><stop offset="1" stop-color="#08758a"></stop></linearGradient>
          </defs>
          <g id="grid"></g>
          <line class="axis" x1="380" y1="30" x2="380" y2="390"></line>
          <line class="axis" x1="40" y1="210" x2="720" y2="210"></line>
          <polyline id="trace" points="" stroke="url(#traceGlow)"></polyline>
          <circle id="markerHalo" cx="380" cy="210" r="15"></circle>
          <circle id="marker" cx="380" cy="210" r="7"></circle>
        </svg>
      </section>

      <aside class="side" data-region="evidence">
        <section class="panel readouts" aria-label="实时数值">
          <div class="readout-grid">
            <div class="metric"><small>参数 t</small><strong id="timeReadout">0.00</strong></div>
            <div class="metric"><small>已绘点数</small><strong id="pointReadout">0</strong></div>
          </div>
        </section>
        <section class="panel model-note" data-region="insight">
          <div class="panel-head"><h2>模型</h2></div>
          <p id="insight" class="insight">按"开始"启动。曲线随时间生长，当频率比为有理数时闭合。</p>
          <p>教学视图：x = sin(a·t + φ)，y = sin(b·t)。半径与坐标轴仅为视觉参照，不表示物理量。</p>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="仿真控制">
      <div class="actions">
        <button id="startBtn" class="primary" type="button">开始</button>
        <button id="pauseBtn" type="button">暂停</button>
        <button id="resetBtn" type="button">重置</button>
      </div>
      <div class="control">
        <label for="aInput">频率 a <output id="aOutput">3</output></label>
        <input id="aInput" type="range" min="1" max="9" step="1" value="3">
      </div>
      <div class="control">
        <label for="bInput">频率 b <output id="bOutput">2</output></label>
        <input id="bInput" type="range" min="1" max="9" step="1" value="2">
      </div>
      <div class="control">
        <label for="phiInput">相位 φ <output id="phiOutput">0.00 π</output></label>
        <input id="phiInput" type="range" min="0" max="1" step="0.05" value="0">
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";
    const parameterSchema = [
      { key: "a", label: "频率 a", type: "slider", min: 1, max: 9, step: 1, default: 3, unit: "" },
      { key: "b", label: "频率 b", type: "slider", min: 1, max: 9, step: 1, default: 2, unit: "" },
      { key: "phi", label: "相位 φ", type: "slider", min: 0, max: 1, step: 0.05, default: 0, unit: "π" }
    ];
    const state = {
      running: false,
      t: 0,
      a: 3,
      b: 2,
      phi: 0,
      lastTimestamp: null,
      history: [],
      maxTime: 2 * Math.PI
    };
    const elements = {
      status: document.querySelector("#status"),
      trace: document.querySelector("#trace"),
      marker: document.querySelector("#marker"),
      markerHalo: document.querySelector("#markerHalo"),
      insight: document.querySelector("#insight"),
      grid: document.querySelector("#grid"),
      timeReadout: document.querySelector("#timeReadout"),
      pointReadout: document.querySelector("#pointReadout"),
      aInput: document.querySelector("#aInput"),
      aOutput: document.querySelector("#aOutput"),
      bInput: document.querySelector("#bInput"),
      bOutput: document.querySelector("#bOutput"),
      phiInput: document.querySelector("#phiInput"),
      phiOutput: document.querySelector("#phiOutput"),
      startBtn: document.querySelector("#startBtn"),
      pauseBtn: document.querySelector("#pauseBtn"),
      resetBtn: document.querySelector("#resetBtn")
    };

    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

    function initGrid() {
      const lines = [];
      for (let i = -3; i <= 3; i += 1) {
        const x = 380 + i * 100;
        const y = 210 + i * 50;
        if (x >= 40 && x <= 720) lines.push(`<line class="grid-line" x1="${x}" y1="30" x2="${x}" y2="390"></line>`);
        if (y >= 30 && y <= 390) lines.push(`<line class="grid-line" x1="40" y1="${y}" x2="720" y2="${y}"></line>`);
      }
      elements.grid.innerHTML = lines.join("");
    }

    function pointAt(t) {
      const cx = 380, cy = 210, rx = 320, ry = 160;
      const x = cx + rx * Math.sin(state.a * t + state.phi * Math.PI);
      const y = cy + ry * Math.sin(state.b * t);
      return { x, y };
    }

    function init() {
      initGrid();
      bindControls();
      setParameters({ a: 3, b: 2, phi: 0 });
      reset();
      requestAnimationFrame(frame);
    }

    function start() {
      state.running = true;
      elements.status.textContent = "运行中";
      elements.startBtn.setAttribute("aria-pressed", "true");
    }

    function pause() {
      state.running = false;
      elements.status.textContent = "已暂停";
      elements.startBtn.setAttribute("aria-pressed", "false");
    }

    function reset() {
      pause();
      state.t = 0;
      state.lastTimestamp = null;
      state.history = [];
      render();
    }

    function update(dt) {
      if (!state.running) return;
      const boundedDt = clamp(finite(dt, 0), 0, 0.05);
      state.t += boundedDt;
      if (state.t > state.maxTime) state.t = state.maxTime;
      const p = pointAt(state.t);
      if (state.history.length === 0 || state.t - state.history[state.history.length - 1].t >= 0.02) {
        state.history.push({ t: state.t, x: p.x, y: p.y });
        if (state.history.length > 800) state.history.shift();
      }
    }

    function render() {
      const pts = state.history.map(s => `${s.x},${s.y}`).join(" ");
      elements.trace.setAttribute("points", pts);
      const cur = pointAt(state.t);
      elements.marker.setAttribute("cx", cur.x);
      elements.marker.setAttribute("cy", cur.y);
      elements.markerHalo.setAttribute("cx", cur.x);
      elements.markerHalo.setAttribute("cy", cur.y);
      const ratio = `${state.a}:${state.b}`;
      const isRational = Number.isInteger(state.a) && Number.isInteger(state.b);
      elements.insight.textContent = !state.running && state.t === 0
        ? "按\"开始\"启动。曲线随时间生长，当频率比为有理数时闭合。"
        : state.t >= state.maxTime
          ? `曲线已闭合（频率比 ${ratio}）。调节参数可生成新的玫瑰线或利萨如图形。`
          : `正在绘制频率比 ${ratio} 的参数曲线，相位 φ = ${(state.phi).toFixed(2)}π。`;
      elements.timeReadout.textContent = state.t.toFixed(2);
      elements.pointReadout.textContent = String(state.history.length);
      elements.aOutput.textContent = String(state.a);
      elements.bOutput.textContent = String(state.b);
      elements.phiOutput.textContent = `${state.phi.toFixed(2)} π`;
    }

    function setParameters(values) {
      const aDef = parameterSchema[0], bDef = parameterSchema[1], phiDef = parameterSchema[2];
      state.a = clamp(finite(Number(values.a), aDef.default), aDef.min, aDef.max);
      state.b = clamp(finite(Number(values.b), bDef.default), bDef.min, bDef.max);
      state.phi = clamp(finite(Number(values.phi), phiDef.default), phiDef.min, phiDef.max);
      elements.aInput.value = String(state.a);
      elements.bInput.value = String(state.b);
      elements.phiInput.value = String(state.phi);
      render();
    }

    function getState() {
      return { ...state, history: state.history.map(s => ({ ...s })) };
    }

    function getReadouts() {
      return { t: state.t, points: state.history.length, a: state.a, b: state.b, phi: state.phi };
    }

    function runModelChecks() {
      const p0 = pointAt(0);
      const pPi = pointAt(Math.PI);
      const symmetry = Math.abs(p0.x - 380) < 1e-9 && Math.abs(p0.y - 210) < 1e-9;
      const piCheck = Math.abs(Math.sin(state.a * Math.PI + state.phi * Math.PI)) < 1e-9;
      return [
        { name: "原点起始", pass: symmetry, expected: "(380,210)", actual: `(${p0.x},${p0.y})`, tolerance: 1e-9 },
        { name: "π 点对称性", pass: piCheck, expected: "sin(a·π+φ)≈0", actual: Math.sin(state.a * Math.PI + state.phi * Math.PI), tolerance: 1e-9 },
        { name: "有理闭合", pass: state.t >= state.maxTime, expected: "t≥2π", actual: state.t, tolerance: 0 }
      ];
    }

    function bindControls() {
      elements.startBtn.addEventListener("click", start);
      elements.pauseBtn.addEventListener("click", pause);
      elements.resetBtn.addEventListener("click", reset);
      elements.aInput.addEventListener("input", () => setParameters({ a: elements.aInput.value, b: state.b, phi: state.phi }));
      elements.bInput.addEventListener("input", () => setParameters({ a: state.a, b: elements.bInput.value, phi: state.phi }));
      elements.phiInput.addEventListener("input", () => setParameters({ a: state.a, b: state.b, phi: elements.phiInput.value }));
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    window.simulation = {
      init,
      start,
      pause,
      reset,
      update,
      render,
      setParameters,
      getState,
      getReadouts,
      runModelChecks
    };
    init();
  })();
  </script>
</body>
</html>
