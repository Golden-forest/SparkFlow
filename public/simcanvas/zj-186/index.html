<style>

<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>节拍涟漪壁纸</h1>
      <p>4/4 节拍驱动同心涟漪扩散，微光点随波纹亮度调制</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">运行中</div>
  </header>

  <section class="stage" data-region="stage" aria-label="涟漪场景">
    <canvas id="canvas" role="img" aria-label="节拍涟漪动画画布"></canvas>
    <div class="formula" aria-hidden="true">
      <span class="name">Beat Ripple Wallpaper</span>
      r_n(t) = v · (t − t_n)<br>
      I = exp(−λ · (t − t_n))
    </div>
    <aside class="evidence" data-region="evidence" aria-label="实时读数">
      <div class="metric"><small>时间</small><strong id="timeReadout">0.00 s</strong></div>
      <div class="metric"><small>频谱峰值</small><strong id="peakReadout">0.000</strong></div>
    </aside>
    <div class="insight" data-region="insight" id="insight">重拍触发最强涟漪，弱拍补充节奏层次。</div>
  </section>

  <section class="controls" data-region="controls" aria-label="模拟控制">
    <button id="playBtn" class="play-btn" type="button" aria-label="暂停" title="暂停 / 播放">
      <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="6" y="5" width="4" height="14" rx="1"/>
        <rect x="14" y="5" width="4" height="14" rx="1"/>
      </svg>
      <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 5 L19 12 L7 19 Z"/>
      </svg>
    </button>
  </section>
</div>

<script>
(() => {
  "use strict";

  // ============ 常量 ============
  const BEAT_INTERVAL = 0.5;
  const BEATS_PER_MEASURE = 4;
  const MEASURE_DURATION = BEAT_INTERVAL * BEATS_PER_MEASURE;
  const RIPPLE_SPEED = 200;
  const DECAY_LAMBDA = 0.55;
  const MAX_RIPPLE_AGE = 7.5;
  const SPECTRUM_BANDS = 64;
  const STAR_COUNT = 240;
  const RIPPLE_RGB = [77, 217, 230];
  const STAR_RGB = [235, 248, 255];
  const CENTER_Y_RATIO = 0.42;

  // ============ 状态 ============
  const state = {
    running: true,
    t: 0,
    lastTimestamp: null,
    cx: 0, cy: 0,
    w: 0, h: 0,
    dpr: 1,
    stars: [],
    spectrum: new Array(SPECTRUM_BANDS).fill(0),
    rippleCenterPulse: 0,
  };

  // ============ DOM ============
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", { alpha: false });
  const playBtn = document.getElementById("playBtn");
  const statusEl = document.getElementById("status");
  const timeReadout = document.getElementById("timeReadout");
  const peakReadout = document.getElementById("peakReadout");
  const insightEl = document.getElementById("insight");

  // ============ 工具 ============
  function clamp(v, mn, mx) { return Math.min(mx, Math.max(mn, v)); }
  function finite(v, fb) { return Number.isFinite(v) ? v : fb; }

  // ============ 确定性伪随机 ============
  function makeRng(seed) {
    let s = seed | 0;
    if (s === 0) s = 1;
    return () => {
      s = (Math.imul(s, 1664525) + 1013904223) | 0;
      return ((s >>> 0) % 1000000) / 1000000;
    };
  }

  // ============ 模拟频谱 ============
  function updateSpectrum(t) {
    const beatPhase = t / BEAT_INTERVAL;
    const beatInMeasure = ((beatPhase % BEATS_PER_MEASURE) + BEATS_PER_MEASURE) % BEATS_PER_MEASURE;
    const measureBeat = Math.floor(beatInMeasure);
    const beatFrac = beatInMeasure - measureBeat;
    const beatAmp = Math.exp(-beatFrac * 4.2);
    const beatStrength = [1.0, 0.42, 0.68, 0.42][measureBeat] || 0.42;
    const beatEnv = beatAmp * beatStrength;

    for (let i = 0; i < SPECTRUM_BANDS; i++) {
      const freqIdx = i / (SPECTRUM_BANDS - 1);
      const baseAmp = Math.exp(-freqIdx * 2.6);
      const slow = 0.5 + 0.5 * Math.sin(t * (0.27 + i * 0.041) + i * 0.83);
      const beatCoupling = 1 - freqIdx * 0.55;
      const amp = baseAmp * (0.32 + 0.68 * slow) * (0.28 + 0.72 * beatEnv * beatCoupling);
      state.spectrum[i] = amp;
    }
  }

  // ============ 涟漪源 ============
  function getRippleSources(t) {
    const sources = [];
    const startBeat = Math.floor((t - MAX_RIPPLE_AGE) / BEAT_INTERVAL);
    const endBeat = Math.floor(t / BEAT_INTERVAL);
    for (let b = startBeat; b <= endBeat; b++) {
      if (b < 0) continue;
      const tn = b * BEAT_INTERVAL;
      const age = t - tn;
      if (age < 0 || age > MAX_RIPPLE_AGE) continue;
      const beatInMeasure = b % BEATS_PER_MEASURE;
      const strength = [1.0, 0.42, 0.68, 0.42][beatInMeasure] || 0.42;
      sources.push({ tn, age, strength, beatInMeasure });
    }
    return sources;
  }

  // ============ 微光点亮度调制 ============
  function starBrightnessMod(starX, starY, t, sources) {
    let mod = 0;
    const cx = state.cx, cy = state.cy;
    for (let i = 0; i < sources.length; i++) {
      const s = sources[i];
      const r = RIPPLE_SPEED * s.age;
      const dx = starX - cx, dy = starY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const delta = dist - r;
      const absDelta = Math.abs(delta);
      if (absDelta < 22) {
        const peak = Math.exp(-absDelta * absDelta * 0.022);
        const decay = Math.exp(-DECAY_LAMBDA * s.age);
        mod += peak * decay * s.strength;
      }
    }
    return mod;
  }

  // ============ 初始化 ============
  function initStars() {
    const rng = makeRng(20240917);
    state.stars = [];
    for (let i = 0; i < STAR_COUNT; i++) {
      state.stars.push({
        x: rng(),
        y: rng(),
        baseB: 0.06 + rng() * 0.22,
        phase: rng() * Math.PI * 2,
        twinkleSpeed: 0.4 + rng() * 1.6,
        size: rng() < 0.82 ? 1 : 1.5,
      });
    }
  }

  function resize() {
    state.dpr = Math.min(window.devicePixelRatio || 1, 2);
    state.w = window.innerWidth;
    state.h = window.innerHeight;
    canvas.width = Math.max(1, Math.floor(state.w * state.dpr));
    canvas.height = Math.max(1, Math.floor(state.h * state.dpr));
    canvas.style.width = state.w + "px";
    canvas.style.height = state.h + "px";
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    state.cx = state.w / 2;
    state.cy = state.h * CENTER_Y_RATIO;
  }

  // ============ 绘制：背景 ============
  function drawBackground() {
    const cx = state.cx, cy = state.cy;
    const maxR = Math.hypot(state.w, state.h);
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
    grad.addColorStop(0, "#0c1a2e");
    grad.addColorStop(0.45, "#070d1a");
    grad.addColorStop(1, "#03060d");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, state.w, state.h);
  }

  // ============ 绘制：微光点 ============
  function drawStars(t, sources) {
    const cx = state.cx, cy = state.cy;
    const w = state.w, h = state.h;
    const [sr, sg, sb] = STAR_RGB;
    const stars = state.stars;
    const len = stars.length;
    for (let i = 0; i < len; i++) {
      const star = stars[i];
      const sx = star.x * w;
      const sy = star.y * h;
      const twinkle = 0.55 + 0.45 * Math.sin(t * star.twinkleSpeed + star.phase);
      const mod = starBrightnessMod(sx, sy, t, sources);
      const brightness = clamp(star.baseB * twinkle + mod * 0.85, 0, 1);
      if (brightness < 0.015) continue;
      const a = brightness * 0.9;
      ctx.fillStyle = `rgba(${sr},${sg},${sb},${a})`;
      ctx.beginPath();
      ctx.arc(sx, sy, star.size, 0, Math.PI * 2);
      ctx.fill();
      if (brightness > 0.5) {
        const ha = (brightness - 0.5) * 0.4;
        ctx.fillStyle = `rgba(${sr},${sg},${sb},${ha})`;
        ctx.beginPath();
        ctx.arc(sx, sy, star.size * 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ============ 绘制：涟漪 ============
  function drawRipples(t, sources) {
    const cx = state.cx, cy = state.cy;
    const [r, g, b] = RIPPLE_RGB;
    const maxR = Math.hypot(state.w, state.h) * 0.65;
    const len = sources.length;

    for (let i = 0; i < len; i++) {
      const s = sources[i];
      const radius = RIPPLE_SPEED * s.age;
      if (radius < 1 || radius > maxR) continue;
      const decay = Math.exp(-DECAY_LAMBDA * s.age);
      const intensity = decay * s.strength;
      if (intensity < 0.008) continue;
      const alpha = intensity * 0.22;
      const lw = 2.5 + 7 * intensity;
      ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.stroke();
    }

    for (let i = 0; i < len; i++) {
      const s = sources[i];
      const radius = RIPPLE_SPEED * s.age;
      if (radius < 1 || radius > maxR) continue;
      const decay = Math.exp(-DECAY_LAMBDA * s.age);
      const intensity = decay * s.strength;
      if (intensity < 0.008) continue;
      const alpha = intensity * 0.88;
      const lw = 1 + 1.4 * intensity;
      ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // ============ 绘制：中心脉冲 ============
  function drawCenterPulse(t) {
    const cx = state.cx, cy = state.cy;
    const [r, g, b] = RIPPLE_RGB;
    const beatPhase = t / BEAT_INTERVAL;
    const beatInMeasure = ((beatPhase % BEATS_PER_MEASURE) + BEATS_PER_MEASURE) % BEATS_PER_MEASURE;
    const measureBeat = Math.floor(beatInMeasure);
    const beatFrac = beatInMeasure - measureBeat;
    const beatStrength = [1.0, 0.42, 0.68, 0.42][measureBeat] || 0.42;
    const pulseEnv = Math.exp(-beatFrac * 5.5) * beatStrength;
    state.rippleCenterPulse = pulseEnv;
    if (pulseEnv < 0.02) return;
    const radius = 28 + 90 * pulseEnv;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
    grad.addColorStop(0, `rgba(${r},${g},${b},${pulseEnv * 0.5})`);
    grad.addColorStop(0.4, `rgba(${r},${g},${b},${pulseEnv * 0.18})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  // ============ update(dt)：模型推进 ============
  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05);
    state.t += boundedDt;
    updateSpectrum(state.t);
  }

  // ============ render()：从状态派生全部视图 ============
  function render() {
    const sources = getRippleSources(state.t);
    drawBackground();
    drawStars(state.t, sources);
    drawRipples(state.t, sources);
    drawCenterPulse(state.t);

    timeReadout.textContent = state.t.toFixed(2) + " s";
    let peak = 0;
    for (let i = 0; i < SPECTRUM_BANDS; i++) {
      if (state.spectrum[i] > peak) peak = state.spectrum[i];
    }
    peakReadout.textContent = peak.toFixed(3);

    const beatPhase = state.t / BEAT_INTERVAL;
    const beatInMeasure = ((beatPhase % BEATS_PER_MEASURE) + BEATS_PER_MEASURE) % BEATS_PER_MEASURE;
    const measureBeat = Math.floor(beatInMeasure);
    const beatFrac = beatInMeasure - measureBeat;
    const isOnBeat = beatFrac < 0.12;
    const beatStrengths = [1.0, 0.42, 0.68, 0.42];
    const isDownbeat = measureBeat === 0;

    if (!state.running) {
      insightEl.textContent = "已暂停 — 涟漪冻结在当前时刻。";
    } else if (isOnBeat && isDownbeat) {
      insightEl.textContent = "重拍：最强涟漪从中心扩散，微光点被波纹点亮。";
    } else if (isOnBeat) {
      insightEl.textContent = `第 ${measureBeat + 1} 拍（强度 ${beatStrengths[measureBeat]}）：涟漪层次递减。`;
    } else {
      insightEl.textContent = "拍间：涟漪持续扩散并衰减，等待下一拍。";
    }

    statusEl.textContent = state.running ? "运行中" : "已暂停";
  }

  // ============ 主循环 ============
  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    let dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    dt = clamp(finite(dt, 0), 0, 0.05);
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // ============ 生命周期 ============
  function start() {
    state.running = true;
    state.lastTimestamp = null;
    playBtn.classList.remove("paused");
    playBtn.setAttribute("aria-label", "暂停");
    playBtn.title = "暂停 / 播放";
  }
  function pause() {
    state.running = false;
    playBtn.classList.add("paused");
    playBtn.setAttribute("aria-label", "播放");
    playBtn.title = "暂停 / 播放";
  }
  function reset() {
    state.t = 0;
    state.lastTimestamp = null;
    state.rippleCenterPulse = 0;
    for (let i = 0; i < SPECTRUM_BANDS; i++) state.spectrum[i] = 0;
  }
  function setParameters() {}
  function getState() {
    return { running: state.running, t: state.t, spectrum: state.spectrum.slice(), rippleCenterPulse: state.rippleCenterPulse };
  }
  function getReadouts() {
    return { time: state.t, running: state.running, spectrumPeak: Math.max(...state.spectrum) };
  }
  function runModelChecks() {
    const r1 = RIPPLE_SPEED * 1.0;
    const r2 = RIPPLE_SPEED * 2.0;
    const linearOk = Math.abs(r2 - 2 * r1) < 1e-6 && r1 === RIPPLE_SPEED;

    const I0 = Math.exp(-DECAY_LAMBDA * 0);
    const I1 = Math.exp(-DECAY_LAMBDA * 1);
    const I2 = Math.exp(-DECAY_LAMBDA * 2);
    const decayMonotonic = I0 > I1 && I1 > I2 && I0 === 1;

    const strengths = [1.0, 0.42, 0.68, 0.42];
    const beatOrderOk = strengths[0] > strengths[2] && strengths[2] > strengths[1] && strengths[1] === strengths[3];

    const lowFreq = Math.exp(-0 / SPECTRUM_BANDS * 2.6);
    const highFreq = Math.exp(-1 * 2.6);
    const spectrumOrderOk = lowFreq > highFreq && lowFreq === 1;

    const beatIntervalOk = BEAT_INTERVAL === 0.5 && MEASURE_DURATION === 2.0;

    const s1 = [];
    const s2 = [];
    const testT = 3.7;
    const origSpec = state.spectrum.slice();
    updateSpectrum(testT);
    for (let i = 0; i < SPECTRUM_BANDS; i++) s1.push(state.spectrum[i]);
    updateSpectrum(testT);
    for (let i = 0; i < SPECTRUM_BANDS; i++) s2.push(state.spectrum[i]);
    state.spectrum = origSpec;
    let deterministic = true;
    for (let i = 0; i < SPECTRUM_BANDS; i++) {
      if (Math.abs(s1[i] - s2[i]) > 1e-12) { deterministic = false; break; }
    }

    const testSources = [{ tn: 0, age: 1.0, strength: 1.0, beatInMeasure: 0 }];
    const testR = RIPPLE_SPEED * 1.0;
    const onPeak = starBrightnessMod(state.cx + testR, state.cy, 1.0, testSources);
    const offPeak = starBrightnessMod(state.cx + testR + 50, state.cy, 1.0, testSources);
    const modOk = onPeak > offPeak && onPeak > 0;

    return [
      { name: "涟漪半径线性增长 r=v·t", pass: linearOk, expected: `r(2s)=${2 * RIPPLE_SPEED}`, actual: r2, tolerance: "exact" },
      { name: "亮度指数衰减单调递减", pass: decayMonotonic, expected: "I(0)>I(1)>I(2), I(0)=1", actual: `I(0)=${I0}, I(1)=${I1}, I(2)=${I2}`, tolerance: "strict" },
      { name: "节拍强度排序 重>次重>弱", pass: beatOrderOk, expected: "s[0]>s[2]>s[1]=s[3]", actual: `[${strengths.join(", ")}]`, tolerance: "strict" },
      { name: "频谱低频>高频", pass: spectrumOrderOk, expected: "baseAmp(0)>baseAmp(63)", actual: `low=${lowFreq}, high=${highFreq}`, tolerance: "strict" },
      { name: "节拍间隔 0.5s / 小节 2.0s", pass: beatIntervalOk, expected: "0.5s / 2.0s", actual: `${BEAT_INTERVAL}s / ${MEASURE_DURATION}s`, tolerance: "exact" },
      { name: "频谱确定性（相同时间相同输出）", pass: deterministic, expected: "s1===s2", actual: `maxDiff=${s1.map((v, i) => Math.abs(v - s2[i])).reduce((a, b) => Math.max(a, b), 0)}`, tolerance: "1e-12" },
      { name: "微光点波峰调制最大", pass: modOk, expected: "onPeak > offPeak > 0", actual: `onPeak=${onPeak.toFixed(4)}, offPeak=${offPeak.toFixed(4)}`, tolerance: "strict" },
    ];
  }

  // ============ 事件绑定 ============
  function bindControls() {
    playBtn.addEventListener("click", () => {
      if (state.running) pause(); else start();
    });
    window.addEventListener("resize", resize);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) state.lastTimestamp = null;
    });
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        if (state.running) pause(); else start();
      }
    });
  }

  function init() {
    resize();
    initStars();
    bindControls();
    requestAnimationFrame(frame);
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
