<!doctype html>
<html lang="zh-CN">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>焰色反应</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #0a0e1a;
      --sim-surface: #141925;
      --sim-surface-soft: #1a2030;
      --sim-text: #e8eefc;
      --sim-muted: #8b95a8;
      --sim-border: #2a3142;
      --sim-grid: #1f2535;
      --sim-accent: #f59e0b;
      --sim-accent-deep: #d97706;
      --sim-accent-soft: rgba(245, 158, 11, 0.15);
      --sim-positive: #10b981;
      --sim-warning: #f59e0b;
      --sim-danger: #ef4444;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 18px 46px rgba(0, 0, 0, 0.4);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(245, 158, 11, 0.08), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(239, 68, 68, 0.06), transparent 26%),
        var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(245, 158, 11, 0.4); outline-offset: 2px; }
    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
    .status { border: 1px solid rgba(245,158,11,.25); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent); font-weight: 780; white-space: nowrap; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 12px; }
    .panel { min-width: 0; background: rgba(20, 25, 37, 0.85); border: 1px solid var(--sim-border); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
    #scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid var(--sim-border); border-radius: 18px; background: radial-gradient(ellipse at 50% 80%, #1a2030 0%, #0a0e1a 70%); }
    .side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; }
    .readouts, .model-note { padding: 17px; }
    .readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric { padding: 14px; border: 1px solid var(--sim-border); border-radius: 15px; background: var(--sim-surface-soft); }
    .metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
    .metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .spectrum-panel { padding: 14px 17px; }
    #spectrum { width: 100%; height: 140px; display: block; border: 1px solid var(--sim-border); border-radius: 12px; background: #050810; }
    .model-note { display: grid; align-content: start; gap: 14px; }
    .model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
    .insight { padding: 14px; border-left: 3px solid var(--sim-accent); border-radius: 0 12px 12px 0; background: var(--sim-accent-soft); color: var(--sim-accent) !important; font-weight: 650; }
    .controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr) minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
    button:hover { border-color: #3a4258; background: #232a3d; }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(245,158,11,.20); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
    .control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
    .element-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .element-btn { padding: 10px 6px; text-align: center; border: 1px solid var(--sim-border); border-radius: 10px; background: var(--sim-surface-soft); cursor: pointer; transition: all .16s ease; }
    .element-btn:hover { border-color: #3a4258; background: #232a3d; }
    .element-btn.active { border-color: var(--sim-accent); background: var(--sim-accent-soft); }
    .element-btn .sym { font-size: 1.1rem; font-weight: 800; }
    .element-btn .name { font-size: 0.7rem; color: var(--sim-muted); margin-top: 2px; }
    .element-btn .swatch { width: 100%; height: 6px; border-radius: 3px; margin-top: 6px; }
    .auto-toggle { display: flex; align-items: center; gap: 8px; }
    .auto-toggle .toggle-label { font-size: 0.8rem; font-weight: 700; color: var(--sim-muted); }
    .auto-progress { height: 4px; border-radius: 2px; background: var(--sim-border); overflow: hidden; margin-top: 6px; }
    .auto-progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--sim-accent-deep), var(--sim-accent)); border-radius: 2px; transition: width .1s linear; }
    @media (max-width: 860px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
      .scene-panel { min-height: 0; }
      #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="app" data-layout="scene-first" data-model-tier="qualitative">
    <header class="header" data-region="header">
      <div>
        <h1>焰色反应</h1>
        <p>选择金属元素放入火焰，观察特征颜色与发射光谱的对应关系</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">就绪</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head"><h2 id="scene-title">火焰观察</h2><span>本生灯 · 铂丝 · 金属离子样品</span></div>
        <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
          <desc id="scene-desc">本生灯火焰，放入不同金属离子后呈现特征颜色。</desc>
          <defs>
            <radialGradient id="flameOuter" cx="50%" cy="85%" r="60%">
              <stop offset="0%" stop-color="#1a2030" stop-opacity="0"/>
              <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <!-- 台面 -->
          <rect x="0" y="380" width="760" height="40" fill="#0d1119"/>
          <line x1="0" y1="380" x2="760" y2="380" stroke="#1f2535" stroke-width="2"/>
          <!-- 本生灯 -->
          <g id="burner">
            <ellipse cx="380" cy="378" rx="55" ry="8" fill="#2a3142"/>
            <rect x="325" y="360" width="110" height="20" rx="4" fill="#3a4258"/>
            <rect x="365" y="280" width="30" height="85" fill="#4a5268"/>
            <rect x="365" y="280" width="30" height="85" fill="url(#metalShine)" opacity="0.3"/>
            <rect x="355" y="270" width="50" height="14" rx="3" fill="#3a4258"/>
            <ellipse cx="380" cy="272" rx="20" ry="4" fill="#1a2030"/>
          </g>
          <linearGradient id="metalShine" x1="0" x2="1">
            <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
            <stop offset="50%" stop-color="#fff" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
          <!-- 火焰组 -->
          <g id="flameGroup">
            <path id="flameOuter2" d="" fill="#3a4258" opacity="0.15"/>
            <path id="flameMid" d="" fill="#5a6278" opacity="0.25"/>
            <path id="flameInner" d="" fill="#8b95a8" opacity="0.4"/>
            <path id="flameCore" d="" fill="#d0d8e8" opacity="0.6"/>
          </g>
          <!-- 铂丝 -->
          <g id="wireGroup">
            <line id="wire" x1="380" y1="270" x2="380" y2="200" stroke="#c0c8d8" stroke-width="2.5" stroke-linecap="round"/>
            <circle id="wireTip" cx="380" cy="200" r="4" fill="#e8eefc"/>
          </g>
          <!-- 粒子层 -->
          <g id="particles"></g>
          <!-- 标签 -->
          <text id="elementLabel" x="380" y="50" text-anchor="middle" fill="#e8eefc" font-size="28" font-weight="800" opacity="0">—</text>
          <text id="colorLabel" x="380" y="78" text-anchor="middle" fill="#8b95a8" font-size="14" opacity="0">—</text>
        </svg>
      </section>

      <aside class="side" data-region="evidence">
        <section class="panel readouts" aria-label="实时数据">
          <div class="readout-grid">
            <div class="metric"><small>当前元素</small><strong id="elementReadout">未选择</strong></div>
            <div class="metric"><small>火焰颜色</small><strong id="colorReadout">—</strong></div>
            <div class="metric"><small>主波长</small><strong id="wavelengthReadout">—</strong></div>
            <div class="metric"><small>电子跃迁</small><strong id="transitionReadout">—</strong></div>
          </div>
        </section>
        <section class="panel spectrum-panel" aria-label="发射光谱">
          <div class="panel-head"><h2>发射光谱</h2><span>波长 380–780 nm</span></div>
          <svg id="spectrum" viewBox="0 0 400 140" role="img" aria-label="发射光谱图">
            <defs>
              <linearGradient id="spectrumBg" x1="0" x2="1">
                <stop offset="0%" stop-color="#3b0064"/>
                <stop offset="10%" stop-color="#4b0082"/>
                <stop offset="20%" stop-color="#0000ff"/>
                <stop offset="35%" stop-color="#00ff00"/>
                <stop offset="50%" stop-color="#ffff00"/>
                <stop offset="65%" stop-color="#ff7f00"/>
                <stop offset="80%" stop-color="#ff0000"/>
                <stop offset="100%" stop-color="#7f0000"/>
              </linearGradient>
            </defs>
            <rect x="20" y="20" width="360" height="80" fill="url(#spectrumBg)" opacity="0.25" rx="4"/>
            <g id="spectrumLines"></g>
            <line x1="20" y1="100" x2="380" y2="100" stroke="#3a4258" stroke-width="1"/>
            <g id="spectrumLabels">
              <text x="20" y="115" fill="#8b95a8" font-size="9" text-anchor="middle">400</text>
              <text x="110" y="115" fill="#8b95a8" font-size="9" text-anchor="middle">500</text>
              <text x="200" y="115" fill="#8b95a8" font-size="9" text-anchor="middle">600</text>
              <text x="290" y="115" fill="#8b95a8" font-size="9" text-anchor="middle">700</text>
              <text x="380" y="115" fill="#8b95a8" font-size="9" text-anchor="middle">780</text>
              <text x="200" y="132" fill="#8b95a8" font-size="9" text-anchor="middle">波长 nm</text>
            </g>
          </svg>
        </section>
        <section class="panel model-note" data-region="insight">
          <p id="insight" class="insight">选择一种金属元素，铂丝蘸取样品后置入火焰。观察火焰瞬间呈现的特征颜色。</p>
          <p>教学说明：电子受热激发至高能级，回落时发射特定波长光子。不同元素能级差不同，故颜色各异——这是元素鉴定的原子物理基础。</p>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="元素选择">
      <div class="actions">
        <button id="startBtn" class="primary" type="button">点燃</button>
        <button id="pauseBtn" type="button">暂停</button>
        <button id="resetBtn" type="button">清空</button>
        <div class="auto-toggle">
          <button id="autoBtn" type="button" aria-pressed="false">自动展示</button>
          <span class="toggle-label" id="autoLabel">OFF</span>
        </div>
      </div>
      <div class="element-grid" id="elementGrid" style="grid-column: span 2;">
        <div style="grid-column: span 2;" class="auto-progress"><div class="auto-progress-bar" id="autoProgressBar"></div></div>
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";

    const elementData = {
      none: { symbol: "—", name: "空焰", color: "#8b95a8", colorName: "淡蓝", lines: [], transition: "—" },
      Na: { symbol: "Na", name: "钠", color: "#ffb347", colorName: "持久的金黄色", lines: [{ wl: 589.0, intensity: 1.0 }], transition: "3p → 3s" },
      K: { symbol: "K", name: "钾", color: "#c9a0ff", colorName: "浅紫", lines: [{ wl: 404.4, intensity: 0.4 }, { wl: 766.5, intensity: 1.0 }], transition: "4p → 4s" },
      Cu: { symbol: "Cu", name: "铜", color: "#22dd44", colorName: "蓝绿", lines: [{ wl: 510.5, intensity: 0.8 }, { wl: 515.3, intensity: 1.0 }], transition: "4p → 4s" },
      Ca: { symbol: "Ca", name: "钙", color: "#ff8c42", colorName: "橙红", lines: [{ wl: 622.2, intensity: 1.0 }], transition: "3d → 4p" },
      Sr: { symbol: "Sr", name: "锶", color: "#ff3030", colorName: "洋红", lines: [{ wl: 606.0, intensity: 0.7 }, { wl: 670.8, intensity: 1.0 }], transition: "5s → 5p" },
      Ba: { symbol: "Ba", name: "钡", color: "#7eff5a", colorName: "黄绿", lines: [{ wl: 524.3, intensity: 0.6 }, { wl: 577.8, intensity: 1.0 }], transition: "6s → 6p" }
    };

    const autoSequence = ["Na", "K", "Cu", "Ca", "Sr", "Ba"];
    const autoDwell = 5.0; // 每种元素停留秒数

    const parameterSchema = [
      { key: "element", label: "元素", type: "select", options: ["none","Na","K","Cu","Ca","Sr","Ba"], default: "none", unit: "" }
    ];

    const state = {
      running: false,
      currentElement: "none",
      flameIntensity: 0,
      targetIntensity: 0,
      particles: [],
      lastTimestamp: null,
      flameTime: 0,
      autoShow: false,
      autoIndex: 0,
      autoTimer: 0
    };

    const elements = {
      status: document.querySelector("#status"),
      flameOuter2: document.querySelector("#flameOuter2"),
      flameMid: document.querySelector("#flameMid"),
      flameInner: document.querySelector("#flameInner"),
      flameCore: document.querySelector("#flameCore"),
      wire: document.querySelector("#wire"),
      wireTip: document.querySelector("#wireTip"),
      particles: document.querySelector("#particles"),
      elementLabel: document.querySelector("#elementLabel"),
      colorLabel: document.querySelector("#colorLabel"),
      elementReadout: document.querySelector("#elementReadout"),
      colorReadout: document.querySelector("#colorReadout"),
      wavelengthReadout: document.querySelector("#wavelengthReadout"),
      transitionReadout: document.querySelector("#transitionReadout"),
      spectrumLines: document.querySelector("#spectrumLines"),
      insight: document.querySelector("#insight"),
      elementGrid: document.querySelector("#elementGrid"),
      startBtn: document.querySelector("#startBtn"),
      pauseBtn: document.querySelector("#pauseBtn"),
      resetBtn: document.querySelector("#resetBtn"),
      autoBtn: document.querySelector("#autoBtn"),
      autoLabel: document.querySelector("#autoLabel"),
      autoProgressBar: document.querySelector("#autoProgressBar")
    };

    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

    function wavelengthToRGB(wl) {
      let r = 0, g = 0, b = 0;
      if (wl >= 380 && wl < 440) { r = -(wl - 440) / 60; b = 1; }
      else if (wl >= 440 && wl < 490) { g = (wl - 440) / 50; b = 1; }
      else if (wl >= 490 && wl < 510) { g = 1; b = -(wl - 510) / 20; }
      else if (wl >= 510 && wl < 580) { r = (wl - 510) / 70; g = 1; }
      else if (wl >= 580 && wl < 645) { r = 1; g = -(wl - 645) / 65; }
      else if (wl >= 645 && wl <= 780) { r = 1; }
      let factor = 1;
      if (wl < 420) factor = 0.3 + 0.7 * (wl - 380) / 40;
      else if (wl > 700) factor = 0.3 + 0.7 * (780 - wl) / 80;
      r = Math.round(255 * clamp(r * factor, 0, 1));
      g = Math.round(255 * clamp(g * factor, 0, 1));
      b = Math.round(255 * clamp(b * factor, 0, 1));
      return `rgb(${r},${g},${b})`;
    }

    function flamePath(time, intensity, cx, baseY, width, height) {
      const w = width * (0.6 + intensity * 0.4);
      const h = height * (0.5 + intensity * 0.5);
      const topY = baseY - h;
      const flicker = Math.sin(time * 8) * 3 + Math.sin(time * 13) * 2;
      const flicker2 = Math.sin(time * 11 + 1) * 2;
      const halfW = w / 2;
      const halfWTop = w * 0.15;
      return `M ${cx - halfW} ${baseY} 
              Q ${cx - halfW * 1.1 - flicker2} ${baseY - h * 0.4}, ${cx - halfW * 0.5} ${baseY - h * 0.7}
              Q ${cx - halfWTop - flicker} ${topY + 10}, ${cx + flicker} ${topY}
              Q ${cx + halfWTop + flicker} ${topY + 10}, ${cx + halfW * 0.5} ${baseY - h * 0.7}
              Q ${cx + halfW * 1.1 + flicker2} ${baseY - h * 0.4}, ${cx + halfW} ${baseY} Z`;
    }

    function flameInnerPath(time, intensity, cx, baseY, width, height) {
      const w = width * (0.4 + intensity * 0.3);
      const h = height * (0.4 + intensity * 0.4);
      const topY = baseY - h;
      const flicker = Math.sin(time * 10 + 0.5) * 2;
      const halfW = w / 2;
      const halfWTop = w * 0.1;
      return `M ${cx - halfW} ${baseY} 
              Q ${cx - halfW * 0.8} ${baseY - h * 0.5}, ${cx - halfWTop - flicker} ${topY + 5}
              Q ${cx + flicker} ${topY}, ${cx + halfWTop + flicker} ${topY + 5}
              Q ${cx + halfW * 0.8} ${baseY - h * 0.5}, ${cx + halfW} ${baseY} Z`;
    }

    function flameCorePath(time, intensity, cx, baseY, width, height) {
      const w = width * (0.2 + intensity * 0.2);
      const h = height * (0.3 + intensity * 0.3);
      const topY = baseY - h;
      const flicker = Math.sin(time * 14) * 1.5;
      const halfW = w / 2;
      return `M ${cx - halfW} ${baseY} 
              Q ${cx - halfW * 0.5 + flicker} ${baseY - h * 0.6}, ${cx + flicker} ${topY}
              Q ${cx + halfW * 0.5 - flicker} ${baseY - h * 0.6}, ${cx + halfW} ${baseY} Z`;
    }

    function init() {
      buildElementGrid();
      bindControls();
      setParameters({ element: "none" });
      requestAnimationFrame(frame);
    }

    function buildElementGrid() {
      const order = ["Na", "K", "Cu", "Ca", "Sr", "Ba"];
      const btns = order.map(key => {
        const el = elementData[key];
        return `<button class="element-btn" data-element="${key}" type="button">
          <div class="sym">${el.symbol}</div>
          <div class="name">${el.name}</div>
          <div class="swatch" style="background:${el.color}"></div>
        </button>`;
      }).join("");
      elements.elementGrid.innerHTML = btns + '<div style="grid-column: span 6;" class="auto-progress"><div class="auto-progress-bar" id="autoProgressBar"></div></div>';
      elements.autoProgressBar = document.querySelector("#autoProgressBar");
      elements.elementGrid.querySelectorAll(".element-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          stopAutoShow();
          setParameters({ element: btn.dataset.element });
        });
      });
    }

    function setElement(key) {
      const el = elementData[key] || elementData.none;
      state.currentElement = key;
      state.targetIntensity = key === "none" ? 0.3 : 1.0;
      elements.elementGrid.querySelectorAll(".element-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.element === key);
        btn.setAttribute("aria-pressed", btn.dataset.element === key ? "true" : "false");
      });
      renderSpectrum(el);
      elements.elementReadout.textContent = el.name;
      elements.colorReadout.textContent = el.colorName;
      elements.colorReadout.style.color = key === "none" ? "var(--sim-text)" : el.color;
      if (el.lines.length > 0) {
        const main = el.lines.reduce((a, b) => a.intensity >= b.intensity ? a : b);
        elements.wavelengthReadout.textContent = `${main.wl.toFixed(1)} nm`;
      } else {
        elements.wavelengthReadout.textContent = "—";
      }
      elements.transitionReadout.textContent = el.transition;
      if (key === "none") {
        elements.elementLabel.textContent = "空焰";
        elements.colorLabel.textContent = "本生灯正常火焰";
        elements.elementLabel.setAttribute("opacity", "0.6");
        elements.colorLabel.setAttribute("opacity", "0.6");
        elements.insight.textContent = "选择一种金属元素，铂丝蘸取样品后置入火焰。观察火焰瞬间呈现的特征颜色。";
      } else {
        elements.elementLabel.textContent = `${el.symbol} · ${el.name}`;
        elements.colorLabel.textContent = el.colorName;
        elements.elementLabel.setAttribute("opacity", "1");
        elements.colorLabel.setAttribute("opacity", "0.9");
        elements.elementLabel.setAttribute("fill", el.color);
        elements.colorLabel.setAttribute("fill", el.color);
        elements.insight.textContent = `${el.name}离子电子受热激发至高能级（${el.transition}），回落时发射${el.lines.length > 1 ? "多条" : ""}特征谱线，火焰呈${el.colorName}。`;
      }
      if (state.autoShow) {
        elements.status.textContent = `自动展示中 ${el.symbol}`;
      } else {
        elements.status.textContent = key === "none" ? "就绪" : `燃烧 ${el.name}`;
      }
    }

    function renderSpectrum(el) {
      const lines = el.lines.map(line => {
        const x = 20 + ((line.wl - 380) / 400) * 360;
        const color = wavelengthToRGB(line.wl);
        const h = 20 + line.intensity * 60;
        const yTop = 100 - h;
        return `<line x1="${x}" y1="${yTop}" x2="${x}" y2="100" stroke="${color}" stroke-width="${line.intensity > 0.8 ? 3 : 2}" opacity="${0.7 + line.intensity * 0.3}"/>
                <text x="${x}" y="${yTop - 4}" fill="${color}" font-size="8" text-anchor="middle" font-weight="700">${line.wl.toFixed(1)}</text>`;
      }).join("");
      elements.spectrumLines.innerHTML = lines;
    }

    function spawnParticles(dt) {
      if (state.currentElement === "none" || state.flameIntensity < 0.5) return;
      const el = elementData[state.currentElement];
      const spawnRate = 30 * state.flameIntensity;
      const count = Math.floor(spawnRate * dt + Math.random());
      for (let i = 0; i < count; i++) {
        const angle = (Math.random() - 0.5) * 0.6;
        const speed = 30 + Math.random() * 40;
        state.particles.push({
          x: 380 + (Math.random() - 0.5) * 20,
          y: 200 + (Math.random() - 0.5) * 10,
          vx: Math.sin(angle) * speed,
          vy: -Math.cos(angle) * speed * 0.8,
          life: 1.0,
          maxLife: 0.8 + Math.random() * 0.6,
          color: el.color,
          size: 1.5 + Math.random() * 2
        });
      }
    }

    function updateParticles(dt) {
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 20 * dt;
        p.life -= dt / p.maxLife;
        if (p.life <= 0) {
          state.particles.splice(i, 1);
        }
      }
      if (state.particles.length > 200) {
        state.particles.splice(0, state.particles.length - 200);
      }
    }

    function renderParticles() {
      const ns = "http://www.w3.org/2000/svg";
      const existing = elements.particles.querySelectorAll("circle");
      // 高效更新：复用已有节点
      while (existing.length < state.particles.length) {
        const c = document.createElementNS(ns, "circle");
        elements.particles.appendChild(c);
      }
      const all = elements.particles.querySelectorAll("circle");
      for (let i = state.particles.length; i < all.length; i++) {
        all[i].setAttribute("opacity", "0");
      }
      state.particles.forEach((p, i) => {
        const c = all[i];
        c.setAttribute("cx", p.x.toFixed(1));
        c.setAttribute("cy", p.y.toFixed(1));
        c.setAttribute("r", (p.size * p.life).toFixed(1));
        c.setAttribute("fill", p.color);
        c.setAttribute("opacity", (p.life * 0.8).toFixed(2));
      });
    }

    function update(dt) {
      const boundedDt = clamp(finite(dt, 0), 0, 0.05);
      if (!state.running) return;
      state.flameTime += boundedDt;
      state.flameIntensity += (state.targetIntensity - state.flameIntensity) * Math.min(1, boundedDt * 5);
      // 自动轮播计时
      if (state.autoShow) {
        state.autoTimer += boundedDt;
        if (state.autoTimer >= autoDwell) {
          state.autoTimer = 0;
          state.autoIndex = (state.autoIndex + 1) % autoSequence.length;
          setElement(autoSequence[state.autoIndex]);
        }
        // 更新进度条
        if (elements.autoProgressBar) {
          elements.autoProgressBar.style.width = `${(state.autoTimer / autoDwell * 100).toFixed(1)}%`;
        }
      }
      spawnParticles(boundedDt);
      updateParticles(boundedDt);
    }

    function render() {
      const cx = 380;
      const baseY = 270;
      const el = elementData[state.currentElement];
      const intensity = state.flameIntensity;
      elements.flameOuter2.setAttribute("d", flamePath(state.flameTime, intensity, cx, baseY, 80, 180));
      elements.flameMid.setAttribute("d", flamePath(state.flameTime * 1.2, intensity * 0.9, cx, baseY, 60, 160));
      elements.flameInner.setAttribute("d", flameInnerPath(state.flameTime * 1.3, intensity, cx, baseY, 45, 140));
      elements.flameCore.setAttribute("d", flameCorePath(state.flameTime * 1.5, intensity, cx, baseY, 30, 120));
      if (state.currentElement === "none") {
        elements.flameOuter2.setAttribute("fill", "#3a4258");
        elements.flameOuter2.setAttribute("opacity", "0.2");
        elements.flameMid.setAttribute("fill", "#4a5268");
        elements.flameMid.setAttribute("opacity", "0.3");
        elements.flameInner.setAttribute("fill", "#6a7288");
        elements.flameInner.setAttribute("opacity", "0.4");
        elements.flameCore.setAttribute("fill", "#9aa2b8");
        elements.flameCore.setAttribute("opacity", "0.5");
      } else {
        elements.flameOuter2.setAttribute("fill", el.color);
        elements.flameOuter2.setAttribute("opacity", String(0.25 * intensity));
        elements.flameMid.setAttribute("fill", el.color);
        elements.flameMid.setAttribute("opacity", String(0.4 * intensity));
        elements.flameInner.setAttribute("fill", el.color);
        elements.flameInner.setAttribute("opacity", String(0.6 * intensity));
        elements.flameCore.setAttribute("fill", "#ffffff");
        elements.flameCore.setAttribute("opacity", String(0.7 * intensity));
      }
      if (state.currentElement === "none") {
        elements.wire.setAttribute("stroke", "#c0c8d8");
        elements.wireTip.setAttribute("fill", intensity > 0.4 ? "#ff8844" : "#e8eefc");
      } else {
        elements.wire.setAttribute("stroke", "#c0c8d8");
        elements.wireTip.setAttribute("fill", el.color);
        elements.wireTip.setAttribute("opacity", String(intensity));
      }
      renderParticles();
    }

    function start() {
      state.running = true;
      elements.status.textContent = state.autoShow ? `自动展示中 ${elementData[state.currentElement].symbol}` : (state.currentElement === "none" ? "燃烧中" : `燃烧 ${elementData[state.currentElement].name}`);
      elements.startBtn.setAttribute("aria-pressed", "true");
    }

    function pause() {
      state.running = false;
      elements.status.textContent = state.autoShow ? `自动展示暂停` : "已暂停";
      elements.startBtn.setAttribute("aria-pressed", "false");
    }

    function reset() {
      stopAutoShow();
      pause();
      state.t = 0;
      state.flameIntensity = 0;
      state.particles = [];
      setElement("none");
      render();
      elements.status.textContent = "就绪";
    }

    function startAutoShow() {
      state.autoShow = true;
      state.autoIndex = 0;
      state.autoTimer = 0;
      setElement(autoSequence[0]);
      if (!state.running) start();
      elements.autoBtn.setAttribute("aria-pressed", "true");
      elements.autoBtn.classList.add("primary");
      elements.autoLabel.textContent = "ON";
    }

    function stopAutoShow() {
      state.autoShow = false;
      state.autoTimer = 0;
      elements.autoBtn.setAttribute("aria-pressed", "false");
      elements.autoBtn.classList.remove("primary");
      elements.autoLabel.textContent = "OFF";
      if (elements.autoProgressBar) elements.autoProgressBar.style.width = "0%";
      const el = elementData[state.currentElement];
      elements.status.textContent = state.currentElement === "none" ? "就绪" : `燃烧 ${el.name}`;
    }

    function toggleAutoShow() {
      if (state.autoShow) stopAutoShow();
      else startAutoShow();
    }

    function setParameters(values) {
      const def = parameterSchema[0];
      const key = values.element || def.default;
      if (def.options.includes(key)) {
        setElement(key);
      }
      render();
    }

    function bindControls() {
      elements.startBtn.addEventListener("click", start);
      elements.pauseBtn.addEventListener("click", pause);
      elements.resetBtn.addEventListener("click", reset);
      elements.autoBtn.addEventListener("click", toggleAutoShow);
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    function getState() {
      return { ...state, particles: state.particles.map(p => ({ ...p })) };
    }

    function getReadouts() {
      const el = elementData[state.currentElement];
      return {
        element: el.name,
        color: el.colorName,
        wavelength: el.lines.length > 0 ? el.lines[0].wl : null,
        transition: el.transition,
        flameIntensity: state.flameIntensity,
        autoShow: state.autoShow,
        autoIndex: state.autoIndex
      };
    }

    function runModelChecks() {
      const checks = [];
      for (const [key, el] of Object.entries(elementData)) {
        if (key === "none") continue;
        checks.push({
          name: `${el.name}数据完整性`,
          pass: el.symbol && el.color && el.lines.length > 0 && el.transition !== "—",
          expected: "symbol, color, lines, transition 均存在",
          actual: `sym=${el.symbol}, lines=${el.lines.length}, trans=${el.transition}`,
          tolerance: "complete"
        });
      }
      for (const [key, el] of Object.entries(elementData)) {
        if (key === "none") continue;
        const allValid = el.lines.every(l => l.wl >= 380 && l.wl <= 780);
        checks.push({
          name: `${el.name}波长在可见光范围`,
          pass: allValid,
          expected: "380–780 nm",
          actual: el.lines.map(l => l.wl).join(", "),
          tolerance: "range"
        });
      }
      for (const [key, el] of Object.entries(elementData)) {
        if (key === "none") continue;
        const allFinite = el.lines.every(l => {
          const rgb = wavelengthToRGB(l.wl);
          return rgb.startsWith("rgb(") && !rgb.includes("NaN");
        });
        checks.push({
          name: `${el.name}波长RGB映射有效`,
          pass: allFinite,
          expected: "有效rgb字符串",
          actual: "映射成功",
          tolerance: "valid"
        });
      }
      const na = elementData.Na;
      checks.push({
        name: "钠特征波长589nm",
        pass: Math.abs(na.lines[0].wl - 589.0) < 0.5,
        expected: "589.0 nm",
        actual: na.lines[0].wl,
        tolerance: 0.5
      });
      // 自动轮播序列检查
      checks.push({
        name: "自动轮播序列完整",
        pass: autoSequence.length === 6 && autoSequence.every(k => elementData[k]),
        expected: "6种元素均有效",
        actual: autoSequence.join("→"),
        tolerance: "complete"
      });
      checks.push({
        name: "自动轮播无重复",
        pass: new Set(autoSequence).size === autoSequence.length,
        expected: "6个唯一元素",
        actual: `${new Set(autoSequence).size}个唯一`,
        tolerance: "strict"
      });
      return checks;
    }

    window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks, startAutoShow, stopAutoShow, toggleAutoShow };
    init();
  })();
  </script>
</body>
</html>
