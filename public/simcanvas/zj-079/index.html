<!doctype html>
<html lang="zh-CN">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scale of the Universe · 尺度跨越</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #050818;
  --sim-surface: #0c1226;
  --sim-surface-soft: #131a36;
  --sim-text: #e8eefc;
  --sim-muted: #8a9ab8;
  --sim-border: #1e2a4a;
  --sim-grid: #1a2540;
  --sim-accent: #5fc7ff;
  --sim-accent-deep: #2a9fe0;
  --sim-accent-soft: rgba(95,199,255,0.12);
  --sim-positive: #5fc7ff;
  --sim-warning: #fbbf24;
  --sim-danger: #f87171;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 14px 36px rgba(0,0,0,0.4);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--sim-text);
  background: var(--sim-bg);
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow: hidden;
}
button, input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid rgba(95,199,255,0.5); outline-offset: 2px; }
.app {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: grid;
  grid-template-rows: auto minmax(0,1fr) auto;
  gap: 0;
  overflow: hidden;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  padding: 14px 24px;
  background: linear-gradient(180deg, rgba(12,18,38,0.95), rgba(12,18,38,0.7));
  border-bottom: 1px solid var(--sim-border);
  backdrop-filter: blur(8px);
  z-index: 10;
}
.header-left { min-width: 0; }
.header h1 {
  margin: 0 0 4px;
  font-size: clamp(1.3rem, 2vw, 1.7rem);
  letter-spacing: -0.03em;
  line-height: 1.1;
  font-weight: 800;
}
.header p {
  margin: 0;
  color: var(--sim-muted);
  font-size: 0.82rem;
}
.status {
  border: 1px solid rgba(95,199,255,0.25);
  border-radius: 999px;
  padding: 8px 16px;
  background: var(--sim-accent-soft);
  color: var(--sim-accent);
  font-weight: 700;
  white-space: nowrap;
  font-size: 0.85rem;
}
.main {
  position: relative;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 0;
  overflow: hidden;
}
.scene-panel {
  position: relative;
  min-height: 0;
  overflow: hidden;
  background: radial-gradient(ellipse at center, #0a0f1f 0%, #050818 100%);
}
#scene {
  width: 100%;
  height: 100%;
  display: block;
}
.scene-overlay {
  position: absolute;
  top: 16px;
  left: 20px;
  pointer-events: none;
  z-index: 5;
}
.scene-overlay .obj-name {
  font-size: clamp(1.5rem, 3vw, 2.4rem);
  font-weight: 800;
  letter-spacing: -0.02em;
  text-shadow: 0 2px 20px rgba(0,0,0,0.8);
  transition: opacity 0.3s ease;
}
.scene-overlay .obj-desc {
  margin-top: 6px;
  font-size: 0.9rem;
  color: var(--sim-muted);
  max-width: 400px;
  line-height: 1.4;
  text-shadow: 0 1px 10px rgba(0,0,0,0.8);
}
.scale-bar-container {
  position: absolute;
  bottom: 16px;
  left: 20px;
  right: 20px;
  pointer-events: none;
  z-index: 5;
}
.scale-bar {
  height: 4px;
  background: linear-gradient(90deg, var(--sim-accent-deep), var(--sim-accent));
  border-radius: 2px;
  box-shadow: 0 0 12px rgba(95,199,255,0.4);
  transition: width 0.15s ease;
}
.scale-bar-label {
  margin-top: 6px;
  font-size: 0.8rem;
  color: var(--sim-muted);
  font-variant-numeric: tabular-nums;
}
.side-panel {
  background: var(--sim-surface);
  border-left: 1px solid var(--sim-border);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow-y: auto;
  min-width: 0;
}
.side-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.side-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--sim-muted);
  font-weight: 700;
}
.side-value {
  font-size: 1.3rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}
.side-value-mono {
  font-size: 1.1rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--sim-accent);
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
.magnitude-bar {
  height: 8px;
  background: var(--sim-grid);
  border-radius: 4px;
  overflow: hidden;
  margin-top: 4px;
}
.magnitude-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--sim-accent-deep), var(--sim-accent));
  border-radius: 4px;
  transition: width 0.15s ease;
}
.object-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.object-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 0.82rem;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
  border: none;
  background: transparent;
  color: var(--sim-muted);
  text-align: left;
  width: 100%;
}
.object-item:hover {
  background: rgba(95,199,255,0.06);
  color: var(--sim-text);
}
.object-item.active {
  background: var(--sim-accent-soft);
  color: var(--sim-accent);
  font-weight: 700;
}
.object-item .obj-scale {
  font-size: 0.72rem;
  color: var(--sim-muted);
  font-variant-numeric: tabular-nums;
}
.object-item.active .obj-scale {
  color: var(--sim-accent);
}
.insight-panel {
  padding: 14px 16px;
  border-left: 3px solid var(--sim-warning);
  border-radius: 0 12px 12px 0;
  background: rgba(251, 191, 36, 0.08);
  color: #fcd34d;
  font-weight: 650;
  font-size: 0.85rem;
  line-height: 1.5;
}
.controls {
  padding: 14px 24px;
  background: linear-gradient(0deg, rgba(12,18,38,0.95), rgba(12,18,38,0.7));
  border-top: 1px solid var(--sim-border);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  gap: 20px;
  z-index: 10;
}
.actions {
  display: flex;
  gap: 8px;
}
button {
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-sm);
  padding: 9px 16px;
  color: var(--sim-text);
  background: var(--sim-surface-soft);
  cursor: pointer;
  font-weight: 700;
  font-size: 0.85rem;
  transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
}
button:hover {
  border-color: var(--sim-accent-deep);
  background: rgba(95,199,255,0.08);
}
button:active { transform: scale(0.97); }
button.primary {
  border-color: var(--sim-accent-deep);
  color: #fff;
  background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent));
  box-shadow: 0 4px 14px rgba(95,199,255,0.2);
}
button.primary[aria-pressed="true"] {
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.3);
}
.timeline {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.timeline-track {
  position: relative;
  height: 36px;
  display: flex;
  align-items: center;
}
.timeline-bg {
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: 4px;
  transform: translateY(-50%);
  background: var(--sim-grid);
  border-radius: 2px;
}
.timeline-fill {
  position: absolute;
  left: 0; top: 50%;
  height: 4px;
  transform: translateY(-50%);
  background: linear-gradient(90deg, var(--sim-accent-deep), var(--sim-accent));
  border-radius: 2px;
  pointer-events: none;
}
.timeline-marks {
  position: absolute;
  left: 0; right: 0; top: 0; bottom: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
}
.timeline-mark {
  width: 2px;
  height: 12px;
  background: var(--sim-border);
  border-radius: 1px;
}
.timeline-mark.major {
  height: 18px;
  background: var(--sim-muted);
}
.timeline-handle {
  position: absolute;
  top: 50%;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--sim-accent);
  border: 2px solid var(--sim-bg);
  transform: translate(-50%, -50%);
  box-shadow: 0 0 12px rgba(95,199,255,0.5);
  pointer-events: none;
  transition: none;
}
.timeline-input {
  position: absolute;
  left: 0; right: 0; top: 0; bottom: 0;
  width: 100%;
  margin: 0;
  opacity: 0;
  cursor: grab;
  -webkit-appearance: none;
}
.timeline-input:active { cursor: grabbing; }
.timeline-labels {
  display: flex;
  justify-content: space-between;
  font-size: 0.68rem;
  color: var(--sim-muted);
  font-variant-numeric: tabular-nums;
}
.hint {
  font-size: 0.75rem;
  color: var(--sim-muted);
  white-space: nowrap;
}
@media (max-width: 860px) {
  .app {
    height: auto;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: visible;
  }
  .main {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(300px, 1fr) auto;
  }
  .side-panel {
    border-left: none;
    border-top: 1px solid var(--sim-border);
    max-height: 240px;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 12px;
  }
  .side-section { flex: 1 1 140px; }
  .controls {
    flex-wrap: wrap;
    gap: 12px;
  }
  .timeline { order: 3; width: 100%; flex: 1 1 100%; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div class="header-left">
      <h1>Scale of the Universe</h1>
      <p>从原子核到宇宙大尺度结构 · 滚轮或拖动时间轴穿越 40 个数量级</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
  </header>

  <main class="main">
    <section class="scene-panel" data-region="stage" aria-labelledby="scene-title">
      <h2 id="scene-title" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">连续尺度场景</h2>
      <canvas id="scene"></canvas>
      <div class="scene-overlay">
        <div class="obj-name" id="objName">原子核</div>
        <div class="obj-desc" id="objDesc">质子和中子紧密结合，构成原子的核心</div>
      </div>
      <div class="scale-bar-container">
        <div class="scale-bar" id="scaleBar" style="width: 50%;"></div>
        <div class="scale-bar-label" id="scaleBarLabel">当前尺度 ~1 fm</div>
      </div>
    </section>

    <aside class="side-panel" data-region="evidence">
      <div class="side-section">
        <div class="side-label">当前对象</div>
        <div class="side-value" id="readoutName">原子核</div>
      </div>
      <div class="side-section">
        <div class="side-label">实际尺度</div>
        <div class="side-value-mono" id="readoutScale">10⁻¹⁵ m</div>
      </div>
      <div class="side-section">
        <div class="side-label">数量级</div>
        <div class="side-value" id="readoutMagnitude">10⁻¹⁵</div>
        <div class="magnitude-bar">
          <div class="magnitude-fill" id="magnitudeFill" style="width: 0%;"></div>
        </div>
      </div>
      <div class="side-section" style="flex: 1; min-height: 0;">
        <div class="side-label">尺度阶梯</div>
        <div class="object-list" id="objectList"></div>
      </div>
      <section class="insight-panel" data-region="insight" aria-label="教学洞察">
        <div id="insight">拖动时间轴或滚轮穿越尺度，观察对象如何随尺度连续过渡。</div>
      </section>
    </aside>
  </main>

  <section class="controls" data-region="controls" aria-label="播放控制">
    <div class="actions">
      <button id="playBtn" class="primary" type="button" aria-pressed="false">自动播放</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="timeline">
      <label for="timelineInput" class="side-label" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">尺度时间轴</label>
      <div class="timeline-track">
        <div class="timeline-bg"></div>
        <div class="timeline-fill" id="timelineFill"></div>
        <div class="timeline-marks" id="timelineMarks"></div>
        <div class="timeline-handle" id="timelineHandle" style="left: 0%;"></div>
        <input type="range" class="timeline-input" id="timelineInput" min="0" max="1" step="0.0001" value="0" aria-label="尺度时间轴">
      </div>
      <div class="timeline-labels">
        <span>10⁻¹⁵ m</span>
        <span>10⁰ m</span>
        <span>10²⁵ m</span>
      </div>
    </div>
    <div class="hint">滚轮控制 · 双击重置</div>
  </section>
</div>

<script>
(() => {
  "use strict";

  // === OBJECT DATA ===
  const OBJECTS = [
    { name: "原子核", en: "Atomic nucleus", logScale: -15, size: 1e-15,
      desc: "质子和中子紧密结合，构成原子的核心",
      color: "#ff6b6b", accent: "#ff8e8e", type: "nucleus" },
    { name: "原子", en: "Atom", logScale: -10, size: 1e-10,
      desc: "电子云环绕原子核，物质的基本单元",
      color: "#ffa94d", accent: "#ffc078", type: "atom" },
    { name: "分子", en: "Molecule", logScale: -9, size: 1e-9,
      desc: "多个原子以化学键结合",
      color: "#ffd43b", accent: "#ffe99a", type: "molecule" },
    { name: "DNA", en: "DNA", logScale: -8, size: 1e-8,
      desc: "双螺旋结构携带遗传密码",
      color: "#69db7c", accent: "#a9e9b5", type: "dna" },
    { name: "细胞", en: "Cell", logScale: -5, size: 1e-5,
      desc: "生命的基本结构与功能单位",
      color: "#38d9a9", accent: "#8ce5cb", type: "cell" },
    { name: "人体", en: "Human", logScale: 0, size: 1.7,
      desc: "约 10¹³ 个细胞构成的有机体",
      color: "#4dabf7", accent: "#a5d8ff", type: "human" },
    { name: "城市", en: "City", logScale: 4, size: 1e4,
      desc: "人类聚居与活动的大规模空间",
      color: "#748ffc", accent: "#bac8ff", type: "city" },
    { name: "地球", en: "Earth", logScale: 7, size: 1.27e7,
      desc: "直径约 12,700 公里的蓝色星球",
      color: "#5fc7ff", accent: "#99d8ff", type: "earth" },
    { name: "太阳", en: "Sun", logScale: 9, size: 1.39e9,
      desc: "直径约 139 万公里的恒星",
      color: "#fbbf24", accent: "#fde68a", type: "sun" },
    { name: "太阳系", en: "Solar System", logScale: 13, size: 9e12,
      desc: "太阳与八大行星的引力系统",
      color: "#f59e0b", accent: "#fcd34d", type: "solar" },
    { name: "银河系", en: "Galaxy", logScale: 21, size: 9.5e20,
      desc: "约 4000 亿颗恒星组成的旋涡星系",
      color: "#c084fc", accent: "#d8b4fe", type: "galaxy" },
    { name: "宇宙大尺度结构", en: "Cosmic web", logScale: 25, size: 8e24,
      desc: "星系纤维与空洞构成的网络",
      color: "#e879f9", accent: "#f0abfc", type: "cosmic" }
  ];

  const MIN_LOG = -15;
  const MAX_LOG = 25;
  const SPAN = MAX_LOG - MIN_LOG; // 40

  // === STATE ===
  const state = {
    scale: 0,        // 0..1, position in timeline
    running: false,
    autoSpeed: 0.06, // per second (full traverse in ~16s)
    direction: 1,    // 1=forward (zoom out), -1=reverse (zoom in)
    lastTimestamp: null,
    canvasW: 0,
    canvasH: 0,
    dpr: 1,
    stars: [],
    particles: [],
    transitionFlash: 0,
    lastObjIdx: -1
  };

  // === ELEMENTS ===
  const el = {
    canvas: document.getElementById("scene"),
    status: document.getElementById("status"),
    objName: document.getElementById("objName"),
    objDesc: document.getElementById("objDesc"),
    scaleBar: document.getElementById("scaleBar"),
    scaleBarLabel: document.getElementById("scaleBarLabel"),
    readoutName: document.getElementById("readoutName"),
    readoutScale: document.getElementById("readoutScale"),
    readoutMagnitude: document.getElementById("readoutMagnitude"),
    magnitudeFill: document.getElementById("magnitudeFill"),
    objectList: document.getElementById("objectList"),
    timelineFill: document.getElementById("timelineFill"),
    timelineHandle: document.getElementById("timelineHandle"),
    timelineMarks: document.getElementById("timelineMarks"),
    timelineInput: document.getElementById("timelineInput"),
    playBtn: document.getElementById("playBtn"),
    resetBtn: document.getElementById("resetBtn"),
    insight: document.getElementById("insight")
  };

  const ctx = el.canvas.getContext("2d");

  // === SCALE MATH ===
  function scaleToLog(s) {
    const pos = s * (OBJECTS.length - 1);
    const i = Math.min(OBJECTS.length - 2, Math.floor(pos));
    const frac = pos - i;
    return OBJECTS[i].logScale + (OBJECTS[i+1].logScale - OBJECTS[i].logScale) * frac;
  }

  function logToMeters(log) {
    return Math.pow(10, log);
  }

  function formatScale(log) {
    const exp = Math.round(log);
    const superscripts = { '-': '⁻', '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹' };
    const sign = exp < 0 ? '⁻' : '';
    const absStr = Math.abs(exp).toString().split('').map(d => superscripts[d]).join('');
    return `10${sign}${absStr} m`;
  }

  function formatMagnitude(log) {
    const exp = Math.round(log);
    const superscripts = { '-': '⁻', '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹' };
    const sign = exp < 0 ? '⁻' : '';
    const absStr = Math.abs(exp).toString().split('').map(d => superscripts[d]).join('');
    return `10${sign}${absStr}`;
  }

  function getCurrentObjectInfo() {
    const pos = state.scale * (OBJECTS.length - 1);
    const idx = Math.min(OBJECTS.length - 1, Math.round(pos));
    const nearest = OBJECTS[idx];
    const log = scaleToLog(state.scale);
    return { idx, nearest, log };
  }

  function getTransitionInfo() {
    const pos = state.scale * (OBJECTS.length - 1);
    const i = Math.min(OBJECTS.length - 2, Math.floor(pos));
    const frac = pos - i;
    return { from: OBJECTS[i], to: OBJECTS[i+1], frac, idx: i };
  }

  // === INIT ===
  function init() {
    resizeCanvas();
    initStars();
    initParticles();
    buildObjectList();
    buildTimelineMarks();
    bindControls();
    setScale(0);
    requestAnimationFrame(frame);
    window.addEventListener("resize", resizeCanvas);
  }

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = el.canvas.getBoundingClientRect();
    state.canvasW = rect.width;
    state.canvasH = rect.height;
    state.dpr = dpr;
    el.canvas.width = rect.width * dpr;
    el.canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function initStars() {
    state.stars = [];
    for (let i = 0; i < 200; i++) {
      state.stars.push({
        x: Math.random(),
        y: Math.random(),
        r: Math.random() * 1.5 + 0.3,
        twinkle: Math.random() * Math.PI * 2,
        speed: 0.5 + Math.random() * 1.5
      });
    }
  }

  function initParticles() {
    state.particles = [];
    for (let i = 0; i < 60; i++) {
      state.particles.push({
        x: Math.random(),
        y: Math.random(),
        vx: (Math.random() - 0.5) * 0.0003,
        vy: (Math.random() - 0.5) * 0.0003,
        r: Math.random() * 2 + 0.5,
        life: Math.random()
      });
    }
  }

  function buildObjectList() {
    el.objectList.innerHTML = "";
    OBJECTS.forEach((obj, i) => {
      const btn = document.createElement("button");
      btn.className = "object-item";
      btn.type = "button";
      btn.dataset.idx = i;
      btn.innerHTML = `<span>${obj.name}</span><span class="obj-scale">10${formatSuperscript(obj.logScale)} m</span>`;
      btn.addEventListener("click", () => {
        pause();
        setScale(i / (OBJECTS.length - 1));
      });
      el.objectList.appendChild(btn);
    });
  }

  function formatSuperscript(n) {
    const superscripts = { '-': '⁻', '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹' };
    const sign = n < 0 ? '⁻' : '';
    const absStr = Math.abs(n).toString().split('').map(d => superscripts[d]).join('');
    return `${sign}${absStr}`;
  }

  function buildTimelineMarks() {
    el.timelineMarks.innerHTML = "";
    for (let i = 0; i < OBJECTS.length; i++) {
      const mark = document.createElement("div");
      mark.className = "timeline-mark" + (i % 3 === 0 ? " major" : "");
      el.timelineMarks.appendChild(mark);
    }
  }

  // === CONTROLS ===
  function bindControls() {
    el.playBtn.addEventListener("click", togglePlay);
    el.resetBtn.addEventListener("click", reset);

    el.timelineInput.addEventListener("input", (e) => {
      pause();
      setScale(parseFloat(e.target.value));
    });

    // Wheel control
    el.canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      pause();
      const delta = -e.deltaY * 0.0008;
      setScale(state.scale + delta);
    }, { passive: false });

    // Double-click reset
    el.canvas.addEventListener("dblclick", reset);

    // Keyboard
    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;
      if (e.code === "Space") { e.preventDefault(); togglePlay(); }
      if (e.code === "KeyR") reset();
      if (e.code === "ArrowLeft") { pause(); setScale(state.scale - 0.02); }
      if (e.code === "ArrowRight") { pause(); setScale(state.scale + 0.02); }
    });
  }

  function togglePlay() {
    if (state.running) pause();
    else play();
  }

  function play() {
    state.running = true;
    state.direction = 1;
    state.lastTimestamp = null;
    el.status.textContent = "自动播放中 · 前进 →";
    el.playBtn.textContent = "暂停";
    el.playBtn.setAttribute("aria-pressed", "true");
  }

  function pause() {
    state.running = false;
    el.status.textContent = "已暂停";
    el.playBtn.textContent = "自动播放";
    el.playBtn.setAttribute("aria-pressed", "false");
  }

  function reset() {
    pause();
    state.direction = 1;
    setScale(0);
  }

  function setScale(s) {
    state.scale = Math.max(0, Math.min(1, s));
    el.timelineInput.value = state.scale;
    render();
  }

  // === UPDATE ===
  function update(dt) {
    if (!state.running) return;
    const boundedDt = Math.max(0, Math.min(0.05, dt));
    let newScale = state.scale + state.autoSpeed * state.direction * boundedDt;
    if (newScale >= 1) {
      newScale = 1;
      state.direction = -1;
    } else if (newScale <= 0) {
      newScale = 0;
      state.direction = 1;
    }
    setScale(newScale);
  }

  // === RENDER ===
  function render() {
    const w = state.canvasW;
    const h = state.canvasH;
    if (w === 0 || h === 0) return;

    ctx.clearRect(0, 0, w, h);
    drawBackground(w, h);
    drawScene(w, h);
    updateUI();
  }

  function drawBackground(w, h) {
    const { log } = getCurrentObjectInfo();
    const starOpacity = Math.max(0, Math.min(1, (log - 0) / 5));
    if (starOpacity > 0.01) {
      state.stars.forEach(s => {
        const tw = 0.5 + 0.5 * Math.sin(performance.now() * 0.001 * s.speed + s.twinkle);
        ctx.fillStyle = `rgba(255, 255, 255, ${starOpacity * tw * 0.6})`;
        ctx.beginPath();
        ctx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    if (log > 15) {
      const nebOpacity = Math.min(1, (log - 15) / 8);
      const grad = ctx.createRadialGradient(w * 0.3, h * 0.4, 0, w * 0.3, h * 0.4, w * 0.5);
      grad.addColorStop(0, `rgba(192, 132, 252, ${nebOpacity * 0.08})`);
      grad.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      const grad2 = ctx.createRadialGradient(w * 0.7, h * 0.6, 0, w * 0.7, h * 0.6, w * 0.4);
      grad2.addColorStop(0, `rgba(95, 199, 255, ${nebOpacity * 0.06})`);
      grad2.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grad2;
      ctx.fillRect(0, 0, w, h);
    }
  }

  function drawScene(w, h) {
    const { from, to, frac } = getTransitionInfo();
    const cx = w / 2;
    const cy = h / 2;

    const drawFrom = frac < 0.6;
    const drawTo = frac > 0.4;

    const fromOpacity = frac < 0.5 ? 1 : Math.max(0, 1 - (frac - 0.5) / 0.2);
    const toOpacity = frac > 0.5 ? Math.min(1, (frac - 0.5) / 0.2) : 0;

    if (drawFrom && fromOpacity > 0) {
      ctx.globalAlpha = fromOpacity;
      drawObject(from.type, cx, cy, w, h, from, 1 - frac);
      ctx.globalAlpha = 1;
    }
    if (drawTo && toOpacity > 0) {
      ctx.globalAlpha = toOpacity;
      drawObject(to.type, cx, cy, w, h, to, frac);
      ctx.globalAlpha = 1;
    }
  }

  function drawObject(type, cx, cy, w, h, obj, t) {
    const maxR = Math.min(w, h) * 0.35;
    switch (type) {
      case "nucleus": drawNucleus(cx, cy, maxR, obj, t); break;
      case "atom": drawAtom(cx, cy, maxR, obj, t); break;
      case "molecule": drawMolecule(cx, cy, maxR, obj, t); break;
      case "dna": drawDNA(cx, cy, maxR, obj, t); break;
      case "cell": drawCell(cx, cy, maxR, obj, t); break;
      case "human": drawHuman(cx, cy, maxR, obj, t); break;
      case "city": drawCity(cx, cy, maxR, obj, t); break;
      case "earth": drawEarth(cx, cy, maxR, obj, t); break;
      case "sun": drawSun(cx, cy, maxR, obj, t); break;
      case "solar": drawSolarSystem(cx, cy, maxR, obj, t); break;
      case "galaxy": drawGalaxy(cx, cy, maxR, obj, t); break;
      case "cosmic": drawCosmicWeb(cx, cy, maxR, obj, t); break;
    }
  }

  // === OBJECT DRAW FUNCTIONS ===

  function drawNucleus(cx, cy, maxR, obj, t) {
    const r = maxR * 0.5;
    const time = performance.now() * 0.001;

    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2);
    glow.addColorStop(0, `rgba(255, 107, 107, 0.3)`);
    glow.addColorStop(1, "rgba(255, 107, 107, 0)");
    ctx.fillStyle = glow;
    ctx.fillRect(cx - r * 2, cy - r * 2, r * 4, r * 4);

    const nucleons = [
      { dx: 0, dy: 0, type: "p" },
      { dx: -0.5, dy: -0.3, type: "n" },
      { dx: 0.5, dy: -0.3, type: "n" },
      { dx: -0.3, dy: 0.5, type: "n" },
      { dx: 0.3, dy: 0.5, type: "p" },
      { dx: 0, dy: -0.6, type: "p" },
      { dx: -0.6, dy: 0.1, type: "p" },
      { dx: 0.6, dy: 0.1, type: "p" }
    ];

    const nr = r * 0.3;
    nucleons.forEach((n, i) => {
      const wobble = Math.sin(time * 2 + i) * 0.05;
      const x = cx + n.dx * r * 0.8 + wobble * r;
      const y = cy + n.dy * r * 0.8 + wobble * r;
      const grad = ctx.createRadialGradient(x - nr * 0.3, y - nr * 0.3, 0, x, y, nr);
      if (n.type === "p") {
        grad.addColorStop(0, "#ff8e8e");
        grad.addColorStop(1, "#c92a2a");
      } else {
        grad.addColorStop(0, "#dee2e6");
        grad.addColorStop(1, "#868e96");
      }
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, nr, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawAtom(cx, cy, maxR, obj, t) {
    const r = maxR * 0.8;
    const time = performance.now() * 0.001;

    const orbits = [
      { rx: r, ry: r * 0.35, angle: 0, speed: 1.5 },
      { rx: r * 0.8, ry: r * 0.3, angle: Math.PI / 3, speed: 2.2 },
      { rx: r * 0.6, ry: r * 0.25, angle: -Math.PI / 4, speed: 3 }
    ];

    orbits.forEach((orbit) => {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(orbit.angle);
      ctx.strokeStyle = `rgba(255, 169, 77, 0.2)`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(0, 0, orbit.rx, orbit.ry, 0, 0, Math.PI * 2);
      ctx.stroke();

      const ea = time * orbit.speed;
      const ex = Math.cos(ea) * orbit.rx;
      const ey = Math.sin(ea) * orbit.ry;
      const eGrad = ctx.createRadialGradient(ex, ey, 0, ex, ey, 6);
      eGrad.addColorStop(0, "#ffd43b");
      eGrad.addColorStop(1, "rgba(255, 212, 59, 0)");
      ctx.fillStyle = eGrad;
      ctx.beginPath();
      ctx.arc(ex, ey, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    const nGrad = ctx.createRadialGradient(cx - 3, cy - 3, 0, cx, cy, r * 0.18);
    nGrad.addColorStop(0, "#ff8e8e");
    nGrad.addColorStop(1, "#c92a2a");
    ctx.fillStyle = nGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.18, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawMolecule(cx, cy, maxR, obj, t) {
    const r = maxR * 0.6;
    const time = performance.now() * 0.0005;

    const oxygen = { x: cx, y: cy, r: r * 0.25 };
    const h1 = { x: cx + r * 0.5 * Math.cos(time), y: cy + r * 0.4 * Math.sin(time), r: r * 0.12 };
    const h2 = { x: cx + r * 0.5 * Math.cos(time + 2.1), y: cy + r * 0.4 * Math.sin(time + 2.1), r: r * 0.12 };

    ctx.strokeStyle = "rgba(255, 212, 59, 0.4)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(oxygen.x, oxygen.y);
    ctx.lineTo(h1.x, h1.y);
    ctx.moveTo(oxygen.x, oxygen.y);
    ctx.lineTo(h2.x, h2.y);
    ctx.stroke();

    [oxygen, h1, h2].forEach((a, i) => {
      const grad = ctx.createRadialGradient(a.x - a.r * 0.3, a.y - a.r * 0.3, 0, a.x, a.y, a.r);
      grad.addColorStop(0, i === 0 ? "#ffd43b" : "#fff3bf");
      grad.addColorStop(1, i === 0 ? "#e67700" : "#f08c00");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawDNA(cx, cy, maxR, obj, t) {
    const r = maxR * 0.7;
    const time = performance.now() * 0.001;
    const segments = 12;
    const segH = (r * 2) / segments;

    ctx.save();
    ctx.translate(cx, cy - r);

    for (let i = 0; i < segments; i++) {
      const y = i * segH;
      const phase = (i / segments) * Math.PI * 2 + time;
      const x1 = Math.sin(phase) * r * 0.4;
      const x2 = Math.sin(phase + Math.PI) * r * 0.4;

      ctx.strokeStyle = `rgba(105, 219, 124, ${0.3 + 0.3 * Math.abs(Math.cos(phase))})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x1, y);
      ctx.lineTo(x2, y);
      ctx.stroke();

      [{ x: x1, c: "#69db7c" }, { x: x2, c: "#a9e9b5" }].forEach(p => {
        ctx.fillStyle = p.c;
        ctx.beginPath();
        ctx.arc(p.x, y, 4, 0, Math.PI * 2);
        ctx.fill();
      });
    }
    ctx.restore();
  }

  function drawCell(cx, cy, maxR, obj, t) {
    const r = maxR * 0.7;
    const time = performance.now() * 0.0003;

    ctx.strokeStyle = "rgba(56, 217, 169, 0.4)";
    ctx.fillStyle = "rgba(56, 217, 169, 0.08)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let a = 0; a <= Math.PI * 2; a += 0.05) {
      const wobble = Math.sin(a * 6 + time * 10) * r * 0.03;
      const rr = r + wobble;
      const x = cx + Math.cos(a) * rr;
      const y = cy + Math.sin(a) * rr;
      if (a === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    const nGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 0.3);
    nGrad.addColorStop(0, "rgba(56, 217, 169, 0.5)");
    nGrad.addColorStop(1, "rgba(56, 217, 169, 0.1)");
    ctx.fillStyle = nGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.3, 0, Math.PI * 2);
    ctx.fill();

    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + time;
      const dist = r * 0.6;
      const ox = cx + Math.cos(a) * dist;
      const oy = cy + Math.sin(a) * dist;
      ctx.fillStyle = "rgba(134, 229, 203, 0.4)";
      ctx.beginPath();
      ctx.arc(ox, oy, r * 0.06, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawHuman(cx, cy, maxR, obj, t) {
    const r = maxR * 0.8;
    const time = performance.now() * 0.001;
    const sway = Math.sin(time * 0.8) * 0.02;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(sway);

    ctx.fillStyle = "rgba(77, 171, 247, 0.7)";
    ctx.strokeStyle = "#4dabf7";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.arc(0, -r * 0.7, r * 0.12, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.roundRect(-r * 0.1, -r * 0.55, r * 0.2, r * 0.5, r * 0.05);
    ctx.fill();

    ctx.lineWidth = r * 0.06;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#4dabf7";
    ctx.beginPath();
    ctx.moveTo(-r * 0.08, -r * 0.4);
    ctx.lineTo(-r * 0.3, -r * 0.1);
    ctx.moveTo(r * 0.08, -r * 0.4);
    ctx.lineTo(r * 0.3, -r * 0.1);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-r * 0.08, -r * 0.05);
    ctx.lineTo(-r * 0.15, r * 0.4);
    ctx.moveTo(r * 0.08, -r * 0.05);
    ctx.lineTo(r * 0.15, r * 0.4);
    ctx.stroke();

    ctx.restore();
  }

  function drawCity(cx, cy, maxR, obj, t) {
    const r = maxR * 0.8;
    const time = performance.now() * 0.0003;

    ctx.fillStyle = "rgba(116, 143, 252, 0.1)";
    ctx.fillRect(cx - r, cy + r * 0.3, r * 2, r * 0.1);

    const buildings = [
      { x: -0.7, w: 0.12, h: 0.5 },
      { x: -0.5, w: 0.15, h: 0.7 },
      { x: -0.3, w: 0.1, h: 0.4 },
      { x: -0.15, w: 0.18, h: 0.85 },
      { x: 0.1, w: 0.12, h: 0.55 },
      { x: 0.28, w: 0.16, h: 0.75 },
      { x: 0.5, w: 0.1, h: 0.45 },
      { x: 0.65, w: 0.14, h: 0.6 }
    ];

    buildings.forEach((b, i) => {
      const flicker = 0.7 + 0.3 * Math.sin(time * 5 + i * 1.7);
      const bx = cx + b.x * r;
      const bw = b.w * r;
      const bh = b.h * r;
      const by = cy + r * 0.3 - bh;

      ctx.fillStyle = `rgba(116, 143, 252, 0.3)`;
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = "rgba(186, 200, 255, 0.5)";
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, bw, bh);

      const winRows = Math.floor(bh / (r * 0.06));
      for (let wr = 0; wr < winRows; wr++) {
        for (let wc = 0; wc < 2; wc++) {
          if (Math.sin(time * 3 + wr * 0.5 + wc * 2 + i) > 0.3) {
            ctx.fillStyle = `rgba(253, 230, 138, ${flicker * 0.6})`;
            ctx.fillRect(bx + wc * bw * 0.4 + bw * 0.1, by + wr * r * 0.06 + r * 0.02, bw * 0.25, r * 0.03);
          }
        }
      }
    });
  }

  function drawEarth(cx, cy, maxR, obj, t) {
    const r = maxR * 0.7;
    const time = performance.now() * 0.0001;

    const glow = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, r * 1.3);
    glow.addColorStop(0, "rgba(95, 199, 255, 0.2)");
    glow.addColorStop(1, "rgba(95, 199, 255, 0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 1.3, 0, Math.PI * 2);
    ctx.fill();

    const ocean = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, 0, cx, cy, r);
    ocean.addColorStop(0, "#3b9ae0");
    ocean.addColorStop(1, "#1864ab");
    ctx.fillStyle = ocean;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#37b24d";
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(time);
    ctx.beginPath();
    ctx.ellipse(0, r * 0.1, r * 0.15, r * 0.3, 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(r * 0.2, -r * 0.3, r * 0.35, r * 0.15, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-r * 0.4, -r * 0.1, r * 0.12, r * 0.35, 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + time * 2;
      const dist = r * 0.5;
      ctx.beginPath();
      ctx.ellipse(cx + Math.cos(a) * dist, cy + Math.sin(a) * dist, r * 0.15, r * 0.05, a, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawSun(cx, cy, maxR, obj, t) {
    const r = maxR * 0.5;
    const time = performance.now() * 0.001;

    for (let i = 0; i < 3; i++) {
      const cr = r * (1.2 + i * 0.3);
      const grad = ctx.createRadialGradient(cx, cy, r * 0.8, cx, cy, cr);
      grad.addColorStop(0, `rgba(251, 191, 36, ${0.15 - i * 0.04})`);
      grad.addColorStop(1, "rgba(251, 191, 36, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, cr, 0, Math.PI * 2);
      ctx.fill();
    }

    const surf = ctx.createRadialGradient(cx - r * 0.2, cy - r * 0.2, 0, cx, cy, r);
    surf.addColorStop(0, "#fde68a");
    surf.addColorStop(0.5, "#fbbf24");
    surf.addColorStop(1, "#d97706");
    ctx.fillStyle = surf;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + time * 0.3;
      const fr = r * (1 + 0.05 * Math.sin(time * 2 + i));
      ctx.strokeStyle = `rgba(253, 230, 138, ${0.3 + 0.2 * Math.sin(time * 3 + i)})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      ctx.lineTo(cx + Math.cos(a) * fr * 1.15, cy + Math.sin(a) * fr * 1.15);
      ctx.stroke();
    }
  }

  function drawSolarSystem(cx, cy, maxR, obj, t) {
    const r = maxR * 0.9;
    const time = performance.now() * 0.0003;

    ctx.fillStyle = "#fbbf24";
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.06, 0, Math.PI * 2);
    ctx.fill();

    const planets = [
      { dist: 0.15, size: 0.015, color: "#a9e34a", speed: 4 },
      { dist: 0.25, size: 0.02, color: "#ffd43b", speed: 3 },
      { dist: 0.35, size: 0.025, color: "#4dabf7", speed: 2.5 },
      { dist: 0.48, size: 0.02, color: "#e67700", speed: 2 },
      { dist: 0.65, size: 0.06, color: "#f59e0b", speed: 1.2 },
      { dist: 0.8, size: 0.05, color: "#ffd8a8", speed: 0.9 },
      { dist: 0.92, size: 0.04, color: "#74c0fc", speed: 0.6 }
    ];

    planets.forEach((p, i) => {
      ctx.strokeStyle = "rgba(245, 158, 11, 0.1)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, r * p.dist, 0, Math.PI * 2);
      ctx.stroke();

      const a = time * p.speed * 10;
      const px = cx + Math.cos(a) * r * p.dist;
      const py = cy + Math.sin(a) * r * p.dist;

      ctx.strokeStyle = `${p.color}40`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(cx, cy, r * p.dist, a - 0.3, a);
      ctx.stroke();

      const grad = ctx.createRadialGradient(px - p.size * r * 0.3, py - p.size * r * 0.3, 0, px, py, p.size * r);
      grad.addColorStop(0, p.color);
      grad.addColorStop(1, p.color);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(px, py, p.size * r, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawGalaxy(cx, cy, maxR, obj, t) {
    const r = maxR * 0.9;
    const time = performance.now() * 0.00005;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(time * 2);

    const core = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.3);
    core.addColorStop(0, "rgba(255, 230, 180, 0.8)");
    core.addColorStop(0.5, "rgba(192, 132, 252, 0.3)");
    core.addColorStop(1, "rgba(192, 132, 252, 0)");
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
    ctx.fill();

    const arms = 3;
    for (let arm = 0; arm < arms; arm++) {
      ctx.strokeStyle = "rgba(192, 132, 252, 0.15)";
      ctx.lineWidth = r * 0.04;
      ctx.beginPath();
      for (let i = 0; i <= 60; i++) {
        const frac = i / 60;
        const angle = frac * Math.PI * 3 + (arm / arms) * Math.PI * 2;
        const dist = frac * r;
        const x = Math.cos(angle) * dist;
        const y = Math.sin(angle) * dist * 0.4;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      for (let i = 0; i < 40; i++) {
        const frac = i / 40;
        const angle = frac * Math.PI * 3 + (arm / arms) * Math.PI * 2;
        const dist = frac * r;
        const x = Math.cos(angle) * dist + (Math.random() - 0.5) * r * 0.05;
        const y = Math.sin(angle) * dist * 0.4 + (Math.random() - 0.5) * r * 0.05;
        ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + Math.random() * 0.5})`;
        ctx.beginPath();
        ctx.arc(x, y, 0.8 + Math.random(), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.6, r * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawCosmicWeb(cx, cy, maxR, obj, t) {
    const r = maxR * 0.95;
    const time = performance.now() * 0.0001;

    const nodes = [];
    for (let i = 0; i < 30; i++) {
      const seed = i * 137.5;
      const angle = (seed % 360) * Math.PI / 180;
      const dist = (Math.sin(seed * 0.3) * 0.5 + 0.5) * r;
      nodes.push({
        x: cx + Math.cos(angle) * dist,
        y: cy + Math.sin(angle) * dist,
        size: 2 + Math.sin(seed) * 3 + Math.random() * 4
      });
    }

    ctx.strokeStyle = "rgba(232, 121, 249, 0.15)";
    ctx.lineWidth = 1;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const dx = nodes[i].x - nodes[j].x;
        const dy = nodes[i].y - nodes[j].y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < r * 0.35) {
          ctx.globalAlpha = (1 - d / (r * 0.35)) * 0.3;
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;

    nodes.forEach((n, i) => {
      const twinkle = 0.5 + 0.5 * Math.sin(time * 5 + i);
      const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.size * 3);
      grad.addColorStop(0, `rgba(232, 121, 249, ${twinkle * 0.6})`);
      grad.addColorStop(1, "rgba(232, 121, 249, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.size * 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `rgba(255, 255, 255, ${twinkle})`;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.size * 0.5, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
    ctx.beginPath();
    ctx.arc(cx - r * 0.3, cy + r * 0.2, r * 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + r * 0.25, cy - r * 0.15, r * 0.15, 0, Math.PI * 2);
    ctx.fill();
  }

  // === UI UPDATE ===
  function updateUI() {
    const { idx, nearest, log } = getCurrentObjectInfo();
    const { from, to, frac } = getTransitionInfo();

    const displayObj = frac > 0.5 ? to : from;
    el.objName.textContent = displayObj.name;
    el.objDesc.textContent = displayObj.desc;
    el.readoutName.textContent = displayObj.name;

    const roundedLog = Math.round(log);
    el.readoutScale.textContent = formatScale(roundedLog);
    el.readoutMagnitude.textContent = formatMagnitude(roundedLog);

    const magPercent = ((log - MIN_LOG) / SPAN) * 100;
    el.magnitudeFill.style.width = `${magPercent}%`;

    const barPercent = ((log - MIN_LOG) / SPAN) * 80 + 10;
    el.scaleBar.style.width = `${barPercent}%`;
    el.scaleBarLabel.textContent = `当前尺度 ~${formatScale(roundedLog)}`;

    const percent = state.scale * 100;
    el.timelineFill.style.width = `${percent}%`;
    el.timelineHandle.style.left = `${percent}%`;

    const items = el.objectList.querySelectorAll(".object-item");
    items.forEach((item, i) => {
      item.classList.toggle("active", i === idx);
    });

    if (state.running) {
      el.status.textContent = state.direction > 0
        ? "自动播放中 · 前进 →"
        : "自动播放中 · 回溯 ←";
    } else {
      el.status.textContent = frac > 0.5 ? `聚焦：${to.name}` : `聚焦：${from.name}`;
    }

    const gap = Math.abs(to.logScale - from.logScale);
    const dirLabel = state.direction > 0 ? "放大" : "缩小";
    if (frac < 0.15) {
      el.insight.textContent = state.running
        ? `聚焦 ${from.name}：尺度约 ${formatScale(from.logScale)}。自动${dirLabel}中，即将进入下一级结构。`
        : `聚焦 ${from.name}：尺度约 ${formatScale(from.logScale)}。拖动时间轴向右放大，进入下一级结构。`;
    } else if (frac < 0.5) {
      el.insight.textContent = `从 ${from.name} 过渡到 ${to.name}：跨越约 ${gap} 个数量级，结构在淡入淡出中切换。`;
    } else if (frac < 0.85) {
      el.insight.textContent = `从 ${from.name} 过渡到 ${to.name}：跨越约 ${gap} 个数量级，${to.name} 正在成为主导结构。`;
    } else {
      el.insight.textContent = state.running
        ? `聚焦 ${to.name}：尺度约 ${formatScale(to.logScale)}。自动${dirLabel}中，即将进入${state.direction > 0 ? "更宏观" : "更微观"}的尺度。`
        : `聚焦 ${to.name}：尺度约 ${formatScale(to.logScale)}。继续向右放大，进入更宏观的尺度。`;
    }
  }

  // === FRAME LOOP ===
  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // === MODEL CHECKS ===
  function runModelChecks() {
    const testScale = (s, expected) => {
      const log = scaleToLog(s);
      return Math.abs(log - expected) < 0.001;
    };

    function simulateRoundTrip() {
      let s = 0;
      let dir = 1;
      const speed = 0.06;
      const dt = 0.016;
      const maxIter = 10000;
      let reachedEnd = false;
      let returnedStart = false;
      for (let i = 0; i < maxIter; i++) {
        s += speed * dir * dt;
        if (s >= 1) { s = 1; dir = -1; reachedEnd = true; }
        else if (s <= 0) { s = 0; dir = 1; if (reachedEnd) { returnedStart = true; break; } }
      }
      return { reachedEnd, returnedStart };
    }

    const trip = simulateRoundTrip();

    const checks = [
      { name: "scale 0 -> nucleus log", pass: testScale(0, -15), expected: -15, actual: scaleToLog(0) },
      { name: "scale 1 -> cosmic log", pass: testScale(1, 25), expected: 25, actual: scaleToLog(1) },
      { name: "scale 0.5 -> mid log", pass: testScale(0.5, 5), expected: 5, actual: scaleToLog(0.5) },
      { name: "monotonic increase", pass: scaleToLog(0.3) < scaleToLog(0.7), expected: "increasing", actual: `${scaleToLog(0.3)} < ${scaleToLog(0.7)}` },
      { name: "formatScale(-15)", pass: formatScale(-15) === "10⁻¹⁵ m", expected: "10⁻¹⁵ m", actual: formatScale(-15) },
      { name: "formatScale(0)", pass: formatScale(0) === "10⁰ m", expected: "10⁰ m", actual: formatScale(0) },
      { name: "formatScale(25)", pass: formatScale(25) === "10²⁵ m", expected: "10²⁵ m", actual: formatScale(25) },
      { name: "object count = 12", pass: OBJECTS.length === 12, expected: 12, actual: OBJECTS.length },
      { name: "scale span = 40 decades", pass: (MAX_LOG - MIN_LOG) === 40, expected: 40, actual: MAX_LOG - MIN_LOG },
      { name: "round-trip reaches end", pass: trip.reachedEnd, expected: true, actual: trip.reachedEnd },
      { name: "round-trip returns to start", pass: trip.returnedStart, expected: true, actual: trip.returnedStart }
    ];

    return checks;
  }

  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      this.beginPath();
      this.moveTo(x + r, y);
      this.lineTo(x + w - r, y);
      this.quadraticCurveTo(x + w, y, x + w, y + r);
      this.lineTo(x + w, y + h - r);
      this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      this.lineTo(x + r, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - r);
      this.lineTo(x, y + r);
      this.quadraticCurveTo(x, y, x + r, y);
      this.closePath();
    };
  }

  function start() { play(); }
  function setParameters(values) {
    if (values && typeof values.scale !== "undefined") {
      pause();
      setScale(values.scale);
    }
  }
  function getState() {
    return {
      scale: state.scale,
      running: state.running,
      direction: state.direction,
      log: scaleToLog(state.scale)
    };
  }
  function getReadouts() {
    const { idx, nearest, log } = getCurrentObjectInfo();
    const { from, to, frac } = getTransitionInfo();
    const displayObj = frac > 0.5 ? to : from;
    return {
      scale: state.scale,
      log: log,
      roundedLog: Math.round(log),
      objectName: displayObj.name,
      objectEn: displayObj.en,
      objectLogScale: displayObj.logScale,
      running: state.running,
      direction: state.direction
    };
  }

  window.simulation = {
    init, start, pause, reset, update, render,
    setParameters, getState, getReadouts, runModelChecks
  };

  init();
})();
</script>
