<!doctype html>
<html lang="zh-CN">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旋转矢量法 · 简谐运动演示</title>
<style>
:root {
  color-scheme: light;
  --sim-bg: #eef3f8;
  --sim-surface: #ffffff;
  --sim-surface-soft: #f8fafc;
  --sim-text: #172033;
  --sim-muted: #657188;
  --sim-border: #dfe6ef;
  --sim-grid: #e8edf4;
  --sim-accent: #0f9fba;
  --sim-accent-deep: #08758a;
  --sim-accent-soft: #d9f4f7;
  --sim-positive: #0f9fba;
  --sim-warning: #f59e0b;
  --sim-danger: #dc2626;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
  --sim-vector: #0f9fba;
  --sim-vector-deep: #08758a;
  --sim-projection: #f59e0b;
  --sim-projection-deep: #b45309;
  --sim-curve: #0f9fba;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--sim-text);
  background:
    radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
    radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
    var(--sim-bg);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
.app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
.header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
.header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
.header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
.status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 12px; }
.panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
.scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.panel-head h2 { margin: 0; font-size: 1rem; }
.panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
#scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); }
.side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
.readouts, .model-note { padding: 17px; }
.readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.metric { padding: 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
.metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
.metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.model-note { display: grid; align-content: start; gap: 14px; }
.model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
.insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; }
.controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr) minmax(180px, 1fr) minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
.actions { display: flex; gap: 8px; }
button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
button:hover { border-color: #c7d2e2; background: #eef3f9; }
button:active { transform: scale(.97); }
button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
.control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
.control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
.grid-line { stroke: var(--sim-grid); stroke-width: 1; }
.axis { stroke: #9aa7ba; stroke-width: 1.5; }
.axis-label { fill: var(--sim-muted); font-size: 12px; }
@media (max-width: 860px) {
  .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
  .main, .app[data-layout] .main { grid-template-columns: 1fr; }
  .controls { grid-template-columns: 1fr; }
  .scene-panel { min-height: 0; }
  #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>旋转矢量法 · 简谐运动演示</h1>
      <p>旋转矢量的端点在水平轴上的投影，正是简谐运动的位移 x = A·cos(ωt + φ)。</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head"><h2 id="scene-title">旋转矢量与投影</h2><span>矢量逆时针匀速旋转 · 端点投影即位移</span></div>
      <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
        <desc id="scene-desc">左侧：旋转矢量从原点出发，端点在水平轴上投影做简谐运动；右侧：投影位移随时间展开为余弦曲线。</desc>
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <polygon points="0 0, 10 3, 0 6" fill="var(--sim-vector)"></polygon>
          </marker>
        </defs>
        <g id="leftGrid"></g>
        <line class="axis" x1="30" y1="210" x2="410" y2="210"></line>
        <line class="axis" x1="220" y1="30" x2="220" y2="390"></line>
        <text class="axis-label" x="402" y="228">x</text>
        <text class="axis-label" x="228" y="38">y</text>
        <circle cx="220" cy="210" r="3.5" fill="var(--sim-muted)"></circle>
        <circle id="orbitCircle" cx="220" cy="210" r="120" fill="none" stroke="rgba(15,159,186,0.20)" stroke-width="1.5" stroke-dasharray="4 5"></circle>
        <line id="projectionV" x1="0" y1="0" x2="0" y2="0" stroke="var(--sim-projection)" stroke-width="2" stroke-dasharray="6 5" opacity="0.85"></line>
        <line id="projectionH" x1="0" y1="0" x2="0" y2="0" stroke="var(--sim-projection)" stroke-width="2" stroke-dasharray="6 5" opacity="0.85"></line>
        <line id="vector" x1="220" y1="210" x2="340" y2="210" stroke="var(--sim-vector)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowhead)"></line>
        <circle id="endpoint" cx="340" cy="210" r="7" fill="var(--sim-vector)" stroke="white" stroke-width="2.5"></circle>
        <circle id="projPoint" cx="340" cy="210" r="8" fill="var(--sim-projection)" stroke="white" stroke-width="2.5"></circle>
        <text id="phaseLabel" x="232" y="200" font-size="12" fill="var(--sim-muted)" font-weight="700">θ</text>
        <line class="axis" x1="440" y1="210" x2="740" y2="210"></line>
        <text class="axis-label" x="728" y="228">t</text>
        <text class="axis-label" x="446" y="38">x</text>
        <g id="rightGrid"></g>
        <line id="ampLineP" x1="440" y1="90" x2="740" y2="90" stroke="rgba(245,158,11,0.35)" stroke-width="1" stroke-dasharray="3 4"></line>
        <line id="ampLineN" x1="440" y1="330" x2="740" y2="330" stroke="rgba(245,158,11,0.35)" stroke-width="1" stroke-dasharray="3 4"></line>
        <text id="ampLabelP" x="446" y="84" font-size="11" fill="var(--sim-projection-deep)" font-weight="700">+A</text>
        <text id="ampLabelN" x="446" y="346" font-size="11" fill="var(--sim-projection-deep)" font-weight="700">−A</text>
        <polyline id="curve" points="" fill="none" stroke="var(--sim-curve)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="drop-shadow(0 2px 3px rgba(15,159,186,.15))"></polyline>
        <line id="cursorLine" x1="0" y1="0" x2="0" y2="0" stroke="rgba(245,158,11,0.5)" stroke-width="1.5" stroke-dasharray="4 4"></line>
        <circle id="cursorPoint" cx="440" cy="210" r="6" fill="var(--sim-projection)" stroke="white" stroke-width="2"></circle>
      </svg>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel readouts" aria-label="实时数值">
        <div class="readout-grid">
          <div class="metric"><small>位移 x</small><strong id="xReadout">0.00</strong></div>
          <div class="metric"><small>相位 θ = ωt+φ</small><strong id="phaseReadout">0.00°</strong></div>
          <div class="metric"><small>时间 t</small><strong id="tReadout">0.00 s</strong></div>
          <div class="metric"><small>周期 T = 2π/ω</small><strong id="periodReadout">—</strong></div>
        </div>
      </section>
      <section class="panel model-note" data-region="insight">
        <div class="panel-head"><h2>洞察</h2></div>
        <p id="insight" class="insight">按"开始"启动。矢量端点做匀速圆周运动，它在水平轴上的投影点做简谐运动。</p>
        <p>几何关系：旋转矢量长度 = 振幅 A，旋转角速度 = 角频率 ω，初始与 x 轴夹角 = 初相 φ。端点在 x 轴的投影即位移 x = A·cos(ωt+φ)。</p>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="仿真控制">
    <div class="actions">
      <button id="startBtn" class="primary" type="button">开始</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control">
      <label for="ampInput">振幅 A <output id="ampOutput">1.20</output></label>
      <input id="ampInput" type="range" min="0.4" max="1.8" step="0.05" value="1.2">
    </div>
    <div class="control">
      <label for="omegaInput">角频率 ω <output id="omegaOutput">2.00 rad/s</output></label>
      <input id="omegaInput" type="range" min="0.5" max="5" step="0.1" value="2">
    </div>
    <div class="control">
      <label for="phiInput">初相 φ <output id="phiOutput">0°</output></label>
      <input id="phiInput" type="range" min="-180" max="180" step="5" value="0">
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";
  const parameterSchema = [
    { key: "amplitude", label: "振幅 A", type: "slider", min: 0.4, max: 1.8, step: 0.05, default: 1.2, unit: "" },
    { key: "omega", label: "角频率 ω", type: "slider", min: 0.5, max: 5, step: 0.1, default: 2, unit: "rad/s" },
    { key: "phi", label: "初相 φ", type: "slider", min: -180, max: 180, step: 5, default: 0, unit: "°" }
  ];
  const state = {
    running: false, t: 0,
    amplitude: 1.2, omega: 2, phiDeg: 0,
    lastTimestamp: null, history: [{ t: 0, x: 1.2 }]
  };
  const elements = {
    status: document.querySelector("#status"),
    vector: document.querySelector("#vector"), endpoint: document.querySelector("#endpoint"),
    projPoint: document.querySelector("#projPoint"),
    projectionV: document.querySelector("#projectionV"), projectionH: document.querySelector("#projectionH"),
    orbitCircle: document.querySelector("#orbitCircle"),
    phaseLabel: document.querySelector("#phaseLabel"),
    curve: document.querySelector("#curve"), cursorLine: document.querySelector("#cursorLine"), cursorPoint: document.querySelector("#cursorPoint"),
    ampLineP: document.querySelector("#ampLineP"), ampLineN: document.querySelector("#ampLineN"),
    ampLabelP: document.querySelector("#ampLabelP"), ampLabelN: document.querySelector("#ampLabelN"),
    leftGrid: document.querySelector("#leftGrid"), rightGrid: document.querySelector("#rightGrid"),
    insight: document.querySelector("#insight"),
    xReadout: document.querySelector("#xReadout"), phaseReadout: document.querySelector("#phaseReadout"),
    tReadout: document.querySelector("#tReadout"), periodReadout: document.querySelector("#periodReadout"),
    ampInput: document.querySelector("#ampInput"), ampOutput: document.querySelector("#ampOutput"),
    omegaInput: document.querySelector("#omegaInput"), omegaOutput: document.querySelector("#omegaOutput"),
    phiInput: document.querySelector("#phiInput"), phiOutput: document.querySelector("#phiOutput"),
    startBtn: document.querySelector("#startBtn"), pauseBtn: document.querySelector("#pauseBtn"), resetBtn: document.querySelector("#resetBtn")
  };
  const LAYOUT = {
    originX: 220, originY: 210,
    xMax: 1.8, pxPerUnit: 120 / 1.8,
    plotX0: 440, plotX1: 740, plotW: 300,
    plotY0: 30, plotY1: 390, plotCY: 210, plotH: 180
  };
  function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
  function finite(v, fb) { return Number.isFinite(v) ? v : fb; }
  function initGrid() {
    const ls = [];
    for (let i = 1; i <= 4; i++) {
      const dx = i * LAYOUT.pxPerUnit;
      ls.push(`<line class="grid-line" x1="${LAYOUT.originX+dx}" y1="${LAYOUT.plotY0}" x2="${LAYOUT.originX+dx}" y2="${LAYOUT.plotY1}"></line>`);
      ls.push(`<line class="grid-line" x1="${LAYOUT.originX-dx}" y1="${LAYOUT.plotY0}" x2="${LAYOUT.originX-dx}" y2="${LAYOUT.plotY1}"></line>`);
      const dy = i * 45;
      ls.push(`<line class="grid-line" x1="30" y1="${LAYOUT.originY-dy}" x2="410" y2="${LAYOUT.originY-dy}"></line>`);
      ls.push(`<line class="grid-line" x1="30" y1="${LAYOUT.originY+dy}" x2="410" y2="${LAYOUT.originY+dy}"></line>`);
    }
    elements.leftGrid.innerHTML = ls.join("");
    const rs = [];
    for (let i = 1; i <= 5; i++) {
      const tx = LAYOUT.plotX0 + (i/5)*LAYOUT.plotW;
      rs.push(`<line class="grid-line" x1="${tx}" y1="${LAYOUT.plotY0}" x2="${tx}" y2="${LAYOUT.plotY1}"></line>`);
    }
    for (const v of [0.5, 1, 1.5]) {
      const dy = v * LAYOUT.pxPerUnit;
      rs.push(`<line class="grid-line" x1="${LAYOUT.plotX0}" y1="${LAYOUT.plotCY-dy}" x2="${LAYOUT.plotX1}" y2="${LAYOUT.plotCY-dy}"></line>`);
      rs.push(`<line class="grid-line" x1="${LAYOUT.plotX0}" y1="${LAYOUT.plotCY+dy}" x2="${LAYOUT.plotX1}" y2="${LAYOUT.plotCY+dy}"></line>`);
    }
    elements.rightGrid.innerHTML = rs.join("");
  }
  function init() {
    initGrid(); bindControls(); setParameters({ amplitude: 1.2, omega: 2, phi: 0 }); reset(); requestAnimationFrame(frame);
  }
  function start() { state.running = true; elements.status.textContent = "运行中"; elements.startBtn.setAttribute("aria-pressed", "true"); }
  function pause() { state.running = false; elements.status.textContent = "已暂停"; elements.startBtn.setAttribute("aria-pressed", "false"); }
  function reset() {
    pause(); state.t = 0; state.lastTimestamp = null;
    const x0 = state.amplitude * Math.cos(state.phiDeg * Math.PI / 180);
    state.history = [{ t: 0, x: x0 }];
    render();
  }
  function update(dt) {
    if (!state.running) return;
    const bdt = clamp(finite(dt, 0), 0, 0.05);
    state.t += bdt;
    const x = state.amplitude * Math.cos(state.omega * state.t + state.phiDeg * Math.PI / 180);
    if (state.history.length === 0 || state.t - state.history[state.history.length-1].t >= 0.025) {
      state.history.push({ t: state.t, x: finite(x, 0) });
      if (state.history.length > 600) state.history.shift();
    }
  }
  function render() {
    const phase = state.omega * state.t + state.phiDeg * Math.PI / 180;
    const x = state.amplitude * Math.cos(phase);
    const r = state.amplitude * LAYOUT.pxPerUnit;
    const ex = LAYOUT.originX + r * Math.cos(phase);
    const ey = LAYOUT.originY - r * Math.sin(phase);
    const px = LAYOUT.originX + r * Math.cos(phase);
    elements.orbitCircle.setAttribute("r", Math.max(1, r));
    elements.vector.setAttribute("x2", ex); elements.vector.setAttribute("y2", ey);
    elements.endpoint.setAttribute("cx", ex); elements.endpoint.setAttribute("cy", ey);
    elements.projPoint.setAttribute("cx", px); elements.projPoint.setAttribute("cy", LAYOUT.originY);
    elements.projectionV.setAttribute("x1", ex); elements.projectionV.setAttribute("y1", ey);
    elements.projectionV.setAttribute("x2", px); elements.projectionV.setAttribute("y2", LAYOUT.originY);
    elements.projectionH.setAttribute("x1", px); elements.projectionH.setAttribute("y1", LAYOUT.originY);
    elements.projectionH.setAttribute("x2", LAYOUT.plotX0); elements.projectionH.setAttribute("y2", LAYOUT.plotCY);
    const tWindow = Math.max(2 * Math.PI / Math.max(0.3, state.omega), state.t + 0.5);
    const mapT = (tt) => LAYOUT.plotX0 + (tt / tWindow) * LAYOUT.plotW;
    const mapX = (xx) => LAYOUT.plotCY - xx * LAYOUT.pxPerUnit;
    elements.curve.setAttribute("points", state.history.map(s => `${mapT(s.t)},${mapX(s.x)}`).join(" "));
    const cx = mapT(state.t), cy = mapX(x);
    elements.cursorLine.setAttribute("x1", cx); elements.cursorLine.setAttribute("y1", LAYOUT.plotY0);
    elements.cursorLine.setAttribute("x2", cx); elements.cursorLine.setAttribute("y2", LAYOUT.plotY1);
    elements.cursorPoint.setAttribute("cx", cx); elements.cursorPoint.setAttribute("cy", cy);
    const ampY = LAYOUT.plotCY - state.amplitude * LAYOUT.pxPerUnit;
    elements.ampLineP.setAttribute("y1", ampY); elements.ampLineP.setAttribute("y2", ampY);
    elements.ampLineN.setAttribute("y1", 2*LAYOUT.plotCY - ampY); elements.ampLineN.setAttribute("y2", 2*LAYOUT.plotCY - ampY);
    elements.ampLabelP.setAttribute("y", ampY - 6);
    elements.ampLabelN.setAttribute("y", 2*LAYOUT.plotCY - ampY + 16);
    elements.ampLabelP.textContent = `+${state.amplitude.toFixed(2)}`;
    elements.ampLabelN.textContent = `−${state.amplitude.toFixed(2)}`;
    const phaseDeg = ((phase * 180 / Math.PI) % 360 + 360) % 360;
    elements.phaseLabel.textContent = `θ=${phaseDeg.toFixed(0)}°`;
    let msg;
    if (!state.running && state.t === 0) {
      msg = '按"开始"启动。矢量端点做匀速圆周运动，它在水平轴上的投影点做简谐运动。';
    } else {
      const ax = Math.abs(x);
      if (ax > state.amplitude * 0.95) msg = "端点投影到达最远点 ±A：此时位移最大、速度为零。";
      else if (ax < state.amplitude * 0.08) msg = "端点投影穿过原点：此时位移为零、速度最大。";
      else msg = "端点在圆上匀速旋转，它在 x 轴上的投影正是位移 x = A·cos(ωt+φ)。";
    }
    elements.insight.textContent = msg;
    elements.xReadout.textContent = x.toFixed(2);
    elements.phaseReadout.textContent = `${phaseDeg.toFixed(0)}°`;
    elements.tReadout.textContent = `${state.t.toFixed(2)} s`;
    const T = 2 * Math.PI / state.omega;
    elements.periodReadout.textContent = `${T.toFixed(2)} s`;
    elements.ampOutput.textContent = state.amplitude.toFixed(2);
    elements.omegaOutput.textContent = `${state.omega.toFixed(2)} rad/s`;
    elements.phiOutput.textContent = `${state.phiDeg.toFixed(0)}°`;
  }
  function setParameters(values) {
    const aDef = parameterSchema[0], oDef = parameterSchema[1], pDef = parameterSchema[2];
    state.amplitude = clamp(finite(Number(values.amplitude), aDef.default), aDef.min, aDef.max);
    state.omega = clamp(finite(Number(values.omega), oDef.default), oDef.min, oDef.max);
    state.phiDeg = clamp(finite(Number(values.phi), pDef.default), pDef.min, pDef.max);
    elements.ampInput.value = String(state.amplitude);
    elements.omegaInput.value = String(state.omega);
    elements.phiInput.value = String(state.phiDeg);
    if (!state.running) {
      state.t = 0;
      const x0 = state.amplitude * Math.cos(state.phiDeg * Math.PI / 180);
      state.history = [{ t: 0, x: x0 }];
    }
    render();
  }
  function getState() { return { ...state, history: state.history.map(s => ({...s})) }; }
  function getReadouts() {
    const phase = state.omega * state.t + state.phiDeg * Math.PI / 180;
    return {
      x: state.amplitude * Math.cos(phase),
      phase: phase,
      time: state.t,
      amplitude: state.amplitude, omega: state.omega, phiDeg: state.phiDeg,
      period: 2 * Math.PI / state.omega
    };
  }
  function runModelChecks() {
    const A = 1.2, w = 2, phi = 0;
    const x0 = A * Math.cos(phi);
    const xT = (t) => A * Math.cos(w * t + phi);
    const T = 2 * Math.PI / w;
    const halfT = xT(T/2);
    const fullT = xT(T);
    const x1 = xT(1);
    const expected1 = 1.2 * Math.cos(2);
    const xPhi = ((A2, w2, phi2, t2) => A2 * Math.cos(w2 * t2 + phi2))(1.0, 1.0, Math.PI/2, 0);
    const expectedPhi = 1.0 * Math.cos(Math.PI/2);
    const ampCheck = (() => { let max = 0; for (let i = 0; i <= 360; i++) { const v = 1.5 * Math.cos(i*Math.PI/180); if (Math.abs(v) > max) max = Math.abs(v); } return max; })();
    return [
      { name: "initial condition x(0)=A·cos(φ)", pass: Math.abs(x0 - 1.2) < 1e-10, expected: 1.2, actual: x0, tolerance: 1e-10 },
      { name: "periodicity x(T)=x(0)", pass: Math.abs(fullT - x0) < 1e-9, expected: x0, actual: fullT, tolerance: 1e-9 },
      { name: "half-period sign flip x(T/2)=-x(0)", pass: Math.abs(halfT - (-x0)) < 1e-9, expected: -x0, actual: halfT, tolerance: 1e-9 },
      { name: "analytic value x(1)=A·cos(ω)", pass: Math.abs(x1 - expected1) < 1e-12, expected: expected1, actual: x1, tolerance: 1e-12 },
      { name: "phase φ=π/2 gives x(0)=0", pass: Math.abs(xPhi - expectedPhi) < 1e-12, expected: expectedPhi, actual: xPhi, tolerance: 1e-12 },
      { name: "amplitude bound |x|≤A", pass: Math.abs(ampCheck - 1.5) < 1e-12, expected: 1.5, actual: ampCheck, tolerance: 1e-12 }
    ];
  }
  function bindControls() {
    elements.startBtn.addEventListener("click", start);
    elements.pauseBtn.addEventListener("click", pause);
    elements.resetBtn.addEventListener("click", reset);
    elements.ampInput.addEventListener("input", () => setParameters({ amplitude: elements.ampInput.value, omega: state.omega, phi: state.phiDeg }));
    elements.omegaInput.addEventListener("input", () => setParameters({ amplitude: state.amplitude, omega: elements.omegaInput.value, phi: state.phiDeg }));
    elements.phiInput.addEventListener("input", () => setParameters({ amplitude: state.amplitude, omega: state.omega, phi: elements.phiInput.value }));
  }
  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt); render(); requestAnimationFrame(frame);
  }
  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
