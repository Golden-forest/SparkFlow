<!doctype html>
<html lang="zh">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spiral Galaxy</title>
<style>
:root{
  color-scheme:dark;
  --sim-bg:#05070f;
  --sim-surface:#0a0e1a;
  --sim-surface-soft:#0f1424;
  --sim-text:#e8eefc;
  --sim-muted:#8a96b4;
  --sim-border:rgba(148,163,184,.18);
  --sim-grid:rgba(148,163,184,.08);
  --sim-accent:#7dd3fc;
  --sim-accent-deep:#38bdf8;
  --sim-accent-soft:rgba(125,211,252,.14);
  --sim-positive:#7dd3fc;
  --sim-warning:#fbbf24;
  --sim-danger:#f87171;
  --sim-radius-sm:10px;
  --sim-radius-md:16px;
  --sim-radius-lg:22px;
  --sim-shadow:0 14px 36px rgba(0,0,0,.5);
  --sim-space-1:4px;
  --sim-space-2:8px;
  --sim-space-3:12px;
  --sim-space-4:16px;
  --sim-space-5:24px;
  --sim-space-6:32px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:var(--sim-bg);color:var(--sim-text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#0a0f1e 0%,#05070f 55%,#02030a 100%)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.corner{position:absolute;right:18px;bottom:14px;display:flex;align-items:center;gap:14px;pointer-events:none;z-index:10}
.formula{font-size:12px;letter-spacing:.02em;color:rgba(232,238,252,.32);font-style:italic;pointer-events:none;user-select:none;text-shadow:0 1px 4px rgba(0,0,0,.9);font-variant-numeric:tabular-nums}
.play-btn{pointer-events:auto;width:30px;height:30px;border-radius:50%;border:1px solid rgba(232,238,252,.18);background:rgba(15,20,36,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:rgba(232,238,252,.55);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .25s ease,color .25s ease,border-color .25s ease,transform .15s ease;padding:0}
.play-btn:hover{background:rgba(30,40,66,.6);color:rgba(232,238,252,.92);border-color:rgba(232,238,252,.32)}
.play-btn:active{transform:scale(.94)}
.play-btn:focus-visible{outline:2px solid rgba(125,211,252,.5);outline-offset:2px}
.play-btn svg{width:11px;height:11px;fill:currentColor}
.status{position:absolute;left:18px;bottom:14px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(232,238,252,.22);pointer-events:none;user-select:none;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.evidence{position:absolute;left:18px;top:16px;pointer-events:none;z-index:10;display:flex;flex-direction:column;gap:8px;max-width:230px}
.metric{pointer-events:auto;padding:10px 14px;border-radius:12px;background:rgba(10,14,26,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(125,211,252,.14)}
.metric small{display:block;margin-bottom:3px;color:rgba(138,150,180,.85);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.metric strong{font-size:1.05rem;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:#dbeafe;font-weight:700}
.insight{position:absolute;right:18px;top:16px;pointer-events:auto;max-width:260px;padding:12px 14px;border-radius:12px;background:rgba(10,14,26,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(125,211,252,.14);border-left:3px solid var(--sim-accent);z-index:10}
.insight small{display:block;margin-bottom:4px;color:rgba(138,150,180,.85);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.insight p{margin:0;color:rgba(232,238,252,.78);font-size:12px;line-height:1.5}
@media (max-width:600px){
  .formula{font-size:10px}
  .play-btn{width:26px;height:26px}
  .play-btn svg{width:9px;height:9px}
  .evidence{max-width:150px}
  .metric{padding:8px 10px}
  .metric strong{font-size:.9rem}
  .insight{max-width:170px;padding:10px 12px}
  .insight p{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="qualitative">
  <canvas id="scene" data-region="stage" role="img" aria-label="俯视螺旋星系动态背景：两条对数螺旋旋臂、明亮核球光晕、较差自转与恒星闪烁"></canvas>
  <div class="status" data-region="header" aria-live="polite">Spiral Galaxy · r = a·e^(bθ)</div>
  <aside class="evidence" data-region="evidence" aria-label="星系实时数据">
    <div class="metric"><small>模拟时间</small><strong id="timeReadout">0.0 s</strong></div>
    <div class="metric"><small>旋臂数</small><strong id="armReadout">2</strong></div>
    <div class="metric"><small>恒星总数</small><strong id="starReadout">0</strong></div>
  </aside>
  <aside class="insight" data-region="insight" aria-label="模型说明">
    <small>模型</small>
    <p id="insightText">对数螺旋旋臂 r = a·e^(bθ)；较差自转使内圈快、外圈慢，旋臂形态在自转中保持。</p>
  </aside>
  <div class="corner" data-region="controls">
    <span class="formula">r = a · e^(bθ)</span>
    <button id="playBtn" class="play-btn" type="button" aria-label="暂停" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
  </div>
</div>
<script>
(() => {
"use strict";
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d", { alpha: false });
const playBtn = document.getElementById("playBtn");
const timeReadout = document.getElementById("timeReadout");
const armReadout = document.getElementById("armReadout");
const starReadout = document.getElementById("starReadout");
const insightText = document.getElementById("insightText");

// === 固定伪随机种子（Mulberry32）—— 保证刷新后星点位置一致 ===
function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20240517);

// === 状态 ===
const state = {
  running: true,
  time: 0,
  lastTs: null,
  dpr: 1,
  W: 0, H: 0, cx: 0, cy: 0, scale: 1
};

// === 星系参数 ===
const PARAMS = {
  armCount: 2,              // 旋臂数量
  a: 1.6,                   // 螺旋方程 r = a·e^(bθ) 的 a
  b: 0.235,                 // 螺旋方程的 b（旋臂松紧）
  rMin: 6,                  // 螺旋起始半径
  rMax: 410,                // 螺旋最大半径
  starsPerArm: 13000,       // 每条旋臂恒星数
  bgStars: 700,             // 背景暗星数
  haloStars: 900,            // 核球散星数
  omega0: 0.00045,          // 中心角速度（rad/ms）
  rScale: 95,               // 较差自转特征半径
  twinkleAmp: 0.4,          // 闪烁幅度
  twinkleFreq: 0.0016       // 闪烁基础频率
};

// === 颜色：从中心暖黄 → 旋臂蓝白 ===
function starColor(rNorm) {
  let R, G, B;
  if (rNorm < 0.18) {
    const t = rNorm / 0.18;
    R = 255; G = 230 + t * 15; B = 175 + t * 35;
  } else if (rNorm < 0.5) {
    const t = (rNorm - 0.18) / 0.32;
    R = 255 - t * 25; G = 245 - t * 15; B = 210 + t * 35;
  } else {
    const t = Math.min(1, (rNorm - 0.5) / 0.5);
    R = 230 - t * 55; G = 230 - t * 30; B = 245 + t * 10;
  }
  return [Math.round(R), Math.round(G), Math.round(B)];
}

// === 预生成恒星 ===
let armStars = [];
let bgStars = [];
let haloStars = [];

function generateStars() {
  armStars = [];
  bgStars = [];
  haloStars = [];
  const r = mulberry32(20240517);
  
  // 旋臂恒星：沿对数螺旋分布，加垂直扰动模拟旋臂宽度
  for (let arm = 0; arm < PARAMS.armCount; arm++) {
    const armOffset = (arm / PARAMS.armCount) * Math.PI * 2;
    for (let i = 0; i < PARAMS.starsPerArm; i++) {
      const t = Math.pow(r(), 0.85);
      const radius = PARAMS.rMin + t * (PARAMS.rMax - PARAMS.rMin);
      const theta = Math.log(radius / PARAMS.a) / PARAMS.b;
      const armWidth = 0.10 + 0.16 * t;
      const noise = (r() - 0.5) * 2;
      const dTheta = noise * armWidth;
      const finalTheta = theta + armOffset + dTheta;
      const dR = (r() - 0.5) * (8 + 18 * t);
      const finalR = Math.max(PARAMS.rMin * 0.5, radius + dR);
      const sizeRand = r();
      let size;
      if (sizeRand > 0.985) size = 1.8 + r() * 1.2;
      else if (sizeRand > 0.85) size = 1.1 + r() * 0.7;
      else size = 0.4 + r() * 0.6;
      const brightness = 0.45 + r() * 0.55;
      const phase = r() * Math.PI * 2;
      const freq = PARAMS.twinkleFreq * (0.5 + r() * 1.5);
      const twinkle = r() > 0.55;
      const rNorm = (finalR - PARAMS.rMin) / (PARAMS.rMax - PARAMS.rMin);
      const col = starColor(rNorm);
      armStars.push({
        r: finalR,
        theta0: finalTheta,
        size: size,
        brightness: brightness,
        phase: phase,
        freq: freq,
        twinkle: twinkle,
        col: col
      });
    }
  }
  
  // 核球散星：集中在中心附近，球形分布
  for (let i = 0; i < PARAMS.haloStars; i++) {
    const t = Math.pow(r(), 2.2);
    const radius = t * 70;
    const theta = r() * Math.PI * 2;
    const size = 0.3 + r() * 0.7;
    const brightness = 0.5 + r() * 0.5;
    const phase = r() * Math.PI * 2;
    const freq = PARAMS.twinkleFreq * (0.5 + r() * 1.5);
    const twinkle = r() > 0.5;
    const col = starColor(0.05 + r() * 0.15);
    haloStars.push({
      r: radius,
      theta0: theta,
      size: size,
      brightness: brightness,
      phase: phase,
      freq: freq,
      twinkle: twinkle,
      col: col
    });
  }
  
  // 背景暗星：均匀散布在画面四角
  for (let i = 0; i < PARAMS.bgStars; i++) {
    const angle = r() * Math.PI * 2;
    const dist = 300 + r() * 900;
    const x = Math.cos(angle) * dist;
    const y = Math.sin(angle) * dist;
    const size = 0.3 + r() * 0.5;
    const brightness = 0.15 + r() * 0.35;
    const phase = r() * Math.PI * 2;
    const freq = PARAMS.twinkleFreq * (0.5 + r() * 1.5);
    const twinkle = r() > 0.7;
    bgStars.push({ x, y, size, brightness, phase, freq, twinkle });
  }
}

// === 较差自转角速度：内快外慢 ===
function omegaAt(r) {
  return PARAMS.omega0 / (1 + r / PARAMS.rScale);
}

// === Canvas 尺寸适配 ===
function resize() {
  state.dpr = Math.min(window.devicePixelRatio || 1, 2);
  state.W = window.innerWidth;
  state.H = window.innerHeight;
  canvas.width = Math.floor(state.W * state.dpr);
  canvas.height = Math.floor(state.H * state.dpr);
  canvas.style.width = state.W + "px";
  canvas.style.height = state.H + "px";
  ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
  state.cx = state.W / 2;
  state.cy = state.H / 2;
  const minDim = Math.min(state.W, state.H);
  state.scale = (minDim * 0.46) / PARAMS.rMax;
}

// === 绘制核球光晕（径向渐变，多层叠加）===
function drawBulge() {
  const cx = state.cx, cy = state.cy;
  const s = state.scale;
  
  const outerR = Math.max(1, 240 * s);
  const g1 = ctx.createRadialGradient(cx, cy, 0, cx, cy, outerR);
  g1.addColorStop(0, "rgba(255, 220, 160, 0.22)");
  g1.addColorStop(0.35, "rgba(255, 200, 130, 0.10)");
  g1.addColorStop(0.7, "rgba(255, 180, 110, 0.03)");
  g1.addColorStop(1, "rgba(255, 180, 110, 0)");
  ctx.fillStyle = g1;
  ctx.beginPath();
  ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
  ctx.fill();
  
  const midR = Math.max(1, 90 * s);
  const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, midR);
  g2.addColorStop(0, "rgba(255, 240, 200, 0.55)");
  g2.addColorStop(0.5, "rgba(255, 220, 160, 0.22)");
  g2.addColorStop(1, "rgba(255, 200, 130, 0)");
  ctx.fillStyle = g2;
  ctx.beginPath();
  ctx.arc(cx, cy, midR, 0, Math.PI * 2);
  ctx.fill();
  
  const innerR = Math.max(1, 28 * s);
  const g3 = ctx.createRadialGradient(cx, cy, 0, cx, cy, innerR);
  g3.addColorStop(0, "rgba(255, 250, 230, 0.95)");
  g3.addColorStop(0.5, "rgba(255, 235, 190, 0.6)");
  g3.addColorStop(1, "rgba(255, 220, 160, 0)");
  ctx.fillStyle = g3;
  ctx.beginPath();
  ctx.arc(cx, cy, innerR, 0, Math.PI * 2);
  ctx.fill();
}

// === 绘制单颗恒星（双层模拟发光，无 shadowBlur）===
function drawStar(x, y, size, brightness, col) {
  const [R, G, B] = col;
  const rgb = R + "," + G + "," + B;
  const outerR = Math.max(0.6, size * 2.8);
  ctx.fillStyle = "rgba(" + rgb + "," + (brightness * 0.18) + ")";
  ctx.beginPath();
  ctx.arc(x, y, outerR, 0, Math.PI * 2);
  ctx.fill();
  const innerR = Math.max(0.3, size * 0.7);
  ctx.fillStyle = "rgba(" + rgb + "," + brightness + ")";
  ctx.beginPath();
  ctx.arc(x, y, innerR, 0, Math.PI * 2);
  ctx.fill();
}

// === 渲染一帧 ===
function render() {
  ctx.fillStyle = "#02030a";
  ctx.fillRect(0, 0, state.W, state.H);
  
  const cx = state.cx, cy = state.cy, s = state.scale;
  const t = state.time;
  
  for (let i = 0; i < bgStars.length; i++) {
    const st = bgStars[i];
    let b = st.brightness;
    if (st.twinkle) {
      b *= 1 + PARAMS.twinkleAmp * Math.sin(t * st.freq + st.phase);
    }
    b = Math.max(0, Math.min(1, b));
    const x = cx + st.x * s * 0.5;
    const y = cy + st.y * s * 0.5;
    if (x < -10 || x > state.W + 10 || y < -10 || y > state.H + 10) continue;
    drawStar(x, y, st.size, b, [200, 210, 230]);
  }
  
  drawBulge();
  
  for (let i = 0; i < armStars.length; i++) {
    const st = armStars[i];
    const omega = omegaAt(st.r);
    const theta = st.theta0 + omega * t;
    const r = st.r * s;
    const x = cx + Math.cos(theta) * r;
    const y = cy + Math.sin(theta) * r;
    if (x < -10 || x > state.W + 10 || y < -10 || y > state.H + 10) continue;
    let b = st.brightness;
    if (st.twinkle) {
      b *= 1 + PARAMS.twinkleAmp * Math.sin(t * st.freq + st.phase);
    }
    b = Math.max(0, Math.min(1, b));
    drawStar(x, y, st.size, b, st.col);
  }
  
  for (let i = 0; i < haloStars.length; i++) {
    const st = haloStars[i];
    const omega = omegaAt(st.r);
    const theta = st.theta0 + omega * t;
    const r = st.r * s;
    const x = cx + Math.cos(theta) * r;
    const y = cy + Math.sin(theta) * r;
    let b = st.brightness;
    if (st.twinkle) {
      b *= 1 + PARAMS.twinkleAmp * Math.sin(t * st.freq + st.phase);
    }
    b = Math.max(0, Math.min(1, b));
    drawStar(x, y, st.size, b, st.col);
  }
  
  // 同步 evidence 读数
  timeReadout.textContent = (state.time / 1000).toFixed(1) + " s";
  armReadout.textContent = String(PARAMS.armCount);
  starReadout.textContent = String(armStars.length + haloStars.length + bgStars.length);
  
  // 同步 insight 文案
  if (state.running) {
    insightText.textContent = "对数螺旋旋臂 r = a·e^(bθ)；较差自转使内圈快、外圈慢，旋臂形态在自转中保持。";
  } else {
    insightText.textContent = "已暂停：恒星位置冻结，可继续播放以恢复较差自转。";
  }
}

// === 更新 ===
function update(dt) {
  if (!state.running) return;
  const boundedDt = Math.max(0, Math.min(dt, 50));
  state.time += boundedDt;
}

// === 主循环 ===
function frame(ts) {
  if (state.lastTs === null) state.lastTs = ts;
  const dt = ts - state.lastTs;
  state.lastTs = ts;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

// === 控制按钮 ===
function togglePlay() {
  state.running = !state.running;
  playBtn.setAttribute("aria-pressed", String(state.running));
  playBtn.setAttribute("aria-label", state.running ? "暂停" : "播放");
  if (state.running) {
    playBtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  } else {
    playBtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg>';
  }
}

// === 运行时钩子 ===
function start() { if (!state.running) togglePlay(); }
function pause() { if (state.running) togglePlay(); }
function reset() { state.time = 0; }
function setParameters(values) {
  if (values && typeof values === "object") {
    if (typeof values.armCount === "number" && values.armCount >= 1 && values.armCount <= 6) {
      PARAMS.armCount = Math.round(values.armCount);
    }
  }
}
function getState() {
  return {
    running: state.running,
    time: state.time,
    armCount: PARAMS.armCount,
    totalStars: armStars.length + haloStars.length + bgStars.length
  };
}
function getReadouts() {
  return {
    time: state.time,
    armCount: PARAMS.armCount,
    totalStars: armStars.length + haloStars.length + bgStars.length
  };
}

// === 初始化 ===
function init() {
  resize();
  generateStars();
  playBtn.addEventListener("click", togglePlay);
  window.addEventListener("resize", resize);
  requestAnimationFrame(frame);
}

window.simulation = {
  init,
  start,
  pause,
  reset,
  update,
  render,
  setParameters,
  getState,
  getReadouts
};

init();
})();
</script>
</body>
</html>
