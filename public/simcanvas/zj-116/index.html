<!doctype html>
<html lang="zh-CN">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电阻串并联的水流类比</title>
<style>
:root {
  color-scheme: light;
  --sim-bg: #eef3f8;
  --sim-surface: #ffffff;
  --sim-surface-soft: #f8fafc;
  --sim-text: #172033;
  --sim-muted: #657188;
  --sim-border: #dfe6ef;
  --sim-grid: #e8edf4;
  --sim-accent: #0f9fba;
  --sim-accent-deep: #08758a;
  --sim-accent-soft: #d9f4f7;
  --sim-positive: #0f9fba;
  --sim-warning: #f59e0b;
  --sim-danger: #dc2626;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
  --sim-electric: #0f9fba;
  --sim-water: #2563eb;
  --sim-resistor: #b45309;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-width: 320px; color: var(--sim-text);
  background:
    radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
    radial-gradient(circle at 92% 4%, rgba(37, 99, 235, 0.10), transparent 26%),
    var(--sim-bg);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
.app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
.header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
.header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
.header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
.status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 12px; }
.app[data-layout="comparison"] .main { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
.scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.panel-head h2 { margin: 0; font-size: 1rem; }
.panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
#scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); }
.side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
.readouts, .model-note { padding: 17px; }
.readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.metric { padding: 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
.metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
.metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.metric.electric strong { color: var(--sim-electric); }
.metric.water strong { color: var(--sim-water); }
.model-note { display: grid; align-content: start; gap: 14px; }
.model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
.insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; }
.controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr) minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
.actions { display: flex; gap: 8px; }
button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
button:hover { border-color: #c7d2e2; background: #eef3f9; }
button:active { transform: scale(.97); }
button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
.mode-toggle { display: flex; gap: 4px; padding: 4px; background: var(--sim-surface-soft); border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); }
.mode-toggle button { border: none; padding: 8px 16px; background: transparent; }
.mode-toggle button.active { background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); color: #fff; box-shadow: 0 4px 10px rgba(15,159,186,.20); }
.control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
.control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
@media (max-width: 860px) {
  .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
  .main, .app[data-layout] .main { grid-template-columns: 1fr; }
  .controls { grid-template-columns: 1fr; }
  .scene-panel { min-height: 0; }
  #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app" data-layout="comparison" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>电阻串并联的水流类比</h1>
      <p>上半电路与下半水路同构对照：管子越多阻力越大，并排管路越多总流量越大。</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">串联模式 · 已暂停</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head"><h2 id="scene-title">电路 ↔ 水路 同构对照</h2><span>电子流动与水流同步</span></div>
      <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
        <desc id="scene-desc">上半为电路（电池、电阻、电流表），下半为同构水路（水泵、细管、流量计），电子与水流同步流动。</desc>
        <defs>
          <linearGradient id="batteryGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/>
          </linearGradient>
          <linearGradient id="pumpGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#334155"/><stop offset="1" stop-color="#1e293b"/>
          </linearGradient>
          <linearGradient id="resistorGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#d97706"/><stop offset="0.5" stop-color="#b45309"/><stop offset="1" stop-color="#92400e"/>
          </linearGradient>
          <linearGradient id="pipeGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#cbd5e1"/><stop offset="0.5" stop-color="#f1f5f9"/><stop offset="1" stop-color="#94a3b8"/>
          </linearGradient>
          <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/>
          </linearGradient>
        </defs>

        <!-- 电路区标签 -->
        <text x="20" y="28" font-size="13" font-weight="700" fill="#0f9fba">电路</text>
        <text x="20" y="218" font-size="13" font-weight="700" fill="#2563eb">水路</text>

        <!-- 电路导线 -->
        <g id="circuitWires"></g>
        <!-- 电路粒子 -->
        <g id="circuitParticles"></g>
        <!-- 电路元件 -->
        <g id="circuitComponents"></g>

        <!-- 水路管道 -->
        <g id="waterPipes"></g>
        <!-- 水路粒子 -->
        <g id="waterParticles"></g>
        <!-- 水路元件 -->
        <g id="waterComponents"></g>

        <!-- 同步指示 -->
        <g id="syncIndicator" transform="translate(380, 200)">
          <line x1="-30" y1="0" x2="30" y2="0" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
          <text x="0" y="-6" text-anchor="middle" font-size="11" fill="#657188" font-weight="600">同构对照</text>
          <text x="0" y="18" text-anchor="middle" font-size="11" fill="#657188">I = Q</text>
        </g>
      </svg>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel readouts" aria-label="同步读数">
        <div class="readout-grid">
          <div class="metric electric"><small>电流表 I</small><strong id="currentReadout">0.00 A</strong></div>
          <div class="metric water"><small>流量计 Q</small><strong id="flowReadout">0.00 L/s</strong></div>
          <div class="metric"><small>电阻个数 n</small><strong id="countReadout">3</strong></div>
          <div class="metric"><small>总阻力 R</small><strong id="resistanceReadout">3.0 Ω</strong></div>
        </div>
      </section>
      <section class="panel model-note" data-region="insight">
        <div class="panel-head"><h2>关系说明</h2></div>
        <p id="insight" class="insight">串联模式：细管首尾相连，管子越多阻力越大，流量越小。</p>
        <p id="formulaNote">R总 = n × R₀ = 3 × 1.0 = 3.0 Ω<br>I = V / R总 = 6 / 3.0 = 2.0 A</p>
        <p style="font-size:0.8rem;color:var(--sim-muted)">教学类比：电压 ↔ 水压，电阻 ↔ 管阻，电流 ↔ 流量。数值采用教学标定，1 A 对应 1 L/s。</p>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="模拟控制">
    <div class="mode-toggle" role="group" aria-label="模式切换">
      <button id="seriesBtn" class="active" type="button" aria-pressed="true">串联</button>
      <button id="parallelBtn" type="button" aria-pressed="false">并联</button>
    </div>
    <div class="control">
      <label for="countInput">电阻（细管）个数 <output id="countOutput">3</output></label>
      <input id="countInput" type="range" min="1" max="5" step="1" value="3">
    </div>
    <div class="actions">
      <button id="startBtn" class="primary" type="button">开始</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";
  const parameterSchema = [
    { key: "count", label: "电阻个数", type: "slider", min: 1, max: 5, step: 1, default: 3, unit: "" }
  ];
  const state = {
    running: false, mode: "series", count: 3,
    voltage: 6, R0: 1.0, pumpPressure: 6,
    current: 0, flow: 0,
    lastTimestamp: null, animPhase: 0
  };
  const elements = {
    status: document.querySelector("#status"),
    currentReadout: document.querySelector("#currentReadout"),
    flowReadout: document.querySelector("#flowReadout"),
    countReadout: document.querySelector("#countReadout"),
    resistanceReadout: document.querySelector("#resistanceReadout"),
    countInput: document.querySelector("#countInput"), countOutput: document.querySelector("#countOutput"),
    startBtn: document.querySelector("#startBtn"), pauseBtn: document.querySelector("#pauseBtn"), resetBtn: document.querySelector("#resetBtn"),
    seriesBtn: document.querySelector("#seriesBtn"), parallelBtn: document.querySelector("#parallelBtn"),
    insight: document.querySelector("#insight"), formulaNote: document.querySelector("#formulaNote"),
    circuitWires: document.querySelector("#circuitWires"),
    circuitParticles: document.querySelector("#circuitParticles"),
    circuitComponents: document.querySelector("#circuitComponents"),
    waterPipes: document.querySelector("#waterPipes"),
    waterParticles: document.querySelector("#waterParticles"),
    waterComponents: document.querySelector("#waterComponents")
  };

  function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
  function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

  // ============ 模型 ============
  function computeModel() {
    let R;
    if (state.mode === "series") {
      R = state.count * state.R0;
    } else {
      R = state.R0 / state.count;
    }
    state.current = state.voltage / R;
    state.flow = state.current; // 教学标定：1 A ↔ 1 L/s
  }

  function getResistance() {
    return state.mode === "series" ? state.count * state.R0 : state.R0 / state.count;
  }

  // ============ 几何 ============
  const CIRCUIT_Y = 90;
  const WATER_Y = 290;
  const LEFT_X = 80;
  const RIGHT_X = 680;
  const COMPONENT_AREA_X1 = 160;
  const COMPONENT_AREA_X2 = 600;
  const COMPONENT_AREA_W = COMPONENT_AREA_X2 - COMPONENT_AREA_X1;

  function getResistorCenters() {
    const centers = [];
    const n = state.count;
    if (state.mode === "series") {
      const spacing = COMPONENT_AREA_W / n;
      for (let i = 0; i < n; i++) {
        centers.push(COMPONENT_AREA_X1 + spacing * (i + 0.5));
      }
    } else {
      const spacing = Math.min(70, (COMPONENT_AREA_W - 40) / n);
      const totalW = spacing * (n - 1);
      const startX = (COMPONENT_AREA_X1 + COMPONENT_AREA_X2) / 2 - totalW / 2;
      for (let i = 0; i < n; i++) {
        centers.push(startX + i * spacing);
      }
    }
    return centers;
  }

  // ============ 电路渲染 ============
  function renderCircuitWires() {
    const parts = [];
    const n = state.count;
    const centers = getResistorCenters();

    if (state.mode === "series") {
      // 电池正极 → 第一个电阻左
      parts.push(wirePath(LEFT_X + 30, CIRCUIT_Y, centers[0] - 30, CIRCUIT_Y));
      // 电阻之间
      for (let i = 0; i < n - 1; i++) {
        parts.push(wirePath(centers[i] + 30, CIRCUIT_Y, centers[i+1] - 30, CIRCUIT_Y));
      }
      // 最后电阻右 → 右端
      parts.push(wirePath(centers[n-1] + 30, CIRCUIT_Y, RIGHT_X, CIRCUIT_Y));
      // 右端 → 下 → 左端 → 上 → 电池负极
      parts.push(`<path d="M ${RIGHT_X} ${CIRCUIT_Y} L ${RIGHT_X} ${CIRCUIT_Y + 40} L ${LEFT_X} ${CIRCUIT_Y + 40} L ${LEFT_X} ${CIRCUIT_Y}" ${wireStyle()}/>`);
    } else {
      // 电池正极 → 分支点
      parts.push(wirePath(LEFT_X + 30, CIRCUIT_Y, COMPONENT_AREA_X1 - 20, CIRCUIT_Y));
      // 分支点 → 各电阻上端
      for (let i = 0; i < n; i++) {
        parts.push(`<path d="M ${COMPONENT_AREA_X1 - 20} ${CIRCUIT_Y} L ${COMPONENT_AREA_X1 - 20} ${CIRCUIT_Y - 25} L ${centers[i]} ${CIRCUIT_Y - 25} L ${centers[i]} ${CIRCUIT_Y - 18}" ${wireStyle()}/>`);
      }
      // 各电阻下端 → 汇合点
      for (let i = 0; i < n; i++) {
        parts.push(`<path d="M ${centers[i]} ${CIRCUIT_Y + 18} L ${centers[i]} ${CIRCUIT_Y + 25} L ${COMPONENT_AREA_X2 + 20} ${CIRCUIT_Y + 25} L ${COMPONENT_AREA_X2 + 20} ${CIRCUIT_Y}" ${wireStyle()}/>`);
      }
      // 汇合点 → 右端
      parts.push(wirePath(COMPONENT_AREA_X2 + 20, CIRCUIT_Y, RIGHT_X, CIRCUIT_Y));
      // 右端 → 下 → 左端 → 上 → 电池负极
      parts.push(`<path d="M ${RIGHT_X} ${CIRCUIT_Y} L ${RIGHT_X} ${CIRCUIT_Y + 40} L ${LEFT_X} ${CIRCUIT_Y + 40} L ${LEFT_X} ${CIRCUIT_Y}" ${wireStyle()}/>`);
    }
    elements.circuitWires.innerHTML = parts.join("");
  }

  function wireStyle() {
    return `fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"`;
  }
  function wirePath(x1, y1, x2, y2) {
    return `<path d="M ${x1} ${y1} L ${x2} ${y2}" ${wireStyle()}/>`;
  }

  function renderCircuitComponents() {
    const parts = [];
    // 电池
    parts.push(`<g transform="translate(${LEFT_X}, ${CIRCUIT_Y})">
      <rect x="-10" y="-22" width="40" height="44" rx="4" fill="url(#batteryGrad)" stroke="#0f172a" stroke-width="1.5"/>
      <text x="10" y="-8" text-anchor="middle" font-size="14" font-weight="800" fill="#fbbf24">+</text>
      <text x="10" y="16" text-anchor="middle" font-size="14" font-weight="800" fill="#94a3b8">−</text>
      <text x="10" y="-30" text-anchor="middle" font-size="11" fill="#657188" font-weight="700">电池</text>
      <text x="10" y="40" text-anchor="middle" font-size="11" fill="#0f9fba" font-weight="700">${state.voltage} V</text>
    </g>`);

    // 电阻
    const centers = getResistorCenters();
    for (let i = 0; i < centers.length; i++) {
      parts.push(`<g transform="translate(${centers[i]}, ${CIRCUIT_Y})">
        <rect x="-30" y="-14" width="60" height="28" rx="6" fill="url(#resistorGrad)" stroke="#92400e" stroke-width="1.5"/>
        <text x="0" y="5" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">R${i+1}</text>
        <text x="0" y="-20" text-anchor="middle" font-size="10" fill="#92400e" font-weight="600">${state.R0.toFixed(1)}Ω</text>
      </g>`);
    }

    // 电流表
    parts.push(`<g transform="translate(${RIGHT_X}, ${CIRCUIT_Y})">
      <circle cx="0" cy="0" r="18" fill="#fff" stroke="#0f9fba" stroke-width="2.5"/>
      <text x="0" y="4" text-anchor="middle" font-size="12" font-weight="800" fill="#0f9fba">A</text>
      <text x="0" y="-26" text-anchor="middle" font-size="11" fill="#0f9fba" font-weight="700">${state.current.toFixed(2)} A</text>
    </g>`);

    elements.circuitComponents.innerHTML = parts.join("");
  }

  // ============ 水路渲染 ============
  function renderWaterPipes() {
    const parts = [];
    const n = state.count;
    const centers = getResistorCenters();

    if (state.mode === "series") {
      // 水泵出口 → 第一管左
      parts.push(pipeRect(LEFT_X + 30, WATER_Y - 8, centers[0] - 30 - (LEFT_X + 30), 16));
      // 管之间
      for (let i = 0; i < n - 1; i++) {
        parts.push(pipeRect(centers[i] + 30, WATER_Y - 8, centers[i+1] - 30 - (centers[i] + 30), 16));
      }
      // 最后管右 → 流量计
      parts.push(pipeRect(centers[n-1] + 30, WATER_Y - 8, RIGHT_X - (centers[n-1] + 30), 16));
      // 回流
      parts.push(`<path d="M ${RIGHT_X} ${WATER_Y} L ${RIGHT_X} ${WATER_Y + 40} L ${LEFT_X} ${WATER_Y + 40} L ${LEFT_X} ${WATER_Y}" fill="none" stroke="url(#pipeGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>`);
      parts.push(`<path d="M ${RIGHT_X} ${WATER_Y} L ${RIGHT_X} ${WATER_Y + 40} L ${LEFT_X} ${WATER_Y + 40} L ${LEFT_X} ${WATER_Y}" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>`);
    } else {
      // 水泵出口 → 分支点
      parts.push(pipeRect(LEFT_X + 30, WATER_Y - 8, COMPONENT_AREA_X1 - 20 - (LEFT_X + 30), 16));
      // 分支点 → 各管上端
      for (let i = 0; i < n; i++) {
        parts.push(`<path d="M ${COMPONENT_AREA_X1 - 20} ${WATER_Y} L ${COMPONENT_AREA_X1 - 20} ${WATER_Y - 25} L ${centers[i]} ${WATER_Y - 25} L ${centers[i]} ${WATER_Y - 8}" fill="none" stroke="url(#pipeGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>`);
      }
      // 各管下端 → 汇合点
      for (let i = 0; i < n; i++) {
        parts.push(`<path d="M ${centers[i]} ${WATER_Y + 8} L ${centers[i]} ${WATER_Y + 25} L ${COMPONENT_AREA_X2 + 20} ${WATER_Y + 25} L ${COMPONENT_AREA_X2 + 20} ${WATER_Y}" fill="none" stroke="url(#pipeGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>`);
      }
      // 汇合点 → 流量计
      parts.push(pipeRect(COMPONENT_AREA_X2 + 20, WATER_Y - 8, RIGHT_X - (COMPONENT_AREA_X2 + 20), 16));
      // 回流
      parts.push(`<path d="M ${RIGHT_X} ${WATER_Y} L ${RIGHT_X} ${WATER_Y + 40} L ${LEFT_X} ${WATER_Y + 40} L ${LEFT_X} ${WATER_Y}" fill="none" stroke="url(#pipeGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>`);
      parts.push(`<path d="M ${RIGHT_X} ${WATER_Y} L ${RIGHT_X} ${WATER_Y + 40} L ${LEFT_X} ${WATER_Y + 40} L ${LEFT_X} ${WATER_Y}" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>`);
    }
    elements.waterPipes.innerHTML = parts.join("");
  }

  function pipeRect(x, y, w, h) {
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#pipeGrad)" stroke="#94a3b8" stroke-width="1"/>`;
  }

  function renderWaterComponents() {
    const parts = [];
    // 水泵
    parts.push(`<g transform="translate(${LEFT_X}, ${WATER_Y})">
      <circle cx="0" cy="0" r="20" fill="url(#pumpGrad)" stroke="#0f172a" stroke-width="1.5"/>
      <path d="M -8 -8 L 8 0 L -8 8 Z" fill="#fbbf24"/>
      <text x="0" y="-30" text-anchor="middle" font-size="11" fill="#657188" font-weight="700">水泵</text>
      <text x="0" y="40" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="700">${state.pumpPressure} kPa</text>
    </g>`);

    // 细管（阻力元件）
    const centers = getResistorCenters();
    for (let i = 0; i < centers.length; i++) {
      parts.push(`<g transform="translate(${centers[i]}, ${WATER_Y})">
        <rect x="-30" y="-6" width="60" height="12" rx="3" fill="url(#waterGrad)" stroke="#1e40af" stroke-width="1.5"/>
        <text x="0" y="3" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">管${i+1}</text>
        <text x="0" y="-12" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="600">阻${state.R0.toFixed(1)}</text>
      </g>`);
    }

    // 流量计
    parts.push(`<g transform="translate(${RIGHT_X}, ${WATER_Y})">
      <circle cx="0" cy="0" r="18" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
      <text x="0" y="4" text-anchor="middle" font-size="12" font-weight="800" fill="#2563eb">Q</text>
      <text x="0" y="-26" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="700">${state.flow.toFixed(2)} L/s</text>
    </g>`);

    elements.waterComponents.innerHTML = parts.join("");
  }

  // ============ 粒子动画 ============
  function getCircuitSegments() {
    const segs = [];
    const n = state.count;
    const centers = getResistorCenters();

    if (state.mode === "series") {
      segs.push({ x1: LEFT_X + 30, y1: CIRCUIT_Y, x2: centers[0] - 30, y2: CIRCUIT_Y, type: "wire" });
      for (let i = 0; i < n - 1; i++) {
        segs.push({ x1: centers[i] + 30, y1: CIRCUIT_Y, x2: centers[i+1] - 30, y2: CIRCUIT_Y, type: "wire" });
      }
      segs.push({ x1: centers[n-1] + 30, y1: CIRCUIT_Y, x2: RIGHT_X, y2: CIRCUIT_Y, type: "wire" });
      segs.push({ x1: RIGHT_X, y1: CIRCUIT_Y, x2: RIGHT_X, y2: CIRCUIT_Y + 40, type: "wire" });
      segs.push({ x1: RIGHT_X, y1: CIRCUIT_Y + 40, x2: LEFT_X, y2: CIRCUIT_Y + 40, type: "wire" });
      segs.push({ x1: LEFT_X, y1: CIRCUIT_Y + 40, x2: LEFT_X, y2: CIRCUIT_Y, type: "wire" });
    } else {
      segs.push({ x1: LEFT_X + 30, y1: CIRCUIT_Y, x2: COMPONENT_AREA_X1 - 20, y2: CIRCUIT_Y, type: "wire" });
      for (let i = 0; i < n; i++) {
        segs.push({ x1: COMPONENT_AREA_X1 - 20, y1: CIRCUIT_Y, x2: centers[i], y2: CIRCUIT_Y, type: "branch", branchIndex: i });
      }
      segs.push({ x1: centers[0], y1: CIRCUIT_Y, x2: COMPONENT_AREA_X2 + 20, y2: CIRCUIT_Y, type: "merge" });
      segs.push({ x1: COMPONENT_AREA_X2 + 20, y1: CIRCUIT_Y, x2: RIGHT_X, y2: CIRCUIT_Y, type: "wire" });
      segs.push({ x1: RIGHT_X, y1: CIRCUIT_Y, x2: RIGHT_X, y2: CIRCUIT_Y + 40, type: "wire" });
      segs.push({ x1: RIGHT_X, y1: CIRCUIT_Y + 40, x2: LEFT_X, y2: CIRCUIT_Y + 40, type: "wire" });
      segs.push({ x1: LEFT_X, y1: CIRCUIT_Y + 40, x2: LEFT_X, y2: CIRCUIT_Y, type: "wire" });
    }
    return segs;
  }

  function getWaterSegments() {
    const segs = [];
    const n = state.count;
    const centers = getResistorCenters();

    if (state.mode === "series") {
      segs.push({ x1: LEFT_X + 30, y1: WATER_Y, x2: centers[0] - 30, y2: WATER_Y, type: "pipe" });
      for (let i = 0; i < n - 1; i++) {
        segs.push({ x1: centers[i] + 30, y1: WATER_Y, x2: centers[i+1] - 30, y2: WATER_Y, type: "pipe" });
      }
      segs.push({ x1: centers[n-1] + 30, y1: WATER_Y, x2: RIGHT_X, y2: WATER_Y, type: "pipe" });
      segs.push({ x1: RIGHT_X, y1: WATER_Y, x2: RIGHT_X, y2: WATER_Y + 40, type: "pipe" });
      segs.push({ x1: RIGHT_X, y1: WATER_Y + 40, x2: LEFT_X, y2: WATER_Y + 40, type: "pipe" });
      segs.push({ x1: LEFT_X, y1: WATER_Y + 40, x2: LEFT_X, y2: WATER_Y, type: "pipe" });
    } else {
      segs.push({ x1: LEFT_X + 30, y1: WATER_Y, x2: COMPONENT_AREA_X1 - 20, y2: WATER_Y, type: "pipe" });
      for (let i = 0; i < n; i++) {
        segs.push({ x1: COMPONENT_AREA_X1 - 20, y1: WATER_Y, x2: centers[i], y2: WATER_Y, type: "branch", branchIndex: i });
      }
      segs.push({ x1: centers[0], y1: WATER_Y, x2: COMPONENT_AREA_X2 + 20, y2: WATER_Y, type: "merge" });
      segs.push({ x1: COMPONENT_AREA_X2 + 20, y1: WATER_Y, x2: RIGHT_X, y2: WATER_Y, type: "pipe" });
      segs.push({ x1: RIGHT_X, y1: WATER_Y, x2: RIGHT_X, y2: WATER_Y + 40, type: "pipe" });
      segs.push({ x1: RIGHT_X, y1: WATER_Y + 40, x2: LEFT_X, y2: WATER_Y + 40, type: "pipe" });
      segs.push({ x1: LEFT_X, y1: WATER_Y + 40, x2: LEFT_X, y2: WATER_Y, type: "pipe" });
    }
    return segs;
  }

  function getParticleSpeed() {
    // 粒子速度与电流成正比（教学可视化）
    return clamp(state.current * 0.12, 0.02, 0.5);
  }

  function renderParticles() {
    const speed = getParticleSpeed();
    const phase = state.animPhase;

    // 电路粒子
    const circuitSegs = getCircuitSegments();
    const circuitTotalLen = circuitSegs.reduce((s, seg) => s + Math.hypot(seg.x2 - seg.x1, seg.y2 - seg.y1), 0);
    const circuitNumParticles = Math.max(8, Math.floor(circuitTotalLen / 40));
    const circuitParts = [];

    for (let i = 0; i < circuitNumParticles; i++) {
      let t = (i / circuitNumParticles + phase) % 1;
      const pos = getPointOnSegments(circuitSegs, t);
      if (pos) {
        circuitParts.push(`<circle cx="${pos.x}" cy="${pos.y}" r="3.5" fill="#0f9fba" opacity="0.9"/>`);
        circuitParts.push(`<circle cx="${pos.x}" cy="${pos.y}" r="6" fill="#0f9fba" opacity="0.2"/>`);
      }
    }
    elements.circuitParticles.innerHTML = circuitParts.join("");

    // 水路粒子
    const waterSegs = getWaterSegments();
    const waterTotalLen = waterSegs.reduce((s, seg) => s + Math.hypot(seg.x2 - seg.x1, seg.y2 - seg.y1), 0);
    const waterNumParticles = Math.max(8, Math.floor(waterTotalLen / 40));
    const waterParts = [];

    for (let i = 0; i < waterNumParticles; i++) {
      let t = (i / waterNumParticles + phase) % 1;
      const pos = getPointOnSegments(waterSegs, t);
      if (pos) {
        waterParts.push(`<circle cx="${pos.x}" cy="${pos.y}" r="3.5" fill="#2563eb" opacity="0.85"/>`);
        waterParts.push(`<circle cx="${pos.x}" cy="${pos.y}" r="6" fill="#60a5fa" opacity="0.2"/>`);
      }
    }
    elements.waterParticles.innerHTML = waterParts.join("");
  }

  function getPointOnSegments(segs, t) {
    const lengths = segs.map(s => Math.hypot(s.x2 - s.x1, s.y2 - s.y1));
    const total = lengths.reduce((a, b) => a + b, 0);
    if (total === 0) return null;
    let dist = t * total;
    for (let i = 0; i < segs.length; i++) {
      if (dist <= lengths[i]) {
        const f = lengths[i] === 0 ? 0 : dist / lengths[i];
        return {
          x: segs[i].x1 + (segs[i].x2 - segs[i].x1) * f,
          y: segs[i].y1 + (segs[i].y2 - segs[i].y1) * f
        };
      }
      dist -= lengths[i];
    }
    const last = segs[segs.length - 1];
    return { x: last.x2, y: last.y2 };
  }

  // ============ 渲染主函数 ============
  function render() {
    renderCircuitWires();
    renderCircuitComponents();
    renderWaterPipes();
    renderWaterComponents();
    renderParticles();

    const R = getResistance();
    elements.currentReadout.textContent = `${state.current.toFixed(2)} A`;
    elements.flowReadout.textContent = `${state.flow.toFixed(2)} L/s`;
    elements.countReadout.textContent = `${state.count}`;
    elements.resistanceReadout.textContent = `${R.toFixed(2)} Ω`;
    elements.countOutput.textContent = `${state.count}`;

    if (state.mode === "series") {
      elements.insight.textContent = `串联模式：${state.count} 根细管首尾相连，管子越多阻力越大，流量越小。`;
      elements.formulaNote.innerHTML = `R总 = n × R₀ = ${state.count} × ${state.R0.toFixed(1)} = ${R.toFixed(2)} Ω<br>I = V / R总 = ${state.voltage} / ${R.toFixed(2)} = ${state.current.toFixed(2)} A`;
    } else {
      elements.insight.textContent = `并联模式：${state.count} 根细管并排，管子越多总流量越大。`;
      elements.formulaNote.innerHTML = `R总 = R₀ / n = ${state.R0.toFixed(1)} / ${state.count} = ${R.toFixed(2)} Ω<br>I = V / R总 = ${state.voltage} / ${R.toFixed(2)} = ${state.current.toFixed(2)} A`;
    }
  }

  // ============ 生命周期 ============
  function init() {
    bindControls();
    setParameters({ count: 3 });
    reset();
    requestAnimationFrame(frame);
  }
  function start() {
    state.running = true;
    elements.status.textContent = `${state.mode === "series" ? "串联" : "并联"}模式 · 运行中`;
    elements.startBtn.setAttribute("aria-pressed", "true");
  }
  function pause() {
    state.running = false;
    elements.status.textContent = `${state.mode === "series" ? "串联" : "并联"}模式 · 已暂停`;
    elements.startBtn.setAttribute("aria-pressed", "false");
  }
  function reset() {
    pause();
    state.animPhase = 0;
    computeModel();
    render();
  }
  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05);
    const speed = getParticleSpeed();
    state.animPhase = (state.animPhase + speed * boundedDt * 60) % 1;
    render();
  }
  function setParameters(values) {
    const countDef = parameterSchema[0];
    state.count = clamp(Math.round(finite(Number(values.count), countDef.default)), countDef.min, countDef.max);
    elements.countInput.value = String(state.count);
    computeModel();
    render();
  }
  function setMode(mode) {
    state.mode = mode;
    elements.seriesBtn.classList.toggle("active", mode === "series");
    elements.parallelBtn.classList.toggle("active", mode === "parallel");
    elements.seriesBtn.setAttribute("aria-pressed", mode === "series");
    elements.parallelBtn.setAttribute("aria-pressed", mode === "parallel");
    elements.status.textContent = `${mode === "series" ? "串联" : "并联"}模式 · ${state.running ? "运行中" : "已暂停"}`;
    computeModel();
    render();
  }
  function getState() {
    return { ...state, R: getResistance() };
  }
  function getReadouts() {
    return { current: state.current, flow: state.flow, count: state.count, resistance: getResistance() };
  }
  function runModelChecks() {
    const simulate = (mode, count) => {
      const R = mode === "series" ? count * 1.0 : 1.0 / count;
      return { R, I: 6 / R, Q: 6 / R };
    };
    const series3 = simulate("series", 3);
    const parallel3 = simulate("parallel", 3);
    const series1 = simulate("series", 1);
    const parallel1 = simulate("parallel", 1);
    const series5 = simulate("series", 5);
    const parallel5 = simulate("parallel", 5);
    return [
      { name: "串联3电阻 R=3Ω", pass: Math.abs(series3.R - 3.0) < 1e-9, expected: 3.0, actual: series3.R, tolerance: 1e-9 },
      { name: "串联3电阻 I=2A", pass: Math.abs(series3.I - 2.0) < 1e-9, expected: 2.0, actual: series3.I, tolerance: 1e-9 },
      { name: "并联3电阻 R=1/3Ω", pass: Math.abs(parallel3.R - 1/3) < 1e-9, expected: 1/3, actual: parallel3.R, tolerance: 1e-9 },
      { name: "并联3电阻 I=18A", pass: Math.abs(parallel3.I - 18.0) < 1e-9, expected: 18.0, actual: parallel3.I, tolerance: 1e-9 },
      { name: "串联单调递增（n↑→R↑→I↓）", pass: series5.R > series3.R && series3.R > series1.R && series5.I < series3.I && series3.I < series1.I, expected: "n=5时R最大I最小", actual: `R5=${series5.R},R3=${series3.R},R1=${series1.R}`, tolerance: "strict" },
      { name: "并联单调递减（n↑→R↓→I↑）", pass: parallel5.R < parallel3.R && parallel3.R < parallel1.R && parallel5.I > parallel3.I && parallel3.I > parallel1.I, expected: "n=5时R最小I最大", actual: `R5=${parallel5.R},R3=${parallel3.R},R1=${parallel1.R}`, tolerance: "strict" },
      { name: "I=Q 同步标定", pass: Math.abs(series3.I - series3.Q) < 1e-9 && Math.abs(parallel3.I - parallel3.Q) < 1e-9, expected: "I=Q", actual: `series: I=${series3.I},Q=${series3.Q}`, tolerance: 1e-9 },
      { name: "串联n=1等于单电阻", pass: Math.abs(series1.R - 1.0) < 1e-9 && Math.abs(series1.I - 6.0) < 1e-9, expected: "R=1Ω, I=6A", actual: `R=${series1.R}, I=${series1.I}`, tolerance: 1e-9 },
      { name: "并联n=1等于单电阻", pass: Math.abs(parallel1.R - 1.0) < 1e-9 && Math.abs(parallel1.I - 6.0) < 1e-9, expected: "R=1Ω, I=6A", actual: `R=${parallel1.R}, I=${parallel1.I}`, tolerance: 1e-9 }
    ];
  }
  function bindControls() {
    elements.startBtn.addEventListener("click", start);
    elements.pauseBtn.addEventListener("click", pause);
    elements.resetBtn.addEventListener("click", reset);
    elements.seriesBtn.addEventListener("click", () => setMode("series"));
    elements.parallelBtn.addEventListener("click", () => setMode("parallel"));
    elements.countInput.addEventListener("input", () => setParameters({ count: elements.countInput.value }));
  }
  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    requestAnimationFrame(frame);
  }
  window.simulation = { init, start, pause, reset, update, render, setParameters, setMode, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
