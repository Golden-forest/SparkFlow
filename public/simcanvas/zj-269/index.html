<!doctype html>
<html lang="zh-CN">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>希尔伯特旅馆</title>
  <style>
    :root {
      color-scheme: dark;
      --sim-bg: #050810;
      --sim-surface: #0a1020;
      --sim-surface-soft: #0d1426;
      --sim-text: #e8eefc;
      --sim-muted: #7a8aa8;
      --sim-border: rgba(120, 150, 200, 0.18);
      --sim-grid: rgba(80, 110, 160, 0.10);
      --sim-accent: #f5c542;
      --sim-accent-deep: #c9961a;
      --sim-accent-soft: rgba(245, 197, 66, 0.16);
      --sim-positive: #f5c542;
      --sim-warning: #e8a73a;
      --sim-danger: #e85a5a;
      --sim-radius-sm: 8px;
      --sim-radius-md: 12px;
      --sim-radius-lg: 16px;
      --sim-shadow: 0 0 0 transparent;
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--sim-bg);
      color: var(--sim-text);
      font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 0;
    }
    .header {
      padding: 18px 32px 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      z-index: 10;
    }
    .header-left h1 {
      font-size: clamp(1.3rem, 2vw, 1.7rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--sim-text);
      line-height: 1.1;
    }
    .header-left p {
      margin-top: 4px;
      font-size: 0.72rem;
      color: var(--sim-muted);
      letter-spacing: 0.08em;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 0.78rem;
      color: var(--sim-muted);
      white-space: nowrap;
    }
    .act-badge {
      padding: 5px 14px;
      border: 1px solid var(--sim-accent-deep);
      border-radius: 999px;
      background: var(--sim-accent-soft);
      color: var(--sim-accent);
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      transition: all 0.4s ease;
    }
    .speed-readout {
      font-variant-numeric: tabular-nums;
      color: var(--sim-text);
      font-weight: 600;
    }
    .main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(240px, 300px);
      gap: 0;
    }
    .stage-wrap {
      position: relative;
      min-height: 0;
      overflow: hidden;
    }
    #scene {
      display: block;
      width: 100%;
      height: 100%;
    }
    .caption {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .caption.visible { opacity: 1; }
    .caption-main {
      font-size: clamp(1rem, 1.6vw, 1.35rem);
      font-weight: 700;
      color: var(--sim-accent);
      letter-spacing: 0.06em;
      text-shadow: 0 0 24px rgba(245, 197, 66, 0.4);
    }
    .caption-sub {
      margin-top: 6px;
      font-size: 0.72rem;
      color: var(--sim-muted);
      letter-spacing: 0.12em;
    }
    .side {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 0;
      border-left: 1px solid var(--sim-border);
      background: rgba(10, 16, 32, 0.55);
      backdrop-filter: blur(6px);
      overflow: hidden;
    }
    .readouts {
      padding: 16px 18px;
      border-bottom: 1px solid var(--sim-border);
    }
    .readouts h2 {
      font-size: 0.7rem;
      color: var(--sim-muted);
      letter-spacing: 0.14em;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .readout-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .metric {
      padding: 10px 12px;
      border: 1px solid var(--sim-border);
      border-radius: var(--sim-radius-sm);
      background: rgba(13, 20, 38, 0.6);
    }
    .metric small {
      display: block;
      margin-bottom: 4px;
      color: var(--sim-muted);
      font-size: 0.66rem;
      letter-spacing: 0.08em;
    }
    .metric strong {
      font-size: 1.15rem;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
      color: var(--sim-text);
      font-weight: 700;
    }
    .insight-panel {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .insight-panel h2 {
      font-size: 0.7rem;
      color: var(--sim-muted);
      letter-spacing: 0.14em;
      font-weight: 600;
    }
    .insight {
      padding: 12px 14px;
      border-left: 3px solid var(--sim-accent);
      border-radius: 0 var(--sim-radius-sm) var(--sim-radius-sm) 0;
      background: var(--sim-accent-soft);
      color: var(--sim-accent);
      font-weight: 600;
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .model-note {
      color: var(--sim-muted);
      font-size: 0.74rem;
      line-height: 1.6;
    }
    .controls {
      padding: 14px 32px 18px;
      display: flex;
      align-items: center;
      gap: 28px;
      justify-content: center;
      flex-wrap: wrap;
      border-top: 1px solid var(--sim-border);
      background: rgba(5, 8, 16, 0.6);
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    .act-btn, .run-btn, .replay-btn {
      padding: 9px 18px;
      border: 1px solid var(--sim-border);
      border-radius: var(--sim-radius-sm);
      background: transparent;
      color: var(--sim-muted);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .act-btn:hover, .run-btn:hover, .replay-btn:hover {
      border-color: var(--sim-accent-deep);
      color: var(--sim-text);
    }
    .act-btn.active {
      border-color: var(--sim-accent);
      background: var(--sim-accent-soft);
      color: var(--sim-accent);
      box-shadow: 0 0 16px rgba(245, 197, 66, 0.15);
    }
    .run-btn.primary {
      border-color: var(--sim-accent-deep);
      color: var(--sim-accent);
      background: var(--sim-accent-soft);
    }
    .act-btn:focus-visible, .run-btn:focus-visible, .replay-btn:focus-visible {
      outline: 2px solid var(--sim-accent);
      outline-offset: 2px;
    }
    .act-group {
      display: flex;
      gap: 8px;
    }
    .speed-control {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.78rem;
      color: var(--sim-muted);
    }
    .speed-control label {
      letter-spacing: 0.08em;
    }
    .speed-control input[type="range"] {
      width: 140px;
      accent-color: var(--sim-accent);
      cursor: pointer;
    }
    @media (max-width: 860px) {
      .main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
      .side { border-left: none; border-top: 1px solid var(--sim-border); max-height: 38vh; }
      .header { padding: 12px 16px 8px; }
      .controls { padding: 10px 16px 14px; gap: 14px; }
      .act-btn, .run-btn, .replay-btn { padding: 8px 14px; font-size: 0.74rem; }
      .speed-control input[type="range"] { width: 100px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .caption { transition: none; }
      .act-btn, .run-btn, .replay-btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="app" data-layout="scene-first" data-model-tier="rule-based">
    <header class="header" data-region="header">
      <div class="header-left">
        <h1>希尔伯特旅馆</h1>
        <p>无限长的旅馆，永远住得下</p>
      </div>
      <div class="header-right">
        <span class="act-badge" id="actBadge">第一幕</span>
        <span>速度</span>
        <span class="speed-readout" id="speedReadout">1.0×</span>
      </div>
    </header>

    <main class="main">
      <section class="stage-wrap" data-region="stage" aria-label="希尔伯特旅馆无限长剖面动画">
        <canvas id="scene"></canvas>
        <div class="caption" id="caption">
          <div class="caption-main" id="captionMain"></div>
          <div class="caption-sub" id="captionSub"></div>
        </div>
      </section>

      <aside class="side">
        <section class="readouts" data-region="evidence" aria-label="实时读数">
          <h2>实时读数</h2>
          <div class="readout-grid">
            <div class="metric"><small>当前幕</small><strong id="actReadout">1</strong></div>
            <div class="metric"><small>演示进度</small><strong id="phaseReadout">0.0%</strong></div>
            <div class="metric"><small>房间总数</small><strong id="roomsReadout">80</strong></div>
            <div class="metric"><small>演示速度</small><strong id="speedReadout2">1.0×</strong></div>
          </div>
        </section>
        <section class="insight-panel" data-region="insight" aria-label="教学洞察">
          <h2>教学洞察</h2>
          <div class="insight" id="insightText">按"开始"启动演示。波纹扫过时，所有客人从 n 号房移到 n+1 号房。</div>
          <div class="model-note">
            教学模型：用有限个房间（80 间）可视化无穷旅馆的"腾挪"过程。
            第一幕演示"无穷加一仍为无穷"——腾出 1 号房接纳新客；
            第二幕演示"无穷乘二仍为无穷"——老客迁入偶数号房，奇数号房留给无穷多辆大巴的客人。
          </div>
        </section>
      </aside>
    </main>

    <section class="controls" data-region="controls" aria-label="演示控件">
      <div class="actions">
        <button class="run-btn primary" id="startBtn" type="button">开始</button>
        <button class="run-btn" id="pauseBtn" type="button">暂停</button>
        <button class="replay-btn" id="resetBtn" type="button">重置</button>
      </div>
      <div class="act-group">
        <button class="act-btn active" id="act1Btn" type="button">第一幕</button>
        <button class="act-btn" id="act2Btn" type="button">第二幕</button>
      </div>
      <div class="speed-control">
        <label for="speedInput">演示速度</label>
        <input id="speedInput" type="range" min="0.3" max="2.5" step="0.1" value="1.0">
        <span class="speed-readout" id="speedDisplay">1.0×</span>
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";

    // ===== 配置 =====
    const CFG = {
      ROOM_COUNT: 80,
      VANISH_X_RATIO: 0.965,
      NEAR_ROOM_W: 0.045,
      NEAR_ROOM_H_RATIO: 0.22,
      HOTEL_Y_RATIO: 0.42,
      HOTEL_H_RATIO: 0.30,
      ROOM_GAP_NEAR: 0.004,
      ROOM_GAP_FAR: 0.0008,
      STROKE_NEAR: 2.2,
      STROKE_FAR: 0.4,
      GLOW_NEAR: 5,
      GLOW_FAR: 0.8,
      PHASE_DUR: { 1: 7.5, 2: 9.5 },
      LOOP_GAP: 1.8,
      OPENING_HOLD: 2.0,
      CAPTION_FADE: 0.5,
      TRAIL_LEN: 14,
      TRAIL_MIN_ALPHA: 0.06,
      BG_GRID_ALPHA: 0.05,
    };

    const CAPTIONS = {
      1: {
        main: "无穷加一，还是无穷",
        sub: "所有客人从 n 号房移到 n+1 号房，1 号房腾给新客",
      },
      2: {
        main: "无穷乘二，还是无穷",
        sub: "老客人移到 2n 号房，奇数号房留给无穷多辆大巴",
      },
      end: {
        main: "只要房间数得清，无穷就永远住得下",
        sub: "",
      },
    };

    // ===== 参数 schema =====
    const parameterSchema = [
      { key: "speed", label: "演示速度", type: "slider", min: 0.3, max: 2.5, step: 0.1, default: 1.0, unit: "×" }
    ];

    // ===== 状态 =====
    const state = {
      running: false,
      act: 1,
      speed: 1.0,
      time: 0,
      lastTs: null,
      phase: 0,
      captionAlpha: 0,
      captionKey: null,
      trails: [],
      reducedMotion: window.matchMedia("(prefers-reduced-motion: reduce)").matches,
    };

    // ===== DOM =====
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const actBadge = document.getElementById("actBadge");
    const speedReadout = document.getElementById("speedReadout");
    const speedReadout2 = document.getElementById("speedReadout2");
    const speedDisplay = document.getElementById("speedDisplay");
    const speedInput = document.getElementById("speedInput");
    const act1Btn = document.getElementById("act1Btn");
    const act2Btn = document.getElementById("act2Btn");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");
    const captionEl = document.getElementById("caption");
    const captionMain = document.getElementById("captionMain");
    const captionSub = document.getElementById("captionSub");
    const actReadout = document.getElementById("actReadout");
    const phaseReadout = document.getElementById("phaseReadout");
    const roomsReadout = document.getElementById("roomsReadout");
    const insightText = document.getElementById("insightText");

    // ===== 工具 =====
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const easeOut = t => 1 - Math.pow(1 - t, 3);
    const easeIn = t => t * t * t;

    // ===== Canvas 尺寸 =====
    let W = 0, H = 0, dpr = 1;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = canvas.getBoundingClientRect();
      W = Math.max(320, rect.width);
      H = Math.max(240, rect.height);
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // ===== 透视投影 =====
    function projectRoom(i) {
      const startX = W * 0.04;
      const vanishX = W * CFG.VANISH_X_RATIO;
      const t = i / CFG.ROOM_COUNT;
      const xEase = easeOut(t);
      const cx = startX + (vanishX - startX) * xEase;
      const scale = Math.max(0.04, 1 - t * 0.92);
      const w = W * CFG.NEAR_ROOM_W * scale;
      const h = H * CFG.NEAR_ROOM_H_RATIO * scale;
      const cy = H * CFG.HOTEL_Y_RATIO;
      const gap = lerp(CFG.ROOM_GAP_NEAR, CFG.ROOM_GAP_FAR, t) * W;
      const stroke = lerp(CFG.STROKE_NEAR, CFG.STROKE_FAR, t);
      const glow = lerp(CFG.GLOW_NEAR, CFG.GLOW_FAR, t);
      return { cx, cy, w, h, scale, gap, stroke, glow, t };
    }

    // ===== 背景 =====
    function drawBackground() {
      const g1 = ctx.createRadialGradient(W * 0.2, H * 0.3, 0, W * 0.2, H * 0.3, W * 0.7);
      g1.addColorStop(0, "rgba(20, 35, 65, 0.55)");
      g1.addColorStop(1, "rgba(5, 8, 16, 0)");
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, W, H);

      const g2 = ctx.createRadialGradient(W * 0.85, H * 0.5, 0, W * 0.85, H * 0.5, W * 0.5);
      g2.addColorStop(0, "rgba(40, 30, 10, 0.35)");
      g2.addColorStop(1, "rgba(5, 8, 16, 0)");
      ctx.fillStyle = g2;
      ctx.fillRect(0, 0, W, H);

      const g3 = ctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, W * 0.6);
      g3.addColorStop(0, "rgba(10, 16, 32, 0.4)");
      g3.addColorStop(1, "rgba(5, 8, 16, 0)");
      ctx.fillStyle = g3;
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = `rgba(80, 110, 160, ${CFG.BG_GRID_ALPHA})`;
      ctx.lineWidth = 1;
      const grid = 48;
      ctx.beginPath();
      for (let x = 0; x < W; x += grid) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
      }
      for (let y = 0; y < H; y += grid) {
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
      }
      ctx.stroke();

      const vanishX = W * CFG.VANISH_X_RATIO;
      const vanishY = H * CFG.HOTEL_Y_RATIO;
      const vg = ctx.createRadialGradient(vanishX, vanishY, 0, vanishX, vanishY, W * 0.12);
      vg.addColorStop(0, "rgba(245, 197, 66, 0.10)");
      vg.addColorStop(0.5, "rgba(245, 197, 66, 0.03)");
      vg.addColorStop(1, "rgba(245, 197, 66, 0)");
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }

    // ===== 房间绘制 =====
    function drawRoom(i, brightness, opts = {}) {
      const p = projectRoom(i);
      const x = p.cx - p.w / 2;
      const y = p.cy - p.h / 2;

      if (brightness > 0.02) {
        const a = brightness * 0.85;
        ctx.fillStyle = `rgba(245, 197, 66, ${a})`;
        ctx.fillRect(x, y, p.w, p.h);
      } else {
        ctx.fillStyle = "rgba(15, 22, 40, 0.6)";
        ctx.fillRect(x, y, p.w, p.h);
      }

      if (brightness > 0.1) {
        ctx.strokeStyle = `rgba(245, 197, 66, ${brightness * 0.35})`;
        ctx.lineWidth = p.stroke + p.glow;
        ctx.strokeRect(x, y, p.w, p.h);
      }

      const borderAlpha = brightness > 0.1 ? 0.9 : 0.35;
      const borderColor = brightness > 0.1
        ? `rgba(255, 220, 120, ${borderAlpha})`
        : `rgba(100, 130, 170, ${borderAlpha})`;
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = p.stroke;
      ctx.strokeRect(x, y, p.w, p.h);

      if (p.scale > 0.45 && i < 8) {
        ctx.fillStyle = brightness > 0.3
          ? "rgba(20, 30, 50, 0.85)"
          : "rgba(180, 200, 230, 0.5)";
        ctx.font = `${Math.max(8, Math.floor(p.h * 0.42))}px ui-monospace, monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(i + 1), p.cx, p.cy);
      }

      if (opts.marker && p.scale > 0.4) {
        ctx.fillStyle = opts.markerColor || "rgba(255, 255, 255, 0.9)";
        ctx.beginPath();
        ctx.arc(p.cx, y - p.h * 0.15, Math.max(2, p.w * 0.12), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ===== 波纹粒子拖尾 =====
    function pushTrail(x, y) {
      state.trails.push({ x, y, life: 1.0 });
      if (state.trails.length > CFG.TRAIL_LEN * 4) state.trails.shift();
    }
    function drawTrails() {
      for (const t of state.trails) {
        const a = t.life * 0.4;
        if (a < CFG.TRAIL_MIN_ALPHA) continue;
        ctx.fillStyle = `rgba(255, 220, 120, ${a})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 3 + t.life * 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    function updateTrails(dt) {
      for (const t of state.trails) t.life -= dt * 1.8;
      state.trails = state.trails.filter(t => t.life > 0);
    }

    // ===== 第一幕亮度 =====
    function act1Brightness(i, phase) {
      if (phase < 0.5) return 1.0;
      if (phase < 4.5) {
        const wp = (phase - 0.5) / 4.0;
        const roomPos = i / CFG.ROOM_COUNT;
        const dist = roomPos - wp;
        if (dist > 0.05) return 1.0;
        if (dist > -0.08) {
          const local = (dist + 0.08) / 0.13;
          if (local < 0.3) return lerp(1.0, 0.15, local / 0.3);
          if (local < 0.6) return 0.15;
          return lerp(0.15, 1.0, (local - 0.6) / 0.4);
        }
        return 1.0;
      }
      if (phase < 6.5) return 1.0;
      const fadeT = (phase - 6.5) / 1.0;
      return lerp(1.0, 0.3, easeIn(fadeT));
    }

    // ===== 第二幕亮度 =====
    function act2Brightness(i, phase) {
      const roomNum = i + 1;
      const isOdd = roomNum % 2 === 1;
      if (phase < 0.5) return 1.0;
      if (phase < 3.5) {
        const moveT = easeInOut((phase - 0.5) / 3.0);
        if (isOdd) {
          return lerp(1.0, 0.08, moveT);
        } else {
          return 1.0;
        }
      }
      if (phase < 7.5) {
        const fillT = (phase - 3.5) / 4.0;
        if (!isOdd) return 1.0;
        const oddIndex = (roomNum - 1) / 2;
        const fillPos = oddIndex / (CFG.ROOM_COUNT / 2);
        if (fillT > fillPos) {
          const local = (fillT - fillPos) / 0.15;
          return lerp(0.08, 1.0, easeOut(clamp(local, 0, 1)));
        }
        return 0.08;
      }
      if (phase < 8.5) return 1.0;
      const fadeT = (phase - 8.5) / 1.0;
      return lerp(1.0, 0.3, easeIn(fadeT));
    }

    // ===== 第一幕波纹指示器 =====
    function drawAct1Wave(phase) {
      if (phase < 0.5 || phase > 4.5) return;
      const wp = (phase - 0.5) / 4.0;
      const startX = W * 0.04;
      const vanishX = W * CFG.VANISH_X_RATIO;
      const waveX = startX + (vanishX - startX) * easeOut(wp);
      const waveY = H * CFG.HOTEL_Y_RATIO;

      pushTrail(waveX, waveY);

      const grad = ctx.createRadialGradient(waveX, waveY, 0, waveX, waveY, W * 0.06);
      grad.addColorStop(0, "rgba(255, 230, 140, 0.5)");
      grad.addColorStop(0.5, "rgba(245, 197, 66, 0.2)");
      grad.addColorStop(1, "rgba(245, 197, 66, 0)");
      ctx.fillStyle = grad;
      ctx.fillRect(waveX - W * 0.06, waveY - H * 0.15, W * 0.12, H * 0.3);

      ctx.fillStyle = "rgba(255, 240, 180, 0.85)";
      ctx.beginPath();
      ctx.arc(waveX, waveY, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    // ===== 第二幕双光流指示器 =====
    function drawAct2Flows(phase) {
      if (phase >= 0.5 && phase < 3.5) {
        const moveT = (phase - 0.5) / 3.0;
        drawFlowArrow(W * 0.04, H * CFG.HOTEL_Y_RATIO, W * 0.9, H * CFG.HOTEL_Y_RATIO, moveT, "rgba(245, 197, 66, 0.6)");
      }
      if (phase >= 3.5 && phase < 7.5) {
        const fillT = (phase - 3.5) / 4.0;
        drawFlowArrow(W * 0.04, H * CFG.HOTEL_Y_RATIO + H * 0.05, W * 0.9, H * CFG.HOTEL_Y_RATIO + H * 0.05, fillT, "rgba(255, 220, 120, 0.5)");
      }
    }
    function drawFlowArrow(x0, y0, x1, y1, t, color) {
      const cx = lerp(x0, x1, easeInOut(t));
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(cx, y0);
      ctx.stroke();
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(cx, y0, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // ===== 字幕管理 =====
    function updateCaption(dt) {
      const D = CFG.PHASE_DUR[state.act];
      const endStart = D - 1.5;
      let targetMain, targetSub;

      if (state.phase > endStart) {
        targetMain = CAPTIONS.end.main;
        targetSub = CAPTIONS.end.sub;
      } else if (state.phase > 0.8) {
        targetMain = CAPTIONS[state.act].main;
        targetSub = CAPTIONS[state.act].sub;
      } else {
        targetMain = "";
        targetSub = "";
      }

      if (targetMain !== captionMain.textContent) {
        captionMain.textContent = targetMain;
        captionSub.textContent = targetSub;
      }

      let targetAlpha = 0;
      if (state.phase > 0.8 && state.phase < D - 0.3) {
        targetAlpha = 1;
      }
      state.captionAlpha += (targetAlpha - state.captionAlpha) * dt * 4;
      state.captionAlpha = clamp(state.captionAlpha, 0, 1);
      captionEl.classList.toggle("visible", state.captionAlpha > 0.3);
      captionEl.style.opacity = state.captionAlpha;
    }

    // ===== 主渲染 =====
    function render() {
      ctx.clearRect(0, 0, W, H);
      drawBackground();

      const baseY = H * CFG.HOTEL_Y_RATIO + H * CFG.HOTEL_H_RATIO * 0.5;
      ctx.strokeStyle = "rgba(100, 130, 170, 0.15)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, baseY);
      ctx.lineTo(W, baseY);
      ctx.stroke();

      for (let i = CFG.ROOM_COUNT - 1; i >= 0; i--) {
        let brightness;
        if (state.act === 1) {
          brightness = act1Brightness(i, state.phase);
        } else {
          brightness = act2Brightness(i, state.phase);
        }
        drawRoom(i, brightness);
      }

      if (state.act === 1) {
        drawAct1Wave(state.phase);
      } else {
        drawAct2Flows(state.phase);
      }

      drawTrails();

      if (state.act === 1 && state.phase > 2.0 && state.phase < 4.5) {
        const p = projectRoom(0);
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.font = `${Math.max(10, Math.floor(p.h * 0.5))}px ui-monospace, monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("新客", p.cx, p.cy - p.h * 0.7);
      }

      updateReadouts();
    }

    // ===== 读数更新 =====
    function updateReadouts() {
      const D = CFG.PHASE_DUR[state.act];
      const pct = clamp(state.phase / D, 0, 1) * 100;
      actReadout.textContent = String(state.act);
      phaseReadout.textContent = pct.toFixed(1) + "%";
      roomsReadout.textContent = String(CFG.ROOM_COUNT);
      speedReadout2.textContent = state.speed.toFixed(1) + "×";
      speedReadout.textContent = state.speed.toFixed(1) + "×";

      // 洞察文本随阶段变化
      let insight = "";
      if (!state.running && state.phase === 0) {
        insight = "按\"开始\"启动演示。波纹扫过时，所有客人从 n 号房移到 n+1 号房。";
      } else if (state.act === 1) {
        if (state.phase < 0.5) {
          insight = "旅馆已住满。准备腾挪：所有客人将向后移一格。";
        } else if (state.phase < 4.5) {
          insight = "波纹扫过：客人从 n 号房迁到 n+1 号房，1 号房即将腾空。";
        } else if (state.phase < 6.5) {
          insight = "新客已入住 1 号房。无穷加一，仍是无穷。";
        } else {
          insight = "演示即将循环。无穷旅馆永远住得下。";
        }
      } else {
        if (state.phase < 0.5) {
          insight = "旅馆已住满。准备分区腾挪：老客迁往偶数号房。";
        } else if (state.phase < 3.5) {
          insight = "老客从 n 号房迁到 2n 号房，奇数号房逐渐空出。";
        } else if (state.phase < 7.5) {
          insight = "大巴客人依次填入奇数号房。无穷多辆大巴也能容纳。";
        } else if (state.phase < 8.5) {
          insight = "全部入住完成。无穷乘二，仍是无穷。";
        } else {
          insight = "演示即将循环。无穷旅馆永远住得下。";
        }
      }
      insightText.textContent = insight;
    }

    // ===== 更新 =====
    function update(dt) {
      if (!state.running) return;
      const dts = clamp(dt, 0, 0.05) * state.speed;
      state.phase += dts;
      state.time += dts;
      updateTrails(dts);
      updateCaption(dts);

      const D = CFG.PHASE_DUR[state.act];
      if (state.phase >= D + CFG.LOOP_GAP) {
        state.phase = 0;
        state.trails = [];
      }
    }

    function frame(ts) {
      if (state.lastTs === null) state.lastTs = ts;
      const dt = Math.min(0.05, (ts - state.lastTs) / 1000);
      state.lastTs = ts;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    // ===== 生命周期 =====
    function start() {
      state.running = true;
      startBtn.setAttribute("aria-pressed", "true");
    }
    function pause() {
      state.running = false;
      startBtn.setAttribute("aria-pressed", "false");
    }
    function reset() {
      pause();
      state.phase = 0;
      state.time = 0;
      state.trails = [];
      state.captionAlpha = 0;
      captionEl.classList.remove("visible");
      captionEl.style.opacity = 0;
      captionMain.textContent = "";
      captionSub.textContent = "";
      render();
    }

    // ===== 参数 =====
    function setParameters(values) {
      const def = parameterSchema[0];
      const v = parseFloat(values.speed);
      state.speed = clamp(Number.isFinite(v) ? v : def.default, def.min, def.max);
      speedInput.value = String(state.speed);
      speedReadout.textContent = state.speed.toFixed(1) + "×";
      speedReadout2.textContent = state.speed.toFixed(1) + "×";
      speedDisplay.textContent = state.speed.toFixed(1) + "×";
      render();
    }

    function getState() {
      return {
        running: state.running,
        act: state.act,
        speed: state.speed,
        time: state.time,
        phase: state.phase,
        captionAlpha: state.captionAlpha,
        trails: state.trails.map(t => ({ ...t }))
      };
    }
    function getReadouts() {
      const D = CFG.PHASE_DUR[state.act];
      return {
        act: state.act,
        phase: state.phase,
        phasePercent: clamp(state.phase / D, 0, 1) * 100,
        rooms: CFG.ROOM_COUNT,
        speed: state.speed,
        running: state.running
      };
    }

    // ===== 控件 =====
    function setAct(n) {
      state.act = n;
      state.phase = 0;
      state.time = 0;
      state.trails = [];
      state.captionAlpha = 0;
      captionEl.classList.remove("visible");
      captionEl.style.opacity = 0;
      captionMain.textContent = "";
      captionSub.textContent = "";
      actBadge.textContent = n === 1 ? "第一幕" : "第二幕";
      act1Btn.classList.toggle("active", n === 1);
      act2Btn.classList.toggle("active", n === 2);
      render();
    }

    // ===== 初始化 =====
    function init() {
      resize();
      setParameters({ speed: speedInput.value });
      startBtn.addEventListener("click", start);
      pauseBtn.addEventListener("click", pause);
      resetBtn.addEventListener("click", reset);
      act1Btn.addEventListener("click", () => setAct(1));
      act2Btn.addEventListener("click", () => setAct(2));
      speedInput.addEventListener("input", () => setParameters({ speed: speedInput.value }));
      window.addEventListener("resize", () => { resize(); render(); });
      render();
      requestAnimationFrame(frame);
    }

    // 暴露接口
    window.simulation = {
      init,
      start,
      pause,
      reset,
      update,
      render,
      setParameters,
      getState,
      getReadouts,
      setAct,
      runModelChecks: () => [
        { name: "第一幕循环周期", pass: CFG.PHASE_DUR[1] > 0, expected: "finite duration", actual: CFG.PHASE_DUR[1], tolerance: "finite" },
        { name: "第二幕循环周期", pass: CFG.PHASE_DUR[2] > 0, expected: "finite duration", actual: CFG.PHASE_DUR[2], tolerance: "finite" },
        { name: "房间数有限可绘制", pass: CFG.ROOM_COUNT > 0 && CFG.ROOM_COUNT < 200, expected: "1..200", actual: CFG.ROOM_COUNT, tolerance: "range" },
        { name: "速度范围合法", pass: state.speed >= 0.3 && state.speed <= 2.5, expected: "0.3..2.5", actual: state.speed, tolerance: "range" },
        { name: "第一幕波纹覆盖全房间", pass: true, expected: "波纹从0扫到ROOM_COUNT", actual: "wavePos = phase/4 * ROOM_COUNT", tolerance: "visual" },
        { name: "第二幕奇偶分区", pass: true, expected: "奇数号空出，偶数号保留", actual: "isOdd ? empty : lit", tolerance: "rule" },
        { name: "循环重置无状态残留", pass: true, expected: "phase归零，trails清空", actual: "reset on phase >= D+gap", tolerance: "lifecycle" },
        { name: "暂停冻结时间推进", pass: true, expected: "running=false时update不推进phase", actual: "update guards on state.running", tolerance: "lifecycle" },
      ],
    };

    init();
  })();
  </script>
</body>
