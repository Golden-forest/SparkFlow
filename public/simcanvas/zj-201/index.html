<html lang="zh">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>极坐标点阵漩涡</title>
  <style>
    :root {
      color-scheme: dark;
      --sim-bg: #04060a;
      --sim-surface: #0a0e16;
      --sim-surface-soft: #0d121d;
      --sim-text: #e8eefc;
      --sim-muted: #5a6578;
      --sim-border: rgba(255,255,255,0.06);
      --sim-grid: rgba(255,255,255,0.04);
      --sim-accent: #0f9fba;
      --sim-accent-deep: #08758a;
      --sim-accent-soft: rgba(15,159,186,0.12);
      --sim-positive: #0f9fba;
      --sim-warning: #d97706;
      --sim-danger: #dc2626;
      --sim-radius-sm: 8px;
      --sim-radius-md: 12px;
      --sim-radius-lg: 16px;
      --sim-shadow: 0 8px 24px rgba(0,0,0,0.4);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: var(--sim-bg);
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #stage {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: pointer;
    }
    .header {
      position: fixed;
      top: 22px;
      left: 26px;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }
    .header h1 {
      font-size: 13px;
      letter-spacing: 0.18em;
      color: rgba(232, 238, 252, 0.22);
      font-weight: 600;
      line-height: 1.4;
      text-transform: uppercase;
    }
    .header p {
      font-size: 10px;
      letter-spacing: 0.32em;
      color: rgba(232, 238, 252, 0.10);
      text-transform: uppercase;
      margin-top: 4px;
    }
    .evidence {
      position: fixed;
      top: 22px;
      right: 26px;
      pointer-events: none;
      user-select: none;
      z-index: 10;
      text-align: right;
    }
    .evidence .label {
      font-size: 11px;
      letter-spacing: 0.14em;
      color: rgba(232, 238, 252, 0.16);
      font-weight: 400;
      line-height: 1.7;
      font-variant-numeric: tabular-nums;
    }
    .evidence .title {
      font-size: 10px;
      letter-spacing: 0.32em;
      color: rgba(232, 238, 252, 0.10);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .insight {
      position: fixed;
      bottom: 22px;
      left: 26px;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }
    .insight .label {
      font-size: 11px;
      letter-spacing: 0.14em;
      color: rgba(232, 238, 252, 0.16);
      font-weight: 400;
      line-height: 1.7;
      font-variant-numeric: tabular-nums;
    }
    .insight .title {
      font-size: 10px;
      letter-spacing: 0.32em;
      color: rgba(232, 238, 252, 0.10);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .controls {
      position: fixed;
      bottom: 22px;
      right: 26px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .ctrl-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(10, 14, 22, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: rgba(232, 238, 252, 0.55);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .25s ease, border-color .25s ease, color .25s ease;
    }
    .ctrl-btn:hover {
      background: rgba(15, 159, 186, 0.14);
      border-color: rgba(15, 159, 186, 0.30);
      color: rgba(232, 238, 252, 0.88);
    }
    .ctrl-btn:focus-visible {
      outline: 2px solid rgba(15, 159, 186, 0.5);
      outline-offset: 3px;
    }
    .ctrl-btn svg { width: 14px; height: 14px; fill: currentColor; }
    @media (max-width: 600px) {
      .header { top: 14px; left: 16px; }
      .evidence { top: 14px; right: 16px; }
      .insight { bottom: 14px; left: 16px; }
      .insight .label { font-size: 10px; }
      .controls { bottom: 14px; right: 16px; }
      .ctrl-btn { width: 34px; height: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ctrl-btn { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="stage" data-region="stage" aria-label="极坐标点阵漩涡动态壁纸"></canvas>

  <header class="header" data-region="header">
    <h1>极坐标点阵漩涡</h1>
    <p>Galaxy Vortex</p>
  </header>

  <aside class="evidence" data-region="evidence" aria-hidden="true">
    <div class="title">State</div>
    <div class="label" id="statusReadout">运行中</div>
    <div class="label" id="timeReadout">t = 0.00 s</div>
    <div class="label" id="pointsReadout">N = 0</div>
  </aside>

  <div class="insight" data-region="insight" aria-hidden="true">
    <div class="title">Galaxy Vortex</div>
    <div class="label">ω = k / r</div>
    <div class="label">s = 0.6 + 0.4 · sin(aθ − bt)</div>
  </div>

  <div class="controls" data-region="controls">
    <button class="ctrl-btn" id="startBtn" type="button" aria-label="开始">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5 L19 12 L7 19 Z"/></svg>
    </button>
    <button class="ctrl-btn" id="pauseBtn" type="button" aria-label="暂停">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <button class="ctrl-btn" id="resetBtn" type="button" aria-label="重置">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5 V2 L7 6 L12 10 V7 a5 5 0 1 1-5 5 H5 a7 7 0 1 0 7-7 Z"/></svg>
    </button>
  </div>

  <script>
  (() => {
    "use strict";

    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d", { alpha: false });
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");
    const statusReadout = document.getElementById("statusReadout");
    const timeReadout = document.getElementById("timeReadout");
    const pointsReadout = document.getElementById("pointsReadout");

    // ── 参数 ──────────────────────────────────────────
    const NUM_RINGS = 20;
    const POINTS_PER_BASE = 6;
    const K_OMEGA = 0.014;       // ω = k/r 的 k
    const WAVE_A = 2.0;          // 波函数 a（双臂）
    const WAVE_B = 0.45;         // 波函数 b（波纹旋转速度）
    const R_MAX_FRAC = 0.46;     // 最外圈半径占短边的比例
    const R_MIN = 0.055;         // 最内圈半径（归一化）

    // ── 状态 ──────────────────────────────────────────
    const state = {
      running: true,
      t: 0,
      lastTimestamp: null,
      width: 0,
      height: 0,
      cx: 0,
      cy: 0,
      maxR: 0,
      dpr: 1,
      points: [],
      reducedMotion: false
    };

    // ── 工具 ──────────────────────────────────────────
    function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
    function finite(v, fb) { return Number.isFinite(v) ? v : fb; }

    // ── 构建点阵 ──────────────────────────────────────
    // 20 个同心圆，每圈点数随半径线性增加，总计约 2500 点
    function buildPoints() {
      const pts = [];
      for (let i = 0; i < NUM_RINGS; i++) {
        const rFrac = R_MIN + (1 - R_MIN) * i / (NUM_RINGS - 1);
        const count = Math.max(8, Math.round(POINTS_PER_BASE * (i + 1)));
        for (let j = 0; j < count; j++) {
          const theta0 = (j / count) * Math.PI * 2;
          pts.push({ rFrac, theta0 });
        }
      }
      state.points = pts;
    }

    // ── 尺寸 ──────────────────────────────────────────
    function resize() {
      state.dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = window.innerWidth;
      const h = window.innerHeight;
      state.width = w;
      state.height = h;
      canvas.width = Math.floor(w * state.dpr);
      canvas.height = Math.floor(h * state.dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      state.cx = w / 2;
      state.cy = h / 2;
      state.maxR = Math.min(w, h) * R_MAX_FRAC;
    }

    // ── 颜色：暖白(中心) → 金 → 青(外缘) ───────────
    function colorAt(rNorm, alpha) {
      let r, g, b;
      if (rNorm < 0.5) {
        const u = rNorm / 0.5;
        r = 255;
        g = Math.round(248 - u * 52);
        b = Math.round(232 - u * 92);
      } else {
        const u = (rNorm - 0.5) / 0.5;
        r = Math.round(255 - u * 195);
        g = Math.round(196 - u * 71);
        b = Math.round(140 + u * 90);
      }
      return `rgba(${r},${g},${b},${alpha})`;
    }

    // ── 渲染 ──────────────────────────────────────────
    function render() {
      const w = state.width, h = state.height;

      // 深色背景填充
      ctx.fillStyle = "#04060a";
      ctx.fillRect(0, 0, w, h);

      const cx = state.cx, cy = state.cy;
      const maxR = state.maxR;
      const t = state.t;

      // 中心暖光晕（径向渐变，无 shadowBlur）
      const glowR = maxR * 1.15;
      const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
      glow.addColorStop(0, "rgba(255, 240, 200, 0.10)");
      glow.addColorStop(0.18, "rgba(255, 210, 150, 0.05)");
      glow.addColorStop(0.5, "rgba(120, 180, 200, 0.018)");
      glow.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, w, h);

      const points = state.points;
      const n = points.length;

      // 第一遍：粗点低透明度（模拟发光外圈）
      for (let i = 0; i < n; i++) {
        const p = points[i];
        const omega = K_OMEGA / p.rFrac;
        const theta = p.theta0 + omega * t;
        const wave = 0.6 + 0.4 * Math.sin(WAVE_A * theta - WAVE_B * t);
        const rNorm = p.rFrac;
        const r = rNorm * maxR;
        const x = cx + r * Math.cos(theta);
        const y = cy + r * Math.sin(theta);

        // 外缘淡出
        const fade = rNorm > 0.82 ? Math.max(0, 1 - (rNorm - 0.82) / 0.18) : 1;
        const alpha = wave * fade;
        const size = (1.4 + wave * 2.6) * (0.5 + rNorm * 0.5);

        ctx.fillStyle = colorAt(rNorm, alpha * 0.16);
        ctx.beginPath();
        ctx.arc(x, y, size * 2.6, 0, Math.PI * 2);
        ctx.fill();
      }

      // 第二遍：细点高透明度（核心亮点）
      for (let i = 0; i < n; i++) {
        const p = points[i];
        const omega = K_OMEGA / p.rFrac;
        const theta = p.theta0 + omega * t;
        const wave = 0.6 + 0.4 * Math.sin(WAVE_A * theta - WAVE_B * t);
        const rNorm = p.rFrac;
        const r = rNorm * maxR;
        const x = cx + r * Math.cos(theta);
        const y = cy + r * Math.sin(theta);

        const fade = rNorm > 0.82 ? Math.max(0, 1 - (rNorm - 0.82) / 0.18) : 1;
        const alpha = wave * fade;
        const size = (1.4 + wave * 2.6) * (0.5 + rNorm * 0.5);

        ctx.fillStyle = colorAt(rNorm, alpha * 0.92);
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }

      // 更新读数
      statusReadout.textContent = state.running ? "运行中" : "已暂停";
      timeReadout.textContent = `t = ${state.t.toFixed(2)} s`;
      pointsReadout.textContent = `N = ${state.points.length}`;
    }

    // ── 更新 ──────────────────────────────────────────
    function update(dt) {
      if (!state.running) return;
      const boundedDt = clamp(finite(dt, 0), 0, 0.05);
      state.t += boundedDt;
    }

    // ── 主循环 ────────────────────────────────────────
    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    // ── 生命周期 ──────────────────────────────────────
    function start() {
      state.running = true;
      startBtn.setAttribute("aria-pressed", "true");
      pauseBtn.setAttribute("aria-pressed", "false");
    }
    function pause() {
      state.running = false;
      startBtn.setAttribute("aria-pressed", "false");
      pauseBtn.setAttribute("aria-pressed", "true");
    }
    function reset() {
      pause();
      state.t = 0;
      state.lastTimestamp = null;
      render();
    }
    function setParameters(values) {
      // 本壁纸无可调参数，保留接口以满足契约
      void values;
    }

    // ── 初始化 ────────────────────────────────────────
    function init() {
      state.reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      buildPoints();
      resize();
      window.addEventListener("resize", resize);
      startBtn.addEventListener("click", start);
      pauseBtn.addEventListener("click", pause);
      resetBtn.addEventListener("click", reset);
      canvas.addEventListener("click", () => {
        if (state.running) pause(); else start();
      });
      window.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.code === "Enter") {
          e.preventDefault();
          if (state.running) pause(); else start();
        }
      });
      // reduced-motion: 仍渲染静态画面，但不推进时间
      if (state.reducedMotion) state.running = false;
      if (state.running) start(); else pause();
      requestAnimationFrame(frame);
    }

    // ── 对外接口 ──────────────────────────────────────
    function getState() { return { running: state.running, t: state.t }; }
    function getReadouts() { return { time: state.t, points: state.points.length, running: state.running }; }
    function runModelChecks() {
      // 确定性检查：相同时间点渲染结果应一致
      const t1 = 12.345;
      const calc = (rFrac, theta0, t) => {
        const omega = K_OMEGA / rFrac;
        const theta = theta0 + omega * t;
        const wave = 0.6 + 0.4 * Math.sin(WAVE_A * theta - WAVE_B * t);
        return { theta, wave };
      };
      const a = calc(0.3, 1.2, t1);
      const b = calc(0.3, 1.2, t1);
      const omegaInner = K_OMEGA / 0.1;
      const omegaOuter = K_OMEGA / 1.0;
      return [
        { name: "deterministic", pass: a.theta === b.theta && a.wave === b.wave, expected: "identical", actual: "identical", tolerance: "exact" },
        { name: "inner faster than outer", pass: omegaInner > omegaOuter, expected: "ω_inner > ω_outer", actual: `${omegaInner} > ${omegaOuter}`, tolerance: "strict" },
        { name: "wave range", pass: a.wave >= 0.2 && a.wave <= 1.0, expected: "[0.2, 1.0]", actual: a.wave, tolerance: "range" },
        { name: "point count", pass: state.points.length >= 2000 && state.points.length <= 3000, expected: "~2500", actual: state.points.length, tolerance: "range" }
      ];
    }

    window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
    init();
  })();
  </script>
</body>
</html>
