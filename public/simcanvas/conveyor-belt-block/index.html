<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>物块在传送带上的运动</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #eef3f8;
      --sim-surface: #ffffff;
      --sim-surface-soft: #f8fafc;
      --sim-text: #172033;
      --sim-muted: #657188;
      --sim-border: #dfe6ef;
      --sim-grid: #e8edf4;
      --sim-accent: #0f9fba;
      --sim-accent-deep: #08758a;
      --sim-accent-soft: #d9f4f7;
      --sim-positive: #0f9fba;
      --sim-warning: #f59e0b;
      --sim-danger: #dc2626;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
        var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.5rem, 2.2vw, 2rem); letter-spacing: -0.035em; line-height: 1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
    .status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 12px; }
    .panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
    #scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); }
    .side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
    .readouts, .model-note { padding: 17px; }
    .readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric { padding: 12px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
    .metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); font-size: 0.72rem; }
    .metric strong { font-size: 1.2rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .model-note { display: grid; align-content: start; gap: 14px; }
    .model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.84rem; }
    .insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; }
    .controls { padding: 11px 12px; display: grid; grid-template-columns: auto repeat(4, minmax(140px, 1fr)); gap: 14px; align-items: center; border-radius: 17px; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
    button:hover { border-color: #c7d2e2; background: #eef3f9; }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
    .control label { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 5px; font-size: 0.78rem; font-weight: 700; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
    @media (max-width: 860px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
      .scene-panel { min-height: 0; }
      #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <!-- SimCanvas stable shell: preserve data-region structure unless the confirmed wireframe changes it. -->
  <div class="app" data-layout="scene-first">
    <header class="header" data-region="header">
      <div>
        <h1>物块在传送带上的运动</h1>
        <p>观察滑动摩擦力如何让物块速度靠拢传送带速度，并理解摩擦力方向由相对速度决定</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">未启动</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head"><h2 id="scene-title">主场景 · 传送带侧视图</h2><span>红色箭头=物块速度 · 青色箭头=传送带速度</span></div>
        <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
          <desc id="scene-desc">倾斜传送带侧视图。蓝色长条为传送带，橙色方块为物块。两个箭头分别表示物块速度（红）和传送带速度（青）。</desc>
          <defs>
            <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"></path></marker>
            <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f9fba"></path></marker>
            <pattern id="beltHatch" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(20)"><line x1="0" y1="0" x2="0" y2="14" stroke="#cdd9e6" stroke-width="2"></line></pattern>
          </defs>

          <!-- 传送带几何由 JS 注入 group#beltGroup -->
          <g id="beltGroup"></g>
          <!-- 物块、箭头由 JS 注入 group#blockGroup -->
          <g id="blockGroup"></g>
          <!-- 角度标注 -->
          <g id="angleGroup"></g>
        </svg>
      </section>

      <aside class="side" data-region="evidence">
        <section class="panel readouts" aria-label="实时数据">
          <div class="readout-grid">
            <div class="metric"><small>物块速度 v (m/s)</small><strong id="velReadout">0.00</strong></div>
            <div class="metric"><small>位移 x (m)</small><strong id="posReadout">0.00</strong></div>
            <div class="metric"><small>加速度 a (m/s²)</small><strong id="accReadout">0.00</strong></div>
            <div class="metric"><small>时间 t (s)</small><strong id="timeReadout">0.00</strong></div>
          </div>
        </section>
        <section class="panel model-note" data-region="insight">
          <div class="panel-head"><h2>阶段判定</h2></div>
          <p id="insight" class="insight">点击"开始"启动模拟。观察红色箭头如何逐渐靠拢青色箭头——这就是摩擦力让物块与传送带同步的过程。</p>
          <p>动力学：沿传送带方向，重力分量 −g·sinθ，摩擦力与相对速度 Δv = v_块 − v_带 反向。共速后摩擦切换为静摩擦，物块随传送带同步运动。</p>
          <canvas id="vtChart" width="560" height="170" style="width:100%;height:auto;border:1px solid rgba(15,159,186,.12);border-radius:10px;background:#fbfdff;margin-top:4px;"></canvas>
          <canvas id="xtChart" width="560" height="170" style="width:100%;height:auto;border:1px solid rgba(15,159,186,.12);border-radius:10px;background:#fbfdff;margin-top:4px;"></canvas>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="仿真控制">
      <div class="actions">
        <button id="startBtn" class="primary" type="button">开始</button>
        <button id="pauseBtn" type="button">暂停</button>
        <button id="resetBtn" type="button">重置</button>
      </div>
      <div class="control">
        <label for="muInput">动摩擦系数 μ <output id="muOutput">0.40</output></label>
        <input id="muInput" type="range" min="0.05" max="0.80" step="0.01" value="0.40">
      </div>
      <div class="control">
        <label for="vBeltInput">传送带速度 v_带 <output id="vBeltOutput">2.0 m/s</output></label>
        <input id="vBeltInput" type="range" min="0" max="5" step="0.1" value="2.0">
      </div>
      <div class="control">
        <label for="thetaInput">传送带倾角 θ <output id="thetaOutput">15°</output></label>
        <input id="thetaInput" type="range" min="0" max="35" step="1" value="15">
      </div>
      <div class="control">
        <label for="v0Input">物块初速度 v₀ <output id="v0Output">0.0 m/s</output></label>
        <input id="v0Input" type="range" min="0" max="5" step="0.1" value="0">
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";

    // ---------- 物理参数与状态 ----------
    const G = 9.8; // m/s²
    const parameterSchema = [
      { key: "mu",     label: "μ",     min: 0.05, max: 0.80, step: 0.01, default: 0.40 },
      { key: "vBelt",  label: "v_带",  min: 0,    max: 5,    step: 0.1,  default: 2.0 },
      { key: "theta",  label: "θ",     min: 0,    max: 35,   step: 1,    default: 15 }, // 度
      { key: "v0",     label: "v₀",    min: 0,    max: 5,    step: 0.1,  default: 0 }
    ];
    const state = {
      running: false,
      t: 0,
      x: 0,           // 沿传送带方向位移（m），起点为底端
      v: 0,           // 物块速度（m/s）
      a: 0,           // 当前加速度（m/s²）
      phase: "idle",  // idle | accelerating | decelerating | synced | sliding-back | stopped
      mu: 0.40,
      vBelt: 2.0,
      thetaDeg: 15,
      v0: 0,
      lastTimestamp: null,
      // 历史采样：{ t, v, x }
      history: []
    };
    // 位移映射到 SVG 坐标时的缩放（动态调整以保持物块可见）
    const view = { pxPerMeter: 28, beltLeftPx: 80, beltRightPx: 680, beltBaseY: 340, beltLenPx: 600 };

    const elements = {
      status: document.querySelector("#status"),
      beltGroup: document.querySelector("#beltGroup"),
      blockGroup: document.querySelector("#blockGroup"),
      angleGroup: document.querySelector("#angleGroup"),
      velReadout: document.querySelector("#velReadout"),
      posReadout: document.querySelector("#posReadout"),
      accReadout: document.querySelector("#accReadout"),
      timeReadout: document.querySelector("#timeReadout"),
      insight: document.querySelector("#insight"),
      vtChart: document.querySelector("#vtChart"),
      xtChart: document.querySelector("#xtChart"),
      muInput: document.querySelector("#muInput"), muOutput: document.querySelector("#muOutput"),
      vBeltInput: document.querySelector("#vBeltInput"), vBeltOutput: document.querySelector("#vBeltOutput"),
      thetaInput: document.querySelector("#thetaInput"), thetaOutput: document.querySelector("#thetaOutput"),
      v0Input: document.querySelector("#v0Input"), v0Output: document.querySelector("#v0Output"),
      startBtn: document.querySelector("#startBtn"),
      pauseBtn: document.querySelector("#pauseBtn"),
      resetBtn: document.querySelector("#resetBtn")
    };
    const vtCtx = elements.vtChart.getContext("2d");
    const xtCtx = elements.xtChart.getContext("2d");

    // ---------- 工具 ----------
    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }
    function deg2rad(d) { return d * Math.PI / 180; }

    // ---------- 物理更新 ----------
    // 沿传送带向上为 +x 方向。重力分量恒为 -g·sinθ（拉物块向下）。
    // 相对速度 Δv = v - vBelt：Δv < 0 表示物块落后于带（摩擦向前 +），Δv > 0 表示物块超前（摩擦向后 -）。
    function computeAcceleration(v, vBelt, mu, thetaRad) {
      const gComp = G * Math.sin(thetaRad);            // 重力分量（沿 -x）
      const fMax  = mu * G * Math.cos(thetaRad);       // 最大滑动摩擦大小
      const dv = v - vBelt;
      if (Math.abs(dv) < 1e-3) {
        // 共速：检查静摩擦能否维持
        // 若重力分量 ≤ 最大静摩擦（取 ≈ fMax），物块随带同步；否则物块开始向下滑动，摩擦方向沿 +x（阻碍下滑）
        if (gComp <= fMax + 1e-6) return 0;
        return fMax - gComp; // 摩擦向上(+fMax)，重力向下(-gComp)
      }
      // 有相对滑动：摩擦方向与 Δv 相反
      const fric = dv < 0 ? fMax : -fMax;
      return fric - gComp;
    }

    function update(dt) {
      if (!state.running) return;
      const boundedDt = clamp(finite(dt, 0), 0, 0.05);
      const thetaRad = deg2rad(state.thetaDeg);
      // 用半隐式 Euler，避免能量漂移过大
      const aPrev = computeAcceleration(state.v, state.vBelt, state.mu, thetaRad);
      // 判定是否在当前步跨过共速（加速度方向反转 → 进入共速或反向滑动）
      const newV = state.v + aPrev * boundedDt;
      const dvOld = state.v - state.vBelt;
      const dvNew = newV - state.vBelt;
      let finalV, finalA;
      if (dvOld * dvNew < 0 && Math.abs(state.vBelt) > 1e-6) {
        // 跨过共速 → 锁定到 vBelt（教学简化：临界点对齐到带速）
        finalV = state.vBelt;
        finalA = computeAcceleration(finalV, state.vBelt, state.mu, thetaRad);
      } else {
        finalV = newV;
        finalA = aPrev;
      }
      // 守护：物块不能滑出传送带底端（x < 0）
      const newX = state.x + finalV * boundedDt;
      if (newX < 0) {
        state.x = 0;
        // 撞底端：速度归零（教学简化），停止演化
        finalV = 0;
        finalA = 0;
        state.running = false;
        state.phase = "stopped";
        elements.status.textContent = "物块滑出底端";
      } else if (newX > 40) {
        // 物块超出可视范围（教学场景上限 40m），停下不再前进
        state.x = 40;
      } else {
        state.x = newX;
      }
      state.v = finite(finalV, 0);
      state.a = finite(finalA, 0);
      state.t += boundedDt;
      // 阶段判定
      const dv = state.v - state.vBelt;
      if (!state.running) {
        // 已由边界停止
      } else if (Math.abs(dv) < 1e-3) {
        // 共速或（带停时）块也停 → 物理上等价，但语义上区分
        state.phase = (Math.abs(state.vBelt) < 1e-3) ? "stopped" : "synced";
      } else if (state.vBelt === 0 && Math.abs(state.v) < 1e-3) {
        state.phase = "stopped";
      } else if (state.v < -1e-3) {
        // 物块沿斜面向下运动（反向下滑）：重力分量超过摩擦上限才会进入此阶段
        state.phase = "sliding-back";
      } else if (dv < 0) {
        state.phase = "accelerating";
      } else {
        state.phase = "decelerating";
      }
      // 历史（每 0.04s 一个点，最多 800 点）
      if (state.history.length === 0 || state.t - state.history[state.history.length - 1].t >= 0.04) {
        state.history.push({ t: state.t, v: state.v, x: state.x });
        if (state.history.length > 800) state.history.shift();
      }
    }

    // ---------- SVG 主场景渲染 ----------
    function renderScene() {
      const thetaRad = deg2rad(state.thetaDeg);
      const cosT = Math.cos(thetaRad), sinT = Math.sin(thetaRad);
      // 传送带在 SVG 中：起点 (beltLeftPx, beltBaseY)，方向向右上 (cosT, -sinT)
      const Lx = view.beltLeftPx, Ly = view.beltBaseY;
      const Rx = Lx + view.beltLenPx * cosT, Ry = Ly - view.beltLenPx * sinT;
      const beltThickness = 14;
      // 带的四个角（向法线下方偏移 beltThickness）
      const nx = sinT, ny = cosT; // 法向（指向下方）
      const belt = [
        `M ${Lx} ${Ly}`,
        `L ${Rx} ${Ry}`,
        `L ${Rx + nx * beltThickness} ${Ry + ny * beltThickness}`,
        `L ${Lx + nx * beltThickness} ${Ly + ny * beltThickness} Z`
      ].join(" ");
      // 两端的辊筒（圆）
      const rollerR = beltThickness + 4;
      const rollerL = `<circle cx="${Lx}" cy="${Ly + beltThickness / 2}" r="${rollerR}" fill="#94a3b8" stroke="#475569" stroke-width="2"></circle>`;
      const rollerR_str = `<circle cx="${Rx}" cy="${Ry + beltThickness / 2}" r="${rollerR}" fill="#94a3b8" stroke="#475569" stroke-width="2"></circle>`;
      // 滚轮上的旋转方向指示（简化为一条短线，随时间旋转表示传送带方向）
      const rotPhase = (state.t * state.vBelt * 1.2) % (Math.PI * 2);
      const drawRotMark = (cx, cy) => {
        const rx = Math.cos(rotPhase) * (rollerR - 4);
        const ry = Math.sin(rotPhase) * (rollerR - 4);
        return `<line x1="${cx}" y1="${cy}" x2="${cx + rx}" y2="${cy + ry}" stroke="#1e293b" stroke-width="2"></line>`;
      };
      // 地面（水平虚线）
      const groundY = Ly + beltThickness + rollerR;
      const ground = `<line x1="20" y1="${groundY}" x2="740" y2="${groundY}" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"></line>`;
      // 物块位置（位移 state.x → 沿带方向距离）
      const blockAlong = state.x * view.pxPerMeter;
      // 将块限制在带可见范围 [0, beltLenPx]
      const alongPx = clamp(blockAlong, 0, view.beltLenPx - 30);
      const bxCenter = Lx + alongPx * cosT;
      const byCenter = Ly - alongPx * sinT;
      // 块在带表面上 14px（即法向反方向偏移 blockHalf + 1）
      const blockSize = 26;
      const surfaceOffset = beltThickness / 2 + blockSize / 2 + 2;
      const bx = bxCenter - nx * surfaceOffset;
      const by = byCenter - ny * surfaceOffset;
      // 块旋转 thetaDeg
      const blockTransform = `translate(${bx} ${by}) rotate(${-state.thetaDeg})`;
      // 速度箭头：长度 = |v| * 25 px，方向沿 +x（rotate -theta）
      const vArrowLen = Math.abs(state.v) * 25;
      const vArrowDir = state.v >= 0 ? 1 : -1;
      const vArrow = vArrowLen > 2
        ? `<line x1="0" y1="-${blockSize / 2 + 8}" x2="${vArrowDir * vArrowLen}" y2="-${blockSize / 2 + 8}" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRed)"></line>`
        : "";
      const vBeltArrowLen = Math.abs(state.vBelt) * 25;
      const vBeltArrowDir = state.vBelt >= 0 ? 1 : -1;
      const vBeltArrow = vBeltArrowLen > 2
        ? `<line x1="0" y1="${blockSize / 2 + 4}" x2="${vBeltArrowDir * vBeltArrowLen}" y2="${blockSize / 2 + 4}" stroke="#0f9fba" stroke-width="3" marker-end="url(#arrowCyan)"></line>`
        : "";
      // 摩擦力方向指示（小箭头，块中心水平方向）
      const fricMag = state.mu * G * Math.cos(thetaRad);
      const dvNow = state.v - state.vBelt;
      let fricArrow = "";
      if (Math.abs(dvNow) > 1e-3 && state.running) {
        const fDir = dvNow < 0 ? 1 : -1;
        const fLen = 14;
        fricArrow = `<line x1="0" y1="0" x2="${fDir * fLen}" y2="0" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowCyan)" opacity="0.85"></line>
          <text x="${fDir * fLen / 2}" y="-6" text-anchor="middle" fill="#80510a" font-size="11" font-weight="700">f</text>`;
      }
      elements.beltGroup.innerHTML = `
        ${ground}
        <path d="${belt}" fill="#cbd5e1" stroke="#64748b" stroke-width="2"></path>
        <path d="${belt}" fill="url(#beltHatch)" opacity="0.45"></path>
        ${rollerL} ${rollerR_str}
        ${drawRotMark(Lx, Ly + beltThickness / 2)}
        ${drawRotMark(Rx, Ry + beltThickness / 2)}
      `;
      elements.blockGroup.innerHTML = `
        <g transform="${blockTransform}">
          <rect x="${-blockSize / 2}" y="${-blockSize / 2}" width="${blockSize}" height="${blockSize}"
                fill="#f59e0b" stroke="#92400e" stroke-width="2" rx="3"></rect>
          <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">m</text>
          ${vArrow}
          ${vBeltArrow}
          ${fricArrow}
        </g>
      `;
      // 角度标注（在底端辊筒附近画一段弧）
      const arcR = 36;
      const angleArc = `<path d="M ${Lx + arcR} ${Ly} A ${arcR} ${arcR} 0 0 0 ${Lx + arcR * cosT} ${Ly - arcR * sinT}"
        fill="none" stroke="#0f9fba" stroke-width="2"></path>
        <text x="${Lx + arcR + 6}" y="${Ly - 6}" fill="#08758a" font-size="13" font-weight="700">θ=${state.thetaDeg}°</text>`;
      elements.angleGroup.innerHTML = `${angleArc}`;
    }

    // ---------- Canvas 图表渲染 ----------
    function drawChart(ctx, canvas, yLabel, getY, color, refValue, refColor, refLabel) {
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);
      const padL = 38, padR = 12, padT = 10, padB = 22;
      const plotW = W - padL - padR, plotH = H - padT - padB;
      // 时间窗口：至少 10s，随 state.t 增长
      const tMax = Math.max(10, state.t + 1);
      // Y 范围
      let yMax = 5;
      for (const s of state.history) yMax = Math.max(yMax, Math.abs(getY(s)) + 0.5);
      if (refValue != null) yMax = Math.max(yMax, Math.abs(refValue) + 0.5);
      yMax = finite(yMax, 5);
      // 网格
      ctx.strokeStyle = "#e8edf4";
      ctx.lineWidth = 1;
      for (let i = 0; i <= 5; i++) {
        const yy = padT + plotH * i / 5;
        ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(W - padR, yy); ctx.stroke();
      }
      for (let i = 0; i <= 5; i++) {
        const xx = padL + plotW * i / 5;
        ctx.beginPath(); ctx.moveTo(xx, padT); ctx.lineTo(xx, padT + plotH); ctx.stroke();
      }
      // 坐标轴
      ctx.strokeStyle = "#9aa7ba"; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + plotH); ctx.lineTo(W - padR, padT + plotH); ctx.stroke();
      // 参考线（传送带速度）
      if (refValue != null) {
        const yRef = padT + plotH * (1 - (refValue + 0) / (2 * yMax));
        // 将 refValue 映射：v_带 恒正，y 轴范围 [0, yMax]
        const yRefPos = padT + plotH * (1 - clamp(refValue / yMax, 0, 1));
        ctx.strokeStyle = refColor;
        ctx.setLineDash([6, 5]); ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.moveTo(padL, yRefPos); ctx.lineTo(W - padR, yRefPos); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = refColor;
        ctx.font = "11px Inter, sans-serif";
        ctx.fillText(refLabel, padL + 4, yRefPos - 3);
      }
      // 历史曲线
      if (state.history.length > 1) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        let started = false;
        for (const s of state.history) {
          const xx = padL + (s.t / tMax) * plotW;
          const yy = padT + plotH * (1 - clamp(getY(s) / yMax, 0, 1));
          if (!started) { ctx.moveTo(xx, yy); started = true; }
          else ctx.lineTo(xx, yy);
        }
        // 当前点
        const xxCur = padL + (state.t / tMax) * plotW;
        const yyCur = padT + plotH * (1 - clamp(getY({ v: state.v, x: state.x }) / yMax, 0, 1));
        ctx.lineTo(xxCur, yyCur);
        ctx.stroke();
        // 当前点高亮
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(xxCur, yyCur, 3.5, 0, Math.PI * 2); ctx.fill();
      }
      // 轴标签
      ctx.fillStyle = "#657188";
      ctx.font = "10px Inter, sans-serif";
      ctx.fillText(yLabel, 4, padT + 8);
      ctx.fillText("t/s", W - padR - 18, H - 6);
      ctx.fillText("0", padL - 8, padT + plotH + 12);
      ctx.fillText(tMax.toFixed(1) + "s", W - padR - 24, padT + plotH + 12);
      ctx.fillText(yMax.toFixed(1), padL - 22, padT + 6);
    }

    function renderCharts() {
      drawChart(vtCtx, elements.vtChart, "v/(m/s)", (s) => s.v, "#dc2626", state.vBelt, "#0f9fba", `v_带=${state.vBelt.toFixed(1)}`);
      drawChart(xtCtx, elements.xtChart, "x/m",  (s) => s.x, "#7c3aed", null, null, null);
    }

    // ---------- 文本读数与 insight ----------
    const phaseText = {
      idle: "未启动 — 调节参数后点击「开始」",
      accelerating: "物块落后于传送带，摩擦力向前（+x），物块正在加速追赶",
      decelerating: "物块超前于传送带，摩擦力向后（−x），物块正在减速靠拢",
      synced: "已共速：物块与传送带同步运动，相对摩擦为 0（或静摩擦平衡重力）",
      "sliding-back": "重力分量超过最大静摩擦，物块向下滑动",
      stopped: "已停止 — 摩擦力使物块减速到静止（传送带停转或带速为 0）"
    };
    function renderReadouts() {
      elements.velReadout.textContent = state.v.toFixed(2);
      elements.posReadout.textContent = state.x.toFixed(2);
      elements.accReadout.textContent = state.a.toFixed(2);
      elements.timeReadout.textContent = state.t.toFixed(2) + " s";
      elements.insight.textContent = phaseText[state.phase] || phaseText.idle;
      elements.muOutput.textContent = state.mu.toFixed(2);
      elements.vBeltOutput.textContent = state.vBelt.toFixed(1) + " m/s";
      elements.thetaOutput.textContent = state.thetaDeg + "°";
      elements.v0Output.textContent = state.v0.toFixed(1) + " m/s";
    }

    function render() {
      renderScene();
      renderCharts();
      renderReadouts();
    }

    // ---------- 生命周期 ----------
    function start() {
      if (state.phase === "stopped") return; // 已滑出底端，需 reset
      state.running = true;
      elements.status.textContent = "运行中";
      elements.startBtn.setAttribute("aria-pressed", "true");
    }
    function pause() {
      state.running = false;
      elements.status.textContent = "已暂停";
      elements.startBtn.setAttribute("aria-pressed", "false");
    }
    function reset() {
      pause();
      state.t = 0;
      state.x = 0;
      state.v = state.v0;        // 初始速度来自参数
      state.a = 0;
      state.phase = "idle";
      state.lastTimestamp = null;
      state.history = [{ t: 0, v: state.v, x: state.x }];
      elements.status.textContent = "未启动";
      render();
    }
    function setParameters(values) {
      const schema = { mu: parameterSchema[0], vBelt: parameterSchema[1], theta: parameterSchema[2], v0: parameterSchema[3] };
      if (values.mu !== undefined) state.mu = clamp(finite(Number(values.mu), schema.mu.default), schema.mu.min, schema.mu.max);
      if (values.vBelt !== undefined) state.vBelt = clamp(finite(Number(values.vBelt), schema.vBelt.default), schema.vBelt.min, schema.vBelt.max);
      if (values.theta !== undefined) state.thetaDeg = clamp(finite(Number(values.theta), schema.theta.default), schema.theta.min, schema.theta.max);
      if (values.v0 !== undefined) state.v0 = clamp(finite(Number(values.v0), schema.v0.default), schema.v0.min, schema.v0.max);
      // 改变 v₀ 只在未启动时影响当前速度
      if (!state.running && state.t === 0) state.v = state.v0;
      // 同步滑块 UI
      elements.muInput.value = String(state.mu);
      elements.vBeltInput.value = String(state.vBelt);
      elements.thetaInput.value = String(state.thetaDeg);
      elements.v0Input.value = String(state.v0);
      render();
    }
    function getState() {
      return { ...state, history: state.history.map((s) => ({ ...s })) };
    }
    function getReadouts() {
      return { v: state.v, x: state.x, a: state.a, t: state.t, phase: state.phase };
    }
    function bindControls() {
      elements.startBtn.addEventListener("click", start);
      elements.pauseBtn.addEventListener("click", pause);
      elements.resetBtn.addEventListener("click", reset);
      elements.muInput.addEventListener("input", () => setParameters({ mu: elements.muInput.value }));
      elements.vBeltInput.addEventListener("input", () => setParameters({ vBelt: elements.vBeltInput.value }));
      elements.thetaInput.addEventListener("input", () => setParameters({ theta: elements.thetaInput.value }));
      elements.v0Input.addEventListener("input", () => setParameters({ v0: elements.v0Input.value }));
    }
    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }
    function init() {
      bindControls();
      setParameters({ mu: 0.40, vBelt: 2.0, theta: 15, v0: 0 });
      reset();
      requestAnimationFrame(frame);
    }

    window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts };
    init();
  })();
  </script>
</body>
</html>
