<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>渗透作用演示</title>
<style>
:root {
  color-scheme: light;
  --sim-bg: #eef3f8;
  --sim-surface: #ffffff;
  --sim-surface-soft: #f8fafc;
  --sim-text: #172033;
  --sim-muted: #657188;
  --sim-border: #dfe6ef;
  --sim-grid: #e8edf4;
  --sim-accent: #0f9fba;
  --sim-accent-deep: #08758a;
  --sim-accent-soft: #d9f4f7;
  --sim-positive: #0f9fba;
  --sim-warning: #f59e0b;
  --sim-danger: #dc2626;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
  --sim-water: #2db4d4;
  --sim-water-deep: #0e7a96;
  --sim-sugar: #f59e0b;
  --sim-sugar-deep: #b45309;
  --sim-membrane: #6b21a8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--sim-text);
  background:
    radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
    radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
    var(--sim-bg);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
.app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
.header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
.header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
.header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
.status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 12px; }
.panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
.scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.panel-head h2 { margin: 0; font-size: 1rem; }
.panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
#scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); }
.side { min-height: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 12px; }
.readouts { padding: 14px 17px; }
.readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.metric { padding: 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
.metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); font-size: 0.78rem; }
.metric strong { font-size: 1.35rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.metric .unit { font-size: 0.7rem; color: var(--sim-muted); font-weight: 600; margin-left: 2px; }
.chart-panel { padding: 14px 17px; display: grid; grid-template-rows: auto minmax(120px, 1fr); gap: 8px; overflow: hidden; }
.chart-panel h3 { margin: 0; font-size: 0.92rem; }
.chart-panel .sub { color: var(--sim-muted); font-size: 0.72rem; }
#chart { width: 100%; height: 100%; min-height: 110px; display: block; }
.model-note { display: grid; align-content: start; gap: 10px; padding: 14px 17px; }
.model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.85rem; }
.insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; line-height: 1.45; font-size: 0.88rem; }
.controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr) minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
.actions { display: flex; gap: 8px; }
button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
button:hover { border-color: #c7d2e2; background: #eef3f9; }
button:active { transform: scale(.97); }
button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
.control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
.control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--sim-muted); }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; }
@media (max-width: 860px) {
  .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
  .main, .app[data-layout] .main { grid-template-columns: 1fr; }
  .controls { grid-template-columns: 1fr; }
  .scene-panel { min-height: 0; }
  #scene { min-height: 0; height: auto; aspect-ratio: 760 / 480; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>渗透作用演示</h1>
      <p>半透膜两侧的水分子迁移 · 拖动蔗糖浓度观察液面变化</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head">
        <h2 id="scene-title">U 形管渗透装置</h2>
        <div class="legend">
          <span class="legend-item"><span class="legend-dot" style="background:var(--sim-water)"></span>水分子（可穿过）</span>
          <span class="legend-item"><span class="legend-dot" style="background:var(--sim-sugar)"></span>蔗糖分子（被阻挡）</span>
          <span class="legend-item"><span class="legend-dot" style="background:var(--sim-membrane)"></span>半透膜</span>
        </div>
      </div>
      <svg id="scene" viewBox="0 0 760 480" role="img" aria-labelledby="scene-title scene-desc">
        <desc id="scene-desc">U形管装置，左侧清水右侧蔗糖溶液，中间半透膜。水分子从左向右净迁移，右侧液面升高。</desc>
        <defs>
          <linearGradient id="waterFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7dd3ec" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#2db4d4" stop-opacity="0.75"/>
          </linearGradient>
          <linearGradient id="sugarFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fde68a" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.7"/>
          </linearGradient>
          <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
            <stop offset="50%" stop-color="#e8f0f8" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5"/>
          </linearGradient>
          <pattern id="membranePattern" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
            <rect width="14" height="14" fill="#7c3aed" fill-opacity="0.12"/>
            <line x1="0" y1="0" x2="14" y2="14" stroke="#6b21a8" stroke-width="1.5" stroke-opacity="0.5"/>
            <line x1="14" y1="0" x2="0" y2="14" stroke="#6b21a8" stroke-width="1.5" stroke-opacity="0.5"/>
          </pattern>
        </defs>

        <!-- 标尺 -->
        <g id="ruler"></g>

        <!-- U形管玻璃外壳 -->
        <path id="tubeGlass" d="" fill="url(#glassFill)" stroke="#9ca3af" stroke-width="2.5" stroke-linejoin="round"/>

        <!-- 左侧水液体 -->
        <path id="leftLiquid" d="" fill="url(#waterFill)"/>
        <!-- 右侧蔗糖溶液 -->
        <path id="rightLiquid" d="" fill="url(#sugarFill)"/>

        <!-- 半透膜 -->
        <rect id="membrane" x="372" y="220" width="16" height="160" fill="url(#membranePattern)" stroke="#6b21a8" stroke-width="1.5" stroke-dasharray="3 2" rx="2"/>
        <text x="380" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="#6b21a8">半透膜</text>

        <!-- 液面线 -->
        <line id="leftSurfaceLine" x1="80" y1="200" x2="372" y2="200" stroke="#0e7a96" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
        <line id="rightSurfaceLine" x1="388" y1="200" x2="680" y2="200" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>

        <!-- 液面标签 -->
        <text id="leftLabel" x="100" y="195" font-size="11" fill="#0e7a96" font-weight="600">清水</text>
        <text id="rightLabel" x="600" y="195" font-size="11" fill="#b45309" font-weight="600">蔗糖溶液</text>

        <!-- 水分子粒子组 -->
        <g id="waterParticles"></g>
        <!-- 蔗糖分子粒子组 -->
        <g id="sugarParticles"></g>

        <!-- 液面高度差标注 -->
        <line id="deltaLine" x1="700" y1="200" x2="700" y2="200" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
        <line id="deltaTickTop" x1="695" y1="200" x2="705" y2="200" stroke="#dc2626" stroke-width="2"/>
        <line id="deltaTickBot" x1="695" y1="200" x2="705" y2="200" stroke="#dc2626" stroke-width="2"/>
        <text id="deltaText" x="712" y="200" font-size="13" font-weight="700" fill="#dc2626">Δh</text>

        <!-- 渗透压标注 -->
        <g id="pressureArrow" opacity="0">
          <line id="pressLine" x1="640" y1="200" x2="640" y2="200" stroke="#08758a" stroke-width="2.5" marker-end="url(#arrowhead)"/>
        </g>
        <defs>
          <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
            <polygon points="0,0 8,4 0,8" fill="#08758a"/>
          </marker>
        </defs>
        <text id="pressureLabel" x="640" y="200" font-size="12" font-weight="700" fill="#08758a" text-anchor="middle" opacity="0">π</text>
      </svg>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel readouts" aria-label="实时读数">
        <div class="readout-grid">
          <div class="metric"><small>液面高度差 Δh</small><strong id="dhReadout">0.0</strong><span class="unit"> cm</span></div>
          <div class="metric"><small>渗透压 π</small><strong id="piReadout">0.00</strong><span class="unit"> atm</span></div>
          <div class="metric"><small>净水流方向</small><strong id="flowReadout" style="font-size:1.1rem">—</strong></div>
          <div class="metric"><small>模拟时间</small><strong id="timeReadout">0.0</strong><span class="unit"> s</span></div>
        </div>
      </section>

      <section class="panel chart-panel">
        <div class="panel-head"><h3>浓度–渗透压关系</h3><span class="sub">π = cRT（当前浓度高亮）</span></div>
        <svg id="chart" viewBox="0 0 320 150" role="img" aria-label="浓度与渗透压关系曲线">
          <g id="chartGrid"></g>
          <line id="chartAxisX" x1="38" y1="120" x2="305" y2="120" stroke="#9aa7ba" stroke-width="1.5"/>
          <line id="chartAxisY" x1="38" y1="15" x2="38" y2="120" stroke="#9aa7ba" stroke-width="1.5"/>
          <text x="295" y="140" font-size="10" fill="#657188">c (mol/L)</text>
          <text x="10" y="20" font-size="10" fill="#657188">π (atm)</text>
          <polyline id="chartCurve" points="" fill="none" stroke="#0f9fba" stroke-width="2.5" stroke-linecap="round"/>
          <circle id="chartMarker" cx="38" cy="120" r="5" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
        </svg>
      </section>

      <section class="panel model-note" data-region="insight">
        <div class="panel-head"><h2>模型说明</h2></div>
        <p id="insight" class="insight">按"开始"启动。水分子从清水侧净流入蔗糖侧，右侧液面升高，直到液柱压差抵消渗透趋势。</p>
        <p>教学模型：π = cRT（R=0.0821, T=298K）。水净流量 J ∝ (π − ρgΔh)，当液柱压差等于渗透压时达到平衡。</p>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="模拟控制">
    <div class="actions">
      <button id="startBtn" class="primary" type="button">开始</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control">
      <label for="concInput">蔗糖浓度 <output id="concOutput">0.50 mol/L</output></label>
      <input id="concInput" type="range" min="0.1" max="1.0" step="0.05" value="0.5">
    </div>
    <div class="control">
      <label for="speedInput">时间倍率 <output id="speedOutput">1.0×</output></label>
      <input id="speedInput" type="range" min="0.25" max="4" step="0.25" value="1">
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  // === 常量 ===
  const R = 0.0821;          // L·atm/(mol·K)
  const T = 298;              // K (25°C)
  const RHO = 1.0;            // g/cm³ 溶液密度近似
  const G = 980;              // cm/s²
  const ATM_TO_CMH2O = 1033; // 1 atm ≈ 1033 cmH₂O
  const TUBE = {
    leftX: 80, rightX: 680, width: 600,
    leftWall: 80, rightWall: 680,
    membraneX: 380, membraneHalf: 8,
    bottomY: 400, topY: 60,
    leftInnerL: 88, leftInnerR: 372,
    rightInnerL: 388, rightInnerR: 672,
    initLevel: 200, maxLevel: 90, minLevel: 250
  };

  // === 参数 schema ===
  const parameterSchema = [
    { key: "concentration", label: "蔗糖浓度", type: "slider", min: 0.1, max: 1.0, step: 0.05, default: 0.5, unit: "mol/L" },
    { key: "speed", label: "时间倍率", type: "slider", min: 0.25, max: 4, step: 0.25, default: 1, unit: "×" }
  ];

  // === 状态 ===
  const state = {
    running: false,
    t: 0,
    concentration: 0.5,
    speed: 1,
    leftLevel: TUBE.initLevel,
    rightLevel: TUBE.initLevel,
    lastTimestamp: null,
    waterParticles: [],
    sugarParticles: [],
    crossingCount: 0,
    returnCount: 0
  };

  const elements = {
    status: document.querySelector("#status"),
    tubeGlass: document.querySelector("#tubeGlass"),
    leftLiquid: document.querySelector("#leftLiquid"),
    rightLiquid: document.querySelector("#rightLiquid"),
    leftSurfaceLine: document.querySelector("#leftSurfaceLine"),
    rightSurfaceLine: document.querySelector("#rightSurfaceLine"),
    leftLabel: document.querySelector("#leftLabel"),
    rightLabel: document.querySelector("#rightLabel"),
    ruler: document.querySelector("#ruler"),
    waterGroup: document.querySelector("#waterParticles"),
    sugarGroup: document.querySelector("#sugarParticles"),
    deltaLine: document.querySelector("#deltaLine"),
    deltaTickTop: document.querySelector("#deltaTickTop"),
    deltaTickBot: document.querySelector("#deltaTickBot"),
    deltaText: document.querySelector("#deltaText"),
    pressureArrow: document.querySelector("#pressureArrow"),
    pressLine: document.querySelector("#pressLine"),
    pressureLabel: document.querySelector("#pressureLabel"),
    dhReadout: document.querySelector("#dhReadout"),
    piReadout: document.querySelector("#piReadout"),
    flowReadout: document.querySelector("#flowReadout"),
    timeReadout: document.querySelector("#timeReadout"),
    concInput: document.querySelector("#concInput"),
    concOutput: document.querySelector("#concOutput"),
    speedInput: document.querySelector("#speedInput"),
    speedOutput: document.querySelector("#speedOutput"),
    startBtn: document.querySelector("#startBtn"),
    pauseBtn: document.querySelector("#pauseBtn"),
    resetBtn: document.querySelector("#resetBtn"),
    insight: document.querySelector("#insight"),
    chartGrid: document.querySelector("#chartGrid"),
    chartCurve: document.querySelector("#chartCurve"),
    chartMarker: document.querySelector("#chartMarker")
  };

  function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
  function finite(v, fallback) { return Number.isFinite(v) ? v : fallback; }

  // === 渗透压计算 ===
  function osmoticPressure(c) { return c * R * T; }

  // === 液柱压差 (atm) ===
  function hydrostaticPressure(dh_cm) {
    return (RHO * G * dh_cm) / ATM_TO_CMH2O;
  }

  // === 平衡液面差 (cm) ===
  function equilibriumDh(c) {
    const pi = osmoticPressure(c);
    return (pi * ATM_TO_CMH2O) / (RHO * G);
  }

  // === 净水流量 (归一化) ===
  function netFlux(c, dh) {
    const pi = osmoticPressure(c);
    const ph = hydrostaticPressure(Math.abs(dh));
    const driving = pi - ph;
    return clamp(driving * 0.8, -1.5, 1.5);
  }

  // === 初始化标尺 ===
  function initRuler() {
    const lines = [];
    for (let i = 0; i <= 16; i++) {
      const y = 80 + i * 20;
      const major = i % 2 === 0;
      const len = major ? 8 : 4;
      lines.push(`<line x1="${TUBE.leftWall - len - 2}" y1="${y}" x2="${TUBE.leftWall - 2}" y2="${y}" stroke="#9aa7ba" stroke-width="${major ? 1.2 : 0.8}"/>`);
      if (major) {
        const cm = (16 - i) * 2;
        lines.push(`<text x="${TUBE.leftWall - 14}" y="${y + 3}" font-size="9" fill="#657188" text-anchor="end">${cm}</text>`);
      }
    }
    lines.push(`<text x="${TUBE.leftWall - 16}" y="72" font-size="9" fill="#657188" text-anchor="end">cm</text>`);
    elements.ruler.innerHTML = lines.join("");
  }

  // === U形管路径 ===
  function buildTubePath() {
    const { leftWall, rightWall, bottomY, topY } = TUBE;
    const r = 60;
    const innerR = 52;
    const outerL = leftWall, outerR = rightWall;
    const innerL = outerL + 8, innerR = outerR - 8;
    const bottom = bottomY;
    const top = topY;
    const d = [
      `M ${outerL} ${top}`,
      `L ${outerL} ${bottom - r}`,
      `Q ${outerL} ${bottom} ${outerL + r} ${bottom}`,
      `L ${outerR - r} ${bottom}`,
      `Q ${outerR} ${bottom} ${outerR} ${bottom - r}`,
      `L ${outerR} ${top}`,
      `L ${innerR} ${top}`,
      `L ${innerR} ${bottom - innerR}`,
      `Q ${innerR} ${bottom - 4} ${innerR - innerR + 4} ${bottom - 4}`,
      `L ${innerL + innerR - 4} ${bottom - 4}`,
      `Q ${innerL} ${bottom - 4} ${innerL} ${bottom - innerR}`,
      `L ${innerL} ${top}`,
      `Z`
    ].join(" ");
    elements.tubeGlass.setAttribute("d", d);
  }

  // === 液体路径 ===
  function buildLiquidPath(side, surfaceY) {
    if (side === "left") {
      const x1 = TUBE.leftInnerL, x2 = TUBE.leftInnerR;
      const bottom = TUBE.bottomY - 4;
      const r = 48;
      return `M ${x1} ${surfaceY} L ${x1} ${bottom - r} Q ${x1} ${bottom} ${x1 + r} ${bottom} L ${x2 - r} ${bottom} Q ${x2} ${bottom} ${x2} ${bottom - r} L ${x2} ${surfaceY} Z`;
    } else {
      const x1 = TUBE.rightInnerL, x2 = TUBE.rightInnerR;
      const bottom = TUBE.bottomY - 4;
      const r = 48;
      return `M ${x1} ${surfaceY} L ${x1} ${bottom - r} Q ${x1} ${bottom} ${x1 + r} ${bottom} L ${x2 - r} ${bottom} Q ${x2} ${bottom} ${x2} ${bottom - r} L ${x2} ${surfaceY} Z`;
    }
  }

  // === 粒子初始化 ===
  function initParticles() {
    state.waterParticles = [];
    state.sugarParticles = [];

    // 左侧水分子
    for (let i = 0; i < 28; i++) {
      state.waterParticles.push({
        side: "left",
        x: TUBE.leftInnerL + 10 + Math.random() * (TUBE.leftInnerR - TUBE.leftInnerL - 20),
        y: TUBE.initLevel + 10 + Math.random() * (TUBE.bottomY - TUBE.initLevel - 30),
        vx: (Math.random() - 0.5) * 30,
        vy: (Math.random() - 0.5) * 30,
        r: 4,
        crossing: false,
        crossT: 0,
        crossFrom: 0,
        crossTo: 0
      });
    }
    // 右侧水分子
    for (let i = 0; i < 18; i++) {
      state.waterParticles.push({
        side: "right",
        x: TUBE.rightInnerL + 10 + Math.random() * (TUBE.rightInnerR - TUBE.rightInnerL - 20),
        y: TUBE.initLevel + 10 + Math.random() * (TUBE.bottomY - TUBE.initLevel - 30),
        vx: (Math.random() - 0.5) * 30,
        vy: (Math.random() - 0.5) * 30,
        r: 4,
        crossing: false,
        crossT: 0,
        crossFrom: 0,
        crossTo: 0
      });
    }

    // 蔗糖分子（右侧）
    const nSugar = Math.max(4, Math.round(state.concentration * 14));
    for (let i = 0; i < nSugar; i++) {
      state.sugarParticles.push({
        x: TUBE.rightInnerL + 15 + Math.random() * (TUBE.rightInnerR - TUBE.rightInnerL - 30),
        y: TUBE.initLevel + 15 + Math.random() * (TUBE.bottomY - TUBE.initLevel - 35),
        vx: (Math.random() - 0.5) * 12,
        vy: (Math.random() - 0.5) * 12,
        r: 7,
        rot: Math.random() * 360,
        vrot: (Math.random() - 0.5) * 60
      });
    }
  }

  // === 更新粒子 ===
  function updateParticles(dt) {
    const flux = state.running ? netFlux(state.concentration, state.rightLevel - state.leftLevel) : 0;
    const leftSurface = state.leftLevel;
    const rightSurface = state.rightLevel;

    // 水分子
    for (const p of state.waterParticles) {
      if (p.crossing) {
        p.crossT += dt;
        const dur = 0.6;
        const u = clamp(p.crossT / dur, 0, 1);
        const ease = u * u * (3 - 2 * u);
        p.x = p.crossFrom + (p.crossTo - p.crossFrom) * ease;
        p.y += Math.sin(u * Math.PI) * 8 * (p.crossTo > p.crossFrom ? 1 : 1);
        if (u >= 1) {
          p.crossing = false;
          p.x = p.crossTo > TUBE.membraneX ? TUBE.rightInnerL + 10 + Math.random() * 20 : TUBE.leftInnerR - 30 + Math.random() * 20;
          p.y = (p.side === "right" ? rightSurface : leftSurface) + 10 + Math.random() * 40;
          p.vx = (Math.random() - 0.5) * 30;
          p.vy = (Math.random() - 0.5) * 30;
        }
        continue;
      }

      // 布朗运动
      p.vx += (Math.random() - 0.5) * 80 * dt;
      p.vy += (Math.random() - 0.5) * 80 * dt;
      p.vx = clamp(p.vx, -50, 50);
      p.vy = clamp(p.vy, -50, 50);

      // 膜附近偏向
      if (p.side === "left" && p.x > TUBE.leftInnerR - 60) {
        const bias = flux * 40;
        p.vx += bias * dt;
      }
      if (p.side === "right" && p.x < TUBE.rightInnerL + 60) {
        const bias = -flux * 40;
        p.vx += bias * dt;
      }

      p.x += p.vx * dt;
      p.y += p.vy * dt;

      // 边界
      const surface = p.side === "left" ? leftSurface : rightSurface;
      const xMin = p.side === "left" ? TUBE.leftInnerL + p.r : TUBE.rightInnerL + p.r;
      const xMax = p.side === "left" ? TUBE.leftInnerR - p.r : TUBE.rightInnerR - p.r;
      const yMin = surface + p.r;
      const yMax = TUBE.bottomY - 20 - p.r;

      if (p.x < xMin) { p.x = xMin; p.vx = Math.abs(p.vx); }
      if (p.x > xMax) { p.x = xMax; p.vx = -Math.abs(p.vx); }
      if (p.y < yMin) { p.y = yMin; p.vy = Math.abs(p.vy); }
      if (p.y > yMax) { p.y = yMax; p.vy = -Math.abs(p.vy); }

      // 穿膜判定
      if (!p.crossing && state.running && Math.abs(flux) > 0.02) {
        if (p.side === "left" && flux > 0 && p.x > TUBE.leftInnerR - 6) {
          if (Math.random() < flux * 0.5 * dt * 8) {
            p.crossing = true;
            p.crossT = 0;
            p.crossFrom = p.x;
            p.crossTo = TUBE.rightInnerL + 6;
            p.side = "right";
            state.crossingCount++;
          }
        } else if (p.side === "right" && flux < 0 && p.x < TUBE.rightInnerL + 6) {
          if (Math.random() < Math.abs(flux) * 0.5 * dt * 8) {
            p.crossing = true;
            p.crossT = 0;
            p.crossFrom = p.x;
            p.crossTo = TUBE.leftInnerR - 6;
            p.side = "left";
            state.returnCount++;
          }
        }
      }
    }

    // 蔗糖分子
    for (const p of state.sugarParticles) {
      p.vx += (Math.random() - 0.5) * 40 * dt;
      p.vy += (Math.random() - 0.5) * 40 * dt;
      p.vx = clamp(p.vx, -25, 25);
      p.vy = clamp(p.vy, -25, 25);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vrot * dt;

      const xMin = TUBE.rightInnerL + p.r;
      const xMax = TUBE.rightInnerR - p.r;
      const yMin = rightSurface + p.r;
      const yMax = TUBE.bottomY - 20 - p.r;

      if (p.x < xMin) { p.x = xMin; p.vx = Math.abs(p.vx); }
      if (p.x > xMax) { p.x = xMax; p.vx = -Math.abs(p.vx); }
      if (p.y < yMin) { p.y = yMin; p.vy = Math.abs(p.vy); }
      if (p.y > yMax) { p.y = yMax; p.vy = -Math.abs(p.vy); }

      // 被膜阻挡
      if (p.x < TUBE.rightInnerL + p.r + 4) {
        p.x = TUBE.rightInnerL + p.r + 4;
        p.vx = Math.abs(p.vx) * 0.5;
      }
    }
  }

  // === 渲染粒子 ===
  function renderParticles() {
    let waterHtml = "";
    for (const p of state.waterParticles) {
      waterHtml += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r}" fill="#2db4d4" fill-opacity="0.85" stroke="#0e7a96" stroke-width="1"/>`;
      waterHtml += `<circle cx="${(p.x - 1).toFixed(1)}" cy="${(p.y - 1).toFixed(1)}" r="${p.r * 0.4}" fill="#ffffff" fill-opacity="0.6"/>`;
    }
    elements.waterGroup.innerHTML = waterHtml;

    let sugarHtml = "";
    for (const p of state.sugarParticles) {
      const cx = p.x, cy = p.y;
      sugarHtml += `<g transform="translate(${cx.toFixed(1)},${cy.toFixed(1)}) rotate(${p.rot.toFixed(0)})">`;
      sugarHtml += `<circle cx="0" cy="0" r="${p.r}" fill="#f59e0b" fill-opacity="0.8" stroke="#b45309" stroke-width="1.2"/>`;
      sugarHtml += `<circle cx="${-p.r * 0.5}" cy="${-p.r * 0.3}" r="${p.r * 0.3}" fill="#fde68a" fill-opacity="0.7"/>`;
      sugarHtml += `</g>`;
    }
    elements.sugarGroup.innerHTML = sugarHtml;
  }

  // === 更新模型 ===
  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05) * state.speed;
    if (boundedDt <= 0) return;

    state.t += boundedDt;

    const dh = state.rightLevel - state.leftLevel;
    const flux = netFlux(state.concentration, dh);

    // 液面变化：flux > 0 表示水净流入右侧
    const levelRate = flux * 12; // px/s
    state.rightLevel -= levelRate * boundedDt;
    state.leftLevel += levelRate * boundedDt * 0.3; // 左侧下降较慢（管径可不同，这里简化为同径）

    // 实际同径管：左侧下降 = 右侧升高
    // 修正：同径U管，体积守恒
    const totalChange = levelRate * boundedDt;
    state.rightLevel = state.rightLevel - (state.rightLevel - TUBE.initLevel) * 0 + state.rightLevel;
    // 重新计算：右升 = 左降
    state.leftLevel = TUBE.initLevel + (TUBE.initLevel - state.rightLevel) * -1;
    // 简化：直接用守恒
    // rightLevel + leftLevel = 2 * initLevel
    const sum = 2 * TUBE.initLevel;
    state.leftLevel = sum - state.rightLevel;

    // 边界
    state.rightLevel = clamp(state.rightLevel, TUBE.maxLevel, TUBE.minLevel);
    state.leftLevel = clamp(state.leftLevel, TUBE.maxLevel, TUBE.minLevel);
    // 再次守恒修正
    if (state.leftLevel + state.rightLevel !== sum) {
      const mid = sum / 2;
      state.leftLevel = clamp(state.leftLevel, TUBE.maxLevel, TUBE.minLevel);
      state.rightLevel = clamp(sum - state.leftLevel, TUBE.maxLevel, TUBE.minLevel);
    }

    updateParticles(boundedDt);
  }

  // === 渲染 ===
  function render() {
    // 液体
    elements.leftLiquid.setAttribute("d", buildLiquidPath("left", state.leftLevel));
    elements.rightLiquid.setAttribute("d", buildLiquidPath("right", state.rightLevel));

    // 液面线
    elements.leftSurfaceLine.setAttribute("y1", state.leftLevel);
    elements.leftSurfaceLine.setAttribute("y2", state.leftLevel);
    elements.rightSurfaceLine.setAttribute("y1", state.rightLevel);
    elements.rightSurfaceLine.setAttribute("y2", state.rightLevel);

    // 标签
    elements.leftLabel.setAttribute("y", state.leftLevel - 5);
    elements.rightLabel.setAttribute("y", state.rightLevel - 5);

    // 高度差标注
    const dhPx = state.rightLevel - state.leftLevel;
    const annotX = 700;
    elements.deltaLine.setAttribute("y1", state.leftLevel);
    elements.deltaLine.setAttribute("y2", state.rightLevel);
    elements.deltaTickTop.setAttribute("y1", state.leftLevel);
    elements.deltaTickTop.setAttribute("y2", state.leftLevel);
    elements.deltaTickBot.setAttribute("y1", state.rightLevel);
    elements.deltaTickBot.setAttribute("y2", state.rightLevel);
    elements.deltaText.setAttribute("y", (state.leftLevel + state.rightLevel) / 2 + 4);
    const dh_cm = dhPx / 10; // 10px = 1cm（标尺每格20px=2cm）
    elements.deltaText.textContent = `Δh = ${dh_cm.toFixed(1)} cm`;

    // 渗透压箭头（右侧液面下方向上）
    const pi = osmoticPressure(state.concentration);
    const arrowLen = clamp(pi * 30, 8, 80);
    const arrowX = 640;
    const arrowYBot = state.rightLevel + 15;
    const arrowYTop = arrowYBot - arrowLen;
    elements.pressLine.setAttribute("x1", arrowX);
    elements.pressLine.setAttribute("y1", arrowYBot);
    elements.pressLine.setAttribute("x2", arrowX);
    elements.pressLine.setAttribute("y2", arrowYTop);
    elements.pressureLabel.setAttribute("x", arrowX);
    elements.pressureLabel.setAttribute("y", arrowYTop - 6);
    elements.pressureLabel.textContent = `π = ${pi.toFixed(2)} atm`;
    const showPressure = state.running || state.t > 0;
    elements.pressureArrow.setAttribute("opacity", showPressure ? "1" : "0");
    elements.pressureLabel.setAttribute("opacity", showPressure ? "1" : "0");

    // 粒子
    renderParticles();

    // 读数
    elements.dhReadout.textContent = dh_cm.toFixed(1);
    elements.piReadout.textContent = pi.toFixed(2);
    elements.timeReadout.textContent = state.t.toFixed(1);

    const flux = netFlux(state.concentration, dhPx);
    if (!state.running && state.t === 0) {
      elements.flowReadout.textContent = "—";
      elements.flowReadout.style.color = "var(--sim-muted)";
    } else if (Math.abs(flux) < 0.005) {
      elements.flowReadout.textContent = "平衡";
      elements.flowReadout.style.color = "var(--sim-positive)";
    } else if (flux > 0) {
      elements.flowReadout.textContent = "→ 右";
      elements.flowReadout.style.color = "var(--sim-water-deep)";
    } else {
      elements.flowReadout.textContent = "← 左";
      elements.flowReadout.style.color = "var(--sim-sugar-deep)";
    }

    // 洞察
    const eqDh = equilibriumDh(state.concentration);
    const eqPx = eqDh * 10;
    const progress = eqPx > 0 ? clamp(dhPx / eqPx, 0, 1) : 0;
    if (!state.running && state.t === 0) {
      elements.insight.textContent = "按\"开始\"启动。水分子从清水侧净流入蔗糖侧，右侧液面升高，直到液柱压差抵消渗透趋势。";
    } else if (progress < 0.3) {
      elements.insight.textContent = "渗透初期：浓度差驱动水分子大量穿过半透膜进入蔗糖侧，右侧液面快速上升。";
    } else if (progress < 0.85) {
      elements.insight.textContent = "进行中：液柱压差逐渐增大，反向回流抵消部分渗透流，净水流减缓。";
    } else if (progress < 0.97) {
      elements.insight.textContent = "接近平衡：净水流趋近于零，液柱压差即将等于渗透压 π。";
    } else {
      elements.insight.textContent = "已达平衡：液柱压差 = 渗透压 π，水分子双向穿越但净流量为零。";
    }

    // 浓度输出
    elements.concOutput.textContent = `${state.concentration.toFixed(2)} mol/L`;
    elements.speedOutput.textContent = `${state.speed.toFixed(2)}×`;

    // 图表
    renderChart();
  }

  // === 图表 ===
  function renderChart() {
    // 网格
    let gridHtml = "";
    for (let i = 1; i <= 4; i++) {
      const y = 120 - i * 25;
      gridHtml += `<line x1="38" y1="${y}" x2="305" y2="${y}" stroke="#e8edf4" stroke-width="1"/>`;
      gridHtml += `<text x="34" y="${y + 3}" font-size="9" fill="#657188" text-anchor="end">${(i * 6).toFixed(0)}</text>`;
    }
    for (let i = 1; i <= 5; i++) {
      const x = 38 + i * 53;
      gridHtml += `<line x1="${x}" y1="15" x2="${x}" y2="120" stroke="#e8edf4" stroke-width="1"/>`;
      gridHtml += `<text x="${x}" y="132" font-size="9" fill="#657188" text-anchor="middle">${(i * 0.2).toFixed(1)}</text>`;
    }
    elements.chartGrid.innerHTML = gridHtml;

    // 曲线 π = cRT, c: 0~1.0, π: 0~24.5
    const pts = [];
    for (let i = 0; i <= 50; i++) {
      const c = (i / 50) * 1.0;
      const pi = c * R * T;
      const x = 38 + (c / 1.0) * 267;
      const y = 120 - (pi / 30) * 105;
      pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
    }
    elements.chartCurve.setAttribute("points", pts.join(" "));

    // 当前点
    const cx = 38 + (state.concentration / 1.0) * 267;
    const cpi = state.concentration * R * T;
    const cy = 120 - (cpi / 30) * 105;
    elements.chartMarker.setAttribute("cx", cx);
    elements.chartMarker.setAttribute("cy", cy);
  }

  // === 生命周期 ===
  function init() {
    initRuler();
    buildTubePath();
    initParticles();
    bindControls();
    setParameters({ concentration: 0.5, speed: 1 });
    reset();
    requestAnimationFrame(frame);
  }

  function start() {
    state.running = true;
    elements.status.textContent = "运行中";
    elements.startBtn.setAttribute("aria-pressed", "true");
  }

  function pause() {
    state.running = false;
    elements.status.textContent = "已暂停";
    elements.startBtn.setAttribute("aria-pressed", "false");
  }

  function reset() {
    pause();
    state.t = 0;
    state.leftLevel = TUBE.initLevel;
    state.rightLevel = TUBE.initLevel;
    state.crossingCount = 0;
    state.returnCount = 0;
    state.lastTimestamp = null;
    initParticles();
    render();
  }

  function setParameters(values) {
    const cDef = parameterSchema[0], sDef = parameterSchema[1];
    state.concentration = clamp(finite(Number(values.concentration), cDef.default), cDef.min, cDef.max);
    state.speed = clamp(finite(Number(values.speed), sDef.default), sDef.min, sDef.max);
    elements.concInput.value = String(state.concentration);
    elements.speedInput.value = String(state.speed);
    // 浓度改变时重新生成蔗糖粒子数量
    if (state.sugarParticles.length !== Math.max(4, Math.round(state.concentration * 14))) {
      initParticles();
    }
    render();
  }

  function getState() {
    return {
      running: state.running,
      t: state.t,
      concentration: state.concentration,
      speed: state.speed,
      leftLevel: state.leftLevel,
      rightLevel: state.rightLevel,
      dh: state.rightLevel - state.leftLevel
    };
  }

  function getReadouts() {
    const dh = (state.rightLevel - state.leftLevel) / 10;
    return {
      dh_cm: dh,
      pi_atm: osmoticPressure(state.concentration),
      time_s: state.t,
      flux: netFlux(state.concentration, state.rightLevel - state.leftLevel)
    };
  }

  function runModelChecks() {
    const checks = [];

    // 1. 渗透压公式 π = cRT
    const pi1 = osmoticPressure(0.5);
    const pi1Expected = 0.5 * 0.0821 * 298;
    checks.push({
      name: "渗透压公式 π=cRT (c=0.5)",
      pass: Math.abs(pi1 - pi1Expected) < 1e-6,
      expected: pi1Expected.toFixed(4),
      actual: pi1.toFixed(4),
      tolerance: 1e-6
    });

    // 2. 浓度单调性
    const piLow = osmoticPressure(0.2);
    const piHigh = osmoticPressure(0.8);
    checks.push({
      name: "渗透压随浓度单调递增",
      pass: piHigh > piLow,
      expected: `${piHigh.toFixed(2)} > ${piLow.toFixed(2)}`,
      actual: `${piHigh.toFixed(2)} > ${piLow.toFixed(2)}`,
      tolerance: "strict"
    });

    // 3. 平衡液面差
    const eqDh = equilibriumDh(0.5);
    const eqExpected = (pi1Expected * ATM_TO_CMH2O) / (RHO * G);
    checks.push({
      name: "平衡液面差 Δh = π/(ρg)",
      pass: Math.abs(eqDh - eqExpected) < 1e-4,
      expected: eqExpected.toFixed(2),
      actual: eqDh.toFixed(2),
      tolerance: 1e-4
    });

    // 4. 平衡时净流量为零
    const fluxAtEq = netFlux(0.5, eqDh * 10);
    checks.push({
      name: "平衡时净流量为零",
      pass: Math.abs(fluxAtEq) < 0.01,
      expected: 0,
      actual: fluxAtEq.toFixed(4),
      tolerance: 0.01
    });

    // 5. 初始净流量为正（流入右侧）
    const fluxInit = netFlux(0.5, 0);
    checks.push({
      name: "初始净流量为正（水流入蔗糖侧）",
      pass: fluxInit > 0,
      expected: "> 0",
      actual: fluxInit.toFixed(4),
      tolerance: "strict"
    });

    // 6. 液柱压差方向
    const ph = hydrostaticPressure(5);
    checks.push({
      name: "液柱压差随Δh增大",
      pass: ph > 0,
      expected: "> 0",
      actual: ph.toFixed(4),
      tolerance: "strict"
    });

    // 7. 体积守恒（左右液面和守恒）
    checks.push({
      name: "体积守恒（leftLevel + rightLevel = 2×initLevel）",
      pass: Math.abs((state.leftLevel + state.rightLevel) - 2 * TUBE.initLevel) < 0.5,
      expected: (2 * TUBE.initLevel).toFixed(1),
      actual: (state.leftLevel + state.rightLevel).toFixed(1),
      tolerance: 0.5
    });

    return checks;
  }

  function bindControls() {
    elements.startBtn.addEventListener("click", start);
    elements.pauseBtn.addEventListener("click", pause);
    elements.resetBtn.addEventListener("click", reset);
    elements.concInput.addEventListener("input", () => setParameters({ concentration: elements.concInput.value, speed: state.speed }));
    elements.speedInput.addEventListener("input", () => setParameters({ concentration: state.concentration, speed: elements.speedInput.value }));
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
