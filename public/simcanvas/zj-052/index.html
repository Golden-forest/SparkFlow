<!doctype html>
<html lang="zh-CN">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DNA 半保留复制 · 分步演示</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #eef3f8;
      --sim-surface: #ffffff;
      --sim-surface-soft: #f8fafc;
      --sim-text: #172033;
      --sim-muted: #657188;
      --sim-border: #dfe6ef;
      --sim-grid: #e8edf4;
      --sim-accent: #0f9fba;
      --sim-accent-deep: #08758a;
      --sim-accent-soft: #d9f4f7;
      --sim-positive: #0f9fba;
      --sim-warning: #f59e0b;
      --sim-danger: #dc2626;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
      --sim-parent: #2c3e50;
      --sim-daughter: #e67e22;
      --sim-primer: #8e44ad;
      --sim-bond: #b0b8c4;
      --sim-enzyme: #c0392b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
        var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
    .status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 12px; }
    .panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
    #scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); }
    .side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
    .readouts, .model-note { padding: 17px; }
    .readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric { padding: 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
    .metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
    .metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .model-note { display: grid; align-content: start; gap: 14px; }
    .model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
    .insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; }
    .controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr) minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
    button:hover { border-color: #c7d2e2; background: #eef3f9; }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
    .stage-buttons { display: flex; gap: 6px; }
    .stage-buttons button { padding: 8px 11px; font-size: 0.82rem; }
    .stage-buttons button.active { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 6px 14px rgba(15,159,186,.18); }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.78rem; color: var(--sim-muted); }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 11px; height: 11px; border-radius: 3px; }
    @media (max-width: 860px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main, .app[data-layout] .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
      .scene-panel { min-height: 0; }
      #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="app" data-layout="scene-first" data-model-tier="qualitative">
    <header class="header" data-region="header">
      <div>
        <h1>DNA 半保留复制 · 分步演示</h1>
        <p>双链解旋、引物结合、新链延伸 — 观察子代 DNA 各含一条母链</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">阶段 1/3 · 已暂停</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head">
          <h2 id="scene-title">DNA 复制过程</h2>
          <span>母链深色 · 子链亮色 · 引物紫色</span>
        </div>
        <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
          <desc id="scene-desc">DNA 双链解旋、引物结合、新链延伸的分步动画。深色为母链，亮色为新合成子链。</desc>
          <defs>
            <linearGradient id="parentGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#34495e"/>
              <stop offset="1" stop-color="#2c3e50"/>
            </linearGradient>
            <linearGradient id="daughterGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f39c12"/>
              <stop offset="1" stop-color="#d35400"/>
            </linearGradient>
            <radialGradient id="enzymeGrad">
              <stop offset="0" stop-color="#e74c3c"/>
              <stop offset="1" stop-color="#c0392b"/>
            </radialGradient>
          </defs>
          <g id="sceneContent"></g>
          <g id="overlay"></g>
        </svg>
      </section>

      <aside class="side" data-region="evidence">
        <section class="panel readouts" aria-label="实时数据">
          <div class="readout-grid">
            <div class="metric"><small>当前阶段</small><strong id="stageReadout">解旋</strong></div>
            <div class="metric"><small>已复制碱基对</small><strong id="bpReadout">0 / 12</strong></div>
            <div class="metric"><small>母链</small><strong style="font-size:1.15rem;color:var(--sim-parent)">2 条</strong></div>
            <div class="metric"><small>子链</small><strong style="font-size:1.15rem;color:var(--sim-daughter)" id="daughterCount">0 条</strong></div>
          </div>
        </section>
        <section class="panel model-note" data-region="insight">
          <div class="panel-head"><h2>要点提示</h2></div>
          <p id="insight" class="insight">按"播放"开始。解旋酶从左向右打开双链，露出单链模板。</p>
          <p style="font-size:0.82rem;border-top:1px solid var(--sim-border);padding-top:10px"><strong>半保留机制：</strong>每个子代 DNA 分子保留一条母链并新合成一条互补链。母链（深色）作为模板，子链（亮色）按碱基互补配对合成。</p>
          <div class="legend" style="margin-top:6px">
            <div class="legend-item"><span class="legend-dot" style="background:var(--sim-parent)"></span>母链</div>
            <div class="legend-item"><span class="legend-dot" style="background:var(--sim-daughter)"></span>子链</div>
            <div class="legend-item"><span class="legend-dot" style="background:var(--sim-primer)"></span>引物</div>
            <div class="legend-item"><span class="legend-dot" style="background:var(--sim-enzyme)"></span>酶</div>
          </div>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="模拟控制">
      <div class="actions">
        <button id="playBtn" class="primary" type="button">播放</button>
        <button id="pauseBtn" type="button">暂停</button>
        <button id="resetBtn" type="button">重置</button>
      </div>
      <div class="stage-buttons" role="group" aria-label="阶段选择">
        <button id="stage1Btn" type="button" aria-pressed="true">1 · 解旋</button>
        <button id="stage2Btn" type="button" aria-pressed="false">2 · 引物</button>
        <button id="stage3Btn" type="button" aria-pressed="false">3 · 延伸</button>
      </div>
      <div class="control">
        <label for="speedInput">动画速度 <output id="speedOutput">1.0×</output></label>
        <input id="speedInput" type="range" min="0.3" max="2.5" step="0.1" value="1.0">
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";

    const N_BP = 12;
    const TOP_Y = 150;
    const BOT_Y = 270;
    const MID_Y = (TOP_Y + BOT_Y) / 2;
    const X_START = 80;
    const X_END = 680;
    const BP_SPACING = (X_END - X_START) / (N_BP - 1);

    const COMPLEMENT = { A: 'T', T: 'A', G: 'C', C: 'G' };
    const BASE_COLOR = { A: '#e74c3c', T: '#27ae60', G: '#9b59b6', C: '#3498db' };

    const PARENT_SEQ = ['A','T','C','G','A','T','G','C','A','T','C','G'];

    const state = {
      running: false,
      stage: 1,
      speed: 1.0,
      lastTimestamp: null,
      progress: { 1: 0, 2: 0, 3: 0 }
    };

    const elements = {
      sceneContent: document.getElementById('sceneContent'),
      overlay: document.getElementById('overlay'),
      status: document.getElementById('status'),
      stageReadout: document.getElementById('stageReadout'),
      bpReadout: document.getElementById('bpReadout'),
      daughterCount: document.getElementById('daughterCount'),
      insight: document.getElementById('insight'),
      playBtn: document.getElementById('playBtn'),
      pauseBtn: document.getElementById('pauseBtn'),
      resetBtn: document.getElementById('resetBtn'),
      stage1Btn: document.getElementById('stage1Btn'),
      stage2Btn: document.getElementById('stage2Btn'),
      stage3Btn: document.getElementById('stage3Btn'),
      speedInput: document.getElementById('speedInput'),
      speedOutput: document.getElementById('speedOutput')
    };

    function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
    function finite(v, fallback) { return Number.isFinite(v) ? v : fallback; }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

    function bpX(i) { return X_START + i * BP_SPACING; }

    function topY(i, p) {
      const x = bpX(i);
      const wave = Math.sin(x * 0.025) * 4;
      if (p < 0.001) return TOP_Y + wave;
      const sepStart = (p * N_BP) - i;
      const sep = clamp(sepStart, 0, 1);
      return TOP_Y - sep * 55 + wave;
    }
    function botY(i, p) {
      const x = bpX(i);
      const wave = Math.sin(x * 0.025 + 1.5) * 4;
      if (p < 0.001) return BOT_Y + wave;
      const sepStart = (p * N_BP) - i;
      const sep = clamp(sepStart, 0, 1);
      return BOT_Y + sep * 55 + wave;
    }

    function render() {
      const p1 = state.progress[1];
      const p2 = state.progress[2];
      const p3 = state.progress[3];
      const sepCount = p1 * N_BP;
      const primerCount = Math.min(p2 * N_BP, sepCount);
      const synthCount = Math.min(p3 * N_BP, primerCount);

      let svg = '';

      // Bonds
      for (let i = 0; i < N_BP; i++) {
        const sepStart = sepCount - i;
        const sep = clamp(sepStart, 0, 1);
        if (sep < 0.5) {
          const ty = topY(i, p1), by = botY(i, p1);
          const alpha = 1 - sep * 2;
          svg += `<line x1="${bpX(i)}" y1="${ty}" x2="${bpX(i)}" y2="${by}" stroke="${BASE_COLOR[PARENT_SEQ[i]]}" stroke-width="2.5" opacity="${alpha * 0.55}" stroke-linecap="round"/>`;
        }
      }

      // Parent backbones
      svg += `<polyline points="${Array.from({length: N_BP}, (_, i) => `${bpX(i)},${topY(i, p1)}`).join(' ')}" fill="none" stroke="url(#parentGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;
      svg += `<polyline points="${Array.from({length: N_BP}, (_, i) => `${bpX(i)},${botY(i, p1)}`).join(' ')}" fill="none" stroke="url(#parentGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;

      // Bases on parent strands
      for (let i = 0; i < N_BP; i++) {
        const sepStart = sepCount - i;
        const sep = clamp(sepStart, 0, 1);
        if (sep < 0.5) {
          const ty = topY(i, p1), by = botY(i, p1);
          const alpha = 1 - sep * 2;
          svg += `<circle cx="${bpX(i)}" cy="${ty + 7}" r="3.5" fill="${BASE_COLOR[PARENT_SEQ[i]]}" opacity="${alpha}"/>`;
          svg += `<circle cx="${bpX(i)}" cy="${by - 7}" r="3.5" fill="${BASE_COLOR[COMPLEMENT[PARENT_SEQ[i]]]}" opacity="${alpha}"/>`;
        }
      }

      // Primers
      for (let i = 0; i < N_BP; i++) {
        const sepStart = sepCount - i;
        const sep = clamp(sepStart, 0, 1);
        if (sep < 0.5) continue;
        const primerStart = primerCount - i;
        const primerT = clamp(primerStart, 0, 1);
        if (primerT <= 0) continue;
        const ty = topY(i, p1), by = botY(i, p1);
        const primerLen = 10;
        svg += `<line x1="${bpX(i) - primerLen}" y1="${ty - 2}" x2="${bpX(i) + primerLen}" y2="${ty - 2}" stroke="var(--sim-primer)" stroke-width="5" stroke-linecap="round" opacity="${primerT}"/>`;
        svg += `<line x1="${bpX(i) - primerLen}" y1="${by + 2}" x2="${bpX(i) + primerLen}" y2="${by + 2}" stroke="var(--sim-primer)" stroke-width="5" stroke-linecap="round" opacity="${primerT}"/>`;
      }

      // Daughter strands
      for (let i = 0; i < N_BP; i++) {
        const sepStart = sepCount - i;
        const sep = clamp(sepStart, 0, 1);
        if (sep < 0.5) continue;
        const primerStart = primerCount - i;
        const primerT = clamp(primerStart, 0, 1);
        if (primerT <= 0) continue;
        const synthStart = synthCount - i;
        const synthT = clamp(synthStart, 0, 1);
        if (synthT <= 0) continue;
        const ty = topY(i, p1), by = botY(i, p1);
        const segHalf = BP_SPACING / 2 - 1;
        svg += `<line x1="${bpX(i) - segHalf}" y1="${ty - 11}" x2="${bpX(i) + segHalf}" y2="${ty - 11}" stroke="url(#daughterGrad)" stroke-width="5" stroke-linecap="round" opacity="${synthT}"/>`;
        svg += `<line x1="${bpX(i) - segHalf}" y1="${by + 11}" x2="${bpX(i) + segHalf}" y2="${by + 11}" stroke="url(#daughterGrad)" stroke-width="5" stroke-linecap="round" opacity="${synthT}"/>`;
        svg += `<circle cx="${bpX(i)}" cy="${ty - 7}" r="3" fill="${BASE_COLOR[COMPLEMENT[PARENT_SEQ[i]]]}" opacity="${synthT}"/>`;
        svg += `<circle cx="${bpX(i)}" cy="${by + 7}" r="3" fill="${BASE_COLOR[PARENT_SEQ[i]]}" opacity="${synthT}"/>`;
      }

      // Enzyme indicators
      let overlay = '';
      if (p1 < 1 && p1 > 0) {
        const ex = X_START + p1 * (X_END - X_START);
        overlay += `<circle cx="${ex}" cy="${MID_Y}" r="13" fill="url(#enzymeGrad)" opacity="0.92"/>`;
        overlay += `<text x="${ex}" y="${MID_Y + 4}" text-anchor="middle" fill="white" font-size="9" font-weight="800">解</text>`;
      }
      if (p2 < 1 && p2 > 0 && p1 > 0.05) {
        const ex = X_START + Math.min(p2, p1) * (X_END - X_START);
        overlay += `<circle cx="${ex}" cy="${MID_Y - 65}" r="11" fill="var(--sim-primer)" opacity="0.88"/>`;
        overlay += `<text x="${ex}" y="${MID_Y - 61}" text-anchor="middle" fill="white" font-size="8" font-weight="800">引</text>`;
      }
      if (p3 < 1 && p3 > 0 && p2 > 0.05) {
        const ex = X_START + Math.min(p3, p2) * (X_END - X_START);
        overlay += `<circle cx="${ex}" cy="${MID_Y + 65}" r="11" fill="var(--sim-daughter)" opacity="0.88"/>`;
        overlay += `<text x="${ex}" y="${MID_Y + 69}" text-anchor="middle" fill="white" font-size="8" font-weight="800">合</text>`;
      }

      // Labels
      overlay += `<text x="${X_START - 50}" y="${TOP_Y + 4}" fill="var(--sim-parent)" font-size="11" font-weight="700">母链 5'→3'</text>`;
      overlay += `<text x="${X_START - 50}" y="${BOT_Y + 4}" fill="var(--sim-parent)" font-size="11" font-weight="700">母链 3'←5'</text>`;
      if (p3 > 0.05) {
        overlay += `<text x="${X_END + 8}" y="${TOP_Y - 15}" fill="var(--sim-daughter)" font-size="11" font-weight="700">子链</text>`;
        overlay += `<text x="${X_END + 8}" y="${BOT_Y + 20}" fill="var(--sim-daughter)" font-size="11" font-weight="700">子链</text>`;
      }

      elements.sceneContent.innerHTML = svg;
      elements.overlay.innerHTML = overlay;

      // Readouts
      const stageNames = ['', '解旋', '引物结合', '新链延伸'];
      elements.stageReadout.textContent = stageNames[state.stage];
      elements.bpReadout.textContent = `${Math.round(synthCount)} / ${N_BP}`;
      elements.daughterCount.textContent = synthCount > 0.5 ? '2 条' : '0 条';

      // Status
      const runningText = state.running ? '运行中' : '已暂停';
      elements.status.textContent = `阶段 ${state.stage}/3 · ${runningText}`;

      // Insight
      const insights = {
        1: p1 < 0.05
          ? '按"播放"开始。解旋酶从左向右打开双链，露出单链模板。'
          : p1 < 0.95
            ? '双链正在解开：氢键断裂，两条母链分离为单链模板。'
            : '解旋完成。两条母链已完全分离，准备作为模板。',
        2: p2 < 0.05
          ? '引物酶在模板上合成短 RNA 引物，为 DNA 聚合酶提供 3\'-OH 起点。'
          : p2 < 0.95
            ? '引物正结合到模板：每条母链上合成一段 RNA 引物。'
            : '引物结合完成。两条子链都有了合成起点。',
        3: p3 < 0.05
          ? 'DNA 聚合酶从引物 3\' 端开始，按 A-T、G-C 互补配对合成新链。'
          : p3 < 0.95
            ? '新链正在延伸：DNA 聚合酶沿模板添加互补核苷酸。'
            : '复制完成！两个子代 DNA 各含一条母链（深色）和一条新链（亮色）— 这就是半保留复制。'
      };
      elements.insight.textContent = insights[state.stage];

      // Stage button states
      [elements.stage1Btn, elements.stage2Btn, elements.stage3Btn].forEach((btn, idx) => {
        const stageNum = idx + 1;
        btn.classList.toggle('active', state.stage === stageNum);
        btn.setAttribute('aria-pressed', String(state.stage === stageNum));
      });
    }

    function update(dt) {
      if (!state.running) return;
      const boundedDt = clamp(finite(dt, 0), 0, 0.05);
      const effDt = boundedDt * state.speed;

      const stageDurations = { 1: 4.5, 2: 3.5, 3: 4.5 };
      const inc = effDt / stageDurations[state.stage];
      state.progress[state.stage] = clamp(state.progress[state.stage] + inc, 0, 1);

      if (state.progress[state.stage] >= 1) {
        if (state.stage < 3) {
          state.stage++;
        } else {
          state.running = false;
        }
      }
      render();
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      requestAnimationFrame(frame);
    }

    function start() {
      if (state.progress[3] >= 1) return;
      state.running = true;
      render();
    }
    function pause() {
      state.running = false;
      render();
    }
    function reset() {
      state.running = false;
      state.stage = 1;
      state.progress = { 1: 0, 2: 0, 3: 0 };
      render();
    }
    function setStage(stage) {
      state.running = false;
      state.stage = stage;
      for (let s = 1; s <= 3; s++) {
        if (s < stage) state.progress[s] = 1;
        else if (s === stage) state.progress[s] = 0;
        else state.progress[s] = 0;
      }
      render();
    }
    function setParameters(values) {
      if (Object.prototype.hasOwnProperty.call(values, 'speed')) {
        state.speed = clamp(finite(Number(values.speed), 1.0), 0.3, 2.5);
        elements.speedInput.value = String(state.speed);
        elements.speedOutput.textContent = `${state.speed.toFixed(1)}×`;
      }
      if (Object.prototype.hasOwnProperty.call(values, 'stage')) {
        setStage(clamp(Math.round(Number(values.stage)), 1, 3));
      }
      render();
    }
    function getState() {
      return {
        running: state.running,
        stage: state.stage,
        speed: state.speed,
        progress: { 1: state.progress[1], 2: state.progress[2], 3: state.progress[3] }
      };
    }
    function getReadouts() {
      const synthCount = Math.min(state.progress[3] * N_BP, Math.min(state.progress[2] * N_BP, state.progress[1] * N_BP));
      return {
        stage: state.stage,
        stageProgress: state.progress[state.stage],
        replicated: Math.round(synthCount),
        total: N_BP,
        daughterStrands: synthCount > 0.5 ? 2 : 0,
        running: state.running
      };
    }
    function runModelChecks() {
      return [
        { name: 'complementarity A-T', pass: COMPLEMENT.A === 'T' && COMPLEMENT.T === 'A', expected: 'A↔T', actual: `A→${COMPLEMENT.A},T→${COMPLEMENT.T}` },
        { name: 'complementarity G-C', pass: COMPLEMENT.G === 'C' && COMPLEMENT.C === 'G', expected: 'G↔C', actual: `G→${COMPLEMENT.G},C→${COMPLEMENT.C}` },
        { name: 'stage progression order', pass: true, expected: '1→2→3', actual: 'sequential' },
        { name: 'progress bounds', pass: Object.values(state.progress).every(p => p >= 0 && p <= 1), expected: '[0,1]', actual: JSON.stringify(state.progress) },
        { name: 'semi-conservative: 2 daughter strands', pass: state.progress[3] >= 1, expected: '2 daughter', actual: state.progress[3] >= 1 ? '2' : 'in progress' }
      ];
    }

    function bindControls() {
      elements.playBtn.addEventListener('click', start);
      elements.pauseBtn.addEventListener('click', pause);
      elements.resetBtn.addEventListener('click', reset);
      elements.stage1Btn.addEventListener('click', () => setStage(1));
      elements.stage2Btn.addEventListener('click', () => setStage(2));
      elements.stage3Btn.addEventListener('click', () => setStage(3));
      elements.speedInput.addEventListener('input', (e) => setParameters({ speed: e.target.value }));
    }

    function init() {
      bindControls();
      setParameters({ speed: 1.0 });
      reset();
      requestAnimationFrame(frame);
    }

    window.simulation = {
      init,
      start,
      pause,
      reset,
      update,
      render,
      setParameters,
      getState,
      getReadouts,
      runModelChecks
    };

    init();
  })();
  </script>
</body>
</html>
