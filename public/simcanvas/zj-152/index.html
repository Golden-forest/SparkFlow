<style>
:root {
  color-scheme: dark;
  --sim-bg: #000000;
  --sim-surface: #0a0a0f;
  --sim-surface-soft: #12121a;
  --sim-text: #ffffff;

  --sim-grid: #181820;
  --sim-accent: #5eead4;
  --sim-accent-deep: #14b8a6;

html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: #000;
  color: var(--sim-text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow: hidden;
}
.app {
  width: 100vw; height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  background: #000;
}
.header {
  padding: 22px 36px 6px;
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 24px; min-height: 0;
  pointer-events: none;
  z-index: 5;
}
.header-left { min-width: 0; }
.header h1 {
  margin: 0 0 6px;
  font-size: clamp(1.5rem, 2.6vw, 2.3rem);
  font-weight: 200; letter-spacing: 0.04em;
  color: rgba(255,255,255,0.92);
  font-family: "Times New Roman", Georgia, serif;

}
.header .expr {
  font-size: clamp(0.85rem, 1.3vw, 1.15rem);

}
.header-right { text-align: right; flex-shrink: 0; }
.header-right .counter {
  font-size: clamp(0.7rem, 1vw, 0.85rem);
  color: rgba(255,255,255,0.32);
  letter-spacing: 0.3em;
  font-variant-numeric: tabular-nums;
}
.header-right .counter strong {
  color: rgba(255,255,255,0.85);

}
.stage {
  position: relative;
  min-height: 0;

}

  width: 100%; height: 100%;

}
.scene-fade {
  opacity: 0;
  transition: opacity 0.7s ease-in-out;
}
.scene-fade.active { opacity: 1; }
.evidence {
  position: absolute;
  top: 18px; right: 28px;
  z-index: 6;

  gap: 10px;
  pointer-events: none;

}
.evidence .metric {
  padding: 10px 14px;

}
.evidence .metric small {

}
.evidence .metric strong {
  font-size: 1.05rem;

}
.insight {
  position: absolute;
  left: 28px; right: 28px;
  bottom: 18px;
  z-index: 6;
  padding: 0;
  border: none;
  background: none;
  color: rgba(255,255,255,0.38);
  font-size: 0.75rem;
  line-height: 1.4;
  pointer-events: none;
  text-align: left;
  white-space: nowrap;

}
@media (max-width: 720px) {
  .header { padding: 14px 18px 4px; }
  .controls { padding: 10px 12px 16px; gap: 4px; }
  .jump-btn { min-width: 28px; height: 28px; font-size: 0.65rem; }
  .play-btn { min-width: 28px; height: 28px; font-size: 0.65rem; padding: 0 10px; }
  .evidence { top: 10px; right: 12px; min-width: 132px; }
  .evidence .metric { padding: 8px 10px; }
  .evidence .metric strong { font-size: 0.92rem; }
  .insight { left: 12px; right: 12px; bottom: 10px; font-size: 0.68rem; }
}
@media (prefers-reduced-motion: reduce) {
  .scene-fade { transition: none; }
  .jump-btn { transition: none; }
  .play-btn { transition: none; }
}

<body>
<div class="app" data-layout="scene-first" data-model-tier="rule-based">
  <header class="header" data-region="header">
    <div class="header-left">
      <h1 id="formulaName">玫瑰线</h1>
      <div class="expr" id="formulaExpr">r = cos(kθ)</div>
    </div>
    <div class="header-right">
      <div class="counter"><strong id="counterNow">01</strong> / 12</div>
    </div>
  </header>

  <section class="stage" data-region="stage" aria-label="公式动画舞台">
    <canvas id="scene" class="scene-fade active" role="img" aria-labelledby="formulaName formulaExpr"></canvas>

    <aside class="evidence" data-region="evidence" aria-label="实时数据">
      <div class="metric">
        <small>当前公式</small>
        <strong id="evidenceName">玫瑰线</strong>
      </div>
      <div class="metric">
        <small>序号</small>
        <strong id="evidenceIndex">01 / 12</strong>
      </div>
      <div class="metric">
        <small>片段进度</small>
        <strong id="evidenceProgress">0%</strong>
      </div>
    </aside>

    <div class="insight" data-region="insight" aria-live="polite">
      <span id="insightText">参数随时间扫描，曲线在连续形变中展现同一族几何对象的演化。</span>
    </div>
  </section>

  <section class="controls" data-region="controls" aria-label="播放与跳转按钮">
    <button id="playBtn" class="play-btn" type="button" aria-pressed="true">暂停</button>
    <button class="jump-btn active" data-idx="0" type="button">1</button>
    <button class="jump-btn" data-idx="1" type="button">2</button>
    <button class="jump-btn" data-idx="2" type="button">3</button>
    <button class="jump-btn" data-idx="3" type="button">4</button>
    <button class="jump-btn" data-idx="4" type="button">5</button>
    <button class="jump-btn" data-idx="5" type="button">6</button>
    <button class="jump-btn" data-idx="6" type="button">7</button>
    <button class="jump-btn" data-idx="7" type="button">8</button>
    <button class="jump-btn" data-idx="8" type="button">9</button>
    <button class="jump-btn" data-idx="9" type="button">10</button>
    <button class="jump-btn" data-idx="10" type="button">11</button>
    <button class="jump-btn" data-idx="11" type="button">12</button>
  </section>
</div>

<script>
(() => {
  "use strict";

  // ============ 固定种子伪随机（用于混沌游戏可复现） ============
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function() {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ============ 12 段公式定义 ============
  const FORMULAS = [
    {
      name: "玫瑰线", expr: "r = cos(kθ)",
      duration: 8.0,
      insight: "k 从 0.5 扫描至 8，花瓣数随参数连续重组，呈现极坐标下的对称演化。",
      draw: (ctx, W, H, t, dur) => {
        const cx = W/2, cy = H/2;
        const R = Math.min(W, H) * 0.36;
        const k = 0.5 + (t/dur) * 7.5;
        const pts = [];
        const steps = 2400;
        const range = (k % 1 === 0) ? Math.PI * 2 : Math.PI * 4;
        for (let i = 0; i <= steps; i++) {
          const th = (i/steps) * range;
          const r = R * Math.cos(k * th);
          pts.push({ x: cx + r*Math.cos(th), y: cy + r*Math.sin(th) });
        }
        drawCurve(ctx, pts, [
          {r:94,g:234,b:212}, {r:129,g:140,b:248}
        ], 2.2, 14);
      }
    },
    {
      name: "利萨如曲线", expr: "x = sin(at), y = sin(bt+φ)",
      duration: 8.0,
      insight: "频率比 a:b 在三组有理比之间过渡，相位差 φ 缓慢旋转，轨迹在闭合与开放间漂移。",
      draw: (ctx, W, H, t, dur) => {
        const cx = W/2, cy = H/2;
        const A = Math.min(W, H) * 0.38;
        const ratios = [[1,2],[3,4],[5,6]];
        const seg = dur / ratios.length;
        const si = Math.min(ratios.length-1, Math.floor(t/seg));
        const local = (t - si*seg) / seg;
        const [a0, b0] = ratios[si];
        const [a1, b1] = ratios[(si+1) % ratios.length];
        const blend = smoothStep(local);
        const a = a0 + (a1-a0)*blend;
        const b = b0 + (b1-b0)*blend;
        const phi = (t/dur) * Math.PI * 0.5;
        const pts = [];
        const steps = 2400;
        for (let i = 0; i <= steps; i++) {
          const u = (i/steps) * Math.PI * 2;
          pts.push({
            x: cx + A * Math.sin(a*u + phi),
            y: cy + A * Math.sin(b*u)
          });
        }
        drawCurve(ctx, pts, [
          {r:244,g:114,b:182}, {r:251,g:191,b:36}
        ], 2.2, 14);
      }
    },
    {
      name: "Gielis 超级公式", expr: "r = [cos(mθ/4)ⁿ² + sin(mθ/4)ⁿ³]⁻¹/ⁿ¹",
      duration: 8.0,
      insight: "m 控制对称瓣数，n₁ 控制边缘锐度，单一公式在星形、花瓣与近圆之间连续形变。",
      draw: (ctx, W, H, t, dur) => {
        const cx = W/2, cy = H/2;
        const R = Math.min(W, H) * 0.38;
        const p = t/dur;
        const m = 2 + p * 10;
        const n1 = 0.3 + (1-p) * 0.6;
        const n2 = n3 = 1.7;
        const pts = [];
        const steps = 1800;
        for (let i = 0; i <= steps; i++) {
          const th = (i/steps) * Math.PI * 2;
          const t1 = Math.pow(Math.abs(Math.cos(m*th/4)), n2);
          const t2 = Math.pow(Math.abs(Math.sin(m*th/4)), n3);
          const sum = t1 + t2;
          const r = sum > 1e-6 ? R / Math.pow(sum, 1/n1) : 0;
          if (Number.isFinite(r) && r < R*4) {
            pts.push({ x: cx + r*Math.cos(th), y: cy + r*Math.sin(th) });
          }
        }
        drawCurve(ctx, pts, [
          {r:250,g:204,b:21}, {r:239,g:68,b:68}
        ], 2.2, 16);
      }
    },
    {
      name: "内/外摆线", expr: "x = (R-r)cosφ + r·cos((R-r)/r · φ)",
      duration: 8.0,
      insight: "k = R/r 取整数时轨迹闭合；k 随时间递增，尖点数与花瓣数同步演化。",
      draw: (ctx, W, H, t, dur) => {
        const cx = W/2, cy = H/2;
        const scale = Math.min(W, H) * 0.4;
        const k = 2 + Math.floor((t/dur) * 7.99);
        const R = 5, r = R / k;
        const pts = [];
        const steps = 2400;
        const range = Math.PI * 2 * k;
        for (let i = 0; i <= steps; i++) {
          const phi = (i/steps) * range;
          const k1 = (R-r)/r;
          pts.push({
            x: cx + scale*0.16 * ((R-r)*Math.cos(phi) + r*Math.cos(k1*phi)),
            y: cy + scale*0.16 * ((R-r)*Math.sin(phi) - r*Math.sin(k1*phi))
          });
        }
        drawCurve(ctx, pts, [
          {r:167,g:243,b:208}, {r:103,g:232,b:249}
        ], 2.0, 12);
      }
    },
    {
      name: "(p,q) 环面结", expr: "x=(2+cos(qt))cos(pt), y=(2+cos(qt))sin(pt)",
      duration: 8.0,
      insight: "p、q 互质时结形最简；参数递增使缠绕数增加，投影在二维上呈现交织花纹。",
      draw: (ctx, W, H, t, dur) => {
        const cx = W/2, cy = H/2;
        const scale = Math.min(W, H) * 0.14;
        const p = 2 + Math.floor((t/dur) * 4.99);
        const q = 2 + Math.floor(((t/dur) * 3.99) + 0.3);
        const pts = [];
        const steps = 2400;
        const range = Math.PI * 2;
        for (let i = 0; i <= steps; i++) {
          const u = (i/steps) * range;
          pts.push({
            x: cx + scale * (2 + Math.cos(q*u)) * Math.cos(p*u),
            y: cy + scale * (2 + Math.cos(q*u)) * Math.sin(p*u)
          });
        }
        drawCurve(ctx, pts, [
          {r:196,g:181,b:253}, {r:129,g:140,b:248}
        ], 2.2, 14);
      }
    },
    {
      name: "伯努利双纽线", expr: "(x²+y²)² = a²(x²-y²)",
      duration: 8.0,
      insight: "a 随时间放大，∞ 形轮廓保持拓扑不变，体现代数约束下的几何缩放。",
      draw: (ctx, W, H, t, dur) => {
        const cx = W/2, cy = H/2;
        const base = Math.min(W, H) * 0.36;
        const p = t/dur;
        const a = base * (0.55 + p * 0.5);
        const pts = [];
        const steps = 1800;
        for (let i = 0; i <= steps; i++) {
          const th = (i/steps) * Math.PI * 2;
          const sinth = Math.sin(th);
          const denom = 1 + sinth*sinth;
          const r = a * Math.sqrt(2) / denom;
          pts.push({
            x: cx + r * Math.cos(th),
            y: cy + r * Math.sin(th) * Math.cos(th)
          });
        }
        drawCurve(ctx, pts, [
          {r:253,g:224,b:71}, {r:250,g:204,b:21}
        ], 2.4, 14);
      }
    },
    {
      name: "心脏线与克莱线", expr: "r = 2a(1-cosθ) / r = a·cos(3θ)",
      duration: 8.0,
      insight: "在心脏线与三瓣克莱线之间线性插值，曲线在两种极坐标图形间连续形变。",
      draw: (ctx, W, H, t, dur) => {
        const cx = W/2, cy = H/2;
        const base = Math.min(W, H) * 0.28;
        const p = t/dur;
        const blend = smoothStep(p);
        const pts = [];
        const steps = 2400;
        for (let i = 0; i <= steps; i++) {
          const th = (i/steps) * Math.PI * 2;
          const rc = base * 2 * (1 - Math.cos(th));
          const rk = base * 1.2 * Math.cos(3*th);
          const r = rc*(1-blend) + rk*blend;
          pts.push({
            x: cx + r*Math.cos(th),
            y: cy + r*Math.sin(th)
          });
        }
        drawCurve(ctx, pts, [
          {r:244,g:114,b:182}, {r:236,g:72,b:153}
        ], 2.4, 14);
      }
    },
    {
      name: "摆线与旋轮线", expr: "x = r(t-sin t), y = r(1-cos t)",
      duration: 8.0,
      insight: "r 与偏置 d 同步增长，轨迹从普通摆线过渡到拉伸/压缩的旋轮线。",
      draw: (ctx, W, H, t, dur) => {
        const cx = W/2, cy = H/2;
        const scale = Math.min(W, H) * 0.07;
        const p = t/dur;
        const r = 1 + p * 2;
        const d = p * 1.5;
        const pts = [];
        const steps = 2400;
        const range = Math.PI * 8;
        for (let i = 0; i <= steps; i++) {
          const u = (i/steps) * range;
          const x = r*u - d*Math.sin(u);
          const y = r - d*Math.cos(u);
          pts.push({
            x: cx + scale * (x - range*r*0.5),
            y: cy - scale * (y - r)
          });
        }
        drawCurve(ctx, pts, [
          {r:103,g:232,b:249}, {r:94,g:234,b:212}
        ], 2.2, 12);
      }
    },
    {
      name: "混沌游戏 · 谢尔宾斯基", expr: "IFS: pₙ = (pₙ₋₁ + vᵢ)/2",
      duration: 8.0,
      insight: "随机迭代收敛到确定性分形；点数随时间累积，自相似三角结构逐步显形。",
      draw: (ctx, W, H, t, dur, rt) => {
        const cx = W/2, cy = H/2;
        const R = Math.min(W, H) * 0.4;
        const verts = [
          { x: cx, y: cy - R },
          { x: cx - R*0.866, y: cy + R*0.5 },
          { x: cx + R*0.866, y: cy + R*0.5 }
        ];
        const totalPts = 6000;
        const curCount = Math.floor(totalPts * (t/dur));
        if (curCount === 0) return;

        // 离屏画布增量合成：用固定种子预计算全部点，每帧只绘制到当前进度
        if (!rt.chaosCache || rt.chaosCacheW !== W || rt.chaosCacheH !== H) {
          rt.chaosCacheW = W; rt.chaosCacheH = H;
          rt.chaosCache = new Array(totalPts);
          const rng = mulberry32(1337);
          let px = cx, py = cy;
          const colors = [
            {r:94,g:234,b:212}, {r:129,g:140,b:248}, {r:244,g:114,b:182}
          ];
          for (let i = 0; i < totalPts; i++) {
            const vi = Math.floor(rng() * 3);
            const v = verts[vi];
            px = (px + v.x) / 2;
            py = (py + v.y) / 2;
            rt.chaosCache[i] = { x: px, y: py, c: colors[vi] };
          }
        }

        ctx.save();
        for (let i = 20; i < curCount; i++) {
          const p = rt.chaosCache[i];
          ctx.fillStyle = `rgba(${p.c.r},${p.c.g},${p.c.b},0.85)`;
          ctx.fillRect(p.x-0.7, p.y-0.7, 1.4, 1.4);
        }
        ctx.restore();
      }
    },
    {
      name: "衰减谐波记录仪", expr: "x = e⁻ᵏᵗsin(ω₁t), y = e⁻ᵏᵗsin(ω₂t)",
      duration: 8.0,
      insight: "两条独立谐波被同一指数包络调制，频率随时间上升，形成衰减的利萨如花纹。",
      draw: (ctx, W, H, t, dur) => {
        const cx = W/2, cy = H/2;
        const A = Math.min(W, H) * 0.4;
        const p = t/dur;
        const omega1 = 3 + p * 4;
        const omega2 = 4 + p * 3;
        const decay = 0.25;
        const pts = [];
        const steps = 3000;
        const range = Math.PI * 6;
        for (let i = 0; i <= steps; i++) {
          const u = (i/steps) * range;
          const env = Math.exp(-decay * u);
          pts.push({
            x: cx + A * env * Math.sin(omega1 * u),
            y: cy + A * env * Math.sin(omega2 * u)
          });
        }
        drawCurve(ctx, pts, [
          {r:251,g:191,b:36}, {r:244,g:114,b:182}
        ], 1.8, 10);
      }
    },
    {
      name: "螺旋与玫瑰复合", expr: "r = R(1+0.3cos(kθ)) + 0.2θ",
      duration: 8.0,
      insight: "玫瑰调制叠加线性螺旋项，花瓣沿径向缓慢外推，形成带波纹的旋臂。",
      draw: (ctx, W, H, t, dur) => {
        const cx = W/2, cy = H/2;
        const base = Math.min(W, H) * 0.3;
        const p = t/dur;
        const k = 2 + p * 6;
        const pts = [];
        const steps = 3000;
        const range = Math.PI * 8;
        for (let i = 0; i <= steps; i++) {
          const th = (i/steps) * range;
          const r = base * (1 + 0.3*Math.cos(k*th)) + 0.2*th*base*0.15;
          pts.push({
            x: cx + r*Math.cos(th),
            y: cy + r*Math.sin(th)
          });
        }
        drawCurve(ctx, pts, [
          {r:94,g:234,b:212}, {r:167,g:243,b:208}
        ], 2.0, 12);
      }
    },
    {
      name: "复函数 w = zᵏ", expr: "w = zᵏ, k 扫描",
      duration: 8.0,
      insight: "极坐标网格被幂映射扭曲：辐角放大 k 倍，色相沿 w 的辐角环绕，k 增大时折叠数增多。",
      draw: (ctx, W, H, t, dur) => {
        const cx = W/2, cy = H/2;
        const R = Math.min(W, H) * 0.42;
        const k = 1 + (t/dur) * 5;
        const sectors = 48;
        const rings = 7;
        ctx.save();
        for (let s = 0; s < sectors; s++) {
          for (let ring = 1; ring <= rings; ring++) {
            const th0 = (s/sectors) * Math.PI * 2;
            const th1 = ((s+1)/sectors) * Math.PI * 2;
            const r0 = (ring-0.5)/rings * R;
            const r1 = (ring+0.5)/rings * R;
            const zr = ring/rings;
            const zth = (th0 + th1)/2;
            const wth = zth * k;
            const hue = ((wth / (Math.PI*2)) * 360 + (t/dur)*120) % 360;
            const sat = 75;
            const light = 50 + (1 - zr) * 15;
            ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, 0.92)`;
            ctx.beginPath();
            ctx.arc(cx, cy, r1, th0, th1);
            ctx.arc(cx, cy, r0, th1, th0, true);
            ctx.closePath();
            ctx.fill();
          }
        }
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 0.5;
        for (let s = 0; s <= sectors; s++) {
          const th = (s/sectors) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx + R*Math.cos(th), cy + R*Math.sin(th));
          ctx.stroke();
        }
        for (let ring = 1; ring <= rings; ring++) {
          const r = (ring-0.5)/rings * R;
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI*2);
          ctx.stroke();
        }
        ctx.restore();
      }
    }
  ];

  // ============ 工具函数 ============
  function smoothStep(x) {
    x = Math.max(0, Math.min(1, x));
    return x*x*(3 - 2*x);
  }
  function lerp(a, b, t) { return a + (b-a)*t; }
  function lerpColor(c1, c2, t) {
    return {
      r: Math.round(lerp(c1.r, c2.r, t)),
      g: Math.round(lerp(c1.g, c2.g, t)),
      b: Math.round(lerp(c1.b, c2.b, t))
    };
  }
  function colorToCss(c, a) {
    return `rgba(${c.r},${c.g},${c.b},${a})`;
  }

  // ============ 曲线绘制（双色渐变 + 双层描边发光 + 拖影） ============
  // 发光改用粗细双层描边模拟：宽淡底层 + 细亮顶层，避免 shadowBlur 性能开销
  function drawCurve(ctx, pts, colors, lineWidth, glow) {
    if (!pts || pts.length < 2) return;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowBlur = 0;

    // 拖影：用更宽更暗的同色描边打底
    if (colors.length >= 2) {
      ctx.strokeStyle = colorToCss(colors[0], 0.06);
      ctx.lineWidth = lineWidth * 5.5;
      strokePath(ctx, pts);
      ctx.strokeStyle = colorToCss(colors[1], 0.06);
      strokePath(ctx, pts);
    }

    // 发光层：宽淡描边模拟外发光
    ctx.strokeStyle = colorToCss(colors[0], 0.14);
    ctx.lineWidth = lineWidth + glow * 0.8;
    strokePath(ctx, pts);
    ctx.strokeStyle = colorToCss(colors[1], 0.14);
    strokePath(ctx, pts);

    // 中间层：中等粗细半透明
    ctx.lineWidth = lineWidth + glow * 0.35;

    // 沿曲线分段渐变
    const n = pts.length;
    for (let i = 0; i < n - 1; i++) {
      const t = i / (n - 1);
      const c = lerpColor(colors[0], colors[1], t);
      ctx.strokeStyle = colorToCss(c, 0.45);
      ctx.beginPath();
      ctx.moveTo(pts[i].x, pts[i].y);
      ctx.lineTo(pts[i+1].x, pts[i+1].y);
      ctx.stroke();
    }

    // 顶层亮线：细而高不透明度
    ctx.lineWidth = lineWidth;
    for (let i = 0; i < n - 1; i++) {
      const t = i / (n - 1);
      const c = lerpColor(colors[0], colors[1], t);
      ctx.strokeStyle = colorToCss(c, 0.92);
      ctx.beginPath();
      ctx.moveTo(pts[i].x, pts[i].y);
      ctx.lineTo(pts[i+1].x, pts[i+1].y);
      ctx.stroke();
    }
    ctx.restore();
  }
  function strokePath(ctx, pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) {
      ctx.lineTo(pts[i].x, pts[i].y);
    }
    ctx.stroke();
  }

  // ============ 状态与运行时 ============
  const state = {
    running: true,
    currentIdx: 0,
    segmentTime: 0,
    lastTimestamp: null,
    fadePhase: 'in',      // 'in' | 'hold' | 'out'
    fadeTime: 0,
    fadeDuration: 0.7,
    manualJump: false,
    // 每段公式的运行时缓存（如混沌游戏的离屏点集）
    rtCache: {}
  };

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const nameEl = document.getElementById('formulaName');
  const exprEl = document.getElementById('formulaExpr');
  const counterEl = document.getElementById('counterNow');
  const evidenceNameEl = document.getElementById('evidenceName');
  const evidenceIndexEl = document.getElementById('evidenceIndex');
  const evidenceProgressEl = document.getElementById('evidenceProgress');
  const insightTextEl = document.getElementById('insightText');
  const sceneEl = canvas;
  const buttons = document.querySelectorAll('.jump-btn');
  const playBtn = document.getElementById('playBtn');

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(1, Math.floor(rect.width));
    const h = Math.max(1, Math.floor(rect.height));
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // 尺寸变化时清空运行时缓存（混沌游戏需按新尺寸重建）
    state.rtCache = {};
  }

  function updateHeader() {
    const f = FORMULAS[state.currentIdx];
    nameEl.textContent = f.name;
    exprEl.textContent = f.expr;
    counterEl.textContent = String(state.currentIdx + 1).padStart(2, '0');
    evidenceNameEl.textContent = f.name;
    evidenceIndexEl.textContent = `${String(state.currentIdx + 1).padStart(2, '0')} / 12`;
    insightTextEl.textContent = f.insight || '参数随时间扫描，曲线在连续形变中展现同一族几何对象的演化。';
    buttons.forEach((b, i) => {
      const active = i === state.currentIdx;
      b.classList.toggle('active', active);
      b.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
  }

  function updateEvidence() {
    const f = FORMULAS[state.currentIdx];
    let progress = 0;
    if (state.fadePhase === 'hold') {
      progress = Math.min(1, state.segmentTime / f.duration);
    } else if (state.fadePhase === 'out') {
      progress = 1;
    }
    evidenceProgressEl.textContent = `${Math.round(progress * 100)}%`;
  }

  function jumpTo(idx) {
    if (idx < 0 || idx >= FORMULAS.length) return;
    if (idx === state.currentIdx) return;
    state.currentIdx = idx;
    state.segmentTime = 0;
    state.fadePhase = 'in';
    state.fadeTime = 0;
    state.manualJump = true;
    state.rtCache = {};
    sceneEl.classList.remove('active');
    setTimeout(() => {
      sceneEl.classList.add('active');
      updateHeader();
    }, 350);
  }

  function advanceSegment() {
    state.currentIdx = (state.currentIdx + 1) % FORMULAS.length;
    state.segmentTime = 0;
    state.fadePhase = 'in';
    state.fadeTime = 0;
    state.manualJump = false;
    state.rtCache = {};
    sceneEl.classList.remove('active');
    setTimeout(() => {
      sceneEl.classList.add('active');
      updateHeader();
    }, 350);
  }

  function update(dt) {
    if (!state.running) return;
    const boundedDt = Math.min(Math.max(dt, 0), 0.05);
    const f = FORMULAS[state.currentIdx];

    if (state.fadePhase === 'in') {
      state.fadeTime += boundedDt;
      if (state.fadeTime >= state.fadeDuration) {
        state.fadePhase = 'hold';
        state.fadeTime = 0;
      }
    } else if (state.fadePhase === 'hold') {
      state.segmentTime += boundedDt;
      if (state.segmentTime >= f.duration) {
        state.fadePhase = 'out';
        state.fadeTime = 0;
      }
    } else if (state.fadePhase === 'out') {
      state.fadeTime += boundedDt;
      if (state.fadeTime >= state.fadeDuration) {
        advanceSegment();
      }
    }
  }

  function render() {
    const rect = canvas.getBoundingClientRect();
    const W = rect.width, H = rect.height;
    if (W < 2 || H < 2) return;

    // 全黑清屏
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // 计算淡入淡出透明度
    let alpha = 1;
    if (state.fadePhase === 'in') {
      alpha = smoothStep(state.fadeTime / state.fadeDuration);
    } else if (state.fadePhase === 'out') {
      alpha = 1 - smoothStep(state.fadeTime / state.fadeDuration);
    }
    alpha = Math.max(0, Math.min(1, alpha));

    ctx.save();
    ctx.globalAlpha = alpha;
    const f = FORMULAS[state.currentIdx];
    const renderT = state.fadePhase === 'in'
      ? state.fadeTime * 0.5
      : state.segmentTime;
    f.draw(ctx, W, H, renderT, f.duration, state.rtCache);
    ctx.restore();

    updateEvidence();
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // ============ 生命周期 ============
  function init() {
    resizeCanvas();
    updateHeader();
    buttons.forEach((b, i) => {
      b.addEventListener('click', () => jumpTo(i));
    });
    playBtn.addEventListener('click', () => {
      if (state.running) {
        pause();
      } else {
        start();
      }
    });
    window.addEventListener('resize', () => {
      resizeCanvas();
    });
    requestAnimationFrame(frame);
  }
  function start() {
    state.running = true;
    state.lastTimestamp = null;
    playBtn.textContent = '暂停';
    playBtn.setAttribute('aria-pressed', 'true');
  }
  function pause() {
    state.running = false;
    playBtn.textContent = '播放';
    playBtn.setAttribute('aria-pressed', 'false');
  }
  function reset() {
    state.currentIdx = 0;
    state.segmentTime = 0;
    state.fadePhase = 'in';
    state.fadeTime = 0;
    state.lastTimestamp = null;
    state.running = true;
    state.rtCache = {};
    playBtn.textContent = '暂停';
    playBtn.setAttribute('aria-pressed', 'true');
    updateHeader();
  }
  function setParameters(values) {
    if (!values || typeof values !== 'object') return;
    if (Object.prototype.hasOwnProperty.call(values, 'running')) {
      const r = Boolean(values.running);
      if (r && !state.running) start();
      else if (!r && state.running) pause();
    }
    if (Object.prototype.hasOwnProperty.call(values, 'index')) {
      const idx = Math.min(Math.max(Math.floor(Number(values.index)) || 0, 0), FORMULAS.length - 1);
      jumpTo(idx);
    }
  }
  function getState() {
    return {
      running: state.running,
      currentIdx: state.currentIdx,
      segmentTime: state.segmentTime,
      fadePhase: state.fadePhase,
      fadeTime: state.fadeTime
    };
  }
  function getReadouts() {
    return {
      formula: FORMULAS[state.currentIdx].name,
      index: state.currentIdx + 1,
      total: FORMULAS.length,
      segmentTime: state.segmentTime,
      duration: FORMULAS[state.currentIdx].duration
    };
  }
  function runModelChecks() {
    return [
      { name: "12 formulas defined", pass: FORMULAS.length === 12, expected: 12, actual: FORMULAS.length, tolerance: "exact" },
      { name: "all formulas have draw fn", pass: FORMULAS.every(f => typeof f.draw === 'function'), expected: "function", actual: "function", tolerance: "type" },
      { name: "all formulas have duration > 0", pass: FORMULAS.every(f => f.duration > 0), expected: ">0", actual: FORMULAS.map(f=>f.duration).join(','), tolerance: "positive" },
      { name: "index cycles 0..11", pass: ((() => { let i=0; for(let n=0;n<24;n++){ i=(i+1)%12; } return i===0; })()), expected: 0, actual: 0, tolerance: "exact" }
    ];
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
