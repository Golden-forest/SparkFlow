<!doctype html>
<html lang="zh-CN">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地球内部结构的推断</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #eef3f8;
      --sim-surface: #ffffff;
      --sim-surface-soft: #f8fafc;
      --sim-text: #172033;
      --sim-muted: #657188;
      --sim-border: #dfe6ef;
      --sim-grid: #e8edf4;
      --sim-accent: #0f9fba;
      --sim-accent-deep: #08758a;
      --sim-accent-soft: #d9f4f7;
      --sim-positive: #0f9fba;
      --sim-warning: #f59e0b;
      --sim-danger: #dc2626;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
      --sim-pwave: #2563eb;
      --sim-swave: #dc2626;
      --sim-shadow-zone: #b45309;
      --sim-continent: #15803d;
      --sim-mountain: #7c2d12;
      --sim-ocean: #0e7490;
      --sim-mantle: #c2410c;
      --sim-outer-core: #fbbf24;
      --sim-inner-core: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
        var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
    .status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
    .main { min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
    .scene-svg { width: 100%; height: 100%; min-height: 320px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; }
    .scene-left { background: linear-gradient(145deg, #eaf6fb 0%, #d9ecf5 58%, #e8f4e8 100%); }
    .scene-right { background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0f0f1e 100%); }
    .timeline-wrap { padding: 8px 4px 2px; }
    .timeline-label { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--sim-muted); margin-bottom: 4px; }
    .timeline { width: 100%; accent-color: var(--sim-accent); cursor: pointer; }
    .era-label { text-align: center; font-size: 0.8rem; font-weight: 700; color: var(--sim-accent-deep); margin-top: 4px; }
    .side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
    .readouts, .model-note { padding: 17px; }
    .readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric { padding: 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
    .metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
    .metric strong { font-size: 1.35rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .model-note { display: grid; align-content: start; gap: 14px; }
    .model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
    .insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; line-height: 1.5; }
    .controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr) auto; gap: 16px; align-items: center; border-radius: 17px; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
    button:hover { border-color: #c7d2e2; background: #eef3f9; }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
    button.danger { border-color: var(--sim-danger); color: #fff; background: linear-gradient(135deg, #b91c1c, var(--sim-danger)); box-shadow: 0 8px 18px rgba(220,38,38,.20); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
    .control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
    .legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.72rem; margin-top: 6px; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    @media (max-width: 860px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main, .app[data-layout] .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
      .scene-panel { min-height: 0; }
      .scene-svg { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="app" data-layout="comparison" data-model-tier="analytic">
    <header class="header" data-region="header">
      <div>
        <h1>地球内部结构的推断</h1>
        <p>板块运动产生地震 · 地震波传播揭示内部结构</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
    </header>

    <main class="main">
      <!-- 左侧：板块运动与大陆漂移 -->
      <section class="panel scene-panel" data-region="stage" aria-labelledby="left-title">
        <div class="panel-head">
          <h2 id="left-title">板块运动与大陆漂移</h2>
          <span>2亿年前 → 现在</span>
        </div>
        <svg id="sceneLeft" class="scene-svg scene-left" viewBox="0 0 760 420" role="img" aria-labelledby="left-title left-desc">
          <desc id="left-desc">地球板块横截面，展示大陆漂移、碰撞造山与洋脊扩张。</desc>
          <defs>
            <radialGradient id="oceanGrad" cx="50%" cy="50%">
              <stop offset="0%" stop-color="#67c5de"/>
              <stop offset="100%" stop-color="#2a7a92"/>
            </radialGradient>
          </defs>
          <!-- 海洋背景 -->
          <rect x="0" y="280" width="760" height="100" fill="url(#oceanGrad)" opacity="0.35"/>
          <!-- 洋脊 -->
          <g id="ridgeGroup"></g>
          <!-- 大陆块 -->
          <g id="continentGroup"></g>
          <!-- 造山带 -->
          <g id="mountainGroup"></g>
          <!-- 扩张箭头 -->
          <g id="spreadingArrows"></g>
          <!-- 标签 -->
          <g id="labelGroup"></g>
        </svg>
        <div class="timeline-wrap">
          <div class="timeline-label"><span>2亿年前</span><span id="eraMidLabel">1.5亿年前</span><span>现在</span></div>
          <input id="timeline" class="timeline" type="range" min="0" max="200" step="1" value="0" aria-label="地质年代时间轴"/>
          <div class="era-label" id="eraLabel">三叠纪 · 2亿年前</div>
        </div>
      </section>

      <!-- 右侧：地震波传播 -->
      <section class="panel scene-panel" data-region="stage" aria-labelledby="right-title">
        <div class="panel-head">
          <h2 id="right-title">地震波传播与阴影区</h2>
          <span>点击地球触发地震</span>
        </div>
        <svg id="sceneRight" class="scene-svg scene-right" viewBox="0 0 760 420" role="img" aria-labelledby="right-title right-desc">
          <desc id="right-desc">地球横截面，展示P波穿透外核、S波止于核幔边界及阴影区。</desc>
          <defs>
            <radialGradient id="mantleGrad" cx="50%" cy="50%">
              <stop offset="55%" stop-color="#c2410c"/>
              <stop offset="100%" stop-color="#7c2d12"/>
            </radialGradient>
            <radialGradient id="outerCoreGrad" cx="50%" cy="50%">
              <stop offset="0%" stop-color="#fde68a"/>
              <stop offset="100%" stop-color="#f59e0b"/>
            </radialGradient>
            <radialGradient id="innerCoreGrad" cx="50%" cy="50%">
              <stop offset="0%" stop-color="#fca5a5"/>
              <stop offset="100%" stop-color="#dc2626"/>
            </radialGradient>
          </defs>
          <!-- 地球分层 -->
          <circle cx="380" cy="210" r="180" fill="url(#mantleGrad)" stroke="#57534e" stroke-width="1.5"/>
          <circle cx="380" cy="210" r="100" fill="url(#outerCoreGrad)" stroke="#b45309" stroke-width="1.5"/>
          <circle cx="380" cy="210" r="45" fill="url(#innerCoreGrad)" stroke="#991b1b" stroke-width="1.5"/>
          <!-- 核幔边界标注 -->
          <circle cx="380" cy="210" r="100" fill="none" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6"/>
          <!-- 阴影区 -->
          <g id="shadowZoneGroup"></g>
          <!-- 波前 -->
          <g id="wavefrontGroup"></g>
          <!-- 波路径 -->
          <g id="wavePathGroup"></g>
          <!-- 震源 -->
          <g id="epicenterGroup"></g>
          <!-- 标签 -->
          <text x="380" y="210" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="700" pointer-events="none">内核</text>
          <text x="380" y="135" text-anchor="middle" fill="#7c2d12" font-size="11" font-weight="700" pointer-events="none">外核(液态)</text>
          <text x="380" y="55" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="700" pointer-events="none">地幔</text>
        </svg>
        <div class="legend">
          <span class="legend-item"><span class="legend-swatch" style="background:var(--sim-pwave)"></span>P波(纵波)</span>
          <span class="legend-item"><span class="legend-swatch" style="background:var(--sim-swave)"></span>S波(横波)</span>
          <span class="legend-item"><span class="legend-swatch" style="background:var(--sim-shadow-zone);opacity:0.4"></span>阴影区</span>
        </div>
      </section>
    </main>

    <aside class="side" data-region="evidence">
      <section class="panel readouts" aria-label="实时数据">
        <div class="readout-grid">
          <div class="metric"><small>当前年代</small><strong id="eraReadout">2亿年前</strong></div>
          <div class="metric"><small>大陆位置</small><strong id="positionReadout">初始</strong></div>
          <div class="metric"><small>P波到达</small><strong id="pwaveReadout">—</strong></div>
          <div class="metric"><small>S波到达</small><strong id="swaveReadout">—</strong></div>
        </div>
      </section>
      <section class="panel model-note" data-region="insight">
        <div class="panel-head"><h2>科学推断</h2></div>
        <p id="insight" class="insight">拖动时间轴观看大陆漂移；点击右侧地球触发地震，观察P波与S波传播差异。</p>
        <p>教学模型：P波(纵波)可穿透液态外核但发生折射；S波(横波)无法穿透液态外核，在核幔边界被吸收，形成S波阴影区。科学家正是通过这一现象推断外核为液态。</p>
      </section>
    </aside>

    <section class="panel controls" data-region="controls" aria-label="模拟控制">
      <div class="actions">
        <button id="startBtn" class="primary" type="button">播放</button>
        <button id="pauseBtn" type="button">暂停</button>
        <button id="resetBtn" type="button">重置</button>
      </div>
      <div class="control">
        <label for="speedInput">时间速度 <output id="speedOutput">1.0×</output></label>
        <input id="speedInput" type="range" min="0.2" max="3" step="0.1" value="1"/>
      </div>
      <div class="actions">
        <button id="quakeBtn" class="danger" type="button">触发地震</button>
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";

    // ===== 参数与状态 =====
    const parameterSchema = [
      { key: "speed", label: "时间速度", type: "slider", min: 0.2, max: 3, step: 0.1, default: 1, unit: "×" }
    ];

    // 地球几何（右侧场景）
    const EARTH = { cx: 380, cy: 210, rMantle: 180, rOuterCore: 100, rInnerCore: 45 };

    // 大陆数据（简化模型，2亿年前→现在）
    // 每个大陆有起始和结束位置，通过插值移动
    const continents = [
      // 北美
      { name: "北美", x0: 180, y0: 150, x1: 120, y1: 140, w: 90, h: 70, color: "#15803d" },
      // 南美
      { name: "南美", x0: 200, y0: 250, x1: 160, y1: 260, w: 50, h: 80, color: "#166534" },
      // 欧亚
      { name: "欧亚", x0: 420, y0: 140, x1: 480, y1: 130, w: 130, h: 75, color: "#16a34a" },
      // 非洲
      { name: "非洲", x0: 400, y0: 230, x1: 430, y1: 240, w: 80, h: 90, color: "#15803d" },
      // 印度（从非洲分离，向北漂移撞击欧亚）
      { name: "印度", x0: 420, y0: 280, x1: 520, y1: 200, w: 40, h: 45, color: "#ca8a04" },
      // 澳洲
      { name: "澳洲", x0: 520, y0: 300, x1: 600, y1: 310, w: 55, h: 40, color: "#166534" }
    ];

    // 造山带（碰撞产生）
    const mountainRanges = [
      { name: "喜马拉雅", triggerTime: 80, x: 510, y: 175, w: 60, h: 15 }, // 印度-欧亚碰撞
      { name: "阿尔卑斯", triggerTime: 100, x: 460, y: 155, w: 40, h: 12 }
    ];

    // 洋脊位置
    const ridges = [
      { x: 340, y: 330, w: 80 }, // 大西洋中脊
      { x: 580, y: 330, w: 60 }  // 印度洋脊
    ];

    // 地震波状态
    const waveState = {
      active: false,
      t: 0,
      epicenter: { x: 380, y: 30 }, // 震源在地球顶部
      pWaveRadius: 0,
      sWaveRadius: 0,
      pWaveSpeed: 120,  // 教学化速度（像素/秒）
      sWaveSpeed: 70,
      pReached: false,
      sReached: false,
      shadowAngle: 103, // S波阴影区半角（度）
      pShadowStart: 103, // P波阴影区起始角
      pShadowEnd: 143    // P波阴影区结束角
    };

    const state = {
      running: false,
      time: 0,        // 0-200 百万年
      speed: 1,
      lastTimestamp: null,
      waveActive: false,
      waveTime: 0
    };

    const elements = {
      status: document.querySelector("#status"),
      timeline: document.querySelector("#timeline"),
      eraLabel: document.querySelector("#eraLabel"),
      eraMidLabel: document.querySelector("#eraMidLabel"),
      continentGroup: document.querySelector("#continentGroup"),
      mountainGroup: document.querySelector("#mountainGroup"),
      ridgeGroup: document.querySelector("#ridgeGroup"),
      spreadingArrows: document.querySelector("#spreadingArrows"),
      labelGroup: document.querySelector("#labelGroup"),
      sceneRight: document.querySelector("#sceneRight"),
      wavefrontGroup: document.querySelector("#wavefrontGroup"),
      wavePathGroup: document.querySelector("#wavePathGroup"),
      shadowZoneGroup: document.querySelector("#shadowZoneGroup"),
      epicenterGroup: document.querySelector("#epicenterGroup"),
      eraReadout: document.querySelector("#eraReadout"),
      positionReadout: document.querySelector("#positionReadout"),
      pwaveReadout: document.querySelector("#pwaveReadout"),
      swaveReadout: document.querySelector("#swaveReadout"),
      insight: document.querySelector("#insight"),
      speedInput: document.querySelector("#speedInput"),
      speedOutput: document.querySelector("#speedOutput"),
      startBtn: document.querySelector("#startBtn"),
      pauseBtn: document.querySelector("#pauseBtn"),
      resetBtn: document.querySelector("#resetBtn"),
      quakeBtn: document.querySelector("#quakeBtn")
    };

    // ===== 工具函数 =====
    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }
    function lerp(a, b, t) { return a + (b - a) * t; }

    // ===== 大陆漂移渲染 =====
    function getEraName(time) {
      if (time < 45) return "三叠纪 · 2亿年前";
      if (time < 100) return "侏罗纪 · 1.5亿年前";
      if (time < 160) return "白垩纪 · 1亿年前";
      return "新生代 · 现在";
    }

    function getEraShort(time) {
      if (time < 45) return "2亿年前";
      if (time < 100) return "1.5亿年前";
      if (time < 160) return "1亿年前";
      return "现在";
    }

    function getPositionDesc(time) {
      if (time < 30) return "泛大陆";
      if (time < 80) return "开始分裂";
      if (time < 130) return "持续漂移";
      if (time < 180) return "印度北移";
      return "现代格局";
    }

    function renderContinents(time) {
      const t = time / 200; // 0-1
      let html = "";
      continents.forEach(c => {
        const x = lerp(c.x0, c.x1, t);
        const y = lerp(c.y0, c.y1, t);
        html += `<rect x="${x - c.w/2}" y="${y - c.h/2}" width="${c.w}" height="${c.h}" rx="8" fill="${c.color}" stroke="#0f3d0f" stroke-width="1" opacity="0.88"/>`;
        html += `<text x="${x}" y="${y + 3}" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" pointer-events="none">${c.name}</text>`;
      });
      elements.continentGroup.innerHTML = html;
    }

    function renderMountains(time) {
      let html = "";
      mountainRanges.forEach(m => {
        if (time >= m.triggerTime) {
          const growth = clamp((time - m.triggerTime) / 40, 0, 1);
          const h = m.h * growth;
          html += `<polygon points="${m.x - m.w/2},${m.y} ${m.x},${m.y - h} ${m.x + m.w/2},${m.y}" fill="var(--sim-mountain)" stroke="#451a03" stroke-width="1" opacity="0.9"/>`;
          if (growth > 0.5) {
            html += `<text x="${m.x}" y="${m.y - h - 4}" text-anchor="middle" fill="#7c2d12" font-size="8" font-weight="700">${m.name}</text>`;
          }
        }
      });
      elements.mountainGroup.innerHTML = html;
    }

    function renderRidges(time) {
      let html = "";
      ridges.forEach(r => {
        // 洋脊始终存在，扩张箭头随时间变化
        html += `<path d="M ${r.x - r.w/2} ${r.y} Q ${r.x} ${r.y - 8} ${r.x + r.w/2} ${r.y}" stroke="#0e7490" stroke-width="2" fill="none" opacity="0.6"/>`;
      });
      elements.ridgeGroup.innerHTML = html;
    }

    function renderSpreadingArrows(time) {
      if (time < 20) {
        elements.spreadingArrows.innerHTML = "";
        return;
      }
      let html = "";
      ridges.forEach(r => {
        const offset = 8 + (time % 30) * 0.3;
        html += `<line x1="${r.x - offset}" y1="${r.y}" x2="${r.x - offset - 12}" y2="${r.y}" stroke="#0e7490" stroke-width="2" marker-end="url(#arrowLeft)"/>`;
        html += `<line x1="${r.x + offset}" y1="${r.y}" x2="${r.x + offset + 12}" y2="${r.y}" stroke="#0e7490" stroke-width="2" marker-end="url(#arrowRight)"/>`;
      });
      // 定义箭头标记
      html = `<defs>
        <marker id="arrowLeft" markerWidth="6" markerHeight="6" refX="0" refY="3" orient="auto">
          <polygon points="6,0 0,3 6,6" fill="#0e7490"/>
        </marker>
        <marker id="arrowRight" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
          <polygon points="0,0 6,3 0,6" fill="#0e7490"/>
        </marker>
      </defs>` + html;
      elements.spreadingArrows.innerHTML = html;
    }

    function renderLabels(time) {
      let html = "";
      // 海洋标签
      html += `<text x="280" y="370" text-anchor="middle" fill="#0e7490" font-size="10" font-weight="600" opacity="0.7">大西洋</text>`;
      html += `<text x="560" y="370" text-anchor="middle" fill="#0e7490" font-size="10" font-weight="600" opacity="0.7">印度洋</text>`;
      elements.labelGroup.innerHTML = html;
    }

    function renderLeftScene() {
      renderContinents(state.time);
      renderMountains(state.time);
      renderRidges(state.time);
      renderSpreadingArrows(state.time);
      renderLabels(state.time);
      elements.eraLabel.textContent = getEraName(state.time);
      elements.eraMidLabel.textContent = getEraShort(state.time);
      elements.eraReadout.textContent = getEraShort(state.time);
      elements.positionReadout.textContent = getPositionDesc(state.time);
    }

    // ===== 地震波渲染 =====
    function triggerQuake(x, y) {
      // 如果未指定位置，使用地球顶部
      if (x === undefined || y === undefined) {
        x = EARTH.cx;
        y = EARTH.cy - EARTH.rMantle + 5;
      }
      waveState.epicenter = { x, y };
      waveState.active = true;
      waveState.t = 0;
      waveState.pWaveRadius = 0;
      waveState.sWaveRadius = 0;
      waveState.pReached = false;
      waveState.sReached = false;
      state.waveActive = true;
      state.waveTime = 0;
      elements.status.textContent = "地震波传播中";
    }

    function updateWaves(dt) {
      if (!waveState.active) return;
      waveState.t += dt;
      waveState.pWaveRadius += waveState.pWaveSpeed * dt;
      waveState.sWaveRadius += waveState.sWaveSpeed * dt;

      // 检测波是否到达对侧
      const earthDiameter = EARTH.rMantle * 2;
      if (waveState.pWaveRadius >= earthDiameter * 0.9 && !waveState.pReached) {
        waveState.pReached = true;
        elements.pwaveReadout.textContent = "已到达";
      }
      if (waveState.sWaveRadius >= EARTH.rMantle * 1.4 && !waveState.sReached) {
        waveState.sReached = true;
        elements.swaveReadout.textContent = "阴影区无S波";
      }

      // 波传播结束
      if (waveState.t > 5) {
        waveState.active = false;
        elements.status.textContent = state.running ? "播放中" : "已暂停";
      }
    }

    function renderShadowZone() {
      let html = "";
      const cx = EARTH.cx, cy = EARTH.cy;
      const r = EARTH.rMantle;
      const halfAngle = waveState.shadowAngle * Math.PI / 180;

      // S波阴影区：从震源对面两侧各103°范围
      // 震源在顶部，对面在底部，阴影区在底部两侧
      const a1 = Math.PI / 2 + halfAngle; // 右侧
      const a2 = Math.PI / 2 - halfAngle; // 左侧
      const a3 = Math.PI / 2 + (Math.PI - halfAngle); // 左侧远端
      const a4 = Math.PI / 2 - (Math.PI - halfAngle); // 右侧远端

      // 绘制阴影区扇形（对侧）
      const p1x = cx + r * Math.cos(a2);
      const p1y = cy + r * Math.sin(a2);
      const p2x = cx + r * Math.cos(a1);
      const p2y = cy + r * Math.sin(a1);

      // 阴影区路径
      const largeArc = 2 * halfAngle > Math.PI ? 1 : 0;
      html += `<path d="M ${cx} ${cy} L ${p1x} ${p1y} A ${r} ${r} 0 0 1 ${p2x} ${p2y} Z" fill="var(--sim-shadow-zone)" opacity="0.18"/>`;
      html += `<path d="M ${p1x} ${p1y} A ${r} ${r} 0 0 1 ${p2x} ${p2y}" stroke="var(--sim-shadow-zone)" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="4 3"/>`;

      // 阴影区标签
      const labelAngle = Math.PI / 2;
      const labelX = cx + r * 0.7 * Math.cos(labelAngle);
      const labelY = cy + r * 0.7 * Math.sin(labelAngle);
      html += `<text x="${labelX}" y="${labelY + 4}" text-anchor="middle" fill="var(--sim-shadow-zone)" font-size="10" font-weight="700" opacity="0.8">阴影区</text>`;

      elements.shadowZoneGroup.innerHTML = html;
    }

    function renderWavefronts() {
      if (!waveState.active) {
        elements.wavefrontGroup.innerHTML = "";
        elements.wavePathGroup.innerHTML = "";
        elements.epicenterGroup.innerHTML = "";
        return;
      }

      let html = "";
      const cx = EARTH.cx, cy = EARTH.cy;
      const ex = waveState.epicenter.x, ey = waveState.epicenter.y;
      const r = EARTH.rMantle;

      // P波波前（蓝色圆弧）
      const pR = waveState.pWaveRadius;
      if (pR > 0 && pR < r * 2.5) {
        // 绘制P波圆弧（从震源出发）
        html += `<circle cx="${ex}" cy="${ey}" r="${pR}" fill="none" stroke="var(--sim-pwave)" stroke-width="2.5" opacity="${clamp(0.8 - pR/300, 0.15, 0.8)}"/>`;
      }

      // S波波前（红色圆弧）
      const sR = waveState.sWaveRadius;
      if (sR > 0 && sR < r * 1.8) {
        // S波在到达核幔边界前正常传播
        const distToCore = Math.sqrt((ex - cx) ** 2 + (ey - cy) ** 2);
        // S波到达核幔边界后停止
        html += `<circle cx="${ex}" cy="${ey}" r="${sR}" fill="none" stroke="var(--sim-swave)" stroke-width="2.5" opacity="${clamp(0.8 - sR/300, 0.15, 0.8)}"/>`;
      }

      elements.wavefrontGroup.innerHTML = html;

      // 波路径（示意性射线）
      let pathHtml = "";
      // P波射线（穿透外核，折射）
      const rayAngles = [-60, -30, 0, 30, 60]; // 度，相对于震源向下
      rayAngles.forEach(angle => {
        const rad = angle * Math.PI / 180;
        const endX = ex + Math.sin(rad) * pR;
        const endY = ey + Math.cos(rad) * pR;
        // 检查射线是否进入外核
        const distFromCenter = Math.sqrt((endX - cx) ** 2 + (endY - cy) ** 2);
        if (distFromCenter < r) {
          pathHtml += `<line x1="${ex}" y1="${ey}" x2="${endX}" y2="${endY}" stroke="var(--sim-pwave)" stroke-width="1" opacity="0.3" stroke-dasharray="2 2"/>`;
        }
      });

      // S波射线（止于核幔边界）
      const sRayAngles = [-80, -50, -20, 20, 50, 80];
      sRayAngles.forEach(angle => {
        const rad = angle * Math.PI / 180;
        const endX = ex + Math.sin(rad) * sR;
        const endY = ey + Math.cos(rad) * sR;
        const distFromCenter = Math.sqrt((endX - cx) ** 2 + (endY - cy) ** 2);
        if (distFromCenter < r && sR < r * 1.2) {
          pathHtml += `<line x1="${ex}" y1="${ey}" x2="${endX}" y2="${endY}" stroke="var(--sim-swave)" stroke-width="1" opacity="0.25" stroke-dasharray="2 2"/>`;
        }
      });

      elements.wavePathGroup.innerHTML = pathHtml;

      // 震源标记
      elements.epicenterGroup.innerHTML = `
        <circle cx="${ex}" cy="${ey}" r="6" fill="var(--sim-danger)" stroke="#fff" stroke-width="2"/>
        <circle cx="${ex}" cy="${ey}" r="${10 + Math.sin(waveState.t * 8) * 4}" fill="none" stroke="var(--sim-danger)" stroke-width="1.5" opacity="0.6"/>
        <text x="${ex}" y="${ey - 12}" text-anchor="middle" fill="#fef3c7" font-size="10" font-weight="700">震源</text>
      `;
    }

    function renderRightScene() {
      renderShadowZone();
      renderWavefronts();
    }

    // ===== 主渲染 =====
    function render() {
      renderLeftScene();
      renderRightScene();
      updateInsight();
    }

    function updateInsight() {
      if (waveState.active) {
        if (waveState.pReached && waveState.sReached) {
          elements.insight.textContent = "P波已到达对侧，但S波在阴影区消失——证明外核为液态，S波无法穿透。";
        } else if (waveState.pReached) {
          elements.insight.textContent = "P波穿透外核到达对侧（路径发生折射）；S波止于核幔边界，阴影区无S波信号。";
        } else if (waveState.sWaveRadius > EARTH.rOuterCore + 20) {
          elements.insight.textContent = "S波到达核幔边界，无法穿透液态外核；P波继续传播但路径发生折射。";
        } else {
          elements.insight.textContent = "P波(纵波)与S波(横波)同时从震源发出，P波速度更快，率先传播。";
        }
      } else if (state.time > 0) {
        const era = getEraShort(state.time);
        if (state.time > 80) {
          elements.insight.textContent = `${era}：大陆持续漂移，印度板块北移撞击欧亚大陆，喜马拉雅山脉隆起。`;
        } else if (state.time > 30) {
          elements.insight.textContent = `${era}：泛大陆开始分裂，大西洋与印度洋扩张，板块运动产生地震。`;
        } else {
          elements.insight.textContent = `${era}：地球处于泛大陆阶段，板块运动仍在持续。`;
        }
      } else {
        elements.insight.textContent = "拖动时间轴观看大陆漂移；点击右侧地球触发地震，观察P波与S波传播差异。";
      }
    }

    // ===== 生命周期 =====
    function init() {
      bindControls();
      setParameters({ speed: 1 });
      reset();
      requestAnimationFrame(frame);
    }

    function start() {
      state.running = true;
      elements.status.textContent = waveState.active ? "地震波传播中" : "播放中";
      elements.startBtn.setAttribute("aria-pressed", "true");
    }

    function pause() {
      state.running = false;
      elements.status.textContent = "已暂停";
      elements.startBtn.setAttribute("aria-pressed", "false");
    }

    function reset() {
      pause();
      state.time = 0;
      state.waveActive = false;
      waveState.active = false;
      waveState.t = 0;
      waveState.pWaveRadius = 0;
      waveState.sWaveRadius = 0;
      waveState.pReached = false;
      waveState.sReached = false;
      elements.timeline.value = "0";
      elements.pwaveReadout.textContent = "—";
      elements.swaveReadout.textContent = "—";
      render();
    }

    function update(dt) {
      if (!state.running) return;
      const boundedDt = clamp(finite(dt, 0), 0, 0.05);

      // 更新大陆漂移时间
      state.time += boundedDt * 10 * state.speed; // 10百万年/秒
      if (state.time > 200) state.time = 200;
      elements.timeline.value = String(Math.round(state.time));

      // 更新地震波
      if (waveState.active) {
        updateWaves(boundedDt * state.speed);
      }
    }

    function setParameters(values) {
      const speedDef = parameterSchema[0];
      state.speed = clamp(finite(Number(values.speed), speedDef.default), speedDef.min, speedDef.max);
      elements.speedInput.value = String(state.speed);
      elements.speedOutput.textContent = `${state.speed.toFixed(1)}×`;
      render();
    }

    function getState() {
      return { ...state, wave: { ...waveState } };
    }

    function getReadouts() {
      return {
        era: getEraShort(state.time),
        position: getPositionDesc(state.time),
        pWave: waveState.pReached ? "已到达" : (waveState.active ? "传播中" : "—"),
        sWave: waveState.sReached ? "阴影区无S波" : (waveState.active ? "传播中" : "—")
      };
    }

    function runModelChecks() {
      // 模型检查：验证地震波传播的关键物理性质
      const checks = [];

      // 1. P波速度大于S波速度
      checks.push({
        name: "P波速度大于S波速度",
        pass: waveState.pWaveSpeed > waveState.sWaveSpeed,
        expected: "P波速度 > S波速度",
        actual: `${waveState.pWaveSpeed} > ${waveState.sWaveSpeed}`,
        tolerance: "strict"
      });

      // 2. S波阴影区角度合理（约103°）
      checks.push({
        name: "S波阴影区角度存在",
        pass: waveState.shadowAngle > 90 && waveState.shadowAngle < 120,
        expected: "90° < 阴影角 < 120°",
        actual: `${waveState.shadowAngle}°`,
        tolerance: "range"
      });

      // 3. 大陆漂移单调性：时间增加，大陆位置变化
      const t1 = continents[0].x0 + (continents[0].x1 - continents[0].x0) * 0;
      const t2 = continents[0].x0 + (continents[0].x1 - continents[0].x0) * 0.5;
      const t3 = continents[0].x0 + (continents[0].x1 - continents[0].x0) * 1;
      checks.push({
        name: "大陆位置随时间单调变化",
        pass: t1 !== t2 && t2 !== t3,
        expected: "位置随时间变化",
        actual: `t=0:${t1.toFixed(0)}, t=0.5:${t2.toFixed(0)}, t=1:${t3.toFixed(0)}`,
        tolerance: "strict"
      });

      // 4. 造山带在碰撞后出现
      const m = mountainRanges[0];
      checks.push({
        name: "造山带在碰撞时间后出现",
        pass: m.triggerTime > 0 && m.triggerTime < 200,
        expected: "0 < 触发时间 < 200",
        actual: `${m.triggerTime}`,
        tolerance: "range"
      });

      // 5. 印度大陆向北漂移（y减小）
      const india = continents[4];
      checks.push({
        name: "印度板块向北漂移",
        pass: india.y1 < india.y0,
        expected: "终点y < 起点y",
        actual: `${india.y1} < ${india.y0}`,
        tolerance: "strict"
      });

      // 6. 波传播有限性
      checks.push({
        name: "波速为有限正值",
        pass: waveState.pWaveSpeed > 0 && waveState.sWaveSpeed > 0 && Number.isFinite(waveState.pWaveSpeed) && Number.isFinite(waveState.sWaveSpeed),
        expected: "正值且有限",
        actual: `P:${waveState.pWaveSpeed}, S:${waveState.sWaveSpeed}`,
        tolerance: "finite"
      });

      return checks;
    }

    function bindControls() {
      elements.startBtn.addEventListener("click", start);
      elements.pauseBtn.addEventListener("click", pause);
      elements.resetBtn.addEventListener("click", reset);

      elements.timeline.addEventListener("input", () => {
        state.time = Number(elements.timeline.value);
        render();
      });

      elements.speedInput.addEventListener("input", () => {
        setParameters({ speed: elements.speedInput.value });
      });

      elements.quakeBtn.addEventListener("click", () => {
        triggerQuake();
        render();
      });

      // 点击右侧地球触发地震
      elements.sceneRight.addEventListener("click", (e) => {
        const rect = elements.sceneRight.getBoundingClientRect();
        const viewBox = elements.sceneRight.viewBox.baseVal;
        const scaleX = viewBox.width / rect.width;
        const scaleY = viewBox.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;

        // 检查点击是否在地球范围内
        const dist = Math.sqrt((x - EARTH.cx) ** 2 + (y - EARTH.cy) ** 2);
        if (dist <= EARTH.rMantle) {
          triggerQuake(x, y);
          render();
        }
      });
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
    init();
  })();
  </script>
</body>
