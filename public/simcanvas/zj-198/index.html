<style>

}

<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <canvas id="scene" data-region="stage"></canvas>
  <header class="header" data-region="header">
    <h1>中国剪纸团花 · 呼吸演化</h1>
    <p>极坐标花瓣随相位演化，12 重旋转对称</p>
    <div id="status" class="status" role="status" aria-live="polite">运行中</div>
  </header>
  <aside class="evidence" data-region="evidence" aria-label="实时数据">
    <div class="metric"><small>时间</small><strong id="timeReadout">0.0 s</strong></div>
    <div class="metric"><small>演化相位</small><strong id="phaseReadout">0.00</strong></div>
    <div class="metric"><small>呼吸</small><strong id="breathReadout">1.000</strong></div>
  </aside>
  <div class="insight" data-region="insight" id="insight">
    花瓣在尖瓣与圆瓣间周期变形，整体随呼吸缓慢起伏。
  </div>
  <div class="corner-ui" data-region="controls">
    <span class="formula">r(θ)=R·(0.6+0.4·sin3θ+0.2·sin7θ)</span>
    <button id="playBtn" class="play-btn" type="button" aria-label="暂停" title="播放 / 暂停">
      <svg viewBox="0 0 12 12" aria-hidden="true">
        <rect id="iconPause1" x="2.5" y="2" width="2.2" height="8" rx="0.4"/>
        <rect id="iconPause2" x="7.3" y="2" width="2.2" height="8" rx="0.4"/>
        <polygon id="iconPlay" points="3,2 10,6 3,10" style="display:none"/>
      </svg>
    </button>
  </div>
</div>
<script>
(() => {
  "use strict";

  // ===== 参数 schema（与 starter 约定一致）=====
  const parameterSchema = [
    { key: "symmetry", label: "对称数", type: "fixed", default: 12, unit: "重" },
    { key: "rotationSpeed", label: "自转速度", type: "fixed", default: 0.06, unit: "rad/s" },
    { key: "evolutionPeriod", label: "演化周期", type: "fixed", default: 24, unit: "s" }
  ];

  // ===== 状态 =====
  const state = {
    running: true,
    t: 0,
    symmetry: 12,
    rotationSpeed: 0.06,
    evolutionPeriod: 24,
    lastTimestamp: null,
    canvasW: 0,
    canvasH: 0,
    cx: 0, cy: 0,
    baseR: 0
  };

  // ===== DOM =====
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  const playBtn = document.getElementById("playBtn");
  const iconPause1 = document.getElementById("iconPause1");
  const iconPause2 = document.getElementById("iconPause2");
  const iconPlay = document.getElementById("iconPlay");
  const statusEl = document.getElementById("status");
  const timeReadout = document.getElementById("timeReadout");
  const phaseReadout = document.getElementById("phaseReadout");
  const breathReadout = document.getElementById("breathReadout");
  const insightEl = document.getElementById("insight");

  // ===== 工具 =====
  function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
  function finite(v, fallback) { return Number.isFinite(v) ? v : fallback; }

  // ===== 尺寸 =====
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    state.canvasW = w;
    state.canvasH = h;
    state.cx = w / 2;
    state.cy = h / 2;
    state.baseR = Math.min(w, h) * 0.34;
  }

  // ===== 极坐标花瓣半径 =====
  // r(θ) = R · (0.6 + 0.4·sin(3θ) + 0.2·sin(7θ + t·演化))
  // 演化项相位随时间缓慢漂移，使瓣形在尖瓣与圆瓣之间周期变形
  function petalR(theta, R, evoPhase) {
    return R * (0.6 + 0.4 * Math.sin(3 * theta) + 0.2 * Math.sin(7 * theta + evoPhase));
  }

  // ===== 呼吸缩放（整体缓慢起伏）=====
  function breathScale(t) {
    return 1 + 0.035 * Math.sin(t * 2 * Math.PI / 18);
  }

  // ===== 绘制单瓣路径（一瓣覆盖 2π/12 = 30°）=====
  function tracePetal(R, evoPhase, halfSpan) {
    const steps = 48;
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const a = -halfSpan + (2 * halfSpan) * (i / steps);
      const r = Math.max(0.5, petalR(a, R, evoPhase));
      const x = r * Math.cos(a);
      const y = r * Math.sin(a);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  // ===== 绘制完整团花（12 瓣旋转复制）=====
  function drawMotif(R, evoPhase, rotation, breath) {
    const N = state.symmetry;
    const halfSpan = Math.PI / N;
    const scaledR = R * breath;

    ctx.save();
    ctx.translate(state.cx, state.cy);
    ctx.rotate(rotation);

    // 多层半透明深红填充，叠出剪纸层次感
    const fillLayers = [
      { r: 1.00, color: "rgba(150, 28, 36, 0.20)" },
      { r: 0.88, color: "rgba(176, 38, 46, 0.26)" },
      { r: 0.74, color: "rgba(200, 50, 56, 0.30)" },
      { r: 0.58, color: "rgba(222, 66, 70, 0.34)" },
      { r: 0.40, color: "rgba(240, 88, 88, 0.38)" }
    ];
    for (const layer of fillLayers) {
      ctx.fillStyle = layer.color;
      for (let i = 0; i < N; i++) {
        ctx.save();
        ctx.rotate(i * 2 * Math.PI / N);
        tracePetal(scaledR * layer.r, evoPhase, halfSpan);
        ctx.fill();
        ctx.restore();
      }
    }

    // 金色双层描边模拟发光：粗低透明 + 细高透明
    // 外层光晕
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(244, 200, 100, 0.22)";
    ctx.lineWidth = 6;
    for (let i = 0; i < N; i++) {
      ctx.save();
      ctx.rotate(i * 2 * Math.PI / N);
      tracePetal(scaledR, evoPhase, halfSpan);
      ctx.stroke();
      ctx.restore();
    }
    // 中层
    ctx.strokeStyle = "rgba(252, 220, 130, 0.5)";
    ctx.lineWidth = 2.6;
    for (let i = 0; i < N; i++) {
      ctx.save();
      ctx.rotate(i * 2 * Math.PI / N);
      tracePetal(scaledR, evoPhase, halfSpan);
      ctx.stroke();
      ctx.restore();
    }
    // 内层锐利金线
    ctx.strokeStyle = "rgba(255, 240, 180, 0.92)";
    ctx.lineWidth = 1.1;
    for (let i = 0; i < N; i++) {
      ctx.save();
      ctx.rotate(i * 2 * Math.PI / N);
      tracePetal(scaledR, evoPhase, halfSpan);
      ctx.stroke();
      ctx.restore();
    }

    // 中心金色小圆点（剪纸中心装饰）
    ctx.fillStyle = "rgba(255, 230, 160, 0.85)";
    ctx.beginPath();
    ctx.arc(0, 0, Math.max(2, scaledR * 0.018), 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(180, 130, 50, 0.6)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, Math.max(3, scaledR * 0.03), 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
  }

  // ===== 绘制外圈锯齿剪纸边框（随呼吸缩放）=====
  function drawSawtoothBorder(R, breath) {
    const teeth = 96;
    const innerR = R * 1.12 * breath;
    const outerR = R * 1.22 * breath;
    const depth = (outerR - innerR) * (0.5 + 0.15 * Math.sin(state.t * 2 * Math.PI / 9));

    ctx.save();
    ctx.translate(state.cx, state.cy);

    // 锯齿路径
    ctx.beginPath();
    for (let i = 0; i < teeth; i++) {
      const a0 = (i / teeth) * Math.PI * 2;
      const a1 = ((i + 0.5) / teeth) * Math.PI * 2;
      const a2 = ((i + 1) / teeth) * Math.PI * 2;
      const x0 = innerR * Math.cos(a0), y0 = innerR * Math.sin(a0);
      const x1 = outerR * Math.cos(a1), y1 = outerR * Math.sin(a1);
      const x2 = innerR * Math.cos(a2), y2 = innerR * Math.sin(a2);
      if (i === 0) ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.lineTo(x2, y2);
    }
    ctx.closePath();

    // 双层金色描边
    ctx.lineJoin = "miter";
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(244, 200, 100, 0.18)";
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.strokeStyle = "rgba(252, 220, 130, 0.42)";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.strokeStyle = "rgba(255, 240, 180, 0.82)";
    ctx.lineWidth = 0.9;
    ctx.stroke();

    // 内侧细金线圆（双层）
    ctx.beginPath();
    ctx.arc(0, 0, innerR * 0.985, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(244, 200, 100, 0.16)";
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.strokeStyle = "rgba(255, 240, 180, 0.55)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
  }

  // ===== 背景径向渐变 =====
  function drawBackground() {
    const w = state.canvasW, h = state.canvasH;
    const cx = state.cx, cy = state.cy;
    const maxR = Math.sqrt(w * w + h * h) * 0.62;

    // 主径向渐变：中心暗红 → 深红 → 黑
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
    g.addColorStop(0, "#2a0a14");
    g.addColorStop(0.35, "#180610");
    g.addColorStop(0.7, "#0a0308");
    g.addColorStop(1, "#06030a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    // 中心微弱金光晕（径向渐变模拟发光，非 shadowBlur）
    const glowR = state.baseR * 1.8;
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
    glow.addColorStop(0, "rgba(212, 168, 67, 0.10)");
    glow.addColorStop(0.4, "rgba(180, 130, 50, 0.05)");
    glow.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);
  }

  // ===== 渲染 =====
  function render() {
    drawBackground();

    const evoPhase = (state.t * 2 * Math.PI / state.evolutionPeriod) * 3;
    const rotation = state.t * state.rotationSpeed;
    const breath = breathScale(state.t);

    drawSawtoothBorder(state.baseR, breath);
    drawMotif(state.baseR, evoPhase, rotation, breath);

    // 更新读数与洞察
    timeReadout.textContent = state.t.toFixed(1) + " s";
    phaseReadout.textContent = (evoPhase % (2 * Math.PI)).toFixed(2);
    breathReadout.textContent = breath.toFixed(3);
    const phaseNorm = (evoPhase % (2 * Math.PI)) / (2 * Math.PI);
    if (phaseNorm < 0.25 || phaseNorm > 0.75) {
      insightEl.textContent = "花瓣趋于尖锐，瓣形分明。";
    } else {
      insightEl.textContent = "花瓣趋于圆润，整体柔和。";
    }
  }

  // ===== 更新 =====
  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05);
    state.t += boundedDt;
  }

  // ===== 生命周期 =====
  function init() {
    resize();
    bindControls();
    requestAnimationFrame(frame);
  }
  function start() {
    state.running = true;
    statusEl.textContent = "运行中";
    playBtn.setAttribute("aria-label", "暂停");
    playBtn.title = "播放 / 暂停";
    iconPause1.style.display = "";
    iconPause2.style.display = "";
    iconPlay.style.display = "none";
  }
  function pause() {
    state.running = false;
    statusEl.textContent = "已暂停";
    playBtn.setAttribute("aria-label", "播放");
    playBtn.title = "播放 / 暂停";
    iconPause1.style.display = "none";
    iconPause2.style.display = "none";
    iconPlay.style.display = "";
  }
  function reset() {
    state.t = 0;
    state.lastTimestamp = null;
    render();
  }
  function setParameters(values) {
    if (values.symmetry !== undefined) state.symmetry = clamp(finite(Number(values.symmetry), 12), 3, 24);
    if (values.rotationSpeed !== undefined) state.rotationSpeed = clamp(finite(Number(values.rotationSpeed), 0.06), 0, 0.5);
    if (values.evolutionPeriod !== undefined) state.evolutionPeriod = clamp(finite(Number(values.evolutionPeriod), 24), 4, 120);
  }
  function getState() { return { ...state }; }
  function getReadouts() { return { time: state.t, running: state.running }; }

  // ===== 模型检查（确定性函数验证）=====
  function runModelChecks() {
    // 1. 花瓣半径函数在关键点返回有限值
    const r0 = petalR(0, 100, 0);
    const r1 = petalR(Math.PI / 6, 100, 0);
    const r2 = petalR(Math.PI / 3, 100, 1.5);
    const allFinite = Number.isFinite(r0) && Number.isFinite(r1) && Number.isFinite(r2);

    // 2. 12 重旋转对称：r(θ) = r(θ + 2π/12)
    const sym = 12;
    const testTheta = 0.7;
    const ra = petalR(testTheta, 100, 0.42);
    const rb = petalR(testTheta + 2 * Math.PI / sym, 100, 0.42);
    const symTol = 1e-9;
    const symPass = Math.abs(ra - rb) < symTol;

    // 3. 演化周期性：evoPhase 周期为 2π，对应 evolutionPeriod
    const period = state.evolutionPeriod;
    const evoAt0 = (0 * 2 * Math.PI / period) * 3;
    const evoAtP = (period * 2 * Math.PI / period) * 3;
    const periodPass = Math.abs(evoAt0 - evoAtP) < 1e-9;

    // 4. 呼吸函数有界且周期为 18s
    const breathMax = 1 + 0.035;
    const breathMin = 1 - 0.035;
    const bMid = breathScale(0);
    const bPeak = breathScale(4.5);
    const bTrough = breathScale(13.5);
    const breathBounded = bMid >= breathMin && bMid <= breathMax && bPeak >= breathMin && bTrough >= breathMin;
    const breathPeriodPass = Math.abs(breathScale(0) - breathScale(18)) < 1e-9;

    // 5. 旋转速度确定性：rotation = t · ω
    const t1 = 10, t2 = 20;
    const rot1 = t1 * state.rotationSpeed;
    const rot2 = t2 * state.rotationSpeed;
    const rotPass = Math.abs(rot2 - 2 * rot1) < 1e-9;

    return [
      { name: "petalR finite at key angles", pass: allFinite, expected: "finite", actual: [r0, r1, r2], tolerance: "finite" },
      { name: "12-fold rotational symmetry r(θ)=r(θ+2π/12)", pass: symPass, expected: ra, actual: rb, tolerance: symTol },
      { name: "evolution phase periodicity", pass: periodPass, expected: evoAt0, actual: evoAtP, tolerance: 1e-9 },
      { name: "breath bounded and periodic", pass: breathBounded && breathPeriodPass, expected: `[${breathMin},${breathMax}] period 18s`, actual: `b(0)=${breathScale(0)}, b(18)=${breathScale(18)}`, tolerance: 1e-9 },
      { name: "rotation linear in time", pass: rotPass, expected: rot2, actual: 2 * rot1, tolerance: 1e-9 }
    ];
  }

  // ===== 控件绑定 =====
  function bindControls() {
    playBtn.addEventListener("click", () => {
      if (state.running) pause(); else start();
    });
    window.addEventListener("resize", resize);
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && e.target === document.body) {
        e.preventDefault();
        if (state.running) pause(); else start();
      }
    });
  }

  // ===== 主循环 =====
  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // ===== 暴露 =====
  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };

  init();
})();
</script>
