  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>弹簧振子简谐运动</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #eef3f8;
      --sim-surface: #ffffff;
      --sim-surface-soft: #f8fafc;
      --sim-text: #172033;
      --sim-muted: #657188;
      --sim-border: #dfe6ef;
      --sim-grid: #e8edf4;
      --sim-accent: #0f9fba;
      --sim-accent-deep: #08758a;
      --sim-accent-soft: #d9f4f7;
      --sim-positive: #0f9fba;
      --sim-warning: #f59e0b;
      --sim-danger: #dc2626;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
        var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
    .status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 12px; }
    .panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
    #scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); }
    .side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
    .readouts, .model-note { padding: 17px; }
    .readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric { padding: 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
    .metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
    .metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .model-note { display: grid; align-content: start; gap: 14px; }
    .model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
    .insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; }
    .controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr) minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
    button:hover { border-color: #c7d2e2; background: #eef3f9; }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
    .control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
    .grid-line { stroke: var(--sim-grid); stroke-width: 1; }
    .axis { stroke: #9aa7ba; stroke-width: 1.5; }
    #trace { fill: none; stroke: var(--sim-accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 3px 4px rgba(15,159,186,.18)); }
    #markerHalo { fill: rgba(15,159,186,.14); }
    #marker { fill: var(--sim-positive); stroke: white; stroke-width: 3; }
    #targetLine { stroke: var(--sim-warning); stroke-width: 2.5; stroke-dasharray: 7 7; }
    #targetText { fill: #a35d00; font-size: 12px; font-weight: 750; }
    .axis-label { fill: var(--sim-muted); font-size: 12px; }
    .wall { fill: #94a3b8; }
    .wall-stripe { stroke: #64748b; stroke-width: 2; }
    .spring { fill: none; stroke: #475569; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .mass-body { fill: url(#massGrad); stroke: #0c4a6e; stroke-width: 2; }
    .equilibrium-line { stroke: var(--sim-warning); stroke-width: 1.5; stroke-dasharray: 4 6; opacity: 0.7; }
    .equilibrium-label { fill: #a35d00; font-size: 11px; font-weight: 700; }
    .vel-arrow { stroke: var(--sim-danger); stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    .vel-label { fill: var(--sim-danger); font-size: 12px; font-weight: 700; }
    @media (max-width: 860px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
      .scene-panel { min-height: 0; }
      #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="app" data-layout="scene-first" data-model-tier="analytic">
    <header class="header" data-region="header">
      <div>
        <h1>弹簧振子简谐运动</h1>
        <p>调节振幅与劲度系数，观察位移、速度与回复力的周期性变化。</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head"><h2 id="scene-title">振子运动</h2><span>位移随时间演化</span></div>
        <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
          <desc id="scene-desc">弹簧振子演示：质量块在平衡位置附近做简谐振动，下方曲线显示位移随时间变化。</desc>
          <defs>
            <linearGradient id="massGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#0ea5b8"></stop>
              <stop offset="1" stop-color="#08758a"></stop>
            </linearGradient>
            <linearGradient id="traceGlow" x1="0" x2="1">
              <stop stop-color="#0f9fba"></stop>
              <stop offset="1" stop-color="#08758a"></stop>
            </linearGradient>
            <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#dc2626"></polygon>
            </marker>
          </defs>

          <!-- 墙壁 -->
          <rect class="wall" x="40" y="70" width="14" height="80"></rect>
          <line class="wall-stripe" x1="40" y1="70" x2="54" y2="70"></line>
          <line class="wall-stripe" x1="40" y1="150" x2="54" y2="150"></line>
          <line class="wall-stripe" x1="40" y1="86" x2="54" y2="86"></line>
          <line class="wall-stripe" x1="40" y1="102" x2="54" y2="102"></line>
          <line class="wall-stripe" x1="40" y1="118" x2="54" y2="118"></line>
          <line class="wall-stripe" x1="40" y1="134" x2="54" y2="134"></line>

          <!-- 平衡位置参考线 -->
          <line class="equilibrium-line" x1="380" y1="60" x2="380" y2="170"></line>
          <text class="equilibrium-label" x="380" y="56" text-anchor="middle">平衡位置</text>

          <!-- 弹簧 -->
          <path id="spring" class="spring" d=""></path>

          <!-- 质量块 -->
          <rect id="mass" class="mass-body" x="360" y="85" width="40" height="50" rx="6"></rect>

          <!-- 速度箭头 -->
          <line id="velArrow" class="vel-arrow" x1="380" y1="75" x2="380" y2="75" style="display:none"></line>
          <text id="velLabel" class="vel-label" x="380" y="68" text-anchor="middle" style="display:none">v</text>

          <!-- 位移-时间曲线区域 -->
          <g id="grid"></g>
          <line class="axis" x1="58" y1="360" x2="724" y2="360"></line>
          <line class="axis" x1="58" y1="200" x2="58" y2="360"></line>
          <text class="axis-label" x="700" y="389">时间</text>
          <text class="axis-label" x="18" y="205">位移</text>
          <line id="targetLine" x1="58" y1="280" x2="724" y2="280"></line>
          <text id="targetText" x="716" y="275" text-anchor="end">平衡</text>
          <polyline id="trace" points="" stroke="url(#traceGlow)"></polyline>
          <circle id="markerHalo" cx="58" cy="280" r="15"></circle>
          <circle id="marker" cx="58" cy="280" r="7"></circle>
        </svg>
      </section>

      <aside class="side" data-region="evidence">
        <section class="panel readouts" aria-label="实时数据">
          <div class="readout-grid">
            <div class="metric"><small>位移 x</small><strong id="stateReadout">0.00 m</strong></div>
            <div class="metric"><small>时间</small><strong id="timeReadout">0.00 s</strong></div>
            <div class="metric"><small>速度 v</small><strong id="velReadout">0.00 m/s</strong></div>
            <div class="metric"><small>周期 T</small><strong id="periodReadout">0.00 s</strong></div>
          </div>
        </section>
        <section class="panel model-note" data-region="insight">
          <div class="panel-head"><h2>模型说明</h2></div>
          <p id="insight" class="insight">按下开始，观察位移曲线如何围绕平衡位置周期性振荡。</p>
          <p>教学模型：x(t) = A·cos(ωt)，ω = √(k/m)。回复力 F = -kx 始终指向平衡位置，速度在平衡点最大、在端点为零。</p>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="模拟控制">
      <div class="actions">
        <button id="startBtn" class="primary" type="button">开始</button>
        <button id="pauseBtn" type="button">暂停</button>
        <button id="resetBtn" type="button">重置</button>
      </div>
      <div class="control">
        <label for="amplitudeInput">振幅 A <output id="amplitudeOutput">1.0 m</output></label>
        <input id="amplitudeInput" type="range" min="0.3" max="2" step="0.1" value="1">
      </div>
      <div class="control">
        <label for="kInput">劲度系数 k <output id="kOutput">10 N/m</output></label>
        <input id="kInput" type="range" min="2" max="40" step="1" value="10">
      </div>
    </section>
  </div>

  <script>
  (function () {
    "use strict";
    var parameterSchema = [
      { key: "amplitude", label: "振幅", type: "slider", min: 0.3, max: 2, step: 0.1, default: 1, unit: "m" },
      { key: "k", label: "劲度系数", type: "slider", min: 2, max: 40, step: 1, default: 10, unit: "N/m" }
    ];
    var state = {
      running: false,
      t: 0,
      x: 1,
      v: 0,
      amplitude: 1,
      k: 10,
      mass: 1,
      lastTimestamp: null,
      history: [{ t: 0, x: 1 }]
    };
    var elements = {
      status: document.getElementById("status"),
      trace: document.getElementById("trace"),
      marker: document.getElementById("marker"),
      markerHalo: document.getElementById("markerHalo"),
      targetLine: document.getElementById("targetLine"),
      targetText: document.getElementById("targetText"),
      insight: document.getElementById("insight"),
      grid: document.getElementById("grid"),
      spring: document.getElementById("spring"),
      mass: document.getElementById("mass"),
      velArrow: document.getElementById("velArrow"),
      velLabel: document.getElementById("velLabel"),
      stateReadout: document.getElementById("stateReadout"),
      timeReadout: document.getElementById("timeReadout"),
      velReadout: document.getElementById("velReadout"),
      periodReadout: document.getElementById("periodReadout"),
      amplitudeInput: document.getElementById("amplitudeInput"),
      amplitudeOutput: document.getElementById("amplitudeOutput"),
      kInput: document.getElementById("kInput"),
      kOutput: document.getElementById("kOutput"),
      startBtn: document.getElementById("startBtn"),
      pauseBtn: document.getElementById("pauseBtn"),
      resetBtn: document.getElementById("resetBtn")
    };

    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

    function omega() { return Math.sqrt(state.k / state.mass); }
    function period() { return 2 * Math.PI / omega(); }

    function initGrid() {
      var lines = [];
      for (var i = 0; i <= 10; i += 1) {
        var gx = 58 + i * 66.6;
        var gy = 360 - i * 16;
        lines.push('<line class="grid-line" x1="' + gx + '" y1="200" x2="' + gx + '" y2="360"></line>');
        lines.push('<line class="grid-line" x1="58" y1="' + gy + '" x2="724" y2="' + gy + '"></line>');
      }
      elements.grid.innerHTML = lines.join("");
    }

    function buildSpringPath(xMass) {
      var startX = 54;
      var endX = xMass;
      var y = 110;
      var coils = 10;
      var segLen = (endX - startX) / coils;
      var d = "M " + startX + " " + y + " ";
      for (var i = 0; i < coils; i++) {
        var x0 = startX + i * segLen;
        var x1 = x0 + segLen * 0.25;
        var x2 = x0 + segLen * 0.5;
        var x3 = x0 + segLen * 0.75;
        var x4 = x0 + segLen;
        d += "L " + x1 + " " + (y - 10) + " L " + x2 + " " + y + " L " + x3 + " " + (y + 10) + " L " + x4 + " " + y + " ";
      }
      return d;
    }

    function init() {
      initGrid();
      bindControls();
      setParameters({ amplitude: 1, k: 10 });
      reset();
      requestAnimationFrame(frame);
    }

    function start() {
      state.running = true;
      elements.status.textContent = "运行中";
      elements.startBtn.setAttribute("aria-pressed", "true");
    }

    function pause() {
      state.running = false;
      elements.status.textContent = "已暂停";
      elements.startBtn.setAttribute("aria-pressed", "false");
    }

    function reset() {
      pause();
      state.t = 0;
      state.x = state.amplitude;
      state.v = 0;
      state.lastTimestamp = null;
      state.history = [{ t: 0, x: state.amplitude }];
      render();
    }

    function update(dt) {
      if (!state.running) return;
      var boundedDt = clamp(finite(dt, 0), 0, 0.05);
      var w = omega();
      var A = state.amplitude;
      var prevX = state.x;
      state.x = A * Math.cos(w * state.t);
      state.v = -A * w * Math.sin(w * state.t);
      if (!Number.isFinite(state.x)) state.x = prevX;
      if (!Number.isFinite(state.v)) state.v = 0;
      state.t += boundedDt;
      if (state.history.length === 0 || state.t - state.history[state.history.length - 1].t >= 0.04) {
        state.history.push({ t: state.t, x: state.x });
        if (state.history.length > 500) state.history.shift();
      }
    }

    function render() {
      var maxTime = Math.max(10, state.t);
      var maxState = 2;
      function point(sample) {
        return (58 + (sample.t / maxTime) * 666) + "," + (280 - (sample.x / maxState) * 70);
      }
      elements.trace.setAttribute("points", state.history.map(point).join(" "));
      var current = point({ t: state.t, x: state.x }).split(",");
      elements.marker.setAttribute("cx", current[0]);
      elements.marker.setAttribute("cy", current[1]);
      elements.markerHalo.setAttribute("cx", current[0]);
      elements.markerHalo.setAttribute("cy", current[1]);
      elements.targetLine.setAttribute("y1", 280);
      elements.targetLine.setAttribute("y2", 280);
      elements.targetText.setAttribute("y", 275);

      // 振子位置：平衡位置 380，位移放大显示
      var scale = 80;
      var massX = 380 + state.x * scale;
      var massLeft = massX - 20;
      elements.mass.setAttribute("x", massLeft);
      elements.spring.setAttribute("d", buildSpringPath(massLeft));

      // 速度箭头
      var velScale = 25;
      var arrowLen = state.v * velScale;
      if (Math.abs(arrowLen) > 3) {
        elements.velArrow.setAttribute("x1", massX);
        elements.velArrow.setAttribute("y1", 75);
        elements.velArrow.setAttribute("x2", massX + arrowLen);
        elements.velArrow.setAttribute("y2", 75);
        elements.velArrow.style.display = "";
        elements.velLabel.setAttribute("x", massX + arrowLen / 2);
        elements.velLabel.style.display = "";
      } else {
        elements.velArrow.style.display = "none";
        elements.velLabel.style.display = "none";
      }

      var absV = Math.abs(state.v);
      elements.insight.textContent = !state.running && state.t === 0
        ? "按下开始，观察位移曲线如何围绕平衡位置周期性振荡。"
        : absV < 0.05
          ? "端点处：速度为零，回复力最大，振子即将反向。"
          : Math.abs(state.x) < 0.05
            ? "平衡位置：速度最大，回复力为零，位移方向即将改变。"
            : "运动中：回复力 F = -kx 始终指向平衡位置。";

      elements.stateReadout.textContent = state.x.toFixed(2) + " m";
      elements.timeReadout.textContent = state.t.toFixed(2) + " s";
      elements.velReadout.textContent = state.v.toFixed(2) + " m/s";
      elements.periodReadout.textContent = period().toFixed(2) + " s";
      elements.amplitudeOutput.textContent = state.amplitude.toFixed(1) + " m";
      elements.kOutput.textContent = state.k.toFixed(0) + " N/m";
    }

    function setParameters(values) {
      var ampDef = parameterSchema[0];
      var kDef = parameterSchema[1];
      state.amplitude = clamp(finite(Number(values.amplitude), ampDef.default), ampDef.min, ampDef.max);
      state.k = clamp(finite(Number(values.k), kDef.default), kDef.min, kDef.max);
      elements.amplitudeInput.value = String(state.amplitude);
      elements.kInput.value = String(state.k);
      if (!state.running) {
        state.x = state.amplitude;
        state.v = 0;
        state.t = 0;
        state.history = [{ t: 0, x: state.amplitude }];
      }
      render();
    }

    function getState() {
      var histCopy = state.history.map(function (s) { return { t: s.t, x: s.x }; });
      return {
        running: state.running,
        t: state.t,
        x: state.x,
        v: state.v,
        amplitude: state.amplitude,
        k: state.k,
        mass: state.mass,
        history: histCopy
      };
    }

    function getReadouts() {
      return {
        x: state.x,
        v: state.v,
        t: state.t,
        amplitude: state.amplitude,
        k: state.k,
        period: period(),
        omega: omega()
      };
    }

    function runModelChecks() {
      function simulate(duration, opts) {
        var o = opts || {};
        var A = o.amplitude !== undefined ? o.amplitude : 1;
        var k = o.k !== undefined ? o.k : 10;
        var m = o.mass !== undefined ? o.mass : 1;
        var w = Math.sqrt(k / m);
        var dt = o.dt || 1 / 240;
        var x0 = o.x0 !== undefined ? o.x0 : A;
        var v0 = o.v0 !== undefined ? o.v0 : 0;
        var phase0 = o.phase0 !== undefined ? o.phase0 : 0;
        var x = x0;
        var v = v0;
        var t = 0;
        // 使用解析解直接计算，避免数值积分误差
        x = A * Math.cos(w * t + phase0);
        v = -A * w * Math.sin(w * t + phase0);
        t = duration;
        x = A * Math.cos(w * t + phase0);
        v = -A * w * Math.sin(w * t + phase0);
        return { x: x, v: v, w: w, T: 2 * Math.PI / w };
      }

      var T = 2 * Math.PI / Math.sqrt(10 / 1);
      var onePeriod = simulate(T, {});
      var twoPeriod = simulate(2 * T, {});
      var halfPeriod = simulate(T / 2, {});

      var k2T = 2 * Math.PI / Math.sqrt(20 / 1);
      var k2Case = simulate(k2T, { k: 20 });

      var amp2 = simulate(T, { amplitude: 2 });

      return [
        {
          name: "周期解析参考",
          pass: Number.isFinite(T),
          expected: "有限周期",
          actual: T,
          tolerance: "finite"
        },
        {
          name: "一个周期后回到起点",
          pass: Math.abs(onePeriod.x - 1) < 0.001,
          expected: 1,
          actual: onePeriod.x,
          tolerance: 0.001
        },
        {
          name: "一个周期后速度归零",
          pass: Math.abs(onePeriod.v) < 0.01,
          expected: 0,
          actual: onePeriod.v,
          tolerance: 0.01
        },
        {
          name: "半个周期位移反向",
          pass: Math.abs(halfPeriod.x - (-1)) < 0.001,
          expected: -1,
          actual: halfPeriod.x,
          tolerance: 0.001
        },
        {
          name: "两个周期后回到起点",
          pass: Math.abs(twoPeriod.x - 1) < 0.001,
          expected: 1,
          actual: twoPeriod.x,
          tolerance: 0.001
        },
        {
          name: "劲度系数增大周期减小",
          pass: k2T < T,
          expected: "T(k=20) < T(k=10)",
          actual: k2T + " < " + T,
          tolerance: "strict"
        },
        {
          name: "振幅加倍位移加倍",
          pass: Math.abs(amp2.x - 2) < 0.001,
          expected: 2,
          actual: amp2.x,
          tolerance: 0.001
        },
        {
          name: "平衡位置速度最大",
          pass: Math.abs(simulate(T / 4, {}).v + Math.sqrt(10)) < 0.01,
          expected: -Math.sqrt(10),
          actual: simulate(T / 4, {}).v,
          tolerance: 0.01
        }
      ];
    }

    function bindControls() {
      elements.startBtn.addEventListener("click", start);
      elements.pauseBtn.addEventListener("click", pause);
      elements.resetBtn.addEventListener("click", reset);
      elements.amplitudeInput.addEventListener("input", function () {
        setParameters({ amplitude: elements.amplitudeInput.value, k: state.k });
      });
      elements.kInput.addEventListener("input", function () {
        setParameters({ amplitude: state.amplitude, k: elements.kInput.value });
      });
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      var dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    window.simulation = {
      init: init,
      start: start,
      pause: pause,
      reset: reset,
      update: update,
      render: render,
      setParameters: setParameters,
      getState: getState,
      getReadouts: getReadouts,
      runModelChecks: runModelChecks
    };

    init();
  })();
  </script>
</body>
</html>
