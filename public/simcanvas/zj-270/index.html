  <style>

<body>
  <div class="app" data-layout="visualization-first" data-model-tier="analytic">
    <header class="header" data-region="header">
      <div>
        <h1>自然常数 e 的诞生</h1>
        <p>增长的极限 · The Limit of Growth</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
    </header>

    <div class="stage-wrap">
      <canvas id="scene" data-region="stage" aria-label="自然常数 e 的诞生可视化"></canvas>
      <aside class="overlay-panel">
        <section class="evidence" data-region="evidence" aria-label="实时数值">
          <div class="evidence-title">实时读数</div>
          <div class="readout-grid">
            <div class="metric accent">
              <small>(1+1/n)^n</small>
              <strong id="valueReadout">2.71457</strong>
            </div>
            <div class="metric warn">
              <small>e − 值</small>
              <strong id="gapReadout">0.00371</strong>
            </div>
            <div class="metric">
              <small>分期数 n</small>
              <strong id="nReadout">365</strong>
            </div>
            <div class="metric">
              <small>极限 e</small>
              <strong>2.71828</strong>
            </div>
          </div>
        </section>
        <section class="insight" data-region="insight" aria-label="观察提示">
          <small>观察</small>
          <p id="insightText">拖动滑块增大 n，数值从下方逼近 e，但永不触及。</p>
        </section>
      </aside>
    </div>

    <section class="controls" data-region="controls" aria-label="模拟控件">
      <div class="actions">
        <button id="playBtn" class="primary" type="button">▶ 播放</button>
        <button id="resetBtn" type="button">↺ 重置</button>
      </div>
      <div class="slider-group">
        <label class="slider-label" for="nSlider">
          <span>复利分期数 n</span>
          <span class="val" id="nDisplay">365</span>
        </label>
        <input id="nSlider" type="range" min="1" max="10000" step="1" value="365" aria-label="复利分期数">
      </div>
      <div class="hint">拖动滑块或点击播放，观察数字逐位稳定</div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";

    const E_CONST = Math.E;
    const parameterSchema = [
      { key: "n", label: "复利分期数", type: "slider", min: 1, max: 10000, step: 1, default: 365, unit: "" }
    ];

    const state = {
      running: false,
      n: 365,
      autoT: 0,
      autoDir: 1,
      lastTs: null,
      introT: 0,
      manualPulse: 0,
      history: [],
      glowPhase: 0
    };

    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    let W = 0, H = 0, DPR = 1;

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      const rect = canvas.getBoundingClientRect();
      W = rect.width;
      H = rect.height;
      canvas.width = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    function computeValue(n) {
      const ni = Math.max(1, Math.floor(n + 0.5));
      return Math.pow(1 + 1 / ni, ni);
    }

    function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
    function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

    function getLayout() {
      const isNarrow = W < 760;
      const pad = isNarrow ? 24 : 48;
      const innerW = W - pad * 2;
      const innerH = H - pad * 2;

      if (isNarrow) {
        const numH = Math.min(innerH * 0.42, 200);
        return {
          isNarrow: true,
          pad,
          number: { x: pad, y: pad + 10, w: innerW, h: numH },
          chart: { x: pad, y: pad + numH + 24, w: innerW, h: innerH - numH - 24 },
          title: { x: W / 2, y: pad + 4 }
        };
      }
      const numW = innerW * 0.46;
      return {
        isNarrow: false,
        pad,
        number: { x: pad, y: pad + 10, w: numW, h: innerH - 10 },
        chart: { x: pad + numW + 24, y: pad + 10, w: innerW - numW - 24, h: innerH - 10 },
        title: { x: W / 2, y: pad + 4 }
      };
    }

    function drawBackground() {
      const g1 = ctx.createRadialGradient(W * 0.3, H * 0.2, 0, W * 0.3, H * 0.2, W * 0.7);
      g1.addColorStop(0, "#0c1428");
      g1.addColorStop(0.5, "#070b18");
      g1.addColorStop(1, "#03050c");
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, W, H);

      const g2 = ctx.createRadialGradient(W * 0.8, H * 0.85, 0, W * 0.8, H * 0.85, W * 0.5);
      g2.addColorStop(0, "rgba(15, 30, 55, 0.5)");
      g2.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = g2;
      ctx.fillRect(0, 0, W, H);

      const g3 = ctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, W * 0.4);
      g3.addColorStop(0, "rgba(93, 217, 200, 0.025)");
      g3.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = g3;
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = "rgba(93, 217, 200, 0.06)";
      ctx.lineWidth = 1;
      const gridSize = 48;
      ctx.beginPath();
      for (let x = 0; x < W; x += gridSize) {
        ctx.moveTo(x + 0.5, 0);
        ctx.lineTo(x + 0.5, H);
      }
      for (let y = 0; y < H; y += gridSize) {
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(W, y + 0.5);
      }
      ctx.stroke();
    }

    function drawTitle(layout, alpha) {
      if (alpha <= 0.01) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const cx = layout.isNarrow ? W / 2 : layout.number.x + layout.number.w / 2;
      const cy = layout.isNarrow ? layout.title.y + 40 : H * 0.32;

      ctx.font = `300 ${layout.isNarrow ? 16 : 22}px ui-sans-serif, system-ui, sans-serif`;
      ctx.fillStyle = "rgba(232, 238, 252, 0.45)";
      ctx.fillText("自然常数 e 的诞生", cx, cy - 28);

      ctx.font = `200 ${layout.isNarrow ? 11 : 13}px ui-sans-serif, system-ui, sans-serif`;
      ctx.fillStyle = "rgba(107, 122, 153, 0.7)";
      ctx.fillText("增长的极限 · The Limit of Growth", cx, cy);

      ctx.font = `400 ${layout.isNarrow ? 20 : 28}px ui-monospace, "SF Mono", Consolas, monospace`;
      ctx.fillStyle = "rgba(93, 217, 200, 0.85)";
      ctx.fillText("e = lim (1 + 1/n)^n", cx, cy + 36);

      ctx.font = `300 ${layout.isNarrow ? 11 : 13}px ui-sans-serif, system-ui, sans-serif`;
      ctx.fillStyle = "rgba(107, 122, 153, 0.6)";
      ctx.fillText("n → ∞", cx, cy + 60);

      ctx.restore();
    }

    function drawNumberDisplay(layout, value, n, glowStrength) {
      const r = layout.number;
      ctx.save();

      ctx.strokeStyle = "rgba(93, 217, 200, 0.08)";
      ctx.lineWidth = 1;
      ctx.strokeRect(r.x, r.y, r.w, r.h);

      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.font = `400 12px ui-sans-serif, system-ui, sans-serif`;
      ctx.fillStyle = "rgba(107, 122, 153, 0.7)";
      ctx.fillText("(1 + 1/n)^n", r.x + 4, r.y + 4);

      ctx.textAlign = "right";
      ctx.fillStyle = "rgba(93, 217, 200, 0.6)";
      ctx.font = `500 12px ui-monospace, monospace`;
      ctx.fillText(`n = ${n.toLocaleString()}`, r.x + r.w - 4, r.y + 4);

      const cx = r.x + r.w / 2;
      const cy = r.y + r.h / 2 + 8;
      const fontSize = Math.min(r.w * 0.22, r.h * 0.32, layout.isNarrow ? 56 : 80);
      ctx.font = `300 ${fontSize}px ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const valStr = value.toFixed(5);

      if (glowStrength > 0.05) {
        ctx.save();
        ctx.globalAlpha = glowStrength * 0.35;
        ctx.fillStyle = "rgba(240, 180, 65, 0.25)";
        for (let i = 0; i < 3; i++) {
          ctx.font = `300 ${fontSize + (3 - i) * 2}px ui-monospace, monospace`;
          ctx.fillText(valStr, cx, cy);
        }
        ctx.restore();
      }

      ctx.fillStyle = "rgba(93, 217, 200, 0.15)";
      ctx.fillText(valStr, cx, cy);
      ctx.fillStyle = glowStrength > 0.5 ? "#f5d68a" : "#e8eefc";
      ctx.fillText(valStr, cx, cy);

      const delta = E_CONST - value;
      const deltaStr = `e - value = ${delta >= 0 ? delta.toFixed(5) : "0.00000"}`;
      ctx.font = `400 ${layout.isNarrow ? 11 : 13}px ui-monospace, monospace`;
      ctx.fillStyle = "rgba(107, 122, 153, 0.8)";
      ctx.fillText(deltaStr, cx, cy + fontSize * 0.65);

      ctx.font = `300 ${layout.isNarrow ? 10 : 11}px ui-sans-serif, system-ui, sans-serif`;
      ctx.fillStyle = "rgba(240, 180, 65, 0.5)";
      ctx.fillText("极限 e ≈ 2.71828", cx, cy + fontSize * 0.65 + 20);

      ctx.restore();
    }

    function logScaleX(n, chart) {
      const minLog = 0;
      const maxLog = Math.log(10000);
      const t = (Math.log(Math.max(1, n)) - minLog) / (maxLog - minLog);
      return chart.x + chart.xPad + t * chart.plotW;
    }

    function valueScaleY(v, chart) {
      const minV = 1.8;
      const maxV = 2.8;
      const t = (v - minV) / (maxV - minV);
      return chart.y + chart.h - chart.yPad - t * chart.plotH;
    }

    function drawChart(layout, currentN, currentValue, glowStrength) {
      const r = layout.chart;
      ctx.save();

      ctx.strokeStyle = "rgba(93, 217, 200, 0.08)";
      ctx.lineWidth = 1;
      ctx.strokeRect(r.x, r.y, r.w, r.h);

      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.font = `400 12px ui-sans-serif, system-ui, sans-serif`;
      ctx.fillStyle = "rgba(107, 122, 153, 0.7)";
      ctx.fillText("数值随 n 的收敛", r.x + 4, r.y + 4);

      const chart = {
        x: r.x, y: r.y, w: r.w, h: r.h,
        xPad: 44, yPad: 28,
        plotW: r.w - 44 - 16,
        plotH: r.h - 28 - 24
      };

      ctx.strokeStyle = "rgba(93, 217, 200, 0.05)";
      ctx.lineWidth = 1;
      ctx.font = `400 10px ui-monospace, monospace`;
      ctx.fillStyle = "rgba(107, 122, 153, 0.5)";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      const yTicks = [2.0, 2.25, 2.5, 2.71828, 2.75];
      for (const v of yTicks) {
        const y = valueScaleY(v, chart);
        if (y < chart.y + chart.yPad || y > chart.y + chart.h - chart.yPad) continue;
        ctx.beginPath();
        ctx.moveTo(chart.x + chart.xPad, y);
        ctx.lineTo(chart.x + chart.w - 16, y);
        ctx.stroke();
        const label = v === 2.71828 ? "e" : v.toFixed(2);
        ctx.fillText(label, chart.x + chart.xPad - 6, y);
      }

      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      const xTicks = [1, 10, 100, 1000, 10000];
      for (const n of xTicks) {
        const x = logScaleX(n, chart);
        ctx.beginPath();
        ctx.moveTo(x, chart.y + chart.yPad);
        ctx.lineTo(x, chart.y + chart.h - chart.yPad);
        ctx.strokeStyle = "rgba(93, 217, 200, 0.04)";
        ctx.stroke();
        ctx.fillStyle = "rgba(107, 122, 153, 0.5)";
        ctx.fillText(n.toString(), x, chart.y + chart.h - chart.yPad + 4);
      }

      ctx.fillStyle = "rgba(107, 122, 153, 0.6)";
      ctx.font = `300 10px ui-sans-serif, system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText("n (对数刻度)", chart.x + chart.xPad + chart.plotW / 2, chart.y + chart.h - 8);

      ctx.save();
      ctx.translate(chart.x + 12, chart.y + chart.yPad + chart.plotH / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText("数值", 0, 0);
      ctx.restore();

      const eY = valueScaleY(E_CONST, chart);
      const linePath = () => {
        ctx.beginPath();
        ctx.moveTo(chart.x + chart.xPad, eY);
        ctx.lineTo(chart.x + chart.w - 16, eY);
        ctx.stroke();
      };
      ctx.strokeStyle = "rgba(240, 180, 65, 0.15)";
      ctx.lineWidth = 6;
      ctx.setLineDash([]);
      linePath();
      ctx.strokeStyle = "rgba(240, 180, 65, 0.7)";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 6]);
      linePath();
      ctx.setLineDash([]);

      ctx.fillStyle = "rgba(240, 180, 65, 0.85)";
      ctx.font = `500 12px ui-monospace, monospace`;
      ctx.textAlign = "left";
      ctx.textBaseline = "bottom";
      ctx.fillText("e = 2.71828", chart.x + chart.w - 16 - 100, eY - 4);

      const samples = 200;
      const points = [];
      for (let i = 0; i <= samples; i++) {
        const t = i / samples;
        const n = Math.pow(10, t * 4);
        const v = computeValue(n);
        points.push({ x: logScaleX(n, chart), y: valueScaleY(v, chart), n, v });
      }

      const curvePath = () => {
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.stroke();
      };
      ctx.strokeStyle = "rgba(93, 217, 200, 0.12)";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      curvePath();
      ctx.strokeStyle = "rgba(93, 217, 200, 0.9)";
      ctx.lineWidth = 2;
      curvePath();

      const curX = logScaleX(currentN, chart);
      const curY = valueScaleY(currentValue, chart);

      if (glowStrength > 0.1) {
        ctx.fillStyle = `rgba(240, 180, 65, ${glowStrength * 0.2})`;
        ctx.beginPath();
        ctx.arc(curX, curY, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(curX, curY, 11, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.strokeStyle = "rgba(93, 217, 200, 0.3)";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(curX, curY, 8, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = glowStrength > 0.5 ? "#f5d68a" : "#5dd9c8";
      ctx.beginPath();
      ctx.arc(curX, curY, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(93, 217, 200, 0.15)";
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 4]);
      ctx.beginPath();
      ctx.moveTo(curX, chart.y + chart.yPad);
      ctx.lineTo(curX, curY);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.restore();
    }

    function drawEndingCaption(layout, alpha) {
      if (alpha <= 0.01) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const cx = layout.isNarrow ? W / 2 : layout.number.x + layout.number.w / 2;
      const cy = layout.isNarrow ? layout.chart.y - 16 : layout.number.y + layout.number.h - 24;

      ctx.font = `300 ${layout.isNarrow ? 12 : 15}px ui-sans-serif, system-ui, sans-serif`;
      ctx.fillStyle = "rgba(240, 180, 65, 0.85)";
      ctx.fillText("增长不断分割自己，极限就是自然常数 e", cx, cy);

      ctx.font = `200 ${layout.isNarrow ? 10 : 12}px ui-monospace, monospace`;
      ctx.fillStyle = "rgba(240, 180, 65, 0.5)";
      ctx.fillText("e ≈ 2.71828", cx, cy + 20);

      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, W, H);
      drawBackground();

      const layout = getLayout();
      const value = computeValue(state.n);
      const gap = E_CONST - value;
      const glowStrength = state.n >= 1000 ? clamp((1000 - gap * 10000) / 1000, 0, 1) * clamp((state.n - 500) / 500, 0, 1) : 0;

      if (state.introT < 2) {
        const introAlpha = state.introT < 1.8 ? 1 : (2 - state.introT) / 0.2;
        drawTitle(layout, introAlpha);
        if (state.introT < 1.8) return;
      }

      drawNumberDisplay(layout, value, state.n, glowStrength);
      drawChart(layout, state.n, value, glowStrength);

      const captionAlpha = clamp((state.n - 800) / 400, 0, 1);
      drawEndingCaption(layout, captionAlpha);

      updateReadouts(value, gap);
    }

    function updateReadouts(value, gap) {
      const valueEl = document.getElementById("valueReadout");
      const gapEl = document.getElementById("gapReadout");
      const nEl = document.getElementById("nReadout");
      const insightEl = document.getElementById("insightText");
      if (valueEl) valueEl.textContent = value.toFixed(5);
      if (gapEl) gapEl.textContent = gap >= 0 ? gap.toFixed(5) : "0.00000";
      if (nEl) nEl.textContent = state.n.toLocaleString();
      if (insightEl) {
        if (state.n < 10) {
          insightEl.textContent = "n 很小时数值远低于 e；增大 n 看它如何攀升。";
        } else if (state.n < 100) {
          insightEl.textContent = "数值在快速上升，每一步都在逼近 e。";
        } else if (state.n < 1000) {
          insightEl.textContent = "增速放缓——这是收敛的信号，但差距仍可见。";
        } else if (state.n < 5000) {
          insightEl.textContent = "前四位已稳定为 2.7182…，继续分割收益越来越小。";
        } else {
          insightEl.textContent = "增长不断分割自己，极限就是自然常数 e。";
        }
      }
    }

    function update(dt) {
      state.introT = Math.min(2, state.introT + dt);

      if (state.manualPulse > 0) {
        state.manualPulse = Math.max(0, state.manualPulse - dt);
      }

      if (state.running && state.introT >= 2) {
        state.autoT += dt * state.autoDir;
        if (state.autoT > 8) { state.autoT = 8; state.autoDir = -1; }
        if (state.autoT < 0) { state.autoT = 0; state.autoDir = 1; }

        const t = state.autoT / 8;
        const eased = easeInOutCubic(t);
        state.n = Math.max(1, Math.floor(Math.pow(10, eased * 4)));
        syncSlider();
      }
    }

    function syncSlider() {
      const slider = document.getElementById("nSlider");
      const display = document.getElementById("nDisplay");
      slider.value = String(state.n);
      display.textContent = state.n.toLocaleString();
      const pct = ((state.n - 1) / 9999) * 100;
      slider.style.setProperty("--fill", pct + "%");
    }

    function start() {
      state.running = true;
      const btn = document.getElementById("playBtn");
      btn.textContent = "⏸ 暂停";
      btn.setAttribute("aria-pressed", "true");
      const statusEl = document.getElementById("status");
      if (statusEl) statusEl.textContent = "运行中";
    }
    function pause() {
      state.running = false;
      const btn = document.getElementById("playBtn");
      btn.textContent = "▶ 播放";
      btn.setAttribute("aria-pressed", "false");
      const statusEl = document.getElementById("status");
      if (statusEl) statusEl.textContent = "已暂停";
    }
    function togglePlay() { state.running ? pause() : start(); }
    function reset() {
      pause();
      state.autoT = 0;
      state.autoDir = 1;
      state.introT = 0;
      setParameters({ n: 365 });
    }
    function setParameters(values) {
      const def = parameterSchema[0];
      state.n = clamp(Math.floor(Number(values.n) || def.default), def.min, def.max);
      syncSlider();
      state.manualPulse = 0.3;
    }
    function getState() {
      return { ...state, value: computeValue(state.n), e: E_CONST };
    }
    function getReadouts() {
      return { n: state.n, value: computeValue(state.n), e: E_CONST };
    }
    function runModelChecks() {
      const cases = [
        { n: 1, expected: 2, tol: 1e-9 },
        { n: 2, expected: 2.25, tol: 1e-9 },
        { n: 12, expected: Math.pow(1 + 1/12, 12), tol: 1e-9 },
        { n: 365, expected: Math.pow(1 + 1/365, 365), tol: 1e-9 },
        { n: 10000, expected: Math.pow(1 + 1/10000, 10000), tol: 1e-9 }
      ];
      return cases.map(c => {
        const actual = computeValue(c.n);
        const err = Math.abs(actual - c.expected);
        return {
          name: `n=${c.n}`,
          pass: err < c.tol,
          expected: c.expected,
          actual: actual,
          tolerance: c.tol
        };
      }).concat([
        {
          name: "monotonic increase",
          pass: computeValue(100) > computeValue(10) && computeValue(1000) > computeValue(100),
          expected: "value increases with n",
          actual: `${computeValue(10)} < ${computeValue(100)} < ${computeValue(1000)}`,
          tolerance: "strict"
        },
        {
          name: "approaches e from below",
          pass: computeValue(10000) < E_CONST && computeValue(10000) > 2.7,
          expected: `value < ${E_CONST}`,
          actual: computeValue(10000),
          tolerance: "strict"
        },
        {
          name: "gap shrinks with n",
          pass: (E_CONST - computeValue(100)) > (E_CONST - computeValue(1000)),
          expected: "gap(n=100) > gap(n=1000)",
          actual: `${E_CONST - computeValue(100)} > ${E_CONST - computeValue(1000)}`,
          tolerance: "strict"
        }
      ]);
    }

    function bindControls() {
      document.getElementById("playBtn").addEventListener("click", togglePlay);
      document.getElementById("resetBtn").addEventListener("click", reset);
      const slider = document.getElementById("nSlider");
      slider.addEventListener("input", () => {
        pause();
        setParameters({ n: slider.value });
      });
      window.addEventListener("resize", () => { resize(); });
    }

    function frame(ts) {
      if (state.lastTs === null) state.lastTs = ts;
      const dt = Math.min(0.05, (ts - state.lastTs) / 1000);
      state.lastTs = ts;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    function init() {
      resize();
      bindControls();
      syncSlider();
      requestAnimationFrame(frame);
    }

    window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
    init();
  })();
  </script>
</body>
</html>
