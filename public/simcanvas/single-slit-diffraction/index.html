<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单缝夫琅禾费衍射</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #050810;
  --sim-surface: #0a0f1c;
  --sim-surface-soft: #0e1424;
  --sim-text: #e8eefc;
  --sim-muted: #6b7a99;
  --sim-border: rgba(120,140,180,0.10);
  --sim-grid: rgba(80,100,140,0.06);
  --sim-accent: #4a9eff;
  --sim-accent-deep: #2a6fd6;
  --sim-accent-soft: rgba(74,158,255,0.12);
  --sim-positive: #4a9eff;
  --sim-warning: #f0a040;
  --sim-danger: #e0506a;
  --sim-radius-sm: 8px;
  --sim-radius-md: 12px;
  --sim-radius-lg: 16px;
  --sim-shadow: 0 8px 32px rgba(0,0,0,0.4);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: var(--sim-bg);
  color: var(--sim-text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.app {
  width: 100vw; height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 0;
  background: radial-gradient(ellipse at 50% 40%, #0b1220 0%, #050810 70%);
}
.header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 28px 6px;
}
.header h1 {
  font-size: 15px; font-weight: 500;
  letter-spacing: 0.08em;
  color: var(--sim-text);
  opacity: 0.92;
}
.status {
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--sim-muted);
  text-transform: uppercase;
}
.status::before {
  content: ""; display: inline-block;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--sim-accent);
  margin-right: 8px;
  box-shadow: 0 0 8px var(--sim-accent);
  vertical-align: middle;
}
.main {
  position: relative;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(260px, 320px);
  gap: 0;
  padding: 4px 28px;
}
.stage-wrap {
  position: relative;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
#scene {
  width: 100%; height: 100%;
  max-width: 1400px;
  display: block;
}
.side {
  min-height: 0;
  display: grid;
  grid-template-rows: auto auto;
  gap: 12px;
  padding: 4px 0 4px 20px;
  align-content: start;
}
.panel {
  background: var(--sim-surface);
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-md);
  padding: 14px 16px;
}
.panel-head {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 12px; margin-bottom: 10px;
}
.panel-head h2 {
  margin: 0; font-size: 11px; font-weight: 600;
  letter-spacing: 0.12em; color: var(--sim-muted);
  text-transform: uppercase;
}
.readout-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.metric {
  padding: 10px 12px;
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-sm);
  background: var(--sim-surface-soft);
}
.metric small {
  display: block; margin-bottom: 4px;
  color: var(--sim-muted);
  font-size: 10px; letter-spacing: 0.08em;
  text-transform: uppercase;
}
.metric strong {
  font-size: 1.15rem; letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
  color: var(--sim-text);
}
.insight {
  border-left: 3px solid var(--sim-warning);
  border-radius: 0 var(--sim-radius-sm) var(--sim-radius-sm) 0;
  background: rgba(240,160,64,0.06);
  padding: 10px 12px;
  color: #f0a040;
  font-size: 12px; font-weight: 600;
  line-height: 1.5;
  margin-bottom: 10px;
}
.model-note p {
  margin: 0;
  color: var(--sim-muted);
  line-height: 1.55;
  font-size: 11.5px;
}
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 36px;
  padding: 14px 28px 18px;
  border-top: 1px solid var(--sim-border);
  background: rgba(8,12,22,0.6);
  backdrop-filter: blur(8px);
}
.control-group {
  display: flex; align-items: center; gap: 14px;
}
.control-label {
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.1em;
  color: var(--sim-muted);
  text-transform: uppercase;
}
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 200px; height: 3px;
  background: rgba(120,140,180,0.18);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--sim-text);
  box-shadow: 0 0 12px rgba(74,158,255,0.5), 0 2px 6px rgba(0,0,0,0.4);
  cursor: pointer;
  transition: transform 0.15s;
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px; border: none;
  border-radius: 50%;
  background: var(--sim-text);
  box-shadow: 0 0 12px rgba(74,158,255,0.5);
  cursor: pointer;
}
.control-value {
  font-size: 13px; font-weight: 600;
  color: var(--sim-text);
  font-variant-numeric: tabular-nums;
  min-width: 56px;
}
.wavelength-group {
  display: flex; gap: 4px;
  padding: 3px;
  background: rgba(120,140,180,0.06);
  border-radius: 999px;
  border: 1px solid var(--sim-border);
}
.wavelength-btn {
  border: none;
  padding: 7px 18px;
  border-radius: 999px;
  font-size: 12px; font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--sim-muted);
  background: transparent;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.wavelength-btn:hover { color: var(--sim-text); }
.wavelength-btn.active {
  color: #fff;
  box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
.wavelength-btn[data-lambda="650"].active { background: linear-gradient(135deg, #e84050, #c0202a); }
.wavelength-btn[data-lambda="532"].active { background: linear-gradient(135deg, #40d870, #28a050); }
.wavelength-btn[data-lambda="450"].active { background: linear-gradient(135deg, #4080ff, #2050d0); }
.action-group { display: flex; gap: 8px; }
.action-btn {
  border: 1px solid var(--sim-border);
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 12px; font-weight: 600;
  color: var(--sim-text);
  background: rgba(120,140,180,0.04);
  cursor: pointer;
  transition: all 0.2s;
  display: flex; align-items: center; gap: 6px;
}
.action-btn:hover { background: rgba(120,140,180,0.12); border-color: rgba(120,140,180,0.25); }
.action-btn:active { transform: scale(0.96); }
.action-btn.primary {
  border-color: rgba(74,158,255,0.4);
  background: rgba(74,158,255,0.12);
  color: var(--sim-accent);
}
.action-btn.primary:hover { background: rgba(74,158,255,0.2); }
@media (max-width: 980px) {
  .main { grid-template-columns: 1fr; padding: 4px 16px; }
  .side { padding: 4px 0; grid-template-columns: 1fr 1fr; }
}
@media (max-width: 760px) {
  .controls { flex-wrap: wrap; gap: 16px; padding: 12px; }
  input[type="range"] { width: 140px; }
  .header { padding: 10px 16px 4px; }
  .main { padding: 4px 12px; }
  .side { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<div class="app" data-layout="visualization-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <h1>单缝夫琅禾费衍射 · Fraunhofer Diffraction</h1>
    <div id="status" class="status" role="status" aria-live="polite">就绪</div>
  </header>
  <main class="main">
    <section class="stage-wrap" data-region="stage" aria-labelledby="scene-title">
      <svg id="scene" viewBox="0 0 1200 680" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="scene-title scene-desc">
        <title id="scene-title">单缝衍射示意与光强分布</title>
        <desc id="scene-desc">展示光穿过单缝后在屏幕上形成的衍射条纹及对应的光强分布曲线。</desc>
        <defs>
          <linearGradient id="slitGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1a2238"/>
            <stop offset="0.5" stop-color="#0a0f1c"/>
            <stop offset="1" stop-color="#1a2238"/>
          </linearGradient>
        </defs>
        <g id="layerSetup"></g>
        <g id="layerSlit"></g>
        <g id="layerRays"></g>
        <g id="layerScreen"></g>
        <g id="layerCurve"></g>
        <g id="layerLabels"></g>
      </svg>
    </section>
    <aside class="side">
      <section class="panel" data-region="evidence" aria-label="实时读数">
        <div class="panel-head"><h2>读数 Readings</h2></div>
        <div class="readout-grid">
          <div class="metric"><small>缝宽 a</small><strong id="readoutSlit">0.20 mm</strong></div>
          <div class="metric"><small>波长 λ</small><strong id="readoutLambda">650 nm</strong></div>
          <div class="metric"><small>第一极小 x₁</small><strong id="readoutX1">3.25 mm</strong></div>
          <div class="metric"><small>主极大全宽</small><strong id="readoutCentral">6.50 mm</strong></div>
        </div>
      </section>
      <section class="panel model-note" data-region="insight" aria-label="模型说明">
        <div class="panel-head"><h2>模型 Model</h2></div>
        <div class="insight" id="insightText">缝越窄、波长越长，条纹越宽。</div>
        <p>夫琅禾费远场近似：I(x) = I₀·[sin(β)/β]²，β = πa·sin(θ)/λ，x ≈ L·tan(θ)。第一极小满足 a·sin(θ) = λ。</p>
      </section>
    </aside>
  </main>
  <section class="controls" data-region="controls" aria-label="参数控制">
    <div class="control-group">
      <label class="control-label" for="slitWidthInput">缝宽 a</label>
      <input id="slitWidthInput" type="range" min="0.05" max="0.50" step="0.01" value="0.20" aria-label="缝宽 a (毫米)">
      <span class="control-value" id="slitWidthValue">0.20 mm</span>
    </div>
    <div class="control-group">
      <span class="control-label">波长 λ</span>
      <div class="wavelength-group" role="radiogroup" aria-label="波长选择">
        <button class="wavelength-btn active" data-lambda="650" data-color="#ff5060" role="radio" aria-checked="true">红 650</button>
        <button class="wavelength-btn" data-lambda="532" data-color="#50e080" role="radio" aria-checked="false">绿 532</button>
        <button class="wavelength-btn" data-lambda="450" data-color="#5090ff" role="radio" aria-checked="false">蓝 450</button>
      </div>
    </div>
    <div class="action-group">
      <button id="playBtn" class="action-btn primary" type="button">▶ 播放</button>
      <button id="resetBtn" class="action-btn" type="button">重置</button>
    </div>
  </section>
</div>
<script>
(() => {
  "use strict";

  // ── 物理常量与参数 ──
  const L = 1.0;              // 缝到屏距离 (m)
  const SCREEN_WIDTH = 0.040; // 屏幕可视半宽 (m) → ±40mm
  const WAVELENGTHS = { 650: "#ff5060", 532: "#50e080", 450: "#5090ff" };
  const WAVELENGTH_NAMES = { 650: "红", 532: "绿", 450: "蓝" };

  // ── 视觉布局常量 (SVG 坐标) ──
  const VB_W = 1200, VB_H = 680;
  const CX = 600;
  const SETUP_Y1 = 40, SETUP_Y2 = 150;
  const SLIT_X = 200;
  const SCREEN_X = 1000;
  const SCREEN_Y1 = 180, SCREEN_Y2 = 360;
  const CURVE_Y1 = 400, CURVE_Y2 = 620;
  const CURVE_X1 = 120, CURVE_X2 = 1080;

  // ── 状态 ──
  const state = {
    running: false,
    animTime: 0,
    slitWidth: 0.00020,   // 0.20 mm → m
    wavelength: 650e-9,  // m
    color: "#ff5060",
    phase: 0,
    lastTimestamp: null
  };

  // ── DOM ──
  const $ = (s) => document.querySelector(s);
  const els = {
    status: $("#status"),
    slitWidthInput: $("#slitWidthInput"),
    slitWidthValue: $("#slitWidthValue"),
    readoutSlit: $("#readoutSlit"),
    readoutLambda: $("#readoutLambda"),
    readoutX1: $("#readoutX1"),
    readoutCentral: $("#readoutCentral"),
    insightText: $("#insightText"),
    playBtn: $("#playBtn"),
    resetBtn: $("#resetBtn"),
    layerSetup: $("#layerSetup"),
    layerSlit: $("#layerSlit"),
    layerRays: $("#layerRays"),
    layerScreen: $("#layerScreen"),
    layerCurve: $("#layerCurve"),
    layerLabels: $("#layerLabels")
  };

  // ── 物理模型：单缝夫琅禾费衍射光强 ──
  // I(θ) = I₀ · [sin(β)/β]²,  β = πa·sin(θ)/λ
  // 远场近似: x ≈ L·tan(θ) ≈ L·sin(θ) (小角)
  function intensity(x) {
    const sinTheta = x / L;
    const beta = Math.PI * state.slitWidth * sinTheta / state.wavelength;
    if (Math.abs(beta) < 1e-10) return 1.0;
    const s = Math.sin(beta) / beta;
    return s * s;
  }

  // ── 坐标映射 ──
  function xScreenToSvg(x) {
    return CX + (x / SCREEN_WIDTH) * (CURVE_X2 - CURVE_X1) / 2;
  }
  function intensityToCurveY(I) {
    return CURVE_Y2 - I * (CURVE_Y2 - CURVE_Y1);
  }
  function xScreenToScreenBand(x) {
    return CX + (x / SCREEN_WIDTH) * (SCREEN_X - SLIT_X - 80);
  }

  // ── 渲染：静态装置 ──
  function renderSetup() {
    const setupYMid = (SETUP_Y1 + SETUP_Y2) / 2;
    const slitGapSvg = 10 + (state.slitWidth * 1000 - 0.05) * 30; // 0.05→10px, 0.50→25px

    let html = "";
    // 左侧光源
    html += `<rect x="20" y="${setupYMid - 22}" width="50" height="44" rx="3" fill="url(#slitGrad)" stroke="rgba(120,140,180,0.2)" stroke-width="1"/>`;
    html += `<rect x="70" y="${setupYMid - 3}" width="14" height="6" rx="1" fill="rgba(120,140,180,0.15)"/>`;
    // 光源标签
    html += `<text x="45" y="${setupYMid + 38}" text-anchor="middle" fill="#6b7a99" font-size="10" letter-spacing="1">SOURCE</text>`;
    // 光源发光点
    html += `<circle cx="45" cy="${setupYMid}" r="3" fill="${state.color}" opacity="0.9"/>`;
    html += `<circle cx="45" cy="${setupYMid}" r="7" fill="${state.color}" opacity="0.25"/>`;

    // 缝挡板
    const blockW = 14;
    const blockH = 70;
    html += `<rect x="${SLIT_X - blockW/2}" y="${setupYMid - blockH/2}" width="${blockW}" height="${(blockH - slitGapSvg)/2}" rx="2" fill="url(#slitGrad)" stroke="rgba(120,140,180,0.25)" stroke-width="1"/>`;
    html += `<rect x="${SLIT_X - blockW/2}" y="${setupYMid + slitGapSvg/2}" width="${blockW}" height="${(blockH - slitGapSvg)/2}" rx="2" fill="url(#slitGrad)" stroke="rgba(120,140,180,0.25)" stroke-width="1"/>`;
    // 缝标签
    html += `<text x="${SLIT_X}" y="${setupYMid + blockH/2 + 16}" text-anchor="middle" fill="#6b7a99" font-size="10" letter-spacing="1">SLIT a=${(state.slitWidth*1000).toFixed(2)}mm</text>`;

    // 衍射屏
    html += `<rect x="${SCREEN_X - 4}" y="${SCREEN_Y1 - 6}" width="8" height="${SCREEN_Y2 - SCREEN_Y1 + 12}" rx="2" fill="url(#slitGrad)" stroke="rgba(120,140,180,0.2)" stroke-width="1"/>`;
    html += `<text x="${SCREEN_X}" y="${SCREEN_Y1 - 14}" text-anchor="middle" fill="#6b7a99" font-size="10" letter-spacing="1">SCREEN</text>`;

    // 距离标注 L
    html += `<line x1="${SLIT_X}" y1="${SETUP_Y2 + 8}" x2="${SCREEN_X}" y2="${SETUP_Y2 + 8}" stroke="rgba(120,140,180,0.2)" stroke-width="1" stroke-dasharray="3 4"/>`;
    html += `<line x1="${SLIT_X}" y1="${SETUP_Y2 + 4}" x2="${SLIT_X}" y2="${SETUP_Y2 + 12}" stroke="rgba(120,140,180,0.3)" stroke-width="1"/>`;
    html += `<line x1="${SCREEN_X}" y1="${SETUP_Y2 + 4}" x2="${SCREEN_X}" y2="${SETUP_Y2 + 12}" stroke="rgba(120,140,180,0.3)" stroke-width="1"/>`;
    html += `<text x="${(SLIT_X + SCREEN_X)/2}" y="${SETUP_Y2 + 22}" text-anchor="middle" fill="#6b7a99" font-size="10" letter-spacing="1">L = 1.0 m</text>`;

    els.layerSetup.innerHTML = html;
  }

  // ── 渲染：入射与衍射光线 ──
  function renderRays() {
    const setupYMid = (SETUP_Y1 + SETUP_Y2) / 2;
    const slitGapSvg = 10 + (state.slitWidth * 1000 - 0.05) * 30;
    let html = "";

    // 入射平行光（3条）
    const incOffsets = [-12, 0, 12];
    for (const off of incOffsets) {
      const y = setupYMid + off;
      if (Math.abs(off) > slitGapSvg/2 + 2) {
        // 被挡板挡住，画到挡板
        html += `<line x1="84" y1="${y}" x2="${SLIT_X - 7}" y2="${y}" stroke="${state.color}" stroke-width="1.2" opacity="0.15"/>`;
      } else {
        html += `<line x1="84" y1="${y}" x2="${SLIT_X}" y2="${y}" stroke="${state.color}" stroke-width="1.5" opacity="0.4"/>`;
      }
    }
    // 入射光波动效果
    const phase = state.phase;
    for (let i = 0; i < 4; i++) {
      const t = ((i / 4) + phase) % 1;
      const x = 84 + t * (SLIT_X - 84);
      const op = 0.15 + 0.25 * Math.sin(t * Math.PI);
      html += `<line x1="${x}" y1="${setupYMid - 14}" x2="${x}" y2="${setupYMid + 14}" stroke="${state.color}" stroke-width="1" opacity="${op}"/>`;
    }

    // 衍射发散光束（扇形）
    const numRays = 9;
    const maxSpread = 0.7; // 最大发散角对应的 sin(θ)
    for (let i = 0; i < numRays; i++) {
      const t = (i / (numRays - 1)) - 0.5; // -0.5 ~ 0.5
      const sinTheta = t * maxSpread;
      const xEnd = SLIT_X + (SCREEN_X - SLIT_X) * 0.5;
      const yEnd = setupYMid + sinTheta * (SCREEN_X - SLIT_X) * 0.5;
      // 光强随角度衰减
      const I = intensity(sinTheta * L);
      const op = 0.08 + I * 0.25;
      html += `<line x1="${SLIT_X}" y1="${setupYMid}" x2="${xEnd}" y2="${yEnd}" stroke="${state.color}" stroke-width="1" opacity="${op}"/>`;
    }

    els.layerRays.innerHTML = html;
  }

  // ── 渲染：屏幕条纹带 ──
  function renderScreen() {
    let html = "";
    const bandY1 = SCREEN_Y1;
    const bandH = SCREEN_Y2 - SCREEN_Y1;
    const numSamples = 240;
    const halfRange = SCREEN_WIDTH;
    const bandW = SCREEN_X - SLIT_X - 40;
    const bandX = SLIT_X + 20;

    // 用渐变 stop 模拟条纹
    let stops = "";
    for (let i = 0; i <= numSamples; i++) {
      const t = i / numSamples;
      const x = -halfRange + t * 2 * halfRange;
      const I = intensity(x);
      const svgX = bandX + t * bandW;
      const op = Math.pow(I, 0.7); // gamma 提亮暗部
      stops += `${svgX.toFixed(1)}:${op.toFixed(3)};`;
    }
    const gradId = "bandGrad";
    html += `<defs><linearGradient id="${gradId}" x1="${bandX}" y1="0" x2="${bandX + bandW}" y2="0" gradientUnits="userSpaceOnUse">`;
    const parts = stops.split(";").filter(s => s);
    for (const p of parts) {
      const [x, op] = p.split(":");
      html += `<stop offset="${x}" stop-color="${state.color}" stop-opacity="${op}"/>`;
    }
    html += `</linearGradient></defs>`;
    html += `<rect x="${bandX}" y="${bandY1}" width="${bandW}" height="${bandH}" fill="url(#${gradId})"/>`;

    // 屏幕边框
    html += `<rect x="${bandX}" y="${bandY1}" width="${bandW}" height="${bandH}" fill="none" stroke="rgba(120,140,180,0.15)" stroke-width="1" rx="2"/>`;

    // 中央主极大标注
    html += `<text x="${CX}" y="${bandY1 - 6}" text-anchor="middle" fill="#6b7a99" font-size="10" letter-spacing="1">CENTRAL MAX</text>`;
    html += `<line x1="${CX}" y1="${bandY1 - 2}" x2="${CX}" y2="${bandY1 - 8}" stroke="rgba(120,140,180,0.3)" stroke-width="1"/>`;

    els.layerScreen.innerHTML = html;
  }

  // ── 渲染：光强曲线 ──
  function renderCurve() {
    let html = "";
    const numSamples = 400;
    const halfRange = SCREEN_WIDTH;

    // 坐标轴
    html += `<line x1="${CURVE_X1}" y1="${CURVE_Y2}" x2="${CURVE_X2}" y2="${CURVE_Y2}" stroke="rgba(120,140,180,0.25)" stroke-width="1"/>`;
    html += `<line x1="${CURVE_X1}" y1="${CURVE_Y1}" x2="${CURVE_X1}" y2="${CURVE_Y2}" stroke="rgba(120,140,180,0.25)" stroke-width="1"/>`;
    // 中央竖线
    html += `<line x1="${CX}" y1="${CURVE_Y1}" x2="${CX}" y2="${CURVE_Y2}" stroke="rgba(120,140,180,0.1)" stroke-width="1" stroke-dasharray="2 4"/>`;

    // 网格刻度
    for (let i = -2; i <= 2; i++) {
      if (i === 0) continue;
      const x = i * 0.02;
      const svgX = xScreenToSvg(x);
      html += `<line x1="${svgX}" y1="${CURVE_Y2}" x2="${svgX}" y2="${CURVE_Y2 + 4}" stroke="rgba(120,140,180,0.3)" stroke-width="1"/>`;
      html += `<text x="${svgX}" y="${CURVE_Y2 + 16}" text-anchor="middle" fill="#6b7a99" font-size="9">${(x*1000).toFixed(0)}</text>`;
    }
    // I 轴刻度
    for (let i = 1; i <= 4; i++) {
      const y = CURVE_Y2 - (i/4) * (CURVE_Y2 - CURVE_Y1);
      html += `<line x1="${CURVE_X1 - 4}" y1="${y}" x2="${CURVE_X1}" y2="${y}" stroke="rgba(120,140,180,0.3)" stroke-width="1"/>`;
      html += `<text x="${CURVE_X1 - 8}" y="${y + 3}" text-anchor="end" fill="#6b7a99" font-size="9">${(i/4).toFixed(1)}</text>`;
    }

    // 轴标签
    html += `<text x="${CURVE_X2 + 8}" y="${CURVE_Y2 + 4}" fill="#6b7a99" font-size="11" letter-spacing="1">x / mm</text>`;
    html += `<text x="${CURVE_X1 - 8}" y="${CURVE_Y1 - 6}" text-anchor="end" fill="#6b7a99" font-size="11" letter-spacing="1">I / I₀</text>`;

    // 曲线下方填充（渐变）
    let fillPath = `M ${CURVE_X1} ${CURVE_Y2} `;
    const points = [];
    for (let i = 0; i <= numSamples; i++) {
      const t = i / numSamples;
      const x = -halfRange + t * 2 * halfRange;
      const I = intensity(x);
      const svgX = xScreenToSvg(x);
      const svgY = intensityToCurveY(I);
      points.push(`${svgX.toFixed(1)},${svgY.toFixed(1)}`);
      fillPath += `L ${svgX.toFixed(1)} ${svgY.toFixed(1)} `;
    }
    fillPath += `L ${CURVE_X2} ${CURVE_Y2} Z`;

    // 填充渐变
    html += `<defs><linearGradient id="curveFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${state.color}" stop-opacity="0.25"/><stop offset="1" stop-color="${state.color}" stop-opacity="0.02"/></linearGradient></defs>`;
    html += `<path d="${fillPath}" fill="url(#curveFill)"/>`;

    // 曲线主线
    const polyline = points.join(" ");
    html += `<polyline points="${polyline}" fill="none" stroke="${state.color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="0.95" filter="drop-shadow(0 0 4px ${state.color}88)"/>`;

    // 中央主极大点
    html += `<circle cx="${CX}" cy="${intensityToCurveY(1)}" r="3" fill="${state.color}" opacity="0.9"/>`;
    html += `<circle cx="${CX}" cy="${intensityToCurveY(1)}" r="6" fill="${state.color}" opacity="0.2"/>`;

    els.layerCurve.innerHTML = html;
  }

  // ── 渲染：标签与读数 ──
  function renderLabels() {
    let html = "";
    // 条纹间距信息
    const lambda_nm = state.wavelength * 1e9;
    const a_mm = state.slitWidth * 1000;
    // 第一极小位置
    const x1 = state.wavelength * L / state.slitWidth; // m
    const x1_mm = x1 * 1000;
    // 中央主极大全宽
    const centralWidth_mm = 2 * x1_mm;

    html += `<text x="${CURVE_X1}" y="${CURVE_Y1 - 20}" fill="#6b7a99" font-size="11" letter-spacing="1">INTENSITY DISTRIBUTION  I(x) = I₀ · [sin(β)/β]²</text>`;
    html += `<text x="${CURVE_X2}" y="${CURVE_Y1 - 20}" text-anchor="end" fill="#6b7a99" font-size="11" letter-spacing="1">λ=${lambda_nm.toFixed(0)}nm  a=${a_mm.toFixed(2)}mm</text>`;
    
    // 第一极小标注
    if (x1_mm < 40) {
      const svgX = xScreenToSvg(x1);
      html += `<line x1="${svgX}" y1="${CURVE_Y2 - 4}" x2="${svgX}" y2="${CURVE_Y2 + 4}" stroke="rgba(240,160,64,0.6)" stroke-width="1.5"/>`;
      html += `<text x="${svgX + 6}" y="${CURVE_Y2 - 8}" fill="#f0a040" font-size="10" opacity="0.8">±${x1_mm.toFixed(1)}mm</text>`;
    }

    els.layerLabels.innerHTML = html;
  }

  // ── 渲染：侧栏读数与洞察 ──
  function renderReadouts() {
    const a_mm = state.slitWidth * 1000;
    const lambda_nm = state.wavelength * 1e9;
    const x1_m = state.wavelength * L / state.slitWidth;
    const x1_mm = x1_m * 1000;
    const central_mm = 2 * x1_mm;

    els.readoutSlit.textContent = a_mm.toFixed(2) + " mm";
    els.readoutLambda.textContent = lambda_nm.toFixed(0) + " nm";
    els.readoutX1.textContent = x1_mm.toFixed(2) + " mm";
    els.readoutCentral.textContent = central_mm.toFixed(2) + " mm";

    // 洞察文本：根据当前参数给出定性结论
    const x1_red = 650e-9 * L / state.slitWidth;
    const x1_blue = 450e-9 * L / state.slitWidth;
    const x1_narrow = state.wavelength * L / 0.0001;
    const x1_wide = state.wavelength * L / 0.0004;
    let insight = "缝越窄、波长越长，条纹越宽。";
    if (state.slitWidth <= 0.00012) {
      insight = "缝很窄：条纹显著展宽，衍射效应明显。";
    } else if (state.slitWidth >= 0.00038) {
      insight = "缝较宽：条纹收窄，趋近几何像。";
    } else if (lambda_nm >= 600) {
      insight = "长波长：条纹比短波长时更宽。";
    } else if (lambda_nm <= 480) {
      insight = "短波长：条纹更密，主极大更窄。";
    }
    els.insightText.textContent = insight;
  }

  // ── 主渲染 ──
  function render() {
    renderSetup();
    renderRays();
    renderScreen();
    renderCurve();
    renderLabels();
    renderReadouts();
  }

  // ── 更新 ──
  function update(dt) {
    if (!state.running) return;
    state.animTime += dt;
    state.phase = (state.phase + dt * 0.3) % 1;
  }

  // ── 生命周期 ──
  function start() {
    state.running = true;
    els.status.textContent = "运行中";
    els.playBtn.textContent = "⏸ 暂停";
  }
  function pause() {
    state.running = false;
    els.status.textContent = "已暂停";
    els.playBtn.textContent = "▶ 播放";
  }
  function reset() {
    pause();
    state.animTime = 0;
    state.phase = 0;
    state.slitWidth = 0.00020;
    state.wavelength = 650e-9;
    state.color = "#ff5060";
    els.slitWidthInput.value = "0.20";
    els.slitWidthValue.textContent = "0.20 mm";
    document.querySelectorAll(".wavelength-btn").forEach(b => {
      const isActive = b.dataset.lambda === "650";
      b.classList.toggle("active", isActive);
      b.setAttribute("aria-checked", isActive);
    });
    render();
    els.status.textContent = "就绪";
  }

  // ── 参数设置（统一入口，供 setParameters 钩子调用） ──
  function setSlitWidth(val) {
    setParameters({ slitWidth: val });
  }
  function setWavelength(lambda) {
    setParameters({ wavelength: lambda });
  }
  function setParameters(values) {
    if (values && typeof values.slitWidth !== "undefined") {
      const v = Math.max(0.05, Math.min(0.50, Number(values.slitWidth) || 0.20));
      state.slitWidth = v * 0.001;
      els.slitWidthInput.value = String(v);
      els.slitWidthValue.textContent = v.toFixed(2) + " mm";
    }
    if (values && typeof values.wavelength !== "undefined") {
      const lambda = Number(values.wavelength);
      state.wavelength = lambda * 1e-9;
      state.color = WAVELENGTHS[lambda] || "#ff5060";
      document.querySelectorAll(".wavelength-btn").forEach(b => {
        const isActive = Number(b.dataset.lambda) === lambda;
        b.classList.toggle("active", isActive);
        b.setAttribute("aria-checked", isActive);
      });
    }
    render();
  }

  // ── 读数钩子 ──
  function getReadouts() {
    const x1_m = state.wavelength * L / state.slitWidth;
    return {
      slitWidth_mm: state.slitWidth * 1000,
      wavelength_nm: state.wavelength * 1e9,
      firstMinimum_mm: x1_m * 1000,
      centralWidth_mm: 2 * x1_m * 1000,
      running: state.running,
      animTime: state.animTime
    };
  }

  // ── 模型检查 ──
  function runModelChecks() {
    // 1. 中央主极大 I(0) = 1
    const central = intensity(0);
    // 2. 第一极小位置: a·sin(θ) = λ → x = λL/a
    const a = 0.0002, lambda = 650e-9;
    const x1 = lambda * L / a;
    const I_at_x1 = intensity(x1);
    // 3. 条纹间距与波长正比
    const x1_red = 650e-9 * L / a;
    const x1_blue = 450e-9 * L / a;
    // 4. 条纹间距与缝宽反比
    const x1_narrow = 650e-9 * L / 0.0001;
    const x1_wide = 650e-9 * L / 0.0004;
    // 5. 次极大位置约在 β ≈ 1.43π
    const beta_sub = 1.43 * Math.PI;
    const sinT_sub = beta_sub * lambda / (Math.PI * a);
    const x_sub = sinT_sub * L;
    const I_sub = intensity(x_sub);
    return [
      { name: "中央主极大 I(0)=1", pass: Math.abs(central - 1) < 1e-6, expected: 1, actual: central, tolerance: 1e-6 },
      { name: "第一极小 I≈0", pass: I_at_x1 < 0.001, expected: 0, actual: I_at_x1, tolerance: 0.001 },
      { name: "第一极小位置 x=λL/a", pass: Math.abs(x1 - x1_red) < 1e-6, expected: x1_red, actual: x1, tolerance: 1e-6 },
      { name: "波长越长条纹越宽", pass: x1_red > x1_blue, expected: "x_red > x_blue", actual: `${x1_red} > ${x1_blue}`, tolerance: "strict" },
      { name: "缝越窄条纹越宽", pass: x1_narrow > x1_wide, expected: "x_narrow > x_wide", actual: `${x1_narrow} > ${x1_wide}`, tolerance: "strict" },
      { name: "第一次极大 I≈0.045", pass: Math.abs(I_sub - 0.045) < 0.01, expected: 0.045, actual: I_sub, tolerance: 0.01 }
    ];
  }

  // ── 事件绑定 ──
  function bind() {
    els.slitWidthInput.addEventListener("input", (e) => setSlitWidth(e.target.value));
    document.querySelectorAll(".wavelength-btn").forEach(btn => {
      btn.addEventListener("click", () => setWavelength(Number(btn.dataset.lambda)));
    });
    els.playBtn.addEventListener("click", () => state.running ? pause() : start());
    els.resetBtn.addEventListener("click", reset);
  }

  // ── 主循环 ──
  function frame(ts) {
    if (state.lastTimestamp === null) state.lastTimestamp = ts;
    const dt = Math.min(0.05, (ts - state.lastTimestamp) / 1000);
    state.lastTimestamp = ts;
    update(dt);
    if (state.running) renderRays(); // 只重渲染光线动画
    requestAnimationFrame(frame);
  }

  // ── 初始化 ──
  function init() {
    bind();
    render();
    requestAnimationFrame(frame);
  }

  window.simulation = {
    init, start, pause, reset, update, render,
    setParameters, setSlitWidth, setWavelength,
    getReadouts, runModelChecks,
    getState: () => ({...state})
  };
  init();
})();
</script>
</body>
</html>
