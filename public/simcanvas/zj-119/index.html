<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面镜成像规律对比</title>
<style>
:root {
  color-scheme: light;
  --sim-bg: #eef3f8;
  --sim-surface: #ffffff;
  --sim-surface-soft: #f8fafc;
  --sim-text: #172033;
  --sim-muted: #657188;
  --sim-border: #dfe6ef;
  --sim-grid: #e8edf4;
  --sim-accent: #0f9fba;
  --sim-accent-deep: #08758a;
  --sim-accent-soft: #d9f4f7;
  --sim-positive: #0f9fba;
  --sim-warning: #f59e0b;
  --sim-danger: #dc2626;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
  --sim-incident: #e85d04;
  --sim-reflected: #0f9fba;
  --sim-virtual: #7c3aed;
  --sim-mirror: #475569;
  --sim-axis: #94a3b8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--sim-text);
  background:
    radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
    radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
    var(--sim-bg);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
.app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 14px 18px 12px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 10px; overflow: hidden; }
.header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 48px; }
.header h1 { margin: 0 0 4px; font-size: clamp(1.4rem, 2.2vw, 1.85rem); letter-spacing: -0.035em; line-height: 1; }
.header p { margin: 0; color: var(--sim-muted); font-size: 0.85rem; }
.status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 7px 13px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; font-size: 0.85rem; }
.main { min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
.scene-panel { padding: 12px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; min-height: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.panel-head h2 { margin: 0; font-size: 1rem; }
.panel-head .tag { color: var(--sim-muted); font-size: 0.72rem; font-weight: 600; }
.scene-wrap { min-height: 0; display: flex; }
.scene { width: 100%; height: 100%; min-height: 320px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 14px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); touch-action: none; }
.insight-panel { padding: 12px 16px; display: flex; align-items: center; gap: 14px; border-left: 4px solid var(--sim-warning); border-radius: 0 14px 14px 0; background: #fff8e8; }
.insight-panel .insight-label { font-size: 0.72rem; color: #a35d00; font-weight: 800; letter-spacing: 0.04em; white-space: nowrap; }
.insight-panel #insight { margin: 0; color: #80510a; font-weight: 650; font-size: 0.88rem; line-height: 1.45; }
.controls { padding: 10px 14px; display: grid; grid-template-columns: auto minmax(220px, 1.4fr) minmax(180px, 1fr); gap: 18px; align-items: center; border-radius: 16px; }
.actions { display: flex; gap: 8px; }
button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 8px 12px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; font-size: 0.85rem; }
button:hover { border-color: #c7d2e2; background: #eef3f9; }
button:active { transform: scale(.97); }
button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
.control label { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
.control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
.zone-display { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 12px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); border: 1px solid rgba(15,159,186,.12); }
.zone-display .label { font-size: 0.72rem; color: var(--sim-muted); font-weight: 700; }
.zone-display .concave-zone, .zone-display .convex-zone { font-size: 0.82rem; font-weight: 700; line-height: 1.3; }
.zone-display .concave-zone { color: var(--sim-accent-deep); }
.zone-display .convex-zone { color: var(--sim-virtual); }
@media (max-width: 980px) {
  .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
  .main { grid-template-columns: 1fr; }
  .controls { grid-template-columns: 1fr; }
  .scene { min-height: 280px; }
  .insight-panel { flex-direction: column; align-items: flex-start; gap: 6px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app" data-layout="comparison" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>面镜成像规律对比</h1>
      <p>拖动蜡烛或调节物距，观察三条特殊光线追踪与实像/虚像火焰随物距变化</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">就绪</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="concave-title">
      <div class="panel-head">
        <h2 id="concave-title">凹面镜（会聚）</h2>
        <span class="tag">f = 5.0 cm · 拖动蜡烛</span>
      </div>
      <div class="scene-wrap">
        <svg id="sceneConcave" class="scene" viewBox="0 0 760 420" role="img" aria-labelledby="concave-title concave-desc">
          <desc id="concave-desc">凹面镜成像：蜡烛在镜前，三条特殊光线反射后汇聚或反向延长形成实像或虚像火焰。</desc>
        </svg>
      </div>
    </section>

    <section class="panel scene-panel" data-region="stage" aria-labelledby="convex-title">
      <div class="panel-head">
        <h2 id="convex-title">凸面镜（发散）</h2>
        <span class="tag">f = 5.0 cm · 同步对照</span>
      </div>
      <div class="scene-wrap">
        <svg id="sceneConvex" class="scene" viewBox="0 0 760 420" role="img" aria-labelledby="convex-title convex-desc">
          <desc id="convex-desc">凸面镜成像：蜡烛在镜前，三条特殊光线反射后反向延长形成正立缩小虚像火焰。</desc>
        </svg>
      </div>
    </section>
  </main>

  <section class="panel insight-panel" data-region="insight" aria-label="成像规律解读">
    <span class="insight-label">规律解读</span>
    <p id="insight">拖动蜡烛或调节物距，观察像的性质如何随位置改变。</p>
  </section>

  <section class="panel controls" data-region="controls" aria-label="模拟控制">
    <div class="actions">
      <button id="startBtn" class="primary" type="button" aria-pressed="false">开始</button>
      <button id="pauseBtn" type="button" disabled>暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control">
      <label for="distInput">物距 u <output id="distOutput">8.0 cm</output></label>
      <input id="distInput" type="range" min="1" max="14" step="0.1" value="8">
    </div>
    <div class="zone-display" data-region="evidence">
      <span class="label">当前成像区域</span>
      <span class="concave-zone" id="concaveZone">—</span>
      <span class="convex-zone" id="convexZone">—</span>
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  // ─── 几何常量 ───
  const SVG_W = 760, SVG_H = 420;
  const AXIS_Y = 260;
  const MIRROR_X = 560;
  const VERTEX = { x: MIRROR_X, y: AXIS_Y };
  const F = 5;                    // 焦距 cm
  const F_PX = 50;                // 1 cm = 50 px
  const FOCAL_PT = { x: MIRROR_X - F * F_PX, y: AXIS_Y };
  const CENTER_PT = { x: MIRROR_X - 2 * F * F_PX, y: AXIS_Y };
  const MIRROR_HEIGHT = 170;
  const MIRROR_ARC = 14;
  const CANDLE_W = 22, CANDLE_H = 56, FLAME_H = 26;
  const CANDLE_Y_TOP = AXIS_Y - CANDLE_H;
  const FLAME_TIP_Y = CANDLE_Y_TOP - FLAME_H;
  const FLAME_BASE_Y = CANDLE_Y_TOP;
  const DRAG_PAD = 14;
  const DRAG_MIN_X = DRAG_PAD;
  const DRAG_MAX_X = MIRROR_X - 2 * F * F_PX - DRAG_PAD;
  const OBJECT_HEIGHT_CM = 1.6;
  const VIRTUAL_FLAME_SCALE = 0.85;

  // ─── 状态 ───
  const state = {
    u: 8,                         // 物距 cm
    running: false,               // 静态几何模拟，无时间演化
    dragging: false,
    dragTarget: null,
    dragOffset: 0
  };

  // ─── DOM ───
  const $ = (id) => document.getElementById(id);
  const sceneConcave = $("sceneConcave");
  const sceneConvex = $("sceneConvex");
  const distInput = $("distInput");
  const distOutput = $("distOutput");
  const startBtn = $("startBtn");
  const pauseBtn = $("pauseBtn");
  const resetBtn = $("resetBtn");
  const statusEl = $("status");
  const insightEl = $("insight");
  const concaveZone = $("concaveZone");
  const convexZone = $("convexZone");

  // ─── 工具 ───
  const clamp = (v, mn, mx) => Math.min(mx, Math.max(mn, v));
  const finite = (v, fb) => Number.isFinite(v) ? v : fb;
  const uToX = (u) => MIRROR_X - u * F_PX;
  const xToU = (x) => (MIRROR_X - x) / F_PX;

  // ─── 光学模型 ───
  function concaveImage(u) {
    if (Math.abs(u - F) < 0.02) return { v: Infinity, real: false, mag: Infinity, valid: false };
    const v = (u * F) / (u - F);
    const real = v > 0;
    const mag = -v / u;
    return { v, real, mag, valid: true };
  }
  function convexImage(u) {
    const v = (u * (-F)) / (u - (-F));
    const real = false;
    const mag = -v / u;
    return { v, real, mag, valid: true };
  }
  function concaveRays(u) {
    const objX = uToX(u);
    const tipY = FLAME_TIP_Y;
    const rays = [];
    // 光线1：平行光线 → 过焦点反射
    rays.push({
      incident: [{ x: objX, y: tipY }, { x: MIRROR_X, y: tipY }],
      reflected: [{ x: MIRROR_X, y: tipY }, { x: FOCAL_PT.x, y: AXIS_Y }]
    });
    // 光线2：过焦点 → 平行反射
    const slope2 = (FOCAL_PT.y - tipY) / (FOCAL_PT.x - objX);
    const hitY2 = tipY + slope2 * (MIRROR_X - objX);
    rays.push({
      incident: [{ x: objX, y: tipY }, { x: MIRROR_X, y: hitY2 }],
      reflected: [{ x: MIRROR_X, y: hitY2 }, { x: MIRROR_X - 200, y: hitY2 }]
    });
    // 光线3：过曲率中心 → 原路反射
    const slope3 = (CENTER_PT.y - tipY) / (CENTER_PT.x - objX);
    const hitY3 = tipY + slope3 * (MIRROR_X - objX);
    rays.push({
      incident: [{ x: objX, y: tipY }, { x: MIRROR_X, y: hitY3 }],
      reflected: [{ x: MIRROR_X, y: hitY3 }, { x: MIRROR_X - 200, y: hitY3 }]
    });
    return rays;
  }
  function convexRays(u) {
    const objX = uToX(u);
    const tipY = FLAME_TIP_Y;
    const rays = [];
    // 光线1：平行 → 反射线反向延长过焦点
    rays.push({
      incident: [{ x: objX, y: tipY }, { x: MIRROR_X, y: tipY }],
      reflected: [{ x: MIRROR_X, y: tipY }, { x: MIRROR_X + 200, y: tipY + 200 * (F * F_PX / 200) }],
      backward: [{ x: MIRROR_X, y: tipY }, { x: FOCAL_PT.x, y: AXIS_Y }]
    });
    // 光线2：朝向焦点 → 平行反射
    const slope2 = (FOCAL_PT.y - tipY) / (FOCAL_PT.x - objX);
    const hitY2 = tipY + slope2 * (MIRROR_X - objX);
    rays.push({
      incident: [{ x: objX, y: tipY }, { x: MIRROR_X, y: hitY2 }],
      reflected: [{ x: MIRROR_X, y: hitY2 }, { x: MIRROR_X + 200, y: hitY2 }],
      backward: [{ x: MIRROR_X, y: hitY2 }, { x: objX, y: tipY }]
    });
    // 光线3：朝向曲率中心 → 原路反射
    const slope3 = (CENTER_PT.y - tipY) / (CENTER_PT.x - objX);
    const hitY3 = tipY + slope3 * (MIRROR_X - objX);
    rays.push({
      incident: [{ x: objX, y: tipY }, { x: MIRROR_X, y: hitY3 }],
      reflected: [{ x: MIRROR_X, y: hitY3 }, { x: objX, y: tipY }],
      backward: [{ x: MIRROR_X, y: hitY3 }, { x: objX, y: tipY }]
    });
    return rays;
  }
  function concaveZoneText(u) {
    if (u < F - 0.05) return "焦点内：正立放大虚像";
    if (Math.abs(u - F) < 0.05) return "焦点处：不出像（光线平行）";
    if (u < 2 * F - 0.05) return "焦点–2f 间：倒立放大实像";
    if (Math.abs(u - 2 * F) < 0.05) return "2f 处：倒立等大实像";
    return "2f 外：倒立缩小实像";
  }
  function convexZoneText() { return "恒为正立缩小虚像"; }
  function buildInsightText(u) {
    const ci = concaveImage(u);
    if (!ci.valid) {
      return "物体位于焦点处：反射光线相互平行，无法汇聚成像。这是实像与虚像的分界点。";
    }
    if (u < F - 0.05) {
      return "物体在焦点以内：反射光线发散，反向延长线在镜后汇聚成正立放大虚像——这是放大镜原理。";
    }
    if (u < 2 * F - 0.05) {
      return `物体在焦点与 2f 之间：凹面镜成倒立放大实像（v=${ci.v.toFixed(1)} cm），凸面镜恒成正立缩小虚像。`;
    }
    if (Math.abs(u - 2 * F) < 0.05) {
      return "物体在 2f 处：凹面镜成倒立等大实像（v=2f），凸面镜仍为正立缩小虚像。";
    }
    return `物体在 2f 以外：凹面镜成倒立缩小实像（v=${ci.v.toFixed(1)} cm），物距越大像越靠近焦点；凸面镜恒成正立缩小虚像。`;
  }

  // ─── 渲染 ───
  function buildDefs() {
    return `
      <defs>
        <linearGradient id="candleBody" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#e8d4a8"/>
          <stop offset="0.5" stop-color="#f5e6c8"/>
          <stop offset="1" stop-color="#c9a878"/>
        </linearGradient>
        <radialGradient id="flameReal" cx="0.5" cy="0.7" r="0.6">
          <stop offset="0" stop-color="#fff7cc"/>
          <stop offset="0.4" stop-color="#ffb84d"/>
          <stop offset="0.85" stop-color="#e85d04"/>
          <stop offset="1" stop-color="#c2410c" stop-opacity="0.9"/>
        </radialGradient>
        <radialGradient id="flameVirtual" cx="0.5" cy="0.7" r="0.6">
          <stop offset="0" stop-color="#f3e8ff"/>
          <stop offset="0.4" stop-color="#c4b5fd"/>
          <stop offset="0.85" stop-color="#8b5cf6"/>
          <stop offset="1" stop-color="#6d28d9" stop-opacity="0.85"/>
        </radialGradient>
        <linearGradient id="mirrorGrad" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#94a3b8"/>
          <stop offset="0.5" stop-color="#475569"/>
          <stop offset="1" stop-color="#1e293b"/>
        </linearGradient>
      </defs>`;
  }
  function buildMirror(type) {
    const top = AXIS_Y - MIRROR_HEIGHT / 2;
    const bot = AXIS_Y + MIRROR_HEIGHT / 2;
    const arc = type === "concave" ? -MIRROR_ARC : MIRROR_ARC;
    const label = type === "concave" ? "凹面镜" : "凸面镜";
    return `
      <path d="M ${MIRROR_X - arc} ${top} Q ${MIRROR_X + arc * 0.4} ${AXIS_Y} ${MIRROR_X - arc} ${bot}"
            fill="none" stroke="url(#mirrorGrad)" stroke-width="7" stroke-linecap="round"/>
      <line x1="${MIRROR_X - arc - 4}" y1="${top}" x2="${MIRROR_X - arc - 4}" y2="${bot}"
            stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
      <text x="${MIRROR_X - arc - 8}" y="${top - 6}" text-anchor="end" font-size="11" fill="#475569" font-weight="700">${label}</text>`;
  }
  function buildAxisAndPoints() {
    return `
      <line x1="20" y1="${AXIS_Y}" x2="${MIRROR_X + 30}" y2="${AXIS_Y}" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.55"/>
      <circle cx="${FOCAL_PT.x}" cy="${AXIS_Y}" r="3.5" fill="#f59e0b"/>
      <text x="${FOCAL_PT.x}" y="${AXIS_Y + 16}" text-anchor="middle" font-size="11" fill="#a35d00" font-weight="700">F</text>
      <circle cx="${CENTER_PT.x}" cy="${AXIS_Y}" r="3.5" fill="#657188"/>
      <text x="${CENTER_PT.x}" y="${AXIS_Y + 16}" text-anchor="middle" font-size="11" fill="#475569" font-weight="700">C</text>
      <circle cx="${VERTEX.x}" cy="${VERTEX.y}" r="2.5" fill="#475569"/>
      <text x="${VERTEX.x + 6}" y="${VERTEX.y - 6}" font-size="10" fill="#475569" font-weight="600">V</text>`;
  }
  function buildCandle(x, opts = {}) {
    const isVirtual = !!opts.virtual;
    const opacity = opts.opacity != null ? opts.opacity : 1;
    const flameFill = isVirtual ? "url(#flameVirtual)" : "url(#flameReal)";
    const bodyFill = isVirtual ? "rgba(124, 58, 237, 0.35)" : "url(#candleBody)";
    const stroke = isVirtual ? "#7c3aed" : "none";
    const sw = isVirtual ? 1.4 : 0;
    const sd = isVirtual ? "4 3" : "0";
    const transform = opts.transform || "";
    const flameTransform = opts.flameTransform || transform;
    const label = opts.label;
    return `
      <g transform="${transform}" opacity="${opacity}">
        <ellipse cx="${x}" cy="${CANDLE_Y_TOP + 4}" rx="${CANDLE_W * 0.5}" ry="3.5" fill="${bodyFill}" stroke="${stroke}" stroke-width="${sw}" stroke-dasharray="${sd}"/>
        <rect x="${x - CANDLE_W / 2}" y="${CANDLE_Y_TOP}" width="${CANDLE_W}" height="${CANDLE_H}" rx="3" fill="${bodyFill}" stroke="${stroke}" stroke-width="${sw}" stroke-dasharray="${sd}"/>
        <line x1="${x}" y1="${CANDLE_Y_TOP}" x2="${x}" y2="${CANDLE_Y_TOP - 6}" stroke="#475569" stroke-width="1.5"/>
        <path d="M ${x - 5} ${FLAME_BASE_Y} Q ${x - 6} ${FLAME_BASE_Y - 10} ${x} ${FLAME_TIP_Y} Q ${x + 6} ${FLAME_BASE_Y - 10} ${x + 5} ${FLAME_BASE_Y} Z"
              fill="${flameFill}" transform="${flameTransform}"/>
      </g>${label ? label : ""}`;
  }
  function buildImageLabel(imgX, imgTopY, isReal, mag) {
    const absMag = Math.abs(mag);
    const orient = mag >= 0 ? "正立" : "倒立";
    const sizeLabel = absMag > 1.05 ? "放大" : (absMag < 0.95 ? "缩小" : "等大");
    const realLabel = isReal ? "实像" : "虚像";
    const color = isReal ? "#08758a" : "#6d28d9";
    const text = `${orient} · ${sizeLabel} · ${realLabel}`;
    const labelY = imgTopY > 40 ? imgTopY - 8 : imgTopY + 14;
    return `<text x="${imgX}" y="${labelY}" text-anchor="middle" font-size="11" fill="${color}" font-weight="700">${text}</text>`;
  }
  function buildRays(rays, isReal) {
    const parts = [];
    const incColor = "var(--sim-incident)";
    const refColor = "var(--sim-reflected)";
    const extColor = "var(--sim-virtual)";
    rays.forEach((r) => {
      parts.push(`<polyline points="${r.incident.map(p => `${p.x},${p.y}`).join(" ")}" fill="none" stroke="${incColor}" stroke-width="2.2" stroke-linecap="round" opacity="0.92"/>`);
      parts.push(`<polyline points="${r.reflected.map(p => `${p.x},${p.y}`).join(" ")}" fill="none" stroke="${refColor}" stroke-width="2.2" stroke-linecap="round" opacity="0.92"/>`);
      if (!isReal && r.backward) {
        parts.push(`<polyline points="${r.backward.map(p => `${p.x},${p.y}`).join(" ")}" fill="none" stroke="${extColor}" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round" opacity="0.75"/>`);
      }
    });
    return parts.join("");
  }
  function buildImageMarker(imgX, imgTopY, imgBottomY, isReal) {
    const color = isReal ? "#08758a" : "#7c3aed";
    return `
      <line x1="${imgX - 14}" y1="${imgBottomY}" x2="${imgX + 14}" y2="${imgBottomY}" stroke="${color}" stroke-width="1.5" opacity="0.5"/>
      <line x1="${imgX - 14}" y1="${imgTopY}" x2="${imgX + 14}" y2="${imgTopY}" stroke="${color}" stroke-width="1.5" opacity="0.5"/>`;
  }
  function buildDistanceLabels(u, v, isReal) {
    const objX = uToX(u);
    const imgX = MIRROR_X - v * F_PX;
    const yLine = AXIS_Y + 38;
    const parts = [];
    // 物距标注
    parts.push(`<line x1="${objX}" y1="${yLine}" x2="${MIRROR_X}" y2="${yLine}" stroke="#657188" stroke-width="1" opacity="0.6"/>`);
    parts.push(`<line x1="${objX}" y1="${yLine - 4}" x2="${objX}" y2="${yLine + 4}" stroke="#657188" stroke-width="1" opacity="0.6"/>`);
    parts.push(`<line x1="${MIRROR_X}" y1="${yLine - 4}" x2="${MIRROR_X}" y2="${yLine + 4}" stroke="#657188" stroke-width="1" opacity="0.6"/>`);
    parts.push(`<text x="${(objX + MIRROR_X) / 2}" y="${yLine + 14}" text-anchor="middle" font-size="11" fill="#475569" font-weight="700">u = ${u.toFixed(1)} cm</text>`);
    // 像距标注
    if (Number.isFinite(v) && Math.abs(v) < 30) {
      const left = Math.min(MIRROR_X, imgX);
      const right = Math.max(MIRROR_X, imgX);
      const yV = AXIS_Y + 60;
      parts.push(`<line x1="${left}" y1="${yV}" x2="${right}" y2="${yV}" stroke="#657188" stroke-width="1" opacity="0.6" stroke-dasharray="3 3"/>`);
      parts.push(`<line x1="${left}" y1="${yV - 4}" x2="${left}" y2="${yV + 4}" stroke="#657188" stroke-width="1" opacity="0.6"/>`);
      parts.push(`<line x1="${right}" y1="${yV - 4}" x2="${right}" y2="${yV + 4}" stroke="#657188" stroke-width="1" opacity="0.6"/>`);
      const vLabel = isReal ? `v = ${v.toFixed(1)} cm` : `|v| = ${Math.abs(v).toFixed(1)} cm`;
      parts.push(`<text x="${(left + right) / 2}" y="${yV + 14}" text-anchor="middle" font-size="11" fill="${isReal ? '#08758a' : '#6d28d9'}" font-weight="700">${vLabel}</text>`);
    }
    return parts.join("");
  }
  function buildScene(type) {
    const u = state.u;
    const img = type === "concave" ? concaveImage(u) : convexImage(u);
    const rays = type === "concave" ? concaveRays(u) : convexRays(u);
    const objX = uToX(u);
    const parts = [buildDefs(), buildMirror(type), buildAxisAndPoints()];

    // 物体蜡烛
    parts.push(buildCandle(objX));

    // 光线
    parts.push(buildRays(rays, img.real));

    // 像
    if (img.valid && Number.isFinite(img.v) && Math.abs(img.mag) < 50) {
      const imgX = MIRROR_X - img.v * F_PX;
      const imgH = OBJECT_HEIGHT_CM * F_PX * Math.abs(img.mag);
      const imgBottomY = AXIS_Y;
      const imgTopY = AXIS_Y - imgH;
      const isReal = img.real;
      const opacity = isReal ? 0.95 : 0.7;
      // 像蜡烛
      const candleH = CANDLE_H;
      const candleScale = Math.abs(img.mag);
      // 像的火焰：实像倒立（火焰朝下），虚像正立
      const flameScaleY = img.mag >= 0 ? 1 : -1;
      const transform = `translate(${imgX}, ${AXIS_Y}) scale(${candleScale * (img.mag >= 0 ? 1 : 1)}, ${candleScale * flameScaleY}) translate(${-objX}, ${-AXIS_Y})`;
      // 简化：直接构造像火焰
      const imgFlameH = FLAME_H * Math.abs(img.mag);
      const imgCandleH = CANDLE_H * Math.abs(img.mag);
      const imgCandleW = CANDLE_W * Math.abs(img.mag);
      let imgMarkup;
      if (isReal) {
        // 实像：倒立，火焰朝下
        const imgCandleTop = AXIS_Y; // 倒立后蜡烛顶部在轴上
        const imgCandleBottom = AXIS_Y + imgCandleH;
        const imgFlameTipY = AXIS_Y + imgCandleH + imgFlameH;
        const flamePath = `M ${imgX - 5 * Math.abs(img.mag)} ${AXIS_Y + imgCandleH} Q ${imgX - 6 * Math.abs(img.mag)} ${AXIS_Y + imgCandleH + imgFlameH * 0.6} ${imgX} ${imgFlameTipY} Q ${imgX + 6 * Math.abs(img.mag)} ${AXIS_Y + imgCandleH + imgFlameH * 0.6} ${imgX + 5 * Math.abs(img.mag)} ${AXIS_Y + imgCandleH} Z`;
        imgMarkup = `
          <g opacity="${opacity}">
            <ellipse cx="${imgX}" cy="${imgCandleBottom - 4}" rx="${imgCandleW * 0.5}" ry="3.5" fill="url(#candleBody)"/>
            <rect x="${imgX - imgCandleW / 2}" y="${imgCandleTop}" width="${imgCandleW}" height="${imgCandleH}" rx="3" fill="url(#candleBody)"/>
            <line x1="${imgX}" y1="${imgCandleTop}" x2="${imgX}" y2="${imgCandleTop - 6}" stroke="#475569" stroke-width="1.5"/>
            <path d="${flamePath}" fill="url(#flameReal)"/>
          </g>`;
      } else {
        // 虚像：正立，火焰朝上
        const imgCandleBottom = AXIS_Y;
        const imgCandleTop = AXIS_Y - imgCandleH;
        const imgFlameTipY = imgCandleTop - imgFlameH;
        const flamePath = `M ${imgX - 5 * Math.abs(img.mag)} ${imgCandleTop} Q ${imgX - 6 * Math.abs(img.mag)} ${imgCandleTop - imgFlameH * 0.6} ${imgX} ${imgFlameTipY} Q ${imgX + 6 * Math.abs(img.mag)} ${imgCandleTop - imgFlameH * 0.6} ${imgX + 5 * Math.abs(img.mag)} ${imgCandleTop} Z`;
        imgMarkup = `
          <g opacity="${opacity}">
            <ellipse cx="${imgX}" cy="${imgCandleBottom - 4}" rx="${imgCandleW * 0.5}" ry="3.5" fill="rgba(124, 58, 237, 0.35)" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4 3"/>
            <rect x="${imgX - imgCandleW / 2}" y="${imgCandleTop}" width="${imgCandleW}" height="${imgCandleH}" rx="3" fill="rgba(124, 58, 237, 0.35)" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4 3"/>
            <line x1="${imgX}" y1="${imgCandleTop}" x2="${imgX}" y2="${imgCandleTop - 6}" stroke="#7c3aed" stroke-width="1.5"/>
            <path d="${flamePath}" fill="url(#flameVirtual)"/>
          </g>`;
      }
      parts.push(imgMarkup);
      parts.push(buildImageMarker(imgX, isReal ? AXIS_Y + imgCandleH + imgFlameH : AXIS_Y - imgCandleH - imgFlameH, isReal ? AXIS_Y : AXIS_Y, isReal));
      parts.push(buildImageLabel(imgX, isReal ? AXIS_Y + imgCandleH + imgFlameH : AXIS_Y - imgCandleH - imgFlameH, isReal, img.mag));
    } else if (!img.valid) {
      // 焦点处不出像
      parts.push(`<text x="${MIRROR_X / 2}" y="${AXIS_Y - 80}" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="700">物体在焦点处：反射光线平行，不成像</text>`);
    }

    // 距离标注
    parts.push(buildDistanceLabels(u, img.v, img.real));

    // 拖动提示
    parts.push(`<text x="${objX}" y="${FLAME_TIP_Y - 14}" text-anchor="middle" font-size="10" fill="#657188" font-weight="600" pointer-events="none">↔ 拖动</text>`);

    return parts.join("");
  }
  function render() {
    sceneConcave.innerHTML = buildScene("concave");
    sceneConvex.innerHTML = buildScene("convex");
    distOutput.textContent = `${state.u.toFixed(1)} cm`;
    concaveZone.textContent = concaveZoneText(state.u);
    convexZone.textContent = convexZoneText();
    insightEl.textContent = buildInsightText(state.u);
    statusEl.textContent = `u = ${state.u.toFixed(1)} cm`;
  }

  // ─── 交互 ───
  function getSVGPoint(svg, clientX, clientY) {
    const pt = svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    const ctm = svg.getScreenCTM();
    if (!ctm) return { x: 0, y: 0 };
    const inv = ctm.inverse();
    return pt.matrixTransform(inv);
  }
  function onPointerDown(e) {
    const svg = e.currentTarget;
    const p = getSVGPoint(svg, e.clientX, e.clientY);
    const objX = uToX(state.u);
    // 命中蜡烛区域（含一定容差）
    if (Math.abs(p.x - objX) < 40 && p.y > FLAME_TIP_Y - 20 && p.y < AXIS_Y + 10) {
      state.dragging = true;
      state.dragTarget = svg;
      state.dragOffset = p.x - objX;
      svg.setPointerCapture(e.pointerId);
      e.preventDefault();
    }
  }
  function onPointerMove(e) {
    if (!state.dragging) return;
    const svg = e.currentTarget;
    const p = getSVGPoint(svg, e.clientX, e.clientY);
    const newX = p.x - state.dragOffset;
    const clampedX = clamp(newX, DRAG_MIN_X, DRAG_MAX_X);
    state.u = clamp(xToU(clampedX), 1, 14);
    distInput.value = String(state.u);
    render();
  }
  function onPointerUp(e) {
    if (state.dragging) {
      state.dragging = false;
      if (state.dragTarget) {
        try { state.dragTarget.releasePointerCapture(e.pointerId); } catch (_) {}
      }
      state.dragTarget = null;
    }
  }
  function bindControls() {
    startBtn.addEventListener("click", start);
    pauseBtn.addEventListener("click", pause);
    resetBtn.addEventListener("click", reset);
    distInput.addEventListener("input", () => {
      const v = finite(Number(distInput.value), 8);
      state.u = clamp(v, 1, 14);
      render();
    });
    [sceneConcave, sceneConvex].forEach((svg) => {
      svg.addEventListener("pointerdown", onPointerDown);
      svg.addEventListener("pointermove", onPointerMove);
      svg.addEventListener("pointerup", onPointerUp);
      svg.addEventListener("pointercancel", onPointerUp);
    });
  }

  // ─── 模型检查 ───
  function runModelChecks() {
    const results = [];
    // 凹面镜：2f 处等大倒立实像
    {
      const u = 2 * F;
      const img = concaveImage(u);
      const expectedV = 2 * F;
      const expectedMag = -1;
      results.push({
        name: "凹面镜 2f 处：v=2f, |m|=1",
        pass: Math.abs(img.v - expectedV) < 0.01 && Math.abs(Math.abs(img.mag) - 1) < 0.01 && img.real && img.mag < 0,
        expected: `v=${expectedV}, m=-1, real`,
        actual: `v=${img.v.toFixed(3)}, m=${img.mag.toFixed(3)}, real=${img.real}`,
        tolerance: 0.01
      });
    }
    // 凹面镜：f 外（u=3f）倒立缩小实像
    {
      const u = 3 * F;
      const img = concaveImage(u);
      const expectedV = (3 * F * F) / (3 * F - F); // 1.5f
      results.push({
        name: "凹面镜 3f 处：倒立缩小实像",
        pass: img.real && img.mag < 0 && Math.abs(img.mag) < 1 && Math.abs(img.v - expectedV) < 0.01,
        expected: `v=${expectedV.toFixed(3)}, m<0, |m|<1`,
        actual: `v=${img.v.toFixed(3)}, m=${img.mag.toFixed(3)}`,
        tolerance: 0.01
      });
    }
    // 凹面镜：f-2f 间（u=1.5f）倒立放大实像
    {
      const u = 1.5 * F;
      const img = concaveImage(u);
      const expectedV = (1.5 * F * F) / (1.5 * F - F); // 3f
      results.push({
        name: "凹面镜 1.5f 处：倒立放大实像",
        pass: img.real && img.mag < 0 && Math.abs(img.mag) > 1 && Math.abs(img.v - expectedV) < 0.01,
        expected: `v=${expectedV.toFixed(3)}, m<0, |m|>1`,
        actual: `v=${img.v.toFixed(3)}, m=${img.mag.toFixed(3)}`,
        tolerance: 0.01
      });
    }
    // 凹面镜：f 内（u=0.5f）正立放大虚像
    {
      const u = 0.5 * F;
      const img = concaveImage(u);
      const expectedV = (0.5 * F * F) / (0.5 * F - F); // -f
      results.push({
        name: "凹面镜 0.5f 处：正立放大虚像",
        pass: !img.real && img.mag > 0 && Math.abs(img.mag) > 1 && Math.abs(img.v - expectedV) < 0.01,
        expected: `v=${expectedV.toFixed(3)}, m>0, |m|>1, virtual`,
        actual: `v=${img.v.toFixed(3)}, m=${img.mag.toFixed(3)}, real=${img.real}`,
        tolerance: 0.01
      });
    }
    // 凹面镜：焦点处
    {
      const u = F;
      const img = concaveImage(u);
      results.push({
        name: "凹面镜焦点处：不成像",
        pass: !img.valid,
        expected: "v=∞, invalid",
        actual: `v=${img.v}, valid=${img.valid}`,
        tolerance: "strict"
      });
    }
    // 凸面镜：任意位置正立缩小虚像
    {
      const u = 3 * F;
      const img = convexImage(u);
      const expectedV = (u * (-F)) / (u - (-F)); // -3f/4
      results.push({
        name: "凸面镜 3f 处：正立缩小虚像",
        pass: !img.real && img.mag > 0 && Math.abs(img.mag) < 1 && Math.abs(img.v - expectedV) < 0.01,
        expected: `v=${expectedV.toFixed(3)}, m>0, |m|<1, virtual`,
        actual: `v=${img.v.toFixed(3)}, m=${img.mag.toFixed(3)}, real=${img.real}`,
        tolerance: 0.01
      });
    }
    // 凸面镜：u→∞ 时 |m|→0
    {
      const u = 100 * F;
      const img = convexImage(u);
      results.push({
        name: "凸面镜 u→∞：像趋近焦点",
        pass: Math.abs(img.v - (-F)) < 0.01 * F && Math.abs(img.mag) < 0.02,
        expected: `v≈${-F}, |m|≈0`,
        actual: `v=${img.v.toFixed(4)}, m=${img.mag.toFixed(4)}`,
        tolerance: 0.02
      });
    }
    // 光线1：凹面镜平行光反射过焦点
    {
      const u = 3 * F;
      const rays = concaveRays(u);
      const r1 = rays[0];
      const reflected = r1.reflected;
      const start = reflected[0], end = reflected[1];
      // 反射线应从 (MIRROR_X, tipY) 指向 (FOCAL_PT.x, AXIS_Y)
      const pass = Math.abs(start.x - MIRROR_X) < 0.5 &&
                   Math.abs(end.x - FOCAL_PT.x) < 0.5 &&
                   Math.abs(end.y - AXIS_Y) < 0.5;
      results.push({
        name: "凹面镜光线1：平行光反射过焦点",
        pass,
        expected: `reflected end at F=(${FOCAL_PT.x},${AXIS_Y})`,
        actual: `end=(${end.x.toFixed(1)},${end.y.toFixed(1)})`,
        tolerance: 0.5
      });
    }
    // 光线2：凹面镜过焦点光反射为平行光
    {
      const u = 3 * F;
      const rays = concaveRays(u);
      const r2 = rays[1];
      const hitY = r2.reflected[0].y;
      const endY = r2.reflected[1].y;
      const pass = Math.abs(endY - hitY) < 0.5;
      results.push({
        name: "凹面镜光线2：过焦点光反射为水平平行光",
        pass,
        expected: "reflected y constant",
        actual: `hitY=${hitY.toFixed(1)}, endY=${endY.toFixed(1)}`,
        tolerance: 0.5
      });
    }
    // 光线3：凹面镜过曲率中心原路返回
    {
      const u = 3 * F;
      const rays = concaveRays(u);
      const r3 = rays[2];
      const inc = r3.incident;
      const ref = r3.reflected;
      // 反射线应沿入射方向返回
      const incDx = inc[1].x - inc[0].x;
      const refDx = ref[1].x - ref[0].x;
      const pass = Math.sign(incDx) === Math.sign(refDx) && Math.abs(ref[0].y - inc[1].y) < 0.5;
      results.push({
        name: "凹面镜光线3：过曲率中心原路返回",
        pass,
        expected: "reflected along incident",
        actual: `incDx=${incDx.toFixed(1)}, refDx=${refDx.toFixed(1)}`,
        tolerance: 0.5
      });
    }
    // 凸面镜光线1：平行光反射线反向延长过焦点
    {
      const u = 3 * F;
      const rays = convexRays(u);
      const r1 = rays[0];
      const backward = r1.backward;
      const pass = backward && Math.abs(backward[1].x - FOCAL_PT.x) < 0.5 && Math.abs(backward[1].y - AXIS_Y) < 0.5;
      results.push({
        name: "凸面镜光线1：平行光反射线反向延长过焦点",
        pass,
        expected: `backward end at F=(${FOCAL_PT.x},${AXIS_Y})`,
        actual: backward ? `end=(${backward[1].x.toFixed(1)},${backward[1].y.toFixed(1)})` : "no backward",
        tolerance: 0.5
      });
    }
    return results;
  }

  // ─── 生命周期 ───
  // 本模拟为静态几何光学对照：像距/像高由物距即时解析确定，无时间演化。
  // start / pause / update 为契约要求的空操作，不引入虚假动画。
  function init() {
    bindControls();
    render();
  }
  function start() {
    state.running = true;
    statusEl.textContent = `运行中 · u = ${state.u.toFixed(1)} cm`;
    startBtn.setAttribute("aria-pressed", "true");
    startBtn.disabled = true;
    pauseBtn.disabled = false;
  }
  function pause() {
    state.running = false;
    statusEl.textContent = `已暂停 · u = ${state.u.toFixed(1)} cm`;
    startBtn.setAttribute("aria-pressed", "false");
    startBtn.disabled = false;
    pauseBtn.disabled = true;
  }
  function reset() {
    pause();
    state.u = 8;
    distInput.value = "8";
    statusEl.textContent = "就绪";
    render();
  }
  function update(dt) {
    // 静态几何模型：无时间相关状态需要推进。
    // 保留 dt 钳制以防御异常调用，但不产生任何状态变更。
    const _ = clamp(finite(dt, 0), 0, 0.05);
    return;
  }
  function setParameters(values) {
    if (values && values.u != null) {
      state.u = clamp(finite(Number(values.u), 8), 1, 14);
      distInput.value = String(state.u);
      render();
    }
  }
  function getState() {
    return { u: state.u, running: state.running, dragging: state.dragging };
  }
  function getReadouts() {
    const ci = concaveImage(state.u);
    const xi = convexImage(state.u);
    return {
      u: state.u,
      concaveV: ci.v,
      concaveMag: ci.mag,
      concaveReal: ci.real,
      convexV: xi.v,
      convexMag: xi.mag,
      convexReal: xi.real
    };
  }

  window.simulation = {
    init,
    start,
    pause,
    reset,
    update,
    render,
    setParameters,
    getState,
    getReadouts,
    runModelChecks
  };
  init();
})();
</script>
</body>
</html>
