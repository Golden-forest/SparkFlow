  <meta charset="utf-8">

  <title>酸碱指示剂变色演示</title>
  <style>
    :root {
      color-scheme: dark;
      --sim-bg: #0a0e1a;
      --sim-surface: #131826;
      --sim-surface-soft: #1a2030;

      --sim-border: #2a3245;

      --sim-positive: #0f9fba;
      --sim-warning: #f59e0b;

      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 14px 36px rgba(0, 0, 0, 0.4);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
      --sim-acid: #e53e3e;
      --sim-base: #3182ce;
      --sim-neutral: #805ad5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.08), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.06), transparent 26%),
        var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(15, 159, 186, 0.5); outline-offset: 2px; }
    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
    .status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: rgba(15,159,186,.12); color: var(--sim-accent-soft); font-weight: 780; white-space: nowrap; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 12px; }
    .panel { min-width: 0; background: var(--sim-surface); border: 1px solid var(--sim-border); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
    #scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: radial-gradient(ellipse at 50% 30%, #1a2235 0%, #0d1220 70%); }
    .side { min-height: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 12px; }
    .readouts, .model-note { padding: 17px; }
    .readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric { padding: 14px; border: 1px solid var(--sim-border); border-radius: 15px; background: var(--sim-surface-soft); }
    .metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
    .metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .metric .nature { font-size: 0.8rem; font-weight: 600; margin-top: 2px; }
    .nature-acid { color: #fc8a8a; }
    .nature-base { color: #7dc3ed; }
    .nature-neutral { color: #c4b5e0; }
    .ph-bar-section { padding: 17px; }
    .ph-bar-section h3 { margin: 0 0 10px; font-size: 0.85rem; color: var(--sim-muted); }
    .ph-bar-container { position: relative; }
    #phBar { width: 100%; height: 36px; border-radius: 8px; display: block; }
    .ph-bar-labels { display: flex; justify-content: space-between; margin-top: 6px; font-size: 0.72rem; color: var(--sim-muted); }
    .ph-marker { position: absolute; top: -4px; width: 4px; height: 44px; background: #fff; border-radius: 2px; box-shadow: 0 0 8px rgba(255,255,255,0.6); transition: left 0.15s ease; pointer-events: none; }
    .ph-marker::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 6px solid #fff; }
    .model-note { display: grid; align-content: start; gap: 14px; }
    .model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
    .insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: rgba(245, 158, 11, 0.08); color: #fbd38d !important; font-weight: 650; font-size: 0.9rem; line-height: 1.5; }
    .indicator-info { padding: 12px 14px; border: 1px solid var(--sim-border); border-radius: 12px; background: var(--sim-surface-soft); }

    .indicator-info .color-chip { width: 28px; height: 28px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15); }
    .indicator-info .arrow { color: var(--sim-muted); font-size: 0.8rem; }
    .controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1.5fr) minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
    button:hover { border-color: #3a4458; background: #222a3d; }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
    .indicator-btns { display: flex; gap: 6px; }
    .indicator-btns button { padding: 8px 10px; font-size: 0.82rem; }
    .indicator-btns button[aria-pressed="true"] { border-color: var(--sim-accent); background: rgba(15,159,186,0.15); color: var(--sim-accent-soft); }
    .control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
    @media (max-width: 860px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main, .app[data-layout] .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
      .scene-panel { min-height: 0; }
      #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>

<body>
  <div class="app" data-layout="scene-first" data-model-tier="qualitative">
    <header class="header" data-region="header">
      <div>
        <h1>酸碱指示剂变色演示</h1>
        <p>拖动 pH 滑块，观察烧杯中溶液颜色随酸碱度连续变化的过程</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">就绪</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head"><h2 id="scene-title">烧杯场景</h2><span>溶液颜色随 pH 实时变化</span></div>
        <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
          <desc id="scene-desc">一个实验室烧杯，内装酸碱指示剂溶液，颜色随 pH 值变化。</desc>
          <defs>
            <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
              <stop offset="20%" stop-color="rgba(255,255,255,0.04)"/>
              <stop offset="80%" stop-color="rgba(255,255,255,0.02)"/>
              <stop offset="100%" stop-color="rgba(255,255,255,0.12)"/>
            </linearGradient>
            <linearGradient id="liquidSurface" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
              <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
            </linearGradient>
            <clipPath id="beakerClip">
              <path d="M 240 140 L 240 340 Q 240 360 260 360 L 500 360 Q 520 360 520 340 L 520 140 Z"/>
            </clipPath>
          </defs>
          <!-- 实验台 -->
          <ellipse cx="380" cy="385" rx="200" ry="12" fill="rgba(0,0,0,0.3)"/>
          <!-- 烧杯轮廓 -->
          <path d="M 230 130 L 230 340 Q 230 370 260 370 L 500 370 Q 530 370 530 340 L 530 130"
                fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linejoin="round"/>
          <!-- 烧杯口 -->
          <ellipse cx="380" cy="130" rx="150" ry="8" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
          <!-- 烧杯壁高光 -->
          <path d="M 230 130 L 230 340 Q 230 370 260 370 L 500 370 Q 530 370 530 340 L 530 130"
                fill="url(#glassGrad)" opacity="0.5"/>
          <!-- 溶液 -->
          <g clip-path="url(#beakerClip)">
            <rect id="liquid" x="240" y="200" width="280" height="160" fill="#805ad5"/>
            <rect x="240" y="200" width="280" height="6" fill="url(#liquidSurface)" opacity="0.6"/>
          </g>
          <!-- 刻度线 -->
          <g stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none">
            <line x1="530" y1="180" x2="545" y2="180"/>
            <line x1="530" y1="230" x2="545" y2="230"/>
            <line x1="530" y1="280" x2="545" y2="280"/>
            <line x1="530" y1="330" x2="545" y2="330"/>
          </g>
          <g fill="rgba(255,255,255,0.35)" font-size="11" font-family="ui-sans-serif, system-ui">
            <text x="552" y="184">150</text>
            <text x="552" y="234">100</text>
            <text x="552" y="284">50</text>
            <text x="552" y="334">0</text>
          </g>
          <!-- 烧杯前沿高光 -->
          <path d="M 230 130 L 230 340 Q 230 370 260 370 L 500 370 Q 530 370 530 340 L 530 130"
                fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6" stroke-linejoin="round"/>
          <!-- pH 标签 -->
          <text id="phLabel" x="380" y="290" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="42" font-weight="800" font-family="ui-sans-serif, system-ui">pH 7.0</text>
          <text id="natureLabel" x="380" y="315" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="16" font-weight="600" font-family="ui-sans-serif, system-ui">中性</text>
        </svg>
      </section>

      <aside class="side" data-region="evidence">
        <section class="panel readouts" aria-label="实时数值">
          <div class="readout-grid">
            <div class="metric">
              <small>pH 值</small>
              <strong id="phReadout">7.0</strong>
            </div>
            <div class="metric">
              <small>酸碱性</small>
              <strong id="natureReadout">中性</strong>
              <div class="nature nature-neutral" id="natureSubReadout">[H⁺]=[OH⁻]</div>
            </div>
          </div>
        </section>
        <section class="panel ph-bar-section">
          <h3>pH 色带标尺</h3>
          <div class="ph-bar-container">
            <canvas id="phBar" width="600" height="36"></canvas>
            <div class="ph-marker" id="phMarker" style="left: 50%;"></div>
          </div>
          <div class="ph-bar-labels">
            <span>0 酸性</span>
            <span>7 中性</span>
            <span>14 碱性</span>
          </div>
        </section>
        <section class="panel model-note" data-region="insight">
          <div class="panel-head"><h2>变色状态</h2></div>
          <div class="indicator-info" id="indicatorInfo">
            <div class="label">当前指示剂：石蕊</div>
            <div class="range">变色范围 pH 5.0 – 8.0</div>
            <div class="colors">
              <div class="color-chip" id="chipAcid" style="background:#e53e3e;"></div>
              <span class="arrow">→</span>
              <div class="color-chip" id="chipMid" style="background:#805ad5;"></div>
              <span class="arrow">→</span>
              <div class="color-chip" id="chipBase" style="background:#3182ce;"></div>
            </div>
          </div>
          <p id="insight" class="insight">当前为中性溶液，石蕊呈紫色。拖动 pH 滑块可观察颜色在变色范围内的渐变过程。</p>
          <p>教学说明：指示剂变色不是在 pH=7 处瞬间发生，而是在特定 pH 区间内连续渐变。不同指示剂有不同的变色范围。</p>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="模拟控制">
      <div class="actions">
        <button id="startBtn" class="primary" type="button">开始</button>
        <button id="pauseBtn" type="button">暂停</button>
        <button id="resetBtn" type="button">重置</button>
      </div>
      <div class="control">
        <label for="phInput">pH 值 <output id="phOutput">7.0</output></label>
        <input id="phInput" type="range" min="0" max="14" step="0.1" value="7">
      </div>
      <div class="control">
        <label>指示剂选择</label>
        <div class="indicator-btns">
          <button id="litmusBtn" type="button" aria-pressed="true">石蕊</button>
          <button id="phenolBtn" type="button" aria-pressed="false">酚酞</button>
          <button id="methylBtn" type="button" aria-pressed="false">甲基橙</button>
        </div>
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";

    // 指示剂数据：标准变色范围与端点颜色
    const indicatorData = {
      litmus: {
        name: "石蕊",
        rangeLow: 5.0,
        rangeHigh: 8.0,
        colorLow: [229, 62, 62],    // 红
        colorMid: [128, 90, 213],   // 紫
        colorHigh: [49, 130, 206],  // 蓝
        lowLabel: "红色",
        midLabel: "紫色",
        highLabel: "蓝色"
      },
      phenolphthalein: {
        name: "酚酞",
        rangeLow: 8.2,
        rangeHigh: 10.0,
        colorLow: [240, 240, 240],  // 无色
        colorMid: [237, 130, 130], // 浅粉
        colorHigh: [214, 31, 105],  // 品红
        lowLabel: "无色",
        midLabel: "浅粉",
        highLabel: "品红"
      },
      methylorange: {
        name: "甲基橙",
        rangeLow: 3.1,
        rangeHigh: 4.4,
        colorLow: [229, 62, 62],    // 红
        colorMid: [237, 130, 130], // 橙
        colorHigh: [255, 174, 31],  // 黄
        lowLabel: "红色",
        midLabel: "橙色",
        highLabel: "黄色"
      }
    };

    const parameterSchema = [
      { key: "ph", label: "pH 值", type: "slider", min: 0, max: 14, step: 0.1, default: 7, unit: "" }
    ];

    const state = {
      running: false,
      t: 0,
      ph: 7,
      targetPh: 7,
      indicator: "litmus",
      lastTimestamp: null
    };

    const elements = {
      status: document.querySelector("#status"),
      liquid: document.querySelector("#liquid"),
      phLabel: document.querySelector("#phLabel"),
      natureLabel: document.querySelector("#natureLabel"),
      phReadout: document.querySelector("#phReadout"),
      natureReadout: document.querySelector("#natureReadout"),
      natureSubReadout: document.querySelector("#natureSubReadout"),
      phBar: document.querySelector("#phBar"),
      phMarker: document.querySelector("#phMarker"),
      insight: document.querySelector("#insight"),
      indicatorInfo: document.querySelector("#indicatorInfo"),
      phInput: document.querySelector("#phInput"),
      phOutput: document.querySelector("#phOutput"),
      startBtn: document.querySelector("#startBtn"),
      pauseBtn: document.querySelector("#pauseBtn"),
      resetBtn: document.querySelector("#resetBtn"),
      litmusBtn: document.querySelector("#litmusBtn"),
      phenolBtn: document.querySelector("#phenolBtn"),
      methylBtn: document.querySelector("#methylBtn"),
      chipAcid: document.querySelector("#chipAcid"),
      chipMid: document.querySelector("#chipMid"),
      chipBase: document.querySelector("#chipBase")
    };

    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

    function lerp(a, b, t) { return a + (b - a) * t; }
    function lerpColor(c1, c2, t) {
      return [
        Math.round(lerp(c1[0], c2[0], t)),
        Math.round(lerp(c1[1], c2[1], t)),
        Math.round(lerp(c1[2], c2[2], t))
      ];
    }
    function rgbStr(c) { return `rgb(${c[0]},${c[1]},${c[2]})`; }

    // 根据指示剂和 pH 计算溶液颜色
    function getIndicatorColor(ph, indicatorKey) {
      const ind = indicatorData[indicatorKey];
      const { rangeLow, rangeHigh, colorLow, colorMid, colorHigh } = ind;

      if (ph <= rangeLow) return colorLow;
      if (ph >= rangeHigh) return colorHigh;

      const mid = (rangeLow + rangeHigh) / 2;
      if (ph < mid) {
        const t = (ph - rangeLow) / (mid - rangeLow);
        return lerpColor(colorLow, colorMid, t);
      } else {
        const t = (ph - mid) / (rangeHigh - mid);
        return lerpColor(colorMid, colorHigh, t);
      }
    }

    // 获取颜色状态标签
    function getColorLabel(ph, indicatorKey) {
      const ind = indicatorData[indicatorKey];
      const { rangeLow, rangeHigh } = ind;
      if (ph <= rangeLow) return ind.lowLabel;
      if (ph >= rangeHigh) return ind.highLabel;
      return ind.midLabel;
    }

    // 判断是否在变色范围内
    function isInRange(ph, indicatorKey) {
      const ind = indicatorData[indicatorKey];
      return ph > ind.rangeLow && ph < ind.rangeHigh;
    }

    // 获取酸碱性
    function getNature(ph) {
      if (ph < 7) return { label: "酸性", sub: "[H⁺]>[OH⁻]", cls: "nature-acid" };
      if (ph > 7) return { label: "碱性", sub: "[H⁺]<[OH⁻]", cls: "nature-base" };
      return { label: "中性", sub: "[H⁺]=[OH⁻]", cls: "nature-neutral" };
    }

    // 绘制 pH 色带
    function drawPhBar() {
      const canvas = elements.phBar;
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      for (let i = 0; i < w; i++) {
        const ph = (i / w) * 14;
        const color = getPhBarColor(ph);
        ctx.fillStyle = rgbStr(color);
        ctx.fillRect(i, 0, 1, h);
      }
      // 叠加变色范围标记
      const ind = indicatorData[state.indicator];
      const lowX = (ind.rangeLow / 14) * w;
      const highX = (ind.rangeHigh / 14) * w;
      ctx.strokeStyle = "rgba(255,255,255,0.7)";
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(lowX, 0); ctx.lineTo(lowX, h);
      ctx.moveTo(highX, 0); ctx.lineTo(highX, h);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // pH 色带标准颜色（通用酸碱色带）
    function getPhBarColor(ph) {
      if (ph <= 3) return lerpColor([229, 62, 62], [255, 140, 50], ph / 3);
      if (ph <= 7) return lerpColor([255, 140, 50], [128, 90, 213], (ph - 3) / 4);
      if (ph <= 11) return lerpColor([128, 90, 213], [49, 130, 206], (ph - 7) / 4);
      return lerpColor([49, 130, 206], [43, 80, 160], (ph - 11) / 3);
    }

    function init() {
      drawPhBar();
      bindControls();
      setParameters({ ph: 7 });
      reset();
      requestAnimationFrame(frame);
    }

    function start() {
      state.running = true;
      elements.status.textContent = "运行中";
      elements.startBtn.setAttribute("aria-pressed", "true");
    }

    function pause() {
      state.running = false;
      state.lastTimestamp = null;
      elements.status.textContent = "已暂停";
      elements.startBtn.setAttribute("aria-pressed", "false");
    }

    function reset() {
      pause();
      state.t = 0;
      state.ph = 7;
      state.targetPh = 7;
      elements.phInput.value = "7";
      render();
      elements.status.textContent = "就绪";
    }

    function update(dt) {
      if (!state.running) return;
      const boundedDt = clamp(finite(dt, 0), 0, 0.05);
      // 平滑过渡 pH 到目标值
      const diff = state.targetPh - state.ph;
      if (Math.abs(diff) > 0.01) {
        state.ph += diff * Math.min(1, boundedDt * 3);
      } else {
        state.ph = state.targetPh;
      }
      state.ph = finite(state.ph, 7);
      state.t += boundedDt;
    }

    function render() {
      const ph = state.ph;
      const ind = indicatorData[state.indicator];
      const color = getIndicatorColor(ph, state.indicator);
      const colorStr = rgbStr(color);

      // 烧杯溶液颜色
      elements.liquid.setAttribute("fill", colorStr);

      // 场景内 pH 标签
      elements.phLabel.textContent = `pH ${ph.toFixed(1)}`;
      const nature = getNature(ph);
      elements.natureLabel.textContent = nature.label;

      // 读数
      elements.phReadout.textContent = ph.toFixed(1);
      elements.natureReadout.textContent = nature.label;
      elements.natureSubReadout.textContent = nature.sub;
      elements.natureSubReadout.className = `nature ${nature.cls}`;

      // pH 色带标记位置
      const markerPct = (ph / 14) * 100;
      elements.phMarker.style.left = `${markerPct}%`;

      // 指示剂信息
      const infoHTML = `
        <div class="label">当前指示剂：${ind.name}</div>
        <div class="range">变色范围 pH ${ind.rangeLow.toFixed(1)} – ${ind.rangeHigh.toFixed(1)}</div>
        <div class="colors">
          <div class="color-chip" style="background:${rgbStr(ind.colorLow)};"></div>
          <span class="arrow">→</span>
          <div class="color-chip" style="background:${rgbStr(ind.colorMid)};"></div>
          <span class="arrow">→</span>
          <div class="color-chip" style="background:${rgbStr(ind.colorHigh)};"></div>
        </div>
      `;
      elements.indicatorInfo.innerHTML = infoHTML;

      // 变色状态解读
      const colorLabel = getColorLabel(ph, state.indicator);
      const inRange = isInRange(ph, state.indicator);
      let insightText;
      if (inRange) {
        insightText = `当前 pH ${ph.toFixed(1)} 处于${ind.name}变色范围（${ind.rangeLow.toFixed(1)}–${ind.rangeHigh.toFixed(1)}）内，溶液呈${colorLabel}，正在渐变过渡中。`;
      } else if (ph <= ind.rangeLow) {
        insightText = `当前 pH ${ph.toFixed(1)} 低于${ind.name}变色范围（${ind.rangeLow.toFixed(1)}–${ind.rangeHigh.toFixed(1)}），溶液呈${colorLabel}。`;
      } else {
        insightText = `当前 pH ${ph.toFixed(1)} 高于${ind.name}变色范围（${ind.rangeLow.toFixed(1)}–${ind.rangeHigh.toFixed(1)}），溶液呈${colorLabel}。`;
      }
      elements.insight.textContent = insightText;

      // 控制栏输出
      elements.phOutput.textContent = ph.toFixed(1);
    }

    function setParameters(values) {
      const phDef = parameterSchema[0];
      if (values.ph !== undefined) {
        state.targetPh = clamp(finite(Number(values.ph), phDef.default), phDef.min, phDef.max);
        if (!state.running) {
          state.ph = state.targetPh;
        }
      }
      render();
    }

    function setIndicator(key) {
      state.indicator = key;
      elements.litmusBtn.setAttribute("aria-pressed", key === "litmus" ? "true" : "false");
      elements.phenolBtn.setAttribute("aria-pressed", key === "phenolphthalein" ? "true" : "false");
      elements.methylBtn.setAttribute("aria-pressed", key === "methylorange" ? "true" : "false");
      drawPhBar();
      render();
    }

    function getState() {
      return { ...state };
    }

    function getReadouts() {
      return { ph: state.ph, nature: getNature(state.ph).label, indicator: state.indicator };
    }

    function runModelChecks() {
      const results = [];

      // 1. 石蕊在 pH=3 时应为红色
      const litmusAcidic = getIndicatorColor(3, "litmus");
      const litmusAcidicMatch = litmusAcidic[0] > 200 && litmusAcidic[1] < 100;
      results.push({
        name: "石蕊 pH=3 呈红色",
        pass: litmusAcidicMatch,
        expected: "红色 (R>200, G<100)",
        actual: rgbStr(litmusAcidic),
        tolerance: "定性"
      });

      // 2. 石蕊在 pH=10 时应为蓝色
      const litmusBasic = getIndicatorColor(10, "litmus");
      const litmusBasicMatch = litmusBasic[2] > 150;
      results.push({
        name: "石蕊 pH=10 呈蓝色",
        pass: litmusBasicMatch,
        expected: "蓝色 (B>150)",
        actual: rgbStr(litmusBasic),
        tolerance: "定性"
      });

      // 3. 石蕊在 pH=6.5（变色范围内）应为紫色
      const litmusMid = getIndicatorColor(6.5, "litmus");
      const litmusMidMatch = litmusMid[2] > 100 && litmusMid[0] > 80;
      results.push({
        name: "石蕊 pH=6.5 呈紫色（过渡）",
        pass: litmusMidMatch,
        expected: "紫色 (R>80, B>100)",
        actual: rgbStr(litmusMid),
        tolerance: "定性"
      });

      // 4. 酚酞在 pH=6 时应接近无色
      const phenolAcidic = getIndicatorColor(6, "phenolphthalein");
      const phenolAcidicMatch = phenolAcidic[0] > 220 && phenolAcidic[1] > 220 && phenolAcidic[2] > 220;
      results.push({
        name: "酚酞 pH=6 呈无色",
        pass: phenolAcidicMatch,
        expected: "无色 (R>220, G>220, B>220)",
        actual: rgbStr(phenolAcidic),
        tolerance: "定性"
      });

      // 5. 酚酞在 pH=12 时应为品红
      const phenolBasic = getIndicatorColor(12, "phenolphthalein");
      const phenolBasicMatch = phenolBasic[0] > 180;
      results.push({
        name: "酚酞 pH=12 呈品红",
        pass: phenolBasicMatch,
        expected: "品红 (R>180)",
        actual: rgbStr(phenolBasic),
        tolerance: "定性"
      });

      // 6. 甲基橙在 pH=2 时应为红色
      const methylAcidic = getIndicatorColor(2, "methylorange");
      const methylAcidicMatch = methylAcidic[0] > 200;
      results.push({
        name: "甲基橙 pH=2 呈红色",
        pass: methylAcidicMatch,
        expected: "红色 (R>200)",
        actual: rgbStr(methylAcidic),
        tolerance: "定性"
      });

      // 7. 甲基橙在 pH=7 时应为黄色
      const methylBasic = getIndicatorColor(7, "methylorange");
      const methylBasicMatch = methylBasic[2] < 100 && methylBasic[0] > 200 && methylBasic[1] > 100;
      results.push({
        name: "甲基橙 pH=7 呈黄色",
        pass: methylBasicMatch,
        expected: "黄色 (R>200, G>100, B<100)",
        actual: rgbStr(methylBasic),
        tolerance: "定性"
      });

      // 8. 颜色连续性：pH 变化 0.1 时颜色变化应平滑
      const c1 = getIndicatorColor(6.0, "litmus");
      const c2 = getIndicatorColor(6.1, "litmus");
      const colorDiff = Math.abs(c1[0]-c2[0]) + Math.abs(c1[1]-c2[1]) + Math.abs(c1[2]-c2[2]);
      results.push({
        name: "颜色连续性（pH 0.1 变化平滑）",
        pass: colorDiff < 30,
        expected: "颜色差 < 30",
        actual: colorDiff.toFixed(1),
        tolerance: 30
      });

      // 9. 酸碱性判定
      const acidNature = getNature(4);
      const baseNature = getNature(10);
      const neutralNature = getNature(7);
      results.push({
        name: "酸碱性判定正确",
        pass: acidNature.label === "酸性" && baseNature.label === "碱性" && neutralNature.label === "中性",
        expected: "pH4=酸性, pH10=碱性, pH7=中性",
        actual: `${acidNature.label}, ${baseNature.label}, ${neutralNature.label}`,
        tolerance: "严格"
      });

      return results;
    }

    function bindControls() {
      elements.startBtn.addEventListener("click", start);
      elements.pauseBtn.addEventListener("click", pause);
      elements.resetBtn.addEventListener("click", reset);
      elements.phInput.addEventListener("input", () => setParameters({ ph: elements.phInput.value }));
      elements.litmusBtn.addEventListener("click", () => setIndicator("litmus"));
      elements.phenolBtn.addEventListener("click", () => setIndicator("phenolphthalein"));
      elements.methylBtn.addEventListener("click", () => setIndicator("methylorange"));
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    window.simulation = { init, start, pause, reset, update, render, setParameters, setIndicator, getState, getReadouts, runModelChecks };
    init();
  })();
  </script>
</body>
</html>
