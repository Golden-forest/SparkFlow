<!doctype html>
<html lang="zh-CN">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用一块巧克力，测出光速</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #050810;
  --sim-surface: #0a0f1c;
  --sim-surface-soft: #0e1424;
  --sim-text: #e8eefc;
  --sim-muted: #8a96b0;
  --sim-border: #1a2238;
  --sim-grid: #131c30;
  --sim-accent: #ff5a3c;
  --sim-accent-deep: #c63d24;
  --sim-accent-soft: rgba(255, 90, 60, 0.15);
  --sim-positive: #4ade80;
  --sim-warning: #fbbf24;
  --sim-danger: #ef4444;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-width: 320px;
  color: var(--sim-text);
  background: var(--sim-bg);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  overflow: hidden;
  height: 100vh;
}
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid rgba(255, 90, 60, 0.5); outline-offset: 2px; }

.app {
  width: 100%;
  height: 100vh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 10px;
  padding: 14px 18px 12px;
  overflow: hidden;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 18px;
  padding: 0 4px;
}
.header h1 {
  font-size: clamp(1.3rem, 2vw, 1.7rem);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.header p {
  color: var(--sim-muted);
  font-size: 0.85rem;
  margin-top: 2px;
}
.status {
  border: 1px solid rgba(255, 90, 60, 0.3);
  border-radius: 999px;
  padding: 7px 14px;
  background: var(--sim-accent-soft);
  color: var(--sim-accent);
  font-weight: 700;
  font-size: 0.8rem;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.main {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(280px, 0.55fr);
  gap: 12px;
}

.scene-panel {
  min-height: 0;
  position: relative;
  border-radius: var(--sim-radius-lg);
  overflow: hidden;
  background: #050810;
  border: 1px solid var(--sim-border);
}
#scene {
  display: block;
  width: 100%;
  height: 100%;
}

.side {
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 10px;
}

.formula-panel {
  padding: 16px 18px;
  background: var(--sim-surface);
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-md);
}
.formula-panel h2 {
  font-size: 0.8rem;
  color: var(--sim-muted);
  font-weight: 600;
  margin-bottom: 12px;
  letter-spacing: 0.05em;
}
.formula-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.formula-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 0.92rem;
  line-height: 1.4;
  opacity: 0;
  transform: translateX(-8px);
  transition: opacity 0.5s ease, transform 0.5s ease;
  font-variant-numeric: tabular-nums;
}
.formula-row.lit {
  opacity: 1;
  transform: translateX(0);
}
.formula-row .label { color: var(--sim-muted); min-width: 72px; }
.formula-row .value { color: var(--sim-text); font-weight: 600; }
.formula-row.highlight .value {
  color: var(--sim-accent);
  font-size: 1.05rem;
  font-weight: 800;
}
.formula-row .equals { color: var(--sim-muted); }
.formula-row .approx { color: var(--sim-muted); }

.insight-panel {
  padding: 14px 16px;
  background: var(--sim-surface);
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-md);
  display: flex;
  align-items: center;
}
.insight-panel p {
  color: var(--sim-text);
  font-size: 0.88rem;
  line-height: 1.5;
  opacity: 0;
  transition: opacity 0.6s ease;
}
.insight-panel p.show { opacity: 0.92; }

.controls {
  padding: 10px 14px;
  display: grid;
  grid-template-columns: auto minmax(160px, 1fr) auto;
  gap: 18px;
  align-items: center;
  background: var(--sim-surface);
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-md);
}
.actions { display: flex; gap: 8px; }
button {
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-sm);
  padding: 8px 14px;
  color: var(--sim-text);
  background: var(--sim-surface-soft);
  cursor: pointer;
  font-weight: 700;
  font-size: 0.85rem;
  transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
}
button:hover { border-color: #2a3550; background: #131c30; }
button:active { transform: scale(0.97); }
button.primary {
  border-color: var(--sim-accent-deep);
  color: #fff;
  background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent));
}
button.primary:hover { background: linear-gradient(135deg, #d4452a, #ff6b4d); }

.control { display: flex; flex-direction: column; gap: 4px; }
.control label {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--sim-muted);
}
.control output {
  color: var(--sim-accent);
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}
input[type="range"] {
  width: 100%;
  accent-color: var(--sim-accent);
  height: 4px;
}
.hint {
  font-size: 0.75rem;
  color: var(--sim-muted);
  text-align: right;
}

@media (max-width: 860px) {
  .app { height: auto; min-height: 100vh; overflow: visible; padding: 10px; }
  .main { grid-template-columns: 1fr; }
  .controls { grid-template-columns: 1fr; gap: 10px; }
  .scene-panel { min-height: 300px; aspect-ratio: 16/10; }
  .side { grid-template-rows: auto auto; }
}
@media (prefers-reduced-motion: reduce) {
  .formula-row, .insight-panel p { transition: none !important; }
}
</style>

<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>用一块巧克力，测出光速</h1>
      <p>驻波半波长实验 · 拖动卡尺滑块，观察算式联动</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">就绪</div>
  </header>

  <main class="main">
    <section class="scene-panel" data-region="stage" aria-label="微波炉驻波实验场景">
      <canvas id="scene" role="img" aria-label="微波炉剖面图，炉腔内有驻波，巧克力条上出现熔斑"></canvas>
    </section>

    <aside class="side" data-region="evidence">
      <section class="formula-panel" aria-label="光速计算算式">
        <h2>光速计算</h2>
        <div class="formula-list">
          <div class="formula-row" id="row-1">
            <span class="label">熔斑间距</span>
            <span class="equals">=</span>
            <span class="value" id="val-spacing">6.1 厘米</span>
          </div>
          <div class="formula-row" id="row-2">
            <span class="label">半波长</span>
            <span class="equals">=</span>
            <span class="value" id="val-halflambda">6.1 厘米</span>
          </div>
          <div class="formula-row" id="row-3">
            <span class="label">波长</span>
            <span class="equals">=</span>
            <span class="value" id="val-lambda">12.2 厘米</span>
          </div>
          <div class="formula-row" id="row-4">
            <span class="label">频率</span>
            <span class="equals">=</span>
            <span class="value" id="val-freq">24.5 亿赫兹</span>
          </div>
          <div class="formula-row highlight" id="row-5">
            <span class="label">光速</span>
            <span class="equals">=</span>
            <span class="value" id="val-c">0.122 米 × 24.5 亿赫兹</span>
          </div>
          <div class="formula-row highlight" id="row-6">
            <span class="label">≈</span>
            <span class="value" id="val-c-final">298,900 公里/秒</span>
          </div>
        </div>
      </section>
      <section class="insight-panel" data-region="insight">
        <p id="insight-text">波腹处振幅最大，能量最强，巧克力渐渐熔化发光；波节处静止，巧克力保持坚硬。相邻熔斑的间距，恰好是半个波长。</p>
      </section>
    </aside>
  </main>

  <section class="controls" data-region="controls" aria-label="模拟控件">
    <div class="actions">
      <button id="startBtn" class="primary" type="button">开始</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control">
      <label for="spacingInput">卡尺间距 <output id="spacingOutput">6.1 厘米</output></label>
      <input id="spacingInput" type="range" min="5.8" max="6.4" step="0.05" value="6.1">
    </div>
    <div class="hint">拖动滑块微调卡尺读数</div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const parameterSchema = [
    { key: "spacing", label: "卡尺间距", type: "slider", min: 5.8, max: 6.4, step: 0.05, default: 6.1, unit: "厘米" }
  ];

  const state = {
    running: false,
    t: 0,
    spacing: 6.1,
    frequency: 2.45e9,
    lastTimestamp: null,
    introT: 0,
    formulaProgress: 0,
    chocolateMelt: [0, 0, 0, 0],
    endingReveal: 0
  };

  const elements = {
    canvas: document.getElementById("scene"),
    status: document.getElementById("status"),
    spacingInput: document.getElementById("spacingInput"),
    spacingOutput: document.getElementById("spacingOutput"),
    startBtn: document.getElementById("startBtn"),
    pauseBtn: document.getElementById("pauseBtn"),
    resetBtn: document.getElementById("resetBtn"),
    valSpacing: document.getElementById("val-spacing"),
    valHalfLambda: document.getElementById("val-halflambda"),
    valLambda: document.getElementById("val-lambda"),
    valFreq: document.getElementById("val-freq"),
    valC: document.getElementById("val-c"),
    valCFinal: document.getElementById("val-c-final"),
    insightText: document.getElementById("insight-text"),
    formulaRows: [
      document.getElementById("row-1"),
      document.getElementById("row-2"),
      document.getElementById("row-3"),
      document.getElementById("row-4"),
      document.getElementById("row-5"),
      document.getElementById("row-6")
    ]
  };

  const ctx = elements.canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1;

  function resizeCanvas() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const rect = elements.canvas.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    elements.canvas.width = Math.max(1, Math.floor(W * DPR));
    elements.canvas.height = Math.max(1, Math.floor(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
  function finite(v, fallback) { return Number.isFinite(v) ? v : fallback; }
  function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

  // ===== 背景绘制 =====
  function drawBackground() {
    // 三层径向渐变
    const g1 = ctx.createRadialGradient(W * 0.3, H * 0.2, 0, W * 0.3, H * 0.2, W * 0.7);
    g1.addColorStop(0, "rgba(20, 30, 55, 0.6)");
    g1.addColorStop(1, "rgba(5, 8, 16, 0)");
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, W, H);

    const g2 = ctx.createRadialGradient(W * 0.75, H * 0.85, 0, W * 0.75, H * 0.85, W * 0.6);
    g2.addColorStop(0, "rgba(40, 15, 10, 0.4)");
    g2.addColorStop(1, "rgba(5, 8, 16, 0)");
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, W, H);

    // 细网格 8% 不透明度
    ctx.strokeStyle = "rgba(80, 100, 140, 0.06)";
    ctx.lineWidth = 1;
    const gridSize = 40;
    ctx.beginPath();
    for (let x = 0; x < W; x += gridSize) {
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
    }
    for (let y = 0; y < H; y += gridSize) {
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
    }
    ctx.stroke();
  }

  // ===== 微波炉外壳 =====
  function drawMicrowave(cx, cy, w, h) {
    const x = cx - w / 2;
    const y = cy - h / 2;

    // 外壳
    ctx.fillStyle = "#1a2238";
    ctx.strokeStyle = "#2a3550";
    ctx.lineWidth = 2;
    roundRect(x - 8, y - 8, w + 16, h + 16, 14);
    ctx.fill();
    ctx.stroke();

    // 炉腔内壁
    ctx.fillStyle = "#080c14";
    ctx.strokeStyle = "#1e2840";
    ctx.lineWidth = 1.5;
    roundRect(x, y, w, h, 8);
    ctx.fill();
    ctx.stroke();

    // 右侧控制面板区域
    const panelW = 60;
    ctx.fillStyle = "#0e1424";
    ctx.strokeStyle = "#1a2238";
    roundRect(x + w + 4, y, panelW, h, 6);
    ctx.fill();
    ctx.stroke();

    // 面板上的小指示灯和按钮
    ctx.fillStyle = "rgba(255, 90, 60, 0.8)";
    ctx.beginPath();
    ctx.arc(x + w + 4 + panelW / 2, y + 20, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "rgba(74, 222, 128, 0.6)";
    ctx.beginPath();
    ctx.arc(x + w + 4 + panelW / 2, y + 35, 3, 0, Math.PI * 2);
    ctx.fill();

    // 面板文字
    ctx.fillStyle = "rgba(138, 150, 176, 0.7)";
    ctx.font = "10px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.fillText("2450", x + w + 4 + panelW / 2, y + 58);
    ctx.fillText("MHz", x + w + 4 + panelW / 2, y + 70);

    // 磁控管示意（顶部）
    ctx.fillStyle = "#1a2238";
    ctx.strokeStyle = "#2a3550";
    roundRect(x + w / 2 - 20, y - 4, 40, 8, 3);
    ctx.fill();
    ctx.stroke();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ===== 驻波绘制 =====
  function drawStandingWave(x, y, w, amp, time) {
    const centerY = y;
    const numNodes = 4; // 4个波节，3个波腹区间
    const halfLambda = state.spacing; // cm
    // 驻波波长 = 2 * halfLambda，在画面宽度上显示约3个半波长
    const totalHalfLambdas = 3.2;
    const visualWavelength = w / totalHalfLambdas;

    // 波节位置（x坐标）
    const nodePositions = [];
    for (let i = 0; i <= numNodes; i++) {
      nodePositions.push(x + (i / numNodes) * w);
    }

    // 驻波包络（虚线）
    ctx.strokeStyle = "rgba(255, 90, 60, 0.25)";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const px = x + (i / 200) * w;
      const localX = (px - x) / visualWavelength * Math.PI;
      const envelope = Math.abs(Math.sin(localX));
      const py = centerY - envelope * amp;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const px = x + (i / 200) * w;
      const localX = (px - x) / visualWavelength * Math.PI;
      const envelope = Math.abs(Math.sin(localX));
      const py = centerY + envelope * amp;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // 实时驻波波形
    const wavePhase = time * 3.5;
    const waveAmp = 1; // 振幅缩放

    // 外层粗半透明描边（辉光模拟）
    ctx.strokeStyle = "rgba(255, 90, 60, 0.35)";
    ctx.lineWidth = 8;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    for (let i = 0; i <= 300; i++) {
      const px = x + (i / 300) * w;
      const localX = (px - x) / visualWavelength * Math.PI;
      const envelope = Math.sin(localX);
      const py = centerY + envelope * amp * waveAmp * Math.cos(wavePhase);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // 内层实色描边
    ctx.strokeStyle = "rgba(255, 120, 80, 0.95)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i <= 300; i++) {
      const px = x + (i / 300) * w;
      const localX = (px - x) / visualWavelength * Math.PI;
      const envelope = Math.sin(localX);
      const py = centerY + envelope * amp * waveAmp * Math.cos(wavePhase);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // 波节标记（小圆点）
    ctx.fillStyle = "rgba(138, 150, 176, 0.5)";
    for (const nx of nodePositions) {
      ctx.beginPath();
      ctx.arc(nx, centerY, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    return { nodePositions, visualWavelength };
  }

  // ===== 巧克力条绘制 =====
  function drawChocolate(cx, cy, w, h, meltLevels, time) {
    const x = cx - w / 2;
    const y = cy - h / 2;

    // 巧克力底色
    ctx.fillStyle = "#3d2818";
    roundRect(x, y, w, h, 4);
    ctx.fill();

    // 巧克力分块（4块）
    const blockW = w / 4;
    for (let i = 0; i < 4; i++) {
      const bx = x + i * blockW;
      const melt = meltLevels[i];

      // 每块巧克力表面
      if (melt > 0.05) {
        // 熔化区域：亮红色辉光
        const glowAlpha = clamp(melt * 0.7, 0, 0.7);
        ctx.fillStyle = `rgba(255, 90, 60, ${glowAlpha})`;
        roundRect(bx + 2, y + 2, blockW - 4, h - 4, 3);
        ctx.fill();

        // 内层更亮的熔斑
        const innerAlpha = clamp(melt * 0.9, 0, 0.9);
        ctx.fillStyle = `rgba(255, 180, 100, ${innerAlpha})`;
        const inset = 6 + (1 - melt) * 4;
        roundRect(bx + inset, y + inset, blockW - inset * 2, h - inset * 2, 2);
        ctx.fill();

        // 最亮核心
        if (melt > 0.3) {
          const coreAlpha = clamp((melt - 0.3) * 1.4, 0, 1);
          ctx.fillStyle = `rgba(255, 230, 180, ${coreAlpha * 0.8})`;
          const coreInset = 10;
          roundRect(bx + coreInset, y + coreInset, blockW - coreInset * 2, h - coreInset * 2, 2);
          ctx.fill();
        }

        // 熔化波动效果（微小起伏）
        if (melt > 0.5) {
          const wobble = Math.sin(time * 4 + i * 1.5) * melt * 1.5;
          ctx.fillStyle = `rgba(255, 200, 120, ${melt * 0.3})`;
          ctx.beginPath();
          ctx.ellipse(bx + blockW / 2, y + h / 2 + wobble, blockW * 0.3, h * 0.15, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      } else {
        // 未熔化：保持坚硬的巧克力色
        ctx.fillStyle = "#4a3020";
        roundRect(bx + 2, y + 2, blockW - 4, h - 4, 3);
        ctx.fill();

        // 表面纹理
        ctx.strokeStyle = "rgba(0, 0, 0, 0.3)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(bx + blockW * 0.3, y + 3);
        ctx.lineTo(bx + blockW * 0.3, y + h - 3);
        ctx.moveTo(bx + blockW * 0.7, y + 3);
        ctx.lineTo(bx + blockW * 0.7, y + h - 3);
        ctx.stroke();
      }

      // 分隔线
      if (i < 3) {
        ctx.strokeStyle = "rgba(0, 0, 0, 0.4)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(bx + blockW, y);
        ctx.lineTo(bx + blockW, y + h);
        ctx.stroke();
      }
    }

    // 巧克力边框
    ctx.strokeStyle = "rgba(0, 0, 0, 0.5)";
    ctx.lineWidth = 1.5;
    roundRect(x, y, w, h, 4);
    ctx.stroke();
  }

  // ===== 卡尺绘制 =====
  function drawCaliper(chocolateX, chocolateY, chocolateW, spacingCm) {
    // 卡尺量两个相邻熔斑的间距
    // 熔斑在巧克力第1块和第3块中心（对应驻波波腹）
    const blockW = chocolateW / 4;
    const melt1Center = chocolateX - chocolateW / 2 + blockW * 0.5; // 第1块
    const melt2Center = chocolateX - chocolateW / 2 + blockW * 2.5; // 第3块

    // 实际间距用 spacingCm 对应的像素表示
    // 巧克力宽度对应约 4 * halfLambda = 4 * 6.1 = 24.4cm
    // 但我们只量相邻熔斑 = 2 * blockW 像素 = spacingCm
    // 所以像素间距 = 2 * blockW，读数 = spacingCm
    const pixelSpacing = melt2Center - melt1Center;

    const caliperY = chocolateY + 40;
    const arrowY = caliperY;

    // 卡尺主体线
    ctx.strokeStyle = "rgba(138, 150, 176, 0.8)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(melt1Center, arrowY);
    ctx.lineTo(melt2Center, arrowY);
    ctx.stroke();

    // 左箭头
    ctx.beginPath();
    ctx.moveTo(melt1Center, arrowY);
    ctx.lineTo(melt1Center + 8, arrowY - 5);
    ctx.lineTo(melt1Center + 8, arrowY + 5);
    ctx.closePath();
    ctx.fillStyle = "rgba(138, 150, 176, 0.8)";
    ctx.fill();

    // 右箭头
    ctx.beginPath();
    ctx.moveTo(melt2Center, arrowY);
    ctx.lineTo(melt2Center - 8, arrowY - 5);
    ctx.lineTo(melt2Center - 8, arrowY + 5);
    ctx.closePath();
    ctx.fill();

    // 卡尺竖线（上下端点）
    ctx.strokeStyle = "rgba(255, 90, 60, 0.7)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(melt1Center, chocolateY - 25);
    ctx.lineTo(melt1Center, arrowY + 8);
    ctx.moveTo(melt2Center, chocolateY - 25);
    ctx.lineTo(melt2Center, arrowY + 8);
    ctx.stroke();

    // 读数标签
    const labelX = (melt1Center + melt2Center) / 2;
    const labelY = arrowY + 22;
    const labelText = spacingCm.toFixed(1) + " 厘米";

    ctx.font = "bold 13px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // 标签背景
    const tw = ctx.measureText(labelText).width;
    ctx.fillStyle = "rgba(10, 15, 28, 0.9)";
    ctx.strokeStyle = "rgba(255, 90, 60, 0.5)";
    ctx.lineWidth = 1;
    roundRect(labelX - tw / 2 - 8, labelY - 10, tw + 16, 20, 4);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "rgba(255, 180, 120, 1)";
    ctx.fillText(labelText, labelX, labelY);
  }

  // ===== 结尾字幕 =====
  function drawEndingCaption(alpha) {
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "rgba(5, 8, 16, 0.7)";
    ctx.fillRect(0, H * 0.35, W, H * 0.3);

    ctx.fillStyle = "rgba(255, 200, 150, 1)";
    ctx.font = "bold 18px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("熔斑之间的距离，藏着宇宙的速度上限", W / 2, H * 0.45);

    ctx.fillStyle = "rgba(255, 90, 60, 1)";
    ctx.font = "bold 22px ui-sans-serif, system-ui";
    ctx.fillText("—— 厨房里就能测光速", W / 2, H * 0.52);
    ctx.restore();
  }

  // ===== 开场标题帧 =====
  function drawIntroFrame(alpha) {
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "rgba(232, 238, 252, 1)";
    ctx.font = "bold 28px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("用一块巧克力，测出光速", W / 2, H / 2 - 15);

    ctx.fillStyle = "rgba(138, 150, 176, 0.9)";
    ctx.font = "15px ui-sans-serif, system-ui";
    ctx.fillText("驻波半波长实验 · 点击开始", W / 2, H / 2 + 20);
    ctx.restore();
  }

  // ===== 主渲染 =====
  function render() {
    ctx.clearRect(0, 0, W, H);
    drawBackground();

    // 开场帧
    if (state.introT < 2) {
      const introAlpha = state.introT < 1.5 ? 1 : (2 - state.introT) / 0.5;
      drawIntroFrame(clamp(introAlpha, 0, 1));
      return;
    }

    // 微波炉尺寸
    const mwW = Math.min(W * 0.62, 560);
    const mwH = Math.min(H * 0.68, 360);
    const mwCx = W * 0.42;
    const mwCy = H * 0.5;

    drawMicrowave(mwCx, mwCy, mwW, mwH);

    // 炉腔内部坐标
    const cavityX = mwCx - mwW / 2;
    const cavityY = mwCy - mwH / 2;
    const cavityW = mwW;
    const cavityH = mwH;

    // 驻波
    const waveY = cavityY + cavityH * 0.42;
    const waveAmp = Math.min(cavityH * 0.18, 50);
    const waveInfo = drawStandingWave(cavityX + 20, waveY, cavityW - 40, waveAmp, state.t);

    // 巧克力条
    const chocW = cavityW * 0.72;
    const chocH = 22;
    const chocCx = mwCx;
    const chocY = cavityY + cavityH * 0.72;
    drawChocolate(chocCx, chocY, chocW, chocH, state.chocolateMelt, state.t);

    // 卡尺
    drawCaliper(chocCx, chocY, chocW, state.spacing);

    // 标注：波腹/波节
    ctx.fillStyle = "rgba(138, 150, 176, 0.6)";
    ctx.font = "11px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    const blockW = chocW / 4;
    // 波腹标注
    ctx.fillStyle = "rgba(255, 120, 80, 0.7)";
    ctx.fillText("波腹", chocCx - chocW / 2 + blockW * 0.5, chocY - chocH / 2 - 8);
    ctx.fillText("波腹", chocCx - chocW / 2 + blockW * 2.5, chocY - chocH / 2 - 8);
    // 波节标注
    ctx.fillStyle = "rgba(138, 150, 176, 0.6)";
    ctx.fillText("波节", chocCx - chocW / 2 + blockW * 1.5, chocY - chocH / 2 - 8);
    ctx.fillText("波节", chocCx - chocW / 2 + blockW * 3.5, chocY - chocH / 2 - 8);

    // 结尾字幕
    drawEndingCaption(state.endingReveal);
  }

  // ===== 更新 =====
  function update(dt) {
    state.introT += dt;

    if (state.introT < 2) return;

    if (state.running) {
      state.t += dt;

      // 巧克力熔化进度（波腹位置熔化，波节不熔化）
      // 第1块和第3块在波腹，第0块和第2块在波节
      const meltSpeed = 0.15;
      for (let i = 0; i < 4; i++) {
        if (i === 0 || i === 2) {
          // 波腹位置：渐渐熔化
          state.chocolateMelt[i] = clamp(state.chocolateMelt[i] + meltSpeed * dt, 0, 1);
        }
        // 波节位置保持0
      }

      // 算式逐行点亮
      state.formulaProgress = clamp(state.formulaProgress + dt * 0.8, 0, 6);
      updateFormulaDisplay();

      // 结尾字幕（在算式全部点亮后）
      if (state.formulaProgress >= 6) {
        state.endingReveal = clamp(state.endingReveal + dt * 0.5, 0, 1);
      }
    }
  }

  function updateFormulaDisplay() {
    const progress = state.formulaProgress;
    for (let i = 0; i < 6; i++) {
      if (progress > i) {
        elements.formulaRows[i].classList.add("lit");
      }
    }
    if (progress >= 6) {
      elements.insightText.classList.add("show");
    }
  }

  function updateFormulaValues() {
    const spacing = state.spacing;
    const halfLambda = spacing;
    const lambda = spacing * 2;
    const freq = state.frequency;
    const c = (lambda / 100) * freq; // m/s
    const cKmS = c / 1000;
    const cWanKmS = cKmS / 10000;

    elements.valSpacing.textContent = spacing.toFixed(1) + " 厘米";
    elements.valHalfLambda.textContent = halfLambda.toFixed(1) + " 厘米";
    elements.valLambda.textContent = lambda.toFixed(1) + " 厘米";
    elements.valFreq.textContent = "24.5 亿赫兹";
    elements.valC.textContent = (lambda / 100).toFixed(3) + " 米 × 24.5 亿赫兹";
    elements.valCFinal.textContent = formatSpeed(cKmS);
  }

  function formatSpeed(cKmS) {
    // 格式化为 "约 29.89 万公里/秒" 或 "约 298,900 公里/秒"
    const wanKm = cKmS / 10000;
    if (wanKm >= 1) {
      return "约 " + wanKm.toFixed(2) + " 万公里/秒";
    }
    return "约 " + Math.round(cKmS).toLocaleString() + " 公里/秒";
  }

  // ===== 生命周期 =====
  function start() {
    state.running = true;
    elements.status.textContent = "运行中";
    elements.startBtn.setAttribute("aria-pressed", "true");
  }
  function pause() {
    state.running = false;
    elements.status.textContent = "已暂停";
    elements.startBtn.setAttribute("aria-pressed", "false");
  }
  function reset() {
    pause();
    state.t = 0;
    state.introT = 0;
    state.formulaProgress = 0;
    state.endingReveal = 0;
    state.chocolateMelt = [0, 0, 0, 0];
    state.lastTimestamp = null;
    elements.formulaRows.forEach(r => r.classList.remove("lit"));
    elements.insightText.classList.remove("show");
    elements.status.textContent = "就绪";
    render();
  }

  function setParameters(values) {
    const def = parameterSchema[0];
    state.spacing = clamp(finite(Number(values.spacing), def.default), def.min, def.max);
    elements.spacingInput.value = String(state.spacing);
    elements.spacingOutput.textContent = state.spacing.toFixed(2) + " 厘米";
    updateFormulaValues();
    render();
  }

  function getState() {
    return {
      running: state.running,
      t: state.t,
      spacing: state.spacing,
      frequency: state.frequency,
      introT: state.introT,
      formulaProgress: state.formulaProgress,
      chocolateMelt: [...state.chocolateMelt],
      endingReveal: state.endingReveal
    };
  }

  function getReadouts() {
    const lambda = state.spacing * 2;
    const c = (lambda / 100) * state.frequency;
    return {
      spacing: state.spacing,
      halfLambda: state.spacing,
      lambda: lambda,
      frequency: state.frequency,
      c: c,
      cKmS: c / 1000
    };
  }

  function runModelChecks() {
    const checks = [];

    // 1. 基本计算验证：spacing=6.1, freq=2.45e9
    const c1 = (6.1 * 2 / 100) * 2.45e9;
    checks.push({
      name: "默认值光速计算",
      pass: Math.abs(c1 - 2.989e8) < 1e5,
      expected: "2.989e8 m/s",
      actual: c1.toExponential(3),
      tolerance: "1e5"
    });

    // 2. 波长 = 2 × 间距
    checks.push({
      name: "波长等于两倍间距",
      pass: Math.abs((state.spacing * 2) - (state.spacing * 2)) < 1e-10,
      expected: "lambda = 2 * spacing",
      actual: `${state.spacing * 2} = 2 * ${state.spacing}`,
      tolerance: "exact"
    });

    // 3. 光速 = 波长 × 频率
    const lambda = state.spacing * 2;
    const c2 = (lambda / 100) * state.frequency;
    checks.push({
      name: "光速公式验证",
      pass: Math.abs(c2 - (state.spacing * 2 / 100) * 2.45e9) < 1,
      expected: `${state.spacing * 2 / 100} * 2.45e9`,
      actual: c2.toExponential(3),
      tolerance: "1"
    });

    // 4. 滑块范围约束
    checks.push({
      name: "间距范围约束",
      pass: state.spacing >= 5.8 && state.spacing <= 6.4,
      expected: "5.8 <= spacing <= 6.4",
      actual: state.spacing,
      tolerance: "range"
    });

    // 5. 光速随间距单调递增
    const cLow = (5.8 * 2 / 100) * 2.45e9;
    const cHigh = (6.4 * 2 / 100) * 2.45e9;
    checks.push({
      name: "光速随间距单调递增",
      pass: cHigh > cLow,
      expected: "c(6.4) > c(5.8)",
      actual: `${cHigh.toExponential(3)} > ${cLow.toExponential(3)}`,
      tolerance: "strict"
    });

    // 6. 真空光速对比
    const cTrue = 2.998e8;
    checks.push({
      name: "与真空光速对比",
      pass: Math.abs(c1 - cTrue) / cTrue < 0.02,
      expected: "误差 < 2%",
      actual: `${(Math.abs(c1 - cTrue) / cTrue * 100).toFixed(2)}%`,
      tolerance: "2%"
    });

    return checks;
  }

  // ===== 事件绑定 =====
  function bindControls() {
    elements.startBtn.addEventListener("click", start);
    elements.pauseBtn.addEventListener("click", pause);
    elements.resetBtn.addEventListener("click", reset);
    elements.spacingInput.addEventListener("input", () => {
      setParameters({ spacing: elements.spacingInput.value });
    });
    window.addEventListener("resize", () => {
      resizeCanvas();
      render();
    });
  }

  // ===== 主循环 =====
  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    let dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    dt = clamp(finite(dt, 0), 0, 0.05);

    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // ===== 初始化 =====
  function init() {
    resizeCanvas();
    bindControls();
    setParameters({ spacing: 6.1 });
    updateFormulaValues();
    requestAnimationFrame(frame);
  }

  window.simulation = {
    init, start, pause, reset, update, render,
    setParameters, getState, getReadouts, runModelChecks
  };

  init();
})();
</script>
</body>
