<!doctype html>
<html lang="zh-CN">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>酸碱指示剂变色演示</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #0c1117;
      --sim-surface: #161c26;
      --sim-surface-soft: #1c2430;
      --sim-text: #e8eefc;
      --sim-muted: #8a96a8;
      --sim-border: #2a3340;
      --sim-grid: #1f2733;
      --sim-accent: #4dd0e1;
      --sim-accent-deep: #0097a7;
      --sim-accent-soft: #1a3a40;
      --sim-positive: #4dd0e1;
      --sim-warning: #ffb74d;
      --sim-danger: #ef5350;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 14px 36px rgba(0, 0, 0, 0.4);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
      --sim-acid: #e53935;
      --sim-base: #5e35b1;
      --sim-neutral: #757575;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 10% 0%, rgba(77, 208, 225, 0.06), transparent 30%),
        radial-gradient(circle at 90% 5%, rgba(255, 183, 77, 0.04), transparent 25%),
        var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(77, 208, 225, 0.4); outline-offset: 2px; }
    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
    .status { border: 1px solid rgba(77, 208, 225, 0.25); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent); font-weight: 780; white-space: nowrap; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 12px; }
    .panel { min-width: 0; background: var(--sim-surface); border: 1px solid var(--sim-border); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
    #scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(77, 208, 225, 0.1); border-radius: 18px; background: radial-gradient(ellipse at 50% 30%, #1a2330 0%, #0c1117 70%); }
    .side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
    .readouts, .model-note { padding: 17px; }
    .readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric { padding: 14px; border: 1px solid rgba(77, 208, 225, 0.12); border-radius: 15px; background: linear-gradient(145deg, #1a2330, #161c26); }
    .metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
    .metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .model-note { display: grid; align-content: start; gap: 14px; }
    .model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
    .insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: rgba(255, 183, 77, 0.08); color: #ffd699 !important; font-weight: 650; }
    .controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr) minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
    button:hover { border-color: #3a4555; background: #232c3a; }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(77, 208, 225, 0.20); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); border-color: var(--sim-accent); background: var(--sim-accent-deep); color: #fff; }
    .control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
    .indicator-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .indicator-tabs button { padding: 7px 11px; font-size: 0.78rem; }
    @media (max-width: 860px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
      .scene-panel { min-height: 0; }
      #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>

<body>
  <div class="app" data-layout="scene-first" data-execution-mode="continuous" data-model-tier="qualitative">
    <header class="header" data-region="header">
      <div>
        <h1>酸碱指示剂变色演示</h1>
        <p>拖动 pH 滑块，观察指示剂颜色随酸碱度连续变化</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head"><h2 id="scene-title">试管与指示剂颜色</h2><span>液体颜色随 pH 连续过渡</span></div>
        <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
          <desc id="scene-desc">一支装有指示剂的玻璃试管，液体颜色随当前 pH 值变化。</desc>
          <defs>
            <linearGradient id="glassGrad" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0" stop-color="rgba(255,255,255,0.18)"/>
              <stop offset="0.15" stop-color="rgba(255,255,255,0.04)"/>
              <stop offset="0.5" stop-color="rgba(255,255,255,0)"/>
              <stop offset="0.85" stop-color="rgba(255,255,255,0.04)"/>
              <stop offset="1" stop-color="rgba(255,255,255,0.12)"/>
            </linearGradient>
            <linearGradient id="liquidGrad" x1="0" x2="0" y1="0" y2="1">
              <stop id="liquidStop1" offset="0" stop-color="#888888"/>
              <stop id="liquidStop2" offset="1" stop-color="#666666"/>
            </linearGradient>
            <clipPath id="tubeClip">
              <path d="M 330 70 L 330 320 A 50 50 0 0 0 430 320 L 430 70 Z"/>
            </clipPath>
          </defs>
          <!-- 实验台台面阴影 -->
          <ellipse cx="380" cy="375" rx="120" ry="10" fill="rgba(0,0,0,0.35)"/>
          <!-- 试管液体（裁剪在试管形状内） -->
          <g clip-path="url(#tubeClip)">
            <rect id="liquidRect" x="330" y="140" width="100" height="230" fill="url(#liquidGrad)"/>
            <!-- 液面椭圆高光 -->
            <ellipse id="liquidSurface" cx="380" cy="140" rx="50" ry="8" fill="url(#liquidGrad)" opacity="0.7"/>
          </g>
          <!-- 试管玻璃轮廓 -->
          <path d="M 322 60 L 322 320 A 58 58 0 0 0 438 320 L 438 60" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2.5"/>
          <path d="M 322 60 L 322 320 A 58 58 0 0 0 438 320 L 438 60" fill="url(#glassGrad)"/>
          <!-- 试管口 -->
          <ellipse cx="380" cy="60" rx="58" ry="10" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2.5"/>
          <ellipse cx="380" cy="60" rx="58" ry="10" fill="rgba(0,0,0,0.3)"/>
          <!-- 玻璃高光条 -->
          <rect x="340" y="75" width="6" height="230" rx="3" fill="rgba(255,255,255,0.15)"/>
          <rect x="414" y="75" width="3" height="200" rx="1.5" fill="rgba(255,255,255,0.08)"/>
          <!-- pH 标签 -->
          <text id="phLabel" x="380" y="200" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="28" font-weight="800" font-variant-numeric="tabular-nums">pH 7.0</text>
          <text id="phSubLabel" x="380" y="225" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="13" font-weight="600">中性</text>
        </svg>
      </section>

      <aside class="side" data-region="evidence">
        <section class="panel readouts" aria-label="实时数值">
          <div class="readout-grid">
            <div class="metric"><small>当前 pH</small><strong id="phReadout">7.00</strong></div>
            <div class="metric"><small>指示剂</small><strong id="indicatorReadout" style="font-size:1rem;">广范围</strong></div>
            <div class="metric"><small>变色范围</small><strong id="rangeReadout" style="font-size:1rem;">5.0–8.0</strong></div>
            <div class="metric"><small>状态</small><strong id="stateReadout" style="font-size:1rem;">中性</strong></div>
          </div>
        </section>
        <section class="panel model-note" data-region="insight">
          <div class="panel-head"><h2>观察要点</h2></div>
          <p id="insight" class="insight">拖动 pH 滑块，观察试管颜色在变色区间内的连续过渡。</p>
          <p>教学视图：颜色为定性映射，基于指示剂标准变色范围。变色区间内颜色快速跃迁，区间外趋于稳定色。</p>
          <svg id="mapChart" viewBox="0 0 360 80" style="width:100%;border-radius:10px;background:#0c1117;border:1px solid var(--sim-border);" role="img" aria-label="pH 颜色映射图">
            <text x="6" y="14" fill="#8a96a8" font-size="10" font-weight="700">pH-颜色映射</text>
            <text x="354" y="14" fill="#8a96a8" font-size="10" font-weight="700" text-anchor="end" id="mapIndicatorName">广范围</text>
            <rect id="mapBar" x="20" y="22" width="320" height="28" rx="4" fill="#888888"/>
            <text x="20" y="68" fill="#8a96a8" font-size="9">0</text>
            <text x="180" y="68" fill="#8a96a8" font-size="9" text-anchor="middle">7</text>
            <text x="340" y="68" fill="#8a96a8" font-size="9" text-anchor="end">14</text>
            <line id="mapMarker" x1="180" y1="18" x2="180" y2="56" stroke="#fff" stroke-width="2.5"/>
            <polygon id="mapArrow" points="180,14 174,8 186,8" fill="#fff"/>
          </svg>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="模拟控制">
      <div class="actions">
        <button id="titrateBtn" class="primary" type="button">开始滴定</button>
        <button id="pauseBtn" type="button">暂停</button>
        <button id="resetBtn" type="button">重置</button>
      </div>
      <div class="control">
        <label>指示剂 <output id="indicatorOutput">广范围</output></label>
        <div class="indicator-tabs" id="indicatorTabs">
          <button data-indicator="universal" aria-pressed="true">广范围</button>
          <button data-indicator="phenolphthalein">酚酞</button>
          <button data-indicator="methylorange">甲基橙</button>
          <button data-indicator="bromothymol">溴麝香草酚蓝</button>
          <button data-indicator="litmus">石蕊</button>
        </div>
      </div>
      <div class="control">
        <label for="phInput">pH 滑块 <output id="phOutput">7.0</output></label>
        <input id="phInput" type="range" min="0" max="14" step="0.1" value="7">
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";

    const indicators = {
      universal: {
        name: "广范围",
        range: [3, 10],
        acidColor: [229, 57, 57],
        baseColor: [94, 53, 177],
        neutralColor: [117, 117, 117],
        acidLabel: "强酸性 · 红",
        baseLabel: "强碱性 · 紫",
        midLabel: "中性 · 绿"
      },
      phenolphthalein: {
        name: "酚酞",
        range: [8.2, 10.0],
        acidColor: [255, 255, 255],
        baseColor: [216, 67, 216],
        neutralColor: [255, 255, 255],
        acidLabel: "无色",
        baseLabel: "紫红色",
        midLabel: "浅粉色"
      },
      methylorange: {
        name: "甲基橙",
        range: [3.1, 4.4],
        acidColor: [229, 57, 57],
        baseColor: [255, 193, 7],
        neutralColor: [255, 193, 7],
        acidLabel: "红色",
        baseLabel: "黄色",
        midLabel: "橙色"
      },
      bromothymol: {
        name: "溴麝香草酚蓝",
        range: [6.0, 7.6],
        acidColor: [255, 193, 7],
        baseColor: [38, 166, 154],
        neutralColor: [38, 166, 154],
        acidLabel: "黄色",
        baseLabel: "蓝色",
        midLabel: "绿色"
      },
      litmus: {
        name: "石蕊",
        range: [5.0, 8.0],
        acidColor: [229, 57, 57],
        baseColor: [63, 81, 181],
        neutralColor: [156, 39, 176],
        acidLabel: "红色",
        baseLabel: "蓝色",
        midLabel: "紫色"
      }
    };

    const state = {
      running: false,
      ph: 7,
      indicator: "universal",
      titrating: false,
      titrateStart: 0,
      titrateEnd: 14,
      titrateProgress: 0,
      lastTimestamp: null
    };

    const elements = {
      status: document.querySelector("#status"),
      liquidRect: document.querySelector("#liquidRect"),
      liquidSurface: document.querySelector("#liquidSurface"),
      liquidStop1: document.querySelector("#liquidStop1"),
      liquidStop2: document.querySelector("#liquidStop2"),
      phLabel: document.querySelector("#phLabel"),
      phSubLabel: document.querySelector("#phSubLabel"),
      phReadout: document.querySelector("#phReadout"),
      indicatorReadout: document.querySelector("#indicatorReadout"),
      rangeReadout: document.querySelector("#rangeReadout"),
      stateReadout: document.querySelector("#stateReadout"),
      insight: document.querySelector("#insight"),
      phInput: document.querySelector("#phInput"),
      phOutput: document.querySelector("#phOutput"),
      indicatorOutput: document.querySelector("#indicatorOutput"),
      indicatorTabs: document.querySelector("#indicatorTabs"),
      titrateBtn: document.querySelector("#titrateBtn"),
      pauseBtn: document.querySelector("#pauseBtn"),
      resetBtn: document.querySelector("#resetBtn"),
      mapBar: document.querySelector("#mapBar"),
      mapMarker: document.querySelector("#mapMarker"),
      mapArrow: document.querySelector("#mapArrow"),
      mapIndicatorName: document.querySelector("#mapIndicatorName")
    };

    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

    function lerp(a, b, t) { return a + (b - a) * t; }
    function lerpColor(c1, c2, t) {
      return [
        Math.round(lerp(c1[0], c2[0], t)),
        Math.round(lerp(c1[1], c2[1], t)),
        Math.round(lerp(c1[2], c2[2], t))
      ];
    }
    function rgbStr(c) { return `rgb(${c[0]}, ${c[1]}, ${c[2]})`; }
    function rgbDarken(c, factor) {
      return [Math.round(c[0] * factor), Math.round(c[1] * factor), Math.round(c[2] * factor)];
    }

    function getIndicatorColor(ph, indicatorKey) {
      const ind = indicators[indicatorKey];
      const [lo, hi] = ind.range;
      if (ph <= lo) return ind.acidColor;
      if (ph >= hi) return ind.baseColor;
      const t = (ph - lo) / (hi - lo);
      return lerpColor(ind.acidColor, ind.baseColor, t);
    }

    function getPhCategory(ph) {
      if (ph < 3) return "强酸性";
      if (ph < 6) return "弱酸性";
      if (ph < 8) return "中性";
      if (ph < 11) return "弱碱性";
      return "强碱性";
    }

    function getInRange(ph, indicatorKey) {
      const [lo, hi] = indicators[indicatorKey].range;
      return ph >= lo && ph <= hi;
    }

    function getRangePosition(ph, indicatorKey) {
      const [lo, hi] = indicators[indicatorKey].range;
      return { lo, hi, loFrac: lo / 14, hiFrac: hi / 14 };
    }

    function init() {
      bindControls();
      setParameters({ ph: 7, indicator: "universal" });
      reset();
      requestAnimationFrame(frame);
    }

    function start() {
      if (state.titrating) return;
      state.running = true;
      state.titrating = true;
      state.titrateProgress = 0;
      state.lastTimestamp = null;
      elements.status.textContent = "滴定中…";
      elements.titrateBtn.setAttribute("aria-pressed", "true");
      elements.titrateBtn.textContent = "滴定进行中";
    }

    function pause() {
      state.running = false;
      state.titrating = false;
      state.lastTimestamp = null;
      elements.status.textContent = "已暂停";
      elements.titrateBtn.setAttribute("aria-pressed", "false");
      elements.titrateBtn.textContent = "开始滴定";
    }

    function reset() {
      pause();
      state.ph = 7;
      state.titrateProgress = 0;
      elements.phInput.value = "7";
      render();
    }

    function update(dt) {
      if (!state.running || !state.titrating) return;
      const boundedDt = clamp(finite(dt, 0), 0, 0.05);
      state.titrateProgress += boundedDt * 0.18;
      if (state.titrateProgress >= 1) {
        state.titrateProgress = 1;
        state.titrating = false;
        state.running = false;
        elements.status.textContent = "滴定完成";
        elements.titrateBtn.setAttribute("aria-pressed", "false");
        elements.titrateBtn.textContent = "开始滴定";
      }
      state.ph = lerp(state.titrateStart, state.titrateEnd, state.titrateProgress);
      elements.phInput.value = String(state.ph.toFixed(1));
    }

    function render() {
      const ph = state.ph;
      const ind = indicators[state.indicator];
      const color = getIndicatorColor(ph, state.indicator);
      const colorStr = rgbStr(color);
      const darkColor = rgbDarken(color, 0.72);
      const darkStr = rgbStr(darkColor);

      // 试管液体
      elements.liquidStop1.setAttribute("stop-color", colorStr);
      elements.liquidStop2.setAttribute("stop-color", darkStr);
      elements.liquidRect.setAttribute("fill", "url(#liquidGrad)");
      elements.liquidSurface.setAttribute("fill", colorStr);

      // 试管内标签
      elements.phLabel.textContent = `pH ${ph.toFixed(1)}`;
      const category = getPhCategory(ph);
      elements.phSubLabel.textContent = category;

      // 读数
      elements.phReadout.textContent = ph.toFixed(2);
      elements.indicatorReadout.textContent = ind.name;
      elements.rangeReadout.textContent = `${ind.range[0].toFixed(1)}–${ind.range[1].toFixed(1)}`;

      const inRange = getInRange(ph, state.indicator);
      const [lo, hi] = ind.range;
      let stateLabel;
      if (ph < lo) stateLabel = ind.acidLabel;
      else if (ph > hi) stateLabel = ind.baseLabel;
      else stateLabel = ind.midLabel;
      elements.stateReadout.textContent = stateLabel;

      elements.phOutput.textContent = ph.toFixed(1);
      elements.indicatorOutput.textContent = ind.name;

      // 洞察文字
      if (state.titrating) {
        if (inRange) {
          elements.insight.textContent = `正处于变色区间 ${lo.toFixed(1)}–${hi.toFixed(1)} 内：颜色快速跃迁，这是滴定突跃的视觉表现。`;
        } else if (ph < lo) {
          elements.insight.textContent = `pH 低于变色区间 ${lo.toFixed(1)}：颜色趋于稳定（${ind.acidLabel}）。`;
        } else {
          elements.insight.textContent = `pH 高于变色区间 ${hi.toFixed(1)}：颜色趋于稳定（${ind.baseLabel}）。`;
        }
      } else {
        if (inRange) {
          elements.insight.textContent = `当前处于变色区间 ${lo.toFixed(1)}–${hi.toFixed(1)} 内：颜色正在过渡，小幅拖动即可看到明显变化。`;
        } else if (ph < lo) {
          elements.insight.textContent = `pH 低于变色区间 ${lo.toFixed(1)}：颜色趋于稳定。拖动滑块进入区间即可看到跃迁。`;
        } else {
          elements.insight.textContent = `pH 高于变色区间 ${hi.toFixed(1)}：颜色趋于稳定。拖动滑块进入区间即可看到跃迁。`;
        }
      }

      // 映射图
      renderMap(ph, colorStr);
    }

    function renderMap(ph, colorStr) {
      const ind = indicators[state.indicator];
      const [lo, hi] = ind.range;
      const barX = 20, barW = 320;
      const segments = 80;
      let parts = [];
      for (let i = 0; i < segments; i++) {
        const segPh = (i / segments) * 14;
        const segColor = getIndicatorColor(segPh, state.indicator);
        const x = barX + (i / segments) * barW;
        const w = barW / segments + 0.5;
        parts.push(`<rect x="${x.toFixed(2)}" y="22" width="${w.toFixed(2)}" height="28" fill="${rgbStr(segColor)}"/>`);
      }
      // 变色区间标注线
      const loX = barX + (lo / 14) * barW;
      const hiX = barX + (hi / 14) * barW;
      parts.push(`<line x1="${loX.toFixed(2)}" y1="20" x2="${loX.toFixed(2)}" y2="52" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-dasharray="3 2"/>`);
      parts.push(`<line x1="${hiX.toFixed(2)}" y1="20" x2="${hiX.toFixed(2)}" y2="52" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-dasharray="3 2"/>`);

      const markerX = barX + (clamp(ph, 0, 14) / 14) * barW;
      parts.push(`<line x1="${markerX.toFixed(2)}" y1="16" x2="${markerX.toFixed(2)}" y2="56" stroke="#fff" stroke-width="2.5"/>`);
      parts.push(`<polygon points="${markerX.toFixed(2)},12 ${markerX - 6},6 ${markerX + 6},6" fill="#fff"/>`);

      elements.mapBar.parentElement.innerHTML = elements.mapBar.parentElement.innerHTML.replace(
        /(<text[^>]*>pH-颜色映射<\/text>[\s\S]*?<\/svg>|<text[^>]*>pH-颜色映射<\/text>[\s\S]*)$/,
        ''
      );
      // 重建映射图内容
      const mapSvg = elements.mapBar.parentElement;
      mapSvg.innerHTML = `
        <text x="6" y="14" fill="#8a96a8" font-size="10" font-weight="700">pH-颜色映射</text>
        <text x="354" y="14" fill="#8a96a8" font-size="10" font-weight="700" text-anchor="end">${ind.name}</text>
        ${parts.join('')}
        <text x="20" y="68" fill="#8a96a8" font-size="9">0</text>
        <text x="180" y="68" fill="#8a96a8" font-size="9" text-anchor="middle">7</text>
        <text x="340" y="68" fill="#8a96a8" font-size="9" text-anchor="end">14</text>
      `;
    }

    function setParameters(values) {
      if (values.ph !== undefined) {
        state.ph = clamp(finite(Number(values.ph), 7), 0, 14);
      }
      if (values.indicator !== undefined && indicators[values.indicator]) {
        state.indicator = values.indicator;
        // 更新按钮状态
        elements.indicatorTabs.querySelectorAll("button").forEach(btn => {
          btn.setAttribute("aria-pressed", btn.dataset.indicator === state.indicator ? "true" : "false");
        });
      }
      render();
    }

    function getState() {
      return { ph: state.ph, indicator: state.indicator, titrating: state.titrating, titrateProgress: state.titrateProgress };
    }

    function getReadouts() {
      return { ph: state.ph, indicator: indicators[state.indicator].name, range: indicators[state.indicator].range };
    }

    function runModelChecks() {
      const results = [];
      // 1. 颜色连续性：pH 微小变化时颜色变化也微小
      const c1 = getIndicatorColor(7.0, "universal");
      const c2 = getIndicatorColor(7.01, "universal");
      const colorDiff = Math.abs(c1[0]-c2[0]) + Math.abs(c1[1]-c2[1]) + Math.abs(c1[2]-c2[2]);
      results.push({ name: "颜色连续性", pass: colorDiff < 3, expected: "微小 pH 变化 → 微小颜色变化", actual: `色差=${colorDiff}`, tolerance: "<3" });

      // 2. 变色范围下边界：pH <= lo 返回 acidColor
      const phenol = indicators.phenolphthalein;
      const cLow = getIndicatorColor(phenol.range[0] - 0.1, "phenolphthalein");
      const matchLow = cLow[0] === phenol.acidColor[0] && cLow[1] === phenol.acidColor[1] && cLow[2] === phenol.acidColor[2];
      results.push({ name: "下边界酸色", pass: matchLow, expected: rgbStr(phenol.acidColor), actual: rgbStr(cLow), tolerance: "exact" });

      // 3. 变色范围上边界：pH >= hi 返回 baseColor
      const cHigh = getIndicatorColor(phenol.range[1] + 0.1, "phenolphthalein");
      const matchHigh = cHigh[0] === phenol.baseColor[0] && cHigh[1] === phenol.baseColor[1] && cHigh[2] === phenol.baseColor[2];
      results.push({ name: "上边界碱色", pass: matchHigh, expected: rgbStr(phenol.baseColor), actual: rgbStr(cHigh), tolerance: "exact" });

      // 4. 中点颜色为两端线性插值
      const midPh = (phenol.range[0] + phenol.range[1]) / 2;
      const cMid = getIndicatorColor(midPh, "phenolphthalein");
      const expectedMid = lerpColor(phenol.acidColor, phenol.baseColor, 0.5);
      const midMatch = Math.abs(cMid[0]-expectedMid[0]) <= 1 && Math.abs(cMid[1]-expectedMid[1]) <= 1 && Math.abs(cMid[2]-expectedMid[2]) <= 1;
      results.push({ name: "中点线性插值", pass: midMatch, expected: rgbStr(expectedMid), actual: rgbStr(cMid), tolerance: "±1" });

      // 5. 单调性：变色范围内各通道单调或先增后减
      const samples = [];
      for (let i = 0; i <= 10; i++) samples.push(getIndicatorColor(phenol.range[0] + (i/10)*(phenol.range[1]-phenol.range[0]), "phenolphthalein"));
      let monotonicR = true, monotonicG = true, monotonicB = true;
      for (let i = 1; i < samples.length; i++) {
        if (samples[i][0] < samples[i-1][0] - 1) monotonicR = false;
        if (samples[i][1] < samples[i-1][1] - 1) monotonicG = false;
        if (samples[i][2] < samples[i-1][2] - 1) monotonicB = false;
      }
      const monotonic = monotonicR || monotonicG || monotonicB;
      results.push({ name: "插值单调性", pass: monotonic, expected: "至少一个通道单调变化", actual: `R=${monotonicR},G=${monotonicG},B=${monotonicB}`, tolerance: "strict" });

      // 6. 酚酞酸性端无色（RGB 接近 255）
      const phenolAcid = getIndicatorColor(2, "phenolphthalein");
      const isColorless = phenolAcid[0] > 250 && phenolAcid[1] > 250 && phenolAcid[2] > 250;
      results.push({ name: "酚酞酸性无色", pass: isColorless, expected: "rgb≈(255,255,255)", actual: rgbStr(phenolAcid), tolerance: ">250" });

      return results;
    }

    function bindControls() {
      elements.titrateBtn.addEventListener("click", () => {
        if (state.titrating) pause();
        else start();
      });
      elements.pauseBtn.addEventListener("click", pause);
      elements.resetBtn.addEventListener("click", reset);
      elements.phInput.addEventListener("input", () => {
        if (state.titrating) pause();
        setParameters({ ph: elements.phInput.value });
      });
      elements.indicatorTabs.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", () => {
          setParameters({ indicator: btn.dataset.indicator });
        });
      });
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
    init();
  })();
  </script>
</body>
</html>
