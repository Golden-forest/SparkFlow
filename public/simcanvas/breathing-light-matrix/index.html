<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>行波光点矩阵</title>
<style>
:root{
  color-scheme:dark;
  --sim-bg:#05080f;
  --sim-surface:#0a0f1a;
  --sim-surface-soft:#0e1422;
  --sim-text:#e8f0ff;
  --sim-muted:#5a6a82;
  --sim-border:#1a2236;
  --sim-grid:#141c2e;
  --sim-accent:#4dd9ff;
  --sim-accent-deep:#1a8fb8;
  --sim-accent-soft:rgba(77,217,255,.12);
  --sim-positive:#4dd9ff;
  --sim-warning:#f59e0b;
  --sim-danger:#dc2626;
  --sim-radius-sm:8px;
  --sim-radius-md:12px;
  --sim-radius-lg:16px;
  --sim-shadow:0 8px 24px rgba(0,0,0,.4);
  --sim-space-1:4px;
  --sim-space-2:8px;
  --sim-space-3:12px;
  --sim-space-4:16px;
  --sim-space-5:24px;
  --sim-space-6:32px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:var(--sim-bg);
  color:var(--sim-text);
  font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
#stage{
  position:fixed;inset:0;
  width:100%;height:100%;
  display:block;
  background:radial-gradient(ellipse at 50% 50%,#0a1220 0%,#05080f 70%,#02040a 100%);
}
#header{
  position:fixed;
  top:0;left:0;right:0;
  z-index:20;
  padding:14px 22px 10px;
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(5,8,15,.72) 0%,rgba(5,8,15,.32) 60%,rgba(5,8,15,0) 100%);
}
#header .title-block{pointer-events:auto}
#header h1{
  font-size:clamp(1.1rem,1.8vw,1.5rem);
  font-weight:780;letter-spacing:-.02em;line-height:1.1;
  color:rgba(232,240,255,.92);
  text-shadow:0 2px 12px rgba(0,0,0,.5);
}
#header .subtitle{
  margin-top:3px;
  font-size:11px;letter-spacing:.04em;
  color:rgba(140,170,200,.5);
}
#status{
  pointer-events:auto;
  border:1px solid rgba(77,217,255,.22);
  border-radius:999px;
  padding:7px 14px;
  background:rgba(10,18,32,.55);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  color:rgba(220,240,255,.8);
  font-size:11px;font-weight:700;letter-spacing:.06em;
  white-space:nowrap;
}
#evidence{
  position:fixed;
  top:64px;right:18px;
  z-index:15;
  display:flex;flex-direction:column;gap:8px;
  pointer-events:none;
}
.metric-chip{
  pointer-events:auto;
  min-width:108px;
  padding:9px 13px;
  border:1px solid rgba(77,217,255,.14);
  border-radius:10px;
  background:rgba(10,18,32,.5);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.metric-chip small{
  display:block;
  font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(140,170,200,.45);
  margin-bottom:2px;
}
.metric-chip strong{
  font-size:1.05rem;font-weight:700;
  color:rgba(232,240,255,.9);
  font-variant-numeric:tabular-nums;
}
#formula{
  position:fixed;
  left:20px;bottom:18px;
  font-size:12px;
  letter-spacing:.02em;
  color:rgba(180,210,240,.32);
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  pointer-events:none;
  user-select:none;
  z-index:10;
  text-shadow:0 0 12px rgba(0,0,0,.6);
}
#formula .name{
  display:block;
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:rgba(140,170,200,.28);
  margin-bottom:3px;
}
#toggleBtn{
  position:fixed;
  right:20px;bottom:18px;
  width:38px;height:38px;
  border-radius:50%;
  border:1px solid rgba(77,217,255,.22);
  background:rgba(10,18,32,.55);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  color:rgba(220,240,255,.7);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  z-index:10;
  transition:background .2s ease,border-color .2s ease,transform .15s ease;
}
#toggleBtn:hover{
  background:rgba(20,34,56,.7);
  border-color:rgba(77,217,255,.4);
}
#toggleBtn:active{transform:scale(.94)}
#toggleBtn:focus-visible{outline:2px solid rgba(77,217,255,.5);outline-offset:2px}
#toggleBtn svg{width:14px;height:14px;fill:currentColor}
@media(max-width:600px){
  #header{padding:10px 14px 8px}
  #header h1{font-size:1.05rem}
  #header .subtitle{font-size:10px}
  #status{padding:6px 11px;font-size:10px}
  #evidence{top:56px;right:12px;gap:6px}
  .metric-chip{min-width:92px;padding:7px 10px}
  .metric-chip strong{font-size:.95rem}
  #formula{font-size:10px;left:14px;bottom:14px}
  #toggleBtn{width:34px;height:34px;right:14px;bottom:14px}
}
@media(prefers-reduced-motion:reduce){
  #toggleBtn{transition:none}
}
</style>
</head>
<body>
<canvas id="stage" data-region="stage"></canvas>
<header id="header" data-region="header">
  <div class="title-block">
    <h1>行波光点矩阵</h1>
    <p class="subtitle">Traveling-wave dot matrix · I(x,y,t) = 0.5 + 0.5·sin(kx − ωt + φ)</p>
  </div>
  <div id="status" class="status" role="status" aria-live="polite">运行中</div>
</header>
<aside id="evidence" data-region="evidence" aria-label="实时读数">
  <div class="metric-chip"><small>时间 t</small><strong id="timeReadout">0.00 s</strong></div>
  <div class="metric-chip"><small>波速 ω</small><strong id="speedReadout">1.0 rad/s</strong></div>
  <div class="metric-chip"><small>波长 λ</small><strong id="wavelengthReadout">5.0 格</strong></div>
</aside>
<div id="formula" data-region="insight" aria-hidden="true">
  <span class="name">行波光点矩阵</span>
  I(x,y,t) = 0.5 + 0.5·sin(kx − ωt + φ)
</div>
<button id="toggleBtn" data-region="controls" type="button" aria-label="暂停" aria-pressed="false">
  <svg viewBox="0 0 24 24" id="iconPause"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  <svg viewBox="0 0 24 24" id="iconPlay" style="display:none"><path d="M7 5v14l12-7z"/></svg>
</button>
<script>
(()=>{
  "use strict";
  // ---------- 参数 schema ----------
  const parameterSchema=[
    {key:"waveSpeed",label:"波速",type:"slider",min:0.2,max:3,step:0.1,default:1.0,unit:"rad/s"},
    {key:"wavelength",label:"波长",type:"slider",min:2,max:12,step:0.5,default:5.0,unit:"格"},
    {key:"diagonalMix",label:"对角混合",type:"slider",min:0,max:1,step:0.05,default:0.55,unit:""}
  ];
  // ---------- 状态 ----------
  const state={
    running:true,
    t:0,
    lastTimestamp:null,
    waveSpeed:1.0,
    wavelength:5.0,
    diagonalMix:0.55,
    phaseSeed: 0.0
  };
  // ---------- DOM ----------
  const canvas=document.getElementById("stage");
  const ctx=canvas.getContext("2d",{alpha:false});
  const toggleBtn=document.getElementById("toggleBtn");
  const iconPause=document.getElementById("iconPause");
  const iconPlay=document.getElementById("iconPlay");
  const statusEl=document.getElementById("status");
  const timeReadout=document.getElementById("timeReadout");
  const speedReadout=document.getElementById("speedReadout");
  const wavelengthReadout=document.getElementById("wavelengthReadout");
  // ---------- 几何 ----------
  let dpr=1,W=0,H=0;
  let cols=40,rows=24;
  let cellW=0,cellH=0,originX=0,originY=0;
  let dotRadius=0;
  let edgeFade=0;
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;
    H=window.innerHeight;
    canvas.width=Math.floor(W*dpr);
    canvas.height=Math.floor(H*dpr);
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const targetDensity=40;
    const aspect=W/H;
    cols=Math.round(targetDensity);
    rows=Math.max(14,Math.round(targetDensity/aspect*0.62));
    const padX=W*0.06, padY=H*0.07;
    const availW=W-padX*2;
    const availH=H-padY*2;
    cellW=availW/(cols-1);
    cellH=availH/(rows-1);
    const spacing=Math.min(cellW,cellH);
    cellW=spacing;
    cellH=spacing;
    const gridW=(cols-1)*cellW;
    const gridH=(rows-1)*cellH;
    originX=(W-gridW)/2;
    originY=(H-gridH)/2;
    dotRadius=Math.max(1.2,spacing*0.16);
    edgeFade=Math.min(W,H)*0.22;
  }
  // ---------- 颜色：深蓝→青→白 ----------
  function colorFor(brightness){
    let r,g,b;
    if(brightness<0.5){
      const u=brightness/0.5;
      r=Math.round(26+(45-26)*u);
      g=Math.round(58+(181-58)*u);
      b=Math.round(106+(216-106)*u);
    }else{
      const u=(brightness-0.5)/0.5;
      r=Math.round(45+(232-45)*u);
      g=Math.round(181+(244-181)*u);
      b=Math.round(216+(255-216)*u);
    }
    return [r,g,b];
  }
  // ---------- 行波函数 ----------
  function brightnessAt(gx,gy,t){
    const k=2*Math.PI/Math.max(0.5,state.wavelength);
    const omega=state.waveSpeed;
    const phi=gy*0.42*state.diagonalMix + state.phaseSeed;
    const raw=Math.sin(k*gx - omega*t + phi);
    return 0.5+0.5*raw;
  }
  // ---------- 边缘淡出权重 ----------
  function edgeWeight(px,py){
    const cx=W*0.5, cy=H*0.5;
    const dx=(px-cx)/(W*0.5);
    const dy=(py-cy)/(H*0.5);
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<0.7) return 1;
    if(dist>1.0) return 0;
    const t=(dist-0.7)/0.3;
    return Math.pow(1-t,1.6);
  }
  // ---------- 渲染 ----------
  function render(){
    ctx.fillStyle="#05080f";
    ctx.fillRect(0,0,W,H);
    const cg=ctx.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,Math.max(W,H)*0.6);
    cg.addColorStop(0,"rgba(20,40,70,0.18)");
    cg.addColorStop(0.5,"rgba(10,20,40,0.06)");
    cg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=cg;
    ctx.fillRect(0,0,W,H);
    const t=state.t;
    for(let gy=0;gy<rows;gy++){
      for(let gx=0;gx<cols;gx++){
        const px=originX+gx*cellW;
        const py=originY+gy*cellH;
        const ew=edgeWeight(px,py);
        if(ew<=0.01) continue;
        const I=brightnessAt(gx,gy,t);
        const brightness=I*ew;
        if(brightness<0.02) continue;
        const [r,g,b]=colorFor(brightness);
        const haloR=dotRadius*(2.2+brightness*1.8);
        const haloA=brightness*0.22;
        ctx.beginPath();
        ctx.arc(px,py,haloR,0,Math.PI*2);
        ctx.fillStyle=`rgba(${r},${g},${b},${haloA})`;
        ctx.fill();
      }
    }
    for(let gy=0;gy<rows;gy++){
      for(let gx=0;gx<cols;gx++){
        const px=originX+gx*cellW;
        const py=originY+gy*cellH;
        const ew=edgeWeight(px,py);
        if(ew<=0.01) continue;
        const I=brightnessAt(gx,gy,t);
        const brightness=I*ew;
        if(brightness<0.02) continue;
        const [r,g,b]=colorFor(brightness);
        const coreR=dotRadius*(0.55+brightness*0.9);
        const coreA=Math.min(1,0.35+brightness*0.85);
        ctx.beginPath();
        ctx.arc(px,py,coreR,0,Math.PI*2);
        ctx.fillStyle=`rgba(${r},${g},${b},${coreA})`;
        ctx.fill();
        if(brightness>0.78){
          const hlR=coreR*0.4;
          ctx.beginPath();
          ctx.arc(px,py,hlR,0,Math.PI*2);
          ctx.fillStyle=`rgba(255,255,255,${(brightness-0.78)/0.22*0.6})`;
          ctx.fill();
        }
      }
    }
    // 更新读数
    timeReadout.textContent=state.t.toFixed(2)+" s";
    speedReadout.textContent=state.waveSpeed.toFixed(1)+" rad/s";
    wavelengthReadout.textContent=state.wavelength.toFixed(1)+" 格";
  }
  // ---------- 更新 ----------
  function clamp(v,min,max){return Math.min(max,Math.max(min,v));}
  function finite(v,fb){return Number.isFinite(v)?v:fb;}
  function update(dt){
    if(!state.running) return;
    const bdt=clamp(finite(dt,0),0,0.05);
    state.t+=bdt;
  }
  // ---------- 生命周期 ----------
  function init(){
    resize();
    window.addEventListener("resize",resize);
    bindControls();
    state.lastTimestamp=null;
    requestAnimationFrame(frame);
  }
  function start(){
    state.running=true;
    toggleBtn.setAttribute("aria-pressed","false");
    toggleBtn.setAttribute("aria-label","暂停");
    iconPause.style.display="";
    iconPlay.style.display="none";
    statusEl.textContent="运行中";
  }
  function pause(){
    state.running=false;
    toggleBtn.setAttribute("aria-pressed","true");
    toggleBtn.setAttribute("aria-label","播放");
    iconPause.style.display="none";
    iconPlay.style.display="";
    statusEl.textContent="已暂停";
  }
  function toggle(){ state.running?pause():start(); }
  function reset(){
    state.t=0;
    state.lastTimestamp=null;
    setParameters({waveSpeed:1.0,wavelength:5.0,diagonalMix:0.55});
    if(!state.running) start();
  }
  function setParameters(values){
    const d=parameterSchema;
    state.waveSpeed=clamp(finite(Number(values.waveSpeed),d[0].default),d[0].min,d[0].max);
    state.wavelength=clamp(finite(Number(values.wavelength),d[1].default),d[1].min,d[1].max);
    state.diagonalMix=clamp(finite(Number(values.diagonalMix),d[2].default),d[2].min,d[2].max);
  }
  function getState(){return{...state};}
  function getReadouts(){return{t:state.t,waveSpeed:state.waveSpeed,wavelength:state.wavelength,diagonalMix:state.diagonalMix};}
  function runModelChecks(){
    const t=1.234;
    const k=2*Math.PI/5.0;
    const omega=1.0;
    const phi=3*0.42*0.55;
    const expected=0.5+0.5*Math.sin(k*3-omega*t+phi);
    const actual=brightnessAt(3,3,t);
    const b0=brightnessAt(5,5,0);
    const b1=brightnessAt(5,5,0.5);
    const changesOverTime = b0!==b1;
    let inRange=true;
    for(let gx=0;gx<cols;gx+=3){
      for(let gy=0;gy<rows;gy+=3){
        const v=brightnessAt(gx,gy,t);
        if(v<0||v>1) inRange=false;
      }
    }
    return [
      {name:"确定性公式一致",pass:Math.abs(expected-actual)<1e-9,expected:expected,actual:actual,tolerance:1e-9},
      {name:"亮度范围 [0,1]",pass:inRange,expected:"0≤I≤1",actual:"抽样检查",tolerance:"严格"},
      {name:"时间演化非静止",pass:changesOverTime,expected:"b0≠b1",actual:`${b0} vs ${b1}`,tolerance:"严格"}
    ];
  }
  function bindControls(){
    toggleBtn.addEventListener("click",toggle);
    window.addEventListener("keydown",(e)=>{
      if(e.code==="Space"){e.preventDefault();toggle();}
    });
  }
  function frame(timestamp){
    if(state.lastTimestamp===null) state.lastTimestamp=timestamp;
    const dt=(timestamp-state.lastTimestamp)/1000;
    state.lastTimestamp=timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  window.simulation={init,start,pause,reset,update,render,setParameters,getState,getReadouts,runModelChecks};
  init();
})();
</script>
</body>
</html>
