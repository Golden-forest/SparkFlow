<!DOCTYPE html>
<html lang="zh-CN">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光的折射教学演示 (Snell's Law)</title>
    <style>
        :root {
            --sim-bg: #f4f7f9;
            --sim-surface: #ffffff;
            --sim-surface-soft: #f0f4f8;
            --sim-text: #2d3748;
            --sim-muted: #718096;
            --sim-border: #e2e8f0;
            --sim-grid: #edf2f7;
            --sim-accent: #3182ce;
            --sim-accent-deep: #2b6cb0;
            --sim-accent-soft: #ebf8ff;
            --sim-positive: #48bb78;
            --sim-warning: #ecc94b;
            --sim-danger: #f56565;
            --sim-radius-sm: 4px;
            --sim-radius-md: 8px;
            --sim-radius-lg: 12px;
            --sim-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --sim-space-1: 0.25rem;
            --sim-space-2: 0.5rem;
            --sim-space-3: 0.75rem;
            --sim-space-4: 1rem;
            --sim-space-5: 1.5rem;
            --sim-space-6: 2rem;
            
            /* Custom tokens for this specific sim */
            --water-color: rgba(66, 153, 225, 0.15);
            --water-line: #3182ce;
            --ray-color: #f6e05e;
            --ray-glow: rgba(246, 224, 94, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--sim-bg);
            color: var(--sim-text);
            line-height: 1.5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 1200px;
            height: 100%;
            max-height: 900px;
            background: var(--sim-surface);
            display: grid;
            grid-template-columns: 1fr 320px;
            grid-template-rows: auto 1fr auto;
            gap: var(--sim-space-4);
            padding: var(--sim-space-4);
            box-shadow: var(--sim-shadow);
            border-radius: var(--sim-radius-lg);
        }

        /* Header */
        header[data-region="header"] {
            grid-column: 1 / -1;
            border-bottom: 1px solid var(--sim-border);
            padding-bottom: var(--sim-space-3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { font-size: 1.25rem; font-weight: 700; color: var(--sim-text); }
        .subtitle { font-size: 0.875rem; color: var(--sim-muted); }

        /* Stage (Canvas) */
        section[data-region="stage"] {
            grid-column: 1 / 2;
            grid-row: 2 / 3;
            position: relative;
            background: var(--sim-surface-soft);
            border-radius: var(--sim-radius-md);
            border: 1px solid var(--sim-border);
            overflow: hidden;
            cursor: crosshair;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* Sidebar (Controls & Evidence) */
        aside {
            grid-column: 2 / 3;
            grid-row: 2 / 4;
            display: flex;
            flex-direction: column;
            gap: var(--sim-space-4);
            overflow-y: auto;
        }

        .panel {
            background: var(--sim-surface);
            border: 1px solid var(--sim-border);
            border-radius: var(--sim-radius-md);
            padding: var(--sim-space-4);
        }

        .panel-title {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--sim-muted);
            margin-bottom: var(--sim-space-3);
            display: flex;
            align-items: center;
            gap: var(--sim-space-2);
        }

        /* Controls */
        .control-group { margin-bottom: var(--sim-space-4); }
        .control-group:last-child { margin-bottom: 0; }
        
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: var(--sim-space-1);
            color: var(--sim-text);
        }

        input[type="range"] {
            width: 100%;
            margin: var(--sim-space-2) 0;
            accent-color: var(--sim-accent);
        }

        .value-display {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--sim-accent-deep);
            float: right;
        }

        /* Evidence / Readouts */
        .readout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--sim-space-3);
        }

        .metric {
            background: var(--sim-surface-soft);
            padding: var(--sim-space-2);
            border-radius: var(--sim-radius-sm);
            text-align: center;
        }

        .metric-label { font-size: 0.75rem; color: var(--sim-muted); display: block; }
        .metric-value { font-size: 1.125rem; font-weight: 700; color: var(--sim-text); font-variant-numeric: tabular-nums; }

        /* Insight */
        section[data-region="insight"] {
            grid-column: 1 / 2;
            grid-row: 3 / 4;
            background: var(--sim-accent-soft);
            border-left: 4px solid var(--sim-accent);
            padding: var(--sim-space-3);
            border-radius: var(--sim-radius-sm);
            font-size: 0.9rem;
            color: var(--sim-accent-deep);
        }

        /* Footer/Controls Area */
        footer[data-region="controls"] {
            grid-column: 1 / 2;
            grid-row: 4 / 5; /* Actually handled by layout flow, usually bottom of stage or separate */
            display: none; /* Merged into sidebar for this layout */
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 40vh auto auto;
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }
            aside { grid-column: 1 / -1; grid-row: 3 / 4; }
            section[data-region="insight"] { grid-row: 4 / 5; }
        }

        @media (prefers-reduced-motion: reduce) {
            canvas { animation: none !important; }
        }
    </style>
</head>
<body>

<div class="app-container" data-model-tier="analytic" data-execution-mode="continuous">
    
    <header data-region="header">
        <div>
            <h1>光的折射：斯涅尔定律</h1>
            <div class="subtitle">Refraction of Light: Snell's Law</div>
        </div>
        <div style="font-size: 0.8rem; color: var(--sim-muted);">SimCanvas v1.0</div>
    </header>

    <section data-region="stage" id="stage-container">
        <canvas id="sim-canvas"></canvas>
    </section>

    <aside>
        <!-- Controls -->
        <div class="panel" data-region="controls">
            <div class="panel-title">参数控制 Parameters</div>
            
            <div class="control-group">
                <label for="angle-slider">入射角 (θ₁) <span id="angle-val" class="value-display">30°</span></label>
                <input type="range" id="angle-slider" min="0" max="85" value="30" step="1">
            </div>

            <div class="control-group">
                <label for="index-slider">水的折射率 (n₂) <span id="index-val" class="value-display">1.33</span></label>
                <input type="range" id="index-slider" min="1.00" max="2.50" value="1.33" step="0.01">
                <div style="display:flex; justify-content:space-between; font-size:0.7rem; color:var(--sim-muted); margin-top:4px;">
                    <span>空气 (1.00)</span>
                    <span>钻石 (2.42)</span>
                </div>
            </div>
        </div>

        <!-- Evidence -->
        <div class="panel" data-region="evidence">
            <div class="panel-title">实时数据 Evidence</div>
            <div class="readout-grid">
                <div class="metric">
                    <span class="metric-label">入射角 θ₁</span>
                    <span class="metric-value" id="read-theta1">30.0°</span>
                </div>
                <div class="metric">
                    <span class="metric-label">折射角 θ₂</span>
                    <span class="metric-value" id="read-theta2">22.1°</span>
                </div>
                <div class="metric">
                    <span class="metric-label">sin(θ₁)</span>
                    <span class="metric-value" id="read-sin1">0.500</span>
                </div>
                <div class="metric">
                    <span class="metric-label">sin(θ₂)</span>
                    <span class="metric-value" id="read-sin2">0.376</span>
                </div>
            </div>
            <div style="margin-top: var(--sim-space-3); padding-top: var(--sim-space-3); border-top: 1px dashed var(--sim-border); text-align: center;">
                <span class="metric-label">验证 n₁·sin(θ₁) ≈ n₂·sin(θ₂)</span>
                <div style="font-size: 0.9rem; font-weight: bold; color: var(--sim-positive); margin-top: 4px;">
                    <span id="eq-lhs">0.500</span> ≈ <span id="eq-rhs">0.500</span>
                </div>
            </div>
        </div>
    </aside>

    <section data-region="insight">
        <strong>观察：</strong> 当光从空气（疏介质）进入水（密介质）时，传播速度变慢，光线向法线偏折。拖动滑块增加入射角，观察折射角如何非线性变化。
    </section>

</div>

<script>
/**
 * SimCanvas Logic
 * Model Tier: Analytic (Geometric Optics)
 */

// --- Global State ---
const state = {
    running: true,
    width: 0,
    height: 0,
    // Physics parameters
    n1: 1.00,      // Air
    n2: 1.33,      // Water
    theta1: 30,    // Incident angle in degrees
    
    // Derived state
    theta2: 0,     // Refracted angle in degrees
    
    // Animation particles
    photons: [],
    lastTime: 0
};

// --- DOM Elements ---
const canvas = document.getElementById('sim-canvas');
const ctx = canvas.getContext('2d');
const els = {
    angleSlider: document.getElementById('angle-slider'),
    angleVal: document.getElementById('angle-val'),
    indexSlider: document.getElementById('index-slider'),
    indexVal: document.getElementById('index-val'),
    readTheta1: document.getElementById('read-theta1'),
    readTheta2: document.getElementById('read-theta2'),
    readSin1: document.getElementById('read-sin1'),
    readSin2: document.getElementById('read-sin2'),
    eqLhs: document.getElementById('eq-lhs'),
    eqRhs: document.getElementById('eq-rhs')
};

// --- Core Functions ---

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Bind controls
    els.angleSlider.addEventListener('input', (e) => {
        setParameters({ theta1: parseFloat(e.target.value) });
    });
    els.indexSlider.addEventListener('input', (e) => {
        setParameters({ n2: parseFloat(e.target.value) });
    });

    // Initial calculation
    calculatePhysics();
    
    // Start loop
    requestAnimationFrame(loop);
}

function start() {
    state.running = true;
    state.lastTime = performance.now();
    requestAnimationFrame(loop);
}

function pause() {
    state.running = false;
}

function reset() {
    setParameters({ theta1: 30, n2: 1.33 });
    els.angleSlider.value = 30;
    els.indexSlider.value = 1.33;
    state.photons = [];
    render();
}

function setParameters(values) {
    if (values.theta1 !== undefined) state.theta1 = values.theta1;
    if (values.n2 !== undefined) state.n2 = values.n2;
    
    // Update UI inputs to match state (in case of programmatic reset)
    els.angleSlider.value = state.theta1;
    els.indexSlider.value = state.n2;
    
    calculatePhysics();
    updateReadouts();
    if (!state.running) render();
}

function getState() {
    return { ...state };
}

function getReadouts() {
    const t1Rad = state.theta1 * Math.PI / 180;
    const t2Rad = state.theta2 * Math.PI / 180;
    return {
        incidentAngle: state.theta1,
        refractedAngle: state.theta2,
        sin1: Math.sin(t1Rad),
        sin2: Math.sin(t2Rad),
        snellCheckLHS: state.n1 * Math.sin(t1Rad),
        snellCheckRHS: state.n2 * Math.sin(t2Rad)
    };
}

function runModelChecks() {
    const r = getReadouts();
    const tolerance = 0.001;
    const pass = Math.abs(r.snellCheckLHS - r.snellCheckRHS) < tolerance;
    return [{
        name: "Snell's Law Conservation",
        pass: pass,
        expected: r.snellCheckLHS.toFixed(4),
        actual: r.snellCheckRHS.toFixed(4),
        tolerance: tolerance
    }];
}

// --- Internal Logic ---

function resize() {
    const container = document.getElementById('stage-container');
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
    state.width = canvas.width;
    state.height = canvas.height;
    if (!state.running) render();
}

function calculatePhysics() {
    // Snell's Law: n1 * sin(theta1) = n2 * sin(theta2)
    const t1Rad = state.theta1 * Math.PI / 180;
    const sinT2 = (state.n1 * Math.sin(t1Rad)) / state.n2;
    
    // Handle total internal reflection (though unlikely air->water)
    if (sinT2 > 1) {
        state.theta2 = 90; 
    } else {
        state.theta2 = Math.asin(sinT2) * 180 / Math.PI;
    }
}

function updateReadouts() {
    const data = getReadouts();
    
    els.angleVal.textContent = state.theta1 + '°';
    els.indexVal.textContent = state.n2.toFixed(2);
    
    els.readTheta1.textContent = state.theta1.toFixed(1) + '°';
    els.readTheta2.textContent = state.theta2.toFixed(1) + '°';
    
    els.readSin1.textContent = data.sin1.toFixed(3);
    els.readSin2.textContent = data.sin2.toFixed(3);
    
    els.eqLhs.textContent = data.snellCheckLHS.toFixed(3);
    els.eqRhs.textContent = data.snellCheckRHS.toFixed(3);
}

function update(dt) {
    // Spawn photons
    if (Math.random() < 0.2) { // Density of particles
        state.photons.push({
            progress: 0, // 0 to 2 (0-1 is air, 1-2 is water)
            speed: 0.8   // Base speed factor
        });
    }

    // Move photons
    for (let i = state.photons.length - 1; i >= 0; i--) {
        let p = state.photons[i];
        
        // Speed depends on medium
        // In air (progress < 1): speed proportional to 1/n1
        // In water (progress >= 1): speed proportional to 1/n2
        let currentSpeed = p.speed;
        if (p.progress >= 1) {
            currentSpeed = p.speed * (state.n1 / state.n2);
        }
        
        p.progress += currentSpeed * dt;
        
        if (p.progress > 2) {
            state.photons.splice(i, 1);
        }
    }
}

function render() {
    const w = state.width;
    const h = state.height;
    const cx = w / 2;
    const cy = h / 2;
    const rayLen = Math.min(w, h) * 0.45;

    ctx.clearRect(0, 0, w, h);

    // 1. Draw Backgrounds
    // Air (Top)
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, cy);
    
    // Water (Bottom)
    // Gradient for depth
    const grad = ctx.createLinearGradient(0, cy, 0, h);
    grad.addColorStop(0, 'rgba(66, 153, 225, 0.1)');
    grad.addColorStop(1, 'rgba(49, 130, 206, 0.3)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, cy, w, h - cy);

    // Interface Line
    ctx.beginPath();
    ctx.moveTo(0, cy);
    ctx.lineTo(w, cy);
    ctx.strokeStyle = 'var(--water-line)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Labels
    ctx.font = '14px sans-serif';
    ctx.fillStyle = 'var(--sim-muted)';
    ctx.fillText('空气 (Air, n₁≈1.0)', 20, cy - 20);
    ctx.fillStyle = 'var(--sim-accent-deep)';
    ctx.fillText(`水 (Water, n₂=${state.n2.toFixed(2)})`, 20, cy + 30);

    // 2. Draw Normal Line (Dashed)
    ctx.beginPath();
    ctx.setLineDash([5, 5]);
    ctx.moveTo(cx, cy - rayLen * 0.9);
    ctx.lineTo(cx, cy + rayLen * 0.9);
    ctx.strokeStyle = '#cbd5e0';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.setLineDash([]);

    // 3. Calculate Ray Endpoints
    const t1Rad = state.theta1 * Math.PI / 180;
    const t2Rad = state.theta2 * Math.PI / 180;

    // Incident Ray (Coming from top-left towards center)
    // Note: Canvas Y is down. Angle is from Normal (Up).
    // x = cx - sin(t1)*len, y = cy - cos(t1)*len
    const incX = cx - Math.sin(t1Rad) * rayLen;
    const incY = cy - Math.cos(t1Rad) * rayLen;

    // Refracted Ray (Going to bottom-right)
    // x = cx + sin(t2)*len, y = cy + cos(t2)*len
    const refX = cx + Math.sin(t2Rad) * rayLen;
    const refY = cy + Math.cos(t2Rad) * rayLen;

    // 4. Draw Rays (Glowing effect)
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Glow
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'var(--ray-glow)';
    ctx.strokeStyle = 'var(--ray-color)';
    ctx.lineWidth = 4;

    // Incident Path
    ctx.beginPath();
    ctx.moveTo(incX, incY);
    ctx.lineTo(cx, cy);
    ctx.stroke();

    // Refracted Path
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(refX, refY);
    ctx.stroke();

    ctx.shadowBlur = 0; // Reset shadow

    // 5. Draw Angles (Arcs)
    const arcRadius = 40;
    
    // Incident Arc (Greenish)
    ctx.beginPath();
    // Arc from Normal (270deg or -PI/2) to Ray direction
    // Ray direction angle in canvas coords: atan2(incY-cy, incX-cx)
    // But simpler: draw from -PI/2 to -PI/2 - t1Rad (counter-clockwise)
    ctx.arc(cx, cy, arcRadius, -Math.PI/2 - t1Rad, -Math.PI/2, false);
    ctx.strokeStyle = 'var(--sim-positive)';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Label θ1
    ctx.fillStyle = 'var(--sim-positive)';
    ctx.font = 'bold 14px serif';
    ctx.fillText('θ₁', cx - 25, cy - 50);

    // Refracted Arc (Blueish)
    ctx.beginPath();
    // From Normal (PI/2) to Ray (PI/2 - t2Rad ?? No, ray is to the left of normal if we look down? No, ray bends towards normal)
    // If incident is Top-Left, Refracted is Bottom-Right (closer to vertical).
    // Vertical Down is PI/2. Ray is at PI/2 - t2Rad.
    ctx.arc(cx, cy, arcRadius, Math.PI/2 - t2Rad, Math.PI/2, false);
    ctx.strokeStyle = 'var(--sim-accent)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Label θ2
    ctx.fillStyle = 'var(--sim-accent)';
    ctx.fillText('θ₂', cx + 15, cy + 60);

    // 6. Draw Photons (Particles)
    ctx.fillStyle = '#fff';
    state.photons.forEach(p => {
        let px, py;
        if (p.progress <= 1) {
            // Interpolate Incident
            // p.progress goes 0 -> 1. Map to line segment.
            // Actually, let's map 0->1 to full length for simplicity of visual speed
            // Visual: 0 is source, 1 is interface.
            const ratio = p.progress; 
            px = incX + (cx - incX) * ratio;
            py = incY + (cy - incY) * ratio;
        } else {
            // Interpolate Refracted
            const ratio = p.progress - 1;
            px = cx + (refX - cx) * ratio;
            py = cy + (refY - cy) * ratio;
        }
        
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI*2);
        ctx.fill();
    });
}

function loop(timestamp) {
    if (!state.running) return;
    
    const dt = (timestamp - state.lastTime) / 1000;
    state.lastTime = timestamp;
    
    // Cap dt to prevent huge jumps if tab inactive
    const safeDt = Math.min(dt, 0.1);
    
    update(safeDt);
    render();
    
    requestAnimationFrame(loop);
}

// --- Expose Interface ---
window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };

// Auto-start
window.onload = () => {
    window.simulation.init();
};

</script>
</body>
</html>
