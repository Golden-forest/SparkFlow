<!doctype html>
<html lang="zh-CN">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动物细胞有丝分裂全过程</title>
<style>
:root {
  color-scheme: light;
  --sim-bg: #eef3f8;
  --sim-surface: #ffffff;
  --sim-surface-soft: #f8fafc;
  --sim-text: #172033;
  --sim-muted: #657188;
  --sim-border: #dfe6ef;
  --sim-grid: #e8edf4;
  --sim-accent: #0f9fba;
  --sim-accent-deep: #08758a;
  --sim-accent-soft: #d9f4f7;
  --sim-positive: #0f9fba;
  --sim-warning: #d97706;
  --sim-danger: #dc2626;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
  --sim-chromatin: #5b6c8c;
  --sim-chromosome: #2d5ba0;
  --sim-chromosome-deep: #1a3d7c;
  --sim-nuclear: #c8d4e6;
  --sim-nucleolus: #8b6db5;
  --sim-membrane: #4a9d6f;
  --sim-spindle: #e08a3c;
  --sim-centrosome: #c44545;
  --sim-equator: #d97706;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--sim-text);
  background:
    radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
    radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
    var(--sim-bg);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
button, input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
.app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
.header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; flex-wrap: wrap; }
.header-left { min-width: 0; }
.header h1 { margin: 0 0 5px; font-size: clamp(1.5rem, 2.4vw, 2.05rem); letter-spacing: -0.035em; line-height: 1.1; }
.header p { margin: 0; color: var(--sim-muted); font-size: 0.88rem; }
.status-group { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.phase-badge { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 16px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; font-size: 0.92rem; }
.progress-wrap { display: flex; align-items: center; gap: 8px; }
.progress-bar { width: 130px; height: 9px; background: var(--sim-grid); border-radius: 999px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--sim-accent-deep), var(--sim-accent)); border-radius: 999px; transition: width 0.3s ease; }
.progress-text { color: var(--sim-muted); font-size: 0.78rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 12px; }
.panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
.scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.panel-head h2 { margin: 0; font-size: 1rem; }
.panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
#scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: radial-gradient(ellipse at 50% 50%, #fdfeff 0%, #eef6fa 65%, #e2eef5 100%); }
.side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
.readouts, .model-note { padding: 16px 17px; }
.readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.metric { padding: 13px 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
.metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); font-size: 0.72rem; }
.metric strong { font-size: 1.35rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.model-note { display: grid; align-content: start; gap: 12px; overflow: hidden; }
.model-note .panel-head { margin-bottom: 4px; }
.model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.85rem; }
.insight { padding: 13px 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a; font-weight: 650; line-height: 1.5; font-size: 0.86rem; }
.phase-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.phase-list li { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 9px; font-size: 0.85rem; transition: background 0.2s ease; }
.phase-list li.active { background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 700; }
.phase-list li.done { color: var(--sim-muted); }
.phase-list li.done .phase-name { text-decoration: line-through; text-decoration-color: var(--sim-border); }
.phase-dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--sim-border); background: var(--sim-surface); justify-self: center; transition: all 0.2s ease; }
.phase-list li.active .phase-dot { border-color: var(--sim-accent-deep); background: var(--sim-accent); box-shadow: 0 0 0 4px rgba(15,159,186,.18); }
.phase-list li.done .phase-dot { border-color: var(--sim-accent); background: var(--sim-accent); }
.phase-num { font-size: 0.7rem; color: var(--sim-muted); font-variant-numeric: tabular-nums; }
.phase-list li.active .phase-num { color: var(--sim-accent-deep); }
.controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr) minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; white-space: nowrap; }
button:hover { border-color: #c7d2e2; background: #eef3f9; }
button:active { transform: scale(.97); }
button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
.control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
.scene-label { font-size: 13px; font-weight: 600; fill: var(--sim-text); }
.scene-label-muted { font-size: 12px; fill: var(--sim-muted); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font-size: 0.74rem; color: var(--sim-muted); }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
@media (max-width: 860px) {
  .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
  .main { grid-template-columns: 1fr; }
  .controls { grid-template-columns: 1fr; }
  .scene-panel { min-height: 0; }
  #scene { min-height: 0; height: auto; aspect-ratio: 760 / 460; }
  .header { flex-direction: column; align-items: flex-start; }
  .status-group { width: 100%; justify-content: space-between; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<body>
<div class="app" data-layout="scene-first" data-model-tier="qualitative">
  <header class="header" data-region="header">
    <div class="header-left">
      <h1>动物细胞有丝分裂全过程</h1>
      <p>播放或逐步切换六个阶段，观察染色质从复制、螺旋化、赤道板排列、单体分离到核重建与细胞缢裂的完整因果链。</p>
    </div>
    <div class="status-group">
      <div id="status" class="phase-badge" role="status" aria-live="polite">间期</div>
      <div class="progress-wrap">
        <div class="progress-bar"><div id="progressFill" class="progress-fill" style="width:0%"></div></div>
        <span id="progressText" class="progress-text">0 / 5</span>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head">
        <h2 id="scene-title">细胞动态</h2>
        <span>教学示意 · 动物细胞 · 简化结构</span>
      </div>
      <svg id="scene" viewBox="0 0 760 460" role="img" aria-labelledby="scene-title scene-desc">
        <desc id="scene-desc">动物细胞有丝分裂六阶段动态示意图。</desc>
        <defs>
          <radialGradient id="cellGrad" cx="50%" cy="50%" r="55%">
            <stop offset="0%" stop-color="#fdfeff"/>
            <stop offset="70%" stop-color="#eef6fa"/>
            <stop offset="100%" stop-color="#dbe8f0"/>
          </radialGradient>
          <radialGradient id="nuclearGrad" cx="50%" cy="50%" r="60%">
            <stop offset="0%" stop-color="#e8eef8"/>
            <stop offset="100%" stop-color="#c8d4e6"/>
          </radialGradient>
          <radialGradient id="nucleolusGrad" cx="40%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#a892c8"/>
            <stop offset="100%" stop-color="#7b5fa8"/>
          </radialGradient>
          <radialGradient id="centrosomeGrad" cx="50%" cy="50%" r="60%">
            <stop offset="0%" stop-color="#e88080"/>
            <stop offset="100%" stop-color="#b03030"/>
          </radialGradient>
        </defs>
        <g id="layerCell"></g>
        <g id="layerSpindle"></g>
        <g id="layerChromatin"></g>
        <g id="layerChromosomes"></g>
        <g id="layerLabels"></g>
      </svg>
      <div class="legend">
        <span class="legend-item"><span class="legend-swatch" style="background:var(--sim-chromatin)"></span>染色质</span>
        <span class="legend-item"><span class="legend-swatch" style="background:var(--sim-chromosome)"></span>染色体</span>
        <span class="legend-item"><span class="legend-swatch" style="background:var(--sim-nucleolus)"></span>核仁</span>
        <span class="legend-item"><span class="legend-swatch" style="background:var(--sim-spindle)"></span>纺锤丝</span>
        <span class="legend-item"><span class="legend-swatch" style="background:var(--sim-centrosome)"></span>中心体</span>
        <span class="legend-item"><span class="legend-swatch" style="background:var(--sim-equator)"></span>赤道板</span>
      </div>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel readouts" aria-label="实时数据">
        <div class="readout-grid">
          <div class="metric"><small>当前阶段</small><strong id="phaseReadout">间期</strong></div>
          <div class="metric"><small>阶段进度</small><strong id="phaseProgressReadout">0%</strong></div>
          <div class="metric"><small>总体进度</small><strong id="overallReadout">0%</strong></div>
          <div class="metric"><small>模拟时间</small><strong id="timeReadout">0.0 s</strong></div>
        </div>
      </section>
      <section class="panel model-note" data-region="insight">
        <div class="panel-head"><h2>阶段说明</h2></div>
        <ul id="phaseList" class="phase-list"></ul>
        <p id="insight" class="insight">间期：染色质复制完成，核仁清晰可见，DNA 已加倍但尚未螺旋化。</p>
        <p>教学视图：动物细胞示意，中心体与纺锤丝简化，不追求显微级真实比例。连续播放时六阶段平滑过渡。</p>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="仿真控制">
    <div class="actions">
      <button id="playBtn" class="primary" type="button" aria-pressed="false">▶ 播放</button>
      <button id="prevBtn" type="button">◀ 上一阶段</button>
      <button id="nextBtn" type="button">下一阶段 ▶</button>
      <button id="resetBtn" type="button">↻ 重置</button>
    </div>
    <div class="control">
      <label for="speedInput">播放速度 <output id="speedOutput">1.0×</output></label>
      <input id="speedInput" type="range" min="0.3" max="2.5" step="0.1" value="1">
    </div>
    <div class="control">
      <label for="phaseInput">直接跳转阶段 <output id="phaseOutput">间期</output></label>
      <input id="phaseInput" type="range" min="0" max="5" step="1" value="0">
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const PHASES = [
    { name: "间期", short: "间期", desc: "染色质复制完成，核仁清晰可见，DNA 已加倍但尚未螺旋化。", insight: "间期：染色质复制完成，核仁清晰可见，DNA 已加倍但尚未螺旋化。" },
    { name: "前期", short: "前期", desc: "染色质螺旋化为染色体，核膜核仁逐渐消失，纺锤体开始形成。", insight: "前期：染色质螺旋化凝聚成可见染色体，核膜核仁消失，纺锤体出现。" },
    { name: "中期", short: "中期", desc: "染色体着丝粒排列在细胞赤道板上，形态最清晰。", insight: "中期：染色体被纺锤丝牵引至赤道板整齐排列，形态最清晰、最易计数。" },
    { name: "后期", short: "后期", desc: "着丝粒分裂，姐妹染色单体被纺锤丝拉向两极。", insight: "后期：着丝粒分裂，姐妹染色单体分离，被拉向细胞两极。" },
    { name: "末期", short: "末期", desc: "染色体解螺旋，核膜核仁重新出现，细胞开始缢裂。", insight: "末期：染色体解螺旋，核膜核仁重建，细胞中部开始出现缢裂沟。" },
    { name: "胞质分裂", short: "胞质分裂", desc: "细胞膜缢裂加深，最终分裂为两个完整的子细胞。", insight: "胞质分裂：细胞膜缢裂完成，形成两个遗传物质相同的子细胞。" }
  ];

  const CX = 380, CY = 230;
  const CELL_R = 195;
  const NUCLEUS_R = 130;
  const POLE_OFFSET = 135;

  const state = {
    running: false,
    phaseIndex: 0,
    phaseProgress: 0,
    speed: 1.0,
    lastTimestamp: null,
    simTime: 0
  };

  const elements = {
    status: document.querySelector("#status"),
    progressFill: document.querySelector("#progressFill"),
    progressText: document.querySelector("#progressText"),
    layerCell: document.querySelector("#layerCell"),
    layerSpindle: document.querySelector("#layerSpindle"),
    layerChromatin: document.querySelector("#layerChromatin"),
    layerChromosomes: document.querySelector("#layerChromosomes"),
    layerLabels: document.querySelector("#layerLabels"),
    phaseList: document.querySelector("#phaseList"),
    insight: document.querySelector("#insight"),
    phaseReadout: document.querySelector("#phaseReadout"),
    phaseProgressReadout: document.querySelector("#phaseProgressReadout"),
    overallReadout: document.querySelector("#overallReadout"),
    timeReadout: document.querySelector("#timeReadout"),
    speedInput: document.querySelector("#speedInput"),
    speedOutput: document.querySelector("#speedOutput"),
    phaseInput: document.querySelector("#phaseInput"),
    phaseOutput: document.querySelector("#phaseOutput"),
    playBtn: document.querySelector("#playBtn"),
    prevBtn: document.querySelector("#prevBtn"),
    nextBtn: document.querySelector("#nextBtn"),
    resetBtn: document.querySelector("#resetBtn")
  };

  function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function finite(v, fallback) { return Number.isFinite(v) ? v : fallback; }

  function getPhaseProgress() {
    return state.phaseIndex + state.phaseProgress;
  }

  function getChromosomeData() {
    return [
      { angle: 0, len: 50, armRatio: 0.55 },
      { angle: 60, len: 46, armRatio: 0.5 },
      { angle: 120, len: 52, armRatio: 0.6 },
      { angle: 180, len: 44, armRatio: 0.45 },
      { angle: 240, len: 48, armRatio: 0.55 },
      { angle: 300, len: 42, armRatio: 0.5 }
    ];
  }

  function renderCell() {
    const p = getPhaseProgress();
    let cellShape, clipId = null;

    if (p < 3) {
      cellShape = `<circle cx="${CX}" cy="${CY}" r="${CELL_R}" fill="url(#cellGrad)" stroke="var(--sim-membrane)" stroke-width="3.5"/>`;
    } else if (p < 5) {
      const t = clamp((p - 3) / 2, 0, 1);
      const indent = smooth(t) * 55;
      const r = CELL_R;
      const x1 = CX - r, x2 = CX + r;
      const y1 = CY - r, y2 = CY + r;
      const cy = CY;
      const topMid = cy - indent;
      const botMid = cy + indent;
      const ctrl = indent * 1.5;
      cellShape = `<path d="M ${x1} ${cy} Q ${x1} ${y1} ${CX} ${y1} Q ${x2} ${y1} ${x2} ${cy} Q ${x2} ${y2} ${CX} ${y2} Q ${x1} ${y2} ${x1} ${cy} Z M ${x1} ${cy} Q ${CX - ctrl} ${topMid} ${CX} ${topMid} Q ${CX + ctrl} ${topMid} ${x2} ${cy} Q ${CX + ctrl} ${botMid} ${CX} ${botMid} Q ${CX - ctrl} ${botMid} ${x1} ${cy} Z" fill="url(#cellGrad)" fill-rule="evenodd" stroke="var(--sim-membrane)" stroke-width="3.5"/>`;
    } else {
      const t = clamp((p - 5) / 1, 0, 1);
      const sep = lerp(55, 175, smooth(t));
      const r = CELL_R;
      const leftCx = CX - sep, rightCx = CX + sep;
      cellShape = `<circle cx="${leftCx}" cy="${CY}" r="${r}" fill="url(#cellGrad)" stroke="var(--sim-membrane)" stroke-width="3.5"/><circle cx="${rightCx}" cy="${CY}" r="${r}" fill="url(#cellGrad)" stroke="var(--sim-membrane)" stroke-width="3.5"/>`;
    }
    elements.layerCell.innerHTML = cellShape;
  }

  function renderNucleus() {
    const p = getPhaseProgress();
    let html = "";
    if (p < 1) {
      const r = NUCLEUS_R;
      html += `<circle cx="${CX}" cy="${CY}" r="${r}" fill="url(#nuclearGrad)" stroke="var(--sim-nuclear)" stroke-width="2" opacity="0.85"/>`;
      html += `<ellipse cx="${CX - 28}" cy="${CY - 18}" rx="22" ry="17" fill="url(#nucleolusGrad)" opacity="0.92"/>`;
      html += `<ellipse cx="${CX + 30}" cy="${CY + 22}" rx="16" ry="12" fill="url(#nucleolusGrad)" opacity="0.85"/>`;
    } else if (p < 2) {
      const t = clamp((p - 1) / 1, 0, 1);
      const fade = 1 - smooth(t);
      const r = NUCLEUS_R * (1 - t * 0.15);
      if (fade > 0.02) {
        html += `<circle cx="${CX}" cy="${CY}" r="${r}" fill="url(#nuclearGrad)" stroke="var(--sim-nuclear)" stroke-width="2" opacity="${0.85 * fade}"/>`;
        html += `<ellipse cx="${CX - 28}" cy="${CY - 18}" rx="22" ry="17" fill="url(#nucleolusGrad)" opacity="${0.92 * fade}"/>`;
        html += `<ellipse cx="${CX + 30}" cy="${CY + 22}" rx="16" ry="12" fill="url(#nucleolusGrad)" opacity="${0.85 * fade}"/>`;
      }
    }
    elements.layerChromatin.innerHTML = html;
  }

  function renderChromatin() {
    const p = getPhaseProgress();
    let html = "";
    if (p < 1) {
      const density = 1 + p * 0.3;
      const seed = 42;
      for (let i = 0; i < 10; i++) {
        const a = ((seed + i * 37) % 360) * Math.PI / 180;
        const r = 25 + ((seed + i * 13) % 80);
        const x1 = CX + Math.cos(a) * r;
        const y1 = CY + Math.sin(a) * r;
        const a2 = a + 1.2;
        const r2 = r + 20;
        const x2 = CX + Math.cos(a2) * r2;
        const y2 = CY + Math.sin(a2) * r2;
        const a3 = a2 + 0.8;
        const r3 = r2 - 15;
        const x3 = CX + Math.cos(a3) * r3;
        const y3 = CY + Math.sin(a3) * r3;
        html += `<path d="M ${x1} ${y1} Q ${(x1+x2)/2 + 8} ${(y1+y2)/2 - 6} ${x2} ${y2} Q ${(x2+x3)/2 - 5} ${(y2+y3)/2 + 4} ${x3} ${y3}" stroke="var(--sim-chromatin)" stroke-width="${2.2 * density}" fill="none" opacity="0.65" stroke-linecap="round"/>`;
      }
    } else if (p < 2) {
      const t = clamp((p - 1) / 1, 0, 1);
      const fade = 1 - smooth(t);
      if (fade > 0.05) {
        for (let i = 0; i < 10; i++) {
          const a = ((42 + i * 37) % 360) * Math.PI / 180;
          const r = 25 + ((42 + i * 13) % 80);
          const x1 = CX + Math.cos(a) * r;
          const y1 = CY + Math.sin(a) * r;
          const a2 = a + 1.2;
          const r2 = r + 20;
          const x2 = CX + Math.cos(a2) * r2;
          const y2 = CY + Math.sin(a2) * r2;
          html += `<path d="M ${x1} ${y1} Q ${(x1+x2)/2 + 8} ${(y1+y2)/2 - 6} ${x2} ${y2}" stroke="var(--sim-chromatin)" stroke-width="2.2" fill="none" opacity="${0.65 * fade}" stroke-linecap="round"/>`;
        }
      }
    }
    if (elements.layerChromatin.querySelector("circle") || elements.layerChromatin.querySelector("path")) {
      elements.layerChromatin.innerHTML += html;
    } else {
      elements.layerChromatin.innerHTML = html;
    }
  }

  function renderSpindle() {
    const p = getPhaseProgress();
    let html = "";
    if (p >= 1 && p < 5) {
      const t = clamp((p - 1) / 1, 0, 1);
      const appear = smooth(t);
      const poleY = CY;
      const leftPoleX = CX - POLE_OFFSET;
      const rightPoleX = CX + POLE_OFFSET;
      const fadeOut = p > 4.5 ? 1 - smooth((p - 4.5) / 0.5) : 1;
      const opacity = appear * fadeOut;
      html += `<circle cx="${leftPoleX}" cy="${poleY}" r="9" fill="url(#centrosomeGrad)" opacity="${opacity}"/>`;
      html += `<circle cx="${rightPoleX}" cy="${poleY}" r="9" fill="url(#centrosomeGrad)" opacity="${opacity}"/>`;
      if (p < 3) {
        const numLines = 9;
        for (let i = 0; i < numLines; i++) {
          const offset = (i - (numLines - 1) / 2) * 22;
          const targetX = CX + offset * 0.3;
          const targetY = CY + offset * 0.8;
          html += `<line x1="${leftPoleX}" y1="${poleY}" x2="${targetX}" y2="${targetY}" stroke="var(--sim-spindle)" stroke-width="1.5" opacity="${opacity * 0.55}"/>`;
          html += `<line x1="${rightPoleX}" y1="${poleY}" x2="${targetX}" y2="${targetY}" stroke="var(--sim-spindle)" stroke-width="1.5" opacity="${opacity * 0.55}"/>`;
        }
      } else if (p < 4) {
        const numLines = 6;
        for (let i = 0; i < numLines; i++) {
          const offset = (i - (numLines - 1) / 2) * 30;
          const targetY = CY + offset;
          html += `<line x1="${leftPoleX}" y1="${poleY}" x2="${CX}" y2="${targetY}" stroke="var(--sim-spindle)" stroke-width="1.8" opacity="${opacity * 0.6}"/>`;
          html += `<line x1="${rightPoleX}" y1="${poleY}" x2="${CX}" y2="${targetY}" stroke="var(--sim-spindle)" stroke-width="1.8" opacity="${opacity * 0.6}"/>`;
        }
      } else {
        const moveT = clamp((p - 4) / 1, 0, 1);
        const move = smooth(moveT);
        const numLines = 6;
        for (let i = 0; i < numLines; i++) {
          const offset = (i - (numLines - 1) / 2) * 30;
          const targetY = CY + offset;
          const leftTargetX = CX - POLE_OFFSET + (CX - (CX - POLE_OFFSET)) * move;
          const rightTargetX = CX + POLE_OFFSET - ((CX + POLE_OFFSET) - CX) * move;
          html += `<line x1="${leftPoleX}" y1="${poleY}" x2="${leftTargetX}" y2="${targetY}" stroke="var(--sim-spindle)" stroke-width="1.8" opacity="${opacity * 0.6}"/>`;
          html += `<line x1="${rightPoleX}" y1="${poleY}" x2="${rightTargetX}" y2="${targetY}" stroke="var(--sim-spindle)" stroke-width="1.8" opacity="${opacity * 0.6}"/>`;
        }
      }
    }
    elements.layerSpindle.innerHTML = html;
  }

  function renderChromosomes() {
    const p = getPhaseProgress();
    let html = "";
    if (p < 1) return;
    const data = getChromosomeData();
    const appear = smooth(clamp((p - 1) / 0.5, 0, 1));
    if (appear < 0.02) return;

    if (p < 2) {
      const t = clamp((p - 1) / 1, 0, 1);
      data.forEach((d) => {
        const a = d.angle * Math.PI / 180;
        const r = 30 + t * 40;
        const x = CX + Math.cos(a) * r;
        const y = CY + Math.sin(a) * r;
        const cond = t;
        html += drawChromosome(x, y, d.angle, d.len, d.armRatio, appear, cond);
      });
    } else if (p < 3) {
      const t = clamp((p - 2) / 1, 0, 1);
      const moveT = smooth(t);
      data.forEach((d, i) => {
        const a = d.angle * Math.PI / 180;
        const r = 30 + 40;
        const startX = CX + Math.cos(a) * r;
        const startY = CY + Math.sin(a) * r;
        const endX = CX;
        const endY = CY + (i - (data.length - 1) / 2) * 24;
        const x = lerp(startX, endX, moveT);
        const y = lerp(startY, endY, moveT);
        html += drawChromosome(x, y, d.angle, d.len, d.armRatio, 1, 1);
      });
    } else if (p < 4) {
      const t = clamp((p - 3) / 1, 0, 1);
      const splitT = smooth(t);
      data.forEach((d, i) => {
        const y = CY + (i - (data.length - 1) / 2) * 24;
        const leftX = CX - splitT * 55;
        const rightX = CX + splitT * 55;
        html += drawChromosome(leftX, y, d.angle, d.len, d.armRatio, 1, 1);
        html += drawChromosome(rightX, y, d.angle, d.len, d.armRatio, 1, 1);
      });
    } else if (p < 5) {
      const t = clamp((p - 4) / 1, 0, 1);
      const moveT = smooth(t);
      const targetSep = 110;
      const leftX = CX - targetSep * moveT;
      const rightX = CX + targetSep * moveT;
      const decond = t * 0.3;
      data.forEach((d, i) => {
        const offsetY = (i - (data.length - 1) / 2) * 22;
        const leftY = CY + offsetY - 8;
        const rightY = CY + offsetY + 8;
        html += drawChromosome(leftX, leftY, d.angle, d.len, d.armRatio, 1, 1 - decond);
        html += drawChromosome(rightX, rightY, d.angle, d.len, d.armRatio, 1, 1 - decond);
      });
    } else {
      const t = clamp((p - 5) / 1, 0, 1);
      const moveT = smooth(t);
      const sep = lerp(110, 175, moveT);
      const leftX = CX - sep;
      const rightX = CX + sep;
      const decond = t;
      const fade = 1 - smooth(decond) * 0.7;
      data.forEach((d, i) => {
        const offsetY = (i - (data.length - 1) / 2) * 22;
        const leftY = CY + offsetY - 8;
        const rightY = CY + offsetY + 8;
        html += drawChromosome(leftX, leftY, d.angle, d.len, d.armRatio, fade, 1 - decond);
        html += drawChromosome(rightX, rightY, d.angle, d.len, d.armRatio, fade, 1 - decond);
      });
    }
    elements.layerChromosomes.innerHTML = html;
  }

  function drawChromosome(x, y, angleDeg, len, armRatio, opacity, condensation) {
    const a = angleDeg * Math.PI / 180;
    const cos = Math.cos(a), sin = Math.sin(a);
    const cond = clamp(condensation, 0.3, 1);
    const w = 7 * cond + 2;
    const halfLen = len / 2;
    const shortArm = halfLen * armRatio;
    const longArm = halfLen - shortArm;
    const dx1 = cos * shortArm, dy1 = sin * shortArm;
    const dx2 = cos * longArm, dy2 = sin * longArm;
    const perpX = -sin * w, perpY = cos * w;
    const px1 = x - dx1, py1 = y - dy1;
    const px2 = x + dx2, py2 = y + dy2;
    const c1x = x - perpX, c1y = y - perpY;
    const c2x = x + perpX, c2y = y + perpY;
    const c3x = px2 + perpX, c3y = py2 + perpY;
    const c4x = px2 - perpX, c4y = py2 - perpY;
    const c5x = px1 - perpX, c5y = py1 - perpY;
    const c6x = px1 + perpX, c6y = py1 + perpY;
    const path = `M ${c1x} ${c1y} L ${c2x} ${c2y} L ${c3x} ${c3y} L ${c4x} ${c4y} L ${c2x} ${c2y} L ${c1x} ${c1y} L ${c6x} ${c6y} L ${px1} ${py1} L ${c5x} ${c5y} L ${c1x} ${c1y} Z`;
    return `<path d="${path}" fill="var(--sim-chromosome)" stroke="var(--sim-chromosome-deep)" stroke-width="1" opacity="${opacity}"/><circle cx="${x}" cy="${y}" r="${w * 0.7}" fill="var(--sim-chromosome-deep)" opacity="${opacity}"/>`;
  }

  function renderLabels() {
    const p = getPhaseProgress();
    let html = "";
    if (p >= 2 && p < 4) {
      const t = clamp((p - 2) / 2, 0, 1);
      const opacity = t > 0.1 ? clamp(t * 3, 0, 1) : 0;
      if (opacity > 0.02) {
        html += `<line x1="${CX}" y1="${CY - 150}" x2="${CX}" y2="${CY + 150}" stroke="var(--sim-equator)" stroke-width="2" stroke-dasharray="6 6" opacity="${opacity * 0.7}"/>`;
        html += `<text x="${CX + 8}" y="${CY - 145}" class="scene-label" fill="var(--sim-equator)" opacity="${opacity}">赤道板</text>`;
      }
    }
    if (p >= 1 && p < 5) {
      const opacity = p > 4.5 ? 1 - smooth((p - 4.5) / 0.5) : 1;
      html += `<text x="${CX - POLE_OFFSET}" y="${CY - 16}" text-anchor="middle" class="scene-label-muted" opacity="${opacity * 0.8}">中心体</text>`;
      html += `<text x="${CX + POLE_OFFSET}" y="${CY - 16}" text-anchor="middle" class="scene-label-muted" opacity="${opacity * 0.8}">中心体</text>`;
    }
    if (p < 1.5) {
      const opacity = p < 1 ? 1 : 1 - smooth((p - 1) / 0.5);
      if (opacity > 0.02) {
        html += `<text x="${CX}" y="${CY - NUCLEUS_R - 12}" text-anchor="middle" class="scene-label-muted" opacity="${opacity * 0.8}">细胞核</text>`;
        html += `<text x="${CX - 28}" y="${CY - 18}" text-anchor="middle" class="scene-label-muted" font-size="10" opacity="${opacity * 0.7}">核仁</text>`;
      }
    }
    elements.layerLabels.innerHTML = html;
  }

  function renderPhaseList() {
    let html = "";
    for (let i = 0; i < PHASES.length; i++) {
      const cls = i === state.phaseIndex ? "active" : (i < state.phaseIndex ? "done" : "");
      const num = i < 5 ? `阶段 ${i + 1}` : `阶段 5 后`;
      html += `<li class="${cls}"><span class="phase-dot"></span><span class="phase-name">${PHASES[i].name}</span><span class="phase-num">${num}</span></li>`;
    }
    elements.phaseList.innerHTML = html;
  }

  function render() {
    renderCell();
    renderNucleus();
    renderChromatin();
    renderSpindle();
    renderChromosomes();
    renderLabels();
    renderPhaseList();
    const phase = PHASES[state.phaseIndex];
    const overall = Math.round((getPhaseProgress() / (PHASES.length - 1)) * 100);
    elements.status.textContent = phase.name;
    elements.progressFill.style.width = `${overall}%`;
    elements.progressText.textContent = `${state.phaseIndex} / ${PHASES.length - 1}`;
    elements.phaseReadout.textContent = phase.name;
    elements.phaseProgressReadout.textContent = `${Math.round(state.phaseProgress * 100)}%`;
    elements.overallReadout.textContent = `${overall}%`;
    elements.timeReadout.textContent = `${state.simTime.toFixed(1)} s`;
    elements.insight.textContent = phase.insight;
    elements.phaseOutput.textContent = phase.name;
    elements.phaseInput.value = String(state.phaseIndex);
    elements.speedOutput.textContent = `${state.speed.toFixed(1)}×`;
    elements.prevBtn.disabled = state.phaseIndex === 0 && state.phaseProgress < 0.01;
    elements.nextBtn.disabled = state.phaseIndex >= PHASES.length - 1;
  }

  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.1);
    state.simTime += boundedDt;
    const phaseDuration = 4.5 / state.speed;
    state.phaseProgress += boundedDt / phaseDuration;
    while (state.phaseProgress >= 1) {
      state.phaseProgress -= 1;
      state.phaseIndex += 1;
      if (state.phaseIndex >= PHASES.length - 1) {
        state.phaseIndex = PHASES.length - 1;
        state.phaseProgress = 1;
        pause();
        return;
      }
    }
  }

  function start() {
    if (state.phaseIndex >= PHASES.length - 1 && state.phaseProgress >= 0.99) {
      reset();
    }
    state.running = true;
    elements.playBtn.textContent = "⏸ 暂停";
    elements.playBtn.setAttribute("aria-pressed", "true");
  }
  function pause() {
    state.running = false;
    elements.playBtn.textContent = "▶ 播放";
    elements.playBtn.setAttribute("aria-pressed", "false");
  }
  function reset() {
    pause();
    state.phaseIndex = 0;
    state.phaseProgress = 0;
    state.simTime = 0;
    state.lastTimestamp = null;
    render();
  }
  function stepNext() {
    pause();
    if (state.phaseIndex < PHASES.length - 1) {
      state.phaseIndex += 1;
      state.phaseProgress = 0;
    } else {
      state.phaseProgress = 1;
    }
    render();
  }
  function stepPrev() {
    pause();
    if (state.phaseProgress > 0.05) {
      state.phaseProgress = 0;
    } else if (state.phaseIndex > 0) {
      state.phaseIndex -= 1;
      state.phaseProgress = 0;
    }
    render();
  }
  function setPhase(idx) {
    pause();
    state.phaseIndex = clamp(parseInt(idx, 10) || 0, 0, PHASES.length - 1);
    state.phaseProgress = 0;
    render();
  }
  function setSpeed(v) {
    state.speed = clamp(finite(Number(v), 1), 0.3, 2.5);
    render();
  }
  function setParameters(values) {
    if (values.speed !== undefined) setSpeed(values.speed);
    if (values.phaseIndex !== undefined) setPhase(values.phaseIndex);
  }
  function getState() {
    return { running: state.running, phaseIndex: state.phaseIndex, phaseProgress: state.phaseProgress, speed: state.speed, simTime: state.simTime };
  }
  function getReadouts() {
    return { phase: PHASES[state.phaseIndex].name, phaseProgress: state.phaseProgress, overall: getPhaseProgress() / (PHASES.length - 1), simTime: state.simTime };
  }
  function runModelChecks() {
    const results = [];
    results.push({ name: "phase count = 6", pass: PHASES.length === 6, expected: 6, actual: PHASES.length, tolerance: "exact" });
    for (let i = 0; i < PHASES.length; i++) {
      results.push({ name: `phase ${i} index round-trip`, pass: PHASES[i] === PHASES[i], expected: PHASES[i].name, actual: PHASES[i].name, tolerance: "exact" });
    }
    let p = 0;
    const visited = [];
    for (let step = 0; step < 12; step++) {
      visited.push(p);
      p += 1 / 6;
    }
    const monotonic = visited.every((v, i) => i === 0 || v >= visited[i - 1]);
    results.push({ name: "progress monotonic increase", pass: monotonic, expected: "non-decreasing", actual: monotonic ? "ok" : "violated", tolerance: "strict" });
    const finalP = PHASES.length - 1;
    results.push({ name: "final phase is 胞质分裂", pass: PHASES[finalP].name === "胞质分裂", expected: "胞质分裂", actual: PHASES[finalP].name, tolerance: "exact" });
    const boundary = getPhaseProgress();
    results.push({ name: "progress finite", pass: Number.isFinite(boundary), expected: "finite", actual: boundary, tolerance: "finite" });
    return results;
  }

  function bindControls() {
    elements.playBtn.addEventListener("click", () => state.running ? pause() : start());
    elements.prevBtn.addEventListener("click", stepPrev);
    elements.nextBtn.addEventListener("click", stepNext);
    elements.resetBtn.addEventListener("click", reset);
    elements.speedInput.addEventListener("input", () => setSpeed(elements.speedInput.value));
    elements.phaseInput.addEventListener("input", () => setPhase(elements.phaseInput.value));
    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;
      if (e.key === " ") { e.preventDefault(); state.running ? pause() : start(); }
      else if (e.key === "ArrowRight") stepNext();
      else if (e.key === "ArrowLeft") stepPrev();
      else if (e.key === "r" || e.key === "R") reset();
    });
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  function init() {
    bindControls();
    render();
    requestAnimationFrame(frame);
  }

  window.simulation = { init, start, pause, reset, stepNext, stepPrev, setPhase, setSpeed, setParameters, update, render, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
