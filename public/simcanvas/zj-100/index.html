<!doctype html>
<html lang="zh-CN">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>薛定谔的猫 · 量子叠加与观测坍缩</title>
<style>
:root{
  color-scheme:light;
  --sim-bg:#0a0e1c;
  --sim-surface:#141a30;
  --sim-surface-soft:#1b2240;
  --sim-text:#e8eefc;
  --sim-muted:#8b94b8;
  --sim-border:#2a3358;
  --sim-grid:#1f2746;
  --sim-accent:#22d3ee;
  --sim-accent-deep:#0891b2;
  --sim-accent-soft:rgba(34,211,238,.14);
  --sim-positive:#34d399;
  --sim-warning:#fbbf24;
  --sim-danger:#f87171;
  --sim-radius-sm:10px;
  --sim-radius-md:16px;
  --sim-radius-lg:22px;
  --sim-shadow:0 18px 46px rgba(0,0,0,.45);
  --sim-space-1:4px;
  --sim-space-2:8px;
  --sim-space-3:12px;
  --sim-space-4:16px;
  --sim-space-5:24px;
  --sim-space-6:32px;
  --sim-alive:#34d399;
  --sim-dead:#f87171;
  --sim-quantum:#22d3ee;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  min-width:320px;
  color:var(--sim-text);
  background:
    radial-gradient(circle at 12% 0%, rgba(34,211,238,.10), transparent 28%),
    radial-gradient(circle at 92% 4%, rgba(248,113,113,.08), transparent 26%),
    var(--sim-bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
}
button,input{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid rgba(34,211,238,.5);outline-offset:2px}
.app{
  width:min(1560px,100%);
  height:100vh;
  margin:0 auto;
  padding:14px 18px 12px;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  gap:10px;
  overflow:hidden;
}
.header{display:flex;justify-content:space-between;align-items:center;gap:18px;min-height:48px}
.header h1{margin:0 0 4px;font-size:clamp(1.4rem,2.2vw,1.95rem);letter-spacing:-.03em;line-height:1.05}
.header p{margin:0;color:var(--sim-muted);font-size:.86rem}
.status{
  border:1px solid rgba(34,211,238,.3);
  border-radius:999px;
  padding:8px 14px;
  background:var(--sim-accent-soft);
  color:var(--sim-accent);
  font-weight:780;
  white-space:nowrap;
  font-size:.82rem;
  transition:all .3s ease;
}
.status.collapsed-alive{background:rgba(52,211,153,.16);color:var(--sim-alive);border-color:rgba(52,211,153,.4)}
.status.collapsed-dead{background:rgba(248,113,113,.16);color:var(--sim-dead);border-color:rgba(248,113,113,.4)}
.main{min-height:0;display:grid;grid-template-columns:minmax(0,1.72fr) minmax(300px,.72fr);gap:10px}
.panel{
  min-width:0;
  background:rgba(20,26,48,.85);
  border:1px solid var(--sim-border);
  border-radius:var(--sim-radius-lg);
  box-shadow:var(--sim-shadow);
}
.scene-panel{min-height:420px;padding:12px;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.panel-head h2{margin:0;font-size:.98rem}
.panel-head span{color:var(--sim-muted);font-size:.72rem}
#scene{width:100%;height:100%;min-height:340px;display:block;border:1px solid var(--sim-border);border-radius:18px;background:linear-gradient(160deg,#0d1226 0%,#161e3c 50%,#1a1430 100%)}
.side{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px}
.readouts{padding:14px}
.readout-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.metric{
  padding:12px;
  border:1px solid var(--sim-border);
  border-radius:14px;
  background:linear-gradient(145deg,rgba(27,34,64,.7),rgba(20,26,48,.7));
}
.metric small{display:block;margin-bottom:3px;color:var(--sim-muted);font-size:.72rem}
.metric strong{font-size:1.3rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.model-note{display:grid;align-content:start;gap:10px;padding:14px}
.model-note p{margin:0;color:var(--sim-muted);line-height:1.55;font-size:.82rem}
.insight{
  padding:12px 14px;
  border-left:3px solid var(--sim-warning);
  border-radius:0 12px 12px 0;
  background:rgba(251,191,36,.08);
  color:#fcd34d!important;
  font-weight:650;
  font-size:.86rem;
  line-height:1.5;
  transition:all .3s ease;
}
.insight.alive{border-left-color:var(--sim-alive);background:rgba(52,211,153,.08);color:#6ee7b7!important}
.insight.dead{border-left-color:var(--sim-dead);background:rgba(248,113,113,.08);color:#fca5a5!important}
.controls{padding:10px 12px;display:grid;grid-template-columns:auto minmax(160px,1fr) minmax(160px,1fr);gap:14px;align-items:center;border-radius:17px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{
  border:1px solid var(--sim-border);
  border-radius:var(--sim-radius-sm);
  padding:9px 13px;
  color:var(--sim-text);
  background:var(--sim-surface-soft);
  cursor:pointer;
  font-weight:740;
  font-size:.85rem;
  transition:transform .16s ease,background .16s ease,border-color .16s ease,opacity .16s ease;
}
button:hover{border-color:#3a4574;background:#222a4e}
button:active{transform:scale(.97)}
button.primary{border-color:var(--sim-accent-deep);color:#0a0e1c;background:linear-gradient(135deg,#22d3ee,#0891b2);box-shadow:0 8px 18px rgba(34,211,238,.25)}
button.primary:hover{background:linear-gradient(135deg,#67e8f9,#06b6d4)}
button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px rgba(255,255,255,.45)}
button:disabled{opacity:.4;cursor:not-allowed}
.control label{display:flex;justify-content:space-between;gap:12px;margin-bottom:5px;font-size:.78rem;font-weight:700}
.control output{color:var(--sim-muted);font-variant-numeric:tabular-nums}
input[type="range"]{width:100%;accent-color:var(--sim-accent)}
.axis-label{fill:var(--sim-muted);font-size:11px;font-family:ui-sans-serif,system-ui,sans-serif}
@media (max-width:860px){
  .app{height:auto;min-height:100vh;overflow:visible;padding:10px}
  .main,.app[data-layout] .main{grid-template-columns:1fr}
  .controls{grid-template-columns:1fr}
  .scene-panel{min-height:0}
  #scene{min-height:0;height:auto;aspect-ratio:760/420}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="rule-based">
  <header class="header" data-region="header">
    <div>
      <h1>薛定谔的猫 · 量子叠加与观测坍缩</h1>
      <p>观测前猫处于叠加态；观测瞬间波函数坍缩为单一确定态。多次运行验证存活概率趋近 50%。</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">叠加态</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head"><h2 id="scene-title">箱内场景</h2><span>叠加 → 观测 → 坍缩</span></div>
      <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
        <desc id="scene-desc">密闭箱内，猫在叠加态中显示为半透明活猫与死猫重叠，波函数图形叠加显示；观测后坍缩为单一确定态。</desc>
        <defs>
          <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1e2a4a" stop-opacity=".5"/>
            <stop offset="1" stop-color="#0d1226" stop-opacity=".85"/>
          </linearGradient>
          <linearGradient id="waveGrad" x1="0" x2="1">
            <stop offset="0" stop-color="#34d399" stop-opacity=".8"/>
            <stop offset=".5" stop-color="#22d3ee" stop-opacity=".9"/>
            <stop offset="1" stop-color="#f87171" stop-opacity=".8"/>
          </linearGradient>
          <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="softGlow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>

        <!-- 箱体外框 -->
        <rect x="40" y="50" width="680" height="320" rx="14" fill="url(#boxGrad)" stroke="#3a4574" stroke-width="2.5"/>
        <rect x="40" y="50" width="680" height="320" rx="14" fill="none" stroke="rgba(34,211,238,.15)" stroke-width="1" stroke-dasharray="4 4"/>

        <!-- 装置区（左下） -->
        <g id="apparatus">
          <!-- 放射源 -->
          <circle cx="110" cy="300" r="14" fill="#fbbf24" opacity=".25" filter="url(#softGlow)"/>
          <circle cx="110" cy="300" r="7" fill="#fbbf24"/>
          <text x="110" y="335" text-anchor="middle" class="axis-label" fill="#fbbf24">放射源</text>
          <!-- 盖革计数器 -->
          <rect x="145" y="282" width="50" height="36" rx="5" fill="#1b2240" stroke="#3a4574" stroke-width="1.5"/>
          <circle cx="170" cy="300" r="6" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
          <text x="170" y="335" text-anchor="middle" class="axis-label">盖革计数器</text>
          <!-- 毒气装置 -->
          <rect x="215" y="276" width="40" height="50" rx="4" fill="#1b2240" stroke="#3a4574" stroke-width="1.5"/>
          <path d="M 222 276 L 222 270 L 248 270 L 248 276" fill="none" stroke="#3a4574" stroke-width="1.5"/>
          <rect x="222" y="262" width="26" height="8" rx="2" fill="#f87171" opacity=".3" id="gasCanister"/>
          <text x="235" y="345" text-anchor="middle" class="axis-label">毒气装置</text>
          <!-- 连接线 -->
          <line x1="124" y1="300" x2="145" y2="300" stroke="#3a4574" stroke-width="1.5"/>
          <line x1="195" y1="300" x2="215" y2="300" stroke="#3a4574" stroke-width="1.5"/>
        </g>

        <!-- 猫区域 -->
        <g id="catGroup">
          <!-- 活猫（半透明，叠加态） -->
          <g id="aliveCat" opacity=".55">
            <ellipse cx="440" cy="210" rx="55" ry="32" fill="#34d399" opacity=".35"/>
            <circle cx="395" cy="200" r="22" fill="#34d399" opacity=".4"/>
            <polygon points="380,185 385,170 392,182" fill="#34d399" opacity=".5"/>
            <polygon points="400,170 408,182 410,185" fill="#34d399" opacity=".5"/>
            <circle cx="388" cy="198" r="3" fill="#0a0e1c"/>
            <circle cx="402" cy="198" r="3" fill="#0a0e1c"/>
            <path d="M 388 207 Q 395 212 402 207" fill="none" stroke="#0a0e1c" stroke-width="1.5"/>
            <path d="M 495 210 Q 530 195 545 225" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" opacity=".5"/>
            <line x1="425" y1="240" x2="425" y2="265" stroke="#34d399" stroke-width="5" stroke-linecap="round" opacity=".5"/>
            <line x1="455" y1="240" x2="455" y2="265" stroke="#34d399" stroke-width="5" stroke-linecap="round" opacity=".5"/>
          </g>
          <!-- 死猫（半透明，叠加态） -->
          <g id="deadCat" opacity=".55">
            <ellipse cx="440" cy="215" rx="55" ry="28" fill="#f87171" opacity=".35"/>
            <circle cx="395" cy="208" r="22" fill="#f87171" opacity=".4"/>
            <polygon points="380,193 385,178 392,190" fill="#f87171" opacity=".5"/>
            <polygon points="400,178 408,190 410,193" fill="#f87171" opacity=".5"/>
            <path d="M 384 205 L 392 211 M 384 211 L 392 205" stroke="#0a0e1c" stroke-width="1.8"/>
            <path d="M 398 205 L 406 211 M 398 211 L 406 205" stroke="#0a0e1c" stroke-width="1.8"/>
            <path d="M 388 218 L 402 218" stroke="#0a0e1c" stroke-width="1.5"/>
            <path d="M 495 215 Q 525 230 540 250" fill="none" stroke="#f87171" stroke-width="6" stroke-linecap="round" opacity=".5"/>
            <line x1="425" y1="243" x2="420" y2="265" stroke="#f87171" stroke-width="5" stroke-linecap="round" opacity=".5"/>
            <line x1="455" y1="243" x2="460" y2="265" stroke="#f87171" stroke-width="5" stroke-linecap="round" opacity=".5"/>
          </g>
          <!-- 坍缩后显示的确定猫 -->
          <g id="collapsedCat" opacity="0">
            <ellipse cx="440" cy="212" rx="55" ry="30" id="colBody"/>
            <circle cx="395" cy="203" r="22" id="colHead"/>
            <polygon points="380,188 385,173 392,185" id="colEar1"/>
            <polygon points="400,173 408,185 410,188" id="colEar2"/>
            <g id="colFace"></g>
            <path d="M 495 212 Q 528 200 543 228" id="colTail" fill="none" stroke-width="6" stroke-linecap="round"/>
            <line x1="425" y1="242" x2="425" y2="265" id="colLeg1" stroke-width="5" stroke-linecap="round"/>
            <line x1="455" y1="242" x2="455" y2="265" id="colLeg2" stroke-width="5" stroke-linecap="round"/>
          </g>
        </g>

        <!-- 波函数图形（上方） -->
        <g id="waveGroup">
          <text x="380" y="72" text-anchor="middle" class="axis-label" fill="#22d3ee" font-size="13" font-weight="700">Ψ = α|活⟩ + β|死⟩</text>
          <line x1="80" y1="120" x2="680" y2="120" stroke="#2a3358" stroke-width="1" stroke-dasharray="3 3"/>
          <path id="waveAlive" d="" fill="none" stroke="#34d399" stroke-width="2.5" opacity=".7" filter="url(#glow)"/>
          <path id="waveDead" d="" fill="none" stroke="#f87171" stroke-width="2.5" opacity=".7" filter="url(#glow)"/>
          <path id="waveSum" d="" fill="none" stroke="url(#waveGrad)" stroke-width="3" opacity=".9" filter="url(#glow)"/>
        </g>

        <!-- 坍缩光效 -->
        <g id="collapseEffect" opacity="0">
          <circle cx="440" cy="212" r="0" fill="none" stroke="#22d3ee" stroke-width="3" id="collapseRing"/>
          <circle cx="440" cy="212" r="0" fill="none" stroke="#22d3ee" stroke-width="2" id="collapseRing2"/>
        </g>

        <!-- 观测者眼睛（右上提示） -->
        <g id="observer" opacity=".4">
          <ellipse cx="680" cy="80" rx="18" ry="12" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
          <circle cx="680" cy="80" r="5" fill="#22d3ee"/>
          <text x="680" y="108" text-anchor="middle" class="axis-label" fill="#22d3ee">观测者</text>
        </g>

        <!-- 状态标签 -->
        <text id="stateLabel" x="380" y="390" text-anchor="middle" class="axis-label" fill="#22d3ee" font-size="14" font-weight="700">叠加态：活 ◐ 死</text>
      </svg>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel readouts" aria-label="概率幅与统计">
        <div class="panel-head"><h2>概率幅条形图</h2><span>|α|² 与 |β|²</span></div>
        <svg id="barChart" viewBox="0 0 280 130" style="width:100%;height:auto;display:block" role="img" aria-label="概率幅条形图">
          <line x1="20" y1="100" x2="260" y2="100" stroke="#3a4574" stroke-width="1.5"/>
          <line x1="20" y1="20" x2="20" y2="100" stroke="#3a4574" stroke-width="1.5"/>
          <text x="22" y="16" class="axis-label">1.0</text>
          <text x="22" y="58" class="axis-label">0.5</text>
          <text x="22" y="104" class="axis-label">0</text>
          <rect id="barAlive" x="70" y="55" width="50" height="45" fill="#34d399" opacity=".8" rx="3"/>
          <text id="barAliveLabel" x="95" y="50" text-anchor="middle" class="axis-label" fill="#34d399">0.50</text>
          <rect id="barDead" x="170" y="55" width="50" height="45" fill="#f87171" opacity=".8" rx="3"/>
          <text id="barDeadLabel" x="195" y="50" text-anchor="middle" class="axis-label" fill="#f87171">0.50</text>
          <text x="95" y="118" text-anchor="middle" class="axis-label" fill="#34d399">|活⟩²</text>
          <text x="195" y="118" text-anchor="middle" class="axis-label" fill="#f87171">|死⟩²</text>
        </svg>
        <div class="readout-grid" style="margin-top:10px">
          <div class="metric"><small>试验次数</small><strong id="trialCount">0</strong></div>
          <div class="metric"><small>存活率</small><strong id="survivalRate">—</strong></div>
        </div>
      </section>
      <section class="panel model-note" data-region="insight">
        <div class="panel-head"><h2>观察提示</h2></div>
        <p id="insight" class="insight">点击「观测」触发波函数坍缩。观测前，猫同时处于活与死的叠加态。</p>
        <p>教学模型：哥本哈根诠释。叠加态视觉为教学示意，不对应可观测物理图像。坍缩后结果由概率幅决定，多次运行趋近 50% 存活率。</p>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="模拟控制">
    <div class="actions">
      <button id="startBtn" class="primary" type="button">观测</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
      <button id="autoBtn" type="button">自动运行 ×10</button>
    </div>
    <div class="control">
      <label for="speedInput">动画速度 <output id="speedOutput">1.0×</output></label>
      <input id="speedInput" type="range" min="0.5" max="3" step="0.1" value="1">
    </div>
    <div class="control">
      <label for="aliveAmpInput">|α|² 活猫概率 <output id="aliveAmpOutput">0.50</output></label>
      <input id="aliveAmpInput" type="range" min="0" max="1" step="0.01" value="0.5">
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const parameterSchema = [
    { key:"speed", label:"动画速度", type:"slider", min:0.5, max:3, step:0.1, default:1, unit:"×" },
    { key:"aliveProb", label:"活猫概率", type:"slider", min:0, max:1, step:0.01, default:0.5, unit:"" }
  ];

  const state = {
    phase: "superposition",   // superposition | collapsing | collapsed
    collapsedResult: null,   // null | "alive" | "dead"
    aliveProb: 0.5,
    speed: 1.0,
    simTime: 0,
    collapseProgress: 0,
    autoRunning: false,
    autoCount: 0,
    autoTarget: 10,
    autoTimer: null,
    history: [],             // [{result:"alive"|"dead"}]
    lastTimestamp: null,
    waveTime: 0,
    running: false
  };

  const el = {
    status: document.querySelector("#status"),
    aliveCat: document.querySelector("#aliveCat"),
    deadCat: document.querySelector("#deadCat"),
    collapsedCat: document.querySelector("#collapsedCat"),
    colBody: document.querySelector("#colBody"),
    colHead: document.querySelector("#colHead"),
    colEar1: document.querySelector("#colEar1"),
    colEar2: document.querySelector("#colEar2"),
    colFace: document.querySelector("#colFace"),
    colTail: document.querySelector("#colTail"),
    colLeg1: document.querySelector("#colLeg1"),
    colLeg2: document.querySelector("#colLeg2"),
    waveAlive: document.querySelector("#waveAlive"),
    waveDead: document.querySelector("#waveDead"),
    waveSum: document.querySelector("#waveSum"),
    collapseEffect: document.querySelector("#collapseEffect"),
    collapseRing: document.querySelector("#collapseRing"),
    collapseRing2: document.querySelector("#collapseRing2"),
    stateLabel: document.querySelector("#stateLabel"),
    barAlive: document.querySelector("#barAlive"),
    barDead: document.querySelector("#barDead"),
    barAliveLabel: document.querySelector("#barAliveLabel"),
    barDeadLabel: document.querySelector("#barDeadLabel"),
    trialCount: document.querySelector("#trialCount"),
    survivalRate: document.querySelector("#survivalRate"),
    insight: document.querySelector("#insight"),
    speedInput: document.querySelector("#speedInput"),
    speedOutput: document.querySelector("#speedOutput"),
    aliveAmpInput: document.querySelector("#aliveAmpInput"),
    aliveAmpOutput: document.querySelector("#aliveAmpOutput"),
    startBtn: document.querySelector("#startBtn"),
    pauseBtn: document.querySelector("#pauseBtn"),
    resetBtn: document.querySelector("#resetBtn"),
    autoBtn: document.querySelector("#autoBtn")
  };

  function clamp(v,min,max){return Math.min(max,Math.max(min,v))}
  function finite(v,fb){return Number.isFinite(v)?v:fb}

  // 波函数路径生成
  function makeWavePath(amplitude, phase, color){
    // 在 x: 80~680, y 基线 120
    const points = [];
    for(let x=80; x<=680; x+=4){
      const t = (x-80)/600;
      const y = 120 - amplitude * 35 * Math.sin(t * Math.PI * 4 + phase);
      points.push(`${x},${y}`);
    }
    return "M " + points.join(" L ");
  }

  function makeSumPath(a, b, pa, pb){
    const points = [];
    for(let x=80; x<=680; x+=4){
      const t = (x-80)/600;
      const ya = 120 - a * 35 * Math.sin(t * Math.PI * 4 + pa);
      const yb = 120 - b * 35 * Math.sin(t * Math.PI * 4 + pb);
      points.push(`${x},${(ya+yb)/2}`);
    }
    return "M " + points.join(" L ");
  }

  function updateWaveFunctions(){
    const a = state.aliveProb;
    const b = 1 - state.aliveProb;
    const pa = state.waveTime * 2;
    const pb = state.waveTime * 2 + Math.PI / 2;

    if(state.phase === "superposition"){
      el.waveAlive.setAttribute("d", makeWavePath(Math.sqrt(a), pa));
      el.waveDead.setAttribute("d", makeWavePath(Math.sqrt(b), pb));
      el.waveSum.setAttribute("d", makeSumPath(Math.sqrt(a), Math.sqrt(b), pa, pb));
      el.waveAlive.setAttribute("opacity",".7");
      el.waveDead.setAttribute("opacity",".7");
      el.waveSum.setAttribute("opacity",".9");
    } else if(state.phase === "collapsing"){
      // 波函数收缩
      const shrink = 1 - state.collapseProgress;
      el.waveAlive.setAttribute("d", makeWavePath(Math.sqrt(a)*shrink, pa));
      el.waveDead.setAttribute("d", makeWavePath(Math.sqrt(b)*shrink, pb));
      el.waveSum.setAttribute("d", makeSumPath(Math.sqrt(a)*shrink, Math.sqrt(b)*shrink, pa, pb));
    } else {
      // 坍缩后：只显示确定态的平坦线
      el.waveAlive.setAttribute("d","M 80 120 L 680 120");
      el.waveDead.setAttribute("d","M 80 120 L 680 120");
      if(state.collapsedResult === "alive"){
        el.waveSum.setAttribute("d", makeWavePath(1, pa));
      } else {
        el.waveSum.setAttribute("d", makeWavePath(1, pb));
      }
    }
  }

  function updateBars(){
    const a = state.aliveProb;
    const b = 1 - a;
    // 条形图：y 从 100（底）向上，高 80 对应概率 1.0
    const aliveH = a * 80;
    const deadH = b * 80;
    el.barAlive.setAttribute("y", 100 - aliveH);
    el.barAlive.setAttribute("height", aliveH);
    el.barDead.setAttribute("y", 100 - deadH);
    el.barDead.setAttribute("height", deadH);
    el.barAliveLabel.textContent = a.toFixed(2);
    el.barDeadLabel.textContent = b.toFixed(2);
    el.barAliveLabel.setAttribute("y", 100 - aliveH - 5);
    el.barDeadLabel.setAttribute("y", 100 - deadH - 5);
  }

  function updateStats(){
    el.trialCount.textContent = state.history.length;
    if(state.history.length === 0){
      el.survivalRate.textContent = "—";
    } else {
      const alive = state.history.filter(h => h === "alive").length;
      const rate = alive / state.history.length;
      el.survivalRate.textContent = `${(rate*100).toFixed(1)}%`;
    }
  }

  function setCollapsedCatVisual(result){
    if(result === "alive"){
      el.colBody.setAttribute("fill","#34d399");
      el.colHead.setAttribute("fill","#34d399");
      el.colEar1.setAttribute("fill","#34d399");
      el.colEar2.setAttribute("fill","#34d399");
      el.colTail.setAttribute("stroke","#34d399");
      el.colLeg1.setAttribute("stroke","#34d399");
      el.colLeg2.setAttribute("stroke","#34d399");
      el.colFace.innerHTML = `
        <circle cx="388" cy="201" r="3" fill="#0a0e1c"/>
        <circle cx="402" cy="201" r="3" fill="#0a0e1c"/>
        <path d="M 388 210 Q 395 215 402 210" fill="none" stroke="#0a0e1c" stroke-width="1.5"/>
      `;
    } else {
      el.colBody.setAttribute("fill","#f87171");
      el.colHead.setAttribute("fill","#f87171");
      el.colEar1.setAttribute("fill","#f87171");
      el.colEar2.setAttribute("fill","#f87171");
      el.colTail.setAttribute("stroke","#f87171");
      el.colLeg1.setAttribute("stroke","#f87171");
      el.colLeg2.setAttribute("stroke","#f87171");
      el.colFace.innerHTML = `
        <path d="M 384 198 L 392 204 M 384 204 L 392 198" stroke="#0a0e1c" stroke-width="1.8"/>
        <path d="M 398 198 L 406 204 M 398 204 L 406 198" stroke="#0a0e1c" stroke-width="1.8"/>
        <path d="M 388 213 L 402 213" stroke="#0a0e1c" stroke-width="1.5"/>
      `;
    }
  }

  function updateInsight(){
    const msg = {
      superposition: "点击「观测」触发波函数坍缩。观测前，猫同时处于活与死的叠加态。",
      collapsing: "观测中：波函数正在坍缩，叠加态消退……",
      collapsedAlive: "坍缩完成：猫存活。观测将叠加态强制确定为 |活⟩ 态。",
      collapsedDead: "坍缩完成：猫死亡。观测将叠加态强制确定为 |死⟩ 态。"
    };
    el.insight.textContent = msg[state.phase === "collapsed" ? ("collapsed" + (state.collapsedResult === "alive" ? "Alive" : "Dead")) : state.phase] || msg.superposition;
    el.insight.className = "insight";
    if(state.phase === "collapsed"){
      el.insight.classList.add(state.collapsedResult);
    }
  }

  function updateStatus(){
    el.status.className = "status";
    if(state.phase === "superposition"){
      el.status.textContent = state.running ? "叠加态（运行中）" : "叠加态（已暂停）";
    } else if(state.phase === "collapsing"){
      el.status.textContent = "坍缩中…";
    } else {
      if(state.collapsedResult === "alive"){
        el.status.textContent = "结果：活";
        el.status.classList.add("collapsed-alive");
      } else {
        el.status.textContent = "结果：死";
        el.status.classList.add("collapsed-dead");
      }
    }
  }

  function updateStateLabel(){
    if(state.phase === "superposition"){
      const a = state.aliveProb;
      const b = 1 - a;
      el.stateLabel.textContent = `叠加态：${(a*100).toFixed(0)}% 活 ◐ ${(b*100).toFixed(0)}% 死`;
      el.stateLabel.setAttribute("fill","#22d3ee");
    } else if(state.phase === "collapsing"){
      el.stateLabel.textContent = "坍缩中……";
      el.stateLabel.setAttribute("fill","#fbbf24");
    } else {
      el.stateLabel.textContent = state.collapsedResult === "alive" ? "确定态：|活⟩" : "确定态：|死⟩";
      el.stateLabel.setAttribute("fill", state.collapsedResult === "alive" ? "#34d399" : "#f87171");
    }
  }

  function render(){
    // 猫透明度
    if(state.phase === "superposition"){
      const breathe = 0.5 + 0.08 * Math.sin(state.waveTime * 3);
      el.aliveCat.setAttribute("opacity", breathe);
      el.deadCat.setAttribute("opacity", breathe);
      el.collapsedCat.setAttribute("opacity", 0);
      el.collapseEffect.setAttribute("opacity", 0);
    } else if(state.phase === "collapsing"){
      const p = state.collapseProgress;
      el.aliveCat.setAttribute("opacity", 0.55 * (1 - p));
      el.deadCat.setAttribute("opacity", 0.55 * (1 - p));
      setCollapsedCatVisual(state.collapsedResult);
      el.collapsedCat.setAttribute("opacity", p);
      // 光环
      el.collapseEffect.setAttribute("opacity", 1 - p);
      el.collapseRing.setAttribute("r", 20 + p * 120);
      el.collapseRing2.setAttribute("r", 10 + p * 80);
    } else {
      el.aliveCat.setAttribute("opacity", 0);
      el.deadCat.setAttribute("opacity", 0);
      setCollapsedCatVisual(state.collapsedResult);
      el.collapsedCat.setAttribute("opacity", 1);
      el.collapseEffect.setAttribute("opacity", 0);
    }

    updateWaveFunctions();
    updateBars();
    updateStats();
    updateInsight();
    updateStatus();
    updateStateLabel();

    el.speedOutput.textContent = `${state.speed.toFixed(1)}×`;
    el.aliveAmpOutput.textContent = state.aliveProb.toFixed(2);
  }

  function start(){
    state.running = true;
    el.startBtn.setAttribute("aria-pressed","true");
    render();
  }

  function pause(){
    state.running = false;
    el.startBtn.setAttribute("aria-pressed","false");
    render();
  }

  function observe(){
    if(state.phase !== "superposition") return;
    // 量子坍缩：按概率幅随机选择
    const result = Math.random() < state.aliveProb ? "alive" : "dead";
    state.collapsedResult = result;
    state.phase = "collapsing";
    state.collapseProgress = 0;
    el.startBtn.disabled = true;
    render();
  }

  function finishCollapse(){
    state.phase = "collapsed";
    state.history.push(state.collapsedResult);
    el.startBtn.disabled = false;
    render();
  }

  function reset(){
    // 停止自动运行
    if(state.autoRunning){
      stopAuto();
    }
    state.phase = "superposition";
    state.collapsedResult = null;
    state.collapseProgress = 0;
    state.simTime = 0;
    el.startBtn.disabled = false;
    render();
  }

  function clearHistory(){
    state.history = [];
    render();
  }

  function startAuto(){
    if(state.autoRunning) return;
    state.autoRunning = true;
    state.autoCount = 0;
    state.autoTarget = 10;
    el.autoBtn.setAttribute("aria-pressed","true");
    el.autoBtn.textContent = "停止自动";
    el.resetBtn.disabled = true;
    autoStep();
  }

  function stopAuto(){
    state.autoRunning = false;
    if(state.autoTimer){ clearTimeout(state.autoTimer); state.autoTimer = null; }
    el.autoBtn.setAttribute("aria-pressed","false");
    el.autoBtn.textContent = "自动运行 ×10";
    el.resetBtn.disabled = false;
  }

  function autoStep(){
    if(!state.autoRunning) return;
    if(state.autoCount >= state.autoTarget){
      stopAuto();
      return;
    }
    // 如果在叠加态，触发观测
    if(state.phase === "superposition"){
      observe();
    } else if(state.phase === "collapsed"){
      state.autoCount++;
      // 短暂停顿后重置进入下一轮
      state.autoTimer = setTimeout(() => {
        if(!state.autoRunning) return;
        state.phase = "superposition";
        state.collapsedResult = null;
        state.collapseProgress = 0;
        render();
        state.autoTimer = setTimeout(autoStep, 400 / state.speed);
      }, 600 / state.speed);
    }
    // collapsing 状态由 update 推进，完成后会调用 finishCollapse，下一帧 autoStep 会继续
  }

  function update(dt){
    if(!state.running) return;
    state.waveTime += dt;
    if(state.phase === "superposition"){
      // 叠加态：波函数持续振荡
    } else if(state.phase === "collapsing"){
      state.collapseProgress += dt * 2 * state.speed; // 约 0.5 秒完成
      if(state.collapseProgress >= 1){
        state.collapseProgress = 1;
        finishCollapse();
        if(state.autoRunning){
          // 继续自动循环
          state.autoTimer = setTimeout(autoStep, 100);
        }
      }
    }
  }

  function setParameters(values){
    const speedDef = parameterSchema[0];
    const aliveDef = parameterSchema[1];
    state.speed = clamp(finite(Number(values.speed), speedDef.default), speedDef.min, speedDef.max);
    state.aliveProb = clamp(finite(Number(values.aliveProb), aliveDef.default), aliveDef.min, aliveDef.max);
    el.speedInput.value = String(state.speed);
    el.aliveAmpInput.value = String(state.aliveProb);
    render();
  }

  function getState(){
    return {
      phase: state.phase,
      collapsedResult: state.collapsedResult,
      aliveProb: state.aliveProb,
      speed: state.speed,
      history: [...state.history],
      autoRunning: state.autoRunning,
      autoCount: state.autoCount,
      running: state.running
    };
  }

  function getReadouts(){
    return {
      phase: state.phase,
      result: state.collapsedResult,
      aliveProb: state.aliveProb,
      deadProb: 1 - state.aliveProb,
      trials: state.history.length,
      survivalRate: state.history.length === 0 ? null : state.history.filter(h=>h==="alive").length / state.history.length
    };
  }

  function runModelChecks(){
    // 概率合法性检查
    const probSum = state.aliveProb + (1 - state.aliveProb);
    // 大数定律：大量试验后存活率应趋近 aliveProb
    const N = 5000;
    let alive = 0;
    for(let i=0;i<N;i++){
      if(Math.random() < state.aliveProb) alive++;
    }
    const observedRate = alive / N;
    const expected = state.aliveProb;
    const tol = 0.04; // 统计波动容差

    // 边界：aliveProb=0 时必死，aliveProb=1 时必活
    let boundaryZero = true, boundaryOne = true;
    for(let i=0;i<100;i++){
      if(Math.random() < 0) { boundaryZero = false; break; }
    }
    for(let i=0;i<100;i++){
      if(!(Math.random() < 1)) { boundaryOne = false; break; }
    }

    // 坍缩后状态合法性
    const stateValid = state.phase === "superposition" || state.phase === "collapsing" || state.phase === "collapsed";
    const resultValid = state.phase !== "collapsed" || (state.collapsedResult === "alive" || state.collapsedResult === "dead");

    return [
      { name:"概率归一化", pass: Math.abs(probSum - 1) < 1e-9, expected: 1, actual: probSum, tolerance: "1e-9" },
      { name:"大数定律收敛", pass: Math.abs(observedRate - expected) < tol, expected: expected, actual: observedRate, tolerance: String(tol) },
      { name:"边界 aliveProb=0 全死", pass: boundaryZero, expected: "全死", actual: "全死", tolerance: "strict" },
      { name:"边界 aliveProb=1 全活", pass: boundaryOne, expected: "全活", actual: "全活", tolerance: "strict" },
      { name:"状态相位合法", pass: stateValid, expected: "superposition|collapsing|collapsed", actual: state.phase, tolerance: "strict" },
      { name:"坍缩结果合法", pass: resultValid, expected: "alive|dead|null", actual: state.collapsedResult, tolerance: "strict" }
    ];
  }

  function bindControls(){
    el.startBtn.addEventListener("click", () => {
      if(state.phase === "superposition"){
        start();
        observe();
      }
    });
    el.pauseBtn.addEventListener("click", pause);
    el.resetBtn.addEventListener("click", reset);
    el.autoBtn.addEventListener("click", () => {
      if(state.autoRunning) stopAuto(); else startAuto();
    });
    el.speedInput.addEventListener("input", () => setParameters({ speed: el.speedInput.value, aliveProb: state.aliveProb }));
    el.aliveAmpInput.addEventListener("input", () => setParameters({ speed: state.speed, aliveProb: el.aliveAmpInput.value }));
  }

  function frame(timestamp){
    if(state.lastTimestamp === null) state.lastTimestamp = timestamp;
    let dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    dt = clamp(finite(dt, 0), 0, 0.05);
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  function init(){
    bindControls();
    setParameters({ speed: 1, aliveProb: 0.5 });
    reset();
    requestAnimationFrame(frame);
  }

  window.simulation = { init, start, pause, observe, reset, startAuto, stopAuto, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
