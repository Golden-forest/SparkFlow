<title>交流发电机原理 · 线圈在匀强磁场中转动产生正弦电动势</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #070b18;
  --sim-surface: #131a2e;
  --sim-surface-soft: #1a2238;
  --sim-text: #e8eefc;
  --sim-muted: #8b9bb8;
  --sim-border: #2a3550;
  --sim-grid: #1f2940;
  --sim-accent: #22d3ee;
  --sim-accent-deep: #0891b2;
  --sim-accent-soft: #0e3a44;
  --sim-positive: #22d3ee;
  --sim-warning: #fbbf24;

  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;

  --sim-space-5: 24px;
  --sim-space-6: 32px;

  --sim-emf: #22d3ee;

body {
  margin: 0;
  min-width: 320px;
  color: var(--sim-text);
  background:
    radial-gradient(circle at 12% 0%, rgba(34,211,238,0.08), transparent 28%),

  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button:focus-visible, input:focus-visible { outline: 3px solid rgba(34,211,238,0.5); outline-offset: 2px; }
.app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 14px 18px; display: grid; grid-template-rows: auto minmax(0,1fr) auto; gap: 10px; overflow: hidden; }
.header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 48px; }
.header h1 { margin: 0 0 3px; font-size: clamp(1.3rem, 2vw, 1.75rem); letter-spacing: -0.03em; line-height: 1.1; }
.header p { margin: 0; color: var(--sim-muted); font-size: 0.82rem; }
.status { border: 1px solid rgba(34,211,238,0.3); border-radius: 999px; padding: 7px 14px; background: var(--sim-accent-soft); color: var(--sim-accent); font-weight: 700; white-space: nowrap; font-size: 0.82rem; }
.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 10px; }
.panel { min-width: 0; background: var(--sim-surface); border: 1px solid var(--sim-border); border-radius: var(--sim-radius-md); box-shadow: var(--sim-shadow); }
.scene-panel { padding: 10px 12px 8px; display: grid; grid-template-rows: auto minmax(0,1fr); overflow: hidden; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
.panel-head h2 { margin: 0; font-size: 0.92rem; }
.panel-head span { color: var(--sim-muted); font-size: 0.72rem; }
#sceneCanvas { width: 100%; height: 100%; min-height: 300px; display: block; border-radius: 12px; background: linear-gradient(160deg, #0a0f1e 0%, #131a2e 60%, #0d1428 100%); }
.chart-panel { padding: 10px 12px 6px; display: grid; grid-template-rows: auto minmax(0,1fr) auto; overflow: hidden; }
#chartCanvas { width: 100%; height: 100%; min-height: 200px; display: block; border-radius: 10px; background: #0a0f1e; }
.readouts { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; margin-top: 6px; }

.metric small { display: block; margin-bottom: 2px; color: var(--sim-muted); font-size: 0.68rem; }

button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 8px 12px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 700; font-size: 0.82rem; transition: transform .15s ease, background .15s ease, border-color .15s ease; }
button:hover { border-color: var(--sim-accent); background: var(--sim-accent-soft); }
button:active { transform: scale(.97); }
button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); }
button.toggle[aria-pressed="true"] { border-color: var(--sim-warning); color: var(--sim-warning); background: rgba(251,191,36,0.1); }
.control label { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 4px; font-size: 0.76rem; font-weight: 700; }
.control output { color: var(--sim-accent); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--sim-accent); }

.formula b { color: var(--sim-text); }
@media (max-width: 960px) {
  .app { height: auto; min-height: 100vh; overflow: visible; padding: 10px; }
  .main { grid-template-columns: 1fr; }
  .controls { grid-template-columns: 1fr; gap: 10px; }
  .formula { text-align: left; }
  .readouts { grid-template-columns: repeat(3, 1fr); }
  #sceneCanvas { min-height: 260px; aspect-ratio: 4/3; }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

<body>
<div class="app" data-layout="visualization-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>交流发电机原理</h1>
      <p>矩形线圈在匀强磁场中匀速转动，产生正弦交流电动势</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-label="立体装置示意">
      <div class="panel-head">
        <h2>立体装置示意</h2>
        <span>匀强磁场 · 矩形线圈 · 中性面高亮</span>
      </div>
      <canvas id="sceneCanvas"></canvas>
    </section>

    <section class="panel chart-panel" data-region="evidence" aria-label="实时曲线">
      <div class="panel-head">
        <h2 id="chartTitle">电动势 e - t 曲线</h2>
        <span id="chartSub">正弦曲线 · 逐点描迹</span>
      </div>
      <canvas id="chartCanvas"></canvas>
      <div class="readouts">
        <div class="metric"><small>theta / rad</small><strong id="thetaRO">0.00</strong></div>
        <div class="metric emf"><small>e / V</small><strong id="eRO">0.00</strong></div>
        <div class="metric flux"><small>Phi / Wb</small><strong id="phiRO">0.000</strong></div>
        <div class="metric"><small>Em / V</small><strong id="emRO">0.00</strong></div>
        <div class="metric"><small>T / s</small><strong id="tRO">0.00</strong></div>
      </div>
    </section>
  </main>

  <section class="panel controls" data-region="controls" aria-label="控件">
    <div class="actions">
      <button id="startBtn" class="primary" type="button">开始</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control">
      <label for="omegaInput">转速 omega <output id="omegaOutput">3.0 rad/s</output></label>
      <input id="omegaInput" type="range" min="0.5" max="8" step="0.1" value="3">
    </div>
    <div class="control">
      <label for="bInput">磁感应强度 B <output id="bOutput">0.50 T</output></label>
      <input id="bInput" type="range" min="0.1" max="2" step="0.05" value="0.5">
    </div>
    <div class="actions">
      <button id="modeBtn" class="toggle" type="button" aria-pressed="false">磁通/电动势对比</button>
    </div>
  </section>

  <div class="formula" data-region="insight">
    <b>e = Em * sin(omega * t)</b> &nbsp;·&nbsp; <b>Em = N * B * S * omega</b> &nbsp;·&nbsp; <b>Phi = N * B * S * cos(omega * t)</b> &nbsp;·&nbsp; 相位差 = pi/2
  </div>
</div>

<script>
(() => {
  "use strict";

  const N = 50;          // 匝数
  const S = 0.02;         // 线圈面积 m^2 (0.14m x 0.14m)
  const HISTORY_DURATION = 6; // 曲线显示窗口 6 秒

  const state = {
    running: false,
    t: 0,
    theta: 0,
    omega: 3.0,
    B: 0.5,
    mode: 'emf',          // 'emf' | 'compare'
    lastTimestamp: null,
    history: []           // [{ t, e, phi }]
  };

  const els = {
    status: document.getElementById('status'),
    sceneCanvas: document.getElementById('sceneCanvas'),
    chartCanvas: document.getElementById('chartCanvas'),
    thetaRO: document.getElementById('thetaRO'),
    eRO: document.getElementById('eRO'),
    phiRO: document.getElementById('phiRO'),
    emRO: document.getElementById('emRO'),
    tRO: document.getElementById('tRO'),
    omegaInput: document.getElementById('omegaInput'),
    omegaOutput: document.getElementById('omegaOutput'),
    bInput: document.getElementById('bInput'),
    bOutput: document.getElementById('bOutput'),
    startBtn: document.getElementById('startBtn'),
    pauseBtn: document.getElementById('pauseBtn'),
    resetBtn: document.getElementById('resetBtn'),
    modeBtn: document.getElementById('modeBtn'),
    chartTitle: document.getElementById('chartTitle'),
    chartSub: document.getElementById('chartSub')
  };

  const sceneCtx = els.sceneCanvas.getContext('2d');
  const chartCtx = els.chartCanvas.getContext('2d');

  // ===== 物理模型 =====
  function getEm() { return N * state.B * S * state.omega; }
  function getPeriod() { return state.omega > 0.01 ? (2 * Math.PI / state.omega) : Infinity; }
  function getE(t) { return getEm() * Math.sin(state.omega * t); }
  function getPhi(t) { return N * state.B * S * Math.cos(state.omega * t); }
  function getTheta(t) { return state.omega * t; }

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function finite(v, fb) { return Number.isFinite(v) ? v : fb; }

  // ===== Canvas 尺寸管理 =====
  function resizeCanvas(canvas) {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(1, Math.floor(rect.width));
    const h = Math.max(1, Math.floor(rect.height));
    if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
      canvas.width = w * dpr;
      canvas.height = h * dpr;
    }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w, h };
  }

  // ===== 立体装置绘制 =====
  function drawScene() {
    const { w, h } = resizeCanvas(els.sceneCanvas);
    const ctx = sceneCtx;
    ctx.clearRect(0, 0, w, h);

    const cx = w / 2;
    const cy = h / 2 + 8;
    const coilW = Math.min(w * 0.22, 110);
    const coilH = Math.min(h * 0.28, 95);
    const depth = 38;

    // 匀强磁场磁感线
    drawFieldLines(ctx, w, h);

    // 中性面参考线（虚线）
    ctx.save();
    ctx.strokeStyle = 'rgba(251,191,36,0.35)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(cx - coilW - 60, cy);
    ctx.lineTo(cx + coilW + 60, cy);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(251,191,36,0.7)';
    ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
    ctx.fillText('中性面', cx + coilW + 65, cy + 4);
    ctx.restore();

    // 线圈
    drawCoil3D(ctx, cx, cy, coilW, coilH, depth, state.theta);

    // 角度 theta 标注
    drawAngleArc(ctx, cx, cy, state.theta);

    // 磁场方向标注
    ctx.save();
    ctx.fillStyle = 'rgba(200,210,230,0.85)';
    ctx.font = 'bold 12px ui-sans-serif, system-ui, sans-serif';
    ctx.fillText('B', 18, 22);
    ctx.fillText('匀强磁场', 18, 38);
    ctx.restore();

    // 当前角度文字
    ctx.save();
    ctx.fillStyle = '#e8eefc';
    ctx.font = 'bold 13px ui-sans-serif, system-ui, sans-serif';
    const angleDeg = (state.theta * 180 / Math.PI) % 360;
    ctx.fillText(`theta = ${angleDeg.toFixed(0)}°`, w - 130, 24);
    ctx.restore();
  }

  function drawFieldLines(ctx, w, h) {
    const spacing = 52;
    const arrowSize = 7;
    ctx.save();
    ctx.strokeStyle = 'rgba(120,145,180,0.45)';
    ctx.fillStyle = 'rgba(120,145,180,0.6)';
    ctx.lineWidth = 1.2;
    const yStart = (h % spacing) / 2 + 8;
    for (let y = yStart; y < h; y += spacing) {
      ctx.beginPath();
      ctx.moveTo(8, y);
      ctx.lineTo(w - 8, y);
      ctx.stroke();
      // 箭头
      ctx.beginPath();
      ctx.moveTo(w - 8, y);
      ctx.lineTo(w - 8 - arrowSize, y - arrowSize / 2);
      ctx.lineTo(w - 8 - arrowSize, y + arrowSize / 2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawCoil3D(ctx, cx, cy, halfW, halfH, depth, theta) {
    // 8 个顶点：前圈 4 + 后圈 4
    const front = [
      { x: cx - halfW, y: cy - halfH },
      { x: cx + halfW, y: cy - halfH },
      { x: cx + halfW, y: cy + halfH },
      { x: cx - halfW, y: cy + halfH }
    ];
    const back = front.map(p => ({ x: p.x + depth, y: p.y - depth * 0.45 }));

    // 旋转：绕中心轴（竖直方向）旋转 theta
    const cosT = Math.cos(theta);
    const sinT = Math.sin(theta);
    function rot(p) {
      const dx = p.x - cx;
      const dy = p.y - cy;
      return { x: cx + dx * cosT - dy * sinT * 0.15, y: cy + dx * sinT * 0.15 + dy * cosT };
    }
    const fRot = front.map(rot);
    const bRot = back.map(rot);

    // 判断线圈是否接近中性面（theta ≈ 0, pi, 2pi...）
    const nearNeutral = Math.abs(Math.sin(theta)) < 0.08;

    // 连接线（侧边）
    ctx.save();
    ctx.strokeStyle = nearNeutral ? 'rgba(251,191,36,0.7)' : 'rgba(180,200,230,0.5)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(fRot[i].x, fRot[i].y);
      ctx.lineTo(bRot[i].x, bRot[i].y);
      ctx.stroke();
    }
    ctx.restore();

    // 后圈（虚线，较暗）
    ctx.save();
    ctx.strokeStyle = 'rgba(100,120,150,0.5)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(bRot[0].x, bRot[0].y);
    for (let i = 1; i < 4; i++) ctx.lineTo(bRot[i].x, bRot[i].y);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();

    // 前圈（实线，高亮）
    ctx.save();
    if (nearNeutral) {
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 3.5;
    } else {
      ctx.strokeStyle = '#22d3ee';
      ctx.lineWidth = 3;
    }
    ctx.beginPath();
    ctx.moveTo(fRot[0].x, fRot[0].y);
    for (let i = 1; i < 4; i++) ctx.lineTo(fRot[i].x, fRot[i].y);
    ctx.closePath();
    ctx.stroke();

    // 顶点
    ctx.fillStyle = nearNeutral ? '#fbbf24' : '#22d3ee';
    for (const p of fRot) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 转轴（竖直虚线）
    ctx.save();
    ctx.strokeStyle = 'rgba(200,210,230,0.4)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 4]);
    ctx.beginPath();
    ctx.moveTo(cx, cy - halfH - 25);
    ctx.lineTo(cx, cy + halfH + 25);
    ctx.stroke();
    ctx.setLineDash([]);
    // 轴端点
    ctx.fillStyle = 'rgba(200,210,230,0.6)';
    ctx.beginPath();
    ctx.arc(cx, cy - halfH - 25, 4, 0, Math.PI * 2);
    ctx.arc(cx, cy + halfH + 25, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawAngleArc(ctx, cx, cy, theta) {
    const r = 36;
    const normalized = ((theta % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    ctx.save();
    ctx.strokeStyle = 'rgba(34,211,238,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, normalized, false);
    ctx.stroke();
    // 起始线
    ctx.strokeStyle = 'rgba(200,210,230,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r + 8, cy);
    ctx.stroke();
    ctx.restore();
  }

  // ===== 实时曲线绘制 =====
  function drawChart() {
    const { w, h } = resizeCanvas(els.chartCanvas);
    const ctx = chartCtx;
    ctx.clearRect(0, 0, w, h);

    const padL = 48, padR = 16, padT = 14, padB = 28;
    const plotW = w - padL - padR;
    const plotH = h - padT - padB;
    const x0 = padL, y0 = padT;

    // 时间窗口
    const tWindow = HISTORY_DURATION;
    const tEnd = Math.max(tWindow, state.t);
    const tStart = tEnd - tWindow;

    // Y 轴范围
    const Em = getEm();
    const PhiMax = N * state.B * S;
    let yMax, yMin, yLabel, yColor;
    if (state.mode === 'compare') {
      yMax = Math.max(Em * 1.15, PhiMax * 1.15);
      yMin = -yMax;
      yLabel = 'e / V  ·  Phi / Wb';
      yUnit = '';
      yColor = '#e8eefc';
    } else {
      yMax = Em * 1.15;
      yMin = -yMax;
      yLabel = 'e / V';
      yUnit = '';
      yColor = '#22d3ee';
    }
    if (yMax < 0.01) yMax = 0.01;

    // 网格
    ctx.save();
    ctx.strokeStyle = 'rgba(60,75,100,0.5)';
    ctx.lineWidth = 0.5;
    ctx.fillStyle = 'rgba(139,155,184,0.8)';
    ctx.font = '10px ui-sans-serif, system-ui, sans-serif';
    // 水平网格 + Y 刻度
    const yTicks = 5;
    for (let i = 0; i <= yTicks; i++) {
      const yVal = yMin + (yMax - yMin) * i / yTicks;
      const py = y0 + plotH - (i / yTicks) * plotH;
      ctx.beginPath();
      ctx.moveTo(x0, py);
      ctx.lineTo(x0 + plotW, py);
      ctx.stroke();
      ctx.textAlign = 'right';
      ctx.fillText(yVal.toFixed(2), x0 - 4, py + 3);
    }
    // 垂直网格 + X 刻度
    const xTicks = 6;
    for (let i = 0; i <= xTicks; i++) {
      const tVal = tStart + (tEnd - tStart) * i / xTicks;
      const px = x0 + (i / xTicks) * plotW;
      ctx.beginPath();
      ctx.moveTo(px, y0);
      ctx.lineTo(px, y0 + plotH);
      ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillText(tVal.toFixed(1), px, y0 + plotH + 14);
    }
    ctx.restore();

    // 坐标轴
    ctx.save();
    ctx.strokeStyle = 'rgba(180,195,220,0.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x0, y0 + plotH);
    ctx.lineTo(x0 + plotW, y0 + plotH);
    ctx.stroke();
    ctx.restore();

    // 零线
    const zeroY = y0 + plotH - ((0 - yMin) / (yMax - yMin)) * plotH;
    ctx.save();
    ctx.strokeStyle = 'rgba(180,195,220,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x0, zeroY);
    ctx.lineTo(x0 + plotW, zeroY);
    ctx.stroke();
    ctx.restore();

    // 峰值线 Em
    if (state.mode === 'emf' || state.mode === 'compare') {
      const emY = y0 + plotH - ((Em - yMin) / (yMax - yMin)) * plotH;
      const negEmY = y0 + plotH - ((-Em - yMin) / (yMax - yMin)) * plotH;
      ctx.save();
      ctx.strokeStyle = 'rgba(34,211,238,0.35)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(x0, emY); ctx.lineTo(x0 + plotW, emY);
      ctx.moveTo(x0, negEmY); ctx.lineTo(x0 + plotW, negEmY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#22d3ee';
      ctx.font = 'bold 10px ui-sans-serif, system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`+Em=${Em.toFixed(2)}`, x0 + 4, emY - 3);
      ctx.fillText(`-Em=${(-Em).toFixed(2)}`, x0 + 4, negEmY + 11);
      ctx.restore();
    }

    // 周期标注
    const T = getPeriod();
    if (Number.isFinite(T) && T < tWindow * 0.8) {
      ctx.save();
      ctx.strokeStyle = 'rgba(251,191,36,0.4)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      const t1 = state.t - (state.t % T);
      const t2 = t1 + T;
      if (t1 >= tStart && t2 <= tEnd) {
        const x1 = x0 + ((t1 - tStart) / (tEnd - tStart)) * plotW;
        const x2 = x0 + ((t2 - tStart) / (tEnd - tStart)) * plotW;
        ctx.beginPath();
        ctx.moveTo(x1, y0 + plotH + 2);
        ctx.lineTo(x1, y0 + plotH - 8);
        ctx.moveTo(x2, y0 + plotH + 2);
        ctx.lineTo(x2, y0 + plotH - 8);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = 'rgba(251,191,36,0.7)';
        ctx.beginPath();
        ctx.moveTo(x1, y0 + plotH - 4);
        ctx.lineTo(x2, y0 + plotH - 4);
        ctx.stroke();
        // 箭头
        ctx.fillStyle = 'rgba(251,191,36,0.7)';
        ctx.beginPath();
        ctx.moveTo(x1, y0 + plotH - 4);
        ctx.lineTo(x1 + 5, y0 + plotH - 7);
        ctx.lineTo(x1 + 5, y0 + plotH - 1);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x2, y0 + plotH - 4);
        ctx.lineTo(x2 - 5, y0 + plotH - 7);
        ctx.lineTo(x2 - 5, y0 + plotH - 1);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 10px ui-sans-serif, system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`T=${T.toFixed(2)}s`, (x1 + x2) / 2, y0 + plotH - 10);
      }
      ctx.restore();
    }

    // 描迹
    function plotPoint(val) {
      const px = x0 + ((0) / (tEnd - tStart)) * plotW;
      const py = y0 + plotH - ((val - yMin) / (yMax - yMin)) * plotH;
      return { px, py };
    }

    // e-t 曲线
    if (state.history.length > 1) {
      ctx.save();
      ctx.strokeStyle = '#22d3ee';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      let started = false;
      for (const pt of state.history) {
        if (pt.t < tStart) continue;
        const px = x0 + ((pt.t - tStart) / (tEnd - tStart)) * plotW;
        const py = y0 + plotH - ((pt.e - yMin) / (yMax - yMin)) * plotH;
        if (!started) { ctx.moveTo(px, py); started = true; }
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.restore();
    }

    // Phi-t 曲线（对比模式）
    if (state.mode === 'compare' && state.history.length > 1) {
      ctx.save();
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      let started = false;
      for (const pt of state.history) {
        if (pt.t < tStart) continue;
        const px = x0 + ((pt.t - tStart) / (tEnd - tStart)) * plotW;
        const py = y0 + plotH - ((pt.phi - yMin) / (yMax - yMin)) * plotH;
        if (!started) { ctx.moveTo(px, py); started = true; }
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.restore();
    }

    // 当前点
    if (state.history.length > 0) {
      const last = state.history[state.history.length - 1];
      const px = x0 + ((last.t - tStart) / (tEnd - tStart)) * plotW;
      const ePy = y0 + plotH - ((last.e - yMin) / (yMax - yMin)) * plotH;
      // e 点
      ctx.save();
      ctx.fillStyle = '#22d3ee';
      ctx.beginPath();
      ctx.arc(px, ePy, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
      // 同步指示线
      ctx.save();
      ctx.strokeStyle = 'rgba(34,211,238,0.4)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 3]);
      ctx.beginPath();
      ctx.moveTo(px, y0);
      ctx.lineTo(px, y0 + plotH);
      ctx.stroke();
      ctx.restore();
      // Phi 点
      if (state.mode === 'compare') {
        const phiPy = y0 + plotH - ((last.phi - yMin) / (yMax - yMin)) * plotH;
        ctx.save();
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(px, phiPy, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      }
    }

    // 轴标签
    ctx.save();
    ctx.fillStyle = '#8b9bb8';
    ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('t / s', x0 + plotW / 2, y0 + plotH + 24);
    ctx.save();
    ctx.translate(12, y0 + plotH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(yLabel, 0, 0);
    ctx.restore();
    ctx.restore();

    // 图例
    ctx.save();
    ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
    let legendX = x0 + plotW - 120;
    const legendY = y0 + 6;
    if (state.mode === 'compare') {
      ctx.fillStyle = '#22d3ee';
      ctx.fillRect(legendX, legendY, 14, 3);
      ctx.fillStyle = '#e8eefc';
      ctx.textAlign = 'left';
      ctx.fillText('e = Em*sin(omega*t)', legendX + 18, legendY + 5);
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(legendX, legendY + 14, 14, 3);
      ctx.fillStyle = '#e8eefc';
      ctx.fillText('Phi = NBS*cos(omega*t)', legendX + 18, legendY + 19);
    } else {
      ctx.fillStyle = '#22d3ee';
      ctx.fillRect(legendX, legendY, 14, 3);
      ctx.fillStyle = '#e8eefc';
      ctx.textAlign = 'left';
      ctx.fillText('e = Em*sin(omega*t)', legendX + 18, legendY + 5);
    }
    ctx.restore();
  }

  // ===== 更新与渲染 =====
  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05);
    state.t += boundedDt;
    state.theta = getTheta(state.t);
    // 采样
    const e = getE(state.t);
    const phi = getPhi(state.t);
    state.history.push({ t: state.t, e, phi });
    // 清理超出窗口的历史
    const cutoff = state.t - HISTORY_DURATION - 0.5;
    while (state.history.length > 0 && state.history[0].t < cutoff) {
      state.history.shift();
    }
  }

  function render() {
    drawScene();
    drawChart();
    // 读数
    const e = getE(state.t);
    const phi = getPhi(state.t);
    const Em = getEm();
    const T = getPeriod();
    const thetaNorm = ((state.theta % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    els.thetaRO.textContent = thetaNorm.toFixed(2);
    els.eRO.textContent = e.toFixed(2);
    els.phiRO.textContent = phi.toFixed(3);
    els.emRO.textContent = Em.toFixed(2);
    els.tRO.textContent = Number.isFinite(T) ? T.toFixed(2) : '∞';
    els.omegaOutput.textContent = `${state.omega.toFixed(1)} rad/s`;
    els.bOutput.textContent = `${state.B.toFixed(2)} T`;
  }

  // ===== 生命周期 =====
  function start() {
    state.running = true;
    els.status.textContent = '运行中';
    els.startBtn.setAttribute('aria-pressed', 'true');
  }
  function pause() {
    state.running = false;
    els.status.textContent = '已暂停';
    els.startBtn.setAttribute('aria-pressed', 'false');
  }
  function reset() {
    pause();
    state.t = 0;
    state.theta = 0;
    state.lastTimestamp = null;
    state.history = [{ t: 0, e: 0, phi: N * state.B * S }];
    render();
  }
  function setParameters(values) {
    if (values.omega !== undefined) state.omega = clamp(finite(Number(values.omega), 3), 0.5, 8);
    if (values.B !== undefined) state.B = clamp(finite(Number(values.B), 0.5), 0.1, 2);
    els.omegaInput.value = String(state.omega);
    els.bInput.value = String(state.B);
    // 参数变化后重新计算当前时刻的 e, phi
    if (state.history.length > 0) {
      const last = state.history[state.history.length - 1];
      last.e = getE(last.t);
      last.phi = getPhi(last.t);
    }
    render();
  }
  function toggleMode() {
    state.mode = state.mode === 'emf' ? 'compare' : 'emf';
    const isCompare = state.mode === 'compare';
    els.modeBtn.setAttribute('aria-pressed', String(isCompare));
    els.chartTitle.textContent = isCompare ? '磁通 Phi - T 与电动势 e - T 对比' : '电动势 e - T 曲线';
    els.chartSub.textContent = isCompare ? '相位差 = pi/2 · 余弦与正弦' : '正弦曲线 · 逐点描迹';
    render();
  }

  // ===== 模型检查 =====
  function runModelChecks() {
    const omega = 3.0, B = 0.5;
    const Em = N * B * S * omega;
    const PhiMax = N * B * S;
    // 1. 峰值公式
    const emCheck = Math.abs(Em - (50 * 0.5 * 0.02 * 3.0)) < 1e-9;
    // 2. e(0) = 0
    const e0 = Em * Math.sin(0);
    const e0Check = Math.abs(e0) < 1e-12;
    // 3. Phi(0) = NBS
    const phi0 = PhiMax * Math.cos(0);
    const phi0Check = Math.abs(phi0 - PhiMax) < 1e-12;
    // 4. 相位差 pi/2: e = Em*sin(omega*t), Phi = PhiMax*cos(omega*t) = PhiMax*sin(omega*t + pi/2)
    const tTest = 0.3;
    const eAt = Em * Math.sin(omega * tTest);
    const phiAt = PhiMax * Math.cos(omega * tTest);
    // 当 e=0 时 Phi 应为极值；当 e=Em 时 Phi 应为 0
    const tQuarter = Math.PI / (2 * omega);
    const eAtQ = Em * Math.sin(omega * tQuarter);
    const phiAtQ = PhiMax * Math.cos(omega * tQuarter);
    const phaseCheck = Math.abs(eAtQ - Em) < 1e-9 && Math.abs(phiAtQ) < 1e-9;
    // 5. 周期
    const T = 2 * Math.PI / omega;
    const tCheck = Math.abs(T - (2 * Math.PI / 3.0)) < 1e-9;
    // 6. B 比例性：B 翻倍，Em 翻倍
    const Em2 = N * (2 * B) * S * omega;
    const propCheck = Math.abs(Em2 / Em - 2) < 1e-9;
    // 7. omega 比例性
    const Em3 = N * B * S * (2 * omega);
    const omegaPropCheck = Math.abs(Em3 / Em - 2) < 1e-9;

    return [
      { name: '峰值公式 Em = N*B*S*omega', pass: emCheck, expected: N * B * S * omega, actual: Em, tolerance: '1e-9' },
      { name: 'e(0) = 0（中性面电动势为零）', pass: e0Check, expected: 0, actual: e0, tolerance: '1e-12' },
      { name: 'Phi(0) = N*B*S（中性面磁通最大）', pass: phi0Check, expected: PhiMax, actual: phi0, tolerance: '1e-12' },
      { name: '相位差 pi/2：e=Em 时 Phi=0', pass: phaseCheck, expected: 'e=Em, Phi=0', actual: `e=${eAtQ.toFixed(4)}, Phi=${phiAtQ.toFixed(6)}`, tolerance: '1e-9' },
      { name: '周期 T = 2*pi/omega', pass: tCheck, expected: 2 * Math.PI / 3.0, actual: T, tolerance: '1e-9' },
      { name: 'B 比例性：B 翻倍则 Em 翻倍', pass: propCheck, expected: 'Em2/Em=2', actual: `${(Em2/Em).toFixed(6)}`, tolerance: '1e-9' },
      { name: 'omega 比例性：omega 翻倍则 Em 翻倍', pass: omegaPropCheck, expected: 'Em3/Em=2', actual: `${(Em3/Em).toFixed(6)}`, tolerance: '1e-9' }
    ];
  }

  // ===== 绑定 =====
  function bindControls() {
    els.startBtn.addEventListener('click', start);
    els.pauseBtn.addEventListener('click', pause);
    els.resetBtn.addEventListener('click', reset);
    els.modeBtn.addEventListener('click', toggleMode);
    els.omegaInput.addEventListener('input', () => setParameters({ omega: els.omegaInput.value }));
    els.bInput.addEventListener('input', () => setParameters({ B: els.bInput.value }));
    window.addEventListener('resize', () => { render(); });
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  function init() {
    bindControls();
    setParameters({ omega: 3.0, B: 0.5 });
    reset();
    requestAnimationFrame(frame);
  }

  function getState() {
    return {
      running: state.running,
      t: state.t,
      theta: state.theta,
      omega: state.omega,
      B: state.B,
      mode: state.mode,
      history: state.history.map(s => ({ ...s }))
    };
  }

  function getReadouts() {
    return {
      theta: state.theta,
      e: getE(state.t),
      phi: getPhi(state.t),
      Em: getEm(),
      T: getPeriod()
    };
  }

  window.simulation = {
    init,
    start,
    pause,
    reset,
    update,
    render,
    setParameters,
    toggleMode,
    getState,
    getReadouts,
    runModelChecks
  };
  init();
})();
</script>
</body>
</html>
