  <meta charset="utf-8">

  <title>大数定律 · 单次偶然 总体必然</title>
  <style>
    :root {
      color-scheme: dark;
      --sim-bg: #060912;
      --sim-surface: rgba(16, 24, 42, 0.55);
      --sim-surface-soft: rgba(20, 30, 52, 0.4);
      --sim-text: #e8eefc;
      --sim-muted: #7a8aa8;
      --sim-border: rgba(60, 80, 120, 0.3);
      --sim-grid: rgba(80, 100, 140, 0.07);
      --sim-accent: #22d3ee;
      --sim-accent-deep: #0891b2;
      --sim-accent-soft: rgba(34, 211, 238, 0.15);
      --sim-positive: #22d3ee;
      --sim-warning: #fbbf24;
      --sim-danger: #f87171;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 14px 36px rgba(0, 0, 0, 0.4);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      background: var(--sim-bg);
      color: var(--sim-text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app {
      width: 100vw; height: 100vh; height: 100dvh;
      display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 0; overflow: hidden; position: relative;
    }
    .app::before {
      content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 70% 55% at 50% 18%, rgba(34, 211, 238, 0.07), transparent 70%),
        radial-gradient(ellipse 60% 50% at 50% 88%, rgba(251, 191, 36, 0.04), transparent 70%),
        radial-gradient(circle at 50% 50%, #0a1020 0%, #060912 50%, #02040a 100%);
    }
    .header {
      position: relative; z-index: 2;
      padding: 20px 36px 6px;
      display: flex; justify-content: space-between; align-items: flex-end; gap: 24px;
    }
    .header-left h1 {
      margin: 0 0 4px; font-size: clamp(1.3rem, 2.2vw, 1.9rem);
      font-weight: 800; letter-spacing: -0.02em; line-height: 1.1;
      color: #e8eefc;
    }
    .header-left p {
      margin: 0; font-size: 0.82rem; color: var(--sim-muted); letter-spacing: 0.04em;
    }
    .status {
      font-size: 0.72rem; font-weight: 700; color: var(--sim-muted);
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 6px 14px; border: 1px solid var(--sim-border);
      border-radius: 999px; background: var(--sim-surface-soft);
      white-space: nowrap;
    }
    .status .dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--sim-accent); margin-right: 6px; vertical-align: middle;
    }
    .status.running .dot { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .stage-wrap {
      position: relative; z-index: 1; min-height: 0;
      display: flex; align-items: stretch; justify-content: center;
      padding: 4px 24px;
    }
    #stage {
      width: 100%; height: 100%; display: block;
    }

    .controls {
      position: relative; z-index: 2;
      padding: 14px 36px 18px;
      display: grid; grid-template-columns: 1fr auto 1fr;
      gap: 28px; align-items: center;
    }
    .control-group { display: flex; align-items: center; gap: 14px; }
    .control-group.right { justify-content: flex-end; }
    .slider-wrap {
      display: flex; align-items: center; gap: 12px;
      background: var(--sim-surface); border: 1px solid var(--sim-border);
      border-radius: 999px; padding: 8px 18px;
    }
    .slider-wrap label {
      font-size: 0.72rem; font-weight: 700; color: var(--sim-muted);
      letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
    }
    .slider-wrap output {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.92rem; font-weight: 700; color: var(--sim-accent);
      min-width: 52px; text-align: right; font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 200px; height: 4px; background: rgba(60, 80, 120, 0.4);
      border-radius: 999px; outline: none; cursor: pointer;

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--sim-accent); cursor: pointer;
      border: 2px solid #0a1020;
      box-shadow: 0 0 0 1px var(--sim-accent), 0 0 8px rgba(34, 211, 238, 0.4);
    }
    input[type="range"]::-moz-range-thumb {
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--sim-accent); cursor: pointer; border: 2px solid #0a1020;
      box-shadow: 0 0 0 1px var(--sim-accent);
    }
    .tier-buttons { display: flex; gap: 8px; }
    .tier-buttons button {
      background: var(--sim-surface); border: 1px solid var(--sim-border);
      color: var(--sim-text); padding: 9px 18px; border-radius: 999px;
      font-size: 0.82rem; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; font-variant-numeric: tabular-nums;

    }
    .tier-buttons button:hover {

    .reset-btn {

    .reset-btn:hover {
      border-color: rgba(248, 113, 113, 0.5); color: var(--sim-danger);

    }
    button:focus-visible, input:focus-visible {
      outline: 2px solid rgba(34, 211, 238, 0.5); outline-offset: 2px;
    }
    @media (max-width: 760px) {
      .header { padding: 14px 18px 4px; flex-direction: column; align-items: flex-start; gap: 8px; }
      .stage-wrap { padding: 4px 12px; }
      .controls { grid-template-columns: 1fr; gap: 10px; padding: 10px 18px 14px; }
      .control-group, .control-group.right { justify-content: center; }
      input[type="range"] { width: 140px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .status.running .dot { animation: none; }
    }
  </style>

<body>
  <div class="app" data-layout="visualization-first" data-model-tier="rule-based">
    <header class="header" data-region="header">
      <div class="header-left">
        <h1>大数定律</h1>
        <p>单次偶然 · 总体必然</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">
        <span class="dot"></span><span id="statusText">就绪</span>
      </div>
    </header>

    <div class="stage-wrap" data-region="stage">
      <canvas id="stage" role="img" aria-label="硬币抛掷与正面频率折线可视化"></canvas>
    </div>

    <section class="controls" data-region="controls" aria-label="模拟控件">
      <div class="control-group">
        <div class="slider-wrap">
          <label for="speedInput">速度</label>
          <input id="speedInput" type="range" min="1" max="500" step="1" value="30">
          <output id="speedOutput">30×</output>
        </div>
      </div>
      <div class="tier-buttons" role="group" aria-label="目标抛掷档位">
        <button data-tier="10" type="button">10</button>
        <button data-tier="100" type="button">100</button>
        <button data-tier="1000" type="button" class="active">1000</button>
        <button data-tier="10000" type="button">10000</button>
      </div>
      <div class="control-group right">
        <button id="resetBtn" class="reset-btn" type="button">重置</button>
      </div>
    </section>

    <aside class="evidence" data-region="evidence" aria-label="实时数据">
      <div class="readout-grid">
        <div class="metric"><small>抛掷次数 n</small><strong id="nReadout">0</strong></div>
        <div class="metric"><small>正面次数</small><strong id="headsReadout">0</strong></div>
        <div class="metric"><small>反面次数</small><strong id="tailsReadout">0</strong></div>
        <div class="metric"><small>正面频率</small><strong id="freqReadout">0.5000</strong></div>
      </div>
    </aside>

    <section class="insight" data-region="insight" aria-label="观察提示">
      <p id="insightText">单次抛掷是偶然，随着次数增加，正面频率会稳定在 0.5 附近。</p>
    </section>
  </div>

  <script>
  (() => {
    "use strict";

    // ===== 种子化 PRNG (mulberry32) =====
    function makeRng(seed) {
      let s = seed >>> 0;
      return function() {
        s = (s + 0x6D2B79F5) >>> 0;
        let t = s;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // ===== 参数 schema =====
    const parameterSchema = [
      { key: "speed", label: "速度", type: "slider", min: 1, max: 500, step: 1, default: 30, unit: "×" },
      { key: "targetN", label: "目标次数", type: "tier", options: [10, 100, 1000, 10000], default: 1000 }
    ];

    // ===== 权威状态 =====
    const state = {
      running: true,
      speed: 30,
      targetN: 1000,
      n: 0,
      heads: 0,
      history: [{ n: 0, freq: 0.5 }],
      rng: makeRng(42),
      flipPhase: 0,
      flipResult: null,
      flipStartTime: 0,
      lastResult: null,
      lastResultTime: 0,
      coinTrail: [],
      introStart: 0,
      introDone: false,
      lastTimestamp: null,
      accumT: 0,
      width: 0,
      height: 0,
      dpr: 1
    };

    // ===== DOM =====
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const els = {
      status: document.getElementById("status"),
      statusText: document.getElementById("statusText"),
      speedInput: document.getElementById("speedInput"),
      speedOutput: document.getElementById("speedOutput"),
      resetBtn: document.getElementById("resetBtn"),
      tierButtons: document.querySelectorAll(".tier-buttons button"),
      nReadout: document.getElementById("nReadout"),
      headsReadout: document.getElementById("headsReadout"),
      tailsReadout: document.getElementById("tailsReadout"),
      freqReadout: document.getElementById("freqReadout"),
      insightText: document.getElementById("insightText")
    };

    // ===== 工具 =====
    function clamp(v, mn, mx) { return Math.min(mx, Math.max(mn, v)); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    // ===== 生命周期 =====
    function init() {
      resize();
      window.addEventListener("resize", resize);
      bindControls();
      setParameters({ speed: 30, targetN: 1000 });
      state.introStart = performance.now();
      reset();
      requestAnimationFrame(frame);
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = canvas.getBoundingClientRect();
      state.dpr = dpr;
      state.width = rect.width;
      state.height = rect.height;
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function start() {
      state.running = true;
      els.status.classList.add("running");
      els.statusText.textContent = "运行中";
    }
    function pause() {
      state.running = false;
      els.status.classList.remove("running");
      els.statusText.textContent = "已暂停";
    }
    function reset() {
      state.n = 0;
      state.heads = 0;
      state.history = [{ n: 0, freq: 0.5 }];
      state.rng = makeRng(42);
      state.flipPhase = 0;
      state.flipResult = null;
      state.lastResult = null;
      state.coinTrail = [];
      state.accumT = 0;
      state.introStart = performance.now();
      state.introDone = false;
      start();
    }

    function setParameters(values) {
      const speedDef = parameterSchema[0];
      if (values.speed !== undefined) {
        state.speed = clamp(Math.floor(Number(values.speed) || speedDef.default), speedDef.min, speedDef.max);
        els.speedInput.value = String(state.speed);
        els.speedOutput.textContent = state.speed + "×";
      }
      if (values.targetN !== undefined) {
        state.targetN = Number(values.targetN);
        els.tierButtons.forEach(b => {
          b.classList.toggle("active", Number(b.dataset.tier) === state.targetN);
        });
      }
    }

    function getState() {
      return {
        running: state.running,
        speed: state.speed,
        targetN: state.targetN,
        n: state.n,
        heads: state.heads,
        freq: state.n > 0 ? state.heads / state.n : 0.5,
        flipPhase: state.flipPhase,
        flipResult: state.flipResult
      };
    }
    function getReadouts() {
      return {
        n: state.n,
        heads: state.heads,
        tails: state.n - state.heads,
        frequency: state.n > 0 ? state.heads / state.n : 0.5,
        speed: state.speed,
        targetN: state.targetN
      };
    }

    // ===== 模型更新 =====
    function update(dt) {
      if (!state.introDone) {
        const elapsed = (performance.now() - state.introStart) / 1000;
        if (elapsed >= 2) state.introDone = true;
        return;
      }
      if (!state.running) return;
      if (state.n >= state.targetN) return;

      // 累积时间，按 speed 倍率推进翻转
      state.accumT += dt * state.speed;

      while (state.accumT >= 1 && state.n < state.targetN) {
        state.accumT -= 1;
        doFlip();
      }
    }

    function doFlip() {
      const result = state.rng() < 0.5 ? "heads" : "tails";
      state.lastResult = state.flipResult;
      state.flipResult = result;
      state.lastResultTime = performance.now();
      state.flipStartTime = performance.now();
      state.flipPhase = 0;

      state.n += 1;
      if (result === "heads") state.heads += 1;
      const freq = state.heads / state.n;
      state.history.push({ n: state.n, freq: freq });

      // 硬币拖尾
      state.coinTrail.push({
        cx: 0.5,
        cy: 0.5,
        result: result,
        born: performance.now()
      });
      if (state.coinTrail.length > 8) state.coinTrail.shift();

      if (state.n >= state.targetN) {
        state.running = false;
        els.status.classList.remove("running");
        els.statusText.textContent = "已完成";
      }
    }

    // ===== 渲染 =====
    function render() {
      const W = state.width, H = state.height;
      if (W < 2 || H < 2) return;

      ctx.clearRect(0, 0, W, H);

      // 背景径向渐变层
      const bgGrad = ctx.createRadialGradient(W*0.5, H*0.5, 0, W*0.5, H*0.5, Math.max(W, H)*0.7);
      bgGrad.addColorStop(0, "#0a1020");
      bgGrad.addColorStop(0.5, "#060912");
      bgGrad.addColorStop(1, "#02040a");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // 上半微光
      const topGlow = ctx.createRadialGradient(W*0.5, H*0.12, 0, W*0.5, H*0.12, H*0.5);
      topGlow.addColorStop(0, "rgba(34, 211, 238, 0.06)");
      topGlow.addColorStop(1, "rgba(34, 211, 238, 0)");
      ctx.fillStyle = topGlow;
      ctx.fillRect(0, 0, W, H*0.5);

      // 下半微光
      const botGlow = ctx.createRadialGradient(W*0.5, H*0.85, 0, W*0.5, H*0.85, H*0.5);
      botGlow.addColorStop(0, "rgba(251, 191, 36, 0.03)");
      botGlow.addColorStop(1, "rgba(251, 191, 36, 0)");
      ctx.fillStyle = botGlow;
      ctx.fillRect(0, H*0.5, W, H*0.5);

      // 细网格 (不透明度 < 8%)
      drawGrid(W, H);

      // 分区分隔线
      const splitY = Math.floor(H * 0.42);
      ctx.strokeStyle = "rgba(60, 80, 120, 0.15)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, splitY);
      ctx.lineTo(W, splitY);
      ctx.stroke();

      // 开场淡入
      let introAlpha = 1;
      if (!state.introDone) {
        const elapsed = (performance.now() - state.introStart) / 1000;
        introAlpha = clamp(elapsed / 2, 0, 1);
      }

      ctx.save();
      ctx.globalAlpha = introAlpha;

      // 上半：硬币区
      drawCoinArea(W, splitY);

      // 下半：折线区
      drawChartArea(W, splitY, H - splitY);

      ctx.restore();

      // 读数 (始终显示)
      drawReadouts(W, H);

      // 结尾字幕
      if (state.n >= state.targetN && state.targetN >= 1000) {
        drawEndingCaption(W, H);
      }

      // 更新侧栏读数与洞察
      updateSideReadouts();
    }

    function drawGrid(W, H) {
      ctx.strokeStyle = "rgba(80, 100, 140, 0.05)";
      ctx.lineWidth = 1;
      const step = 40;
      ctx.beginPath();
      for (let x = 0; x <= W; x += step) {
        ctx.moveTo(x, 0); ctx.lineTo(x, H);
      }
      for (let y = 0; y <= H; y += step) {
        ctx.moveTo(0, y); ctx.lineTo(W, y);
      }
      ctx.stroke();
    }

    // ===== 硬币绘制 =====
    function drawCoinArea(W, H) {
      const cx = W * 0.5;
      const cy = H * 0.5;
      const baseR = Math.min(W, H) * 0.16;
      const r = Math.max(20, baseR);

      // 翻转相位推进 (时间确定性函数)
      if (state.flipResult !== null && state.n < state.targetN) {
        const elapsed = (performance.now() - state.flipStartTime) / 1000;
        const dur = clamp(1 / Math.max(1, state.speed * 0.6), 0.12, 0.8);
        state.flipPhase = clamp(elapsed / dur, 0, 1);
      }

      // 拖尾
      const now = performance.now();
      state.coinTrail.forEach((t, i) => {
        const age = (now - t.born) / 1000;
        const alpha = Math.max(0, 0.25 - age * 0.5);
        if (alpha <= 0) return;
        const trailR = r * (0.3 + i * 0.04);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(cx, cy, trailR, 0, Math.PI * 2);
        const col = t.result === "heads" ? "#22d3ee" : "#fb923c";
        ctx.strokeStyle = col;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      });

      // 硬币本体
      const phase = state.flipPhase;
      const scaleY = Math.abs(Math.cos(phase * Math.PI * 2.5));
      const showFace = (Math.cos(phase * Math.PI * 2.5) >= 0) ? state.flipResult : (state.flipResult === "heads" ? "tails" : "heads");

      // 外层粗半透明描边 (辉光模拟，禁用 shadowBlur)
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(1, Math.max(0.02, scaleY));

      const glowColor = showFace === "heads" ? "rgba(34, 211, 238, 0.25)" : "rgba(251, 146, 60, 0.25)";
      ctx.beginPath();
      ctx.arc(0, 0, r + 6, 0, Math.PI * 2);
      ctx.fillStyle = glowColor;
      ctx.fill();

      // 内层实色描边
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      if (showFace === "heads") {
        const g = ctx.createRadialGradient(0, -r*0.3, 0, 0, 0, r);
        g.addColorStop(0, "#67e8f9");
        g.addColorStop(0.6, "#22d3ee");
        g.addColorStop(1, "#0e7490");
        ctx.fillStyle = g;
      } else {
        const g = ctx.createRadialGradient(0, -r*0.3, 0, 0, 0, r);
        g.addColorStop(0, "#fdba74");
        g.addColorStop(0.6, "#fb923c");
        g.addColorStop(1, "#9a3412");
        ctx.fillStyle = g;
      }
      ctx.fill();
      ctx.strokeStyle = showFace === "heads" ? "#0891b2" : "#c2410c";
      ctx.lineWidth = 2;
      ctx.stroke();

      // 字面
      ctx.fillStyle = showFace === "heads" ? "#0a1020" : "#0a1020";
      ctx.font = `800 ${Math.floor(r * 0.55)}px ui-sans-serif, system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(showFace === "heads" ? "正" : "反", 0, 0);

      ctx.restore();

      // 硬币下方阴影椭圆
      ctx.save();
      ctx.globalAlpha = 0.15;
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.ellipse(cx, cy + r * 0.9, r * 0.7, r * 0.12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 上次结果标签
      if (state.lastResult && state.n > 1) {
        const age = (now - state.lastResultTime) / 1000;
        const alpha = clamp(1 - age * 2, 0, 1);
        if (alpha > 0) {
          ctx.save();
          ctx.globalAlpha = alpha * 0.6;
          ctx.fillStyle = state.lastResult === "heads" ? "#22d3ee" : "#fb923c";
          ctx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("上次: " + (state.lastResult === "heads" ? "正" : "反"), cx, cy - r - 20);
          ctx.restore();
        }
      }
    }

    // ===== 折线图绘制 =====
    function drawChartArea(W, H, chartH) {
      const padL = 50, padR = 30, padT = 16, padB = 28;
      const plotW = W - padL - padR;
      const plotH = chartH - padT - padB;
      if (plotW < 20 || plotH < 20) return;

      const yOf = (freq) => padT + (1 - freq) * plotH;
      const xOf = (n) => padL + (state.targetN > 0 ? (n / state.targetN) * plotW : 0);

      // Y 轴刻度
      ctx.strokeStyle = "rgba(80, 100, 140, 0.12)";
      ctx.lineWidth = 1;
      ctx.fillStyle = "rgba(122, 138, 168, 0.6)";
      ctx.font = "10px ui-monospace, monospace";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (let i = 0; i <= 4; i++) {
        const f = i * 0.25;
        const y = yOf(f);
        ctx.beginPath();
        ctx.moveTo(padL, y); ctx.lineTo(W - padR, y);
        ctx.stroke();
        ctx.fillText(f.toFixed(2), padL - 6, y);
      }

      // 0.5 金色虚线
      const targetY = yOf(0.5);
      ctx.strokeStyle = "rgba(251, 191, 36, 0.7)";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 5]);
      ctx.beginPath();
      ctx.moveTo(padL, targetY); ctx.lineTo(W - padR, targetY);
      ctx.stroke();
      ctx.setLineDash([]);

      // 0.5 标签
      ctx.fillStyle = "rgba(251, 191, 36, 0.9)";
      ctx.font = "700 10px ui-monospace, monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "bottom";
      ctx.fillText("p = 0.5", padL + 4, targetY - 3);

      // 折线
      if (state.history.length > 1) {
        // 外层粗半透明描边 (辉光)
        ctx.strokeStyle = "rgba(34, 211, 238, 0.18)";
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        state.history.forEach((pt, i) => {
          const x = xOf(pt.n), y = yOf(clamp(pt.freq, 0, 1));
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();

        // 内层实色线
        ctx.strokeStyle = "#22d3ee";
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        state.history.forEach((pt, i) => {
          const x = xOf(pt.n), y = yOf(clamp(pt.freq, 0, 1));
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();

        // 当前点
        const last = state.history[state.history.length - 1];
        const lx = xOf(last.n), ly = yOf(clamp(last.freq, 0, 1));
        // 外层光晕
        ctx.fillStyle = "rgba(34, 211, 238, 0.25)";
        ctx.beginPath();
        ctx.arc(lx, ly, 7, 0, Math.PI * 2);
        ctx.fill();
        // 内层实心
        ctx.fillStyle = "#22d3ee";
        ctx.beginPath();
        ctx.arc(lx, ly, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#0a1020";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // X 轴标签
      ctx.fillStyle = "rgba(122, 138, 168, 0.6)";
      ctx.font = "10px ui-monospace, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      const xTicks = 4;
      for (let i = 0; i <= xTicks; i++) {
        const n = Math.round((state.targetN * i) / xTicks);
        const x = padL + (i / xTicks) * plotW;
        ctx.fillText(String(n), x, padT + plotH + 6);
      }

      // 轴标题
      ctx.fillStyle = "rgba(122, 138, 168, 0.5)";
      ctx.font = "700 9px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText("频率", padL - 38, padT + plotH * 0.5 - 14);
      ctx.textAlign = "right";
      ctx.fillText("抛掷次数 n", W - padR, padT + plotH + 18);
    }

    // ===== 读数 =====
    function drawReadouts(W, H) {
      const freq = state.n > 0 ? state.heads / state.n : 0.5;
      const items = [
        { label: "n", value: state.n.toString(), color: "#e8eefc" },
        { label: "正面", value: state.heads.toString(), color: "#22d3ee" },
        { label: "频率", value: freq.toFixed(4), color: "#fbbf24" }
      ];

      const blockW = 120, blockH = 44, gap = 12;
      const totalW = blockW * 3 + gap * 2;
      const startX = (W - totalW) / 2;
      const y = 12;

      ctx.textAlign = "left";
      ctx.textBaseline = "middle";

      items.forEach((it, i) => {
        const x = startX + i * (blockW + gap);
        // 背景
        ctx.fillStyle = "rgba(16, 24, 42, 0.5)";
        ctx.strokeStyle = "rgba(60, 80, 120, 0.25)";
        ctx.lineWidth = 1;
        roundRect(x, y, blockW, blockH, 10);
        ctx.fill();
        ctx.stroke();

        // 标签
        ctx.fillStyle = "rgba(122, 138, 168, 0.8)";
        ctx.font = "700 9px ui-sans-serif, system-ui, sans-serif";
        ctx.fillText(it.label, x + 12, y + 14);

        // 数值
        ctx.fillStyle = it.color;
        ctx.font = "700 17px ui-monospace, 'SF Mono', Menlo, monospace";
        ctx.fillText(it.value, x + 12, y + 30);
      });
    }

    function drawEndingCaption(W, H) {
      const t = clamp((performance.now() - state.lastResultTime) / 1000, 0, 3);
      const alpha = easeOutCubic(t);
      if (alpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "rgba(232, 238, 252, 0.85)";
      ctx.font = "700 13px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("单次是偶然  总体是必然  —  这就是大数定律", W * 0.5, H * 0.5);
      ctx.restore();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // ===== 侧栏读数与洞察更新 =====
    function updateSideReadouts() {
      const freq = state.n > 0 ? state.heads / state.n : 0.5;
      els.nReadout.textContent = state.n.toString();
      els.headsReadout.textContent = state.heads.toString();
      els.tailsReadout.textContent = (state.n - state.heads).toString();
      els.freqReadout.textContent = freq.toFixed(4);

      const dev = Math.abs(freq - 0.5);
      if (state.n === 0) {
        els.insightText.textContent = "单次抛掷是偶然，随着次数增加，正面频率会稳定在 0.5 附近。";
      } else if (state.n < 50) {
        els.insightText.textContent = "前 " + state.n + " 次：频率波动剧烈，单次结果对平均值影响很大。";
      } else if (dev > 0.05) {
        els.insightText.textContent = "已抛 " + state.n + " 次：频率仍在调整，但波动幅度正在收窄。";
      } else if (state.n < state.targetN) {
        els.insightText.textContent = "已抛 " + state.n + " 次：频率逐渐收敛至 0.5 附近（偏差 " + dev.toFixed(3) + "）。";
      } else {
        els.insightText.textContent = "完成 " + state.targetN + " 次抛掷：正面频率 " + freq.toFixed(4) + "，稳定趋近 0.5。";
      }
    }

    // ===== 模型检查 =====
    function runModelChecks() {
      const testRng = makeRng(999);
      const cases = [];
      // 1. 公平性: 大样本正面比例接近 0.5
      let h = 0;
      const N = 10000;
      for (let i = 0; i < N; i++) if (testRng() < 0.5) h++;
      const ratio = h / N;
      cases.push({
        name: "大样本正面比例接近 0.5",
        pass: Math.abs(ratio - 0.5) < 0.05,
        expected: "0.5 ± 0.05",
        actual: ratio.toFixed(4),
        tolerance: "0.05"
      });
      // 2. 频率始终在 [0,1]
      let minF = 1, maxF = 0;
      let hh = 0;
      for (let i = 1; i <= 1000; i++) {
        if (testRng() < 0.5) hh++;
        const f = hh / i;
        if (f < minF) minF = f;
        if (f > maxF) maxF = f;
      }
      cases.push({
        name: "频率始终在 [0, 1]",
        pass: minF >= 0 && maxF <= 1,
        expected: "[0, 1]",
        actual: `[${minF.toFixed(3)}, ${maxF.toFixed(3)}]`,
        tolerance: "边界"
      });
      // 3. 收敛性: 后段频率比前段更接近 0.5
      const rng3 = makeRng(7);
      let h3 = 0, freqs = [];
      for (let i = 1; i <= 5000; i++) {
        if (rng3() < 0.5) h3++;
        freqs.push(h3 / i);
      }
      const earlyDev = Math.abs(freqs[49] - 0.5);
      const lateDev = Math.abs(freqs[4999] - 0.5);
      cases.push({
        name: "后段频率偏差小于前段",
        pass: lateDev < earlyDev,
        expected: "late < early",
        actual: `${lateDev.toFixed(4)} < ${earlyDev.toFixed(4)}`,
        tolerance: "单调"
      });
      // 4. 确定性: 相同种子相同序列
      const rA = makeRng(42), rB = makeRng(42);
      let same = true;
      for (let i = 0; i < 100; i++) {
        if (rA() !== rB()) { same = false; break; }
      }
      cases.push({
        name: "相同种子产生相同序列",
        pass: same,
        expected: "序列一致",
        actual: same ? "一致" : "不一致",
        tolerance: "严格"
      });
      return cases;
    }

    // ===== 控件绑定 =====
    function bindControls() {
      els.speedInput.addEventListener("input", () => {
        setParameters({ speed: els.speedInput.value });
      });
      els.tierButtons.forEach(btn => {
        btn.addEventListener("click", () => {
          setParameters({ targetN: Number(btn.dataset.tier) });
          reset();
        });
      });
      els.resetBtn.addEventListener("click", reset);
    }

    // ===== 主循环 =====
    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      let dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      dt = clamp(dt, 0, 0.05);
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    window.simulation = {
      init, start, pause, reset, update, render,
      setParameters, getState, getReadouts, runModelChecks
    };

    init();
  })();
  </script>
</body>
