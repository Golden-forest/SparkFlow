<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fibonacci Sphere · 斐波那契球面</title>
<style>
:root{
  color-scheme:dark;
  --sim-bg:#04060d;
  --sim-surface:#0a0e1a;
  --sim-surface-soft:#0e1322;
  --sim-text:#e8eefc;
  --sim-muted:#6b7a99;
  --sim-border:rgba(120,160,220,.10);
  --sim-grid:rgba(120,160,220,.06);
  --sim-accent:#5fb8d6;
  --sim-accent-deep:#2a7a96;
  --sim-accent-soft:rgba(95,184,214,.12);
  --sim-positive:#5fb8d6;
  --sim-warning:#e8a04c;
  --sim-danger:#e85c5c;
  --sim-radius-sm:10px;
  --sim-radius-md:16px;
  --sim-radius-lg:22px;
  --sim-shadow:0 14px 36px rgba(0,0,0,.5);
  --sim-space-1:4px;
  --sim-space-2:8px;
  --sim-space-3:12px;
  --sim-space-4:16px;
  --sim-space-5:24px;
  --sim-space-6:32px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden}
body{
  background:var(--sim-bg);
  color:var(--sim-text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{
  width:100vw;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.header{
  flex:0 0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
  padding:14px 24px;
  border-bottom:1px solid var(--sim-border);
  background:linear-gradient(to bottom,rgba(4,6,13,.96),rgba(4,6,13,.6) 60%,transparent);
}
.header h1{
  font-size:clamp(1.1rem,1.8vw,1.5rem);
  letter-spacing:-.02em;
  line-height:1.1;
  font-weight:700;
}
.header p{
  margin-top:3px;
  color:var(--sim-muted);
  font-size:.78rem;
  letter-spacing:.02em;
}
.status{
  border:1px solid rgba(95,184,214,.22);
  border-radius:999px;
  padding:7px 14px;
  background:var(--sim-accent-soft);
  color:var(--sim-accent);
  font-weight:700;
  font-size:.78rem;
  white-space:nowrap;
  letter-spacing:.04em;
}
.stage{
  flex:1 1 auto;
  min-height:0;
  position:relative;
  overflow:hidden;
}
#canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  cursor:grab;
  touch-action:none;
}
#canvas:active{cursor:grabbing}
.hint{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  color:var(--sim-muted);
  font-size:12px;
  letter-spacing:.08em;
  pointer-events:none;
  opacity:.55;
  white-space:nowrap;
  transition:opacity .6s ease;
}
.hint.fade{opacity:0}
.evidence{
  flex:0 0 auto;
  display:flex;
  gap:10px;
  padding:10px 24px;
  border-top:1px solid var(--sim-border);
  background:rgba(10,14,26,.7);
  backdrop-filter:blur(8px);
  flex-wrap:wrap;
  justify-content:center;
}
.metric{
  flex:0 1 auto;
  min-width:96px;
  padding:9px 14px;
  border:1px solid var(--sim-border);
  border-radius:12px;
  background:var(--sim-surface-soft);
}
.metric small{
  display:block;
  margin-bottom:3px;
  color:var(--sim-muted);
  font-size:9px;
  letter-spacing:.14em;
  text-transform:uppercase;
  font-weight:600;
}
.metric strong{
  font-size:1.05rem;
  letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;
  color:var(--sim-text);
}
.insight{
  flex:1 1 240px;
  max-width:520px;
  padding:9px 14px;
  border-left:3px solid var(--sim-warning);
  border-radius:0 10px 10px 0;
  background:rgba(232,160,76,.08);
  color:#f0c896;
  font-size:.78rem;
  line-height:1.5;
  font-weight:500;
  display:flex;
  align-items:center;
}
.controls{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:28px;
  padding:14px 24px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(4,6,13,.96),rgba(4,6,13,.6) 60%,transparent);
  border-top:1px solid var(--sim-border);
  flex-wrap:wrap;
}
.ctrl{display:flex;flex-direction:column;gap:6px;min-width:130px}
.ctrl label{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--sim-muted);
  font-weight:600;
}
.ctrl output{
  color:var(--sim-accent);
  font-variant-numeric:tabular-nums;
  font-size:11px;
  letter-spacing:.02em;
  text-transform:none;
}
input[type=range]{
  -webkit-appearance:none;
  appearance:none;
  width:100%;
  height:3px;
  background:rgba(120,160,220,.14);
  border-radius:2px;
  outline:none;
  cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--sim-accent);
  box-shadow:0 0 12px rgba(95,184,214,.5),0 0 0 3px rgba(95,184,214,.12);
  cursor:grab;
  transition:transform .15s;
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;border:none;
  background:var(--sim-accent);
  box-shadow:0 0 12px rgba(95,184,214,.5);
  cursor:grab;
}
input[type=range]:focus-visible{outline:2px solid rgba(95,184,214,.4);outline-offset:4px}
.actions{display:flex;gap:8px}
button{
  border:1px solid var(--sim-border);
  border-radius:999px;
  padding:8px 18px;
  color:var(--sim-muted);
  background:transparent;
  cursor:pointer;
  font-size:11px;
  font-weight:600;
  letter-spacing:.1em;
  text-transform:uppercase;
  transition:all .25s ease;
}
button:hover{color:var(--sim-text);border-color:rgba(120,160,220,.25)}
button:focus-visible{outline:2px solid rgba(95,184,214,.4);outline-offset:2px}
button.primary{
  border-color:var(--sim-accent-deep);
  color:#04060d;
  background:linear-gradient(135deg,var(--sim-accent),var(--sim-accent-deep));
  box-shadow:0 0 16px rgba(95,184,214,.3);
}
button.primary:hover{color:#04060d}
.modes{
  display:flex;
  gap:2px;
  padding:3px;
  background:rgba(120,160,220,.06);
  border-radius:999px;
  border:1px solid var(--sim-border);
}
.modes button{
  border:none;
  background:transparent;
  color:var(--sim-muted);
  padding:8px 18px;
  border-radius:999px;
  font-size:11px;
  font-weight:600;
  letter-spacing:.1em;
  text-transform:uppercase;
  cursor:pointer;
  transition:all .25s ease;
}
.modes button:hover{color:var(--sim-text)}
.modes button.active{
  background:var(--sim-accent);
  color:#04060d;
  box-shadow:0 0 16px rgba(95,184,214,.35);
}
.modes button:focus-visible{outline:2px solid rgba(95,184,214,.4);outline-offset:2px}
@media (max-width:640px){
  .header{padding:10px 14px;gap:10px}
  .header p{display:none}
  .controls{gap:14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .ctrl{min-width:90px}
  .modes button{padding:7px 12px;font-size:10px}
  .hint{font-size:10px}
  .evidence{padding:8px 14px;gap:8px}
  .metric{min-width:80px;padding:7px 10px}
  .metric strong{font-size:.95rem}
  .insight{font-size:.72rem;padding:7px 10px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app" data-layout="visualization-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>Fibonacci Sphere · 斐波那契球面</h1>
      <p>黄金角螺旋在球面上的均匀分布</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">Running</div>
  </header>

  <section class="stage" data-region="stage">
    <canvas id="canvas" role="img" aria-label="Fibonacci sphere point distribution"></canvas>
    <div class="hint" id="hint">拖拽旋转 · 滚轮缩放</div>
  </section>

  <aside class="evidence" data-region="evidence">
    <div class="metric"><small>点数</small><strong id="countReadout">2000</strong></div>
    <div class="metric"><small>时间</small><strong id="timeReadout">0.00 s</strong></div>
    <div class="metric"><small>缩放</small><strong id="zoomReadout">1.00×</strong></div>
    <div class="metric"><small>模式</small><strong id="modeReadout">点</strong></div>
    <div class="insight" data-region="insight" id="insight">斐波那契球面用黄金角螺旋将点均匀铺在球面上，无聚集、无空洞。</div>
  </aside>

  <section class="controls" data-region="controls" aria-label="参数控制">
    <div class="actions">
      <button id="startBtn" class="primary" type="button">Start</button>
      <button id="pauseBtn" type="button">Pause</button>
      <button id="resetBtn" type="button">Reset</button>
    </div>
    <div class="ctrl">
      <label>点数 <output id="countOut">2000</output></label>
      <input id="countInput" type="range" min="200" max="5000" step="100" value="2000" aria-label="点数">
    </div>
    <div class="ctrl">
      <label>呼吸幅度 <output id="breathOut">0.12</output></label>
      <input id="breathInput" type="range" min="0" max="0.30" step="0.01" value="0.12" aria-label="呼吸幅度">
    </div>
    <div class="ctrl">
      <label>旋转速度 <output id="rotOut">0.15</output></label>
      <input id="rotInput" type="range" min="0" max="0.80" step="0.01" value="0.15" aria-label="旋转速度">
    </div>
    <div class="modes" role="group" aria-label="渲染模式">
      <button type="button" data-mode="points" class="active">点</button>
      <button type="button" data-mode="particles">粒子</button>
      <button type="button" data-mode="network">连线</button>
    </div>
  </section>
</div>
<script>
(()=>{
'use strict';

const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));

const state = {
  count: 2000,
  breath: 0.12,
  rotSpeed: 0.15,
  mode: 'points',
  rotX: -0.32,
  rotY: 0,
  zoom: 1,
  t: 0,
  running: true,
  dragging: false,
  lastX: 0,
  lastY: 0,
  velX: 0,
  velY: 0,
  points: [],
  width: 0,
  height: 0,
  cx: 0,
  cy: 0,
  baseScale: 200,
  dpr: 1,
  lastTimestamp: null
};

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const els = {
  status: document.getElementById('status'),
  startBtn: document.getElementById('startBtn'),
  pauseBtn: document.getElementById('pauseBtn'),
  resetBtn: document.getElementById('resetBtn'),
  countInput: document.getElementById('countInput'),
  countOut: document.getElementById('countOut'),
  breathInput: document.getElementById('breathInput'),
  breathOut: document.getElementById('breathOut'),
  rotInput: document.getElementById('rotInput'),
  rotOut: document.getElementById('rotOut'),
  hint: document.getElementById('hint'),
  modeBtns: document.querySelectorAll('.modes button'),
  countReadout: document.getElementById('countReadout'),
  timeReadout: document.getElementById('timeReadout'),
  zoomReadout: document.getElementById('zoomReadout'),
  modeReadout: document.getElementById('modeReadout'),
  insight: document.getElementById('insight')
};

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function finite(v,fallback){return Number.isFinite(v)?v:fallback;}

function generatePoints(n){
  const pts = new Array(n);
  for(let i=0;i<n;i++){
    const y = 1 - (i/Math.max(1,n-1))*2;
    const r = Math.sqrt(Math.max(0,1-y*y));
    const theta = i * GOLDEN_ANGLE;
    pts[i] = {
      x: Math.cos(theta)*r,
      y: y,
      z: Math.sin(theta)*r
    };
  }
  state.points = pts;
}

function resize(){
  const rect = canvas.getBoundingClientRect();
  state.width = rect.width;
  state.height = rect.height;
  state.cx = state.width/2;
  state.cy = state.height/2;
  state.baseScale = Math.min(state.width, state.height) * 0.36;
  state.dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(state.width * state.dpr);
  canvas.height = Math.round(state.height * state.dpr);
  ctx.setTransform(state.dpr,0,0,state.dpr,0,0);
}

function project(p, scale){
  const cosX = Math.cos(state.rotX), sinX = Math.sin(state.rotX);
  const cosY = Math.cos(state.rotY), sinY = Math.sin(state.rotY);
  const x1 = p.x*cosY - p.z*sinY;
  const z1 = p.x*sinY + p.z*cosY;
  const y1 = p.y*cosX - z1*sinX;
  const z2 = p.y*sinX + z1*cosX;
  return {
    x: state.cx + x1*scale,
    y: state.cy - y1*scale,
    z: z2
  };
}

function render(){
  ctx.clearRect(0,0,state.width,state.height);
  
  const breath = 1 + state.breath * Math.sin(state.t * 1.2);
  const scale = state.baseScale * breath * state.zoom;
  const pts = state.points;
  const n = pts.length;
  
  const proj = new Array(n);
  for(let i=0;i<n;i++){
    proj[i] = project(pts[i], scale);
  }
  
  if(state.mode === 'points'){
    drawPoints(proj);
  } else if(state.mode === 'particles'){
    drawParticles(proj);
  } else if(state.mode === 'network'){
    drawNetwork(proj);
  }

  // 更新读数
  els.countReadout.textContent = state.count;
  els.timeReadout.textContent = state.t.toFixed(2) + ' s';
  els.zoomReadout.textContent = state.zoom.toFixed(2) + '×';
  const modeNames = {points:'点', particles:'粒子', network:'连线'};
  els.modeReadout.textContent = modeNames[state.mode] || state.mode;

  // 更新洞察
  const gap = Math.abs(state.breath * Math.sin(state.t * 1.2));
  if(!state.running){
    els.insight.textContent = '已暂停。拖拽可手动旋转球面，观察点分布的均匀性。';
  } else if(gap > 0.2){
    els.insight.textContent = '呼吸放大：半径缩放，但点的角位置不变，均匀拓扑保持。';
  } else {
    els.insight.textContent = '斐波那契球面用黄金角螺旋将点均匀铺在球面上，无聚集、无空洞。';
  }
}

function drawPoints(proj){
  const n = proj.length;
  for(let i=0;i<n;i++){
    const p = proj[i];
    const depth = (p.z + 1) * 0.5;
    const alpha = 0.25 + depth * 0.65;
    const size = 0.8 + depth * 1.8;
    ctx.fillStyle = `rgba(95,184,214,${alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawParticles(proj){
  const n = proj.length;
  ctx.globalCompositeOperation = 'lighter';
  for(let i=0;i<n;i++){
    const p = proj[i];
    const depth = (p.z + 1) * 0.5;
    const alpha = 0.08 + depth * 0.20;
    const size = 2 + depth * 5;
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size*2.5);
    grad.addColorStop(0, `rgba(120,200,230,${alpha})`);
    grad.addColorStop(0.4, `rgba(95,184,214,${alpha*0.5})`);
    grad.addColorStop(1, 'rgba(95,184,214,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size*2.5, 0, Math.PI*2);
    ctx.fill();
  }
  for(let i=0;i<n;i++){
    const p = proj[i];
    const depth = (p.z + 1) * 0.5;
    const alpha = 0.5 + depth * 0.5;
    const size = 0.8 + depth * 1.5;
    ctx.fillStyle = `rgba(200,230,245,${alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawNetwork(proj){
  const n = proj.length;
  const maxConnections = Math.min(n, 800);
  const threshold = 0.09;
  const thresholdSq = threshold * threshold;
  
  ctx.lineWidth = 0.5;
  ctx.globalCompositeOperation = 'lighter';
  
  for(let i=0;i<maxConnections;i++){
    const p1 = proj[i];
    const p1x = p1.x, p1y = p1.y, p1z = p1.z;
    let connections = 0;
    for(let j=i+1;j<n;j++){
      const p2 = proj[j];
      const dx = (p1x - p2.x) / state.baseScale;
      const dy = (p1y - p2.y) / state.baseScale;
      const dz = p1z - p2.z;
      const distSq = dx*dx + dy*dy + dz*dz;
      if(distSq < thresholdSq){
        const dist = Math.sqrt(distSq);
        const alpha = (1 - dist/threshold) * 0.22;
        const depth = ((p1z + p2.z) * 0.5 + 1) * 0.5;
        ctx.strokeStyle = `rgba(95,184,214,${alpha * (0.3 + depth*0.7)})`;
        ctx.beginPath();
        ctx.moveTo(p1x, p1y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
        connections++;
        if(connections > 8) break;
      }
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  
  for(let i=0;i<n;i++){
    const p = proj[i];
    const depth = (p.z + 1) * 0.5;
    const alpha = 0.4 + depth * 0.5;
    const size = 0.8 + depth * 1.2;
    ctx.fillStyle = `rgba(160,210,230,${alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI*2);
    ctx.fill();
  }
}

function update(dt){
  if(!state.running) return;
  const boundedDt = clamp(finite(dt, 0), 0, 0.05);
  state.t += boundedDt;
  if(!state.dragging){
    state.rotY += state.rotSpeed * boundedDt;
    state.rotY += state.velY * boundedDt;
    state.rotX += state.velX * boundedDt;
    state.velX *= 0.92;
    state.velY *= 0.92;
    state.rotX = clamp(state.rotX, -Math.PI/2 + 0.05, Math.PI/2 - 0.05);
  }
}

function start(){
  state.running = true;
  els.status.textContent = 'Running';
  els.startBtn.setAttribute('aria-pressed','true');
  els.pauseBtn.setAttribute('aria-pressed','false');
}
function pause(){
  state.running = false;
  els.status.textContent = 'Paused';
  els.startBtn.setAttribute('aria-pressed','false');
  els.pauseBtn.setAttribute('aria-pressed','true');
}
function reset(){
  pause();
  state.rotX = -0.32;
  state.rotY = 0;
  state.zoom = 1;
  state.t = 0;
  state.velX = 0;
  state.velY = 0;
  state.lastTimestamp = null;
  render();
}
function setParameters(values){
  if(values.count !== undefined){
    const c = parseInt(values.count);
    if(Number.isFinite(c)){
      state.count = clamp(c, 200, 5000);
      els.countInput.value = String(state.count);
      els.countOut.textContent = state.count;
      generatePoints(state.count);
    }
  }
  if(values.breath !== undefined){
    const b = parseFloat(values.breath);
    if(Number.isFinite(b)){
      state.breath = clamp(b, 0, 0.30);
      els.breathInput.value = String(state.breath);
      els.breathOut.textContent = state.breath.toFixed(2);
    }
  }
  if(values.rotSpeed !== undefined){
    const r = parseFloat(values.rotSpeed);
    if(Number.isFinite(r)){
      state.rotSpeed = clamp(r, 0, 0.80);
      els.rotInput.value = String(state.rotSpeed);
      els.rotOut.textContent = state.rotSpeed.toFixed(2);
    }
  }
  if(values.mode !== undefined){
    state.mode = values.mode;
    els.modeBtns.forEach(b => {
      b.classList.toggle('active', b.dataset.mode === state.mode);
    });
  }
}
function getState(){
  return {
    count: state.count,
    breath: state.breath,
    rotSpeed: state.rotSpeed,
    mode: state.mode,
    rotX: state.rotX,
    rotY: state.rotY,
    zoom: state.zoom,
    t: state.t,
    running: state.running,
    points: state.points.map(p=>({...p}))
  };
}
function getReadouts(){
  return {
    count: state.count,
    breath: state.breath,
    rotSpeed: state.rotSpeed,
    mode: state.mode,
    rotX: state.rotX,
    rotY: state.rotY,
    zoom: state.zoom,
    t: state.t,
    running: state.running
  };
}
function runModelChecks(){
  const checks = [];
  
  // 1. 所有点在单位球面上（|p| = 1）
  const testPts = new Array(1000);
  for(let i=0;i<1000;i++){
    const y = 1 - (i/999)*2;
    const r = Math.sqrt(Math.max(0,1-y*y));
    const theta = i * GOLDEN_ANGLE;
    testPts[i] = {
      x: Math.cos(theta)*r,
      y: y,
      z: Math.sin(theta)*r
    };
  }
  let allUnit = true;
  let maxDev = 0;
  for(const p of testPts){
    const d = Math.sqrt(p.x*p.x + p.y*p.y + p.z*p.z);
    const dev = Math.abs(d - 1);
    if(dev > 1e-10) allUnit = false;
    maxDev = Math.max(maxDev, dev);
  }
  checks.push({
    name: '所有点在单位球面上',
    pass: allUnit,
    expected: '|p| = 1 for all points',
    actual: `max deviation = ${maxDev.toExponential(3)}`,
    tolerance: '1e-10'
  });
  
  // 2. 黄金角精确性
  const ga = Math.PI * (3 - Math.sqrt(5));
  const expectedGa = 2.399963229728653;
  checks.push({
    name: '黄金角值正确',
    pass: Math.abs(ga - expectedGa) < 1e-12,
    expected: expectedGa,
    actual: ga,
    tolerance: '1e-12'
  });
  
  // 3. 点的Y坐标单调递减（从1到-1）
  let monotonic = true;
  for(let i=1;i<testPts.length;i++){
    if(testPts[i].y > testPts[i-1].y + 1e-10){
      monotonic = false;
      break;
    }
  }
  checks.push({
    name: 'Y坐标单调递减',
    pass: monotonic,
    expected: 'y[i] <= y[i-1]',
    actual: monotonic ? 'monotonic decreasing' : 'violation found',
    tolerance: 'strict'
  });
  
  // 4. 均匀分布检验：象限点数接近相等
  const n = testPts.length;
  let q1=0,q2=0,q3=0,q4=0,q5=0,q6=0,q7=0,q8=0;
  for(const p of testPts){
    if(p.x>=0 && p.y>=0 && p.z>=0) q1++;
    else if(p.x<0 && p.y>=0 && p.z>=0) q2++;
    else if(p.x<0 && p.y<0 && p.z>=0) q3++;
    else if(p.x>=0 && p.y<0 && p.z>=0) q4++;
    else if(p.x>=0 && p.y>=0 && p.z<0) q5++;
    else if(p.x<0 && p.y>=0 && p.z<0) q6++;
    else if(p.x<0 && p.y<0 && p.z<0) q7++;
    else q8++;
  }
  const expected = n/8;
  const maxDiff = Math.max(
    Math.abs(q1-expected),Math.abs(q2-expected),Math.abs(q3-expected),Math.abs(q4-expected),
    Math.abs(q5-expected),Math.abs(q6-expected),Math.abs(q7-expected),Math.abs(q8-expected)
  );
  checks.push({
    name: '八象限均匀分布',
    pass: maxDiff < expected * 0.15,
    expected: `each octant ≈ ${expected.toFixed(1)}`,
    actual: `[${q1},${q2},${q3},${q4},${q5},${q6},${q7},${q8}], max deviation = ${maxDiff.toFixed(1)}`,
    tolerance: '15%'
  });
  
  // 5. 呼吸对称性：呼吸不改变点在球面上的相对位置
  checks.push({
    name: '呼吸保持球面拓扑',
    pass: true,
    expected: 'breath scales radius, preserves angular positions',
    actual: 'scale = baseScale * (1 + breath * sin(t))',
    tolerance: 'by construction'
  });
  
  return checks;
}

function bindControls(){
  els.startBtn.addEventListener('click', start);
  els.pauseBtn.addEventListener('click', pause);
  els.resetBtn.addEventListener('click', reset);
  
  els.countInput.addEventListener('input', e => {
    setParameters({count: e.target.value});
  });
  els.breathInput.addEventListener('input', e => {
    setParameters({breath: e.target.value});
  });
  els.rotInput.addEventListener('input', e => {
    setParameters({rotSpeed: e.target.value});
  });
  
  els.modeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      setParameters({mode: btn.dataset.mode});
    });
  });
  
  canvas.addEventListener('pointerdown', e => {
    state.dragging = true;
    state.lastX = e.clientX;
    state.lastY = e.clientY;
    state.velX = 0;
    state.velY = 0;
    canvas.setPointerCapture(e.pointerId);
    els.hint.classList.add('fade');
  });
  canvas.addEventListener('pointermove', e => {
    if(!state.dragging) return;
    const dx = e.clientX - state.lastX;
    const dy = e.clientY - state.lastY;
    state.rotY += dx * 0.008;
    state.rotX += dy * 0.008;
    state.rotX = clamp(state.rotX, -Math.PI/2 + 0.05, Math.PI/2 - 0.05);
    state.velY = dx * 0.05;
    state.velX = dy * 0.05;
    state.lastX = e.clientX;
    state.lastY = e.clientY;
  });
  canvas.addEventListener('pointerup', () => {
    state.dragging = false;
  });
  canvas.addEventListener('pointercancel', () => {
    state.dragging = false;
  });
  
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    state.zoom = clamp(state.zoom * (1 - e.deltaY * 0.001), 0.4, 3);
  }, {passive: false});
  
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 100);
  });
  
  document.addEventListener('keydown', e => {
    if(e.key === ' '){
      e.preventDefault();
      if(state.running) pause(); else start();
    }
  });
  
  setTimeout(() => els.hint.classList.add('fade'), 5000);
}

function frame(timestamp){
  if(state.lastTimestamp === null) state.lastTimestamp = timestamp;
  const dt = (timestamp - state.lastTimestamp) / 1000;
  state.lastTimestamp = timestamp;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

function init(){
  resize();
  generatePoints(state.count);
  bindControls();
  els.startBtn.setAttribute('aria-pressed','true');
  els.pauseBtn.setAttribute('aria-pressed','false');
  requestAnimationFrame(frame);
}

window.simulation = {
  init,
  start,
  pause,
  reset,
  update,
  render,
  setParameters,
  getState,
  getReadouts,
  runModelChecks
};

init();
})();
</script>
