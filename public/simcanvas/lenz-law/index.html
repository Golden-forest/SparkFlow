<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电磁感应与楞次定律</title>
<style>
:root {
  color-scheme: light;
  --sim-bg: #eef3f8;
  --sim-surface: #ffffff;
  --sim-surface-soft: #f8fafc;
  --sim-text: #172033;
  --sim-muted: #657188;
  --sim-border: #dfe6ef;
  --sim-grid: #e8edf4;
  --sim-accent: #0f9fba;
  --sim-accent-deep: #08758a;
  --sim-accent-soft: #d9f4f7;
  --sim-positive: #0f9fba;
  --sim-warning: #d97706;
  --sim-danger: #dc2626;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
  --sim-n-pole: #dc2626;
  --sim-s-pole: #2563eb;
  --sim-current-cw: #dc2626;
  --sim-current-ccw: #2563eb;
  --sim-induced-field: #d97706;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-width: 320px; color: var(--sim-text);
  background:
    radial-gradient(circle at 12% 0%, rgba(15,159,186,.12), transparent 28%),
    radial-gradient(circle at 92% 4%, rgba(245,158,11,.10), transparent 26%),
    var(--sim-bg);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid rgba(37,99,235,.32); outline-offset: 2px; }
.app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0,1fr) auto; gap: 12px; overflow: hidden; }
.header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
.header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -.035em; line-height: 1; }
.header p { margin: 0; color: var(--sim-muted); font-size: .9rem; }
.status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
.main { min-height: 0; display: grid; grid-template-columns: minmax(0,1.72fr) minmax(300px,.72fr); gap: 12px; }
.panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
.scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0,1fr); overflow: hidden; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.panel-head h2 { margin: 0; font-size: 1rem; }
.panel-head span { color: var(--sim-muted); font-size: .75rem; }
#scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); touch-action: none; }
.side { min-height: 0; display: grid; grid-template-rows: auto minmax(0,1fr); gap: 12px; }
.readouts { padding: 17px; }
.readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.metric { padding: 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
.metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
.metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.galvanometer { padding: 16px; }
.galvanometer svg { width: 100%; height: auto; max-height: 150px; display: block; }
.charts-panel { padding: 14px; display: grid; grid-template-rows: auto auto minmax(0,1fr); gap: 10px; overflow: hidden; min-height: 0; }
.chart-block { display: grid; grid-template-rows: auto minmax(0,1fr); gap: 6px; min-height: 0; }
.chart-block h3 { margin: 0; font-size: .82rem; color: var(--sim-muted); font-weight: 700; }
.chart-block svg { width: 100%; height: 100%; min-height: 80px; display: block; }
.model-note { display: grid; align-content: start; gap: 14px; }
.model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: .88rem; }
.insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; }
.controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px,1fr) minmax(180px,1fr); gap: 16px; align-items: center; border-radius: 17px; }
.actions { display: flex; gap: 8px; }
button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
button:hover { border-color: #c7d2e2; background: #eef3f9; }
button:active { transform: scale(.97); }
button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,.45); }
.control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: .8rem; font-weight: 700; }
.control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
.mode-group { display: flex; gap: 4px; }
.mode-group button { padding: 7px 11px; font-size: .82rem; }
.mode-group button.active { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: .72rem; color: var(--sim-muted); }
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-swatch { width: 14px; height: 4px; border-radius: 2px; }
@media (max-width: 860px) {
  .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
  .main { grid-template-columns: 1fr; }
  .controls { grid-template-columns: 1fr; }
  .scene-panel { min-height: 0; }
  #scene { min-height: 0; height: auto; aspect-ratio: 760/420; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>电磁感应与楞次定律</h1>
      <p>拖动条形磁铁插入或拔出螺线管，观察感应电流方向如何阻碍磁通变化</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head">
        <h2 id="scene-title">螺线管与条形磁铁</h2>
        <span>拖动磁铁或切换自动模式</span>
      </div>
      <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
        <desc id="scene-desc">条形磁铁可拖入或拖出螺线管，感应电流方向以高亮箭头沿线圈流动，线圈感应磁场以橙色线条动态显示。</desc>
        <defs>
          <linearGradient id="magnetGrad" x1="0" x2="1">
            <stop offset="0%" stop-color="#dc2626"/>
            <stop offset="48%" stop-color="#dc2626"/>
            <stop offset="52%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#2563eb"/>
          </linearGradient>
          <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
          </marker>
          <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
          </marker>
          <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto">
            <path d="M0,0 L5,2.5 L0,5 Z" fill="#d97706"/>
          </marker>
        </defs>
        <g id="inducedFieldLines"></g>
        <g id="coilGroup"></g>
        <g id="currentArrows"></g>
        <g id="magnetGroup" style="cursor: grab;">
          <rect id="magnetHitArea" x="0" y="0" width="160" height="56" rx="8" fill="transparent"/>
          <rect id="magnetBody" x="0" y="0" width="160" height="56" rx="8" fill="url(#magnetGrad)" stroke="#1e293b" stroke-width="1.5"/>
          <text id="magnetN" x="40" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">N</text>
          <text id="magnetS" x="120" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">S</text>
        </g>
        <text x="20" y="25" font-size="11" fill="#657188" font-weight="600">拖动磁铁</text>
      </svg>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel galvanometer" aria-label="电流表">
        <div class="panel-head"><h2>电流表</h2><span>指针偏转方向 = 电流方向</span></div>
        <svg viewBox="0 0 280 150" role="img" aria-label="检流计">
          <path d="M 30 130 A 110 110 0 0 1 250 130" fill="none" stroke="#dfe6ef" stroke-width="6"/>
          <path d="M 30 130 A 110 110 0 0 1 140 20" fill="none" stroke="rgba(37,99,235,.15)" stroke-width="6"/>
          <path d="M 140 20 A 110 110 0 0 1 250 130" fill="none" stroke="rgba(220,38,38,.15)" stroke-width="6"/>
          <line x1="140" y1="130" x2="140" y2="35" stroke="#657188" stroke-width="2.5" stroke-linecap="round" id="galvNeedle"/>
          <circle cx="140" cy="130" r="6" fill="#172033"/>
          <text x="50" y="128" font-size="13" fill="#2563eb" font-weight="700">−</text>
          <text x="222" y="128" font-size="13" fill="#dc2626" font-weight="700">+</text>
          <text x="140" y="148" text-anchor="middle" font-size="10" fill="#657188">0</text>
        </svg>
      </section>

      <section class="panel readouts">
        <div class="readout-grid">
          <div class="metric"><small>磁通量 Φ</small><strong id="fluxReadout">0.00 mWb</strong></div>
          <div class="metric"><small>感应电流 I</small><strong id="currentReadout">0.00 mA</strong></div>
          <div class="metric"><small>磁铁位置</small><strong id="posReadout">0%</strong></div>
          <div class="metric"><small>磁铁速度</small><strong id="velReadout">0.00</strong></div>
        </div>
      </section>

      <section class="panel charts-panel">
        <div class="panel-head"><h2>对照曲线</h2><span>Φ 与 I 随时间</span></div>
        <div class="chart-block">
          <h3>磁通量 Φ — 时间</h3>
          <svg id="fluxChart" viewBox="0 0 300 90" preserveAspectRatio="none">
            <line x1="0" y1="45" x2="300" y2="45" stroke="#e8edf4" stroke-width="1" stroke-dasharray="3 3"/>
            <polyline id="fluxTrace" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="chart-block">
          <h3>感应电流 I — 时间</h3>
          <svg id="currentChart" viewBox="0 0 300 90" preserveAspectRatio="none">
            <line x1="0" y1="45" x2="300" y2="45" stroke="#e8edf4" stroke-width="1" stroke-dasharray="3 3"/>
            <polyline id="currentTrace" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="legend">
          <div class="legend-item"><div class="legend-swatch" style="background:#2563eb"></div>磁通 Φ</div>
          <div class="legend-item"><div class="legend-swatch" style="background:#dc2626"></div>电流 I</div>
          <div class="legend-item"><div class="legend-swatch" style="background:#d97706"></div>感应磁场</div>
        </div>
      </section>

      <section class="panel model-note" data-region="insight" style="padding: 17px;">
        <div class="panel-head"><h2>模型与洞察</h2></div>
        <p id="insight" class="insight">拖动磁铁穿过线圈，观察电流表指针偏转与箭头方向。</p>
        <p>教学视图：Φ = B·A_eff，EMF = −dΦ/dt，I = EMF/R。线圈感应磁场方向由右手定则确定，始终阻碍磁通变化。</p>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="控制台">
    <div class="actions">
      <button id="startBtn" class="primary" type="button">▶ 开始</button>
      <button id="pauseBtn" type="button">⏸ 暂停</button>
      <button id="resetBtn" type="button">↺ 重置</button>
    </div>
    <div class="control">
      <label>模式</label>
      <div class="mode-group">
        <button id="dragModeBtn" type="button" aria-pressed="true">拖动</button>
        <button id="autoModeBtn" type="button" aria-pressed="false">自动往复</button>
      </div>
    </div>
    <div class="control">
      <label for="speedInput">自动速度 <output id="speedOutput">1.0×</output></label>
      <input id="speedInput" type="range" min="0.3" max="2.5" step="0.1" value="1.0">
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  // 物理参数
  const COIL_CX = 430, COIL_CY = 210, COIL_HALF_W = 90, COIL_HALF_H = 55;
  const MAGNET_W = 160, MAGNET_H = 56;
  const N_TURNS = 8;
  const B0 = 1.0;        // 磁铁中心磁感应强度 (T, 教学单位)
  const R_COIL = 0.5;    // 电阻 (Ω, 教学单位)
  const L_COIL = 0.02;   // 电感 (H, 教学单位)
  const TRACK_X0 = 30, TRACK_X1 = 730;
  const TRACK_Y = 210;

  const state = {
    running: false,
    mode: "drag",
    autoSpeed: 1.0,
    magnetX: 100,
    magnetY: TRACK_Y,
    magnetVel: 0,
    lastTimestamp: null,
    t: 0,
    flux: 0,
    prevFlux: 0,
    emf: 0,
    current: 0,
    autoPhase: 0,
    autoDir: 1,
    history: [],
    dragging: false,
    dragOffsetX: 0
  };

  const $ = (id) => document.getElementById(id);
  const els = {
    status: $("status"), magnetGroup: $("magnetGroup"), magnetHitArea: $("magnetHitArea"),
    magnetBody: $("magnetBody"), magnetN: $("magnetN"), magnetS: $("magnetS"),
    coilGroup: $("coilGroup"), currentArrows: $("currentArrows"), inducedFieldLines: $("inducedFieldLines"),
    galvNeedle: $("galvNeedle"),
    fluxReadout: $("fluxReadout"), currentReadout: $("currentReadout"),
    posReadout: $("posReadout"), velReadout: $("velReadout"),
    fluxTrace: $("fluxTrace"), currentTrace: $("currentTrace"),
    insight: $("insight"),
    startBtn: $("startBtn"), pauseBtn: $("pauseBtn"), resetBtn: $("resetBtn"),
    dragModeBtn: $("dragModeBtn"), autoModeBtn: $("autoModeBtn"),
    speedInput: $("speedInput"), speedOutput: $("speedOutput"),
    scene: $("scene")
  };

  function clamp(v, mn, mx) { return Math.min(mx, Math.max(mn, v)); }
  function finite(v, fb) { return Number.isFinite(v) ? v : fb; }

  // 磁铁中心 x 在线圈坐标系中的位置
  function magnetCenterRel() {
    return state.magnetX + MAGNET_W / 2 - COIL_CX;
  }

  // 磁通量计算：N极朝右(+x)，磁铁中心相对线圈中心位置 xc
  // 线圈面积内穿过的磁通：磁铁内部磁场强，外部衰减
  function computeFlux(xc) {
    const half = MAGNET_W / 2;
    let phi = 0;
    if (xc <= -half) {
      // 磁铁完全在左，N极最右端距离线圈中心 = -xc - half
      const d = -xc - half;
      phi = B0 * 0.04 * Math.exp(-d / 45);
    } else if (xc >= half) {
      // 磁铁完全在右，S极最左端距离线圈中心 = xc - half
      const d = xc - half;
      phi = -B0 * 0.04 * Math.exp(-d / 45);
    } else {
      // 磁铁部分或完全在线圈内：线性过渡
      const frac = (xc + half) / (2 * half); // 0→1
      phi = B0 * 0.04 * (1 - 2 * frac);
    }
    return phi * N_TURNS;
  }

  function update(dt) {
    const boundedDt = clamp(finite(dt, 0), 0, 0.05);

    if (state.mode === "auto" && state.running) {
      state.autoPhase += boundedDt * state.autoSpeed * 0.9;
      const range = (TRACK_X1 - TRACK_X0 - MAGNET_W - 40);
      const center = (TRACK_X0 + TRACK_X1) / 2 - MAGNET_W / 2;
      state.magnetX = center + Math.sin(state.autoPhase) * range / 2;
      state.magnetY = TRACK_Y;
    }

    // 计算速度
    const xc = magnetCenterRel();
    const newFlux = computeFlux(xc);
    if (state.running && boundedDt > 0) {
      const dFlux = newFlux - state.flux;
      const dFluxDt = dFlux / boundedDt;
      state.magnetVel = dFlux / boundedDt;
      // EMF = -dΦ/dt, 电路方程: L * dI/dt + R * I = EMF
      const emf = -dFluxDt;
      state.emf = emf;
      // I(t+dt) = I(t) + dt * (EMF - R*I) / L
      state.current += boundedDt * (emf - R_COIL * state.current) / L_COIL;
      state.current = finite(state.current, 0);
      state.t += boundedDt;
    } else if (!state.running) {
      // 暂停时电流按指数衰减
      state.current *= Math.exp(-boundedDt * R_COIL / L_COIL);
      if (Math.abs(state.current) < 1e-6) state.current = 0;
    }

    state.prevFlux = state.flux;
    state.flux = newFlux;

    // 记录历史
    if (state.history.length === 0 || state.t - state.history[state.history.length - 1].t >= 0.05) {
      state.history.push({ t: state.t, flux: state.flux, current: state.current });
      if (state.history.length > 400) state.history.shift();
    }
  }

  function renderCoil() {
    const turns = N_TURNS;
    const spacing = (2 * COIL_HALF_W) / (turns - 1);
    let html = "";
    for (let i = 0; i < turns; i++) {
      const cx = COIL_CX - COIL_HALF_W + i * spacing;
      // 椭圆线圈截面
      html += `<ellipse cx="${cx}" cy="${COIL_CY}" rx="14" ry="${COIL_HALF_H}" fill="none" stroke="#94a3b8" stroke-width="2.5"/>`;
      // 顶部连接线
      if (i < turns - 1) {
        html += `<line x1="${cx}" y1="${COIL_CY - COIL_HALF_H}" x2="${cx + spacing}" y2="${COIL_CY - COIL_HALF_H}" stroke="#64748b" stroke-width="2"/>`;
      }
    }
    // 引出线
    html += `<line x1="${COIL_CX - COIL_HALF_W}" y1="${COIL_CY + COIL_HALF_H}" x2="${COIL_CX - COIL_HALF_W - 30}" y2="${COIL_CY + COIL_HALF_H + 20}" stroke="#64748b" stroke-width="2"/>`;
    html += `<line x1="${COIL_CX + COIL_HALF_W - spacing}" y1="${COIL_CY + COIL_HALF_H}" x2="${COIL_CX + COIL_HALF_W + 30}" y2="${COIL_CY + COIL_HALF_H + 20}" stroke="#64748b" stroke-width="2"/>`;
    // 标签
    html += `<text x="${COIL_CX}" y="${COIL_CY - COIL_HALF_H - 12}" text-anchor="middle" font-size="12" fill="#657188" font-weight="600">螺线管 (N=${N_TURNS})</text>`;
    els.coilGroup.innerHTML = html;
  }

  function renderCurrentArrows() {
    const I = state.current;
    const threshold = 0.05;
    if (Math.abs(I) < threshold) {
      els.currentArrows.innerHTML = "";
      return;
    }
    // I > 0: 顺时针(从右看)，箭头沿线圈顶部向右
    // I < 0: 逆时针，箭头沿线圈顶部向左
    const dir = I > 0 ? 1 : -1;
    const color = I > 0 ? "#dc2626" : "#2563eb";
    const intensity = clamp(Math.abs(I) / 2, 0.3, 1);
    const turns = N_TURNS;
    const spacing = (2 * COIL_HALF_W) / (turns - 1);
    let html = "";
    // 顶部箭头
    for (let i = 0; i < turns - 1; i++) {
      const cx = COIL_CX - COIL_HALF_W + i * spacing;
      const nx = COIL_CX - COIL_HALF_W + (i + 1) * spacing;
      const midX = (cx + nx) / 2;
      const y = COIL_CY - COIL_HALF_H + 2;
      const len = 8 * intensity;
      if (dir > 0) {
        html += `<line x1="${midX - len}" y1="${y}" x2="${midX + len}" y2="${y}" stroke="${color}" stroke-width="3" marker-end="url(#arrow${I > 0 ? 'Red' : 'Blue'})" opacity="${intensity}"/>`;
      } else {
        html += `<line x1="${midX + len}" y1="${y}" x2="${midX - len}" y2="${y}" stroke="${color}" stroke-width="3" marker-end="url(#arrow${I > 0 ? 'Red' : 'Blue'})" opacity="${intensity}"/>`;
      }
    }
    // 底部箭头（反方向）
    for (let i = 0; i < turns - 1; i++) {
      const cx = COIL_CX - COIL_HALF_W + i * spacing;
      const nx = COIL_CX - COIL_HALF_W + (i + 1) * spacing;
      const midX = (cx + nx) / 2;
      const y = COIL_CY + COIL_HALF_H - 2;
      const len = 8 * intensity;
      if (dir < 0) {
        html += `<line x1="${midX - len}" y1="${y}" x2="${midX + len}" y2="${y}" stroke="${color}" stroke-width="3" marker-end="url(#arrow${I > 0 ? 'Red' : 'Blue'})" opacity="${intensity}"/>`;
      } else {
        html += `<line x1="${midX + len}" y1="${y}" x2="${midX - len}" y2="${y}" stroke="${color}" stroke-width="3" marker-end="url(#arrow${I > 0 ? 'Red' : 'Blue'})" opacity="${intensity}"/>`;
      }
    }
    els.currentArrows.innerHTML = html;
  }

  function renderInducedField() {
    const I = state.current;
    const threshold = 0.05;
    if (Math.abs(I) < threshold) {
      els.inducedFieldLines.innerHTML = "";
      return;
    }
    // 感应磁场方向：阻碍磁通变化
    // dΦ/dt > 0 (磁通增大): 感应磁场与原磁场反向
    // dΦ/dt < 0 (磁通减小): 感应磁场与原磁场同向
    const dPhiDt = state.emf * -1; // emf = -dΦ/dt, so dΦ/dt = -emf
    const dir = dPhiDt > 0 ? -1 : 1; // -1: 向左(阻碍增大), +1: 向右(阻碍减小)
    const intensity = clamp(Math.abs(I) / 2, 0.3, 1);
    let html = "";
    // 画几条穿过线圈的感应磁场线
    const lines = [
      { y: COIL_CY - 30, x1: COIL_CX - 110, x2: COIL_CX + 110 },
      { y: COIL_CY, x1: COIL_CX - 120, x2: COIL_CX + 120 },
      { y: COIL_CY + 30, x1: COIL_CX - 110, x2: COIL_CX + 110 }
    ];
    for (const ln of lines) {
      const midX = COIL_CX;
      const len = 14 * intensity;
      if (dir > 0) {
        // 向右
        html += `<line x1="${midX - len}" y1="${ln.y}" x2="${midX + len}" y2="${ln.y}" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowOrange)" opacity="${intensity * 0.9}"/>`;
        html += `<line x1="${ln.x1}" y1="${ln.y}" x2="${ln.x2}" y2="${ln.y}" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 4" opacity="${intensity * 0.4}"/>`;
      } else {
        // 向左
        html += `<line x1="${midX + len}" y1="${ln.y}" x2="${midX - len}" y2="${ln.y}" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowOrange)" opacity="${intensity * 0.9}"/>`;
        html += `<line x1="${ln.x1}" y1="${ln.y}" x2="${ln.x2}" y2="${ln.y}" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 4" opacity="${intensity * 0.4}"/>`;
      }
    }
    // 标签
    const labelX = COIL_CX;
    const labelY = COIL_CY - COIL_HALF_H - 28;
    const labelText = dir > 0 ? "感应磁场 →" : "← 感应磁场";
    html += `<text x="${labelX}" y="${labelY}" text-anchor="middle" font-size="11" fill="#d97706" font-weight="700" opacity="${intensity}">${labelText}</text>`;
    els.inducedFieldLines.innerHTML = html;
  }

  function renderMagnet() {
    const x = state.magnetX;
    const y = state.magnetY - MAGNET_H / 2;
    els.magnetGroup.setAttribute("transform", `translate(${x - MAGNET_W/2 + MAGNET_W/2}, ${y})`);
    // 实际上 transform 是平移，需要设置 rect 的 x=0
    // 重新设置：magnetBody x=0, transform=translate(magnetX, magnetY - H/2)
    els.magnetGroup.setAttribute("transform", `translate(${state.magnetX}, ${state.magnetY - MAGNET_H / 2})`);
    els.magnetBody.setAttribute("x", "0");
    els.magnetBody.setAttribute("y", "0");
    els.magnetHitArea.setAttribute("x", "0");
    els.magnetHitArea.setAttribute("y", "0");
    els.magnetN.setAttribute("x", "40");
    els.magnetN.setAttribute("y", "36");
    els.magnetS.setAttribute("x", "120");
    els.magnetS.setAttribute("y", "36");
  }

  function renderGalvanometer() {
    const I = state.current;
    // 指针角度：I > 0 偏右(正), I < 0 偏左(负)
    const maxAngle = 50; // 度
    const angle = clamp(I * 25, -maxAngle, maxAngle);
    // 指针起点 (140, 130), 向上为 0 度
    const rad = (angle - 90) * Math.PI / 180;
    const len = 95;
    const x2 = 140 + Math.cos(rad) * len;
    const y2 = 130 + Math.sin(rad) * len;
    els.galvNeedle.setAttribute("x2", x2);
    els.galvNeedle.setAttribute("y2", y2);
    // 颜色
    if (Math.abs(I) < 0.05) {
      els.galvNeedle.setAttribute("stroke", "#657188");
    } else {
      els.galvNeedle.setAttribute("stroke", I > 0 ? "#dc2626" : "#2563eb");
    }
  }

  function renderCharts() {
    const maxT = Math.max(10, state.t);
    const fluxMax = 0.5;
    const currentMax = 2.5;
    const w = 300, h = 90, midY = 45;
    const fluxPts = state.history.map(s => {
      const x = (s.t / maxT) * w;
      const y = midY - (s.flux / fluxMax) * (midY - 5);
      return `${clamp(x,0,w)},${clamp(y,2,h-2)}`;
    }).join(" ");
    els.fluxTrace.setAttribute("points", fluxPts);
    const curPts = state.history.map(s => {
      const x = (s.t / maxT) * w;
      const y = midY - (s.current / currentMax) * (midY - 5);
      return `${clamp(x,0,w)},${clamp(y,2,h-2)}`;
    }).join(" ");
    els.currentTrace.setAttribute("points", curPts);
  }

  function renderInsight() {
    const dPhi = state.flux - state.prevFlux;
    const absI = Math.abs(state.current);
    let text = "";
    if (!state.running && state.t === 0) {
      text = "拖动磁铁穿过线圈，观察电流表指针偏转与箭头方向。";
    } else if (absI < 0.05) {
      text = "磁铁静止或磁通不变：无感应电流，指针归零。";
    } else if (dPhi > 0.001) {
      text = "磁通增大 → 感应电流产生反向磁场，阻碍磁通增加（楞次定律）。";
    } else if (dPhi < -0.001) {
      text = "磁通减小 → 感应电流产生同向磁场，阻碍磁通减小（楞次定律）。";
    } else {
      text = "磁通变化中：电流方向由 dΦ/dt 的符号决定，始终阻碍变化。";
    }
    els.insight.textContent = text;
  }

  function render() {
    renderMagnet();
    renderCoil();
    renderCurrentArrows();
    renderInducedField();
    renderGalvanometer();
    renderCharts();
    renderInsight();

    els.fluxReadout.textContent = `${(state.flux * 1000).toFixed(2)} mWb`;
    els.currentReadout.textContent = `${(state.current * 1000).toFixed(1)} mA`;
    const posPct = Math.round((state.magnetX - TRACK_X0) / (TRACK_X1 - TRACK_X0) * 100);
    els.posReadout.textContent = `${posPct}%`;
    els.velReadout.textContent = `${state.magnetVel.toFixed(2)}`;
    els.speedOutput.textContent = `${state.autoSpeed.toFixed(1)}×`;
  }

  function start() {
    state.running = true;
    els.status.textContent = "运行中";
    els.startBtn.setAttribute("aria-pressed", "true");
  }
  function pause() {
    state.running = false;
    els.status.textContent = "已暂停";
    els.startBtn.setAttribute("aria-pressed", "false");
  }
  function reset() {
    pause();
    state.t = 0;
    state.magnetX = 100;
    state.magnetY = TRACK_Y;
    state.magnetVel = 0;
    state.flux = computeFlux(magnetCenterRel());
    state.prevFlux = state.flux;
    state.emf = 0;
    state.current = 0;
    state.autoPhase = 0;
    state.history = [{ t: 0, flux: state.flux, current: 0 }];
    state.lastTimestamp = null;
    render();
  }

  function setMode(m) {
    state.mode = m;
    if (m === "drag") {
      els.dragModeBtn.setAttribute("aria-pressed", "true");
      els.autoModeBtn.setAttribute("aria-pressed", "false");
      els.dragModeBtn.classList.add("active");
      els.autoModeBtn.classList.remove("active");
    } else {
      els.dragModeBtn.setAttribute("aria-pressed", "false");
      els.autoModeBtn.setAttribute("aria-pressed", "true");
      els.dragModeBtn.classList.remove("active");
      els.autoModeBtn.classList.add("active");
    }
  }

  function getSVGPoint(evt) {
    const pt = els.scene.createSVGPoint();
    pt.x = evt.clientX;
    pt.y = evt.clientY;
    return pt.matrixTransform(els.scene.getScreenCTM().inverse());
  }

  function bindControls() {
    els.startBtn.addEventListener("click", start);
    els.pauseBtn.addEventListener("click", pause);
    els.resetBtn.addEventListener("click", reset);
    els.dragModeBtn.addEventListener("click", () => setMode("drag"));
    els.autoModeBtn.addEventListener("click", () => setMode("auto"));
    els.speedInput.addEventListener("input", () => {
      state.autoSpeed = clamp(finite(Number(els.speedInput.value), 1.0), 0.3, 2.5);
      render();
    });

    // 拖拽
    els.magnetGroup.addEventListener("pointerdown", (e) => {
      if (state.mode !== "drag") return;
      state.dragging = true;
      state.dragOffsetX = 0;
      els.magnetGroup.style.cursor = "grabbing";
      e.preventDefault();
    });
    window.addEventListener("pointermove", (e) => {
      if (!state.dragging) return;
      const pt = getSVGPoint(e);
      state.magnetX = clamp(pt.x, TRACK_X0, TRACK_X1 - MAGNET_W);
      state.magnetY = TRACK_Y;
    });
    window.addEventListener("pointerup", () => {
      if (state.dragging) {
        state.dragging = false;
        els.magnetGroup.style.cursor = "grab";
      }
    });

    // 触摸
    els.magnetGroup.addEventListener("touchstart", (e) => {
      if (state.mode !== "drag") return;
      state.dragging = true;
      e.preventDefault();
    }, { passive: false });
    els.scene.addEventListener("touchmove", (e) => {
      if (!state.dragging) return;
      const touch = e.touches[0];
      const pt = getSVGPoint(touch);
      state.magnetX = clamp(pt.x, TRACK_X0, TRACK_X1 - MAGNET_W);
      state.magnetY = TRACK_Y;
      e.preventDefault();
    }, { passive: false });
    els.scene.addEventListener("touchend", () => {
      state.dragging = false;
    });
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  function runModelChecks() {
    // 检查1：磁铁静止时电流衰减到零
    const sim1 = (dt, dur) => {
      let I = 1.0, flux = 0.5;
      let prevFlux = flux;
      for (let t = 0; t < dur; t += dt) {
        const dFlux = flux - prevFlux;
        const dFluxDt = dFlux / dt;
        const emf = -dFluxDt;
        I += dt * (emf - R_COIL * I) / L_COIL;
        prevFlux = flux;
      }
      return I;
    };
    const staticCurrent = sim1(1/240, 2);

    // 检查2：磁通增大时感应电流为负（阻碍增加）
    // 磁通从0增到0.4，dΦ/dt > 0, EMF < 0, I < 0
    const sim2 = (dt, dur) => {
      let I = 0;
      for (let t = 0; t < dur; t += dt) {
        const flux = 0.4 * t / dur; // 线性增加
        const dFlux = 0.4 * dt / dur;
        const dFluxDt = dFlux / dt;
        const emf = -dFluxDt;
        I += dt * (emf - R_COIL * I) / L_COIL;
      }
      return I;
    };
    const increasingFluxCurrent = sim2(1/240, 1);

    // 检查3：磁通减小时感应电流为正（阻碍减小）
    const sim3 = (dt, dur) => {
      let I = 0;
      for (let t = 0; t < dur; t += dt) {
        const flux = 0.4 * (1 - t / dur);
        const dFlux = -0.4 * dt / dur;
        const dFluxDt = dFlux / dt;
        const emf = -dFluxDt;
        I += dt * (emf - R_COIL * I) / L_COIL;
      }
      return I;
    };
    const decreasingFluxCurrent = sim3(1/240, 1);

    // 检查4：磁通对称性
    const fluxLeft = computeFlux(-100);
    const fluxRight = computeFlux(100);
    const symmetry = Math.abs(fluxLeft + fluxRight) < 0.01;

    // 检查5：磁铁在线圈中心时磁通接近零（过渡点）
    const fluxCenter = computeFlux(0);

    return [
      { name: "静止时电流衰减", pass: Math.abs(staticCurrent) < 0.01, expected: "≈0", actual: staticCurrent, tolerance: 0.01 },
      { name: "磁通增大→电流为负(阻碍)", pass: increasingFluxCurrent < -0.1, expected: "I < 0", actual: increasingFluxCurrent, tolerance: "sign" },
      { name: "磁通减小→电流为正(阻碍)", pass: decreasingFluxCurrent > 0.1, expected: "I > 0", actual: decreasingFluxCurrent, tolerance: "sign" },
      { name: "磁通左右对称", pass: symmetry, expected: "Φ(-x) = -Φ(x)", actual: `${fluxLeft} vs ${fluxRight}`, tolerance: 0.01 },
      { name: "中心磁通≈0", pass: Math.abs(fluxCenter) < 0.05, expected: "≈0", actual: fluxCenter, tolerance: 0.05 }
    ];
  }

  function init() {
    bindControls();
    setMode("drag");
    reset();
    requestAnimationFrame(frame);
  }

  function getState() {
    return {
      running: state.running,
      mode: state.mode,
      autoSpeed: state.autoSpeed,
      magnetX: state.magnetX,
      magnetY: state.magnetY,
      magnetVel: state.magnetVel,
      t: state.t,
      flux: state.flux,
      prevFlux: state.prevFlux,
      emf: state.emf,
      current: state.current,
      autoPhase: state.autoPhase,
      autoDir: state.autoDir,
      history: state.history.map((s) => ({ ...s })),
      dragging: state.dragging,
      dragOffsetX: state.dragOffsetX
    };
  }

  function getReadouts() {
    return {
      flux: state.flux,
      current: state.current,
      emf: state.emf,
      time: state.t,
      magnetPosition: state.magnetX,
      magnetVelocity: state.magnetVel,
      autoSpeed: state.autoSpeed,
      mode: state.mode,
      running: state.running
    };
  }

  function setParameters(values) {
    if (values && typeof values === "object") {
      if (values.autoSpeed !== undefined) {
        state.autoSpeed = clamp(finite(Number(values.autoSpeed), 1.0), 0.3, 2.5);
        els.speedInput.value = String(state.autoSpeed);
      }
      if (values.mode !== undefined) {
        setMode(values.mode);
      }
    }
    render();
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
