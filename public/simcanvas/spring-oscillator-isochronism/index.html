<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>弹簧振子等时性演示</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #f4f7fb;
      --sim-surface: #ffffff;
      --sim-surface-soft: #f8fafc;
      --sim-text: #172033;
      --sim-muted: #657188;
      --sim-border: #dfe6ef;
      --sim-grid: #e8edf4;
      --sim-accent: #0f9fba;
      --sim-accent-deep: #08758a;
      --sim-accent-soft: #d9f4f7;
      --sim-positive: #0f9fba;
      --sim-warning: #d97706;
      --sim-danger: #dc2626;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 14px 36px rgba(28, 43, 70, 0.09);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;

      /* Subject-specific semantic tokens */
      --sim-osc-a: #ef4444;
      --sim-osc-b: #0ea5e9;
      --sim-stage-bg: #1e293b;
      --sim-stage-grid: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background: var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--sim-accent); outline-offset: 2px; }

    .app {
      width: min(1400px, 100%);
      height: 100vh;
      margin: 0 auto;
      padding: var(--sim-space-4) var(--sim-space-5);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: var(--sim-space-4);
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--sim-space-4);
      min-height: 56px;
    }
    .header h1 { margin: 0 0 4px; font-size: clamp(1.4rem, 2.2vw, 1.9rem); letter-spacing: -0.03em; line-height: 1.1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.95rem; }
    .status {
      border: 1px solid rgba(15,159,186,.2);
      border-radius: 999px;
      padding: 8px 16px;
      background: var(--sim-accent-soft);
      color: var(--sim-accent-deep);
      font-weight: 700;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    /* Main Layout */
    .main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(320px, 0.8fr);
      gap: var(--sim-space-4);
    }

    .panel {
      background: var(--sim-surface);
      border: 1px solid var(--sim-border);
      border-radius: var(--sim-radius-lg);
      box-shadow: var(--sim-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Stage (Dark Theme for Contrast) */
    .stage-panel {
      background: var(--sim-stage-bg);
      border-color: rgba(255,255,255,0.05);
      position: relative;
      min-height: 380px;
    }
    .stage-head {
      padding: var(--sim-space-3) var(--sim-space-4);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .stage-head h2 { margin: 0; color: #fff; font-size: 1rem; opacity: 0.9; }
    .stage-head span { color: rgba(255,255,255,0.5); font-size: 0.75rem; }
    
    #scene {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Evidence Side */
    .side {
      display: grid;
      grid-template-rows: minmax(200px, 1fr) auto auto;
      gap: var(--sim-space-4);
      min-height: 0;
    }

    .chart-panel {
      position: relative;
      min-height: 200px;
    }
    #chart { width: 100%; height: 100%; display: block; }

    .readouts { padding: var(--sim-space-4); }
    .readout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sim-space-3); }
    .metric {
      padding: var(--sim-space-3);
      background: var(--sim-surface-soft);
      border-radius: var(--sim-radius-sm);
      border: 1px solid var(--sim-border);
    }
    .metric small { display: block; color: var(--sim-muted); font-size: 0.75rem; margin-bottom: 2px; }
    .metric strong { font-size: 1.2rem; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .metric.sync-ok { border-color: var(--sim-positive); background: rgba(15, 159, 186, 0.08); }
    .metric.sync-ok strong { color: var(--sim-accent-deep); }

    .insight-box {
      padding: var(--sim-space-4);
      background: #fffbeb;
      border-left: 4px solid var(--sim-warning);
      color: #92400e;
      font-size: 0.9rem;
      line-height: 1.5;
      font-weight: 500;
    }

    /* Controls */
    .controls {
      padding: var(--sim-space-4) var(--sim-space-5);
      display: grid;
      grid-template-columns: auto 1fr 1fr;
      gap: var(--sim-space-6);
      align-items: center;
    }
    .actions { display: flex; gap: var(--sim-space-2); }
    
    button {
      border: 1px solid var(--sim-border);
      border-radius: var(--sim-radius-sm);
      padding: 10px 16px;
      background: var(--sim-surface);
      color: var(--sim-text);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover { background: var(--sim-surface-soft); border-color: #cbd5e1; }
    button:active { transform: scale(0.97); }
    button.primary {
      background: var(--sim-accent);
      border-color: var(--sim-accent);
      color: white;
      box-shadow: 0 4px 12px rgba(15, 159, 186, 0.25);
    }
    button.primary:hover { background: var(--sim-accent-deep); }

    .control-group { display: grid; gap: var(--sim-space-2); }
    .control-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 600; color: var(--sim-muted); }
    .control-row output { color: var(--sim-text); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); cursor: pointer; }
    
    /* Color coding controls */
    .ctrl-a input[type="range"] { accent-color: var(--sim-osc-a); }
    .ctrl-b input[type="range"] { accent-color: var(--sim-osc-b); }

    @media (max-width: 900px) {
      .app { height: auto; min-height: 100vh; overflow: visible; }
      .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; gap: var(--sim-space-4); }
      .stage-panel { min-height: 320px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <div class="app" data-layout="scene-first" data-execution-mode="continuous" data-model-tier="analytic">
    
    <header class="header" data-region="header">
      <div>
        <h1>弹簧振子等时性演示</h1>
        <p>验证周期 T 与振幅 A 无关：双振子同步对比实验</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
    </header>

    <main class="main">
      <!-- STAGE: Visual Simulation -->
      <section class="panel stage-panel" data-region="stage" aria-labelledby="stage-title">
        <div class="stage-head">
          <h2 id="stage-title">双振子运动对比</h2>
          <span>解析解驱动 · 零相位漂移</span>
        </div>
        <svg id="scene" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet">
          <defs>
            <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--sim-stage-grid)" stroke-width="1"/>
            </pattern>
            <filter id="glowA" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
            <filter id="glowB" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
          </defs>
          
          <!-- Background Grid -->
          <rect width="100%" height="100%" fill="url(#gridPattern)" />
          
          <!-- Center Equilibrium Line -->
          <line x1="400" y1="40" x2="400" y2="360" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="6 4" />
          <text x="400" y="385" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-size="12">平衡位置 x=0</text>

          <!-- Oscillator A Group -->
          <g id="groupA" transform="translate(0, 120)">
            <text x="40" y="-15" fill="var(--sim-osc-a)" font-weight="bold" font-size="14">振子 A (小振幅)</text>
            <!-- Wall -->
            <rect x="30" y="-20" width="10" height="40" fill="#64748b" rx="2" />
            <!-- Spring Path -->
            <path id="springA" d="" fill="none" stroke="var(--sim-osc-a)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
            <!-- Mass -->
            <circle id="massA" cx="400" cy="0" r="18" fill="var(--sim-osc-a)" filter="url(#glowA)" />
            <!-- Trail -->
            <line id="trailA" x1="400" y1="25" x2="400" y2="25" stroke="var(--sim-osc-a)" stroke-width="2" opacity="0.3" />
          </g>

          <!-- Oscillator B Group -->
          <g id="groupB" transform="translate(0, 280)">
            <text x="40" y="-15" fill="var(--sim-osc-b)" font-weight="bold" font-size="14">振子 B (大振幅)</text>
            <!-- Wall -->
            <rect x="30" y="-20" width="10" height="40" fill="#64748b" rx="2" />
            <!-- Spring Path -->
            <path id="springB" d="" fill="none" stroke="var(--sim-osc-b)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
            <!-- Mass -->
            <circle id="massB" cx="400" cy="0" r="18" fill="var(--sim-osc-b)" filter="url(#glowB)" />
             <!-- Trail -->
             <line id="trailB" x1="400" y1="25" x2="400" y2="25" stroke="var(--sim-osc-b)" stroke-width="2" opacity="0.3" />
          </g>
        </svg>
      </section>

      <!-- EVIDENCE: Chart & Readouts -->
      <aside class="side" data-region="evidence">
        <section class="panel chart-panel" aria-label="位移时间曲线">
          <canvas id="chart"></canvas>
        </section>

        <section class="panel readouts">
          <div class="readout-grid">
            <div class="metric">
              <small>理论周期 T</small>
              <strong id="valT">1.40 s</strong>
            </div>
            <div class="metric sync-ok">
              <small>同步状态</small>
              <strong id="valSync">✓ 完美同步</strong>
            </div>
            <div class="metric">
              <small>当前时间 t</small>
              <strong id="valTime">0.00 s</strong>
            </div>
            <div class="metric">
              <small>角频率 ω</small>
              <strong id="valOmega">4.47 rad/s</strong>
            </div>
          </div>
        </section>

        <div class="insight-box" data-region="insight" id="insightText">
          准备就绪。点击“开始”释放两个振子。注意观察：尽管蓝色振子移动距离更长，但它与红色振子始终同时经过中心点。
        </div>
      </aside>
    </main>

    <!-- CONTROLS -->
    <section class="panel controls" data-region="controls" aria-label="控制面板">
      <div class="actions">
        <button id="btnStart" class="primary" type="button">开始</button>
        <button id="btnPause" type="button">暂停</button>
        <button id="btnReset" type="button">重置</button>
      </div>

      <div class="control-group">
        <div class="control-row ctrl-a">
          <label for="inAmpA">振幅 A (红)</label>
          <output id="outAmpA">3.0 cm</output>
        </div>
        <input id="inAmpA" type="range" min="1" max="8" step="0.5" value="3">
        
        <div class="control-row ctrl-b" style="margin-top:8px;">
          <label for="inAmpB">振幅 B (蓝)</label>
          <output id="outAmpB">6.0 cm</output>
        </div>
        <input id="inAmpB" type="range" min="1" max="8" step="0.5" value="6">
      </div>

      <div class="control-group">
        <div class="control-row">
          <label for="inK">劲度系数 k</label>
          <output id="outK">10.0 N/m</output>
        </div>
        <input id="inK" type="range" min="2" max="30" step="1" value="10">

        <div class="control-row" style="margin-top:8px;">
          <label for="inM">质量 m</label>
          <output id="outM">0.5 kg</output>
        </div>
        <input id="inM" type="range" min="0.1" max="2.0" step="0.1" value="0.5">
      </div>
    </section>
  </div>

  <script>
    "use strict";

    // --- Model Constants & State ---
    const SCALE_PX_PER_CM = 35; // Visual scaling factor
    const WALL_X = 40;
    const EQ_X = 400; // Equilibrium position in SVG pixels
    
    const state = {
      running: false,
      t: 0,
      lastTimestamp: null,
      
      // Physical Parameters
      k: 10.0,   // N/m
      m: 0.5,    // kg
      ampA: 3.0, // cm
      ampB: 6.0, // cm
      
      // Derived
      omega: 0,  // rad/s
      period: 0, // s
      
      // History for chart (rolling window)
      history: [], 
      maxHistoryTime: 6.0 // seconds to show on chart
    };

    // --- DOM Elements Cache ---
    const el = {
      status: document.getElementById("status"),
      insight: document.getElementById("insightText"),
      
      // Scene
      springA: document.getElementById("springA"),
      massA: document.getElementById("massA"),
      trailA: document.getElementById("trailA"),
      springB: document.getElementById("springB"),
      massB: document.getElementById("massB"),
      trailB: document.getElementById("trailB"),
      
      // Chart
      canvas: document.getElementById("chart"),
      ctx: document.getElementById("chart").getContext("2d"),
      
      // Readouts
      valT: document.getElementById("valT"),
      valSync: document.getElementById("valSync"),
      valTime: document.getElementById("valTime"),
      valOmega: document.getElementById("valOmega"),
      
      // Controls
      btnStart: document.getElementById("btnStart"),
      btnPause: document.getElementById("btnPause"),
      btnReset: document.getElementById("btnReset"),
      inAmpA: document.getElementById("inAmpA"),
      outAmpA: document.getElementById("outAmpA"),
      inAmpB: document.getElementById("inAmpB"),
      outAmpB: document.getElementById("outAmpB"),
      inK: document.getElementById("inK"),
      outK: document.getElementById("outK"),
      inM: document.getElementById("inM"),
      outM: document.getElementById("outM")
    };

    // --- Core Functions ---

    function init() {
      bindControls();
      resizeChart();
      window.addEventListener("resize", resizeChart);
      setParameters({ k: 10, m: 0.5, ampA: 3, ampB: 6 });
      reset();
      requestAnimationFrame(frame);
    }

    function start() {
      if (!state.running) {
        state.running = true;
        state.lastTimestamp = null; // Reset delta calc
        el.status.textContent = "运行中";
        el.btnStart.setAttribute("aria-pressed", "true");
        el.insight.textContent = "观察：两条曲线峰值不同，但过零点严格对齐。这就是等时性——周期仅由 k 和 m 决定。";
      }
    }

    function pause() {
      state.running = false;
      el.status.textContent = "已暂停";
      el.btnStart.setAttribute("aria-pressed", "false");
    }

    function reset() {
      pause();
      state.t = 0;
      state.history = [];
      state.lastTimestamp = null;
      el.insight.textContent = "已重置。调整振幅后再次点击“开始”，验证无论拉多远，周期都不变。";
      render();
    }

    function update(dt) {
      if (!state.running) return;
      
      // Clamp dt to avoid spiral of death on tab switch
      const safeDt = Math.min(dt, 0.1);
      state.t += safeDt;
      
      // Analytic Solution: x(t) = A * cos(omega * t)
      // We sample history at ~60Hz or when significant change occurs
      const sampleInterval = 0.016; 
      const lastSample = state.history[state.history.length - 1];
      
      if (!lastSample || (state.t - lastSample.t >= sampleInterval)) {
        const posA = state.ampA * Math.cos(state.omega * state.t);
        const posB = state.ampB * Math.cos(state.omega * state.t);
        
        state.history.push({ t: state.t, a: posA, b: posB });
        
        // Trim history
        while (state.history.length > 0 && state.history[0].t < state.t - state.maxHistoryTime) {
          state.history.shift();
        }
      }
    }

    function render() {
      // 1. Calculate current positions analytically
      const cosVal = Math.cos(state.omega * state.t);
      const posA_cm = state.ampA * cosVal;
      const posB_cm = state.ampB * cosVal;
      
      // Convert to pixels
      const posA_px = EQ_X + posA_cm * SCALE_PX_PER_CM;
      const posB_px = EQ_X + posB_cm * SCALE_PX_PER_CM;
      
      // 2. Update Scene Visuals
      updateOscillator(el.massA, el.springA, el.trailA, posA_px, state.ampA);
      updateOscillator(el.massB, el.springB, el.trailB, posB_px, state.ampB);
      
      // 3. Update Chart
      drawChart();
      
      // 4. Update Readouts
      el.valTime.textContent = state.t.toFixed(2) + " s";
      el.valT.textContent = state.period.toFixed(3) + " s";
      el.valOmega.textContent = state.omega.toFixed(2) + " rad/s";
      
      // Sync check (always true in analytic model, but good for pedagogy)
      el.valSync.textContent = "✓ 完美同步";
    }

    function updateOscillator(massEl, springEl, trailEl, posX, amplitudeCm) {
      // Move Mass
      massEl.setAttribute("cx", posX);
      
      // Draw Spring (Zigzag)
      const startX = WALL_X + 10;
      const endX = posX - 18; // Stop at mass edge
      const coils = 12;
      const width = endX - startX;
      const coilWidth = width / coils;
      const ampSpring = 12; // Visual height of zigzag
      
      let d = `M ${startX} 0`;
      for (let i = 0; i < coils; i++) {
        const x1 = startX + i * coilWidth + coilWidth * 0.25;
        const x2 = startX + i * coilWidth + coilWidth * 0.75;
        const dir = (i % 2 === 0) ? -1 : 1;
        d += ` L ${x1} ${dir * ampSpring} L ${x2} ${-dir * ampSpring}`;
      }
      d += ` L ${endX} 0`;
      springEl.setAttribute("d", d);
      
      // Update Amplitude Marker (Trail line showing max extent)
      const maxPx = EQ_X + amplitudeCm * SCALE_PX_PER_CM;
      const minPx = EQ_X - amplitudeCm * SCALE_PX_PER_CM;
      trailEl.setAttribute("x1", minPx);
      trailEl.setAttribute("x2", maxPx);
    }

    function drawChart() {
      const ctx = el.ctx;
      const w = el.canvas.width;
      const h = el.canvas.height;
      const pad = 30;
      const plotW = w - pad * 2;
      const plotH = h - pad * 2;
      
      ctx.clearRect(0, 0, w, h);
      
      // Grid & Axes
      ctx.strokeStyle = "#e2e8f0";
      ctx.lineWidth = 1;
      ctx.beginPath();
      // Zero line
      const zeroY = pad + plotH / 2;
      ctx.moveTo(pad, zeroY);
      ctx.lineTo(w - pad, zeroY);
      ctx.stroke();
      
      // Labels
      ctx.fillStyle = "#64748b";
      ctx.font = "11px system-ui";
      ctx.textAlign = "right";
      ctx.fillText("x=0", pad - 5, zeroY + 4);
      ctx.fillText("t", w - pad, h - 5);
      
      if (state.history.length < 2) return;
      
      // Time scaling
      const tEnd = state.history[state.history.length - 1].t;
      const tStart = Math.max(0, tEnd - state.maxHistoryTime);
      const timeRange = state.maxHistoryTime;
      
      // Position scaling (fixed to max possible amplitude 8cm + margin)
      const maxPos = 9.0; 
      
      const mapX = (t) => pad + ((t - tStart) / timeRange) * plotW;
      const mapY = (x) => zeroY - (x / maxPos) * (plotH / 2);
      
      // Draw Trace A (Red)
      ctx.beginPath();
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--sim-osc-a').trim();
      ctx.lineWidth = 2.5;
      let first = true;
      for (const pt of state.history) {
        if (pt.t < tStart) continue;
        const px = mapX(pt.t);
        const py = mapY(pt.a);
        if (first) { ctx.moveTo(px, py); first = false; }
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
      
      // Draw Trace B (Blue)
      ctx.beginPath();
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--sim-osc-b').trim();
      ctx.lineWidth = 2.5;
      ctx.setLineDash([5, 3]); // Dashed to distinguish overlap
      first = true;
      for (const pt of state.history) {
        if (pt.t < tStart) continue;
        const px = mapX(pt.t);
        const py = mapY(pt.b);
        if (first) { ctx.moveTo(px, py); first = false; }
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      
      // Current Point Markers
      const last = state.history[state.history.length - 1];
      const curX = mapX(last.t);
      
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--sim-osc-a').trim();
      ctx.beginPath(); ctx.arc(curX, mapY(last.a), 4, 0, Math.PI*2); ctx.fill();
      
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--sim-osc-b').trim();
      ctx.beginPath(); ctx.arc(curX, mapY(last.b), 4, 0, Math.PI*2); ctx.fill();
    }

    function setParameters(values) {
      let changed = false;
      
      if (values.k !== undefined) {
        state.k = parseFloat(values.k);
        el.inK.value = state.k;
        el.outK.textContent = state.k.toFixed(1) + " N/m";
        changed = true;
      }
      if (values.m !== undefined) {
        state.m = parseFloat(values.m);
        el.inM.value = state.m;
        el.outM.textContent = state.m.toFixed(1) + " kg";
        changed = true;
      }
      if (values.ampA !== undefined) {
        state.ampA = parseFloat(values.ampA);
        el.inAmpA.value = state.ampA;
        el.outAmpA.textContent = state.ampA.toFixed(1) + " cm";
      }
      if (values.ampB !== undefined) {
        state.ampB = parseFloat(values.ampB);
        el.inAmpB.value = state.ampB;
        el.outAmpB.textContent = state.ampB.toFixed(1) + " cm";
      }
      
      // Recalculate derived physics if system params changed
      if (changed) {
        state.omega = Math.sqrt(state.k / state.m);
        state.period = (2 * Math.PI) / state.omega;
      }
      
      render();
    }

    function getState() {
      return { ...state, history: [...state.history] };
    }

    function getReadouts() {
      return {
        t: state.t,
        period: state.period,
        omega: state.omega,
        posA: state.ampA * Math.cos(state.omega * state.t),
        posB: state.ampB * Math.cos(state.omega * state.t)
      };
    }

    function runModelChecks() {
      // Analytic model verification
      const cases = [
        { k: 10, m: 0.5, desc: "Default" },
        { k: 20, m: 0.5, desc: "Double k" },
        { k: 10, m: 2.0, desc: "Quad m" }
      ];
      
      return cases.map(c => {
        const omega = Math.sqrt(c.k / c.m);
        const period = 2 * Math.PI / omega;
        
        // Check isochronism: Period should be independent of Amplitude
        const t1 = period * 0.25; // Quarter period
        const x_small = 1.0 * Math.cos(omega * t1); // Should be ~0
        const x_large = 8.0 * Math.cos(omega * t1); // Should be ~0
        
        const pass = Math.abs(x_small) < 1e-10 && Math.abs(x_large) < 1e-10;
        
        return {
          name: `Isochronism Check (${c.desc})`,
          pass: pass,
          expected: "Zero crossing at T/4 for all amplitudes",
          actual: `x(1cm)=${x_small.toExponential(2)}, x(8cm)=${x_large.toExponential(2)}`,
          tolerance: "1e-10"
        };
      });
    }

    // --- Helpers & Bindings ---

    function bindControls() {
      el.btnStart.addEventListener("click", start);
      el.btnPause.addEventListener("click", pause);
      el.btnReset.addEventListener("click", reset);
      
      el.inAmpA.addEventListener("input", e => setParameters({ ampA: e.target.value }));
      el.inAmpB.addEventListener("input", e => setParameters({ ampB: e.target.value }));
      el.inK.addEventListener("input", e => setParameters({ k: e.target.value }));
      el.inM.addEventListener("input", e => setParameters({ m: e.target.value }));
    }

    function resizeChart() {
      const rect = el.canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      el.canvas.width = rect.width * dpr;
      el.canvas.height = rect.height * dpr;
      el.ctx.scale(dpr, dpr);
      el.canvas.style.width = `${rect.width}px`;
      el.canvas.style.height = `${rect.height}px`;
      render();
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    // Expose API strictly as requested
    window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };

    // Auto-init
    init();

  </script>
</body>
