<!doctype html>
<html lang="zh-CN">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数列求和几何图解</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #eef3f8;
      --sim-surface: #ffffff;
      --sim-surface-soft: #f8fafc;
      --sim-text: #172033;
      --sim-muted: #657188;
      --sim-border: #dfe6ef;
      --sim-grid: #e8edf4;
      --sim-accent: #0f9fba;
      --sim-accent-deep: #08758a;
      --sim-accent-soft: #d9f4f7;
      --sim-positive: #0f9fba;
      --sim-warning: #f59e0b;
      --sim-danger: #dc2626;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
      --sim-arithmetic: #0f9fba;
      --sim-arithmetic-deep: #08758a;
      --sim-arithmetic-soft: #d9f4f7;
      --sim-arithmetic-flip: #f59e0b;
      --sim-arithmetic-flip-soft: #fff3d6;
      --sim-geometric: #7c3aed;
      --sim-geometric-deep: #5b21b6;
      --sim-geometric-soft: #ede9fe;
      --sim-geometric-remain: #f1f5f9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(124, 58, 237, 0.10), transparent 26%),
        var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }

    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
    .status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }

    .main { min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; font-size: 1.05rem; }
    .panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
    .scene-wrap { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .scene-svg { width: 100%; height: 100%; max-height: 100%; display: block; border-radius: 14px; }
    .scene-arithmetic { background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); }
    .scene-geometric { background: linear-gradient(145deg, #fbfdff 0%, #f6f2fc 58%, #f0fdfa 100%); }

    .readout-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .metric { padding: 12px 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 14px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
    .metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); font-size: 0.72rem; }
    .metric strong { font-size: 1.3rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .metric.geo { border-color: rgba(124,58,237,.14); background: linear-gradient(145deg, #faf8ff, #f4f0fb); }
    .formula { margin-top: 10px; padding: 8px 12px; border-radius: 10px; background: var(--sim-arithmetic-soft); color: var(--sim-arithmetic-deep); font-size: 0.82rem; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
    .formula.geo { background: var(--sim-geometric-soft); color: var(--sim-geometric-deep); }

    .insight-bar { padding: 12px 18px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a; font-weight: 650; font-size: 0.88rem; line-height: 1.5; }

    .controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
    button:hover { border-color: #c7d2e2; background: #eef3f9; }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
    .control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); }

    .grid-line { stroke: var(--sim-grid); stroke-width: 1; }
    .axis { stroke: #9aa7ba; stroke-width: 1.5; }
    .axis-label { fill: var(--sim-muted); font-size: 11px; }

    .a-step { fill: var(--sim-arithmetic); stroke: #fff; stroke-width: 1.5; }
    .a-step-flip { fill: var(--sim-arithmetic-flip); stroke: #fff; stroke-width: 1.5; }
    .a-rect-outline { fill: none; stroke: var(--sim-arithmetic-deep); stroke-width: 2; stroke-dasharray: 6 4; opacity: 0.55; }
    .a-label { fill: var(--sim-arithmetic-deep); font-size: 12px; font-weight: 700; text-anchor: middle; }
    .a-label-light { fill: #fff; font-size: 11px; font-weight: 700; text-anchor: middle; }

    .g-step { stroke: #fff; stroke-width: 1.5; }
    .g-remain { fill: var(--sim-geometric-remain); stroke: var(--sim-border); stroke-width: 1; stroke-dasharray: 4 3; }
    .g-unit-outline { fill: none; stroke: var(--sim-geometric-deep); stroke-width: 2.5; }
    .g-label { fill: #fff; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .g-label-remain { fill: var(--sim-muted); font-size: 10px; font-weight: 600; text-anchor: middle; }

    @media (max-width: 860px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
      .scene-panel { min-height: 0; }
      .scene-svg { height: auto; aspect-ratio: 760 / 420; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="app" data-layout="comparison" data-model-tier="analytic">
    <header class="header" data-region="header">
      <div>
        <h1>数列求和的几何图解</h1>
        <p>等差数列阶梯拼接矩形 · 等比数列无限分割逼近 1</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="arith-title">
        <div class="panel-head">
          <h2 id="arith-title">等差数列 1 + 2 + 3 + … + n</h2>
          <span>阶梯 → 翻转 → 拼成矩形</span>
        </div>
        <div class="scene-wrap">
          <svg id="arithScene" class="scene-svg scene-arithmetic" viewBox="0 0 760 420" role="img" aria-labelledby="arith-title arith-desc">
            <desc id="arith-desc">左侧阶梯由 1 到 n 个方块层叠，右侧将阶梯倒置拼接成 n × (n+1) 矩形。</desc>
            <g id="arithGrid"></g>
            <line class="axis" x1="40" y1="380" x2="720" y2="380"></line>
            <line class="axis" x1="40" y1="20" x2="40" y2="380"></line>
            <text class="axis-label" x="710" y="398">列</text>
            <text class="axis-label" x="16" y="30">行</text>
            <g id="arithStair"></g>
            <g id="arithFlip"></g>
            <rect id="arithRectOutline" class="a-rect-outline" x="0" y="0" width="0" height="0" rx="4"></rect>
            <text id="arithRectLabel" class="a-label" x="0" y="0" opacity="0"></text>
          </svg>
        </div>
        <div class="readout-row">
          <div class="metric"><small>项数 n</small><strong id="arithN">4</strong></div>
          <div class="metric"><small>累计和</small><strong id="arithSum">10</strong></div>
        </div>
        <div class="formula" id="arithFormula">n(n+1)/2 = 4×5/2 = 10</div>
      </section>

      <section class="panel scene-panel" data-region="evidence" aria-labelledby="geo-title">
        <div class="panel-head">
          <h2 id="geo-title">等比数列 1/2 + 1/4 + 1/8 + …</h2>
          <span>逐级对半分割填色 → 逼近 1</span>
        </div>
        <div class="scene-wrap">
          <svg id="geoScene" class="scene-svg scene-geometric" viewBox="0 0 760 420" role="img" aria-labelledby="geo-title geo-desc">
            <desc id="geo-desc">单位正方形被逐级对半分割填色，剩余面积不断缩小趋于零。</desc>
            <g id="geoGrid"></g>
            <rect id="geoUnit" class="g-unit-outline" x="80" y="40" width="600" height="340" rx="6"></rect>
            <g id="geoSteps"></g>
            <rect id="geoRemain" class="g-remain" x="80" y="40" width="600" height="340" rx="6"></rect>
            <text id="geoRemainLabel" class="g-label-remain" x="0" y="0" opacity="0"></text>
          </svg>
        </div>
        <div class="readout-row">
          <div class="metric geo"><small>项数 n</small><strong id="geoN">4</strong></div>
          <div class="metric geo"><small>累计和</small><strong id="geoSum">0.9375</strong></div>
        </div>
        <div class="formula geo" id="geoFormula">剩余面积 = 1/2ⁿ = 0.0625</div>
      </section>
    </main>

    <section class="panel" data-region="insight" style="padding: 0 0 12px;">
      <div class="insight-bar" id="insight">拖动项数 n：左侧阶梯翻转拼成 n×(n+1) 矩形，面积即求和；右侧无限分割，剩余面积趋于 0。</div>
    </section>

    <section class="panel controls" data-region="controls" aria-label="模拟控制">
      <div class="actions">
        <button id="startBtn" class="primary" type="button">播放</button>
        <button id="pauseBtn" type="button">暂停</button>
        <button id="resetBtn" type="button">重置</button>
        <button id="stepBtn" type="button">步进</button>
      </div>
      <div class="control">
        <label for="nInput">项数 n <output id="nOutput">4</output></label>
        <input id="nInput" type="range" min="1" max="8" step="1" value="4">
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";

    const parameterSchema = [
      { key: "n", label: "项数 n", type: "slider", min: 1, max: 8, step: 1, default: 4, unit: "" }
    ];

    const state = {
      running: false,
      mode: "play",
      n: 4,
      displayN: 4,
      lastTimestamp: null,
      animSpeed: 2.5,
    };

    const els = {
      status: document.querySelector("#status"),
      arithStair: document.querySelector("#arithStair"),
      arithFlip: document.querySelector("#arithFlip"),
      arithRectOutline: document.querySelector("#arithRectOutline"),
      arithRectLabel: document.querySelector("#arithRectLabel"),
      arithGrid: document.querySelector("#arithGrid"),
      arithN: document.querySelector("#arithN"),
      arithSum: document.querySelector("#arithSum"),
      arithFormula: document.querySelector("#arithFormula"),
      geoSteps: document.querySelector("#geoSteps"),
      geoRemain: document.querySelector("#geoRemain"),
      geoRemainLabel: document.querySelector("#geoRemainLabel"),
      geoGrid: document.querySelector("#geoGrid"),
      geoN: document.querySelector("#geoN"),
      geoSum: document.querySelector("#geoSum"),
      geoFormula: document.querySelector("#geoFormula"),
      insight: document.querySelector("#insight"),
      nInput: document.querySelector("#nInput"),
      nOutput: document.querySelector("#nOutput"),
      startBtn: document.querySelector("#startBtn"),
      pauseBtn: document.querySelector("#pauseBtn"),
      resetBtn: document.querySelector("#resetBtn"),
      stepBtn: document.querySelector("#stepBtn"),
    };

    function clamp(v, mn, mx) { return Math.min(mx, Math.max(mn, v)); }
    function finite(v, fb) { return Number.isFinite(v) ? v : fb; }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

    function initGrid() {
      const lines = [];
      for (let i = 0; i <= 10; i += 1) {
        const x = 40 + i * 68;
        const y = 380 - i * 36;
        lines.push(`<line class="grid-line" x1="${x}" y1="20" x2="${x}" y2="380"></line>`);
        lines.push(`<line class="grid-line" x1="40" y1="${y}" x2="720" y2="${y}"></line>`);
      }
      els.arithGrid.innerHTML = lines.join("");
      els.geoGrid.innerHTML = lines.join("");
    }

    function init() {
      initGrid();
      bindControls();
      setParameters({ n: 4 });
      reset();
      requestAnimationFrame(frame);
    }

    function start() {
      state.running = true;
      state.mode = "play";
      els.status.textContent = "运行中";
      els.startBtn.setAttribute("aria-pressed", "true");
    }

    function pause() {
      state.running = false;
      els.status.textContent = "已暂停";
      els.startBtn.setAttribute("aria-pressed", "false");
    }

    function reset() {
      pause();
      state.displayN = 0;
      render();
    }

    function step() {
      pause();
      state.mode = "step";
      const targetN = Math.round(state.displayN) + 1;
      const newN = clamp(targetN, 1, state.n);
      if (newN > state.displayN) {
        state.displayN = newN;
      }
      render();
    }

    function update(dt) {
      if (!state.running) return;
      const bdt = clamp(finite(dt, 0), 0, 0.05);
      state.displayN += bdt * state.animSpeed;
      if (state.displayN >= state.n) {
        state.displayN = state.n;
        pause();
      }
    }

    function renderArithmetic() {
      const W = 760, H = 420;
      const padL = 40, padR = 20, padT = 20, padB = 40;
      const availW = W - padL - padR;
      const availH = H - padT - padB;
      const maxN = 8;
      const cellW = Math.min(availW / (2 * maxN + 1), availH / (maxN + 1));
      const cellH = cellW;

      const stairW = maxN * cellW;
      const stairH = (maxN + 1) * cellH;
      const stairX = padL + 10;
      const stairY = H - padB - stairH;

      const parts = [];
      const fullN = Math.floor(state.displayN);
      const frac = state.displayN - fullN;

      for (let row = 0; row < maxN; row += 1) {
        const blocksInRow = maxN - row;
        const rowSum = maxN - blocksInRow + 1;
        for (let col = 0; col < blocksInRow; col += 1) {
          const blockN = col + 1;
          let opacity = 0;
          if (blockN <= fullN) opacity = 1;
          else if (blockN === fullN + 1) opacity = frac;
          if (opacity <= 0.001) continue;

          const x = stairX + col * cellW;
          const y = stairY + row * cellH;

          parts.push(`<rect class="a-step" x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${cellW.toFixed(2)}" height="${cellH.toFixed(2)}" rx="3" opacity="${opacity.toFixed(3)}"></rect>`);
          if (opacity > 0.5 && cellW > 22) {
            parts.push(`<text class="a-label-light" x="${(x + cellW / 2).toFixed(2)}" y="${(y + cellH / 2 + 4).toFixed(2)}" opacity="${opacity.toFixed(3)}">${blockN}</text>`);
          }
        }
      }
      els.arithStair.innerHTML = parts.join("");

      const flipParts = [];
      const flipStairW = (maxN + 1) * cellW;
      const flipStairH = maxN * cellH;
      const flipStairX = stairX + stairW + cellW;
      const flipStairY = H - padB - flipStairH;

      for (let row = 0; row < maxN; row += 1) {
        const blocksInRow = row + 1;
        for (let col = 0; col < blocksInRow; col += 1) {
          const blockN = blocksInRow - col;
          let opacity = 0;
          if (blockN <= fullN) opacity = 1;
          else if (blockN === fullN + 1) opacity = frac;
          if (opacity <= 0.001) continue;

          const x = flipStairX + col * cellW;
          const y = flipStairY + row * cellH;

          flipParts.push(`<rect class="a-step-flip" x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${cellW.toFixed(2)}" height="${cellH.toFixed(2)}" rx="3" opacity="${opacity.toFixed(3)}"></rect>`);
        }
      }
      els.arithFlip.innerHTML = flipParts.join("");

      const showRect = state.displayN >= 1;
      const rectW = state.displayN * cellW;
      const rectH = (state.displayN + 1) * cellH;
      const rectX = flipStairX;
      const rectY = H - padB - rectH;

      if (showRect) {
        els.arithRectOutline.setAttribute("x", rectX.toFixed(2));
        els.arithRectOutline.setAttribute("y", rectY.toFixed(2));
        els.arithRectOutline.setAttribute("width", rectW.toFixed(2));
        els.arithRectOutline.setAttribute("height", rectH.toFixed(2));
        els.arithRectOutline.setAttribute("opacity", "1");

        els.arithRectLabel.setAttribute("x", (rectX + rectW / 2).toFixed(2));
        els.arithRectLabel.setAttribute("y", (rectY - 8).toFixed(2));
        els.arithRectLabel.textContent = `${fullN} × ${fullN + 1} = ${arithSum(fullN)}`;
        els.arithRectLabel.setAttribute("opacity", frac > 0.3 ? "1" : "0");
      } else {
        els.arithRectOutline.setAttribute("opacity", "0");
        els.arithRectLabel.setAttribute("opacity", "0");
      }

      const sum = arithSum(state.displayN);
      els.arithN.textContent = fullN;
      els.arithSum.textContent = sum.toFixed(0);
      els.arithFormula.textContent = `n(n+1)/2 = ${fullN}×${fullN + 1}/2 = ${arithSum(fullN)}`;
    }

    function renderGeometric() {
      const W = 760, H = 420;
      const unitX = 80, unitY = 40;
      const unitW = 600, unitH = 340;

      const fullN = Math.floor(state.displayN);
      const frac = state.displayN - fullN;

      const parts = [];
      const colors = ["#7c3aed", "#9333ea", "#a855f7", "#c084fc", "#d8b4fe", "#e9d5ff", "#f3e8ff", "#f8f5ff"];

      let curX = unitX, curY = unitY, curW = unitW, curH = unitH;

      for (let i = 1; i <= 8; i += 1) {
        const isHorizontal = (i % 2 === 1);
        let opacity = 0;
        if (i <= fullN) opacity = 1;
        else if (i === fullN + 1) opacity = frac;
        if (opacity <= 0.001) {
          if (isHorizontal) { curW /= 2; curX += curW; }
          else { curH /= 2; curY += curH; }
          continue;
        }

        let stepX, stepY, stepW, stepH;
        if (isHorizontal) {
          stepW = curW / 2;
          stepH = curH;
          stepX = curX;
          stepY = curY;
          curW /= 2;
          curX += curW;
        } else {
          stepW = curW;
          stepH = curH / 2;
          stepX = curX;
          stepY = curY;
          curH /= 2;
          curY += curH;
        }

        const color = colors[Math.min(i - 1, colors.length - 1)];
        parts.push(`<rect class="g-step" x="${stepX.toFixed(2)}" y="${stepY.toFixed(2)}" width="${stepW.toFixed(2)}" height="${stepH.toFixed(2)}" fill="${color}" opacity="${opacity.toFixed(3)}" rx="2"></rect>`);

        if (opacity > 0.5 && stepW > 30 && stepH > 20) {
          const labelText = `1/${Math.pow(2, i)}`;
          parts.push(`<text class="g-label" x="${(stepX + stepW / 2).toFixed(2)}" y="${(stepY + stepH / 2 + 4).toFixed(2)}" opacity="${opacity.toFixed(3)}">${labelText}</text>`);
        }
      }
      els.geoSteps.innerHTML = parts.join("");

      els.geoRemain.setAttribute("x", curX.toFixed(2));
      els.geoRemain.setAttribute("y", curY.toFixed(2));
      els.geoRemain.setAttribute("width", curW.toFixed(2));
      els.geoRemain.setAttribute("height", curH.toFixed(2));

      if (state.displayN >= 1 && curW > 4 && curH > 4) {
        els.geoRemainLabel.setAttribute("x", (curX + curW / 2).toFixed(2));
        els.geoRemainLabel.setAttribute("y", (curY + curH / 2 + 4).toFixed(2));
        els.geoRemainLabel.textContent = `剩余 ${Math.pow(2, -fullN - (frac > 0.3 ? 1 : 0)).toFixed(4)}`;
        els.geoRemainLabel.setAttribute("opacity", "1");
      } else {
        els.geoRemainLabel.setAttribute("opacity", "0");
      }

      const sum = geoSum(state.displayN);
      const remain = 1 - sum;
      els.geoN.textContent = fullN;
      els.geoSum.textContent = sum.toFixed(4);
      els.geoFormula.textContent = `剩余面积 = 1/2ⁿ = ${remain.toFixed(4)}`;
    }

    function render() {
      renderArithmetic();
      renderGeometric();
      renderInsight();
      els.nOutput.textContent = state.n;
    }

    function renderInsight() {
      const fullN = Math.floor(state.displayN);
      if (state.displayN < 0.1) {
        els.insight.textContent = "按播放或步进：左侧阶梯翻转拼成 n×(n+1) 矩形，面积即求和；右侧无限分割，剩余面积趋于 0。";
      } else if (state.displayN < state.n - 0.5) {
        els.insight.textContent = `正在拼接第 ${fullN + 1} 级：等差和 = ${arithSum(state.displayN).toFixed(1)}，等比和 = ${geoSum(state.displayN).toFixed(4)}，剩余 = ${(1 - geoSum(state.displayN)).toFixed(4)}。`;
      } else {
        els.insight.textContent = `n = ${fullN}：等差和 ${arithSum(fullN)} = ${fullN}×${fullN + 1}/2；等比和 ${geoSum(fullN).toFixed(4)}，剩余 ${(1 - geoSum(fullN)).toFixed(4)}。n → ∞ 时等比和 → 1。`;
      }
    }

    function arithSum(n) { return n * (n + 1) / 2; }
    function geoSum(n) { return 1 - Math.pow(2, -n); }

    function setParameters(values) {
      const def = parameterSchema[0];
      state.n = clamp(Math.round(finite(Number(values.n), def.default)), def.min, def.max);
      els.nInput.value = String(state.n);
      if (state.displayN > state.n) state.displayN = state.n;
      render();
    }

    function getState() {
      return { ...state };
    }

    function getReadouts() {
      const fullN = Math.floor(state.displayN);
      return {
        n: state.n,
        displayN: state.displayN,
        arithSum: arithSum(state.displayN),
        geoSum: geoSum(state.displayN),
        geoRemain: 1 - geoSum(state.displayN),
      };
    }

    function runModelChecks() {
      const checks = [];
      checks.push({
        name: "等差求和 n=4",
        pass: arithSum(4) === 10,
        expected: 10,
        actual: arithSum(4),
        tolerance: 0,
      });
      checks.push({
        name: "等差求和 n=8",
        pass: arithSum(8) === 36,
        expected: 36,
        actual: arithSum(8),
        tolerance: 0,
      });
      checks.push({
        name: "等差求和 n=1",
        pass: arithSum(1) === 1,
        expected: 1,
        actual: arithSum(1),
        tolerance: 0,
      });
      checks.push({
        name: "等比求和 n=4",
        pass: Math.abs(geoSum(4) - 0.9375) < 1e-9,
        expected: 0.9375,
        actual: geoSum(4),
        tolerance: 1e-9,
      });
      checks.push({
        name: "等比求和 n=8",
        pass: Math.abs(geoSum(8) - (1 - 1/256)) < 1e-9,
        expected: 1 - 1/256,
        actual: geoSum(8),
        tolerance: 1e-9,
      });
      checks.push({
        name: "等比求和 n=1",
        pass: Math.abs(geoSum(1) - 0.5) < 1e-9,
        expected: 0.5,
        actual: geoSum(1),
        tolerance: 1e-9,
      });
      checks.push({
        name: "等比剩余 = 1 - 求和",
        pass: Math.abs((1 - geoSum(5)) - Math.pow(2, -5)) < 1e-9,
        expected: Math.pow(2, -5),
        actual: 1 - geoSum(5),
        tolerance: 1e-9,
      });
      checks.push({
        name: "等比单调递增",
        pass: geoSum(4) > geoSum(3) && geoSum(5) > geoSum(4),
        expected: "S(n+1) > S(n)",
        actual: `${geoSum(3)} < ${geoSum(4)} < ${geoSum(5)}`,
        tolerance: "strict",
      });
      checks.push({
        name: "等差单调递增",
        pass: arithSum(4) > arithSum(3) && arithSum(5) > arithSum(4),
        expected: "S(n+1) > S(n)",
        actual: `${arithSum(3)} < ${arithSum(4)} < ${arithSum(5)}`,
        tolerance: "strict",
      });
      checks.push({
        name: "displayN 范围合法",
        pass: state.displayN >= 0 && state.displayN <= state.n,
        expected: `0 ≤ displayN ≤ ${state.n}`,
        actual: state.displayN,
        tolerance: "range",
      });
      return checks;
    }

    function bindControls() {
      els.startBtn.addEventListener("click", start);
      els.pauseBtn.addEventListener("click", pause);
      els.resetBtn.addEventListener("click", reset);
      els.stepBtn.addEventListener("click", step);
      els.nInput.addEventListener("input", () => setParameters({ n: els.nInput.value }));
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    window.simulation = { init, start, pause, reset, step, update, render, setParameters, getState, getReadouts, runModelChecks };
    init();
  })();
  </script>
</body>
</html>
