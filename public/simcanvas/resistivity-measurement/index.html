<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>测量金属丝的电阻率</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #eef3f8;
      --sim-surface: #ffffff;
      --sim-surface-soft: #f8fafc;
      --sim-text: #172033;
      --sim-muted: #657188;
      --sim-border: #dfe6ef;
      --sim-grid: #e8edf4;
      --sim-accent: #0f9fba;
      --sim-accent-deep: #08758a;
      --sim-accent-soft: #d9f4f7;
      --sim-positive: #0f9fba;
      --sim-warning: #f59e0b;
      --sim-danger: #dc2626;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
      /* 学科语义色（扩展，非替代） */
      --sim-wire: #8aa0b8;
      --sim-wire-hot: #c4cedb;
      --sim-lead-pos: #dc2626;
      --sim-lead-neg: #172033;
      --sim-particle: #f59e0b;
      --sim-fit: #0f9fba;
      --sim-point-ext: #0f9fba;
      --sim-point-int: #d97706;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
        var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.5rem, 2.2vw, 2rem); letter-spacing: -0.035em; line-height: 1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
    .status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(320px, 0.85fr); gap: 12px; }
    .panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
    #scene { width: 100%; height: 100%; min-height: 360px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); }
    .side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; }
    .readouts { padding: 14px; }
    .meter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .meter { padding: 10px; border: 1px solid rgba(15,159,186,.12); border-radius: 14px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); display: grid; gap: 6px; }
    .meter small { display: block; color: var(--sim-muted); font-size: 0.72rem; font-weight: 700; }
    .meter-dial { width: 100%; aspect-ratio: 2 / 1.05; display: block; }
    .meter strong { font-size: 1.3rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; text-align: center; }
    .chart-block { padding: 12px; display: grid; grid-template-rows: auto minmax(150px,1fr) auto; gap: 8px; min-height: 0; }
    .chart-block h3 { margin: 0; font-size: 0.9rem; }
    #chart { width: 100%; height: 100%; min-height: 160px; display: block; }
    .rho-card { padding: 10px 14px; border-radius: 12px; background: linear-gradient(135deg, #0f9fba 0%, #08758a 100%); color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .rho-card small { opacity: 0.92; font-size: 0.72rem; letter-spacing: 0.02em; }
    .rho-card strong { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
    .model-note { padding: 10px 14px; display: grid; gap: 6px; }
    .model-note .insight { padding: 9px 12px; border-left: 3px solid var(--sim-warning); border-radius: 0 10px 10px 0; background: #fff8e8; color: #80510a; font-weight: 650; font-size: 0.82rem; line-height: 1.45; }
    .controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(140px, 1fr) auto minmax(130px, 1fr) minmax(130px, 1fr) minmax(130px, 1fr); gap: 12px; align-items: center; border-radius: 17px; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
    button:hover { border-color: #c7d2e2; background: #eef3f9; }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
    .toggle-group { display: inline-flex; border: 1px solid var(--sim-border); border-radius: 10px; overflow: hidden; }
    .toggle-group button { border: none; border-radius: 0; padding: 8px 12px; background: var(--sim-surface-soft); font-size: 0.82rem; }
    .toggle-group button.active { background: var(--sim-accent-deep); color: #fff; }
    .control label { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 5px; font-size: 0.76rem; font-weight: 700; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
    .axis-line { stroke: #9aa7ba; stroke-width: 1.5; }
    .axis-label { fill: var(--sim-muted); font-size: 11px; }
    .grid-line { stroke: var(--sim-grid); stroke-width: 1; }
    @media (max-width: 860px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr 1fr; }
      .scene-panel { min-height: 0; }
      #scene { min-height: 0; height: auto; aspect-ratio: 760 / 460; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <!-- SimCanvas stable shell: 用户明确要求移除独立 INSIGHT 视觉块，insight data-region 以 evidence 内的状态提示文本承载 -->
  <div class="app" data-layout="experiment" data-model-tier="analytic">
    <header class="header" data-region="header">
      <div>
        <h1>测量金属丝的电阻率</h1>
        <p>伏安法测 R · 螺旋测微器测 d · 米尺测 L · 由 ρ = RS/L 反推电阻率</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">未启动</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head">
          <h2 id="scene-title">电路原理图 · 限流式伏安法</h2>
          <span>橙色光点 = 电流方向（速度 ∝ I）· 红/黑线 = 正/负接线</span>
        </div>
        <svg id="scene" viewBox="0 0 760 460" role="img" aria-labelledby="scene-title scene-desc">
          <desc id="scene-desc">伏安法测电阻电路：电源、开关、滑线变阻器、电流表、电压表、待测金属丝。电流粒子在回路中流动。</desc>
          <defs>
            <radialGradient id="particleGrad" cx="0.35" cy="0.35">
              <stop offset="0" stop-color="#fff7e6"/>
              <stop offset="0.45" stop-color="#f59e0b"/>
              <stop offset="1" stop-color="#b45309"/>
            </radialGradient>
            <linearGradient id="wireGrad" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#c4cedb"/>
              <stop offset="0.5" stop-color="#8aa0b8"/>
              <stop offset="1" stop-color="#5d7185"/>
            </linearGradient>
            <linearGradient id="rheoGrad" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#e5ebf2"/>
              <stop offset="1" stop-color="#b9c4d2"/>
            </linearGradient>
            <pattern id="wireHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <line x1="0" y1="0" x2="0" y2="6" stroke="#5d7185" stroke-width="0.8" opacity="0.45"/>
            </pattern>
          </defs>

          <g id="wires" stroke-linecap="round" stroke-linejoin="round" fill="none"></g>
          <g id="components"></g>
          <g id="particles"></g>
        </svg>
      </section>

      <aside class="side" data-region="evidence">
        <section class="panel readouts" aria-label="实时仪表读数">
          <div class="meter-row">
            <div class="meter">
              <small>电压表 V</small>
              <svg class="meter-dial" viewBox="0 0 200 110" aria-hidden="true">
                <path d="M20,100 A80,80 0 0 1 180,100" fill="none" stroke="#dfe6ef" stroke-width="6"/>
                <g id="voltTicks"></g>
                <g id="voltNeedle" transform="rotate(-90 100 100)">
                  <line x1="100" y1="100" x2="100" y2="34" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
                  <circle cx="100" cy="100" r="5" fill="#dc2626"/>
                </g>
                <text x="100" y="96" text-anchor="middle" font-size="10" fill="#657188">V</text>
              </svg>
              <strong id="voltReadout">0.000 V</strong>
            </div>
            <div class="meter">
              <small>电流表 A</small>
              <svg class="meter-dial" viewBox="0 0 200 110" aria-hidden="true">
                <path d="M20,100 A80,80 0 0 1 180,100" fill="none" stroke="#dfe6ef" stroke-width="6"/>
                <g id="ampTicks"></g>
                <g id="ampNeedle" transform="rotate(-90 100 100)">
                  <line x1="100" y1="100" x2="100" y2="34" stroke="#0f9fba" stroke-width="2.4" stroke-linecap="round"/>
                  <circle cx="100" cy="100" r="5" fill="#0f9fba"/>
                </g>
                <text x="100" y="96" text-anchor="middle" font-size="10" fill="#657188">A</text>
              </svg>
              <strong id="ampReadout">0.000 A</strong>
            </div>
          </div>
        </section>

        <section class="panel chart-block" aria-label="I-U 数据图">
          <div class="panel-head" style="margin-bottom:0">
            <h3>I-U 图 · 最小二乘拟合</h3>
            <span id="pointCount">0 个数据点</span>
          </div>
          <svg id="chart" viewBox="0 0 360 220" role="img" aria-label="电流-电压散点图">
            <g id="chartGrid"></g>
            <line class="axis-line" x1="42" y1="180" x2="345" y2="180"/>
            <line class="axis-line" x1="42" y1="20" x2="42" y2="180"/>
            <text class="axis-label" x="340" y="197" text-anchor="end">U / V</text>
            <text class="axis-label" x="48" y="28">I / A</text>
            <g id="dataPoints"></g>
            <g id="chartLabels"></g>
          </svg>
          <div class="rho-card">
            <div>
              <small>ρ_测 = R·S/L = πd²·(U/I)/(4L)</small><br>
              <small id="formulaDetail" style="opacity:0.85">R = U/I · S = π(d/2)² · L = 1.000 m</small>
            </div>
            <strong id="rhoReadout">— Ω·m</strong>
          </div>
        </section>

        <section class="panel model-note" data-region="insight" aria-label="状态提示">
          <div id="insight" class="insight">未启动：按下「启动」接通电路，拖动滑片改变电压。</div>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="仿真控制">
      <div class="actions">
        <button id="startBtn" class="primary" type="button">启动</button>
        <button id="pauseBtn" type="button">暂停</button>
        <button id="resetBtn" type="button">重置</button>
        <button id="sampleBtn" type="button" title="记录当前 (U, I) 到 I-U 图">采样</button>
      </div>
      <div class="control">
        <label for="rheoInput">滑线变阻器 R_p <output id="rheoOutput">25.0 Ω</output></label>
        <input id="rheoInput" type="range" min="0" max="50" step="0.5" value="25">
      </div>
      <div class="toggle-group" id="configToggle" role="group" aria-label="电流表接法">
        <button id="btnExt" type="button" aria-pressed="true" class="active">外接</button>
        <button id="btnInt" type="button" aria-pressed="false">内接</button>
      </div>
      <div class="control">
        <label for="lenInput">金属丝长度 L <output id="lenOutput">1.000 m</output></label>
        <input id="lenInput" type="range" min="0.40" max="1.500" step="0.001" value="1.000">
      </div>
      <div class="control">
        <label for="diaInput">金属丝直径 d <output id="diaOutput">0.500 mm</output></label>
        <input id="diaInput" type="range" min="0.20" max="0.80" step="0.005" value="0.500">
      </div>
      <div class="control">
        <label for="precisionInput">仪表精度 <output id="precisionOutput">教学档</output></label>
        <input id="precisionInput" type="range" min="0" max="1" step="1" value="0">
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";

    // ============================================================
    // 参数 schema & 物理常数
    // ============================================================
    const parameterSchema = [
      { key: "rheo", label: "滑线变阻器", type: "slider", min: 0, max: 50, step: 0.5, default: 25, unit: "Ω" },
      { key: "L", label: "金属丝长度", type: "slider", min: 0.40, max: 1.500, step: 0.001, default: 1.000, unit: "m" },
      { key: "d", label: "金属丝直径", type: "slider", min: 0.20, max: 0.80, step: 0.005, default: 0.500, unit: "mm" },
      { key: "precision", label: "仪表精度", type: "slider", min: 0, max: 1, step: 1, default: 0, unit: "" }
    ];

    const CONST = {
      epsilon: 3.0,
      r_int: 0.0,
      rho0: 1.10e-6,    // 镍铬合金电阻率 (Ω·m)
      R_V: 3000.0,
      R_A: 0.5,
    };

    // ============================================================
    // 状态
    // ============================================================
    const state = {
      running: false,
      t: 0,
      lastTimestamp: null,
      rheo: 25,
      L: 1.000,
      d: 0.500,
      config: "ext",
      precision: 0,
      samples: [],
      particlePhase: 0,
      voltDisplay: 0,
      ampDisplay: 0,
      voltTarget: 0,
      ampTarget: 0,
    };

    const elements = {
      status: document.querySelector("#status"),
      startBtn: document.querySelector("#startBtn"),
      pauseBtn: document.querySelector("#pauseBtn"),
      resetBtn: document.querySelector("#resetBtn"),
      sampleBtn: document.querySelector("#sampleBtn"),
      rheoInput: document.querySelector("#rheoInput"),
      rheoOutput: document.querySelector("#rheoOutput"),
      lenInput: document.querySelector("#lenInput"),
      lenOutput: document.querySelector("#lenOutput"),
      diaInput: document.querySelector("#diaInput"),
      diaOutput: document.querySelector("#diaOutput"),
      precisionInput: document.querySelector("#precisionInput"),
      precisionOutput: document.querySelector("#precisionOutput"),
      btnExt: document.querySelector("#btnExt"),
      btnInt: document.querySelector("#btnInt"),
      voltReadout: document.querySelector("#voltReadout"),
      ampReadout: document.querySelector("#ampReadout"),
      rhoReadout: document.querySelector("#rhoReadout"),
      formulaDetail: document.querySelector("#formulaDetail"),
      voltNeedle: document.querySelector("#voltNeedle"),
      ampNeedle: document.querySelector("#ampNeedle"),
      voltTicks: document.querySelector("#voltTicks"),
      ampTicks: document.querySelector("#ampTicks"),
      wires: document.querySelector("#wires"),
      components: document.querySelector("#components"),
      particles: document.querySelector("#particles"),
      dataPoints: document.querySelector("#dataPoints"),
      chartGrid: document.querySelector("#chartGrid"),
      chartLabels: document.querySelector("#chartLabels"),
      pointCount: document.querySelector("#pointCount"),
      insight: document.querySelector("#insight"),
    };

    // ============================================================
    // 辅助
    // ============================================================
    function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
    function finite(v, fallback) { return Number.isFinite(v) ? v : fallback; }

    function R_true() {
      const S = Math.PI * Math.pow(state.d * 1e-3 / 2, 2);
      return CONST.rho0 * state.L / Math.max(S, 1e-12);
    }

    function solveCircuit() {
      const Rx = R_true();
      const Rp = state.rheo;
      const eps = CONST.epsilon;
      const ideal = state.precision === 1;
      const RV = ideal ? Infinity : CONST.R_V;
      const RA = ideal ? 0 : CONST.R_A;

      const R_total_true = Rp + Rx;
      const I_true = eps / Math.max(R_total_true, 1e-9);
      const U_true = I_true * Rx;

      let U_read, I_read;
      if (state.config === "ext") {
        const Rpar = 1 / (1 / Math.max(Rx, 1e-9) + (Number.isFinite(RV) ? 1 / RV : 0));
        const R_total = Rp + RA + Rpar;
        const I_loop = eps / Math.max(R_total, 1e-9);
        U_read = I_loop * Rpar;
        I_read = I_loop;
      } else {
        const R_total = Rp + RA + Rx;
        const I_loop = eps / Math.max(R_total, 1e-9);
        I_read = I_loop;
        U_read = I_loop * (RA + Rx);
      }

      return {
        U: finite(U_read, 0),
        I: finite(I_read, 0),
        U_true: finite(U_true, 0),
        I_true: finite(I_true, 0),
      };
    }

    function fitSlope(points) {
      let sxy = 0, sxx = 0;
      for (const p of points) {
        sxy += p.U * p.I;
        sxx += p.U * p.U;
      }
      if (sxx < 1e-18) return null;
      return sxy / sxx;
    }

    // ============================================================
    // 电路几何
    // ============================================================
    const C = {
      x0: 150, x1: 610, y_top: 90, y_bot: 370,
      battery: { x: 250, y: 90 },
      switch:  { x: 340, y: 90 },
      rheo:    { x: 470, y: 90, w: 140, h: 22 },
      // 金属丝在左侧回路上
      wireRx:  { yTop: 230, yBot: 330 },
      ammeterY: 150,    // A 表在 R_x 上方串联
      vTableX: 60,      // V 表在金属丝左侧外
      // R_x 上端 = wireRx.yTop；A 表下方引线接到 R_x 上端
      // A 表上方引线接到左回路顶部 = y_top
      // 外接法：V 引线接 R_x 两端（上端 = yTop，下端 = yBot）
      // 内接法：V 引线接 (A+R_x) 组合两端（上端 = y_top，下端 = yBot）
    };

    function drawCircuit() {
      const W = [];
      const leadColorPos = "#dc2626";
      const leadColorNeg = "#172033";
      const leadW = 3.2;
      const ext = state.config === "ext";

      // 外回路矩形（顺时针：顶→右→底→左）
      W.push(`<line x1="${C.x0}" y1="${C.y_top}" x2="${C.x1}" y2="${C.y_top}" stroke="${leadColorPos}" stroke-width="${leadW}"/>`);
      W.push(`<line x1="${C.x1}" y1="${C.y_top}" x2="${C.x1}" y2="${C.y_bot}" stroke="${leadColorPos}" stroke-width="${leadW}"/>`);
      W.push(`<line x1="${C.x1}" y1="${C.y_bot}" x2="${C.x0}" y2="${C.y_bot}" stroke="${leadColorNeg}" stroke-width="${leadW}"/>`);
      // 左侧回路分两段：A 表把左线分成上半段（y_top → ammeterY）和下半段（ammeterY → y_bot）
      // 上半段（A 表上方）
      W.push(`<line x1="${C.x0}" y1="${C.y_top}" x2="${C.x0}" y2="${C.ammeterY - 22}" stroke="${leadColorPos}" stroke-width="${leadW}"/>`);
      // A 表下方 → R_x 上端
      W.push(`<line x1="${C.x0}" y1="${C.ammeterY + 22}" x2="${C.x0}" y2="${C.wireRx.yTop}" stroke="${leadColorPos}" stroke-width="${leadW}"/>`);
      // R_x 下端 → 底部
      W.push(`<line x1="${C.x0}" y1="${C.wireRx.yBot}" x2="${C.x0}" y2="${C.y_bot}" stroke="${leadColorNeg}" stroke-width="${leadW}"/>`);

      // 电压表引线 —— 这是区分外接/内接的关键
      // V 表位置固定在 (vTableX, R_x 中点)
      const vY = (C.wireRx.yTop + C.wireRx.yBot) / 2;
      // 外接法：V 引线接 R_x 两端 → 上端接点在 wireRx.yTop（A 表下方，不跨过 A）
      // 内接法：V 引线接 (A+R_x) 组合两端 → 上端接点在 y_top（A 表上方，跨过 A）
      const vUpperTapY = ext ? C.wireRx.yTop : C.y_top;
      // 下端接点都是 R_x 下端（wireRx.yBot）
      const vLowerTapY = C.wireRx.yBot;
      // 用红/黑表示 V 表引线（与电源极性一致）
      W.push(`<line x1="${C.x0}" y1="${vUpperTapY}" x2="${C.vTableX + 22}" y2="${vUpperTapY}" stroke="#dc2626" stroke-width="2"/>`);
      W.push(`<line x1="${C.vTableX + 22}" y1="${vUpperTapY}" x2="${C.vTableX + 22}" y2="${vY}" stroke="#dc2626" stroke-width="2"/>`);
      W.push(`<line x1="${C.x0}" y1="${vLowerTapY}" x2="${C.vTableX - 22}" y2="${vLowerTapY}" stroke="#172033" stroke-width="2"/>`);
      W.push(`<line x1="${C.vTableX - 22}" y1="${vLowerTapY}" x2="${C.vTableX - 22}" y2="${vY}" stroke="#172033" stroke-width="2"/>`);

      // A 表在 R_x 上方（固定位置）
      // A 表两端引线接点（用于绘制连接点圆点标记）
      const aUpperTap = { x: C.x0, y: C.ammeterY - 22 };  // A 表上方引线接到 y_top（干路）
      const aLowerTap = { x: C.x0, y: C.ammeterY + 22 };  // A 表下方引线接到 R_x 上端

      // 标记 V 表接点（用小圆点强调）
      W.push(`<circle cx="${C.x0}" cy="${vUpperTapY}" r="3.5" fill="#dc2626"/>`);
      W.push(`<circle cx="${C.x0}" cy="${vLowerTapY}" r="3.5" fill="#172033"/>`);
      // 内接法时 A 表接点也是 V 表上端接点，用橙色环强调
      if (!ext) {
        W.push(`<circle cx="${aUpperTap.x}" cy="${aUpperTap.y + 22}" r="5" fill="none" stroke="#d97706" stroke-width="1.8"/>`);
      }

      elements.wires.innerHTML = W.join("");

      const M = [];

      // 电源
      const bx = C.battery.x;
      M.push(`<g transform="translate(${bx},${C.y_top})">
        <rect x="-28" y="-14" width="56" height="28" fill="#ffffff" stroke="#dfe6ef" rx="2"/>
        <line x1="-10" y1="-12" x2="-10" y2="12" stroke="${leadColorPos}" stroke-width="3.2"/>
        <line x1="6" y1="-8" x2="6" y2="8" stroke="${leadColorNeg}" stroke-width="3.2"/>
        <text x="-16" y="-18" font-size="12" font-weight="700" fill="#dc2626">+</text>
        <text x="3" y="-18" font-size="12" font-weight="700" fill="#172033">−</text>
        <text x="0" y="32" text-anchor="middle" font-size="11" fill="#657188">ε = 3.0 V</text>
      </g>`);

      // 开关
      const sx = C.switch.x;
      const swClosed = state.running;
      M.push(`<g transform="translate(${sx},${C.y_top})">
        <circle cx="-16" cy="0" r="3" fill="#5d7185"/>
        <circle cx="16" cy="0" r="3" fill="#5d7185"/>
        <line x1="-16" y1="0" x2="${swClosed ? 16 : 14}" y2="${swClosed ? 0 : -18}" stroke="#5d7185" stroke-width="2.6" stroke-linecap="round"/>
        <text x="0" y="${swClosed ? -10 : -24}" text-anchor="middle" font-size="10" fill="#657188">S ${swClosed ? '闭合' : '断开'}</text>
      </g>`);

      // 滑线变阻器
      const rh = C.rheo;
      const slPos = state.rheo / 50;
      const slX = rh.x - rh.w/2 + slPos * rh.w;
      const turns = 14;
      M.push(`<g transform="translate(${rh.x},${rh.y})">
        <rect x="${-rh.w/2}" y="${-rh.h/2}" width="${rh.w}" height="${rh.h}" rx="4" fill="url(#rheoGrad)" stroke="#9aa7ba" stroke-width="1"/>
        ${Array.from({length: turns}, (_, i) => {
          const x = -rh.w/2 + 6 + i * (rh.w - 12) / (turns - 1);
          return `<line x1="${x}" y1="${-rh.h/2 + 4}" x2="${x}" y2="${rh.h/2 - 4}" stroke="#5d7185" stroke-width="0.7" opacity="0.6"/>`;
        }).join("")}
        <line x1="${slX}" y1="${-rh.h/2 - 14}" x2="${slX}" y2="${rh.h/2 + 6}" stroke="#172033" stroke-width="2.6"/>
        <polygon points="${slX-6},${-rh.h/2-14} ${slX+6},${-rh.h/2-14} ${slX},${-rh.h/2-6}" fill="#172033"/>
        <text x="0" y="${-rh.h/2 - 22}" text-anchor="middle" font-size="11" font-weight="700" fill="#657188">R_p = ${state.rheo.toFixed(1)} Ω</text>
      </g>`);

      // 金属丝 R_x
      const rxY1 = C.wireRx.yTop, rxY2 = C.wireRx.yBot;
      const rxLen = rxY2 - rxY1;
      M.push(`<rect x="${C.x0 - 6}" y="${rxY1}" width="12" height="${rxLen}" rx="3" fill="url(#wireGrad)" stroke="#5d7185" stroke-width="0.8"/>`);
      M.push(`<rect x="${C.x0 - 6}" y="${rxY1}" width="12" height="${rxLen}" fill="url(#wireHatch)" opacity="0.7"/>`);
      M.push(`<circle cx="${C.x0}" cy="${rxY1}" r="4.5" fill="#b45309" stroke="#5d7185"/>`);
      M.push(`<circle cx="${C.x0}" cy="${rxY2}" r="4.5" fill="#b45309" stroke="#5d7185"/>`);

      // 长度标注（金属丝左侧）
      const rxMid = (rxY1 + rxY2) / 2;
      M.push(`<g transform="translate(${C.x0 - 18},${rxMid})">
        <line x1="0" y1="${-rxLen/2 + 6}" x2="0" y2="${rxLen/2 - 6}" stroke="#08758a" stroke-width="1.4" stroke-dasharray="3 2"/>
        <line x1="-4" y1="${-rxLen/2 + 6}" x2="4" y2="${-rxLen/2 + 6}" stroke="#08758a" stroke-width="1.2"/>
        <line x1="-4" y1="${rxLen/2 - 6}" x2="4" y2="${rxLen/2 - 6}" stroke="#08758a" stroke-width="1.2"/>
        <text x="-8" y="0" text-anchor="end" font-size="11" font-weight="700" fill="#08758a">L=${state.L.toFixed(3)} m</text>
        <text x="-8" y="14" text-anchor="end" font-size="10" fill="#657188">d=${state.d.toFixed(3)} mm</text>
        <text x="14" y="${-rxLen/2 + 2}" font-size="11" font-weight="700" fill="#dc2626">R_x</text>
      </g>`);

      // 电压表 V（固定位置：左外侧，R_x 中点高度）
      const vX = C.vTableX, vY2 = (C.wireRx.yTop + C.wireRx.yBot) / 2;
      M.push(`<g transform="translate(${vX},${vY2})">
        <circle r="22" fill="#ffffff" stroke="#dc2626" stroke-width="2.2"/>
        <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">V</text>
        <text x="0" y="-28" text-anchor="middle" font-size="10" font-weight="700" fill="#657188">${state.voltDisplay.toFixed(3)} V</text>
      </g>`);

      // 电流表 A（固定位置：左线中部，R_x 上方）
      const aX = C.x0, aY = C.ammeterY;
      M.push(`<g transform="translate(${aX},${aY})">
        <circle r="22" fill="#ffffff" stroke="#0f9fba" stroke-width="2.2"/>
        <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#0f9fba">A</text>
        <text x="0" y="34" text-anchor="middle" font-size="10" font-weight="700" fill="#657188">${state.ampDisplay.toFixed(3)} A</text>
      </g>`);

      // 接法标签 —— 准确描述 V 表接点位置差异
      const cfgLabel = ext
        ? "电流表外接法：V 表夹在 R_x 两端（测小电阻，I 包含 V 表分流）"
        : "电流表内接法：V 表夹在 (A+R_x) 两端（测大电阻，U 包含 A 表压降）";
      const cfgColor = ext ? "#0f9fba" : "#d97706";
      M.push(`<g transform="translate(${(C.x0+C.x1)/2},${C.y_bot + 28})">
        <rect x="-200" y="-12" width="400" height="22" rx="11" fill="#ffffff" stroke="${cfgColor}" stroke-width="1.2" opacity="0.96"/>
        <text x="0" y="3" text-anchor="middle" font-size="11" font-weight="700" fill="${cfgColor}">${cfgLabel}</text>
      </g>`);

      elements.components.innerHTML = M.join("");
    }

    // 电流粒子路径（顺时针沿回路周长）
    const PERIM = (() => {
      const pts = [];
      const step = 8;
      for (let x = C.x0; x <= C.x1; x += step) pts.push({x, y: C.y_top});
      for (let y = C.y_top; y <= C.y_bot; y += step) pts.push({x: C.x1, y});
      for (let x = C.x1; x >= C.x0; x -= step) pts.push({x, y: C.y_bot});
      for (let y = C.y_bot; y >= C.y_top; y -= step) pts.push({x: C.x0, y});
      return pts;
    })();
    const PERIM_LEN = PERIM.length;

    function drawParticles() {
      if (!state.running || state.ampDisplay < 1e-4) {
        elements.particles.innerHTML = "";
        return;
      }
      const N = 14;
      const spacing = PERIM_LEN / N;
      const phase = state.particlePhase % PERIM_LEN;
      const parts = [];
      for (let i = 0; i < N; i++) {
        const idx = Math.floor((phase + i * spacing) % PERIM_LEN);
        const p = PERIM[idx];
        parts.push(`<circle cx="${p.x}" cy="${p.y}" r="3.4" fill="url(#particleGrad)" opacity="0.92"/>`);
      }
      elements.particles.innerHTML = parts.join("");
    }

    // ============================================================
    // 仪表刻度
    // ============================================================
    function buildMeterTicks() {
      const vt = [];
      for (let i = 0; i <= 5; i++) {
        const angle = -90 + (i / 5) * 180;
        const rad = angle * Math.PI / 180;
        const x1 = 100 + 70 * Math.sin(rad);
        const y1 = 100 - 70 * Math.cos(rad);
        const x2 = 100 + 78 * Math.sin(rad);
        const y2 = 100 - 78 * Math.cos(rad);
        vt.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#9aa7ba" stroke-width="1.5"/>`);
        const tx = 100 + 58 * Math.sin(rad);
        const ty = 100 - 58 * Math.cos(rad) + 3;
        vt.push(`<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="8" fill="#657188">${(i * 0.6).toFixed(1)}</text>`);
      }
      elements.voltTicks.innerHTML = vt.join("");

      const at = [];
      const AMAX = 0.8;
      for (let i = 0; i <= 4; i++) {
        const angle = -90 + (i / 4) * 180;
        const rad = angle * Math.PI / 180;
        const x1 = 100 + 70 * Math.sin(rad);
        const y1 = 100 - 70 * Math.cos(rad);
        const x2 = 100 + 78 * Math.sin(rad);
        const y2 = 100 - 78 * Math.cos(rad);
        at.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#9aa7ba" stroke-width="1.5"/>`);
        const tx = 100 + 58 * Math.sin(rad);
        const ty = 100 - 58 * Math.cos(rad) + 3;
        at.push(`<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="8" fill="#657188">${(i * AMAX / 4).toFixed(2)}</text>`);
      }
      elements.ampTicks.innerHTML = at.join("");
    }

    // ============================================================
    // I-U 图表
    // ============================================================
    const CHART = { x0: 42, y0: 180, x1: 345, y1: 20, uMax: 3.0, iMax: 0.8 };
    function uToX(u) { return CHART.x0 + (u / CHART.uMax) * (CHART.x1 - CHART.x0); }
    function iToY(i) { return CHART.y0 - (i / CHART.iMax) * (CHART.y0 - CHART.y1); }

    function initChartGrid() {
      const g = [];
      for (let i = 1; i < 6; i++) {
        const x = CHART.x0 + (i / 6) * (CHART.x1 - CHART.x0);
        g.push(`<line class="grid-line" x1="${x}" y1="${CHART.y1}" x2="${x}" y2="${CHART.y0}"/>`);
      }
      for (let i = 1; i < 4; i++) {
        const y = CHART.y0 - (i / 4) * (CHART.y0 - CHART.y1);
        g.push(`<line class="grid-line" x1="${CHART.x0}" y1="${y}" x2="${CHART.x1}" y2="${y}"/>`);
      }
      for (let i = 0; i <= 6; i++) {
        const x = CHART.x0 + (i / 6) * (CHART.x1 - CHART.x0);
        g.push(`<text class="axis-label" x="${x}" y="${CHART.y0 + 12}" text-anchor="middle">${(i * 0.5).toFixed(1)}</text>`);
      }
      for (let i = 0; i <= 4; i++) {
        const y = CHART.y0 - (i / 4) * (CHART.y0 - CHART.y1);
        g.push(`<text class="axis-label" x="${CHART.x0 - 6}" y="${y + 3}" text-anchor="end">${(i * 0.2).toFixed(1)}</text>`);
      }
      elements.chartGrid.innerHTML = g.join("");
    }

    function drawChart() {
      const pts = state.samples.map(s => {
        const x = uToX(s.U);
        const y = iToY(s.I);
        const color = s.config === "ext" ? "#0f9fba" : "#d97706";
        return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${color}" stroke="#fff" stroke-width="1.2" opacity="0.92"/>`;
      });
      elements.dataPoints.innerHTML = pts.join("");
      elements.pointCount.textContent = `${state.samples.length} 个数据点（青=外接 / 橙=内接）`;

      const extPts = state.samples.filter(s => s.config === "ext");
      const intPts = state.samples.filter(s => s.config === "int");
      let fitHtml = "";
      let R_meas = null;
      let cfgUsed = null;

      if (extPts.length >= 2) {
        const k = fitSlope(extPts);
        if (k && k > 0) {
          const R = 1 / k;
          if (R_meas === null) { R_meas = R; cfgUsed = "ext"; }
          const x0 = uToX(0), y0 = iToY(0);
          const x1 = uToX(CHART.uMax), y1 = iToY(k * CHART.uMax);
          fitHtml += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="#0f9fba" stroke-width="2.2" opacity="0.9"/>`;
          fitHtml += `<text x="${x1 - 6}" y="${Math.max(y1 + 14, 32)}" text-anchor="end" font-size="10" font-weight="700" fill="#0f9fba">R_外=${R.toFixed(2)} Ω</text>`;
        }
      }
      if (intPts.length >= 2) {
        const k = fitSlope(intPts);
        if (k && k > 0) {
          const R = 1 / k;
          if (R_meas === null) { R_meas = R; cfgUsed = "int"; }
          const x0 = uToX(0), y0 = iToY(0);
          const x1 = uToX(CHART.uMax), y1 = iToY(k * CHART.uMax);
          fitHtml += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="#d97706" stroke-width="2.2" opacity="0.9" stroke-dasharray="6 3"/>`;
          fitHtml += `<text x="${x1 - 6}" y="${Math.max(y1 + 28, 46)}" text-anchor="end" font-size="10" font-weight="700" fill="#d97706">R_内=${R.toFixed(2)} Ω</text>`;
        }
      }
      elements.chartLabels.innerHTML = fitHtml;

      // 分别处理外接/内接拟合结果
      const S = Math.PI * Math.pow(state.d * 1e-3 / 2, 2);
      const Rxt = R_true();
      let extR = null, intR = null;
      if (extPts.length >= 2) {
        const k = fitSlope(extPts);
        if (k && k > 0) extR = 1 / k;
      }
      if (intPts.length >= 2) {
        const k = fitSlope(intPts);
        if (k && k > 0) intR = 1 / k;
      }

      if (extR !== null || intR !== null) {
        // 同时有两种数据时优先显示外接的 ρ；只有内接时显示内接的
        const R_for_rho = extR !== null ? extR : intR;
        const rho = R_for_rho * S / Math.max(state.L, 1e-9);
        elements.rhoReadout.textContent = `${rho.toExponential(2)} Ω·m`;
        // 详细行：同时显示外接和内接的 R 和偏差（如果有）
        const parts = [];
        if (extR !== null) {
          const errE = ((extR - Rxt) / Rxt * 100).toFixed(1);
          parts.push(`R_外接=${extR.toFixed(3)} Ω (${errE}%)`);
        }
        if (intR !== null) {
          const errI = ((intR - Rxt) / Rxt * 100).toFixed(1);
          parts.push(`R_内接=${intR.toFixed(3)} Ω (${errI}%)`);
        }
        parts.push(`S=${(S*1e6).toFixed(3)} mm²`);
        elements.formulaDetail.textContent = parts.join(" · ");
      } else {
        elements.rhoReadout.textContent = "— Ω·m";
        elements.formulaDetail.textContent = `R = U/I · S = π(d/2)² · L = ${state.L.toFixed(3)} m`;
      }
    }

    // ============================================================
    // 状态提示（evidence 内嵌，非独立 region 视觉块）
    // ============================================================
    function updateInsight() {
      const Rx = R_true();
      const ideal = state.precision === 1;
      if (!state.running && state.t === 0 && state.samples.length === 0) {
        elements.insight.textContent = "未启动：按下「启动」接通电路，拖动滑片改变电压。";
        return;
      }
      if (state.samples.length < 2) {
        elements.insight.textContent = `调节滑片到不同位置，按「采样」记录至少 2 组 (U, I) 数据。当前金属丝 R_x ≈ ${Rx.toFixed(2)} Ω。`;
        return;
      }
      if (ideal) {
        elements.insight.textContent = `理想仪表：V 表内阻 ∞、A 表内阻 0，无系统误差。R_测 = R_x = ${Rx.toFixed(3)} Ω，ρ_测 ≈ ρ₀。`;
        return;
      }
      if (state.config === "ext") {
        const ratio = Rx / CONST.R_V;
        elements.insight.textContent = `外接法：R_测 = Rx‖R_V < R_x（偏小）。Rx/R_V = ${ratio.toFixed(4)}，Rx≪R_V 时误差很小。结论：测小电阻用外接。`;
      } else {
        const ratio = CONST.R_A / Rx;
        elements.insight.textContent = `内接法：R_测 = R_x + R_A > R_x（偏大）。R_A/R_x = ${ratio.toFixed(3)}。结论：测大电阻用内接（本实验 Rx 较小，内接误差明显）。`;
      }
    }

    // ============================================================
    // 生命周期
    // ============================================================
    function init() {
      buildMeterTicks();
      initChartGrid();
      bindControls();
      setParameters({ rheo: 25, L: 1.000, d: 0.500, precision: 0 });
      reset();
      requestAnimationFrame(frame);
    }

    function start() {
      state.running = true;
      elements.status.textContent = "运行中";
      elements.startBtn.setAttribute("aria-pressed", "true");
    }
    function pause() {
      state.running = false;
      elements.status.textContent = "已暂停";
      elements.startBtn.setAttribute("aria-pressed", "false");
    }
    function reset() {
      pause();
      state.t = 0;
      state.lastTimestamp = null;
      state.samples = [];
      state.particlePhase = 0;
      state.voltDisplay = 0;
      state.ampDisplay = 0;
      state.voltTarget = 0;
      state.ampTarget = 0;
      elements.status.textContent = "未启动";
      render();
    }

    function update(dt) {
      if (!state.running) return;
      const dts = clamp(finite(dt, 0), 0, 0.05);
      state.t += dts;

      const r = solveCircuit();
      state.voltTarget = r.U;
      state.ampTarget = r.I;

      const alpha = 1 - Math.exp(-dts / 0.12);
      state.voltDisplay += (state.voltTarget - state.voltDisplay) * alpha;
      state.ampDisplay += (state.ampTarget - state.ampDisplay) * alpha;

      const speed = state.ampDisplay * 8;
      state.particlePhase += speed * PERIM_LEN * dts;
    }

    function render() {
      drawCircuit();
      drawParticles();

      const vAngle = -90 + (clamp(state.voltDisplay, 0, 3) / 3) * 180;
      elements.voltNeedle.setAttribute("transform", `rotate(${vAngle.toFixed(2)} 100 100)`);
      const aAngle = -90 + (clamp(state.ampDisplay, 0, 0.8) / 0.8) * 180;
      elements.ampNeedle.setAttribute("transform", `rotate(${aAngle.toFixed(2)} 100 100)`);

      elements.voltReadout.textContent = `${state.voltDisplay.toFixed(3)} V`;
      elements.ampReadout.textContent = `${state.ampDisplay.toFixed(3)} A`;

      drawChart();
      updateInsight();

      elements.rheoOutput.textContent = `${state.rheo.toFixed(1)} Ω`;
      elements.lenOutput.textContent = `${state.L.toFixed(3)} m`;
      elements.diaOutput.textContent = `${state.d.toFixed(3)} mm`;
      elements.precisionOutput.textContent = state.precision === 0 ? "教学档" : "理想档";
    }

    function setParameters(values) {
      const dRheo = parameterSchema[0], dL = parameterSchema[1], dD = parameterSchema[2], dP = parameterSchema[3];
      state.rheo = clamp(finite(Number(values.rheo), dRheo.default), dRheo.min, dRheo.max);
      state.L = clamp(finite(Number(values.L), dL.default), dL.min, dL.max);
      state.d = clamp(finite(Number(values.d), dD.default), dD.min, dD.max);
      state.precision = clamp(finite(Number(values.precision), dP.default), dP.min, dP.max);
      elements.rheoInput.value = String(state.rheo);
      elements.lenInput.value = String(state.L);
      elements.diaInput.value = String(state.d);
      elements.precisionInput.value = String(state.precision);
      render();
    }

    function getState() {
      return { ...state, samples: state.samples.map(s => ({...s})) };
    }
    function getReadouts() {
      const r = solveCircuit();
      return { U: r.U, I: r.I, R_true: R_true(), rho0: CONST.rho0 };
    }

    // ============================================================
    // 模型校验
    // ============================================================
    function runModelChecks() {
      const savedPrecision = state.precision;
      const savedConfig = state.config;
      const savedL = state.L;

      state.precision = 1;
      state.config = "ext";
      const rIdeal = solveCircuit();
      const Rx = R_true();
      const errIdeal = Math.abs(rIdeal.U / Math.max(rIdeal.I, 1e-9) - Rx) / Math.max(Rx, 1e-9);

      state.precision = 0;
      state.config = "ext";
      const rExt = solveCircuit();
      const Rext = rExt.U / Math.max(rExt.I, 1e-9);
      const extSmaller = Rext < Rx;

      state.config = "int";
      const rInt = solveCircuit();
      const Rint = rInt.U / Math.max(rInt.I, 1e-9);
      const intLarger = Rint > Rx;

      state.L = 0.5;
      const Rx2 = R_true();
      const S = Math.PI * Math.pow(state.d * 1e-3 / 2, 2);
      const rhoCheck = Math.abs(Rx2 * S / 0.5 - CONST.rho0) / CONST.rho0;

      state.precision = savedPrecision;
      state.config = savedConfig;
      state.L = savedL;

      return [
        { name: "ideal meter equals true R", pass: errIdeal < 0.005, expected: "<0.5%", actual: `${(errIdeal*100).toFixed(3)}%`, tolerance: "0.5%" },
        { name: "ext config R_measured < R_true", pass: extSmaller, expected: "R_测 < R_x", actual: `${Rext.toFixed(4)} < ${Rx.toFixed(4)}`, tolerance: "strict" },
        { name: "int config R_measured > R_true", pass: intLarger, expected: "R_测 > R_x", actual: `${Rint.toFixed(4)} > ${Rx.toFixed(4)}`, tolerance: "strict" },
        { name: "rho invariant under L change", pass: rhoCheck < 1e-9, expected: 0, actual: rhoCheck.toExponential(2), tolerance: 1e-9 },
      ];
    }

    // ============================================================
    // 事件绑定
    // ============================================================
    function setConfig(cfg) {
      state.config = cfg;
      if (cfg === "ext") {
        elements.btnExt.classList.add("active");
        elements.btnInt.classList.remove("active");
        elements.btnExt.setAttribute("aria-pressed", "true");
        elements.btnInt.setAttribute("aria-pressed", "false");
      } else {
        elements.btnInt.classList.add("active");
        elements.btnExt.classList.remove("active");
        elements.btnInt.setAttribute("aria-pressed", "true");
        elements.btnExt.setAttribute("aria-pressed", "false");
      }
      render();
    }

    function takeSample() {
      state.samples.push({ U: state.voltDisplay, I: state.ampDisplay, config: state.config });
      if (state.samples.length > 60) state.samples.shift();
      render();
    }

    function bindControls() {
      elements.startBtn.addEventListener("click", start);
      elements.pauseBtn.addEventListener("click", pause);
      elements.resetBtn.addEventListener("click", reset);
      elements.sampleBtn.addEventListener("click", takeSample);
      elements.rheoInput.addEventListener("input", () => setParameters({ rheo: Number(elements.rheoInput.value), L: state.L, d: state.d, precision: state.precision }));
      elements.lenInput.addEventListener("input", () => setParameters({ rheo: state.rheo, L: Number(elements.lenInput.value), d: state.d, precision: state.precision }));
      elements.diaInput.addEventListener("input", () => setParameters({ rheo: state.rheo, L: state.L, d: Number(elements.diaInput.value), precision: state.precision }));
      elements.precisionInput.addEventListener("input", () => setParameters({ rheo: state.rheo, L: state.L, d: state.d, precision: Number(elements.precisionInput.value) }));
      elements.btnExt.addEventListener("click", () => setConfig("ext"));
      elements.btnInt.addEventListener("click", () => setConfig("int"));
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
    init();
  })();
  </script>
</body>
</html>
