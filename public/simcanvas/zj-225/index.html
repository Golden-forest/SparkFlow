  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>动量守恒定律演示</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #eef3f8;
      --sim-surface: #ffffff;
      --sim-surface-soft: #f8fafc;
      --sim-text: #172033;
      --sim-muted: #657188;
      --sim-border: #dfe6ef;
      --sim-grid: #e8edf4;
      --sim-accent: #0f9fba;
      --sim-accent-deep: #08758a;
      --sim-accent-soft: #d9f4f7;
      --sim-positive: #0f9fba;
      --sim-warning: #f59e0b;
      --sim-danger: #dc2626;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
      --sim-car1: #2563eb;
      --sim-car1-soft: #dbeafe;
      --sim-car2: #e11d48;
      --sim-car2-soft: #fce7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
        var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
    .status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 12px; }
    .panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
    #scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); touch-action: none; }
    .side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; }
    .readouts { padding: 17px; }
    .readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric { padding: 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
    .metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
    .metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .metric.car1 { border-color: rgba(37,99,235,.18); }
    .metric.car2 { border-color: rgba(225,29,72,.18); }
    .metric.total { border-color: rgba(15,159,186,.22); background: linear-gradient(145deg, #eef9fb, #e0f4f7); }
    .bar-chart-panel { padding: 17px; display: flex; flex-direction: column; gap: 10px; }
    .bar-chart-panel h2 { margin: 0; font-size: 1rem; }
    .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 140px; padding: 8px 4px 0; border-bottom: 2px solid var(--sim-border); }
    .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .bar-pair { display: flex; gap: 3px; align-items: flex-end; height: 110px; width: 100%; justify-content: center; }
    .bar { width: 18px; border-radius: 4px 4px 0 0; transition: height 0.3s ease; min-height: 2px; position: relative; }
    .bar.car1 { background: var(--sim-car1); }
    .bar.car2 { background: var(--sim-car2); }
    .bar-label { font-size: 0.7rem; color: var(--sim-muted); text-align: center; }
    .bar-value { font-size: 0.72rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .model-note { padding: 14px; display: grid; align-content: start; gap: 14px; }
    .model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
    .insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; }
    .controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(140px, 1fr) minmax(140px, 1fr) minmax(120px, 0.8fr); gap: 16px; align-items: center; border-radius: 17px; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
    button:hover { border-color: #c7d2e2; background: #eef3f9; }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
    .control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
    .toggle-group { display: flex; gap: 4px; }
    .toggle-group button { padding: 8px 10px; font-size: 0.78rem; }
    .toggle-group button.active { border-color: var(--sim-accent-deep); background: var(--sim-accent-soft); color: var(--sim-accent-deep); }
    @media (max-width: 860px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main, .app[data-layout] .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
      .scene-panel { min-height: 0; }
      #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="app" data-layout="scene-first" data-model-tier="analytic">
    <header class="header" data-region="header">
      <div>
        <h1>动量守恒定律演示</h1>
        <p>设置两辆小车的质量与初速度，观察碰撞前后的动量变化</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">待机</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head"><h2 id="scene-title">小车碰撞场景</h2><span>拖动小车调整位置 · 速度矢量显示方向与大小</span></div>
        <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
          <desc id="scene-desc">两辆小车在水平轨道上运动并碰撞，速度矢量箭头显示方向与大小。</desc>
          <defs>
            <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"></path></marker>
            <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#e11d48"></path></marker>
            <linearGradient id="car1Body" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3b82f6"></stop><stop offset="1" stop-color="#1d4ed8"></stop></linearGradient>
            <linearGradient id="car2Body" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f43f5e"></stop><stop offset="1" stop-color="#be123c"></stop></linearGradient>
          </defs>
          <line x1="20" y1="320" x2="740" y2="320" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"></line>
          <g id="ticks"></g>
          <line x1="380" y1="300" x2="380" y2="340" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"></line>
          <text x="380" y="358" text-anchor="middle" fill="#94a3b8" font-size="11">碰撞点</text>
          <g id="car1Group" style="cursor: grab;">
            <rect id="car1BodyRect" x="0" y="0" width="80" height="44" rx="8" fill="url(#car1Body)" stroke="#1e40af" stroke-width="1.5"></rect>
            <rect x="12" y="6" width="56" height="16" rx="4" fill="#93c5fd" opacity="0.6"></rect>
            <circle cx="18" cy="48" r="8" fill="#1e3a5f" stroke="#0f172a" stroke-width="1.5"></circle>
            <circle cx="62" cy="48" r="8" fill="#1e3a5f" stroke="#0f172a" stroke-width="1.5"></circle>
            <text id="car1Label" x="40" y="30" text-anchor="middle" fill="white" font-size="14" font-weight="700">m₁</text>
            <line id="v1Arrow" x1="0" y1="0" x2="0" y2="0" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)" opacity="0"></line>
            <text id="v1Text" x="0" y="0" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="700" opacity="0"></text>
          </g>
          <g id="car2Group" style="cursor: grab;">
            <rect id="car2BodyRect" x="0" y="0" width="80" height="44" rx="8" fill="url(#car2Body)" stroke="#9f1239" stroke-width="1.5"></rect>
            <rect x="12" y="6" width="56" height="16" rx="4" fill="#fda4af" opacity="0.6"></rect>
            <circle cx="18" cy="48" r="8" fill="#4c0519" stroke="#0f172a" stroke-width="1.5"></circle>
            <circle cx="62" cy="48" r="8" fill="#4c0519" stroke="#0f172a" stroke-width="1.5"></circle>
            <text id="car2Label" x="40" y="30" text-anchor="middle" fill="white" font-size="14" font-weight="700">m₂</text>
            <line id="v2Arrow" x1="0" y1="0" x2="0" y2="0" stroke="#e11d48" stroke-width="4" marker-end="url(#arrowRed)" opacity="0"></line>
            <text id="v2Text" x="0" y="0" text-anchor="middle" fill="#9f1239" font-size="12" font-weight="700" opacity="0"></text>
          </g>
          <text id="phaseLabel" x="380" y="40" text-anchor="middle" fill="#475569" font-size="14" font-weight="600">碰撞前</text>
        </svg>
      </section>

      <aside class="side" data-region="evidence">
        <section class="panel bar-chart-panel" aria-label="动量柱状图">
          <h2>动量柱状图 (kg·m/s)</h2>
          <div class="bar-chart" id="barChart">
            <div class="bar-group">
              <div class="bar-pair">
                <div class="bar car1" id="bar1Before" style="height: 2px;"></div>
                <div class="bar car2" id="bar2Before" style="height: 2px;"></div>
              </div>
              <div class="bar-label">碰撞前</div>
            </div>
            <div class="bar-group">
              <div class="bar-pair">
                <div class="bar car1" id="bar1After" style="height: 2px;"></div>
                <div class="bar car2" id="bar2After" style="height: 2px;"></div>
              </div>
              <div class="bar-label">碰撞后</div>
            </div>
          </div>
          <div style="display: flex; justify-content: space-around; font-size: 0.72rem; color: var(--sim-muted);">
            <span style="color: var(--sim-car1);">■ 小车1</span>
            <span style="color: var(--sim-car2);">■ 小车2</span>
          </div>
        </section>

        <section class="panel readouts" aria-label="实时数据">
          <div class="readout-grid">
            <div class="metric car1"><small>小车1动量 m₁v₁</small><strong id="p1Readout">0.00</strong></div>
            <div class="metric car2"><small>小车2动量 m₂v₂</small><strong id="p2Readout">0.00</strong></div>
            <div class="metric car1"><small>小车1速度</small><strong id="v1Readout">0.00</strong></div>
            <div class="metric car2"><small>小车2速度</small><strong id="v2Readout">0.00</strong></div>
            <div class="metric total" style="grid-column: span 2;"><small>系统总动量 Σp = m₁v₁ + m₂v₂</small><strong id="totalPReadout">0.00</strong></div>
          </div>
        </section>

        <section class="panel model-note" data-region="insight">
          <p id="insight" class="insight">设置参数后按"开始"，观察碰撞前后总动量是否相等。</p>
          <p>教学模型：一维碰撞。弹性碰撞同时满足动量守恒和动能守恒；完全非弹性碰撞后两车共速，仅动量守恒。速度向右为正。</p>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="模拟控制">
      <div class="actions">
        <button id="startBtn" class="primary" type="button">开始</button>
        <button id="pauseBtn" type="button">暂停</button>
        <button id="resetBtn" type="button">重置</button>
      </div>
      <div class="control">
        <label for="m1Input">小车1质量 m₁ <output id="m1Output">2.0 kg</output></label>
        <input id="m1Input" type="range" min="0.5" max="6" step="0.5" value="2">
      </div>
      <div class="control">
        <label for="m2Input">小车2质量 m₂ <output id="m2Output">3.0 kg</output></label>
        <input id="m2Input" type="range" min="0.5" max="6" step="0.5" value="3">
      </div>
      <div class="control">
        <label>碰撞类型</label>
        <div class="toggle-group">
          <button id="elasticBtn" class="active" type="button" aria-pressed="true">弹性</button>
          <button id="inelasticBtn" type="button" aria-pressed="false">非弹性</button>
        </div>
      </div>
      <div class="control">
        <label for="v1Input">小车1初速 v₁ <output id="v1Output">+3.0</output></label>
        <input id="v1Input" type="range" min="-6" max="6" step="0.5" value="3">
      </div>
      <div class="control">
        <label for="v2Input">小车2初速 v₂ <output id="v2Output">-2.0</output></label>
        <input id="v2Input" type="range" min="-6" max="6" step="0.5" value="-2">
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";

    // === 物理参数与状态 ===
    const SCALE = 40;          // 1 m = 40 px
    const CAR_W = 80;
    const TRACK_L = 20;
    const TRACK_R = 740;
    const COLLISION_X = 380;
    const TRACK_Y = 320;

    const state = {
      running: false,
      collided: false,
      collisionType: "elastic",
      t: 0,
      lastTimestamp: null,
      m1: 2, m2: 3,
      v1: 3, v2: -2,
      x1: 200, x2: 560,
      v1Current: 3, v2Current: -2,
      v1Before: 3, v2Before: -2,
      v1After: 0, v2After: 0,
      hasAfter: false,
      preCollisionP1: 0, preCollisionP2: 0, preCollisionTotal: 0,
      postCollisionP1: 0, postCollisionP2: 0, postCollisionTotal: 0,
      dragging: null
    };

    const el = {
      status: document.querySelector("#status"),
      car1Group: document.querySelector("#car1Group"),
      car2Group: document.querySelector("#car2Group"),
      v1Arrow: document.querySelector("#v1Arrow"),
      v2Arrow: document.querySelector("#v2Arrow"),
      v1Text: document.querySelector("#v1Text"),
      v2Text: document.querySelector("#v2Text"),
      phaseLabel: document.querySelector("#phaseLabel"),
      ticks: document.querySelector("#ticks"),
      p1Readout: document.querySelector("#p1Readout"),
      p2Readout: document.querySelector("#p2Readout"),
      v1Readout: document.querySelector("#v1Readout"),
      v2Readout: document.querySelector("#v2Readout"),
      totalPReadout: document.querySelector("#totalPReadout"),
      insight: document.querySelector("#insight"),
      bar1Before: document.querySelector("#bar1Before"),
      bar2Before: document.querySelector("#bar2Before"),
      bar1After: document.querySelector("#bar1After"),
      bar2After: document.querySelector("#bar2After"),
      m1Input: document.querySelector("#m1Input"),
      m2Input: document.querySelector("#m2Input"),
      v1Input: document.querySelector("#v1Input"),
      v2Input: document.querySelector("#v2Input"),
      m1Output: document.querySelector("#m1Output"),
      m2Output: document.querySelector("#m2Output"),
      v1Output: document.querySelector("#v1Output"),
      v2Output: document.querySelector("#v2Output"),
      startBtn: document.querySelector("#startBtn"),
      pauseBtn: document.querySelector("#pauseBtn"),
      resetBtn: document.querySelector("#resetBtn"),
      elasticBtn: document.querySelector("#elasticBtn"),
      inelasticBtn: document.querySelector("#inelasticBtn"),
      scene: document.querySelector("#scene")
    };

    function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
    function finite(v, fb) { return Number.isFinite(v) ? v : fb; }

    // === 碰撞解析解 ===
    function computeCollision(m1, m2, v1, v2, type) {
      if (type === "elastic") {
        const v1f = ((m1 - m2) * v1 + 2 * m2 * v2) / (m1 + m2);
        const v2f = ((m2 - m1) * v2 + 2 * m1 * v1) / (m1 + m2);
        return { v1: v1f, v2: v2f };
      } else {
        const vf = (m1 * v1 + m2 * v2) / (m1 + m2);
        return { v1: vf, v2: vf };
      }
    }

    // === 初始化轨道刻度 ===
    function initTicks() {
      const lines = [];
      for (let i = 0; i <= 18; i++) {
        const x = TRACK_L + i * 40;
        const h = (i % 5 === 0) ? 12 : 6;
        lines.push(`<line x1="${x}" y1="${TRACK_Y}" x2="${x}" y2="${TRACK_Y + h}" stroke="#cbd5e1" stroke-width="1.5"></line>`);
      }
      el.ticks.innerHTML = lines.join("");
    }

    // === 生命周期 ===
    function init() {
      initTicks();
      bindControls();
      bindDrag();
      reset();
      requestAnimationFrame(frame);
    }

    function start() {
      if (state.collided) reset();
      state.running = true;
      el.status.textContent = "运行中";
      el.startBtn.setAttribute("aria-pressed", "true");
    }

    function pause() {
      state.running = false;
      el.status.textContent = "已暂停";
      el.startBtn.setAttribute("aria-pressed", "false");
    }

    function reset() {
      pause();
      state.t = 0;
      state.collided = false;
      state.hasAfter = false;
      state.x1 = 200;
      state.x2 = 560;
      state.v1Current = state.v1;
      state.v2Current = state.v2;
      state.v1Before = state.v1;
      state.v2Before = state.v2;
      state.preCollisionP1 = state.m1 * state.v1;
      state.preCollisionP2 = state.m2 * state.v2;
      state.preCollisionTotal = state.preCollisionP1 + state.preCollisionP2;
      state.postCollisionP1 = 0;
      state.postCollisionP2 = 0;
      state.postCollisionTotal = 0;
      el.status.textContent = "待机";
      el.phaseLabel.textContent = "碰撞前";
      render();
    }

    function update(dt) {
      if (!state.running) return;
      const boundedDt = clamp(finite(dt, 0), 0, 0.05);
      state.t += boundedDt;

      if (!state.collided) {
        state.x1 += state.v1Current * boundedDt * SCALE;
        state.x2 += state.v2Current * boundedDt * SCALE;

        // 检测碰撞：小车1右边缘 >= 小车2左边缘
        const car1Right = state.x1 + CAR_W;
        const car2Left = state.x2;
        if (car1Right >= car2Left) {
          state.collided = true;
          state.v1Before = state.v1Current;
          state.v2Before = state.v2Current;
          const result = computeCollision(state.m1, state.m2, state.v1Current, state.v2Current, state.collisionType);
          state.v1After = result.v1;
          state.v2After = result.v2;
          state.v1Current = result.v1;
          state.v2Current = result.v2;
          state.hasAfter = true;
          state.postCollisionP1 = state.m1 * state.v1After;
          state.postCollisionP2 = state.m2 * state.v2After;
          state.postCollisionTotal = state.postCollisionP1 + state.postCollisionP2;
          el.phaseLabel.textContent = state.collisionType === "elastic" ? "碰撞后（弹性）" : "碰撞后（非弹性）";
          el.status.textContent = "已碰撞";
        }
      } else {
        state.x1 += state.v1Current * boundedDt * SCALE;
        state.x2 += state.v2Current * boundedDt * SCALE;
      }

      // 边界检测：小车离开轨道
      if (state.x1 + CAR_W < TRACK_L - 20 || state.x2 > TRACK_R + 20) {
        state.running = false;
        el.status.textContent = "结束";
      }
    }

    // === 渲染 ===
    function render() {
      // 小车位置
      el.car1Group.setAttribute("transform", `translate(${state.x1}, ${TRACK_Y - 44})`);
      el.car2Group.setAttribute("transform", `translate(${state.x2}, ${TRACK_Y - 44})`);

      // 速度矢量箭头
      renderVelocityArrow(el.v1Arrow, el.v1Text, state.x1 + CAR_W / 2, TRACK_Y - 60, state.v1Current, "#1e40af");
      renderVelocityArrow(el.v2Arrow, el.v2Text, state.x2 + CAR_W / 2, TRACK_Y - 60, state.v2Current, "#9f1239");

      // 读数
      const p1 = state.m1 * state.v1Current;
      const p2 = state.m2 * state.v2Current;
      el.p1Readout.textContent = p1.toFixed(2);
      el.p2Readout.textContent = p2.toFixed(2);
      el.v1Readout.textContent = state.v1Current.toFixed(2);
      el.v2Readout.textContent = state.v2Current.toFixed(2);
      el.totalPReadout.textContent = (p1 + p2).toFixed(2);

      // 柱状图
      const maxP = Math.max(
        Math.abs(state.preCollisionP1), Math.abs(state.preCollisionP2),
        Math.abs(state.postCollisionP1), Math.abs(state.postCollisionP2),
        0.5
      );
      const barH = 100;
      el.bar1Before.style.height = `${(Math.abs(state.preCollisionP1) / maxP) * barH + 2}px`;
      el.bar2Before.style.height = `${(Math.abs(state.preCollisionP2) / maxP) * barH + 2}px`;
      if (state.hasAfter) {
        el.bar1After.style.height = `${(Math.abs(state.postCollisionP1) / maxP) * barH + 2}px`;
        el.bar2After.style.height = `${(Math.abs(state.postCollisionP2) / maxP) * barH + 2}px`;
      } else {
        el.bar1After.style.height = "2px";
        el.bar2After.style.height = "2px";
      }

      // 洞察文本
      if (!state.collided && state.t === 0) {
        el.insight.textContent = "设置参数后按"开始"，观察碰撞前后总动量是否相等。";
      } else if (!state.collided) {
        el.insight.textContent = "碰撞前：总动量 = " + state.preCollisionTotal.toFixed(2) + " kg·m/s，小车正在运动。";
      } else {
        const diff = Math.abs(state.postCollisionTotal - state.preCollisionTotal);
        const conserved = diff < 0.01;
        el.insight.textContent = conserved
          ? `✓ 动量守恒！碰撞前 Σp = ${state.preCollisionTotal.toFixed(2)}，碰撞后 Σp = ${state.postCollisionTotal.toFixed(2)}`
          : `碰撞前 Σp = ${state.preCollisionTotal.toFixed(2)}，碰撞后 Σp = ${state.postCollisionTotal.toFixed(2)}`;
      }

      // 参数显示
      el.m1Output.textContent = `${state.m1.toFixed(1)} kg`;
      el.m2Output.textContent = `${state.m2.toFixed(1)} kg`;
      el.v1Output.textContent = `${state.v1 >= 0 ? "+" : ""}${state.v1.toFixed(1)}`;
      el.v2Output.textContent = `${state.v2 >= 0 ? "+" : ""}${state.v2.toFixed(1)}`;
    }

    function renderVelocityArrow(arrowEl, textEl, cx, cy, velocity, color) {
      const arrowLen = clamp(Math.abs(velocity) * 15, 0, 80);
      if (Math.abs(velocity) < 0.01) {
        arrowEl.setAttribute("opacity", "0");
        textEl.setAttribute("opacity", "0");
        return;
      }
      const dir = velocity > 0 ? 1 : -1;
      const startX = cx;
      const endX = cx + dir * arrowLen;
      arrowEl.setAttribute("x1", startX);
      arrowEl.setAttribute("y1", cy);
      arrowEl.setAttribute("x2", endX);
      arrowEl.setAttribute("y2", cy);
      arrowEl.setAttribute("opacity", "0.9");
      textEl.setAttribute("x", (startX + endX) / 2);
      textEl.setAttribute("y", cy - 8);
      textEl.textContent = `v=${velocity.toFixed(1)}`;
      textEl.setAttribute("opacity", "0.9");
    }

    // === 参数设置 ===
    function setParameters(values) {
      if (values.m1 !== undefined) state.m1 = clamp(finite(Number(values.m1), 2), 0.5, 6);
      if (values.m2 !== undefined) state.m2 = clamp(finite(Number(values.m2), 3), 0.5, 6);
      if (values.v1 !== undefined) state.v1 = clamp(finite(Number(values.v1), 3), -6, 6);
      if (values.v2 !== undefined) state.v2 = clamp(finite(Number(values.v2), -2), -6, 6);
      el.m1Input.value = String(state.m1);
      el.m2Input.value = String(state.m2);
      el.v1Input.value = String(state.v1);
      el.v2Input.value = String(state.v2);
      if (!state.running) reset();
      else render();
    }

    function setCollisionType(type) {
      state.collisionType = type;
      if (type === "elastic") {
        el.elasticBtn.classList.add("active");
        el.elasticBtn.setAttribute("aria-pressed", "true");
        el.inelasticBtn.classList.remove("active");
        el.inelasticBtn.setAttribute("aria-pressed", "false");
      } else {
        el.inelasticBtn.classList.add("active");
        el.inelasticBtn.setAttribute("aria-pressed", "true");
        el.elasticBtn.classList.remove("active");
        el.elasticBtn.setAttribute("aria-pressed", "false");
      }
    }

    // === 拖拽 ===
    function bindDrag() {
      const svg = el.scene;
      let dragCar = null;

      function getSVGPoint(evt) {
        const pt = svg.createSVGPoint();
        pt.x = evt.clientX;
        pt.y = evt.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }

      function onPointerDown(evt) {
        if (state.running) return;
        const target = evt.target.closest("#car1Group, #car2Group");
        if (!target) return;
        dragCar = target === el.car1Group ? 1 : 2;
        evt.preventDefault();
      }

      function onPointerMove(evt) {
        if (!dragCar) return;
        const p = getSVGPoint(evt);
        if (dragCar === 1) {
          state.x1 = clamp(p.x - CAR_W / 2, TRACK_L, COLLISION_X - CAR_W - 2);
        } else {
          state.x2 = clamp(p.x - CAR_W / 2, COLLISION_X + 2, TRACK_R - CAR_W);
        }
        render();
      }

      function onPointerUp() { dragCar = null; }

      svg.addEventListener("pointerdown", onPointerDown);
      svg.addEventListener("pointermove", onPointerMove);
      svg.addEventListener("pointerup", onPointerUp);
      svg.addEventListener("pointercancel", onPointerUp);
    }

    // === 控件绑定 ===
    function bindControls() {
      el.startBtn.addEventListener("click", start);
      el.pauseBtn.addEventListener("click", pause);
      el.resetBtn.addEventListener("click", reset);
      el.m1Input.addEventListener("input", () => setParameters({ m1: el.m1Input.value }));
      el.m2Input.addEventListener("input", () => setParameters({ m2: el.m2Input.value }));
      el.v1Input.addEventListener("input", () => setParameters({ v1: el.v1Input.value }));
      el.v2Input.addEventListener("input", () => setParameters({ v2: el.v2Input.value }));
      el.elasticBtn.addEventListener("click", () => { setCollisionType("elastic"); reset(); });
      el.inelasticBtn.addEventListener("click", () => { setCollisionType("inelastic"); reset(); });
    }

    // === 主循环 ===
    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    // === 模型检查 ===
    function runModelChecks() {
      const results = [];

      // 1. 弹性碰撞：动量守恒
      const e1 = computeCollision(2, 3, 3, -2, "elastic");
      const pBefore1 = 2 * 3 + 3 * (-2);
      const pAfter1 = 2 * e1.v1 + 3 * e1.v2;
      results.push({
        name: "弹性碰撞动量守恒",
        pass: Math.abs(pAfter1 - pBefore1) < 1e-10,
        expected: pBefore1,
        actual: pAfter1,
        tolerance: 1e-10
      });

      // 2. 弹性碰撞：动能守恒
      const keBefore1 = 0.5 * 2 * 9 + 0.5 * 3 * 4;
      const keAfter1 = 0.5 * 2 * e1.v1 * e1.v1 + 0.5 * 3 * e1.v2 * e1.v2;
      results.push({
        name: "弹性碰撞动能守恒",
        pass: Math.abs(keAfter1 - keBefore1) < 1e-10,
        expected: keBefore1,
        actual: keAfter1,
        tolerance: 1e-10
      });

      // 3. 非弹性碰撞：动量守恒
      const i1 = computeCollision(2, 3, 3, -2, "inelastic");
      const pAfter2 = 2 * i1.v1 + 3 * i1.v2;
      results.push({
        name: "非弹性碰撞动量守恒",
        pass: Math.abs(pAfter2 - pBefore1) < 1e-10,
        expected: pBefore1,
        actual: pAfter2,
        tolerance: 1e-10
      });

      // 4. 非弹性碰撞：共速
      results.push({
        name: "非弹性碰撞后共速",
        pass: Math.abs(i1.v1 - i1.v2) < 1e-10,
        expected: "v1' = v2'",
        actual: `${i1.v1} vs ${i1.v2}`,
        tolerance: 1e-10
      });

      // 5. 等质量弹性碰撞：速度交换
      const e2 = computeCollision(2, 2, 4, -2, "elastic");
      results.push({
        name: "等质量弹性碰撞速度交换",
        pass: Math.abs(e2.v1 - (-2)) < 1e-10 && Math.abs(e2.v2 - 4) < 1e-10,
        expected: "v1'=-2, v2'=4",
        actual: `v1'=${e2.v1}, v2'=${e2.v2}`,
        tolerance: 1e-10
      });

      // 6. 一车静止的弹性碰撞
      const e3 = computeCollision(1, 1, 5, 0, "elastic");
      results.push({
        name: "等质量一车静止弹性碰撞",
        pass: Math.abs(e3.v1 - 0) < 1e-10 && Math.abs(e3.v2 - 5) < 1e-10,
        expected: "v1'=0, v2'=5",
        actual: `v1'=${e3.v1}, v2'=${e3.v2}`,
        tolerance: 1e-10
      });

      // 7. 非弹性碰撞动能损失
      const keBefore3 = 0.5 * 2 * 9 + 0.5 * 3 * 4;
      const keAfter3 = 0.5 * 2 * i1.v1 * i1.v1 + 0.5 * 3 * i1.v2 * i1.v2;
      results.push({
        name: "非弹性碰撞动能损失",
        pass: keAfter3 < keBefore3,
        expected: "KE_after < KE_before",
        actual: `${keAfter3} < ${keBefore3}`,
        tolerance: "strict"
      });

      // 8. 大质量撞小质量静止
      const e4 = computeCollision(5, 1, 3, 0, "elastic");
      const pBefore4 = 5 * 3;
      const pAfter4 = 5 * e4.v1 + 1 * e4.v2;
      results.push({
        name: "大撞小静止动量守恒",
        pass: Math.abs(pAfter4 - pBefore4) < 1e-10,
        expected: pBefore4,
        actual: pAfter4,
        tolerance: 1e-10
      });

      return results;
    }

    function getState() {
      return {
        running: state.running,
        collided: state.collided,
        t: state.t,
        m1: state.m1, m2: state.m2,
        v1: state.v1Current, v2: state.v2Current,
        x1: state.x1, x2: state.x2,
        v1Before: state.v1Before, v2Before: state.v2Before,
        v1After: state.v1After, v2After: state.v2After,
        preCollisionTotal: state.preCollisionTotal,
        postCollisionTotal: state.postCollisionTotal
      };
    }

    function getReadouts() {
      return {
        p1: state.m1 * state.v1Current,
        p2: state.m2 * state.v2Current,
        totalP: state.m1 * state.v1Current + state.m2 * state.v2Current,
        v1: state.v1Current,
        v2: state.v2Current
      };
    }

    window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
    init();
  })();
  </script>
</body>
</html>
