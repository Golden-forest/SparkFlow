/* Pure event trajectories: event sides retain identical physical time. */
const ExamModel=(()=>{
 const H=Math.PI/6,S3=Math.sqrt(3),step=.0005;
 function rk(s,h,acc){const f=(a,b)=>[b,acc(a,b)],k1=f(...s),k2=f(s[0]+h*k1[0]/2,s[1]+h*k1[1]/2),k3=f(s[0]+h*k2[0]/2,s[1]+h*k2[1]/2),k4=f(s[0]+h*k3[0],s[1]+h*k3[1]);return s.map((v,i)=>v+h*(k1[i]+2*k2[i]+2*k3[i]+k4[i])/6);}
 function integrate(theta,w,target,acc){let s=[theta,w],t=0;const data=[{t,theta,w}];const direction=Math.sign(target-theta);for(let i=0;i<80000;i++){const next=rk(s,step,acc);if(direction*(next[0]-target)>=0){let lo=0,hi=step;for(let j=0;j<38;j++){const mid=(lo+hi)/2;if(direction*(rk(s,mid,acc)[0]-target)>=0)hi=mid;else lo=mid;}const h=(lo+hi)/2;const e=rk(s,h,acc);data.push({t:t+h,theta:target,w:e[1]});return {data,duration:t+h,acc};}t+=step;s=next;data.push({t,theta:s[0],w:s[1]});}throw Error('Event was not reached');}
 function at(curve,t){const a=curve.data;let lo=0,hi=a.length-1;while(lo<hi){const mid=Math.ceil((lo+hi)/2);if(a[mid].t<=t)lo=mid;else hi=mid-1;}const b=a[lo],h=Math.max(0,t-b.t),s=h?rk([b.theta,b.w],h,curve.acc):[b.theta,b.w];return {theta:s[0],w:s[1]};}
 function robot(){const p={m:1,M:4,R:.4,v0:4,g:10};const {m,M,R,v0,g}=p,v=Math.sqrt(v0*v0-2*g*R),V=2*m*v/M,curve=integrate(0,v0/R,Math.PI/2,a=>-g/R*Math.sin(a)),impact=curve.duration,apex=impact+V/g,land=impact+2*V/g,loss1=m*v*v-M*V*V/2,loss2=(M-2*m)*V*V/2,returnCurve=integrate(Math.PI/2,-V/R,0,a=>-g/R*Math.sin(a)),end=land+returnCurve.duration;
  const events=[{t:impact,label:'Bumper impact',pre:'Swing · before impact',post:'Flight · after impact'},{t:land,label:'Ground impact',pre:'Flight · before landing',post:'Landed · bobs retain velocity'}];
  function sample(time,side='after'){const t=Math.min(end,Math.max(0,time));let theta,w,y,vy,phase,loss,after=t>=impact&&(t!==impact||side!=='before'),landed=t>=land&&side!=='before';if(!after){({theta,w}=at(curve,t));y=0;vy=0;phase='Swing';loss=0;}else{const dt=t-impact;y=Math.max(0,V*dt-g*dt*dt/2);vy=V-g*dt;theta=Math.PI/2;w=0;phase=dt<V/g?'Rise':'Fall';loss=loss1;}if(landed){y=0;vy=0;phase=t===land?'Landed':'Return after landing';loss=loss1+loss2;({theta,w}=at(returnCurve,t-land));}
   const freeFlight=after&&!landed,bobV=freeFlight?vy:R*w,bobH=y+R*(1-Math.cos(theta)),a=after?-g:0;
   const bobK=m*bobV*bobV/2,bobP=m*g*bobH,shellK=(M-2*m)*vy*vy/2,shellP=(M-2*m)*g*y;
   return {t,theta,w,y,vy,bobV,bobH,phase,loss,after,landed,charge:0,U:0,T:freeFlight?0:m*(R*w*w+g*Math.cos(theta)),body:{A:{K:bobK,P:bobP,v:bobV,h:bobH,a:freeFlight?-g:-g*Math.sin(theta)},B:{K:bobK,P:bobP,v:bobV,h:bobH,a:freeFlight?-g:-g*Math.sin(theta)},shell:{K:shellK,P:shellP,v:vy,h:y,a:landed?0:a},system:{K:2*bobK+shellK,P:2*bobP+shellP,v:freeFlight?vy:2*m/M*bobV*Math.sin(theta),h:(2*m*bobH+(M-2*m)*y)/M,a:freeFlight?-g:2*m/M*R*(Math.cos(theta)*w*w-g/R*Math.sin(theta)**2)}}};}
  return {kind:'robot',p,duration:end,events,nodes:[{t:0,label:'Release'},{t:impact,label:'Bumpers'},{t:apex,label:'Apex'},{t:land,label:'Landing'},{t:end,label:'Return bottom'}],sample};
 }
 function bead(k=1){if(!Number.isFinite(k)||k<=0||k>3.2)throw Error('Invalid k');const p={m:1,d:.6,q:1e-6,g:9.8,k}, {m,d,q,g}=p,U0=m*g*d/(S3*q),ramp=2;const parts=[],events=[{t:ramp,label:'Contact N',pre:'Ramp · at N',post:'Release · charge −q'}];let t=ramp,theta=H,charge=-1,loss=0,work=m*g*d*(1-Math.cos(H));
  // First unmodified sweep N -> M is retained for question2.
  for(let i=0;i<4;i++){const mult=i===0?1:k;if(i>0&&k>3){parts.push({start:t,end:t,invalid:true,theta,charge,mult,loss,work});break;}const signedCharge=charge,target=charge>0?H:-H,curve=integrate(theta,0,target,a=>g/d*(signedCharge*mult/S3*Math.cos(a)-Math.sin(a))),x0=d*Math.sin(theta),duration=curve.duration,initial={theta,charge,mult,loss,work};const energy=m*g*mult/S3*(d*Math.sin(target)-x0)*charge;
   parts.push({start:t,end:t+duration,curve,...initial});t+=duration;work+=energy;loss+=energy;events.push({t,label:`Contact ${target>0?'N':'M'}`,pre:'Before contact',post:i===0?'Charge +q · voltage kU₀':'After contact · v = 0'});theta=target;charge=-charge;
  }
  function sample(time,side='after'){const ts=Math.min(t,Math.max(0,time));let a,w,mult,c,W,L,phase,invalid=false;if(ts<ramp||(ts===ramp&&side==='before')){a=H*Math.min(1,ts/ramp);w=0;mult=S3*Math.tan(a);c=1;L=0;W=m*g*d*(1-Math.cos(a));phase='Quasi-static ramp';}else{let part=parts.find(b=>b.end>ts||(b.end===ts&&side==='before'))||parts[parts.length-1];if(part.invalid){a=part.theta;w=0;invalid=true;c=part.charge;mult=part.mult;W=part.work;L=part.loss;phase='Slack · arc invalid';}else{const end=ts===part.end&&side!=='before';({theta:a,w}=at(part.curve,Math.min(part.end-part.start,ts-part.start)));mult=part.mult;c=part.charge;L=part.loss;W=part.work+m*g*mult/S3*c*d*(Math.sin(a)-Math.sin(part.theta));phase=part===parts[0]?'First swing N → M':'Changed voltage';if(end){const K=m*d*d*w*w/2;L+=K;w=0;c=-c;if(part===parts[0])mult=k;phase='Contact · charge reverses';}}}
   const v=d*w,K=m*v*v/2,P=m*g*d*(1-Math.cos(a)),radial=m*(g*Math.cos(a)+g*c*mult/S3*Math.sin(a)+d*w*w),requiredT=radial/Math.sqrt(2),T=invalid?0:requiredT,peakTheta=Math.min(Math.atan(k/S3),H),peak=m*g*d*(Math.cos(peakTheta)-Math.sqrt(3)/2+k/S3*(Math.sin(peakTheta)+.5));
   return {t:ts,theta:a,w,v,K,P,E:K+P,loss:L,work:W,U:mult*U0,charge:c,T,requiredT,invalid,phase,peak,peakTheta,body:{system:{K,P,v,h:d*(1-Math.cos(a)),a:phase==='Quasi-static ramp'?0:g*(c*mult/S3*Math.cos(a)-Math.sin(a))}}};}
  return {kind:'bead',p,U0,duration:t,events,nodes:[{t:0,label:'Ramp'},{t:ramp,label:'N · −q'},{t:parts[0].end,label:'M · kU₀'},{t:parts[1]?.end??t,label:k>3?'Slack':'N · +q'}],sample};
 }
