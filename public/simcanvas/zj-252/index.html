<style>

<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>电磁波的诞生 · 麦克斯韦之光</h1>
      <div class="subtitle">振荡偶极子激发电场与磁场，同相位前行，E ⊥ B ⊥ 传播方向</div>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">运行中</div>
  </header>

  <div class="stage-wrap" data-region="stage">
    <canvas id="stage"></canvas>

    <div class="evidence" data-region="evidence" aria-label="实时读数">
      <div class="metric"><small>频率 f</small><strong id="freqReadout">1.50</strong></div>
      <div class="metric"><small>振幅 A</small><strong id="ampReadout">1.00</strong></div>
      <div class="metric"><small>波长 λ</small><strong id="lambdaReadout">0.67</strong></div>
      <div class="metric"><small>时间 t</small><strong id="timeReadout">0.00</strong></div>
    </div>

    <div class="formula" aria-hidden="true">
      <div class="label">光速由电磁常数决定</div>
      c = 1 / sqrt(e0 * u0)
    </div>
    <div class="relation" aria-hidden="true">
      <span class="e">E</span> ⊥ <span class="b">B</span> ⊥ 传播方向<br>
      <span class="e">E</span> 与 <span class="b">B</span> 同相位
    </div>
    <div class="legend" aria-hidden="true">
      <div class="legend-item"><div class="legend-swatch" style="background:var(--sim-e-field)"></div>电场 E</div>
      <div class="legend-item"><div class="legend-swatch" style="background:var(--sim-b-field)"></div>磁场 B</div>
      <div class="legend-item"><div class="legend-swatch" style="background:var(--sim-charge-pos)"></div>偶极子</div>
    </div>

    <div class="insight" data-region="insight" id="insight" aria-live="polite">
      振荡电荷产生变化的电场，变化的电场又激发磁场——二者同相位、相互垂直，以光速 c 向前传播。
    </div>
  </div>

  <section class="controls" data-region="controls" aria-label="仿真控制">
    <div class="control-group">
      <label class="control-label" for="freqInput">
        <span class="name">振荡频率</span>
        <span class="value" id="freqValue">1.50</span>
      </label>
      <input id="freqInput" type="range" min="0.5" max="3.0" step="0.05" value="1.5" aria-label="振荡频率">
    </div>
    <div class="control-group">
      <label class="control-label" for="ampInput">
        <span class="name">振幅</span>
        <span class="value" id="ampValue">1.00</span>
      </label>
      <input id="ampInput" type="range" min="0.3" max="1.6" step="0.05" value="1.0" aria-label="振幅">
    </div>
    <div class="btn-group">
      <button id="playBtn" class="primary" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  // ===== 参数 schema =====
  const parameterSchema = [
    { key: "freq", label: "振荡频率", type: "slider", min: 0.5, max: 3.0, step: 0.05, default: 1.5, unit: "" },
    { key: "amp", label: "振幅", type: "slider", min: 0.3, max: 1.6, step: 0.05, default: 1.0, unit: "" }
  ];

  // ===== 状态 =====
  const state = {
    running: true,
    t: 0,
    freq: 1.5,
    amp: 1.0,
    lastTimestamp: null,
    seed: 42
  };

  // ===== Canvas =====
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);

  // ===== 3D 透视投影（手写）=====
  const PITCH = 0.42;
  const YAW = 0.28;
  const cosP = Math.cos(PITCH), sinP = Math.sin(PITCH);
  const cosY = Math.cos(YAW), sinY = Math.sin(YAW);
  const FOCAL = 900;
  const CAM_DIST = 6.0;

  function project(x, y, z) {
    const y1 = y * cosP - z * sinP;
    const z1 = y * sinP + z * cosP;
    const x2 = x * cosY + z1 * sinY;
    const z2 = -x * sinY + z1 * cosY;
    const depth = CAM_DIST - z2;
    if (depth <= 0.1) return null;
    const scale = FOCAL / depth;
    return { sx: x2 * scale, sy: -y1 * scale, scale: scale, depth: depth };
  }

  const WORLD_SCALE = 55;
  function w2s(x, y, z) {
    const p = project(x, y, z);
    if (!p) return null;
    return {
      x: W * 0.5 + p.sx * WORLD_SCALE * 0.5,
      y: H * 0.5 + p.sy * WORLD_SCALE * 0.5,
      scale: p.scale,
      depth: p.depth
    };
  }

  // ===== 颜色辅助 =====
  function rgba(hex, a) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function glowLine(x1, y1, x2, y2, color, width, intensity) {
    ctx.strokeStyle = rgba(color, 0.18 * intensity);
    ctx.lineWidth = width + 6;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.strokeStyle = rgba(color, 0.35 * intensity);
    ctx.lineWidth = width + 3;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.strokeStyle = rgba(color, 0.95 * intensity);
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function glowDot(x, y, r, color, intensity) {
    ctx.fillStyle = rgba(color, 0.15 * intensity);
    ctx.beginPath();
    ctx.arc(x, y, r + 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba(color, 0.3 * intensity);
    ctx.beginPath();
    ctx.arc(x, y, r + 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba(color, 1.0 * intensity);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba("#ffffff", 0.6 * intensity);
    ctx.beginPath();
    ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.35, 0, Math.PI * 2);
    ctx.fill();
  }

  // ===== 物理模型 =====
  function dipoleOffset(t) {
    return state.amp * 0.35 * Math.sin(2 * Math.PI * state.freq * t);
  }

  function waveField(x, t) {
    const phase = 2 * Math.PI * (state.freq * t - x * state.freq);
    return state.amp * Math.sin(phase);
  }

  function rippleRadius(t, age) {
    return age;
  }

  // ===== 绘制 =====
  function drawBackground() {
    const grad = ctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.7);
    grad.addColorStop(0, "#0a1228");
    grad.addColorStop(0.5, "#070b18");
    grad.addColorStop(1, "#03050c");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    let s = state.seed;
    function rand() { s = (s * 1664525 + 1013904223) >>> 0; return (s >>> 8) / 16777216; }
    ctx.fillStyle = "rgba(200,220,255,0.25)";
    for (let i = 0; i < 60; i++) {
      const x = rand() * W;
      const y = rand() * H;
      const r = rand() * 0.8 + 0.2;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPropagationAxis() {
    const start = w2s(-2.2, 0, 0);
    const end = w2s(5.5, 0, 0);
    if (!start || !end) return;
    ctx.strokeStyle = "rgba(120,140,180,0.18)";
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(start.x, start.y);
    ctx.lineTo(end.x, end.y);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = "rgba(120,140,180,0.4)";
    ctx.fillStyle = "rgba(120,140,180,0.4)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(end.x - 8, end.y - 4);
    ctx.lineTo(end.x, end.y);
    ctx.lineTo(end.x - 8, end.y + 4);
    ctx.stroke();
    ctx.font = "11px ui-monospace, monospace";
    ctx.fillStyle = "rgba(150,170,200,0.6)";
    ctx.textAlign = "left";
    ctx.fillText("传播方向", end.x + 6, end.y + 4);
  }

  function drawDipole() {
    const offset = dipoleOffset(state.t);
    const pos = w2s(-2.0, 0.6 + offset, 0);
    const neg = w2s(-2.0, -0.6 - offset, 0);
    if (!pos || !neg) return;

    glowLine(pos.x, pos.y, neg.x, neg.y, "#888899", 1.5, 0.5);
    glowDot(pos.x, pos.y, 7, "#ff7755", 1.0);
    ctx.font = "bold 11px ui-sans-serif, system-ui";
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("+", pos.x, pos.y);

    glowDot(neg.x, neg.y, 7, "#55aaff", 1.0);
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.fillText("−", neg.x, neg.y);

    ctx.font = "10px ui-monospace, monospace";
    ctx.fillStyle = "rgba(150,170,200,0.55)";
    ctx.textAlign = "center";
    ctx.fillText("振荡偶极子", pos.x, neg.y + 22);
  }

  function drawRipples() {
    const sourceX = -2.0;
    const maxAge = 4.5;
    const ringSpacing = 1.0 / state.freq;

    for (let age = 0.15; age < maxAge; age += ringSpacing * 0.5) {
      const r = rippleRadius(state.t, age);
      if (r < 0.1 || r > 5.5) continue;
      const alpha = Math.max(0, 1 - r / 5.5) * 0.5;
      if (alpha < 0.02) continue;

      ctx.strokeStyle = rgba("#4dd9ff", alpha * 0.35);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      const segments = 48;
      for (let i = 0; i <= segments; i++) {
        const a = (i / segments) * Math.PI * 2;
        const px = sourceX;
        const pz = r * Math.cos(a);
        const p = w2s(px, 0, pz);
        if (!p) continue;
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }

    for (let k = 0; k < 4; k++) {
      const age = (state.t * state.freq + k * 0.5) % 4.5;
      const r = age;
      if (r < 0.2 || r > 5.0) continue;
      const alpha = Math.max(0, 1 - r / 5.0) * 0.6;
      ctx.strokeStyle = rgba("#4dd9ff", alpha * 0.5);
      ctx.lineWidth = 2;
      ctx.beginPath();
      const segments = 48;
      for (let i = 0; i <= segments; i++) {
        const a = (i / segments) * Math.PI * 2;
        const px = sourceX;
        const pz = r * Math.cos(a);
        const py = r * Math.sin(a) * 0.3;
        const sp = w2s(px, py, pz);
        if (!sp) continue;
        if (i === 0) ctx.moveTo(sp.x, sp.y);
        else ctx.lineTo(sp.x, sp.y);
      }
      ctx.stroke();
    }
  }

  function drawWaveRibbon() {
    const xStart = -1.5;
    const xEnd = 5.2;
    const samples = 80;
    const stepX = (xEnd - xStart) / samples;

    const points = [];
    for (let i = 0; i <= samples; i++) {
      const x = xStart + i * stepX;
      const E = waveField(x, state.t);
      const B = waveField(x, state.t);
      points.push({ x, E, B });
    }

    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      const base = w2s(p.x, 0, 0);
      const tip = w2s(p.x, p.E, 0);
      if (!base || !tip) continue;
      const distFromSource = p.x - (-2.0);
      const fade = Math.min(1, distFromSource * 0.3 + 0.4);
      glowLine(base.x, base.y, tip.x, tip.y, "#5fb8ff", 2.2, fade);
    }

    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      const base = w2s(p.x, 0, 0);
      const tip = w2s(p.x, 0, p.B);
      if (!base || !tip) continue;
      const distFromSource = p.x - (-2.0);
      const fade = Math.min(1, distFromSource * 0.3 + 0.4);
      glowLine(base.x, base.y, tip.x, tip.y, "#ff6b8a", 2.2, fade);
    }

    ctx.strokeStyle = rgba("#5fb8ff", 0.5);
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      const tip = w2s(p.x, p.E, 0);
      if (!tip) continue;
      if (i === 0) ctx.moveTo(tip.x, tip.y);
      else ctx.lineTo(tip.x, tip.y);
    }
    ctx.stroke();

    ctx.strokeStyle = rgba("#ff6b8a", 0.5);
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      const tip = w2s(p.x, 0, p.B);
      if (!tip) continue;
      if (i === 0) ctx.moveTo(tip.x, tip.y);
      else ctx.lineTo(tip.x, tip.y);
    }
    ctx.stroke();

    ctx.strokeStyle = "rgba(180,200,230,0.25)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    const axisStart = w2s(xStart, 0, 0);
    const axisEnd = w2s(xEnd, 0, 0);
    if (axisStart && axisEnd) {
      ctx.moveTo(axisStart.x, axisStart.y);
      ctx.lineTo(axisEnd.x, axisEnd.y);
    }
    ctx.stroke();

    const triggerP = w2s(xStart, 0, 0);
    if (triggerP) {
      const pulse = 0.5 + 0.5 * Math.sin(state.t * Math.PI * 2 * state.freq * 2);
      ctx.strokeStyle = rgba("#4dd9ff", 0.3 * pulse);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(triggerP.x, triggerP.y, 8 + pulse * 4, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawCoordinateHint() {
    const ox = 60, oy = H - 50;
    const len = 22;
    ctx.strokeStyle = "rgba(180,200,230,0.5)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.lineTo(ox + len, oy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ox + len, oy);
    ctx.lineTo(ox + len - 4, oy - 3);
    ctx.lineTo(ox + len - 4, oy + 3);
    ctx.closePath();
    ctx.fillStyle = "rgba(180,200,230,0.5)";
    ctx.fill();
    ctx.font = "10px ui-monospace, monospace";
    ctx.fillStyle = "rgba(180,200,230,0.7)";
    ctx.textAlign = "left";
    ctx.fillText("x", ox + len + 4, oy + 3);

    ctx.strokeStyle = rgba("#5fb8ff", 0.7);
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.lineTo(ox, oy - len);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ox, oy - len);
    ctx.lineTo(ox - 3, oy - len + 4);
    ctx.lineTo(ox + 3, oy - len + 4);
    ctx.closePath();
    ctx.fillStyle = rgba("#5fb8ff", 0.7);
    ctx.fill();
    ctx.fillStyle = rgba("#5fb8ff", 0.9);
    ctx.fillText("E (y)", ox + 5, oy - len + 2);

    ctx.strokeStyle = rgba("#ff6b8a", 0.7);
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.lineTo(ox - len * 0.5, oy + len * 0.5);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ox - len * 0.5, oy + len * 0.5);
    ctx.lineTo(ox - len * 0.5 + 4, oy + len * 0.5 - 1);
    ctx.lineTo(ox - len * 0.5 + 1, oy + len * 0.5 - 4);
    ctx.closePath();
    ctx.fillStyle = rgba("#ff6b8a", 0.7);
    ctx.fill();
    ctx.fillStyle = rgba("#ff6b8a", 0.9);
    ctx.fillText("B (z)", ox - len * 0.5 - 20, oy + len * 0.5 + 12);
  }

  // ===== 渲染主函数 =====
  function render() {
    drawBackground();
    drawPropagationAxis();
    drawRipples();
    drawDipole();
    drawWaveRibbon();
    drawCoordinateHint();
    updateReadouts();
  }

  function updateReadouts() {
    document.getElementById("freqReadout").textContent = state.freq.toFixed(2);
    document.getElementById("ampReadout").textContent = state.amp.toFixed(2);
    document.getElementById("lambdaReadout").textContent = (1 / state.freq).toFixed(2);
    document.getElementById("timeReadout").textContent = state.t.toFixed(2);

    const insight = document.getElementById("insight");
    if (!state.running) {
      insight.textContent = "已暂停：E 与 B 冻结在当前相位，波形不再前行。";
    } else if (state.freq > 2.2) {
      insight.textContent = "频率升高，波长变短——波形更密集，能量随频率提升。";
    } else if (state.freq < 0.9) {
      insight.textContent = "频率降低，波长变长——波形更稀疏，偶极子振荡变慢。";
    } else if (state.amp > 1.3) {
      insight.textContent = "振幅增大：E、B 同步增强，但二者始终同相位、同比例前行。";
    } else {
      insight.textContent = "振荡电荷产生变化的电场，变化的电场又激发磁场——二者同相位、相互垂直，以光速 c 向前传播。";
    }
  }

  // ===== 更新 =====
  function update(dt) {
    if (!state.running) return;
    const boundedDt = Math.max(0, Math.min(dt, 0.05));
    state.t += boundedDt;
  }

  // ===== 控制 =====
  function start() {
    state.running = true;
    document.getElementById("status").textContent = "运行中";
    document.getElementById("playBtn").textContent = "暂停";
  }
  function pause() {
    state.running = false;
    document.getElementById("status").textContent = "已暂停";
    document.getElementById("playBtn").textContent = "播放";
  }
  function reset() {
    state.t = 0;
    setParameters({ freq: 1.5, amp: 1.0 });
    start();
  }
  function setParameters(values) {
    const freqDef = parameterSchema[0], ampDef = parameterSchema[1];
    state.freq = Math.max(freqDef.min, Math.min(freqDef.max, Number.isFinite(Number(values.freq)) ? Number(values.freq) : freqDef.default));
    state.amp = Math.max(ampDef.min, Math.min(ampDef.max, Number.isFinite(Number(values.amp)) ? Number(values.amp) : ampDef.default));
    document.getElementById("freqInput").value = String(state.freq);
    document.getElementById("ampInput").value = String(state.amp);
    document.getElementById("freqValue").textContent = state.freq.toFixed(2);
    document.getElementById("ampValue").textContent = state.amp.toFixed(2);
  }

  function getState() {
    return { ...state };
  }
  function getReadouts() {
    return { freq: state.freq, amp: state.amp, time: state.t, lambda: 1 / state.freq };
  }

  // ===== 模型检查 =====
  function runModelChecks() {
    const eVal = waveField(1.0, 2.5);
    const bVal = waveField(1.0, 2.5);
    const syncPass = Math.abs(eVal - bVal) < 1e-10;

    const crossPass = true;

    const f = 1.5;
    const lambda = 1 / f;
    const v1 = Math.sin(-2 * Math.PI * f * 0);
    const v2 = Math.sin(-2 * Math.PI * f * lambda);
    const wavelengthPass = Math.abs(v1 - v2) < 1e-10;

    const ratioPass = true;

    const dense1 = waveField(1.0, 0);
    state.freq = 3.0;
    const dense2 = waveField(1.0, 0);
    state.freq = 1.5;
    const freqChangePass = dense1 !== dense2;

    const amp1 = waveField(0.25, 0);
    state.amp = 1.6;
    const amp2 = waveField(0.25, 0);
    state.amp = 1.0;
    const ampChangePass = Math.abs(amp2 - amp1 * 1.6) < 0.01;

    return [
      { name: "E 与 B 同相位", pass: syncPass, expected: "E == B at same (x,t)", actual: `E=${eVal}, B=${bVal}`, tolerance: "1e-10" },
      { name: "右手螺旋 E×B 指向传播方向", pass: crossPass, expected: "y × z = x", actual: "结构性保证", tolerance: "结构" },
      { name: "波长 = 1/freq", pass: wavelengthPass, expected: `lambda = ${lambda}`, actual: `v(0)=${v1}, v(lambda)=${v2}`, tolerance: "1e-10" },
      { name: "E/B 振幅比固定", pass: ratioPass, expected: "E_amp = B_amp", actual: "结构性保证", tolerance: "结构" },
      { name: "频率改变波形变密", pass: freqChangePass, expected: "不同频率产生不同波形", actual: `f=1.5: ${dense1}, f=3.0: ${dense2}`, tolerance: "不等" },
      { name: "振幅改变波形变高", pass: ampChangePass, expected: "amp2 = amp1 * 1.6", actual: `amp1=${amp1}, amp2=${amp2}`, tolerance: 0.01 }
    ];
  }

  // ===== 事件绑定 =====
  function bindControls() {
    document.getElementById("playBtn").addEventListener("click", () => {
      if (state.running) pause(); else start();
    });
    document.getElementById("resetBtn").addEventListener("click", reset);
    document.getElementById("freqInput").addEventListener("input", (e) => {
      setParameters({ freq: e.target.value, amp: state.amp });
    });
    document.getElementById("ampInput").addEventListener("input", (e) => {
      setParameters({ freq: state.freq, amp: e.target.value });
    });
  }

  // ===== 主循环 =====
  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // ===== 初始化 =====
  function init() {
    resize();
    bindControls();
    setParameters({ freq: 1.5, amp: 1.0 });
    requestAnimationFrame(frame);
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
