<style>

  .scene-panel { min-height: 0; }

<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>电磁感应与楞次定律综合演示</h1>
      <p>拖动磁铁插入或拔出螺线管，观察感应电流方向与检流计偏转，验证 E = -N*dPhi/dt</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head"><h2 id="scene-title">装置示意</h2><span>条形磁铁 + 螺线管 + 检流计</span></div>
      <canvas id="scene" role="img" aria-labelledby="scene-title scene-desc"></canvas>
      <desc id="scene-desc" style="display:none">条形磁铁可插入或拔出螺线管，线圈感应电流方向用箭头表示，感应磁场用光环颜色区分，磁铁受力用箭头表示阻碍相对运动。</desc>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel chart-panel" aria-label="磁通量曲线">
        <div class="panel-head"><h2>磁通量 Phi - t 曲线</h2><span>单位: Wb</span></div>
        <canvas id="fluxChart"></canvas>
      </section>
      <section class="panel chart-panel" aria-label="感应电流曲线">
        <div class="panel-head"><h2>感应电流 i - t 曲线</h2><span>单位: A</span></div>
        <canvas id="currentChart"></canvas>
      </section>
      <section class="panel flow-panel" data-region="insight" aria-label="楞次定律判断流程">
        <div class="panel-head"><h2>楞次定律判断流程</h2><span>磁通变化 → 磁场方向 → 电流方向</span></div>
        <div class="flow-row">
          <div id="flowFlux" class="flow-box" style="border-color:var(--sim-border);color:var(--sim-muted);">磁通变化</div>
          <div class="flow-arrow">→</div>
          <div id="flowField" class="flow-box" style="border-color:var(--sim-border);color:var(--sim-muted);">感应磁场</div>
          <div class="flow-arrow">→</div>
          <div id="flowCurrent" class="flow-box" style="border-color:var(--sim-border);color:var(--sim-muted);">电流方向</div>
        </div>
        <div class="formula-bar">法拉第定律: <code>E = -N * dPhi/dt</code> · 楞次定律: 感应效果总是阻碍磁通变化</div>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="模拟控件">
    <div class="actions">
      <button id="insertBtn" class="primary" type="button">插入</button>
      <button id="extractBtn" class="primary" type="button">拔出</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control">
      <label for="speedInput">磁铁速度 <output id="speedOutput">0.5 m/s</output></label>
      <input id="speedInput" type="range" min="0.1" max="2.0" step="0.1" value="0.5">
    </div>
    <div class="control">
      <label for="turnsInput">线圈匝数 N <output id="turnsOutput">100</output></label>
      <input id="turnsInput" type="range" min="20" max="300" step="10" value="100">
    </div>
    <div class="control">
      <label for="polarityInput">磁极朝向 <output id="polarityOutput">N迎向</output></label>
      <input id="polarityInput" type="range" min="0" max="1" step="1" value="0">
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  // ===== 参数 schema =====
  const parameterSchema = [
    { key: "speed", label: "磁铁速度", type: "slider", min: 0.1, max: 2.0, step: 0.1, default: 0.5, unit: "m/s" },
    { key: "turns", label: "线圈匝数", type: "slider", min: 20, max: 300, step: 10, default: 100, unit: "" },
    { key: "polarity", label: "磁极朝向", type: "slider", min: 0, max: 1, step: 1, default: 0, unit: "" }
  ];

  // ===== 物理常量 =====
  const PHYS = {
    mu0: 1.2566e-6,
    magnetLength: 0.05,
    magnetRadius: 0.012,
    coilRadius: 0.025,
    resistance: 5.0
  };

  // ===== 状态 =====
  const state = {
    running: false,
    mode: "idle",
    magnetX: -0.16,
    speed: 0.5,
    turns: 100,
    polarity: 0,
    t: 0,
    lastTimestamp: null,
    flux: 0,
    prevFlux: 0,
    dPhiDt: 0,
    emf: 0,
    current: 0,
    history: [],
    maxHistorySec: 12
  };

  // ===== DOM =====
  const els = {
    status: document.getElementById("status"),
    scene: document.getElementById("scene"),
    fluxChart: document.getElementById("fluxChart"),
    currentChart: document.getElementById("currentChart"),
    flowFlux: document.getElementById("flowFlux"),
    flowField: document.getElementById("flowField"),
    flowCurrent: document.getElementById("flowCurrent"),
    speedInput: document.getElementById("speedInput"),
    speedOutput: document.getElementById("speedOutput"),
    turnsInput: document.getElementById("turnsInput"),
    turnsOutput: document.getElementById("turnsOutput"),
    polarityInput: document.getElementById("polarityInput"),
    polarityOutput: document.getElementById("polarityOutput"),
    insertBtn: document.getElementById("insertBtn"),
    extractBtn: document.getElementById("extractBtn"),
    pauseBtn: document.getElementById("pauseBtn"),
    resetBtn: document.getElementById("resetBtn")
  };

  // ===== 工具函数 =====
  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function finite(v, fb) { return Number.isFinite(v) ? v : fb; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  // ===== 物理: 磁通量计算 =====
  // 磁铁中心在 x，N极朝向由 polarity 决定
  // polarity=0: N极朝右(+x)，S极朝左
  // polarity=1: S极朝右，N极朝左
  function computeFlux(x, turns, polarity) {
    const L = PHYS.magnetLength;
    const xN = x + (polarity === 0 ? L / 2 : -L / 2);
    const xS = x - (polarity === 0 ? L / 2 : -L / 2);
    const R = PHYS.coilRadius;
    const r = PHYS.magnetRadius;
    const A = Math.PI * R * R;
    // 偶极子近似: 磁矩 m = Br * V / mu0, V = pi r^2 L
    const V = Math.PI * r * r * L;
    const m = 1.2 * V / PHYS.mu0;
    const fluxN = (PHYS.mu0 * m / 2) * R * R / Math.pow(R * R + xN * xN, 1.5);
    const fluxS = -(PHYS.mu0 * m / 2) * R * R / Math.pow(R * R + xS * xS, 1.5);
    return turns * (fluxN + fluxS);
  }

  // 数值导数 (中心差分)
  function computeDPhiDt(x, turns, polarity, vx) {
    const eps = 0.0005;
    const f1 = computeFlux(x + eps, turns, polarity);
    const f2 = computeFlux(x - eps, turns, polarity);
    return (f1 - f2) / (2 * eps);
  }

  // ===== 模型更新 =====
  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05);
    state.t += boundedDt;

    // 磁铁运动
    const v = state.speed;
    if (state.mode === "insert") {
      state.magnetX += v * boundedDt;
      if (state.magnetX >= 0.16) { state.magnetX = 0.16; state.mode = "idle"; }
    } else if (state.mode === "extract") {
      state.magnetX -= v * boundedDt;
      if (state.magnetX <= -0.16) { state.magnetX = -0.16; state.mode = "idle"; }
    }

    // 物理量
    state.prevFlux = state.flux;
    state.flux = computeFlux(state.magnetX, state.turns, state.polarity);
    const vx = (state.mode === "insert") ? v : (state.mode === "extract") ? -v : 0;
    state.dPhiDt = computeDPhiDt(state.magnetX, state.turns, state.polarity, vx);
    state.emf = -state.turns * state.dPhiDt;
    state.current = state.emf / PHYS.resistance;

    // 历史
    state.history.push({ t: state.t, flux: state.flux, current: state.current });
    while (state.history.length > 0 && state.history[0].t < state.t - state.maxHistorySec) {
      state.history.shift();
    }
  }

  // ===== 渲染: 装置场景 =====
  function renderScene() {
    const canvas = els.scene;
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    if (rect.width < 2 || rect.height < 2) return;
    if (canvas.width !== Math.round(rect.width * dpr) || canvas.height !== Math.round(rect.height * dpr)) {
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = rect.width, H = rect.height;
    ctx.clearRect(0, 0, W, H);

    // 坐标系: 物理x -> 屏幕x, 中心在 W/2
    const cx = W / 2;
    const cy = H / 2;
    const scale = Math.min(W / 0.5, H / 0.16); // 物理米 -> 像素

    // 背景标尺
    ctx.strokeStyle = "rgba(15,159,186,0.06)";
    ctx.lineWidth = 1;
    for (let i = -0.2; i <= 0.2; i += 0.05) {
      const sx = cx + i * scale;
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
    }

    // 螺线管 (画在中心)
    const coilLeft = cx - 0.06 * scale;
    const coilRight = cx + 0.06 * scale;
    const coilTop = cy - 0.035 * scale;
    const coilBot = cy + 0.035 * scale;

    // 线圈感应磁场光环 (颜色由电流方向决定)
    const I = state.current;
    const absI = Math.abs(I);
    if (absI > 1e-7) {
      const isCCW = I > 0; // 正电流 = CCW (从右看)
      const haloColor = isCCW ? "rgba(47,109,240," : "rgba(226,59,59,";
      const intensity = clamp(absI / 0.0008, 0, 1);
      // 外光环
      for (let layer = 3; layer >= 1; layer--) {
        const alpha = 0.08 * intensity * (layer / 3);
        ctx.fillStyle = haloColor + alpha + ")";
        const pad = layer * 8;
        ctx.beginPath();
        ctx.roundRect(coilLeft - pad, coilTop - pad, (coilRight - coilLeft) + 2 * pad, (coilBot - coilTop) + 2 * pad, 12);
        ctx.fill();
      }
    }

    // 螺线管本体
    ctx.fillStyle = "rgba(220,230,240,0.5)";
    ctx.strokeStyle = "rgba(100,120,140,0.6)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(coilLeft, coilTop, coilRight - coilLeft, coilBot - coilTop, 6);
    ctx.fill();
    ctx.stroke();

    // 线圈匝数示意 (画几圈代表)
    const nDraw = Math.min(12, Math.max(4, Math.round(state.turns / 20)));
    const coilW = coilRight - coilLeft;
    for (let i = 0; i < nDraw; i++) {
      const x = coilLeft + (i + 0.5) * (coilW / nDraw);
      ctx.strokeStyle = "rgba(80,100,120,0.5)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(x, cy, (coilW / nDraw) * 0.35, (coilBot - coilTop) / 2, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 感应电流方向箭头 (在线圈上下方)
    if (absI > 1e-7) {
      const isCCW = I > 0;
      const arrowColor = isCCW ? "#2f6df0" : "#e23b3b";
      const arrowY = coilTop - 14;
      const arrowDir = isCCW ? 1 : -1; // CCW: 顶部向右; CW: 顶部向左
      drawArrow(ctx, coilLeft + 10, arrowY, coilLeft + 10 + arrowDir * 30, arrowY, arrowColor, 3);
      drawArrow(ctx, coilRight - 10, coilBot + 14, coilRight - 10 - arrowDir * 30, coilBot + 14, arrowColor, 3);
      // 标签
      ctx.fillStyle = arrowColor;
      ctx.font = "bold 11px ui-sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(isCCW ? "逆时针" : "顺时针", cx, arrowY - 6);
    }

    // 导线连接到检流计
    const wireY1 = coilBot + 4;
    const galvX = cx + 0.12 * scale;
    const galvY = cy + 0.05 * scale;
    const galvR = 0.025 * scale;
    ctx.strokeStyle = "#4a5568";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(coilRight - 5, coilBot);
    ctx.lineTo(coilRight - 5, wireY1 + 8);
    ctx.lineTo(galvX - galvR, wireY1 + 8);
    ctx.lineTo(galvX - galvR, galvY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(coilRight + 5, coilBot);
    ctx.lineTo(coilRight + 5, wireY1 + 14);
    ctx.lineTo(galvX + galvR, wireY1 + 14);
    ctx.lineTo(galvX + galvR, galvY);
    ctx.stroke();

    // 检流计
    ctx.fillStyle = "#f8fafc";
    ctx.strokeStyle = "#4a5568";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(galvX, galvY, galvR, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // 检流计刻度
    ctx.strokeStyle = "#9aa7ba";
    ctx.lineWidth = 1;
    for (let a = -Math.PI * 0.4; a <= Math.PI * 0.4; a += Math.PI * 0.1) {
      const x1 = galvX + Math.cos(a - Math.PI / 2) * (galvR - 4);
      const y1 = galvY + Math.sin(a - Math.PI / 2) * (galvR - 4);
      const x2 = galvX + Math.cos(a - Math.PI / 2) * galvR;
      const y2 = galvY + Math.sin(a - Math.PI / 2) * galvR;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    // 检流计指针
    const maxI = 0.001;
    const needleAngle = clamp(state.current / maxI, -1, 1) * Math.PI * 0.4;
    ctx.strokeStyle = "#dc2626";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(galvX, galvY);
    ctx.lineTo(galvX + Math.sin(needleAngle) * (galvR - 5), galvY - Math.cos(needleAngle) * (galvR - 5));
    ctx.stroke();
    // 中心点
    ctx.fillStyle = "#4a5568";
    ctx.beginPath(); ctx.arc(galvX, galvY, 3, 0, Math.PI * 2); ctx.fill();
    // 标签
    ctx.fillStyle = "#657188";
    ctx.font = "10px ui-sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("G", galvX, galvY + galvR + 12);

    // 磁铁
    const magX = cx + state.magnetX * scale;
    const magW = PHYS.magnetLength * scale;
    const magH = 0.03 * scale;
    const magLeft = magX - magW / 2;
    const magTop = cy - magH / 2;
    const isNRight = state.polarity === 0;
    const nColor = "#e23b3b", sColor = "#2f6df0";
    const leftColor = isNRight ? sColor : nColor;
    const rightColor = isNRight ? nColor : sColor;
    // N极
    ctx.fillStyle = isNRight ? nColor : sColor;
    ctx.fillRect(magLeft + magW / 2, magTop, magW / 2, magH);
    // S极
    ctx.fillStyle = isNRight ? sColor : nColor;
    ctx.fillRect(magLeft, magTop, magW / 2, magH);
    // 边框
    ctx.strokeStyle = "rgba(0,0,0,0.3)";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(magLeft, magTop, magW, magH);
    // N/S 标签
    ctx.fillStyle = "#fff";
    ctx.font = "bold 14px ui-sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(isNRight ? "S" : "N", magLeft + magW / 4, cy);
    ctx.fillText(isNRight ? "N" : "S", magLeft + 3 * magW / 4, cy);

    // 磁铁受力箭头 (阻碍相对运动)
    if (state.mode !== "idle" && absI > 1e-8) {
      const isRepel = (state.mode === "insert"); // 插入时排斥
      const forceColor = isRepel ? "#d97706" : "#08758a";
      const forceLen = 40;
      const forceY = magTop - 16;
      if (isRepel) {
        // 排斥: 力向左 (阻碍插入)
        drawArrow(ctx, magX, forceY, magX - forceLen, forceY, forceColor, 3.5);
        ctx.fillStyle = forceColor;
        ctx.font = "bold 11px ui-sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("排斥力", magX - forceLen / 2, forceY - 8);
      } else {
        // 吸引: 力向右 (阻碍拔出)
        drawArrow(ctx, magX, forceY, magX + forceLen, forceY, forceColor, 3.5);
        ctx.fillStyle = forceColor;
        ctx.font = "bold 11px ui-sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("吸引力", magX + forceLen / 2, forceY - 8);
      }
    }

    // 运动方向指示
    if (state.mode !== "idle") {
      const dir = state.mode === "insert" ? 1 : -1;
      const moveY = magTop + magH + 14;
      const moveLen = 30;
      ctx.fillStyle = "#657188";
      ctx.font = "10px ui-sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("v", magX + dir * moveLen / 2, moveY + 4);
      drawArrow(ctx, magX, moveY, magX + dir * moveLen, moveY, "#657188", 2);
    }

    // 坐标标注
    ctx.fillStyle = "#9aa7ba";
    ctx.font = "10px ui-sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("螺线管", cx, coilBot + 24);
    ctx.fillText("x / m", cx, H - 8);
    ctx.textAlign = "left";
    ctx.fillText("-0.16", cx - 0.16 * scale, H - 8);
    ctx.fillText("0", cx - 4, H - 8);
    ctx.fillText("+0.16", cx + 0.16 * scale - 24, H - 8);
  }

  function drawArrow(ctx, x1, y1, x2, y2, color, width) {
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = width || 2;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const headLen = 8;
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
    ctx.closePath();
    ctx.fill();
  }

  // ===== 渲染: 图表 =====
  function renderChart(canvas, dataKey, color, label, unit) {
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    if (rect.width < 2 || rect.height < 2) return;
    if (canvas.width !== Math.round(rect.width * dpr) || canvas.height !== Math.round(rect.height * dpr)) {
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = rect.width, H = rect.height;
    ctx.clearRect(0, 0, W, H);

    const padL = 38, padR = 12, padT = 10, padB = 22;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    // 网格
    ctx.strokeStyle = "rgba(232,237,244,0.8)";
    ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const y = padT + (i / 5) * plotH;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    }
    for (let i = 0; i <= 6; i++) {
      const x = padL + (i / 6) * plotW;
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, H - padB); ctx.stroke();
    }

    // 数据范围
    const tNow = state.t;
    const tStart = Math.max(0, tNow - state.maxHistorySec);
    const tRange = Math.max(1, tNow - tStart);
    let vMax = 0.001, vMin = -0.001;
    for (const h of state.history) {
      const v = h[dataKey];
      if (v > vMax) vMax = v;
      if (v < vMin) vMin = v;
    }
    // 对称范围
    const vAbsMax = Math.max(Math.abs(vMax), Math.abs(vMin), 0.001);
    const vLo = -vAbsMax * 1.15;
    const vHi = vAbsMax * 1.15;

    // 坐标轴
    ctx.strokeStyle = "#9aa7ba";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(padL, padT); ctx.lineTo(padL, H - padB); ctx.lineTo(W - padR, H - padB);
    ctx.stroke();

    // Y轴刻度
    ctx.fillStyle = "#657188";
    ctx.font = "9px ui-sans-serif";
    ctx.textAlign = "right";
    for (let i = 0; i <= 4; i++) {
      const v = vLo + (i / 4) * (vHi - vLo);
      const y = H - padB - (i / 4) * plotH;
      const label = Math.abs(v) < 1e-4 ? v.toExponential(1) : v.toFixed(4);
      ctx.fillText(label, padL - 4, y + 3);
    }
    // X轴刻度
    ctx.textAlign = "center";
    for (let i = 0; i <= 6; i++) {
      const t = tStart + (i / 6) * tRange;
      const x = padL + (i / 6) * plotW;
      ctx.fillText(t.toFixed(1), x, H - padB + 12);
    }

    // 零线
    if (vLo < 0 && vHi > 0) {
      const zeroY = H - padB - ((0 - vLo) / (vHi - vLo)) * plotH;
      ctx.strokeStyle = "rgba(100,116,139,0.4)";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(padL, zeroY); ctx.lineTo(W - padR, zeroY); ctx.stroke();
      ctx.setLineDash([]);
    }

    // 数据曲线
    if (state.history.length > 1) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      let started = false;
      for (const h of state.history) {
        if (h.t < tStart) continue;
        const x = padL + ((h.t - tStart) / tRange) * plotW;
        const v = h[dataKey];
        const y = H - padB - ((v - vLo) / (vHi - vLo)) * plotH;
        if (!started) { ctx.moveTo(x, y); started = true; }
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // 当前点
      if (state.history.length > 0) {
        const last = state.history[state.history.length - 1];
        const x = padL + ((last.t - tStart) / tRange) * plotW;
        const v = last[dataKey];
        const y = H - padB - ((v - vLo) / (vHi - vLo)) * plotH;
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    // 轴标签
    ctx.fillStyle = "#657188";
    ctx.font = "10px ui-sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(label + " / " + unit, W - padR, padT - 2);
    ctx.textAlign = "center";
    ctx.fillText("t / s", padL + plotW / 2, H - 2);
  }

  // ===== 渲染: 判断流程面板 =====
  function renderFlow() {
    const I = state.current;
    const absI = Math.abs(I);
    const moving = state.mode !== "idle";
    const isNRight = state.polarity === 0;

    // 磁通变化
    let fluxText, fluxColor, fluxBorder;
    if (!moving || absI < 1e-8) {
      fluxText = "磁通不变"; fluxColor = "#657188"; fluxBorder = "#dfe6ef";
    } else if (state.mode === "insert") {
      fluxText = "磁通增加"; fluxColor = "#d97706"; fluxBorder = "#d97706";
    } else {
      fluxText = "磁通减少"; fluxColor = "#08758a"; fluxBorder = "#08758a";
    }
    els.flowFlux.textContent = fluxText;
    els.flowFlux.style.color = fluxColor;
    els.flowFlux.style.borderColor = fluxBorder;

    // 感应磁场方向
    let fieldText, fieldColor, fieldBorder;
    if (!moving || absI < 1e-8) {
      fieldText = "无感应磁场"; fieldColor = "#657188"; fieldBorder = "#dfe6ef";
    } else {
      const fluxIncreasing = state.mode === "insert";
      // 外部磁场在线圈处方向: N朝右时, 插入(磁铁从左来)外部B向右
      const externalB = isNRight ? 1 : -1;
      // 感应磁场阻碍变化: 增加时反向, 减少时同向
      const inducedB = fluxIncreasing ? -externalB : externalB;
      fieldText = inducedB > 0 ? "向右" : "向左";
      fieldColor = inducedB > 0 ? "#e23b3b" : "#2f6df0";
      fieldBorder = inducedB > 0 ? "#e23b3b" : "#2f6df0";
    }
    els.flowField.textContent = fieldText;
    els.flowField.style.color = fieldColor;
    els.flowField.style.borderColor = fieldBorder;

    // 电流方向
    let currText, currColor, currBorder;
    if (!moving || absI < 1e-8) {
      currText = "无电流"; currColor = "#657188"; currBorder = "#dfe6ef";
    } else {
      const isCCW = I > 0;
      currText = isCCW ? "逆时针" : "顺时针";
      currColor = isCCW ? "#2f6df0" : "#e23b3b";
      currBorder = isCCW ? "#2f6df0" : "#e23b3b";
    }
    els.flowCurrent.textContent = currText;
    els.flowCurrent.style.color = currColor;
    els.flowCurrent.style.borderColor = currBorder;
  }

  // ===== 渲染: 读数 =====
  function renderReadouts() {
    els.speedOutput.textContent = state.speed.toFixed(1) + " m/s";
    els.turnsOutput.textContent = String(state.turns);
    els.polarityOutput.textContent = state.polarity === 0 ? "N迎向" : "S迎向";

    const modeText = state.mode === "insert" ? "插入中" : state.mode === "extract" ? "拔出中" : "静止";
    els.status.textContent = state.running ? modeText : "已暂停";
  }

  // ===== 主渲染 =====
  function render() {
    renderScene();
    renderChart(els.fluxChart, "flux", "#0f9fba", "Phi", "Wb");
    renderChart(els.currentChart, "current", "#d97706", "i", "A");
    renderFlow();
    renderReadouts();
  }

  // ===== 生命周期 =====
  function start() { state.running = true; }
  function pause() { state.running = false; }
  function reset() {
    pause();
    state.mode = "idle";
    state.magnetX = -0.16;
    state.t = 0;
    state.lastTimestamp = null;
    state.flux = computeFlux(state.magnetX, state.turns, state.polarity);
    state.prevFlux = state.flux;
    state.dPhiDt = 0;
    state.emf = 0;
    state.current = 0;
    state.history = [{ t: 0, flux: state.flux, current: 0 }];
    render();
  }
  function setInsert() { state.mode = "insert"; start(); }
  function setExtract() { state.mode = "extract"; start(); }
  function setParameters(values) {
    if (values.speed !== undefined) state.speed = clamp(finite(Number(values.speed), 0.5), 0.1, 2.0);
    if (values.turns !== undefined) state.turns = clamp(finite(Number(values.turns), 100), 20, 300);
    if (values.polarity !== undefined) state.polarity = values.polarity === 1 ? 1 : 0;
    els.speedInput.value = String(state.speed);
    els.turnsInput.value = String(state.turns);
    els.polarityInput.value = String(state.polarity);
    render();
  }
  function getState() {
    return { ...state, history: state.history.map(h => ({ ...h })) };
  }
  function getReadouts() {
    return {
      magnetX: state.magnetX,
      flux: state.flux,
      dPhiDt: state.dPhiDt,
      emf: state.emf,
      current: state.current,
      speed: state.speed,
      turns: state.turns,
      polarity: state.polarity,
      mode: state.mode,
      t: state.t
    };
  }

  // ===== 模型检查 =====
  function runModelChecks() {
    // 1. 磁通对称性: 磁铁在中心(x=0)时, 通量应接近最大
    const fluxCenter = computeFlux(0, 100, 0);
    const fluxOff = computeFlux(0.1, 100, 0);
    const centerLarger = Math.abs(fluxCenter) > Math.abs(fluxOff);

    // 2. 极性翻转: 同一位置, 翻转极性应使通量符号反转
    const fluxP0 = computeFlux(0.05, 100, 0);
    const fluxP1 = computeFlux(0.05, 100, 1);
    const polarityReverses = Math.sign(fluxP0) === -Math.sign(fluxP1) || (Math.abs(fluxP0) < 1e-15 && Math.abs(fluxP1) < 1e-15);

    // 3. 匝数线性: 通量与匝数成正比
    const fluxN50 = computeFlux(0.05, 50, 0);
    const fluxN100 = computeFlux(0.05, 100, 0);
    const turnsLinear = Math.abs(fluxN100 - 2 * fluxN50) < Math.abs(fluxN100) * 0.01;

    // 4. 楞次定律: 插入时电流方向应产生反向磁场
    // polarity=0 (N朝右), 磁铁从左插入(x增大), 外部B在线圈处向右(+)
    // 通量增加, 感应B应向左(-), 对应顺时针电流(从右看), 即 I < 0
    const x1 = computeFlux(-0.1, 100, 0);
    const x2 = computeFlux(-0.09, 100, 0);
    const dPhi = x2 - x1;
    const emf = -100 * dPhi / 0.001; // dt=0.001 (近似)
    const current = emf / PHYS.resistance;
    // 插入时通量应增加 (dPhi > 0), 电流应为负 (顺时针)
    const insertFluxIncreasing = dPhi > 0;
    const lenzInsertCorrect = current < 0;

    // 5. 拔出时: 通量减少, 电流反向
    const x3 = computeFlux(0.1, 100, 0);
    const x4 = computeFlux(0.09, 100, 0);
    const dPhi2 = x4 - x3;
    const emf2 = -100 * dPhi2 / 0.001;
    const current2 = emf2 / PHYS.resistance;
    const extractFluxDecreasing = dPhi2 < 0;
    const lenzExtractCorrect = current2 > 0;

    // 6. 速度影响: 速度越快, |dPhi/dt| 越大
    const dPhiSlow = Math.abs(computeFlux(0.01, 100, 0) - computeFlux(-0.01, 100, 0));
    const dPhiFast = Math.abs(computeFlux(0.02, 100, 0) - computeFlux(-0.02, 100, 0));
    const speedProportional = dPhiFast > dPhiSlow;

    // 7. 有限性
    const allFinite = Number.isFinite(fluxCenter) && Number.isFinite(fluxP0) && Number.isFinite(fluxN100);

    return [
      { name: "磁通中心最大", pass: centerLarger, expected: "|Phi(0)| > |Phi(0.1)|", actual: `${Math.abs(fluxCenter)} > ${Math.abs(fluxOff)}`, tolerance: "strict" },
      { name: "极性翻转反转通量符号", pass: polarityReverses, expected: "sign(P0) = -sign(P1)", actual: `${Math.sign(fluxP0)} vs ${Math.sign(fluxP1)}`, tolerance: "strict" },
      { name: "匝数线性", pass: turnsLinear, expected: "Phi(N=100) = 2*Phi(N=50)", actual: `${fluxN100} vs ${2*fluxN50}`, tolerance: 0.01 },
      { name: "插入时通量增加", pass: insertFluxIncreasing, expected: "dPhi > 0", actual: dPhi, tolerance: "strict" },
      { name: "插入时楞次定律(电流顺时针)", pass: lenzInsertCorrect, expected: "I < 0", actual: current, tolerance: "strict" },
      { name: "拔出时通量减少", pass: extractFluxDecreasing, expected: "dPhi < 0", actual: dPhi2, tolerance: "strict" },
      { name: "拔出时楞次定律(电流逆时针)", pass: lenzExtractCorrect, expected: "I > 0", actual: current2, tolerance: "strict" },
      { name: "速度越快磁通变化越大", pass: speedProportional, expected: "|dPhi(fast)| > |dPhi(slow)|", actual: `${dPhiFast} > ${dPhiSlow}`, tolerance: "strict" },
      { name: "所有值有限", pass: allFinite, expected: "finite", actual: "finite", tolerance: "finite" }
    ];
  }

  // ===== 绑定控件 =====
  function bindControls() {
    els.insertBtn.addEventListener("click", setInsert);
    els.extractBtn.addEventListener("click", setExtract);
    els.pauseBtn.addEventListener("click", pause);
    els.resetBtn.addEventListener("click", reset);
    els.speedInput.addEventListener("input", () => setParameters({ speed: els.speedInput.value }));
    els.turnsInput.addEventListener("input", () => setParameters({ turns: els.turnsInput.value }));
    els.polarityInput.addEventListener("input", () => setParameters({ polarity: els.polarityInput.value }));
  }

  // ===== 主循环 =====
  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // ===== 初始化 =====
  function init() {
    bindControls();
    setParameters({ speed: 0.5, turns: 100, polarity: 0 });
    reset();
    requestAnimationFrame(frame);
  }

  window.simulation = {
    init, start, pause, reset, update, render,
    setParameters, getState, getReadouts, runModelChecks,
    computeFlux, computeDPhiDt
  };
  init();
})();
</script>
</body>
</html>
