<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科里奥利力与漩涡方向 · 交互演示</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #060912;
  --sim-surface: #0d1322;
  --sim-surface-soft: #131b2e;
  --sim-text: #e8eefc;
  --sim-muted: #8294b3;
  --sim-border: #1f2a44;
  --sim-grid: #16203a;
  --sim-accent: #22d3ee;
  --sim-accent-deep: #0891b2;
  --sim-accent-soft: rgba(34, 211, 238, 0.15);
  --sim-positive: #22d3ee;
  --sim-warning: #f59e0b;
  --sim-danger: #ef4444;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--sim-text);
  background: var(--sim-bg);
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow: hidden;
}
button, input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid rgba(34, 211, 238, 0.5); outline-offset: 2px; }
.app {
  width: 100%;
  height: 100vh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: var(--sim-space-3);
  padding: var(--sim-space-3) var(--sim-space-4) var(--sim-space-3);
  overflow: hidden;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--sim-space-4);
  min-height: 52px;
  padding: 0 var(--sim-space-2);
}
.header h1 {
  margin: 0 0 var(--sim-space-1);
  font-size: clamp(1.4rem, 2.2vw, 1.9rem);
  letter-spacing: -0.03em;
  line-height: 1.1;
}
.header p {
  margin: 0;
  color: var(--sim-muted);
  font-size: 0.85rem;
}
.status {
  border: 1px solid rgba(34, 211, 238, 0.3);
  border-radius: 999px;
  padding: 8px 14px;
  background: var(--sim-accent-soft);
  color: var(--sim-accent);
  font-weight: 700;
  white-space: nowrap;
  font-size: 0.85rem;
}
.main {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(280px, 0.32fr);
  gap: var(--sim-space-3);
}
.stage {
  position: relative;
  background: var(--sim-surface);
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-lg);
  overflow: hidden;
  min-height: 0;
}
.stage canvas {
  display: block;
  width: 100%;
  height: 100%;
}
.stage-label {
  position: absolute;
  top: var(--sim-space-3);
  left: var(--sim-space-4);
  font-size: 0.78rem;
  color: var(--sim-muted);
  pointer-events: none;
  z-index: 2;
  letter-spacing: 0.02em;
}
.hemisphere-label {
  position: absolute;
  top: var(--sim-space-3);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  pointer-events: none;
  z-index: 2;
}
.hemisphere-label.north { left: 25%; transform: translateX(-50%); color: var(--sim-accent); }
.hemisphere-label.south { left: 75%; transform: translateX(-50%); color: var(--sim-warning); }
.side {
  min-height: 0;
  display: grid;
  grid-template-rows: minmax(0, 1.2fr) minmax(0, 1fr);
  gap: var(--sim-space-3);
}
.evidence {
  background: var(--sim-surface);
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-lg);
  padding: var(--sim-space-4);
  display: flex;
  flex-direction: column;
  gap: var(--sim-space-3);
  min-height: 0;
  overflow: hidden;
}
.evidence h2 {
  margin: 0;
  font-size: 0.95rem;
  color: var(--sim-text);
}
.evidence-canvas-wrap {
  flex: 1;
  min-height: 0;
  position: relative;
  border-radius: var(--sim-radius-md);
  overflow: hidden;
  background: #050810;
  border: 1px solid var(--sim-border);
}
.evidence-canvas-wrap canvas {
  display: block;
  width: 100%;
  height: 100%;
}
.evidence-caption {
  font-size: 0.75rem;
  color: var(--sim-muted);
  text-align: center;
  line-height: 1.4;
}
.readout-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--sim-space-2);
}
.metric {
  padding: var(--sim-space-3);
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-sm);
  background: var(--sim-surface-soft);
}
.metric small {
  display: block;
  margin-bottom: var(--sim-space-1);
  color: var(--sim-muted);
  font-size: 0.72rem;
}
.metric strong {
  font-size: 1.2rem;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  color: var(--sim-text);
}
.insight {
  padding: var(--sim-space-3) var(--sim-space-4);
  border-left: 3px solid var(--sim-warning);
  border-radius: 0 var(--sim-radius-sm) var(--sim-radius-sm) 0;
  background: rgba(245, 158, 11, 0.08);
  color: #fcd34d;
  font-weight: 600;
  font-size: 0.88rem;
  line-height: 1.5;
}
.controls {
  padding: var(--sim-space-3) var(--sim-space-4);
  display: grid;
  grid-template-columns: auto minmax(140px, 1fr) minmax(140px, 1fr) minmax(140px, 1fr);
  gap: var(--sim-space-4);
  align-items: center;
  background: var(--sim-surface);
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-md);
}
.actions {
  display: flex;
  gap: var(--sim-space-2);
}
button {
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-sm);
  padding: 9px 14px;
  color: var(--sim-text);
  background: var(--sim-surface-soft);
  cursor: pointer;
  font-weight: 700;
  font-size: 0.85rem;
  transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
}
button:hover {
  border-color: var(--sim-accent-deep);
  background: rgba(34, 211, 238, 0.08);
}
button:active { transform: scale(0.97); }
button.primary {
  border-color: var(--sim-accent-deep);
  color: #fff;
  background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent));
  box-shadow: 0 4px 14px rgba(34, 211, 238, 0.25);
}
button[aria-pressed="true"] {
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.3);
}
.control label {
  display: flex;
  justify-content: space-between;
  gap: var(--sim-space-3);
  margin-bottom: var(--sim-space-1);
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--sim-muted);
}
.control output {
  color: var(--sim-text);
  font-variant-numeric: tabular-nums;
}
input[type="range"] {
  width: 100%;
  accent-color: var(--sim-accent);
}
@media (max-width: 900px) {
  .app { height: auto; min-height: 100vh; overflow: visible; }
  .main { grid-template-columns: 1fr; }
  .controls { grid-template-columns: 1fr; }
  .stage { min-height: 320px; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="qualitative">
  <header class="header" data-region="header">
    <div>
      <h1>科里奥利力与漩涡方向</h1>
      <p>观察排水时粒子受科里奥利偏转形成的涡旋方向</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
  </header>

  <main class="main">
    <section class="stage" data-region="stage" aria-label="双水槽粒子模拟舞台">
      <span class="stage-label">粒子轨迹 · 半透明叠加</span>
      <span class="hemisphere-label north">北半球</span>
      <span class="hemisphere-label south">南半球</span>
      <canvas id="scene"></canvas>
    </section>

    <aside class="side">
      <section class="evidence" data-region="evidence" aria-label="台风云图与读数">
        <h2>台风云图示意</h2>
        <div class="evidence-canvas-wrap">
          <canvas id="typhoonCanvas"></canvas>
        </div>
        <p class="evidence-caption">2000 km 尺度 · 与当前活跃半球同向旋转</p>
        <div class="readout-grid">
          <div class="metric"><small>纬度</small><strong id="latReadout">30°N</strong></div>
          <div class="metric"><small>科里奥利参数</small><strong id="corReadout">7.27e-5</strong></div>
          <div class="metric"><small>阶段</small><strong id="phaseReadout">静置</strong></div>
          <div class="metric"><small>模拟时间</small><strong id="timeReadout">0.0s</strong></div>
        </div>
      </section>

      <section class="evidence" data-region="insight" aria-label="观察结论">
        <h2>观察结论</h2>
        <p id="insight" class="insight">北半球排水粒子向右偏转，累积形成逆时针漩涡。南半球方向相反。赤道附近偏转极弱。</p>
      </section>
    </aside>
  </main>

  <section class="controls" data-region="controls" aria-label="模拟控制">
    <div class="actions">
      <button id="startBtn" class="primary" type="button">开始</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control">
      <label for="latInput">纬度 <output id="latOutput">30°N</output></label>
      <input id="latInput" type="range" min="-60" max="60" step="5" value="30">
    </div>
    <div class="control">
      <label for="drainInput">排水强度 <output id="drainOutput">1.0</output></label>
      <input id="drainInput" type="range" min="0" max="2" step="0.1" value="1.0">
    </div>
    <div class="control">
      <label for="omegaInput">自转速率 <output id="omegaOutput">1.0×</output></label>
      <input id="omegaInput" type="range" min="0" max="3" step="0.1" value="1.0">
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";

  var parameterSchema = [
    { key: "latitude", label: "纬度", type: "slider", min: -60, max: 60, step: 5, default: 30, unit: "°" },
    { key: "drainStrength", label: "排水强度", type: "slider", min: 0, max: 2, step: 0.1, default: 1.0, unit: "" },
    { key: "omegaScale", label: "自转速率", type: "slider", min: 0, max: 3, step: 0.1, default: 1.0, unit: "×" }
  ];

  var state = {
    running: false,
    t: 0,
    phase: "rest",
    phaseT: 0,
    latitude: 30,
    drainStrength: 1.0,
    omegaScale: 1.0,
    lastTimestamp: null,
    particles: [],
    typhoonAngle: 0
  };

  var elements = {
    status: document.getElementById("status"),
    scene: document.getElementById("scene"),
    typhoonCanvas: document.getElementById("typhoonCanvas"),
    insight: document.getElementById("insight"),
    latReadout: document.getElementById("latReadout"),
    corReadout: document.getElementById("corReadout"),
    phaseReadout: document.getElementById("phaseReadout"),
    timeReadout: document.getElementById("timeReadout"),
    latInput: document.getElementById("latInput"),
    latOutput: document.getElementById("latOutput"),
    drainInput: document.getElementById("drainInput"),
    drainOutput: document.getElementById("drainOutput"),
    omegaInput: document.getElementById("omegaInput"),
    omegaOutput: document.getElementById("omegaOutput"),
    startBtn: document.getElementById("startBtn"),
    pauseBtn: document.getElementById("pauseBtn"),
    resetBtn: document.getElementById("resetBtn")
  };

  var sceneCtx = null;
  var typhoonCtx = null;
  var sceneW = 0, sceneH = 0;
  var typhoonW = 0, typhoonH = 0;

  function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
  function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

  function initParticles() {
    state.particles = [];
    var perSide = 220;
    for (var s = 0; s < 2; s++) {
      for (var i = 0; i < perSide; i++) {
        state.particles.push({
          side: s,
          x: 0.08 + Math.random() * 0.84,
          y: 0.08 + Math.random() * 0.84,
          vx: (Math.random() - 0.5) * 0.02,
          vy: (Math.random() - 0.5) * 0.02
        });
      }
    }
  }

  function resizeCanvas(canvas) {
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return null;
    canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx: ctx, w: rect.width, h: rect.height };
  }

  function resizeAll() {
    var s = resizeCanvas(elements.scene);
    if (s) { sceneCtx = s.ctx; sceneW = s.w; sceneH = s.h; }
    var t = resizeCanvas(elements.typhoonCanvas);
    if (t) { typhoonCtx = t.ctx; typhoonW = t.w; typhoonH = t.h; }
  }

  function getCoriolisParams() {
    var latRad = state.latitude * Math.PI / 180;
    var earthOmega = 7.292e-5;
    var f = 2 * earthOmega * Math.sin(latRad) * state.omegaScale;
    var isNorth = state.latitude >= 0;
    var sign = isNorth ? 1 : -1;
    var strength = Math.abs(Math.sin(latRad));
    return { f: f, sign: sign, strength: strength, isNorth: isNorth };
  }

  function update(dt) {
    if (!state.running) return;
    var boundedDt = clamp(finite(dt, 0), 0, 0.05);

    state.phaseT += boundedDt;
    if (state.phase === "rest" && state.phaseT >= 4) {
      state.phase = "drain"; state.phaseT = 0;
    } else if (state.phase === "drain" && state.phaseT >= 8) {
      state.phase = "rest"; state.phaseT = 0; initParticles();
    }

    var cor = getCoriolisParams();
    var drainActive = state.phase === "drain" ? 1 : 0;
    var drainForce = state.drainStrength * 0.015 * drainActive;
    var brownian = state.phase === "rest" ? 0.008 : 0.002;

    for (var i = 0; i < state.particles.length; i++) {
      var p = state.particles[i];
      var cx = 0.5, cy = 0.5;
      var dx = cx - p.x, dy = cy - p.y;
      var dist = Math.sqrt(dx * dx + dy * dy) + 1e-6;
      var ndx = dx / dist, ndy = dy / dist;

      p.vx += ndx * drainForce * boundedDt * 60;
      p.vy += ndy * drainForce * boundedDt * 60;

      var corAccel = cor.strength * state.omegaScale * 0.06;
      p.vx += cor.sign * p.vy * corAccel * boundedDt * 60;
      p.vy -= cor.sign * p.vx * corAccel * boundedDt * 60;

      p.vx += (Math.random() - 0.5) * brownian;
      p.vy += (Math.random() - 0.5) * brownian;

      p.vx *= 0.985;
      p.vy *= 0.985;

      p.x += p.vx * boundedDt * 60;
      p.y += p.vy * boundedDt * 60;

      if (dist < 0.025 && drainActive) {
        var angle = Math.random() * Math.PI * 2;
        var r = 0.35 + Math.random() * 0.15;
        p.x = 0.5 + Math.cos(angle) * r;
        p.y = 0.5 + Math.sin(angle) * r;
        p.vx = 0; p.vy = 0;
      }

      if (p.x < 0.02) { p.x = 0.02; p.vx *= -0.3; }
      if (p.x > 0.98) { p.x = 0.98; p.vx *= -0.3; }
      if (p.y < 0.02) { p.y = 0.02; p.vy *= -0.3; }
      if (p.y > 0.98) { p.y = 0.98; p.vy *= -0.3; }
    }

    state.typhoonAngle += cor.sign * cor.strength * 0.4 * boundedDt;
    state.t += boundedDt;
  }

  function render() {
    if (!sceneCtx) return;

    sceneCtx.fillStyle = "rgba(6, 9, 18, 0.10)";
    sceneCtx.fillRect(0, 0, sceneW, sceneH);

    var halfW = sceneW / 2;
    sceneCtx.strokeStyle = "rgba(34, 211, 238, 0.12)";
    sceneCtx.lineWidth = 1;
    sceneCtx.beginPath();
    sceneCtx.moveTo(halfW, 0);
    sceneCtx.lineTo(halfW, sceneH);
    sceneCtx.stroke();

    var cor = getCoriolisParams();
    var activeColor = cor.isNorth ? "34, 211, 238" : "245, 158, 11";
    var inactiveColor = cor.isNorth ? "245, 158, 11" : "34, 211, 238";

    for (var i = 0; i < state.particles.length; i++) {
      var p = state.particles[i];
      var offsetX = p.side === 0 ? 0 : halfW;
      var px = offsetX + p.x * halfW;
      var py = p.y * sceneH;
      var isActive = (p.side === 0) === cor.isNorth;
      var color = isActive ? activeColor : inactiveColor;
      sceneCtx.fillStyle = "rgba(" + color + ", 0.75)";
      sceneCtx.beginPath();
      sceneCtx.arc(px, py, 1.6, 0, Math.PI * 2);
      sceneCtx.fill();
    }

    for (var s2 = 0; s2 < 2; s2++) {
      var cx2 = (s2 === 0 ? halfW / 2 : halfW + halfW / 2);
      var cy2 = sceneH / 2;
      sceneCtx.strokeStyle = "rgba(100, 120, 150, 0.25)";
      sceneCtx.lineWidth = 1;
      sceneCtx.beginPath();
      sceneCtx.arc(cx2, cy2, 4, 0, Math.PI * 2);
      sceneCtx.stroke();
    }

    renderTyphoon(cor);
    renderReadouts(cor);
  }

  function renderTyphoon(cor) {
    if (!typhoonCtx) return;
    typhoonCtx.clearRect(0, 0, typhoonW, typhoonH);
    typhoonCtx.fillStyle = "#050810";
    typhoonCtx.fillRect(0, 0, typhoonW, typhoonH);

    var cx = typhoonW / 2;
    var cy = typhoonH / 2;
    var maxR = Math.min(typhoonW, typhoonH) * 0.42;

    typhoonCtx.save();
    typhoonCtx.translate(cx, cy);
    typhoonCtx.rotate(state.typhoonAngle);

    var arms = 4;
    for (var a = 0; a < arms; a++) {
      var baseAngle = (a / arms) * Math.PI * 2;
      typhoonCtx.beginPath();
      for (var r = 2; r < maxR; r += 1.5) {
        var spiralAngle = baseAngle + cor.sign * Math.log(r + 2) * 0.8;
        var x = r * Math.cos(spiralAngle);
        var y = r * Math.sin(spiralAngle);
        if (r === 2) typhoonCtx.moveTo(x, y);
        else typhoonCtx.lineTo(x, y);
      }
      var color = cor.isNorth ? "34, 211, 238" : "245, 158, 11";
      typhoonCtx.strokeStyle = "rgba(" + color + ", 0.5)";
      typhoonCtx.lineWidth = 3;
      typhoonCtx.stroke();
    }

    var grad = typhoonCtx.createRadialGradient(0, 0, 0, 0, 0, maxR * 0.3);
    grad.addColorStop(0, "rgba(255, 255, 255, 0.25)");
    grad.addColorStop(1, "rgba(255, 255, 255, 0)");
    typhoonCtx.fillStyle = grad;
    typhoonCtx.beginPath();
    typhoonCtx.arc(0, 0, maxR * 0.3, 0, Math.PI * 2);
    typhoonCtx.fill();

    typhoonCtx.restore();

    typhoonCtx.fillStyle = "rgba(232, 238, 252, 0.6)";
    typhoonCtx.font = "10px ui-sans-serif, system-ui";
    typhoonCtx.textAlign = "center";
    var dirText = cor.isNorth ? "逆时针 (北半球)" : "顺时针 (南半球)";
    if (cor.strength < 0.05) dirText = "偏转极弱 (近赤道)";
    typhoonCtx.fillText(dirText, cx, typhoonH - 8);
  }

  function renderReadouts(cor) {
    var latAbs = Math.abs(state.latitude);
    var hemi = state.latitude >= 0 ? "N" : "S";
    if (latAbs < 5) hemi = "赤道";
    elements.latReadout.textContent = latAbs.toFixed(0) + "°" + hemi;
    elements.corReadout.textContent = (cor.f * 1e5).toFixed(2) + "e-5";
    elements.phaseReadout.textContent = state.phase === "rest" ? "静置" : "排水";
    elements.timeReadout.textContent = state.t.toFixed(1) + "s";

    elements.latOutput.textContent = latAbs.toFixed(0) + "°" + hemi;
    elements.drainOutput.textContent = state.drainStrength.toFixed(1);
    elements.omegaOutput.textContent = state.omegaScale.toFixed(1) + "×";

    if (cor.strength < 0.05) {
      elements.insight.textContent = "赤道附近科里奥利参数趋近零，偏转极弱，漩涡方向不确定。";
    } else if (cor.isNorth) {
      elements.insight.textContent = "北半球：粒子向右偏转，累积形成逆时针漩涡。纬度越高偏转越强。";
    } else {
      elements.insight.textContent = "南半球：粒子向左偏转，累积形成顺时针漩涡。纬度越高偏转越强。";
    }
  }

  function setParameters(values) {
    var latDef = parameterSchema[0];
    var drainDef = parameterSchema[1];
    var omegaDef = parameterSchema[2];
    state.latitude = clamp(finite(Number(values.latitude), latDef.default), latDef.min, latDef.max);
    state.drainStrength = clamp(finite(Number(values.drainStrength), drainDef.default), drainDef.min, drainDef.max);
    state.omegaScale = clamp(finite(Number(values.omegaScale), omegaDef.default), omegaDef.min, omegaDef.max);
    elements.latInput.value = String(state.latitude);
    elements.drainInput.value = String(state.drainStrength);
    elements.omegaInput.value = String(state.omegaScale);
    render();
  }

  function getState() {
    return {
      running: state.running,
      t: state.t,
      phase: state.phase,
      phaseT: state.phaseT,
      latitude: state.latitude,
      drainStrength: state.drainStrength,
      omegaScale: state.omegaScale,
      particleCount: state.particles.length,
      typhoonAngle: state.typhoonAngle
    };
  }

  function getReadouts() {
    var cor = getCoriolisParams();
    return {
      latitude: state.latitude,
      coriolisF: cor.f,
      phase: state.phase,
      time: state.t,
      typhoonAngle: state.typhoonAngle
    };
  }

  function runModelChecks() {
    var cor0 = 2 * 7.292e-5 * Math.sin(0);
    var cor30 = 2 * 7.292e-5 * Math.sin(30 * Math.PI / 180);
    var cor60 = 2 * 7.292e-5 * Math.sin(60 * Math.PI / 180);
    var corNeg30 = 2 * 7.292e-5 * Math.sin(-30 * Math.PI / 180);
    return [
      { name: "赤道科里奥利为零", pass: Math.abs(cor0) < 1e-10, expected: 0, actual: cor0, tolerance: 1e-10 },
      { name: "纬度单调增强", pass: cor60 > cor30 && cor30 > 0, expected: "cor(60) > cor(30) > 0", actual: cor60 + " > " + cor30, tolerance: "strict" },
      { name: "南北半球符号相反", pass: cor30 > 0 && corNeg30 < 0, expected: "北正南负", actual: "cor(30N)=" + cor30 + ", cor(30S)=" + corNeg30, tolerance: "strict" },
      { name: "粒子状态有限", pass: state.particles.every(function (p) { return Number.isFinite(p.x) && Number.isFinite(p.y) && Number.isFinite(p.vx) && Number.isFinite(p.vy); }), expected: "全部有限", actual: "checked " + state.particles.length, tolerance: "finite" }
    ];
  }

  function init() {
    initParticles();
    resizeAll();
    bindControls();
    setParameters({ latitude: 30, drainStrength: 1.0, omegaScale: 1.0 });
    reset();
    window.addEventListener("resize", resizeAll);
    requestAnimationFrame(frame);
  }

  function start() {
    state.running = true;
    elements.status.textContent = "运行中";
    elements.startBtn.setAttribute("aria-pressed", "true");
  }

  function pause() {
    state.running = false;
    elements.status.textContent = "已暂停";
    elements.startBtn.setAttribute("aria-pressed", "false");
  }

  function reset() {
    pause();
    state.t = 0;
    state.phase = "rest";
    state.phaseT = 0;
    state.typhoonAngle = 0;
    state.lastTimestamp = null;
    initParticles();
    if (sceneCtx) {
      sceneCtx.fillStyle = "#060912";
      sceneCtx.fillRect(0, 0, sceneW, sceneH);
    }
    render();
  }

  function bindControls() {
    elements.startBtn.addEventListener("click", start);
    elements.pauseBtn.addEventListener("click", pause);
    elements.resetBtn.addEventListener("click", reset);
    elements.latInput.addEventListener("input", function () {
      setParameters({ latitude: elements.latInput.value, drainStrength: state.drainStrength, omegaScale: state.omegaScale });
    });
    elements.drainInput.addEventListener("input", function () {
      setParameters({ latitude: state.latitude, drainStrength: elements.drainInput.value, omegaScale: state.omegaScale });
    });
    elements.omegaInput.addEventListener("input", function () {
      setParameters({ latitude: state.latitude, drainStrength: state.drainStrength, omegaScale: elements.omegaInput.value });
    });
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    var dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  window.simulation = {
    init: init,
    start: start,
    pause: pause,
    reset: reset,
    update: update,
    render: render,
    setParameters: setParameters,
    getState: getState,
    getReadouts: getReadouts,
    runModelChecks: runModelChecks
  };

  init();
})();
</script>
</body>
</html>
