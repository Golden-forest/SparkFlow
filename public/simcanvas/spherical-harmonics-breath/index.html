  <style>

<body>
  <div class="app" data-layout="scene-first" data-model-tier="analytic">
    <header class="header" data-region="header">
      <div class="header-text">
        <h1>球面谐波呼吸星球</h1>
        <p>多阶球面谐波叠加形成表面脉动，深蓝至亮青映射半径变化。</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">运行中</div>
    </header>

    <canvas id="scene" data-region="stage" aria-label="球面谐波呼吸脉动能量星球"></canvas>

    <aside class="evidence" data-region="evidence" aria-label="实时读数">
      <div class="metric"><small>时间</small><strong id="timeReadout">0.00 s</strong></div>
      <div class="metric"><small>自转角</small><strong id="rotReadout">0.0°</strong></div>
    </aside>

    <div class="formula" data-region="insight" aria-hidden="true">
      <span class="name">球面谐波呼吸</span>
      <span class="eq">R(θ,φ,t) = Σ A<sub>mn</sub>·cos(mθ)·sin(nφ)·sin(ω<sub>mn</sub>t)</span>
    </div>

    <button id="playBtn" class="play-btn" data-region="controls" type="button" aria-label="播放或暂停" aria-pressed="true">
      <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
  </div>

  <script>
  (() => {
    "use strict";

    // ---------- 确定性伪随机（固定种子） ----------
    function mulberry32(seed) {
      let a = seed >>> 0;
      return function() {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rng = mulberry32(20240607);

    // ---------- 球面谐波叠加项 ----------
    // R(θ,φ,t) = Σ A_mn · cos(mθ) · sin(nφ) · sin(ω_mn · t)
    const harmonics = [
      { m: 2, n: 3, A: 0.10, w: 0.55 },
      { m: 3, n: 2, A: 0.085, w: 0.72 },
      { m: 4, n: 5, A: 0.058, w: 0.95 },
      { m: 1, n: 4, A: 0.072, w: 0.46 },
      { m: 5, n: 3, A: 0.045, w: 1.18 },
      { m: 2, n: 6, A: 0.038, w: 0.83 },
      { m: 6, n: 4, A: 0.032, w: 1.05 },
      { m: 3, n: 7, A: 0.028, w: 0.62 }
    ];

    // ---------- 球面均匀采样（Fibonacci 球面分布） ----------
    const N_POINTS = 4000;
    const points = [];
    const goldenAngle = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N_POINTS; i++) {
      const y = 1 - (i / (N_POINTS - 1)) * 2; // y ∈ [1, -1]
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      const theta = goldenAngle * i; // 方位角
      points.push({
        x: Math.cos(theta) * r,
        y: y,
        z: Math.sin(theta) * r,
        // 每点固定相位偏移，让呼吸有层次
        phase: rng() * Math.PI * 2,
        // 每点轻微的独立呼吸幅度（确定性）
        amp: 0.85 + rng() * 0.3
      });
    }

    // ---------- 状态 ----------
    const state = {
      running: true,
      t: 0,
      lastTimestamp: null,
      rotY: 0,       // 绕 Y 轴自转角
      rotX: 0,       // 绕 X 轴俯仰角（缓慢漂移）
      width: 0,
      height: 0,
      dpr: 1
    };

    // ---------- Canvas 初始化 ----------
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d", { alpha: false });

    function resize() {
      state.dpr = Math.min(window.devicePixelRatio || 1, 2);
      state.width = window.innerWidth;
      state.height = window.innerHeight;
      canvas.width = Math.floor(state.width * state.dpr);
      canvas.height = Math.floor(state.height * state.dpr);
      canvas.style.width = state.width + "px";
      canvas.style.height = state.height + "px";
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    // ---------- 颜色插值：深蓝 → 亮青 ----------
    // 内缩（半径小）= 深蓝 #1e3a8a；外扩（半径大）= 亮青 #5eead4
    const COLOR_INNER = [30, 58, 138];   // 深蓝
    const COLOR_MID   = [56, 189, 248];  // 中蓝
    const COLOR_OUTER = [94, 234, 212];  // 亮青

    function radiusColor(rNorm) {
      // rNorm ∈ [0, 1]，0=最内缩，1=最外扩
      let r, g, b;
      if (rNorm < 0.5) {
        const k = rNorm * 2;
        r = COLOR_INNER[0] + (COLOR_MID[0] - COLOR_INNER[0]) * k;
        g = COLOR_INNER[1] + (COLOR_MID[1] - COLOR_INNER[1]) * k;
        b = COLOR_INNER[2] + (COLOR_MID[2] - COLOR_INNER[2]) * k;
      } else {
        const k = (rNorm - 0.5) * 2;
        r = COLOR_MID[0] + (COLOR_OUTER[0] - COLOR_MID[0]) * k;
        g = COLOR_MID[1] + (COLOR_OUTER[1] - COLOR_MID[1]) * k;
        b = COLOR_MID[2] + (COLOR_OUTER[2] - COLOR_MID[2]) * k;
      }
      return [r | 0, g | 0, b | 0];
    }

    // ---------- 模型：计算每个点的当前半径 ----------
    // 返回归一化半径 rNorm ∈ [0,1]，用于颜色与大小
    function computeRadii(t) {
      const radii = new Float32Array(N_POINTS);
      let rMin = Infinity, rMax = -Infinity;
      for (let i = 0; i < N_POINTS; i++) {
        const p = points[i];
        // 基础球面坐标
        const x = p.x, y = p.y, z = p.z;
        const theta = Math.atan2(z, x);              // 方位角
        const phi = Math.acos(Math.max(-1, Math.min(1, y))); // 极角 [0, π]
        let dR = 0;
        for (let h = 0; h < harmonics.length; h++) {
          const hm = harmonics[h];
          dR += hm.A * Math.cos(hm.m * theta) * Math.sin(hm.n * phi) * Math.sin(hm.w * t + p.phase * 0.3);
        }
        const r = 1 + dR * p.amp;
        radii[i] = r;
        if (r < rMin) rMin = r;
        if (r > rMax) rMax = r;
      }
      // 归一化到 [0,1]
      const range = Math.max(1e-6, rMax - rMin);
      for (let i = 0; i < N_POINTS; i++) {
        radii[i] = (radii[i] - rMin) / range;
      }
      return { radii, rMin, rMax };
    }

    // ---------- 透视投影 ----------
    // 屏幕坐标 = x / (z + 视距)
    const VIEW_DIST = 3.2;
    const PERSP_SCALE = 2.4; // 整体缩放系数，让球占满屏幕

    function project(x, y, z, cx, cy, scale) {
      const denom = Math.max(0.001, z + VIEW_DIST);
      const px = (x / denom) * scale + cx;
      const py = (y / denom) * scale + cy;
      return { px, py, depth: denom };
    }

    // ---------- 3D 旋转 ----------
    function rotateY(x, y, z, ang) {
      const c = Math.cos(ang), s = Math.sin(ang);
      return [x * c + z * s, y, -x * s + z * c];
    }
    function rotateX(x, y, z, ang) {
      const c = Math.cos(ang), s = Math.sin(ang);
      return [x, y * c - z * s, y * s + z * c];
    }

    // ---------- 渲染 ----------
    // 双层发光模拟（禁用 shadowBlur）：
    //   外层：粗半径、低透明度（光晕）
    //   内层：细半径、高透明度（核心）
    function render() {
      const w = state.width, h = state.height;
      // 深色背景，带极轻微的径向氛围
      ctx.fillStyle = "#02030a";
      ctx.fillRect(0, 0, w, h);

      // 背景星点（确定性，固定位置）
      drawStarfield(w, h);

      const cx = w * 0.5;
      const cy = h * 0.5;
      const scale = Math.min(w, h) * 0.34 * PERSP_SCALE;

      const { radii } = computeRadii(state.t);

      // 计算所有点的投影位置与颜色，按深度排序（后→前）
      const projected = new Array(N_POINTS);
      for (let i = 0; i < N_POINTS; i++) {
        const p = points[i];
        const r = 1 + (radii[i] - 0.5) * 0.26; // 实际半径微调，视觉上呼吸幅度
        let x = p.x * r, y = p.y * r, z = p.z * r;
        // 先绕 Y 自转，再绕 X 缓慢俯仰
        let rr = rotateY(x, y, z, state.rotY);
        rr = rotateX(rr[0], rr[1], rr[2], state.rotX);
        const proj = project(rr[0], rr[1], rr[2], cx, cy, scale);
        projected[i] = {
          px: proj.px,
          py: proj.py,
          depth: proj.depth,
          rNorm: radii[i]
        };
      }
      // 按深度降序（远的先画）
      projected.sort((a, b) => b.depth - a.depth);

      // 第一遍：外层光晕（粗、低透明度）
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < N_POINTS; i++) {
        const p = projected[i];
        const [r, g, b] = radiusColor(p.rNorm);
        // 深度衰减：越远越暗
        const depthFade = Math.max(0.25, 1.6 / p.depth);
        const haloAlpha = 0.10 * depthFade;
        const haloRadius = 2.6 + p.rNorm * 1.8;
        ctx.fillStyle = `rgba(${r},${g},${b},${haloAlpha})`;
        ctx.beginPath();
        ctx.arc(p.px, p.py, haloRadius, 0, Math.PI * 2);
        ctx.fill();
      }

      // 第二遍：核心点（细、高透明度）
      for (let i = 0; i < N_POINTS; i++) {
        const p = projected[i];
        const [r, g, b] = radiusColor(p.rNorm);
        const depthFade = Math.max(0.3, 1.8 / p.depth);
        const coreAlpha = 0.75 * depthFade;
        const coreRadius = 0.7 + p.rNorm * 0.9;
        ctx.fillStyle = `rgba(${r},${g},${b},${coreAlpha})`;
        ctx.beginPath();
        ctx.arc(p.px, p.py, coreRadius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";

      // 更新读数
      const statusEl = document.getElementById("status");
      const timeEl = document.getElementById("timeReadout");
      const rotEl = document.getElementById("rotReadout");
      if (statusEl) statusEl.textContent = state.running ? "运行中" : "已暂停";
      if (timeEl) timeEl.textContent = state.t.toFixed(2) + " s";
      if (rotEl) {
        const deg = ((state.rotY * 180 / Math.PI) % 360 + 360) % 360;
        rotEl.textContent = deg.toFixed(1) + "°";
      }
    }

    // ---------- 背景星点（确定性） ----------
    const stars = [];
    const starRng = mulberry32(777);
    for (let i = 0; i < 140; i++) {
      stars.push({
        x: starRng(),
        y: starRng(),
        b: 0.15 + starRng() * 0.35,
        tw: starRng() * Math.PI * 2
      });
    }
    function drawStarfield(w, h) {
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        const twinkle = 0.7 + 0.3 * Math.sin(state.t * 0.8 + s.tw);
        const a = s.b * twinkle * 0.5;
        ctx.fillStyle = `rgba(180, 210, 255, ${a})`;
        ctx.fillRect(s.x * w, s.y * h, 1, 1);
      }
    }

    // ---------- 更新 ----------
    function update(dt) {
      if (!state.running) return;
      // 钳制帧间隔，防止挂起后跳变
      const cdt = Math.max(0, Math.min(0.05, dt));
      state.t += cdt;
      // 缓慢自转
      state.rotY += cdt * 0.18;
      // 极缓慢的俯仰漂移，增加层次
      state.rotX = Math.sin(state.t * 0.07) * 0.22;
    }

    // ---------- 主循环 ----------
    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    // ---------- 控制 ----------
    const playBtn = document.getElementById("playBtn");
    const playIcon = document.getElementById("playIcon");
    function setRunning(running) {
      state.running = running;
      playBtn.setAttribute("aria-pressed", String(running));
      if (running) {
        // 暂停图标
        playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
      } else {
        // 播放图标
        playIcon.innerHTML = '<path d="M7 5v14l12-7z"/>';
      }
      render();
    }
    playBtn.addEventListener("click", () => setRunning(!state.running));

    // 空格键也可控制
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        setRunning(!state.running);
      }
    });

    // ---------- 模型检查（暴露给验证） ----------
    function runModelChecks() {
      // 1. 半径始终为正
      const { radii } = computeRadii(state.t);
      let allFinite = true;
      let allPositive = true;
      for (let i = 0; i < radii.length; i++) {
        if (!Number.isFinite(radii[i])) allFinite = false;
      }
      // 2. 归一化后范围 [0,1]
      let minR = Infinity, maxR = -Infinity;
      for (let i = 0; i < radii.length; i++) {
        if (radii[i] < minR) minR = radii[i];
        if (radii[i] > maxR) maxR = radii[i];
      }
      const normalizedOk = minR >= -0.01 && maxR <= 1.01;
      // 3. 周期性：t=0 与 t=T（公共周期）应接近
      // 公共周期近似：取最大周期的 2π
      const T = (2 * Math.PI) / 0.46; // 最慢频率的周期
      const r0 = computeRadii(0).radii;
      const rT = computeRadii(T).radii;
      let maxDiff = 0;
      for (let i = 0; i < r0.length; i++) {
        const d = Math.abs(r0[i] - rT[i]);
        if (d > maxDiff) maxDiff = d;
      }
      const periodicOk = maxDiff < 0.02;
      // 4. 颜色函数边界
      const c0 = radiusColor(0);
      const c1 = radiusColor(1);
      const colorBoundOk = c0[0] === 30 && c1[0] === 94;
      // 5. 投影深度为正
      const proj = project(0, 0, 0, 0, 0, 1);
      const depthOk = proj.depth > 0;
      return [
        { name: "所有半径为有限值", pass: allFinite, expected: "finite", actual: "finite=" + allFinite, tolerance: "strict" },
        { name: "归一化半径范围 [0,1]", pass: normalizedOk, expected: "[0,1]", actual: `min=${minR.toFixed(3)}, max=${maxR.toFixed(3)}`, tolerance: 0.02 },
        { name: "公共周期可重复性", pass: periodicOk, expected: "maxDiff<0.02", actual: "maxDiff=" + maxDiff.toFixed(4), tolerance: 0.02 },
        { name: "颜色边界正确", pass: colorBoundOk, expected: "inner=深蓝, outer=亮青", actual: `inner=[${c0}], outer=[${c1}]`, tolerance: "strict" },
        { name: "投影深度为正", pass: depthOk, expected: "depth>0", actual: "depth=" + proj.depth.toFixed(3), tolerance: "strict" }
      ];
    }

    // ---------- 生命周期钩子 ----------
    function init() {
      resize();
      render();
      requestAnimationFrame(frame);
    }
    function start() { setRunning(true); }
    function pause() { setRunning(false); }
    function reset() {
      state.t = 0;
      state.rotY = 0;
      state.rotX = 0;
      state.lastTimestamp = null;
      render();
    }
    function setParameters(values) {
      // 当前无外部可调参数，保留接口以满足契约
      void values;
    }
    function getState() {
      return {
        running: state.running,
        t: state.t,
        rotY: state.rotY,
        rotX: state.rotX
      };
    }
    function getReadouts() {
      return {
        t: state.t,
        rotY: state.rotY,
        rotX: state.rotX
      };
    }

    // ---------- 启动 ----------
    window.simulation = {
      init,
      start,
      pause,
      reset,
      update,
      render,
      setParameters,
      getState,
      getReadouts,
      runModelChecks
    };

    init();
  })();
  </script>
</body>
</html>
