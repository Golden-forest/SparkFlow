<!doctype html>
<html lang="zh-CN">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电解池与电镀演示</title>
<style>
:root {
  color-scheme: light;
  --sim-bg: #eef3f8;
  --sim-surface: #ffffff;
  --sim-surface-soft: #f8fafc;
  --sim-text: #172033;
  --sim-muted: #657188;
  --sim-border: #dfe6ef;
  --sim-grid: #e8edf4;
  --sim-accent: #0f9fba;
  --sim-accent-deep: #08758a;
  --sim-accent-soft: #d9f4f7;
  --sim-positive: #0f9fba;
  --sim-warning: #f59e0b;
  --sim-danger: #dc2626;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
  --sim-electron: #2563eb;
  --sim-electron-soft: rgba(37, 99, 235, 0.12);
  --sim-copper: #b87333;
  --sim-copper-bright: #d97a3a;
  --sim-chloride: #16a34a;
  --sim-chloride-soft: rgba(22, 163, 74, 0.12);
  --sim-chlorine: #84cc16;
  --sim-iron: #64748b;
  --sim-solution: #2d8b6c;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--sim-text);
  background:
    radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
    radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
    var(--sim-bg);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
.app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
.header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
.header h1 { margin: 0 0 5px; font-size: clamp(1.5rem, 2.2vw, 2rem); letter-spacing: -0.035em; line-height: 1; }
.header p { margin: 0; color: var(--sim-muted); font-size: 0.85rem; }
.header-controls { display: flex; gap: 10px; align-items: center; }
.mode-badge { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 8px 16px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; font-size: 0.85rem; white-space: nowrap; }
.status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 8px 14px; background: var(--sim-surface-soft); color: var(--sim-muted); font-weight: 700; white-space: nowrap; font-size: 0.85rem; }
.status.running { background: var(--sim-accent-soft); color: var(--sim-accent-deep); border-color: rgba(15,159,186,.3); }
.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 12px; }
.panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
.scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.panel-head h2 { margin: 0; font-size: 1rem; }
.panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
#scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); }
.side { min-height: 0; display: grid; grid-template-rows: auto minmax(140px, 0.9fr) auto; gap: 12px; }
.readouts { padding: 14px; }
.readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.metric { padding: 12px; border: 1px solid rgba(15,159,186,.12); border-radius: 14px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
.metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); font-size: 0.72rem; }
.metric strong { font-size: 1.25rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.evidence-panel { padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; overflow: hidden; }
#chart { width: 100%; height: 100%; min-height: 100px; display: block; border: 1px solid rgba(15,159,186,.1); border-radius: 10px; background: #fcfeff; }
.insight-panel { padding: 14px; }
.insight { padding: 12px 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a; font-weight: 600; font-size: 0.85rem; line-height: 1.5; }
.controls { padding: 11px 14px; display: grid; grid-template-columns: auto minmax(120px, 0.8fr) minmax(120px, 0.8fr) minmax(120px, 0.8fr); gap: 14px; align-items: center; border-radius: 17px; }
.actions { display: flex; gap: 8px; }
button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
button:hover { border-color: #c7d2e2; background: #eef3f9; }
button:active { transform: scale(.97); }
button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
button.mode-btn { padding: 8px 12px; font-size: 0.82rem; }
button.mode-btn[aria-pressed="true"] { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 6px 14px rgba(15,159,186,.18); }
.control label { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 5px; font-size: 0.78rem; font-weight: 700; }
.control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.72rem; color: var(--sim-muted); }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); }
@media (max-width: 960px) {
  .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
  .main { grid-template-columns: 1fr; }
  .controls { grid-template-columns: 1fr; }
  .scene-panel { min-height: 0; }
  #scene { min-height: 0; height: auto; aspect-ratio: 760 / 460; }
  .header { flex-direction: column; align-items: flex-start; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="qualitative">
  <header class="header" data-region="header">
    <div>
      <h1>电解池与电镀演示</h1>
      <p>惰性电极电解 CuCl₂ 溶液 · 铁制品镀铜 · 观察氧化还原、电子流向与离子迁移</p>
    </div>
    <div class="header-controls">
      <div id="modeBadge" class="mode-badge">电解池模式</div>
      <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
    </div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head">
        <h2 id="scene-title">电解槽</h2>
        <div class="legend">
          <span class="legend-item"><span class="legend-swatch" style="background:#2563eb"></span>电子流</span>
          <span class="legend-item"><span class="legend-swatch" style="background:#16a34a"></span>Cl⁻ 迁移</span>
          <span class="legend-item"><span class="legend-swatch" style="background:#b87333"></span>Cu²⁺ 迁移</span>
          <span class="legend-item"><span class="legend-swatch" style="background:#84cc16"></span>Cl₂ 气泡</span>
        </div>
      </div>
      <svg id="scene" viewBox="0 0 760 460" role="img" aria-labelledby="scene-title scene-desc">
        <desc id="scene-desc">电解槽显示两个电极、溶液、气泡、铜层析出、电子流向箭头和离子迁移箭头。</desc>
        <defs>
          <linearGradient id="solutionGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3a9b7a" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#2d8b6c" stop-opacity="0.75"/>
          </linearGradient>
          <linearGradient id="copperGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#a05a28"/>
            <stop offset="50%" stop-color="#d97a3a"/>
            <stop offset="100%" stop-color="#a05a28"/>
          </linearGradient>
          <linearGradient id="ironGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#475569"/>
            <stop offset="50%" stop-color="#64748b"/>
            <stop offset="100%" stop-color="#475569"/>
          </linearGradient>
          <linearGradient id="anodeGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#374151"/>
            <stop offset="50%" stop-color="#6b7280"/>
            <stop offset="100%" stop-color="#374151"/>
          </linearGradient>
          <marker id="arrowE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
          </marker>
          <marker id="arrowCl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
          </marker>
          <marker id="arrowCu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#b87333"/>
          </marker>
        </defs>

        <!-- 电源 -->
        <g id="battery">
          <line x1="220" y1="50" x2="220" y2="120" stroke="#475569" stroke-width="3"/>
          <line x1="540" y1="50" x2="540" y2="120" stroke="#475569" stroke-width="3"/>
          <line x1="220" y1="50" x2="340" y2="50" stroke="#475569" stroke-width="3"/>
          <line x1="420" y1="50" x2="540" y2="50" stroke="#475569" stroke-width="3"/>
          <rect x="340" y="38" width="80" height="24" rx="4" fill="#1e293b"/>
          <text x="380" y="55" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">DC</text>
          <text x="330" y="46" text-anchor="end" fill="#dc2626" font-size="16" font-weight="800">+</text>
          <text x="430" y="46" fill="#2563eb" font-size="16" font-weight="800">−</text>
        </g>

        <!-- 电解槽容器 -->
        <rect x="140" y="120" width="480" height="290" rx="6" fill="none" stroke="#94a3b8" stroke-width="3"/>
        <rect x="140" y="180" width="480" height="225" fill="url(#solutionGrad)" id="solutionRect"/>

        <!-- 液面线 -->
        <line x1="140" y1="180" x2="620" y2="180" stroke="#3a9b7a" stroke-width="1.5" opacity="0.6"/>

        <!-- 阳极 (左) -->
        <g id="anodeGroup">
          <rect id="anodeBase" x="210" y="130" width="20" height="250" rx="3" fill="url(#anodeGrad)"/>
          <rect id="anodeCopper" x="206" y="180" width="28" height="220" rx="3" fill="url(#copperGrad)" opacity="0"/>
        </g>

        <!-- 阴极 (右) -->
        <g id="cathodeGroup">
          <rect id="cathodeBase" x="530" y="130" width="20" height="250" rx="3" fill="url(#anodeGrad)"/>
          <rect id="cathodeCopper" x="526" y="180" width="28" height="220" rx="3" fill="url(#copperGrad)" opacity="0"/>
        </g>

        <!-- 电极标签 -->
        <text id="anodeLabel" x="220" y="395" text-anchor="middle" fill="#dc2626" font-size="13" font-weight="800">阳极</text>
        <text id="cathodeLabel" x="540" y="395" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="800">阴极</text>
        <text id="anodeReaction" x="220" y="415" text-anchor="middle" fill="#657188" font-size="10">2Cl⁻−2e⁻→Cl₂↑</text>
        <text id="cathodeReaction" x="540" y="415" text-anchor="middle" fill="#657188" font-size="10">Cu²⁺+2e⁻→Cu</text>

        <!-- 电子流箭头 (外电路) -->
        <g id="electronArrows" opacity="0.85">
          <path id="ePath1" d="M 540 120 L 540 50" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arrowE)"/>
          <path id="ePath2" d="M 420 50 L 340 50" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arrowE)"/>
          <path id="ePath3" d="M 220 50 L 220 120" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arrowE)"/>
        </g>
        <text x="380" y="42" text-anchor="middle" fill="#2563eb" font-size="11" font-weight="700">电子流方向 e⁻</text>

        <!-- 离子迁移箭头 -->
        <g id="ionArrows">
          <path id="clArrow" d="M 280 280 L 240 280" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrowCl)" opacity="0.7"/>
          <text x="262" y="270" text-anchor="middle" fill="#16a34a" font-size="10" font-weight="600">Cl⁻→</text>
          <path id="cuArrow" d="M 480 280 L 510 280" stroke="#b87333" stroke-width="2" fill="none" marker-end="url(#arrowCu)" opacity="0.7"/>
          <text x="498" y="270" text-anchor="middle" fill="#b87333" font-size="10" font-weight="600">←Cu²⁺</text>
        </g>

        <!-- 动态层：气泡、粒子 -->
        <g id="dynamicLayer"></g>
      </svg>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel readouts" aria-label="实时读数">
        <div class="readout-grid">
          <div class="metric"><small>Cu²⁺ 浓度</small><strong id="concReadout">1.00 mol/L</strong></div>
          <div class="metric"><small>已析出铜质量</small><strong id="copperReadout">0.00 g</strong></div>
          <div class="metric"><small>Cl₂ 气体体积</small><strong id="chlorineReadout">0.00 mL</strong></div>
          <div class="metric"><small>已耗时间</small><strong id="timeReadout">0.0 s</strong></div>
        </div>
      </section>
      <section class="panel evidence-panel">
        <div class="panel-head"><h2>浓度变化</h2><span>Cu²⁺ 随时间</span></div>
        <svg id="chart" viewBox="0 0 300 140" preserveAspectRatio="none" role="img" aria-label="浓度时间曲线">
          <line x1="30" y1="120" x2="290" y2="120" stroke="#9aa7ba" stroke-width="1.5"/>
          <line x1="30" y1="10" x2="30" y2="120" stroke="#9aa7ba" stroke-width="1.5"/>
          <text x="295" y="118" fill="#657188" font-size="9">t</text>
          <text x="6" y="16" fill="#657188" font-size="9">C</text>
          <polyline id="chartTrace" points="" fill="none" stroke="#b87333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle id="chartMarker" cx="30" cy="20" r="3.5" fill="#d97a3a" stroke="#fff" stroke-width="1.5"/>
        </svg>
      </section>
      <section class="panel insight-panel" data-region="insight">
        <div class="insight" id="insight">按"开始"启动电解。阳极：氯离子失电子氧化为氯气；阴极：铜离子得电子还原析出铜。电子从负极经外电路流向阴极。</div>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="模拟控制">
    <div class="actions">
      <button id="startBtn" class="primary" type="button">开始</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control">
      <label>模式切换</label>
      <div style="display:flex;gap:6px">
        <button id="modeElectrolysis" class="mode-btn" type="button" aria-pressed="true">电解池</button>
        <button id="modePlating" class="mode-btn" type="button" aria-pressed="false">电镀</button>
      </div>
    </div>
    <div class="control">
      <label for="currentInput">电流强度 <output id="currentOutput">0.5 A</output></label>
      <input id="currentInput" type="range" min="0.2" max="2" step="0.1" value="0.5">
    </div>
    <div class="control">
      <label for="concInput">初始 Cu²⁺ 浓度 <output id="concOutput">1.0 mol/L</output></label>
      <input id="concInput" type="range" min="0.2" max="2" step="0.1" value="1.0">
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const parameterSchema = [
    { key: "current", label: "电流强度", type: "slider", min: 0.2, max: 2, step: 0.1, default: 0.5, unit: "A" },
    { key: "initialConc", label: "初始浓度", type: "slider", min: 0.2, max: 2, step: 0.1, default: 1.0, unit: "mol/L" }
  ];

  // Cu 的摩尔质量 63.5 g/mol；Cu²⁺ + 2e⁻ → Cu，每 mol Cu 需 2F 电量
  // Cl⁻ 的反应：2Cl⁻ → Cl₂ + 2e⁻，每 mol Cl₂ 需 2F 电量
  // F = 96485 C/mol；为教学演示，时间已加速
  const CU_MOLAR_MASS = 63.5;
  const FARADAY = 96485;
  const CL2_MOLAR_VOLUME = 22400; // mL/mol (STP, 教学用)

  const state = {
    running: false,
    mode: "electrolysis", // "electrolysis" | "plating"
    t: 0,
    current: 0.5,
    initialConc: 1.0,
    conc: 1.0,
    copperMass: 0,
    chlorineVolume: 0,
    lastTimestamp: null,
    history: [{ t: 0, c: 1.0 }],
    particles: [],
    bubbles: [],
    nextParticleTime: 0,
    nextBubbleTime: 0
  };

  const elements = {
    status: document.querySelector("#status"),
    modeBadge: document.querySelector("#modeBadge"),
    anodeBase: document.querySelector("#anodeBase"),
    anodeCopper: document.querySelector("#anodeCopper"),
    cathodeBase: document.querySelector("#cathodeBase"),
    cathodeCopper: document.querySelector("#cathodeCopper"),
    anodeLabel: document.querySelector("#anodeLabel"),
    cathodeLabel: document.querySelector("#cathodeLabel"),
    anodeReaction: document.querySelector("#anodeReaction"),
    cathodeReaction: document.querySelector("#cathodeReaction"),
    solutionRect: document.querySelector("#solutionRect"),
    dynamicLayer: document.querySelector("#dynamicLayer"),
    electronArrows: document.querySelector("#electronArrows"),
    ionArrows: document.querySelector("#ionArrows"),
    concReadout: document.querySelector("#concReadout"),
    copperReadout: document.querySelector("#copperReadout"),
    chlorineReadout: document.querySelector("#chlorineReadout"),
    timeReadout: document.querySelector("#timeReadout"),
    chartTrace: document.querySelector("#chartTrace"),
    chartMarker: document.querySelector("#chartMarker"),
    insight: document.querySelector("#insight"),
    currentInput: document.querySelector("#currentInput"),
    currentOutput: document.querySelector("#currentOutput"),
    concInput: document.querySelector("#concInput"),
    concOutput: document.querySelector("#concOutput"),
    startBtn: document.querySelector("#startBtn"),
    pauseBtn: document.querySelector("#pauseBtn"),
    resetBtn: document.querySelector("#resetBtn"),
    modeElectrolysis: document.querySelector("#modeElectrolysis"),
    modePlating: document.querySelector("#modePlating")
  };

  function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
  function finite(v, fallback) { return Number.isFinite(v) ? v : fallback; }

  // 教学时间加速因子：让反应在可观察时间内发生
  const TIME_SCALE = 40;

  function init() {
    bindControls();
    setParameters({ current: 0.5, initialConc: 1.0 });
    setMode("electrolysis");
    reset();
    requestAnimationFrame(frame);
  }

  function start() {
    state.running = true;
    elements.status.textContent = "运行中";
    elements.status.classList.add("running");
    elements.startBtn.setAttribute("aria-pressed", "true");
  }

  function pause() {
    state.running = false;
    elements.status.textContent = "已暂停";
    elements.status.classList.remove("running");
    elements.startBtn.setAttribute("aria-pressed", "false");
  }

  function reset() {
    pause();
    state.t = 0;
    state.conc = state.initialConc;
    state.copperMass = 0;
    state.chlorineVolume = 0;
    state.lastTimestamp = null;
    state.history = [{ t: 0, c: state.initialConc }];
    state.particles = [];
    state.bubbles = [];
    state.nextParticleTime = 0;
    state.nextBubbleTime = 0;
    elements.dynamicLayer.innerHTML = "";
    render();
  }

  function setMode(mode) {
    state.mode = mode;
    if (mode === "electrolysis") {
      elements.modeBadge.textContent = "电解池模式";
      elements.modeElectrolysis.setAttribute("aria-pressed", "true");
      elements.modePlating.setAttribute("aria-pressed", "false");
      // 惰性电极
      elements.anodeBase.setAttribute("fill", "url(#anodeGrad)");
      elements.cathodeBase.setAttribute("fill", "url(#anodeGrad)");
      elements.anodeLabel.textContent = "阳极";
      elements.cathodeLabel.textContent = "阴极";
      elements.anodeReaction.textContent = "2Cl⁻−2e⁻→Cl₂↑";
      elements.cathodeReaction.textContent = "Cu²⁺+2e⁻→Cu";
    } else {
      elements.modeBadge.textContent = "电镀模式";
      elements.modeElectrolysis.setAttribute("aria-pressed", "false");
      elements.modePlating.setAttribute("aria-pressed", "true");
      // 阳极为铜（镀层来源），阴极为铁制品
      elements.anodeBase.setAttribute("fill", "url(#copperGrad)");
      elements.cathodeBase.setAttribute("fill", "url(#ironGrad)");
      elements.anodeLabel.textContent = "铜(阳极)";
      elements.cathodeLabel.textContent = "铁制品(阴极)";
      elements.anodeReaction.textContent = "Cu−2e⁻→Cu²⁺";
      elements.cathodeReaction.textContent = "Cu²⁺+2e⁻→Cu";
    }
    render();
  }

  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05);
    const simDt = boundedDt * TIME_SCALE;

    // 电量 Q = I × t (C)
    const charge = state.current * simDt;
    // 析出铜的物质的量 = Q / (2F)
    const cuMol = charge / (2 * FARADAY);
    const cuDeltaMass = cuMol * CU_MOLAR_MASS;

    // 氯气体积（仅电解池模式产生）
    if (state.mode === "electrolysis") {
      const cl2Mol = charge / (2 * FARADAY);
      state.chlorineVolume += cl2Mol * CL2_MOLAR_VOLUME;
    }

    // 浓度变化：假设溶液体积 0.5 L
    const solutionVolume = 0.5; // L
    const concDelta = cuMol / solutionVolume;

    if (state.mode === "electrolysis") {
      // 电解池：Cu²⁺ 被消耗，浓度下降
      state.conc = Math.max(0, state.conc - concDelta);
    } else {
      // 电镀：阳极铜溶解补充 Cu²⁺，阴极消耗 Cu²⁺，净浓度近似不变
      // 但为教学可视化，让浓度有微小波动后稳定
      // 实际上电镀液浓度维持稳定，这里保持基本不变
    }

    state.copperMass += cuDeltaMass;
    state.t += simDt;

    // 记录历史
    if (state.history.length === 0 || state.t - state.history[state.history.length - 1].t >= 0.5) {
      state.history.push({ t: state.t, c: state.conc });
      if (state.history.length > 300) state.history.shift();
    }

    // 生成粒子（离子迁移可视化）
    state.nextParticleTime -= boundedDt;
    if (state.nextParticleTime <= 0) {
      state.nextParticleTime = 0.15 / Math.max(0.3, state.current);
      spawnParticles();
    }

    // 生成气泡（仅电解池模式阳极产生氯气）
    if (state.mode === "electrolysis") {
      state.nextBubbleTime -= boundedDt;
      if (state.nextBubbleTime <= 0) {
        state.nextBubbleTime = 0.3 / Math.max(0.3, state.current);
        spawnBubble();
      }
    }

    // 更新粒子
    state.particles = state.particles.filter(p => {
      p.progress += boundedDt * p.speed;
      return p.progress < 1;
    });

    // 更新气泡
    state.bubbles = state.bubbles.filter(b => {
      b.y -= boundedDt * b.speed;
      b.opacity -= boundedDt * 0.5;
      return b.y > 180 && b.opacity > 0;
    });

    // 检查是否耗尽
    if (state.mode === "electrolysis" && state.conc <= 0.001) {
      state.conc = 0;
      pause();
      elements.status.textContent = "反应完成";
    }
  }

  function spawnParticles() {
    // Cu²⁺ 粒子从溶液向阴极迁移
    const cuCount = 2;
    for (let i = 0; i < cuCount; i++) {
      state.particles.push({
        type: "cu",
        startX: 260 + Math.random() * 240,
        startY: 200 + Math.random() * 180,
        endX: 530,
        endY: 200 + Math.random() * 180,
        progress: 0,
        speed: 0.4 + Math.random() * 0.3
      });
    }
    // Cl⁻ 粒子从溶液向阳极迁移（仅电解池模式）
    if (state.mode === "electrolysis") {
      const clCount = 2;
      for (let i = 0; i < clCount; i++) {
        state.particles.push({
          type: "cl",
          startX: 260 + Math.random() * 240,
          startY: 200 + Math.random() * 180,
          endX: 230,
          endY: 200 + Math.random() * 180,
          progress: 0,
          speed: 0.4 + Math.random() * 0.3
        });
      }
    } else {
      // 电镀模式：Cu²⁺ 从阳极溶解出来向阴极迁移
      state.particles.push({
        type: "cu",
        startX: 230,
        startY: 200 + Math.random() * 180,
        endX: 530,
        endY: 200 + Math.random() * 180,
        progress: 0,
        speed: 0.4 + Math.random() * 0.3
      });
    }
  }

  function spawnBubble() {
    state.bubbles.push({
      x: 210 + Math.random() * 20,
      y: 180 + Math.random() * 20,
      r: 3 + Math.random() * 4,
      speed: 30 + Math.random() * 20,
      opacity: 0.8
    });
  }

  function render() {
    // 溶液颜色：随 Cu²⁺ 浓度变化
    const concRatio = state.mode === "electrolysis"
      ? state.conc / Math.max(0.01, state.initialConc)
      : 1; // 电镀模式浓度基本不变
    const solutionOpacity = 0.4 + 0.35 * concRatio;
    const blue = Math.floor(123 + 20 * concRatio);
    const green = Math.floor(139 - 10 * concRatio);
    elements.solutionRect.setAttribute("fill-opacity", solutionOpacity);
    elements.solutionRect.setAttribute("fill", `rgb(45, ${green + Math.floor(20*concRatio)}, ${blue})`);

    // 阴极铜层厚度（电解池：阴极变粗；电镀：铁制品表面镀铜）
    const copperThickness = clamp(state.copperMass * 8, 0, 14);
    if (state.mode === "electrolysis") {
      // 阴极（右）析出铜
      elements.cathodeCopper.setAttribute("opacity", "1");
      elements.cathodeCopper.setAttribute("x", 530 - copperThickness / 2);
      elements.cathodeCopper.setAttribute("width", 20 + copperThickness);
      // 阳极不变
      elements.anodeCopper.setAttribute("opacity", "0");
    } else {
      // 电镀：阴极（铁制品）表面镀铜
      elements.cathodeCopper.setAttribute("opacity", "1");
      elements.cathodeCopper.setAttribute("x", 530 - copperThickness / 2);
      elements.cathodeCopper.setAttribute("width", 20 + copperThickness);
      // 阳极（铜）逐渐变细
      const anodeShrink = clamp(state.copperMass * 4, 0, 8);
      elements.anodeBase.setAttribute("x", 210 + anodeShrink / 2);
      elements.anodeBase.setAttribute("width", 20 - anodeShrink);
      elements.anodeCopper.setAttribute("opacity", "0");
    }

    // 电子流箭头动画（虚线流动）
    const dashOffset = -(state.t * 30) % 20;
    elements.electronArrows.querySelectorAll("path").forEach(p => {
      p.setAttribute("stroke-dashoffset", dashOffset);
    });

    // 离子箭头可见性
    elements.ionArrows.style.opacity = state.running ? "0.8" : "0.4";

    // 渲染粒子
    let particleSvg = "";
    for (const p of state.particles) {
      const x = p.startX + (p.endX - p.startX) * p.progress;
      const y = p.startY + (p.endY - p.startY) * p.progress;
      const opacity = p.progress < 0.1 ? p.progress * 10 : (p.progress > 0.9 ? (1 - p.progress) * 10 : 1);
      if (p.type === "cu") {
        particleSvg += `<circle cx="${x}" cy="${y}" r="4" fill="#b87333" opacity="${opacity * 0.85}"/>`;
        particleSvg += `<text x="${x}" y="${y + 3}" text-anchor="middle" fill="#fff" font-size="7" font-weight="700">Cu²⁺</text>`;
      } else {
        particleSvg += `<circle cx="${x}" cy="${y}" r="4" fill="#16a34a" opacity="${opacity * 0.85}"/>`;
        particleSvg += `<text x="${x}" y="${y + 3}" text-anchor="middle" fill="#fff" font-size="7" font-weight="700">Cl⁻</text>`;
      }
    }

    // 渲染气泡
    for (const b of state.bubbles) {
      particleSvg += `<circle cx="${b.x}" cy="${b.y}" r="${b.r}" fill="#84cc16" opacity="${b.opacity * 0.7}" stroke="#65a30d" stroke-width="0.5"/>`;
    }

    elements.dynamicLayer.innerHTML = particleSvg;

    // 读数
    elements.concReadout.textContent = `${state.conc.toFixed(2)} mol/L`;
    elements.copperReadout.textContent = `${state.copperMass.toFixed(2)} g`;
    elements.chlorineReadout.textContent = `${state.chlorineVolume.toFixed(1)} mL`;
    elements.timeReadout.textContent = `${state.t.toFixed(1)} s`;
    elements.currentOutput.textContent = `${state.current.toFixed(1)} A`;
    elements.concOutput.textContent = `${state.initialConc.toFixed(1)} mol/L`;

    // 图表
    const maxT = Math.max(20, state.t);
    const maxC = 2.0;
    const point = (s) => `${30 + (s.t / maxT) * 260},${120 - (s.c / maxC) * 105}`;
    elements.chartTrace.setAttribute("points", state.history.map(point).join(" "));
    const lastPoint = point({ t: state.t, c: state.conc }).split(",");
    elements.chartMarker.setAttribute("cx", lastPoint[0]);
    elements.chartMarker.setAttribute("cy", lastPoint[1]);

    // 观察提示
    if (!state.running && state.t === 0) {
      elements.insight.textContent = state.mode === "electrolysis"
        ? "按\"开始\"启动电解。阳极：氯离子失电子氧化为氯气气泡；阴极：铜离子得电子还原析出铜。电子从负极经外电路流向阴极。"
        : "按\"开始\"启动电镀。阳极铜溶解补充 Cu²⁺；阴极铁制品表面析出铜镀层。电镀液浓度基本维持稳定。";
    } else if (state.mode === "electrolysis") {
      if (state.conc > state.initialConc * 0.6) {
        elements.insight.textContent = `电解进行中：Cu²⁺ 向阴极迁移并析出铜，Cl⁻ 向阳极迁移并生成氯气气泡。溶液蓝绿色逐渐变浅。`;
      } else if (state.conc > state.initialConc * 0.2) {
        elements.insight.textContent = `Cu²⁺ 浓度明显下降，溶液颜色变浅。阴极铜层增厚，阳极氯气持续冒出。`;
      } else if (state.conc > 0.001) {
        elements.insight.textContent = `接近耗尽：Cu²⁺ 几乎完全消耗，溶液接近无色。电解反应即将结束。`;
      } else {
        elements.insight.textContent = `电解完成：Cu²⁺ 已耗尽，溶液无色。阴极析出铜层，阳极收集到氯气。`;
      }
    } else {
      if (state.copperMass < 1) {
        elements.insight.textContent = `电镀进行中：阳极铜溶解为 Cu²⁺ 进入溶液，阴极铁制品表面逐渐镀上红色铜层。`;
      } else if (state.copperMass < 3) {
        elements.insight.textContent = `镀层增厚：铜层均匀覆盖铁制品表面。阳极铜持续溶解补充 Cu²⁺，溶液浓度维持稳定。`;
      } else {
        elements.insight.textContent = `镀层较厚：铁制品已完全镀铜。这是工业电镀的基本原理。`;
      }
    }
  }

  function setParameters(values) {
    const curDef = parameterSchema[0], concDef = parameterSchema[1];
    state.current = clamp(finite(Number(values.current), curDef.default), curDef.min, curDef.max);
    state.initialConc = clamp(finite(Number(values.initialConc), concDef.default), concDef.min, concDef.max);
    if (state.t === 0) state.conc = state.initialConc;
    elements.currentInput.value = String(state.current);
    elements.concInput.value = String(state.initialConc);
    render();
  }

  function getState() {
    return { ...state, history: state.history.map(s => ({ ...s })) };
  }

  function getReadouts() {
    return {
      conc: state.conc,
      copperMass: state.copperMass,
      chlorineVolume: state.chlorineVolume,
      time: state.t,
      current: state.current,
      mode: state.mode
    };
  }

  function runModelChecks() {
    // 验证法拉第电解定律的定性关系
    const simulate = (current, duration, mode) => {
      const charge = current * duration;
      const cuMol = charge / (2 * FARADAY);
      const cuMass = cuMol * CU_MOL_MASS;
      const cl2Vol = mode === "electrolysis" ? (charge / (2 * FARADAY)) * CL2_MOLAR_VOLUME : 0;
      return { cuMass, cl2Vol };
    };

    const base = simulate(0.5, 10, "electrolysis");
    const highCurrent = simulate(1.0, 10, "electrolysis");
    const longTime = simulate(0.5, 20, "electrolysis");
    const plating = simulate(0.5, 10, "plating");

    return [
      {
        name: "电流与析出量成正比",
        pass: Math.abs(highCurrent.cuMass / base.cuMass - 2) < 0.01,
        expected: "2× 电流 → 2× 铜质量",
        actual: `${highCurrent.cuMass.toFixed(4)} / ${base.cuMass.toFixed(4)} = ${(highCurrent.cuMass / base.cuMass).toFixed(3)}`,
        tolerance: 0.01
      },
      {
        name: "时间与析出量成正比",
        pass: Math.abs(longTime.cuMass / base.cuMass - 2) < 0.01,
        expected: "2× 时间 → 2× 铜质量",
        actual: `${longTime.cuMass.toFixed(4)} / ${base.cuMass.toFixed(4)} = ${(longTime.cuMass / base.cuMass).toFixed(3)}`,
        tolerance: 0.01
      },
      {
        name: "电镀模式不产生氯气",
        pass: plating.cl2Vol === 0,
        expected: 0,
        actual: plating.cl2Vol,
        tolerance: 0
      },
      {
        name: "法拉第定律定量关系",
        pass: Math.abs(base.cuMass - (0.5 * 10 * CU_MOLAR_MASS / (2 * FARADAY))) < 1e-10,
        expected: 0.5 * 10 * CU_MOLAR_MASS / (2 * FARADAY),
        actual: base.cuMass,
        tolerance: 1e-10
      },
      {
        name: "浓度非负",
        pass: state.conc >= 0,
        expected: "conc >= 0",
        actual: state.conc,
        tolerance: "non-negative"
      },
      {
        name: "铜质量非负且有限",
        pass: state.copperMass >= 0 && Number.isFinite(state.copperMass),
        expected: "finite & non-negative",
        actual: state.copperMass,
        tolerance: "finite"
      }
    ];
  }

  function bindControls() {
    elements.startBtn.addEventListener("click", start);
    elements.pauseBtn.addEventListener("click", pause);
    elements.resetBtn.addEventListener("click", reset);
    elements.modeElectrolysis.addEventListener("click", () => { setMode("electrolysis"); reset(); });
    elements.modePlating.addEventListener("click", () => { setMode("plating"); reset(); });
    elements.currentInput.addEventListener("input", () => setParameters({ current: elements.currentInput.value, initialConc: state.initialConc }));
    elements.concInput.addEventListener("input", () => setParameters({ current: state.current, initialConc: elements.concInput.value }));
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, setMode, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
