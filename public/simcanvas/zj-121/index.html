<style>

<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>圆锥曲线光学性质</h1>
      <p>抛物面聚焦 · 椭圆双焦点互镜 · 双曲线反向延长</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">就绪</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head"><h2 id="scene-title">光学演示</h2><span id="scene-subtitle">抛物线聚焦模式</span></div>
      <svg id="scene" viewBox="0 0 760 460" role="img" aria-labelledby="scene-title scene-desc">
        <desc id="scene-desc">圆锥曲线反射面与光线追踪路径。</desc>
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g id="layer-curve"></g>
        <g id="layer-foci"></g>
        <g id="layer-rays"></g>
        <g id="layer-labels"></g>
      </svg>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel mode-panel" aria-label="模式切换">
        <h3>模式切换</h3>
        <button class="mode-btn active" data-mode="parabola" type="button">
          <span class="dot"></span>
          <span><span class="label">抛物线聚焦</span><span class="desc">平行光→焦点</span></span>
        </button>
        <button class="mode-btn" data-mode="ellipse" type="button">
          <span class="dot"></span>
          <span><span class="label">椭圆双焦点</span><span class="desc">焦点→另一焦点</span></span>
        </button>
        <button class="mode-btn" data-mode="hyperbola" type="button">
          <span class="dot"></span>
          <span><span class="label">双曲线反向延长</span><span class="desc">反射延长线→虚焦点</span></span>
        </button>
      </section>

      <section class="panel readouts" aria-label="实时数据">
        <div class="readout-grid">
          <div class="metric"><small>光线数量</small><strong id="rayCountReadout">7</strong></div>
          <div class="metric"><small>已绘制</small><strong id="drawnReadout">0</strong></div>
          <div class="metric"><small>焦点距离 c</small><strong id="focusReadout">1.50</strong></div>
          <div class="metric"><small>参数</small><strong id="paramReadout">f=1.50</strong></div>
        </div>
      </section>

      <section class="panel insight-panel" data-region="insight">
        <h3>原理</h3>
        <p id="insight" class="insight">平行光经抛物面反射后，每根光线都经过焦点——这就是卫星天线和手电筒的原理。</p>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="控制">
    <div class="actions">
      <button id="emitBtn" class="primary" type="button">发射光线</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control">
      <label for="rayCountInput">光线数量 <output id="rayCountOutput">7</output></label>
      <input id="rayCountInput" type="range" min="3" max="15" step="1" value="7">
    </div>
    <div class="control">
      <label for="paramInput" id="paramLabel">焦距 f <output id="paramOutput">1.50</output></label>
      <input id="paramInput" type="range" min="0.8" max="2.5" step="0.05" value="1.5">
    </div>
    <div class="control">
      <label for="speedInput">绘制速度 <output id="speedOutput">1.0×</output></label>
      <input id="speedInput" type="range" min="0.3" max="3" step="0.1" value="1">
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  // ====== 坐标变换 ======
  const SVG_W = 760, SVG_H = 460;
  const CX = 380, CY = 280;
  const SCALE = 70;

  function w2s(wx, wy) {
    return { x: CX + wx * SCALE, y: CY - wy * SCALE };
  }

  function clamp(v, mn, mx) { return Math.min(mx, Math.max(mn, v)); }
  function finite(v, fb) { return Number.isFinite(v) ? v : fb; }

  // ====== 反射定律 ======
  function reflect(d, n) {
    const dot = d.x * n.x + d.y * n.y;
    return { x: d.x - 2 * dot * n.x, y: d.y - 2 * dot * n.y };
  }

  function normalize(v) {
    const len = Math.hypot(v.x, v.y);
    if (len < 1e-12) return { x: 1, y: 0 };
    return { x: v.x / len, y: v.y / len };
  }

  // ====== 几何模式 ======
  const modes = {
    parabola: {
      name: "抛物线聚焦",
      color: "var(--sim-parabola)",
      colorHex: "#0f9fba",
      paramLabel: "焦距 f",
      paramMin: 0.8, paramMax: 2.5, paramStep: 0.05, paramDefault: 1.5,
      paramUnit: "",
      getFoci(p) { return [{ x: 0, y: p.f }]; },
      getCurvePath(p) {
        const pts = [];
        for (let wx = -2.4; wx <= 2.4; wx += 0.04) {
          const wy = wx * wx / (4 * p.f);
          if (wy > 2.0) continue;
          const s = w2s(wx, wy);
          pts.push(`${s.x.toFixed(1)},${s.y.toFixed(1)}`);
        }
        return "M " + pts.join(" L ");
      },
      getNormal(wx, wy, p) {
        // y = x²/(4f) → dy/dx = x/(2f) → 切线 (1, x/(2f)) → 法线 (-x/(2f), 1)
        return normalize({ x: -wx / (2 * p.f), y: 1 });
      },
      intersect(ray, p) {
        // ray: {x,y,dx,dy} 从上方平行下射 dx=0, dy=-1
        // y = x²/(4f) → x² = 4fy → x = ±2√(fy)
        if (ray.dy >= 0) return null;
        const fy = ray.y * p.f;
        if (fy < 0) return null;
        const sqrtfy = Math.sqrt(fy);
        const x1 = -2 * sqrtfy, x2 = 2 * sqrtfy;
        let bestX = null, bestT = Infinity;
        for (const x of [x1, x2]) {
          if (Math.abs(ray.dx) < 1e-12) {
            if (Math.abs(x - ray.x) < 1e-6) {
              const t = (ray.y - x * x / (4 * p.f)) / (-ray.dy);
              if (t > 1e-6 && t < bestT) { bestT = t; bestX = x; }
            }
          } else {
            const t = (x - ray.x) / ray.dx;
            if (t > 1e-6 && t < bestT) { bestT = t; bestX = x; }
          }
        }
        if (bestX === null) return null;
        const wy = bestX * bestX / (4 * p.f);
        return { x: bestX, y: wy, t: bestT };
      },
      generateRays(p, count) {
        const rays = [];
        const spread = 2.0;
        for (let i = 0; i < count; i++) {
          const wx = -spread + (i + 0.5) * (2 * spread) / count;
          rays.push({ x: wx, y: 2.2, dx: 0, dy: -1 });
        }
        return rays;
      },
      insight: "平行光经抛物面反射后，每根光线都经过焦点——这就是卫星天线和手电筒的原理。",
      subtitle: "抛物线聚焦模式"
    },

    ellipse: {
      name: "椭圆双焦点",
      color: "var(--sim-ellipse)",
      colorHex: "#7c3aed",
      paramLabel: "半长轴 a",
      paramMin: 1.5, paramMax: 2.5, paramStep: 0.05, paramDefault: 2.0,
      paramUnit: "",
      getFoci(p) {
        const a = p.a, b = Math.sqrt(Math.max(0.01, a * a - 1));
        const c = Math.sqrt(Math.max(0, a * a - b * b));
        return [{ x: -c, y: 0 }, { x: c, y: 0 }];
      },
      getCurvePath(p) {
        const a = p.a, b = Math.sqrt(Math.max(0.01, a * a - 1));
        const pts = [];
        for (let t = 0; t <= 2 * Math.PI + 0.01; t += 0.03) {
          const wx = a * Math.cos(t);
          const wy = b * Math.sin(t);
          const s = w2s(wx, wy);
          pts.push(`${s.x.toFixed(1)},${s.y.toFixed(1)}`);
        }
        return "M " + pts.join(" L ") + " Z";
      },
      getNormal(wx, wy, p) {
        const a = p.a, b = Math.sqrt(Math.max(0.01, a * a - 1));
        return normalize({ x: wx / (a * a), y: wy / (b * b) });
      },
      intersect(ray, p) {
        const a = p.a, b = Math.sqrt(Math.max(0.01, a * a - 1));
        const a2 = a * a, b2 = b * b;
        const A = ray.dx * ray.dx / a2 + ray.dy * ray.dy / b2;
        const B = 2 * (ray.x * ray.dx / a2 + ray.y * ray.dy / b2);
        const C = ray.x * ray.x / a2 + ray.y * ray.y / b2 - 1;
        const disc = B * B - 4 * A * C;
        if (disc < 0) return null;
        const sq = Math.sqrt(disc);
        const t1 = (-B - sq) / (2 * A);
        const t2 = (-B + sq) / (2 * A);
        let bestT = Infinity;
        for (const t of [t1, t2]) {
          if (t > 1e-4 && t < bestT) bestT = t;
        }
        if (!isFinite(bestT)) return null;
        return { x: ray.x + ray.dx * bestT, y: ray.y + ray.dy * bestT, t: bestT };
      },
      generateRays(p, count) {
        const a = p.a, b = Math.sqrt(Math.max(0.01, a * a - 1));
        const c = Math.sqrt(Math.max(0, a * a - b * b));
        const rays = [];
        for (let i = 0; i < count; i++) {
          const angle = -Math.PI * 0.4 + (i + 0.5) * (Math.PI * 0.8) / count;
          rays.push({ x: -c, y: 0, dx: Math.cos(angle), dy: Math.sin(angle) });
        }
        return rays;
      },
      insight: "椭圆从一个焦点出发的光，反射后必过另一焦点——这是耳语廊原理。",
      subtitle: "椭圆双焦点模式"
    },

    hyperbola: {
      name: "双曲线反向延长",
      color: "var(--sim-hyperbola)",
      colorHex: "#d97706",
      paramLabel: "半实轴 a",
      paramMin: 0.5, paramMax: 1.5, paramStep: 0.05, paramDefault: 1.0,
      paramUnit: "",
      getFoci(p) {
        const a = p.a, b = 1.0;
        const c = Math.sqrt(a * a + b * b);
        return [{ x: -c, y: 0 }, { x: c, y: 0 }];
      },
      getCurvePath(p) {
        const a = p.a, b = 1.0;
        const pts = [];
        for (let t = -1.2; t <= 1.2; t += 0.015) {
          const wx = a * Math.cosh(t);
          const wy = b * Math.sinh(t);
          if (Math.abs(wy) > 1.8) continue;
          const s = w2s(wx, wy);
          pts.push(`${s.x.toFixed(1)},${s.y.toFixed(1)}`);
        }
        let path = "M " + pts.join(" L ");
        const pts2 = [];
        for (let t = -1.2; t <= 1.2; t += 0.015) {
          const wx = -a * Math.cosh(t);
          const wy = b * Math.sinh(t);
          if (Math.abs(wy) > 1.8) continue;
          const s = w2s(wx, wy);
          pts2.push(`${s.x.toFixed(1)},${s.y.toFixed(1)}`);
        }
        if (pts2.length > 0) path += " M " + pts2.join(" L ");
        return path;
      },
      getNormal(wx, wy, p) {
        const a = p.a, b = 1.0;
        const sg = wx >= 0 ? 1 : -1;
        return normalize({ x: sg * wx / (a * a), y: -wy / (b * b) });
      },
      intersect(ray, p) {
        const a = p.a, b = 1.0;
        const a2 = a * a, b2 = b * b;
        const A = ray.dx * ray.dx / a2 - ray.dy * ray.dy / b2;
        const B = 2 * (ray.x * ray.dx / a2 - ray.y * ray.dy / b2);
        const C = ray.x * ray.x / a2 - ray.y * ray.y / b2 - 1;
        const disc = B * B - 4 * A * C;
        if (Math.abs(A) < 1e-15) {
          if (Math.abs(B) < 1e-15) return null;
          const t = -C / B;
          if (t < 1e-4) return null;
          const ix = ray.x + ray.dx * t, iy = ray.y + ray.dy * t;
          if (ix * ix / a2 - iy * iy / b2 < 0.99) return null;
          return { x: ix, y: iy, t };
        }
        if (disc < 0) return null;
        const sq = Math.sqrt(disc);
        const t1 = (-B - sq) / (2 * A);
        const t2 = (-B + sq) / (2 * A);
        let bestT = Infinity, bestPt = null;
        for (const t of [t1, t2]) {
          if (t < 1e-4) continue;
          const ix = ray.x + ray.dx * t, iy = ray.y + ray.dy * t;
          const val = ix * ix / a2 - iy * iy / b2;
          if (val < 0.99) continue;
          if (t < bestT) { bestT = t; bestPt = { x: ix, y: iy, t }; }
        }
        return bestPt;
      },
      generateRays(p, count) {
        const a = p.a, b = 1.0;
        const c = Math.sqrt(a * a + b * b);
        const rays = [];
        for (let i = 0; i < count; i++) {
          const angle = -Math.PI * 0.35 + (i + 0.5) * (Math.PI * 0.7) / count;
          rays.push({ x: c, y: 0, dx: Math.cos(angle), dy: Math.sin(angle) });
        }
        return rays;
      },
      insight: "双曲线反射光线的反向延长线汇聚于另一焦点——用于卡塞格林望远镜的副镜设计。",
      subtitle: "双曲线反向延长模式"
    }
  };

  // ====== 状态 ======
  const state = {
    mode: "parabola",
    param: 1.5,
    rayCount: 7,
    speed: 1.0,
    running: false,
    rays: [],
    lastTimestamp: null,
    animTime: 0
  };

  const elements = {
    status: document.getElementById("status"),
    sceneSubtitle: document.getElementById("scene-subtitle"),
    layerCurve: document.getElementById("layer-curve"),
    layerFoci: document.getElementById("layer-foci"),
    layerRays: document.getElementById("layer-rays"),
    layerLabels: document.getElementById("layer-labels"),
    insight: document.getElementById("insight"),
    rayCountReadout: document.getElementById("rayCountReadout"),
    drawnReadout: document.getElementById("drawnReadout"),
    focusReadout: document.getElementById("focusReadout"),
    paramReadout: document.getElementById("paramReadout"),
    paramLabel: document.getElementById("paramLabel"),
    rayCountInput: document.getElementById("rayCountInput"),
    rayCountOutput: document.getElementById("rayCountOutput"),
    paramInput: document.getElementById("paramInput"),
    paramOutput: document.getElementById("paramOutput"),
    speedInput: document.getElementById("speedInput"),
    speedOutput: document.getElementById("speedOutput"),
    emitBtn: document.getElementById("emitBtn"),
    pauseBtn: document.getElementById("pauseBtn"),
    resetBtn: document.getElementById("resetBtn"),
    modeBtns: document.querySelectorAll(".mode-btn")
  };

  // ====== 光线追踪 ======
  function traceRay(ray, mode, param) {
    const m = modes[mode];
    const segments = [];
    let current = { x: ray.x, y: ray.y, dx: ray.dx, dy: ray.dy };

    // 起点
    segments.push({ type: "point", x: current.x, y: current.y });

    const hit = m.intersect(current, { [mode === "parabola" ? "f" : mode === "ellipse" ? "a" : "a"]: param });
    if (!hit) {
      const tEnd = 3.0;
      segments.push({
        type: "segment",
        x1: current.x, y1: current.y,
        x2: current.x + current.dx * tEnd,
        y2: current.y + current.dy * tEnd
      });
      return { segments, hitsFocus: false };
    }

    // 入射段
    segments.push({
      type: "segment",
      x1: current.x, y1: current.y,
      x2: hit.x, y2: hit.y
    });

    // 反射
    const n = m.getNormal(hit.x, hit.y, { [mode === "parabola" ? "f" : "a"]: param });
    const d = normalize({ x: current.dx, y: current.dy });
    const r = reflect(d, n);

    // 反射后延长到边界
    const tEnd = 3.5;
    const endX = hit.x + r.x * tEnd;
    const endY = hit.y + r.y * tEnd;
    segments.push({ type: "point", x: hit.x, y: hit.y });
    segments.push({
      type: "segment",
      x1: hit.x, y1: hit.y,
      x2: endX, y2: endY
    });

    // 检查是否经过焦点
    const foci = m.getFoci({ [mode === "parabola" ? "f" : "a"]: param });
    let hitsFocus = false;
    for (const f of foci) {
      // 点到射线的距离
      const fx = f.x - hit.x, fy = f.y - hit.y;
      const proj = fx * r.x + fy * r.y;
      if (proj > 0) {
        const perpX = fx - proj * r.x;
        const perpY = fy - proj * r.y;
        const dist = Math.hypot(perpX, perpY);
        if (dist < 0.08) { hitsFocus = true; break; }
      }
    }

    return { segments, hitsFocus, endPoint: { x: endX, y: endY } };
  }

  // ====== 渲染 ======
  function renderCurve() {
    const m = modes[state.mode];
    const p = state.mode === "parabola" ? { f: state.param } : { a: state.param };
    const path = m.getCurvePath(p);
    const foci = m.getFoci(p);

    let html = "";
    // 曲面
    html += `<path d="${path}" fill="none" stroke="${m.colorHex}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" filter="url(#glow)"/>`;
    // 曲面内侧填充（抛物线上方、椭圆内部、双曲线右支左侧）
    if (state.mode === "parabola") {
      let fillPath = path;
      const lastPt = w2s(-2.4, 0);
      fillPath += ` L ${lastPt.x.toFixed(1)},${CY.toFixed(1)} L ${w2s(2.4, 0).x.toFixed(1)},${CY.toFixed(1)} Z`;
      html += `<path d="${fillPath}" fill="${m.colorHex}" opacity="0.06"/>`;
    } else if (state.mode === "ellipse") {
      html += `<path d="${path}" fill="${m.colorHex}" opacity="0.06"/>`;
    } else if (state.mode === "hyperbola") {
      // 右支填充
      const a = state.param, b = 1.0;
      let rPts = [];
      for (let t = -1.2; t <= 1.2; t += 0.015) {
        const wx = a * Math.cosh(t), wy = b * Math.sinh(t);
        if (Math.abs(wy) > 1.8) continue;
        rPts.push(w2s(wx, wy));
      }
      if (rPts.length > 0) {
        let fp = `M ${rPts[0].x.toFixed(1)},${rPts[0].y.toFixed(1)}`;
        for (let i = 1; i < rPts.length; i++) fp += ` L ${rPts[i].x.toFixed(1)},${rPts[i].y.toFixed(1)}`;
        fp += ` L ${CX + 3 * SCALE},${rPts[rPts.length-1].y.toFixed(1)} L ${CX + 3 * SCALE},${rPts[0].y.toFixed(1)} Z`;
        html += `<path d="${fp}" fill="${m.colorHex}" opacity="0.05"/>`;
      }
    }

    elements.layerCurve.innerHTML = html;

    // 焦点
    let fociHtml = "";
    for (let i = 0; i < foci.length; i++) {
      const f = foci[i];
      const s = w2s(f.x, f.y);
      const label = state.mode === "parabola" ? "F" : (i === 0 ? "F₁" : "F₂");
      const isVirtual = state.mode === "hyperbola" && i === 0;
      fociHtml += `<g>`;
      if (isVirtual) {
        fociHtml += `<circle cx="${s.x}" cy="${s.y}" r="10" fill="none" stroke="${m.colorHex}" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>`;
        fociHtml += `<circle cx="${s.x}" cy="${s.y}" r="4" fill="${m.colorHex}" opacity="0.4"/>`;
      } else {
        fociHtml += `<circle cx="${s.x}" cy="${s.y}" r="14" fill="${m.colorHex}" opacity="0.15"/>`;
        fociHtml += `<circle cx="${s.x}" cy="${s.y}" r="6" fill="${m.colorHex}" stroke="#fff" stroke-width="2" filter="url(#glow)"/>`;
      }
      fociHtml += `<text x="${s.x + 12}" y="${s.y - 8}" font-size="14" font-weight="700" fill="${m.colorHex}">${label}</text>`;
      fociHtml += `</g>`;
    }
    elements.layerFoci.innerHTML = fociHtml;

    // 标签
    let labelHtml = "";
    if (state.mode === "parabola") {
      const ax = w2s(-2.4, 0);
      labelHtml += `<text x="${ax.x}" y="${ax.y + 18}" font-size="11" fill="${m.colorHex}" opacity="0.7" text-anchor="middle">抛物面</text>`;
      // 平行光指示
      labelHtml += `<text x="${CX}" y="30" font-size="11" fill="#657188" text-anchor="middle">平行入射光 ↓</text>`;
    } else if (state.mode === "ellipse") {
      labelHtml += `<text x="${CX}" y="${CY - 160}" font-size="11" fill="${m.colorHex}" opacity="0.7" text-anchor="middle">椭圆面</text>`;
    } else if (state.mode === "hyperbola") {
      labelHtml += `<text x="${CX + 100}" y="${CY - 100}" font-size="11" fill="${m.colorHex}" opacity="0.7" text-anchor="middle">双曲线右支</text>`;
      labelHtml += `<text x="${CX - 100}" y="${CY - 100}" font-size="11" fill="${m.colorHex}" opacity="0.5" text-anchor="middle">双曲线左支</text>`;
    }
    elements.layerLabels.innerHTML = labelHtml;
  }

  function renderRays() {
    const m = modes[state.mode];
    const color = m.colorHex;
    let html = "";
    let drawnCount = 0;

    for (let i = 0; i < state.rays.length; i++) {
      const ray = state.rays[i];
      if (!ray.traced) continue;

      // 计算总长度
      let totalLen = 0;
      const segLengths = [];
      for (const seg of ray.segments) {
        if (seg.type === "segment") {
          const len = Math.hypot(seg.x2 - seg.x1, seg.y2 - seg.y1);
          segLengths.push(len);
          totalLen += len;
        }
      }

      const drawn = Math.min(ray.drawn, totalLen);
      if (drawn > 0.001) drawnCount++;

      // 生成已绘制部分的路径
      let pathData = "";
      let remaining = drawn;
      let firstPoint = true;
      let lastX = 0, lastY = 0;

      for (let j = 0; j < ray.segments.length; j++) {
        const seg = ray.segments[j];
        if (seg.type === "point") {
          const s = w2s(seg.x, seg.y);
          if (firstPoint) {
            pathData += `M ${s.x.toFixed(1)},${s.y.toFixed(1)}`;
            firstPoint = false;
          } else {
            pathData += ` L ${s.x.toFixed(1)},${s.y.toFixed(1)}`;
          }
          lastX = s.x; lastY = s.y;
        } else if (seg.type === "segment") {
          const segLen = Math.hypot(seg.x2 - seg.x1, seg.y2 - seg.y1);
          if (remaining <= 0) break;
          const drawLen = Math.min(remaining, segLen);
          const frac = drawLen / segLen;
          const s1 = w2s(seg.x1, seg.y1);
          const s2 = w2s(seg.x2, seg.y2);
          const ex = s1.x + (s2.x - s1.x) * frac;
          const ey = s1.y + (s2.y - s1.y) * frac;
          if (firstPoint) {
            pathData += `M ${s1.x.toFixed(1)},${s1.y.toFixed(1)}`;
            firstPoint = false;
          }
          pathData += ` L ${ex.toFixed(1)},${ey.toFixed(1)}`;
          remaining -= drawLen;
          lastX = ex; lastY = ey;
          if (remaining <= 0) break;
        }
      }

      if (pathData) {
        // 辉光层：宽线低透明
        html += `<path d="${pathData}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" opacity="0.12"/>`;
        html += `<path d="${pathData}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" opacity="0.25"/>`;
        // 主线
        html += `<path d="${pathData}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>`;
        // 白色芯
        html += `<path d="${pathData}" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>`;

        // 光线前端发光点
        if (drawn < totalLen && drawn > 0.01) {
          html += `<circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="4" fill="${color}" opacity="0.9" filter="url(#glow-strong)"/>`;
          html += `<circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="2" fill="#ffffff" opacity="0.95"/>`;
        }
      }

      // 如果光线到达焦点，在焦点处画一个脉冲
      if (ray.hitsFocus && drawn >= totalLen) {
        const foci = m.getFoci(state.mode === "parabola" ? { f: state.param } : { a: state.param });
        const targetF = state.mode === "parabola" ? foci[0] : (state.mode === "ellipse" ? foci[1] : foci[0]);
        const fs = w2s(targetF.x, targetF.y);
        const pulse = 0.5 + 0.5 * Math.sin(state.animTime * 3);
        html += `<circle cx="${fs.x.toFixed(1)}" cy="${fs.y.toFixed(1)}" r="${(10 + pulse * 6).toFixed(1)}" fill="none" stroke="${color}" stroke-width="2" opacity="${(0.4 + pulse * 0.3).toFixed(2)}"/>`;
      }
    }

    elements.layerRays.innerHTML = html;
    elements.drawnReadout.textContent = drawnCount;
  }

  function render() {
    renderCurve();
    renderRays();
    updateReadouts();
  }

  function updateReadouts() {
    const m = modes[state.mode];
    elements.rayCountReadout.textContent = state.rayCount;
    elements.rayCountOutput.textContent = state.rayCount;
    elements.speedOutput.textContent = state.speed.toFixed(1) + "×";

    const foci = m.getFoci(state.mode === "parabola" ? { f: state.param } : { a: state.param });
    const c = foci.length > 0 ? Math.hypot(foci[foci.length - 1].x, foci[foci.length - 1].y) : 0;
    elements.focusReadout.textContent = c.toFixed(2);

    const paramKey = state.mode === "parabola" ? "f" : "a";
    elements.paramReadout.textContent = `${paramKey}=${state.param.toFixed(2)}`;
    elements.paramLabel.firstChild.textContent = m.paramLabel + " ";
    elements.paramOutput.textContent = state.param.toFixed(2);

    elements.insight.textContent = m.insight;
    elements.sceneSubtitle.textContent = m.subtitle;
  }

  // ====== 生命周期 ======
  function init() {
    bindControls();
    setMode("parabola");
    requestAnimationFrame(frame);
  }

  function setMode(mode) {
    if (!modes[mode]) return;
    state.mode = mode;
    const m = modes[mode];
    state.param = m.paramDefault;

    // 更新参数滑块范围
    elements.paramInput.min = m.paramMin;
    elements.paramInput.max = m.paramMax;
    elements.paramInput.step = m.paramStep;
    elements.paramInput.value = m.paramDefault;

    // 更新模式按钮
    elements.modeBtns.forEach(btn => {
      btn.classList.toggle("active", btn.dataset.mode === mode);
    });

    reset();
  }

  function emit() {
    const m = modes[state.mode];
    const p = state.mode === "parabola" ? { f: state.param } : { a: state.param };
    const rawRays = m.generateRays(p, state.rayCount);

    state.rays = rawRays.map(ray => {
      const result = traceRay(ray, state.mode, state.param);
      return {
        segments: result.segments,
        hitsFocus: result.hitsFocus,
        drawn: 0,
        traced: true,
        delay: 0
      };
    });

    state.running = true;
    state.animTime = 0;
    elements.status.textContent = "发射中";
    elements.emitBtn.setAttribute("aria-pressed", "true");
  }

  function pause() {
    state.running = false;
    elements.status.textContent = "已暂停";
    elements.emitBtn.setAttribute("aria-pressed", "false");
  }

  function reset() {
    pause();
    state.rays = [];
    state.animTime = 0;
    elements.status.textContent = "就绪";
    render();
  }

  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05);
    state.animTime += boundedDt;

    const drawSpeed = 3.5 * state.speed; // 单位/秒
    let allDone = true;

    for (let i = 0; i < state.rays.length; i++) {
      const ray = state.rays[i];
      if (!ray.traced) continue;

      // 错开开始时间
      const stagger = i * 0.12;
      if (state.animTime < stagger) {
        allDone = false;
        continue;
      }

      // 计算总长度
      let totalLen = 0;
      for (const seg of ray.segments) {
        if (seg.type === "segment") {
          totalLen += Math.hypot(seg.x2 - seg.x1, seg.y2 - seg.y1);
        }
      }

      if (ray.drawn < totalLen) {
        ray.drawn += drawSpeed * boundedDt;
        if (ray.drawn < totalLen) allDone = false;
        else ray.drawn = totalLen;
      }
    }

    if (allDone && state.rays.length > 0) {
      state.running = false;
      elements.status.textContent = "完成";
      elements.emitBtn.setAttribute("aria-pressed", "false");
    }
  }

  function setParameters(values) {
    if (values.rayCount !== undefined) {
      state.rayCount = clamp(Math.round(Number(values.rayCount)) || 7, 3, 15);
      elements.rayCountInput.value = String(state.rayCount);
    }
    if (values.param !== undefined) {
      const m = modes[state.mode];
      state.param = clamp(finite(Number(values.param), m.paramDefault), m.paramMin, m.paramMax);
      elements.paramInput.value = String(state.param);
    }
    if (values.speed !== undefined) {
      state.speed = clamp(finite(Number(values.speed), 1), 0.3, 3);
      elements.speedInput.value = String(state.speed);
    }
    render();
  }

  function getState() {
    return { ...state, rays: state.rays.map(r => ({ ...r })) };
  }

  function getReadouts() {
    return {
      mode: state.mode,
      param: state.param,
      rayCount: state.rayCount,
      drawn: state.rays.filter(r => r.drawn > 0.001).length,
      total: state.rays.length
    };
  }

  function runModelChecks() {
    const checks = [];

    // 1. 抛物线反射光经过焦点
    {
      const f = 1.5;
      const ray = { x: 1.0, y: 2.2, dx: 0, dy: -1 };
      const result = traceRay(ray, "parabola", f);
      checks.push({
        name: "抛物线: 平行光反射经过焦点",
        pass: result.hitsFocus === true,
        expected: "hitsFocus=true",
        actual: `hitsFocus=${result.hitsFocus}`,
        tolerance: "strict"
      });
    }

    // 2. 椭圆: F1发射反射经过F2
    {
      const a = 2.0;
      const ray = { x: -Math.sqrt(3), y: 0, dx: 1, dy: 0.3 };
      const normRay = { x: ray.x, y: ray.y, dx: ray.dx / Math.hypot(ray.dx, ray.dy), dy: ray.dy / Math.hypot(ray.dx, ray.dy) };
      const result = traceRay(normRay, "ellipse", a);
      checks.push({
        name: "椭圆: 焦点F1发射反射经过F2",
        pass: result.hitsFocus === true,
        expected: "hitsFocus=true",
        actual: `hitsFocus=${result.hitsFocus}`,
        tolerance: "strict"
      });
    }

    // 3. 双曲线: F2发射反射延长线经过F1
    {
      const a = 1.0;
      const c = Math.sqrt(2);
      const ray = { x: c, y: 0, dx: -0.8, dy: 0.6 };
      const normRay = { x: ray.x, y: ray.y, dx: ray.dx / Math.hypot(ray.dx, ray.dy), dy: ray.dy / Math.hypot(ray.dx, ray.dy) };
      const result = traceRay(normRay, "hyperbola", a);
      checks.push({
        name: "双曲线: F2发射反射延长线经过F1",
        pass: result.hitsFocus === true,
        expected: "hitsFocus=true (虚焦点)",
        actual: `hitsFocus=${result.hitsFocus}`,
        tolerance: "strict"
      });
    }

    // 4. 反射定律: 入射角=反射角
    {
      const d = { x: 0, y: -1 };
      const n = { x: 0.6, y: 0.8 };
      const r = reflect(d, n);
      const cosI = -(d.x * n.x + d.y * n.y);
      const cosR = r.x * n.x + r.y * n.y;
      checks.push({
        name: "反射定律: cos(入射角)=cos(反射角)",
        pass: Math.abs(cosI - cosR) < 1e-10,
        expected: cosI.toFixed(6),
        actual: cosR.toFixed(6),
        tolerance: 1e-10
      });
    }

    // 5. 反射光在曲面同侧
    {
      const d = { x: 0, y: -1 };
      const n = { x: 0, y: 1 };
      const r = reflect(d, n);
      checks.push({
        name: "反射方向: 垂直入射原路返回",
        pass: Math.abs(r.x - 0) < 1e-10 && Math.abs(r.y - 1) < 1e-10,
        expected: "(0, 1)",
        actual: `(${r.x.toFixed(6)}, ${r.y.toFixed(6)})`,
        tolerance: 1e-10
      });
    }

    // 6. 抛物线多根光线都经过焦点
    {
      const f = 1.5;
      const rays = modes.parabola.generateRays({ f }, 7);
      let allHit = true;
      for (const ray of rays) {
        const result = traceRay(ray, "parabola", f);
        if (!result.hitsFocus) { allHit = false; break; }
      }
      checks.push({
        name: "抛物线: 7根平行光全部经过焦点",
        pass: allHit,
        expected: "7/7 hitsFocus=true",
        actual: `${rays.filter(r => traceRay(r, "parabola", f).hitsFocus).length}/7`,
        tolerance: "strict"
      });
    }

    return checks;
  }

  function bindControls() {
    elements.emitBtn.addEventListener("click", emit);
    elements.pauseBtn.addEventListener("click", pause);
    elements.resetBtn.addEventListener("click", reset);

    elements.rayCountInput.addEventListener("input", () => setParameters({ rayCount: elements.rayCountInput.value }));
    elements.paramInput.addEventListener("input", () => setParameters({ param: elements.paramInput.value }));
    elements.speedInput.addEventListener("input", () => setParameters({ speed: elements.speedInput.value }));

    elements.modeBtns.forEach(btn => {
      btn.addEventListener("click", () => setMode(btn.dataset.mode));
    });
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  window.simulation = { init, start: emit, pause, reset, update, render, setParameters, setMode, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
