<title>相对论同时性 · "同时"是相对的</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #050810;
  --sim-surface: #0a1020;
  --sim-surface-soft: #0d1428;
  --sim-text: #e8eefc;
  --sim-muted: #8a9bb8;
  --sim-border: #1a2440;
  --sim-grid: #141d33;
  --sim-accent: #4dd9ff;
  --sim-accent-deep: #2196c4;
  --sim-accent-soft: rgba(77, 217, 255, 0.12);
  --sim-positive: #4dd9ff;
  --sim-warning: #ffb84d;
  --sim-danger: #ff5566;
  --sim-radius-sm: 8px;
  --sim-radius-md: 12px;
  --sim-radius-lg: 16px;
  --sim-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: var(--sim-bg);
  color: var(--sim-text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  overflow: hidden;
}
.app {
  width: 100vw; height: 100vh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: var(--sim-space-2);
  padding: var(--sim-space-3) var(--sim-space-4) var(--sim-space-3);
}
.header {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 0 var(--sim-space-2);
}
.header h1 {
  font-size: clamp(1.1rem, 1.8vw, 1.5rem);
  font-weight: 700; letter-spacing: -0.02em;
  color: var(--sim-text);
}
.header h1 .accent { color: var(--sim-accent); }
.header .subtitle {
  font-size: 0.78rem; color: var(--sim-muted);
  margin-top: 2px;
}
.status {
  font-size: 0.72rem; color: var(--sim-accent);
  border: 1px solid rgba(77, 217, 255, 0.3);
  background: var(--sim-accent-soft);
  padding: 5px 12px; border-radius: 999px;
  font-weight: 600; white-space: nowrap;
}
.main {
  display: grid;
  grid-template-rows: 1fr 1fr;
  gap: var(--sim-space-2);
  min-height: 0;
}
.frame {
  position: relative;
  background: var(--sim-surface);
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-md);
  overflow: hidden;
}
.frame canvas {
  display: block; width: 100%; height: 100%;
}
.frame-label {
  position: absolute; top: 10px; left: 14px;
  font-size: 0.82rem; font-weight: 700;
  color: var(--sim-text);
  letter-spacing: 0.02em;
  z-index: 2;
}
.frame-label .tag {
  color: var(--sim-muted); font-weight: 400; margin-left: 6px;
}
.readout {
  position: absolute; bottom: 10px; left: 14px; right: 14px;
  display: flex; gap: var(--sim-space-4);
  font-size: 0.78rem; font-variant-numeric: tabular-nums;
  z-index: 2; flex-wrap: wrap;
}
.readout .item { display: flex; gap: 6px; align-items: baseline; }
.readout .label { color: var(--sim-muted); }
.readout .value { color: var(--sim-text); font-weight: 700; }
.readout .value.diff { color: var(--sim-warning); }
.controls {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: var(--sim-space-5);
  padding: var(--sim-space-3) var(--sim-space-4);
  background: var(--sim-surface);
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-md);
  align-items: center;
}
.control { display: flex; flex-direction: column; gap: 6px; }
.control .row {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 0.78rem;
}
.control .name { color: var(--sim-muted); font-weight: 600; }
.control .val {
  color: var(--sim-accent); font-weight: 700;
  font-variant-numeric: tabular-nums; font-size: 0.88rem;
}
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 4px;
  background: var(--sim-border);
  border-radius: 2px; outline: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px;
  background: var(--sim-accent);
  border-radius: 50%; cursor: pointer;
  border: 2px solid var(--sim-bg);
  box-shadow: 0 0 0 1px var(--sim-accent);
}
input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px;
  background: var(--sim-accent);
  border-radius: 50%; cursor: pointer;
  border: 2px solid var(--sim-bg);
}
.actions { display: flex; gap: var(--sim-space-2); }
button {
  border: 1px solid var(--sim-border);
  background: var(--sim-surface-soft);
  color: var(--sim-text);
  padding: 8px 14px;
  border-radius: var(--sim-radius-sm);
  font-size: 0.78rem; font-weight: 700;
  cursor: pointer; transition: all 0.15s ease;
}
button:hover { border-color: var(--sim-accent); color: var(--sim-accent); }
button:active { transform: scale(0.96); }
button.primary {
  background: var(--sim-accent); color: var(--sim-bg);
  border-color: var(--sim-accent);
}
button.primary:hover { background: var(--sim-accent-deep); border-color: var(--sim-accent-deep); color: var(--sim-bg); }
.formula {
  position: absolute; top: 10px; right: 14px;
  font-size: 0.72rem; color: var(--sim-muted);
  font-variant-numeric: tabular-nums;
  z-index: 2; text-align: right;
  line-height: 1.5;
}
.formula .accent { color: var(--sim-warning); font-weight: 700; }
.insight-bar {
  display: flex; align-items: center; gap: var(--sim-space-3);
  padding: var(--sim-space-3) var(--sim-space-4);
  background: var(--sim-surface);
  border: 1px solid var(--sim-border);
  border-left: 3px solid var(--sim-warning);
  border-radius: var(--sim-radius-sm);
  font-size: 0.82rem; color: var(--sim-text);
  line-height: 1.5;
}
.insight-bar .insight-label {
  color: var(--sim-warning); font-weight: 700; white-space: nowrap;
}
.insight-bar .insight-text { color: var(--sim-muted); }
.insight-bar .insight-text .accent { color: var(--sim-accent); font-weight: 600; }
@media (max-width: 720px) {
  .app { height: auto; min-height: 100vh; overflow: visible; }
  .main { grid-template-rows: 1fr 1fr; }
  .controls { grid-template-columns: 1fr; gap: var(--sim-space-2); }
  .actions { justify-content: center; }
  .header h1 { font-size: 1rem; }
  .header .subtitle { display: none; }
  .readout { font-size: 0.7rem; gap: var(--sim-space-2); }
  .frame-label { font-size: 0.72rem; }
  .formula { font-size: 0.65rem; }
  .insight-bar { font-size: 0.75rem; padding: var(--sim-space-2) var(--sim-space-3); }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="app" data-layout="comparison" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>相对论同时性 · <span class="accent">"同时"是相对的</span></h1>
      <div class="subtitle">同一雷电事件 · 两个参考系 · 相反的到达顺序</div>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">运行中</div>
  </header>

  <main class="main">
    <section class="frame" data-region="stage" aria-label="地面参考系">
      <div class="frame-label">地面参考系<span class="tag">列车运动 · 光速不变</span></div>
      <div class="formula">Δt ≈ <span class="accent" id="formulaGround">0.000</span></div>
      <canvas id="canvasGround"></canvas>
      <div class="readout">
        <div class="item"><span class="label">车头到达</span><span class="value" id="groundFront">0.000</span></div>
        <div class="item"><span class="label">车尾到达</span><span class="value" id="groundBack">0.000</span></div>
        <div class="item"><span class="label">时间差</span><span class="value diff" id="groundDiff">0.000</span></div>
      </div>
    </section>

    <section class="frame" data-region="evidence" aria-label="列车参考系">
      <div class="frame-label">列车参考系<span class="tag">列车静止 · 地面后退</span></div>
      <div class="formula">Δt ≈ <span class="accent" id="formulaTrain">0.000</span></div>
      <canvas id="canvasTrain"></canvas>
      <div class="readout">
        <div class="item"><span class="label">车头到达</span><span class="value" id="trainFront">0.000</span></div>
        <div class="item"><span class="label">车尾到达</span><span class="value" id="trainBack">0.000</span></div>
        <div class="item"><span class="label">时间差</span><span class="value diff" id="trainDiff">0.000</span></div>
      </div>
    </section>
  </main>

  <section class="insight-bar" data-region="insight" aria-live="polite">
    <span class="insight-label">观察</span>
    <span class="insight-text" id="insightText">地面系中两束光同时到达车头车尾；列车系中车尾先到、车头后到，<span class="accent">"同时"取决于参考系</span>。</span>
  </section>

  <section class="controls" data-region="controls" aria-label="参数控制">
    <div class="control">
      <label class="row" for="vInput"><span class="name">列车速度</span><span class="val" id="vDisplay">0.500 c</span></label>
      <input id="vInput" type="range" min="0" max="0.95" step="0.01" value="0.5" aria-label="列车速度">
    </div>
    <div class="control">
      <label class="row" for="tInput"><span class="name">时间倍率</span><span class="val" id="tDisplay">1.0×</span></label>
      <input id="tInput" type="range" min="0.2" max="3" step="0.1" value="1" aria-label="时间倍率">
    </div>
    <div class="actions">
      <button id="pauseBtn" type="button" class="primary">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const parameterSchema = [
    { key: "v", label: "列车速度", type: "slider", min: 0, max: 0.95, step: 0.01, default: 0.5, unit: "c" },
    { key: "timeScale", label: "时间倍率", type: "slider", min: 0.2, max: 3, step: 0.1, default: 1, unit: "×" }
  ];

  const state = {
    running: true,
    simTime: 0,
    lastTimestamp: null,
    v: 0.5,
    timeScale: 1.0,
    cycleDuration: 5.0,
    trainHalfLen: 0.5
  };

  const elements = {
    canvasGround: document.getElementById("canvasGround"),
    canvasTrain: document.getElementById("canvasTrain"),
    vInput: document.getElementById("vInput"),
    vDisplay: document.getElementById("vDisplay"),
    tInput: document.getElementById("tInput"),
    tDisplay: document.getElementById("tDisplay"),
    pauseBtn: document.getElementById("pauseBtn"),
    resetBtn: document.getElementById("resetBtn"),
    status: document.getElementById("status"),
    groundFront: document.getElementById("groundFront"),
    groundBack: document.getElementById("groundBack"),
    groundDiff: document.getElementById("groundDiff"),
    trainFront: document.getElementById("trainFront"),
    trainBack: document.getElementById("trainBack"),
    trainDiff: document.getElementById("trainDiff"),
    formulaGround: document.getElementById("formulaGround"),
    formulaTrain: document.getElementById("formulaTrain"),
    insightText: document.getElementById("insightText")
  };

  const ctxG = elements.canvasGround.getContext("2d");
  const ctxT = elements.canvasTrain.getContext("2d");

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function finite(v, fb) { return Number.isFinite(v) ? v : fb; }

  function resizeCanvas(canvas) {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(1, Math.floor(rect.width));
    const h = Math.max(1, Math.floor(rect.height));
    if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
      canvas.width = w * dpr;
      canvas.height = h * dpr;
    }
    return { w, h, dpr };
  }

  function getTrainHalfWidthPx(w) {
    return Math.min(w * 0.34, 280);
  }

  function getTrainY(h) { return h * 0.5; }
  function getGroundY(h) { return h * 0.86; }

  function drawBackground(ctx, w, h) {
    ctx.fillStyle = "#050810";
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = "#0e1830";
    ctx.lineWidth = 1;
    const step = 48;
    ctx.beginPath();
    for (let x = step; x < w; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
    for (let y = step; y < h; y += step) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
    ctx.stroke();
  }

  function drawLightSource(ctx, x, y, intensity) {
    const r = 5;
    ctx.strokeStyle = "rgba(255, 200, 100, 0.35)";
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(x, y, r + 3, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#ffd966";
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff5cc";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  }

  function drawLightRing(ctx, cx, cy, radius, alpha) {
    if (alpha <= 0.01 || radius < 1) return;
    ctx.strokeStyle = `rgba(77, 217, 255, ${alpha * 0.85})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = `rgba(180, 240, 255, ${alpha * 0.4})`;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, Math.max(0.5, radius - 3), 0, Math.PI * 2); ctx.stroke();
  }

  function drawTrainBody(ctx, frontX, backX, y, halfH) {
    const top = y - halfH;
    const bot = y + halfH;
    const grad = ctx.createLinearGradient(0, top, 0, bot);
    grad.addColorStop(0, "#1a2a4a");
    grad.addColorStop(0.5, "#0f1830");
    grad.addColorStop(1, "#1a2a4a");
    ctx.fillStyle = grad;
    ctx.fillRect(backX, top, frontX - backX, halfH * 2);
    ctx.strokeStyle = "#3a5278";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(backX, top, frontX - backX, halfH * 2);
    ctx.fillStyle = "rgba(77, 217, 255, 0.5)";
    const wW = 6, wH = 8;
    for (let i = 0; i < 3; i++) {
      const wx = backX + 10 + i * 14;
      if (wx + wW < frontX - 4) ctx.fillRect(wx, y - wH/2, wW, wH);
    }
  }

  function drawTrainEnd(ctx, x, y, halfH, isFront, isHit, label) {
    const top = y - halfH;
    const bot = y + halfH;
    if (isFront) {
      ctx.fillStyle = "#1a2a4a";
      ctx.beginPath();
      ctx.moveTo(x, top);
      ctx.lineTo(x + 7, y);
      ctx.lineTo(x, bot);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#3a5278";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    } else {
      ctx.fillStyle = "#1a2a4a";
      ctx.beginPath();
      ctx.moveTo(x, top);
      ctx.lineTo(x - 7, y);
      ctx.lineTo(x, bot);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#3a5278";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    if (isHit) {
      ctx.strokeStyle = "rgba(255, 184, 77, 0.5)";
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(x, y, halfH + 6, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = "rgba(255, 184, 77, 0.9)";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, halfH + 2, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.fillStyle = isHit ? "#ffb84d" : "#8a9bb8";
    ctx.font = "600 11px ui-sans-serif, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(label, x, y + halfH + 16);
  }

  function drawGroundTrack(ctx, w, h, offset) {
    const y = getGroundY(h);
    ctx.strokeStyle = "#1a2440";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    ctx.strokeStyle = "#2a3658";
    ctx.lineWidth = 1.5;
    const step = 40;
    const startX = ((offset % step) + step) % step;
    for (let x = -step + startX; x < w + step; x += step) {
      ctx.beginPath(); ctx.moveTo(x, y - 4); ctx.lineTo(x + 18, y - 4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y + 4); ctx.lineTo(x + 18, y + 4); ctx.stroke();
    }
  }

  function drawGroundReference(ctx, w, h) {
    const y = getGroundY(h);
    ctx.fillStyle = "#5a6a88";
    ctx.font = "10px ui-sans-serif, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("地面观察者", w * 0.5, y + 22);
    ctx.strokeStyle = "rgba(90, 106, 136, 0.4)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(w * 0.5 - 40, y + 26); ctx.lineTo(w * 0.5 + 40, y + 26); ctx.stroke();
    for (let i = -1; i <= 1; i += 2) {
      const ax = w * 0.5 + i * 40;
      ctx.beginPath();
      ctx.moveTo(ax, y + 22);
      ctx.lineTo(ax - i * 5, y + 24);
      ctx.lineTo(ax - i * 5, y + 28);
      ctx.stroke();
    }
  }

  function drawGroundFrame(ctx, w, h, simTime) {
    drawBackground(ctx, w, h);
    const trainY = getTrainY(h);
    const halfW = getTrainHalfWidthPx(w);
    const halfH = 16;
    const v = state.v;
    const cycle = state.cycleDuration;
    const t = ((simTime % cycle) + cycle) % cycle;
    const sourceX = w / 2;
    const trainCenterX = sourceX + v * halfW * (t / cycle - 0.5);
    const frontX = trainCenterX + halfW;
    const backX = trainCenterX - halfW;
    const groundOffset = -v * halfW * (t / cycle - 0.5);
    drawGroundTrack(ctx, w, h, groundOffset);
    drawGroundReference(ctx, w, h);
    drawTrainBody(ctx, frontX, backX, trainY, halfH);
    drawTrainEnd(ctx, frontX, trainY, halfH, true, t >= 0.5, "车头");
    drawTrainEnd(ctx, backX, trainY, halfH, false, t >= 0.5, "车尾");
    drawLightSource(ctx, sourceX, trainY, 1);
    if (t > 0) {
      const ringR = t * halfW;
      drawLightRing(ctx, sourceX, trainY, ringR, 1 - t / cycle);
    }
    ctx.fillStyle = "#5a6a88";
    ctx.font = "10px ui-sans-serif, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("光源", sourceX, trainY - 14);
    if (v > 0.02) {
      const arrowY = trainY - halfH - 14;
      const arrowX1 = trainCenterX - 18;
      const arrowX2 = trainCenterX + 18;
      ctx.strokeStyle = "#4dd9ff";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(arrowX1, arrowY);
      ctx.lineTo(arrowX2, arrowY);
      ctx.lineTo(arrowX2 - 5, arrowY - 3);
      ctx.moveTo(arrowX2, arrowY);
      ctx.lineTo(arrowX2 - 5, arrowY + 3);
      ctx.stroke();
      ctx.fillStyle = "#4dd9ff";
      ctx.font = "600 10px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText("v", trainCenterX, arrowY - 5);
    }
  }

  function drawTrainFrame(ctx, w, h, simTime) {
    drawBackground(ctx, w, h);
    const trainY = getTrainY(h);
    const halfW = getTrainHalfWidthPx(w);
    const halfH = 16;
    const v = state.v;
    const cycle = state.cycleDuration;
    const t = ((simTime % cycle) + cycle) % cycle;
    const sourceX = w / 2;
    const frontX = sourceX + halfW;
    const backX = sourceX - halfW;
    const groundOffset = v * halfW * (t / cycle - 0.5);
    drawGroundTrack(ctx, w, h, groundOffset);
    drawGroundReference(ctx, w, h);
    drawTrainBody(ctx, frontX, backX, trainY, halfH);
    const tFront = 1 / (1 - v);
    const tBack = 1 / (1 + v);
    const frontHit = t >= tFront;
    const backHit = t >= tBack;
    drawTrainEnd(ctx, frontX, trainY, halfH, true, frontHit, "车头");
    drawTrainEnd(ctx, backX, trainY, halfH, false, backHit, "车尾");
    drawLightSource(ctx, sourceX, trainY, 1);
    if (t > 0) {
      const ringR = t * halfW;
      drawLightRing(ctx, sourceX, trainY, ringR, 1 - t / cycle);
    }
    ctx.fillStyle = "#5a6a88";
    ctx.font = "10px ui-sans-serif, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("光源", sourceX, trainY - 14);
    if (v > 0.02) {
      const arrowY = getGroundY(h) - 18;
      const arrowX1 = w / 2 + 18;
      const arrowX2 = w / 2 - 18;
      ctx.strokeStyle = "#4dd9ff";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(arrowX1, arrowY);
      ctx.lineTo(arrowX2, arrowY);
      ctx.lineTo(arrowX2 + 5, arrowY - 3);
      ctx.moveTo(arrowX2, arrowY);
      ctx.lineTo(arrowX2 + 5, arrowY + 3);
      ctx.stroke();
      ctx.fillStyle = "#4dd9ff";
      ctx.font = "600 10px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText("地面后退", w / 2, arrowY - 5);
    }
  }

  function render() {
    const g = resizeCanvas(elements.canvasGround);
    const t = resizeCanvas(elements.canvasTrain);
    ctxG.setTransform(g.dpr, 0, 0, g.dpr, 0, 0);
    ctxT.setTransform(t.dpr, 0, 0, t.dpr, 0, 0);
    drawGroundFrame(ctxG, g.w, g.h, state.simTime);
    drawTrainFrame(ctxT, t.w, t.h, state.simTime);
    updateReadouts();
  }

  function updateReadouts() {
    const v = state.v;
    const tFrontTrain = 1 / (1 - v);
    const tBackTrain = 1 / (1 + v);
    const diffTrain = tFrontTrain - tBackTrain;
    elements.groundFront.textContent = "0.500";
    elements.groundBack.textContent = "0.500";
    elements.groundDiff.textContent = "0.000";
    elements.formulaGround.textContent = "0.000";
    elements.trainFront.textContent = tFrontTrain.toFixed(3);
    elements.trainBack.textContent = tBackTrain.toFixed(3);
    elements.trainDiff.textContent = diffTrain.toFixed(3);
    elements.formulaTrain.textContent = diffTrain.toFixed(3);
    if (v < 0.02) {
      elements.insightText.innerHTML = 'v ≈ 0 时两系退化为经典同时：<span class="accent">车头车尾同时到达</span>。';
    } else {
      elements.insightText.innerHTML = '地面系中两束光同时到达车头车尾；列车系中车尾先到、车头后到，<span class="accent">"同时"取决于参考系</span>。';
    }
  }

  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05);
    state.simTime += boundedDt * state.timeScale;
  }

  function setParameters(values) {
    const vDef = parameterSchema[0];
    const tDef = parameterSchema[1];
    state.v = clamp(finite(Number(values.v), vDef.default), vDef.min, vDef.max);
    state.timeScale = clamp(finite(Number(values.timeScale), tDef.default), tDef.min, tDef.max);
    elements.vInput.value = String(state.v);
    elements.tInput.value = String(state.timeScale);
    elements.vDisplay.textContent = state.v.toFixed(2) + " c";
    elements.tDisplay.textContent = state.timeScale.toFixed(1) + "×";
    render();
  }

  function start() {
    state.running = true;
    elements.status.textContent = "运行中";
    elements.pauseBtn.textContent = "暂停";
    elements.pauseBtn.classList.add("primary");
  }

  function pause() {
    state.running = false;
    elements.status.textContent = "已暂停";
    elements.pauseBtn.textContent = "继续";
    elements.pauseBtn.classList.remove("primary");
  }

  function reset() {
    state.simTime = 0;
    state.lastTimestamp = null;
    render();
  }

  function getState() {
    return {
      running: state.running,
      simTime: state.simTime,
      v: state.v,
      timeScale: state.timeScale,
      cycleDuration: state.cycleDuration,
      trainHalfLen: state.trainHalfLen,
      tFrontTrain: 1 / (1 - state.v),
      tBackTrain: 1 / (1 + state.v),
      tFrontGround: 0.5,
      tBackGround: 0.5
    };
  }

  function getReadouts() {
    return {
      groundFront: 0.5,
      groundBack: 0.5,
      groundDiff: 0,
      trainFront: 1 / (1 - state.v),
      trainBack: 1 / (1 + state.v),
      trainDiff: 1 / (1 - state.v) - 1 / (1 + state.v)
    };
  }

  function runModelChecks() {
    const v = state.v;
    const tFrontTrain = 1 / (1 - v);
    const tBackTrain = 1 / (1 + v);
    const diffTrain = tFrontTrain - tBackTrain;
    const approxFormula = 2 * v / (1 - v * v);
    return [
      { name: "地面系同时到达", pass: Math.abs(0.5 - 0.5) < 1e-9, expected: 0.5, actual: 0.5, tolerance: 0 },
      { name: "列车系车尾先到", pass: tBackTrain < tFrontTrain, expected: `t_back < t_front`, actual: `${tBackTrain.toFixed(3)} < ${tFrontTrain.toFixed(3)}`, tolerance: "strict" },
      { name: "列车系时间差公式", pass: Math.abs(diffTrain - (2 * v / (1 - v * v))) < 1e-9, expected: 2 * v / (1 - v * v), actual: diffTrain, tolerance: 1e-9 },
      { name: "v=0 时同时到达", pass: Math.abs(1 / (1 - 0) - 1 / (1 + 0)) < 1e-9, expected: 0, actual: 1 / (1 - 0) - 1 / (1 + 0), tolerance: 1e-9 },
      { name: "v 越大时间差越大", pass: (1 / 0.9 - 1 / 1.1) > (1 / 0.5 - 1 / 1.5), expected: "v=0.9 diff > v=0.5 diff", actual: `${(1/0.9 - 1/1.1).toFixed(3)} > ${(1/0.5 - 1/1.5).toFixed(3)}`, tolerance: "strict" },
      { name: "近似公式形式", pass: Math.abs(approxFormula - diffTrain) < 1e-9, expected: "2v/(1-v²) 等价于 L·v/(c²-v²) 形式", actual: `近似=${approxFormula.toFixed(3)} 精确=${diffTrain.toFixed(3)}`, tolerance: "形式等价" }
    ];
  }

  function bindControls() {
    elements.pauseBtn.addEventListener("click", () => {
      if (state.running) pause(); else start();
    });
    elements.resetBtn.addEventListener("click", reset);
    elements.vInput.addEventListener("input", () => {
      setParameters({ v: elements.vInput.value, timeScale: state.timeScale });
    });
    elements.tInput.addEventListener("input", () => {
      setParameters({ v: state.v, timeScale: elements.tInput.value });
    });
    window.addEventListener("resize", render);
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  function init() {
    bindControls();
    setParameters({ v: 0.5, timeScale: 1 });
    reset();
    requestAnimationFrame(frame);
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
