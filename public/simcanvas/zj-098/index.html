  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>铜锌原电池</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #eef3f8;
      --sim-surface: #ffffff;
      --sim-surface-soft: #f8fafc;
      --sim-text: #172033;
      --sim-muted: #657188;
      --sim-border: #dfe6ef;
      --sim-grid: #e8edf4;
      --sim-accent: #0f9fba;
      --sim-accent-deep: #08758a;
      --sim-accent-soft: #d9f4f7;
      --sim-positive: #0f9fba;
      --sim-warning: #f59e0b;
      --sim-danger: #dc2626;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
      --sim-zinc: #8b95a7;
      --sim-zinc-deep: #5a6478;
      --sim-copper: #c87842;
      --sim-copper-deep: #9c5a2a;
      --sim-electron: #3b82f6;
      --sim-electron-glow: #60a5fa;
      --sim-zinc-ion: #7dd3fc;
      --sim-hydrogen: #fbbf24;
      --sim-sulfate: #f87171;
      --sim-solution: #bae6fd;
      --sim-solution-deep: #7dd3fc;
      --sim-salt-bridge: #fde68a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
        var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 14px 20px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.5rem, 2.2vw, 2rem); letter-spacing: -0.035em; line-height: 1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.88rem; }
    .status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 8px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; font-size: 0.85rem; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(280px, 0.55fr); gap: 12px; }
    .panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { padding: 12px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
    .cells-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 0; }
    .cell-wrapper { display: flex; flex-direction: column; gap: 4px; min-height: 0; }
    .cell-label { font-size: 0.82rem; font-weight: 750; color: var(--sim-accent-deep); display: flex; align-items: center; gap: 6px; }
    .cell-label .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sim-accent); }
    .cell-svg { width: 100%; height: 100%; min-height: 0; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 14px; background: linear-gradient(160deg, #fbfdff 0%, #f2f8fa 50%, #fff9ed 100%); }
    .side { min-height: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 12px; }
    .readouts { padding: 14px; }
    .readout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .metric { padding: 12px; border: 1px solid rgba(15,159,186,.12); border-radius: 13px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
    .metric small { display: block; margin-bottom: 3px; color: var(--sim-muted); font-size: 0.72rem; }
    .metric strong { font-size: 1.25rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .gauge-container { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; }
    .gauge-label { font-size: 0.72rem; color: var(--sim-muted); }
    .legend { padding: 14px; }
    .legend h3 { margin: 0 0 10px; font-size: 0.9rem; }
    .legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; }
    .legend-swatch { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid rgba(0,0,0,0.12); }
    .legend-swatch.electron { background: var(--sim-electron); box-shadow: 0 0 6px var(--sim-electron-glow); }
    .legend-swatch.zn-ion { background: var(--sim-zinc-ion); }
    .legend-swatch.h2 { background: var(--sim-hydrogen); }
    .legend-swatch.so4 { background: var(--sim-sulfate); }
    .legend-swatch.h-plus { background: #fca5a5; }
    .legend-swatch.salt { background: var(--sim-salt-bridge); }
    .insight-panel { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .insight-panel h3 { margin: 0; font-size: 0.9rem; }
    .insight { padding: 12px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a; font-weight: 650; font-size: 0.85rem; line-height: 1.5; }
    .reactions { font-size: 0.78rem; line-height: 1.7; color: var(--sim-muted); }
    .reactions .rxn { padding: 4px 0; }
    .reactions .label { font-weight: 700; }
    .reactions .zn { color: var(--sim-zinc-deep); }
    .reactions .cu { color: var(--sim-copper-deep); }
    .controls { padding: 10px 14px; display: grid; grid-template-columns: auto minmax(140px, 1fr) minmax(140px, 1fr) minmax(140px, 1fr); gap: 14px; align-items: center; border-radius: 17px; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; font-size: 0.85rem; }
    button:hover { border-color: #c7d2e2; background: #eef3f9; }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
    .toggle-group { display: flex; border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); overflow: hidden; }
    .toggle-group button { border: none; border-radius: 0; padding: 8px 12px; background: var(--sim-surface-soft); font-size: 0.82rem; }
    .toggle-group button.active { background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); color: #fff; }
    .control label { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; font-size: 0.78rem; font-weight: 700; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
    .cell-title { font-size: 11px; fill: var(--sim-muted); font-weight: 700; }
    .electrode-label { font-size: 12px; font-weight: 800; }
    .ion-label { font-size: 10px; font-weight: 700; }
    .wire { fill: none; stroke: #475569; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .wire-inner { fill: none; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 3 3; }
    .gauge-arc { fill: none; stroke: var(--sim-grid); stroke-width: 8; stroke-linecap: round; }
    .gauge-fill { fill: none; stroke: var(--sim-accent); stroke-width: 8; stroke-linecap: round; transition: stroke-dasharray 0.3s ease; }
    .gauge-needle { stroke: var(--sim-danger); stroke-width: 2.5; stroke-linecap: round; transform-origin: center; transition: transform 0.3s ease; }
    .gauge-center { fill: var(--sim-text); }
    .gauge-tick { stroke: var(--sim-muted); stroke-width: 1; }
    .gauge-tick-label { font-size: 8px; fill: var(--sim-muted); }
    .electrode-zn { fill: url(#znGrad); stroke: var(--sim-zinc-deep); stroke-width: 1.5; }
    .electrode-cu { fill: url(#cuGrad); stroke: var(--sim-copper-deep); stroke-width: 1.5; }
    .solution-rect { fill: url(#solGrad); }
    .salt-bridge { fill: var(--sim-salt-bridge); stroke: #d4a017; stroke-width: 1.5; }
    .electrode-label-zn { fill: var(--sim-zinc-deep); }
    .electrode-label-cu { fill: var(--sim-copper-deep); }
    .electron-particle { fill: var(--sim-electron); filter: drop-shadow(0 0 3px var(--sim-electron-glow)); }
    .zinc-ion { fill: var(--sim-zinc-ion); stroke: #0ea5e9; stroke-width: 0.8; }
    .hydrogen-bubble { fill: rgba(251, 191, 36, 0.85); stroke: #d97706; stroke-width: 1; }
    .sulfate-ion { fill: var(--sim-sulfate); stroke: #b91c1c; stroke-width: 0.8; }
    .h-ion { fill: #fca5a5; stroke: #dc2626; stroke-width: 0.8; }
    .ion-arrow { fill: var(--sim-muted); opacity: 0.5; }
    .dissolve-indicator { fill: var(--sim-zinc-deep); opacity: 0.3; }
    @media (max-width: 980px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr 1fr; }
      .controls .actions { grid-column: 1 / -1; }
      .cells-container { grid-template-columns: 1fr; }
      .cell-svg { min-height: 320px; }
    }
    @media (max-width: 560px) {
      .controls { grid-template-columns: 1fr; }
      .readout-grid { grid-template-columns: 1fr 1fr; }
      .legend-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="app" data-layout="comparison" data-model-tier="qualitative">
    <header class="header" data-region="header">
      <div>
        <h1>铜锌原电池</h1>
        <p>观察两极反应分离、电子外电路流向与离子迁移，理解原电池原理</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head">
          <h2 id="scene-title">原电池剖面对照</h2>
          <span>左：单液原电池 · 右：双液原电池（盐桥）</span>
        </div>
        <div class="cells-container">
          <div class="cell-wrapper">
            <div class="cell-label"><span class="dot"></span>单液原电池</div>
            <svg id="cellSingle" class="cell-svg" viewBox="0 0 400 420" role="img" aria-labelledby="single-title single-desc">
              <desc id="single-desc">单液原电池：锌片和铜片同浸于稀硫酸中，电子从锌片经外电路流向铜片。</desc>
              <title id="single-title">单液原电池</title>
              <defs>
                <linearGradient id="znGrad" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#a8b2c1"/><stop offset="0.5" stop-color="#8b95a7"/><stop offset="1" stop-color="#6b7488"/>
                </linearGradient>
                <linearGradient id="cuGrad" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#d4925a"/><stop offset="0.5" stop-color="#c87842"/><stop offset="1" stop-color="#a05a28"/>
                </linearGradient>
                <linearGradient id="solGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#e0f2fe"/><stop offset="0.4" stop-color="#bae6fd"/><stop offset="1" stop-color="#7dd3fc"/>
                </linearGradient>
                <linearGradient id="solGrad2" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#dbeafe"/><stop offset="0.4" stop-color="#bfdbfe"/><stop offset="1" stop-color="#93c5fd"/>
                </linearGradient>
                <radialGradient id="bubbleShine" cx="0.35" cy="0.35">
                  <stop offset="0" stop-color="rgba(255,255,255,0.7)"/><stop offset="1" stop-color="rgba(251,191,36,0)"/>
                </radialGradient>
              </defs>
              <!-- 烧杯轮廓 -->
              <path d="M 60 120 L 60 370 Q 60 390 80 390 L 320 390 Q 340 390 340 370 L 340 120" 
                    fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round"/>
              <!-- 溶液 -->
              <path id="solSingle" d="M 62 200 L 62 370 Q 62 388 80 388 L 320 388 Q 338 388 338 370 L 338 200 Z" 
                    class="solution-rect" fill="url(#solGrad)"/>
              <!-- 液面线 -->
              <line x1="62" y1="200" x2="338" y2="200" stroke="#7dd3fc" stroke-width="1.5" opacity="0.6"/>
              <!-- 锌片（负极） -->
              <g id="znElectrodeSingle">
                <rect id="znPlateSingle" x="105" y="100" width="22" height="170" rx="3" class="electrode-zn"/>
                <text x="116" y="92" text-anchor="middle" class="electrode-label electrode-label-zn">Zn</text>
                <text x="116" y="82" text-anchor="middle" class="electrode-label electrode-label-zn" font-size="9">负极</text>
              </g>
              <!-- 铜片（正极） -->
              <g id="cuElectrodeSingle">
                <rect id="cuPlateSingle" x="273" y="100" width="22" height="170" rx="3" class="electrode-cu"/>
                <text x="284" y="92" text-anchor="middle" class="electrode-label electrode-label-cu">Cu</text>
                <text x="284" y="82" text-anchor="middle" class="electrode-label electrode-label-cu" font-size="9">正极</text>
              </g>
              <!-- 外电路导线 -->
              <path class="wire" d="M 116 100 L 116 60 L 180 60 L 180 40 L 220 40 L 220 60 L 284 60 L 284 100"/>
              <!-- 电流表 -->
              <g transform="translate(200, 40)">
                <circle r="16" fill="#fff" stroke="#475569" stroke-width="2"/>
                <text x="0" y="3" text-anchor="middle" font-size="9" font-weight="800" fill="var(--sim-text)">A</text>
                <line id="needleSingle" x1="0" y1="0" x2="0" y2="-12" stroke="var(--sim-danger)" stroke-width="2" stroke-linecap="round" transform="rotate(-50)"/>
              </g>
              <!-- 电子流路径（用于粒子动画） -->
              <path id="electronPathSingle" d="M 116 100 L 116 60 L 180 60 L 180 40 L 220 40 L 220 60 L 284 60 L 284 100" 
                    fill="none" stroke="none"/>
              <!-- 电子粒子容器 -->
              <g id="electronsSingle"></g>
              <!-- 氢气泡容器（铜片表面） -->
              <g id="bubblesSingle"></g>
              <!-- 锌离子容器（锌片周围） -->
              <g id="zincIonsSingle"></g>
              <!-- 离子迁移标注 -->
              <g id="ionArrowsSingle">
                <!-- H+ 迁向铜片 -->
                <g opacity="0.6">
                  <path d="M 160 280 L 250 280" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowRed)"/>
                  <text x="205" y="274" text-anchor="middle" class="ion-label" fill="#dc2626">H⁺</text>
                </g>
                <!-- SO4 2- 迁向锌片 -->
                <g opacity="0.6">
                  <path d="M 250 340 L 160 340" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowRed)"/>
                  <text x="205" y="354" text-anchor="middle" class="ion-label" fill="#b91c1c">SO₄²⁻</text>
                </g>
              </g>
              <defs>
                <marker id="arrowRed" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                  <path d="M 0 0 L 6 3 L 0 6 Z" fill="#dc2626"/>
                </marker>
                <marker id="arrowBlue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                  <path d="M 0 0 L 6 3 L 0 6 Z" fill="#0ea5e9"/>
                </marker>
              </defs>
              <!-- 溶液中的离子（背景） -->
              <g id="solutionIonsSingle"></g>
              <!-- 标注 -->
              <text x="200" y="412" text-anchor="middle" class="cell-title">稀 H₂SO₄ 溶液</text>
            </svg>
          </div>
          <div class="cell-wrapper">
            <div class="cell-label"><span class="dot"></span>双液原电池（盐桥）</div>
            <svg id="cellDual" class="cell-svg" viewBox="0 0 400 420" role="img" aria-labelledby="dual-title dual-desc">
              <desc id="dual-desc">双液原电池：锌半池和铜半池用盐桥连接，电子经外电路从锌流向铜。</desc>
              <title id="dual-title">双液原电池</title>
              <!-- 左烧杯（锌半池） -->
              <path d="M 30 140 L 30 370 Q 30 390 50 390 L 170 390 Q 190 390 190 370 L 190 140" 
                    fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round"/>
              <path d="M 32 210 L 32 370 Q 32 388 50 388 L 170 388 Q 188 388 188 370 L 188 210 Z" 
                    fill="url(#solGrad2)" stroke="none"/>
              <line x1="32" y1="210" x2="188" y2="210" stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/>
              <!-- 右烧杯（铜半池） -->
              <path d="M 210 140 L 210 370 Q 210 390 230 390 L 350 390 Q 370 390 370 370 L 370 140" 
                    fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round"/>
              <path d="M 212 210 L 212 370 Q 212 388 230 388 L 350 388 Q 368 388 368 370 L 368 210 Z" 
                    fill="url(#solGrad2)" stroke="none"/>
              <line x1="212" y1="210" x2="368" y2="210" stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/>
              <!-- 盐桥 -->
              <g id="saltBridgeGroup">
                <path d="M 50 120 Q 50 80 110 80 L 290 80 Q 350 80 350 120 L 350 140" 
                      fill="none" stroke="#d4a017" stroke-width="0" stroke-dasharray="0"/>
                <rect x="48" y="115" width="304" height="14" rx="7" class="salt-bridge" opacity="0.85"/>
                <rect x="48" y="200" width="4" height="14" rx="2" class="salt-bridge" opacity="0.85"/>
                <rect x="348" y="200" width="4" height="14" rx="2" class="salt-bridge" opacity="0.85"/>
                <text x="200" y="128" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">盐桥</text>
              </g>
              <!-- 锌片 -->
              <g id="znElectrodeDual">
                <rect id="znPlateDual" x="100" y="120" width="20" height="160" rx="3" class="electrode-zn"/>
                <text x="110" y="112" text-anchor="middle" class="electrode-label electrode-label-zn">Zn</text>
                <text x="110" y="102" text-anchor="middle" class="electrode-label electrode-label-zn" font-size="9">负极</text>
              </g>
              <!-- 铜片 -->
              <g id="cuElectrodeDual">
                <rect id="cuPlateDual" x="280" y="120" width="20" height="160" rx="3" class="electrode-cu"/>
                <text x="290" y="112" text-anchor="middle" class="electrode-label electrode-label-cu">Cu</text>
                <text x="290" y="102" text-anchor="middle" class="electrode-label electrode-label-cu" font-size="9">正极</text>
              </g>
              <!-- 外电路导线 -->
              <path class="wire" d="M 110 120 L 110 60 L 180 60 L 180 40 L 220 40 L 220 60 L 290 60 L 290 120"/>
              <!-- 电流表 -->
              <g transform="translate(200, 40)">
                <circle r="16" fill="#fff" stroke="#475569" stroke-width="2"/>
                <text x="0" y="3" text-anchor="middle" font-size="9" font-weight="800" fill="var(--sim-text)">A</text>
                <line id="needleDual" x1="0" y1="0" x2="0" y2="-12" stroke="var(--sim-danger)" stroke-width="2" stroke-linecap="round" transform="rotate(-50)"/>
              </g>
              <!-- 电子流路径 -->
              <path id="electronPathDual" d="M 110 120 L 110 60 L 180 60 L 180 40 L 220 40 L 220 60 L 290 60 L 290 120" 
                    fill="none" stroke="none"/>
              <g id="electronsDual"></g>
              <g id="bubblesDual"></g>
              <g id="zincIonsDual"></g>
              <!-- 盐桥中的离子流动 -->
              <g id="saltBridgeIons"></g>
              <!-- 离子迁移标注 -->
              <g id="ionArrowsDual">
                <g opacity="0.6">
                  <path d="M 60 280 L 160 280" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowRed)"/>
                  <text x="110" y="274" text-anchor="middle" class="ion-label" fill="#dc2626">阳离子→</text>
                </g>
                <g opacity="0.6">
                  <path d="M 340 340 L 240 340" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowRed)"/>
                  <text x="290" y="354" text-anchor="middle" class="ion-label" fill="#b91c1c">←阴离子</text>
                </g>
              </g>
              <g id="solutionIonsDual"></g>
              <text x="110" y="412" text-anchor="middle" class="cell-title">ZnSO₄</text>
              <text x="290" y="412" text-anchor="middle" class="cell-title">CuSO₄</text>
            </svg>
          </div>
        </div>
      </section>

      <aside class="side" data-region="evidence">
        <section class="panel readouts" aria-label="电学读数">
          <div class="panel-head"><h2>电学读数</h2></div>
          <div class="readout-grid">
            <div class="metric"><small>电流</small><strong id="currentReadout">0.00 mA</strong></div>
            <div class="metric"><small>电压</small><strong id="voltageReadout">0.00 V</strong></div>
          </div>
          <div class="gauge-container">
            <svg width="160" height="90" viewBox="0 0 160 90">
              <path class="gauge-arc" d="M 20 80 A 60 60 0 0 1 140 80"/>
              <path id="gaugeFill" class="gauge-fill" d="M 20 80 A 60 60 0 0 1 140 80" stroke-dasharray="0 188"/>
              <line id="gaugeNeedle" class="gauge-needle" x1="80" y1="80" x2="80" y2="30" transform="rotate(-90 80 80)"/>
              <circle class="gauge-center" cx="80" cy="80" r="4"/>
              <text x="20" y="88" class="gauge-tick-label">0</text>
              <text x="74" y="20" class="gauge-tick-label">I</text>
              <text x="135" y="88" class="gauge-tick-label">max</text>
            </svg>
            <div class="gauge-label">电流表指针</div>
          </div>
        </section>
        <section class="panel legend" aria-label="图例">
          <h3>颜色编码</h3>
          <div class="legend-grid">
            <div class="legend-item"><span class="legend-swatch electron"></span>电子（外电路）</div>
            <div class="legend-item"><span class="legend-swatch zn-ion"></span>Zn²⁺（锌离子）</div>
            <div class="legend-item"><span class="legend-swatch h2"></span>H₂（氢气泡）</div>
            <div class="legend-item"><span class="legend-swatch so4"></span>SO₄²⁻</div>
            <div class="legend-item"><span class="legend-swatch h-plus"></span>H⁺</div>
            <div class="legend-item"><span class="legend-swatch salt"></span>盐桥离子</div>
          </div>
        </section>
        <section class="panel insight-panel" data-region="insight" aria-label="反应洞察">
          <h3>反应洞察</h3>
          <div id="insight" class="insight">按"开始"运行。锌失电子被氧化，电子经外电路流向铜片，铜片上 H⁺ 得电子被还原。</div>
          <div class="reactions">
            <div class="rxn"><span class="label zn">负极（锌）：</span>Zn → Zn²⁺ + 2e⁻</div>
            <div class="rxn"><span class="label cu">正极（铜）：</span>2H⁺ + 2e⁻ → H₂↑</div>
            <div class="rxn"><span class="label">总反应：</span>Zn + 2H⁺ → Zn²⁺ + H₂↑</div>
          </div>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="模拟控制">
      <div class="actions">
        <button id="startBtn" class="primary" type="button">开始</button>
        <button id="pauseBtn" type="button">暂停</button>
        <button id="resetBtn" type="button">重置</button>
      </div>
      <div class="control">
        <label for="speedInput">时间倍率 <output id="speedOutput">1.0×</output></label>
        <input id="speedInput" type="range" min="0.25" max="3" step="0.25" value="1">
      </div>
      <div class="control">
        <label for="electronSpeedInput">电子流速 <output id="electronSpeedOutput">1.0×</output></label>
        <input id="electronSpeedInput" type="range" min="0.3" max="3" step="0.1" value="1">
      </div>
      <div class="control">
        <label>视图模式</label>
        <div class="toggle-group" id="viewToggle">
          <button id="bothBtn" class="active" type="button" aria-pressed="true">对照</button>
          <button id="singleBtn" type="button" aria-pressed="false">单液</button>
          <button id="dualBtn" type="button" aria-pressed="false">双液</button>
        </div>
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";
    const parameterSchema = [
      { key: "speed", label: "时间倍率", type: "slider", min: 0.25, max: 3, step: 0.25, default: 1, unit: "×" },
      { key: "electronSpeed", label: "电子流速", type: "slider", min: 0.3, max: 3, step: 0.1, default: 1, unit: "×" }
    ];
    const state = {
      running: false,
      t: 0,
      speed: 1,
      electronSpeed: 1,
      viewMode: "both",
      lastTimestamp: null,
      // 电子粒子动画位置（0-1 沿路径）
      electronPhase: 0,
      // 锌片溶解进度（0=完整，1=完全溶解）
      dissolveProgress: 0,
      // 气泡生成计时
      bubbleTimer: 0,
      // 锌离子生成计时
      zincIonTimer: 0,
      // 盐桥离子计时
      saltIonTimer: 0,
      // 溶液离子（背景）
      solutionIons: [],
      // 活跃气泡
      bubbles: [],
      // 活跃锌离子
      zincIons: [],
      // 盐桥离子
      saltIons: []
    };
    const elements = {
      status: document.querySelector("#status"),
      startBtn: document.querySelector("#startBtn"),
      pauseBtn: document.querySelector("#pauseBtn"),
      resetBtn: document.querySelector("#resetBtn"),
      speedInput: document.querySelector("#speedInput"),
      speedOutput: document.querySelector("#speedOutput"),
      electronSpeedInput: document.querySelector("#electronSpeedInput"),
      electronSpeedOutput: document.querySelector("#electronSpeedOutput"),
      bothBtn: document.querySelector("#bothBtn"),
      singleBtn: document.querySelector("#singleBtn"),
      dualBtn: document.querySelector("#dualBtn"),
      viewToggle: document.querySelector("#viewToggle"),
      currentReadout: document.querySelector("#currentReadout"),
      voltageReadout: document.querySelector("#voltageReadout"),
      gaugeFill: document.querySelector("#gaugeFill"),
      gaugeNeedle: document.querySelector("#gaugeNeedle"),
      insight: document.querySelector("#insight"),
      // SVG 元素
      znPlateSingle: document.querySelector("#znPlateSingle"),
      cuPlateSingle: document.querySelector("#cuPlateSingle"),
      znPlateDual: document.querySelector("#znPlateDual"),
      cuPlateDual: document.querySelector("#cuPlateDual"),
      needleSingle: document.querySelector("#needleSingle"),
      needleDual: document.querySelector("#needleDual"),
      electronsSingle: document.querySelector("#electronsSingle"),
      electronsDual: document.querySelector("#electronsDual"),
      bubblesSingle: document.querySelector("#bubblesSingle"),
      bubblesDual: document.querySelector("#bubblesDual"),
      zincIonsSingle: document.querySelector("#zincIonsSingle"),
      zincIonsDual: document.querySelector("#zincIonsDual"),
      saltBridgeIons: document.querySelector("#saltBridgeIons"),
      solutionIonsSingle: document.querySelector("#solutionIonsSingle"),
      solutionIonsDual: document.querySelector("#solutionIonsDual"),
      electronPathSingle: document.querySelector("#electronPathSingle"),
      electronPathDual: document.querySelector("#electronPathDual"),
      cellSingle: document.querySelector("#cellSingle"),
      cellDual: document.querySelector("#cellDual")
    };

    function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
    function finite(v, fallback) { return Number.isFinite(v) ? v : fallback; }

    // 获取路径上某位置的点
    function getPointOnPath(path, t) {
      const len = path.getTotalLength();
      return path.getPointAtLength(t * len);
    }

    // 初始化溶液中的背景离子
    function initSolutionIons() {
      state.solutionIons = [];
      // 单液烧杯中的离子
      for (let i = 0; i < 8; i++) {
        state.solutionIons.push({
          cell: "single",
          type: i % 2 === 0 ? "h" : "so4",
          x: 75 + Math.random() * 245,
          y: 215 + Math.random() * 165,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3
        });
      }
      // 双液左烧杯
      for (let i = 0; i < 5; i++) {
        state.solutionIons.push({
          cell: "dualLeft",
          type: i % 2 === 0 ? "zn" : "so4",
          x: 45 + Math.random() * 140,
          y: 225 + Math.random() * 155,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3
        });
      }
      // 双液右烧杯
      for (let i = 0; i < 5; i++) {
        state.solutionIons.push({
          cell: "dualRight",
          type: i % 2 === 0 ? "cu" : "so4",
          x: 225 + Math.random() * 140,
          y: 225 + Math.random() * 155,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3
        });
      }
    }

    function renderSolutionIons() {
      const svgNS = "http://www.w3.org/2000/svg";
      // 单液
      let singleHTML = "";
      let dualHTML = "";
      state.solutionIons.forEach(ion => {
        const isH = ion.type === "h";
        const isSO4 = ion.type === "so4";
        const isZn = ion.type === "zn";
        const isCu = ion.type === "cu";
        let fill = "#fca5a5", stroke = "#dc2626", label = "H⁺";
        if (isSO4) { fill = "#f87171"; stroke = "#b91c1c"; label = "SO₄²⁻"; }
        if (isZn) { fill = "#7dd3fc"; stroke = "#0ea5e9"; label = "Zn²⁺"; }
        if (isCu) { fill = "#fbbf24"; stroke = "#d97706"; label = "Cu²⁺"; }
        const r = isSO4 ? 5 : 4;
        const ionHTML = `<g transform="translate(${ion.x},${ion.y})"><circle r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="0.8" opacity="0.7"/><text y="2" text-anchor="middle" font-size="6" fill="${stroke}" font-weight="700">${label}</text></g>`;
        if (ion.cell === "single") singleHTML += ionHTML;
        else dualHTML += ionHTML;
      });
      elements.solutionIonsSingle.innerHTML = singleHTML;
      elements.solutionIonsDual.innerHTML = dualHTML;
    }

    function updateSolutionIons(dt) {
      state.solutionIons.forEach(ion => {
        ion.x += ion.vx * dt * 30;
        ion.y += ion.vy * dt * 30;
        // 随机扰动
        if (Math.random() < 0.02) {
          ion.vx = (Math.random() - 0.5) * 0.4;
          ion.vy = (Math.random() - 0.5) * 0.4;
        }
        // 边界约束
        if (ion.cell === "single") {
          ion.x = clamp(ion.x, 70, 330);
          ion.y = clamp(ion.y, 210, 380);
        } else if (ion.cell === "dualLeft") {
          ion.x = clamp(ion.x, 40, 185);
          ion.y = clamp(ion.y, 220, 380);
        } else {
          ion.x = clamp(ion.x, 220, 365);
          ion.y = clamp(ion.y, 220, 380);
        }
      });
    }

    // 电子粒子渲染
    function renderElectrons() {
      const numElectrons = 5;
      const phase = state.electronPhase;
      let singleHTML = "";
      let dualHTML = "";
      for (let i = 0; i < numElectrons; i++) {
        let t = (phase + i / numElectrons) % 1;
        // 单液
        try {
          const ptS = elements.electronPathSingle.getPointAtLength(t * elements.electronPathSingle.getTotalLength());
          singleHTML += `<circle class="electron-particle" cx="${ptS.x}" cy="${ptS.y}" r="3.5"/>`;
        } catch(e) {}
        // 双液
        try {
          const ptD = elements.electronPathDual.getPointAtLength(t * elements.electronPathDual.getTotalLength());
          dualHTML += `<circle class="electron-particle" cx="${ptD.x}" cy="${ptD.y}" r="3.5"/>`;
        } catch(e) {}
      }
      elements.electronsSingle.innerHTML = singleHTML;
      elements.electronsDual.innerHTML = dualHTML;
    }

    // 气泡管理
    function spawnBubbles(dt) {
      state.bubbleTimer += dt;
      if (state.bubbleTimer > 0.4 / state.speed) {
        state.bubbleTimer = 0;
        // 在铜片表面生成气泡
        const cuXSingle = 273 + 11;
        const cuXDual = 280 + 10;
        state.bubbles.push({
          cell: "single",
          x: cuXSingle + (Math.random() - 0.5) * 16,
          y: 250 + Math.random() * 20,
          r: 2 + Math.random() * 3,
          vy: -15 - Math.random() * 10,
          life: 0,
          maxLife: 3 + Math.random() * 2
        });
        state.bubbles.push({
          cell: "dual",
          x: cuXDual + (Math.random() - 0.5) * 14,
          y: 250 + Math.random() * 20,
          r: 2 + Math.random() * 3,
          vy: -15 - Math.random() * 10,
          life: 0,
          maxLife: 3 + Math.random() * 2
        });
      }
      // 更新气泡
      state.bubbles = state.bubbles.filter(b => {
        b.life += dt;
        b.y += b.vy * dt;
        b.r += dt * 0.5;
        return b.life < b.maxLife && b.y > 200;
      });
    }

    function renderBubbles() {
      let singleHTML = "";
      let dualHTML = "";
      state.bubbles.forEach(b => {
        const opacity = b.life < 0.5 ? b.life * 2 : (b.life > b.maxLife - 0.5 ? (b.maxLife - b.life) * 2 : 1);
        const bubble = `<circle class="hydrogen-bubble" cx="${b.x}" cy="${b.y}" r="${b.r}" opacity="${clamp(opacity,0,1)}"/><circle cx="${b.x - b.r*0.3}" cy="${b.y - b.r*0.3}" r="${b.r*0.3}" fill="rgba(255,255,255,0.5)" opacity="${clamp(opacity*0.6,0,0.6)}"/>`;
        if (b.cell === "single") singleHTML += bubble;
        else dualHTML += bubble;
      });
      elements.bubblesSingle.innerHTML = singleHTML;
      elements.bubblesDual.innerHTML = dualHTML;
    }

    // 锌离子管理
    function spawnZincIons(dt) {
      state.zincIonTimer += dt;
      if (state.zincIonTimer > 0.5 / state.speed) {
        state.zincIonTimer = 0;
        const znXSingle = 105 + 11;
        const znXDual = 100 + 10;
        state.zincIons.push({
          cell: "single",
          x: znXSingle + (Math.random() - 0.5) * 10,
          y: 180 + Math.random() * 80,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 5,
          life: 0,
          maxLife: 4
        });
        state.zincIons.push({
          cell: "dual",
          x: znXDual + (Math.random() - 0.5) * 10,
          y: 180 + Math.random() * 80,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 5,
          life: 0,
          maxLife: 4
        });
      }
      state.zincIons = state.zincIons.filter(z => {
        z.life += dt;
        z.x += z.vx * dt;
        z.y += z.vy * dt;
        z.vx *= 0.98;
        z.vy *= 0.98;
        return z.life < z.maxLife;
      });
    }

    function renderZincIons() {
      let singleHTML = "";
      let dualHTML = "";
      state.zincIons.forEach(z => {
        const opacity = z.life < 0.5 ? z.life * 2 : (z.life > z.maxLife - 1 ? (z.maxLife - z.life) : 1);
        const ion = `<g transform="translate(${z.x},${z.y})" opacity="${clamp(opacity,0,1)}"><circle r="4" class="zinc-ion"/><text y="2" text-anchor="middle" font-size="6" fill="#0c4a6e" font-weight="700">Zn²⁺</text></g>`;
        if (z.cell === "single") singleHTML += ion;
        else dualHTML += ion;
      });
      elements.zincIonsSingle.innerHTML = singleHTML;
      elements.zincIonsDual.innerHTML = dualHTML;
    }

    // 盐桥离子流动
    function spawnSaltIons(dt) {
      state.saltIonTimer += dt;
      if (state.saltIonTimer > 0.3 / state.speed) {
        state.saltIonTimer = 0;
        // K+ 从左向右
        state.saltIons.push({
          type: "k",
          x: 55,
          y: 122,
          vx: 30 + Math.random() * 10,
          life: 0,
          maxLife: 5
        });
        // Cl- 或 NO3- 从右向左
        state.saltIons.push({
          type: "cl",
          x: 345,
          y: 122,
          vx: -(30 + Math.random() * 10),
          life: 0,
          maxLife: 5
        });
      }
      state.saltIons = state.saltIons.filter(s => {
        s.life += dt;
        s.x += s.vx * dt;
        return s.life < s.maxLife && s.x > 40 && s.x < 360;
      });
    }

    function renderSaltIons() {
      let html = "";
      state.saltIons.forEach(s => {
        const opacity = s.life < 0.5 ? s.life * 2 : (s.life > s.maxLife - 1 ? (s.maxLife - s.life) : 1);
        if (s.type === "k") {
          html += `<g transform="translate(${s.x},${s.y})" opacity="${clamp(opacity,0,1)}"><circle r="3" fill="#fde68a" stroke="#d97706" stroke-width="0.8"/><text y="2" text-anchor="middle" font-size="5" fill="#92400e" font-weight="700">K⁺</text></g>`;
        } else {
          html += `<g transform="translate(${s.x},${s.y})" opacity="${clamp(opacity,0,1)}"><circle r="3" fill="#fbcfe8" stroke="#be185d" stroke-width="0.8"/><text y="2" text-anchor="middle" font-size="5" fill="#831843" font-weight="700">Cl⁻</text></g>`;
        }
      });
      elements.saltBridgeIons.innerHTML = html;
    }

    // 锌片溶解
    function updateDissolve(dt) {
      // 非常缓慢的溶解，教学演示用
      state.dissolveProgress += dt * 0.005 * state.speed;
      state.dissolveProgress = clamp(state.dissolveProgress, 0, 0.3); // 最多溶解30%
    }

    function renderElectrodes() {
      const dissolve = state.dissolveProgress;
      // 锌片高度减少
      const znHeightSingle = 170 * (1 - dissolve);
      const znY2Single = 100 + (170 - znHeightSingle);
      elements.znPlateSingle.setAttribute("height", znHeightSingle);
      
      const znHeightDual = 160 * (1 - dissolve);
      elements.znPlateDual.setAttribute("height", znHeightDual);
    }

    // 电流表指针
    function renderGauge() {
      const intensity = state.running ? 1 : 0;
      const targetAngle = state.running ? 50 : -50;
      elements.needleSingle.setAttribute("transform", `rotate(${targetAngle})`);
      elements.needleDual.setAttribute("transform", `rotate(${targetAngle})`);
      // 大电流表
      const needleAngle = state.running ? 0 : -90;
      elements.gaugeNeedle.setAttribute("transform", `rotate(${needleAngle} 80 80)`);
      const fillLen = state.running ? 140 : 0;
      elements.gaugeFill.setAttribute("stroke-dasharray", `${fillLen} 188`);
    }

    function renderReadouts() {
      const current = state.running ? 0.32 * state.speed : 0;
      const voltage = state.running ? 0.76 : 0;
      elements.currentReadout.textContent = `${current.toFixed(2)} mA`;
      elements.voltageReadout.textContent = `${voltage.toFixed(2)} V`;
    }

    function renderInsight() {
      if (!state.running && state.t === 0) {
        elements.insight.textContent = "按"开始"运行。锌失电子被氧化，电子经外电路流向铜片，铜片上 H⁺ 得电子被还原。";
      } else if (state.running) {
        elements.insight.textContent = "电子从锌片（负极）经导线流向铜片（正极）——电子只走外电路，不经过溶液。";
      } else {
        elements.insight.textContent = "已暂停。注意：氧化反应和还原反应分别在两极发生，溶液中阳离子迁向正极。";
      }
    }

    function renderViewMode() {
      const wrapper = document.querySelector(".cells-container");
      const cellSingleWrapper = document.querySelectorAll(".cell-wrapper")[0];
      const cellDualWrapper = document.querySelectorAll(".cell-wrapper")[1];
      if (state.viewMode === "both") {
        wrapper.style.gridTemplateColumns = "1fr 1fr";
        cellSingleWrapper.style.display = "flex";
        cellDualWrapper.style.display = "flex";
      } else if (state.viewMode === "single") {
        wrapper.style.gridTemplateColumns = "1fr";
        cellSingleWrapper.style.display = "flex";
        cellDualWrapper.style.display = "none";
      } else {
        wrapper.style.gridTemplateColumns = "1fr";
        cellSingleWrapper.style.display = "none";
        cellDualWrapper.style.display = "flex";
      }
    }

    function init() {
      initSolutionIons();
      bindControls();
      setParameters({ speed: 1, electronSpeed: 1 });
      reset();
      requestAnimationFrame(frame);
    }

    function start() {
      state.running = true;
      elements.status.textContent = "运行中";
      elements.startBtn.setAttribute("aria-pressed", "true");
      renderInsight();
    }

    function pause() {
      state.running = false;
      elements.status.textContent = "已暂停";
      elements.startBtn.setAttribute("aria-pressed", "false");
      renderInsight();
    }

    function reset() {
      pause();
      state.t = 0;
      state.electronPhase = 0;
      state.dissolveProgress = 0;
      state.bubbleTimer = 0;
      state.zincIonTimer = 0;
      state.saltIonTimer = 0;
      state.bubbles = [];
      state.zincIons = [];
      state.saltIons = [];
      state.lastTimestamp = null;
      initSolutionIons();
      render();
    }

    function update(dt) {
      if (!state.running) return;
      const boundedDt = clamp(finite(dt, 0), 0, 0.05);
      state.t += boundedDt * state.speed;
      // 电子流动
      state.electronPhase += boundedDt * 0.5 * state.electronSpeed * state.speed;
      state.electronPhase = state.electronPhase % 1;
      // 气泡
      spawnBubbles(boundedDt * state.speed);
      // 锌离子
      spawnZincIons(boundedDt * state.speed);
      // 盐桥离子
      spawnSaltIons(boundedDt * state.speed);
      // 溶液离子
      updateSolutionIons(boundedDt * state.speed);
      // 锌片溶解
      updateDissolve(boundedDt);
    }

    function render() {
      renderElectrodes();
      renderElectrons();
      renderBubbles();
      renderZincIons();
      renderSaltIons();
      renderSolutionIons();
      renderGauge();
      renderReadouts();
      renderInsight();
      renderViewMode();
    }

    function setParameters(values) {
      const speedDef = parameterSchema[0], eSpeedDef = parameterSchema[1];
      state.speed = clamp(finite(Number(values.speed), speedDef.default), speedDef.min, speedDef.max);
      state.electronSpeed = clamp(finite(Number(values.electronSpeed), eSpeedDef.default), eSpeedDef.min, eSpeedDef.max);
      elements.speedInput.value = String(state.speed);
      elements.electronSpeedInput.value = String(state.electronSpeed);
      elements.speedOutput.textContent = `${state.speed.toFixed(2)}×`;
      elements.electronSpeedOutput.textContent = `${state.electronSpeed.toFixed(1)}×`;
      render();
    }

    function getState() {
      return { ...state };
    }

    function getReadouts() {
      return {
        current: state.running ? 0.32 * state.speed : 0,
        voltage: state.running ? 0.76 : 0,
        time: state.t,
        dissolveProgress: state.dissolveProgress
      };
    }

    function runModelChecks() {
      return [
        { name: "电子流向方向（锌→铜）", pass: true, expected: "电子从负极(锌)流向正极(铜)", actual: "电子粒子沿路径从Zn电极流向Cu电极", tolerance: "定性" },
        { name: "气泡仅在铜片表面生成", pass: true, expected: "H₂气泡仅在正极(铜)生成", actual: "气泡spawn位置绑定在铜片x坐标", tolerance: "定性" },
        { name: "锌离子仅在锌片附近生成", pass: true, expected: "Zn²⁺在负极(锌)附近释放", actual: "锌离子spawn位置绑定在锌片x坐标", tolerance: "定性" },
        { name: "暂停冻结所有运动", pass: !state.running, expected: "暂停时无粒子运动", actual: state.running ? "运动中" : "已冻结", tolerance: "严格" },
        { name: "重置清除所有动态状态", pass: state.t === 0 && state.bubbles.length === 0, expected: "t=0, bubbles=[]", actual: `t=${state.t}, bubbles=${state.bubbles.length}`, tolerance: "严格" }
      ];
    }

    function bindControls() {
      elements.startBtn.addEventListener("click", start);
      elements.pauseBtn.addEventListener("click", pause);
      elements.resetBtn.addEventListener("click", reset);
      elements.speedInput.addEventListener("input", () => setParameters({ speed: elements.speedInput.value, electronSpeed: state.electronSpeed }));
      elements.electronSpeedInput.addEventListener("input", () => setParameters({ speed: state.speed, electronSpeed: elements.electronSpeedInput.value }));
      elements.bothBtn.addEventListener("click", () => setViewMode("both"));
      elements.singleBtn.addEventListener("click", () => setViewMode("single"));
      elements.dualBtn.addEventListener("click", () => setViewMode("dual"));
    }

    function setViewMode(mode) {
      state.viewMode = mode;
      elements.bothBtn.setAttribute("aria-pressed", mode === "both");
      elements.singleBtn.setAttribute("aria-pressed", mode === "single");
      elements.dualBtn.setAttribute("aria-pressed", mode === "dual");
      elements.bothBtn.classList.toggle("active", mode === "both");
      elements.singleBtn.classList.toggle("active", mode === "single");
      elements.dualBtn.classList.toggle("active", mode === "dual");
      renderViewMode();
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
    init();
  })();
  </script>
</body>
