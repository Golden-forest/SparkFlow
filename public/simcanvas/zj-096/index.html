  <style>

<body>
  <div class="app" data-layout="scene-first" data-model-tier="analytic">
    <header class="header" data-region="header">
      <div>
        <h1>化学平衡移动 · 勒夏特列原理</h1>
        <p>N₂ + 3H₂ ⇌ 2NH₃ · 施加扰动，观察平衡如何"减弱"该扰动</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head">
          <h2 id="scene-title">反应容器</h2>
          <div class="legend">
            <span class="legend-item"><span class="legend-dot n2"></span>N₂</span>
            <span class="legend-item"><span class="legend-dot h2"></span>H₂</span>
            <span class="legend-item"><span class="legend-dot nh3"></span>NH₃</span>
          </div>
        </div>
        <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
          <desc id="scene-desc">反应容器中的分子动画，蓝色为N₂，橙色为H₂，绿色为NH₃。</desc>
        </svg>
      </section>

      <aside class="side" data-region="evidence">
        <section class="panel chart-panel" aria-label="浓度时间曲线">
          <div class="panel-head"><h2>浓度–时间曲线</h2><span>mol/L</span></div>
          <canvas id="chart"></canvas>
        </section>
        <section class="panel readouts">
          <div class="readout-grid">
            <div class="metric"><small><span class="swatch" style="background:var(--sim-n2)"></span>[N₂]</small><strong id="n2Readout">0.00</strong></div>
            <div class="metric"><small><span class="swatch" style="background:var(--sim-h2)"></span>[H₂]</small><strong id="h2Readout">0.00</strong></div>
            <div class="metric"><small><span class="swatch" style="background:var(--sim-nh3)"></span>[NH₃]</small><strong id="nh3Readout">0.00</strong></div>
          </div>
          <div class="direction-row">
            <span class="label">平衡移动：</span><span id="directionTag" class="direction-tag none">待开始</span>
            <span style="margin-left:8px;color:var(--sim-muted);font-size:0.78rem">K = <output id="kReadout">0.00</output></span>
          </div>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="模拟控制">
      <div class="actions">
        <button id="startBtn" class="primary" type="button">开始</button>
        <button id="pauseBtn" type="button">暂停</button>
        <button id="resetBtn" type="button">重置</button>
      </div>
      <div class="actions">
        <button id="pressureBtn" class="disturb" type="button">加压</button>
        <button id="tempBtn" class="disturb" type="button">升温</button>
        <button id="reactantBtn" class="disturb" type="button">增加反应物</button>
      </div>
      <div class="control">
        <label for="speedInput">演化速率 <output id="speedOutput">1.0×</output></label>
        <input id="speedInput" type="range" min="0.5" max="3" step="0.1" value="1">
      </div>
    </section>

    <section class="panel model-note" data-region="insight" style="margin-top:12px">
      <div class="panel-head"><h2>模型说明</h2></div>
      <p id="insight" class="insight">点击"开始"让体系达到初始平衡。随后施加扰动（加压/升温/增加反应物），观察浓度曲线如何向"减弱扰动"的方向移动。</p>
      <p><strong>教学简化：</strong>正向放热（ΔH&lt;0）。升温使 K 减小、平衡逆向移动；加压使平衡向气体分子数减少的正向移动；增加反应物使平衡正向移动。分子动画为定性可视化，浓度数值由平衡常数动力学方程驱动。</p>
    </section>
  </div>

  <script>
  (() => {
    "use strict";

    // ===== 参数与状态 =====
    const parameterSchema = [
      { key: "speed", label: "演化速率", type: "slider", min: 0.5, max: 3, step: 0.1, default: 1, unit: "×" }
    ];

    // 化学体系：N2 + 3H2 ⇌ 2NH3，正向放热
    const chem = {
      R: 8.314e-3, // kJ/(mol·K)
      T0: 700,     // 初始温度 K
      K0: 0.45,    // T0 时的平衡常数（选较小值使初始 NH3 适中）
      dH: -92,     // 正向反应焓变 kJ/mol（放热）
      // 动力学速率常数（教学用，非真实值）
      kf: 1.2,     // 正向速率常数
      kr: 1.2      // 逆向速率常数基准（实际 kr = kf / K）
    };

    function K_at(T) {
      // van't Hoff：ln(K2/K1) = -dH/R * (1/T2 - 1/T1)
      return chem.K0 * Math.exp(-chem.dH / chem.R * (1 / T - 1 / chem.T0));
    }

    const state = {
      running: false,
      t: 0,
      // 浓度 mol/L
      c: { N2: 0.5, H2: 1.5, NH3: 0.0 },
      // 目标平衡浓度（由 K 和化学计量计算）
      eq: { N2: 0, H2: 0, NH3: 0 },
      // 参数
      T: chem.T0,
      V: 1.0,        // 体积倍数（加压=减小体积）
      speed: 1.0,
      // 历史
      history: [],
      lastTimestamp: null,
      // 扰动标注
      direction: "none",     // forward / reverse / none
      directionUntil: 0,    // 标注失效时间
      // 分子动画
      molecules: [],
      flashes: [],
      containerW: 760,
      containerH: 420,
      lastMolUpdate: 0
    };

    const elements = {
      status: document.querySelector("#status"),
      scene: document.querySelector("#scene"),
      chart: document.querySelector("#chart"),
      n2Readout: document.querySelector("#n2Readout"),
      h2Readout: document.querySelector("#h2Readout"),
      nh3Readout: document.querySelector("#nh3Readout"),
      kReadout: document.querySelector("#kReadout"),
      directionTag: document.querySelector("#directionTag"),
      insight: document.querySelector("#insight"),
      speedInput: document.querySelector("#speedInput"),
      speedOutput: document.querySelector("#speedOutput"),
      startBtn: document.querySelector("#startBtn"),
      pauseBtn: document.querySelector("#pauseBtn"),
      resetBtn: document.querySelector("#resetBtn"),
      pressureBtn: document.querySelector("#pressureBtn"),
      tempBtn: document.querySelector("#tempBtn"),
      reactantBtn: document.querySelector("#reactantBtn")
    };

    // ===== 工具函数 =====
    function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
    function finite(v, fb) { return Number.isFinite(v) ? v : fb; }

    // ===== 平衡计算 =====
    // 给定初始浓度 c0 和当前 K，计算平衡浓度
    // N2 + 3H2 ⇌ 2NH3，设反应进度 ξ（正向为正）
    // 平衡时：[N2]=c0.N2-ξ, [H2]=c0.H2-3ξ, [NH3]=c0.NH3+2ξ
    // K = [NH3]^2 / ([N2]·[H2]^3)
    function computeEquilibrium(c0, K) {
      // 二分法求 ξ，范围 [-c0.NH3/2, min(c0.N2, c0.H2/3)]
      const xiMin = -c0.NH3 / 2 + 1e-9;
      const xiMax = Math.min(c0.N2, c0.H2 / 3) - 1e-9;
      let lo = xiMin, hi = xiMax;
      for (let i = 0; i < 60; i++) {
        const mid = (lo + hi) / 2;
        const N2 = c0.N2 - mid;
        const H2 = c0.H2 - 3 * mid;
        const NH3 = c0.NH3 + 2 * mid;
        if (N2 <= 0 || H2 <= 0 || NH3 < 0) { hi = mid; continue; }
        const Q = (NH3 * NH3) / (N2 * H2 * H2 * H2);
        if (Q < K) lo = mid; else hi = mid;
      }
      const xi = (lo + hi) / 2;
      return {
        N2: Math.max(1e-6, c0.N2 - xi),
        H2: Math.max(1e-6, c0.H2 - 3 * xi),
        NH3: Math.max(0, c0.NH3 + 2 * xi),
        xi: xi
      };
    }

    // ===== 模型更新 =====
    function update(dt) {
      if (!state.running) return;
      const dts = clamp(finite(dt, 0), 0, 0.05) * state.speed;
      if (dts <= 0) return;

      const K = K_at(state.T);
      const kr = chem.kf / K;

      // 动力学：d[NH3]/dt = 2*(kf*[N2][H2]^3 - kr*[NH3]^2)
      // 各物质：d[N2]/dt = -(kf*[N2][H2]^3 - kr*[NH3]^2)
      //         d[H2]/dt = -3*(...)
      //         d[NH3]/dt = 2*(...)
      const fwd = chem.kf * state.c.N2 * Math.pow(state.c.H2, 3);
      const rev = kr * state.c.NH3 * state.c.NH3;
      const net = fwd - rev; // 正向净速率

      state.c.N2 = Math.max(0, state.c.N2 - net * dts);
      state.c.H2 = Math.max(0, state.c.H2 - 3 * net * dts);
      state.c.NH3 = Math.max(0, state.c.NH3 + 2 * net * dts);

      state.t += dts;

      // 记录历史
      if (state.history.length === 0 || state.t - state.history[state.history.length - 1].t >= 0.05) {
        state.history.push({
          t: state.t,
          N2: state.c.N2,
          H2: state.c.H2,
          NH3: state.c.NH3
        });
        if (state.history.length > 800) state.history.shift();
      }

      // 更新分子动画
      updateMolecules(dts);
    }

    // ===== 分子动画（定性可视化）=====
    function targetMolCount() {
      // 根据浓度按比例生成分子数（视觉简化）
      const base = 60;
      const total = state.c.N2 + state.c.H2 / 3 + state.c.NH3 / 2;
      if (total <= 0) return { N2: 0, H2: 0, NH3: 0 };
      const scale = base / total;
      return {
        N2: Math.round(state.c.N2 * scale),
        H2: Math.round(state.c.H2 * scale / 3), // 每个H2分子代表3单位
        NH3: Math.round(state.c.NH3 * scale / 2)
      };
    }

    function initMolecules() {
      state.molecules = [];
      const targets = targetMolCount();
      const types = [
        { type: "N2", count: targets.N2, color: "var(--sim-n2)", rawColor: "#3b82f6", r: 9 },
        { type: "H2", count: targets.H2, color: "var(--sim-h2)", rawColor: "#f59e0b", r: 7 },
        { type: "NH3", count: targets.NH3, color: "var(--sim-nh3)", rawColor: "#10b981", r: 10 }
      ];
      for (const grp of types) {
        for (let i = 0; i < grp.count; i++) {
          state.molecules.push({
            type: grp.type,
            color: grp.rawColor,
            r: grp.r,
            x: 60 + Math.random() * (state.containerW - 120),
            y: 60 + Math.random() * (state.containerH - 120),
            vx: (Math.random() - 0.5) * 80,
            vy: (Math.random() - 0.5) * 80,
            life: 1
          });
        }
      }
    }

    function adjustMolCount() {
      const targets = targetMolCount();
      const counts = { N2: 0, H2: 0, NH3: 0 };
      for (const m of state.molecules) counts[m.type]++;
      // 增加
      for (const type of ["N2", "H2", "NH3"]) {
        const need = targets[type] - counts[type];
        if (need > 0) {
          const ref = { N2: { c: "#3b82f6", r: 9 }, H2: { c: "#f59e0b", r: 7 }, NH3: { c: "#10b981", r: 10 } }[type];
          for (let i = 0; i < need; i++) {
            state.molecules.push({
              type, color: ref.c, r: ref.r,
              x: 60 + Math.random() * (state.containerW - 120),
              y: 60 + Math.random() * (state.containerH - 120),
              vx: (Math.random() - 0.5) * 80,
              vy: (Math.random() - 0.5) * 80,
              life: 1
            });
          }
        }
      }
      // 移除（优先移除寿命最长的）
      for (const type of ["N2", "H2", "NH3"]) {
        const extra = counts[type] - targets[type];
        if (extra > 0) {
          const oftype = state.molecules.filter(m => m.type === type);
          oftype.sort((a, b) => b.life - a.life);
          for (let i = 0; i < extra && i < oftype.length; i++) {
            const idx = state.molecules.indexOf(oftype[i]);
            if (idx >= 0) state.molecules.splice(idx, 1);
          }
        }
      }
    }

    function updateMolecules(dts) {
      const W = state.containerW, H = state.containerH;
      const margin = 40;
      // 速度受温度影响（视觉）
      const tempFactor = Math.sqrt(state.T / chem.T0);
      for (const m of state.molecules) {
        m.x += m.vx * tempFactor * dts;
        m.y += m.vy * tempFactor * dts;
        // 边界反弹
        if (m.x < margin) { m.x = margin; m.vx = Math.abs(m.vx); }
        if (m.x > W - margin) { m.x = W - margin; m.vx = -Math.abs(m.vx); }
        if (m.y < margin) { m.y = margin; m.vy = Math.abs(m.vy); }
        if (m.y > H - margin) { m.y = H - margin; m.vy = -Math.abs(m.vy); }
      }
      // 碰撞反应（简化：随机概率触发）
      const K = K_at(state.T);
      const kr = chem.kf / K;
      const reactProb = 0.8 * dts; // 每步基础反应概率
      for (let i = 0; i < state.molecules.length; i++) {
        for (let j = i + 1; j < state.molecules.length; j++) {
          const a = state.molecules[i], b = state.molecules[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const dist2 = dx * dx + dy * dy;
          const rsum = a.r + b.r;
          if (dist2 < rsum * rsum) {
            // 碰撞反弹
            const dist = Math.sqrt(dist2) || 0.01;
            const nx = dx / dist, ny = dy / dist;
            const dvx = a.vx - b.vx, dvy = a.vy - b.vy;
            const dot = dvx * nx + dvy * ny;
            if (dot < 0) {
              a.vx -= dot * nx; a.vy -= dot * ny;
              b.vx += dot * nx; b.vy += dot * ny;
            }
            // 分离
            const overlap = rsum - dist;
            a.x += nx * overlap * 0.5; a.y += ny * overlap * 0.5;
            b.x -= nx * overlap * 0.5; b.y -= ny * overlap * 0.5;

            // 反应判定
            if (Math.random() < reactProb) {
              tryReact(a, b);
            }
          }
        }
      }
      // 定期调整分子数以匹配浓度
      state.lastMolUpdate += dts;
      if (state.lastMolUpdate > 0.3) {
        state.lastMolUpdate = 0;
        adjustMolCount();
      }
      // 闪光衰减
      for (let i = state.flashes.length - 1; i >= 0; i--) {
        state.flashes[i].life -= dts * 3;
        if (state.flashes[i].life <= 0) state.flashes.splice(i, 1);
      }
    }

    function tryReact(a, b) {
      // 正向：1 N2 + 1 H2(代表3) -> 需要凑齐化学计量，简化为 N2+H2 触发，消耗额外H2
      // 逆向：2 NH3 -> N2 + 3H2
      const K = K_at(state.T);
      const kr = chem.kf / K;
      const fwdRate = chem.kf * state.c.N2 * Math.pow(state.c.H2, 3);
      const revRate = kr * state.c.NH3 * state.c.NH3;
      const total = fwdRate + revRate;
      if (total <= 0) return;
      const pFwd = fwdRate / total;

      if (a.type === "N2" && b.type === "H2" && Math.random() < pFwd) {
        // 正向反应：N2 + H2 -> (视觉) NH3，消耗额外的H2分子
        const extraH2 = state.molecules.find(m => m !== b && m.type === "H2");
        if (extraH2) {
          // 移除 a(N2), b(H2), extraH2(H2)，生成 2 NH3
          removeMolecule(a); removeMolecule(b); removeMolecule(extraH2);
          spawnMolecule("NH3", (a.x + b.x) / 2, (a.y + b.y) / 2);
          spawnMolecule("NH3", (a.x + b.x) / 2, (a.y + b.y) / 2);
          addFlash((a.x + b.x) / 2, (a.y + b.y) / 2, "#10b981");
        }
      } else if (a.type === "NH3" && b.type === "NH3" && Math.random() > pFwd) {
        // 逆向反应：2 NH3 -> N2 + 3H2
        removeMolecule(a); removeMolecule(b);
        spawnMolecule("N2", a.x, a.y);
        for (let i = 0; i < 3; i++) {
          spawnMolecule("H2", b.x + (Math.random() - 0.5) * 20, b.y + (Math.random() - 0.5) * 20);
        }
        addFlash((a.x + b.x) / 2, (a.y + b.y) / 2, "#ef4444");
      }
    }

    function removeMolecule(m) {
      const idx = state.molecules.indexOf(m);
      if (idx >= 0) state.molecules.splice(idx, 1);
    }

    function spawnMolecule(type, x, y) {
      const ref = { N2: { c: "#3b82f6", r: 9 }, H2: { c: "#f59e0b", r: 7 }, NH3: { c: "#10b981", r: 10 } }[type];
      state.molecules.push({
        type, color: ref.c, r: ref.r,
        x: clamp(x, 40, state.containerW - 40),
        y: clamp(y, 40, state.containerH - 40),
        vx: (Math.random() - 0.5) * 100,
        vy: (Math.random() - 0.5) * 100,
        life: 0
      });
    }

    function addFlash(x, y, color) {
      state.flashes.push({ x, y, life: 1, color });
    }

    // ===== 渲染 =====
    function render() {
      renderScene();
      renderChart();
      renderReadouts();
    }

    function renderScene() {
      const svg = elements.scene;
      let html = "";
      // 容器边框
      html += `<rect x="30" y="30" width="${state.containerW - 60}" height="${state.containerH - 60}" fill="none" stroke="#94a3b8" stroke-width="2" rx="8"/>`;
      // 温度指示
      html += `<text x="40" y="22" font-size="12" fill="#657188">T = ${state.T.toFixed(0)} K</text>`;
      html += `<text x="${state.containerW - 40}" y="22" font-size="12" fill="#657188" text-anchor="end">V = ${state.V.toFixed(2)} L</text>`;
      // 分子
      for (const m of state.molecules) {
        html += `<circle cx="${m.x.toFixed(1)}" cy="${m.y.toFixed(1)}" r="${m.r}" fill="${m.color}" opacity="0.88" stroke="#fff" stroke-width="1.5"/>`;
      }
      // 闪光
      for (const f of state.flashes) {
        const r = 12 + (1 - f.life) * 18;
        html += `<circle cx="${f.x.toFixed(1)}" cy="${f.y.toFixed(1)}" r="${r.toFixed(1)}" fill="${f.color}" opacity="${(f.life * 0.5).toFixed(2)}"/>`;
      }
      svg.innerHTML = html;
    }

    function renderChart() {
      const canvas = elements.chart;
      const ctx = canvas.getContext("2d");
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
      }
      ctx.save();
      ctx.scale(dpr, dpr);
      const W = rect.width, H = rect.height;
      ctx.clearRect(0, 0, W, H);

      const padL = 38, padR = 12, padT = 12, padB = 24;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      // 找最大浓度
      let maxC = 0.5;
      for (const h of state.history) {
        maxC = Math.max(maxC, h.N2, h.H2, h.NH3);
      }
      maxC = Math.ceil(maxC * 1.1 * 2) / 2;

      // 时间窗口
      const tWindow = Math.max(15, state.t);
      const tStart = Math.max(0, state.t - tWindow);

      // 网格
      ctx.strokeStyle = "#e8edf4";
      ctx.lineWidth = 1;
      ctx.font = "10px sans-serif";
      ctx.fillStyle = "#657188";
      for (let i = 0; i <= 4; i++) {
        const y = padT + (i / 4) * plotH;
        ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
        const val = (maxC * (4 - i) / 4).toFixed(1);
        ctx.fillText(val, 4, y + 3);
      }
      for (let i = 0; i <= 4; i++) {
        const x = padL + (i / 4) * plotW;
        ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + plotH); ctx.stroke();
        const tval = (tStart + (i / 4) * tWindow).toFixed(0);
        ctx.fillText(tval, x - 8, H - 8);
      }

      // 轴标签
      ctx.fillText("mol/L", 2, padT + 8);
      ctx.fillText("t/s", W - 24, H - 4);

      // 绘制曲线
      const colors = { N2: "#3b82f6", H2: "#f59e0b", NH3: "#10b981" };
      for (const type of ["N2", "H2", "NH3"]) {
        ctx.strokeStyle = colors[type];
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        let started = false;
        for (const h of state.history) {
          if (h.t < tStart) continue;
          const x = padL + ((h.t - tStart) / tWindow) * plotW;
          const y = padT + (1 - h[type] / maxC) * plotH;
          if (!started) { ctx.moveTo(x, y); started = true; }
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      // 当前点
      const cx = padL + ((state.t - tStart) / tWindow) * plotW;
      for (const type of ["N2", "H2", "NH3"]) {
        const cy = padT + (1 - state.c[type] / maxC) * plotH;
        ctx.fillStyle = colors[type];
        ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, Math.PI * 2); ctx.fill();
      }

      // 方向高亮标注
      if (state.direction !== "none" && state.t < state.directionUntil) {
        const color = state.direction === "forward" ? "#10b981" : "#ef4444";
        const label = state.direction === "forward" ? "正向移动 →" : "← 逆向移动";
        ctx.fillStyle = color;
        ctx.font = "bold 12px sans-serif";
        ctx.fillText(label, padL + 4, padT + 14);
      }

      ctx.restore();
    }

    function renderReadouts() {
      elements.n2Readout.textContent = state.c.N2.toFixed(2);
      elements.h2Readout.textContent = state.c.H2.toFixed(2);
      elements.nh3Readout.textContent = state.c.NH3.toFixed(2);
      elements.kReadout.textContent = K_at(state.T).toFixed(2);

      // 方向标注
      if (state.direction !== "none" && state.t < state.directionUntil) {
        elements.directionTag.className = `direction-tag ${state.direction}`;
        elements.directionTag.textContent = state.direction === "forward" ? "正向 →" : "← 逆向";
      } else {
        elements.directionTag.className = "direction-tag none";
        elements.directionTag.textContent = "平衡";
      }

      // 状态
      if (state.running) {
        const K = K_at(state.T);
        const Q = (state.c.NH3 * state.c.NH3) / Math.max(1e-9, state.c.N2 * Math.pow(state.c.H2, 3));
        const ratio = Q / K;
        if (Math.abs(ratio - 1) < 0.03) {
          elements.status.textContent = "平衡";
          elements.status.className = "status";
        } else {
          elements.status.textContent = "移动中";
          elements.status.className = "status moving";
        }
      }

      // 洞察文本
      const K = K_at(state.T);
      const Q = (state.c.NH3 * state.c.NH3) / Math.max(1e-9, state.c.N2 * Math.pow(state.c.H2, 3));
      const ratio = Q / K;
      if (!state.running && state.t === 0) {
        elements.insight.textContent = "点击\"开始\"让体系达到初始平衡。随后施加扰动，观察平衡如何向减弱扰动的方向移动。";
      } else if (Math.abs(ratio - 1) < 0.03) {
        elements.insight.textContent = "体系处于平衡态：Q ≈ K。施加扰动后平衡将移动。";
      } else if (ratio < 1) {
        elements.insight.textContent = "Q < K：反应物浓度偏高，平衡正向移动生成更多 NH₃。";
      } else {
        elements.insight.textContent = "Q > K：生成物浓度偏高，平衡逆向移动生成更多 N₂ 和 H₂。";
      }

      elements.speedOutput.textContent = `${state.speed.toFixed(1)}×`;
    }

    // ===== 生命周期 =====
    function init() {
      bindControls();
      computeInitialEquilibrium();
      initMolecules();
      setParameters({ speed: 1 });
      reset();
      requestAnimationFrame(frame);
    }

    function computeInitialEquilibrium() {
      // 初始浓度：N2=0.5, H2=1.5, NH3=0，计算平衡
      const K = K_at(state.T);
      const eq = computeEquilibrium({ N2: 0.5, H2: 1.5, NH3: 0 }, K);
      state.eq = eq;
    }

    function start() {
      state.running = true;
      elements.status.textContent = "移动中";
      elements.status.className = "status moving";
      elements.startBtn.setAttribute("aria-pressed", "true");
    }

    function pause() {
      state.running = false;
      elements.status.textContent = "已暂停";
      elements.status.className = "status";
      elements.startBtn.setAttribute("aria-pressed", "false");
    }

    function reset() {
      pause();
      state.t = 0;
      state.T = chem.T0;
      state.V = 1.0;
      state.c = { N2: 0.5, H2: 1.5, NH3: 0.0 };
      state.history = [{ t: 0, N2: 0.5, H2: 1.5, NH3: 0 }];
      state.direction = "none";
      state.directionUntil = 0;
      state.flashes = [];
      computeInitialEquilibrium();
      initMolecules();
      render();
    }

    function setParameters(values) {
      const def = parameterSchema[0];
      state.speed = clamp(finite(Number(values.speed), def.default), def.min, def.max);
      elements.speedInput.value = String(state.speed);
      render();
    }

    // ===== 扰动操作 =====
    function disturbPressure() {
      // 加压：体积减半，浓度翻倍
      state.V *= 0.5;
      state.c.N2 *= 2;
      state.c.H2 *= 2;
      state.c.NH3 *= 2;
      // 加压使平衡正向移动（气体分子数减少）
      state.direction = "forward";
      state.directionUntil = state.t + 8;
      if (!state.running) start();
    }

    function disturbTemp() {
      // 升温 100K
      state.T += 100;
      // 正向放热，升温使 K 减小，平衡逆向移动
      state.direction = "reverse";
      state.directionUntil = state.t + 8;
      if (!state.running) start();
    }

    function disturbReactant() {
      // 增加 N2 浓度 0.3
      state.c.N2 += 0.3;
      // 增加反应物使平衡正向移动
      state.direction = "forward";
      state.directionUntil = state.t + 8;
      if (!state.running) start();
    }

    // ===== 模型检查 =====
    function runModelChecks() {
      // 1. 初始平衡检查
      const K1 = K_at(700);
      const eq1 = computeEquilibrium({ N2: 0.5, H2: 1.5, NH3: 0 }, K1);
      const Q1 = (eq1.NH3 * eq1.NH3) / (eq1.N2 * eq1.N2 * eq1.N2 * eq1.N2); // 修正
      const Q1b = (eq1.NH3 ** 2) / (eq1.N1 || eq1.N2) ; // 占位

      // 正确的 Q 计算
      const Q1c = (eq1.NH3 * eq1.NH3) / (eq1.N2 * Math.pow(eq1.H2, 3));

      // 2. 升温逆向（K 减小）
      const K2 = K_at(800);
      const kDecreases = K2 < K1;

      // 3. 降温正向（K 增大）
      const K3 = K_at(600);
      const kIncreases = K3 > K1;

      // 4. 加压后平衡正向移动
      // 加压（浓度翻倍）后新平衡与刚加压时的比较
      const eqPressured = computeEquilibrium({ N2: 1.0, H2: 3.0, NH3: 0.0 }, K1);
      // 初始平衡 eq1，加压后浓度翻倍为 {N2:2*eq1.N2, H2:2*eq1.H2, NH3:2*eq1.NH3}
      const doubled = { N2: 2 * eq1.N2, H2: 2 * eq1.H2, NH3: 2 * eq1.NH3 };
      const eqAfterPressure = computeEquilibrium(doubled, K1);
      // 正向移动意味着 NH3 比例增加
      const nh3RatioBefore = eq1.NH3 / (eq1.N2 + eq1.H2 + eq1.NH3);
      const nh3RatioAfter = eqAfterPressure.NH3 / (eqAfterPressure.N2 + eqAfterPressure.H2 + eqAfterPressure.NH3);
      const pressureForward = nh3RatioAfter > nh3RatioBefore;

      // 5. 增加反应物正向移动
      const eqAdded = computeEquilibrium({ N2: 0.8, H2: 1.5, NH3: 0 }, K1);
      const reactantForward = eqAdded.NH3 > eq1.NH3;

      // 6. 动力学收敛到平衡
      let c = { N2: 0.5, H2: 1.5, NH3: 0 };
      const kf = chem.kf, kr = chem.kf / K1;
      for (let i = 0; i < 50000; i++) {
        const fwd = kf * c.N2 * c.H2 ** 3;
        const rev = kr * c.NH3 * c.NH3;
        const net = fwd - rev;
        c.N2 = Math.max(0, c.N2 - net * 0.01);
        c.H2 = Math.max(0, c.H2 - 3 * net * 0.01);
        c.NH3 = Math.max(0, c.NH3 + 2 * net * 0.01);
      }
      const convergeError = Math.abs(c.NH3 - eq1.NH3);

      return [
        { name: "初始平衡 Q≈K", pass: Math.abs(Q1c - K1) / K1 < 0.01, expected: K1, actual: Q1c, tolerance: "1%" },
        { name: "升温 K 减小（逆向）", pass: kDecreases, expected: "K(800) < K(700)", actual: `${K2.toFixed(3)} < ${K1.toFixed(3)}`, tolerance: "strict" },
        { name: "降温 K 增大（正向）", pass: kIncreases, expected: "K(600) > K(700)", actual: `${K3.toFixed(3)} > ${K1.toFixed(3)}`, tolerance: "strict" },
        { name: "加压平衡正向移动", pass: pressureForward, expected: "NH3 比例升高", actual: `${nh3RatioAfter.toFixed(3)} > ${nh3RatioBefore.toFixed(3)}`, tolerance: "strict" },
        { name: "增加反应物正向移动", pass: reactantForward, expected: "NH3 增多", actual: `${eqAdded.NH3.toFixed(3)} > ${eq1.NH3.toFixed(3)}`, tolerance: "strict" },
        { name: "动力学收敛到平衡", pass: convergeError < 0.01, expected: eq1.NH3, actual: c.NH3, tolerance: 0.01 }
      ];
    }

    // ===== 绑定 =====
    function bindControls() {
      elements.startBtn.addEventListener("click", start);
      elements.pauseBtn.addEventListener("click", pause);
      elements.resetBtn.addEventListener("click", reset);
      elements.pressureBtn.addEventListener("click", disturbPressure);
      elements.tempBtn.addEventListener("click", disturbTemp);
      elements.reactantBtn.addEventListener("click", disturbReactant);
      elements.speedInput.addEventListener("input", () => setParameters({ speed: elements.speedInput.value }));
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
    init();
  })();
  </script>
</body>
</html>
