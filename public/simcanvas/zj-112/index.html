<!doctype html>
<html lang="zh-CN">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>温室效应演示</title>
<style>
:root {
  color-scheme: light;
  --sim-bg: #eef3f8;
  --sim-surface: #ffffff;
  --sim-surface-soft: #f8fafc;
  --sim-text: #172033;
  --sim-muted: #657188;
  --sim-border: #dfe6ef;
  --sim-grid: #e8edf4;
  --sim-accent: #0f9fba;
  --sim-accent-deep: #08758a;
  --sim-accent-soft: #d9f4f7;
  --sim-positive: #0f9fba;
  --sim-warning: #f59e0b;
  --sim-danger: #dc2626;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
  --sim-solar: #f59e0b;
  --sim-solar-soft: #fef3c7;
  --sim-ir: #dc2626;
  --sim-ir-soft: #fee2e2;
  --sim-trapped: #b91c1c;
  --sim-escape: #fca5a5;
  --sim-ground: #78350f;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--sim-text);
  background:
    radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
    radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
    var(--sim-bg);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
.app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
.header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
.header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
.header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
.status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 12px; }
.panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
.scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.panel-head h2 { margin: 0; font-size: 1rem; }
.panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
#scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; }
.side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
.readouts, .model-note { padding: 17px; }
.readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.metric { padding: 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
.metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
.metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.model-note { display: grid; align-content: start; gap: 14px; }
.model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
.insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; }
.controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr) minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
.actions { display: flex; gap: 8px; }
button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
button:hover { border-color: #c7d2e2; background: #eef3f9; }
button:active { transform: scale(.97); }
button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
.control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
.control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
@media (max-width: 860px) {
  .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
  .main, .app[data-layout] .main { grid-template-columns: 1fr; }
  .controls { grid-template-columns: 1fr; }
  .scene-panel { min-height: 0; }
  #scene { min-height: 0; height: auto; aspect-ratio: 760 / 460; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="qualitative">
  <header class="header" data-region="header">
    <div>
      <h1>温室效应演示</h1>
      <p>太阳短波辐射穿过大气层，地表以红外长波再辐射；CO₂ 越多，截留越多，地表越暖。</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head"><h2 id="scene-title">辐射过程</h2><span>黄＝太阳短波 · 红＝地表红外 · 橙红＝截留再辐射</span></div>
      <svg id="scene" viewBox="0 0 760 460" role="img" aria-labelledby="scene-title scene-desc">
        <desc id="scene-desc">太阳短波辐射向下穿过大气层到达地表，地表向上发射红外长波辐射，部分被 CO₂ 分子截留并再辐射回地面，部分逃逸到太空。</desc>
        <defs>
          <linearGradient id="skyGrad" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#dbeafe"/>
            <stop offset="55%" stop-color="#e0f2fe"/>
            <stop offset="100%" stop-color="#fef9c3"/>
          </linearGradient>
          <linearGradient id="groundGrad" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#a16207"/>
            <stop offset="100%" stop-color="#451a03"/>
          </linearGradient>
          <radialGradient id="sunGlow">
            <stop offset="0%" stop-color="#fef3c7"/>
            <stop offset="45%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#f59e0b"/>
          </radialGradient>
          <radialGradient id="co2Halo">
            <stop offset="0%" stop-color="rgba(37,99,235,0.22)"/>
            <stop offset="100%" stop-color="rgba(37,99,235,0)"/>
          </radialGradient>
        </defs>

        <rect x="0" y="0" width="760" height="460" fill="url(#skyGrad)"/>
        <rect x="0" y="0" width="760" height="24" fill="#1e3a8a" opacity="0.55"/>
        <text x="380" y="17" text-anchor="middle" fill="#dbeafe" font-size="11" font-weight="700">太 空</text>

        <g id="atmosphereBand"></g>
        <g id="co2Layer"></g>

        <circle cx="680" cy="52" r="30" fill="url(#sunGlow)"/>
        <g id="sunRays" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.5"></g>
        <text x="680" y="100" text-anchor="middle" fill="#92400e" font-size="12" font-weight="700">太阳</text>

        <g id="solarParticles"></g>

        <line x1="0" y1="290" x2="760" y2="290" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
        <text x="752" y="285" text-anchor="end" fill="#64748b" font-size="10">大气层底</text>

        <rect x="0" y="380" width="760" height="80" fill="url(#groundGrad)"/>
        <path d="M0,380 Q60,372 120,380 T240,380 T360,378 T480,380 T600,382 T720,380 T760,380 L760,460 L0,460 Z" fill="#3f1d0a" opacity="0.4"/>
        <text x="380" y="425" text-anchor="middle" fill="#fef3c7" font-size="13" font-weight="700">地 表</text>

        <g id="irParticles"></g>
        <g id="reemitParticles"></g>
        <g id="escapeParticles"></g>

        <g id="energyArrows" transform="translate(16, 380)">
          <text x="0" y="-8" fill="#475569" font-size="10" font-weight="700">能量收支</text>
          <line id="absArrow" x1="0" y1="0" x2="0" y2="0" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
          <text id="absLabel" x="0" y="0" fill="#92400e" font-size="10" font-weight="700">吸收</text>
          <line id="escapeArrow" x1="0" y1="0" x2="0" y2="0" stroke="#fca5a5" stroke-width="6" stroke-linecap="round"/>
          <text id="escapeLabel" x="0" y="0" fill="#991b1b" font-size="10" font-weight="700">逃逸</text>
          <line id="trapArrow" x1="0" y1="0" x2="0" y2="0" stroke="#b91c1c" stroke-width="6" stroke-linecap="round"/>
          <text id="trapLabel" x="0" y="0" fill="#7f1d1d" font-size="10" font-weight="700">截留</text>
        </g>
      </svg>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel readouts" aria-label="实时读数">
        <div class="readout-grid">
          <div class="metric"><small>地表温度</small><strong id="tempReadout">15.0 °C</strong></div>
          <div class="metric"><small>CO₂ 浓度</small><strong id="co2Readout">280 ppm</strong></div>
          <div class="metric"><small>红外截留率</small><strong id="trapReadout">12%</strong></div>
          <div class="metric"><small>逃逸到太空</small><strong id="escapeReadout">88%</strong></div>
        </div>
      </section>
      <section class="panel model-note" data-region="insight">
        <div class="panel-head"><h2>观察要点</h2></div>
        <p id="insight" class="insight">按"开始"运行。拖动 CO₂ 浓度滑块，观察红外被截留的比例如何变化。</p>
        <p>教学模型：CO₂ 浓度越高 → 红外拦截概率越大 → 截留再辐射回地面的能量越多 → 逃逸到太空的能量越少 → 地表温度上升。时间已加速以便课堂观察。</p>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="模拟控件">
    <div class="actions">
      <button id="startBtn" class="primary" type="button">开始</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control">
      <label for="co2Input">CO₂ 浓度 <output id="co2Output">280 ppm</output></label>
      <input id="co2Input" type="range" min="280" max="800" step="10" value="280">
    </div>
    <div class="control">
      <label for="speedInput">时间倍率 <output id="speedOutput">3.0×</output></label>
      <input id="speedInput" type="range" min="1" max="6" step="0.5" value="3">
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const parameterSchema = [
    { key: "co2", label: "CO₂ 浓度", type: "slider", min: 280, max: 800, step: 10, default: 280, unit: "ppm" },
    { key: "speed", label: "时间倍率", type: "slider", min: 1, max: 6, step: 0.5, default: 3, unit: "×" }
  ];

  const state = {
    running: false,
    t: 0,
    temperature: 15.0,
    co2: 280,
    speed: 3,
    lastTimestamp: null,
    particles: { solar: [], ir: [], reemit: [], escape: [] },
    co2Molecules: [],
    nextSolarEmit: 0,
    nextIrEmit: 0,
    reducedMotion: false
  };

  const elements = {
    status: document.querySelector("#status"),
    co2Layer: document.querySelector("#co2Layer"),
    atmosphereBand: document.querySelector("#atmosphereBand"),
    sunRays: document.querySelector("#sunRays"),
    solarParticles: document.querySelector("#solarParticles"),
    irParticles: document.querySelector("#irParticles"),
    reemitParticles: document.querySelector("#reemitParticles"),
    escapeParticles: document.querySelector("#escapeParticles"),
    energyArrows: document.querySelector("#energyArrows"),
    absArrow: document.querySelector("#absArrow"),
    absLabel: document.querySelector("#absLabel"),
    escapeArrow: document.querySelector("#escapeArrow"),
    escapeLabel: document.querySelector("#escapeLabel"),
    trapArrow: document.querySelector("#trapArrow"),
    trapLabel: document.querySelector("#trapLabel"),
    tempReadout: document.querySelector("#tempReadout"),
    co2Readout: document.querySelector("#co2Readout"),
    trapReadout: document.querySelector("#trapReadout"),
    escapeReadout: document.querySelector("#escapeReadout"),
    insight: document.querySelector("#insight"),
    co2Input: document.querySelector("#co2Input"),
    co2Output: document.querySelector("#co2Output"),
    speedInput: document.querySelector("#speedInput"),
    speedOutput: document.querySelector("#speedOutput"),
    startBtn: document.querySelector("#startBtn"),
    pauseBtn: document.querySelector("#pauseBtn"),
    resetBtn: document.querySelector("#resetBtn")
  };

  const SCENE = { W: 760, H: 460, sunY: 52, groundY: 380, atmTop: 90, atmBottom: 290 };

  function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
  function finite(v, fb) { return Number.isFinite(v) ? v : fb; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function co2ToMolecules(co2) {
    const t = (co2 - 280) / (800 - 280);
    return Math.round(lerp(5, 20, clamp(t, 0, 1)));
  }
  function co2ToTrapRate(co2) {
    const t = (co2 - 280) / (800 - 280);
    return lerp(0.12, 0.78, clamp(t, 0, 1));
  }
  function trapRateToTemp(tr) {
    return 15.0 + (tr - 0.12) / (0.78 - 0.12) * 8.0;
  }

  function initCo2Molecules() {
    state.co2Molecules = [];
    const count = co2ToMolecules(state.co2);
    for (let i = 0; i < count; i++) {
      const x = 60 + (i + 0.5) * (640 / count) + (Math.random() - 0.5) * 20;
      const y = SCENE.atmTop + 20 + Math.random() * (SCENE.atmBottom - SCENE.atmTop - 40);
      state.co2Molecules.push({ x, y, phase: Math.random() * Math.PI * 2 });
    }
    renderCo2Layer();
  }

  function renderCo2Layer() {
    const ns = "http://www.w3.org/2000/svg";
    elements.co2Layer.innerHTML = "";
    state.co2Molecules.forEach((m) => {
      const g = document.createElementNS(ns, "g");
      g.setAttribute("transform", `translate(${m.x},${m.y})`);

      const halo = document.createElementNS(ns, "circle");
      halo.setAttribute("r", "14");
      halo.setAttribute("fill", "url(#co2Halo)");
      g.appendChild(halo);

      const c1 = document.createElementNS(ns, "circle");
      c1.setAttribute("cx", "-7"); c1.setAttribute("cy", "0"); c1.setAttribute("r", "5");
      c1.setAttribute("fill", "#1e40af"); c1.setAttribute("stroke", "#1e3a8a"); c1.setAttribute("stroke-width", "1");
      g.appendChild(c1);

      const c2 = document.createElementNS(ns, "circle");
      c2.setAttribute("cx", "7"); c2.setAttribute("cy", "0"); c2.setAttribute("r", "5");
      c2.setAttribute("fill", "#1e40af"); c2.setAttribute("stroke", "#1e3a8a"); c2.setAttribute("stroke-width", "1");
      g.appendChild(c2);

      const bond = document.createElementNS(ns, "line");
      bond.setAttribute("x1", "-7"); bond.setAttribute("y1", "0");
      bond.setAttribute("x2", "7"); bond.setAttribute("y2", "0");
      bond.setAttribute("stroke", "#1e3a8a"); bond.setAttribute("stroke-width", "2.5");
      g.appendChild(bond);

      const lbl = document.createElementNS(ns, "text");
      lbl.setAttribute("y", "-12"); lbl.setAttribute("text-anchor", "middle");
      lbl.setAttribute("fill", "#1e3a8a"); lbl.setAttribute("font-size", "9"); lbl.setAttribute("font-weight", "700");
      lbl.textContent = "CO₂";
      g.appendChild(lbl);

      elements.co2Layer.appendChild(g);
    });
  }

  function renderAtmosphereBand() {
    const ns = "http://www.w3.org/2000/svg";
    elements.atmosphereBand.innerHTML = "";
    const rect = document.createElementNS(ns, "rect");
    rect.setAttribute("x", "0"); rect.setAttribute("y", String(SCENE.atmTop));
    rect.setAttribute("width", "760"); rect.setAttribute("height", String(SCENE.atmBottom - SCENE.atmTop));
    rect.setAttribute("fill", "rgba(125,211,252,0.12)");
    rect.setAttribute("stroke", "rgba(125,211,252,0.3)");
    rect.setAttribute("stroke-width", "1");
    rect.setAttribute("stroke-dasharray", "3 3");
    elements.atmosphereBand.appendChild(rect);

    const lbl = document.createElementNS(ns, "text");
    lbl.setAttribute("x", "8"); lbl.setAttribute("y", String(SCENE.atmTop + 14));
    lbl.setAttribute("fill", "#0369a1"); lbl.setAttribute("font-size", "10"); lbl.setAttribute("font-weight", "700");
    lbl.textContent = "大气层（含 CO₂）";
    elements.atmosphereBand.appendChild(lbl);
  }

  function renderSunRays() {
    const ns = "http://www.w3.org/2000/svg";
    elements.sunRays.innerHTML = "";
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const x1 = 680 + Math.cos(angle) * 34;
      const y1 = 52 + Math.sin(angle) * 34;
      const x2 = 680 + Math.cos(angle) * 44;
      const y2 = 52 + Math.sin(angle) * 44;
      const line = document.createElementNS(ns, "line");
      line.setAttribute("x1", String(x1)); line.setAttribute("y1", String(y1));
      line.setAttribute("x2", String(x2)); line.setAttribute("y2", String(y2));
      elements.sunRays.appendChild(line);
    }
  }

  function emitSolarParticle() {
    const x = 100 + Math.random() * 560;
    state.particles.solar.push({
      x, y: SCENE.sunY + 30,
      vx: 0, vy: 180,
      life: 0, maxLife: 2.0,
      captured: false
    });
  }

  function emitIrParticle() {
    const x = 80 + Math.random() * 600;
    state.particles.ir.push({
      x, y: SCENE.groundY - 2,
      vx: 0, vy: -140,
      life: 0, maxLife: 2.5,
      captured: false
    });
  }

  function checkCapture(p) {
    if (p.captured) return false;
    for (const m of state.co2Molecules) {
      const dx = p.x - m.x;
      const dy = p.y - m.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 18 * 18) return true;
    }
    return false;
  }

  function reemitFromCapture(p) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 110;
    const upBias = Math.random() < 0.5 ? -1 : 1;
    const vy = Math.abs(Math.sin(angle) * speed) * upBias;
    const vx = Math.cos(angle) * speed * 0.6;
    if (vy < 0) {
      state.particles.reemit.push({
        x: p.x, y: p.y, vx, vy,
        life: 0, maxLife: 2.5
      });
    } else {
      state.particles.escape.push({
        x: p.x, y: p.y, vx: vx * 0.3, vy: -Math.abs(vy) - 30,
        life: 0, maxLife: 2.5
      });
    }
  }

  function updateParticles(dt) {
    const trapRate = co2ToTrapRate(state.co2);

    state.nextSolarEmit -= dt;
    while (state.nextSolarEmit <= 0) {
      emitSolarParticle();
      state.nextSolarEmit += 0.35;
    }

    state.nextIrEmit -= dt;
    while (state.nextIrEmit <= 0) {
      emitIrParticle();
      state.nextIrEmit += 0.3;
    }

    state.particles.solar = state.particles.solar.filter(p => {
      p.x += p.vx * dt; p.y += p.vy * dt; p.life += dt;
      return p.life < p.maxLife && p.y < SCENE.groundY;
    });

    state.particles.ir = state.particles.ir.filter(p => {
      p.x += p.vx * dt; p.y += p.vy * dt; p.life += dt;
      if (!p.captured && p.y < SCENE.atmBottom && p.y > SCENE.atmTop) {
        if (Math.random() < trapRate * dt * 3.5 || checkCapture(p)) {
          p.captured = true;
          reemitFromCapture(p);
          return false;
        }
      }
      if (p.y < 0) {
        state.particles.escape.push({ x: p.x, y: 0, vx: 0, vy: -50, life: 0, maxLife: 0.5 });
        return false;
      }
      return p.life < p.maxLife;
    });

    state.particles.reemit = state.particles.reemit.filter(p => {
      p.x += p.vx * dt; p.y += p.vy * dt; p.life += dt;
      return p.life < p.maxLife && p.y < SCENE.groundY && p.y > 0;
    });

    state.particles.escape = state.particles.escape.filter(p => {
      p.x += p.vx * dt; p.y += p.vy * dt; p.life += dt;
      return p.life < p.maxLife && p.y > -20;
    });

    while (state.particles.solar.length > 40) state.particles.solar.shift();
    while (state.particles.ir.length > 40) state.particles.ir.shift();
    while (state.particles.reemit.length > 40) state.particles.reemit.shift();
    while (state.particles.escape.length > 40) state.particles.escape.shift();
  }

  function updateTemperature(dt) {
    const trapRate = co2ToTrapRate(state.co2);
    const targetTemp = trapRateToTemp(trapRate);
    const rate = 0.15;
    state.temperature += rate * (targetTemp - state.temperature) * dt * 10;
    state.temperature = finite(state.temperature, 15.0);
  }

  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05);
    const simDt = boundedDt * state.speed;
    state.t += simDt;
    updateParticles(simDt);
    updateTemperature(boundedDt);
  }

  function particleSvg(p, color, r) {
    return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}" fill="${color}" opacity="${Math.max(0, 1 - p.life / p.maxLife).toFixed(2)}"/>`;
  }

  function renderParticles() {
    if (state.reducedMotion) {
      elements.solarParticles.innerHTML = "";
      elements.irParticles.innerHTML = "";
      elements.reemitParticles.innerHTML = "";
      elements.escapeParticles.innerHTML = "";
      return;
    }
    const solar = state.particles.solar.map(p => particleSvg(p, "#f59e0b", 3.5)).join("");
    const ir = state.particles.ir.map(p => particleSvg(p, "#dc2626", 3.5)).join("");
    const reemit = state.particles.reemit.map(p => particleSvg(p, "#b91c1c", 3)).join("");
    const escape = state.particles.escape.map(p => particleSvg(p, "#fca5a5", 3)).join("");
    elements.solarParticles.innerHTML = solar;
    elements.irParticles.innerHTML = ir;
    elements.reemitParticles.innerHTML = reemit;
    elements.escapeParticles.innerHTML = escape;
  }

  function renderEnergyArrows() {
    const trapRate = co2ToTrapRate(state.co2);
    const escapeRate = 1 - trapRate;
    const absorbRate = 1.0;

    const baseX = 20;
    const baseY = 360;
    const maxLen = 40;
    const maxW = 14;

    const absW = clamp(absorbRate * maxW, 3, maxW);
    const absLen = maxLen;
    elements.absArrow.setAttribute("x1", String(baseX));
    elements.absArrow.setAttribute("y1", String(baseY));
    elements.absArrow.setAttribute("x2", String(baseX));
    elements.absArrow.setAttribute("y2", String(baseY - absLen));
    elements.absArrow.setAttribute("stroke-width", String(absW));
    elements.absLabel.setAttribute("x", String(baseX + absW / 2 + 4));
    elements.absLabel.setAttribute("y", String(baseY - absLen / 2));
    elements.absLabel.textContent = `吸收 ${Math.round(absorbRate * 100)}%`;

    const escW = clamp(escapeRate * maxW, 2, maxW);
    const escLen = maxLen * 0.9;
    const escX = baseX + 70;
    elements.escapeArrow.setAttribute("x1", String(escX));
    elements.escapeArrow.setAttribute("y1", String(baseY));
    elements.escapeArrow.setAttribute("x2", String(escX));
    elements.escapeArrow.setAttribute("y2", String(baseY - escLen));
    elements.escapeArrow.setAttribute("stroke-width", String(escW));
    elements.escapeLabel.setAttribute("x", String(escX + escW / 2 + 4));
    elements.escapeLabel.setAttribute("y", String(baseY - escLen / 2));
    elements.escapeLabel.textContent = `逃逸 ${Math.round(escapeRate * 100)}%`;

    const trapW = clamp(trapRate * maxW, 2, maxW);
    const trapLen = maxLen * 0.85;
    const trapX = baseX + 150;
    elements.trapArrow.setAttribute("x1", String(trapX));
    elements.trapArrow.setAttribute("y1", String(baseY));
    elements.trapArrow.setAttribute("x2", String(trapX));
    elements.trapArrow.setAttribute("y2", String(baseY - trapLen));
    elements.trapArrow.setAttribute("stroke-width", String(trapW));
    elements.trapLabel.setAttribute("x", String(trapX + trapW / 2 + 4));
    elements.trapLabel.setAttribute("y", String(baseY - trapLen / 2));
    elements.trapLabel.textContent = `截留 ${Math.round(trapRate * 100)}%`;
  }

  function renderInsight() {
    const trapRate = co2ToTrapRate(state.co2);
    const co2 = state.co2;
    if (!state.running && state.t === 0) {
      elements.insight.textContent = "按"开始"运行。拖动 CO₂ 浓度滑块，观察红外被截留的比例如何变化。";
    } else if (co2 <= 320) {
      elements.insight.textContent = "低 CO₂ 浓度：大部分红外逃逸到太空，地表温度接近基准值。";
    } else if (co2 <= 500) {
      elements.insight.textContent = "CO₂ 升高：更多红外被截留并再辐射回地面，逃逸减少，温度上升。";
    } else if (co2 <= 680) {
      elements.insight.textContent = "高 CO₂ 浓度：截留比例显著增大，能量在地面与大气间反复传递。";
    } else {
      elements.insight.textContent = "极高 CO₂：大部分红外被反复截留，逃逸到太空的能量很少，温度明显升高。";
    }
  }

  function render() {
    renderParticles();
    renderEnergyArrows();
    renderInsight();
    elements.tempReadout.textContent = `${state.temperature.toFixed(1)} °C`;
    elements.co2Readout.textContent = `${state.co2} ppm`;
    const trapRate = co2ToTrapRate(state.co2);
    elements.trapReadout.textContent = `${Math.round(trapRate * 100)}%`;
    elements.escapeReadout.textContent = `${Math.round((1 - trapRate) * 100)}%`;
    elements.co2Output.textContent = `${state.co2} ppm`;
    elements.speedOutput.textContent = `${state.speed.toFixed(1)}×`;
  }

  function start() {
    state.running = true;
    elements.status.textContent = "运行中";
    elements.startBtn.setAttribute("aria-pressed", "true");
  }
  function pause() {
    state.running = false;
    elements.status.textContent = "已暂停";
    elements.startBtn.setAttribute("aria-pressed", "false");
  }
  function reset() {
    pause();
    state.t = 0;
    state.temperature = 15.0;
    state.particles = { solar: [], ir: [], reemit: [], escape: [] };
    state.nextSolarEmit = 0;
    state.nextIrEmit = 0;
    state.lastTimestamp = null;
    initCo2Molecules();
    render();
  }

  function setParameters(values) {
    const co2Def = parameterSchema[0], speedDef = parameterSchema[1];
    const newCo2 = clamp(finite(Number(values.co2), co2Def.default), co2Def.min, co2Def.max);
    const newSpeed = clamp(finite(Number(values.speed), speedDef.default), speedDef.min, speedDef.max);
    const co2Changed = newCo2 !== state.co2;
    state.co2 = newCo2;
    state.speed = newSpeed;
    if (co2Changed) initCo2Molecules();
    elements.co2Input.value = String(state.co2);
    elements.speedInput.value = String(state.speed);
    render();
  }

  function getState() {
    return {
      running: state.running,
      t: state.t,
      temperature: state.temperature,
      co2: state.co2,
      speed: state.speed,
      trapRate: co2ToTrapRate(state.co2),
      particleCounts: {
        solar: state.particles.solar.length,
        ir: state.particles.ir.length,
        reemit: state.particles.reemit.length,
        escape: state.particles.escape.length
      }
    };
  }

  function getReadouts() {
    return {
      temperature: state.temperature,
      co2: state.co2,
      trapRate: co2ToTrapRate(state.co2),
      escapeRate: 1 - co2ToTrapRate(state.co2)
    };
  }

  function runModelChecks() {
    const checks = [];

    checks.push({
      name: "CO₂ 280 → 最低截留率",
      pass: Math.abs(co2ToTrapRate(280) - 0.12) < 1e-9,
      expected: 0.12, actual: co2ToTrapRate(280), tolerance: 1e-9
    });
    checks.push({
      name: "CO₂ 800 → 最高截留率",
      pass: Math.abs(co2ToTrapRate(800) - 0.78) < 1e-9,
      expected: 0.78, actual: co2ToTrapRate(800), tolerance: 1e-9
    });
    checks.push({
      name: "CO₂ 单调递增 → 截留率单调递增",
      pass: co2ToTrapRate(400) > co2ToTrapRate(280) && co2ToTrapRate(600) > co2ToTrapRate(400),
      expected: "trap(600) > trap(400) > trap(280)",
      actual: `${co2ToTrapRate(280).toFixed(3)} < ${co2ToTrapRate(400).toFixed(3)} < ${co2ToTrapRate(600).toFixed(3)}`,
      tolerance: "strict"
    });
    checks.push({
      name: "截留率 + 逃逸率 = 1",
      pass: Math.abs(co2ToTrapRate(450) + (1 - co2ToTrapRate(450)) - 1) < 1e-9,
      expected: 1, actual: co2ToTrapRate(450) + (1 - co2ToTrapRate(450)), tolerance: 1e-9
    });
    checks.push({
      name: "截留率越高 → 目标温度越高",
      pass: trapRateToTemp(co2ToTrapRate(700)) > trapRateToTemp(co2ToTrapRate(350)),
      expected: "temp(700ppm) > temp(350ppm)",
      actual: `${trapRateToTemp(co2ToTrapRate(350)).toFixed(1)} < ${trapRateToTemp(co2ToTrapRate(700)).toFixed(1)}`,
      tolerance: "strict"
    });
    checks.push({
      name: "CO₂ 280 → 5 个分子",
      pass: co2ToMolecules(280) === 5,
      expected: 5, actual: co2ToMolecules(280), tolerance: 0
    });
    checks.push({
      name: "CO₂ 800 → 20 个分子",
      pass: co2ToMolecules(800) === 20,
      expected: 20, actual: co2ToMolecules(800), tolerance: 0
    });
    checks.push({
      name: "CO₂ 升高 → 分子数增加",
      pass: co2ToMolecules(500) > co2ToMolecules(300),
      expected: "molecules(500) > molecules(300)",
      actual: `${co2ToMolecules(300)} < ${co2ToMolecules(500)}`,
      tolerance: "strict"
    });

    let prevTemp = 15.0;
    let monotonic = true;
    for (let co2 = 280; co2 <= 800; co2 += 20) {
      const tr = co2ToTrapRate(co2);
      const tt = trapRateToTemp(tr);
      if (tt < prevTemp - 1e-9) { monotonic = false; break; }
      prevTemp = tt;
    }
    checks.push({
      name: "温度随 CO₂ 单调递增",
      pass: monotonic,
      expected: "温度随 CO₂ 从 280 到 800 单调递增",
      actual: monotonic ? "单调递增" : "非单调",
      tolerance: "strict"
    });

    let simTemp = 15.0;
    const targetTemp = trapRateToTemp(co2ToTrapRate(560));
    for (let i = 0; i < 500; i++) {
      simTemp += 0.15 * (targetTemp - simTemp) * 0.1 * 10;
    }
    checks.push({
      name: "温度收敛到目标值",
      pass: Math.abs(simTemp - targetTemp) < 0.5,
      expected: targetTemp.toFixed(2),
      actual: simTemp.toFixed(2),
      tolerance: 0.5
    });

    return checks;
  }

  function bindControls() {
    elements.startBtn.addEventListener("click", start);
    elements.pauseBtn.addEventListener("click", pause);
    elements.resetBtn.addEventListener("click", reset);
    elements.co2Input.addEventListener("input", () => setParameters({ co2: elements.co2Input.value, speed: state.speed }));
    elements.speedInput.addEventListener("input", () => setParameters({ co2: state.co2, speed: elements.speedInput.value }));
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  function init() {
    state.reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    renderAtmosphereBand();
    renderSunRays();
    initCo2Molecules();
    bindControls();
    setParameters({ co2: 280, speed: 3 });
    reset();
    requestAnimationFrame(frame);
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
