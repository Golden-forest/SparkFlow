<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>凸透镜成像规律</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #070b18;
  --sim-surface: #111a2e;
  --sim-surface-soft: #16203a;
  --sim-text: #e8eefc;
  --sim-muted: #8a98b8;
  --sim-border: #2a3454;
  --sim-grid: #1a2540;
  --sim-accent: #5dd0e8;
  --sim-accent-deep: #2a9bb8;
  --sim-accent-soft: #143a48;
  --sim-positive: #5dd0e8;
  --sim-warning: #f59e0b;
  --sim-danger: #ef4444;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 18px 46px rgba(0, 0, 0, 0.45);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
  --sim-real: #5dd0e8;
  --sim-virtual: #f59e0b;
  --sim-object: #f472b6;
  --sim-image: #a78bfa;
  --sim-axis: #4a5a7a;
  --sim-lens: #5dd0e8;
  --sim-focal: #fbbf24;
  --sim-blocked: #ef4444;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--sim-text);
  background:
    radial-gradient(circle at 12% 0%, rgba(93, 208, 232, 0.08), transparent 28%),
    radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.06), transparent 26%),
    var(--sim-bg);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid rgba(93, 208, 232, 0.5); outline-offset: 2px; }
.app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
.header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
.header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
.header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
.status { border: 1px solid rgba(93,208,232,.25); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent); font-weight: 780; white-space: nowrap; }
.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 12px; }
.panel { min-width: 0; background: rgba(17, 26, 46, 0.88); border: 1px solid rgba(42, 52, 84, 0.6); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
.scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.panel-head h2 { margin: 0; font-size: 1rem; }
.panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
#scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(93,208,232,.12); border-radius: 18px; background: linear-gradient(145deg, #0a1124 0%, #0d1530 58%, #0a1124 100%); }
.side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
.readouts, .model-note { padding: 17px; }
.readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.metric { padding: 14px; border: 1px solid rgba(93,208,232,.12); border-radius: 15px; background: linear-gradient(145deg, #131e38, #16203a); }
.metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
.metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.metric .unit { font-size: 0.7rem; color: var(--sim-muted); margin-left: 3px; }
.model-note { display: grid; align-content: start; gap: 14px; }
.model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
.insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: rgba(245, 158, 11, 0.08); color: #fcd34d !important; font-weight: 650; line-height: 1.5; }
.controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(180px, 1fr) minmax(180px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
.actions { display: flex; gap: 8px; }
button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
button:hover { border-color: #3a4868; background: #1a2540; }
button:active { transform: scale(.97); }
button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(93,208,232,.20); }
button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
.control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
.control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
.ray-parallel { stroke: var(--sim-real); stroke-width: 2.5; fill: none; opacity: 0.9; }
.ray-center { stroke: var(--sim-real); stroke-width: 2.5; fill: none; opacity: 0.9; }
.ray-focal { stroke: var(--sim-real); stroke-width: 2.5; fill: none; opacity: 0.9; }
.ray-virtual { stroke: var(--sim-virtual); stroke-width: 2; fill: none; stroke-dasharray: 6 5; opacity: 0.7; }
.ray-blocked { stroke: var(--sim-blocked); stroke-width: 1.5; fill: none; stroke-dasharray: 3 4; opacity: 0.4; }
.axis-line { stroke: var(--sim-axis); stroke-width: 1.5; stroke-dasharray: 4 4; }
.lens-body { fill: rgba(93, 208, 232, 0.12); stroke: var(--sim-lens); stroke-width: 2; }
.lens-edge { stroke: var(--sim-lens); stroke-width: 1; opacity: 0.4; stroke-dasharray: 2 3; }
.lens-arrow { fill: none; stroke: var(--sim-lens); stroke-width: 2; }
.object-body { fill: var(--sim-object); stroke: #fff; stroke-width: 1.5; }
.image-real { fill: var(--sim-image); stroke: #fff; stroke-width: 1.5; opacity: 0.9; }
.image-virtual { fill: var(--sim-image); stroke: #fff; stroke-width: 1.5; stroke-dasharray: 4 3; opacity: 0.6; }
.focal-point { fill: var(--sim-focal); stroke: #fff; stroke-width: 1.5; }
.focal-label { fill: var(--sim-focal); font-size: 13px; font-weight: 700; }
.grid-line { stroke: var(--sim-grid); stroke-width: 1; opacity: 0.3; }
.drag-hint { fill: var(--sim-muted); font-size: 11px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--sim-muted); }
.legend-swatch { width: 18px; height: 3px; border-radius: 2px; }
.legend-swatch.dashed { border-top: 2px dashed var(--sim-virtual); height: 0; }
.legend-swatch.blocked { border-top: 2px dashed var(--sim-blocked); height: 0; opacity: 0.5; }
@media (max-width: 860px) {
  .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
  .main, .app[data-layout] .main { grid-template-columns: 1fr; }
  .controls { grid-template-columns: 1fr; }
  .scene-panel { min-height: 0; }
  #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>凸透镜成像规律</h1>
      <p>拖动物体改变物距，观察实像与虚像的变化</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">就绪</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head">
        <h2 id="scene-title">光路图</h2>
        <span>拖动物体 · 观察成像</span>
      </div>
      <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
        <desc id="scene-desc">凸透镜成像光路图：物体在透镜左侧，像在右侧。三条特殊光线显示折射路径。透镜为有限尺寸。</desc>
        <g id="grid"></g>
        <line class="axis-line" x1="20" y1="210" x2="740" y2="210"></line>
        <g id="rays"></g>
        <g id="lensGroup">
          <path class="lens-body" d="M 380 110 Q 392 210 380 310 Q 368 210 380 110 Z"></path>
          <line class="lens-edge" x1="380" y1="110" x2="380" y2="310"></line>
          <path class="lens-arrow" d="M 374 116 L 380 106 L 386 116"></path>
          <path class="lens-arrow" d="M 374 304 L 380 314 L 386 304"></path>
        </g>
        <g id="markers"></g>
        <g id="objectGroup">
          <path id="objectArrow" class="object-body" d="M 0 0 L 0 0 L 0 0 Z"></path>
          <text id="objectLabel" class="drag-hint" x="0" y="0">物体</text>
        </g>
        <g id="imageGroup">
          <path id="imageArrow" class="image-real" d="M 0 0 L 0 0 L 0 0 Z" style="display:none"></path>
          <text id="imageLabel" class="drag-hint" x="0" y="0" style="display:none">像</text>
        </g>
        <rect id="dragZone" x="20" y="60" width="360" height="300" fill="transparent" style="cursor: ew-resize;"></rect>
      </svg>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel readouts" aria-label="实时数据">
        <div class="readout-grid">
          <div class="metric"><small>物距 u</small><strong id="uReadout">3.00</strong><span class="unit">f</span></div>
          <div class="metric"><small>像距 v</small><strong id="vReadout">1.50</strong><span class="unit">f</span></div>
          <div class="metric"><small>焦距 f</small><strong id="fReadout">1.00</strong><span class="unit">f</span></div>
          <div class="metric"><small>放大率 m</small><strong id="mReadout">0.50</strong></div>
        </div>
      </section>
      <section class="panel model-note" data-region="insight">
        <div class="panel-head"><h2>成像性质</h2></div>
        <p id="insight" class="insight">拖动物体改变物距，观察像的变化。</p>
        <p style="font-size: 0.8rem;">教学模型：薄透镜近轴近似。追踪三条特殊光线：过光心、平行主光轴后过焦点、过焦点后平行主光轴。虚像用虚线延长线表示。透镜为有限尺寸，入射点超出边缘的光线被遮挡。</p>
        <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px;">
          <div class="legend-item"><span class="legend-swatch" style="background: var(--sim-real);"></span>实像光线</div>
          <div class="legend-item"><span class="legend-swatch dashed"></span>虚像延长线</div>
          <div class="legend-item"><span class="legend-swatch blocked"></span>被透镜边缘遮挡</div>
          <div class="legend-item"><span class="legend-swatch" style="background: var(--sim-object);"></span>物体</div>
          <div class="legend-item"><span class="legend-swatch" style="background: var(--sim-image);"></span>像</div>
        </div>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="模拟控制">
    <div class="actions">
      <button id="startBtn" class="primary" type="button">开始</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control">
      <label for="fInput">焦距 f <output id="fOutput">1.00 f</output></label>
      <input id="fInput" type="range" min="0.6" max="1.6" step="0.05" value="1.0">
    </div>
    <div class="control">
      <label for="uInput">物距 u <output id="uOutput">3.00 f</output></label>
      <input id="uInput" type="range" min="0.3" max="5.0" step="0.05" value="3.0">
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const parameterSchema = [
    { key: "f", label: "焦距", type: "slider", min: 0.6, max: 1.6, step: 0.05, default: 1.0, unit: "f" },
    { key: "u", label: "物距", type: "slider", min: 0.3, max: 5.0, step: 0.05, default: 3.0, unit: "f" }
  ];

  // 坐标系：SVG 像素坐标，透镜在 x=380，主光轴在 y=210
  // 透镜有限高度：上边缘 y=110，下边缘 y=310，半高=100px
  const LENS_X = 380;
  const AXIS_Y = 210;
  const LENS_TOP = 110;
  const LENS_BOTTOM = 310;
  const LENS_HALF_HEIGHT = 100;
  const BASE_F_PIXELS = 60;

  const state = {
    running: false,
    f: 1.0,
    u: 3.0,
    objectHeight: 60,
    lastTimestamp: null
  };

  const elements = {
    status: document.querySelector("#status"),
    grid: document.querySelector("#grid"),
    rays: document.querySelector("#rays"),
    markers: document.querySelector("#markers"),
    objectArrow: document.querySelector("#objectArrow"),
    objectLabel: document.querySelector("#objectLabel"),
    imageArrow: document.querySelector("#imageArrow"),
    imageLabel: document.querySelector("#imageLabel"),
    dragZone: document.querySelector("#dragZone"),
    insight: document.querySelector("#insight"),
    uReadout: document.querySelector("#uReadout"),
    vReadout: document.querySelector("#vReadout"),
    fReadout: document.querySelector("#fReadout"),
    mReadout: document.querySelector("#mReadout"),
    fInput: document.querySelector("#fInput"),
    fOutput: document.querySelector("#fOutput"),
    uInput: document.querySelector("#uInput"),
    uOutput: document.querySelector("#uOutput"),
    startBtn: document.querySelector("#startBtn"),
    pauseBtn: document.querySelector("#pauseBtn"),
    resetBtn: document.querySelector("#resetBtn")
  };

  function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
  function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

  function getFPixels() { return BASE_F_PIXELS * state.f; }
  function getObjectX() { return LENS_X - state.u * getFPixels(); }

  // 薄透镜公式：1/u + 1/v = 1/f，以 f 为单位时 f=1
  // v = u/(u-1)，u<1 时 v<0（虚像在物体同侧）
  function getImageDistanceF() {
    const u = state.u;
    if (Math.abs(u - 1.0) < 1e-6) return Infinity;
    return u / (u - 1.0);
  }

  function getMagnification() {
    const v = getImageDistanceF();
    if (!Number.isFinite(v)) return Infinity;
    return -v / state.u;
  }

  // 检查入射点是否在透镜有限高度范围内
  function isWithinLens(y) {
    return y >= LENS_TOP && y <= LENS_BOTTOM;
  }

  function initGrid() {
    const lines = [];
    for (let x = 40; x <= 740; x += 40) {
      lines.push(`<line class="grid-line" x1="${x}" y1="30" x2="${x}" y2="390"></line>`);
    }
    for (let y = 50; y <= 390; y += 40) {
      lines.push(`<line class="grid-line" x1="20" y1="${y}" x2="740" y2="${y}"></line>`);
    }
    elements.grid.innerHTML = lines.join("");
  }

  function drawMarkers() {
    const fPx = getFPixels();
    const fLeft = LENS_X - fPx;
    const fRight = LENS_X + fPx;
    const f2Left = LENS_X - 2 * fPx;
    const f2Right = LENS_X + 2 * fPx;
    const markers = [];

    markers.push(`<circle class="focal-point" cx="${fLeft}" cy="${AXIS_Y}" r="4"></circle>`);
    markers.push(`<text class="focal-label" x="${fLeft}" y="${AXIS_Y + 22}" text-anchor="middle">F</text>`);
    markers.push(`<circle class="focal-point" cx="${fRight}" cy="${AXIS_Y}" r="4"></circle>`);
    markers.push(`<text class="focal-label" x="${fRight}" y="${AXIS_Y + 22}" text-anchor="middle">F</text>`);
    markers.push(`<circle class="focal-point" cx="${f2Left}" cy="${AXIS_Y}" r="3" opacity="0.6"></circle>`);
    markers.push(`<text class="focal-label" x="${f2Left}" y="${AXIS_Y + 22}" text-anchor="middle" style="font-size:11px;opacity:0.7">2F</text>`);
    markers.push(`<circle class="focal-point" cx="${f2Right}" cy="${AXIS_Y}" r="3" opacity="0.6"></circle>`);
    markers.push(`<text class="focal-label" x="${f2Right}" y="${AXIS_Y + 22}" text-anchor="middle" style="font-size:11px;opacity:0.7">2F</text>`);

    elements.markers.innerHTML = markers.join("");
  }

  function drawObject() {
    const ox = getObjectX();
    const oh = state.objectHeight;
    const d = `M ${ox} ${AXIS_Y} L ${ox} ${AXIS_Y - oh} L ${ox - 6} ${AXIS_Y - oh + 10} M ${ox} ${AXIS_Y - oh} L ${ox + 6} ${AXIS_Y - oh + 10}`;
    elements.objectArrow.setAttribute("d", d);
    elements.objectLabel.setAttribute("x", ox);
    elements.objectLabel.setAttribute("y", AXIS_Y - oh - 8);
    elements.objectLabel.setAttribute("text-anchor", "middle");
    elements.objectLabel.textContent = "物体";
  }

  function drawImage() {
    const v_f = getImageDistanceF();
    const m = getMagnification();
    const fPx = getFPixels();

    if (!Number.isFinite(v_f) || !Number.isFinite(m)) {
      elements.imageArrow.style.display = "none";
      elements.imageLabel.style.display = "none";
      return;
    }

    const isVirtual = v_f < 0;
    const ix = LENS_X + v_f * fPx;
    const ih = m * state.objectHeight;

    const endY = AXIS_Y - ih;
    const arrowDir = ih > 0 ? 10 : -10;
    const d = `M ${ix} ${AXIS_Y} L ${ix} ${endY} L ${ix - 6} ${endY + arrowDir} M ${ix} ${endY} L ${ix + 6} ${endY + arrowDir}`;

    elements.imageArrow.setAttribute("d", d);
    elements.imageArrow.style.display = "";
    elements.imageArrow.setAttribute("class", isVirtual ? "image-virtual" : "image-real");

    elements.imageLabel.setAttribute("x", ix);
    elements.imageLabel.setAttribute("y", endY + (ih > 0 ? -8 : 18));
    elements.imageLabel.setAttribute("text-anchor", "middle");
    elements.imageLabel.style.display = "";
    elements.imageLabel.textContent = isVirtual ? "虚像" : "实像";
  }

  function drawRays() {
    const ox = getObjectX();
    const oh = state.objectHeight;
    const fPx = getFPixels();
    const fLeft = LENS_X - fPx;
    const fRight = LENS_X + fPx;
    const objectTop = { x: ox, y: AXIS_Y - oh };

    const v_f = getImageDistanceF();
    const m = getMagnification();
    const isVirtual = v_f < 0 && Number.isFinite(v_f);
    const imageTopX = Number.isFinite(v_f) ? LENS_X + v_f * fPx : null;
    const imageTopY = Number.isFinite(m) ? AXIS_Y - m * oh : null;

    const rays = [];
    let blockedCount = 0;

    // ========== 光线1：过光心 ==========
    // 入射段：物体顶部 → 透镜中心（直线）
    // 出射段：透镜中心 → 像顶部（直线）
    // 入射点 = 透镜中心 (LENS_X, AXIS_Y)，始终在透镜内
    {
      rays.push(`<line class="ray-center" x1="${objectTop.x}" y1="${objectTop.y}" x2="${LENS_X}" y2="${AXIS_Y}"/>`);
      if (Number.isFinite(v_f)) {
        if (isVirtual) {
          // 虚像：出射光线从透镜中心向右发散，延长线交于虚像
          const dx = LENS_X - objectTop.x; // 正值（透镜在物体右侧）
          const dy = AXIS_Y - objectTop.y; // 正值（光心在物体顶部下方）
          // 出射光线方向与入射光线相同（过光心不偏折），向右延伸
          const extX = LENS_X + dx * 0.5;
          const extY = AXIS_Y + dy * 0.5;
          rays.push(`<line class="ray-center" x1="${LENS_X}" y1="${AXIS_Y}" x2="${extX}" y2="${extY}"/>`);
          // 虚像延长线（从透镜中心反向延伸到虚像位置）
          rays.push(`<line class="ray-virtual" x1="${LENS_X}" y1="${AXIS_Y}" x2="${imageTopX}" y2="${imageTopY}"/>`);
        } else {
          // 实像：出射光线从透镜中心到像顶部
          rays.push(`<line class="ray-center" x1="${LENS_X}" y1="${AXIS_Y}" x2="${imageTopX}" y2="${imageTopY}"/>`);
        }
      }
    }

    // ========== 光线2：平行入射，折射后过右焦点 ==========
    // 入射段：物体顶部 → 透镜入射点 (LENS_X, objectTop.y)，水平直线
    // 出射段：透镜入射点 → 像顶部，折射后过右焦点
    {
      const incidentY = objectTop.y;
      if (isWithinLens(incidentY)) {
        // 入射点在透镜内，绘制入射段和出射段
        rays.push(`<line class="ray-parallel" x1="${objectTop.x}" y1="${objectTop.y}" x2="${LENS_X}" y2="${incidentY}"/>`);
        if (Number.isFinite(v_f)) {
          if (isVirtual) {
            // 虚像：折射光线从入射点向右发散（远离右焦点方向），延长线交于虚像
            // 折射光线方向：从右焦点指向入射点方向延伸
            const dx = LENS_X - fRight; // 负值
            const dy = incidentY - AXIS_Y; // 负值（入射点在轴上方）
            const extX = LENS_X + dx * 0.5;
            const extY = incidentY + dy * 0.5;
            rays.push(`<line class="ray-parallel" x1="${LENS_X}" y1="${incidentY}" x2="${extX}" y2="${extY}"/>`);
            rays.push(`<line class="ray-virtual" x1="${LENS_X}" y1="${incidentY}" x2="${imageTopX}" y2="${imageTopY}"/>`);
          } else {
            // 实像：折射光线从入射点过右焦点到像顶部
            rays.push(`<line class="ray-parallel" x1="${LENS_X}" y1="${incidentY}" x2="${imageTopX}" y2="${imageTopY}"/>`);
          }
        }
      } else {
        // 入射点超出透镜边缘，光线被遮挡
        blockedCount++;
        const edgeY = incidentY < LENS_TOP ? LENS_TOP : LENS_BOTTOM;
        rays.push(`<line class="ray-blocked" x1="${objectTop.x}" y1="${objectTop.y}" x2="${LENS_X}" y2="${edgeY}"/>`);
      }
    }

    // ========== 光线3：过左焦点入射，折射后平行主光轴 ==========
    // 入射光线从物体顶部出发，延长线过左焦点 (fLeft, AXIS_Y)
    // 入射点在透镜上 (LENS_X, y_lens)，折射后水平
    // 三点共线求 y_lens:
    //   (y_lens - objectTop.y) / (LENS_X - objectTop.x) = (AXIS_Y - objectTop.y) / (fLeft - objectTop.x)
    //   y_lens = objectTop.y + (AXIS_Y - objectTop.y) * (LENS_X - objectTop.x) / (fLeft - objectTop.x)
    //   注意 objectTop.y = AXIS_Y - oh，所以 AXIS_Y - objectTop.y = oh
    {
      const denom = fLeft - objectTop.x;
      if (Math.abs(denom) > 1e-3) {
        const y_lens = objectTop.y + (AXIS_Y - objectTop.y) * (LENS_X - objectTop.x) / denom;
        if (isWithinLens(y_lens)) {
          // 入射点在透镜内
          rays.push(`<line class="ray-focal" x1="${objectTop.x}" y1="${objectTop.y}" x2="${LENS_X}" y2="${y_lens}"/>`);
          if (Number.isFinite(v_f)) {
            if (isVirtual) {
              // 虚像：折射后水平向右，延长线交于虚像
              const extX = LENS_X + (LENS_X - objectTop.x) * 0.4;
              rays.push(`<line class="ray-focal" x1="${LENS_X}" y1="${y_lens}" x2="${extX}" y2="${y_lens}"/>`);
              rays.push(`<line class="ray-virtual" x1="${LENS_X}" y1="${y_lens}" x2="${imageTopX}" y2="${imageTopY}"/>`);
            } else {
              // 实像：折射后水平到像位置
              rays.push(`<line class="ray-focal" x1="${LENS_X}" y1="${y_lens}" x2="${imageTopX}" y2="${y_lens}"/>`);
            }
          }
        } else {
          // 入射点超出透镜边缘，光线被遮挡
          blockedCount++;
          // 计算入射光线到达透镜边缘高度时的 x 坐标
          const edgeY = y_lens < LENS_TOP ? LENS_TOP : LENS_BOTTOM;
          // 入射光线斜率：(AXIS_Y - objectTop.y) / (fLeft - objectTop.x) = oh / (fLeft - ox)
          const slope = (AXIS_Y - objectTop.y) / (fLeft - objectTop.x);
          if (Math.abs(slope) > 1e-6) {
            const blockedX = objectTop.x + (edgeY - objectTop.y) / slope;
            rays.push(`<line class="ray-blocked" x1="${objectTop.x}" y1="${objectTop.y}" x2="${blockedX}" y2="${edgeY}"/>`);
          } else {
            rays.push(`<line class="ray-blocked" x1="${objectTop.x}" y1="${objectTop.y}" x2="${LENS_X}" y2="${edgeY}"/>`);
          }
        }
      }
    }

    elements.rays.innerHTML = rays.join("");
    return blockedCount;
  }

  function updateInsight(blockedCount) {
    const u = state.u;
    const v_f = getImageDistanceF();
    const m = getMagnification();

    if (!Number.isFinite(v_f) || Math.abs(u - 1.0) < 0.05) {
      elements.insight.textContent = "物体在焦点处：光线平行射出，不成像。";
      return;
    }

    const isVirtual = v_f < 0;
    const absM = Math.abs(m);
    const isUpright = m > 0;

    let sizeDesc;
    if (absM > 1.05) sizeDesc = "放大";
    else if (absM < 0.95) sizeDesc = "缩小";
    else sizeDesc = "等大";

    let orientation = isUpright ? "正立" : "倒立";
    let imageType = isVirtual ? "虚像" : "实像";

    let positionDesc = "";
    if (u > 2.05) {
      positionDesc = "物体在 2F 外";
    } else if (u > 1.95) {
      positionDesc = "物体在 2F 处";
    } else if (u > 1.05) {
      positionDesc = "物体在 F 与 2F 之间";
    } else if (u < 0.95) {
      positionDesc = "物体在 F 内";
    }

    let blockNote = "";
    if (blockedCount > 0) {
      blockNote = `（${blockedCount} 条光线被透镜边缘遮挡）`;
    }

    elements.insight.textContent = `${positionDesc}：成${orientation}${sizeDesc}${imageType}（m = ${m.toFixed(2)}）${blockNote}。`;
  }

  function render() {
    drawMarkers();
    drawObject();
    drawImage();
    const blockedCount = drawRays();
    updateInsight(blockedCount);

    const v_f = getImageDistanceF();
    const m = getMagnification();

    elements.uReadout.textContent = state.u.toFixed(2);
    elements.vReadout.textContent = Number.isFinite(v_f) ? v_f.toFixed(2) : "∞";
    elements.fReadout.textContent = state.f.toFixed(2);
    elements.mReadout.textContent = Number.isFinite(m) ? m.toFixed(2) : "∞";

    elements.fOutput.textContent = `${state.f.toFixed(2)} f`;
    elements.uOutput.textContent = `${state.u.toFixed(2)} f`;
  }

  function setParameters(values) {
    const fDef = parameterSchema[0];
    const uDef = parameterSchema[1];
    state.f = clamp(finite(Number(values.f), fDef.default), fDef.min, fDef.max);
    state.u = clamp(finite(Number(values.u), uDef.default), uDef.min, uDef.max);
    elements.fInput.value = String(state.f);
    elements.uInput.value = String(state.u);
    render();
  }

  function start() {
    state.running = true;
    elements.status.textContent = "运行中";
    elements.startBtn.setAttribute("aria-pressed", "true");
  }

  function pause() {
    state.running = false;
    elements.status.textContent = "已暂停";
    elements.startBtn.setAttribute("aria-pressed", "false");
  }

  function reset() {
    pause();
    setParameters({ f: 1.0, u: 3.0 });
    state.objectHeight = 60;
    elements.status.textContent = "就绪";
    render();
  }

  function update(dt) {
    // 当前为静态光路图，无时间演化
  }

  function getState() {
    return { ...state };
  }

  function getReadouts() {
    const v_f = getImageDistanceF();
    const m = getMagnification();
    return {
      u: state.u,
      v: Number.isFinite(v_f) ? v_f : Infinity,
      f: state.f,
      m: Number.isFinite(m) ? m : Infinity
    };
  }

  function runModelChecks() {
    // 薄透镜公式验证：1/u + 1/v = 1/f（以 f 为单位时 f=1）
    const cases = [
      {
        name: "u=2f 时成等大倒立实像",
        u: 2.0,
        expectedV: 2.0, expectedM: -1.0,
        tolerance: 0.001
      },
      {
        name: "u=3f 时成缩小倒立实像",
        u: 3.0,
        expectedV: 1.5, expectedM: -0.5,
        tolerance: 0.001
      },
      {
        name: "u=1.5f 时成放大倒立实像",
        u: 1.5,
        expectedV: 3.0, expectedM: -2.0,
        tolerance: 0.001
      },
      {
        name: "u=0.5f 时成放大正立虚像",
        u: 0.5,
        expectedV: -1.0, expectedM: 2.0,
        tolerance: 0.001
      },
      {
        name: "u=0.8f 时成放大正立虚像",
        u: 0.8,
        expectedV: -4.0, expectedM: 5.0,
        tolerance: 0.001
      },
      {
        name: "透镜公式守恒 1/u+1/v=1/f",
        u: 2.5,
        expectedV: 1.6667, expectedM: -0.6667,
        tolerance: 0.001
      }
    ];

    return cases.map(c => {
      const v_f = c.u / (c.u - 1.0);
      const m = -v_f / c.u;
      const vPass = Math.abs(v_f - c.expectedV) < c.tolerance;
      const mPass = Math.abs(m - c.expectedM) < c.tolerance;
      return {
        name: c.name,
        pass: vPass && mPass,
        expected: `v=${c.expectedV.toFixed(3)}, m=${c.expectedM.toFixed(3)}`,
        actual: `v=${v_f.toFixed(3)}, m=${m.toFixed(3)}`,
        tolerance: c.tolerance
      };
    });
  }

  // 拖动物体交互
  let isDragging = false;
  let dragStartX = 0;
  let dragStartU = 0;

  function getSVGPoint(clientX, clientY) {
    const svg = document.querySelector("#scene");
    const pt = svg.createSVGPoint();
    pt.x = clientX;
    pt.y = clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function onPointerDown(e) {
    const p = getSVGPoint(e.clientX, e.clientY);
    const ox = getObjectX();
    const oh = state.objectHeight;
    const dist = Math.abs(p.x - ox);
    const yDist = Math.abs(p.y - (AXIS_Y - oh / 2));

    if (dist < 50 && yDist < 70) {
      isDragging = true;
      dragStartX = p.x;
      dragStartU = state.u;
      e.preventDefault();
    }
  }

  function onPointerMove(e) {
    if (!isDragging) return;
    const p = getSVGPoint(e.clientX, e.clientY);
    const fPx = getFPixels();
    const dxPixels = p.x - dragStartX;
    const du = -dxPixels / fPx;
    let newU = dragStartU + du;
    newU = clamp(newU, 0.3, 5.0);
    setParameters({ f: state.f, u: newU });
  }

  function onPointerUp() {
    isDragging = false;
  }

  function bindControls() {
    elements.startBtn.addEventListener("click", start);
    elements.pauseBtn.addEventListener("click", pause);
    elements.resetBtn.addEventListener("click", reset);

    elements.fInput.addEventListener("input", () => setParameters({ f: elements.fInput.value, u: state.u }));
    elements.uInput.addEventListener("input", () => setParameters({ f: state.f, u: elements.uInput.value }));

    const svg = document.querySelector("#scene");
    svg.addEventListener("pointerdown", onPointerDown);
    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(clamp(finite(dt, 0), 0, 0.05));
    requestAnimationFrame(frame);
  }

  function init() {
    initGrid();
    bindControls();
    setParameters({ f: 1.0, u: 3.0 });
    requestAnimationFrame(frame);
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
