<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数学曲线画廊</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #000000;
  --sim-surface: #000000;
  --sim-surface-soft: #0a0a0a;
  --sim-text: #ffffff;
  --sim-muted: rgba(255,255,255,0.55);
  --sim-border: rgba(255,255,255,0.10);
  --sim-grid: rgba(255,255,255,0.04);
  --sim-accent: #00e5ff;
  --sim-accent-deep: #00b8d4;
  --sim-accent-soft: rgba(0,229,255,0.12);
  --sim-positive: #00e5ff;
  --sim-warning: #ffab00;
  --sim-danger: #ff5252;
  --sim-radius-sm: 8px;
  --sim-radius-md: 12px;
  --sim-radius-lg: 16px;
  --sim-shadow: 0 8px 24px rgba(0,0,0,0.5);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #000;
  color: #fff;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.app {
  position: fixed; inset: 0;
  background: #000;
  display: flex; flex-direction: column;
}
.header {
  flex: 0 0 auto;
  display: flex; justify-content: space-between; align-items: center;
  gap: 16px;
  padding: 14px 28px 10px;
  z-index: 10;
}
.header-left { min-width: 0; }
.header h1 {
  font-size: clamp(1.1rem, 2vw, 1.6rem);
  font-weight: 300;
  letter-spacing: 0.06em;
  line-height: 1.1;
}
.header p {
  margin-top: 3px;
  font-size: 12px;
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.04em;
}
.status {
  flex: 0 0 auto;
  border: 1px solid rgba(0,229,255,0.30);
  border-radius: 999px;
  padding: 7px 16px;
  background: rgba(0,229,255,0.10);
  color: var(--sim-accent);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
}
.main {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr minmax(240px, 300px);
  gap: 0;
}
.stage-wrap {
  min-height: 0;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
#scene {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
}
.formula-overlay {
  position: absolute;
  top: 4.5vh; left: 4.5vw;
  z-index: 5;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.5s ease;
  max-width: 55vw;
}
.formula-overlay.visible { opacity: 1; }
.formula-name {
  font-size: clamp(1.1rem, 2.4vw, 2rem);
  font-weight: 300;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,0.95);
  margin-bottom: 0.5em;
  text-transform: uppercase;
}
.formula-expr {
  font-family: "Cambria Math", "Latin Modern Math", "STIX Two Math", "Times New Roman", Georgia, serif;
  font-size: clamp(1.3rem, 3.2vw, 2.8rem);
  font-weight: 400;
  color: #fff;
  letter-spacing: 0.02em;
  line-height: 1.2;
  text-shadow: 0 0 18px rgba(0,229,255,0.25);
}
.progress-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: rgba(255,255,255,0.06);
  z-index: 8;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--sim-accent-deep), var(--sim-accent));
  width: 0%;
  box-shadow: 0 0 8px rgba(0,229,255,0.5);
}
.side {
  min-height: 0;
  display: flex; flex-direction: column;
  border-left: 1px solid rgba(255,255,255,0.06);
  overflow-y: auto;
}
.readouts {
  padding: 18px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.readouts h2 {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.40);
  margin-bottom: 14px;
}
.readout-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.metric {
  padding: 12px 14px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--sim-radius-sm);
  background: rgba(255,255,255,0.02);
}
.metric small {
  display: block;
  margin-bottom: 4px;
  color: rgba(255,255,255,0.40);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.metric strong {
  font-size: 1.15rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
  color: #fff;
}
.insight-panel {
  flex: 1 1 auto;
  padding: 18px 20px;
  display: flex; flex-direction: column; gap: 14px;
}
.insight-panel h2 {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.40);
}
.insight {
  padding: 12px 14px;
  border-left: 3px solid var(--sim-warning);
  border-radius: 0 var(--sim-radius-sm) var(--sim-radius-sm) 0;
  background: rgba(255,171,0,0.06);
  color: rgba(255,255,255,0.92);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.5;
}
.model-note {
  margin: 0;
  color: rgba(255,255,255,0.50);
  font-size: 12px;
  line-height: 1.6;
}
.dock {
  flex: 0 0 auto;
  display: flex; justify-content: space-between; align-items: center;
  gap: 16px;
  padding: 14px 28px 18px;
  z-index: 10;
}
.dock-group {
  display: flex; align-items: center; gap: 6px;
}
.dock-label {
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-right: 8px;
}
.btn {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.14);
  color: rgba(255,255,255,0.75);
  padding: 8px 14px;
  border-radius: var(--sim-radius-sm);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  transition: all 0.2s ease;
  font-family: inherit;
  min-width: 42px;
}
.btn:hover {
  border-color: rgba(0,229,255,0.5);
  color: #fff;
  background: rgba(0,229,255,0.06);
}
.btn:focus-visible {
  outline: 2px solid rgba(0,229,255,0.6);
  outline-offset: 2px;
}
.btn.active {
  border-color: var(--sim-accent);
  color: #000;
  background: var(--sim-accent);
  box-shadow: 0 0 16px rgba(0,229,255,0.4);
}
.btn-num {
  font-variant-numeric: tabular-nums;
  font-size: 14px;
  min-width: 38px;
}
.btn.primary {
  border-color: var(--sim-accent);
  color: #000;
  background: var(--sim-accent);
  box-shadow: 0 0 16px rgba(0,229,255,0.4);
}
.btn.primary[aria-pressed="true"] {
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45), 0 0 16px rgba(0,229,255,0.4);
}
@media (max-width: 860px) {
  .main { grid-template-columns: 1fr; }
  .side {
    border-left: none;
    border-top: 1px solid rgba(255,255,255,0.06);
    max-height: 38vh;
  }
  .stage-wrap { min-height: 240px; }
}
@media (max-width: 640px) {
  .header { padding: 10px 14px 8px; }
  .header h1 { font-size: 1.05rem; }
  .header p { font-size: 11px; }
  .status { padding: 5px 12px; font-size: 11px; }
  .dock { padding: 10px 14px 14px; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .dock-label { display: none; }
  .btn { padding: 7px 10px; font-size: 12px; min-width: 36px; }
  .formula-overlay { top: 3vh; left: 5vw; max-width: 70vw; }
  .readouts, .insight-panel { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .formula-overlay { transition: none; }
}
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div class="header-left">
      <h1>数学曲线画廊</h1>
      <p>八条参数化曲线在黑色画布上连续演化，观察形态如何随参数呼吸。</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">运行中</div>
  </header>

  <main class="main">
    <section class="stage-wrap" data-region="stage" aria-labelledby="stage-title">
      <h2 id="stage-title" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">曲线舞台</h2>
      <canvas id="scene" role="img" aria-labelledby="stage-title scene-desc"></canvas>
      <div id="formulaOverlay" class="formula-overlay" aria-live="polite">
        <div id="formulaName" class="formula-name"></div>
        <div id="formulaExpr" class="formula-expr"></div>
      </div>
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      <span id="scene-desc" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">参数化数学曲线在画布上随时间演化。</span>
    </section>

    <aside class="side" data-region="evidence">
      <section class="readouts" aria-label="实时数值">
        <h2>实时数值</h2>
        <div class="readout-grid">
          <div class="metric"><small>当前曲线</small><strong id="indexReadout">1 / 8</strong></div>
          <div class="metric"><small>段内时间</small><strong id="elapsedReadout">0.0 s</strong></div>
          <div class="metric"><small>速率</small><strong id="speedReadout">1.0x</strong></div>
          <div class="metric"><small>阶段</small><strong id="phaseReadout">淡入</strong></div>
        </div>
      </section>
      <section class="insight-panel" data-region="insight" aria-label="观察提示">
        <h2>观察提示</h2>
        <div id="insight" class="insight">每段 8 秒：淡入 0.5 秒 → 保持 → 淡出 0.5 秒，自动切换到下一条。</div>
        <p class="model-note">教学视图：曲线参数随段内时间连续变化，双层描边（粗低透明 + 细高透明）模拟发光。速率旋钮缩放动画时间，不影响曲线几何。</p>
      </section>
    </aside>
  </main>

  <section class="dock" data-region="controls" aria-label="模拟控制">
    <div class="dock-group">
      <button id="startBtn" class="btn primary" type="button" aria-pressed="true">播放</button>
      <button id="pauseBtn" class="btn" type="button">暂停</button>
      <button id="resetBtn" class="btn" type="button">重置</button>
    </div>
    <div class="dock-group" id="speedGroup">
      <span class="dock-label">速率</span>
      <button class="btn" data-speed="0.5" type="button">0.5x</button>
      <button class="btn active" data-speed="1" type="button">1x</button>
      <button class="btn" data-speed="2" type="button">2x</button>
      <button class="btn" data-speed="4" type="button">4x</button>
    </div>
    <div class="dock-group" id="curveGroup"></div>
  </section>
</div>

<script>
(() => {
"use strict";

// ─── 8 条曲线定义 ───────────────────────────────────────────
const CURVES = [
  {
    name: "玫瑰线",
    expr: "r = cos(kθ),  k ∈ [0, 8]",
    color: "#00e5ff",
    duration: 8,
    render(ctx, t, W, H, scale) {
      const k = 0.5 + (t / 8) * 7.5;
      const pts = [];
      const steps = 1400;
      const turns = (k < 1.5) ? 2 : (Math.floor(k) === k ? 1 : 2);
      for (let i = 0; i <= steps; i++) {
        const theta = (i / steps) * Math.PI * 2 * turns;
        const r = Math.cos(k * theta);
        pts.push([r * Math.cos(theta), r * Math.sin(theta)]);
      }
      drawPath(ctx, pts, W, H, scale, this.color);
    }
  },
  {
    name: "利萨如曲线",
    expr: "x = A·sin(at+δ),  y = B·sin(bt)",
    color: "#ff6ec7",
    duration: 8,
    render(ctx, t, W, H, scale) {
      const ratios = [[1,1],[1,2],[3,4],[5,6]];
      const idx = Math.floor(t / 2) % ratios.length;
      const [a, b] = ratios[idx];
      const delta = (t / 8) * Math.PI * 2;
      const pts = [];
      const steps = 2000;
      for (let i = 0; i <= steps; i++) {
        const u = (i / steps) * Math.PI * 2;
        pts.push([Math.sin(a * u + delta), Math.sin(b * u)]);
      }
      drawPath(ctx, pts, W, H, scale, this.color);
    }
  },
  {
    name: "Gielis 超级公式",
    expr: "r = |cos(mθ/4)|^n + |sin(mθ/4)|^n",
    color: "#ffd54f",
    duration: 8,
    render(ctx, t, W, H, scale) {
      const m = 0.5 + (t / 8) * 11.5;
      const n = 2 + 1.8 * Math.sin(t * 0.9);
      const pts = [];
      const steps = 1400;
      for (let i = 0; i <= steps; i++) {
        const theta = (i / steps) * Math.PI * 2;
        const p1 = Math.pow(Math.abs(Math.cos(m * theta / 4)), n);
        const p2 = Math.pow(Math.abs(Math.sin(m * theta / 4)), n);
        const r = Math.pow(p1 + p2, -1 / n);
        if (Number.isFinite(r) && r < 6) {
          pts.push([r * Math.cos(theta), r * Math.sin(theta)]);
        }
      }
      drawPath(ctx, pts, W, H, scale, this.color);
    }
  },
  {
    name: "摆线族",
    expr: "x = (R-r)cosθ + d·cos((R-r)θ/r),  y = …",
    color: "#b388ff",
    duration: 8,
    render(ctx, t, W, H, scale) {
      const R = 1;
      const r = 0.15 + (t / 8) * 0.75;
      const d = 0.6 + 0.5 * Math.sin(t * 1.2);
      const pts = [];
      const steps = 2500;
      const k = (R - r) / r;
      const turns = Math.max(2, Math.ceil(k * 2));
      for (let i = 0; i <= steps; i++) {
        const theta = (i / steps) * Math.PI * 2 * turns;
        const x = (R - r) * Math.cos(theta) + d * Math.cos(k * theta);
        const y = (R - r) * Math.sin(theta) - d * Math.sin(k * theta);
        pts.push([x, y]);
      }
      drawPath(ctx, pts, W, H, scale, this.color);
    }
  },
  {
    name: "双纽线族",
    expr: "(x²+y²)² = a²(x² − y²) + b·x(x²+y²)",
    color: "#ff8a80",
    duration: 8,
    render(ctx, t, W, H, scale) {
      const a = 1;
      const b = 0.5 * Math.sin(t * 0.8);
      const pts = [];
      const steps = 1800;
      for (let i = 0; i <= steps; i++) {
        const theta = (i / steps) * Math.PI * 2;
        const r2 = a * a * Math.cos(2 * theta) + b * Math.cos(theta);
        if (r2 >= 0) {
          const r = Math.sqrt(r2);
          pts.push([r * Math.cos(theta), r * Math.sin(theta)]);
        }
      }
      drawPath(ctx, pts, W, H, scale, this.color);
    }
  },
  {
    name: "心脏线 / 克莱线",
    expr: "r = 2a(1 + cosθ) · κ(t)",
    color: "#ff5252",
    duration: 8,
    render(ctx, t, W, H, scale) {
      const a = 0.5;
      const kappa = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 0.7));
      const pts = [];
      const steps = 1200;
      for (let i = 0; i <= steps; i++) {
        const theta = (i / steps) * Math.PI * 2;
        const r = 2 * a * (1 + Math.cos(theta)) * kappa + 0.4 * Math.cos(3 * theta);
        pts.push([r * Math.cos(theta), r * Math.sin(theta)]);
      }
      drawPath(ctx, pts, W, H, scale, this.color);
    }
  },
  {
    name: "内 / 外摆线",
    expr: "x = (R∓r)cosθ ± r·cos((R∓r)θ/r)",
    color: "#69f0ae",
    duration: 8,
    render(ctx, t, W, H, scale) {
      const R = 5;
      const r = 1 + Math.floor(t / 2) % 5;
      const inner = (Math.floor(t / 2) % 2) === 0;
      const pts = [];
      const steps = 2200;
      const k = inner ? (R - r) / r : (R + r) / r;
      const turns = Math.max(2, Math.ceil(k));
      for (let i = 0; i <= steps; i++) {
        const theta = (i / steps) * Math.PI * 2 * turns;
        let x, y;
        if (inner) {
          x = (R - r) * Math.cos(theta) + r * Math.cos(k * theta);
          y = (R - r) * Math.sin(theta) - r * Math.sin(k * theta);
        } else {
          x = (R + r) * Math.cos(theta) - r * Math.cos(k * theta);
          y = (R + r) * Math.sin(theta) - r * Math.sin(k * theta);
        }
        pts.push([x / R, y / R]);
      }
      drawPath(ctx, pts, W, H, scale, this.color);
    }
  },
  {
    name: "螺旋 · 玫瑰叠加",
    expr: "r = a + bθ  ⊕  cos(kθ)",
    color: "#40c4ff",
    duration: 8,
    render(ctx, t, W, H, scale) {
      const a = 0.2;
      const b = 0.04 + (t / 8) * 0.10;
      const k = 2 + Math.floor(t / 2) % 5;
      const pts = [];
      const steps = 3000;
      const maxTheta = Math.PI * 8;
      for (let i = 0; i <= steps; i++) {
        const theta = (i / steps) * maxTheta;
        const r = (a + b * theta) * (0.7 + 0.3 * Math.cos(k * theta));
        pts.push([r * Math.cos(theta), r * Math.sin(theta)]);
      }
      drawPath(ctx, pts, W, H, scale, this.color);
    }
  }
];

// ─── 双层描边绘制 ──────────────────────────────────────────
function drawPath(ctx, pts, W, H, scale, color) {
  if (pts.length < 2) return;
  ctx.save();
  ctx.translate(W / 2, H / 2);
  const s = scale * Math.min(W, H) * 0.42;
  ctx.scale(s, s);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.lineWidth = 3.2 / s;
  ctx.strokeStyle = color;
  ctx.globalAlpha = 0.18;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.lineWidth = 1.8 / s;
  ctx.strokeStyle = color;
  ctx.globalAlpha = 0.95;
  ctx.stroke();

  ctx.restore();
}

// ─── 离屏确定性采样（供 runModelChecks 使用） ─────────────
function sampleCurve(index, animTime) {
  const curve = CURVES[index];
  const pts = [];
  const ctx2 = null;
  const W = 800, H = 600, scale = 1.0;
  const steps = 200;
  if (index === 0) {
    const k = 0.5 + (animTime / 8) * 7.5;
    const turns = (k < 1.5) ? 2 : (Math.floor(k) === k ? 1 : 2);
    for (let i = 0; i <= steps; i++) {
      const theta = (i / steps) * Math.PI * 2 * turns;
      const r = Math.cos(k * theta);
      pts.push([r * Math.cos(theta), r * Math.sin(theta)]);
    }
  } else if (index === 1) {
    const ratios = [[1,1],[1,2],[3,4],[5,6]];
    const idx = Math.floor(animTime / 2) % ratios.length;
    const [a, b] = ratios[idx];
    const delta = (animTime / 8) * Math.PI * 2;
    for (let i = 0; i <= steps; i++) {
      const u = (i / steps) * Math.PI * 2;
      pts.push([Math.sin(a * u + delta), Math.sin(b * u)]);
    }
  } else if (index === 2) {
    const m = 0.5 + (animTime / 8) * 11.5;
    const n = 2 + 1.8 * Math.sin(animTime * 0.9);
    for (let i = 0; i <= steps; i++) {
      const theta = (i / steps) * Math.PI * 2;
      const p1 = Math.pow(Math.abs(Math.cos(m * theta / 4)), n);
      const p2 = Math.pow(Math.abs(Math.sin(m * theta / 4)), n);
      const r = Math.pow(p1 + p2, -1 / n);
      if (Number.isFinite(r) && r < 6) {
        pts.push([r * Math.cos(theta), r * Math.sin(theta)]);
      }
    }
  } else if (index === 3) {
    const R = 1;
    const r = 0.15 + (animTime / 8) * 0.75;
    const d = 0.6 + 0.5 * Math.sin(animTime * 1.2);
    const k = (R - r) / r;
    const turns = Math.max(2, Math.ceil(k * 2));
    for (let i = 0; i <= steps; i++) {
      const theta = (i / steps) * Math.PI * 2 * turns;
      const x = (R - r) * Math.cos(theta) + d * Math.cos(k * theta);
      const y = (R - r) * Math.sin(theta) - d * Math.sin(k * theta);
      pts.push([x, y]);
    }
  } else if (index === 4) {
    const a = 1;
    const b = 0.5 * Math.sin(animTime * 0.8);
    for (let i = 0; i <= steps; i++) {
      const theta = (i / steps) * Math.PI * 2;
      const r2 = a * a * Math.cos(2 * theta) + b * Math.cos(theta);
      if (r2 >= 0) {
        const r = Math.sqrt(r2);
        pts.push([r * Math.cos(theta), r * Math.sin(theta)]);
      }
    }
  } else if (index === 5) {
    const a = 0.5;
    const kappa = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(animTime * 0.7));
    for (let i = 0; i <= steps; i++) {
      const theta = (i / steps) * Math.PI * 2;
      const r = 2 * a * (1 + Math.cos(theta)) * kappa + 0.4 * Math.cos(3 * theta);
      pts.push([r * Math.cos(theta), r * Math.sin(theta)]);
    }
  } else if (index === 6) {
    const R = 5;
    const r = 1 + Math.floor(animTime / 2) % 5;
    const inner = (Math.floor(animTime / 2) % 2) === 0;
    const k = inner ? (R - r) / r : (R + r) / r;
    const turns = Math.max(2, Math.ceil(k));
    for (let i = 0; i <= steps; i++) {
      const theta = (i / steps) * Math.PI * 2 * turns;
      let x, y;
      if (inner) {
        x = (R - r) * Math.cos(theta) + r * Math.cos(k * theta);
        y = (R - r) * Math.sin(theta) - r * Math.sin(k * theta);
      } else {
        x = (R + r) * Math.cos(theta) - r * Math.cos(k * theta);
        y = (R + r) * Math.sin(theta) - r * Math.sin(k * theta);
      }
      pts.push([x / R, y / R]);
    }
  } else if (index === 7) {
    const a = 0.2;
    const b = 0.04 + (animTime / 8) * 0.10;
    const k = 2 + Math.floor(animTime / 2) % 5;
    const maxTheta = Math.PI * 8;
    for (let i = 0; i <= steps; i++) {
      const theta = (i / steps) * maxTheta;
      const r = (a + b * theta) * (0.7 + 0.3 * Math.cos(k * theta));
      pts.push([r * Math.cos(theta), r * Math.sin(theta)]);
    }
  }
  return pts;
}

// ─── 状态 ──────────────────────────────────────────────────
const state = {
  running: true,
  speed: 1,
  currentIndex: 0,
  segmentElapsed: 0,
  totalElapsed: 0,
  lastTimestamp: null,
  fadeAlpha: 0,
  phase: "fade-in",
  phaseTimer: 0,
  pendingIndex: -1
};

const SEGMENT_DURATION = 8;
const FADE_DURATION = 0.5;

// ─── DOM ───────────────────────────────────────────────────
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
const formulaOverlay = document.getElementById("formulaOverlay");
const formulaName = document.getElementById("formulaName");
const formulaExpr = document.getElementById("formulaExpr");
const progressFill = document.getElementById("progressFill");
const speedGroup = document.getElementById("speedGroup");
const curveGroup = document.getElementById("curveGroup");
const statusEl = document.getElementById("status");
const indexReadout = document.getElementById("indexReadout");
const elapsedReadout = document.getElementById("elapsedReadout");
const speedReadout = document.getElementById("speedReadout");
const phaseReadout = document.getElementById("phaseReadout");
const insightEl = document.getElementById("insight");
const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const resetBtn = document.getElementById("resetBtn");

// ─── 构建底部曲线切换按钮 ──────────────────────────────────
const curveBtns = [];
CURVES.forEach((curve, i) => {
  const btn = document.createElement("button");
  btn.className = "btn btn-num" + (i === 0 ? " active" : "");
  btn.type = "button";
  btn.textContent = String(i + 1);
  btn.title = curve.name;
  btn.setAttribute("aria-label", `跳转到第 ${i + 1} 条：${curve.name}`);
  btn.addEventListener("click", () => jumpTo(i));
  curveGroup.appendChild(btn);
  curveBtns.push(btn);
});

// ─── 速率按钮 ──────────────────────────────────────────────
speedGroup.querySelectorAll("[data-speed]").forEach(btn => {
  btn.addEventListener("click", () => {
    const sp = parseFloat(btn.dataset.speed);
    setParameters({ speed: sp });
    speedGroup.querySelectorAll("[data-speed]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  });
});

// ─── Canvas 尺寸适配 ──────────────────────────────────────
function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.floor(rect.width * dpr));
  canvas.height = Math.max(1, Math.floor(rect.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resizeCanvas);

// ─── 跳转到指定曲线 ────────────────────────────────────────
function jumpTo(index) {
  if (index === state.currentIndex) return;
  state.pendingIndex = index;
  if (state.phase !== "fade-out") {
    state.phase = "fade-out";
    state.phaseTimer = 0;
  }
}

// ─── 更新公式覆盖层 ───────────────────────────────────────
function updateFormulaOverlay() {
  const curve = CURVES[state.currentIndex];
  formulaName.textContent = curve.name;
  formulaExpr.textContent = curve.expr;
}

// ─── 段切换 ────────────────────────────────────────────────
function startSegment(index) {
  state.currentIndex = index;
  state.segmentElapsed = 0;
  state.phase = "fade-in";
  state.phaseTimer = 0;
  state.fadeAlpha = 0;
  updateFormulaOverlay();
  curveBtns.forEach((b, i) => b.classList.toggle("active", i === index));
}

// ─── 运行时契约 ────────────────────────────────────────────
function init() {
  resizeCanvas();
  bindControls();
  startSegment(0);
  requestAnimationFrame(frame);
}

function start() {
  state.running = true;
  statusEl.textContent = "运行中";
  startBtn.setAttribute("aria-pressed", "true");
}

function pause() {
  state.running = false;
  statusEl.textContent = "已暂停";
  startBtn.setAttribute("aria-pressed", "false");
}

function reset() {
  pause();
  state.currentIndex = 0;
  state.segmentElapsed = 0;
  state.totalElapsed = 0;
  state.lastTimestamp = null;
  state.fadeAlpha = 0;
  state.phase = "fade-in";
  state.phaseTimer = 0;
  state.pendingIndex = -1;
  state.speed = 1;
  speedGroup.querySelectorAll("[data-speed]").forEach(b => b.classList.remove("active"));
  const oneBtn = speedGroup.querySelector('[data-speed="1"]');
  if (oneBtn) oneBtn.classList.add("active");
  startSegment(0);
  render();
}

function update(dt) {
  if (!state.running) return;
  const boundedDt = Math.min(Math.max(dt, 0), 0.05);
  const sdt = boundedDt * state.speed;
  state.segmentElapsed += sdt;
  state.totalElapsed += sdt;
  state.phaseTimer += sdt;

  const effectiveDuration = SEGMENT_DURATION;
  const fadeTime = FADE_DURATION;

  if (state.phase === "fade-in") {
    state.fadeAlpha = Math.min(1, state.phaseTimer / fadeTime);
    if (state.phaseTimer >= fadeTime) {
      state.phase = "hold";
      state.phaseTimer = 0;
    }
  } else if (state.phase === "hold") {
    state.fadeAlpha = 1;
    const holdDuration = effectiveDuration - 2 * fadeTime;
    if (state.phaseTimer >= holdDuration) {
      state.phase = "fade-out";
      state.phaseTimer = 0;
    }
  } else if (state.phase === "fade-out") {
    state.fadeAlpha = Math.max(0, 1 - state.phaseTimer / fadeTime);
    if (state.phaseTimer >= fadeTime) {
      const next = state.pendingIndex >= 0 ? state.pendingIndex : (state.currentIndex + 1) % CURVES.length;
      state.pendingIndex = -1;
      startSegment(next);
    }
  }
}

function render() {
  const W = canvas.clientWidth;
  const H = canvas.clientHeight;
  if (W === 0 || H === 0) return;

  ctx.fillStyle = "#000000";
  ctx.fillRect(0, 0, W, H);

  const curve = CURVES[state.currentIndex];
  const animTime = state.segmentElapsed;
  const scale = 1.0;

  ctx.save();
  ctx.globalAlpha = state.fadeAlpha;
  curve.render(ctx, animTime, W, H, scale);
  ctx.restore();

  formulaOverlay.style.opacity = state.fadeAlpha.toFixed(3);

  const progress = Math.min(1, state.segmentElapsed / SEGMENT_DURATION);
  progressFill.style.width = (progress * 100).toFixed(2) + "%";

  // 读数
  indexReadout.textContent = `${state.currentIndex + 1} / ${CURVES.length}`;
  elapsedReadout.textContent = `${state.segmentElapsed.toFixed(1)} s`;
  speedReadout.textContent = `${state.speed.toFixed(1)}x`;
  const phaseLabels = { "fade-in": "淡入", "hold": "保持", "fade-out": "淡出" };
  phaseReadout.textContent = phaseLabels[state.phase] || state.phase;

  // 洞察
  const curveName = CURVES[state.currentIndex].name;
  if (!state.running) {
    insightEl.textContent = `已暂停：${curveName}（第 ${state.currentIndex + 1} 条）。按播放继续，或按数字按钮跳转。`;
  } else if (state.phase === "fade-in") {
    insightEl.textContent = `淡入中：${curveName} 正在显现，参数随段内时间连续变化。`;
  } else if (state.phase === "hold") {
    insightEl.textContent = `保持中：${curveName} 的参数仍在演化，观察形态如何呼吸。`;
  } else {
    insightEl.textContent = `淡出中：${curveName} 即将让位给下一条曲线。`;
  }
}

function setParameters(values) {
  if (values.speed !== undefined) {
    const sp = Number(values.speed);
    if (Number.isFinite(sp) && [0.5, 1, 2, 4].includes(sp)) {
      state.speed = sp;
    }
  }
}

function getState() {
  return {
    running: state.running,
    speed: state.speed,
    currentIndex: state.currentIndex,
    segmentElapsed: state.segmentElapsed,
    totalElapsed: state.totalElapsed,
    fadeAlpha: state.fadeAlpha,
    phase: state.phase,
    phaseTimer: state.phaseTimer,
    pendingIndex: state.pendingIndex
  };
}

function getReadouts() {
  return {
    index: state.currentIndex,
    name: CURVES[state.currentIndex].name,
    segmentElapsed: state.segmentElapsed,
    speed: state.speed,
    phase: state.phase,
    fadeAlpha: state.fadeAlpha,
    progress: Math.min(1, state.segmentElapsed / SEGMENT_DURATION)
  };
}

function bindControls() {
  startBtn.addEventListener("click", start);
  pauseBtn.addEventListener("click", pause);
  resetBtn.addEventListener("click", reset);
}

// ─── 主循环 ────────────────────────────────────────────────
function frame(timestamp) {
  if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
  let dt = (timestamp - state.lastTimestamp) / 1000;
  state.lastTimestamp = timestamp;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

// ─── 模型检查 ──────────────────────────────────────────────
function runModelChecks() {
  const results = [];

  // 1. 曲线数量
  results.push({
    name: "curve count",
    pass: CURVES.length === 8,
    expected: 8,
    actual: CURVES.length,
    tolerance: "exact"
  });

  // 2. 段时长
  results.push({
    name: "segment duration",
    pass: SEGMENT_DURATION === 8,
    expected: 8,
    actual: SEGMENT_DURATION,
    tolerance: "exact"
  });

  // 3. 速率合法值
  results.push({
    name: "speed in legal set",
    pass: [0.5, 1, 2, 4].includes(state.speed),
    expected: "0.5/1/2/4",
    actual: state.speed,
    tolerance: "set"
  });

  // 4. 索引边界
  results.push({
    name: "index bounds",
    pass: state.currentIndex >= 0 && state.currentIndex < CURVES.length,
    expected: "0..7",
    actual: state.currentIndex,
    tolerance: "range"
  });

  // 5. 淡入淡出 alpha 边界
  results.push({
    name: "fade alpha bounds",
    pass: state.fadeAlpha >= 0 && state.fadeAlpha <= 1,
    expected: "[0,1]",
    actual: state.fadeAlpha,
    tolerance: "range"
  });

  // 6. 确定性：同一 (index, animTime) 两次采样应完全一致
  const t0 = 3.5;
  const ptsA = sampleCurve(0, t0);
  const ptsB = sampleCurve(0, t0);
  let detPass = ptsA.length === ptsB.length;
  if (detPass) {
    for (let i = 0; i < ptsA.length; i++) {
      if (ptsA[i][0] !== ptsB[i][0] || ptsA[i][1] !== ptsB[i][1]) {
        detPass = false;
        break;
      }
    }
  }
  results.push({
    name: "deterministic sampling (same input → same output)",
    pass: detPass,
    expected: "identical point arrays",
    actual: detPass ? "identical" : "differ",
    tolerance: "exact"
  });

  // 7. 参数单调性：玫瑰线 k 随 animTime 单调递增
  const kStart = 0.5 + (0 / 8) * 7.5;
  const kEnd = 0.5 + (8 / 8) * 7.5;
  results.push({
    name: "rose k monotonic increase over segment",
    pass: kEnd > kStart,
    expected: "k(8) > k(0)",
    actual: `k(0)=${kStart.toFixed(3)}, k(8)=${kEnd.toFixed(3)}`,
    tolerance: "strict"
  });

  // 8. 有限性：所有曲线在 t=4 时采样点应有限
  let allFinite = true;
  for (let ci = 0; ci < CURVES.length; ci++) {
    const pts = sampleCurve(ci, 4);
    for (const p of pts) {
      if (!Number.isFinite(p[0]) || !Number.isFinite(p[1])) {
        allFinite = false;
        break;
      }
    }
    if (!allFinite) break;
  }
  results.push({
    name: "all curves finite at t=4",
    pass: allFinite,
    expected: "all coordinates finite",
    actual: allFinite ? "finite" : "contains non-finite",
    tolerance: "finite"
  });

  // 9. 速率缩放不变性：update(dt*2, speed=0.5) 与 update(dt, speed=1) 推进相同
  //    （通过独立模拟验证）
  function simulateAdvance(startState, realDt, speed, steps) {
    let seg = startState.segmentElapsed;
    let phaseT = startState.phaseTimer;
    let phase = startState.phase;
    let fade = startState.fadeAlpha;
    const fadeT = FADE_DURATION;
    const holdDur = SEGMENT_DURATION - 2 * FADE_DURATION;
    for (let s = 0; s < steps; s++) {
      const sdt = realDt * speed;
      seg += sdt;
      phaseT += sdt;
      if (phase === "fade-in") {
        fade = Math.min(1, phaseT / fadeT);
        if (phaseT >= fadeT) { phase = "hold"; phaseT = 0; }
      } else if (phase === "hold") {
        fade = 1;
        if (phaseT >= holdDur) { phase = "fade-out"; phaseT = 0; }
      } else if (phase === "fade-out") {
        fade = Math.max(0, 1 - phaseT / fadeT);
      }
    }
    return { segmentElapsed: seg, fadeAlpha: fade, phase };
  }
  const baseStart = { segmentElapsed: 1.0, phaseTimer: 0.5, phase: "hold", fadeAlpha: 1 };
  const r1 = simulateAdvance(baseStart, 0.016, 1.0, 60);
  const r2 = simulateAdvance(baseStart, 0.032, 0.5, 60);
  const scaleInvariant = Math.abs(r1.segmentElapsed - r2.segmentElapsed) < 1e-9;
  results.push({
    name: "speed scaling invariance (dt×2, speed×0.5 → same advance)",
    pass: scaleInvariant,
    expected: `segmentElapsed ≈ ${r1.segmentElapsed.toFixed(6)}`,
    actual: r2.segmentElapsed.toFixed(6),
    tolerance: 1e-9
  });

  // 10. 暂停冻结：running=false 时 update 不推进
  const beforePause = { segmentElapsed: state.segmentElapsed, totalElapsed: state.totalElapsed };
  const wasRunning = state.running;
  state.running = false;
  update(0.1);
  const frozen = (state.segmentElapsed === beforePause.segmentElapsed && state.totalElapsed === beforePause.totalElapsed);
  state.running = wasRunning;
  results.push({
    name: "pause freezes time evolution",
    pass: frozen,
    expected: "no advance when running=false",
    actual: frozen ? "frozen" : "advanced",
    tolerance: "exact"
  });

  return results;
}

// ─── 暴露接口 ──────────────────────────────────────────────
window.simulation = {
  init,
  start,
  pause,
  reset,
  update,
  render,
  setParameters,
  getState,
  getReadouts,
  runModelChecks,
  jumpTo,
  setSpeed: (s) => setParameters({ speed: s })
};

init();
})();
</script>
</body>
</html>
