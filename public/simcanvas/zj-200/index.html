<!doctype html>
<html lang="zh">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gothic Rose Window</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #050810;
  --sim-surface: #0a0f1c;
  --sim-surface-soft: #0d1424;
  --sim-text: #e8d9a0;
  --sim-muted: #8a7a4a;
  --sim-border: #1a2238;
  --sim-grid: #0f1626;
  --sim-accent: #d4af37;
  --sim-accent-deep: #8a6d18;
  --sim-accent-soft: #2a2410;
  --sim-positive: #d4af37;
  --sim-warning: #c9a227;
  --sim-danger: #8b1a1a;
  --sim-radius-sm: 8px;
  --sim-radius-md: 12px;
  --sim-radius-lg: 16px;
  --sim-shadow: 0 0 40px rgba(0,0,0,0.6);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--sim-bg);
  font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
}
body { color: var(--sim-text); }

.app {
  width: 100vw; height: 100vh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: var(--sim-space-2);
  padding: var(--sim-space-3) var(--sim-space-4);
  overflow: hidden;
}

/* HEADER */
.header {
  display: flex; justify-content: space-between; align-items: center;
  gap: var(--sim-space-4); min-height: 44px;
}
.header h1 {
  font-size: clamp(1.1rem, 2.2vw, 1.5rem);
  letter-spacing: 0.02em; line-height: 1.1;
  color: var(--sim-accent);
  text-shadow: 0 0 14px rgba(212,175,55,0.25);
}
.header p {
  margin: 2px 0 0; color: var(--sim-muted); font-size: 0.78rem;
}
.status {
  border: 1px solid rgba(212,175,55,0.28);
  border-radius: 999px; padding: 6px 14px;
  background: rgba(212,175,55,0.08);
  color: var(--sim-accent);
  font-weight: 700; font-size: 0.78rem; white-space: nowrap;
}

/* MAIN */
.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: var(--sim-space-3); }
.stage-panel {
  position: relative; min-height: 0;
  border: 1px solid rgba(212,175,55,0.14);
  border-radius: var(--sim-radius-md);
  overflow: hidden; background: var(--sim-surface);
}
#canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

.side { min-height: 0; display: grid; grid-template-rows: auto auto auto; gap: var(--sim-space-3); align-content: start; }
.panel {
  background: rgba(10,15,28,0.72);
  border: 1px solid rgba(212,175,55,0.14);
  border-radius: var(--sim-radius-md);
  padding: var(--sim-space-3);
}
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.panel-head h2 { margin: 0; font-size: 0.82rem; color: var(--sim-accent); letter-spacing: 0.02em; }
.panel-head span { color: var(--sim-muted); font-size: 0.66rem; }

.readout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.metric {
  padding: 10px;
  border: 1px solid rgba(212,175,55,0.10);
  border-radius: var(--sim-radius-sm);
  background: rgba(13,20,36,0.6);
}
.metric small { display: block; margin-bottom: 3px; color: var(--sim-muted); font-size: 0.64rem; }
.metric strong { font-size: 1.05rem; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; color: var(--sim-text); }

.insight {
  padding: 10px 12px;
  border-left: 3px solid var(--sim-warning);
  border-radius: 0 var(--sim-radius-sm) var(--sim-radius-sm) 0;
  background: rgba(201,162,39,0.08);
  color: #e8c970; font-weight: 600; font-size: 0.76rem; line-height: 1.45;
}
.model-note p { margin: 0; color: var(--sim-muted); line-height: 1.5; font-size: 0.72rem; }
.model-note .formula-inline {
  display: block; margin-top: 6px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  color: rgba(212,175,55,0.55); font-size: 0.7rem;
}

/* CONTROLS */
.controls {
  display: grid;
  grid-template-columns: auto minmax(140px, 1fr) minmax(140px, 1fr);
  gap: var(--sim-space-4);
  align-items: center;
  padding: 10px 14px;
  border: 1px solid rgba(212,175,55,0.14);
  border-radius: var(--sim-radius-md);
  background: rgba(10,15,28,0.72);
}
.actions { display: flex; gap: 6px; }
button {
  border: 1px solid rgba(212,175,55,0.22);
  border-radius: var(--sim-radius-sm);
  padding: 7px 12px;
  color: var(--sim-text);
  background: rgba(13,20,36,0.6);
  cursor: pointer; font-weight: 700; font-size: 0.78rem;
  transition: transform .16s ease, background .16s ease, border-color .16s ease;
}
button:hover { border-color: rgba(212,175,55,0.5); background: rgba(20,28,48,0.7); }
button:active { transform: scale(.97); }
button.primary {
  border-color: var(--sim-accent-deep);
  color: #0a0f1c;
  background: linear-gradient(135deg, var(--sim-accent), var(--sim-accent-deep));
}
button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25); }
button:focus-visible { outline: 2px solid rgba(212,175,55,0.5); outline-offset: 2px; }

.control label { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 4px; font-size: 0.72rem; font-weight: 700; color: var(--sim-text); }
.control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--sim-accent); }

@media (max-width: 860px) {
  .app { height: auto; min-height: 100vh; overflow: visible; padding: 10px; }
  .main { grid-template-columns: 1fr; }
  .stage-panel { min-height: 0; aspect-ratio: 1 / 1; }
  .controls { grid-template-columns: 1fr; }
  .side { grid-template-rows: auto auto auto; }
}
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>Gothic Rose Window</h1>
      <p>动态哥特式玫瑰窗 · 日光扫掠照亮宝石玻璃</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">Running</div>
  </header>

  <main class="main">
    <section class="stage-panel" data-region="stage" aria-label="玫瑰窗主舞台">
      <canvas id="canvas" aria-label="动态哥特式玫瑰窗"></canvas>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel readouts" aria-label="实时读数">
        <div class="panel-head"><h2>Live values</h2><span>模拟时钟与光照</span></div>
        <div class="readout-grid">
          <div class="metric"><small>Time</small><strong id="timeReadout">0.00 s</strong></div>
          <div class="metric"><small>Light angle</small><strong id="angleReadout">0°</strong></div>
        </div>
      </section>

      <section class="panel model-note" data-region="insight">
        <div class="panel-head"><h2>Model</h2><span>极坐标花瓣轮廓</span></div>
        <div id="insight" class="insight">日光缓慢扫过窗面，被照一侧的宝石玻璃亮起，背光一侧沉入深色。</div>
        <p>外圈 12 尖拱窗瓣沿极坐标曲线分布；中圈 24 分区环带；中心 8 瓣小花自转。</p>
        <span class="formula-inline">r = R · (0.85 + 0.15 · cos 12θ)</span>
      </section>
    </aside>
  </main>

  <section class="controls" data-region="controls" aria-label="模拟控制">
    <div class="actions">
      <button id="startBtn" class="primary" type="button" aria-pressed="true">Start</button>
      <button id="pauseBtn" type="button">Pause</button>
      <button id="resetBtn" type="button">Reset</button>
    </div>
    <div class="control">
      <label for="speedInput">Time scale <output id="speedOutput">1.0×</output></label>
      <input id="speedInput" type="range" min="0.1" max="4" step="0.1" value="1">
    </div>
    <div class="control">
      <label for="petalModInput">Petal count <output id="petalModOutput">12</output></label>
      <input id="petalModInput" type="range" min="6" max="18" step="1" value="12">
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const speedInput = document.getElementById('speedInput');
  const speedOutput = document.getElementById('speedOutput');
  const petalModInput = document.getElementById('petalModInput');
  const petalModOutput = document.getElementById('petalModOutput');
  const statusEl = document.getElementById('status');
  const timeReadout = document.getElementById('timeReadout');
  const angleReadout = document.getElementById('angleReadout');
  const insightEl = document.getElementById('insight');

  const parameterSchema = [
    { key: "speed", label: "Time scale", type: "slider", min: 0.1, max: 4, step: 0.1, default: 1, unit: "×" },
    { key: "petalMod", label: "Petal count", type: "slider", min: 6, max: 18, step: 1, default: 12, unit: "" }
  ];

  // 宝石色板：按分区函数取色
  const JEWEL = [
    { r: 38,  g: 92,  b: 178 },
    { r: 142, g: 36,  b: 62  },
    { r: 88,  g: 42,  b: 138 },
    { r: 36,  g: 118, b: 132 },
    { r: 168, g: 110, b: 42  },
    { r: 72,  g: 58,  b: 120 },
  ];

  function srand(seed) {
    let s = seed | 0;
    return () => {
      s = (s * 1664525 + 1013904223) | 0;
      return ((s >>> 0) % 10000) / 10000;
    };
  }

  const state = {
    running: true,
    time: 0,
    lastTs: null,
    dpr: 1,
    cx: 0, cy: 0, R: 0,
    textures: [],
    speed: 1,
    petalMod: 12,
  };

  function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
  function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

  function resize() {
    state.dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(1, rect.width);
    const h = Math.max(1, rect.height);
    canvas.width = Math.floor(w * state.dpr);
    canvas.height = Math.floor(h * state.dpr);
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    state.cx = w / 2;
    state.cy = h / 2;
    state.R = Math.min(w, h) * 0.4;
    rebuildTextures();
  }

  function rebuildTextures() {
    state.textures = [];
    for (let i = 0; i < JEWEL.length; i++) {
      const tex = document.createElement('canvas');
      tex.width = 128; tex.height = 128;
      const tctx = tex.getContext('2d');
      const c = JEWEL[i];
      const rng = srand(1000 + i * 37);
      for (let n = 0; n < 220; n++) {
        const x = rng() * 128;
        const y = rng() * 128;
        const r = rng() * 1.8 + 0.3;
        const a = rng() * 0.18 + 0.04;
        tctx.fillStyle = `rgba(${c.r},${c.g},${c.b},${a})`;
        tctx.beginPath();
        tctx.arc(x, y, r, 0, Math.PI * 2);
        tctx.fill();
      }
      for (let n = 0; n < 8; n++) {
        tctx.strokeStyle = `rgba(${Math.min(255,c.r+60)},${Math.min(255,c.g+60)},${Math.min(255,c.b+60)},0.06)`;
        tctx.lineWidth = 0.6;
        tctx.beginPath();
        const x0 = rng() * 128, y0 = rng() * 128;
        tctx.moveTo(x0, y0);
        tctx.lineTo(x0 + (rng()-0.5)*40, y0 + (rng()-0.5)*40);
        tctx.stroke();
      }
      state.textures.push(tex);
    }
  }

  function petalR(theta, R) {
    const m = state.petalMod;
    return R * (0.85 + 0.15 * Math.cos(m * theta));
  }

  function drawPetal(R, k, N, opts) {
    const { fill = true, fillColor = null, alpha = 1, stroke = true, goldW = 1.5, goldA = 0.85, texture = null } = opts;
    const a0 = (k / N) * Math.PI * 2 - Math.PI / 2;
    const a1 = ((k + 1) / N) * Math.PI * 2 - Math.PI / 2;
    const steps = 40;
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const th = a0 + (a1 - a0) * t;
      const r = petalR(th, R);
      const x = state.cx + r * Math.cos(th);
      const y = state.cy + r * Math.sin(th);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.lineTo(state.cx, state.cy);
    ctx.closePath();

    if (fill) {
      if (texture) {
        ctx.save();
        ctx.clip();
        if (fillColor) {
          ctx.fillStyle = fillColor;
          ctx.globalAlpha = alpha;
          ctx.fill();
          ctx.globalAlpha = 1;
        }
        const pat = ctx.createPattern(texture, 'repeat');
        ctx.fillStyle = pat;
        ctx.globalAlpha = alpha * 0.9;
        ctx.fillRect(state.cx - R, state.cy - R, R * 2, R * 2);
        ctx.globalAlpha = 1;
        ctx.restore();
      } else if (fillColor) {
        ctx.fillStyle = fillColor;
        ctx.globalAlpha = alpha;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    if (stroke) {
      ctx.strokeStyle = `rgba(212, 175, 55, ${goldA})`;
      ctx.lineWidth = goldW;
      ctx.stroke();
    }
  }

  function drawRingSlice(rInner, rOuter, k, N, opts) {
    const { fill = true, fillColor = null, alpha = 1, stroke = true, goldW = 1.2, goldA = 0.7, texture = null } = opts;
    const a0 = (k / N) * Math.PI * 2 - Math.PI / 2;
    const a1 = ((k + 1) / N) * Math.PI * 2 - Math.PI / 2;
    const steps = 24;
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const th = a0 + (a1 - a0) * t;
      const x = state.cx + rOuter * Math.cos(th);
      const y = state.cy + rOuter * Math.sin(th);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    for (let i = steps; i >= 0; i--) {
      const t = i / steps;
      const th = a0 + (a1 - a0) * t;
      const x = state.cx + rInner * Math.cos(th);
      const y = state.cy + rInner * Math.sin(th);
      ctx.lineTo(x, y);
    }
    ctx.closePath();

    if (fill) {
      if (texture) {
        ctx.save();
        ctx.clip();
        if (fillColor) {
          ctx.fillStyle = fillColor;
          ctx.globalAlpha = alpha;
          ctx.fill();
          ctx.globalAlpha = 1;
        }
        const pat = ctx.createPattern(texture, 'repeat');
        ctx.fillStyle = pat;
        ctx.globalAlpha = alpha * 0.85;
        ctx.fillRect(state.cx - rOuter, state.cy - rOuter, rOuter * 2, rOuter * 2);
        ctx.globalAlpha = 1;
        ctx.restore();
      } else if (fillColor) {
        ctx.fillStyle = fillColor;
        ctx.globalAlpha = alpha;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    if (stroke) {
      ctx.strokeStyle = `rgba(212, 175, 55, ${goldA})`;
      ctx.lineWidth = goldW;
      ctx.stroke();
    }
  }

  function drawCenterFlower(R, rotation, lightAngle) {
    const petalCount = 8;
    const petalLen = R * 0.18;
    const petalWid = R * 0.05;
    const steps = 24;

    for (let k = 0; k < petalCount; k++) {
      const baseA = (k / petalCount) * Math.PI * 2 + rotation;
      let d = ((baseA - lightAngle + Math.PI) % (Math.PI * 2)) - Math.PI;
      if (d < -Math.PI) d += Math.PI * 2;
      const lit = Math.max(0, Math.cos(d));

      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const th = t * Math.PI * 2;
        const localR = Math.sin(th) * petalLen;
        const localW = Math.sin(th / 2) * petalWid;
        const x = state.cx + localR * Math.cos(baseA) - localW * Math.sin(baseA);
        const y = state.cy + localR * Math.sin(baseA) + localW * Math.cos(baseA);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();

      const c = JEWEL[k % JEWEL.length];
      const baseA_alpha = 0.35 + lit * 0.55;
      ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},${baseA_alpha})`;
      ctx.fill();

      ctx.strokeStyle = `rgba(212, 175, 55, ${0.35 + lit * 0.3})`;
      ctx.lineWidth = 2.2;
      ctx.stroke();
      ctx.strokeStyle = `rgba(255, 230, 150, ${0.6 + lit * 0.35})`;
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(state.cx, state.cy, R * 0.025, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 220, 130, 0.7)`;
    ctx.fill();
    ctx.strokeStyle = `rgba(212, 175, 55, 0.9)`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawGoldCircle(r, w, alpha) {
    ctx.strokeStyle = `rgba(212, 175, 55, ${alpha * 0.3})`;
    ctx.lineWidth = w * 2.2;
    ctx.beginPath();
    ctx.arc(state.cx, state.cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = `rgba(255, 230, 150, ${alpha * 0.85})`;
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.arc(state.cx, state.cy, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  function normAngle(a) {
    let d = ((a + Math.PI) % (Math.PI * 2)) - Math.PI;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  function render() {
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(1, rect.width);
    const h = Math.max(1, rect.height);
    const R = state.R;

    const bg = ctx.createRadialGradient(state.cx, state.cy, 0, state.cx, state.cy, Math.max(w, h) * 0.7);
    bg.addColorStop(0, '#0a1024');
    bg.addColorStop(0.5, '#070b18');
    bg.addColorStop(1, '#03060e');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    const starRng = srand(42);
    ctx.fillStyle = 'rgba(255, 240, 200, 0.18)';
    for (let i = 0; i < 80; i++) {
      const sx = starRng() * w;
      const sy = starRng() * h;
      const sr = starRng() * 0.8 + 0.2;
      ctx.beginPath();
      ctx.arc(sx, sy, sr, 0, Math.PI * 2);
      ctx.fill();
    }

    const lightAngle = (state.time * (Math.PI * 2 / 60)) % (Math.PI * 2);

    const N = 12;
    for (let k = 0; k < N; k++) {
      const a0 = (k / N) * Math.PI * 2 - Math.PI / 2;
      const a1 = ((k + 1) / N) * Math.PI * 2 - Math.PI / 2;
      const centerA = (a0 + a1) / 2;
      const d = normAngle(centerA - lightAngle);
      const lit = Math.max(0, Math.cos(d));

      const c = JEWEL[k % JEWEL.length];
      const alpha = 0.18 + lit * 0.55;
      const fillColor = `rgba(${c.r},${c.g},${c.b},${alpha})`;
      const tex = state.textures[k % JEWEL.length];

      drawPetal(R, k, N, {
        fill: true, fillColor, alpha: 1, stroke: false, texture: tex
      });

      ctx.save();
      const steps = 40;
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const th = a0 + (a1 - a0) * t;
        const r = petalR(th, R);
        const x = state.cx + r * Math.cos(th);
        const y = state.cy + r * Math.sin(th);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.lineTo(state.cx, state.cy);
      ctx.closePath();
      ctx.strokeStyle = `rgba(212, 175, 55, ${0.28 + lit * 0.25})`;
      ctx.lineWidth = 2.6;
      ctx.stroke();
      ctx.strokeStyle = `rgba(255, 232, 160, ${0.65 + lit * 0.3})`;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    const ringInner = R * 0.5;
    const ringOuter = R * 0.62;
    const M = 24;
    for (let k = 0; k < M; k++) {
      const a0 = (k / M) * Math.PI * 2 - Math.PI / 2;
      const a1 = ((k + 1) / M) * Math.PI * 2 - Math.PI / 2;
      const centerA = (a0 + a1) / 2;
      const d = normAngle(centerA - lightAngle);
      const lit = Math.max(0, Math.cos(d));

      const c = JEWEL[(k + 2) % JEWEL.length];
      const alpha = 0.15 + lit * 0.5;
      const fillColor = `rgba(${c.r},${c.g},${c.b},${alpha})`;
      const tex = state.textures[(k + 2) % JEWEL.length];

      drawRingSlice(ringInner, ringOuter, k, M, {
        fill: true, fillColor, alpha: 1, stroke: false, texture: tex
      });

      ctx.save();
      const steps = 24;
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const th = a0 + (a1 - a0) * t;
        const x = state.cx + ringOuter * Math.cos(th);
        const y = state.cy + ringOuter * Math.sin(th);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      for (let i = steps; i >= 0; i--) {
        const t = i / steps;
        const th = a0 + (a1 - a0) * t;
        const x = state.cx + ringInner * Math.cos(th);
        const y = state.cy + ringInner * Math.sin(th);
        ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = `rgba(212, 175, 55, ${0.22 + lit * 0.22})`;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.strokeStyle = `rgba(255, 232, 160, ${0.55 + lit * 0.3})`;
      ctx.lineWidth = 0.7;
      ctx.stroke();
      ctx.restore();
    }

    drawGoldCircle(ringOuter, 1.4, 0.9);
    drawGoldCircle(ringInner, 1.2, 0.8);
    drawGoldCircle(R * 0.78, 1.6, 0.95);
    drawGoldCircle(R * 0.82, 1.0, 0.7);

    const flowerRot = (state.time * (Math.PI * 2 / 120)) % (Math.PI * 2);
    drawCenterFlower(R, flowerRot, lightAngle);

    const outerR = R * 1.02;
    const finialCount = 24;
    for (let k = 0; k < finialCount; k++) {
      const a = (k / finialCount) * Math.PI * 2 - Math.PI / 2;
      const d = normAngle(a - lightAngle);
      const lit = Math.max(0, Math.cos(d));
      const x = state.cx + outerR * Math.cos(a);
      const y = state.cy + outerR * Math.sin(a);
      const x2 = state.cx + (outerR + R * 0.04) * Math.cos(a);
      const y2 = state.cy + (outerR + R * 0.04) * Math.sin(a);
      ctx.strokeStyle = `rgba(212, 175, 55, ${0.4 + lit * 0.4})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x2, y2, R * 0.008, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 220, 130, ${0.5 + lit * 0.4})`;
      ctx.fill();
    }

    drawGoldCircle(R, 2.0, 1.0);
    drawGoldCircle(R * 1.01, 1.0, 0.5);

    // 读数与洞察
    const lightDeg = (lightAngle * 180 / Math.PI) % 360;
    timeReadout.textContent = `${state.time.toFixed(2)} s`;
    angleReadout.textContent = `${lightDeg.toFixed(0)}°`;
    speedOutput.textContent = `${state.speed.toFixed(1)}×`;
    petalModOutput.textContent = `${state.petalMod}`;

    if (!state.running) {
      statusEl.textContent = 'Paused';
      insightEl.textContent = '已暂停：日光静止，被照一侧仍亮，背光一侧仍暗。';
    } else {
      statusEl.textContent = 'Running';
      const phase = lightDeg / 360;
      if (phase < 0.25) {
        insightEl.textContent = '日光从右侧扫入，右侧宝石玻璃率先亮起。';
      } else if (phase < 0.5) {
        insightEl.textContent = '日光移向顶部，照亮上方窗瓣。';
      } else if (phase < 0.75) {
        insightEl.textContent = '日光扫向左侧，左侧宝石玻璃被点亮。';
      } else {
        insightEl.textContent = '日光回到下方，完成一轮扫掠。';
      }
    }
  }

  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05);
    state.time += boundedDt * state.speed;
    state.time = finite(state.time, 0);
  }

  function frame(ts) {
    if (state.lastTs === null) state.lastTs = ts;
    const dt = (ts - state.lastTs) / 1000;
    state.lastTs = ts;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  function start() {
    state.running = true;
    statusEl.textContent = 'Running';
    startBtn.setAttribute('aria-pressed', 'true');
  }
  function pause() {
    state.running = false;
    statusEl.textContent = 'Paused';
    startBtn.setAttribute('aria-pressed', 'false');
  }
  function reset() {
    pause();
    state.time = 0;
    state.lastTs = null;
    render();
  }
  function setParameters(values) {
    const speedDef = parameterSchema[0], petalDef = parameterSchema[1];
    state.speed = clamp(finite(Number(values.speed), speedDef.default), speedDef.min, speedDef.max);
    state.petalMod = clamp(Math.round(finite(Number(values.petalMod), petalDef.default)), petalDef.min, petalDef.max);
    speedInput.value = String(state.speed);
    petalModInput.value = String(state.petalMod);
    render();
  }
  function getState() {
    return { running: state.running, time: state.time, speed: state.speed, petalMod: state.petalMod, R: state.R };
  }
  function getReadouts() {
    return {
      time: state.time,
      lightAngle: (state.time * (Math.PI * 2 / 60)) % (Math.PI * 2),
      speed: state.speed,
      petalMod: state.petalMod
    };
  }
  function runModelChecks() {
    const R = 100;
    const m = state.petalMod;
    const check1 = Math.abs(petalR(0, R) - R * 1.0) < 1e-9;
    const halfPeriod = Math.PI / m;
    const check2 = Math.abs(petalR(halfPeriod, R) - R * 0.85) < 1e-9;
    const check3 = Math.abs(petalR(2 * halfPeriod, R) - R * 1.0) < 1e-9;
    const d1 = normAngle(0);
    const d2 = normAngle(Math.PI);
    const d3 = normAngle(Math.PI * 2);
    return [
      { name: 'petal r(0)=R', pass: check1, expected: R, actual: petalR(0, R), tolerance: 1e-9 },
      { name: 'petal r(π/m)=0.85R', pass: check2, expected: 0.85*R, actual: petalR(halfPeriod, R), tolerance: 1e-9 },
      { name: 'petal r(2π/m)=R', pass: check3, expected: R, actual: petalR(2*halfPeriod, R), tolerance: 1e-9 },
      { name: 'angle norm 0', pass: Math.abs(d1) < 1e-9, expected: 0, actual: d1, tolerance: 1e-9 },
      { name: 'angle norm π', pass: Math.abs(d2 - Math.PI) < 1e-9, expected: Math.PI, actual: d2, tolerance: 1e-9 },
      { name: 'angle norm 2π→0', pass: Math.abs(d3) < 1e-9, expected: 0, actual: d3, tolerance: 1e-9 },
    ];
  }

  function bindControls() {
    startBtn.addEventListener('click', start);
    pauseBtn.addEventListener('click', pause);
    resetBtn.addEventListener('click', reset);
    speedInput.addEventListener('input', () => setParameters({ speed: speedInput.value, petalMod: state.petalMod }));
    petalModInput.addEventListener('input', () => setParameters({ speed: state.speed, petalMod: petalModInput.value }));
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (state.running) pause(); else start();
      }
    });
  }

  function init() {
    resize();
    bindControls();
    setParameters({ speed: 1, petalMod: 12 });
    requestAnimationFrame(frame);
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 120);
  });

  window.simulation = {
    init, start, pause, reset, update, render,
    setParameters, getState, getReadouts, runModelChecks
  };

  init();
})();
</script>
</body>
</html>
