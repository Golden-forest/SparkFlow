<title>金属丝电阻率测量实验</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #0a0e1a;
  --sim-surface: #131a2e;
  --sim-surface-soft: #1a2238;
  --sim-text: #e8eefc;
  --sim-muted: #8b9bb8;
  --sim-border: #2a3450;
  --sim-grid: #1f2942;
  --sim-accent: #5eead4;
  --sim-accent-deep: #2dd4bf;
  --sim-accent-soft: #134e4a;
  --sim-positive: #5eead4;
  --sim-warning: #fbbf24;
  --sim-danger: #f87171;
  --sim-radius-sm: 8px;
  --sim-radius-md: 12px;
  --sim-radius-lg: 16px;
  --sim-shadow: 0 8px 24px rgba(0,0,0,0.4);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--sim-text);
  background: var(--sim-bg);
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.5;
}
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--sim-accent); outline-offset: 2px; }
.app {
  width: min(1400px, 100%);
  margin: 0 auto;
  padding: var(--sim-space-4);
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: var(--sim-space-3);
  min-height: 100vh;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--sim-space-4);
  flex-wrap: wrap;
}
.header h1 {
  margin: 0 0 var(--sim-space-1);
  font-size: clamp(1.3rem, 2.2vw, 1.8rem);
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.header p {
  margin: 0;
  color: var(--sim-muted);
  font-size: 0.85rem;
}
.status {
  border: 1px solid var(--sim-border);
  border-radius: 999px;
  padding: var(--sim-space-2) var(--sim-space-4);
  background: var(--sim-surface-soft);
  color: var(--sim-accent);
  font-weight: 700;
  white-space: nowrap;
  font-size: 0.85rem;
}
.main {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(320px, 1fr);
  gap: var(--sim-space-3);
  min-height: 0;
}
.panel {
  background: var(--sim-surface);
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-lg);
  box-shadow: var(--sim-shadow);
  overflow: hidden;
}
.scene-panel {
  padding: var(--sim-space-3);
  display: grid;
  grid-template-rows: auto 1fr;
  gap: var(--sim-space-2);
  min-height: 420px;
}
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--sim-space-3);
}
.panel-head h2 {
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
}
.panel-head span {
  color: var(--sim-muted);
  font-size: 0.75rem;
}
#scene {
  width: 100%;
  height: 100%;
  min-height: 360px;
  display: block;
  background: linear-gradient(180deg, #0d1326 0%, #0a0e1a 100%);
  border-radius: var(--sim-radius-md);
}
.side {
  display: grid;
  grid-template-rows: auto 1fr;
  gap: var(--sim-space-3);
  min-height: 0;
}
.readouts {
  padding: var(--sim-space-3);
}
.readout-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--sim-space-2);
}
.metric {
  padding: var(--sim-space-3);
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-md);
  background: var(--sim-surface-soft);
}
.metric small {
  display: block;
  margin-bottom: var(--sim-space-1);
  color: var(--sim-muted);
  font-size: 0.7rem;
}
.metric strong {
  font-size: 1.15rem;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  display: block;
}
.model-note {
  padding: var(--sim-space-3);
  display: grid;
  align-content: start;
  gap: var(--sim-space-2);
}
.model-note h2 {
  margin: 0;
  font-size: 0.95rem;
}
.model-note p {
  margin: 0;
  color: var(--sim-muted);
  font-size: 0.8rem;
  line-height: 1.5;
}
.insight {
  padding: var(--sim-space-3);
  border-left: 3px solid var(--sim-warning);
  border-radius: 0 var(--sim-radius-md) var(--sim-radius-md) 0;
  background: rgba(251, 191, 36, 0.08);
  color: var(--sim-warning);
  font-weight: 600;
  font-size: 0.85rem;
}
.controls {
  padding: var(--sim-space-3);
  display: grid;
  grid-template-columns: auto 1fr 1fr 1fr;
  gap: var(--sim-space-4);
  align-items: center;
}
.actions {
  display: flex;
  gap: var(--sim-space-2);
}
button {
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-sm);
  padding: var(--sim-space-2) var(--sim-space-3);
  background: var(--sim-surface-soft);
  cursor: pointer;
  font-weight: 700;
  transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
  font-size: 0.85rem;
}
button:hover {
  border-color: var(--sim-accent);
  background: rgba(94, 234, 212, 0.08);
}
button:active {
  transform: scale(0.97);
}
button.primary {
  border-color: var(--sim-accent-deep);
  color: #0a0e1a;
  background: linear-gradient(135deg, var(--sim-accent), var(--sim-accent-deep));
}
.control {
  display: flex;
  flex-direction: column;
  gap: var(--sim-space-1);
}
.control label {
  display: flex;
  justify-content: space-between;
  gap: var(--sim-space-3);
  font-size: 0.8rem;
  font-weight: 700;
}
.control output {
  color: var(--sim-accent);
  font-variant-numeric: tabular-nums;
}
input[type="range"] {
  width: 100%;
  accent-color: var(--sim-accent);
  height: 6px;
}
@media (max-width: 900px) {
  .main {
    grid-template-columns: 1fr;
  }
  .controls {
    grid-template-columns: 1fr;
  }
  .scene-panel {
    min-height: 0;
  }
  #scene {
    min-height: 280px;
    aspect-ratio: 4 / 3;
  }
  .readout-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>金属丝电阻率测量实验</h1>
      <p>调节金属丝长度与直径，采集多组数据，通过 R-L 线性拟合求解电阻率 rho</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">就绪</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head">
        <h2 id="scene-title">实验装置</h2>
        <span>拖动夹子或调节滑块改变接入长度 L</span>
      </div>
      <canvas id="scene" width="800" height="500"></canvas>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel readouts" aria-label="实时读数">
        <div class="readout-grid">
          <div class="metric"><small>长度 L</small><strong id="readL">0.50 m</strong></div>
          <div class="metric"><small>直径 d</small><strong id="readD">0.50 mm</strong></div>
          <div class="metric"><small>面积 S</small><strong id="readS">0.196 mm²</strong></div>
          <div class="metric"><small>电压 U</small><strong id="readU">0.000 V</strong></div>
          <div class="metric"><small>电流 I</small><strong id="readI">0.500 A</strong></div>
          <div class="metric"><small>电阻 R</small><strong id="readR">0.000 Ω</strong></div>
        </div>
      </section>
      <section class="panel model-note" data-region="insight">
        <div class="panel-head"><h2>数据分析</h2></div>
        <canvas id="chart" width="600" height="400"></canvas>
        <p id="insight" class="insight">采集 2 组以上数据后自动拟合 R-L 直线，斜率 = rho*S</p>
        <p>公式：R = rho*L/S，S = pi*d²/4，rho = R*S/L</p>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="实验控件">
    <div class="actions">
      <button id="collectBtn" class="primary" type="button">采集一组</button>
      <button id="resetBtn" type="button">重置数据</button>
    </div>
    <div class="control">
      <label for="lInput">接入长度 L <output id="lOutput">0.50 m</output></label>
      <input id="lInput" type="range" min="0.10" max="1.00" step="0.01" value="0.50">
    </div>
    <div class="control">
      <label for="dInput">金属丝直径 d <output id="dOutput">0.50 mm</output></label>
      <input id="dInput" type="range" min="0.10" max="1.00" step="0.01" value="0.50">
    </div>
    <div class="control">
      <label for="rhoInput">材料电阻率 rho <output id="rhoOutput">1.00e-6 Ω·m</output></label>
      <input id="rhoInput" type="range" min="0.1" max="3.0" step="0.1" value="1.0">
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const parameterSchema = [
    { key: "L", label: "接入长度", type: "slider", min: 0.10, max: 1.00, step: 0.01, default: 0.50, unit: "m" },
    { key: "d", label: "直径", type: "slider", min: 0.10, max: 1.00, step: 0.01, default: 0.50, unit: "mm" },
    { key: "rho", label: "电阻率", type: "slider", min: 0.1, max: 3.0, step: 0.1, default: 1.0, unit: "1e-6 Ω·m" }
  ];

  const state = {
    running: true,
    t: 0,
    lastTimestamp: null,
    L: 0.50,
    d: 0.50,
    rho: 1.0,
    I: 0.500,
    collected: [],
    dragging: false,
    dragOffset: 0
  };

  const elements = {
    status: document.getElementById("status"),
    scene: document.getElementById("scene"),
    chart: document.getElementById("chart"),
    readL: document.getElementById("readL"),
    readD: document.getElementById("readD"),
    readS: document.getElementById("readS"),
    readU: document.getElementById("readU"),
    readI: document.getElementById("readI"),
    readR: document.getElementById("readR"),
    insight: document.getElementById("insight"),
    lInput: document.getElementById("lInput"),
    lOutput: document.getElementById("lOutput"),
    dInput: document.getElementById("dInput"),
    dOutput: document.getElementById("dOutput"),
    rhoInput: document.getElementById("rhoInput"),
    rhoOutput: document.getElementById("rhoOutput"),
    collectBtn: document.getElementById("collectBtn"),
    resetBtn: document.getElementById("resetBtn")
  };

  const sceneCtx = elements.scene.getContext("2d");
  const chartCtx = elements.chart.getContext("2d");

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function finite(value, fallback) {
    return Number.isFinite(value) ? value : fallback;
  }

  function computeArea(d) {
    return Math.PI * d * d / 4;
  }

  function computeR(L, d, rho) {
    const S_mm2 = computeArea(d);
    const S_m2 = S_mm2 * 1e-6;
    return rho * 1e-6 * L / S_m2;
  }

  function computeU(R, I) {
    return R * I;
  }

  function linearFit(points) {
    const n = points.length;
    if (n < 2) return null;
    let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
    for (const p of points) {
      sumX += p.x;
      sumY += p.y;
      sumXY += p.x * p.y;
      sumX2 += p.x * p.x;
    }
    const denom = n * sumX2 - sumX * sumX;
    if (Math.abs(denom) < 1e-12) return null;
    const slope = (n * sumXY - sumX * sumY) / denom;
    const intercept = (sumY - slope * sumX) / n;
    return { slope, intercept };
  }

  function init() {
    bindControls();
    bindSceneDrag();
    setParameters({ L: 0.50, d: 0.50, rho: 1.0 });
    requestAnimationFrame(frame);
  }

  function start() {
    state.running = true;
    elements.status.textContent = "运行中";
  }

  function pause() {
    state.running = false;
    elements.status.textContent = "已暂停";
  }

  function reset() {
    state.t = 0;
    state.lastTimestamp = null;
    state.collected = [];
    state.L = parameterSchema[0].default;
    state.d = parameterSchema[1].default;
    state.rho = parameterSchema[2].default;
    elements.lInput.value = String(state.L);
    elements.dInput.value = String(state.d);
    elements.rhoInput.value = String(state.rho);
    setParameters({ L: state.L, d: state.d, rho: state.rho });
    render();
  }

  function update(dt) {
    if (!state.running) return;
    const boundedDt = clamp(finite(dt, 0), 0, 0.05);
    state.t += boundedDt;
  }

  function render() {
    drawScene();
    drawChart();
    updateReadouts();
  }

  function drawScene() {
    const ctx = sceneCtx;
    const W = elements.scene.width;
    const H = elements.scene.height;
    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = "#0d1326";
    ctx.fillRect(0, 0, W, H);

    const margin = 60;
    const wireY = H * 0.42;
    const wireStartX = margin;
    const wireEndX = W - margin;
    const wireW = wireEndX - wireStartX;

    ctx.strokeStyle = "#1f2942";
    ctx.lineWidth = 1;
    for (let i = 0; i <= 10; i++) {
      const x = wireStartX + (i / 10) * wireW;
      ctx.beginPath();
      ctx.moveTo(x, wireY - 50);
      ctx.lineTo(x, wireY + 50);
      ctx.stroke();
    }

    ctx.strokeStyle = "#3a4a6a";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(wireStartX, wireY + 45);
    ctx.lineTo(wireEndX, wireY + 45);
    ctx.stroke();

    ctx.fillStyle = "#8b9bb8";
    ctx.font = "11px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    for (let i = 0; i <= 10; i++) {
      const cm = i * 10;
      const x = wireStartX + (i / 10) * wireW;
      ctx.fillText(cm + " cm", x, wireY + 62);
      ctx.beginPath();
      ctx.moveTo(x, wireY + 45);
      ctx.lineTo(x, wireY + 50);
      ctx.stroke();
    }
    for (let i = 0; i <= 50; i++) {
      if (i % 5 === 0) continue;
      const x = wireStartX + (i / 50) * wireW;
      ctx.beginPath();
      ctx.moveTo(x, wireY + 45);
      ctx.lineTo(x, wireY + 48);
      ctx.stroke();
    }

    const wireThickness = Math.max(3, state.d * 6);
    const clipX = wireStartX + state.L * wireW;

    ctx.strokeStyle = "#5eead4";
    ctx.lineWidth = wireThickness;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(wireStartX, wireY);
    ctx.lineTo(clipX, wireY);
    ctx.stroke();

    ctx.strokeStyle = "#3a4a6a";
    ctx.lineWidth = wireThickness;
    ctx.beginPath();
    ctx.moveTo(clipX, wireY);
    ctx.lineTo(wireEndX, wireY);
    ctx.stroke();

    ctx.fillStyle = "#8b9bb8";
    ctx.font = "12px ui-sans-serif, system-ui";
    ctx.textAlign = "left";
    ctx.fillText("固定端", wireStartX - 30, wireY - 20);
    ctx.textAlign = "right";
    ctx.fillText("夹子（可拖动）", clipX + 10, wireY - 20);

    drawClip(ctx, wireStartX, wireY, 14, "#fbbf24");
    drawClip(ctx, clipX, wireY, 14, "#fbbf24");

    ctx.strokeStyle = "#5eead4";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(wireStartX, wireY - 35);
    ctx.lineTo(clipX, wireY - 35);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = "#5eead4";
    ctx.font = "bold 13px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.fillText("L = " + state.L.toFixed(2) + " m", (wireStartX + clipX) / 2, wireY - 42);

    drawCircuit(ctx, W, H, clipX, wireY, wireStartX);
  }

  function drawClip(ctx, x, y, size, color) {
    ctx.fillStyle = color;
    ctx.strokeStyle = "#0a0e1a";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - size, y - size * 0.6);
    ctx.lineTo(x + size, y - size * 0.6);
    ctx.lineTo(x + size * 0.5, y);
    ctx.lineTo(x + size, y + size * 0.6);
    ctx.lineTo(x - size, y + size * 0.6);
    ctx.lineTo(x - size * 0.5, y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  function drawCircuit(ctx, W, H, clipX, wireY, wireStartX) {
    const baseY = H - 50;
    const leftX = 30;
    const rightX = W - 30;

    ctx.strokeStyle = "#5eead4";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(wireStartX, wireY + 10);
    ctx.lineTo(wireStartX, baseY);
    ctx.lineTo(leftX + 40, baseY);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(clipX, wireY + 10);
    ctx.lineTo(clipX, baseY);
    ctx.lineTo(rightX - 40, baseY);
    ctx.stroke();

    drawBattery(ctx, leftX, baseY, 40);
    drawAmmeter(ctx, W / 2 - 30, baseY, 60);
    drawVoltmeter(ctx, W / 2 + 50, baseY - 60, 60);

    ctx.strokeStyle = "#5eead4";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(wireStartX, wireY + 10);
    ctx.lineTo(W / 2 + 50, wireY + 10);
    ctx.lineTo(W / 2 + 50, baseY - 60);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(clipX, wireY + 10);
    ctx.lineTo(W / 2 + 50, wireY + 10);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawBattery(ctx, x, y, w) {
    ctx.strokeStyle = "#fbbf24";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y - 12);
    ctx.lineTo(x + 8, y - 12);
    ctx.stroke();
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(x + 12, y - 16);
    ctx.lineTo(x + 12, y - 8);
    ctx.stroke();
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x + 16, y - 12);
    ctx.lineTo(x + w, y - 12);
    ctx.stroke();
    ctx.fillStyle = "#fbbf24";
    ctx.font = "11px ui-sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("E", x + w / 2, y - 22);
  }

  function drawAmmeter(ctx, x, y, d) {
    ctx.strokeStyle = "#5eead4";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x + d / 2, y, d / 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = "#0d1326";
    ctx.fill();
    ctx.fillStyle = "#5eead4";
    ctx.font = "bold 12px ui-sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("A", x + d / 2, y + 4);
    ctx.font = "10px ui-sans-serif";
    ctx.fillText(state.I.toFixed(3) + " A", x + d / 2, y + d / 2 + 14);
  }

  function drawVoltmeter(ctx, x, y, d) {
    ctx.strokeStyle = "#f87171";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x + d / 2, y, d / 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = "#0d1326";
    ctx.fill();
    ctx.fillStyle = "#f87171";
    ctx.font = "bold 12px ui-sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("V", x + d / 2, y + 4);
    const U = computeU(computeR(state.L, state.d, state.rho), state.I);
    ctx.font = "10px ui-sans-serif";
    ctx.fillText(U.toFixed(3) + " V", x + d / 2, y + d / 2 + 14);
  }

  function drawChart() {
    const ctx = chartCtx;
    const W = elements.chart.width;
    const H = elements.chart.height;
    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = "#0d1326";
    ctx.fillRect(0, 0, W, H);

    const padL = 50, padR = 180, padT = 20, padB = 40;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    ctx.strokeStyle = "#1f2942";
    ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const y = padT + (i / 5) * plotH;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + plotW, y);
      ctx.stroke();
    }
    for (let i = 0; i <= 5; i++) {
      const x = padL + (i / 5) * plotW;
      ctx.beginPath();
      ctx.moveTo(x, padT);
      ctx.lineTo(x, padT + plotH);
      ctx.stroke();
    }

    ctx.strokeStyle = "#3a4a6a";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(padL, padT);
    ctx.lineTo(padL, padT + plotH);
    ctx.lineTo(padL + plotW, padT + plotH);
    ctx.stroke();

    ctx.fillStyle = "#8b9bb8";
    ctx.font = "11px ui-sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("L (m)", padL + plotW / 2, H - 10);

    ctx.save();
    ctx.translate(15, padT + plotH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText("R (Ω)", 0, 0);
    ctx.restore();

    const maxL = 1.0;
    const currentR = computeR(state.L, state.d, state.rho);
    const allR = state.collected.map(p => p.R).concat([currentR]);
    const maxR = Math.max(0.1, ...allR) * 1.2;

    ctx.fillStyle = "#8b9bb8";
    ctx.font = "10px ui-sans-serif";
    ctx.textAlign = "right";
    for (let i = 0; i <= 5; i++) {
      const val = (maxR * (5 - i) / 5);
      const y = padT + (i / 5) * plotH;
      ctx.fillText(val.toFixed(2), padL - 5, y + 3);
    }
    ctx.textAlign = "center";
    for (let i = 0; i <= 5; i++) {
      const val = (maxL * i / 5);
      const x = padL + (i / 5) * plotW;
      ctx.fillText(val.toFixed(1), x, padT + plotH + 15);
    }

    const colors = ["#5eead4", "#fbbf24", "#f87171", "#a78bfa", "#60a5fa", "#34d399"];
    state.collected.forEach((p, i) => {
      const x = padL + (p.L / maxL) * plotW;
      const y = padT + plotH - (p.R / maxR) * plotH;
      ctx.fillStyle = colors[i % colors.length];
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#0d1326";
      ctx.lineWidth = 1;
      ctx.stroke();
    });

    if (state.collected.length >= 2) {
      const points = state.collected.map(p => ({ x: p.L, y: p.R }));
      const fit = linearFit(points);
      if (fit) {
        const x1 = 0;
        const y1 = fit.slope * x1 + fit.intercept;
        const x2 = maxL;
        const y2 = fit.slope * x2 + fit.intercept;
        const px1 = padL + (x1 / maxL) * plotW;
        const py1 = padT + plotH - (y1 / maxR) * plotH;
        const px2 = padL + (x2 / maxL) * plotW;
        const py2 = padT + plotH - (y2 / maxR) * plotH;

        ctx.strokeStyle = "#5eead4";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px1, py1);
        ctx.lineTo(px2, py2);
        ctx.stroke();

        const S_mm2 = computeArea(state.d);
        const rhoFit = fit.slope * S_mm2 * 1e-6 / 1e-6;

        ctx.fillStyle = "#5eead4";
        ctx.font = "bold 11px ui-sans-serif";
        ctx.textAlign = "left";
        ctx.fillText("拟合: R = " + fit.slope.toFixed(3) + "·L + " + fit.intercept.toFixed(3), padL + plotW + 10, padT + 10);
        ctx.fillStyle = "#fbbf24";
        ctx.fillText("斜率 = " + fit.slope.toFixed(3) + " Ω/m", padL + plotW + 10, padT + 28);
        ctx.fillText("rho = " + rhoFit.toFixed(3) + "e-6 Ω·m", padL + plotW + 10, padT + 46);
        ctx.fillStyle = "#8b9bb8";
        ctx.font = "10px ui-sans-serif";
        ctx.fillText("（斜率 = rho·S）", padL + plotW + 10, padT + 62);
      }
    }

    const cx = padL + (state.L / maxL) * plotW;
    const cy = padT + plotH - (currentR / maxR) * plotH;
    ctx.fillStyle = "#f87171";
    ctx.beginPath();
    ctx.arc(cx, cy, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#0d1326";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = "#f87171";
    ctx.font = "10px ui-sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("当前", cx + 8, cy - 6);
  }

  function updateReadouts() {
    const S = computeArea(state.d);
    const R = computeR(state.L, state.d, state.rho);
    const U = computeU(R, state.I);

    elements.readL.textContent = state.L.toFixed(2) + " m";
    elements.readD.textContent = state.d.toFixed(2) + " mm";
    elements.readS.textContent = S.toFixed(3) + " mm²";
    elements.readU.textContent = U.toFixed(3) + " V";
    elements.readI.textContent = state.I.toFixed(3) + " A";
    elements.readR.textContent = R.toFixed(3) + " Ω";

    elements.lOutput.textContent = state.L.toFixed(2) + " m";
    elements.dOutput.textContent = state.d.toFixed(2) + " mm";
    elements.rhoOutput.textContent = state.rho.toFixed(2) + "e-6 Ω·m";

    if (state.collected.length >= 2) {
      const points = state.collected.map(p => ({ x: p.L, y: p.R }));
      const fit = linearFit(points);
      if (fit) {
        const S_mm2 = computeArea(state.d);
        const rhoFit = fit.slope * S_mm2 * 1e-6 / 1e-6;
        elements.insight.textContent = "已采集 " + state.collected.length + " 组，拟合 rho = " + rhoFit.toFixed(3) + "e-6 Ω·m（设定值 " + state.rho.toFixed(2) + "e-6）";
      }
    } else {
      elements.insight.textContent = "采集 2 组以上数据后自动拟合 R-L 直线，斜率 = rho·S";
    }
  }

  function setParameters(values) {
    const lDef = parameterSchema[0];
    const dDef = parameterSchema[1];
    const rhoDef = parameterSchema[2];
    state.L = clamp(finite(Number(values.L), lDef.default), lDef.min, lDef.max);
    state.d = clamp(finite(Number(values.d), dDef.default), dDef.min, dDef.max);
    state.rho = clamp(finite(Number(values.rho), rhoDef.default), rhoDef.min, rhoDef.max);
    elements.lInput.value = String(state.L);
    elements.dInput.value = String(state.d);
    elements.rhoInput.value = String(state.rho);
    render();
  }

  function getState() {
    return {
      running: state.running,
      t: state.t,
      L: state.L,
      d: state.d,
      rho: state.rho,
      I: state.I,
      collected: state.collected.map(p => ({ ...p }))
    };
  }

  function getReadouts() {
    const S = computeArea(state.d);
    const R = computeR(state.L, state.d, state.rho);
    const U = computeU(R, state.I);
    return { L: state.L, d: state.d, S: S, U: U, I: state.I, R: R };
  }

  function runModelChecks() {
    const S_mm2 = computeArea(0.5);
    const S_m2 = S_mm2 * 1e-6;
    const R_exact = 1.0 * 1e-6 * 0.5 / S_m2;
    const R_computed = computeR(0.5, 0.5, 1.0);
    const U_exact = R_exact * 0.5;
    const U_computed = computeU(R_computed, 0.5);

    const R_double_L = computeR(1.0, 0.5, 1.0);
    const R_half_L = computeR(0.25, 0.5, 1.0);
    const R_double_d = computeR(0.5, 1.0, 1.0);

    const rho_back = R_computed * S_m2 / 0.5 / 1e-6;

    const fit = linearFit([
      { x: 0.2, y: computeR(0.2, 0.5, 1.0) },
      { x: 0.5, y: computeR(0.5, 0.5, 1.0) },
      { x: 0.8, y: computeR(0.8, 0.5, 1.0) }
    ]);

    return [
      { name: "R formula finite", pass: Number.isFinite(R_computed), expected: "finite", actual: R_computed, tolerance: "finite" },
      { name: "R = rho*L/S exact", pass: Math.abs(R_computed - R_exact) < 1e-9, expected: R_exact, actual: R_computed, tolerance: 1e-9 },
      { name: "U = R*I exact", pass: Math.abs(U_computed - U_exact) < 1e-9, expected: U_exact, actual: U_computed, tolerance: 1e-9 },
      { name: "R proportional to L", pass: Math.abs(R_double_L - 2 * R_computed) < 1e-9, expected: 2 * R_computed, actual: R_double_L, tolerance: 1e-9 },
      { name: "R inversely proportional to d²", pass: Math.abs(R_double_d - R_computed / 4) < 1e-9, expected: R_computed / 4, actual: R_double_d, tolerance: 1e-9 },
      { name: "rho back-calculation consistent", pass: Math.abs(rho_back - 1.0) < 1e-9, expected: 1.0, actual: rho_back, tolerance: 1e-9 },
      { name: "linear fit slope = rho*S", pass: fit !== null && Math.abs(fit.slope - R_computed / 0.5) < 1e-9, expected: R_computed / 0.5, actual: fit ? fit.slope : null, tolerance: 1e-9 }
    ];
  }

  function collectData() {
    const R = computeR(state.L, state.d, state.rho);
    state.collected.push({
      L: state.L,
      d: state.d,
      R: R,
      U: computeU(R, state.I),
      I: state.I
    });
    render();
  }

  function resetData() {
    state.collected = [];
    render();
  }

  function bindControls() {
    elements.collectBtn.addEventListener("click", collectData);
    elements.resetBtn.addEventListener("click", resetData);
    elements.lInput.addEventListener("input", () => {
      setParameters({ L: elements.lInput.value, d: state.d, rho: state.rho });
    });
    elements.dInput.addEventListener("input", () => {
      setParameters({ L: state.L, d: elements.dInput.value, rho: state.rho });
    });
    elements.rhoInput.addEventListener("input", () => {
      setParameters({ L: state.L, d: state.d, rho: elements.rhoInput.value });
    });
  }

  function bindSceneDrag() {
    const canvas = elements.scene;
    const getClipX = (clientX) => {
      const rect = canvas.getBoundingClientRect();
      const scale = canvas.width / rect.width;
      const x = (clientX - rect.left) * scale;
      const margin = 60;
      const wireStartX = margin;
      const wireEndX = canvas.width - margin;
      const wireW = wireEndX - wireStartX;
      const L = clamp((x - wireStartX) / wireW, 0, 1);
      return L;
    };
    const onDown = (e) => {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const L = getClipX(clientX);
      if (Math.abs(L - state.L) < 0.05) {
        state.dragging = true;
        e.preventDefault();
      }
    };
    const onMove = (e) => {
      if (!state.dragging) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const L = getClipX(clientX);
      setParameters({ L: L, d: state.d, rho: state.rho });
      e.preventDefault();
    };
    const onUp = () => {
      state.dragging = false;
    };
    canvas.addEventListener("mousedown", onDown);
    canvas.addEventListener("touchstart", onDown, { passive: false });
    window.addEventListener("mousemove", onMove);
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("mouseup", onUp);
    window.addEventListener("touchend", onUp);
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  window.simulation = {
    init: init,
    start: start,
    pause: pause,
    reset: reset,
    update: update,
    render: render,
    setParameters: setParameters,
    getState: getState,
    getReadouts: getReadouts,
    runModelChecks: runModelChecks
  };

  init();
})();
</script>
</body>
</html>
