<!doctype html>
<html lang="zh-CN">
<head><script>if(location.search.indexOf("preview=1")!==-1)Object.defineProperty(window,"devicePixelRatio",{get:function(){return 1}})</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>单位圆与三角函数</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #eef3f8;
      --sim-surface: #ffffff;
      --sim-surface-soft: #f8fafc;
      --sim-text: #172033;
      --sim-muted: #657188;
      --sim-border: #dfe6ef;
      --sim-grid: #e8edf4;
      --sim-accent: #0f9fba;
      --sim-accent-deep: #08758a;
      --sim-accent-soft: #d9f4f7;
      --sim-positive: #0f9fba;
      --sim-warning: #f59e0b;
      --sim-danger: #dc2626;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
      --sim-sin: #e85d3a;
      --sim-cos: #2d7dd6;
      --sim-radius-color: #6b4f9b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
        var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
    .status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 12px; }
    .panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
    #scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); cursor: grab; }
    #scene.dragging { cursor: grabbing; }
    .side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; }
    .readouts { padding: 17px; }
    .readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric { padding: 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
    .metric.sin-metric { border-color: rgba(232,93,58,.22); background: linear-gradient(145deg, #fff5f1, #fdf0eb); }
    .metric.cos-metric { border-color: rgba(45,125,214,.22); background: linear-gradient(145deg, #f1f7fd, #ebf3fc); }
    .metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); }
    .metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .metric.sin-metric strong { color: var(--sim-sin); }
    .metric.cos-metric strong { color: var(--sim-cos); }
    .wave-panel { padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; min-height: 0; }
    #wave { width: 100%; height: 100%; min-height: 180px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 14px; background: linear-gradient(145deg, #fbfdff 0%, #f5f9fc 100%); }
    .model-note { display: grid; align-content: start; gap: 14px; padding: 17px; }
    .model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
    .insight { padding: 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; }
    .controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(140px, 1fr) minmax(140px, 1fr) auto; gap: 16px; align-items: center; border-radius: 17px; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
    button:hover { border-color: #c7d2e2; background: #eef3f9; }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
    .control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
    .legend { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; }
    .legend-dot { width: 14px; height: 14px; border-radius: 4px; }
    @media (max-width: 860px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
      .scene-panel { min-height: 0; }
      #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
      #wave { min-height: 160px; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="app" data-layout="scene-first" data-model-tier="analytic">
    <header class="header" data-region="header">
      <div>
        <h1>单位圆与三角函数</h1>
        <p>拖动点 P 或自动旋转，观察 sin θ 与 cos θ 的几何投影及波形同步生成</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head">
          <h2 id="scene-title">单位圆</h2>
          <div class="legend">
            <span class="legend-item"><span class="legend-dot" style="background:var(--sim-sin)"></span>sin θ（纵投影）</span>
            <span class="legend-item"><span class="legend-dot" style="background:var(--sim-cos)"></span>cos θ（横投影）</span>
            <span class="legend-item"><span class="legend-dot" style="background:var(--sim-radius-color)"></span>半径</span>
          </div>
        </div>
        <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
          <desc id="scene-desc">单位圆上一个点 P，显示半径、sin 投影线（垂直）和 cos 投影线（水平）。</desc>
          <defs>
            <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#9aa7ba"></polygon>
            </marker>
          </defs>
          <g id="grid"></g>
          <line class="axis" x1="40" y1="210" x2="720" y2="210" marker-end="url(#arrowhead)"></line>
          <line class="axis" x1="200" y1="380" x2="200" y2="40" marker-end="url(#arrowhead)"></line>
          <text class="axis-label" x="710" y="200" fill="var(--sim-muted)" font-size="13" font-weight="700">x</text>
          <text class="axis-label" x="210" y="52" fill="var(--sim-muted)" font-size="13" font-weight="700">y</text>
          <text class="axis-label" x="208" y="228" fill="var(--sim-muted)" font-size="11">O</text>
          <circle cx="200" cy="210" r="150" fill="none" stroke="#c7d2e2" stroke-width="2"></circle>
          <text x="358" y="206" fill="var(--sim-muted)" font-size="11" font-weight="600">1</text>
          <text x="186" y="66" fill="var(--sim-muted)" font-size="11" font-weight="600">1</text>
          <text x="40" y="206" fill="var(--sim-muted)" font-size="11" font-weight="600">−1</text>
          <text x="186" y="362" fill="var(--sim-muted)" font-size="11" font-weight="600">−1</text>
          <line id="cosLine" x1="200" y1="210" x2="350" y2="210" stroke="var(--sim-cos)" stroke-width="5" stroke-linecap="round"></line>
          <line id="sinLine" x1="350" y1="210" x2="350" y2="60" stroke="var(--sim-sin)" stroke-width="5" stroke-linecap="round"></line>
          <line id="radiusLine" x1="200" y1="210" x2="350" y2="60" stroke="var(--sim-radius-color)" stroke-width="3" stroke-linecap="round"></line>
          <path id="angleArc" d="" fill="rgba(107,79,155,0.12)" stroke="var(--sim-radius-color)" stroke-width="2"></path>
          <text id="angleLabel" x="240" y="200" fill="var(--sim-radius-color)" font-size="13" font-weight="800">θ</text>
          <circle id="pDot" cx="350" cy="60" r="9" fill="var(--sim-accent)" stroke="white" stroke-width="3" style="cursor:grab"></circle>
          <circle id="pDotHalo" cx="350" cy="60" r="16" fill="rgba(15,159,186,0.15)"></circle>
          <text id="pLabel" x="365" y="55" fill="var(--sim-text)" font-size="16" font-weight="800">P</text>
          <circle id="sinDot" cx="350" cy="60" r="6" fill="var(--sim-sin)" stroke="white" stroke-width="2"></circle>
          <circle id="cosDot" cx="350" cy="210" r="6" fill="var(--sim-cos)" stroke="white" stroke-width="2"></circle>
        </svg>
      </section>

      <aside class="side" data-region="evidence">
        <section class="panel readouts" aria-label="实时数值">
          <div class="readout-grid">
            <div class="metric"><small>θ（弧度）</small><strong id="thetaReadout">0.00</strong></div>
            <div class="metric"><small>θ（角度）</small><strong id="thetaDegReadout">0°</strong></div>
            <div class="metric sin-metric"><small>sin θ</small><strong id="sinReadout">0.00</strong></div>
            <div class="metric cos-metric"><small>cos θ</small><strong id="cosReadout">1.00</strong></div>
          </div>
        </section>
        <section class="panel wave-panel" aria-labelledby="wave-title">
          <div class="panel-head"><h2 id="wave-title">波形图</h2><span>sin/cos 随 θ 变化</span></div>
          <svg id="wave" viewBox="0 0 760 200" role="img" aria-labelledby="wave-title wave-desc">
            <desc id="wave-desc">sin 和 cos 函数随角度 θ 变化的波形图，当前点以圆点标记。</desc>
            <g id="waveGrid"></g>
            <line class="axis" x1="40" y1="100" x2="740" y2="100"></line>
            <line class="axis" x1="40" y1="20" x2="40" y2="180"></line>
            <text class="axis-label" x="725" y="95" fill="var(--sim-muted)" font-size="11">θ</text>
            <text class="axis-label" x="20" y="25" fill="var(--sim-muted)" font-size="11">1</text>
            <text class="axis-label" x="14" y="104" fill="var(--sim-muted)" font-size="11">0</text>
            <text class="axis-label" x="14" y="184" fill="var(--sim-muted)" font-size="11">−1</text>
            <text class="axis-label" x="100" y="118" fill="var(--sim-muted)" font-size="10">π/2</text>
            <text class="axis-label" x="190" y="118" fill="var(--sim-muted)" font-size="10">π</text>
            <text class="axis-label" x="280" y="118" fill="var(--sim-muted)" font-size="10">3π/2</text>
            <text class="axis-label" x="370" y="118" fill="var(--sim-muted)" font-size="10">2π</text>
            <polyline id="sinTrace" fill="none" stroke="var(--sim-sin)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
            <polyline id="cosTrace" fill="none" stroke="var(--sim-cos)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"></polyline>
            <line id="scanLine" x1="40" y1="20" x2="40" y2="180" stroke="var(--sim-accent)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"></line>
            <circle id="sinWaveDot" cx="40" cy="100" r="5" fill="var(--sim-sin)" stroke="white" stroke-width="2"></circle>
            <circle id="cosWaveDot" cx="40" cy="100" r="5" fill="var(--sim-cos)" stroke="white" stroke-width="2"></circle>
          </svg>
        </section>
        <section class="panel model-note" data-region="insight">
          <div class="panel-head"><h2>观察</h2></div>
          <p id="insight" class="insight">拖动点 P 或按播放，观察 sin 投影线长度如何对应波形图上的高度。</p>
          <p>教学模型：点 P 在单位圆上坐标为 (cos θ, sin θ)。sin θ 是纵轴投影，cos θ 是横轴投影，恒有 sin²θ + cos²θ = 1。</p>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="模拟控制">
      <div class="actions">
        <button id="startBtn" class="primary" type="button">播放</button>
        <button id="pauseBtn" type="button">暂停</button>
        <button id="resetBtn" type="button">重置</button>
      </div>
      <div class="control">
        <label for="speedInput">旋转速度 <output id="speedOutput">1.0×</output></label>
        <input id="speedInput" type="range" min="0.1" max="3" step="0.1" value="1">
      </div>
      <div class="control">
        <label for="angleInput">角度 θ <output id="angleOutput">0.00 rad</output></label>
        <input id="angleInput" type="range" min="0" max="6.2832" step="0.01" value="0">
      </div>
      <div class="actions">
        <button id="unitToggle" type="button" aria-pressed="false">弧度制</button>
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";
    const TWO_PI = Math.PI * 2;
    const parameterSchema = [
      { key: "speed", label: "旋转速度", type: "slider", min: 0.1, max: 3, step: 0.1, default: 1, unit: "×" },
      { key: "angle", label: "角度", type: "slider", min: 0, max: 6.2832, step: 0.01, default: 0, unit: "rad" }
    ];
    const state = {
      running: false,
      theta: 0,
      speed: 1,
      useRadians: true,
      lastTimestamp: null,
      isDragging: false,
      waveHistory: []
    };
    const elements = {
      status: document.querySelector("#status"),
      scene: document.querySelector("#scene"),
      pDot: document.querySelector("#pDot"),
      pDotHalo: document.querySelector("#pDotHalo"),
      pLabel: document.querySelector("#pLabel"),
      radiusLine: document.querySelector("#radiusLine"),
      sinLine: document.querySelector("#sinLine"),
      cosLine: document.querySelector("#cosLine"),
      sinDot: document.querySelector("#sinDot"),
      cosDot: document.querySelector("#cosDot"),
      angleArc: document.querySelector("#angleArc"),
      angleLabel: document.querySelector("#angleLabel"),
      grid: document.querySelector("#grid"),
      thetaReadout: document.querySelector("#thetaReadout"),
      thetaDegReadout: document.querySelector("#thetaDegReadout"),
      sinReadout: document.querySelector("#sinReadout"),
      cosReadout: document.querySelector("#cosReadout"),
      waveGrid: document.querySelector("#waveGrid"),
      sinTrace: document.querySelector("#sinTrace"),
      cosTrace: document.querySelector("#cosTrace"),
      sinWaveDot: document.querySelector("#sinWaveDot"),
      cosWaveDot: document.querySelector("#cosWaveDot"),
      scanLine: document.querySelector("#scanLine"),
      insight: document.querySelector("#insight"),
      speedInput: document.querySelector("#speedInput"),
      speedOutput: document.querySelector("#speedOutput"),
      angleInput: document.querySelector("#angleInput"),
      angleOutput: document.querySelector("#angleOutput"),
      unitToggle: document.querySelector("#unitToggle"),
      startBtn: document.querySelector("#startBtn"),
      pauseBtn: document.querySelector("#pauseBtn"),
      resetBtn: document.querySelector("#resetBtn")
    };

    // 单位圆舞台坐标系
    const CIRCLE = { cx: 200, cy: 210, r: 150 };
    // 波形图坐标系
    const WAVE = { x0: 40, x1: 740, y0: 20, y1: 180, yMid: 100, amp: 80, width: 700 };

    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

    function initGrid() {
      const lines = [];
      // 单位圆网格 - 每30度一条参考线
      for (let i = 0; i < 12; i += 1) {
        const a = (i / 12) * TWO_PI;
        const x2 = CIRCLE.cx + CIRCLE.r * Math.cos(a);
        const y2 = CIRCLE.cy - CIRCLE.r * Math.sin(a);
        lines.push(`<line class="grid-line" x1="${CIRCLE.cx}" y1="${CIRCLE.cy}" x2="${x2}" y2="${y2}" stroke="var(--sim-grid)" stroke-width="1" opacity="0.5"></line>`);
      }
      elements.grid.innerHTML = lines.join("");
    }

    function initWaveGrid() {
      const lines = [];
      // 水平网格线
      for (let i = -1; i <= 1; i += 0.5) {
        const y = WAVE.yMid - i * WAVE.amp;
        lines.push(`<line class="grid-line" x1="${WAVE.x0}" y1="${y}" x2="${WAVE.x1}" y2="${y}" stroke="var(--sim-grid)" stroke-width="1"></line>`);
      }
      // 垂直网格线 - 每 π/2
      for (let i = 0; i <= 4; i += 1) {
        const x = WAVE.x0 + (i / 4) * WAVE.width;
        lines.push(`<line class="grid-line" x1="${x}" y1="${WAVE.y0}" x2="${x}" y2="${WAVE.y1}" stroke="var(--sim-grid)" stroke-width="1"></line>`);
      }
      elements.waveGrid.innerHTML = lines.join("");
    }

    function init() {
      initGrid();
      initWaveGrid();
      bindControls();
      setParameters({ speed: 1, angle: 0 });
      reset();
      requestAnimationFrame(frame);
    }

    function start() {
      state.running = true;
      elements.status.textContent = "运行中";
      elements.startBtn.setAttribute("aria-pressed", "true");
    }

    function pause() {
      state.running = false;
      elements.status.textContent = "已暂停";
      elements.startBtn.setAttribute("aria-pressed", "false");
    }

    function reset() {
      pause();
      state.theta = 0;
      state.lastTimestamp = null;
      state.waveHistory = [];
      elements.angleInput.value = "0";
      render();
    }

    function update(dt) {
      if (!state.running || state.isDragging) return;
      const boundedDt = clamp(finite(dt, 0), 0, 0.05);
      // 速度 1× = 每秒约 1 弧度（约 57.3°/s），完整一圈约 6.28 秒
      state.theta += state.speed * boundedDt;
      // 保持 theta 在 [0, 2π) 范围内用于显示，但波形图会循环
      if (state.theta >= TWO_PI) {
        state.theta -= TWO_PI;
        state.waveHistory = []; // 新周期重新开始
      }
      elements.angleInput.value = String(state.theta.toFixed(2));
      render();
    }

    function render() {
      const theta = state.theta;
      const sinT = Math.sin(theta);
      const cosT = Math.cos(theta);

      // 单位圆上的点 P
      const px = CIRCLE.cx + CIRCLE.r * cosT;
      const py = CIRCLE.cy - CIRCLE.r * sinT; // SVG y 轴向下

      // 更新点 P
      elements.pDot.setAttribute("cx", px);
      elements.pDot.setAttribute("cy", py);
      elements.pDotHalo.setAttribute("cx", px);
      elements.pDotHalo.setAttribute("cy", py);
      elements.pLabel.setAttribute("x", px + 12);
      elements.pLabel.setAttribute("y", py - 8);

      // 半径线
      elements.radiusLine.setAttribute("x2", px);
      elements.radiusLine.setAttribute("y2", py);

      // sin 投影线（垂直，从 x 轴到点 P）
      elements.sinLine.setAttribute("x1", px);
      elements.sinLine.setAttribute("y1", CIRCLE.cy);
      elements.sinLine.setAttribute("x2", px);
      elements.sinLine.setAttribute("y2", py);

      // cos 投影线（水平，从原点到 P 的 x 坐标）
      elements.cosLine.setAttribute("x1", CIRCLE.cx);
      elements.cosLine.setAttribute("y1", CIRCLE.cy);
      elements.cosLine.setAttribute("x2", px);
      elements.cosLine.setAttribute("y2", CIRCLE.cy);

      // sin/cos 投影点
      elements.sinDot.setAttribute("cx", px);
      elements.sinDot.setAttribute("cy", py);
      elements.cosDot.setAttribute("cx", px);
      elements.cosDot.setAttribute("cy", CIRCLE.cy);

      // 角度弧
      const arcRadius = 35;
      const arcEndX = CIRCLE.cx + arcRadius * cosT;
      const arcEndY = CIRCLE.cy - arcRadius * sinT;
      const largeArc = theta > Math.PI ? 1 : 0;
      elements.angleArc.setAttribute("d",
        `M ${CIRCLE.cx + arcRadius} ${CIRCLE.cy} A ${arcRadius} ${arcRadius} 0 ${largeArc} 0 ${arcEndX} ${arcEndY} L ${CIRCLE.cx} ${CIRCLE.cy} Z`
      );
      // 角度标签位置
      const labelAngle = theta / 2;
      const labelR = arcRadius + 12;
      elements.angleLabel.setAttribute("x", CIRCLE.cx + labelR * Math.cos(labelAngle));
      elements.angleLabel.setAttribute("y", CIRCLE.cy - labelR * Math.sin(labelAngle) + 5);

      // 波形图
      // 记录历史点
      if (state.waveHistory.length === 0 || Math.abs(theta - state.waveHistory[state.waveHistory.length - 1].theta) > 0.02) {
        state.waveHistory.push({ theta: theta, sin: sinT, cos: cosT });
      }

      // 绘制完整波形（参考曲线）+ 已走过部分
      const wavePoints = [];
      const sinPoints = [];
      const cosPoints = [];
      const samples = 200;
      for (let i = 0; i <= samples; i += 1) {
        const t = (i / samples) * TWO_PI;
        const x = WAVE.x0 + (t / TWO_PI) * WAVE.width;
        const sinY = WAVE.yMid - Math.sin(t) * WAVE.amp;
        const cosY = WAVE.yMid - Math.cos(t) * WAVE.amp;
        sinPoints.push(`${x},${sinY}`);
        cosPoints.push(`${x},${cosY}`);
      }
      elements.sinTrace.setAttribute("points", sinPoints.join(" "));
      elements.cosTrace.setAttribute("points", cosPoints.join(" "));

      // 当前点在波形图上的位置
      const waveX = WAVE.x0 + (theta / TWO_PI) * WAVE.width;
      const sinWaveY = WAVE.yMid - sinT * WAVE.amp;
      const cosWaveY = WAVE.yMid - cosT * WAVE.amp;
      elements.sinWaveDot.setAttribute("cx", waveX);
      elements.sinWaveDot.setAttribute("cy", sinWaveY);
      elements.cosWaveDot.setAttribute("cx", waveX);
      elements.cosWaveDot.setAttribute("cy", cosWaveY);
      elements.scanLine.setAttribute("x1", waveX);
      elements.scanLine.setAttribute("x2", waveX);

      // 读数
      const thetaRad = theta.toFixed(2);
      const thetaDeg = (theta * 180 / Math.PI).toFixed(1) + "°";
      elements.thetaReadout.textContent = thetaRad;
      elements.thetaDegReadout.textContent = thetaDeg;
      elements.sinReadout.textContent = sinT.toFixed(3);
      elements.cosReadout.textContent = cosT.toFixed(3);
      elements.speedOutput.textContent = `${state.speed.toFixed(1)}×`;
      elements.angleOutput.textContent = `${theta.toFixed(2)} rad`;

      // 单位切换按钮
      elements.unitToggle.textContent = state.useRadians ? "弧度制" : "角度制";
      elements.unitToggle.setAttribute("aria-pressed", String(state.useRadians));

      // 洞察提示
      const deg = theta * 180 / Math.PI;
      let insightText;
      if (!state.running && theta === 0) {
        insightText = "拖动点 P 或按播放，观察 sin 投影线长度如何对应波形图上的高度。";
      } else if (deg < 90) {
        insightText = `θ 在第一象限：sin θ 与 cos θ 均为正，sin 投影线随 θ 增大而变长。`;
      } else if (deg < 180) {
        insightText = `θ 在第二象限：sin θ 为正、cos θ 为负，cos 投影线指向左侧。`;
      } else if (deg < 270) {
        insightText = `θ 在第三象限：sin θ 与 cos θ 均为负，点 P 在原点左下方。`;
      } else {
        insightText = `θ 在第四象限：sin θ 为负、cos θ 为正，sin 投影线指向下方。`;
      }
      elements.insight.textContent = insightText;
    }

    function setParameters(values) {
      const speedDef = parameterSchema[0];
      const angleDef = parameterSchema[1];
      state.speed = clamp(finite(Number(values.speed), speedDef.default), speedDef.min, speedDef.max);
      if (values.angle !== undefined && !state.running) {
        state.theta = clamp(finite(Number(values.angle), 0), angleDef.min, angleDef.max);
      }
      elements.speedInput.value = String(state.speed);
      if (values.angle !== undefined) {
        elements.angleInput.value = String(state.theta.toFixed(2));
      }
      render();
    }

    function getState() {
      return {
        running: state.running,
        theta: state.theta,
        speed: state.speed,
        useRadians: state.useRadians,
        sin: Math.sin(state.theta),
        cos: Math.cos(state.theta)
      };
    }

    function getReadouts() {
      const theta = state.theta;
      return {
        theta: theta,
        thetaDeg: theta * 180 / Math.PI,
        sin: Math.sin(theta),
        cos: Math.cos(theta),
        speed: state.speed
      };
    }

    function runModelChecks() {
      const sin = Math.sin, cos = Math.cos;
      const PI = Math.PI;
      return [
        { name: "sin(0) = 0", pass: Math.abs(sin(0)) < 1e-10, expected: 0, actual: sin(0), tolerance: 1e-10 },
        { name: "cos(0) = 1", pass: Math.abs(cos(0) - 1) < 1e-10, expected: 1, actual: cos(0), tolerance: 1e-10 },
        { name: "sin(π/2) = 1", pass: Math.abs(sin(PI/2) - 1) < 1e-10, expected: 1, actual: sin(PI/2), tolerance: 1e-10 },
        { name: "cos(π/2) = 0", pass: Math.abs(cos(PI/2)) < 1e-10, expected: 0, actual: cos(PI/2), tolerance: 1e-10 },
        { name: "sin(π) = 0", pass: Math.abs(sin(PI)) < 1e-10, expected: 0, actual: sin(PI), tolerance: 1e-10 },
        { name: "cos(π) = −1", pass: Math.abs(cos(PI) - (-1)) < 1e-10, expected: -1, actual: cos(PI), tolerance: 1e-10 },
        { name: "sin²θ + cos²θ = 1 (θ=1.234)", pass: Math.abs(sin(1.234)**2 + cos(1.234)**2 - 1) < 1e-10, expected: 1, actual: sin(1.234)**2 + cos(1.234)**2, tolerance: 1e-10 },
        { name: "周期性: sin(0) = sin(2π)", pass: Math.abs(sin(0) - sin(2*PI)) < 1e-10, expected: sin(0), actual: sin(2*PI), tolerance: 1e-10 },
        { name: "周期性: cos(0) = cos(2π)", pass: Math.abs(cos(0) - cos(2*PI)) < 1e-10, expected: cos(0), actual: cos(2*PI), tolerance: 1e-10 },
        { name: "奇偶性: sin(−θ) = −sin(θ)", pass: Math.abs(sin(-0.7) - (-sin(0.7))) < 1e-10, expected: -sin(0.7), actual: sin(-0.7), tolerance: 1e-10 },
        { name: "奇偶性: cos(−θ) = cos(θ)", pass: Math.abs(cos(-0.7) - cos(0.7)) < 1e-10, expected: cos(0.7), actual: cos(-0.7), tolerance: 1e-10 },
        { name: "投影关系: P=(cosθ, sinθ)", pass: Math.abs(cos(0.9)**2 + sin(0.9)**2 - 1) < 1e-10, expected: 1, actual: cos(0.9)**2 + sin(0.9)**2, tolerance: 1e-10 }
      ];
    }

    function bindControls() {
      elements.startBtn.addEventListener("click", start);
      elements.pauseBtn.addEventListener("click", pause);
      elements.resetBtn.addEventListener("click", reset);

      elements.speedInput.addEventListener("input", () => {
        state.speed = Number(elements.speedInput.value);
        render();
      });

      elements.angleInput.addEventListener("input", () => {
        if (!state.running) {
          state.theta = Number(elements.angleInput.value);
          render();
        }
      });

      elements.unitToggle.addEventListener("click", () => {
        state.useRadians = !state.useRadians;
        render();
      });

      // 拖动点 P
      const svg = elements.scene;
      let dragging = false;

      function getSVGPoint(evt) {
        const pt = svg.createSVGPoint();
        pt.x = evt.clientX;
        pt.y = evt.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }

      function startDrag(evt) {
        dragging = true;
        state.isDragging = true;
        svg.classList.add("dragging");
        elements.pDot.style.cursor = "grabbing";
        evt.preventDefault();
      }

      function doDrag(evt) {
        if (!dragging) return;
        evt.preventDefault();
        const pt = getSVGPoint(evt);
        const dx = pt.x - CIRCLE.cx;
        const dy = pt.y - CIRCLE.cy;
        let angle = Math.atan2(-dy, dx); // atan2(y, x)，SVG y 反转
        if (angle < 0) angle += TWO_PI; // 保持 [0, 2π)
        state.theta = angle;
        elements.angleInput.value = String(state.theta.toFixed(2));
        render();
      }

      function endDrag() {
        if (!dragging) return;
        dragging = false;
        state.isDragging = false;
        svg.classList.remove("dragging");
        elements.pDot.style.cursor = "grab";
      }

      elements.pDot.addEventListener("pointerdown", startDrag);
      elements.pDotHalo.addEventListener("pointerdown", startDrag);
      svg.addEventListener("pointermove", doDrag);
      window.addEventListener("pointerup", endDrag);
      window.addEventListener("pointercancel", endDrag);

      // 点击圆周也可移动点
      svg.addEventListener("click", (evt) => {
        if (dragging) return;
        const pt = getSVGPoint(evt);
        const dx = pt.x - CIRCLE.cx;
        const dy = pt.y - CIRCLE.cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        // 只在圆附近点击时响应
        if (dist > CIRCLE.r * 0.7 && dist < CIRCLE.r * 1.3) {
          let angle = Math.atan2(-dy, dx);
          if (angle < 0) angle += TWO_PI;
          state.theta = angle;
          elements.angleInput.value = String(state.theta.toFixed(2));
          render();
        }
      });
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      requestAnimationFrame(frame);
    }

    window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
    init();
  })();
  </script>
</body>
</html>
