<title>天为什么蓝，晚霞为什么红 · 瑞利散射</title>
<style>

<body>
<div class="app" data-layout="visualization-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>天为什么蓝，晚霞为什么红</h1>
      <div class="subtitle">瑞利散射 · 散射强度与波长四次方成反比</div>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">运行中</div>
  </header>

  <main class="main">
    <section class="stage-wrap" data-region="stage" aria-label="瑞利散射可视化主舞台">
      <canvas id="scene"></canvas>
      <div class="stage-overlay">
        <div class="act-tag" id="actTag">第一幕 · 白天</div>
        <div class="caption" id="caption">阳光穿越薄薄大气，蓝光向四面散射铺满天空。</div>
      </div>
    </section>

    <aside class="side" data-region="evidence">
      <div class="side-panel">
        <h2>散射强度曲线</h2>
        <canvas id="curveCanvas"></canvas>
        <div class="formula">I ∝ 1 / λ<span class="accent">⁴</span></div>
        <div class="readouts">
          <div class="readout blue"><small>蓝光散射</small><strong id="blueScatter">100%</strong></div>
          <div class="readout red"><small>红光幸存</small><strong id="redSurvive">99%</strong></div>
        </div>
      </div>
      <div class="side-panel" data-region="insight">
        <h2>当前状态</h2>
        <div id="insightText" style="font-size:.85rem;line-height:1.55;color:var(--sim-text);">紫光散射其实更强，但太阳光里紫光成分少、人眼对蓝光更敏感，所以天是蓝的。</div>
      </div>
    </aside>
  </main>

  <section class="controls" data-region="controls" aria-label="模拟控制">
    <div class="slider-group">
      <label class="slider-label" for="sunAngle">太阳高度角</label>
      <div class="slider-wrap">
        <input id="sunAngle" type="range" min="5" max="85" step="1" value="60" aria-label="太阳高度角">
        <span class="slider-value" id="sunAngleVal">60°</span>
      </div>
    </div>
    <div class="actions">
      <button id="playBtn" class="primary" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  // ===== 参数 schema =====
  const parameterSchema = [
    { key: "sunAngle", label: "太阳高度角", type: "slider", min: 5, max: 85, step: 1, default: 60, unit: "°" }
  ];

  // ===== 状态 =====
  const state = {
    running: true,
    t: 0,
    sunAngle: 60,
    lastTimestamp: null,
    history: [],
    introT: 0,        // 开场静态帧计时（0→2s）
    actTransition: 0   // 幕切换淡入淡出 0~1
  };
  let prevAct = 1;

  // ===== DOM =====
  const sceneCanvas = document.getElementById("scene");
  const curveCanvas = document.getElementById("curveCanvas");
  const ctx = sceneCanvas.getContext("2d");
  const cctx = curveCanvas.getContext("2d");
  const els = {
    status: document.getElementById("status"),
    caption: document.getElementById("caption"),
    actTag: document.getElementById("actTag"),
    insightText: document.getElementById("insightText"),
    blueScatter: document.getElementById("blueScatter"),
    redSurvive: document.getElementById("redSurvive"),
    sunAngleInput: document.getElementById("sunAngle"),
    sunAngleVal: document.getElementById("sunAngleVal"),
    playBtn: document.getElementById("playBtn"),
    resetBtn: document.getElementById("resetBtn")
  };

  // ===== 工具 =====
  function clamp(v, mn, mx) { return Math.min(mx, Math.max(mn, v)); }
  function finite(v, fb) { return Number.isFinite(v) ? v : fb; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeInOut(t) { return t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; }

  // 固定随机种子
  function seededRandom(seed) {
    let s = seed | 0;
    return function() {
      s = (s * 1664525 + 1013904223) | 0;
      return ((s >>> 0) / 4294967296);
    };
  }
  const rng = seededRandom(20240101);

  // ===== 物理模型 =====
  // 瑞利散射: I ∝ 1/λ⁴
  // 波长 nm: 紫 400, 蓝 450, 绿 520, 黄 580, 红 650
  const WAVELENGTHS = [
    { name: "violet", nm: 410, color: [180, 120, 255] },
    { name: "blue",   nm: 460, color: [90, 170, 255] },
    { name: "cyan",   nm: 490, color: [100, 210, 240] },
    { name: "green",  nm: 530, color: [120, 220, 150] },
    { name: "yellow", nm: 580, color: [240, 220, 120] },
    { name: "orange", nm: 610, color: [255, 170, 90] },
    { name: "red",    nm: 660, color: [255, 100, 80] }
  ];
  const REF_NM = 550; // 参考波长
  function scatterFactor(nm) {
    return Math.pow(REF_NM / nm, 4);
  }
  // 大气路径长度（相对值）：太阳越高路径越短
  // pathLength = 1 / sin(θ)，θ 为高度角
  function atmospherePath(angleDeg) {
    const rad = angleDeg * Math.PI / 180;
    return 1 / Math.sin(rad);
  }
  // 衰减：幸存比例 = exp(-k * path * scatterFactor)
  // k 为散射系数常数，调到视觉合理
  const K_SCATTER = 0.09;
  function surviveFraction(nm, angleDeg) {
    const sf = scatterFactor(nm);
    const path = atmospherePath(angleDeg);
    return Math.exp(-K_SCATTER * path * sf);
  }
  // 散射出去的比例 = 1 - survive
  function scatteredFraction(nm, angleDeg) {
    return 1 - surviveFraction(nm, angleDeg);
  }

  // ===== 粒子系统 =====
  // 大气散射粒子（固定位置）
  const NUM_PARTICLES = 70;
  const particles = [];
  for (let i = 0; i < NUM_PARTICLES; i++) {
    particles.push({
      x: rng(),       // 0~1 横向位置
      y: rng() * 0.7, // 0~0.7 纵向（大气层在上部）
      r: 1.2 + rng() * 1.5,
      phase: rng() * Math.PI * 2
    });
  }

  // 散射光子粒子（动态）
  const photons = [];
  const MAX_PHOTONS = 220;

  function spawnPhoton(x, y, vx, vy, color, life) {
    if (photons.length >= MAX_PHOTONS) return;
    photons.push({
      x, y, vx, vy,
      color,
      life,
      maxLife: life,
      trail: []
    });
  }

  // ===== 布局 =====
  let W = 0, H = 0, CW = 0, CH = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = sceneCanvas.getBoundingClientRect();
    W = Math.max(100, r.width);
    H = Math.max(100, r.height);
    sceneCanvas.width = W * dpr;
    sceneCanvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const cr = curveCanvas.getBoundingClientRect();
    CW = Math.max(80, cr.width);
    CH = Math.max(80, cr.height);
    curveCanvas.width = CW * dpr;
    curveCanvas.height = CH * dpr;
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ===== 场景几何 =====
  // 太阳位置：右上方，高度角决定其位置
  function getSunPos(angleDeg) {
    const rad = angleDeg * Math.PI / 180;
    // 太阳沿圆弧运动：高度角85°→接近天顶（右上）；5°→接近地平线（右侧低）
    const cx = W * 0.92;
    const cy = H * 0.5;
    const orbitR = Math.min(W, H) * 0.42;
    // 高度角越高，太阳越靠上
    const sunX = cx - Math.cos(rad) * orbitR * 0.7;
    const sunY = cy - Math.sin(rad) * orbitR;
    return { x: sunX, y: sunY };
  }
  // 观察者位置（画面左下）
  function getObserverPos() {
    return { x: W * 0.06, y: H * 0.82 };
  }
  // 大气层区域：覆盖画面上部 0~0.75 高度
  function getAtmosphereBounds() {
    return { x0: 0, y0: 0, x1: W, y1: H * 0.78 };
  }

  // 光束从太阳到观察者的路径
  function getBeamPath(angleDeg) {
    const sun = getSunPos(angleDeg);
    const obs = getObserverPos();
    return { x0: sun.x, y0: sun.y, x1: obs.x, y1: obs.y };
  }

  // ===== 颜色辅助 =====
  function rgba(c, a) {
    return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
  }
  // 天空颜色：根据太阳高度角，从蓝白过渡到橙红
  function getSkyColor(angleDeg) {
    // 高度角 85→白天蓝；5→黄昏橙红
    const t = clamp((85 - angleDeg) / 80, 0, 1);
    const te = easeInOut(t);
    // 白天天顶色：深蓝 (15, 40, 90) 到 黄昏 (45, 20, 35)
    const zenith = [
      lerp(18, 50, te),
      lerp(45, 22, te),
      lerp(95, 40, te)
    ];
    // 白天地平线：浅蓝 (80, 130, 180) 到 黄昏橙红 (200, 80, 50)
    const horizon = [
      lerp(70, 210, te),
      lerp(125, 85, te),
      lerp(180, 55, te)
    ];
    return { zenith, horizon, t: te };
  }

  // ===== 绘制：背景天空 =====
  function drawSky(angleDeg) {
    const sky = getSkyColor(angleDeg);
    const grad = ctx.createLinearGradient(0, 0, 0, H * 0.85);
    grad.addColorStop(0, rgba(sky.zenith, 1));
    grad.addColorStop(0.6, rgba(sky.horizon, 0.95));
    grad.addColorStop(1, rgba(sky.horizon, 0.7));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 地面/地平线以下
    const groundGrad = ctx.createLinearGradient(0, H * 0.78, 0, H);
    groundGrad.addColorStop(0, rgba([20, 25, 40], 0.6));
    groundGrad.addColorStop(1, rgba([5, 8, 15], 1));
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, H * 0.78, W, H * 0.22);

    // 细网格 8% 不透明度
    ctx.strokeStyle = "rgba(120,140,180,0.05)";
    ctx.lineWidth = 1;
    const gridStep = 48;
    ctx.beginPath();
    for (let x = 0; x <= W; x += gridStep) {
      ctx.moveTo(x, 0); ctx.lineTo(x, H);
    }
    for (let y = 0; y <= H; y += gridStep) {
      ctx.moveTo(0, y); ctx.lineTo(W, y);
    }
    ctx.stroke();
  }

  // ===== 绘制：太阳 =====
  function drawSun(angleDeg) {
    const sun = getSunPos(angleDeg);
    const r = 22;
    // 太阳颜色随高度角变化
    const t = clamp((85 - angleDeg) / 80, 0, 1);
    const sunColor = [
      lerp(255, 255, t),
      lerp(245, 150, t),
      lerp(200, 70, t)
    ];
    // 外层光晕（双层描边模拟）
    ctx.strokeStyle = rgba(sunColor, 0.12);
    ctx.lineWidth = 28;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.arc(sun.x, sun.y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = rgba(sunColor, 0.22);
    ctx.lineWidth = 16;
    ctx.beginPath();
    ctx.arc(sun.x, sun.y, r, 0, Math.PI * 2);
    ctx.stroke();
    // 实心太阳
    ctx.fillStyle = rgba(sunColor, 1);
    ctx.beginPath();
    ctx.arc(sun.x, sun.y, r, 0, Math.PI * 2);
    ctx.fill();
    // 内核高光
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.beginPath();
    ctx.arc(sun.x - r * 0.2, sun.y - r * 0.2, r * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }

  // ===== 绘制：大气粒子 =====
  function drawAtmosphereParticles(angleDeg, time) {
    const atmo = getAtmosphereBounds();
    for (const p of particles) {
      const px = atmo.x0 + p.x * (atmo.x1 - atmo.x0);
      const py = atmo.y0 + p.y * (atmo.y1 - atmo.y0);
      const twinkle = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(time * 1.5 + p.phase));
      ctx.fillStyle = `rgba(180,200,230,${0.15 * twinkle})`;
      ctx.beginPath();
      ctx.arc(px, py, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ===== 绘制：光束 =====
  function drawBeam(angleDeg, time) {
    const beam = getBeamPath(angleDeg);
    const atmo = getAtmosphereBounds();
    // 光束穿过大气层的段
    // 简化：整条光束都画，但散射强度沿路径累积
    const dx = beam.x1 - beam.x0;
    const dy = beam.y1 - beam.y0;
    const len = Math.sqrt(dx * dx + dy * dy);
    const ux = dx / len, uy = dy / len;

    // 白光底色光束（细线）
    ctx.strokeStyle = "rgba(255,250,235,0.15)";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(beam.x0, beam.y0);
    ctx.lineTo(beam.x1, beam.y1);
    ctx.stroke();

    // 各波长光束：根据幸存比例绘制颜色和强度
    for (const wl of WAVELENGTHS) {
      const survive = surviveFraction(wl.nm, angleDeg);
      if (survive < 0.02) continue;
      // 颜色沿路径渐变：从太阳端的全色到观察者端的幸存色
      // 用分段绘制
      const segs = 24;
      for (let i = 0; i < segs; i++) {
        const t0 = i / segs;
        const t1 = (i + 1) / segs;
        // 该段位置的幸存比例（指数衰减）
        const sf0 = Math.exp(-K_SCATTER * atmospherePath(angleDeg) * scatterFactor(wl.nm) * t0);
        const sf1 = Math.exp(-K_SCATTER * atmospherePath(angleDeg) * scatterFactor(wl.nm) * t1);
        const avgSf = (sf0 + sf1) / 2;
        if (avgSf < 0.01) continue;
        const x0 = beam.x0 + dx * t0;
        const y0 = beam.y0 + dy * t0;
        const x1 = beam.x0 + dx * t1;
        const y1 = beam.y0 + dy * t1;
        // 双层描边模拟辉光
        ctx.strokeStyle = rgba(wl.color, 0.06 * avgSf);
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
        ctx.stroke();
        ctx.strokeStyle = rgba(wl.color, 0.5 * avgSf);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
        ctx.stroke();
      }
    }

    // 在路径上生成散射光子
    if (state.running && state.introT >= 2) {
      const spawnRate = 0.6; // 每帧每波长概率
      for (const wl of WAVELENGTHS) {
        const sf = scatterFactor(wl.nm);
        const survive = surviveFraction(wl.nm, angleDeg);
        const scatterProb = (1 - survive) * 0.15;
        if (rng() < scatterProb) {
          // 在路径上随机选一点
          const tpos = rng();
          const px = beam.x0 + dx * tpos;
          const py = beam.y0 + dy * tpos;
          // 散射方向：随机角度
          const ang = rng() * Math.PI * 2;
          const speed = 0.6 + rng() * 0.8;
          spawnPhoton(px, py, Math.cos(ang) * speed, Math.sin(ang) * speed, wl.color, 1.2 + rng() * 0.8);
        }
      }
    }
  }

  // ===== 绘制：散射光子（带拖尾） =====
  function drawPhotons(dt) {
    for (let i = photons.length - 1; i >= 0; i--) {
      const p = photons[i];
      // 更新位置
      p.x += p.vx;
      p.y += p.vy;
      p.life -= dt;
      // 记录拖尾
      p.trail.push({ x: p.x, y: p.y });
      if (p.trail.length > 8) p.trail.shift();
      // 移除死亡或越界
      if (p.life <= 0 || p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) {
        photons.splice(i, 1);
        continue;
      }
      // 绘制拖尾
      for (let j = 0; j < p.trail.length; j++) {
        const tp = p.trail[j];
        const a = (j / p.trail.length) * 0.4 * (p.life / p.maxLife);
        ctx.fillStyle = rgba(p.color, a);
        ctx.beginPath();
        ctx.arc(tp.x, tp.y, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
      // 双层描边模拟辉光
      const lifeRatio = p.life / p.maxLife;
      ctx.strokeStyle = rgba(p.color, 0.15 * lifeRatio);
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = rgba(p.color, 0.9 * lifeRatio);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.8, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ===== 绘制：观察者 =====
  function drawObserver() {
    const obs = getObserverPos();
    // 眼睛图标
    ctx.strokeStyle = "rgba(232,238,252,0.7)";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.ellipse(obs.x, obs.y, 10, 6, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = "rgba(95,184,255,0.9)";
    ctx.beginPath();
    ctx.arc(obs.x, obs.y, 3, 0, Math.PI * 2);
    ctx.fill();
    // 标签
    ctx.fillStyle = "rgba(232,238,252,0.6)";
    ctx.font = "11px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.fillText("观察者", obs.x, obs.y + 22);
  }

  // ===== 绘制：散射曲线 =====
  function drawCurve() {
    cctx.clearRect(0, 0, CW, CH);
    // 背景
    cctx.fillStyle = "rgba(10,15,28,0.4)";
    cctx.fillRect(0, 0, CW, CH);
    // 网格
    cctx.strokeStyle = "rgba(120,140,180,0.08)";
    cctx.lineWidth = 1;
    const pad = { l: 32, r: 12, t: 10, b: 22 };
    const pw = CW - pad.l - pad.r;
    const ph = CH - pad.t - pad.b;
    cctx.beginPath();
    for (let i = 0; i <= 4; i++) {
      const x = pad.l + (i / 4) * pw;
      cctx.moveTo(x, pad.t); cctx.lineTo(x, pad.t + ph);
    }
    for (let i = 0; i <= 4; i++) {
      const y = pad.t + (i / 4) * ph;
      cctx.moveTo(pad.l, y); cctx.lineTo(pad.l + pw, y);
    }
    cctx.stroke();
    // 坐标轴
    cctx.strokeStyle = "rgba(150,170,200,0.4)";
    cctx.lineWidth = 1.5;
    cctx.beginPath();
    cctx.moveTo(pad.l, pad.t); cctx.lineTo(pad.l, pad.t + ph);
    cctx.lineTo(pad.l + pw, pad.t + ph);
    cctx.stroke();
    // 标签
    cctx.fillStyle = "rgba(150,170,200,0.7)";
    cctx.font = "10px ui-sans-serif, system-ui";
    cctx.textAlign = "center";
    cctx.fillText("波长", pad.l + pw / 2, CH - 6);
    cctx.save();
    cctx.translate(10, pad.t + ph / 2);
    cctx.rotate(-Math.PI / 2);
    cctx.fillText("散射强度", 0, 0);
    cctx.restore();
    // 波长刻度
    cctx.textAlign = "center";
    const wlMarks = [400, 500, 600, 700];
    for (const wl of wlMarks) {
      const x = pad.l + ((wl - 380) / (720 - 380)) * pw;
      cctx.fillText(wl, x, pad.t + ph + 12);
    }

    // 曲线：I ∝ 1/λ⁴，归一化到 400nm = 1
    const wlMin = 380, wlMax = 720;
    const maxI = Math.pow(550 / 400, 4); // 紫端归一化值
    cctx.strokeStyle = "rgba(95,184,255,0.15)";
    cctx.lineWidth = 8;
    cctx.lineCap = "round";
    cctx.beginPath();
    for (let i = 0; i <= 80; i++) {
      const wl = wlMin + (i / 80) * (wlMax - wlMin);
      const I = Math.pow(550 / wl, 4) / maxI;
      const x = pad.l + (i / 80) * pw;
      const y = pad.t + ph - I * ph * 0.92;
      if (i === 0) cctx.moveTo(x, y); else cctx.lineTo(x, y);
    }
    cctx.stroke();
    // 渐变描边
    const grad = cctx.createLinearGradient(pad.l, 0, pad.l + pw, 0);
    grad.addColorStop(0, "rgba(180,120,255,0.9)");
    grad.addColorStop(0.2, "rgba(90,170,255,1)");
    grad.addColorStop(0.45, "rgba(120,220,150,0.9)");
    grad.addColorStop(0.65, "rgba(240,220,120,0.9)");
    grad.addColorStop(0.85, "rgba(255,170,90,0.9)");
    grad.addColorStop(1, "rgba(255,100,80,0.9)");
    cctx.strokeStyle = grad;
    cctx.lineWidth = 2.5;
    cctx.beginPath();
    for (let i = 0; i <= 80; i++) {
      const wl = wlMin + (i / 80) * (wlMax - wlMin);
      const I = Math.pow(550 / wl, 4) / maxI;
      const x = pad.l + (i / 80) * pw;
      const y = pad.t + ph - I * ph * 0.92;
      if (i === 0) cctx.moveTo(x, y); else cctx.lineTo(x, y);
    }
    cctx.stroke();

    // 标注当前蓝光和红光位置
    const blueX = pad.l + ((460 - wlMin) / (wlMax - wlMin)) * pw;
    const blueI = Math.pow(550 / 460, 4) / maxI;
    const blueY = pad.t + ph - blueI * ph * 0.92;
    cctx.fillStyle = "rgba(90,170,255,1)";
    cctx.beginPath();
    cctx.arc(blueX, blueY, 4, 0, Math.PI * 2);
    cctx.fill();
    cctx.strokeStyle = "rgba(90,170,255,0.3)";
    cctx.lineWidth = 6;
    cctx.beginPath();
    cctx.arc(blueX, blueY, 4, 0, Math.PI * 2);
    cctx.stroke();
    cctx.fillStyle = "rgba(90,170,255,0.9)";
    cctx.font = "10px ui-sans-serif, system-ui";
    cctx.textAlign = "center";
    cctx.fillText("蓝", blueX, blueY - 8);

    const redX = pad.l + ((660 - wlMin) / (wlMax - wlMin)) * pw;
    const redI = Math.pow(550 / 660, 4) / maxI;
    const redY = pad.t + ph - redI * ph * 0.92;
    cctx.fillStyle = "rgba(255,100,80,1)";
    cctx.beginPath();
    cctx.arc(redX, redY, 4, 0, Math.PI * 2);
    cctx.fill();
    cctx.strokeStyle = "rgba(255,100,80,0.3)";
    cctx.lineWidth = 6;
    cctx.beginPath();
    cctx.arc(redX, redY, 4, 0, Math.PI * 2);
    cctx.stroke();
    cctx.fillStyle = "rgba(255,100,80,0.9)";
    cctx.fillText("红", redX, redY - 8);
  }

  // ===== 更新 =====
  function update(dt) {
    state.t += dt;
    if (state.introT < 2) state.introT += dt;
    // 幕切换检测
    const curAct = state.sunAngle >= 25 ? 1 : 2;
    if (curAct !== prevAct) {
      state.actTransition = 1;
      prevAct = curAct;
    }
    if (state.actTransition > 0) {
      state.actTransition = Math.max(0, state.actTransition - dt * 1.5);
    }
  }

  // ===== 渲染 =====
  function render() {
    ctx.clearRect(0, 0, W, H);
    // 背景
    drawSky(state.sunAngle);
    // 大气粒子
    drawAtmosphereParticles(state.sunAngle, state.t);
    // 光束
    drawBeam(state.sunAngle, state.t);
    // 散射光子
    drawPhotons(0.016);
    // 太阳
    drawSun(state.sunAngle);
    // 观察者
    drawObserver();
    // 幕切换淡入淡出
    if (state.actTransition > 0) {
      ctx.fillStyle = `rgba(0,0,0,${state.actTransition * 0.5})`;
      ctx.fillRect(0, 0, W, H);
    }
    // 曲线
    drawCurve();
    // 读数
    const blueScatter = scatteredFraction(460, state.sunAngle);
    const redSurvive = surviveFraction(660, state.sunAngle);
    els.blueScatter.textContent = (blueScatter * 100).toFixed(0) + "%";
    els.redSurvive.textContent = (redSurvive * 100).toFixed(0) + "%";
    // 字幕
    const isDay = state.sunAngle >= 25;
    els.actTag.textContent = isDay ? "第一幕 · 白天" : "第二幕 · 黄昏";
    els.actTag.style.color = isDay ? "var(--sim-accent)" : "#ff8866";
    els.actTag.style.borderColor = isDay ? "rgba(95,184,255,.3)" : "rgba(255,136,102,.3)";
    if (isDay) {
      if (state.sunAngle > 55) {
        els.caption.textContent = "阳光穿越薄薄大气，蓝光向四面散射铺满天空。";
        els.insightText.textContent = "紫光散射其实更强，但太阳光里紫光成分少、人眼对蓝光更敏感，所以天是蓝的。";
      } else {
        els.caption.textContent = "太阳降低，光路变长，蓝光开始被沿途反复散射吸收。";
        els.insightText.textContent = "路径每拉长一倍，蓝光被散射殆尽的程度急剧增加，而红光依然笔直穿过。";
      }
    } else {
      if (state.sunAngle > 12) {
        els.caption.textContent = "阳光斜穿漫长大气，蓝光在途中被散射殆尽。";
        els.insightText.textContent = "幸存的红橙光长途跋涉抵达眼睛，这就是晚霞的颜色。";
      } else {
        els.caption.textContent = "蓝天，是被散射到你眼前的阳光；晚霞，是长途跋涉后幸存的红光。";
        els.insightText.textContent = "同一束阳光，短路径散射出蓝天，长路径滤出红霞——决定颜色命运的是 I ∝ 1/λ⁴。";
      }
    }
    els.sunAngleVal.textContent = state.sunAngle + "°";
  }

  // ===== 生命周期 =====
  function start() {
    state.running = true;
    els.status.textContent = "运行中";
    els.playBtn.textContent = "暂停";
  }
  function pause() {
    state.running = false;
    els.status.textContent = "已暂停";
    els.playBtn.textContent = "播放";
  }
  function reset() {
    pause();
    state.t = 0;
    state.introT = 0;
    state.actTransition = 0;
    prevAct = 1;
    photons.length = 0;
    setParameters({ sunAngle: 60 });
    start();
  }
  function setParameters(values) {
    const def = parameterSchema[0];
    state.sunAngle = clamp(finite(Number(values.sunAngle), def.default), def.min, def.max);
    els.sunAngleInput.value = String(state.sunAngle);
    render();
  }
  function getState() {
    return { running: state.running, t: state.t, sunAngle: state.sunAngle, introT: state.introT };
  }
  function getReadouts() {
    return {
      sunAngle: state.sunAngle,
      blueScatterPct: scatteredFraction(460, state.sunAngle) * 100,
      redSurvivePct: surviveFraction(660, state.sunAngle) * 100,
      pathLength: atmospherePath(state.sunAngle)
    };
  }

  // ===== 模型检查 =====
  function runModelChecks() {
    // 瑞利散射因子 1/λ⁴ 验证
    const blueSF = scatterFactor(460);
    const redSF = scatterFactor(660);
    const ratio = blueSF / redSF;
    const expectedRatio = Math.pow(660 / 460, 4);
    // 路径长度 1/sin(θ)
    const path90 = atmospherePath(90);
    const path30 = atmospherePath(30);
    const pathRatio = path30 / path90;
    const expectedPathRatio = 1 / Math.sin(30 * Math.PI / 180);
    // 蓝光散射强于红光
    const blueScatterMore = scatteredFraction(460, 60) > scatteredFraction(660, 60);
    // 高度角降低 → 蓝光幸存减少
    const blueSurviveHigh = surviveFraction(460, 60);
    const blueSurviveLow = surviveFraction(460, 10);
    const blueDecreases = blueSurviveLow < blueSurviveHigh;
    // 红光在任何角度幸存都更高
    const redAlwaysSurvivesMore = surviveFraction(660, 10) > surviveFraction(460, 10);
    // 趋势单调：高度角降低，蓝光幸存单调减少
    let monotonic = true;
    let prev = surviveFraction(460, 85);
    for (let a = 84; a >= 5; a--) {
      const cur = surviveFraction(460, a);
      if (cur > prev + 1e-9) { monotonic = false; break; }
      prev = cur;
    }
    // 紫光散射强于蓝光
    const violetMoreThanBlue = scatterFactor(410) > scatterFactor(460);
    return [
      { name: "瑞利散射因子比例 蓝/红", pass: Math.abs(ratio - expectedRatio) < 0.001, expected: expectedRatio.toFixed(3), actual: ratio.toFixed(3), tolerance: 0.001 },
      { name: "大气路径 1/sin(θ) 30°/90°", pass: Math.abs(pathRatio - expectedPathRatio) < 0.001, expected: expectedPathRatio.toFixed(3), actual: pathRatio.toFixed(3), tolerance: 0.001 },
      { name: "蓝光散射比例 > 红光", pass: blueScatterMore, expected: true, actual: blueScatterMore, tolerance: "strict" },
      { name: "高度角降低 → 蓝光幸存减少", pass: blueDecreases, expected: true, actual: blueDecreases, tolerance: "strict" },
      { name: "红光幸存始终高于蓝光", pass: redAlwaysSurvivesMore, expected: true, actual: redAlwaysSurvivesMore, tolerance: "strict" },
      { name: "蓝光幸存随高度角单调递减", pass: monotonic, expected: true, actual: monotonic, tolerance: "strict" },
      { name: "紫光散射强于蓝光", pass: violetMoreThanBlue, expected: true, actual: violetMoreThanBlue, tolerance: "strict" }
    ];
  }

  // ===== 绑定 =====
  function bindControls() {
    els.playBtn.addEventListener("click", () => state.running ? pause() : start());
    els.resetBtn.addEventListener("click", reset);
    els.sunAngleInput.addEventListener("input", () => setParameters({ sunAngle: els.sunAngleInput.value }));
    window.addEventListener("resize", () => { resize(); render(); });
  }

  // ===== 主循环 =====
  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    let dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    dt = clamp(finite(dt, 0), 0, 0.05);
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  function init() {
    resize();
    bindControls();
    setParameters({ sunAngle: 60 });
    requestAnimationFrame(frame);
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
