<title>神经冲动传导演示</title>
<style>
:root {
  color-scheme: light;
  --sim-bg: #eef3f8;
  --sim-surface: #ffffff;
  --sim-surface-soft: #f8fafc;
  --sim-text: #172033;
  --sim-muted: #657188;
  --sim-border: #dfe6ef;
  --sim-grid: #e8edf4;
  --sim-accent: #0f9fba;
  --sim-accent-deep: #08758a;
  --sim-accent-soft: #d9f4f7;
  --sim-positive: #0f9fba;
  --sim-warning: #d97706;
  --sim-danger: #dc2626;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;
  --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
  --sim-space-1: 4px;
  --sim-space-2: 8px;
  --sim-space-3: 12px;
  --sim-space-4: 16px;
  --sim-space-5: 24px;
  --sim-space-6: 32px;
  --sim-sodium: #dc2626;
  --sim-sodium-soft: #fee2e2;
  --sim-potassium: #2563eb;
  --sim-potassium-soft: #dbeafe;
  --sim-resting: #64748b;
  --sim-myelin: #fef3c7;
  --sim-myelin-edge: #d97706;
  --sim-node: #fde68a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--sim-text);
  background:
    radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
    radial-gradient(circle at 92% 4%, rgba(220, 38, 38, 0.06), transparent 26%),
    var(--sim-bg);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
.app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 14px 18px 12px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; overflow: hidden; }
.header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 50px; }
.header h1 { margin: 0 0 4px; font-size: clamp(1.4rem, 2.2vw, 1.9rem); letter-spacing: -0.035em; line-height: 1; }
.header p { margin: 0; color: var(--sim-muted); font-size: 0.85rem; }
.status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 8px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; font-size: 0.82rem; }
.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: 10px; }
.panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
.scene-panel { min-height: 420px; padding: 12px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.panel-head h2 { margin: 0; font-size: 0.98rem; }
.panel-head span { color: var(--sim-muted); font-size: 0.74rem; }
#scene { width: 100%; height: 100%; min-height: 360px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); cursor: crosshair; }
.side { min-height: 0; display: grid; grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr); gap: 10px; }
.chart-panel { padding: 12px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
#chart { width: 100%; height: 100%; min-height: 160px; display: block; border: 1px solid rgba(15,159,186,.10); border-radius: 12px; background: #fcfdff; }
.ion-panel { padding: 12px; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; overflow: hidden; }
.ion-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ion-card { padding: 10px; border: 1px solid rgba(148,163,184,.22); border-radius: 12px; background: var(--sim-surface-soft); display: grid; gap: 6px; }
.ion-card.na { border-color: rgba(220,38,38,.20); background: linear-gradient(145deg, #fff5f5, #fef2f2); }
.ion-card.k { border-color: rgba(37,99,235,.20); background: linear-gradient(145deg, #f5f8ff, #eff4ff); }
.ion-card h3 { margin: 0; font-size: 0.82rem; display: flex; align-items: center; gap: 6px; }
.ion-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.ion-dot.na { background: var(--sim-sodium); }
.ion-dot.k { background: var(--sim-potassium); }
.ion-card .state { font-size: 0.78rem; color: var(--sim-muted); }
.ion-card .state strong { color: var(--sim-text); font-weight: 760; }
.ion-card .flow { font-size: 0.72rem; color: var(--sim-muted); min-height: 1.1em; }
.ion-card .bar { height: 6px; border-radius: 3px; background: rgba(148,163,184,.20); overflow: hidden; }
.ion-card .bar > i { display: block; height: 100%; width: 0%; border-radius: 3px; transition: width .15s ease; }
.ion-card.na .bar > i { background: var(--sim-sodium); }
.ion-card.k .bar > i { background: var(--sim-potassium); }
.insight { padding: 12px 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 640; font-size: 0.84rem; line-height: 1.5; }
.controls { padding: 10px 12px; display: grid; grid-template-columns: auto minmax(150px, 1fr) minmax(150px, 1fr) minmax(140px, 1fr); gap: 14px; align-items: center; border-radius: 17px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 8px 12px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; font-size: 0.82rem; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
button:hover { border-color: #c7d2e2; background: #eef3f9; }
button:active { transform: scale(.97); }
button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
button.stim { border-color: var(--sim-danger); color: var(--sim-danger); background: #fff5f5; }
button.stim:hover { background: #fee2e2; }
button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
.control label { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 4px; font-size: 0.78rem; font-weight: 700; }
.control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
.mode-toggle { display: flex; border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); overflow: hidden; }
.mode-toggle button { border: none; border-radius: 0; padding: 8px 10px; flex: 1; background: var(--sim-surface-soft); }
.mode-toggle button[aria-pressed="true"] { background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); color: #fff; }
@media (max-width: 860px) {
  .app { height: auto; min-height: 100vh; overflow: visible; padding: 10px; }
  .main, .app .main { grid-template-columns: 1fr; }
  .controls { grid-template-columns: 1fr; }
  .scene-panel { min-height: 0; }
  #scene { min-height: 0; height: auto; aspect-ratio: 760 / 360; }
  #chart { min-height: 140px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<body>
<div class="app" data-layout="scene-first" data-model-tier="rule-based">
  <header class="header" data-region="header">
    <div>
      <h1>神经冲动传导演示</h1>
      <p>点击轴突施加刺激，观察动作电位沿轴突传播；切换无髓/有髓模式对比传导速度。</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">静息</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
      <div class="panel-head"><h2 id="scene-title">轴突主舞台</h2><span>点击轴突任意位置施加刺激</span></div>
      <svg id="scene" viewBox="0 0 760 360" role="img" aria-labelledby="scene-title scene-desc">
        <desc id="scene-desc">一条水平轴突，显示离子分布与动作电位波形传播。无髓模式为连续传导，有髓模式为跳跃式传导。</desc>
      </svg>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel chart-panel" aria-label="膜电位时间曲线">
        <div class="panel-head"><h2>膜电位-时间曲线</h2><span>Vm(t) 实时波形</span></div>
        <svg id="chart" viewBox="0 0 320 200" role="img" aria-label="膜电位时间曲线"></svg>
      </section>
      <section class="panel ion-panel" aria-label="离子通道状态">
        <div class="panel-head"><h2>离子通道状态</h2><span>刺激点局部</span></div>
        <div class="ion-grid">
          <div class="ion-card na">
            <h3><span class="ion-dot na"></span>Na⁺ 钠离子</h3>
            <div class="state">通道：<strong id="naState">关闭</strong></div>
            <div class="flow" id="naFlow">无内流</div>
            <div class="bar"><i id="naBar"></i></div>
          </div>
          <div class="ion-card k">
            <h3><span class="ion-dot k"></span>K⁺ 钾离子</h3>
            <div class="state">通道：<strong id="kState">关闭</strong></div>
            <div class="flow" id="kFlow">无外流</div>
            <div class="bar"><i id="kBar"></i></div>
          </div>
        </div>
        <div class="insight" id="insight" data-region="insight">点击轴突施加刺激：当局部膜电位达到阈值，Na⁺ 通道开放引发去极化，随后 K⁺ 通道开放引发复极化。</div>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="模拟控制">
    <div class="actions">
      <button id="stimBtn" class="stim" type="button">施加刺激</button>
      <button id="startBtn" class="primary" type="button">启动</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control">
      <label>模式 <output id="modeOutput">无髓</output></label>
      <div class="mode-toggle" role="group">
        <button id="unmyelinatedBtn" type="button" aria-pressed="true">无髓</button>
        <button id="myelinatedBtn" type="button" aria-pressed="false">有髓</button>
      </div>
    </div>
    <div class="control">
      <label for="speedInput">时间尺度 <output id="speedOutput">1.0×</output></label>
      <input id="speedInput" type="range" min="0.3" max="3" step="0.1" value="1">
    </div>
    <div class="control">
      <label for="stimInput">刺激强度 <output id="stimOutput">1.0</output></label>
      <input id="stimInput" type="range" min="0.5" max="2" step="0.1" value="1">
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";

  // ============ 参数与状态 ============
  const N_SEGMENTS = 60;
  const SEG_LENGTH = 760 / N_SEGMENTS;
  const V_REST = -70;
  const V_THRESHOLD = -55;
  const V_PEAK = 35;
  const V_KNK = -80;
  const T_DEPOL = 0.5;
  const T_REPOL = 0.8;
  const T_HYPERPOL = 1.5;
  const T_REFRACTORY = 3.0;
  const T_AFTER = 5.0;
  const COND_UNMYEL = 60;
  const COND_MYEL_NODE = 600;
  const MYELIN_PERIOD = 5;

  const parameterSchema = [
    { key: "mode", label: "模式", type: "toggle", default: "unmyelinated" },
    { key: "speed", label: "时间尺度", type: "slider", min: 0.3, max: 3, step: 0.1, default: 1, unit: "×" },
    { key: "stimStrength", label: "刺激强度", type: "slider", min: 0.5, max: 2, step: 0.1, default: 1, unit: "" }
  ];

  const state = {
    running: false,
    t: 0,
    lastTimestamp: null,
    mode: "unmyelinated",
    speed: 1,
    stimStrength: 1,
    segments: [],
    stimCount: 0,
    chartHistory: [],
    chartFocusSeg: 0
  };

  for (let i = 0; i < N_SEGMENTS; i++) {
    state.segments.push({
      V: V_REST,
      phase: "rest",
      phaseT: 0,
      stimLevel: 0,
      stimT: 0,
      naOpen: 0,
      kOpen: 0,
      refractory: 0
    });
  }

  const elements = {
    status: document.getElementById("status"),
    scene: document.getElementById("scene"),
    chart: document.getElementById("chart"),
    insight: document.getElementById("insight"),
    naState: document.getElementById("naState"),
    kState: document.getElementById("kState"),
    naFlow: document.getElementById("naFlow"),
    kFlow: document.getElementById("kFlow"),
    naBar: document.getElementById("naBar"),
    kBar: document.getElementById("kBar"),
    modeOutput: document.getElementById("modeOutput"),
    speedOutput: document.getElementById("speedOutput"),
    stimOutput: document.getElementById("stimOutput"),
    speedInput: document.getElementById("speedInput"),
    stimInput: document.getElementById("stimInput"),
    stimBtn: document.getElementById("stimBtn"),
    startBtn: document.getElementById("startBtn"),
    pauseBtn: document.getElementById("pauseBtn"),
    resetBtn: document.getElementById("resetBtn"),
    unmyelinatedBtn: document.getElementById("unmyelinatedBtn"),
    myelinatedBtn: document.getElementById("myelinatedBtn")
  };

  // ============ 工具函数 ============
  function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
  function finite(v, fallback) { return Number.isFinite(v) ? v : fallback; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeInOut(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; }

  // ============ 动作电位波形函数 ============
  function waveformV(phase, phaseT) {
    if (phase === "rest") return V_REST;
    if (phase === "depolarization") {
      const t = clamp(phaseT / T_DEPOL, 0, 1);
      return lerp(V_REST, V_PEAK, easeInOut(t));
    }
    if (phase === "repolarization") {
      const t = clamp((phaseT - T_DEPOL) / T_REPOL, 0, 1);
      return lerp(V_PEAK, V_KNK, easeInOut(t));
    }
    if (phase === "hyperpolarization") {
      const t = clamp((phaseT - T_DEPOL - T_REPOL) / T_HYPERPOL, 0, 1);
      return lerp(V_KNK, V_REST, easeInOut(t));
    }
    return V_REST;
  }

  function phaseDuration(phase) {
    return { rest: 0, depolarization: T_DEPOL, repolarization: T_DEPOL + T_REPOL,
             hyperpolarization: T_DEPOL + T_REPOL + T_HYPERPOL }[phase] || 0;
  }

  function nextPhase(phase) {
    return { rest: "depolarization", depolarization: "repolarization",
             repolarization: "hyperpolarization", hyperpolarization: "rest" }[phase] || "rest";
  }

  function isRefractory(seg) {
    if (seg.phase === "depolarization") return true;
    if (seg.phase === "repolarization") return true;
    if (seg.phase === "hyperpolarization" && seg.phaseT < T_DEPOL + T_REPOL + 0.3) return true;
    return false;
  }

  // ============ 模型更新 ============
  function update(dt) {
    if (!state.running) return;
    const simDt = clamp(finite(dt, 0), 0, 0.05) * state.speed;
    if (simDt <= 0) return;

    state.t += simDt;

    // 1. 更新每个段：相位推进、刺激衰减
    for (const seg of state.segments) {
      if (seg.phase !== "rest") {
        seg.phaseT += simDt;
        const dur = phaseDuration(seg.phase);
        if (seg.phaseT >= dur) {
          seg.phase = nextPhase(seg.phase);
          seg.phaseT = seg.phase === "rest" ? 0 : phaseDuration(seg.phase);
          if (seg.phase === "rest") {
            seg.V = V_REST;
            seg.naOpen = 0;
            seg.kOpen = 0;
          }
        }
      }
      if (seg.stimLevel > 0) {
        seg.stimT += simDt;
        if (seg.stimT > 0.15) {
          seg.stimLevel = Math.max(0, seg.stimLevel - simDt * 8);
        }
      }
    }

    // 2. 邻居耦合：去极化段向邻居注入电流
    const injections = new Array(N_SEGMENTS).fill(0);
    for (let i = 0; i < N_SEGMENTS; i++) {
      const seg = state.segments[i];
      if (seg.phase === "depolarization" || seg.phase === "repolarization") {
        const v = waveformV(seg.phase, seg.phaseT);
        const drive = Math.max(0, v - V_REST);
        const isMyelinated = state.mode === "myelinated";
        const isNode = !isMyelinated || (i % MYELIN_PERIOD === 0);
        if (isNode) {
          const reach = isMyelinated ? MYELIN_PERIOD : 1;
          const cond = isMyelinated ? COND_MYEL_NODE : COND_UNMYEL;
          const current = drive * cond * simDt;
          for (let d = 1; d <= reach; d++) {
            if (i + d < N_SEGMENTS) injections[i + d] += current / reach;
            if (i - d >= 0) injections[i - d] += current / reach;
          }
        }
      }
    }

    // 3. 应用注入：累积刺激，检查阈值触发
    for (let i = 0; i < N_SEGMENTS; i++) {
      const seg = state.segments[i];
      seg.stimLevel += injections[i];
      seg.stimLevel = clamp(seg.stimLevel, 0, 200);

      if (seg.phase === "rest" && !isRefractory(seg) && seg.stimLevel > 15) {
        seg.phase = "depolarization";
        seg.phaseT = 0;
        seg.stimLevel = 0;
        seg.stimT = 0;
      }
    }

    // 4. 更新 V 和离子通道
    for (const seg of state.segments) {
      if (seg.phase !== "rest") {
        seg.V = waveformV(seg.phase, seg.phaseT);
      }
      // Na+ 通道：去极化期开放
      seg.naOpen = seg.phase === "depolarization" ? 1 : 0;
      // K+ 通道：复极化期开放
      seg.kOpen = seg.phase === "repolarization" ? 1 : 0;
    }

    // 5. 图表历史：记录聚焦段
    const focus = state.segments[state.chartFocusSeg];
    if (state.chartHistory.length === 0 || state.t - state.chartHistory[state.chartHistory.length - 1].t > 0.025) {
      state.chartHistory.push({ t: state.t, V: focus.V, phase: focus.phase });
      if (state.chartHistory.length > 600) state.chartHistory.shift();
    }
  }

  // ============ 渲染：场景 ============
  function renderScene() {
    const svg = elements.scene;
    const ns = "http://www.w3.org/2000/svg";
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    // defs
    const defs = document.createElementNS(ns, "defs");
    defs.innerHTML = `
      <linearGradient id="axonGrad" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#fef3c7"/>
        <stop offset="0.5" stop-color="#fde68a"/>
        <stop offset="1" stop-color="#fef3c7"/>
      </linearGradient>
      <linearGradient id="myelinGrad" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#fde68a"/>
        <stop offset="0.5" stop-color="#fbbf24"/>
        <stop offset="1" stop-color="#fde68a"/>
      </linearGradient>
      <radialGradient id="stimGlow">
        <stop offset="0" stop-color="rgba(220,38,38,0.5)"/>
        <stop offset="1" stop-color="rgba(220,38,38,0)"/>
      </radialGradient>
      <filter id="glow">
        <feGaussianBlur stdDeviation="2.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    `;
    svg.appendChild(defs);

    const axonY = 200;
    const axonH = 70;

    // 背景离子分布标注
    const bgLabel = document.createElementNS(ns, "g");
    bgLabel.innerHTML = `
      <text x="20" y="40" fill="${"#dc2626"}" font-size="13" font-weight="700">Na⁺</text>
      <text x="20" y="56" fill="${"#dc2626"}" font-size="10" font-weight="600" opacity="0.7">胞外高浓度</text>
      <text x="20" y="${axonY + axonH/2 + 4}" fill="${"#2563eb"}" font-size="13" font-weight="700" text-anchor="start">K⁺</text>
      <text x="20" y="${axonY + axonH/2 + 20}" fill="${"#2563eb"}" font-size="10" font-weight="600" opacity="0.7">胞内高浓度</text>
      <text x="740" y="40" fill="${"#64748b"}" font-size="11" font-weight="600" text-anchor="end" opacity="0.7">膜外</text>
      <text x="740" y="${axonY + axonH/2 + 20}" fill="${"#64748b"}" font-size="11" font-weight="600" text-anchor="end" opacity="0.7">膜内</text>
    `;
    svg.appendChild(bgLabel);

    // 轴突主体（膜）
    const axonRect = document.createElementNS(ns, "rect");
    axonRect.setAttribute("x", 30);
    axonRect.setAttribute("y", axonY - axonH/2);
    axonRect.setAttribute("width", 700);
    axonRect.setAttribute("height", axonH);
    axonRect.setAttribute("rx", 12);
    axonRect.setAttribute("fill", "url(#axonGrad)");
    axonRect.setAttribute("stroke", "#d97706");
    axonRect.setAttribute("stroke-width", 2);
    axonRect.setAttribute("opacity", 0.85);
    svg.appendChild(axonRect);

    // 有髓模式：髓鞘段
    if (state.mode === "myelinated") {
      for (let i = 0; i < N_SEGMENTS; i++) {
        if (i % MYELIN_PERIOD !== 0) {
          const x = 30 + i * SEG_LENGTH;
          const myelin = document.createElementNS(ns, "rect");
          myelin.setAttribute("x", x);
          myelin.setAttribute("y", axonY - axonH/2 - 8);
          myelin.setAttribute("width", SEG_LENGTH);
          myelin.setAttribute("height", axonH + 16);
          myelin.setAttribute("fill", "url(#myelinGrad)");
          myelin.setAttribute("stroke", "#d97706");
          myelin.setAttribute("stroke-width", 1.5);
          myelin.setAttribute("rx", 3);
          myelin.setAttribute("opacity", 0.92);
          svg.appendChild(myelin);
        } else {
          // 郎飞结高亮
          const x = 30 + i * SEG_LENGTH;
          const node = document.createElementNS(ns, "rect");
          node.setAttribute("x", x - 1);
          node.setAttribute("y", axonY - axonH/2 - 4);
          node.setAttribute("width", SEG_LENGTH + 2);
          node.setAttribute("height", axonH + 8);
          node.setAttribute("fill", "#fef3c7");
          node.setAttribute("stroke", "#dc2626");
          node.setAttribute("stroke-width", 2);
          node.setAttribute("rx", 4);
          svg.appendChild(node);
        }
      }
    }

    // 轴突内电位颜色编码（每段）
    for (let i = 0; i < N_SEGMENTS; i++) {
      const seg = state.segments[i];
      const x = 30 + i * SEG_LENGTH;
      const v = seg.V;
      let color;
      if (v > 0) color = `rgba(220,38,38,${clamp((v - 0) / 40, 0.3, 0.85)})`;
      else if (v > V_THRESHOLD) color = `rgba(251,146,60,${clamp((v - V_THRESHOLD) / 40, 0.3, 0.7)})`;
      else if (v < V_REST - 3) color = `rgba(37,99,235,${clamp((V_REST - v) / 15, 0.2, 0.6)})`;
      else color = "rgba(100,116,139,0.08)";

      const segRect = document.createElementNS(ns, "rect");
      segRect.setAttribute("x", x);
      segRect.setAttribute("y", axonY - axonH/2 + 4);
      segRect.setAttribute("width", SEG_LENGTH);
      segRect.setAttribute("height", axonH - 8);
      segRect.setAttribute("fill", color);
      segRect.setAttribute("rx", 2);
      svg.appendChild(segRect);
    }

    // 动作电位波形曲线（叠加在轴突上方）
    const wavePoints = [];
    for (let i = 0; i < N_SEGMENTS; i++) {
      const x = 30 + (i + 0.5) * SEG_LENGTH;
      const v = state.segments[i].V;
      const y = axonY - (v - V_REST) * 0.5;
      wavePoints.push(`${x},${y}`);
    }
    const wave = document.createElementNS(ns, "polyline");
    wave.setAttribute("points", wavePoints.join(" "));
    wave.setAttribute("fill", "none");
    wave.setAttribute("stroke", "#dc2626");
    wave.setAttribute("stroke-width", 3);
    wave.setAttribute("stroke-linejoin", "round");
    wave.setAttribute("stroke-linecap", "round");
    wave.setAttribute("filter", "url(#glow)");
    svg.appendChild(wave);

    // 静息电位基线
    const restLine = document.createElementNS(ns, "line");
    restLine.setAttribute("x1", 30);
    restLine.setAttribute("y1", axonY);
    restLine.setAttribute("x2", 730);
    restLine.setAttribute("y2", axonY);
    restLine.setAttribute("stroke", "#94a3b8");
    restLine.setAttribute("stroke-width", 1);
    restLine.setAttribute("stroke-dasharray", "4 4");
    restLine.setAttribute("opacity", 0.5);
    svg.appendChild(restLine);

    // 离子流动画：去极化段 Na+ 内流箭头，复极化段 K+ 外流箭头
    for (let i = 0; i < N_SEGMENTS; i++) {
      const seg = state.segments[i];
      const x = 30 + (i + 0.5) * SEG_LENGTH;
      if (seg.naOpen > 0) {
        // Na+ 从外向内
        const arrow = document.createElementNS(ns, "g");
        arrow.innerHTML = `
          <line x1="${x}" y1="${axonY - axonH/2 - 12}" x2="${x}" y2="${axonY - axonH/2 + 2}" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
          <polygon points="${x-4},${axonY - axonH/2 - 2} ${x+4},${axonY - axonH/2 - 2} ${x},${axonY - axonH/2 + 4}" fill="#dc2626"/>
          <text x="${x}" y="${axonY - axonH/2 - 16}" text-anchor="middle" fill="#dc2626" font-size="9" font-weight="700">Na⁺</text>
        `;
        svg.appendChild(arrow);
      }
      if (seg.kOpen > 0) {
        // K+ 从内向外
        const arrow = document.createElementNS(ns, "g");
        arrow.innerHTML = `
          <line x1="${x}" y1="${axonY + axonH/2 - 2}" x2="${x}" y2="${axonY + axonH/2 + 12}" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
          <polygon points="${x-4},${axonY + axonH/2 + 14} ${x+4},${axonY + axonH/2 + 14} ${x},${axonY + axonH/2 + 8}" fill="#2563eb"/>
          <text x="${x}" y="${axonY + axonH/2 + 26}" text-anchor="middle" fill="#2563eb" font-size="9" font-weight="700">K⁺</text>
        `;
        svg.appendChild(arrow);
      }
    }

    // 刺激点光晕
    for (let i = 0; i < N_SEGMENTS; i++) {
      const seg = state.segments[i];
      if (seg.stimLevel > 5) {
        const x = 30 + (i + 0.5) * SEG_LENGTH;
        const r = 8 + seg.stimLevel * 0.3;
        const glow = document.createElementNS(ns, "circle");
        glow.setAttribute("cx", x);
        glow.setAttribute("cy", axonY);
        glow.setAttribute("r", r);
        glow.setAttribute("fill", "url(#stimGlow)");
        svg.appendChild(glow);
      }
    }

    // 轴突方向标注
    const dirLabel = document.createElementNS(ns, "g");
    dirLabel.innerHTML = `
      <text x="30" y="${axonY + axonH/2 + 40}" fill="#64748b" font-size="11" font-weight="600">传导方向 →</text>
      <text x="730" y="${axonY - axonH/2 - 30}" fill="#64748b" font-size="10" text-anchor="end" opacity="0.7">点击此处施加刺激</text>
    `;
    svg.appendChild(dirLabel);

    // 阈值线标注
    const threshLine = document.createElementNS(ns, "line");
    threshLine.setAttribute("x1", 30);
    threshLine.setAttribute("y1", axonY - (V_THRESHOLD - V_REST) * 0.5);
    threshLine.setAttribute("x2", 730);
    threshLine.setAttribute("y2", axonY - (V_THRESHOLD - V_REST) * 0.5);
    threshLine.setAttribute("stroke", "#d97706");
    threshLine.setAttribute("stroke-width", 1);
    threshLine.setAttribute("stroke-dasharray", "6 4");
    threshLine.setAttribute("opacity", 0.6);
    svg.appendChild(threshLine);

    const threshLabel = document.createElementNS(ns, "text");
    threshLabel.setAttribute("x", 728);
    threshLabel.setAttribute("y", axonY - (V_THRESHOLD - V_REST) * 0.5 - 4);
    threshLabel.setAttribute("fill", "#d97706");
    threshLabel.setAttribute("font-size", "9");
    threshLabel.setAttribute("font-weight", "700");
    threshLabel.setAttribute("text-anchor", "end");
    threshLabel.textContent = "阈值";
    svg.appendChild(threshLabel);
  }

  // ============ 渲染：图表 ============
  function renderChart() {
    const svg = elements.chart;
    const ns = "http://www.w3.org/2000/svg";
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    const W = 320, H = 200;
    const padL = 38, padR = 12, padT = 12, padB = 28;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    // 网格
    const grid = document.createElementNS(ns, "g");
    for (let i = 0; i <= 4; i++) {
      const y = padT + (i / 4) * plotH;
      const line = document.createElementNS(ns, "line");
      line.setAttribute("x1", padL);
      line.setAttribute("y1", y);
      line.setAttribute("x2", W - padR);
      line.setAttribute("y2", y);
      line.setAttribute("stroke", "#e8edf4");
      line.setAttribute("stroke-width", 1);
      grid.appendChild(line);
    }
    for (let i = 0; i <= 5; i++) {
      const x = padL + (i / 5) * plotW;
      const line = document.createElementNS(ns, "line");
      line.setAttribute("x1", x);
      line.setAttribute("y1", padT);
      line.setAttribute("x2", x);
      line.setAttribute("y2", H - padB);
      line.setAttribute("stroke", "#e8edf4");
      line.setAttribute("stroke-width", 1);
      grid.appendChild(line);
    }
    svg.appendChild(grid);

    // Y 轴标签
    const yLabels = [-80, -55, -10, 35];
    const yVals = [V_KNK, V_THRESHOLD, 0, V_PEAK];
    const yLabelG = document.createElementNS(ns, "g");
    yVals.forEach((v, i) => {
      const y = padT + plotH - ((v - V_KNK) / (V_PEAK - V_KNK)) * plotH;
      const t = document.createElementNS(ns, "text");
      t.setAttribute("x", padL - 4);
      t.setAttribute("y", y + 3);
      t.setAttribute("fill", "#657188");
      t.setAttribute("font-size", "9");
      t.setAttribute("text-anchor", "end");
      t.textContent = yLabels[i];
      yLabelG.appendChild(t);
    });
    svg.appendChild(yLabelG);

    // 轴线
    const axisG = document.createElementNS(ns, "g");
    axisG.innerHTML = `
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="${padL - 28}" y="${padT + plotH/2}" fill="#657188" font-size="9" font-weight="700" transform="rotate(-90 ${padL - 28} ${padT + plotH/2})" text-anchor="middle">Vm (mV)</text>
      <text x="${padL + plotW/2}" y="${H - 6}" fill="#657188" font-size="9" font-weight="700" text-anchor="middle">时间 (s)</text>
    `;
    svg.appendChild(axisG);

    // 阈值线
    const threshY = padT + plotH - ((V_THRESHOLD - V_KNK) / (V_PEAK - V_KNK)) * plotH;
    const threshLine = document.createElementNS(ns, "line");
    threshLine.setAttribute("x1", padL);
    threshLine.setAttribute("y1", threshY);
    threshLine.setAttribute("x2", W - padR);
    threshLine.setAttribute("y2", threshY);
    threshLine.setAttribute("stroke", "#d97706");
    threshLine.setAttribute("stroke-width", 1);
    threshLine.setAttribute("stroke-dasharray", "4 3");
    threshLine.setAttribute("opacity", 0.6);
    svg.appendChild(threshLine);

    // 静息线
    const restY = padT + plotH - ((V_REST - V_KNK) / (V_PEAK - V_KNK)) * plotH;
    const restLine = document.createElementNS(ns, "line");
    restLine.setAttribute("x1", padL);
    restLine.setAttribute("y1", restY);
    restLine.setAttribute("x2", W - padR);
    restLine.setAttribute("y2", restY);
    restLine.setAttribute("stroke", "#94a3b8");
    restLine.setAttribute("stroke-width", 1);
    restLine.setAttribute("stroke-dasharray", "4 3");
    restLine.setAttribute("opacity", 0.5);
    svg.appendChild(restLine);

    // 波形
    if (state.chartHistory.length > 1) {
      const maxT = Math.max(5, state.t);
      const minT = Math.max(0, maxT - 5);
      const points = [];
      for (const s of state.chartHistory) {
        if (s.t < minT) continue;
        const x = padL + ((s.t - minT) / (maxT - minT)) * plotW;
        const y = padT + plotH - ((s.V - V_KNK) / (V_PEAK - V_KNK)) * plotH;
        points.push(`${x},${y}`);
      }
      const trace = document.createElementNS(ns, "polyline");
      trace.setAttribute("points", points.join(" "));
      trace.setAttribute("fill", "none");
      trace.setAttribute("stroke", "#dc2626");
      trace.setAttribute("stroke-width", 2.5);
      trace.setAttribute("stroke-linejoin", "round");
      trace.setAttribute("stroke-linecap", "round");
      svg.appendChild(trace);

      // 当前点
      if (points.length > 0) {
        const last = points[points.length - 1].split(",");
        const dot = document.createElementNS(ns, "circle");
        dot.setAttribute("cx", last[0]);
        dot.setAttribute("cy", last[1]);
        dot.setAttribute("r", 4);
        dot.setAttribute("fill", "#dc2626");
        dot.setAttribute("stroke", "#fff");
        dot.setAttribute("stroke-width", 2);
        svg.appendChild(dot);
      }
    }

    // 相位标注
    const phaseColors = { depolarization: "#dc2626", repolarization: "#2563eb", hyperpolarization: "#64748b" };
    const phaseNames = { depolarization: "去极化", repolarization: "复极化", hyperpolarization: "超极化" };
    const focus = state.segments[state.chartFocusSeg];
    if (focus.phase !== "rest") {
      const tag = document.createElementNS(ns, "text");
      tag.setAttribute("x", W - padR - 4);
      tag.setAttribute("y", padT + 10);
      tag.setAttribute("fill", phaseColors[focus.phase]);
      tag.setAttribute("font-size", "9");
      tag.setAttribute("font-weight", "700");
      tag.setAttribute("text-anchor", "end");
      tag.textContent = phaseNames[focus.phase];
      svg.appendChild(tag);
    }
  }

  // ============ 渲染：读数与洞察 ============
  function renderReadouts() {
    const focus = state.segments[state.chartFocusSeg];
    elements.naState.textContent = focus.naOpen > 0 ? "开放" : "关闭";
    elements.kState.textContent = focus.kOpen > 0 ? "开放" : "关闭";
    elements.naFlow.textContent = focus.naOpen > 0 ? "Na⁺ 内流 → 胞内" : "无内流";
    elements.kFlow.textContent = focus.kOpen > 0 ? "K⁺ 外流 → 胞外" : "无外流";
    elements.naBar.style.width = `${focus.naOpen * 100}%`;
    elements.kBar.style.width = `${focus.kOpen * 100}%`;

    const phaseNames = { rest: "静息", depolarization: "去极化", repolarization: "复极化", hyperpolarization: "超极化/不应期" };
    elements.status.textContent = phaseNames[focus.phase] || "静息";

    let insightText = "";
    if (!state.running && state.t === 0) {
      insightText = "点击轴突施加刺激：当局部膜电位达到阈值，Na⁺ 通道开放引发去极化，随后 K⁺ 通道开放引发复极化。";
    } else if (focus.phase === "depolarization") {
      insightText = "Na⁺ 通道开放，钠离子内流，膜电位快速反转至正值——这是去极化相。";
    } else if (focus.phase === "repolarization") {
      insightText = "Na⁺ 通道关闭，K⁺ 通道开放，钾离子外流，膜电位向静息水平回落——复极化相。";
    } else if (focus.phase === "hyperpolarization") {
      insightText = "K⁺ 通道延迟关闭，膜电位短暂低于静息——超极化/相对不应期。";
    } else {
      insightText = state.mode === "myelinated"
        ? "有髓模式：动作电位在郎飞结之间跳跃传导，速度远快于无髓连续传导。"
        : "无髓模式：动作电位沿轴突连续传导，每一段依次去极化。";
    }
    elements.insight.textContent = insightText;

    elements.modeOutput.textContent = state.mode === "myelinated" ? "有髓" : "无髓";
    elements.speedOutput.textContent = `${state.speed.toFixed(1)}×`;
    elements.stimOutput.textContent = state.stimStrength.toFixed(1);
  }

  function render() {
    renderScene();
    renderChart();
    renderReadouts();
  }

  // ============ 控制 ============
  function start() {
    state.running = true;
    elements.startBtn.setAttribute("aria-pressed", "true");
  }
  function pause() {
    state.running = false;
    elements.startBtn.setAttribute("aria-pressed", "false");
  }
  function reset() {
    pause();
    state.t = 0;
    state.lastTimestamp = null;
    state.chartHistory = [];
    state.chartFocusSeg = 0;
    for (const seg of state.segments) {
      seg.V = V_REST;
      seg.phase = "rest";
      seg.phaseT = 0;
      seg.stimLevel = 0;
      seg.stimT = 0;
      seg.naOpen = 0;
      seg.kOpen = 0;
    }
    render();
  }

  function stimulate(segIndex) {
    const i = clamp(Math.round(segIndex), 0, N_SEGMENTS - 1);
    const seg = state.segments[i];
    if (seg.phase === "rest" && !isRefractory(seg)) {
      seg.stimLevel += 20 * state.stimStrength;
      seg.stimT = 0;
      state.chartFocusSeg = i;
      state.stimCount++;
      if (!state.running) {
        start();
      }
    }
  }

  function setParameters(values) {
    if (values.mode !== undefined) {
      state.mode = values.mode;
      elements.unmyelinatedBtn.setAttribute("aria-pressed", values.mode === "unmyelinated" ? "true" : "false");
      elements.myelinatedBtn.setAttribute("aria-pressed", values.mode === "myelinated" ? "true" : "false");
    }
    if (values.speed !== undefined) {
      state.speed = clamp(finite(Number(values.speed), 1), 0.3, 3);
      elements.speedInput.value = String(state.speed);
    }
    if (values.stimStrength !== undefined) {
      state.stimStrength = clamp(finite(Number(values.stimStrength), 1), 0.5, 2);
      elements.stimInput.value = String(state.stimStrength);
    }
    render();
  }

  function getState() {
    return {
      running: state.running,
      t: state.t,
      mode: state.mode,
      speed: state.speed,
      stimStrength: state.stimStrength,
      segments: state.segments.map(s => ({ ...s })),
      chartFocusSeg: state.chartFocusSeg,
      stimCount: state.stimCount
    };
  }

  function getReadouts() {
    const focus = state.segments[state.chartFocusSeg];
    return {
      Vm: focus.V,
      phase: focus.phase,
      naOpen: focus.naOpen,
      kOpen: focus.kOpen,
      time: state.t,
      mode: state.mode
    };
  }

  // ============ 模型检查 ============
  function runModelChecks() {
    // 1. 静息电位正确
    const restCheck = state.segments.every(s => s.V === V_REST && s.phase === "rest");
    // 2. 波形单调性：去极化上升
    const depolRise = waveformV("depolarization", T_DEPOL * 0.3) < waveformV("depolarization", T_DEPOL * 0.7);
    // 3. 峰值正确
    const peakCorrect = Math.abs(waveformV("depolarization", T_DEPOL) - V_PEAK) < 0.1;
    // 4. 复极化下降
    const repolFall = waveformV("repolarization", T_DEPOL + T_REPOL * 0.3) > waveformV("repolarization", T_DEPOL + T_REPOL * 0.7);
    // 5. 超极化低于静息
    const hyperBelow = waveformV("hyperpolarization", T_DEPOL + T_REPOL + 0.1) < V_REST;
    // 6. 最终回归静息
    const returnRest = Math.abs(waveformV("hyperpolarization", T_DEPOL + T_REPOL + T_HYPERPOL) - V_REST) < 0.1;
    // 7. 相位顺序正确
    const phaseOrder = nextPhase("rest") === "depolarization" && nextPhase("depolarization") === "repolarization" && nextPhase("repolarization") === "hyperpolarization" && nextPhase("hyperpolarization") === "rest";
    // 8. 阈值高于静息
    const threshAbove = V_THRESHOLD > V_REST;
    // 9. 峰值高于阈值
    const peakAboveThresh = V_PEAK > V_THRESHOLD;
    // 10. 超极化低于静息
    const knkBelow = V_KNK < V_REST;

    return [
      { name: "静息电位初始化", pass: restCheck, expected: "所有段 V=-70, phase=rest", actual: restCheck ? "正确" : "错误", tolerance: "exact" },
      { name: "去极化单调上升", pass: depolRise, expected: "V 随时间上升", actual: depolRise ? "上升" : "非上升", tolerance: "strict" },
      { name: "峰值电位正确", pass: peakCorrect, expected: V_PEAK, actual: waveformV("depolarization", T_DEPOL), tolerance: 0.1 },
      { name: "复极化单调下降", pass: repolFall, expected: "V 随时间下降", actual: repolFall ? "下降" : "非下降", tolerance: "strict" },
      { name: "超极化低于静息", pass: hyperBelow, expected: "V < -70", actual: waveformV("hyperpolarization", T_DEPOL + T_REPOL + 0.1), tolerance: "strict" },
      { name: "最终回归静息", pass: returnRest, expected: V_REST, actual: waveformV("hyperpolarization", T_DEPOL + T_REPOL + T_HYPERPOL), tolerance: 0.1 },
      { name: "相位顺序正确", pass: phaseOrder, expected: "rest→depol→repol→hyper→rest", actual: phaseOrder ? "正确" : "错误", tolerance: "exact" },
      { name: "阈值高于静息", pass: threshAbove, expected: `${V_THRESHOLD} > ${V_REST}`, actual: threshAbove, tolerance: "strict" },
      { name: "峰值高于阈值", pass: peakAboveThresh, expected: `${V_PEAK} > ${V_THRESHOLD}`, actual: peakAboveThresh, tolerance: "strict" },
      { name: "超极化最低点低于静息", pass: knkBelow, expected: `${V_KNK} < ${V_REST}`, actual: knkBelow, tolerance: "strict" }
    ];
  }

  // ============ 事件绑定 ============
  function bindControls() {
    elements.startBtn.addEventListener("click", start);
    elements.pauseBtn.addEventListener("click", pause);
    elements.resetBtn.addEventListener("click", reset);
    elements.stimBtn.addEventListener("click", () => stimulate(Math.floor(N_SEGMENTS / 4)));
    elements.unmyelinatedBtn.addEventListener("click", () => setParameters({ mode: "unmyelinated" }));
    elements.myelinatedBtn.addEventListener("click", () => setParameters({ mode: "myelinated" }));
    elements.speedInput.addEventListener("input", () => setParameters({ speed: elements.speedInput.value }));
    elements.stimInput.addEventListener("input", () => setParameters({ stimStrength: elements.stimInput.value }));

    // 点击轴突施加刺激
    elements.scene.addEventListener("click", (e) => {
      const rect = elements.scene.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 760;
      const segIndex = (x - 30) / SEG_LENGTH;
      if (segIndex >= 0 && segIndex < N_SEGMENTS) {
        stimulate(segIndex);
      }
    });
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  function init() {
    bindControls();
    setParameters({ mode: "unmyelinated", speed: 1, stimStrength: 1 });
    reset();
    requestAnimationFrame(frame);
  }

  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks, stimulate };
  init();
})();
</script>
</body>
</html>
