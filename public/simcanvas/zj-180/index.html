<style>

<body>
<canvas id="canvas" data-region="stage" aria-label="极光山峦动态背景"></canvas>

<header class="header" data-region="header">
  <h1>Aurora Ridge — 极光山峦</h1>
  <span class="purpose">山脊轮廓 y = Σ Aᵢ·sin(kᵢ·x + φᵢ)</span>
  <div id="status" class="status" role="status" aria-live="polite">运行中</div>
</header>

<div class="formula" data-region="insight" aria-hidden="true">
  <span class="label">山脊轮廓</span> <span class="eq">y = Σ Aᵢ·sin(kᵢ·x + φᵢ)</span>
</div>

<aside class="evidence" data-region="evidence" aria-label="实时读数">
  <div class="metric"><small>时间</small><strong id="timeReadout">0.0 s</strong></div>
  <div class="metric"><small>状态</small><strong id="runReadout">运行</strong></div>
  <div class="metric"><small>山层</small><strong id="layerReadout">6</strong></div>
  <div class="metric"><small>极光带</small><strong id="bandReadout">4</strong></div>
</aside>

<button id="playBtn" class="play-btn" data-region="controls" type="button" aria-label="播放或暂停动画" title="播放 / 暂停">
  <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
</button>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const statusEl = document.getElementById('status');
  const timeReadout = document.getElementById('timeReadout');
  const runReadout = document.getElementById('runReadout');
  const layerReadout = document.getElementById('layerReadout');
  const bandReadout = document.getElementById('bandReadout');

  const PAUSE_ICON = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
  const PLAY_ICON = '<path d="M7 4v16l13-8z"/>';

  // ---- 确定性伪随机（固定种子，无每帧闪烁）----
  function mulberry32(seed) {
    let s = seed >>> 0;
    return function() {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(20240916);

  // ---- 状态 ----
  const state = {
    running: true,
    t: 0,
    lastTs: null,
    W: 0, H: 0, dpr: 1,
    mountains: [],
    aurora: [],
    stars: [],
    bgGrad: null
  };

  // ---- 山层配置：6 层，远→近 ----
  function buildMountains() {
    const layers = [];
    for (let i = 0; i < 6; i++) {
      const depth = i / 5;
      const waveCount = 3 + Math.floor(rand() * 2 + 0.5);
      const waves = [];
      for (let j = 0; j < waveCount; j++) {
        waves.push({
          amp: (0.018 + depth * 0.085) * (1 - j * 0.18),
          freq: (0.0035 + depth * 0.012) * (1 + j * 0.45),
          phase: rand() * Math.PI * 2
        });
      }
      // 大气透视：远淡蓝 → 近纯黑
      const lightness = 0.30 - depth * 0.30;
      const blueShift = 0.55 - depth * 0.50;
      const baseR = Math.floor(8 + lightness * 38 + blueShift * 18);
      const baseG = Math.floor(14 + lightness * 46 + blueShift * 26);
      const baseB = Math.floor(26 + lightness * 60 + blueShift * 52);
      const topR = Math.floor(baseR * 0.55 + 6);
      const topG = Math.floor(baseG * 0.62 + 8);
      const topB = Math.floor(baseB * 0.72 + 14);
      layers.push({
        waves,
        baseY: 0.40 + depth * 0.105,
        ampScale: 0.85 + depth * 0.5,
        driftSpeed: 0.0008 + depth * 0.0028,
        driftAmp: 1.5 + depth * 4.5,
        driftPhase: rand() * Math.PI * 2,
        fill: { baseR, baseG, baseB, topR, topG, topB },
        ridgeColor: `rgba(${Math.floor(120 + depth * 40)}, ${Math.floor(200 + depth * 30)}, ${Math.floor(220 + depth * 20)}, ${0.10 + depth * 0.06})`,
        ridgeCore: `rgba(${Math.floor(180 + depth * 30)}, ${Math.floor(235 + depth * 15)}, ${Math.floor(245 + depth * 10)}, ${0.20 + depth * 0.10})`,
        depth
      });
    }
    return layers;
  }

  // ---- 极光帷幕：3-4 条，brightness(x,t)=sin(kx-ωt) ----
  function buildAurora() {
    const bands = [];
    const count = 4;
    for (let i = 0; i < count; i++) {
      const hue = i / (count - 1);
      let r, g, b;
      if (hue < 0.5) {
        const k = hue * 2;
        r = Math.floor(40 + k * 30);
        g = Math.floor(235 - k * 35);
        b = Math.floor(180 + k * 45);
      } else {
        const k = (hue - 0.5) * 2;
        r = Math.floor(70 + k * 130);
        g = Math.floor(200 - k * 90);
        b = Math.floor(225 - k * 25);
      }
      bands.push({
        xCenter: 0.12 + i * 0.245 + (rand() - 0.5) * 0.04,
        width: 0.05 + rand() * 0.035,
        k: 0.004 + rand() * 0.005,
        omega: 0.18 + rand() * 0.14,
        phase: rand() * Math.PI * 2,
        topY: 0.02 + rand() * 0.04,
        bottomY: 0.30 + rand() * 0.06,
        color: { r, g, b },
        intensity: 0.55 + rand() * 0.25,
        drapeCount: 5 + Math.floor(rand() * 3)
      });
    }
    return bands;
  }

  // ---- 星点（固定位置，呼吸闪烁由确定性函数驱动）----
  function buildStars() {
    const stars = [];
    const count = 90;
    for (let i = 0; i < count; i++) {
      stars.push({
        x: rand(),
        y: rand() * 0.42,
        size: 0.4 + rand() * 1.1,
        baseAlpha: 0.25 + rand() * 0.55,
        twinkleSpeed: 0.4 + rand() * 1.6,
        twinklePhase: rand() * Math.PI * 2
      });
    }
    return stars;
  }

  // ---- 初始化与 resize ----
  function resize() {
    state.dpr = Math.min(window.devicePixelRatio || 1, 2);
    state.W = window.innerWidth;
    state.H = window.innerHeight;
    canvas.width = Math.floor(state.W * state.dpr);
    canvas.height = Math.floor(state.H * state.dpr);
    canvas.style.width = state.W + 'px';
    canvas.style.height = state.H + 'px';
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    state.bgGrad = ctx.createLinearGradient(0, 0, 0, state.H);
    state.bgGrad.addColorStop(0, '#04060e');
    state.bgGrad.addColorStop(0.45, '#070b18');
    state.bgGrad.addColorStop(0.75, '#0a0f1c');
    state.bgGrad.addColorStop(1, '#0c1220');
  }

  function init() {
    state.mountains = buildMountains();
    state.aurora = buildAurora();
    state.stars = buildStars();
    resize();
    window.addEventListener('resize', resize);
    playBtn.addEventListener('click', togglePlay);
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        togglePlay();
      }
    });
    requestAnimationFrame(frame);
  }

  function togglePlay() {
    if (state.running) pause();
    else start();
  }

  function start() {
    state.running = true;
    playIcon.innerHTML = PAUSE_ICON;
    playBtn.setAttribute('aria-label', '暂停动画');
    statusEl.textContent = '运行中';
  }

  function pause() {
    state.running = false;
    playIcon.innerHTML = PLAY_ICON;
    playBtn.setAttribute('aria-label', '播放动画');
    statusEl.textContent = '已暂停';
  }

  function reset() {
    state.t = 0;
    state.lastTs = null;
    render();
  }

  function update(dt) {
    if (!state.running) return;
    const boundedDt = Math.max(0, Math.min(Number.isFinite(dt) ? dt : 0, 0.05));
    state.t += boundedDt;
  }

  function setParameters(values) {
    // 本动画无可调参数；保留钩子以满足运行时契约。
    // values 被有意忽略，不影响动画主题与交互。
    return void (values || {});
  }

  function getState() {
    return {
      running: state.running,
      t: state.t,
      mountainLayers: state.mountains.length,
      auroraBands: state.aurora.length,
      starCount: state.stars.length
    };
  }

  function getReadouts() {
    return {
      t: state.t,
      running: state.running,
      mountainLayers: state.mountains.length,
      auroraBands: state.aurora.length
    };
  }

  // ---- 山脊高度函数 y = Σ Aᵢ·sin(kᵢ·x + φᵢ) ----
  function ridgeY(layer, x, drift) {
    let y = 0;
    const waves = layer.waves;
    for (let j = 0; j < waves.length; j++) {
      const w = waves[j];
      y += w.amp * Math.sin(w.freq * (x + drift) + w.phase);
    }
    return y * layer.ampScale;
  }

  // ---- 绘制：天空底色 + 星点 ----
  function drawSky() {
    ctx.fillStyle = state.bgGrad;
    ctx.fillRect(0, 0, state.W, state.H);
    const stars = state.stars;
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const tw = 0.5 + 0.5 * Math.sin(state.t * s.twinkleSpeed + s.twinklePhase);
      const a = s.baseAlpha * (0.45 + tw * 0.55);
      ctx.fillStyle = `rgba(220, 232, 250, ${a})`;
      ctx.beginPath();
      ctx.arc(s.x * state.W, s.y * state.H, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- 绘制：极光帷幕 ----
  function drawAurora() {
    const W = state.W, H = state.H, t = state.t;
    const bands = state.aurora;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let bi = 0; bi < bands.length; bi++) {
      const b = bands[bi];
      const c = b.color;
      const cx = b.xCenter * W;
      const halfW = b.width * W;
      const topY = b.topY * H;
      const bottomY = b.bottomY * H;
      const bandH = bottomY - topY;

      // 1) 主体竖直渐变细带，沿 x 方向 sin(kx-ωt) 调制
      const step = 3;
      for (let x = 0; x <= W; x += step) {
        const dx = x - cx;
        const u = dx / halfW;
        if (u < -1.4 || u > 1.4) continue;
        const env = Math.exp(-u * u * 1.6);
        const wave = 0.5 + 0.5 * Math.sin(b.k * x - b.omega * t + b.phase);
        const intensity = env * wave * b.intensity;
        if (intensity < 0.004) continue;

        const grad = ctx.createLinearGradient(0, topY, 0, bottomY);
        grad.addColorStop(0, `rgba(${c.r},${c.g},${c.b},0)`);
        grad.addColorStop(0.18, `rgba(${c.r},${c.g},${c.b},${(intensity * 0.55).toFixed(3)})`);
        grad.addColorStop(0.50, `rgba(${c.r},${c.g},${c.b},${(intensity * 0.95).toFixed(3)})`);
        grad.addColorStop(0.82, `rgba(${c.r},${c.g},${c.b},${(intensity * 0.45).toFixed(3)})`);
        grad.addColorStop(1, `rgba(${c.r},${c.g},${c.b},0)`);
        ctx.fillStyle = grad;
        ctx.fillRect(x, topY, step + 1, bandH);
      }

      // 2) 垂直帘幕纹理：细竖线，亮度由 sin(kx-ωt) 调制
      const drapeStep = 7;
      for (let di = 0; di < b.drapeCount; di++) {
        const drapeU = (di + 0.5) / b.drapeCount - 0.5;
        const drapeX = cx + drapeU * halfW * 1.7;
        const localEnv = Math.exp(-drapeU * drapeU * 3.2);
        const wave = 0.5 + 0.5 * Math.sin(b.k * drapeX - b.omega * t + b.phase + di * 0.35);
        const intensity = localEnv * wave * b.intensity * 0.85;
        if (intensity < 0.01) continue;

        const dGrad = ctx.createLinearGradient(0, topY, 0, bottomY);
        dGrad.addColorStop(0, `rgba(${c.r},${c.g},${c.b},0)`);
        dGrad.addColorStop(0.5, `rgba(${c.r},${c.g},${c.b},${(intensity * 0.7).toFixed(3)})`);
        dGrad.addColorStop(1, `rgba(${c.r},${c.g},${c.b},0)`);
        ctx.fillStyle = dGrad;
        ctx.fillRect(drapeX - 1.2, topY, 2.4, bandH);
      }
    }
    ctx.restore();
  }

  // ---- 绘制：单层山峦剪影 + 山顶发光边 ----
  function drawMountain(layer) {
    const W = state.W, H = state.H;
    const drift = Math.sin(state.t * layer.driftSpeed + layer.driftPhase) * layer.driftAmp;
    const baseY = layer.baseY * H;

    // 收集轮廓点
    const points = [];
    const step = 2;
    for (let x = 0; x <= W; x += step) {
      points.push({ x, y: baseY + ridgeY(layer, x, drift) * H });
    }

    // 1) 填充：createLinearGradient 分层填充
    const minY = points.reduce((m, p) => p.y < m ? p.y : m, Infinity);
    const grad = ctx.createLinearGradient(0, minY, 0, H);
    const f = layer.fill;
    grad.addColorStop(0, `rgb(${f.topR},${f.topG},${f.topB})`);
    grad.addColorStop(0.4, `rgb(${f.baseR},${f.baseG},${f.baseB})`);
    grad.addColorStop(1, `rgb(${Math.floor(f.baseR * 0.4)},${Math.floor(f.baseG * 0.4)},${Math.floor(f.baseB * 0.5)})`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let i = 0; i < points.length; i++) {
      ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    // 2) 山顶棱线发光边：双层绘制模拟 glow（禁用 shadowBlur）
    // 粗线条低透明度一遍
    ctx.strokeStyle = layer.ridgeColor;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.stroke();

    // 细线条高透明度一遍
    ctx.strokeStyle = layer.ridgeCore;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.stroke();
  }

  // ---- 绘制：极光在最近山体向上侧的淡淡映色 ----
  function drawAuroraReflection() {
    const W = state.W, H = state.H, t = state.t;
    const last = state.mountains[state.mountains.length - 1];
    const drift = Math.sin(state.t * last.driftSpeed + last.driftPhase) * last.driftAmp;
    const baseY = last.baseY * H;
    const bands = state.aurora;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let bi = 0; bi < bands.length; bi++) {
      const b = bands[bi];
      const c = b.color;
      const cx = b.xCenter * W;
      const halfW = b.width * W * 1.6;

      const step = 4;
      for (let x = 0; x <= W; x += step) {
        const dx = x - cx;
        const u = dx / halfW;
        if (u < -1.2 || u > 1.2) continue;
        const env = Math.exp(-u * u * 1.8);
        const wave = 0.5 + 0.5 * Math.sin(b.k * x - b.omega * t + b.phase);
        const intensity = env * wave * b.intensity * 0.22;
        if (intensity < 0.003) continue;

        const ridgeYVal = baseY + ridgeY(last, x, drift) * H;
        const reflTop = ridgeYVal + 2;
        const reflH = 70;
        const grad = ctx.createLinearGradient(0, reflTop, 0, reflTop + reflH);
        grad.addColorStop(0, `rgba(${c.r},${c.g},${c.b},${(intensity * 0.85).toFixed(3)})`);
        grad.addColorStop(0.5, `rgba(${c.r},${c.g},${c.b},${(intensity * 0.35).toFixed(3)})`);
        grad.addColorStop(1, `rgba(${c.r},${c.g},${c.b},0)`);
        ctx.fillStyle = grad;
        ctx.fillRect(x, reflTop, step + 1, reflH);
      }
    }
    ctx.restore();
  }

  // ---- 主绘制 ----
  function render() {
    drawSky();
    drawAurora();
    const mountains = state.mountains;
    for (let i = 0; i < mountains.length; i++) {
      drawMountain(mountains[i]);
    }
    drawAuroraReflection();

    // 同步 evidence 读数
    timeReadout.textContent = state.t.toFixed(1) + ' s';
    runReadout.textContent = state.running ? '运行' : '暂停';
    layerReadout.textContent = String(state.mountains.length);
    bandReadout.textContent = String(state.aurora.length);
  }

  // ---- 帧循环 ----
  function frame(ts) {
    if (state.lastTs === null) state.lastTs = ts;
    const dt = (ts - state.lastTs) / 1000;
    state.lastTs = ts;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // ---- 模型检查（确定性 + 有限性 + 趋势）----
  function runModelChecks() {
    const checks = [];

    // 1) 伪随机确定性：同种子两次构建应产生相同配置
    const r1 = mulberry32(20240916);
    const r2 = mulberry32(20240916);
    let detOk = true;
    for (let i = 0; i < 100; i++) {
      if (r1() !== r2()) { detOk = false; break; }
    }
    checks.push({ name: '伪随机确定性（固定种子）', pass: detOk, expected: '两次序列完全相同', actual: detOk ? '相同' : '不同', tolerance: '严格' });

    // 2) 山层趋势：越近振幅越大、频率越高
    const ms = buildMountains();
    let trendOk = true;
    for (let i = 1; i < ms.length; i++) {
      const prev = ms[i - 1], cur = ms[i];
      const prevAmp = prev.waves[0].amp;
      const curAmp = cur.waves[0].amp;
      const prevFreq = prev.waves[0].freq;
      const curFreq = cur.waves[0].freq;
      if (curAmp < prevAmp || curFreq < prevFreq) { trendOk = false; break; }
    }
    checks.push({ name: '山层趋势（近层振幅/频率更大）', pass: trendOk, expected: 'amp 与 freq 随 depth 递增', actual: trendOk ? '递增' : '非递增', tolerance: '严格' });

    // 3) 大气透视：越近颜色越暗（baseB 递减）
    let atmoOk = true;
    for (let i = 1; i < ms.length; i++) {
      if (ms[i].fill.baseB > ms[i - 1].fill.baseB) { atmoOk = false; break; }
    }
    checks.push({ name: '大气透视（近层更暗）', pass: atmoOk, expected: 'baseB 随 depth 递减', actual: atmoOk ? '递减' : '非递减', tolerance: '严格' });

    // 4) ridgeY 有限性
    let finiteOk = true;
    for (let i = 0; i < ms.length; i++) {
      for (let x = 0; x < 2000; x += 10) {
        const y = ridgeY(ms[i], x, 0);
        if (!Number.isFinite(y)) { finiteOk = false; break; }
      }
      if (!finiteOk) break;
    }
    checks.push({ name: 'ridgeY 有限性', pass: finiteOk, expected: '所有点有限', actual: finiteOk ? '有限' : '含非有限值', tolerance: '严格' });

    // 5) 极光 brightness(x,t)=sin(kx-ωt) 周期性：t 增加 2π/ω 后亮度相同
    const b = state.aurora[0] || buildAurora()[0];
    const xTest = 500;
    const T = (2 * Math.PI) / b.omega;
    const v1 = Math.sin(b.k * xTest - b.omega * 0 + b.phase);
    const v2 = Math.sin(b.k * xTest - b.omega * T + b.phase);
    const periodOk = Math.abs(v1 - v2) < 1e-9;
    checks.push({ name: '极光亮度函数周期性', pass: periodOk, expected: v1.toFixed(6), actual: v2.toFixed(6), tolerance: 1e-9 });

    // 6) 视差漂移：远慢近快（driftSpeed 随 depth 递增）
    let driftOk = true;
    for (let i = 1; i < ms.length; i++) {
      if (ms[i].driftSpeed <= ms[i - 1].driftSpeed) { driftOk = false; break; }
    }
    checks.push({ name: '视差漂移（远慢近快）', pass: driftOk, expected: 'driftSpeed 随 depth 递增', actual: driftOk ? '递增' : '非递增', tolerance: '严格' });

    return checks;
  }

  window.simulation = {
    init,
    start,
    pause,
    reset,
    update,
    render,
    setParameters,
    getState,
    getReadouts,
    runModelChecks
  };

  init();
})();
</script>
