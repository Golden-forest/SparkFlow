<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>莫尔条纹生成器</title>
  <style>
    :root {
      color-scheme: dark;
      --sim-bg: #05080f;
      --sim-surface: #0a0e1a;
      --sim-surface-soft: #0e1422;
      --sim-text: #e8eefc;
      --sim-muted: #6b7a99;
      --sim-border: #1a2238;
      --sim-grid: #131a2b;
      --sim-accent: #c8d4e8;
      --sim-accent-deep: #8a9bb8;
      --sim-accent-soft: #1a2238;
      --sim-positive: #c8d4e8;
      --sim-warning: #d97706;
      --sim-danger: #dc2626;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: var(--sim-bg);
      color: var(--sim-text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .app {
      width: 100vw; height: 100vh; height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      gap: 0;
    }

    /* HEADER */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 18px; padding: 14px 24px 6px;
    }
    .header-left h1 {
      font-size: clamp(1.1rem, 1.8vw, 1.5rem);
      font-weight: 700; letter-spacing: -0.02em; line-height: 1.1;
    }
    .header-left p {
      font-size: 0.78rem; color: var(--sim-muted); margin-top: 3px;
    }
    .status {
      font-size: 0.82rem; color: var(--sim-muted);
      font-weight: 600; white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .status .v { color: var(--sim-text); font-weight: 700; }

    /* STAGE */
    .stage {
      position: relative; min-height: 0; overflow: hidden;
      background: var(--sim-bg);
    }
    #scene {
      position: absolute; inset: 0;
      width: 100%; height: 100%; display: block;
    }
    .stage-hint {
      position: absolute; bottom: 10px; left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem; color: var(--sim-muted);
      opacity: 0.55; pointer-events: none;
      letter-spacing: 0.04em;
    }

    /* EVIDENCE + INSIGHT STRIP */
    .info-strip {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
      gap: 1px;
      background: var(--sim-border);
      border-top: 1px solid var(--sim-border);
    }
    .evidence {
      background: var(--sim-surface);
      padding: 10px 20px;
      display: flex; align-items: center; gap: 18px;
      flex-wrap: wrap;
    }
    .evidence-label {
      font-size: 0.68rem; color: var(--sim-muted);
      font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .evidence-value {
      font-size: 0.92rem; color: var(--sim-text);
      font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .insight {
      background: var(--sim-surface);
      padding: 10px 20px;
      border-left: 3px solid var(--sim-warning);
      display: flex; align-items: center;
      font-size: 0.82rem; color: #d4a05a;
      font-weight: 600; line-height: 1.4;
    }

    /* CONTROLS */
    .controls {
      display: flex; align-items: center; justify-content: center;
      gap: 18px; padding: 12px 20px 16px;
      background: linear-gradient(to top, rgba(5,8,15,0.96), rgba(5,8,15,0.4));
      flex-wrap: wrap;
    }
    .ctrl-group {
      display: flex; align-items: center; gap: 10px;
    }
    .ctrl-label {
      font-size: 0.72rem; color: var(--sim-muted);
      font-weight: 600; letter-spacing: 0.02em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .pattern-select {
      appearance: none; -webkit-appearance: none;
      background: var(--sim-surface-soft);
      border: 1px solid var(--sim-border);
      color: var(--sim-text);
      padding: 8px 30px 8px 12px;
      border-radius: var(--sim-radius-sm);
      font-size: 0.82rem; font-weight: 600;
      cursor: pointer;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%236b7a99' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
      transition: border-color 0.15s, background 0.15s;
    }
    .pattern-select:hover { border-color: var(--sim-accent-deep); }
    .pattern-select:focus-visible {
      outline: 2px solid var(--sim-accent-deep);
      outline-offset: 2px;
    }
    .slider-group {
      display: flex; align-items: center; gap: 8px;
    }
    .slider-group .ctrl-label { min-width: 36px; }
    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 130px; height: 4px;
      background: var(--sim-border);
      border-radius: 2px; cursor: pointer;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--sim-accent);
      cursor: pointer;
      box-shadow: 0 0 0 3px rgba(200,212,232,0.15);
      transition: box-shadow 0.15s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      box-shadow: 0 0 0 5px rgba(200,212,232,0.22);
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px; border: none; border-radius: 50%;
      background: var(--sim-accent); cursor: pointer;
    }
    .slider-value {
      font-size: 0.82rem; color: var(--sim-text);
      font-weight: 700; min-width: 52px;
      font-variant-numeric: tabular-nums;
    }
    .btn {
      background: var(--sim-surface-soft);
      border: 1px solid var(--sim-border);
      color: var(--sim-text);
      padding: 8px 16px; border-radius: var(--sim-radius-sm);
      font-size: 0.82rem; font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }
    .btn:hover { border-color: var(--sim-accent-deep); background: #131a2b; }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible {
      outline: 2px solid var(--sim-accent-deep);
      outline-offset: 2px;
    }
    .btn.primary {
      background: linear-gradient(135deg, #2a3550, #1a2238);
      border-color: var(--sim-accent-deep);
    }
    .btn[aria-pressed="true"] {
      box-shadow: inset 0 0 0 1px var(--sim-accent);
    }

    @media (max-width: 720px) {
      .controls { gap: 10px; padding: 10px 12px 14px; }
      .ctrl-group { gap: 6px; }
      input[type="range"] { width: 90px; }
      .header { padding: 10px 14px 4px; }
      .stage-hint { display: none; }
      .info-strip { grid-template-columns: 1fr; }
      .insight { border-left: none; border-top: 3px solid var(--sim-warning); }
    }
    @media (max-width: 480px) {
      .controls { flex-direction: column; align-items: stretch; }
      .ctrl-group { justify-content: space-between; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app" data-layout="visualization-first" data-model-tier="qualitative" data-sim-title="莫尔条纹生成器">
    <header class="header" data-region="header">
      <div class="header-left">
        <h1>莫尔条纹生成器</h1>
        <p>两层规则图案叠加 · 微小角度偏移被放大为宏观条纹</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">
        角度 <span class="v" id="angleDisplay">0.0°</span>　间距 <span class="v" id="spacingDisplay">24px</span>
      </div>
    </header>

    <section class="stage" data-region="stage" aria-label="莫尔条纹主舞台">
      <canvas id="scene" role="img" aria-label="两组叠加图案产生的莫尔条纹可视化"></canvas>
      <div class="stage-hint">拖动舞台可手动旋转上层图案</div>
    </section>

    <div class="info-strip">
      <section class="evidence" data-region="evidence" aria-label="实时读数">
        <div>
          <div class="evidence-label">图案 A</div>
          <div class="evidence-value" id="evidencePatternA">同心圆</div>
        </div>
        <div>
          <div class="evidence-label">图案 B</div>
          <div class="evidence-value" id="evidencePatternB">直线栅</div>
        </div>
        <div>
          <div class="evidence-label">间距</div>
          <div class="evidence-value" id="evidenceSpacing">24 px</div>
        </div>
        <div>
          <div class="evidence-label">角度</div>
          <div class="evidence-value" id="evidenceAngle">0.0°</div>
        </div>
      </section>
      <section class="insight" data-region="insight" aria-label="观察提示">
        <span id="insightText">微调角度滑块，观察宏观条纹如何从两层图案的微小偏移中浮现。</span>
      </section>
    </div>

    <section class="controls" data-region="controls" aria-label="参数控件">
      <div class="ctrl-group">
        <label class="ctrl-label" for="patternA">图案 A</label>
        <select id="patternA" class="pattern-select">
          <option value="rings">同心圆</option>
          <option value="radial">放射线</option>
          <option value="lines">直线栅</option>
          <option value="dots">点阵</option>
        </select>
      </div>
      <div class="ctrl-group">
        <label class="ctrl-label" for="patternB">图案 B</label>
        <select id="patternB" class="pattern-select">
          <option value="rings">同心圆</option>
          <option value="radial">放射线</option>
          <option value="lines" selected>直线栅</option>
          <option value="dots">点阵</option>
        </select>
      </div>
      <div class="ctrl-group slider-group">
        <label class="ctrl-label" for="spacingInput">间距</label>
        <input id="spacingInput" type="range" min="8" max="60" step="1" value="24">
        <span class="slider-value" id="spacingValue">24 px</span>
      </div>
      <div class="ctrl-group slider-group">
        <label class="ctrl-label" for="angleInput">角度</label>
        <input id="angleInput" type="range" min="-15" max="15" step="0.1" value="0">
        <span class="slider-value" id="angleValue">0.0°</span>
      </div>
      <div class="ctrl-group">
        <button id="playBtn" class="btn primary" type="button" aria-pressed="false">自动旋转</button>
        <button id="resetBtn" class="btn" type="button">重置</button>
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";

    const PATTERNS = ["rings", "radial", "lines", "dots"];
    const PATTERN_LABELS = {
      rings: "同心圆", radial: "放射线", lines: "直线栅", dots: "点阵"
    };

    const state = {
      patternA: "rings",
      patternB: "lines",
      spacing: 24,
      angle: 0,
      autoPlay: false,
      autoSpeed: 0.35,
      isDragging: false,
      lastTimestamp: null,
      dragCenter: null,
      dragStartAngle: 0,
      dragStartMouseAngle: 0
    };

    const elements = {
      canvas: document.getElementById("scene"),
      patternA: document.getElementById("patternA"),
      patternB: document.getElementById("patternB"),
      spacingInput: document.getElementById("spacingInput"),
      spacingValue: document.getElementById("spacingValue"),
      angleInput: document.getElementById("angleInput"),
      angleValue: document.getElementById("angleValue"),
      angleDisplay: document.getElementById("angleDisplay"),
      spacingDisplay: document.getElementById("spacingDisplay"),
      evidencePatternA: document.getElementById("evidencePatternA"),
      evidencePatternB: document.getElementById("evidencePatternB"),
      evidenceSpacing: document.getElementById("evidenceSpacing"),
      evidenceAngle: document.getElementById("evidenceAngle"),
      insightText: document.getElementById("insightText"),
      playBtn: document.getElementById("playBtn"),
      resetBtn: document.getElementById("resetBtn")
    };

    const ctx = elements.canvas.getContext("2d");
    let dpr = 1;
    let canvasW = 0, canvasH = 0;

    function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
    function finite(v, fb) { return Number.isFinite(v) ? v : fb; }

    function resizeCanvas() {
      dpr = window.devicePixelRatio || 1;
      const rect = elements.canvas.getBoundingClientRect();
      canvasW = Math.max(1, rect.width);
      canvasH = Math.max(1, rect.height);
      elements.canvas.width = Math.round(canvasW * dpr);
      elements.canvas.height = Math.round(canvasH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      render();
    }

    function drawPattern(pattern, cx, cy, w, h, spacing, rotation) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);
      ctx.fillStyle = "#ffffff";
      const maxR = Math.sqrt(w * w + h * h) * 0.75 + 60;
      const halfW = w / 2 + 60;
      const halfH = h / 2 + 60;

      if (pattern === "rings") {
        for (let r = spacing / 2; r < maxR; r += spacing) {
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (pattern === "radial") {
        const count = Math.max(8, Math.round((Math.PI * 2 * spacing) / (spacing * 0.5)));
        const actualCount = Math.max(8, Math.round(360 / (spacing * 1.5)));
        const stepAngle = (Math.PI * 2) / actualCount;
        const thickness = Math.max(1, spacing * 0.12);
        for (let i = 0; i < actualCount; i++) {
          const a = i * stepAngle;
          ctx.save();
          ctx.rotate(a);
          ctx.fillRect(-thickness / 2, 0, thickness, maxR);
          ctx.restore();
        }
      } else if (pattern === "lines") {
        const thickness = Math.max(1, spacing * 0.3);
        for (let x = -halfW; x <= halfW; x += spacing) {
          ctx.fillRect(x - thickness / 2, -halfH, thickness, halfH * 2);
        }
      } else if (pattern === "dots") {
        const r = Math.max(1.2, spacing * 0.18);
        for (let x = -halfW; x <= halfW; x += spacing) {
          for (let y = -halfH; y <= halfH; y += spacing) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
      ctx.restore();
    }

    function render() {
      if (canvasW === 0 || canvasH === 0) return;
      ctx.clearRect(0, 0, canvasW, canvasH);
      ctx.fillStyle = "#05080f";
      ctx.fillRect(0, 0, canvasW, canvasH);

      const cx = canvasW / 2;
      const cy = canvasH / 2;
      const sp = Math.max(4, state.spacing);
      const ang = (state.angle * Math.PI) / 180;

      ctx.globalCompositeOperation = "source-over";
      drawPattern(state.patternA, cx, cy, canvasW, canvasH, sp, 0);
      ctx.globalCompositeOperation = "multiply";
      drawPattern(state.patternB, cx, cy, canvasW, canvasH, sp, ang);
      ctx.globalCompositeOperation = "source-over";
    }

    function updateInsight() {
      const absA = Math.abs(state.angle);
      let text;
      if (absA < 0.3) {
        text = "角度近零：两层图案几乎重合，宏观条纹尚未显现。微调角度即可看到条纹浮现。";
      } else if (absA < 3) {
        text = "小角度偏移：条纹间距最大，微小角度差被放大为肉眼可见的宏观条纹。";
      } else if (absA < 8) {
        text = "中等角度：条纹间距随角度增大而缩小，条纹方向与图案偏转方向相关。";
      } else {
        text = "大角度：条纹变得细密，放大效应减弱，两层图案趋于独立可辨。";
      }
      elements.insightText.textContent = text;
    }

    function updateReadouts() {
      const aStr = state.angle.toFixed(1);
      elements.angleValue.textContent = aStr + "°";
      elements.angleDisplay.textContent = aStr + "°";
      elements.spacingValue.textContent = state.spacing + " px";
      elements.spacingDisplay.textContent = state.spacing + "px";
      elements.evidencePatternA.textContent = PATTERN_LABELS[state.patternA] || state.patternA;
      elements.evidencePatternB.textContent = PATTERN_LABELS[state.patternB] || state.patternB;
      elements.evidenceSpacing.textContent = state.spacing + " px";
      elements.evidenceAngle.textContent = aStr + "°";
      updateInsight();
    }

    function update(dt) {
      if (state.autoPlay && !state.isDragging) {
        const boundedDt = clamp(finite(dt, 0), 0, 0.05);
        state.angle += state.autoSpeed * boundedDt;
        if (state.angle > 15) state.angle = -15;
        if (state.angle < -15) state.angle = 15;
        elements.angleInput.value = state.angle.toFixed(1);
      }
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      updateReadouts();
      requestAnimationFrame(frame);
    }

    function setParameters(values) {
      if (values.patternA !== undefined) state.patternA = values.patternA;
      if (values.patternB !== undefined) state.patternB = values.patternB;
      if (values.spacing !== undefined) state.spacing = clamp(Math.round(Number(values.spacing)), 8, 60);
      if (values.angle !== undefined) state.angle = clamp(finite(Number(values.angle), 0), -15, 15);
      render();
      updateReadouts();
    }

    function start() {
      state.autoPlay = true;
      elements.playBtn.textContent = "停止旋转";
      elements.playBtn.setAttribute("aria-pressed", "true");
    }
    function pause() {
      state.autoPlay = false;
      elements.playBtn.textContent = "自动旋转";
      elements.playBtn.setAttribute("aria-pressed", "false");
    }
    function reset() {
      pause();
      state.angle = 0;
      state.patternA = "rings";
      state.patternB = "lines";
      state.spacing = 24;
      elements.patternA.value = "rings";
      elements.patternB.value = "lines";
      elements.spacingInput.value = "24";
      elements.angleInput.value = "0";
      render();
      updateReadouts();
    }

    function getMouseAngle(clientX, clientY) {
      const rect = elements.canvas.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      return Math.atan2(clientY - cy, clientX - cx);
    }

    function bindControls() {
      elements.patternA.addEventListener("change", () => setParameters({ patternA: elements.patternA.value }));
      elements.patternB.addEventListener("change", () => setParameters({ patternB: elements.patternB.value }));
      elements.spacingInput.addEventListener("input", () => setParameters({ spacing: elements.spacingInput.value }));
      elements.angleInput.addEventListener("input", () => {
        state.autoPlay = false;
        elements.playBtn.textContent = "自动旋转";
        elements.playBtn.setAttribute("aria-pressed", "false");
        setParameters({ angle: elements.angleInput.value });
      });
      elements.playBtn.addEventListener("click", () => {
        if (state.autoPlay) pause(); else start();
      });
      elements.resetBtn.addEventListener("click", reset);

      const stage = elements.canvas;
      stage.addEventListener("pointerdown", (e) => {
        state.isDragging = true;
        state.dragStartAngle = state.angle;
        state.dragStartMouseAngle = getMouseAngle(e.clientX, e.clientY) * 180 / Math.PI;
        stage.setPointerCapture(e.pointerId);
        if (state.autoPlay) pause();
      });
      stage.addEventListener("pointermove", (e) => {
        if (!state.isDragging) return;
        const currentMouseAngle = getMouseAngle(e.clientX, e.clientY) * 180 / Math.PI;
        let delta = currentMouseAngle - state.dragStartMouseAngle;
        let newAngle = state.dragStartAngle + delta;
        newAngle = clamp(newAngle, -15, 15);
        state.angle = newAngle;
        elements.angleInput.value = newAngle.toFixed(1);
      });
      const endDrag = (e) => {
        if (state.isDragging) {
          state.isDragging = false;
          try { stage.releasePointerCapture(e.pointerId); } catch (err) {}
        }
      };
      stage.addEventListener("pointerup", endDrag);
      stage.addEventListener("pointercancel", endDrag);

      window.addEventListener("resize", resizeCanvas);
    }

    function init() {
      resizeCanvas();
      bindControls();
      updateReadouts();
      requestAnimationFrame(frame);
    }

    function getState() {
      return {
        patternA: state.patternA,
        patternB: state.patternB,
        spacing: state.spacing,
        angle: state.angle,
        autoPlay: state.autoPlay
      };
    }
    function getReadouts() {
      return {
        patternA: PATTERN_LABELS[state.patternA],
        patternB: PATTERN_LABELS[state.patternB],
        spacing: state.spacing,
        angle: state.angle
      };
    }
    function runModelChecks() {
      return [
        { name: "pattern A valid", pass: PATTERNS.includes(state.patternA), expected: "one of " + PATTERNS.join(","), actual: state.patternA, tolerance: "strict" },
        { name: "pattern B valid", pass: PATTERNS.includes(state.patternB), expected: "one of " + PATTERNS.join(","), actual: state.patternB, tolerance: "strict" },
        { name: "spacing in range", pass: state.spacing >= 8 && state.spacing <= 60, expected: "[8,60]", actual: state.spacing, tolerance: "strict" },
        { name: "angle in range", pass: state.angle >= -15 && state.angle <= 15, expected: "[-15,15]", actual: state.angle, tolerance: "strict" },
        { name: "moiré visible at small angle", pass: Math.abs(state.angle) > 0.5 && Math.abs(state.angle) < 10, expected: "macro pattern emerges", actual: "visual inspection required", tolerance: "qualitative" }
      ];
    }

    window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
    init();
  })();
  </script>
</body>
</html>
