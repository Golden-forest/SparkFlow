<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Charged Bead Between Parallel Plates</title>
  <style>
    :root {
      color-scheme: dark;
      --sim-bg: #070b14;
      --sim-surface: #101827;
      --sim-surface-soft: #172235;
      --sim-text: #ecf4ff;
      --sim-muted: #91a2bc;
      --sim-border: #293a54;
      --sim-grid: #1b2b43;
      --sim-accent: #42d9ff;
      --sim-accent-deep: #148bb2;
      --sim-accent-soft: rgba(66, 217, 255, 0.14);
      --sim-positive: #39e3a3;
      --sim-warning: #ffc857;
      --sim-danger: #ff6f91;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 22px 58px rgba(0, 0, 0, 0.36);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
      --sim-field: #5fdcff;
      --sim-charge: #ff986b;
      --sim-charge-negative: #ca9bff;
      --sim-gravity: #72e0a8;
      --sim-rope: #d7e1f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% -8%, rgba(66, 217, 255, 0.13), transparent 32%),
        radial-gradient(circle at 92% 8%, rgba(145, 108, 255, 0.1), transparent 30%),
        var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(66, 217, 255, 0.48); outline-offset: 3px; }
    .app { width: min(1540px, 100%); height: 100vh; margin: 0 auto; padding: 17px 20px 15px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 13px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 53px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.55rem, 2.45vw, 2.2rem); letter-spacing: -0.04em; line-height: 1; font-weight: 820; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
    .status { border: 1px solid rgba(66, 217, 255, 0.33); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent); font-weight: 780; white-space: nowrap; font-size: 0.82rem; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.68fr) minmax(306px, 0.72fr); gap: 13px; }
    .panel { min-width: 0; background: rgba(16, 24, 39, 0.87); border: 1px solid var(--sim-border); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); backdrop-filter: blur(10px); }
    .scene-panel { min-height: 440px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 11px; }
    .panel-head h2 { margin: 0; font-size: 1rem; font-weight: 740; }
    .panel-head span { color: var(--sim-muted); font-size: 0.74rem; }
    .scene-wrap { position: relative; min-height: 0; }
    #scene { display: block; width: 100%; height: 100%; min-height: 380px; border: 1px solid #26354d; border-radius: 18px; background: radial-gradient(ellipse at 51% 44%, #14253c 0%, #08101e 72%); }
    .side { min-height: 0; display: grid; grid-template-rows: minmax(0, 1.26fr) minmax(0, 1fr); gap: 13px; }
    .readouts, .model-note { padding: 17px; }
    .readouts { display: grid; grid-template-rows: auto auto 1fr; gap: 13px; overflow: hidden; }
    .readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .metric { min-width: 0; padding: 12px 13px; border: 1px solid var(--sim-border); border-radius: 14px; background: linear-gradient(145deg, rgba(23, 34, 53, 0.94), rgba(12, 20, 34, 0.94)); }
    .metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.065em; }
    .metric strong { display: block; overflow: hidden; text-overflow: ellipsis; font-size: 1.22rem; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .formula { margin: 0; padding: 12px 13px; border-left: 3px solid var(--sim-accent); border-radius: 0 12px 12px 0; background: rgba(66, 217, 255, 0.075); color: #d7f8ff; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.82rem; line-height: 1.55; }
    .formula em { color: var(--sim-accent); font-style: normal; }
    .legend { display: flex; flex-wrap: wrap; align-content: start; gap: 8px 14px; padding-top: 1px; color: var(--sim-muted); font-size: 0.76rem; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .legend-swatch { width: 15px; height: 3px; border-radius: 4px; }
    .model-note { display: grid; align-content: start; gap: 13px; overflow: hidden; }
    .model-note p { margin: 0; color: var(--sim-muted); line-height: 1.54; font-size: 0.84rem; }
    .insight { padding: 13px 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: rgba(255, 200, 87, 0.085); color: #ffe3a5 !important; font-weight: 650; font-size: 0.87rem !important; line-height: 1.48 !important; }
    .condition { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid rgba(57, 227, 163, 0.3); border-radius: 12px; background: rgba(57, 227, 163, 0.075); color: #9ff2cf; font-size: 0.82rem; font-weight: 720; }
    .condition.invalid { border-color: rgba(255, 111, 145, 0.42); background: rgba(255, 111, 145, 0.08); color: #ffb4c8; }
    .controls { padding: 11px 12px; display: grid; grid-template-columns: auto minmax(210px, 1fr) minmax(220px, 1.2fr); gap: 17px; align-items: center; border-radius: 17px; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; font-size: 0.84rem; }
    button:hover { border-color: rgba(66, 217, 255, 0.55); background: rgba(66, 217, 255, 0.1); }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #04111a; background: linear-gradient(135deg, var(--sim-accent), #27a5db); box-shadow: 0 8px 18px rgba(20, 139, 178, 0.28); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.36); }
    .control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 720; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
    .range-note { display: flex; justify-content: space-between; color: var(--sim-muted); font-size: 0.69rem; margin-top: 3px; }
    /* Minimal stage-first presentation: the phenomenon owns the viewport. */
    .main { position: relative; display: block; }
    .scene-panel { height: 100%; min-height: 0; padding: 10px; }
    .scene-panel .panel-head { margin: 0 5px 8px; }
    #scene { min-height: 0; }
    .side { position: absolute; inset: 0; display: block; pointer-events: none; z-index: 6; }
    .stage-overlay { position: absolute; right: 19px; top: 16px; display: flex; align-items: center; gap: 8px; color: #c9dbf5; font-size: 0.76rem; letter-spacing: .02em; text-shadow: 0 2px 9px #000; }
    .stage-overlay strong { padding: 6px 9px; border: 1px solid rgba(66, 217, 255, .34); border-radius: 999px; background: rgba(7, 15, 28, .7); color: var(--sim-accent); font-size: .72rem; }
    .stage-overlay .contact-count { color: #aebed5; }
    .runtime-internals { display: none !important; }
    .controls { grid-template-columns: 1fr; justify-items: center; padding: 9px 12px; }
    .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .mode-actions, .study-actions, .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; align-items: center; }
    .mode-actions::before { content: "SCENARIO"; color: var(--sim-muted); font-size: .67rem; font-weight: 800; letter-spacing: .08em; margin-right: 1px; }
    .study-actions::before { content: "k"; color: var(--sim-muted); font-size: .8rem; font-weight: 800; margin-right: 1px; }
    .study-actions[hidden] { display: none; }
    .mode-actions button, .study-actions button { padding: 7px 10px; font-size: .75rem; }
    .mode-actions button[aria-pressed="true"], .study-actions button[aria-pressed="true"] { border-color: var(--sim-accent); background: rgba(66, 217, 255, .16); color: #d9f9ff; }
    .controls .actions button { min-width: 92px; }
    .stage-label { fill: #c9dbf5; font-size: 14px; font-weight: 720; letter-spacing: .01em; }
    .stage-muted { fill: #8298b7; font-size: 12px; }
    .field-line { stroke: var(--sim-field); stroke-width: 2; opacity: .42; marker-end: url(#arrowField); }
    .field-line.soft { opacity: .2; stroke-width: 1.3; }
    .plate-m { fill: url(#platePositive); stroke: #56bfe2; stroke-width: 2; }
    .plate-n { fill: url(#plateNegative); stroke: #e87592; stroke-width: 2; }
    .plate-cap { fill: rgba(221, 241, 255, .92); }
    .arc { fill: none; stroke: rgba(157, 205, 241, .35); stroke-width: 2; stroke-dasharray: 7 7; }
    .arc-full { fill: none; stroke: rgba(113, 156, 200, .18); stroke-width: 1.4; }
    .rope { stroke: var(--sim-rope); stroke-width: 3.5; stroke-linecap: round; opacity: .9; }
    .rope-anchor { fill: #ebf2ff; stroke: #7893b9; stroke-width: 1.5; }
    .force { stroke-width: 3; stroke-linecap: round; marker-end: url(#arrowForce); }
    .force-electric { stroke: var(--sim-field); }
    .force-gravity { stroke: var(--sim-gravity); }
    .force-tension { stroke: var(--sim-charge); opacity: .82; }
    #ball { stroke: #fff; stroke-width: 3; filter: url(#ballGlow); }
    #ballHalo { opacity: .23; }
    #trail { fill: none; stroke: rgba(255, 152, 107, .48); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 7; }
    .impact-ring { fill: none; stroke: var(--sim-warning); stroke-width: 4; opacity: 0; }
    .impact-ring.active { animation: impactPulse .4s ease-out; }
    .callout { fill: #f5fbff; font-size: 12px; font-weight: 760; }
    .callout-box { fill: rgba(8, 16, 30, .88); stroke: rgba(138, 195, 230, .32); stroke-width: 1; }
    .meter-track { fill: rgba(143, 172, 205, .16); }
    .meter-fill { fill: var(--sim-positive); }
    @keyframes impactPulse { from { opacity: .9; r: 17px; } to { opacity: 0; r: 38px; } }
    @media (max-width: 900px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main { display: block; }
      .scene-panel { min-height: 0; }
      #scene { min-height: 0; height: auto; aspect-ratio: 860 / 560; }
      .side { grid-template-rows: auto auto; }
      .controls { grid-template-columns: 1fr; gap: 11px; }
      .actions { flex-wrap: wrap; }
    }
    @media (max-width: 520px) {
      .header { align-items: flex-start; flex-direction: column; gap: 8px; }
      .header h1 { font-size: 1.65rem; }
      .readout-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
  </style>
</head>
<body>
  <div class="app" data-layout="scene-first" data-model-tier="event-contact">
    <header class="header" data-region="header">
      <div>
        <h1>Charged Bead Between Parallel Plates</h1>
        <p>2026 Guangdong Gaokao · Question 15 · charge reversal and circular motion</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">Ready · voltage ramp</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head"><h2 id="scene-title">Electric field, strings, and arc motion</h2><span id="phaseLabel">quasi-static equilibrium</span></div>
        <div class="scene-wrap">
          <svg id="scene" viewBox="0 0 860 560" role="img" aria-labelledby="scene-title scene-desc">
            <desc id="scene-desc">A positive charged bead hangs below a horizontal rod between positive plate M and negative plate N. It moves along a circular arc, reverses charge at each plate, and returns along the arc.</desc>
            <defs>
              <linearGradient id="platePositive" x1="0" x2="1"><stop stop-color="#1f789f"/><stop offset="1" stop-color="#154260"/></linearGradient>
              <linearGradient id="plateNegative" x1="0" x2="1"><stop stop-color="#9f426d"/><stop offset="1" stop-color="#512747"/></linearGradient>
              <radialGradient id="ballPositive"><stop stop-color="#fff1dd"/><stop offset=".48" stop-color="#ff986b"/><stop offset="1" stop-color="#bd4e4d"/></radialGradient>
              <radialGradient id="ballNegative"><stop stop-color="#f8ebff"/><stop offset=".48" stop-color="#ca9bff"/><stop offset="1" stop-color="#6344a8"/></radialGradient>
              <radialGradient id="ballHaloGlow"><stop stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <filter id="ballGlowFilter" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
              <marker id="arrowField" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#5fdcff"/></marker>
              <marker id="arrowForce" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="context-stroke"/></marker>
              <filter id="softShadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".35"/></filter>
            </defs>
            <g id="sceneGrid" opacity=".65"></g>
            <g aria-label="parallel metal plates">
              <rect class="plate-m" x="238" y="116" width="31" height="360" rx="4" filter="url(#softShadow)"></rect>
              <rect class="plate-n" x="591" y="116" width="31" height="360" rx="4" filter="url(#softShadow)"></rect>
              <rect class="plate-cap" x="233" y="114" width="41" height="8" rx="4"></rect>
              <rect class="plate-cap" x="586" y="114" width="41" height="8" rx="4"></rect>
              <text class="stage-label" x="253" y="99" text-anchor="middle">M</text>
              <text class="stage-label" x="606" y="99" text-anchor="middle">N</text>
              <text id="mSign" x="253" y="504" text-anchor="middle" fill="#6bd9ff" font-size="22" font-weight="800">+</text>
              <text id="nSign" x="606" y="504" text-anchor="middle" fill="#ff9ab0" font-size="22" font-weight="800">−</text>
              <text class="stage-muted" x="430" y="518" text-anchor="middle">plate separation d</text>
            </g>
            <g id="fieldLines" aria-label="uniform electric field"></g>
            <text class="stage-muted" x="430" y="143" text-anchor="middle">uniform electric field E →</text>
            <g aria-label="circular path">
              <circle class="arc-full" cx="430" cy="116" r="320"></circle>
              <path class="arc" d="M270 393 A320 320 0 0 1 590 393"></path>
              <line x1="430" y1="112" x2="430" y2="445" stroke="#7d9bbd" stroke-dasharray="4 7" opacity=".48"></line>
              <text class="stage-muted" x="442" y="274">center line</text>
            </g>
            <g id="ropes" aria-label="two equal insulating strings">
              <line class="rope" id="ropeLeft" x1="98" y1="116" x2="430" y2="436"></line>
              <line class="rope" id="ropeRight" x1="762" y1="116" x2="430" y2="436"></line>
              <circle class="rope-anchor" cx="98" cy="116" r="5"></circle><circle class="rope-anchor" cx="762" cy="116" r="5"></circle>
              <text class="stage-muted" x="98" y="88" text-anchor="middle">rod</text>
            </g>
            <path id="trail" d=""></path>
            <g id="forces" aria-label="force vectors">
              <line id="electricForce" class="force force-electric" x1="430" y1="432" x2="494" y2="432"></line>
              <line id="gravityForce" class="force force-gravity" x1="430" y1="432" x2="430" y2="494"></line>
              <line id="tensionForce" class="force force-tension" x1="430" y1="432" x2="430" y2="377"></line>
              <text id="electricLabel" class="stage-muted" x="499" y="427">qE</text>
              <text id="gravityLabel" class="stage-muted" x="436" y="506">mg</text>
              <text id="tensionLabel" class="stage-muted" x="436" y="372">T</text>
            </g>
            <circle id="ballHalo" cx="430" cy="436" r="31" fill="url(#ballHaloGlow)"></circle>
            <circle id="ball" cx="430" cy="436" r="14" fill="url(#ballPositive)" filter="url(#ballGlowFilter)"></circle>
            <text id="ballCharge" class="callout" x="430" y="440" text-anchor="middle">+q</text>
            <circle id="impactRing" class="impact-ring" cx="590" cy="393" r="21"></circle>
            <g id="impactCallout" opacity="0">
              <rect class="callout-box" x="612" y="335" width="168" height="55" rx="10"></rect>
              <text id="impactTitle" class="callout" x="625" y="357">contact → charge reverses</text>
              <text id="impactSub" class="stage-muted" x="625" y="378">velocity reset to 0</text>
            </g>
          </svg>
        </div>
      </section>

      <aside class="side" data-region="evidence" aria-label="Minimal simulation status">
        <div class="stage-overlay">
          <strong id="condition">READY</strong>
          <span id="timeReadout" class="contact-count">contacts 0 · t = 0.00 s</span>
        </div>
        <div class="runtime-internals" data-region="insight" aria-hidden="true">
          <span id="insight">Press Start.</span>
          <span id="kReadout">1.80</span><span id="thetaReadout">0.0°</span>
          <span id="kineticReadout">0.000</span><span id="maxKReadout">1.039</span>
          <span id="tensionReadout">0.816</span><span id="contactsReadout">0</span>
        </div>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="Simulation controls">
      <div class="actions">
        <button id="startBtn" class="primary" type="button">Start</button>
        <button id="pauseBtn" type="button">Pause</button>
        <button id="resetBtn" type="button">Reset</button>
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";

    const PI = Math.PI;
    const HALF_CONTACT = PI / 6;
    const SQRT3 = Math.sqrt(3);
    const RAMP_DURATION = 2.6;
    const FIXED_STEP = 1 / 240;
    const G = 1;
    const D = 1;
    const MODEL = {
      kMin: 1,
      kMax: 3,
      kDefault: 2,
      speedDefault: 1,
      rampDuration: RAMP_DURATION,
      thetaContact: HALF_CONTACT,
    };
    const parameterSchema = [
      { key: "k", label: "Post-contact voltage multiplier", type: "preset", min: 1, max: 3, step: 1, default: 2, unit: "" },
      { key: "speed", label: "Teaching playback speed", type: "slider", min: 0.5, max: 2, step: 0.25, default: 1, unit: "×" },
    ];
    const state = {
      running: false,
      mode: "part1",
      phase: "ramp",
      simTime: 0,
      theta: 0,
      omega: 0,
      chargeSign: 1,
      k: MODEL.kDefault,
      speed: MODEL.speedDefault,
      contacts: 0,
      lastImpactK: 0,
      contactFlash: 0,
      phaseClock: 0,
      kIndex: 0,
      accumulator: 0,
      lastTimestamp: null,
      trail: [],
    };
    const el = {};
    const select = (id) => { el[id] = document.getElementById(id); };
    ["status", "phaseLabel", "sceneGrid", "fieldLines", "ropeLeft", "ropeRight", "ball", "ballHalo", "ballCharge", "electricForce", "gravityForce", "tensionForce", "electricLabel", "gravityLabel", "tensionLabel", "trail", "impactRing", "impactCallout", "impactTitle", "impactSub", "kReadout", "thetaReadout", "kineticReadout", "maxKReadout", "tensionReadout", "contactsReadout", "insight", "condition", "timeReadout", "startBtn", "pauseBtn", "resetBtn", "kInput", "kOutput", "speedInput", "speedOutput"].forEach(select);
    el.sceneDesc = document.getElementById("scene-desc");

    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }
    function easeInOut(value) { return value < 0.5 ? 2 * value * value : 1 - Math.pow(-2 * value + 2, 2) / 2; }
    function pointForTheta(theta) {
      return { x: 430 + 320 * Math.sin(theta), y: 116 + 320 * Math.cos(theta) };
    }
    function buildSceneGrid() {
      const lines = [];
      for (let i = 0; i <= 10; i += 1) {
        const x = 54 + i * 75.2;
        lines.push(`<line x1="${x}" y1="42" x2="${x}" y2="520" stroke="#1b2b43" stroke-width="1" />`);
      }
      for (let i = 0; i <= 7; i += 1) {
        const y = 42 + i * 68.2;
        lines.push(`<line x1="42" y1="${y}" x2="818" y2="${y}" stroke="#1b2b43" stroke-width="1" />`);
      }
      el.sceneGrid.innerHTML = lines.join("");
      const field = [];
      for (let y = 166; y <= 456; y += 48) field.push(`<line class="field-line" x1="282" y1="${y}" x2="577" y2="${y}" />`);
      el.fieldLines.innerHTML = field.join("");
    }
    function setPhase(phase) {
      state.phase = phase;
      const labels = {
        ramp: "Part 1 · quasi-static equilibrium",
        tension: "Part 2 · first-contact tension",
        bounce: "Part 3 · circular arc motion",
        impact: "Part 3 · charge reversal",
      };
      el.phaseLabel.textContent = labels[phase] || phase;
    }
    function start() {
      if (state.phase === "impact") setPhase("bounce");
      if (state.mode === "part3" && state.phase === "ready") setPhase("bounce");
      state.running = true;
      el.status.textContent = "Running · showing all three parts";
      el.startBtn.textContent = "Resume";
      el.startBtn.setAttribute("aria-pressed", "true");
    }
    function pause() {
      state.running = false;
      el.status.textContent = "Paused · " + (state.mode === "part1" ? "Part 1" : state.mode === "part2" ? "Part 2" : "Part 3");
      el.startBtn.setAttribute("aria-pressed", "false");
    }
    function reset() {
      pause();
      state.mode = "part1";
      state.phase = "ramp";
      state.simTime = 0;
      state.theta = 0;
      state.omega = 0;
      state.chargeSign = 1;
      state.k = MODEL.kDefault;
      state.contacts = 0;
      state.lastImpactK = 0;
      state.contactFlash = 0;
      state.phaseClock = 0;
      state.kIndex = 0;
      state.accumulator = 0;
      state.lastTimestamp = null;
      state.trail = [];
      el.startBtn.textContent = "Start";
      setPhase("ramp");
      render();
    }
    function setParameters(values) {
      const kDef = parameterSchema[0];
      const speedDef = parameterSchema[1];
      state.k = clamp(finite(Number(values.k), kDef.default), kDef.min, kDef.max);
      state.speed = clamp(finite(Number(values.speed), speedDef.default), speedDef.min, speedDef.max);
      if (el.kInput) el.kInput.value = String(state.k);
      if (el.speedInput) el.speedInput.value = String(state.speed);
      render();
    }
    function enterContact(targetSign) {
      state.theta = targetSign > 0 ? HALF_CONTACT : -HALF_CONTACT;
      state.lastImpactK = state.k / SQRT3;
      state.omega = 0;
      state.chargeSign *= -1;
      state.contacts += 1;
      state.contactFlash = 0.46;
      setPhase("impact");
    }
    function acceleration(theta, chargeSign) {
      return (G / D) * (chargeSign * state.k / SQRT3 * Math.cos(theta) - Math.sin(theta));
    }
    function currentKinetic() {
      return 0.5 * (D / G) * state.omega * state.omega;
    }
    function currentTension() {
      const voltageMultiplier = state.mode === "part3" ? state.k : 1;
      const radial = Math.cos(state.theta) + state.chargeSign * voltageMultiplier / SQRT3 * Math.sin(state.theta) + (D / G) * state.omega * state.omega;
      return Math.max(0, radial / Math.sqrt(2));
    }
    function beginTensionHold() {
      state.mode = "part2";
      state.phaseClock = 0;
      state.theta = HALF_CONTACT;
      state.omega = 0;
      state.chargeSign = 1;
      state.contacts = 0;
      setPhase("tension");
    }
    function beginPart3() {
      state.mode = "part3";
      state.phaseClock = 0;
      state.kIndex = 0;
      state.k = 1;
      state.theta = HALF_CONTACT;
      state.omega = 0;
      state.chargeSign = -1;
      state.contacts = 1;
      state.contactFlash = 0.46;
      state.trail = [];
      setPhase("impact");
    }
    function beginPart1Loop() {
      state.mode = "part1";
      state.phaseClock = 0;
      state.simTime = 0;
      state.theta = 0;
      state.omega = 0;
      state.chargeSign = 1;
      state.k = MODEL.kDefault;
      state.contacts = 0;
      state.lastImpactK = 0;
      state.contactFlash = 0;
      state.trail = [];
      setPhase("ramp");
    }
    function advanceRamp(dt) {
      state.simTime += dt;
      const p = clamp(state.simTime / RAMP_DURATION, 0, 1);
      state.theta = HALF_CONTACT * easeInOut(p);
      state.omega = 0;
      if (p >= 1) beginTensionHold();
    }
    function advanceTensionHold(dt) {
      state.simTime += dt;
      state.phaseClock += dt;
      state.theta = HALF_CONTACT;
      state.omega = 0;
      if (state.phaseClock >= 2.4) beginPart3();
    }
    function advanceBounce(dt) {
      state.simTime += dt;
      state.phaseClock += dt;
      let remaining = dt;
      let guard = 0;
      while (remaining > 0 && guard < 20 && state.phase === "bounce") {
        const h = Math.min(remaining, FIXED_STEP);
        const a0 = acceleration(state.theta, state.chargeSign);
        state.omega += a0 * h;
        state.theta += state.omega * h;
        const target = state.chargeSign < 0 ? -HALF_CONTACT : HALF_CONTACT;
        if ((state.chargeSign < 0 && state.theta <= target) || (state.chargeSign > 0 && state.theta >= target)) {
          enterContact(state.chargeSign > 0 ? 1 : -1);
          break;
        }
        remaining -= h;
        guard += 1;
      }
      state.omega = finite(state.omega, 0);
      state.theta = clamp(finite(state.theta, 0), -HALF_CONTACT, HALF_CONTACT);
      if (state.phase === "bounce" && state.phaseClock >= 4.8) {
        if (state.kIndex < 2) {
          state.kIndex += 1;
          state.k = [1, 2, 3][state.kIndex];
          state.phaseClock = 0;
        } else {
          beginPart1Loop();
        }
      }
      if (state.phase === "impact" && state.contactFlash <= 0) setPhase("bounce");
    }
    function update(dt) {
      if (!state.running) return;
      const bounded = clamp(finite(dt, 0), 0, 0.05) * state.speed;
      if (state.contactFlash > 0) state.contactFlash = Math.max(0, state.contactFlash - bounded);
      if (state.phase === "ramp") advanceRamp(bounded);
      else if (state.phase === "tension") advanceTensionHold(bounded);
      else if (state.phase === "bounce") advanceBounce(bounded);
      else if (state.phase === "impact") {
        state.simTime += bounded;
        state.phaseClock += bounded;
        if (state.contactFlash <= 0) setPhase("bounce");
      }
      const p = pointForTheta(state.theta);
      if (state.running && state.phase === "bounce" && (state.trail.length === 0 || state.simTime - state.trail[state.trail.length - 1].t >= 0.025)) {
        state.trail.push({ t: state.simTime, x: p.x, y: p.y });
        if (state.trail.length > 80) state.trail.shift();
      }
    }
    function svgLine(line, x1, y1, x2, y2) {
      line.setAttribute("x1", String(x1)); line.setAttribute("y1", String(y1)); line.setAttribute("x2", String(x2)); line.setAttribute("y2", String(y2));
    }
    function render() {
      const p = pointForTheta(state.theta);
      const chargeColor = state.chargeSign > 0 ? "url(#ballPositive)" : "url(#ballNegative)";
      const chargeText = state.chargeSign > 0 ? "+q" : "−q";
      el.ball.setAttribute("cx", p.x); el.ball.setAttribute("cy", p.y); el.ball.setAttribute("fill", chargeColor);
      el.ballHalo.setAttribute("cx", p.x); el.ballHalo.setAttribute("cy", p.y); el.ballHalo.setAttribute("fill", chargeColor);
      el.ballCharge.setAttribute("x", p.x); el.ballCharge.setAttribute("y", p.y + 4); el.ballCharge.textContent = chargeText;
      svgLine(el.ropeLeft, 98, 116, p.x, p.y); svgLine(el.ropeRight, 762, 116, p.x, p.y);
      const rampRatio = state.phase === "ramp" ? Math.tan(state.theta) / Math.tan(HALF_CONTACT) : 1;
      const voltageMultiplier = state.mode === "part3" ? state.k : rampRatio;
      const displayedAcceleration = (G / D) * (state.chargeSign * voltageMultiplier / SQRT3 * Math.cos(state.theta) - Math.sin(state.theta));
      const arrowScale = 48 + Math.min(36, Math.abs(displayedAcceleration) * 18);
      const electricDirection = state.chargeSign > 0 ? 1 : -1;
      svgLine(el.electricForce, p.x, p.y, p.x + electricDirection * arrowScale, p.y);
      svgLine(el.gravityForce, p.x, p.y, p.x, p.y + 57);
      const towardCenter = { x: 430 - p.x, y: 116 - p.y };
      const length = Math.hypot(towardCenter.x, towardCenter.y) || 1;
      svgLine(el.tensionForce, p.x, p.y, p.x + towardCenter.x / length * 50, p.y + towardCenter.y / length * 50);
      el.electricLabel.setAttribute("x", p.x + electricDirection * (arrowScale + 5)); el.electricLabel.setAttribute("y", p.y - 7); el.electricLabel.textContent = state.chargeSign > 0 ? "qE →" : "−qE ←";
      el.gravityLabel.setAttribute("x", p.x + 6); el.gravityLabel.setAttribute("y", p.y + 71);
      el.tensionLabel.setAttribute("x", p.x + towardCenter.x / length * 57 + 4); el.tensionLabel.setAttribute("y", p.y + towardCenter.y / length * 57);
      const trailPath = state.trail.map((item, index) => `${index === 0 ? "M" : "L"}${item.x.toFixed(1)} ${item.y.toFixed(1)}`).join(" ");
      el.trail.setAttribute("d", trailPath);
      const impactPoint = state.mode === "part1" || state.mode === "part2" ? pointForTheta(HALF_CONTACT) : state.chargeSign > 0 ? pointForTheta(-HALF_CONTACT) : pointForTheta(HALF_CONTACT);
      el.impactRing.setAttribute("cx", impactPoint.x); el.impactRing.setAttribute("cy", impactPoint.y);
      if (state.contactFlash > 0) el.impactRing.classList.add("active"); else el.impactRing.classList.remove("active");
      const showCallout = state.mode === "part2" || state.mode === "part3" || (state.mode === "part1" && state.theta > 0.15);
      el.impactCallout.setAttribute("opacity", showCallout ? "1" : "0");
      el.impactCallout.setAttribute("transform", `translate(${impactPoint.x > 430 ? 0 : -188} 0)`);
      if (state.mode === "part1") {
        el.impactTitle.textContent = "PART 1 · first contact";
        el.impactSub.textContent = "U₀ = mgd / (√3q)";
      } else if (state.mode === "part2") {
        el.impactTitle.textContent = "PART 2 · tension";
        el.impactSub.textContent = "T₁ = mg√(2/3)";
      } else {
        el.impactTitle.textContent = "PART 3 · charge reversal";
        el.impactSub.textContent = `k = ${state.k} · Kmax = ${(state.k / SQRT3).toFixed(3)} mgd`;
      }
      const kNow = currentKinetic();
      const tension = state.phase === "ramp" ? (Math.cos(state.theta) + Math.sin(state.theta) * rampRatio / SQRT3) / Math.sqrt(2) : currentTension();
      el.kReadout.textContent = state.k.toFixed(2); if (el.kOutput) el.kOutput.textContent = `k = ${state.k.toFixed(2)}`; if (el.speedOutput) el.speedOutput.textContent = `${state.speed.toFixed(2)}×`;
      el.thetaReadout.textContent = `${(state.theta * 180 / PI).toFixed(1)}°`; el.kineticReadout.textContent = (state.phase === "impact" ? 0 : kNow).toFixed(3); el.maxKReadout.textContent = (state.k / SQRT3).toFixed(3); el.tensionReadout.textContent = tension.toFixed(3); el.contactsReadout.textContent = String(state.contacts); el.timeReadout.textContent = `t = ${state.simTime.toFixed(2)} s`;
      el.condition.classList.remove("invalid");
      el.condition.textContent = state.mode === "part1" ? "PART 1 · U₀" : state.mode === "part2" ? "PART 2 · T₁" : `PART 3 · k = ${state.k}`;
      el.status.textContent = !state.running ? "Paused · press Start to replay" : state.mode === "part1" ? "Running · Part 1 → Part 2 → Part 3" : state.mode === "part2" ? "Holding · first-contact tension" : state.phase === "impact" ? "Impact · charge reversal" : `Running · Part 3 · k = ${state.k}`;
      el.insight.textContent = state.mode === "part1" ? "The voltage rises until the positive bead reaches N." : state.mode === "part2" ? "At the first contact position, the two equal string tensions combine to T₁." : `The voltage multiplier cycles through k = 1, 2, 3; Kmax = k mgd/√3.`;
      el.sceneDesc.textContent = `The bead is at angle ${(state.theta * 180 / PI).toFixed(1)} degrees on a circular arc. Its charge is ${chargeText}. It has made ${state.contacts} plate contacts.`;
    }
    function getState() { return { ...state, trail: state.trail.map((sample) => ({ ...sample })) }; }
    function getReadouts() { return { k: state.k, theta: state.theta, kinetic: currentKinetic(), maxKinetic: state.k / SQRT3, tension: currentTension(), contacts: state.contacts, phase: state.phase }; }
    function runModelChecks() {
      const t0 = Math.tan(HALF_CONTACT);
      const u0 = t0;
      const t1 = (Math.cos(HALF_CONTACT) + Math.sin(HALF_CONTACT) / SQRT3) / Math.sqrt(2);
      const k1 = 1 / SQRT3;
      const k3 = 3 / SQRT3;
      const checks = [
        { name: "contact angle from geometry", pass: Math.abs(HALF_CONTACT - PI / 6) < 1e-12, expected: "π/6 rad", actual: HALF_CONTACT.toString(), tolerance: "1e-12" },
        { name: "voltage at first contact", pass: Math.abs(u0 - 1 / SQRT3) < 1e-12, expected: "U₀/(mgd/q) = 1/√3", actual: u0.toFixed(12), tolerance: "1e-12" },
        { name: "first-contact string tension", pass: Math.abs(t1 - Math.sqrt(2 / 3)) < 1e-12, expected: "T₁/(mg) = √(2/3)", actual: t1.toFixed(12), tolerance: "1e-12" },
        { name: "minimum multiplier reaches opposite plate", pass: Math.abs(k1 - 1 / SQRT3) < 1e-12, expected: "Kmax/(mgd) = 1/√3 at k=1", actual: k1.toFixed(12), tolerance: "1e-12" },
        { name: "upper multiplier keeps strings taut", pass: Math.abs((Math.cos(HALF_CONTACT) - 3 * Math.sin(HALF_CONTACT) / SQRT3) / Math.sqrt(2)) < 1e-12, expected: "T/(mg) = 0 at k=3, contact limit", actual: ((Math.cos(HALF_CONTACT) - 3 * Math.sin(HALF_CONTACT) / SQRT3) / Math.sqrt(2)).toFixed(12), tolerance: "1e-12" },
        { name: "maximum kinetic energy grows linearly with k", pass: Math.abs(k3 - 3 * k1) < 1e-12, expected: "Kmax(k=3) = 3 Kmax(k=1)", actual: `${k3.toFixed(12)} vs ${(3 * k1).toFixed(12)}`, tolerance: "1e-12" },
      ];
      return checks;
    }
    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = clamp((timestamp - state.lastTimestamp) / 1000, 0, 0.05);
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }
    function bindControls() {
      el.startBtn.addEventListener("click", start);
      el.pauseBtn.addEventListener("click", pause);
      el.resetBtn.addEventListener("click", reset);
      if (el.kInput) el.kInput.addEventListener("input", () => setParameters({ k: el.kInput.value, speed: state.speed }));
      if (el.speedInput) el.speedInput.addEventListener("input", () => setParameters({ k: state.k, speed: el.speedInput.value }));
    }
    function init() {
      buildSceneGrid();
      bindControls();
      setParameters({ k: MODEL.kDefault, speed: MODEL.speedDefault });
      reset();
      window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
      requestAnimationFrame(frame);
    }
    init();
  })();
  </script>
</body>
