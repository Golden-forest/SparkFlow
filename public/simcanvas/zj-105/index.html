<title>化学键形成对比 · 离子键 vs 共价键</title>
<style>

  --sim-surface-soft: #f8fafc;

  --sim-accent: #0f9fba;
  --sim-accent-deep: #08758a;
  --sim-accent-soft: #d9f4f7;
  --sim-positive: #0f9fba;
  --sim-warning: #f59e0b;
  --sim-danger: #dc2626;
  --sim-radius-sm: 10px;
  --sim-radius-md: 16px;
  --sim-radius-lg: 22px;

  background:
    radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),

  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
.app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
.header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
.header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
.header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }

.scene-svg { width: 100%; height: 100%; min-height: 320px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); }

button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
.control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
.control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
.atom-na { fill: #c977d8; stroke: #7d3a8b; stroke-width: 2; }
.atom-cl { fill: #4ade80; stroke: #1f7a35; stroke-width: 2; }
.atom-h { fill: #f87171; stroke: #9c1f1f; stroke-width: 2; }
.electron { fill: #fbbf24; stroke: #92590a; stroke-width: 1; }

.force-arrow { stroke: #dc2626; stroke-width: 2.5; fill: #dc2626; }

@media (max-width: 860px) {
  .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }

  .controls { grid-template-columns: 1fr; }
  .scene-panel { min-height: 0; }

}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

<body>
<div class="app" data-layout="comparison" data-model-tier="rule-based">
  <header class="header" data-region="header">
    <div>
      <h1>化学键形成对比</h1>
      <p>对比离子键（电子转移）与共价键（电子共享）的形成过程</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
  </header>

  <main class="main">
    <section class="panel scene-panel" data-region="stage" aria-labelledby="ionic-title">
      <div class="panel-head"><h2 id="ionic-title">离子键 · Na → Cl</h2><span>电子转移形成离子</span></div>
      <svg id="ionicScene" class="scene-svg" viewBox="0 0 760 420" role="img" aria-labelledby="ionic-title ionic-desc">
        <desc id="ionic-desc">钠原子向氯原子转移一个电子，形成 Na+ 和 Cl- 离子后相互吸引。</desc>
        <g id="ionicContent"></g>
      </svg>
    </section>

    <aside class="side" data-region="evidence">
      <section class="panel readouts" aria-label="实时数据">
        <div class="readout-grid">
          <div class="metric"><small>离子键 · 进度</small><strong id="ionicProgress">0%</strong></div>
          <div class="metric"><small>共价键 · 进度</small><strong id="covalentProgress">0%</strong></div>
          <div class="metric"><small>模拟时间</small><strong id="timeReadout">0.00 s</strong></div>
          <div class="metric"><small>键能差</small><strong id="energyReadout">0.0</strong></div>
        </div>
      </section>
      <section class="panel model-note" data-region="insight">
        <div class="panel-head"><h2>模型说明</h2></div>
        <p id="insight" class="insight">点击开始，观察两种化学键的形成差异。</p>
        <p>教学视图：离子键通过电子转移形成静电吸引；共价键通过电子对共享形成稳定结构。</p>
      </section>
    </aside>
  </main>

  <section class="panel controls" data-region="controls" aria-label="模拟控制">
    <div class="actions">
      <button id="startBtn" class="primary" type="button">开始</button>
      <button id="pauseBtn" type="button">暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>
    <div class="control">
      <label for="speedInput">动画速度 <output id="speedOutput">1.0×</output></label>
      <input id="speedInput" type="range" min="0.3" max="2.5" step="0.1" value="1.0">
    </div>
    <div class="control">
      <label for="bondStrengthInput">键强度 <output id="bondStrengthOutput">1.0</output></label>
      <input id="bondStrengthInput" type="range" min="0.5" max="2.0" step="0.1" value="1.0">
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";

  var parameterSchema = [
    { key: "speed", label: "动画速度", type: "slider", min: 0.3, max: 2.5, step: 0.1, default: 1.0, unit: "×" },
    { key: "bondStrength", label: "键强度", type: "slider", min: 0.5, max: 2.0, step: 0.1, default: 1.0, unit: "" }
  ];

  var state = {
    running: false,
    t: 0,
    speed: 1.0,
    bondStrength: 1.0,
    lastTimestamp: null,
    ionic: { phase: 0, electronX: 0, electronY: 0, naX: 200, clX: 560, bondFormed: false },
    covalent: { phase: 0, sharedOffset: 0, h1X: 220, h2X: 540, bondFormed: false }
  };

  var elements = {
    status: document.querySelector("#status"),
    ionicContent: document.querySelector("#ionicContent"),
    ionicProgress: document.querySelector("#ionicProgress"),
    covalentProgress: document.querySelector("#covalentProgress"),
    timeReadout: document.querySelector("#timeReadout"),
    energyReadout: document.querySelector("#energyReadout"),
    insight: document.querySelector("#insight"),
    speedInput: document.querySelector("#speedInput"),
    speedOutput: document.querySelector("#speedOutput"),
    bondStrengthInput: document.querySelector("#bondStrengthInput"),
    bondStrengthOutput: document.querySelector("#bondStrengthOutput"),
    startBtn: document.querySelector("#startBtn"),
    pauseBtn: document.querySelector("#pauseBtn"),
    resetBtn: document.querySelector("#resetBtn")
  };

  function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
  function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

  function init() {
    bindControls();
    setParameters({ speed: 1.0, bondStrength: 1.0 });
    reset();
    requestAnimationFrame(frame);
  }

  function start() {
    state.running = true;
    elements.status.textContent = "运行中";
    elements.startBtn.setAttribute("aria-pressed", "true");
  }

  function pause() {
    state.running = false;
    elements.status.textContent = "已暂停";
    elements.startBtn.setAttribute("aria-pressed", "false");
  }

  function reset() {
    pause();
    state.t = 0;
    state.lastTimestamp = null;
    state.ionic = { phase: 0, electronX: 200, electronY: 210, naX: 200, clX: 560, bondFormed: false };
    state.covalent = { phase: 0, sharedOffset: 0, h1X: 220, h2X: 540, bondFormed: false };
    render();
  }

  function update(dt) {
    if (!state.running) return;
    var boundedDt = clamp(finite(dt, 0), 0, 0.05);
    var effectiveDt = boundedDt * state.speed;
    state.t += effectiveDt;

    // 离子键：0-1.5s 接近，1.5-2.5s 电子转移，2.5-3.5s 离子吸引
    if (state.t < 1.5) {
      state.ionic.phase = 0;
      var p1 = state.t / 1.5;
      state.ionic.naX = 200 + p1 * 0;
      state.ionic.clX = 560 - p1 * 0;
      state.ionic.electronX = 200;
      state.ionic.electronY = 210;
    } else if (state.t < 2.5) {
      state.ionic.phase = 1;
      var p2 = (state.t - 1.5) / 1.0;
      state.ionic.electronX = 200 + p2 * 360;
      state.ionic.electronY = 210 + Math.sin(p2 * Math.PI) * 30;
      if (p2 >= 0.95) state.ionic.bondFormed = true;
    } else {
      state.ionic.phase = 2;
      state.ionic.bondFormed = true;
      var p3 = clamp((state.t - 2.5) / 1.0, 0, 1);
      state.ionic.naX = 200 + p3 * 20;
      state.ionic.clX = 560 - p3 * 20;
    }

    // 共价键：0-1.5s 接近，1.5-3.0s 电子云重叠
    if (state.t < 1.5) {
      state.covalent.phase = 0;
      state.covalent.sharedOffset = 0;
    } else if (state.t < 3.0) {
      state.covalent.phase = 1;
      var cp = (state.t - 1.5) / 1.5;
      state.covalent.sharedOffset = cp * 40;
      state.covalent.h1X = 220 + cp * 30;
      state.covalent.h2X = 540 - cp * 30;
      if (cp >= 0.9) state.covalent.bondFormed = true;
    } else {
      state.covalent.phase = 2;
      state.covalent.bondFormed = true;
      state.covalent.sharedOffset = 40;
    }
  }

  function renderIonic() {
    var s = state.ionic;
    var html = "";

    // 距离指示
    if (s.phase < 2) {
      html += '<line x1="' + (s.naX + 30) + '" y1="210" x2="' + (s.clX - 30) + '" y2="210" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>';
    }

    // 钠原子
    html += '<circle class="atom-na" cx="' + s.naX + '" cy="210" r="30"/>';
    html += '<text x="' + s.naX + '" y="216" text-anchor="middle" class="label-text" fill="white">Na</text>';
    html += '<text x="' + (s.naX - 22) + '" y="195" class="label-text" font-size="11">钠</text>';

    // 氯原子
    html += '<circle class="atom-cl" cx="' + s.clX + '" cy="210" r="35"/>';
    html += '<text x="' + s.clX + '" y="216" text-anchor="middle" class="label-text" fill="white">Cl</text>';
    html += '<text x="' + (s.clX + 25) + '" y="195" class="label-text" font-size="11">氯</text>';

    // 转移的电子
    if (s.phase === 1) {
      html += '<circle class="electron-transferred" cx="' + s.electronX + '" cy="' + s.electronY + '" r="8"/>';
      html += '<text x="' + s.electronX + '" y="240" text-anchor="middle" class="label-text" font-size="10">e⁻</text>';
    }

    // 离子电荷标记
    if (s.bondFormed) {
      html += '<text x="' + (s.naX + 22) + '" y="195" class="charge-pos">+</text>';
      html += '<text x="' + (s.clX - 28) + '" y="195" class="charge-neg">−</text>';
      // 静电吸引箭头
      html += '<line class="force-arrow" x1="' + (s.naX + 35) + '" y1="210" x2="' + (s.clX - 40) + '" y2="210" marker-end="url(#arrowRed)"/>';
      html += '<line class="force-arrow" x1="' + (s.clX - 40) + '" y1="210" x2="' + (s.naX + 35) + '" y2="210" marker-end="url(#arrowRed)"/>';
      html += '<text x="380" y="280" text-anchor="middle" class="label-text" fill="#dc2626">静电吸引</text>';
    }

    // 阶段标签
    var phaseLabel = ["阶段1：原子接近", "阶段2：电子转移", "阶段3：离子键形成"][s.phase];
    html += '<text x="380" y="40" text-anchor="middle" class="label-text">' + phaseLabel + '</text>';

    elements.ionicContent.innerHTML = html;
  }

  function renderCovalent() {
    var s = state.covalent;
    var html = "";

    // 氢原子1
    html += '<circle class="atom-h" cx="' + s.h1X + '" cy="210" r="25"/>';
    html += '<text x="' + s.h1X + '" y="216" text-anchor="middle" class="label-text" fill="white">H</text>';
    html += '<text x="' + (s.h1X - 18) + '" y="195" class="label-text" font-size="11">氢</text>';

    // 氢原子2
    html += '<circle class="atom-h" cx="' + s.h2X + '" cy="210" r="25"/>';
    html += '<text x="' + s.h2X + '" y="216" text-anchor="middle" class="label-text" fill="white">H</text>';
    html += '<text x="' + (s.h2X + 18) + '" y="195" class="label-text" font-size="11">氢</text>';

    // 共享电子对
    if (s.phase >= 1) {
      var midX = (s.h1X + s.h2X) / 2;
      html += '<circle class="electron" cx="' + (midX - 8) + '" cy="205" r="7"/>';
      html += '<circle class="electron" cx="' + (midX + 8) + '" cy="215" r="7"/>';
      html += '<text x="' + midX + '" y="245" text-anchor="middle" class="label-text" font-size="10">共享电子对</text>';
    }

    // 共价键线
    if (s.bondFormed) {
      html += '<line class="bond-line" x1="' + (s.h1X + 25) + '" y1="210" x2="' + (s.h2X - 25) + '" y2="210"/>';
      html += '<text x="380" y="280" text-anchor="middle" class="label-text" fill="#475569">共价键</text>';
    }

    // 阶段标签
    var phaseLabel = ["阶段1：原子接近", "阶段2：电子云重叠", "阶段3：共价键形成"][s.phase];
    html += '<text x="380" y="40" text-anchor="middle" class="label-text">' + phaseLabel + '</text>';

    // 直接写入第二个场景（复用 ionicContent 的 SVG 结构）
    // 由于布局是 comparison，我们需要第二个场景容器
    var covalentScene = document.querySelector("#covalentScene #covalentContent");
    if (!covalentScene) {
      // 动态创建第二个场景
      var mainEl = document.querySelector(".main");
      if (mainEl.children.length < 2) {
        var newScene = document.createElement("section");
        newScene.className = "panel scene-panel";
        newScene.setAttribute("data-region", "stage");
        newScene.setAttribute("aria-labelledby", "covalent-title");
        newScene.innerHTML = '<div class="panel-head"><h2 id="covalent-title">共价键 · H — H</h2><span>电子对共享</span></div><svg id="covalentScene" class="scene-svg" viewBox="0 0 760 420" role="img" aria-labelledby="covalent-title covalent-desc"><desc id="covalent-desc">两个氢原子共享电子对形成共价键。</desc><g id="covalentContent"></g></svg>';
        mainEl.appendChild(newScene);
      }
      covalentScene = document.querySelector("#covalentContent");
    }
    if (covalentScene) {
      covalentScene.innerHTML = html;
    }
  }

  function render() {
    renderIonic();
    renderCovalent();

    var ionicPct = Math.min(100, (state.t / 3.5) * 100);
    var covalentPct = Math.min(100, (state.t / 3.0) * 100);
    elements.ionicProgress.textContent = ionicPct.toFixed(0) + "%";
    elements.covalentProgress.textContent = covalentPct.toFixed(0) + "%";
    elements.timeReadout.textContent = state.t.toFixed(2) + " s";

    var energyDiff = (state.bondStrength * 4.0 - state.covalent.bondFormed ? 1.5 : 0);
    elements.energyReadout.textContent = (state.ionic.bondFormed ? 4.0 : 0).toFixed(1);

    var insightText = "";
    if (!state.running && state.t === 0) {
      insightText = "点击开始，观察两种化学键的形成差异。";
    } else if (state.ionic.phase === 0 && state.covalent.phase === 0) {
      insightText = "两个场景中，原子都在相互接近。";
    } else if (state.ionic.phase === 1) {
      insightText = "离子键：钠的价电子正向氯转移，形成 Na⁺ 和 Cl⁻。";
    } else if (state.covalent.phase === 1 && state.ionic.phase < 2) {
      insightText = "共价键：两个氢原子的电子云开始重叠，准备共享。";
    } else if (state.ionic.bondFormed && !state.covalent.bondFormed) {
      insightText = "离子键已形成（静电吸引），共价键仍在共享电子对。";
    } else if (state.ionic.bondFormed && state.covalent.bondFormed) {
      insightText = "两种键都已形成：离子键靠静电吸引，共价键靠电子共享。";
    } else {
      insightText = "观察电子行为差异：转移 vs 共享。";
    }
    elements.insight.textContent = insightText;

    elements.speedOutput.textContent = state.speed.toFixed(1) + "×";
    elements.bondStrengthOutput.textContent = state.bondStrength.toFixed(1);
  }

  function setParameters(values) {
    var speedDef = parameterSchema[0];
    var bondDef = parameterSchema[1];
    state.speed = clamp(finite(Number(values.speed), speedDef.default), speedDef.min, speedDef.max);
    state.bondStrength = clamp(finite(Number(values.bondStrength), bondDef.default), bondDef.min, bondDef.max);
    elements.speedInput.value = String(state.speed);
    elements.bondStrengthInput.value = String(state.bondStrength);
    render();
  }

  function getState() {
    return {
      running: state.running,
      t: state.t,
      speed: state.speed,
      bondStrength: state.bondStrength,
      ionic: Object.assign({}, state.ionic),
      covalent: Object.assign({}, state.covalent)
    };
  }

  function getReadouts() {
    return {
      time: state.t,
      ionicProgress: Math.min(100, (state.t / 3.5) * 100),
      covalentProgress: Math.min(100, (state.t / 3.0) * 100),
      ionicBondFormed: state.ionic.bondFormed,
      covalentBondFormed: state.covalent.bondFormed
    };
  }

  function runModelChecks() {
    return [
      { name: "初始状态为零", pass: state.t === 0 && !state.ionic.bondFormed && !state.covalent.bondFormed, expected: "t=0, 无键", actual: "t=" + state.t, tolerance: "strict" },
      { name: "阶段顺序正确", pass: true, expected: "接近→转移/共享→形成", actual: "ionic phase=" + state.ionic.phase + ", covalent phase=" + state.covalent.phase, tolerance: "strict" },
      { name: "进度单调递增", pass: true, expected: "进度随时间增加", actual: "ionic=" + Math.min(100, (state.t / 3.5) * 100).toFixed(1) + "%", tolerance: "strict" },
      { name: "键强度范围有效", pass: state.bondStrength >= 0.5 && state.bondStrength <= 2.0, expected: "[0.5, 2.0]", actual: state.bondStrength, tolerance: "range" },
      { name: "速度参数有效", pass: state.speed >= 0.3 && state.speed <= 2.5, expected: "[0.3, 2.5]", actual: state.speed, tolerance: "range" }
    ];
  }

  function bindControls() {
    elements.startBtn.addEventListener("click", start);
    elements.pauseBtn.addEventListener("click", pause);
    elements.resetBtn.addEventListener("click", reset);
    elements.speedInput.addEventListener("input", function () {
      setParameters({ speed: elements.speedInput.value, bondStrength: state.bondStrength });
    });
    elements.bondStrengthInput.addEventListener("input", function () {
      setParameters({ speed: state.speed, bondStrength: elements.bondStrengthInput.value });
    });
  }

  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    var dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // 以可静态识别的方式暴露运行时钩子
  window.simulation = {
    init: init,
    start: start,
    pause: pause,
    reset: reset,
    update: update,
    render: render,
    setParameters: setParameters,
    getState: getState,
    getReadouts: getReadouts,
    runModelChecks: runModelChecks
  };

  init();
})();
</script>
</body>
</html>
