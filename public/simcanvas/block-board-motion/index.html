<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>滑块木板运动模型</title>
<style>
  :root {
    color-scheme: light;
    --sim-bg: #eef3f8;
    --sim-surface: #ffffff;
    --sim-surface-soft: #f8fafc;
    --sim-text: #172033;
    --sim-muted: #657188;
    --sim-border: #dfe6ef;
    --sim-grid: #e8edf4;
    --sim-accent: #0f9fba;
    --sim-accent-deep: #08758a;
    --sim-accent-soft: #d9f4f7;
    --sim-positive: #0f9fba;
    --sim-warning: #d97706;
    --sim-danger: #dc2626;
    --sim-radius-sm: 10px;
    --sim-radius-md: 16px;
    --sim-radius-lg: 22px;
    --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
    --sim-space-1: 4px;
    --sim-space-2: 8px;
    --sim-space-3: 12px;
    --sim-space-4: 16px;
    --sim-space-5: 24px;
    --sim-space-6: 32px;
    /* 语义色：滑块/木板/拉力/摩擦力 */
    --sim-block: #2563eb;
    --sim-block-deep: #1d4ed8;
    --sim-block-soft: #dbeafe;
    --sim-board: #d97706;
    --sim-board-deep: #b45309;
    --sim-board-soft: #fef3c7;
    --sim-force: #0f9fba;
    --sim-friction: #7c3aed;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-width: 320px;
    color: var(--sim-text);
    background:
      radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 30%),
      radial-gradient(circle at 92% 4%, rgba(217, 119, 6, 0.10), transparent 28%),
      var(--sim-bg);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  button, input { font: inherit; }
  button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
  button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
  button:hover { border-color: #c7d2e2; background: #eef3f9; }
  button:active { transform: scale(.97); }
  button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
  button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }

  .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
  .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
  .header h1 { margin: 0 0 5px; font-size: clamp(1.5rem, 2.3vw, 2rem); letter-spacing: -0.035em; line-height: 1; }
  .header p { margin: 0; color: var(--sim-muted); font-size: 0.88rem; line-height: 1.4; max-width: 760px; }
  .status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 16px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; transition: background .2s ease, color .2s ease, border-color .2s ease; }
  .status.sliding { background: var(--sim-board-soft); color: var(--sim-board-deep); border-color: rgba(217,119,6,.3); }
  .status.paused { background: #eef2f7; color: #536071; border-color: var(--sim-border); }

  .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(320px, 0.78fr); gap: 12px; }
  .panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
  .scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .panel-head h2 { margin: 0; font-size: 1rem; }
  .toggles { display: flex; gap: 8px; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; font-size: 0.78rem; border-radius: 999px; }
  .toggle .dot { width: 9px; height: 9px; border-radius: 50%; }
  .toggle[aria-pressed="true"] { background: var(--sim-accent-soft); color: var(--sim-accent-deep); border-color: rgba(15,159,186,.35); }
  .toggle[aria-pressed="false"] { background: #eef2f7; color: #7a8798; border-color: var(--sim-border); }
  .toggle[aria-pressed="false"] .dot { background: #b6c0ce; }
  .toggle[aria-pressed="true"] .dot.force { background: var(--sim-force); }
  .toggle[aria-pressed="true"] .dot.friction { background: var(--sim-friction); }

  #scene { width: 100%; height: 100%; min-height: 340px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(165deg, #fbfdff 0%, #f3f8fa 58%, #fff9ed 100%); overflow: hidden; }
  .ground { stroke: #9aa7ba; stroke-width: 3; stroke-linecap: round; }
  .board { fill: #e2912e; stroke: var(--sim-board-deep); stroke-width: 2; }
  .board-plank { stroke: rgba(180,83,9,.35); stroke-width: 1.5; }
  .block { fill: #3b82f6; stroke: var(--sim-block-deep); stroke-width: 2; }
  .arrow-line { stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .arrow-head { stroke: none; }
  .arrow-label { font-size: 15px; font-weight: 850; fill: #172033; paint-order: stroke; stroke: rgba(255,255,255,.92); stroke-width: 4px; stroke-linejoin: round; }

  .side { min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 12px; }
  .chart-card { padding: 12px 14px 8px; min-height: 0; display: flex; flex-direction: column; }
  .chart-title { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 8px; }
  .chart-title h3 { margin: 0; font-size: 0.95rem; }
  .chart-title span { font-size: 0.7rem; color: var(--sim-muted); }
  #vtChart { width: 100%; flex: 1; min-height: 0; display: block; }
  .readouts { padding: 14px; }
  .readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  .metric { padding: 11px 12px; border: 1px solid rgba(15,159,186,.12); border-radius: 14px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
  .metric small { display: block; margin-bottom: 3px; color: var(--sim-muted); font-size: 0.7rem; }
  .metric strong { font-size: 1.15rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .metric .sub { color: var(--sim-muted); font-size: 0.68rem; }
  .metric.block { border-left: 3px solid var(--sim-block); }
  .metric.board { border-left: 3px solid var(--sim-board); }
  .metric.friction { border-left: 3px solid var(--sim-friction); }
  .metric.critical { border-left: 3px solid var(--sim-warning); }

  .controls { padding: 10px 14px; display: grid; gap: 10px; }
  .ctrl-row { display: grid; grid-template-columns: auto minmax(150px, 1fr) minmax(150px, 1fr) minmax(150px, 1fr); gap: 16px; align-items: end; }
  .ctrl-row.row2 { grid-template-columns: auto minmax(120px, 1fr) minmax(120px, 1fr) minmax(120px, 1fr) minmax(120px, 1fr); }
  .actions { display: flex; gap: 8px; align-items: end; }
  .actions button { padding: 9px 13px; white-space: nowrap; }
  .control label { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 5px; font-size: 0.78rem; font-weight: 700; }
  .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; font-weight: 600; }
  input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
  .speed { display: flex; gap: 6px; align-items: end; }
  .speed-btn { padding: 8px 10px; font-size: 0.78rem; }
  .speed-btn.active { background: #172033; color: #fff; border-color: #172033; }
  .f0-chip { display: flex; align-items: baseline; gap: 8px; padding: 8px 13px; border: 1px dashed rgba(217,119,6,.5); border-radius: 12px; background: var(--sim-board-soft); font-size: 0.8rem; color: var(--sim-board-deep); white-space: nowrap; }
  .f0-chip b { font-size: 1.05rem; font-variant-numeric: tabular-nums; }

  @media (max-width: 1200px) {
    .ctrl-row, .ctrl-row.row2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .actions { grid-column: 1 / -1; }
  }
  @media (max-width: 860px) {
    .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
    .main { grid-template-columns: 1fr; }
    .scene-panel { min-height: 0; }
    #scene { min-height: 0; height: auto; aspect-ratio: 920 / 440; }
    .side { grid-template-rows: 300px auto; }
    .header { align-items: flex-start; flex-direction: column; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="app" data-layout="scene-first">
    <header class="header" data-region="header">
      <div>
        <h1>滑块木板运动模型</h1>
        <p>滑块 m 置于木板 M 上、地面光滑。调节拉力 F 与初速度 v₀，观察静摩擦共速与滑动摩擦分离的临界过渡。</p>
      </div>
      <div id="status" class="status paused" role="status" aria-live="polite" data-region="insight">就绪</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head">
          <h2 id="scene-title">场景动画</h2>
          <div class="toggles">
            <button id="toggleForce" class="toggle" type="button" aria-pressed="true" title="显示/隐藏拉力箭头">
              <span class="dot force"></span>拉力 F
            </button>
            <button id="toggleFriction" class="toggle" type="button" aria-pressed="true" title="显示/隐藏摩擦力箭头">
              <span class="dot friction"></span>摩擦 f
            </button>
          </div>
        </div>
        <svg id="scene" viewBox="0 0 920 440" role="img" aria-labelledby="scene-title scene-desc">
          <desc id="scene-desc">滑块木板双物体运动场景：蓝色滑块在橙色木板上，地面光滑，可显示拉力与摩擦力箭头。</desc>
          <line class="ground" x1="24" y1="340" x2="896" y2="340"></line>
          <g id="boardG">
            <rect id="boardRect" class="board" y="304" height="36" rx="6"></rect>
            <line id="boardPlank1" class="board-plank" x1="0" y1="304" x2="0" y2="340"></line>
            <line id="boardPlank2" class="board-plank" x1="0" y1="304" x2="0" y2="340"></line>
            <line id="boardPlank3" class="board-plank" x1="0" y1="304" x2="0" y2="340"></line>
          </g>
          <rect id="blockRect" class="block" y="274" height="30" rx="5"></rect>
          <g id="arrowF" class="arrow" opacity="0">
            <line id="fLine" class="arrow-line"></line>
            <polygon id="fHead" class="arrow-head"></polygon>
            <text id="fLabel" class="arrow-label">F</text>
          </g>
          <g id="arrowFb" class="arrow" opacity="0">
            <line id="fbLine" class="arrow-line"></line>
            <polygon id="fbHead" class="arrow-head"></polygon>
            <text id="fbLabel" class="arrow-label">f</text>
          </g>
          <g id="arrowFbd" class="arrow" opacity="0">
            <line id="fbdLine" class="arrow-line"></line>
            <polygon id="fbdHead" class="arrow-head"></polygon>
            <text id="fbdLabel" class="arrow-label">f</text>
          </g>
        </svg>
      </section>

      <aside class="side" data-region="evidence">
        <section class="panel chart-card" aria-label="速度-时间图">
          <div class="chart-title"><h3>速度 v - t 图</h3><span>滑块蓝 · 木板橙</span></div>
          <canvas id="vtChart" aria-label="滑块与木板速度随时间变化曲线"></canvas>
        </section>
        <section class="panel readouts" aria-label="实时读数">
          <div class="readout-grid">
            <div class="metric block"><small>滑块速度 v</small><strong id="vBlockRead">0.00</strong><span class="sub">m/s</span></div>
            <div class="metric board"><small>木板速度 v</small><strong id="vBoardRead">0.00</strong><span class="sub">m/s</span></div>
            <div class="metric block"><small>滑块加速度 a</small><strong id="aBlockRead">0.00</strong><span class="sub">m/s²</span></div>
            <div class="metric board"><small>木板加速度 a</small><strong id="aBoardRead">0.00</strong><span class="sub">m/s²</span></div>
            <div class="metric friction"><small>摩擦力 f</small><strong id="fRead">0.00</strong><span id="fDir" class="sub">N</span></div>
            <div class="metric critical"><small>临界力 F₀</small><strong id="f0Read">3.00</strong><span class="sub">N</span></div>
          </div>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="仿真控制">
      <div class="ctrl-row">
        <div class="actions">
          <button id="startBtn" class="primary" type="button">▶ 开始</button>
          <button id="pauseBtn" type="button">Ⅱ 暂停</button>
          <button id="resetBtn" type="button">↻ 重置</button>
        </div>
        <div class="control">
          <label for="forceInput">拉力 F <output id="forceOutput">2.5 N</output></label>
          <input id="forceInput" type="range" min="0" max="15" step="0.5" value="2.5">
        </div>
        <div class="control">
          <label for="v0bInput">滑块初速 v₀ <output id="v0bOutput">0.0 m/s</output></label>
          <input id="v0bInput" type="range" min="-4" max="8" step="0.5" value="0">
        </div>
        <div class="control">
          <label for="v0BInput">木板初速 v₀ <output id="v0BOutput">0.0 m/s</output></label>
          <input id="v0BInput" type="range" min="-4" max="8" step="0.5" value="0">
        </div>
      </div>
      <div class="ctrl-row row2">
        <div class="speed" role="group" aria-label="倍速">
          <button class="speed-btn" data-speed="0.5" type="button">0.5×</button>
          <button class="speed-btn active" data-speed="1" type="button">1×</button>
          <button class="speed-btn" data-speed="2" type="button">2×</button>
        </div>
        <div class="control">
          <label for="massInput">滑块质量 m <output id="massOutput">1.0 kg</output></label>
          <input id="massInput" type="range" min="0.5" max="5" step="0.1" value="1">
        </div>
        <div class="control">
          <label for="boardMassInput">木板质量 M <output id="boardMassOutput">2.0 kg</output></label>
          <input id="boardMassInput" type="range" min="0.5" max="6" step="0.1" value="2">
        </div>
        <div class="control">
          <label for="muInput">摩擦系数 μ <output id="muOutput">0.20</output></label>
          <input id="muInput" type="range" min="0.05" max="0.6" step="0.05" value="0.2">
        </div>
        <div class="f0-chip" title="F 超过此值时发生相对滑动">F₀ = <b id="f0Chip">3.0 N</b></div>
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";
    const G = 10;
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const finite = (v, fb) => Number.isFinite(v) ? v : fb;

    const parameterSchema = [
      { key: "force", label: "拉力 F", type: "slider", min: 0, max: 15, step: 0.5, default: 2.5, unit: "N" },
      { key: "v0Block", label: "滑块初速 v₀", type: "slider", min: -4, max: 8, step: 0.5, default: 0, unit: "m/s" },
      { key: "v0Board", label: "木板初速 v₀", type: "slider", min: -4, max: 8, step: 0.5, default: 0, unit: "m/s" },
      { key: "mass", label: "滑块质量 m", type: "slider", min: 0.5, max: 5, step: 0.1, default: 1, unit: "kg" },
      { key: "boardMass", label: "木板质量 M", type: "slider", min: 0.5, max: 6, step: 0.1, default: 2, unit: "kg" },
      { key: "mu", label: "摩擦系数 μ", type: "slider", min: 0.05, max: 0.6, step: 0.05, default: 0.2, unit: "" }
    ];

    const state = {
      running: false,
      t: 0,
      phase: "together",          // "together" | "sliding"
      vBlock: 0, vBoard: 0,
      xBlock: 0, xBoard: 0,
      force: 2.5, v0Block: 0, v0Board: 0,
      mass: 1, boardMass: 2, mu: 0.2,
      speed: 1,
      showForces: true, showFriction: true,
      lastTimestamp: null,
      lastSample: 0,
      history: [{ t: 0, vBlock: 0, vBoard: 0 }]
    };

    const elements = {
      status: document.querySelector("#status"),
      scene: document.querySelector("#scene"),
      boardRect: document.querySelector("#boardRect"),
      boardPlanks: [document.querySelector("#boardPlank1"), document.querySelector("#boardPlank2"), document.querySelector("#boardPlank3")],
      blockRect: document.querySelector("#blockRect"),
      arrowF: document.querySelector("#arrowF"), fLine: document.querySelector("#fLine"), fHead: document.querySelector("#fHead"), fLabel: document.querySelector("#fLabel"),
      arrowFb: document.querySelector("#arrowFb"), fbLine: document.querySelector("#fbLine"), fbHead: document.querySelector("#fbHead"), fbLabel: document.querySelector("#fbLabel"),
      arrowFbd: document.querySelector("#arrowFbd"), fbdLine: document.querySelector("#fbdLine"), fbdHead: document.querySelector("#fbdHead"), fbdLabel: document.querySelector("#fbdLabel"),
      toggleForce: document.querySelector("#toggleForce"), toggleFriction: document.querySelector("#toggleFriction"),
      vtChart: document.querySelector("#vtChart"),
      vBlockRead: document.querySelector("#vBlockRead"), vBoardRead: document.querySelector("#vBoardRead"),
      aBlockRead: document.querySelector("#aBlockRead"), aBoardRead: document.querySelector("#aBoardRead"),
      fRead: document.querySelector("#fRead"), fDir: document.querySelector("#fDir"), f0Read: document.querySelector("#f0Read"),
      forceInput: document.querySelector("#forceInput"), forceOutput: document.querySelector("#forceOutput"),
      v0bInput: document.querySelector("#v0bInput"), v0bOutput: document.querySelector("#v0bOutput"),
      v0BInput: document.querySelector("#v0BInput"), v0BOutput: document.querySelector("#v0BOutput"),
      massInput: document.querySelector("#massInput"), massOutput: document.querySelector("#massOutput"),
      boardMassInput: document.querySelector("#boardMassInput"), boardMassOutput: document.querySelector("#boardMassOutput"),
      muInput: document.querySelector("#muInput"), muOutput: document.querySelector("#muOutput"),
      f0Chip: document.querySelector("#f0Chip"),
      startBtn: document.querySelector("#startBtn"), pauseBtn: document.querySelector("#pauseBtn"), resetBtn: document.querySelector("#resetBtn")
    };

    function fMax() { return state.mu * state.mass * G; }
    function fCritical() { return fMax() * (state.mass + state.boardMass) / state.boardMass; }

    // 当前相位派生量：返回 { aBlock, aBoard, fBlock(向右为正), fMag, fDir }
    function derive() {
      const fm = fMax();
      let aBlock, aBoard, fBlock;
      if (state.phase === "together") {
        const a = state.force / (state.mass + state.boardMass);
        const fReq = state.force * state.boardMass / (state.mass + state.boardMass);
        fBlock = -fReq;             // 滑块受到的静摩擦力（与拉力反向）
        aBlock = a; aBoard = a;
      } else {
        const dir = (state.vBlock - state.vBoard) >= 0 ? 1 : -1;
        fBlock = -fm * dir;         // 动摩擦力，方向与相对运动相反
        aBlock = (state.force + fBlock) / state.mass;
        aBoard = -fBlock / state.boardMass;
      }
      const fMag = Math.abs(fBlock);
      const fDir = Math.abs(fBlock) < 1e-9 ? "N" : (fBlock > 0 ? "N →" : "N ←");
      return { aBlock, aBoard, fBlock, fMag, fDir, fm, critical: fCritical() };
    }

    function init() { bindControls(); reset(); requestAnimationFrame(frame); }

    function start() {
      state.running = true;
      elements.startBtn.setAttribute("aria-pressed", "true");
    }
    function pause() {
      state.running = false;
      elements.startBtn.setAttribute("aria-pressed", "false");
    }
    function reset() {
      pause();
      state.t = 0;
      state.lastTimestamp = null;
      state.lastSample = 0;
      state.vBlock = state.v0Block;
      state.vBoard = state.v0Board;
      state.xBlock = 0;
      state.xBoard = 0;
      state.phase = Math.abs(state.vBlock - state.vBoard) < 1e-9 ? "together" : "sliding";
      state.history = [{ t: 0, vBlock: state.vBlock, vBoard: state.vBoard }];
      render();
    }

    function update(dt) {
      if (!state.running) return;
      dt = clamp(finite(dt, 0), 0, 0.05) * state.speed;
      const fm = fMax();
      const vRel0 = state.vBlock - state.vBoard;

      if (state.phase === "together") {
        const a = state.force / (state.mass + state.boardMass);
        const fReq = state.force * state.boardMass / (state.mass + state.boardMass);
        if (Math.abs(fReq) <= fm + 1e-9) {
          state.vBlock += a * dt;
          state.vBoard += a * dt;
        } else {
          state.phase = "sliding";
        }
      }

      if (state.phase === "sliding") {
        const dir = vRel0 >= 0 ? 1 : -1;
        const fb = -fm * dir;
        const aBlock = (state.force + fb) / state.mass;
        const aBoard = -fb / state.boardMass;
        state.vBlock += aBlock * dt;
        state.vBoard += aBoard * dt;
        const vRel1 = state.vBlock - state.vBoard;
        const crossed = vRel0 === 0 ? false : Math.sign(vRel1) !== Math.sign(vRel0);
        if (crossed || Math.abs(vRel1) < 1e-6) {
          const fReq = state.force * state.boardMass / (state.mass + state.boardMass);
          if (Math.abs(fReq) <= fm + 1e-9) {
            const vCom = (state.mass * state.vBlock + state.boardMass * state.vBoard) / (state.mass + state.boardMass);
            state.vBlock = vCom;
            state.vBoard = vCom;
            state.phase = "together";
          }
        }
      }

      state.xBlock += state.vBlock * dt;
      state.xBoard += state.vBoard * dt;
      state.t += dt;

      if (state.history.length === 0 || state.t - state.history[state.history.length - 1].t >= 0.04) {
        state.history.push({ t: state.t, vBlock: state.vBlock, vBoard: state.vBoard });
        if (state.history.length > 3000) state.history.shift();
      }
    }

    // ---------- 场景渲染 ----------
    const VIEW_W = 920, VIEW_H = 440;
    function sx(worldX) {
      const xCom = (state.mass * state.xBlock + state.boardMass * state.xBoard) / (state.mass + state.boardMass);
      return VIEW_W / 2 + (worldX - xCom) * 62;
    }
    function setArrow(line, head, x1, y1, x2, y2, color) {
      line.setAttribute("x1", x1); line.setAttribute("y1", y1);
      line.setAttribute("x2", x2); line.setAttribute("y2", y2);
      line.setAttribute("stroke", color);
      head.setAttribute("fill", color);
      const ang = Math.atan2(y2 - y1, x2 - x1);
      const ux = Math.cos(ang), uy = Math.sin(ang);
      const px = -uy, py = ux;
      const hlen = 11, hwid = 6.5, back = 2;
      const ax = x2 - ux * back, ay = y2 - uy * back;
      const bx = ax - ux * hlen + px * hwid, by = ay - uy * hlen + py * hwid;
      const cx = ax - ux * hlen - px * hwid, cy = ay - uy * hlen - py * hwid;
      head.setAttribute("points", `${x2},${y2} ${bx},${by} ${cx},${cy}`);
    }

    function renderScene() {
      const sxb = sx(state.xBlock);
      const sxB = sx(state.xBoard);
      const boardTop = 340 - 36, blockTop = boardTop - 30;

      // 木板足够长：始终覆盖两物体并留边
      const left = Math.min(sxb, sxB) - 112;
      const right = Math.max(sxb, sxB) + 112;
      const width = Math.max(280, right - left);
      elements.boardRect.setAttribute("x", left);
      elements.boardRect.setAttribute("width", width);
      const plankYs = [boardTop + 9, boardTop + 18, boardTop + 27];
      elements.boardPlanks.forEach((pl, i) => {
        pl.setAttribute("x1", left + 14); pl.setAttribute("x2", left + width - 14);
        pl.setAttribute("y1", plankYs[i]); pl.setAttribute("y2", plankYs[i] + 1);
      });

      const blockW = 44;
      elements.blockRect.setAttribute("x", sxb - blockW / 2);

      // 拉力箭头（在滑块上方）
      const by = blockTop - 18;
      const fLen = state.force > 0 ? clamp(state.force * 12, 26, 150) : 0;
      const showF = state.showForces && state.force > 0;
      elements.arrowF.setAttribute("opacity", showF ? "1" : "0");
      if (showF) {
        setArrow(elements.fLine, elements.fHead, sxb - blockW / 2 - 6, by, sxb - blockW / 2 - 6 + fLen, by, "var(--sim-force)");
        elements.fLabel.setAttribute("x", sxb - blockW / 2 - 6 + fLen / 2);
        elements.fLabel.setAttribute("y", by - 9);
        elements.fLabel.setAttribute("fill", "var(--sim-force)");
      }

      const d = derive();
      const fm = d.fm;
      const showFric = state.showFriction;
      const fMagPx = fm > 0 ? clamp(fm * 26, 16, 100) : 0;
      const fDirOnBlock = d.fBlock > 1e-9 ? 1 : (d.fBlock < -1e-9 ? -1 : 0);
      const fDirOnBoard = -fDirOnBlock;
      const fActive = showFric && fMagPx > 0 && Math.abs(d.fBlock) > 1e-9;

      // 滑块上的摩擦力
      elements.arrowFb.setAttribute("opacity", fActive ? "1" : "0");
      if (fActive) {
        const x1 = sxb, y1 = 289;
        const x2 = sxb + fDirOnBlock * fMagPx;
        setArrow(elements.fbLine, elements.fbHead, x1, y1, x2, y1, "var(--sim-friction)");
        elements.fbLabel.setAttribute("x", (x1 + x2) / 2);
        elements.fbLabel.setAttribute("y", y1 - 9);
        elements.fbLabel.setAttribute("fill", "var(--sim-friction)");
      }
      // 木板上的摩擦力（等大反向）
      elements.arrowFbd.setAttribute("opacity", fActive ? "1" : "0");
      if (fActive) {
        const x1 = sxB, y1 = 322;
        const x2 = sxB + fDirOnBoard * fMagPx;
        setArrow(elements.fbdLine, elements.fbdHead, x1, y1, x2, y1, "var(--sim-friction)");
        elements.fbdLabel.setAttribute("x", (x1 + x2) / 2);
        elements.fbdLabel.setAttribute("y", y1 + 21);
        elements.fbdLabel.setAttribute("fill", "var(--sim-friction)");
      }
    }

    // ---------- v-t 图 ----------
    function resizeCanvas(canvas) {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const rect = canvas.getBoundingClientRect();
      const w = Math.max(120, Math.floor(rect.width * dpr));
      const h = Math.max(120, Math.floor(rect.height * dpr));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, w: rect.width, h: rect.height };
    }

    function drawChart() {
      const canvas = elements.vtChart;
      const { ctx, w, h } = resizeCanvas(canvas);
      ctx.clearRect(0, 0, w, h);
      const pad = { l: 48, r: 16, t: 16, b: 34 };
      const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
      ctx.font = "11px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif";
      ctx.lineWidth = 1;

      const hist = state.history;
      const maxT = Math.max(10, state.t);
      let yMin = 0, yMax = 1;
      hist.forEach(p => {
        yMin = Math.min(yMin, p.vBlock, p.vBoard);
        yMax = Math.max(yMax, p.vBlock, p.vBoard);
      });
      const span = Math.max(0.6, (yMax - yMin) * 1.18);
      const yc = (yMax + yMin) / 2;
      yMin = yc - span / 2; yMax = yc + span / 2;

      const X = t => pad.l + (t / maxT) * pw;
      const Y = v => pad.t + (yMax - v) / (yMax - yMin) * ph;

      // 网格
      ctx.strokeStyle = "var(--sim-grid)"; ctx.fillStyle = "var(--sim-muted)";
      for (let k = 0; k <= 5; k++) {
        const y = pad.t + ph * k / 5;
        ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
        const val = yMax - (yMax - yMin) * k / 5;
        ctx.textAlign = "right"; ctx.textBaseline = "middle";
        ctx.fillText(val.toFixed(Math.abs(val) < 1e-9 ? 0 : 1), pad.l - 7, y);
      }
      for (let k = 0; k <= 6; k++) {
        const x = pad.l + pw * k / 6;
        ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, h - pad.b); ctx.stroke();
        const val = maxT * k / 6;
        ctx.textAlign = "center"; ctx.textBaseline = "top";
        ctx.fillText(val.toFixed(val < 10 ? 1 : 0), x, h - pad.b + 7);
      }
      // 零线
      if (yMin < 0 && yMax > 0) {
        ctx.strokeStyle = "#b6c0ce"; ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.moveTo(pad.l, Y(0)); ctx.lineTo(w - pad.r, Y(0)); ctx.stroke();
        ctx.lineWidth = 1;
      }
      // 轴框
      ctx.strokeStyle = "#9aa7ba"; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(pad.l, pad.t); ctx.lineTo(pad.l, h - pad.b); ctx.lineTo(w - pad.r, h - pad.b); ctx.stroke();
      ctx.fillStyle = "var(--sim-muted)";
      ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillText("v / m·s⁻¹", 4, 3);
      ctx.textAlign = "right"; ctx.fillText("t / s", w - 3, h - 20);

      if (hist.length < 2) return;
      ctx.lineWidth = 2.6; ctx.lineJoin = "round"; ctx.lineCap = "round";
      const trace = (key, color) => {
        ctx.strokeStyle = color; ctx.beginPath();
        hist.forEach((p, i) => { const x = X(p.t), y = Y(p[key]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
        ctx.stroke();
      };
      trace("vBlock", "var(--sim-block)");
      trace("vBoard", "var(--sim-board)");
    }

    // ---------- 读数与状态 ----------
    function render() {
      const d = derive();
      elements.vBlockRead.textContent = state.vBlock.toFixed(2);
      elements.vBoardRead.textContent = state.vBoard.toFixed(2);
      elements.aBlockRead.textContent = d.aBlock.toFixed(2);
      elements.aBoardRead.textContent = d.aBoard.toFixed(2);
      elements.fRead.textContent = d.fMag.toFixed(2);
      elements.fDir.textContent = d.fDir;
      elements.f0Read.textContent = d.critical.toFixed(2);
      elements.f0Chip.textContent = d.critical.toFixed(1) + " N";

      elements.forceOutput.textContent = state.force.toFixed(1) + " N";
      elements.v0bOutput.textContent = state.v0Block.toFixed(1) + " m/s";
      elements.v0BOutput.textContent = state.v0Board.toFixed(1) + " m/s";
      elements.massOutput.textContent = state.mass.toFixed(1) + " kg";
      elements.boardMassOutput.textContent = state.boardMass.toFixed(1) + " kg";
      elements.muOutput.textContent = state.mu.toFixed(2);

      if (!state.running && state.t === 0) {
        elements.status.className = "status paused";
        elements.status.textContent = "就绪 · 点开始";
      } else if (!state.running) {
        elements.status.className = "status paused";
        elements.status.textContent = "已暂停";
      } else {
        const together = state.phase === "together";
        elements.status.className = "status" + (together ? "" : " sliding");
        if (together) {
          elements.status.textContent = Math.abs(d.aBlock) < 1e-6 ? "一起匀速" : "一起加速";
        } else {
          elements.status.textContent = "相对滑动";
        }
      }

      renderScene();
      drawChart();
    }

    function setParameters(values) {
      const defs = Object.fromEntries(parameterSchema.map(p => [p.key, p.default]));
      if (values.force !== undefined) state.force = clamp(finite(Number(values.force), defs.force), 0, 15);
      if (values.v0Block !== undefined) state.v0Block = clamp(finite(Number(values.v0Block), defs.v0Block), -4, 8);
      if (values.v0Board !== undefined) state.v0Board = clamp(finite(Number(values.v0Board), defs.v0Board), -4, 8);
      if (values.mass !== undefined) state.mass = clamp(finite(Number(values.mass), defs.mass), 0.5, 5);
      if (values.boardMass !== undefined) state.boardMass = clamp(finite(Number(values.boardMass), defs.boardMass), 0.5, 6);
      if (values.mu !== undefined) state.mu = clamp(finite(Number(values.mu), defs.mu), 0.05, 0.6);
      // v₀ 是初始条件：在 t=0 且未运行时修改应即时反映到当前速度与相位，
      // 避免学生拖完初速度滑块直接点开始却看不到效果（需手动重置的陷阱）。
      if (state.t === 0 && !state.running) {
        const v0b = state.v0Block, v0B = state.v0Board;
        if (v0b !== state.vBlock || v0B !== state.vBoard) {
          state.vBlock = v0b;
          state.vBoard = v0B;
          state.phase = Math.abs(v0b - v0B) < 1e-9 ? "together" : "sliding";
          state.history = [{ t: 0, vBlock: v0b, vBoard: v0B }];
        }
      }
      elements.forceInput.value = String(state.force);
      elements.v0bInput.value = String(state.v0Block);
      elements.v0BInput.value = String(state.v0Board);
      elements.massInput.value = String(state.mass);
      elements.boardMassInput.value = String(state.boardMass);
      elements.muInput.value = String(state.mu);
      render();
    }

    function getState() {
      return {
        t: state.t, phase: state.phase, vBlock: state.vBlock, vBoard: state.vBoard,
        xBlock: state.xBlock, xBoard: state.xBoard, running: state.running, speed: state.speed,
        force: state.force, v0Block: state.v0Block, v0Board: state.v0Board,
        mass: state.mass, boardMass: state.boardMass, mu: state.mu,
        showForces: state.showForces, showFriction: state.showFriction,
        history: state.history.map(p => ({ ...p }))
      };
    }
    function getReadouts() {
      const d = derive();
      return {
        vBlock: state.vBlock, vBoard: state.vBoard,
        aBlock: d.aBlock, aBoard: d.aBoard,
        friction: d.fMag, frictionDir: d.fDir,
        critical: d.critical, phase: state.phase, time: state.t
      };
    }

    function bindControls() {
      elements.startBtn.addEventListener("click", start);
      elements.pauseBtn.addEventListener("click", pause);
      elements.resetBtn.addEventListener("click", reset);

      elements.forceInput.addEventListener("input", () => setParameters({ force: elements.forceInput.value }));
      elements.massInput.addEventListener("input", () => setParameters({ mass: elements.massInput.value }));
      elements.boardMassInput.addEventListener("input", () => setParameters({ boardMass: elements.boardMassInput.value }));
      elements.muInput.addEventListener("input", () => setParameters({ mu: elements.muInput.value }));
      elements.v0bInput.addEventListener("input", () => setParameters({ v0Block: elements.v0bInput.value }));
      elements.v0BInput.addEventListener("input", () => setParameters({ v0Board: elements.v0BInput.value }));

      document.querySelectorAll(".speed-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          state.speed = Number(btn.dataset.speed);
          document.querySelectorAll(".speed-btn").forEach(b => b.classList.toggle("active", b === btn));
        });
      });

      elements.toggleForce.addEventListener("click", () => {
        state.showForces = !state.showForces;
        elements.toggleForce.setAttribute("aria-pressed", String(state.showForces));
        renderScene();
      });
      elements.toggleFriction.addEventListener("click", () => {
        state.showFriction = !state.showFriction;
        elements.toggleFriction.setAttribute("aria-pressed", String(state.showFriction));
        renderScene();
      });

      window.addEventListener("resize", drawChart);
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      const dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts };
    init();
  })();
  </script>
</body>
</html>
