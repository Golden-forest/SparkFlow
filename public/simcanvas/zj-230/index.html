  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>单位圆与三角函数 · 动态可视化</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #eef3f8;
      --sim-surface: #ffffff;
      --sim-surface-soft: #f8fafc;
      --sim-text: #172033;
      --sim-muted: #657188;
      --sim-border: #dfe6ef;
      --sim-grid: #e8edf4;
      --sim-accent: #0f9fba;
      --sim-accent-deep: #08758a;
      --sim-accent-soft: #d9f4f7;
      --sim-positive: #0f9fba;
      --sim-warning: #f59e0b;
      --sim-danger: #dc2626;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
      --sim-cos: #0f9fba;
      --sim-sin: #f59e0b;
      --sim-tan: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
        var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: var(--sim-space-4) var(--sim-space-5) var(--sim-space-3); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: var(--sim-space-3); overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: var(--sim-space-5); min-height: 52px; }
    .header h1 { margin: 0 0 var(--sim-space-1); font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
    .status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(300px, 0.72fr); gap: var(--sim-space-3); }
    .panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { min-height: 430px; padding: var(--sim-space-3); display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sim-space-3); margin-bottom: var(--sim-space-3); }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
    #scene { width: 100%; height: 100%; min-height: 350px; display: block; border: 1px solid rgba(15,159,186,.12); border-radius: 18px; background: linear-gradient(145deg, #fbfdff 0%, #f2f8fa 58%, #fff9ed 100%); }
    .side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: var(--sim-space-3); }
    .readouts, .model-note { padding: 17px; }
    .readout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sim-space-2); }
    .metric { padding: var(--sim-space-3); border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
    .metric small { display: block; margin-bottom: var(--sim-space-1); color: var(--sim-muted); }
    .metric strong { font-size: 1.45rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .metric.cos strong { color: var(--sim-cos); }
    .metric.sin strong { color: var(--sim-sin); }
    .metric.tan strong { color: var(--sim-tan); }
    .model-note { display: grid; align-content: start; gap: var(--sim-space-3); }
    .model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.88rem; }
    .insight { padding: var(--sim-space-3); border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; }
    .controls { padding: 11px var(--sim-space-3); display: grid; grid-template-columns: auto minmax(180px, 1fr) minmax(180px, 1fr); gap: var(--sim-space-4); align-items: center; border-radius: 17px; }
    .actions { display: flex; gap: var(--sim-space-2); }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
    button:hover { border-color: #c7d2e2; background: #eef3f9; }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
    .control label { display: flex; justify-content: space-between; gap: var(--sim-space-3); margin-bottom: var(--sim-space-1); font-size: 0.8rem; font-weight: 700; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
    .grid-line { stroke: var(--sim-grid); stroke-width: 1; }
    .axis { stroke: #9aa7ba; stroke-width: 1.5; }
    .axis-label { fill: var(--sim-muted); font-size: 12px; }
    .circle-unit { fill: none; stroke: #2a3a55; stroke-width: 2; }
    .ref-line { stroke-width: 2.5; stroke-linecap: round; }
    .cos-line { stroke: var(--sim-cos); }
    .sin-line { stroke: var(--sim-sin); }
    .tan-line { stroke: var(--sim-tan); }
    .radius-line { stroke: #2a3a55; stroke-width: 2.5; stroke-linecap: round; }
    .point { fill: var(--sim-accent); stroke: white; stroke-width: 3; }
    .point-halo { fill: rgba(15,159,186,.14); }
    .axis-tick { stroke: #9aa7ba; stroke-width: 1; }
    .tick-label { fill: var(--sim-muted); font-size: 11px; }
    .legend-dot { stroke-width: 0; }
    @media (max-width: 860px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: var(--sim-space-3); }
      .main, .app[data-layout] .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
      .scene-panel { min-height: 0; }
      #scene { min-height: 0; height: auto; aspect-ratio: 760 / 420; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="app" data-layout="scene-first" data-model-tier="analytic">
    <header class="header" data-region="header">
      <div>
        <h1>单位圆与三角函数</h1>
        <p>观察旋转半径在圆上扫过的角度，如何对应正弦、余弦与正切值。</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-region="stage" aria-labelledby="scene-title">
        <div class="panel-head"><h2 id="scene-title">单位圆</h2><span>半径 = 1，角度 θ 从正 x 轴逆时针测量</span></div>
        <svg id="scene" viewBox="0 0 760 420" role="img" aria-labelledby="scene-title scene-desc">
          <desc id="scene-desc">单位圆上的旋转点，配以余弦水平投影、正弦垂直投影与正切切线段。</desc>
          <g id="grid"></g>
          <line class="axis" x1="80" y1="210" x2="380" y2="210"></line>
          <line class="axis" x1="210" y1="40" x2="210" y2="380"></line>
          <text class="axis-label" x="370" y="228">x</text>
          <text class="axis-label" x="216" y="48">y</text>
          <circle class="circle-unit" cx="210" cy="210" r="150"></circle>
          <line id="tanGuide" class="ref-line tan-line" x1="360" y1="210" x2="360" y2="210" opacity="0"></line>
          <line id="tanLine" class="ref-line tan-line" x1="360" y1="210" x2="360" y2="210" opacity="0"></line>
          <line id="cosLine" class="ref-line cos-line" x1="210" y1="210" x2="360" y2="210"></line>
          <line id="sinLine" class="ref-line sin-line" x1="360" y1="210" x2="360" y2="210"></line>
          <line id="radiusLine" class="radius-line" x1="210" y1="210" x2="360" y2="210"></line>
          <circle id="pointHalo" class="point-halo" cx="360" cy="210" r="15"></circle>
          <circle id="point" class="point" cx="360" cy="210" r="7"></circle>
          <text id="angleLabel" class="tick-label" x="240" y="200" font-size="13" font-weight="700" fill="#2a3a55">θ = 0°</text>
        </svg>
      </section>

      <aside class="side" data-region="evidence">
        <section class="panel readouts" aria-label="实时数值">
          <div class="readout-grid">
            <div class="metric cos"><small>cos θ（余弦）</small><strong id="cosReadout">1.000</strong></div>
            <div class="metric sin"><small>sin θ（正弦）</small><strong id="sinReadout">0.000</strong></div>
            <div class="metric tan"><small>tan θ（正切）</small><strong id="tanReadout">0.000</strong></div>
            <div class="metric"><small>角度 θ</small><strong id="angleReadout">0°</strong></div>
          </div>
        </section>
        <section class="panel model-note" data-region="insight">
          <div class="panel-head"><h2>观察要点</h2></div>
          <p id="insight" class="insight">按"开始"让半径旋转。蓝色横线是 cos θ，金色竖线是 sin θ，它们随角度变化。</p>
          <p>教学视图：在单位圆上，点的横坐标 = cos θ，纵坐标 = sin θ；tan θ = sin θ / cos θ，可由切线段直观呈现。角度单位为度，内部按弧度计算。</p>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-region="controls" aria-label="模拟控制">
      <div class="actions">
        <button id="startBtn" class="primary" type="button">开始</button>
        <button id="pauseBtn" type="button">暂停</button>
        <button id="resetBtn" type="button">重置</button>
      </div>
      <div class="control">
        <label for="speedInput">旋转速度 <output id="speedOutput">60°/s</output></label>
        <input id="speedInput" type="range" min="10" max="240" step="5" value="60">
      </div>
      <div class="control">
        <label for="angleInput">手动角度 <output id="angleOutput">0°</output></label>
        <input id="angleInput" type="range" min="0" max="360" step="1" value="0">
      </div>
    </section>
  </div>

  <script>
  (function () {
    "use strict";
    var parameterSchema = [
      { key: "speed", label: "旋转速度", type: "slider", min: 10, max: 240, step: 5, default: 60, unit: "°/s" },
      { key: "angle", label: "手动角度", type: "slider", min: 0, max: 360, step: 1, default: 0, unit: "°" }
    ];
    var state = {
      running: false,
      t: 0,
      angleDeg: 0,
      speed: 60,
      manualAngle: 0,
      useManual: false,
      lastTimestamp: null
    };
    var elements = {
      status: document.querySelector("#status"),
      grid: document.querySelector("#grid"),
      radiusLine: document.querySelector("#radiusLine"),
      cosLine: document.querySelector("#cosLine"),
      sinLine: document.querySelector("#sinLine"),
      tanLine: document.querySelector("#tanLine"),
      tanGuide: document.querySelector("#tanGuide"),
      point: document.querySelector("#point"),
      pointHalo: document.querySelector("#pointHalo"),
      angleLabel: document.querySelector("#angleLabel"),
      cosReadout: document.querySelector("#cosReadout"),
      sinReadout: document.querySelector("#sinReadout"),
      tanReadout: document.querySelector("#tanReadout"),
      angleReadout: document.querySelector("#angleReadout"),
      speedInput: document.querySelector("#speedInput"),
      speedOutput: document.querySelector("#speedOutput"),
      angleInput: document.querySelector("#angleInput"),
      angleOutput: document.querySelector("#angleOutput"),
      startBtn: document.querySelector("#startBtn"),
      pauseBtn: document.querySelector("#pauseBtn"),
      resetBtn: document.querySelector("#resetBtn"),
      insight: document.querySelector("#insight")
    };

    var CX = 210, CY = 210, R = 150, TAN_X = 360;

    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function finite(value, fallback) { return Number.isFinite(value) ? value : fallback; }

    function initGrid() {
      var lines = [];
      var i;
      for (i = -2; i <= 2; i += 1) {
        var x = CX + i * 75;
        lines.push('<line class="grid-line" x1="' + x + '" y1="40" x2="' + x + '" y2="380"></line>');
        var y = CY + i * 75;
        lines.push('<line class="grid-line" x1="80" y1="' + y + '" x2="380" y2="' + y + '"></line>');
      }
      lines.push('<line class="axis-tick" x1="360" y1="206" x2="360" y2="214"></line>');
      lines.push('<text class="tick-label" x="354" y="228">1</text>');
      lines.push('<line class="axis-tick" x1="60" y1="206" x2="60" y2="214"></line>');
      lines.push('<text class="tick-label" x="48" y="228">-1</text>');
      lines.push('<line class="axis-tick" x1="206" y1="60" x2="214" y2="60"></line>');
      lines.push('<text class="tick-label" x="218" y="64">1</text>');
      lines.push('<line class="axis-tick" x1="206" y1="360" x2="214" y2="360"></line>');
      lines.push('<text class="tick-label" x="218" y="364">-1</text>');
      elements.grid.innerHTML = lines.join("");
    }

    function init() {
      initGrid();
      bindControls();
      setParameters({ speed: 60, angle: 0 });
      reset();
      requestAnimationFrame(frame);
    }

    function start() {
      state.running = true;
      state.useManual = false;
      elements.status.textContent = "运行中";
      elements.startBtn.setAttribute("aria-pressed", "true");
    }

    function pause() {
      state.running = false;
      elements.status.textContent = "已暂停";
      elements.startBtn.setAttribute("aria-pressed", "false");
    }

    function reset() {
      pause();
      state.t = 0;
      state.angleDeg = 0;
      state.manualAngle = 0;
      state.useManual = false;
      state.lastTimestamp = null;
      elements.angleInput.value = "0";
      render();
    }

    function update(dt) {
      if (!state.running) return;
      var boundedDt = clamp(finite(dt, 0), 0, 0.05);
      state.angleDeg = (state.angleDeg + state.speed * boundedDt) % 360;
      if (state.angleDeg < 0) state.angleDeg += 360;
      state.t += boundedDt;
    }

    function effectiveAngle() {
      return state.useManual ? state.manualAngle : state.angleDeg;
    }

    function render() {
      var ang = effectiveAngle();
      var rad = ang * Math.PI / 180;
      var cosV = Math.cos(rad);
      var sinV = Math.sin(rad);
      var tanV = Math.tan(rad);
      var px = CX + R * cosV;
      var py = CY - R * sinV;

      elements.radiusLine.setAttribute("x2", px);
      elements.radiusLine.setAttribute("y2", py);
      elements.cosLine.setAttribute("x1", CX);
      elements.cosLine.setAttribute("y1", CY);
      elements.cosLine.setAttribute("x2", px);
      elements.cosLine.setAttribute("y2", CY);
      elements.sinLine.setAttribute("x1", px);
      elements.sinLine.setAttribute("y1", CY);
      elements.sinLine.setAttribute("x2", px);
      elements.sinLine.setAttribute("y2", py);

      elements.point.setAttribute("cx", px);
      elements.point.setAttribute("cy", py);
      elements.pointHalo.setAttribute("cx", px);
      elements.pointHalo.setAttribute("cy", py);

      var inTanZone = Math.abs(cosV) > 0.05;
      if (inTanZone) {
        var tanLen = R * tanV;
        var clampedLen = clamp(tanLen, -170, 170);
        elements.tanGuide.setAttribute("x1", TAN_X);
        elements.tanGuide.setAttribute("y1", CY);
        elements.tanGuide.setAttribute("x2", TAN_X);
        elements.tanGuide.setAttribute("y2", CY - clampedLen);
        elements.tanGuide.setAttribute("opacity", "0.35");
        elements.tanLine.setAttribute("x1", TAN_X);
        elements.tanLine.setAttribute("y1", CY);
        elements.tanLine.setAttribute("x2", TAN_X);
        elements.tanLine.setAttribute("y2", CY - clampedLen);
        elements.tanLine.setAttribute("opacity", "1");
      } else {
        elements.tanGuide.setAttribute("opacity", "0");
        elements.tanLine.setAttribute("opacity", "0");
      }

      elements.angleLabel.setAttribute("x", CX + 22);
      elements.angleLabel.setAttribute("y", CY - 12);
      elements.angleLabel.textContent = "θ = " + ang.toFixed(0) + "°";

      var absTan = Math.abs(tanV);
      var tanText = absTan > 999 ? ">999" : tanV.toFixed(3);
      elements.cosReadout.textContent = cosV.toFixed(3);
      elements.sinReadout.textContent = sinV.toFixed(3);
      elements.tanReadout.textContent = tanText;
      elements.angleReadout.textContent = ang.toFixed(0) + "°";
      elements.speedOutput.textContent = state.speed.toFixed(0) + "°/s";
      elements.angleOutput.textContent = ang.toFixed(0) + "°";

      var insightText;
      if (!state.running && state.t === 0 && !state.useManual) {
        insightText = "按\"开始\"让半径旋转。蓝色横线是 cos θ，金色竖线是 sin θ，它们随角度变化。";
      } else if (Math.abs(sinV) < 0.05 && Math.abs(cosV - 1) < 0.05) {
        insightText = "θ ≈ 0°：sin = 0，cos = 1，tan = 0。半径沿 x 轴方向。";
      } else if (Math.abs(sinV - 1) < 0.05) {
        insightText = "θ ≈ 90°：sin = 1，cos = 0，tan 趋向无穷。注意红色切线段变得很长。";
      } else if (Math.abs(sinV + 1) < 0.05) {
        insightText = "θ ≈ 270°：sin = -1，cos = 0，tan 趋向负无穷。";
      } else if (sinV > 0 && cosV > 0) {
        insightText = "第一象限：sin 与 cos 均为正，tan 也为正。";
      } else if (sinV > 0 && cosV < 0) {
        insightText = "第二象限：sin 为正，cos 为负，tan 为负。";
      } else if (sinV < 0 && cosV < 0) {
        insightText = "第三象限：sin 与 cos 均为负，tan 为正。";
      } else {
        insightText = "第四象限：sin 为负，cos 为正，tan 为负。";
      }
      elements.insight.textContent = insightText;
    }

    function setParameters(values) {
      var speedDef = parameterSchema[0];
      var angleDef = parameterSchema[1];
      var newSpeed = clamp(finite(Number(values.speed), speedDef.default), speedDef.min, speedDef.max);
      state.speed = newSpeed;
      if (values.angle !== undefined) {
        var newAngle = clamp(finite(Number(values.angle), angleDef.default), angleDef.min, angleDef.max);
        state.manualAngle = newAngle;
        state.useManual = true;
        state.running = false;
        elements.status.textContent = "手动模式";
        elements.startBtn.setAttribute("aria-pressed", "false");
        elements.angleInput.value = String(newAngle);
      }
      elements.speedInput.value = String(newSpeed);
      render();
    }

    function getState() {
      return {
        running: state.running,
        t: state.t,
        angleDeg: state.angleDeg,
        speed: state.speed,
        manualAngle: state.manualAngle,
        useManual: state.useManual
      };
    }

    function getReadouts() {
      var ang = effectiveAngle();
      var rad = ang * Math.PI / 180;
      return {
        angle: ang,
        cos: Math.cos(rad),
        sin: Math.sin(rad),
        tan: Math.tan(rad),
        speed: state.speed
      };
    }

    function runModelChecks() {
      var deg2rad = function (d) { return d * Math.PI / 180; };
      var approx = function (a, b, tol) { return Math.abs(a - b) < tol; };
      var results = [];
      results.push({
        name: "0° 基准",
        pass: approx(Math.cos(0), 1, 1e-12) && approx(Math.sin(0), 0, 1e-12) && approx(Math.tan(0), 0, 1e-12),
        expected: "cos=1, sin=0, tan=0",
        actual: "cos=" + Math.cos(0) + ", sin=" + Math.sin(0) + ", tan=" + Math.tan(0),
        tolerance: "1e-12"
      });
      results.push({
        name: "90° 基准",
        pass: approx(Math.sin(deg2rad(90)), 1, 1e-12) && approx(Math.cos(deg2rad(90)), 0, 1e-12),
        expected: "sin=1, cos=0",
        actual: "sin=" + Math.sin(deg2rad(90)) + ", cos=" + Math.cos(deg2rad(90)),
        tolerance: "1e-12"
      });
      results.push({
        name: "180° 基准",
        pass: approx(Math.cos(deg2rad(180)), -1, 1e-12) && approx(Math.sin(deg2rad(180)), 0, 1e-12),
        expected: "cos=-1, sin=0",
        actual: "cos=" + Math.cos(deg2rad(180)) + ", sin=" + Math.sin(deg2rad(180)),
        tolerance: "1e-12"
      });
      results.push({
        name: "270° 基准",
        pass: approx(Math.sin(deg2rad(270)), -1, 1e-12) && approx(Math.cos(deg2rad(270)), 0, 1e-12),
        expected: "sin=-1, cos=0",
        actual: "sin=" + Math.sin(deg2rad(270)) + ", cos=" + Math.cos(deg2rad(270)),
        tolerance: "1e-12"
      });
      results.push({
        name: "勾股恒等式 sin²+cos²=1",
        pass: approx(Math.sin(deg2rad(37)) * Math.sin(deg2rad(37)) + Math.cos(deg2rad(37)) * Math.cos(deg2rad(37)), 1, 1e-12),
        expected: 1,
        actual: Math.sin(deg2rad(37)) * Math.sin(deg2rad(37)) + Math.cos(deg2rad(37)) * Math.cos(deg2rad(37)),
        tolerance: "1e-12"
      });
      results.push({
        name: "tan = sin/cos",
        pass: approx(Math.tan(deg2rad(53)), Math.sin(deg2rad(53)) / Math.cos(deg2rad(53)), 1e-12),
        expected: Math.sin(deg2rad(53)) / Math.cos(deg2rad(53)),
        actual: Math.tan(deg2rad(53)),
        tolerance: "1e-12"
      });
      results.push({
        name: "奇偶性 sin(-θ)=-sin(θ)",
        pass: approx(Math.sin(deg2rad(-30)), -Math.sin(deg2rad(30)), 1e-12),
        expected: -Math.sin(deg2rad(30)),
        actual: Math.sin(deg2rad(-30)),
        tolerance: "1e-12"
      });
      results.push({
        name: "周期性 sin(θ+360)=sin(θ)",
        pass: approx(Math.sin(deg2rad(45 + 360)), Math.sin(deg2rad(45)), 1e-12),
        expected: Math.sin(deg2rad(45)),
        actual: Math.sin(deg2rad(45 + 360)),
        tolerance: "1e-12"
      });
      return results;
    }

    function bindControls() {
      elements.startBtn.addEventListener("click", start);
      elements.pauseBtn.addEventListener("click", pause);
      elements.resetBtn.addEventListener("click", reset);
      elements.speedInput.addEventListener("input", function () {
        setParameters({ speed: elements.speedInput.value, angle: state.useManual ? state.manualAngle : undefined });
      });
      elements.angleInput.addEventListener("input", function () {
        setParameters({ speed: state.speed, angle: elements.angleInput.value });
      });
    }

    function frame(timestamp) {
      if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
      var dt = (timestamp - state.lastTimestamp) / 1000;
      state.lastTimestamp = timestamp;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    window.simulation = {
      init: init,
      start: start,
      pause: pause,
      reset: reset,
      update: update,
      render: render,
      setParameters: setParameters,
      getState: getState,
      getReadouts: getReadouts,
      runModelChecks: runModelChecks
    };
    init();
  })();
  </script>
</body>
