<title>Gielis Superformula · 超级公式</title>
<style>
:root {
  color-scheme: dark;
  --sim-bg: #050810;
  --sim-surface: rgba(255,255,255,0.03);

    radial-gradient(ellipse 60% 50% at 50% 50%, rgba(77,217,255,0.04), transparent 70%),

  width: 100%;

}

  border-radius: 0 var(--sim-radius-sm) var(--sim-radius-sm) 0;
  background: rgba(245,185,66,0.08);
  color: #f5b942;
  font-size: 0.8rem;

}

  display: flex;
  align-items: center;
  gap: 22px;
  padding: 14px 24px;
  padding-bottom: max(14px, env(safe-area-inset-bottom, 0));
  background: linear-gradient(to top, rgba(5,8,16,0.96), rgba(5,8,16,0.7));
  border-top: 1px solid var(--sim-border);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  flex-wrap: wrap;
  justify-content: center;
}
.slider-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 120px;
  flex: 1 1 120px;

  display: flex;
  justify-content: space-between;

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;

}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;

  transform: scale(1.2);
  box-shadow: 0 0 0 6px rgba(77,217,255,0.2), 0 0 16px rgba(77,217,255,0.6);
}
input[type="range"]::-webkit-slider-thumb:active { cursor: grabbing; }
input[type="range"]::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border: none;
  border-radius: 50%;
  background: var(--sim-accent);
  cursor: grab;
  box-shadow: 0 0 0 4px rgba(77,217,255,0.15), 0 0 12px rgba(77,217,255,0.4);
}
.divider {
  width: 1px;
  height: 32px;

.btn-group { display: flex; gap: 8px; flex-shrink: 0; }
button {
  border: 1px solid var(--sim-border);
  border-radius: var(--sim-radius-sm);

  color: var(--sim-text);
  background: var(--sim-surface-soft);
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.02em;
  transition: all 0.2s ease;

}
button:hover {
  border-color: rgba(77,217,255,0.4);

  color: var(--sim-accent);
}
button.active {
  border-color: var(--sim-accent);

}
button.primary.active {
  background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent));
  color: #050810;
  border-color: var(--sim-accent);
  box-shadow: 0 0 20px rgba(77,217,255,0.4);
}
@media (max-width: 720px) {
  .controls { gap: 14px; padding: 12px 14px; }
  .slider-group { min-width: 90px; max-width: none; flex: 1 1 45%; }
  .divider { display: none; }
  .btn-group { width: 100%; justify-content: center; }
  button { padding: 8px 12px; font-size: 12px; }
  .evidence { top: 10px; right: 10px; }
  .metric { min-width: 100px; padding: 8px 12px; }
  .metric strong { font-size: 1rem; }

}
@media (max-width: 480px) {
  .slider-group { flex: 1 1 100%; }

}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<body>
<div class="app" data-layout="scene-first" data-model-tier="analytic">
  <header class="header" data-region="header">
    <div>
      <h1>Gielis Superformula · 超级公式</h1>
      <p>调节 m 与 n 参数，观察极径 r(θ) 如何从圆演化为星形、花瓣与多边形</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">已暂停</div>
  </header>

  <section class="stage" data-region="stage">
    <svg id="scene" viewBox="-1.4 -1.4 2.8 2.8" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Gielis 超级公式曲线">
      <defs>
        <radialGradient id="fillGrad" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0%" stop-color="#4dd9ff" stop-opacity="0.35"/>
          <stop offset="55%" stop-color="#2ba8d8" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#0a4a6e" stop-opacity="0.05"/>
        </radialGradient>
        <linearGradient id="strokeGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#7fe9ff"/>
          <stop offset="50%" stop-color="#4dd9ff"/>
          <stop offset="100%" stop-color="#1a9fd6"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="0.012" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <path id="curve" fill="url(#fillGrad)" stroke="url(#strokeGrad)" stroke-width="0.008" stroke-linejoin="round" filter="url(#glow)"/>
    </svg>
    <div id="hint" class="hint">拖动滑块改变形态 · 按 Auto 让 m 自动扫描</div>

    <aside class="evidence" data-region="evidence" aria-label="实时读数">
      <div class="metric"><small>参数 m</small><strong id="mReadout">6.0</strong></div>
      <div class="metric"><small>对称阶数</small><strong id="symReadout">6 阶</strong></div>
    </aside>

    <div class="insight" data-region="insight" id="insight">
      m 控制对称花瓣数；n₁ 决定整体缩放，n₂、n₃ 分别塑造尖角与圆弧。
    </div>
  </section>

  <section class="controls" data-region="controls" aria-label="参数控制">
    <div class="slider-group">
      <label class="slider-label" for="mInput"><span class="name">m</span><span class="value" id="mVal">6.0</span></label>
      <input id="mInput" type="range" min="0" max="20" step="0.1" value="6" aria-label="m 参数">
    </div>
    <div class="slider-group">
      <label class="slider-label" for="n1Input"><span class="name">n₁</span><span class="value" id="n1Val">1.0</span></label>
      <input id="n1Input" type="range" min="0.1" max="10" step="0.05" value="1" aria-label="n1 参数">
    </div>
    <div class="slider-group">
      <label class="slider-label" for="n2Input"><span class="name">n₂</span><span class="value" id="n2Val">1.0</span></label>
      <input id="n2Input" type="range" min="0.1" max="10" step="0.05" value="1" aria-label="n2 参数">
    </div>
    <div class="slider-group">
      <label class="slider-label" for="n3Input"><span class="name">n₃</span><span class="value" id="n3Val">8.0</span></label>
      <input id="n3Input" type="range" min="0.1" max="10" step="0.05" value="8" aria-label="n3 参数">
    </div>
    <div class="divider"></div>
    <div class="btn-group">
      <button id="modeBtn" type="button" aria-pressed="true">填充</button>
      <button id="autoBtn" type="button" class="primary" aria-pressed="false">Auto</button>
    </div>
  </section>
</div>
<script>
(() => {
  "use strict";
  const parameterSchema = [
    { key: "m",  label: "m",  type: "slider", min: 0,   max: 20, step: 0.1,  default: 6,   unit: "" },
    { key: "n1", label: "n1", type: "slider", min: 0.1, max: 10, step: 0.05, default: 1,   unit: "" },
    { key: "n2", label: "n2", type: "slider", min: 0.1, max: 10, step: 0.05, default: 1,   unit: "" },
    { key: "n3", label: "n3", type: "slider", min: 0.1, max: 10, step: 0.05, default: 8,   unit: "" }
  ];
  const state = {
    running: false,
    t: 0,
    m: 6, n1: 1, n2: 1, n3: 8,
    fillMode: true,
    autoScan: false,
    autoM: 0,
    autoDir: 1,
    lastTimestamp: null
  };
  const elements = {
    curve: document.getElementById("curve"),
    mInput: document.getElementById("mInput"), n1Input: document.getElementById("n1Input"),
    n2Input: document.getElementById("n2Input"), n3Input: document.getElementById("n3Input"),
    mVal: document.getElementById("mVal"), n1Val: document.getElementById("n1Val"),
    n2Val: document.getElementById("n2Val"), n3Val: document.getElementById("n3Val"),
    modeBtn: document.getElementById("modeBtn"), autoBtn: document.getElementById("autoBtn"),
    hint: document.getElementById("hint"),
    status: document.getElementById("status"),
    mReadout: document.getElementById("mReadout"),
    symReadout: document.getElementById("symReadout"),
    insight: document.getElementById("insight")
  };
  const N = 720;
  const TWO_PI = Math.PI * 2;
  const N_OVER_4 = N / 4;
  function clamp(v, mn, mx) { return Math.min(mx, Math.max(mn, v)); }
  function finite(v, fb) { return Number.isFinite(v) ? v : fb; }
  function superformula(theta, m, n1, n2, n3) {
    const phi = m * theta / 4;
    const c = Math.abs(Math.cos(phi));
    const s = Math.abs(Math.sin(phi));
    const base = Math.pow(c, n2) + Math.pow(s, n3);
    if (base <= 0) return 0;
    return Math.pow(base, -1 / n1);
  }
  function computePath(m, n1, n2, n3) {
    const pts = new Array(N + 1);
    for (let i = 0; i <= N; i++) {
      const theta = (i / N) * TWO_PI;
      let r = superformula(theta, m, n1, n2, n3);
      if (!Number.isFinite(r) || r > 100) r = 0;
      pts[i] = r * Math.cos(theta) + "," + r * Math.sin(theta);
    }
    return "M" + pts.join(" L") + " Z";
  }
  function init() {
    bindControls();
    setParameters({ m: 6, n1: 1, n2: 1, n3: 8 });
    render();
    requestAnimationFrame(frame);
    setTimeout(() => elements.hint.classList.add("show"), 400);
    setTimeout(() => elements.hint.classList.remove("show"), 5000);
  }
  function start() { state.running = true; elements.status.textContent = "运行中"; }
  function pause() { state.running = false; elements.status.textContent = "已暂停"; }
  function reset() {
    pause();
    state.t = 0;
    state.autoM = 0;
    state.autoDir = 1;
    setParameters({ m: 6, n1: 1, n2: 1, n3: 8 });
    setAutoScan(false);
    setFillMode(true);
    render();
  }
  function update(dt) {
    if (!state.running || !state.autoScan) return;
    const bdt = clamp(finite(dt, 0), 0, 0.05);
    state.t += bdt;
    const speed = 0.55;
    state.autoM += state.autoDir * speed * bdt;
    if (state.autoM >= 20) { state.autoM = 20; state.autoDir = -1; }
    if (state.autoM <= 0)  { state.autoM = 0;  state.autoDir = 1; }
    state.m = state.autoM;
    elements.mInput.value = String(state.m);
  }
  function render() {
    elements.curve.setAttribute("d", computePath(state.m, state.n1, state.n2, state.n3));
    elements.mVal.textContent = state.m.toFixed(1);
    elements.n1Val.textContent = state.n1.toFixed(2);
    elements.n2Val.textContent = state.n2.toFixed(2);
    elements.n3Val.textContent = state.n3.toFixed(2);
    elements.mReadout.textContent = state.m.toFixed(1);
    const sym = Math.round(state.m);
    elements.symReadout.textContent = sym + " 阶";
    if (state.fillMode) {
      elements.curve.setAttribute("fill", "url(#fillGrad)");
      elements.curve.setAttribute("stroke-opacity", "0.9");
      elements.modeBtn.textContent = "填充";
      elements.modeBtn.setAttribute("aria-pressed", "true");
    } else {
      elements.curve.setAttribute("fill", "none");
      elements.curve.setAttribute("stroke-opacity", "1");
      elements.modeBtn.textContent = "描边";
      elements.modeBtn.setAttribute("aria-pressed", "false");
    }
    if (state.autoScan) {
      elements.autoBtn.classList.add("active");
      elements.autoBtn.setAttribute("aria-pressed", "true");
    } else {
      elements.autoBtn.classList.remove("active");
      elements.autoBtn.setAttribute("aria-pressed", "false");
    }
    if (state.m < 0.1) {
      elements.insight.textContent = "m≈0：曲线退化为圆，所有方向极径相等。";
    } else if (state.n1 > 5) {
      elements.insight.textContent = "n₁ 较大：整体极径被压缩，曲线紧贴中心。";
    } else if (state.n2 < 0.5 && state.n3 > 5) {
      elements.insight.textContent = "n₂ 小、n₃ 大：形成尖锐星芒，角端被强烈拉伸。";
    } else if (Math.abs(state.n2 - state.n3) < 0.3) {
      elements.insight.textContent = "n₂≈n₃：形态趋于均匀对称的花瓣或圆角多边形。";
    } else {
      elements.insight.textContent = "m 控制对称花瓣数；n₁ 决定整体缩放，n₂、n₃ 分别塑造尖角与圆弧。";
    }
  }
  function setParameters(values) {
    const defs = { m: parameterSchema[0], n1: parameterSchema[1], n2: parameterSchema[2], n3: parameterSchema[3] };
    for (const key of Object.keys(defs)) {
      if (values[key] !== undefined) {
        const d = defs[key];
        state[key] = clamp(finite(Number(values[key]), d.default), d.min, d.max);
      }
    }
    if (values.m !== undefined) {
      state.autoM = state.m;
      state.autoDir = 1;
    }
    elements.mInput.value = String(state.m);
    elements.n1Input.value = String(state.n1);
    elements.n2Input.value = String(state.n2);
    elements.n3Input.value = String(state.n3);
    render();
  }
  function setFillMode(v) {
    state.fillMode = v;
    render();
  }
  function setAutoScan(v) {
    state.autoScan = v;
    if (v) { state.autoM = state.m; state.autoDir = 1; start(); }
    else { pause(); }
    render();
  }
  function getState() {
    return { ...state };
  }
  function getReadouts() {
    return { m: state.m, n1: state.n1, n2: state.n2, n3: state.n3, fillMode: state.fillMode, autoScan: state.autoScan };
  }
  function runModelChecks() {
    const circleR = superformula(0, 0, 1, 1, 1);
    const circleR2 = superformula(Math.PI / 3, 0, 1, 1, 1);
    const circleR3 = superformula(Math.PI, 0, 1, 1, 1);
    const r0 = superformula(0, 6, 1, 1, 8);
    const rPi = superformula(Math.PI, 6, 1, 1, 8);
    const rPi2 = superformula(Math.PI / 2, 6, 1, 1, 8);
    const rPi3 = superformula(3 * Math.PI / 2, 6, 1, 1, 8);
    const r3Pi2 = superformula(3 * Math.PI / 2, 6, 1, 1, 8);
    const r4Pi3 = superformula(4 * Math.PI / 3, 6, 1, 1, 8);
    return [
      { name: "m=0 produces unit circle (θ=0)", pass: Math.abs(circleR - 1) < 1e-9, expected: 1, actual: circleR, tolerance: 1e-9 },
      { name: "m=0 produces unit circle (θ=π/3)", pass: Math.abs(circleR2 - 1) < 1e-9, expected: 1, actual: circleR2, tolerance: 1e-9 },
      { name: "m=0 produces unit circle (θ=π)", pass: Math.abs(circleR3 - 1) < 1e-9, expected: 1, actual: circleR3, tolerance: 1e-9 },
      { name: "6-fold symmetry: r(0)=r(π)", pass: Math.abs(r0 - rPi) < 1e-9, expected: r0, actual: rPi, tolerance: 1e-9 },
      { name: "6-fold symmetry: r(π/2)=r(3π/2)", pass: Math.abs(rPi2 - r3Pi2) < 1e-9, expected: rPi2, actual: r3Pi2, tolerance: 1e-9 },
      { name: "6-fold symmetry: r(0)=r(4π/3)", pass: Math.abs(r0 - r4Pi3) < 1e-9, expected: r0, actual: r4Pi3, tolerance: 1e-9 },
      { name: "r is finite for default params", pass: Number.isFinite(r0) && r0 > 0, expected: "finite > 0", actual: r0, tolerance: "finite" },
      { name: "r is finite at θ=π/2", pass: Number.isFinite(rPi2), expected: "finite", actual: rPi2, tolerance: "finite" }
    ];
  }
  function bindControls() {
    elements.mInput.addEventListener("input", () => {
      if (state.autoScan) setAutoScan(false);
      setParameters({ m: elements.mInput.value });
    });
    elements.n1Input.addEventListener("input", () => setParameters({ n1: elements.n1Input.value }));
    elements.n2Input.addEventListener("input", () => setParameters({ n2: elements.n2Input.value }));
    elements.n3Input.addEventListener("input", () => setParameters({ n3: elements.n3Input.value }));
    elements.modeBtn.addEventListener("click", () => setFillMode(!state.fillMode));
    elements.autoBtn.addEventListener("click", () => setAutoScan(!state.autoScan));
  }
  function frame(timestamp) {
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    update(dt);
    if (state.running) render();
    requestAnimationFrame(frame);
  }
  window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks };
  init();
})();
</script>
</body>
</html>
