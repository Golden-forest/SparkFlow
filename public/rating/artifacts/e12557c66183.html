<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>磁感线与安培定则</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #eef3f8;
      --sim-surface: #ffffff;
      --sim-surface-soft: #f8fafc;
      --sim-text: #172033;
      --sim-muted: #657188;
      --sim-border: #dfe6ef;
      --sim-grid: #e8edf4;
      --sim-accent: #0f9fba;
      --sim-accent-deep: #08758a;
      --sim-accent-soft: #d9f4f7;
      --sim-positive: #0f9fba;
      --sim-warning: #f59e0b;
      --sim-danger: #dc2626;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
      /* Subject-specific semantic extensions (do not replace base tokens) */
      --sim-field: #22c8e6;
      --sim-field-bright: #8eeefb;
      --sim-current: #f6a821;
      --sim-current-bright: #ffd37a;
      --sim-pole-n: #ff7a59;
      --sim-pole-s: #7aa8ff;
      --sim-stage-hi: #16233d;
      --sim-stage-lo: #0a1120;
      --sim-wire: #cdd8e6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.12), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(245, 158, 11, 0.10), transparent 26%),
        var(--sim-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.32); outline-offset: 2px; }
    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 16px 20px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.6rem, 2.4vw, 2.1rem); letter-spacing: -0.035em; line-height: 1; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.9rem; }
    .status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 780; white-space: nowrap; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(310px, 0.66fr); gap: 12px; }
    .panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { min-height: 430px; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head span { color: var(--sim-muted); font-size: 0.75rem; }
    #scene {
      width: 100%; height: 100%; min-height: 350px; display: block;
      border: 1px solid #233457; border-radius: 18px;
      background: radial-gradient(120% 95% at 50% 28%, var(--sim-stage-hi) 0%, var(--sim-stage-lo) 76%);
      cursor: grab; touch-action: none; outline: none;
    }
    #scene:focus-visible { outline: 3px solid rgba(96, 205, 255, 0.55); outline-offset: 2px; }
    #scene.dragging { cursor: grabbing; }
    .side { min-height: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 12px; }
    .rule-card, .readouts, .model-note { padding: 16px 17px; }
    .rule-text { margin: 0 0 10px; line-height: 1.6; font-size: 0.92rem; }
    .rule-apply { margin: 0; padding: 10px 12px; border-left: 3px solid var(--sim-accent); border-radius: 0 10px 10px 0; background: var(--sim-accent-soft); color: #0b5a68; font-weight: 680; font-size: 0.88rem; line-height: 1.55; }
    .readout-grid { display: grid; grid-template-rows: repeat(2, auto); gap: 10px; }
    .metric { padding: 13px 14px; border: 1px solid rgba(15,159,186,.12); border-radius: 15px; background: linear-gradient(145deg, #f8fcfd, #f4f8fb); }
    .metric small { display: block; margin-bottom: 4px; color: var(--sim-muted); font-size: 0.74rem; }
    .metric strong { font-size: 1.3rem; letter-spacing: -.01em; line-height: 1.3; display: block; }
    .metric strong.sentence { font-size: 0.98rem; font-weight: 720; }
    .model-note { display: grid; align-content: start; gap: 12px; overflow: auto; }
    .model-note p { margin: 0; color: var(--sim-muted); line-height: 1.55; font-size: 0.85rem; }
    .insight { padding: 12px 14px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a !important; font-weight: 650; font-size: 0.9rem; line-height: 1.55; }
    .controls { padding: 11px 14px; display: grid; grid-template-columns: auto auto auto minmax(190px, 1fr); gap: 16px; align-items: center; border-radius: 17px; }
    .mode-group { display: flex; gap: 6px; padding: 4px; border: 1px solid var(--sim-border); border-radius: 13px; background: var(--sim-surface-soft); }
    .mode-btn { border: none; background: transparent; border-radius: 9px; padding: 8px 13px; font-weight: 720; color: var(--sim-muted); }
    .mode-btn:hover { background: #eef3f9; color: var(--sim-text); }
    .mode-btn[aria-pressed="true"] { background: var(--sim-accent-soft); color: var(--sim-accent-deep); box-shadow: inset 0 0 0 2px rgba(15,159,186,.35); }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 740; transition: transform .16s ease, background .16s ease, border-color .16s ease; }
    button:hover { border-color: #c7d2e2; background: #eef3f9; }
    button:active { transform: scale(.97); }
    button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
    button.primary:hover { background: linear-gradient(135deg, #0a8ba4, #12b4cf); }
    button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45); }
    .control label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--sim-accent); }
    /* ---- scene drawing ---- */
    .fline-halo { fill: none; stroke: rgba(34, 200, 230, 0.16); stroke-width: 6.5; stroke-linecap: round; stroke-linejoin: round; }
    .fline { fill: none; stroke: var(--sim-field); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 6; transition: stroke .3s ease; }
    .fline.closed { stroke: #2fd4f0; }
    #scene.pulse .fline { stroke: var(--sim-field-bright); }
    .farrow { fill: var(--sim-field-bright); stroke: rgba(10, 20, 40, 0.45); stroke-width: 0.6; }
    .wire-halo { fill: none; stroke: rgba(205, 216, 230, 0.20); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    .wire { fill: none; stroke: var(--sim-wire); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
    .iarrow { fill: var(--sim-current-bright); stroke: rgba(80, 45, 0, 0.4); stroke-width: 0.7; }
    .iparticle { fill: var(--sim-current-bright); stroke: rgba(40, 25, 0, 0.5); stroke-width: 1; }
    .ilabel { fill: var(--sim-current-bright); font-size: 19px; font-weight: 800; paint-order: stroke; stroke: rgba(10, 17, 32, 0.8); stroke-width: 3; }
    .pole-label { font-size: 21px; font-weight: 800; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: rgba(10, 17, 32, 0.85); stroke-width: 4; }
    .pole-chip { stroke-width: 1.4; }
    .baxis { stroke: var(--sim-field-bright); stroke-width: 3; stroke-linecap: round; }
    .baxis-label { fill: var(--sim-field-bright); font-size: 16px; font-weight: 800; paint-order: stroke; stroke: rgba(10, 17, 32, 0.8); stroke-width: 3; }
    #legend text { fill: #c9dcf0; font-size: 13px; }
    .lg-line { stroke: var(--sim-field); stroke-width: 3; stroke-dasharray: 8 5; }
    .lg-arrow { fill: var(--sim-field-bright); }
    .lg-dot { fill: var(--sim-current-bright); }
    .lg-box { fill: rgba(9, 15, 29, 0.72); stroke: rgba(122, 168, 255, 0.25); }
    @media (max-width: 880px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr 1fr; }
      .scene-panel { min-height: 0; }
      #scene { min-height: 0; height: auto; aspect-ratio: 880 / 560; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <!-- AppShell shell: header / stage / evidence / insight / controls -->
  <div class="app" data-layout="scene-first" data-model-tier="domain-solver">
    <header class="header" data-zone="header">
      <div>
        <h1>磁感线 · 安培定则</h1>
        <p>通电直导线、环形电流与螺线管的磁感线排布 —— 一键反转电流，看磁感线随之反向</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">运行中</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-zone="stage" aria-labelledby="stageTitle">
        <div class="panel-head">
          <h2 id="stageTitle">通电直导线的磁感线</h2>
          <span>拖动旋转视角 · 方向键微调 · 双击复位</span>
        </div>
        <svg id="scene" viewBox="0 0 880 560" aria-labelledby="stageTitle sceneDesc" tabindex="0">
          <desc id="sceneDesc">三维示意视图：青色带箭头的流动曲线为磁感线，琥珀色粒子表示导线中的电流方向。</desc>
          <defs>
            <clipPath id="stageClip"><rect x="2" y="2" width="876" height="556" rx="15"/></clipPath>
          </defs>
          <g id="world" clip-path="url(#stageClip)"></g>
          <g id="legend" transform="translate(674, 18)" aria-hidden="true">
            <rect class="lg-box" x="0" y="0" width="200" height="64" rx="10"/>
            <line class="lg-line" x1="12" y1="16" x2="56" y2="16"/>
            <path class="lg-arrow" d="M 66 16 l -10 -4.5 v 9 z"/>
            <text x="76" y="20.5">磁感线（B 方向）</text>
            <circle class="lg-dot" cx="17" cy="44" r="4"/>
            <text x="76" y="48.5">电流（I 方向）</text>
          </g>
        </svg>
      </section>

      <aside class="side" data-zone="evidence">
        <section class="panel rule-card" aria-label="安培定则">
          <div class="panel-head"><h2>安培定则（右手螺旋定则）</h2></div>
          <p id="ruleText" class="rule-text">用右手握住直导线，让拇指指向电流方向，其余四指弯曲的方向就是磁感线的环绕方向。</p>
          <p id="ruleApply" class="rule-apply">当前判定：—</p>
        </section>
        <section class="panel readouts" aria-label="实时读数">
          <div class="readout-grid">
            <div class="metric"><small>电流方向</small><strong id="currentReadout">—</strong></div>
            <div class="metric"><small>磁感线方向（由模型实时判定）</small><strong id="fieldReadout" class="sentence">—</strong></div>
          </div>
        </section>
        <section class="panel model-note" data-zone="insight" aria-label="观察要点">
          <p id="insight" class="insight">先看直导线：磁感线是一圈一圈的同心圆。点击「电流反向」试试。</p>
          <p>教学视图：本页磁感线由毕奥–萨伐尔定律逐点数值计算并追踪得到，方向严格遵循安培定则；线的疏密为示意，不代表精确的场强分布。</p>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-zone="controls" aria-label="仿真控制">
      <div class="mode-group" role="group" aria-label="电流模型选择">
        <button id="modeWire" class="mode-btn" type="button" aria-pressed="true">通电直导线</button>
        <button id="modeLoop" class="mode-btn" type="button" aria-pressed="false">环形电流</button>
        <button id="modeSol" class="mode-btn" type="button" aria-pressed="false">螺线管</button>
      </div>
      <button id="reverseBtn" class="primary" type="button" title="反转电流方向，观察磁感线整体反向">⇅ 电流反向</button>
      <div class="actions">
        <button id="startBtn" type="button">开始</button>
        <button id="pauseBtn" type="button">暂停</button>
        <button id="resetBtn" type="button">重置</button>
        <button id="viewBtn" type="button" title="恢复当前模型的默认视角">视角复位</button>
      </div>
      <div class="control">
        <label for="speedInput">动画速度（仅演示节奏） <output id="speedOutput">1.0×</output></label>
        <input id="speedInput" type="range" min="0.25" max="2.5" step="0.05" value="1">
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";

    /* ==================================================================
     * Physics kernel (DOM-free, deterministic)
     * Magnetostatics via Biot–Savart superposition of exact straight
     * current segments; field lines traced with RK4 on the unit-B field.
     * Scene unit: 1 cm. SI result in tesla. Current in amperes.
     * ================================================================== */
    const MU0 = 4 * Math.PI * 1e-7; // T·m/A
    const CM = 0.01;                // scene unit (cm) -> meter
    const BOX = 5.3;                // trace bounding half-size (cm)

    function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
    function dist3(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]); }

    // Exact field of one finite straight current segment at point p.
    // B = (mu0 I / 4pi) * (L x r1) / (l * d^2) * (t1/|r1| - t2/|r2|)
    function segmentB(p, a, b, current) {
      const ax = a[0] * CM, ay = a[1] * CM, az = a[2] * CM;
      const bx = b[0] * CM, by = b[1] * CM, bz = b[2] * CM;
      const px = p[0] * CM, py = p[1] * CM, pz = p[2] * CM;
      const lx = bx - ax, ly = by - ay, lz = bz - az;
      const l = Math.hypot(lx, ly, lz);
      if (l === 0) return [0, 0, 0];
      const r1x = px - ax, r1y = py - ay, r1z = pz - az;
      const r2x = px - bx, r2y = py - by, r2z = pz - bz;
      const r1 = Math.hypot(r1x, r1y, r1z), r2 = Math.hypot(r2x, r2y, r2z);
      if (r1 === 0 || r2 === 0) return [0, 0, 0];
      const ux = lx / l, uy = ly / l, uz = lz / l;
      const t1 = r1x * ux + r1y * uy + r1z * uz;
      const t2 = r2x * ux + r2y * uy + r2z * uz;
      let d2 = r1x * r1x + r1y * r1y + r1z * r1z - t1 * t1; // perp distance^2 (m^2)
      if (d2 < 1e-10) d2 = 1e-10; // guard: point nearly on the wire axis
      const cx = ly * r1z - lz * r1y;
      const cy = lz * r1x - lx * r1z;
      const cz = lx * r1y - ly * r1x;
      const factor = (MU0 * current / (4 * Math.PI)) * (t1 / r1 - t2 / r2) / (l * d2);
      return [cx * factor, cy * factor, cz * factor];
    }

    function fieldAt(segs, p, current) {
      let bx = 0, by = 0, bz = 0;
      for (let i = 0; i < segs.length; i += 1) {
        const s = segs[i];
        const b = segmentB(p, s[0], s[1], current);
        bx += b[0]; by += b[1]; bz += b[2];
      }
      return [bx, by, bz];
    }

    // Ring parametrization: seen from +y looking down, the path runs
    // counter-clockwise for increasing theta (right-hand rule => B on axis is +y).
    function ringPoint(R, th) { return [R * Math.cos(th), 0, -R * Math.sin(th)]; }
    function ringSegments(R, n) {
      const segs = [];
      let prev = ringPoint(R, 0);
      for (let i = 1; i <= n; i += 1) {
        const q = ringPoint(R, i * 2 * Math.PI / n);
        segs.push([prev, q]);
        prev = q;
      }
      return segs;
    }
    function ringPath(R, n) {
      const pts = [];
      for (let i = 0; i <= n; i += 1) pts.push(ringPoint(R, i * 2 * Math.PI / n));
      return pts;
    }
    // Helix with the same handedness: each turn CCW viewed from +y.
    function helixPoint(R, L, N, th) {
      return [R * Math.cos(th), -L / 2 + L * th / (2 * Math.PI * N), -R * Math.sin(th)];
    }

    const SOL = { R: 1.1, L: 4.4, N: 10, perTurn: 28 };

    const MODES = {
      wire: {
        key: "wire",
        title: "通电直导线的磁感线",
        rule: "用右手握住直导线，让拇指指向电流方向，其余四指弯曲的方向就是磁感线的环绕方向。",
        intro: "直导线周围，磁感线是一圈一圈垂直于导线的同心圆。点击「⇅ 电流反向」，看所有箭头同时掉头。",
        reversedNote: "电流已反向：每一条磁感线的箭头与流动方向都随之反转。",
        defaultView: { yaw: -0.62, pitch: 0.30 },
        segments: () => [[[0, -60, 0], [0, 60, 0]]], // long finite wire ~ infinite
        wirePath: () => [[0, -3.3, 0], [0, 3.3, 0]],
        seeds: () => {
          const s = [];
          for (const y of [-1.5, 0, 1.5]) for (const r of [0.9, 1.55, 2.35]) s.push([r, y, 0]);
          return s;
        },
        stepDist: (p) => Math.hypot(p[0], p[2])
      },
      loop: {
        key: "loop",
        title: "环形电流的磁感线",
        rule: "让右手四指沿环形电流的方向弯曲，拇指所指的就是环中心轴线上的磁场方向。",
        intro: "环形电流的磁感线从环内穿过、在环外绕回，形成闭合曲线；轴线上磁场与电流绕向成右手螺旋。",
        reversedNote: "电流已反向：轴线上的磁场指向立即反向，整条磁感线的方向都反了过来。",
        defaultView: { yaw: 0.55, pitch: 0.18 },
        segments: () => ringSegments(1.7, 72),
        wirePath: () => ringPath(1.7, 72),
        seeds: () => {
          const s = [[0, 0, 0]];
          for (const a of [0, 2.0944, 4.1888]) {
            const u = [Math.cos(a), 0, Math.sin(a)];
            for (const r of [0.75, 1.2, 2.3, 3.2]) s.push([r * u[0], 0, r * u[2]]);
          }
          return s;
        },
        stepDist: (p) => Math.hypot(Math.hypot(p[0], p[2]) - 1.7, p[1])
      },
      sol: {
        key: "sol",
        title: "螺线管的磁感线",
        rule: "让右手四指沿螺线管中电流的方向弯曲，拇指所指就是管内磁场的方向——那一端就是 N 极。",
        intro: "螺线管内部的磁感线近似平行于轴线，外部的分布与条形磁铁相似。反转电流后，N 极与 S 极对调。",
        reversedNote: "电流已反向：管内磁场反向，N 极与 S 极对调了。",
        defaultView: { yaw: 0.62, pitch: 0.24 },
        segments: () => {
          const segs = [];
          const total = SOL.N * SOL.perTurn;
          let prev = helixPoint(SOL.R, SOL.L, SOL.N, 0);
          for (let i = 1; i <= total; i += 1) {
            const q = helixPoint(SOL.R, SOL.L, SOL.N, i * 2 * Math.PI / SOL.perTurn);
            segs.push([prev, q]);
            prev = q;
          }
          return segs;
        },
        wirePath: () => {
          const pts = [];
          const total = SOL.N * SOL.perTurn;
          for (let i = 0; i <= total; i += 1) pts.push(helixPoint(SOL.R, SOL.L, SOL.N, i * 2 * Math.PI / SOL.perTurn));
          return pts;
        },
        seeds: () => {
          const s = [[0, 0, 0]];
          for (const a of [0, Math.PI]) {
            const u = [Math.cos(a), 0, Math.sin(a)];
            for (const r of [0.5, 0.9]) s.push([r * u[0], 0, r * u[2]]);
          }
          for (const a of [0, 2.0944, 4.1888]) {
            const u = [Math.cos(a), 0, Math.sin(a)];
            for (const r of [1.9, 2.75, 3.5]) s.push([r * u[0], 0, r * u[2]]);
          }
          return s;
        },
        stepDist: (p) => Math.max(Math.abs(Math.hypot(p[0], p[2]) - SOL.R), 0.05)
      }
    };

    function unitB(field, p, current) {
      const b = field(p, current);
      const m = Math.hypot(b[0], b[1], b[2]);
      if (!(m > 0) || !Number.isFinite(m)) return null;
      return [b[0] / m, b[1] / m, b[2] / m];
    }

    function rk4Step(field, p, h, current) {
      const k1 = unitB(field, p, current); if (!k1) return null;
      const k2 = unitB(field, [p[0] + h * 0.5 * k1[0], p[1] + h * 0.5 * k1[1], p[2] + h * 0.5 * k1[2]], current); if (!k2) return null;
      const k3 = unitB(field, [p[0] + h * 0.5 * k2[0], p[1] + h * 0.5 * k2[1], p[2] + h * 0.5 * k2[2]], current); if (!k3) return null;
      const k4 = unitB(field, [p[0] + h * k3[0], p[1] + h * k3[1], p[2] + h * k3[2]], current); if (!k4) return null;
      const q = [p[0] + h / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]),
                 p[1] + h / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]),
                 p[2] + h / 6 * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2])];
      if (!Number.isFinite(q[0] + q[1] + q[2])) return null;
      return q;
    }

    // Trace one field line through seed. Path points are ordered along B(+I);
    // the geometric curve is independent of current magnitude and sign.
    function traceStreamline(field, seed, stepDist, opts) {
      const hscale = opts && opts.hscale ? opts.hscale : 1;
      const maxSteps = (opts && opts.maxSteps) || 1500;
      const stepH = (p) => clamp(0.16 * stepDist(p) * hscale, 0.012 * hscale, 0.10 * hscale);
      let closureGap = Infinity;
      function run(dir) {
        const pts = [];
        let p = seed.slice();
        for (let i = 0; i < maxSteps; i += 1) {
          p = rk4Step(field, p, stepH(p) * dir, 1);
          if (!p) break;
          pts.push(p.slice());
          if (Math.max(Math.abs(p[0]), Math.abs(p[1]), Math.abs(p[2])) > BOX) break;
          if (pts.length > 8) {
            const g = dist3(p, seed);
            if (g < Math.max(0.12, 1.3 * stepH(p))) {
              closureGap = Math.min(closureGap, g);
              pts.push(seed.slice()); // close the ring exactly
              break;
            }
          }
        }
        return pts;
      }
      const fw = run(1);
      const bw = run(-1);
      return {
        points: bw.reverse().concat([seed.slice()], fw),
        closed: Number.isFinite(closureGap),
        closureGap: closureGap,
        seed: seed.slice()
      };
    }

    const traceCache = {};
    function getTrace(key) {
      if (!traceCache[key]) {
        const m = MODES[key];
        const segs = m.segments();
        const field = (p, current) => fieldAt(segs, p, current);
        const lines = m.seeds().map((seed) => traceStreamline(field, seed, m.stepDist, {}));
        const wire = m.wirePath();
        const cum = [0];
        for (let i = 1; i < wire.length; i += 1) cum.push(cum[i - 1] + dist3(wire[i - 1], wire[i]));
        traceCache[key] = { key: key, field: field, lines: lines, wire: wire, wireCum: cum, wireLen: cum[cum.length - 1] };
      }
      return traceCache[key];
    }

    // Direction conclusions derived from the computed field (never hand-written).
    function modeConclusions(key, sign) {
      const tr = getTrace(key);
      const s = sign > 0 ? 1 : -1;
      if (key === "wire") {
        const b = tr.field([1.2, 0, 0], s);
        const ccw = -b[2] > 0; // -Bz at +x means CCW seen from +y (against the current)
        return {
          current: s > 0 ? "沿导线向上" : "沿导线向下",
          currentShort: s > 0 ? "向上" : "向下",
          field: "从上向下看（迎着电流方向），磁感线为" + (ccw ? "逆" : "顺") + "时针"
        };
      }
      if (key === "loop") {
        const b = tr.field([0, 0, 0], s);
        const up = b[1] > 0;
        return {
          current: "从上向下看：" + (s > 0 ? "逆" : "顺") + "时针",
          currentShort: s > 0 ? "逆时针" : "顺时针",
          field: "环轴线上的磁场指向" + (up ? "上方" : "下方") + "，" + (up ? "上" : "下") + "侧相当于 N 极"
        };
      }
      const b = tr.field([0, 1.6, 0], s);
      const up = b[1] > 0;
      return {
        current: "各匝绕向（从上向下看）：" + (s > 0 ? "逆" : "顺") + "时针",
        currentShort: s > 0 ? "逆时针" : "顺时针",
        field: "管内磁场指向" + (up ? "上方" : "下方") + "：" + (up ? "上" : "下") + "端为 N 极"
      };
    }

    /* ---------------------- model checks (oracle cases) ---------------------- */
    function runModelChecks() {
      const out = [];
      const check = (name, pass, expected, actual, tolerance) =>
        out.push({ name: name, pass: !!pass, expected: String(expected), actual: String(actual), tolerance: tolerance });

      const tw = getTrace("wire");
      const tl = getTrace("loop");
      const ts = getTrace("sol");

      // 1. Ordinary: straight wire magnitude vs mu0 I / (2 pi r)
      const r1 = 1.0; // cm
      const b1 = tw.field([r1, 0, 0], 1);
      const m1 = Math.hypot(b1[0], b1[1], b1[2]);
      const e1 = MU0 / (2 * Math.PI * r1 * CM);
      check("直导线 |B| 与解析值 μ₀I/(2πr)（r=1 cm，I=1 A）",
        Math.abs(m1 - e1) / e1 < 1e-2, e1.toExponential(3) + " T", m1.toExponential(3) + " T", "相对误差 < 1%");

      // 2. Ordinary: 1/r inverse law
      const b2 = tw.field([2 * r1, 0, 0], 1);
      const m2 = Math.hypot(b2[0], b2[1], b2[2]);
      check("直导线 1/r 反比律：B(1 cm)/B(2 cm) = 2",
        Math.abs(m1 / m2 - 2) < 5e-3, "2", (m1 / m2).toFixed(5), "偏差 < 0.005");

      // 3. Ordinary: wire field direction (Ampère rule), I=+y => B(-z) at +x
      const b3 = tw.field([1.5, 0, 0], 1);
      const cos3 = -b3[2] / Math.hypot(b3[0], b3[1], b3[2]);
      check("直导线方向（安培定则）：+x 处 B ∥ −z",
        cos3 > 0.99996, "方向角 < 1°", "cosθ = " + cos3.toFixed(6), "cosθ > 0.99996");

      // 4. Ordinary: loop center magnitude vs mu0 I / (2R)
      const bl = tl.field([0, 0, 0], 1);
      const ml = Math.hypot(bl[0], bl[1], bl[2]);
      const el = MU0 / (2 * 1.7 * CM);
      check("环形电流中心 |B| 与解析值 μ₀I/(2R)（R=1.7 cm）",
        Math.abs(ml - el) / el < 5e-3, el.toExponential(3) + " T", ml.toExponential(3) + " T", "相对误差 < 0.5%");

      // 5. Ordinary: loop axis direction (right-hand rule)
      const cosl = bl[1] / ml;
      check("环形电流轴线方向：默认绕向（从上看逆时针）⇒ 中心 B ∥ +y",
        cosl > 0.99996, "方向角 < 1°", "cosθ = " + cosl.toFixed(6), "cosθ > 0.99996");

      // 6. Ordinary: solenoid center magnitude vs discrete stack of loops
      let es = 0;
      for (let k = 0; k < SOL.N; k += 1) {
        const yk = (-SOL.L / 2 + (k + 0.5) * SOL.L / SOL.N) * CM;
        const Rm = SOL.R * CM;
        es += MU0 * Rm * Rm / (2 * Math.pow(Rm * Rm + yk * yk, 1.5));
      }
      const bs = ts.field([0, 0, 0], 1);
      const ms = Math.hypot(bs[0], bs[1], bs[2]);
      check("螺线管中心 |B| 与同轴圆环叠加解析值（10 匝）",
        Math.abs(ms - es) / es < 3.5e-2, es.toExponential(3) + " T", ms.toExponential(3) + " T", "相对误差 < 3.5%");

      // 7. Boundary: solenoid interior uniformity at mid-plane
      const bo = ts.field([0.55, 0, 0], 1);
      const mo = Math.hypot(bo[0], bo[1], bo[2]);
      check("螺线管内部均匀性：|B(0.5R)| ≈ |B(0)|（管中部）",
        Math.abs(mo - ms) / ms < 8e-2, ms.toExponential(3) + " T", mo.toExponential(3) + " T", "相对差 < 8%");

      // 8. Opposite direction: exact antisymmetry B(-I) = -B(I)
      const samples = {
        wire: [[1.2, 0, 0], [0.8, 1.1, -0.6]],
        loop: [[0, 0.4, 0], [1.05, 0, 0], [0.6, -0.9, 0.4]],
        sol: [[0, 0, 0], [0.5, 0.9, 0.3], [0, 1.8, 0], [1.6, 0, 0]]
      };
      let worst = 0;
      for (const key of Object.keys(samples)) {
        const tr = getTrace(key);
        for (const p of samples[key]) {
          const bp = tr.field(p, 1);
          const bn = tr.field(p, -1);
          const mp = Math.hypot(bp[0], bp[1], bp[2]);
          const err = (Math.abs(bp[0] + bn[0]) + Math.abs(bp[1] + bn[1]) + Math.abs(bp[2] + bn[2])) / (mp + 1e-30);
          worst = Math.max(worst, err);
        }
      }
      check("电流反向 ⇒ 磁场处处严格反向（三种模型全部采样点）",
        worst < 1e-12, "0", worst.toExponential(2), "相对残差 < 1e-12");

      // 9. Opposite direction: N pole swaps ends
      const bTop1 = ts.field([0, 1.9, 0], 1)[1];
      const bTop2 = ts.field([0, 1.9, 0], -1)[1];
      check("电流反向 ⇒ 螺线管 N 极换端（上端口径内 B·y 变号）",
        bTop1 > 0 && bTop2 < 0 && Math.abs(Math.abs(bTop1 / bTop2) - 1) < 1e-9,
        "变号且等值", "B_y(+I)=" + bTop1.toExponential(2) + ", B_y(−I)=" + bTop2.toExponential(2), "严格变号");

      // 10. Boundary: traced wire circles close and stay circular
      let target = null;
      for (const ln of tw.lines) if (ln.seed[0] === 1.55 && ln.seed[1] === 0 && ln.seed[2] === 0) target = ln;
      let maxRad = 0, maxPlane = 0;
      for (const p of target.points) {
        maxRad = Math.max(maxRad, Math.abs(Math.hypot(p[0], p[2]) - 1.55));
        maxPlane = Math.max(maxPlane, Math.abs(p[1]));
      }
      check("场线追踪精度（直导线 r=1.55 cm 圆）：闭合且不漂移",
        target.closed && target.closureGap < 0.15 && maxRad < 0.01 && maxPlane < 0.005,
        "闭合, 径向偏差<0.01, 平面偏差<0.005",
        "闭合=" + target.closed + ", gap=" + target.closureGap.toFixed(4) + ", 径向=" + maxRad.toExponential(2) + ", 平面=" + maxPlane.toExponential(2),
        "gap<0.15, 径向<0.01");

      // 11. Step-halving convergence of the tracer
      const half = traceStreamline(tw.field, [1.55, 0, 0], MODES.wire.stepDist, { hscale: 0.5 });
      let maxRadH = 0;
      for (const p of half.points) maxRadH = Math.max(maxRadH, Math.abs(Math.hypot(p[0], p[2]) - 1.55));
      check("追踪步长减半收敛（h×0.5 重追踪同一圆）",
        half.closed && maxRadH <= maxRad + 0.002,
        "偏差不增大（容差 +0.002）", "全步=" + maxRad.toExponential(2) + ", 半步=" + maxRadH.toExponential(2) + ", 闭合=" + half.closed,
        "半步 ≤ 全步 + 0.002");

      // 12. UI direction conclusions follow the current reversal
      let allSwap = true, detail = [];
      for (const key of ["wire", "loop", "sol"]) {
        const cp = modeConclusions(key, 1);
        const cn = modeConclusions(key, -1);
        if (cp.field === cn.field || cp.current === cn.current) allSwap = false;
        detail.push(key + ": " + (cp.field !== cn.field));
      }
      const cw = modeConclusions("wire", 1).field;
      const cwN = modeConclusions("wire", -1).field;
      check("界面方向结论随电流反转（含教科书判定：向上电流 ⇒ 逆时针）",
        allSwap && cw.indexOf("逆时针") >= 0 && cwN.indexOf("顺时针") >= 0,
        "+I 逆时针 / −I 顺时针，三模型结论均反转", detail.join("; ") + "; wire(+I)=" + cw,
        "全部成立");

      return out;
    }

    /* ==================================================================
     * Page application (DOM branch) — projection, rendering, controls
     * ================================================================== */
    if (typeof document !== "undefined" && document.getElementById("scene")) {

      const parameterSchema = [
        { key: "speed", label: "动画速度", type: "slider", min: 0.25, max: 2.5, step: 0.05, default: 1, unit: "×" }
      ];

      const state = {
        mode: "wire",
        sign: 1,
        running: true,
        phase: 0,
        speed: 1,
        view: { yaw: MODES.wire.defaultView.yaw, pitch: MODES.wire.defaultView.pitch },
        lastTimestamp: null,
        dirty: true
      };

      const reducedMotion = typeof matchMedia !== "undefined" &&
        matchMedia("(prefers-reduced-motion: reduce)").matches;

      const elements = {
        status: document.getElementById("status"),
        stageTitle: document.getElementById("stageTitle"),
        world: document.getElementById("world"),
        scene: document.getElementById("scene"),
        ruleText: document.getElementById("ruleText"),
        ruleApply: document.getElementById("ruleApply"),
        currentReadout: document.getElementById("currentReadout"),
        fieldReadout: document.getElementById("fieldReadout"),
        insight: document.getElementById("insight"),
        modeWire: document.getElementById("modeWire"),
        modeLoop: document.getElementById("modeLoop"),
        modeSol: document.getElementById("modeSol"),
        reverseBtn: document.getElementById("reverseBtn"),
        startBtn: document.getElementById("startBtn"),
        pauseBtn: document.getElementById("pauseBtn"),
        resetBtn: document.getElementById("resetBtn"),
        viewBtn: document.getElementById("viewBtn"),
        speedInput: document.getElementById("speedInput"),
        speedOutput: document.getElementById("speedOutput")
      };

      // Perspective projection (turntable orbit camera)
      const CX = 440, CY = 276, K = 58, F = 30;
      function project(p) {
        const cy = Math.cos(state.view.yaw), sy = Math.sin(state.view.yaw);
        const cp = Math.cos(state.view.pitch), sp = Math.sin(state.view.pitch);
        const x1 = p[0] * cy + p[2] * sy;
        const z1 = -p[0] * sy + p[2] * cy;
        const y2 = p[1] * cp - z1 * sp;
        const z2 = p[1] * sp + z1 * cp;
        const s = F / (F - z2);
        return [CX + x1 * K * s, CY - y2 * K * s, z2];
      }

      function polylinePath(points) {
        // Build a screen-space path, skipping near-duplicate projected points.
        let d = "";
        let last = null;
        for (let i = 0; i < points.length; i += 1) {
          const q = project(points[i]);
          if (last && Math.abs(q[0] - last[0]) + Math.abs(q[1] - last[1]) < 1.6) continue;
          d += (d === "" ? "M" : " L") + q[0].toFixed(1) + " " + q[1].toFixed(1);
          last = q;
        }
        return d;
      }

      function arrowHead(x, y, tx, ty, size) {
        const tl = Math.hypot(tx, ty) || 1;
        const ux = tx / tl, uy = ty / tl;
        const nx = -uy, ny = ux;
        const tipX = x + ux * size, tipY = y + uy * size;
        const b1x = x - ux * size * 0.7 + nx * size * 0.62, b1y = y - uy * size * 0.7 + ny * size * 0.62;
        const b2x = x - ux * size * 0.7 - nx * size * 0.62, b2y = y - uy * size * 0.7 - ny * size * 0.62;
        return "M " + tipX.toFixed(1) + " " + tipY.toFixed(1) + " L " + b1x.toFixed(1) + " " + b1y.toFixed(1) +
          " L " + b2x.toFixed(1) + " " + b2y.toFixed(1) + " Z";
      }

      function fieldArrows(points) {
        // Place an arrow every ~1.15 cm of 3D arc length, tangent in screen space.
        const out = [];
        let acc = 0, prev = points[0], prevProj = project(points[0]);
        for (let i = 1; i < points.length - 1; i += 1) {
          const p = points[i];
          acc += dist3(prev, p);
          prev = p;
          if (acc >= 1.15) {
            acc = 0;
            const a = prevProj, b = project(points[i + 1]);
            const tx = (b[0] - a[0]) * state.sign, ty = (b[1] - a[1]) * state.sign;
            const m = project(p);
            out.push('<path class="farrow" d="' + arrowHead(m[0], m[1], tx, ty, 6.2) + '"></path>');
          }
          prevProj = project(p);
        }
        return out.join("");
      }

      function meanDepth(points) {
        let s = 0;
        const step = Math.max(1, Math.floor(points.length / 40));
        let n = 0;
        for (let i = 0; i < points.length; i += step) { s += project(points[i])[2]; n += 1; }
        return s / Math.max(1, n);
      }

      function wireCurrentArrows(key) {
        // Fixed arrows drawn on the conductor so direction is readable when paused.
        const out = [];
        function push(pos3, tan3) {
          const p = project(pos3);
          const a = project([pos3[0] - tan3[0] * 0.35, pos3[1] - tan3[1] * 0.35, pos3[2] - tan3[2] * 0.35]);
          const b = project([pos3[0] + tan3[0] * 0.35, pos3[1] + tan3[1] * 0.35, pos3[2] + tan3[2] * 0.35]);
          out.push('<path class="iarrow" d="' + arrowHead(p[0], p[1], (b[0] - a[0]) * state.sign, (b[1] - a[1]) * state.sign, 7.5) + '"></path>');
        }
        if (key === "wire") {
          const tip = state.sign > 0 ? [0, 3.3, 0] : [0, -3.3, 0];
          const t = [0, state.sign, 0];
          push(tip, t);
          out.push(wireEndLabel(tip, t));
        } else if (key === "loop") {
          for (const th of [0.5, 2.7, 4.9]) {
            const p = ringPoint(1.7, th);
            const t = [-Math.sin(th), 0, -Math.cos(th)];
            push(p, t);
          }
        } else {
          for (const k of [0.8, 3.3, 5.8]) {
            const th = k * 2 * Math.PI;
            const p = helixPoint(SOL.R, SOL.L, SOL.N, th);
            const t = [-Math.sin(th), SOL.L / (2 * Math.PI * SOL.N), -Math.cos(th)];
            push(p, t);
          }
        }
        return out.join("");
      }

      function wireEndLabel(tip, t) {
        const p = project(tip);
        const q = project([tip[0] + t[0] * 0.6, tip[1] + t[1] * 0.6, tip[2] + t[2] * 0.6]);
        const tx = q[0] - p[0], ty = q[1] - p[1];
        const m = Math.hypot(tx, ty) || 1;
        const lx = p[0] + (tx / m) * 26 - (ty / m) * 16;
        const ly = p[1] + (ty / m) * 26 + (tx / m) * 16;
        return '<text class="ilabel" x="' + lx.toFixed(1) + '" y="' + (ly + 6).toFixed(1) + '">I</text>';
      }

      function modeOverlays(key) {
        const out = [];
        const tr = getTrace(key);
        if (key === "loop") {
          // Axis arrow showing B on the axis, derived from the field itself.
          const b = tr.field([0, 0, 0], state.sign);
          const dir = b[1] > 0 ? 1 : -1;
          const a = project([0, -0.85 * dir, 0]);
          const c = project([0, 0.95 * dir, 0]);
          const dx = c[0] - a[0], dy = c[1] - a[1];
          const m = Math.hypot(dx, dy) || 1;
          out.push('<line class="baxis" x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + c[0].toFixed(1) + '" y2="' + c[1].toFixed(1) + '"></line>');
          out.push('<path class="farrow" d="' + arrowHead(c[0], c[1], dx / m, dy / m, 8) + '"></path>');
          const lx = c[0] + (dx / m) * 24, ly = c[1] + (dy / m) * 24;
          out.push('<text class="baxis-label" x="' + lx.toFixed(1) + '" y="' + (ly + 5).toFixed(1) + '">B</text>');
          const nSide = dir > 0 ? 1 : -1;
          out.push(poleChip([0, 1.75 * nSide, 0], "N", "var(--sim-pole-n)"));
          out.push(poleChip([0, -1.75 * nSide, 0], "S", "var(--sim-pole-s)"));
        }
        if (key === "sol") {
          const b = tr.field([0, 1.6, 0], state.sign);
          const topIsN = b[1] > 0;
          out.push(poleChip([0, 2.78, 0], topIsN ? "N" : "S", topIsN ? "var(--sim-pole-n)" : "var(--sim-pole-s)"));
          out.push(poleChip([0, -2.78, 0], topIsN ? "S" : "N", topIsN ? "var(--sim-pole-s)" : "var(--sim-pole-n)"));
        }
        return out.join("");
      }

      function poleChip(pos3, letter, color) {
        const p = project(pos3);
        return '<circle class="pole-chip" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="15" style="fill: rgba(10,17,32,.68); stroke: ' + color + ';"></circle>' +
          '<text class="pole-label" x="' + p[0].toFixed(1) + '" y="' + p[1].toFixed(1) + '" style="fill: ' + color + ';">' + letter + '</text>';
      }

      let lineEls = [];
      let particleEls = [];

      function rebuild() {
        const tr = getTrace(state.mode);
        const parts = [];
        const items = tr.lines.map((line) => ({ line: line, depth: meanDepth(line.points) }))
          .sort((a, b) => a.depth - b.depth); // far first
        for (const it of items) {
          const d = polylinePath(it.line.points);
          parts.push('<path class="fline-halo" d="' + d + '"></path>');
          parts.push('<path class="fline' + (it.line.closed ? " closed" : "") + '" d="' + d + '"></path>');
          parts.push(fieldArrows(it.line.points));
        }
        parts.push(modeOverlays(state.mode));
        const wd = polylinePath(tr.wire);
        parts.push('<path class="wire-halo" d="' + wd + '"></path>');
        parts.push('<path class="wire" d="' + wd + '"></path>');
        parts.push(wireCurrentArrows(state.mode));
        // Current particles (positions updated per frame)
        const count = Math.max(2, Math.floor(tr.wireLen / 0.55));
        for (let i = 0; i < count; i += 1) {
          parts.push('<circle class="iparticle" r="3.2" cx="-99" cy="-99"></circle>');
        }
        elements.world.innerHTML = parts.join("");
        lineEls = Array.prototype.slice.call(elements.world.querySelectorAll(".fline"));
        particleEls = Array.prototype.slice.call(elements.world.querySelectorAll(".iparticle"));
        updateParticles();
        updateFlow();
      }

      function pointAtArc(tr, arc) {
        const wire = tr.wire, cum = tr.wireCum;
        let s = ((arc % tr.wireLen) + tr.wireLen) % tr.wireLen;
        let lo = 0, hi = cum.length - 1;
        while (lo < hi - 1) {
          const mid = (lo + hi) >> 1;
          if (cum[mid] <= s) lo = mid; else hi = mid;
        }
        const segLen = cum[hi] - cum[lo] || 1;
        const f = (s - cum[lo]) / segLen;
        const a = wire[lo], b = wire[hi];
        return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
      }

      function updateParticles() {
        const tr = getTrace(state.mode);
        const spacing = 0.55;
        const off = ((state.phase * 0.9 * state.sign) % spacing + spacing) % spacing;
        for (let i = 0; i < particleEls.length; i += 1) {
          const p = project(pointAtArc(tr, i * spacing + off));
          particleEls[i].setAttribute("cx", p[0].toFixed(1));
          particleEls[i].setAttribute("cy", p[1].toFixed(1));
        }
      }

      function updateFlow() {
        if (reducedMotion) return;
        const offset = ((state.phase * 28 * state.sign) % 13 + 13) % 13;
        for (let i = 0; i < lineEls.length; i += 1) {
          lineEls[i].style.strokeDashoffset = (-offset).toFixed(2) + "px";
        }
      }

      function updateText() {
        const m = MODES[state.mode];
        const c = modeConclusions(state.mode, state.sign);
        elements.status.textContent = (state.running ? "运行中" : "已暂停") + " · 电流方向：" + c.currentShort;
        elements.stageTitle.textContent = m.title;
        elements.ruleText.textContent = m.rule;
        elements.ruleApply.textContent = "当前判定：电流" + c.current + "；" + c.field + "。";
        elements.currentReadout.textContent = c.current;
        elements.fieldReadout.textContent = c.field;
        elements.speedOutput.textContent = state.speed.toFixed(1) + "×";
        elements.modeWire.setAttribute("aria-pressed", String(state.mode === "wire"));
        elements.modeLoop.setAttribute("aria-pressed", String(state.mode === "loop"));
        elements.modeSol.setAttribute("aria-pressed", String(state.mode === "sol"));
        elements.startBtn.setAttribute("aria-pressed", String(state.running));
      }

      /* ------------------------------ lifecycle ------------------------------ */
      function init() {
        bindControls();
        setParameters({ speed: 1 });
        updateText();
        requestAnimationFrame(frame);
      }
      function start() {
        state.running = true;
        elements.insight.textContent = MODES[state.mode].intro;
        updateText();
      }
      function pause() {
        state.running = false;
        elements.insight.textContent = "已暂停：流动与电流粒子停止，箭头仍标示磁感线方向。";
        updateText();
      }
      function reset() {
        pause();
        state.sign = 1;
        state.phase = 0;
        resetView();
        elements.insight.textContent = MODES[state.mode].intro;
        state.dirty = true;
        updateText();
      }
      function resetView() {
        const dv = MODES[state.mode].defaultView;
        state.view.yaw = dv.yaw;
        state.view.pitch = dv.pitch;
        state.dirty = true;
      }
      function setMode(key) {
        state.mode = key;
        state.phase = 0;
        resetView();
        elements.insight.textContent = MODES[key].intro;
        state.dirty = true;
        updateText();
      }
      function reverseCurrent() {
        state.sign = -state.sign;
        elements.insight.textContent = MODES[state.mode].reversedNote;
        state.dirty = true;
        updateText();
        if (!reducedMotion) {
          elements.scene.classList.add("pulse");
          setTimeout(() => elements.scene.classList.remove("pulse"), 650);
        }
      }
      function update(dt) {
        if (!state.running || reducedMotion) return;
        const bounded = clamp(Number.isFinite(dt) ? dt : 0, 0, 0.05);
        state.phase += bounded * state.speed;
      }
      function render() {
        if (state.dirty) {
          rebuild();
          state.dirty = false;
        } else {
          updateParticles();
          updateFlow();
        }
      }
      function setParameters(values) {
        const def = parameterSchema[0];
        state.speed = clamp(Number(values && values.speed !== undefined ? values.speed : def.default), def.min, def.max);
        elements.speedInput.value = String(state.speed);
        updateText();
      }
      function getState() {
        return {
          mode: state.mode, sign: state.sign, running: state.running,
          phase: state.phase, speed: state.speed,
          view: { yaw: state.view.yaw, pitch: state.view.pitch },
          lineCount: getTrace(state.mode).lines.length
        };
      }
      function getReadouts() {
        const c = modeConclusions(state.mode, state.sign);
        return { mode: state.mode, currentDirection: c.current, fieldConclusion: c.field, running: state.running };
      }

      /* ------------------------------ interaction ------------------------------ */
      function bindControls() {
        elements.modeWire.addEventListener("click", () => setMode("wire"));
        elements.modeLoop.addEventListener("click", () => setMode("loop"));
        elements.modeSol.addEventListener("click", () => setMode("sol"));
        elements.reverseBtn.addEventListener("click", reverseCurrent);
        elements.startBtn.addEventListener("click", start);
        elements.pauseBtn.addEventListener("click", pause);
        elements.resetBtn.addEventListener("click", reset);
        elements.viewBtn.addEventListener("click", resetView);
        elements.speedInput.addEventListener("input", () => setParameters({ speed: elements.speedInput.value }));

        const svg = elements.scene;
        let dragging = false, lastX = 0, lastY = 0;
        svg.addEventListener("pointerdown", (e) => {
          dragging = true; lastX = e.clientX; lastY = e.clientY;
          svg.setPointerCapture(e.pointerId);
          svg.classList.add("dragging");
        });
        svg.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          state.view.yaw += (e.clientX - lastX) * 0.008;
          state.view.pitch = clamp(state.view.pitch + (e.clientY - lastY) * 0.006, -1.35, 1.35);
          lastX = e.clientX; lastY = e.clientY;
          state.dirty = true;
        });
        function endDrag(e) {
          dragging = false;
          svg.classList.remove("dragging");
          if (e.pointerId !== undefined) { try { svg.releasePointerCapture(e.pointerId); } catch (err) { /* already released */ } }
        }
        svg.addEventListener("pointerup", endDrag);
        svg.addEventListener("pointercancel", endDrag);
        svg.addEventListener("dblclick", resetView);
        svg.addEventListener("keydown", (e) => {
          const k = e.key;
          if (k === "ArrowLeft") { state.view.yaw -= 0.12; state.dirty = true; }
          else if (k === "ArrowRight") { state.view.yaw += 0.12; state.dirty = true; }
          else if (k === "ArrowUp") { state.view.pitch = clamp(state.view.pitch + 0.09, -1.35, 1.35); state.dirty = true; }
          else if (k === "ArrowDown") { state.view.pitch = clamp(state.view.pitch - 0.09, -1.35, 1.35); state.dirty = true; }
          else if (k === "Home" || k === "0") { resetView(); }
          else return;
          e.preventDefault();
        });
      }

      function frame(timestamp) {
        if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
        const dt = (timestamp - state.lastTimestamp) / 1000;
        state.lastTimestamp = timestamp;
        update(dt);
        render();
        requestAnimationFrame(frame);
      }

      window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks, setMode, reverseCurrent };
      init();
    }

    // Headless exposure for deterministic validation without a browser.
    if (typeof globalThis !== "undefined") {
      globalThis.simKernel = { runModelChecks, modeConclusions, getTrace, MODES, fieldAt, traceStreamline };
    }
  })();
  </script>
</body>
</html>
