<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点电荷电场叠加演示</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0f14;color:#dbe2ea;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    user-select:none}
  #app{display:flex;height:100%}
  #canvasWrap{flex:1;position:relative;min-width:0}
  canvas{position:absolute;inset:0;display:block;cursor:crosshair;touch-action:none}
  #hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:#9fb0c0;
    pointer-events:none;background:rgba(0,0,0,.4);padding:3px 10px;border-radius:8px}
  #panel{width:322px;background:#11161d;border-left:1px solid #222b36;padding:14px;overflow-y:auto}
  h1{font-size:16px;margin:0 0 10px}
  .presets{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
  button{background:#1d2733;color:#dbe2ea;border:1px solid #2e3b4c;border-radius:6px;
    padding:5px 10px;font-size:12px;cursor:pointer}
  button:hover{background:#28374b}
  .sec{font-size:12px;color:#8b98a5;margin:14px 0 6px;display:flex;
    justify-content:space-between;align-items:center}
  .chargeItem{background:#151c25;border:1px solid #232e3c;border-radius:8px;padding:8px;margin-bottom:8px}
  .ciTop{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:6px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;margin-right:2px}
  .qv{margin-left:auto;color:#9fb0c0;font-size:12px}
  .del{padding:0 7px;border:none;background:none;color:#8b98a5;font-size:15px}
  .del:hover{color:#ff8a80}
  input[type=range]{width:100%;accent-color:#4d9fff}
  input[type=number]{width:64px;background:#0e141b;color:#dbe2ea;border:1px solid #2a3646;
    border-radius:4px;padding:3px 5px;font-size:12px}
  .ciRow{display:flex;gap:6px;align-items:center;font-size:12px;color:#8b98a5;margin-top:6px;flex-wrap:wrap}
  label.ck{display:flex;gap:6px;font-size:12px;color:#c3ceda;align-items:center;margin:5px 0}
  #readout table{width:100%;border-collapse:collapse;font-size:12px;margin-top:2px}
  #readout th,#readout td{padding:3px 4px;text-align:right;border-bottom:1px solid #1c2530}
  #readout th:first-child,#readout td:first-child{text-align:left}
  #readout .tot td{color:#ffd54f;font-weight:600;border-top:1px solid #2e3b4c}
  #readout .extra{font-size:11px;color:#8b98a5;margin-top:6px;line-height:1.7}
  @media(max-width:820px){
    #app{flex-direction:column}
    #canvasWrap{height:54vh;flex:none}
    #panel{width:auto;flex:1;border-left:none;border-top:1px solid #222b36}
  }
</style>
</head>
<body>
<div id="app">
  <div id="canvasWrap">
    <canvas id="cv"></canvas>
    <div id="hint">拖动电荷或探针 P · 点击空白处可移动探针</div>
  </div>
  <div id="panel">
    <h1>⚡ 点电荷电场叠加演示</h1>
    <div class="presets">
      <button data-p="dipole">等量异号</button>
      <button data-p="same">等量同号</button>
      <button data-p="single">单个电荷</button>
    </div>

    <div class="sec"><span>电荷（画布上可直接拖动）</span><button id="addQ">＋ 添加</button></div>
    <div id="chargeList"></div>

    <div class="sec"><span>探针位置（米）</span></div>
    <div class="ciRow">X <input id="probeX" type="number" step="0.1">　Y <input id="probeY" type="number" step="0.1"></div>

    <div class="sec"><span>显示选项</span></div>
    <label class="ck"><input type="checkbox" id="ckLines">电场线</label>
    <label class="ck"><input type="checkbox" id="ckVec">分矢量 + 矢量和（平行四边形法则）</label>
    <label class="ck"><input type="checkbox" id="ckGrid">网格与坐标轴</label>
    <div class="ciRow">电场线密度 <input type="range" id="density" min="3" max="16" step="1" style="width:110px"></div>

    <div class="sec"><span>探针 P 处的场强（单位 V/m）</span></div>
    <div id="readout"></div>
  </div>
</div>

<script>
'use strict';
/* ============ 常量与画布 ============ */
const K = 8.987551787e9;              // 库仑常数，N·m²/C²
const cv   = document.getElementById('cv');
const ctx  = cv.getContext('2d');
const wrap = document.getElementById('canvasWrap');
const WORLD_W = 8;                    // 画布横向可视宽度，米
let W=0, H=0, ppm=80, worldH=5;

/* ============ 状态 ============ */
const PALETTE = ['#ff8a5c','#4dd0e1','#c792ea','#a5d66a','#ffcb6b','#f06292','#90a4ae','#b39ddb'];
let charges = [];                     // [{x, y, q}]，q 单位 nC，坐标单位米
let probe   = {x:0, y:1};
let opts = {lines:true, vec:true, grid:true, density:8};
let lineCache = [];
let dirty = true;
let vecScale = 1;                     // 当前箭头标度：像素 / (V/m)

/* ============ 坐标换算 ============ */
const px = x => W/2 + x*ppm;          // 世界 → 画布
const py = y => H/2 - y*ppm;
const wx = X => (X - W/2)/ppm;        // 画布 → 世界
const wy = Y => (H/2 - Y)/ppm;
const clampX = v => Math.max(-WORLD_W/2+0.2, Math.min(WORLD_W/2-0.2, v));
const clampY = v => Math.max(-worldH/2+0.2, Math.min(worldH/2-0.2, v));
const SUBS = '₀₁₂₃₄₅₆₇₈₉';
const sub  = n => String(n).split('').map(d=>SUBS[+d]).join('');
const hexA = (hex,a)=>{const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;};

function fmt(v){
  const a=Math.abs(v);
  if(a>=1e4||(a>0&&a<0.01)) return v.toExponential(2);
  if(a>=100) return v.toFixed(0);
  if(a>=10)  return v.toFixed(1);
  return v.toFixed(2);
}

/* ============ 电场计算 ============ */
function eSingle(c,x,y){                       // 单个电荷在 (x,y) 的场强
  let dx=x-c.x, dy=y-c.y, r=Math.hypot(dx,dy);
  if(r<1e-9){dx=1;dy=0;r=1;}
  const ux=dx/r, uy=dy/r;
  const rr=Math.max(r,0.03);                   // 探针贴住电荷时不发散
  const e=K*c.q*1e-9/(rr*rr);                  // V/m
  return {ex:e*ux, ey:e*uy, mag:Math.abs(e), r};
}
function dirAt(x,y){                           // 归一化场强方向（电场线积分用）
  let ex=0,ey=0;
  for(const c of charges){const f=eSingle(c,x,y); ex+=f.ex; ey+=f.ey;}
  const m=Math.hypot(ex,ey);
  return m<1e-12?null:{x:ex/m,y:ey/m};
}

/* ============ 电场线追踪（RK2 中点法） ============ */
function traceLines(){
  lineCache=[];
  const eps=1e-6, sources=[];
  const pos=charges.filter(c=>c.q>eps);
  const Q=pos.reduce((s,c)=>s+c.q,0);
  if(Q>eps){                                            // 从正电荷正向发出
    const total=Math.min(100,Math.max(10,Math.round(Q*opts.density)));
    for(const c of pos) sources.push({c,n:Math.max(3,Math.round(c.q/Q*total)),fwd:1});
  }else{                                                // 只有负电荷：反向追踪
    const neg=charges.filter(c=>c.q<-eps);
    const Qn=-neg.reduce((s,c)=>s+c.q,0);
    if(Qn<=eps) return;
    const total=Math.min(100,Math.max(10,Math.round(Qn*opts.density)));
    for(const c of neg) sources.push({c,n:Math.max(3,Math.round(-c.q/Qn*total)),fwd:-1});
  }
  const h=2.2/ppm, R=0.06, TERM=0.05;
  for(const s of sources){
    for(let k=0;k<s.n;k++){
      const a=(k+0.5)/s.n*2*Math.PI + charges.indexOf(s.c)*0.3;
      let x=s.c.x+R*Math.cos(a), y=s.c.y+R*Math.sin(a);
      const pts=[[x,y]], arrows=[];
      for(let step=0;step<3000;step++){
        const d1=dirAt(x,y); if(!d1)break;
        const d2=dirAt(x+d1.x*h*0.5*s.fwd, y+d1.y*h*0.5*s.fwd); if(!d2)break;
        x+=d2.x*h*s.fwd; y+=d2.y*h*s.fwd;
        pts.push([x,y]);
        if(step%64===40) arrows.push([x,y,d2.x,d2.y]);   // 箭头沿场方向
        if(Math.abs(x)>WORLD_W/2+0.8||Math.abs(y)>worldH/2+0.8)break;
        let hit=false;
        for(const c of charges) if(Math.hypot(x-c.x,y-c.y)<TERM){hit=true;break;}
        if(hit)break;
      }
      lineCache.push({pts,arrows});
    }
  }
}

/* ============ 绘图 ============ */
function drawBackground(){
  ctx.fillStyle='#0b0f14'; ctx.fillRect(0,0,W,H);
  if(!opts.grid)return;
  const xm=Math.ceil(WORLD_W/2), ym=Math.ceil(worldH/2);
  ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=1;
  ctx.beginPath();
  for(let i=-xm;i<=xm;i++){ctx.moveTo(px(i),0);ctx.lineTo(px(i),H);}
  for(let j=-ym;j<=ym;j++){ctx.moveTo(0,py(j));ctx.lineTo(W,py(j));}
  ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.18)';
  ctx.beginPath();ctx.moveTo(0,py(0));ctx.lineTo(W,py(0));
  ctx.moveTo(px(0),0);ctx.lineTo(px(0),H);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.28)'; ctx.font='11px system-ui';
  for(let i=-xm;i<=xm;i++) if(i) ctx.fillText(i+'m',px(i)+3,py(0)+13);
  for(let j=-ym;j<=ym;j++) if(j) ctx.fillText(j+'m',px(0)+5,py(j)-4);
  ctx.fillText('0',px(0)+5,py(0)+13);
}

function headPx(X,Y,dx,dy,s,fill){
  const pX=-dy,pY=dx;
  ctx.beginPath();
  ctx.moveTo(X,Y);
  ctx.lineTo(X-dx*s+pX*s*0.5, Y-dy*s+pY*s*0.5);
  ctx.lineTo(X-dx*s-pX*s*0.5, Y-dy*s-pY*s*0.5);
  ctx.closePath();
  ctx.fillStyle=fill; ctx.fill();
}

function drawLines(){
  ctx.strokeStyle='rgba(112,158,255,0.42)'; ctx.lineWidth=1.2;
  for(const L of lineCache){
    ctx.beginPath();
    ctx.moveTo(px(L.pts[0][0]),py(L.pts[0][1]));
    for(let i=1;i<L.pts.length;i++) ctx.lineTo(px(L.pts[i][0]),py(L.pts[i][1]));
    ctx.stroke();
  }
  for(const L of lineCache)
    for(const a of L.arrows) headPx(px(a[0]),py(a[1]),a[2],a[3],5,'rgba(112,158,255,0.55)');
}

function drawArrow(X1,Y1,X2,Y2,color,w,hs){
  const dx=X2-X1,dy=Y2-Y1,len=Math.hypot(dx,dy);
  if(len<2)return len;
  const ux=dx/len,uy=dy/len;
  ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(X1,Y1);ctx.lineTo(X2-ux*hs*0.8,Y2-uy*hs*0.8);ctx.stroke();
  headPx(X2,Y2,ux,uy,hs,color);
  return len;
}

function label(text,X,Y,dirx,diry,color){
  const m=Math.hypot(dirx,diry)||1;
  const tx=X+dirx/m*16, ty=Y+diry/m*16;
  ctx.font='12px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  const w=ctx.measureText(text).width;
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(tx-w/2-3,ty-8,w+6,16);
  ctx.fillStyle=color;ctx.fillText(text,tx,ty);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
}

/* 探针：各分矢量 + 平行四边形逐次合成 + 合矢量 */
function drawProbe(){
  const fs=charges.map(c=>eSingle(c,probe.x,probe.y));
  let ex=0,ey=0; for(const f of fs){ex+=f.ex;ey+=f.ey;}
  const totMag=Math.hypot(ex,ey);
  const maxI=Math.max(1e-12,...fs.map(f=>f.mag));
  let S=110/maxI; if(totMag*S>240)S=240/totMag;   // 自适应标度，兼顾总量不超界
  vecScale=S;
  const ox=px(probe.x), oy=py(probe.y);

  if(opts.vec){
    /* --- 平行四边形虚线：逐次把 E(i) 与前面的部分和合成 --- */
    ctx.save(); ctx.setLineDash([5,4]); ctx.lineWidth=1;
    let ax=0,ay=0;
    for(let i=0;i<fs.length;i++){
      const pvx=ax,pvy=ay;
      ax+=fs[i].ex; ay+=fs[i].ey;
      if(i>0){
        ctx.strokeStyle='rgba(255,255,255,0.35)';   // 平行于部分和的边
        ctx.beginPath();
        ctx.moveTo(ox+fs[i].ex*S, oy-fs[i].ey*S);
        ctx.lineTo(ox+ax*S, oy-ay*S); ctx.stroke();
        ctx.strokeStyle=hexA(PALETTE[i%PALETTE.length],0.75); // 平移后的 E(i)
        ctx.beginPath();
        ctx.moveTo(ox+pvx*S, oy-pvy*S);
        ctx.lineTo(ox+ax*S, oy-ay*S); ctx.stroke();
      }
    }
    ctx.restore();

    /* --- 各电荷的单独贡献（共起点 P） --- */
    fs.forEach((f,i)=>{
      const col=PALETTE[i%PALETTE.length];
      const len=drawArrow(ox,oy,ox+f.ex*S,oy-f.ey*S,col,2,7);
      if(len>16) label('E'+sub(i+1)+' '+fmt(f.mag), ox+f.ex*S, oy-f.ey*S, f.ex, -f.ey, col);
    });

    /* --- 中间部分和（细虚线） --- */
    if(fs.length>1){
      let sx=0,sy=0;
      for(let i=0;i<fs.length-1;i++){
        sx+=fs[i].ex; sy+=fs[i].ey;
        drawArrow(ox,oy,ox+sx*S,oy-sy*S,'rgba(255,255,255,0.4)',1,5);
      }
    }

    /* --- 合场强 --- */
    drawArrow(ox,oy,ox+ex*S,oy-ey*S,'#ffd54f',3.2,9);
    if(fs.length) label('E合 '+fmt(totMag), ox+ex*S, oy-ey*S, ex, -ey, '#ffd54f');
  }

  /* 探针标记 */
  ctx.beginPath();ctx.arc(ox,oy,6,0,7);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(ox-11,oy);ctx.lineTo(ox+11,oy);
  ctx.moveTo(ox,oy-11);ctx.lineTo(ox,oy+11);
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';
  ctx.fillText('P',ox+9,oy-9);
}

function drawCharges(){
  charges.forEach((c,i)=>{
    const X=px(c.x),Y=py(c.y);
    const col=c.q>=0?'#ff6b6b':'#4d9fff';
    ctx.beginPath();ctx.arc(X,Y,16,0,7);            // 调色板色环 ↔ 分矢量颜色
    ctx.strokeStyle=PALETTE[i%PALETTE.length];ctx.lineWidth=2.5;ctx.stroke();
    ctx.beginPath();ctx.arc(X,Y,12,0,7);ctx.fillStyle=col;ctx.fill();
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold 15px system-ui';
    ctx.fillText(c.q>=0?'+':'−',X,Y+1);
    ctx.font='11px system-ui';ctx.fillStyle='rgba(255,255,255,0.65)';
    ctx.fillText((c.q>0?'+':'')+c.q.toFixed(1)+' nC',X,Y+30);
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
  });
}

function draw(){
  drawBackground();
  if(opts.lines) drawLines();
  drawProbe();
  drawCharges();
}

/* ============ 侧栏 ============ */
const chargeList=document.getElementById('chargeList');
const readout=document.getElementById('readout');
const probeX=document.getElementById('probeX'), probeY=document.getElementById('probeY');
let inputs=[];

function renderChargeList(){
  chargeList.innerHTML=''; inputs=[];
  charges.forEach((c,i)=>{
    const el=document.createElement('div'); el.className='chargeItem';
    el.innerHTML=`
      <div class="ciTop">
        <span class="dot" style="background:${PALETTE[i%PALETTE.length]}"></span>
        <span>电荷 ${i+1}</span>
        <span class="qv"></span>
        <button class="del" title="删除">×</button>
      </div>
      <input type="range" min="-5" max="5" step="0.1" value="${c.q}">
      <div class="ciRow">X <input class="cx" type="number" step="0.1" value="${c.x.toFixed(1)}">
        Y <input class="cy" type="number" step="0.1" value="${c.y.toFixed(1)}"></div>`;
    const qv=el.querySelector('.qv'), slider=el.querySelector('input[type=range]');
    const cxI=el.querySelector('.cx'), cyI=el.querySelector('.cy');
    const updQ=()=>{qv.textContent=(c.q>0?'+':'')+c.q.toFixed(1)+' nC';};
    slider.addEventListener('input',()=>{c.q=parseFloat(slider.value);updQ();dirty=true;});
    cxI.addEventListener('input',()=>{const v=parseFloat(cxI.value);
      if(isFinite(v)){c.x=clampX(v);dirty=true;}});
    cyI.addEventListener('input',()=>{const v=parseFloat(cyI.value);
      if(isFinite(v)){c.y=clampY(v);dirty=true;}});
    el.querySelector('.del').addEventListener('click',()=>{
      charges.splice(i,1); renderChargeList(); dirty=true;});
    updQ();
    inputs.push({cx:cxI,cy:cyI});
    chargeList.appendChild(el);
  });
}

function syncProbeInputs(){
  probeX.value=probe.x.toFixed(2); probeY.value=probe.y.toFixed(2);
}
probeX.addEventListener('input',()=>{const v=parseFloat(probeX.value);
  if(isFinite(v)){probe.x=clampX(v);dirty=true;}});
probeY.addEventListener('input',()=>{const v=parseFloat(probeY.value);
  if(isFinite(v)){probe.y=clampY(v);dirty=true;}});

[['ckLines','lines'],['ckVec','vec'],['ckGrid','grid']].forEach(([id,key])=>{
  const el=document.getElementById(id); el.checked=opts[key];
  el.addEventListener('change',()=>{opts[key]=el.checked;dirty=true;});
});
const dens=document.getElementById('density');
dens.value=opts.density;
dens.addEventListener('input',()=>{opts.density=parseFloat(dens.value);dirty=true;});

document.getElementById('addQ').addEventListener('click',()=>{
  const spots=[[0,0],[-2,-1.4],[2,-1.4],[-2,1.4],[2,1.4],[0,-2.2],[0,2.2]];
  const s=spots.find(p=>charges.every(c=>Math.hypot(c.x-p[0],c.y-p[1])>1))
        ||[Math.random()*4-2,Math.random()*2-1];
  charges.push({x:s[0],y:s[1],q:1});
  renderChargeList(); dirty=true;
});

function applyPreset(name){
  if(name==='dipole'){charges=[{x:-1,y:0,q:2},{x:1,y:0,q:-2}];probe={x:0,y:1};}
  if(name==='same')  {charges=[{x:-1,y:0,q:2},{x:1,y:0,q:2}]; probe={x:0,y:1};}
  if(name==='single'){charges=[{x:0,y:0,q:3}];                probe={x:1.2,y:1.2};}
  renderChargeList(); syncProbeInputs(); dirty=true;
}
document.querySelectorAll('.presets button')
  .forEach(b=>b.addEventListener('click',()=>applyPreset(b.dataset.p)));

function updateReadout(){
  const fs=charges.map(c=>eSingle(c,probe.x,probe.y));
  let ex=0,ey=0,V=0;
  fs.forEach((f,i)=>{ex+=f.ex;ey+=f.ey;V+=K*charges[i].q*1e-9/Math.max(f.r,0.03);});
  const mag=Math.hypot(ex,ey), ang=Math.atan2(ey,ex)*180/Math.PI;
  let h='<table><tr><th>来源</th><th>Ex</th><th>Ey</th><th>|E|</th></tr>';
  fs.forEach((f,i)=>{
    h+=`<tr><td><span class="dot" style="background:${PALETTE[i%PALETTE.length]}"></span>E${sub(i+1)}</td>`
      +`<td>${fmt(f.ex)}</td><td>${fmt(f.ey)}</td><td>${fmt(f.mag)}</td></tr>`;
  });
  h+=`<tr class="tot"><td>E合</td><td>${fmt(ex)}</td><td>${fmt(ey)}</td><td>${fmt(mag)}</td></tr></table>`;
  h+=`<div class="extra">合场强方向 θ = ${ang.toFixed(1)}°（自 +x 方向）<br>`
    +`电势 V(P) = ${fmt(V)} V<br>箭头标度：60 px ↔ ${fmt(60/vecScale)} V/m</div>`;
  readout.innerHTML=h;
}

/* ============ 鼠标 / 触摸交互 ============ */
let drag=null;
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  for(let i=charges.length-1;i>=0;i--){
    if(Math.hypot(mx-px(charges[i].x),my-py(charges[i].y))<18){
      drag={t:'c',i}; cv.setPointerCapture(e.pointerId); return;
    }
  }
  drag={t:'p'}; cv.setPointerCapture(e.pointerId);
  probe.x=clampX(wx(mx)); probe.y=clampY(wy(my));
  syncProbeInputs(); dirty=true;
});
cv.addEventListener('pointermove',e=>{
  const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  if(!drag){
    const over=charges.some(c=>Math.hypot(mx-px(c.x),my-py(c.y))<18)
             ||Math.hypot(mx-px(probe.x),my-py(probe.y))<16;
    cv.style.cursor=over?'grab':'crosshair'; return;
  }
  const x=clampX(wx(mx)), y=clampY(wy(my));
  if(drag.t==='c'){
    charges[drag.i].x=x; charges[drag.i].y=y;
    inputs[drag.i].cx.value=x.toFixed(1); inputs[drag.i].cy.value=y.toFixed(1);
  }else{
    probe.x=x; probe.y=y; syncProbeInputs();
  }
  dirty=true;
});
cv.addEventListener('pointerup',()=>drag=null);
cv.addEventListener('pointercancel',()=>drag=null);

/* ============ 尺寸与主循环 ============ */
function resize(){
  const r=wrap.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  W=Math.max(300,r.width); H=Math.max(260,r.height);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ppm=W/WORLD_W; worldH=H/ppm;
  dirty=true;
}
window.addEventListener('resize',resize);

function frame(){
  if(dirty){
    if(opts.lines&&charges.length) traceLines(); else lineCache=[];
    draw(); updateReadout();
    dirty=false;
  }
  requestAnimationFrame(frame);
}

resize();
applyPreset('dipole');
requestAnimationFrame(frame);
</script>
</body>
