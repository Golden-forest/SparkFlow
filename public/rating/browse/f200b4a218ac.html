<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>游标卡尺 · 螺旋测微器读数练习</title>
  <style>
    :root {
      color-scheme: light;
      --sim-bg: #eef3f8;
      --sim-surface: #ffffff;
      --sim-surface-soft: #f8fafc;
      --sim-text: #172033;
      --sim-muted: #657188;
      --sim-border: #dfe6ef;
      --sim-grid: #e8edf4;
      --sim-accent: #0f9fba;
      --sim-accent-deep: #08758a;
      --sim-accent-soft: #d9f4f7;
      --sim-positive: #0f9fba;
      --sim-warning: #f59e0b;
      --sim-danger: #dc2626;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 18px 46px rgba(28, 43, 70, 0.10);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
      /* 量具工作台语义扩展色（附加层，不替换基础 token） */
      --sim-steel: #51617a;
      --sim-steel-deep: #33415c;
      --sim-steel-soft: #93a1b8;
      --sim-brass: #c2742c;
      --sim-brass-soft: #f9ecdd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--sim-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 159, 186, 0.10), transparent 28%),
        radial-gradient(circle at 92% 4%, rgba(194, 116, 44, 0.08), transparent 26%),
        var(--sim-bg);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid rgba(15, 159, 186, 0.45); outline-offset: 2px; }
    .app { width: min(1560px, 100%); height: 100vh; margin: 0 auto; padding: 14px 18px 12px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 18px; min-height: 52px; }
    .header h1 { margin: 0 0 5px; font-size: clamp(1.45rem, 2.2vw, 1.95rem); letter-spacing: -0.03em; line-height: 1.05; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.88rem; }
    .status { border: 1px solid rgba(15,159,186,.18); border-radius: 999px; padding: 9px 14px; background: var(--sim-accent-soft); color: var(--sim-accent-deep); font-weight: 760; white-space: nowrap; }
    .status.warn { border-color: rgba(245, 158, 11, .3); background: #fdf3e0; color: #a35d00; }
    .status.lock { border-color: rgba(87, 100, 126, .25); background: #e8edf5; color: #47566b; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(320px, 0.8fr); gap: 12px; }
    .app[data-layout="experiment"] .main { grid-template-columns: minmax(0, 1.58fr) minmax(330px, 0.86fr); }
    .panel { min-width: 0; background: rgba(255,255,255,.94); border: 1px solid rgba(148,163,184,.22); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .scene-panel { min-height: 430px; padding: 12px 14px 10px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head .hint { color: var(--sim-muted); font-size: 0.74rem; }
    #scene { width: 100%; height: 100%; min-height: 330px; display: block; border: 1px solid rgba(15,159,186,.14); border-radius: 18px; background: linear-gradient(150deg, #fbfdff 0%, #f3f8fa 55%, #fbf6ee 100%); touch-action: none; }
    .stage-foot { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
    .stepper { display: flex; align-items: center; gap: 8px; }
    .stepper button { padding: 7px 12px; }
    .stepper .stepper-label { font-size: 0.8rem; color: var(--sim-muted); font-weight: 700; }
    .drag-hint { font-size: 0.76rem; color: var(--sim-muted); }
    .side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; }
    .answer-panel { padding: 15px 16px; display: grid; gap: 10px; }
    .answer-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 9px; align-items: center; }
    .answer-row label { font-size: 0.8rem; font-weight: 750; color: var(--sim-text); }
    #answerInput { width: 100%; padding: 10px 12px; border: 1.5px solid var(--sim-border); border-radius: var(--sim-radius-sm); font-size: 1.2rem; font-variant-numeric: tabular-nums; text-align: right; }
    #answerInput:focus { border-color: var(--sim-accent); }
    .unit { font-size: 0.85rem; color: var(--sim-muted); font-weight: 700; }
    .precision-hint { margin: 0; font-size: 0.74rem; color: var(--sim-muted); }
    .feedback { border-radius: 12px; padding: 10px 12px; font-size: 0.84rem; line-height: 1.5; display: none; }
    .feedback.show { display: block; }
    .feedback.ok { background: #e5f6f2; border: 1px solid rgba(15,159,186,.25); color: #0b6a5f; }
    .feedback.bad { background: #fdeeee; border: 1px solid rgba(220,38,38,.22); color: #9c1c1c; }
    .feedback strong { font-variant-numeric: tabular-nums; }
    .trials { padding: 13px 16px; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; }
    .trials h2 { margin: 0; font-size: 0.92rem; display: flex; justify-content: space-between; align-items: baseline; }
    .trials h2 span { color: var(--sim-muted); font-size: 0.74rem; font-weight: 600; }
    #trialList { list-style: none; margin: 0; padding: 0; min-height: 0; overflow-y: auto; display: grid; align-content: start; gap: 6px; }
    #trialList li { font-size: 0.8rem; padding: 8px 10px; border-radius: 10px; background: var(--sim-surface-soft); border: 1px solid var(--sim-border); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    #trialList li .who { color: var(--sim-muted); }
    #trialList li .verdict { font-weight: 800; white-space: nowrap; }
    #trialList li.ok .verdict { color: #0b7a6e; }
    #trialList li.bad .verdict { color: var(--sim-danger); }
    #trialList li .dev { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    .model-note { padding: 12px 14px; display: grid; gap: 8px; }
    .insight { padding: 11px 13px; border-left: 3px solid var(--sim-warning); border-radius: 0 12px 12px 0; background: #fff8e8; color: #80510a; font-weight: 640; font-size: 0.85rem; line-height: 1.5; margin: 0; }
    .model-note .note { margin: 0; color: var(--sim-muted); font-size: 0.76rem; line-height: 1.5; }
    .controls { padding: 10px 14px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; border-radius: 17px; }
    .actions { display: flex; gap: 8px; }
    .ctl-group { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .ctl-group + .ctl-group { padding-left: 18px; border-left: 1px solid var(--sim-border); }
    .ctl-label { font-size: 0.78rem; font-weight: 750; color: var(--sim-muted); }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 13px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 730; font-size: 0.86rem; transition: transform .15s ease, background .15s ease, border-color .15s ease; }
    button:hover { border-color: #c7d2e2; background: #eef3f9; }
    button:active { transform: scale(.97); }
    button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    button.primary { border-color: var(--sim-accent-deep); color: #fff; background: linear-gradient(135deg, var(--sim-accent-deep), var(--sim-accent)); box-shadow: 0 8px 18px rgba(15,159,186,.20); }
    button.toggled { border-color: var(--sim-warning); background: #fdf3e0; color: #a35d00; box-shadow: inset 0 0 0 1px rgba(245,158,11,.35); }
    .seg { display: inline-flex; border: 1px solid var(--sim-border); border-radius: 11px; overflow: hidden; background: var(--sim-surface-soft); }
    .seg button { border: none; border-radius: 0; padding: 8px 12px; background: transparent; font-size: 0.82rem; }
    .seg button + button { border-left: 1px solid var(--sim-border); }
    .seg button.active { background: var(--sim-accent-deep); color: #fff; }
    .seg.small button { padding: 7px 10px; font-size: 0.78rem; }
    .zero-manual { display: none; align-items: center; gap: 7px; }
    .zero-manual.show { display: flex; }
    .zero-manual input[type="range"] { width: 130px; accent-color: var(--sim-accent); }
    .zero-manual output { font-size: 0.78rem; color: var(--sim-muted); font-variant-numeric: tabular-nums; min-width: 58px; }
    /* SVG 量具样式 */
    .steel-body { fill: url(#steelGrad); stroke: #2e3b52; stroke-width: 1.2; }
    .steel-part { fill: #5d6d88; stroke: #33415c; stroke-width: 1; }
    .beam-band { fill: url(#beamGrad); stroke: #33415c; stroke-width: 1.2; }
    .main-tick { stroke: #2c3a52; stroke-width: 1.1; }
    .main-tick.major { stroke-width: 1.7; }
    .main-tick.mid { stroke-width: 1.4; }
    .main-num { fill: #33415c; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .vern-tick { stroke: #b4471f; stroke-width: 1.3; }
    .vern-tick.mid { stroke-width: 1.5; }
    .vern-num { fill: #a03d1c; font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .vern-zero { stroke: #d13d1a; stroke-width: 2.6; }
    .jaw { fill: #46536e; stroke: #2c3a52; stroke-width: 1.2; }
    .slider-body { fill: #e7ecf3; stroke: #5d6d88; stroke-width: 1.1; }
    .block-part { fill: url(#brassGrad); stroke: #a8601f; stroke-width: 1.3; }
    .drag-zone { fill: transparent; cursor: grab; }
    .drag-zone:active { cursor: grabbing; }
    .datum-line { stroke: #b4471f; stroke-width: 2; }
    .drum-body { fill: url(#drumGrad); stroke: #33415c; stroke-width: 1.2; }
    .drum-tick { stroke: #21304a; stroke-width: 1.4; }
    .drum-tick.mid { stroke-width: 1.7; }
    .drum-num { fill: #21304a; font-size: 10.5px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .aid-line { stroke: var(--sim-accent); stroke-width: 3.4; stroke-linecap: round; filter: drop-shadow(0 0 3px rgba(15,159,186,.65)); }
    .lens-box { fill: #ffffff; stroke: #9fb0c6; stroke-width: 1.3; rx: 12; }
    .lens-title { fill: #47566b; font-size: 12.5px; font-weight: 780; }
    .lens-note { fill: #657188; font-size: 11px; }
    .lens-main-tick { stroke: #2c3a52; stroke-width: 2; }
    .lens-vern-zero { stroke: #d13d1a; stroke-width: 2.6; }
    .lens-grid { stroke: #dde5ef; stroke-width: 1; }
    .legend-title { fill: #47566b; font-size: 13px; font-weight: 780; }
    .legend-line { fill: #657188; font-size: 11.5px; }
    .task-label { fill: #a35d00; font-size: 13.5px; font-weight: 760; }
    .instrument-tag { fill: #08758a; font-size: 12px; font-weight: 750; }
    @media (max-width: 900px) {
      .app { height: auto; min-height: 100vh; overflow: visible; padding: 12px; }
      .main, .app[data-layout] .main { grid-template-columns: 1fr; }
      .controls { flex-direction: column; align-items: stretch; }
      .ctl-group + .ctl-group { padding-left: 0; border-left: none; }
      .scene-panel { min-height: 0; }
      #scene { min-height: 0; height: auto; aspect-ratio: 1060 / 460; }
      .side { grid-template-rows: auto auto auto; }
      #trialList { max-height: 200px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <!-- AppShell shell: header / stage / evidence / insight / controls -->
  <div class="app" data-layout="experiment" data-model-tier="analytic">
    <header class="header" data-zone="header">
      <div>
        <h1>游标卡尺 · 螺旋测微器读数练习</h1>
        <p>拖一拖游标、转一转鼓轮，先查零位再修正——界面只给刻度，读数由你来判断。</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">待练习</div>
    </header>

    <main class="main">
      <section class="panel scene-panel" data-zone="stage" aria-labelledby="scene-title">
        <div class="panel-head">
          <h2 id="scene-title">量具工作台</h2>
          <div class="seg small" role="group" aria-label="选择量具">
            <button id="tabCal" type="button" class="active">游标卡尺</button>
            <button id="tabMic" type="button">螺旋测微器</button>
          </div>
          <button id="aidBtn" type="button" aria-pressed="false" title="教师辅助：高亮对齐的刻度线">辅助高亮</button>
        </div>
        <svg id="scene" viewBox="0 0 1060 460" role="img" aria-labelledby="scene-title scene-desc">
          <desc id="scene-desc">可交互的游标卡尺与螺旋测微器示意图：拖动游标或鼓轮改变测量位置，刻度不显示读数。</desc>
          <defs>
            <linearGradient id="steelGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#7c8ba4"/><stop offset="0.5" stop-color="#5d6d88"/><stop offset="1" stop-color="#46536e"/>
            </linearGradient>
            <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#eef2f8"/><stop offset="0.55" stop-color="#dbe3ee"/><stop offset="1" stop-color="#c3cede"/>
            </linearGradient>
            <linearGradient id="brassGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f2c08a"/><stop offset="0.5" stop-color="#dd9a52"/><stop offset="1" stop-color="#c2742c"/>
            </linearGradient>
            <linearGradient id="drumGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f4f7fb"/><stop offset="0.5" stop-color="#dfe7f1"/><stop offset="1" stop-color="#b9c6d8"/>
            </linearGradient>
          </defs>

          <!-- 游标卡尺 -->
          <g id="caliperG">
            <g id="calStatic"></g>
            <rect id="calBlock" class="block-part" y="196" height="66" rx="3"></rect>
            <g id="calMover" transform="translate(0,0)">
              <rect id="calJaw" class="jaw" x="-4.5" y="96" width="9" height="112" rx="2"></rect>
              <rect id="calSliderBody" class="slider-body" x="-30" y="172" width="60" height="40" rx="5"></rect>
              <line id="calVernZero" class="vern-zero" x1="0" y1="96" x2="0" y2="212"></line>
              <g id="calVern"></g>
              <rect id="calDrag" class="drag-zone" x="-34" y="90" width="68" height="130" tabindex="0" role="slider" aria-label="游标滑块：左右拖动或用方向键调整测量位置"></rect>
            </g>
            <g id="calAid" style="display:none"></g>
            <g id="calLegend"></g>
            <g id="calLens" style="display:none"></g>
          </g>

          <!-- 螺旋测微器（千分尺） -->
          <g id="microG" style="display:none">
            <g id="micStatic"></g>
            <rect id="micRod" class="steel-part" y="152" height="16" rx="3"></rect>
            <rect id="micBlock" class="block-part" y="196" height="66" rx="3"></rect>
            <g id="micDrumMover" transform="translate(0,0)">
              <rect class="drum-body" x="0" y="122" width="112" height="76" rx="8"></rect>
              <g id="micTicks"></g>
              <rect id="micDrag" class="drag-zone" x="6" y="122" width="104" height="76" tabindex="0" role="slider" aria-label="鼓轮：上下拖动或用方向键旋转，改变测量位置"></rect>
            </g>
            <g id="micAid" style="display:none"></g>
            <g id="micLegend"></g>
            <g id="micLens" style="display:none"></g>
          </g>
        </svg>
        <div class="stage-foot">
          <div class="stepper">
            <span class="stepper-label" id="stepperLabel">微调</span>
            <button id="stepMinus" type="button" aria-label="减小测量位置">−</button>
            <button id="stepPlus" type="button" aria-label="增大测量位置">＋</button>
          </div>
          <span class="drag-hint" id="dragHint">拖动滑块／鼓轮粗调，按钮与方向键微调（Shift 粗调）</span>
        </div>
      </section>

      <aside class="side" data-zone="evidence">
        <section class="panel answer-panel" aria-label="读数提交">
          <div class="answer-row">
            <label for="answerInput">你的读数（修正零误差后）<span class="unit">mm</span></label>
            <button id="checkBtn" class="primary" type="button">检查读数</button>
          </div>
          <input id="answerInput" type="number" inputmode="decimal" step="any" min="-30" max="30" placeholder="如 12.34" autocomplete="off">
          <p class="precision-hint" id="precisionHint"></p>
          <div id="feedback" class="feedback" role="alert"></div>
        </section>
        <section class="panel trials" aria-label="练习记录">
          <h2>练习记录 <span id="trialStats">共 0 题 · 正确 0</span></h2>
          <ul id="trialList"></ul>
        </section>
        <section class="panel model-note" data-zone="insight" aria-label="观察提示">
          <p id="insight" class="insight">先看量具：读数 = 主尺整毫米 + 游标（或鼓轮）小数部分；若启用了零误差，先点「零位检查」。</p>
          <p class="note">读数方法：卡尺找游标与主尺对齐的刻度线；千分尺读固定刻度 + 鼓轮刻度并估读一位。修正：真实值 = 示数 − 零误差。</p>
        </section>
      </aside>
    </main>

    <section class="panel controls" data-zone="controls" aria-label="练习控制">
      <div class="actions">
        <button id="startBtn" class="primary" type="button">开始练习</button>
        <button id="pauseBtn" type="button">锁定量具</button>
        <button id="resetBtn" type="button">重置</button>
      </div>
      <div class="ctl-group">
        <button id="newBtn" type="button">随机出题</button>
        <button id="zeroBtn" type="button" aria-pressed="false">零位检查</button>
      </div>
      <div class="ctl-group" id="divGroup">
        <span class="ctl-label">卡尺分度</span>
        <div class="seg small" role="group" aria-label="游标卡尺分度">
          <button id="div10" type="button" class="active">10 分度</button>
          <button id="div20" type="button">20 分度</button>
          <button id="div50" type="button">50 分度</button>
        </div>
      </div>
      <div class="ctl-group">
        <span class="ctl-label">零误差</span>
        <div class="seg small" role="group" aria-label="零误差设置">
          <button id="zNone" type="button" class="active">无</button>
          <button id="zRand" type="button">随机</button>
          <button id="zManual" type="button">手动</button>
        </div>
        <div class="zero-manual" id="zeroManualBox">
          <label for="zeroInput">设定值</label>
          <input id="zeroInput" type="range" min="-0.1" max="0.1" step="0.01" value="0">
          <output id="zeroOutput" for="zeroInput">+0.00 mm</output>
        </div>
      </div>
    </section>
  </div>

  <script>
  (() => {
    "use strict";
    /*==MODEL_START==*/
    // 纯物理内核：不依赖 DOM。渲染与交互均由该模块派生。
    const EPS = 1e-9;
    const ReadingModel = (() => {
      // 分度 → 精度 (mm)。10 分度: 游标 10 格 = 9 mm；20 分度: 20 格 = 19 mm；50 分度: 50 格 = 49 mm。
      const PRECISION = { 10: 0.1, 20: 0.05, 50: 0.02 };
      const MIC_DRUM_DIV = 50;          // 鼓轮 50 格，每格 0.01 mm
      const MIC_DRUM_STEP = 0.01;
      const CAL_RANGE = [1, 15];        // 随机出题真实尺寸范围 (mm)
      const MIC_RANGE = [1, 12];
      const snap = (x, p) => Math.round(x / p) * p;

      function mulberry32(seed) {
        let a = seed >>> 0;
        return function rng() {
          a |= 0; a = (a + 0x6D2B79F5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // 游标几何：游标零线位于 raw mm；第 k 条游标刻线位于 raw + k·(N−1)/N。
      // raw = M + k/N 时，第 k 条游标线与主尺整刻线 M+k 恰好对齐（残差为 0）。
      function alignedTickCal(raw, N) {
        const frac = raw - Math.floor(raw);
        const k = Math.round(frac * N) % N;
        return k;
      }
      function calAlignResidual(raw, N, k) {
        const pos = raw + (k * (N - 1)) / N;
        return Math.abs(pos - Math.round(pos));
      }
      function decomposeCal(raw, N) {
        const main = Math.floor(raw);
        const k = alignedTickCal(raw, N);
        return { main, k, precision: PRECISION[N] };
      }

      g.appendChild(el("text", { x: 640, y: 84, class: "lens-title" }, "零位检查（测量面闭合）"));
      const lines = [
        "此时主尺固定刻度 ≈ 0。",
        "鼓轮基准线处的读数就是零误差 δ：",
        "· 鼓轮读数 ≤ 0.25 mm → δ = 读数（正值）",
        "· 鼓轮读数 > 0.25 mm → δ = 读数 − 0.50（负值）",
        "例：基准线对 0.03 → δ = +0.03 mm；",
        "　　基准线对 0.47 → δ = −0.03 mm。",
        "测量的真实值 = 示数 − δ。",
      ];
      lines.forEach((t, i) => g.appendChild(el("text", { x: 640, y: 118 + i * 27, class: i === 0 ? "legend-line" : "legend-line" }, t)));
    }

    // ---- 渲染：一切视觉由 state 派生 ----
    function fmtCal(x) { return x.toFixed(M.PRECISION[state.N] === 0.1 ? 1 : 2); }
    function render() {
      const isCal = state.instrument === "caliper";
      elements.caliperG.style.display = isCal ? "" : "none";
      elements.microG.style.display = isCal ? "none" : "";
      const L = curL(), delta = curD(), raw = M.rawFromTrue(L, delta);
      if (isCal) {
        const pxmm = CAL_PXMM[state.N];
        elements.calMover.setAttribute("transform", `translate(${CAL_ORIGIN_X + raw * pxmm}, 0)`);
        const faceX = CAL_ORIGIN_X + L * pxmm;
        elements.calBlock.setAttribute("x", CAL_ORIGIN_X);
        elements.calBlock.setAttribute("width", Math.max(0, faceX - CAL_ORIGIN_X));
        const drag = elements.calVern.ownerDocument.getElementById("calDrag");
        drag.setAttribute("aria-valuenow", raw.toFixed(2));
        drag.setAttribute("aria-valuetext", `游标零线位于主尺 ${raw.toFixed(2)} 毫米处`);
        renderCalAid(raw);
        elements.calLegend.style.display = state.zeroChecking ? "none" : "";
        elements.calLens.style.display = state.zeroChecking ? "" : "none";
        if (state.zeroChecking) buildCalLens();
      } else {
        const edgeX = MIC_ORIGIN_X + raw * MIC_PXMM;
        const faceX = MIC_ORIGIN_X + L * MIC_PXMM;
        elements.micDrumMover.setAttribute("transform", `translate(${edgeX}, 0)`);
        elements.micRod.setAttribute("x", Math.min(faceX, edgeX));
        elements.micRod.setAttribute("width", Math.max(2, Math.abs(edgeX - faceX)));
        elements.micBlock.setAttribute("x", MIC_ORIGIN_X);
        elements.micBlock.setAttribute("width", Math.max(0, faceX - MIC_ORIGIN_X));
        renderMicTicks(raw);
        renderMicAid(raw);
        elements.micLegend.style.display = state.zeroChecking ? "none" : "";
        elements.micLens.style.display = state.zeroChecking ? "" : "none";
        const drag = elements.micTicks.ownerDocument.getElementById("micDrag");
        drag.setAttribute("aria-valuenow", raw.toFixed(3));
        drag.setAttribute("aria-valuetext", `鼓轮位于 ${raw.toFixed(3)} 毫米处`);
      }
      renderChrome();
    }
    function renderCalAid(raw) {
      const g = elements.calAid;
      const show = elements.aidBtn.getAttribute("aria-pressed") === "true" && !state.zeroChecking;
      g.style.display = show ? "" : "none";
      if (!show) { g.innerHTML = ""; return; }
      const pxmm = CAL_PXMM[state.N], N = state.N;
      const d = M.decomposeCal(raw, N), k = d.k;
      const vStep = (pxmm * (N - 1)) / N;
      const vkX = CAL_ORIGIN_X + raw * pxmm + k * vStep;
      const mainTickX = CAL_ORIGIN_X + (d.main + k) * pxmm;
      g.innerHTML = "";
      g.appendChild(el("line", { x1: mainTickX, y1: 130, x2: mainTickX, y2: 172, class: "aid-line" }));
      g.appendChild(el("line", { x1: vkX, y1: 171, x2: vkX, y2: 201, class: "aid-line" }));
    }
    function renderMicTicks(raw) {
      const g = elements.micTicks;
      g.innerHTML = "";
      g.appendChild(el("line", { x1: 4, y1: 160, x2: 40, y2: 160, class: "datum-line" })); // 基准线
      const rawTicks = raw / M.MIC_DRUM_STEP;
      const i0 = Math.round(rawTicks);
      for (let i = i0 - 4; i <= i0 + 5; i += 1) {
        const ty = 160 + (i - rawTicks) * 8;
        if (ty < 126 || ty > 194) continue;
        const mid = ((i % 5) + 5) % 5 === 0;
        g.appendChild(el("line", { x1: 10, y1: ty, x2: mid ? 36 : 26, y2: ty, class: "drum-tick" + (mid ? " mid" : "") }));
        if (mid) g.appendChild(el("text", { x: 42, y: ty + 3.5, class: "drum-num" }, String(((i % 50) + 50) % 50)));
      }
    }
    function renderMicAid(raw) {
      const g = elements.micAid;
      const show = elements.aidBtn.getAttribute("aria-pressed") === "true" && !state.zeroChecking;
      g.style.display = show ? "" : "none";
      if (!show) { g.innerHTML = ""; return; }
      const edgeX = MIC_ORIGIN_X + raw * MIC_PXMM;
      const rawTicks = raw / M.MIC_DRUM_STEP;
      const i0 = Math.round(rawTicks);
      g.innerHTML = "";
      g.appendChild(el("line", { x1: edgeX + 8, y1: 160, x2: edgeX + 40, y2: 160, class: "aid-line" }));
      for (let j = -2; j <= 2; j += 1) {
        const ty = 160 + (i0 + j - rawTicks) * 8;
        if (Math.abs(ty - 160) < 0.4) g.appendChild(el("line", { x1: edgeX + 10, y1: ty, x2: edgeX + 30, y2: ty, class: "aid-line" }));
      }
    }
    function renderChrome() {
      const isCal = state.instrument === "caliper";
      const p = isCal ? M.PRECISION[state.N] : M.MIC_DRUM_STEP;
      elements.precisionHint.textContent = isCal
        ? `卡尺 ${state.N} 分度 · 精度 ${p.toFixed(2)} mm · 读数保留到 ${p.toFixed(2)} mm（不估读）`
        : "千分尺 · 鼓轮 50 格 × 0.01 mm · 需估读到 0.001 mm";
      elements.stepperLabel.textContent = isCal ? `微调 ±${p.toFixed(2)} mm` : "微调 ±0.01 mm";
      elements.dragHint.textContent = isCal
        ? "左右拖动滑块（或方向键，Shift 粗调 1 mm）· 滚轮 ±1 mm"
        : "上下拖动鼓轮（或方向键，Shift 粗调 0.5 mm）· 滚轮 ±0.01 mm";
      elements.tabCal.classList.toggle("active", isCal);
      elements.tabMic.classList.toggle("active", !isCal);
      [elements.div10, elements.div20, elements.div50].forEach((b) => (b.disabled = !isCal || state.locked));
      elements.divGroup.style.opacity = isCal ? "" : ".45";
      const lockUI = state.locked;
      [elements.newBtn, elements.zeroBtn, elements.aidBtn, elements.tabCal, elements.tabMic,
        elements.zNone, elements.zRand, elements.zManual, elements.zeroInput].forEach((b) => (b.disabled = lockUI));
      elements.stepMinus.disabled = elements.stepPlus.disabled = lockUI;
      elements.zeroBtn.textContent = state.zeroChecking ? "返回测量" : "零位检查";
      elements.zeroBtn.classList.toggle("toggled", state.zeroChecking);
      elements.zeroBtn.setAttribute("aria-pressed", String(state.zeroChecking));
      elements.aidBtn.setAttribute("aria-pressed", elements.aidBtn.getAttribute("aria-pressed") === "true" ? "true" : "false");
      elements.answerInput.disabled = state.zeroChecking;
      elements.checkBtn.disabled = state.zeroChecking;
      elements.zeroManualBox.classList.toggle("show", state.zeroMode === "manual" && !lockUI);
      if (state.zeroMode === "manual") elements.zeroOutput.textContent = `${state.zeroManual >= 0 ? "+" : ""}${state.zeroManual.toFixed(2)} mm`;
      const total = state.trials.length, okN = state.trials.filter((t) => t.pass).length;
      elements.trialStats.textContent = `共 ${total} 题 · 正确 ${okN}`;
      elements.status.className = "status" + (state.zeroChecking ? " warn" : state.locked ? " lock" : "");
      elements.status.textContent = state.locked ? "已锁定"
        : state.zeroChecking ? "零位检查中"
        : state.answered ? (state.lastPass ? "已提交 · 正确" : "已提交 · 有偏差")
        : "练习中";
      renderInsight();
    }
    function renderInsight() {
      let text;
      if (state.locked) {
        text = "已锁定：请直接读刻度并在右侧提交，量具交互已停用。";
      } else if (state.zeroChecking) {
        text = state.instrument === "caliper"
          ? "零位检查中：量爪已闭合。在放大镜里看红色游标零线相对主尺零线的方向（右偏为正 δ），大小由对齐刻线序号 × 分度值读出。读完后点「返回测量」。"
          : "零位检查中：测量面已闭合，主尺固定刻度≈0。直接读鼓轮基准线处的格数即零误差（>0.25 mm 按 −0.50 折算为负）。读完后点「返回测量」。";
      } else if (state.zeroMode !== "none" && !state.answered) {
        text = "本题带零误差设置：先「零位检查」读出 δ，再读示数，最后 真实值 = 示数 − δ，填入右侧提交。";
      } else if (!state.answered) {
        text = state.instrument === "caliper"
          ? "读数 = 主尺整毫米 + 游标对齐刻线序号 × 分度值。提交前界面不显示答案。"
          : "读数 = 固定刻度 + 鼓轮格数 × 0.01 mm + 估读一位。提交前界面不显示答案。";
      } else {
        text = state.lastPass
          ? "回答正确！点「随机出题」继续下一题，或换一种分度 / 量具再练。"
          : "有偏差：再核对一遍——主尺整毫米、对齐刻线（或鼓轮格数）、以及零误差修正的方向。点「随机出题」可换题。";
      }
      elements.insight.textContent = text;
    }

    // ---- 交互：拖拽 / 滚轮 / 键盘 ----
    function svgPoint(evt) {
      const pt = elements.scene.createSVGPoint();
      pt.x = evt.clientX; pt.y = evt.clientY;
      return pt.matrixTransform(elements.scene.getScreenCTM().inverse());
    }
    function applyCalPointer(rawTarget) {
      const p = M.PRECISION[state.N];
      const L = clamp(M.snap(rawTarget - state.calD, p), 0, CAL_MAX_L);
      state.calL = L;
    }
    function applyMicPointer(rawTarget) {
      const L = clamp(M.snap(rawTarget - state.micD, 0.001), 0, MIC_MAX_L);
      state.micL = L;
    }
    function bindDrag(zoneId, onDown, onMove) {
      const zone = document.getElementById(zoneId);
      let active = false;
      zone.addEventListener("pointerdown", (evt) => {
        if (state.anim) state.anim = null;
        if (state.locked || state.zeroChecking) return;
        active = true;
        zone.setPointerCapture(evt.pointerId);
        onDown(evt);
        evt.preventDefault();
      });
      zone.addEventListener("pointermove", (evt) => { if (active && !state.locked && !state.zeroChecking) onMove(evt); });
      const stop = () => { active = false; };
      zone.addEventListener("pointerup", stop);
      zone.addEventListener("pointercancel", stop);
    }
    function bindInstrumentInput() {
      let grabRaw = 0, grabX = 0, grabY = 0;
      bindDrag("calDrag", (evt) => {
        grabRaw = M.rawFromTrue(state.calL, state.calD);
        grabX = svgPoint(evt).x;
      }, (evt) => {
        const pxmm = CAL_PXMM[state.N];
        applyCalPointer(grabRaw + (svgPoint(evt).x - grabX) / pxmm);
        state.answered = false; hideFeedback();
        render();
      });
      bindDrag("micDrag", (evt) => {
        grabRaw = M.rawFromTrue(state.micL, state.micD);
        grabY = svgPoint(evt).y;
      }, (evt) => {
        applyMicPointer(grabRaw + (grabY - svgPoint(evt).y) * 0.002);
        state.answered = false; hideFeedback();
        render();
      });
      elements.scene.addEventListener("wheel", (evt) => {
        if (state.locked || state.zeroChecking) return;
        evt.preventDefault();
        const dir = evt.deltaY > 0 ? -1 : 1;
        if (state.instrument === "caliper") applyCalPointer(M.rawFromTrue(state.calL, state.calD) + dir * 1);
        else applyMicPointer(M.rawFromTrue(state.micL, state.micD) + dir * 0.01);
        state.answered = false; hideFeedback();
        render();
      }, { passive: false });
      document.getElementById("calDrag").addEventListener("keydown", (evt) => {
        if (state.locked || state.zeroChecking) return;
        const p = M.PRECISION[state.N];
        if (evt.key === "ArrowLeft" || evt.key === "ArrowRight") {
          evt.preventDefault();
          const dir = evt.key === "ArrowRight" ? 1 : -1;
          applyCalPointer(M.rawFromTrue(state.calL, state.calD) + dir * (evt.shiftKey ? 1 : p));
          state.answered = false; hideFeedback(); render();
        }
      });
      document.getElementById("micDrag").addEventListener("keydown", (evt) => {
        if (state.locked || state.zeroChecking) return;
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(evt.key)) {
          evt.preventDefault();
          const dir = (evt.key === "ArrowRight" || evt.key === "ArrowUp") ? 1 : -1;
          applyMicPointer(M.rawFromTrue(state.micL, state.micD) + dir * (evt.shiftKey ? 0.5 : 0.01));
          state.answered = false; hideFeedback(); render();
        }
      });
      elements.stepMinus.addEventListener("click", () => stepCurrent(-1));
      elements.stepPlus.addEventListener("click", () => stepCurrent(1));
    }
    function stepCurrent(dir) {
      if (state.locked || state.zeroChecking) return;
      if (state.instrument === "caliper") applyCalPointer(rawNow() + dir * M.PRECISION[state.N]);
      else applyMicPointer(rawNow() + dir * M.MIC_DRUM_STEP);
      state.answered = false; hideFeedback();
      render();
    }

    // ---- 出题 / 零位检查 / 评分 ----
    function animateTo(targetL) {
      if (reduceMotion) { setCurL(targetL); render(); return; }
      state.anim = { from: curL(), to: targetL, t: 0, dur: 0.55 };
    }
    function newQuestion() {
      if (state.zeroChecking) exitZeroCheck();
      const q = M.makeQuestion({
        instrument: state.instrument, N: state.N,
        zeroMode: state.zeroMode, zeroManual: state.zeroManual,
      }, Math.random);
      if (state.instrument === "caliper") { state.calL = q.trueSize; state.calD = q.zeroError; }
      else { state.micL = q.trueSize; state.micD = q.zeroError; }
      state.answered = false;
      elements.answerInput.value = "";
      hideFeedback();
      animateTo(q.trueSize);
      render();
    }
    function enterZeroCheck() {
      if (state.locked) return;
      state.zeroChecking = true;
      state.zeroSavedL = curL();
      animateTo(0);
      render();
    }
    function exitZeroCheck() {
      state.zeroChecking = false;
      animateTo(state.zeroSavedL);
      render();
    }
    function hideFeedback() {
      elements.feedback.className = "feedback";
      elements.feedback.textContent = "";
    }
    function checkAnswer() {
      if (state.zeroChecking) return;
      const value = Number(elements.answerInput.value);
      if (!Number.isFinite(value) || elements.answerInput.value.trim() === "") {
        elements.feedback.className = "feedback bad show";
        elements.feedback.textContent = "请先输入一个数字读数（单位 mm）。";
        return;
      }
      const L = curL();
      const result = M.grade(value, L, state.instrument);
      state.answered = true;
      state.lastPass = result.pass;
      const raw = M.rawFromTrue(L, curD());
      let breakdown;
      if (state.instrument === "caliper") {
        const d = M.decomposeCal(raw, state.N);
        breakdown = `示数 = 主尺 ${d.main} mm + 游标第 ${d.k} 线 × ${M.PRECISION[state.N].toFixed(2)} mm = ${fmtCal(raw)} mm；`
          + `零误差 δ = ${curD() >= 0 ? "+" : ""}${curD().toFixed(2)} mm；真实值 = ${fmtCal(raw)} − (${curD() >= 0 ? "+" : ""}${curD().toFixed(2)}) = ${fmtCal(L)} mm。`;
      } else {
        const d = M.decomposeMic(raw);
        breakdown = `示数 = 固定 ${d.fixed.toFixed(1)} mm + 鼓轮 ${d.ticks} × 0.01 mm + 估读 ${d.est} × 0.001 mm = ${raw.toFixed(3)} mm；`
          + `零误差 δ = ${curD() >= 0 ? "+" : ""}${curD().toFixed(2)} mm；真实值 = ${raw.toFixed(3)} − (${curD() >= 0 ? "+" : ""}${curD().toFixed(2)}) = ${L.toFixed(3)} mm。`;
      }
      elements.feedback.className = "feedback show " + (result.pass ? "ok" : "bad");
      elements.feedback.innerHTML = (result.pass
        ? "<strong>✓ 读数正确！</strong><br>"
        : `<strong>✗ 不正确</strong>（偏差 ${result.deviation >= 0 ? "+" : ""}${result.deviation.toFixed(3)} mm）<br>`)
        + breakdown;
      const name = state.instrument === "caliper" ? `卡尺${state.N}分度` : "千分尺";
      state.trials.unshift({
        name, answer: value, pass: result.pass,
        dev: result.deviation, label: result.pass ? "✓ 正确" : "✗ 偏差",
      });
      if (state.trials.length > 60) state.trials.pop();
      renderTrials();
      render();
    }
    function renderTrials() {
      elements.trialList.innerHTML = "";
      state.trials.forEach((t, i) => {
        const li = document.createElement("li");
        li.className = t.pass ? "ok" : "bad";
        const left = document.createElement("span");
        left.className = "who";
        left.textContent = `#${state.trials.length - i} ${t.name}`;
        const mid = document.createElement("span");
        mid.className = "dev";
        mid.textContent = t.pass ? `你答 ${t.answer}` : `你答 ${t.answer}（${t.dev >= 0 ? "+" : ""}${t.dev.toFixed(3)}）`;
        const right = document.createElement("span");
        right.className = "verdict";
        right.textContent = t.label;
        li.appendChild(left); li.appendChild(mid); li.appendChild(right);
        elements.trialList.appendChild(li);
      });
    }

    // ---- 生命周期 ----
    function init() {
      buildCalStatic(); buildCalVernier(); buildCalLegend();
      buildMicStatic(); buildMicLegend(); buildMicLens();
      bindInstrumentInput(); bindControls();
      updateZeroSliderAttrs();
      render();
      requestAnimationFrame(frame);
    }
    function start() { state.locked = false; state.running = true; render(); }
    function pause() { state.locked = true; state.running = false; state.anim = null; render(); }
    function reset() {
      state.locked = false; state.running = true; state.zeroChecking = false;
      state.instrument = "caliper"; state.N = 10;
      state.zeroMode = "none"; state.zeroManual = 0;
      state.calL = 5.3; state.calD = 0; state.micL = 5.673; state.micD = 0;
      state.trials = []; state.answered = false; state.anim = null;
      elements.answerInput.value = "";
      hideFeedback(); renderTrials();
      syncSegButtons(); updateZeroSliderAttrs();
      buildCalStatic(); buildCalVernier(); buildCalLegend();
      render();
    }
    function update(dt) {
      if (!state.anim || state.locked) return;
      const bounded = clamp(finite(dt, 0), 0, 0.05);
      state.anim.t += bounded;
      const s = Math.min(1, state.anim.t / state.anim.dur);
      const eased = s < 0.5 ? 4 * s * s * s : 1 - Math.pow(-2 * s + 2, 3) / 2;
      setCurL(state.anim.from + (state.anim.to - state.anim.from) * eased);
      if (s >= 1) state.anim = null;
      render();
    }
    function setParameters(values) {
      if (values && values.N !== undefined) {
        state.N = [10, 20, 50].includes(values.N) ? values.N : 10;
        const p = M.PRECISION[state.N];
        state.calL = clamp(M.snap(state.calL, p), 0, CAL_MAX_L);
        state.calD = M.snap(state.calD, p);
        buildCalStatic(); buildCalVernier(); buildCalLegend(); updateZeroSliderAttrs(); render();
      }
      if (values && values.instrument !== undefined) switchInstrument(values.instrument);
    }
    function getState() {
      return {
        instrument: state.instrument, divisions: state.instrument === "caliper" ? state.N : 50,
        locked: state.locked, zeroChecking: state.zeroChecking, zeroMode: state.zeroMode,
        trials: state.trials.slice(),
      };
    }
    function getReadouts() {
      const L = curL(), d = curD();
      return {
        instrument: state.instrument,
        divisions: state.instrument === "caliper" ? state.N : 50,
        precision: state.instrument === "caliper" ? M.PRECISION[state.N] : 0.01,
        rawReading: M.rawFromTrue(L, d),
        zeroError: d,
        correctedSize: L,
        locked: state.locked,
        zeroChecking: state.zeroChecking,
      };
    }
    function switchInstrument(which) {
      const target = which === "micrometer" ? "micrometer" : "caliper";
      if (state.zeroChecking) exitZeroCheck();
      state.instrument = target;
      state.answered = false;
      elements.answerInput.value = "";
      hideFeedback();
      updateZeroSliderAttrs();
      render();
    }
    function updateZeroSliderAttrs() {
      const p = state.instrument === "caliper" ? M.PRECISION[state.N] : M.MIC_DRUM_STEP;
      const maxAbs = state.instrument === "caliper" ? Math.min(0.1, 5 * p) : 0.05;
      state.zeroManual = clamp(M.snap(state.zeroManual, p), -maxAbs, maxAbs);
      elements.zeroInput.min = String(-maxAbs);
      elements.zeroInput.max = String(maxAbs);
      elements.zeroInput.step = String(p);
      elements.zeroInput.value = String(state.zeroManual);
      elements.zeroOutput.textContent = `${state.zeroManual >= 0 ? "+" : ""}${state.zeroManual.toFixed(2)} mm`;
    }
    function syncSegButtons() {
      elements.zNone.classList.toggle("active", state.zeroMode === "none");
      elements.zRand.classList.toggle("active", state.zeroMode === "random");
      elements.zManual.classList.toggle("active", state.zeroMode === "manual");
      elements.div10.classList.toggle("active", state.N === 10);
      elements.div20.classList.toggle("active", state.N === 20);
      elements.div50.classList.toggle("active", state.N === 50);
    }
    function bindControls() {
      elements.startBtn.addEventListener("click", start);
      elements.pauseBtn.addEventListener("click", pause);
      elements.resetBtn.addEventListener("click", reset);
      elements.newBtn.addEventListener("click", newQuestion);
      elements.zeroBtn.addEventListener("click", () => (state.zeroChecking ? exitZeroCheck() : enterZeroCheck()));
      elements.checkBtn.addEventListener("click", checkAnswer);
      elements.answerInput.addEventListener("keydown", (evt) => { if (evt.key === "Enter") checkAnswer(); });
      elements.aidBtn.addEventListener("click", () => {
        const next = elements.aidBtn.getAttribute("aria-pressed") !== "true";
        elements.aidBtn.setAttribute("aria-pressed", String(next));
        elements.aidBtn.classList.toggle("toggled", next);
        render();
      });
      elements.tabCal.addEventListener("click", () => switchInstrument("caliper"));
      elements.tabMic.addEventListener("click", () => switchInstrument("micrometer"));
      const divBtn = (btn, n) => btn.addEventListener("click", () => {
        if (state.locked) return;
        state.N = n;
        const p = M.PRECISION[n];
        state.calL = clamp(M.snap(state.calL, p), 0, CAL_MAX_L);
        state.calD = M.snap(state.calD, p);
        state.answered = false; hideFeedback();
        syncSegButtons(); buildCalStatic(); buildCalVernier(); buildCalLegend();
        updateZeroSliderAttrs(); render();
      });
      divBtn(elements.div10, 10); divBtn(elements.div20, 20); divBtn(elements.div50, 50);
      const zBtn = (btn, mode) => btn.addEventListener("click", () => {
        if (state.locked) return;
        state.zeroMode = mode;
        if (mode === "none") { setCurD(0); state.answered = false; hideFeedback(); }
        if (mode === "manual") { setCurD(M.snap(state.zeroManual, state.instrument === "caliper" ? M.PRECISION[state.N] : M.MIC_DRUM_STEP)); state.answered = false; hideFeedback(); }
        syncSegButtons(); updateZeroSliderAttrs(); render();
      });
      zBtn(elements.zNone, "none"); zBtn(elements.zRand, "random"); zBtn(elements.zManual, "manual");
      elements.zeroInput.addEventListener("input", () => {
        if (state.locked) return;
        state.zeroManual = Number(elements.zeroInput.value);
        const p = state.instrument === "caliper" ? M.PRECISION[state.N] : M.MIC_DRUM_STEP;
        setCurD(M.snap(state.zeroManual, p));
        state.answered = false; hideFeedback();
        render();
      });
      syncSegButtons();
    }
    let lastTimestamp = null;
    function frame(timestamp) {
      if (lastTimestamp === null) lastTimestamp = timestamp;
      const dt = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;
      update(dt);
      requestAnimationFrame(frame);
    }
    window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks: M.runModelChecks };
    init();
  })();
  </script>
</body>
</html>
