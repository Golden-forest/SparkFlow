**第 2/2 段（全部 JavaScript）：**

```html
<script>
"use strict";
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const P={h1:5,h2:3,r:1.5,m:1,mu:0.15,fricOn:true,g:10,bOn:false,slow:true,playing:true};
let segs=[],trackLen=0,carts=[],notes=[],ts=1,slowNow=false;

/* ---------- 轨道构建（弧长参数化） ---------- */
function buildTrack(){
  const hMax=Math.max(P.h1,P.bOn?P.h2:0);
  const A={x:0,y:hMax},B={x:6,y:0};
  segs=[
    {t:'line',len:Math.hypot(6,hMax),p0:A,p1:B},
    {t:'line',len:2,p0:B,p1:{x:8,y:0}},
    {t:'loop',len:2*Math.PI*P.r,c:{x:8,y:P.r},r:P.r},
    {t:'line',len:7,p0:{x:8,y:0},p1:{x:15,y:0}}
  ];
  trackLen=segs.reduce((a,s)=>a+s.len,0);
  return hMax;
}
function rampS(h){ // 斜面上高度 h 对应的弧长
  const hMax=Math.max(P.h1,P.bOn?P.h2:0);
  return segs[0].len*(1-h/hMax);
}
function trackPoint(s){
  s=Math.max(0,Math.min(s,trackLen));
  for(let i=0;i<segs.length;i++){const g=segs[i];
    if(s<=g.len+1e-9||i===segs.length-1){
      const u=Math.min(1,s/g.len);
      if(g.t==='loop'){const psi=u*2*Math.PI;
        return{x:g.c.x+g.r*Math.sin(psi),y:g.c.y-g.r*Math.cos(psi),
               tx:Math.cos(psi),ty:Math.sin(psi),psi,seg:i,r:g.r};}
      const dx=g.p1.x-g.p0.x,dy=g.p1.y-g.p0.y,L=Math.hypot(dx,dy);
      return{x:g.p0.x+dx*u,y:g.p0.y+dy*u,tx:dx/L,ty:dy/L,seg:i};
    } s-=g.len;
  }
}
const inFric=pt=>P.fricOn&&P.mu>0&&pt.seg===3&&pt.x>=9&&pt.x<=12;

/* ---------- 小车 ---------- */
function makeCart(h,color,name){
  return{name,color,h,mode:'track',s:rampS(h),v:0,x:0,y:0,vx:0,vy:0,
         E0:P.m*P.g*h,Ed:0,trail:[],detached:false};
}
function addNote(x,y,t){notes.push({x,y,t,ttl:2.2});}

function stepCart(c,dt){
  const n=8,h=dt/n;
  for(let i=0;i<n;i++){
    if(c.mode==='track'){
      const pt=trackPoint(c.s);
      let a=-P.g*pt.ty;                       // 重力切向分量
      if(inFric(pt)){const d=P.mu*P.g;
        c.Ed+=P.m*d*Math.abs(c.v)*h; a-=Math.sign(c.v||1)*d;}
      c.v+=a*h;
      if(pt.seg===3&&c.v<=0){c.v=0;c.mode='stopped';break;}   // 摩擦段上停下
      c.s+=c.v*h;
      if(c.s<0){c.s=0;c.v=Math.max(0,c.v);}                   // 滑回起点挡板
      if(c.s>=trackLen){const e=trackPoint(trackLen);c.x=e.x;c.y=e.y;c.mode='stopped';break;}
      const p2=trackPoint(c.s);
      if(p2.seg===2){                                         // 圆环内：按受力判定接触
        const Nc=c.v*c.v+P.g*p2.r*Math.cos(p2.psi);           // N/m = v²/r + g·cosψ
        if(Nc<0&&p2.psi>Math.PI/2&&p2.psi<3*Math.PI/2){
          c.mode='fly';c.x=p2.x;c.y=p2.y;
          const v=Math.max(c.v,0);c.vx=v*p2.tx;c.vy=v*p2.ty;c.detached=true;
          addNote(p2.x,p2.y+.3,'N=0，脱离轨道！');break;
        }
      }
    }else if(c.mode==='fly'){                                 // 抛体运动
      c.vy-=P.g*h;c.x+=c.vx*h;c.y+=c.vy*h;
      if(c.y<=0){c.y=0;c.Ed+=.5*P.m*c.vy*c.vy;                // 落地冲击→内能
        addNote(c.x,.3,'落地：竖直动能转化为内能');c.v=c.vx;c.mode='slide';}
    }else if(c.mode==='slide'){                               // 落地后滑行
      const z=P.fricOn&&P.mu>0&&c.x>=9&&c.x<=12;
      let a=z?-Math.sign(c.v||1)*P.mu*P.g:0;
      if(z)c.Ed+=P.m*P.mu*P.g*Math.abs(c.v)*h;
      const nv=c.v+a*h;
      if(z&&c.v>0&&nv<=0){c.v=0;c.mode='stopped';break;}
      c.v=nv;c.x+=c.v*h;
      if(c.x>15.2||c.x<0){c.mode='stopped';break;}
    }else break;
  }
  if(c.mode==='track'){const p=trackPoint(c.s);c.x=p.x;c.y=p.y;}
  c.trail.push({x:c.x,y:c.y});if(c.trail.length>500)c.trail.shift();
}
function energy(c){
  const ke=c.mode==='fly'?.5*P.m*(c.vx**2+c.vy**2):.5*P.m*c.v*c.v;
  return{ke,pe:P.m*P.g*c.y,ed:c.Ed};
}

/* ---------- 主循环 ---------- */
function resetSim(){
  buildTrack();carts=[];notes=[];
  carts.push(makeCart(P.h1,'#ffd54f','A'));
  if(P.bOn)carts.push(makeCart(P.h2,'#4dd0e1','B'));
}
let last=performance.now();
function frame(now){
  let dt=Math.min((now-last)/1000,1/30);last=now;
  slowNow=false;
  if(P.slow)for(const c of carts){                            // 过顶瞬间慢放
    if(c.mode==='track'){const p=trackPoint(c.s);
      if(p.seg===2&&Math.abs(p.psi-Math.PI)<0.18){slowNow=true;break;}}
  }
  ts=slowNow?0.15:1;
  if(P.playing)for(const c of carts)stepCart(c,dt*ts);
  for(const n of notes)n.ttl-=dt;
  notes=notes.filter(n=>n.ttl>0);
  draw();updatePanels();
  requestAnimationFrame(frame);
}

/* ---------- 绘制 ---------- */
let W=0,H=0,sc=1,gy=0;
const SX=x=>x*sc+34,SY=y=>gy-y*sc;
function draw(){
  const dpr=devicePixelRatio||1,rc=cv.getBoundingClientRect();
  if(cv.width!==rc.width*dpr){cv.width=rc.width*dpr;cv.height=rc.height*dpr;}
  W=cv.width;H=cv.height;ctx.setTransform(dpr,0,0,dpr,0,0);
  W=rc.width;H=rc.height;
  const hMax=Math.max(P.h1,P.bOn?P.h2:0);
  const top=Math.max(hMax+.9,2*P.r+1.1,3.5);
  gy=H-44;sc=Math.min((W-70)/15.5,(gy-26)/top);
  ctx.clearRect(0,0,W,H);

  /* 高度标尺 */
  ctx.strokeStyle='#39424e';ctx.fillStyle='#8a98a8';ctx.font='10px sans-serif';
  const step=top>7?2:1;
  ctx.beginPath();ctx.moveTo(SX(0),SY(0));ctx.lineTo(SX(0),SY(top));ctx.stroke();
  for(let y=0;y<=top+0.01;y+=step){
    ctx.beginPath();ctx.moveTo(SX(0)-4,SY(y));ctx.lineTo(SX(0)+4,SY(y));ctx.stroke();
    ctx.fillText(y+' m',SX(0)-30,SY(y)+3);
    if(y>0){ctx.save();ctx.strokeStyle='rgba(138,152,168,.12)';ctx.setLineDash([3,5]);
      ctx.beginPath();ctx.moveTo(SX(0),SY(y));ctx.lineTo(W-8,SY(y));ctx.stroke();ctx.restore();}
  }
  /* 地面 */
  ctx.strokeStyle='#4a5866';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(SX(-.5),SY(0));ctx.lineTo(SX(15.4),SY(0));ctx.stroke();

  /* 轨道 */
  ctx.lineWidth=5;ctx.strokeStyle='#5a6b7d';ctx.lineJoin='round';
  ctx.beginPath();const p0=trackPoint(0);ctx.moveTo(SX(p0.x),SY(p0.y));
  for(let s=0.15;s<=trackLen;s+=0.15){const p=trackPoint(s);ctx.lineTo(SX(p.x),SY(p.y));}
  const pe=trackPoint(trackLen);ctx.lineTo(SX(pe.x),SY(pe.y));ctx.stroke();
  /* 支柱 */
  ctx.save();ctx.strokeStyle='#39424e';ctx.lineWidth=2;ctx.setLineDash([4,4]);
  for(const px of[8-P.r,8,8+P.r]){ctx.beginPath();ctx.moveTo(SX(px),SY(px===8?P.r*2-2*P.r:P.r*2));
    ctx.lineTo(SX(px),SY(0));ctx.stroke();}
  ctx.beginPath();ctx.moveTo(SX(0),SY(hMax));ctx.lineTo(SX(0),SY(0));ctx.stroke();ctx.restore();
  /* 摩擦段高亮 */
  if(P.fricOn){ctx.save();ctx.strokeStyle='#ff7043';ctx.lineWidth=8;ctx.globalAlpha=.75;
    ctx.beginPath();ctx.moveTo(SX(9),SY(0));ctx.lineTo(SX(12),SY(0));ctx.stroke();ctx.restore();
    ctx.fillStyle='#ff7043';ctx.font='11px sans-serif';
    ctx.fillText('摩擦段 μ='+P.mu.toFixed(2),SX(9),SY(0)+24);}
  /* 圆环顶标记 */
  ctx.fillStyle='#8a98a8';ctx.font='10px sans-serif';
  const vt=Math.sqrt(P.g*P.r).toFixed(1);
  ctx.fillText('环顶需 v≥√(gr)='+vt+' m/s',SX(8+P.r+0.15),SY(2*P.r));
  /* 释放高度标记 */
  for(const c of carts){ctx.save();ctx.setLineDash([4,4]);ctx.strokeStyle=c.color;ctx.globalAlpha=.6;
    ctx.beginPath();ctx.moveTo(SX(-.3),SY(c.h));ctx.lineTo(SX(rampX(c.h)),SY(c.h));ctx.stroke();ctx.restore();
    ctx.fillStyle=c.color;ctx.fillText(c.name+' h='+c.h.toFixed(1)+'m',SX(-.3),SY(c.h)-4);}

  /* 轨迹 */
  for(const c of carts){if(c.trail.length<2)continue;
    ctx.save();ctx.strokeStyle=c.color;ctx.globalAlpha=.3;ctx.lineWidth=1.5;ctx.beginPath();
    ctx.moveTo(SX(c.trail[0].x),SY(c.trail[0].y));
    for(const t of c.trail)ctx.lineTo(SX(t.x),SY(t.y));ctx.stroke();ctx.restore();}

  /* 小车与矢量 */
  for(const c of carts){
    let ang=0;
    if(c.mode==='track'){const p=trackPoint(c.s),d=Math.sign(c.v||1);ang=Math.atan2(p.ty*d,p.tx*d);}
    else if(c.mode==='fly')ang=Math.atan2(c.vy,c.vx);
    else if(c.mode==='slide'&&c.v<0)ang=Math.PI;
    ctx.save();ctx.translate(SX(c.x),SY(c.y));ctx.rotate(-ang);
    ctx.fillStyle=c.color;ctx.strokeStyle='#0008';ctx.lineWidth=1;
    ctx.fillRect(-9,-11,18,8);ctx.strokeRect(-9,-11,18,8);
    ctx.beginPath();ctx.arc(-5,0,3,0,7);ctx.arc(5,0,3,0,7);ctx.fillStyle='#222';ctx.fill();
    ctx.restore();
    /* 速度矢量 */
    let vx=c.mode==='fly'?c.vx:(c.mode==='track'?trackPoint(c.s).tx*c.v:c.v),
        vy=c.mode==='fly'?c.vy:(c.mode==='track'?trackPoint(c.s).ty*c.v:0);
    const spd=Math.hypot(vx,vy);
    if(spd>0.05)arrow(c.x,c.y,vx*0.22,vy*0.22,'#3ddc84');
    /* 轨道压力 N（仅圆环内） */
    if(c.mode==='track'){const p=trackPoint(c.s);
      if(p.seg===2){const N=P.m*(c.v*c.v/P.r+P.g*Math.cos(p.psi));
        const ux=(8-c.x)/P.r,uy=(P.r-c.y)/P.r,L=Math.min(N*0.05,2.2);
        arrow(c.x,c.y,ux*L,uy*L,'#ff9800');
        ctx.fillStyle='#ff9800';ctx.font='10px sans-serif';
        ctx.fillText('N='+N.toFixed(1)+'N',SX(c.x)+10,SY(c.y)-14);}}
    /* 重力 */
    arrow(c.x,c.y,0,-0.7,'#9aa7b5');
    /* 速率标签 */
    ctx.fillStyle=c.color;ctx.font='bold 11px sans-serif';
    ctx.fillText(spd.toFixed(1)+' m/s',SX(c.x)+10,SY(c.y)-2);
  }
  /* 漂浮注释 */
  ctx.font='11px sans-serif';
  for(const n of notes){ctx.fillStyle=`rgba(255,213,79,${Math.min(1,n.ttl)})`;
    ctx.fillText(n.t,SX(n.x),SY(n.y)-(2.2-n.ttl)*14);}
  if(slowNow){ctx.fillStyle='#ffd54f';ctx.font='bold 13px sans-serif';
    ctx.fillText('🐢 慢放：过顶瞬间',W-140,26);}
}
function rampX(h){const hMax=Math.max(P.h1,P.bOn?P.h2:0);return 6*(1-h/hMax);}
function arrow(x,y,dx,dy,col){
  const x1=SX(x)+dx*sc,y1=SY(y)+dy*sc,x0=SX(x),y0=SY(y);
  ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
  const a=Math.atan2(y1-y0,x1-x0);
  ctx.beginPath();ctx.moveTo(x1,y1);
  ctx.lineTo(x1-8*Math.cos(a-0.4),y1-8*Math.sin(a-0.4));
  ctx.lineTo(x1-8*Math.cos(a+0.4),y1-8*Math.sin(a+0.4));ctx.fill();ctx.restore();
}

/* ---------- 面板刷新 ---------- */
function updatePanels(){
  const hMin=(2.5*P.r).toFixed(2);
  let t=`<b>过顶最小释放高度</b> h<sub>min</sub> = 2.5r = <span class="hl">${hMin} m</span><br>`;
  for(const c of carts){
    const ok=c.h>=2.5*P.r-1e-6;
    t+=`小车${c.name}：h=${c.h.toFixed(1)} m <span class="${ok?'ok':'bad'}">${ok?'✓ 能过顶':'✗ 会脱离'}</span><br>`;
  }
  t+=P.fricOn&&P.mu>0?'摩擦段开启：机械能→内能':'<span class="ok">无摩擦：机械能守恒</span>';
  $('tips').innerHTML=t;

  let L='';
  for(const c of carts){
    const e=energy(c),E0=Math.max(c.E0,1e-9),f=v=>Math.max(0,Math.min(1,v/E0));
    L+=`<div class="cart-head" style="color:${c.color}">小车${c.name} ${c.mode==='stopped'?'· 已停止':c.mode==='fly'?'· 抛体！':''}</div>`;
    for(const[nm,v,col]of[['动能 Ek',e.ke,'var(--ek)'],['重力势能 Ep',e.pe,'var(--ep)'],['摩擦耗散',e.ed,'var(--ed)']])
      L+=`<div class="bar-row"><span class="bar-name">${nm}</span><div class="bar-bg">
          <div class="bar-fill" style="background:${col};width:${f(v)*100}%"></div></div>
          <span class="bar-val">${v.toFixed(1)} J</span></div>`;
    L+=`<div style="text-align:right;color:var(--dim);font-size:11px">总 E₀=${c.E0.toFixed(1)} J</div>`;
  }
  $('legend').innerHTML=L||'<span class="dis">能量条形图</span>';
}

/* ---------- 交互 ---------- */
function bindR(id,vid,key,fmt){
  $(id).addEventListener('input',e=>{P[key]=+e.target.value;
    $(vid).textContent=fmt(P[key]);resetSim();});
}
bindR('h1','h1v','h1',v=>v.toFixed(1)+' m');
bindR('h2','h2v','h2',v=>v.toFixed(1)+' m');
bindR('r','rv','r',v=>v.toFixed(2)+' m');
bindR('m','mv','m',v=>v.toFixed(1)+' kg');
bindR('mu','muv','mu',v=>v.toFixed(2));
$('gSel').addEventListener('change',e=>{P.g=+e.target.value;resetSim();});
$('swB').addEventListener('click',e=>{P.bOn=!P.bOn;e.target.classList.toggle('on',P.bOn);
  $('h2').disabled=!P.bOn;$('h2').parentClass;$('h2').style.opacity=P.bOn?1:.4;resetSim();});
$('swF').addEventListener('click',e=>{P.fricOn=!P.fricOn;e.target.classList.toggle('on',P.fricOn);resetSim();});
$('swSlow').addEventListener('click',e=>{P.slow=!P.slow;e.target.classList.toggle('on',P.slow);});
$('btnPlay').addEventListener('click',()=>{P.playing=!P.playing;
  $('btnPlay').textContent=P.playing?'⏸ 暂停':'▶ 播放';});
$('btnReset').addEventListener('click',resetSim);
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('btnPlay').click();}});

resetSim();requestAnimationFrame(frame);
</script>
</body>
</html>
