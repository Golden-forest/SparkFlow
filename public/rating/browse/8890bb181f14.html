<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>薄膜干涉演示台</title>
  <style>
    :root {
      color-scheme: dark;
      /* Base design tokens (AppShell design-system; dark stage for optics) */
      --sim-bg: #070c19;
      --sim-surface: #0e1526;
      --sim-surface-soft: #131c31;
      --sim-text: #e8eefc;
      --sim-muted: #8fa0c0;
      --sim-border: #27334f;
      --sim-grid: #1b2540;
      --sim-accent: #37d3c8;
      --sim-accent-deep: #0fa8a0;
      --sim-accent-soft: #10333a;
      --sim-positive: #4ade8f;
      --sim-warning: #f5b04c;
      --sim-danger: #ff6b7d;
      --sim-radius-sm: 10px;
      --sim-radius-md: 16px;
      --sim-radius-lg: 22px;
      --sim-shadow: 0 16px 40px rgba(2, 6, 18, 0.55);
      --sim-space-1: 4px;
      --sim-space-2: 8px;
      --sim-space-3: 12px;
      --sim-space-4: 16px;
      --sim-space-5: 24px;
      --sim-space-6: 32px;
      /* Subject semantic colors (extend the base set) */
      --sim-ray1: #5ad1ff;
      --sim-ray2: #ffc857;
      --sim-pi: #ff5f7a;
      --sim-trans: #7ee787;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-width: 320px; color: var(--sim-text);
      background:
        radial-gradient(circle at 10% 0%, rgba(55, 211, 200, 0.07), transparent 30%),
        radial-gradient(circle at 94% 6%, rgba(255, 95, 122, 0.05), transparent 26%),
        var(--sim-bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible, svg:focus-visible { outline: 3px solid rgba(55, 211, 200, 0.5); outline-offset: 2px; }
    .app { width: min(1600px, 100%); height: 100vh; margin: 0 auto; padding: 14px 20px 12px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 50px; }
    .header h1 { margin: 0 0 4px; font-size: clamp(1.25rem, 1.9vw, 1.7rem); letter-spacing: -0.03em; line-height: 1.05; }
    .header p { margin: 0; color: var(--sim-muted); font-size: 0.85rem; }
    .status { border: 1px solid rgba(55, 211, 200, 0.3); border-radius: 999px; padding: 8px 14px; background: var(--sim-accent-soft); color: var(--sim-accent); font-weight: 750; white-space: nowrap; font-size: 13px; }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.66fr) minmax(370px, 0.8fr); gap: 12px; }
    .panel { background: rgba(14, 21, 38, 0.9); border: 1px solid rgba(60, 74, 105, 0.55); border-radius: var(--sim-radius-lg); box-shadow: var(--sim-shadow); }
    .stage-panel { display: flex; flex-direction: column; min-height: 0; padding: 12px; }
    .stage-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
    .stage-hint { font-size: 12px; color: var(--sim-muted); }
    .tabs { display: flex; gap: 8px; }
    .tab { padding: 8px 14px; border-radius: 999px; font-size: 13.5px; }
    .tab[aria-pressed="true"] { background: var(--sim-accent-soft); border-color: var(--sim-accent); color: var(--sim-accent); box-shadow: inset 0 0 0 1px rgba(55, 211, 200, 0.35); }
    #stageWrap { flex: 1; min-height: 0; display: flex; padding: 6px; border-radius: 18px; border: 1px solid rgba(90, 160, 255, 0.16);
      background: radial-gradient(900px 420px at 30% -8%, rgba(55, 211, 200, 0.07), transparent 55%), linear-gradient(160deg, #0b1326 0%, #070c19 60%, #0d0a1a 100%); }
    #stageSvg { width: 100%; height: 100%; min-height: 0; display: block; }
    .side { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: hidden; }
    .metrics { padding: 12px; }
    .readout-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .metric { padding: 9px 10px; border: 1px solid rgba(90, 160, 255, 0.14); border-radius: 12px; background: linear-gradient(145deg, #111a30, #0d1526); }
    .metric small { display: block; color: var(--sim-muted); font-size: 10.5px; margin-bottom: 3px; white-space: nowrap; }
    .metric strong { font-size: 0.98rem; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap; }
    .phase-panel, .chart-panel { padding: 10px 12px 6px; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 10px; }
    .panel-head h2 { margin: 0; font-size: 13px; color: #c4d2ee; }
    .panel-head span { font-size: 10.5px; color: var(--sim-muted); white-space: nowrap; }
    .phase-panel svg, .chart-panel svg { width: 100%; display: block; }
    .note-panel { padding: 12px 14px; flex: 1; min-height: 0; overflow: auto; }
    .insight { margin: 0 0 8px; padding: 10px 12px; border-left: 3px solid var(--sim-warning); border-radius: 0 10px 10px 0; background: rgba(245, 176, 76, 0.08); color: #f7cd8b; font-weight: 600; font-size: 13px; line-height: 1.55; }
    .model-note-text { margin: 0; color: var(--sim-muted); font-size: 11.5px; line-height: 1.6; }
    .controls { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 10px 14px; border-radius: 17px; }
    .actions { display: flex; gap: 8px; }
    .ctl-group { display: flex; gap: 18px; flex-wrap: wrap; }
    .ctl-group[hidden] { display: none; }
    .control { min-width: 200px; }
    .control label { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; font-weight: 700; margin-bottom: 4px; color: #c4d2ee; }
    .control output { color: var(--sim-muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 200px; accent-color: var(--sim-accent); }
    .dock-hint { font-size: 12px; color: var(--sim-muted); margin-left: auto; max-width: 320px; }
    button { border: 1px solid var(--sim-border); border-radius: var(--sim-radius-sm); padding: 9px 14px; color: var(--sim-text); background: var(--sim-surface-soft); cursor: pointer; font-weight: 700; transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease; }
    button:hover { border-color: #3d4d74; background: #182340; }
    button:active { transform: scale(0.97); }
    button.primary { border-color: #0d8f88; background: linear-gradient(135deg, #0fa8a0, #37d3c8); color: #03282b; box-shadow: 0 8px 20px rgba(15, 168, 160, 0.25); }
    /* stage SVG text and shapes */
    .sv-cap { font-size: 16px; font-weight: 650; fill: #d9e6ff; }
    .sv-lab { font-size: 12.5px; fill: #9db1d6; }
    .sv-sub { font-size: 11.5px; fill: #7787a8; }
    .sv-axis { font-size: 11px; fill: #7787a8; }
    .sv-knum { font-size: 11px; fill: #9fb3d9; font-weight: 600; }
    .sv-bubble { font-size: 12px; fill: #eaf2ff; font-weight: 700; }
    .sv-val { font-size: 13px; font-weight: 700; }
    .glass { fill: rgba(96, 133, 191, 0.16); stroke: rgba(122, 160, 220, 0.4); stroke-width: 1.5; }
    .gapfill { fill: rgba(10, 20, 40, 0.55); }
    .stripBg { fill: #04060c; stroke: rgba(90, 160, 255, 0.25); stroke-width: 1; }
    .ray { fill: none; stroke-width: 3; stroke-linecap: round; }
    .ray-incident { stroke: #e6eefc; }
    .ray1 { stroke: var(--sim-ray1); }
    .ray2 { stroke: var(--sim-ray2); }
    .rayT { stroke: var(--sim-trans); }
    .arrow { stroke: none; }
    .arr-incident { fill: #e6eefc; }
    .arr1 { fill: var(--sim-ray1); }
    .arr2 { fill: var(--sim-ray2); }
    .arrT { fill: var(--sim-trans); }
    .dotref { fill: #ffffff; }
    .pill-nopi rect { fill: rgba(60, 74, 105, 0.6); stroke: #5b6b8f; stroke-width: 1; }
    .pill-nopi text { fill: #c4d2ee; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .badge-pi circle { fill: var(--sim-pi); stroke: rgba(255, 95, 122, 0.35); stroke-width: 3; }
    .badge-pi text { fill: #2a060e; font-size: 12px; font-weight: 800; text-anchor: middle; }
    .soap-note { font-size: 12.5px; fill: #cfe0ff; font-weight: 650; }
    /* phase board */
    .ph-title { font-size: 13.5px; font-weight: 700; fill: #d9e6ff; }
    .ph-dphi { font-size: 13px; font-weight: 800; fill: var(--sim-accent); text-anchor: end; }
    .ph-name { font-size: 12.5px; font-weight: 700; }
    .ph-sub { font-size: 10px; fill: #7787a8; }
    .ph-divider { stroke: var(--sim-grid); stroke-width: 1; }
    .ph-formula { font-size: 11.5px; fill: #aebfe2; }
    .ph-formula2 { font-size: 11px; fill: #8fa0c0; }
    .ph-verdict { font-size: 13px; font-weight: 800; text-anchor: end; }
    .wave1 { fill: none; stroke: var(--sim-ray1); stroke-width: 2.6; stroke-linecap: round; }
    .wave2 { fill: none; stroke: var(--sim-ray2); stroke-width: 2.6; stroke-linecap: round; }
    .wave3 { fill: none; stroke: #f2f6ff; stroke-width: 3.2; stroke-linecap: round; filter: drop-shadow(0 0 6px rgba(240, 246, 255, 0.35)); }
    /* chart */
    .ch-title { font-size: 13px; font-weight: 700; fill: #d9e6ff; }
    .ch-axis { stroke: #4c5c7d; stroke-width: 1.2; }
    .ch-grid { stroke: var(--sim-grid); stroke-width: 1; }
    .ch-lab { font-size: 10.5px; fill: #7787a8; }
    .ch-curve { fill: none; stroke-width: 2.6; stroke-linecap: round; }
    .ch-vline { stroke: var(--sim-warning); stroke-width: 1.6; stroke-dasharray: 6 5; }
    .ch-vline-bad { stroke: var(--sim-danger); stroke-width: 1.4; stroke-dasharray: 4 5; }
    .ch-hline { stroke: #8fa0c0; stroke-width: 1.2; stroke-dasharray: 5 5; }
    #chDot { fill: var(--sim-accent); stroke: #04121a; stroke-width: 2; }
    #chMLine { stroke: var(--sim-accent); stroke-width: 1.6; stroke-dasharray: 5 4; }
    @media (max-width: 980px) {
      .app { height: auto; min-height: 100vh; overflow: visible; }
      .main { grid-template-columns: 1fr; }
      #stageWrap { aspect-ratio: 960 / 620; }
      .side { overflow: visible; }
      .readout-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .dock-hint { margin-left: 0; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <!-- AppShell shell: header / stage / evidence / insight / controls -->
  <div class="app" data-layout="scene-first" data-model-tier="analytic" id="simRoot">
    <header class="header" data-zone="header">
      <div>
        <h1>薄膜干涉：等厚条纹 · 增透膜 · 黑斑</h1>
        <p>把“半波损失”理解为反射时的相位突变（π）—— 一条条纹对应一个确定的厚度。</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">劈尖 · 已暂停</div>
    </header>

    <main class="main">
      <section class="panel stage-panel" data-zone="stage" aria-label="演示舞台">
        <div class="stage-top">
          <div class="tabs" role="tablist" aria-label="场景选择">
            <button class="tab" data-scene="wedge" aria-pressed="true" type="button">劈尖等厚条纹</button>
            <button class="tab" data-scene="coat" aria-pressed="false" type="button">增透膜</button>
            <button class="tab" data-scene="soap" aria-pressed="false" type="button">肥皂膜黑斑</button>
          </div>
          <span id="stageHint" class="stage-hint">点击或拖动条纹带移动探针（← → 微调）</span>
        </div>
        <div id="stageWrap">
          <svg id="stageSvg" viewBox="0 0 960 620" role="img" tabindex="0" aria-label="薄膜干涉演示舞台：空气劈尖、增透膜或肥皂膜">
            <g id="gWedge">
              <text class="sv-cap" x="16" y="26">① 空气劈尖 · 剖面（楔角放大约 2500 倍）</text>
              <text class="sv-lab" x="16" y="64">入射平行光（垂直照射）</text>
              <polygon class="glass" points="150,258 870,186 870,152 150,224"/>
              <rect class="glass" x="130" y="258" width="760" height="40"/>
              <polygon class="gapfill" points="150,258 870,186 870,258"/>
              <text class="sv-lab" x="866" y="146" text-anchor="end">上玻璃板 n=1.5</text>
              <text class="sv-lab" x="866" y="282" text-anchor="end">下玻璃板</text>
              <text class="sv-sub" x="700" y="232">空气劈尖（空气薄膜）</text>
              <text class="sv-sub" x="150" y="320" text-anchor="middle">接触棱边 t=0（0 级暗纹）</text>
              <text class="sv-sub" x="640" y="96">两束反射光错位画出（实际重合）</text>
              <line class="ray ray-incident" id="wdIncident" x1="430" y1="64" x2="430" y2="258"/>
              <line class="ray ray1" id="wdRay1" x1="430" y1="258" x2="396" y2="76"/>
              <line class="ray ray2" id="wdRay2Down" x1="430" y1="258" x2="430" y2="258"/>
              <line class="ray ray2" id="wdRay2Up" x1="430" y1="258" x2="464" y2="76"/>
              <polygon class="arrow arr-incident" id="wdArrInc" points="0,0 0,0 0,0"/>
              <polygon class="arrow arr1" id="wdArr1" points="0,0 0,0 0,0"/>
              <polygon class="arrow arr2" id="wdArr2" points="0,0 0,0 0,0"/>
              <circle class="dotref" id="wdDot1" r="4"/>
              <circle class="dotref" id="wdDot2" r="4"/>
              <g id="wdNum1"><circle r="9" fill="#0b1428" stroke="#5ad1ff" stroke-width="2"/><text y="3.5" text-anchor="middle" style="fill:#5ad1ff;font-size:11px;font-weight:800">1</text></g>
              <g id="wdNum2"><circle r="9" fill="#0b1428" stroke="#ffc857" stroke-width="2"/><text y="3.5" text-anchor="middle" style="fill:#ffc857;font-size:11px;font-weight:800">2</text></g>
              <g id="wBadge1" class="pill-nopi"><rect x="-28" y="-11" width="56" height="20" rx="9"/><text x="0" y="3.5">无 π</text></g>
              <g id="wBadge2" class="badge-pi"><circle r="11"/><text y="4">π</text></g>
              <text class="sv-sub" id="wBadge2Cap" text-anchor="middle">空气→玻璃：π</text>
              <text class="sv-lab" x="150" y="408">反射等厚条纹 —— 同一条纹上厚度相同</text>
              <text class="sv-sub" x="870" y="408" text-anchor="end">相邻暗纹厚度差 = λ/2</text>
              <rect class="stripBg" x="150" y="420" width="720" height="90"/>
              <g id="wedgeStrip"></g>
              <g id="wedgeTAxis"></g>
              <g id="wedgeKLabels"></g>
              <g id="wedgeXAxis"></g>
              <line id="wdProbeLine" x1="430" y1="414" x2="430" y2="548" style="stroke:#37d3c8;stroke-width:2.5"/>
              <polygon id="wdProbeKnob" points="423,566 437,566 430,578" style="fill:#37d3c8"/>
              <g id="wdBubble">
                <rect x="-84" y="352" width="168" height="40" rx="9" fill="#0d1830" fill-opacity="0.93" stroke="rgba(55,211,200,0.5)"/>
                <text id="wdBubbleT1" class="sv-bubble" x="0" y="368" text-anchor="middle"></text>
                <text id="wdBubbleT2" x="0" y="384" text-anchor="middle" style="fill:#bcd0f2;font-size:11.5px"></text>
              </g>
            </g>

            <g id="gCoat" style="display:none">
              <text class="sv-cap" x="16" y="26">② 增透膜：空气 / 膜 / 玻璃（厚度放大显示 · λ=550 nm · 垂直入射）</text>
              <rect x="300" y="60" width="570" height="90" fill="rgba(20,32,58,0.35)" stroke="rgba(90,160,255,0.2)"/>
              <text class="sv-lab" x="310" y="78">空气 n₀=1.00</text>
              <rect id="coatFilmRect" x="300" y="160" width="570" height="60" fill="rgba(55,211,200,0.13)" stroke="rgba(55,211,200,0.45)" stroke-width="1.5"/>
              <text id="coatFilmLabel" class="sv-lab" x="860" y="196" text-anchor="end"></text>
              <rect id="coatGlassRect" x="300" y="220" width="570" height="228" fill="rgba(96,133,191,0.14)" stroke="rgba(122,160,220,0.35)"/>
              <text class="sv-lab" x="860" y="442" text-anchor="end">玻璃 n₂=1.50</text>
              <text class="sv-lab" x="90" y="206">入射：空气 → 膜 → 玻璃</text>
              <text class="sv-sub" id="coatFace1" x="90" y="238"></text>
              <text class="sv-sub" id="coatFace2" x="90" y="270"></text>
              <text class="sv-lab" id="coatSummary" x="90" y="310" style="fill:#f7cd8b"></text>
              <line class="ray ray-incident" id="ctIncident" x1="414" y1="20" x2="460" y2="150"/>
              <line class="ray ray1" id="ctRay1" x1="460" y1="150" x2="506" y2="20"/>
              <line class="ray ray2" id="ctRay2Down" x1="460" y1="150" x2="516" y2="310"/>
              <line class="ray ray2" id="ctRay2Up" x1="516" y1="310" x2="618" y2="20"/>
              <line class="ray rayT" id="ctTrans" x1="516" y1="310" x2="588" y2="596" stroke-opacity="0.8"/>
              <polygon class="arrow arr-incident" id="ctArrInc" points="0,0 0,0 0,0"/>
              <polygon class="arrow arr1" id="ctArr1" points="0,0 0,0 0,0"/>
              <polygon class="arrow arr2" id="ctArr2" points="0,0 0,0 0,0"/>
              <polygon class="arrow arr2" id="ctArr2Up" points="0,0 0,0 0,0"/>
              <polygon class="arrow arrT" id="ctArrT" points="0,0 0,0 0,0"/>
              <circle class="dotref" cx="460" cy="160" r="4"/>
              <circle class="dotref" id="ctDot2" r="4"/>
              <g id="ctBadge1" class="badge-pi" transform="translate(438,132)"><circle r="11"/><text y="4">π</text></g>
              <g id="ctBadge2" class="badge-pi"><circle r="11"/><text y="4">π</text></g>
              <g id="ctNum1"><circle r="9" fill="#0b1428" stroke="#5ad1ff" stroke-width="2"/><text y="3.5" text-anchor="middle" style="fill:#5ad1ff;font-size:11px;font-weight:800">1</text></g>
              <g id="ctNum2"><circle r="9" fill="#0b1428" stroke="#ffc857" stroke-width="2"/><text y="3.5" text-anchor="middle" style="fill:#ffc857;font-size:11px;font-weight:800">2</text></g>
              <text class="sv-sub" x="740" y="86" text-anchor="middle">空气中 λ = 550 nm</text>
              <polyline id="ctWaveAir" fill="none" stroke="#c9d8f5" stroke-width="2"/>
              <text class="sv-sub" id="ctWaveFilmLab" x="740" y="0" text-anchor="middle" style="fill:#37d3c8"></text>
              <polyline id="ctWaveFilm" fill="none" stroke="#37d3c8" stroke-width="2"/>
              <text class="sv-lab" x="90" y="496">反射光强 R</text>
              <rect x="180" y="484" width="650" height="18" rx="9" fill="#0b1322" stroke="rgba(90,160,255,0.2)"/>
              <rect id="ctRefBar" x="180" y="484" width="0" height="18" rx="9" fill="rgba(90,209,255,0.85)"/>
              <text id="ctRefVal" class="sv-val" x="822" y="497" text-anchor="end" style="fill:#5ad1ff"></text>
              <text class="sv-lab" x="90" y="550">透射光强 T</text>
              <rect x="180" y="538" width="650" height="18" rx="9" fill="#0b1322" stroke="rgba(90,160,255,0.2)"/>
              <rect id="ctTransBar" x="180" y="538" width="0" height="18" rx="9" fill="rgba(126,231,135,0.75)"/>
              <text id="ctTransVal" class="sv-val" x="822" y="551" text-anchor="end" style="fill:#7ee787"></text>
              <text class="sv-sub" x="90" y="586">无吸收：R + T = 100% —— 反射相消时透射增强，这就是“增透”</text>
            </g>

            <g id="gSoap" style="display:none">
              <text class="sv-cap" x="16" y="26">③ 肥皂膜变薄 · 白光垂直照射（颜色 = 厚度）</text>
              <rect id="soapBorder" x="250" y="56" width="380" height="504" fill="none" stroke="rgba(200,220,255,0.35)" stroke-width="1.5" rx="10"/>
              <g id="soapRows"></g>
              <text class="sv-sub" x="238" y="80" text-anchor="end">顶部最薄</text>
              <text class="soap-note" id="soapTopT" x="16" y="104"></text>
              <text class="sv-sub" id="soapState" x="16" y="128"></text>
              <line id="soapBlackLine" x1="250" y1="56" x2="630" y2="56" style="stroke:#f5b04c;stroke-width:1.6;stroke-dasharray:6 4"/>
              <text class="sv-lab" id="soapBlackText" x="238" y="60" text-anchor="end" style="fill:#f5b04c">黑斑（反射相消）</text>
              <g id="soapGrid"></g>
              <polyline id="soapTCurve" fill="none" stroke="#37d3c8" stroke-width="2.4"/>
              <text class="sv-sub" x="775" y="46" text-anchor="middle">厚度分布 t / nm</text>
              <g id="soapAxisLabels"></g>
              <line id="soapSampleLine" x1="250" y1="150" x2="630" y2="150" style="stroke:#e8eefc;stroke-width:1.2;stroke-dasharray:5 5"/>

    <section class="panel controls" data-zone="controls" aria-label="仿真控制">
      <div class="actions">
        <button id="startBtn" class="primary" type="button">▶ 开始</button>
        <button id="pauseBtn" type="button">⏸ 暂停</button>
        <button id="resetBtn" type="button">↻ 重置</button>
      </div>
      <div class="ctl-group" id="ctlWedge">
        <div class="control"><label for="thetaInput">劈尖角 θ <output id="thetaOutput"></output></label><input id="thetaInput" type="range" min="0.1" max="0.8" step="0.01" value="0.25"/></div>
        <div class="control"><label for="lambdaInput">波长 λ <output id="lambdaOutput"></output></label><input id="lambdaInput" type="range" min="400" max="700" step="5" value="550"/></div>
      </div>
      <div class="ctl-group" id="ctlCoat" hidden>
        <div class="control"><label for="coatTInput">膜厚 t <output id="coatTOutput"></output></label><input id="coatTInput" type="range" min="0" max="300" step="1" value="20"/></div>
        <div class="control"><label for="coatNInput">膜折射率 n₁ <output id="coatNOutput"></output></label><input id="coatNInput" type="range" min="1.15" max="2.45" step="0.01" value="1.38"/></div>
      </div>
      <div class="ctl-group" id="ctlSoap" hidden>
        <div class="control"><label for="speedInput">变薄速度 <output id="speedOutput"></output></label><input id="speedInput" type="range" min="0.25" max="3" step="0.05" value="1"/></div>
        <div class="control"><label for="soapTInput">顶部厚度 <output id="soapTOutput"></output></label><input id="soapTInput" type="range" min="0" max="140" step="1" value="140"/></div>
      </div>
      <span class="dock-hint" id="dockHint">每条暗纹 = 一个确定厚度 t = kλ/2</span>
    </section>
  </div>
  <script>
  (() => {
    "use strict";
    /* ---------------- helpers ---------------- */
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const clamp01 = v => Math.max(0, Math.min(1, v));
    const TAU = Math.PI * 2;
    const normPi = a => { let d = a % TAU; if (d < 0) d += TAU; return d / Math.PI; };

    /* ---------------- physics kernel (pure, DOM-free) ----------------
       Signed Fresnel amplitudes r = (ni - nj)/(ni + nj):
       a NEGATIVE r means reflection off the optically denser medium,
       i.e. the reflected wave flips phase by pi (the "half-wave loss").
       Two-beam reflected intensity: R = r1^2 + r2^2 + 2 r1 r2 cos(4 pi n t / lambda). */
    const fresnel = (ni, nj) => (ni - nj) / (ni + nj);
    function filmReflectance(nTop, nf, nBottom, tNm, lamNm) {
      const r1 = fresnel(nTop, nf), r2 = fresnel(nf, nBottom);
      return r1 * r1 + r2 * r2 + 2 * r1 * r2 * Math.cos(4 * Math.PI * nf * tNm / lamNm);
    }
    function airyReflectance(nTop, nf, nBottom, tNm, lamNm) { // exact multibeam oracle
      const r1 = fresnel(nTop, nf), r2 = fresnel(nf, nBottom);
      const ph = 4 * Math.PI * nf * tNm / lamNm, c = Math.cos(ph), s = Math.sin(ph);
      const nRe = r1 + r2 * c, nIm = r2 * s, dRe = 1 + r1 * r2 * c, dIm = r1 * r2 * s;
      const den = dRe * dRe + dIm * dIm;
      const re = (nRe * dRe + nIm * dIm) / den, im = (nIm * dRe - nRe * dIm) / den;
      return re * re + im * im;
    }
    function phaseInfo(nTop, nf, nBottom, tNm, lamNm) {
      const r1 = fresnel(nTop, nf), r2 = fresnel(nf, nBottom);
      const inv1 = r1 < 0, inv2 = r2 < 0;               // sign encodes the pi flip
      const path = 4 * Math.PI * nf * tNm / lamNm;      // round-trip phase inside the film
      const dphi = path + ((inv1 !== inv2) ? Math.PI : 0);
      return { r1, r2, inv1, inv2, path, dphi, R: filmReflectance(nTop, nf, nBottom, tNm, lamNm) };
    }
    const soapThickness = (u, tau) => // u: 0 top -> 1 bottom; closed-form drainage profile (nm)
      Math.max(0, 140 * Math.exp(-tau / 8) + 460 * Math.exp(-tau / 22) * Math.pow(u, 1.6));
    const soapTop = tau => 140 * Math.exp(-tau / 8);

    /* ---------------- color pipeline: CIE 1931 multi-lobe fit -> sRGB ---------------- */
    function gauss2(x, mu, s1, s2) { const s = x < mu ? s1 : s2, t = (x - mu) / s; return Math.exp(-0.5 * t * t); }
    function cieFit(lam) {
      const x = Math.max(0, 1.056 * gauss2(lam, 599.8, 37.9, 31.0) + 0.362 * gauss2(lam, 442.0, 16.0, 26.7) - 0.065 * gauss2(lam, 501.1, 20.4, 26.2));
      const y = Math.max(0, 0.821 * gauss2(lam, 568.8, 46.9, 40.5) + 0.286 * gauss2(lam, 530.9, 16.3, 31.1));
      const z = Math.max(0, 1.217 * gauss2(lam, 437.0, 11.8, 36.0) + 0.681 * gauss2(lam, 459.0, 26.0, 13.8));
      return [x, y, z];
    }
    const LAMS = []; for (let l = 380; l <= 700; l += 5) LAMS.push(l);
    const XB = [], YB = [], ZB = [];
    for (const l of LAMS) { const c = cieFit(l); XB.push(c[0]); YB.push(c[1]); ZB.push(c[2]); }
    const DL = 5, YW = YB.reduce((s, v) => s + v, 0) * DL;
    function spectrumXYZ(Rfn) {
      let X = 0, Y = 0, Z = 0;
      for (let i = 0; i < LAMS.length; i++) { const R = Rfn(LAMS[i]); X += R * XB[i]; Y += R * YB[i]; Z += R * ZB[i]; }
      return [X * DL, Y * DL, Z * DL];
    }
    const linRGB = (X, Y, Z) => [
      3.2406 * X - 1.5372 * Y - 0.4986 * Z,
      -0.9689 * X + 1.8758 * Y + 0.0415 * Z,
      0.0557 * X - 0.2040 * Y + 1.0570 * Z
    ];
    const srgbGamma = c => c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
    function monoRGB(lam) { // saturated display color for monochromatic fringes
      const [x, y, z] = cieFit(lam);
      const [r, g, b] = linRGB(x, y, z);
      const m = Math.max(r, g, b, 1e-9);
      return [srgbGamma(clamp01(r / m)), srgbGamma(clamp01(g / m)), srgbGamma(clamp01(b / m))];
    }
    const N_SOAP = 1.33, R_SOAP = fresnel(1, N_SOAP), K_SOAP = 4 * R_SOAP * R_SOAP;
    let SOAP_SCALE = 1; // display brightness normalization (documented teaching amplification)
    {
      let maxY = 0;
      for (let t = 0; t <= 800; t += 2) {
        const Y = spectrumXYZ(l => K_SOAP * Math.pow(Math.sin(TAU * N_SOAP * t / l), 2))[1] / YW;
        if (Y > maxY) maxY = Y;
      }
      SOAP_SCALE = 0.88 / Math.max(maxY, 1e-9);
    }
    function soapColorLinear(tNm) {
      if (!(tNm > 20)) return [0.016, 0.023, 0.045];
      const [X, Y, Z] = spectrumXYZ(l => K_SOAP * Math.pow(Math.sin(TAU * N_SOAP * tNm / l), 2));
      const [r, g, b] = linRGB(X / YW * SOAP_SCALE, Y / YW * SOAP_SCALE, Z / YW * SOAP_SCALE);
      return [clamp01(srgbGamma(r)), clamp01(srgbGamma(g)), clamp01(srgbGamma(b))];
    }
    const cssRGB = rgb => "rgb(" + Math.round(rgb[0] * 255) + "," + Math.round(rgb[1] * 255) + "," + Math.round(rgb[2] * 255) + ")";

    /* ---------------- model checks (analytic oracles; tolerances fixed in advance) ---------------- */
    function runModelChecks() {
      const out = [];
      const add = (name, pass, expected, actual, tolerance) =>
        out.push({ name: name, pass: !!pass, expected: String(expected), actual: String(actual), tolerance: String(tolerance) });
      const L = 550;
      { // ordinary: dark fringe positions
        let worst = 0;
        for (let k = 0; k <= 6; k++) worst = Math.max(worst, filmReflectance(1.5, 1, 1.5, k * L / 2, L));
        add("wedge: 暗纹位置 t=kλ/2 处 R=0（含棱边 t=0）", worst < 1e-9, "R < 1e-9", worst.toExponential(3), "<1e-9");
      }
      { // ordinary: bright fringe positions
        let worst = 0;
        for (let k = 0; k <= 5; k++) worst = Math.max(worst, Math.abs(filmReflectance(1.5, 1, 1.5, (k + 0.5) * L / 2, L) - 0.16));
        add("wedge: 亮纹位置 t=(k+½)λ/2 处 R=4r²=0.16", worst < 1e-9, "0.16 ± 1e-9", (0.16 + worst).toFixed(10), "<1e-9");
      }
      { // boundary/threshold: numeric fringe spacing vs lambda/(2 theta)
        const lam = 589, th = 0.32e-3, N = 5000, dx = 10 / N, v = [];
        for (let i = 0; i <= N; i++) v.push(filmReflectance(1.5, 1, 1.5, th * (i * dx) * 1e6, lam));
        const xs = [];
        for (let i = 1; i < N; i++) if (v[i] < v[i - 1] && v[i] < v[i + 1]) {
          const d = v[i - 1] - 2 * v[i] + v[i + 1];
          const off = d !== 0 ? 0.5 * (v[i - 1] - v[i + 1]) / d : 0;
          xs.push((i + off) * dx);
        }
        const gaps = []; for (let i = 1; i < xs.length; i++) gaps.push(xs[i] - xs[i - 1]);
        const mean = gaps.reduce((s, g) => s + g, 0) / gaps.length;
        const theory = lam * 1e-6 / (2 * th); // nm -> mm over dimensionless angle
        const rel = Math.abs(mean - theory) / theory;
        add("wedge: 数值暗纹间距 = λ/(2θ)", xs.length >= 5 && rel < 0.002, theory.toFixed(5) + " mm (" + xs.length + " 个极小)", mean.toFixed(5) + " mm", "相对 <0.2%");
      }
      { // ordinary: MgF2 minimum location (scan the first period only: all minima are equally deep)
        const nf = 1.38; let best = 0, bv = Infinity;
        for (let t = 0; t <= 150; t += 0.25) { const R = filmReflectance(1, nf, 1.5, t, L); if (R < bv) { bv = R; best = t; } }
        const ts = L / (4 * nf);
        add("coating(MgF₂): 反射率极小在 λ/(4n)（膜内波长的 1/4）", Math.abs(best - ts) < 0.5, "λ/(4n) = " + ts.toFixed(2) + " nm", best.toFixed(2) + " nm", "±0.5 nm");
      }
      { // two-beam approximation vs exact multibeam Airy at the minimum
        const nf = 1.38, ts = L / (4 * nf);
        const two = filmReflectance(1, nf, 1.5, ts, L), air = airyReflectance(1, nf, 1.5, ts, L);
        add("coating: 双光束 Rmin 与精确 Airy 一致（弱反射）", Math.abs(two - air) < 0.002, "|ΔR| < 0.002", Math.abs(two - air).toExponential(3), "绝对 <0.002");
      }
      { // opposite regime: film index above the substrate flips the condition
        const nf = 2.35; let best = 5, bv = Infinity;
        for (let t = 5; t <= 300.0001; t += 0.25) { const R = filmReflectance(1, nf, 1.5, t, L); if (R < bv) { bv = R; best = t; } }
        const th2 = L / (2 * nf);
        add("coating(ZnS, n₁>玻璃): 最近极小移到 λ/(2n)", Math.abs(best - th2) < 1, "λ/(2n) = " + th2.toFixed(2) + " nm", best.toFixed(2) + " nm", "±1 nm");
        const tq = L / (4 * nf), Rq = filmReflectance(1, nf, 1.5, tq, L);
        const isMax = Rq > filmReflectance(1, nf, 1.5, tq - 10, L) && Rq > filmReflectance(1, nf, 1.5, tq + 10, L);
        add("coating(ZnS): λ/4 厚度反而成为反射极大（反例防死记）", isMax, "局部极大", "R(λ/4n) = " + (Rq * 100).toFixed(1) + "%", "严格");
      }
      { // boundary: zero-thickness film must equal the bare substrate (Airy)
        const bare = Math.pow(fresnel(1, 1.5), 2);
        const R0 = airyReflectance(1, 1.38, 1.5, 0, L);
        add("Airy: 零厚度膜 = 裸玻璃反射率 4%", Math.abs(R0 - bare) < 1e-9, bare.toFixed(6), R0.toFixed(6), "<1e-9");
      }
      { // soap black limit
        let w0 = 0, w20 = 0;
        for (const lam of [610, 550, 465]) {
          w0 = Math.max(w0, filmReflectance(1, 1.33, 1, 0, lam));
          w20 = Math.max(w20, filmReflectance(1, 1.33, 1, 20, lam));
        }
        add("soap: R(0)=0 且 t≤20nm 时红绿蓝 R<1.1%（黑斑）", w0 < 1e-12 && w20 < 0.011, "R(0)=0; R(20nm)<0.011", "R(0)=" + w0.toExponential(2) + ", R(20nm)=" + (w20 * 100).toFixed(2) + "%", "如述");
      }
      { // monotonicity toward the first maximum
        let ok = true, prev = -1;
        const tm = L / (4 * 1.33);
        for (let i = 0; i <= 20; i++) { const R = filmReflectance(1, 1.33, 1, tm * i / 20, L); if (R < prev - 1e-12) ok = false; prev = R; }
        add("soap: 从 0 到首个极大 λ/4n 反射率单调递增", ok, "单调不减", ok ? "通过" : "失败", "严格");
      }
      { // phase bookkeeping identity across six index stacks
        const stacks = [[1.5, 1, 1.5], [1, 1.38, 1.5], [1, 2.35, 1.5], [1, 1.33, 1], [1, 1.2, 1.8], [1, 1.8, 1.2]];
        let worst = 0;
        for (const s of stacks) {
          const a = s[0], b = s[1], c = s[2];
          const r1 = fresnel(a, b), r2 = fresnel(b, c);
          worst = Math.max(worst, Math.abs(filmReflectance(a, b, c, 0, L) - (r1 + r2) * (r1 + r2)));
          worst = Math.max(worst, Math.abs(filmReflectance(a, b, c, L / (4 * b), L) - (r1 - r2) * (r1 - r2)));
        }
        add("相位记账: R(0)=(r₁+r₂)² 且 R(λ/4n)=(r₁−r₂)²（6 种折射率组合）", worst < 1e-12, "恒等式", worst.toExponential(3), "<1e-12");
      }
      { // drainage: closed form, step invariance, limit
        const direct = soapThickness(0.3, 12.34);
        let tau = 0; for (let i = 0; i < 1000; i++) tau += 12.34 / 1000;
        const stepped = soapThickness(0.3, tau);
        const ok = Math.abs(direct - stepped) < 1e-9 && soapThickness(0.9, 500) < 1e-6;
        add("soap 排水: 闭式厚度分布与 τ 步进一致，且 τ→大 时厚度→0", ok, "|Δt|<1e-9, t(500)≈0", "Δ=" + Math.abs(direct - stepped).toExponential(2), "如述");
      }
      { // color pipeline: equal-energy white round trip
        const xyz = spectrumXYZ(() => 1);
        const rgb = linRGB(xyz[0] / xyz[1], 1, xyz[2] / xyz[1]).map(srgbGamma).map(clamp01);
        const dev = Math.max(Math.abs(rgb[0] - 1), Math.abs(rgb[1] - 1), Math.abs(rgb[2] - 1));
        add("颜色管线: 等能白光 → sRGB (1,1,1)", dev < 0.06, "每通道偏差 ≤0.06（含等能白 vs sRGB D65 白点的固有差异）", dev.toFixed(4), "0.06");
      }
      { // color pipeline: bounded, finite outputs everywhere
        let ok = true;
        for (let t = 0; t <= 1000; t += 7) {
          const c = soapColorLinear(t);
          for (const v of c) if (!Number.isFinite(v) || v < 0 || v > 1) ok = false;
        }
        for (let l = 400; l <= 700; l += 10) {
          const c = monoRGB(l);
          for (const v of c) if (!Number.isFinite(v) || v < 0 || v > 1) ok = false;
        }
        add("颜色管线: 全部厚度/波长颜色有限且在 [0,1]", ok, "有限、有界", ok ? "通过" : "失败", "严格");
      }
      return out;
    }

    /* ---------------- authoritative state ---------------- */
    const parameterSchema = [
      { key: "thetaMrad", label: "劈尖角 θ", type: "slider", min: 0.1, max: 0.8, step: 0.01, default: 0.25, unit: "mrad", scene: "wedge" },
      { key: "lambdaW", label: "波长 λ", type: "slider", min: 400, max: 700, step: 5, default: 550, unit: "nm", scene: "wedge" },
      { key: "coatT", label: "膜厚 t", type: "slider", min: 0, max: 300, step: 1, default: 20, unit: "nm", scene: "coat" },
      { key: "coatN", label: "膜折射率 n₁", type: "slider", min: 1.15, max: 2.45, step: 0.01, default: 1.38, unit: "", scene: "coat" },
      { key: "soapSpeed", label: "排水速度", type: "slider", min: 0.25, max: 3, step: 0.05, default: 1, unit: "×", scene: "soap" },
      { key: "soapTopT", label: "顶部膜厚", type: "slider", min: 0, max: 140, step: 1, default: 140, unit: "nm", scene: "soap" }
    ];
    const state = {
      scene: "wedge", running: false, clock: 0, tau: 0, lastTs: null,
      probePx: 430, sampleU: 0.2,
      p: { thetaMrad: 0.25, lambdaW: 550, coatT: 20, coatN: 1.38, soapSpeed: 1 }
    };
    let els = null;
    let dirty = { wedge: true, coat: true, soap: true, chart: true, phase: true };
    const mk = (tag, attrs) => {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      return el;
    };
    const setLine = (id, x1, y1, x2, y2) => {
      const e = els[id];
      e.setAttribute("x1", x1); e.setAttribute("y1", y1);
      e.setAttribute("x2", x2); e.setAttribute("y2", y2);
    };
    const arrowPoly = (id, x1, y1, x2, y2) => { // arrowhead at (x2,y2) pointing along the ray
      const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
      const bx = x2 - ux * 9, by = y2 - uy * 9;
      els[id].setAttribute("points", x2.toFixed(1) + "," + y2.toFixed(1) + " " +
        (bx - uy * 4).toFixed(1) + "," + (by + ux * 4).toFixed(1) + " " +
        (bx + uy * 4).toFixed(1) + "," + (by - ux * 4).toFixed(1));
    };

    /* ---------------- wedge geometry ---------------- */
    const WD = {
      x0: 150, x1: 870, yTop: 152, yBot: 258,      // glass wedge faces
      stripX: 150, stripW: 720, stripY: 420, stripH: 90,
      N: 360, lamNm: 550,
      xToT: x => {                                   // film thickness (nm) at stage x (wedge drawn as gap between plates)
        const u = (x - WD.x0) / (WD.x1 - WD.x0);
        const dxMm = u * 10;                         // stage 720px = 10 mm
        return state.p.thetaMrad * 1e-3 * dxMm * 1e6; // theta rad * x mm -> nm
      },
      tMaxNm: () => state.p.thetaMrad * 1e-3 * 10 * 1e6
    };

    /* ---------------- static builders ---------------- */
    function buildWedgeStatics() {
      for (let i = 0; i < WD.N; i++) {
        const w = WD.stripW / WD.N;
        els.wedgeStrip.appendChild(mk("rect", { x: WD.stripX + i * w, y: WD.stripY, width: w + 0.5, height: WD.stripH }));
      }
      els.wedgeTAxis.appendChild(mk("line", { x1: WD.stripX, y1: WD.stripY + WD.stripH + 14, x2: WD.stripX + WD.stripW, y2: WD.stripY + WD.stripH + 14, class: "sv-axis" }));
      els.wedgeTAxis.appendChild(mk("line", { x1: WD.stripX, y1: WD.stripY + WD.stripH + 14, x2: WD.stripX, y2: WD.stripY + WD.stripH + 2, class: "sv-axis" }));
      els.wedgeXAxis.appendChild(mk("line", { x1: WD.stripX, y1: WD.stripY - 12, x2: WD.stripX + WD.stripW, y2: WD.stripY - 12, class: "sv-axis" }));
    }
    function buildSoapStatics() {
      const N = 252;
      for (let i = 0; i < N; i++) {
        const y = 66 + i * (494 - 66) / N;
        els.soapRows.appendChild(mk("rect", { x: 252, y: y, width: 376, height: (494 - 66) / N + 0.6, rx: 1 }));
      }
      for (let g = 0; g <= 4; g++) {

    /* ---------------- rebuilds (dirty-flag driven) ---------------- */
    function rebuildWedge() {
      const lam = state.p.lambdaW, mono = monoRGB(lam), c = cssRGB(mono);
      const tHalf = lam / 2, kMax = Math.floor(WD.tMaxNm() / tHalf);
      const rects = els.wedgeStrip.children;
      for (let i = 0; i < WD.N; i++) {
        const x = WD.stripX + (i + 0.5) * WD.stripW / WD.N;
        const R = filmReflectance(1.5, 1, 1.5, WD.xToT(x), lam);
        const op = 0.04 + 0.96 * clamp01(R / 0.16);
        const r = rects[i];
        r.setAttribute("fill", c);
        r.setAttribute("fill-opacity", op.toFixed(3));
      }
      while (els.wedgeTAxis.children.length > 2) els.wedgeTAxis.removeChild(els.wedgeTAxis.lastChild);
      for (let k = 0; k <= kMax && k <= 40; k++) {
        const xk = WD.x0 + (k * tHalf / WD.tMaxNm()) * (WD.x1 - WD.x0);
        if (xk > WD.x1 + 1) break;
        const tk = mk("line", { x1: xk, y1: WD.stripY - 12, x2: xk, y2: WD.stripY + WD.stripH + 14, class: "ch-grid" });
        els.wedgeTAxis.appendChild(tk);
        const kl = mk("text", { x: xk, y: WD.stripY + WD.stripH + 32, class: "sv-knum", "text-anchor": "middle" });
        kl.textContent = "k=" + k;
        els.wedgeKLabels.appendChild(kl);
        const xl = mk("text", { x: xk, y: WD.stripY - 18, class: "sv-sub", "text-anchor": "middle" });
        xl.textContent = (k * tHalf / 1000).toFixed(2) + " μm";
        els.wedgeKLabels.appendChild(xl);
      }
      while (els.wedgeKLabels.children.length > (Math.min(kMax, 40) + 1) * 2) els.wedgeKLabels.removeChild(els.wedgeKLabels.lastChild);
    }
    const CH = { x0: 46, x1: 392, y0: 18, y1: 152 };
    let chartYMax = 1, chartTMax = 1;
    const chX = t => CH.x0 + clamp01(t / chartTMax) * (CH.x1 - CH.x0);
    const chY = R => CH.y1 - clamp01(R / chartYMax) * (CH.y1 - CH.y0);
    function rebuildChart() {
      const g = els.chRoot;
      while (g.firstChild) g.removeChild(g.firstChild);
      const Rfn = t =>
        state.scene === "wedge" ? filmReflectance(1.5, 1, 1.5, t, state.p.lambdaW)
        : state.scene === "coat" ? filmReflectance(1, state.p.coatN, 1.5, t, state.p.lambdaW)
        : Math.max(filmReflectance(1, N_SOAP, 1, t, 610), filmReflectance(1, N_SOAP, 1, t, 550), filmReflectance(1, N_SOAP, 1, t, 465));
      chartTMax = state.scene === "wedge" ? WD.tMaxNm() : state.scene === "coat" ? 300 : 320;
      chartYMax = state.scene === "wedge" ? 0.16 : state.scene === "coat" ? 0.30 : 0.044;
      els.chTitle.textContent = state.scene === "soap" ? "反射率 R – 膜厚 t（红绿蓝）" : "反射率 R – 厚度 t";
      els.chSub.textContent = state.scene === "wedge" ? "暗纹处 R=0：相邻暗纹厚度差 λ/2"
        : state.scene === "coat" ? "✓ λ/(4n₁) 极小 · ✗ λ/4 是常见误算 · 点线=裸玻璃 4%"
        : "三色 R 同时→0 的厚度（t≲20nm）就是黑斑";
      for (const f of [0.25, 0.5, 0.75]) g.appendChild(mk("line", { x1: CH.x0, y1: chY(chartYMax * f), x2: CH.x1, y2: chY(chartYMax * f), class: "ch-grid" }));
      g.appendChild(mk("line", { x1: CH.x0, y1: CH.y0, x2: CH.x0, y2: CH.y1, class: "ch-axis" }));
      g.appendChild(mk("line", { x1: CH.x0, y1: CH.y1, x2: CH.x1, y2: CH.y1, class: "ch-axis" }));
      const tick = (x, y, txt, anchor) => {
        const e = mk("text", { x: x, y: y, class: "ch-lab", "text-anchor": anchor || "start" });
        e.textContent = txt; g.appendChild(e); return e;
      };
      tick(CH.x0 - 4, CH.y0 + 4, (chartYMax * 100).toFixed(chartYMax < 0.05 ? 1 : 0) + "%", "end");
      tick(CH.x0 - 4, CH.y1 + 3, "0", "end");
      tick(CH.x1, CH.y1 + 14, String(Math.round(chartTMax)), "end");
      tick(CH.x1, CH.y1 + 28, "t / nm", "end");
      if (state.scene === "coat") {
        const q = state.p.lambdaW / (4 * state.p.coatN), qBad = state.p.lambdaW / 4;
        g.appendChild(mk("line", { x1: chX(q), y1: CH.y0, x2: chX(q), y2: CH.y1, class: "ch-vline" }));
        tick(chX(q) + 4, CH.y0 + 10, "λ/(4n₁) ✓");
        g.appendChild(mk("line", { x1: chX(qBad), y1: CH.y0, x2: chX(qBad), y2: CH.y1, class: "ch-vline-bad" }));
        tick(chX(qBad) + 4, CH.y0 + 22, "λ/4 ✗");
        g.appendChild(mk("line", { x1: CH.x0, y1: chY(0.04), x2: CH.x1, y2: chY(0.04), class: "ch-hline" }));
        tick(CH.x1 - 4, chY(0.04) - 4, "裸玻璃 4%", "end");
      } else if (state.scene === "soap") {
        g.appendChild(mk("line", { x1: chX(20), y1: CH.y0, x2: chX(20), y2: CH.y1, class: "ch-vline" }));
        tick(chX(20) + 4, CH.y0 + 10, "黑斑阈 ≈20nm");
      } else {
        g.appendChild(mk("line", { x1: CH.x0, y1: chY(0.16), x2: CH.x1, y2: chY(0.16), class: "ch-hline" }));
        tick(CH.x0 + 4, chY(0.16) + 12, "亮纹 4r² = 16%");
      }
      const pts = [];
      for (let i = 0; i <= 160; i++) {
        const t = chartTMax * i / 160;
        pts.push(chX(t).toFixed(1) + "," + chY(Rfn(t)).toFixed(1));
      }
      g.appendChild(mk("polyline", { points: pts.join(" "), class: "ch-curve", stroke: "#37d3c8" }));
    }
    function wavePath(b, amp, ph, x0, x1, wl) {
      const pts = [];
      for (let x = x0; x <= x1; x += 2) pts.push(x.toFixed(1) + "," + (b - amp * Math.sin(TAU * (x - x0) / wl - ph)).toFixed(1));
      return pts.join(" ");
    }
    function renderPhase(pi, lab) {
      const lam = state.p.lambdaW;
      const ph1 = pi.inv1 ? Math.PI : 0, ph2 = pi.inv2 ? Math.PI : 0;
      els.phW1.setAttribute("points", wavePath(58, 16, ph1, 112, 360, 124));
      els.phW2.setAttribute("points", wavePath(112, 16, ph2 + pi.path, 112, 360, 124));
      els.phW3.setAttribute("points", wavePath(180, 8 + 10 * clamp01(Math.sqrt(pi.R) / 0.4), pi.dphi, 112, 360, 124));
      els.phB1.style.display = pi.inv1 ? "" : "none";
      els.phB2.style.display = pi.inv2 ? "" : "none";
      els.phL1.textContent = "光束1：上界面反射" + (pi.inv1 ? " → π 突变" : " → 无突变");
      els.phL2.textContent = "光束2：下界面反射" + (pi.inv2 ? " → π 突变" : " → 无突变");
      els.phS1.textContent = pi.inv1 ? "光疏→光密" : "光密→光疏";
      els.phS2.textContent = pi.inv2 ? "光疏→光密" : "光密→光疏";
      const dk = normPi(pi.dphi);
      els.phDphi.textContent = "总相位差 Δφ = " + pi.dphi.toFixed(2) + " rad = " + dk.toFixed(2) + "π";
      const constructive = Math.abs(Math.cos(pi.dphi)) > 0.92 && Math.abs(pi.r1 * pi.r2) > 1e-6;
      const destructive = Math.abs(Math.cos(pi.dphi)) < 0.25;
      els.phVerdict.textContent = lab + "：" + (destructive ? "两束光反相叠加 → 相消 → 暗" : constructive ? "两束光同相叠加 → 相长 → 亮" : "介于两者之间");
      els.phVerdict.setAttribute("fill", destructive ? "var(--sim-trans)" : constructive ? "var(--sim-warning)" : "var(--sim-muted)");
      els.phFormula.textContent = "Δφ = 4πnt/λ" + ((pi.inv1 !== pi.inv2) ? " + π（恰好一处相位突变）" : " + 0（两处突变相抵消 / 均无突变）");
      els.phFormula2.textContent = "R = r₁² + r₂² + 2r₁r₂·cosΔφ间接项（r 为带符号振幅：" + pi.r1.toFixed(3) + ", " + pi.r2.toFixed(3) + "）";
    }

    /* ---------------- scene renderers ---------------- */
    function setMetric(i, val) { els["mV" + i].textContent = val; }
    function setMetricLabels(l1, l2, l3, l4) {
      els.mL1.textContent = l1; els.mL2.textContent = l2; els.mL3.textContent = l3; els.mL4.textContent = l4;
    }
    function renderWedge() {
      const lam = state.p.lambdaW;
      const px = clamp(state.probePx, WD.x0 + 6, WD.x1 - 6);
      const yTop = 258 - (px - 150) * 0.1; // air-gap upper face at the probe
      const t = WD.xToT(px);
      const pi = phaseInfo(1.5, 1, 1.5, t, lam);
      const k = Math.floor(t / (lam / 2) + 1e-9);
      // rays follow the probe: beam 1 reflects at the upper face, beam 2 at the lower face
      setLine("wdIncident", px, 64, px, yTop);
      setLine("wdRay1", px, yTop, px - 34, 76);
      setLine("wdRay2Down", px, yTop, px, 258);
      setLine("wdRay2Up", px, 258, px + 34, 76);
      arrowPoly("wdArrInc", px, 64, px, yTop);
      arrowPoly("wdArr1", px, yTop, px - 34, 76);
      arrowPoly("wdArr2", px, yTop, px, 258);
      els.wdDot1.setAttribute("cx", px); els.wdDot1.setAttribute("cy", yTop);
      els.wdDot2.setAttribute("cx", px); els.wdDot2.setAttribute("cy", 258);
      els.wdNum1.setAttribute("transform", "translate(" + (px - 16) + "," + (yTop - 16) + ")");
      els.wdNum2.setAttribute("transform", "translate(" + (px + 18) + ",240)");
      els.wBadge1.setAttribute("transform", "translate(" + (px - 66) + "," + (yTop + 10) + ")");
      els.wBadge2.setAttribute("transform", "translate(" + (px + 16) + ",274)");
      els.wBadge2Cap.setAttribute("x", px + 16);
      els.wBadge2Cap.setAttribute("y", 296);
      // probe line + readout bubble
      setLine("wdProbeLine", px, 414, px, 548);
      els.wdProbeKnob.setAttribute("points", (px - 7) + ",566 " + (px + 7) + ",566 " + px + ",578");
      els.wdBubble.setAttribute("transform", "translate(" + clamp(px, 240, 780) + ",0)");
      els.wdBubbleT1.textContent = "此处厚度 t = " + t.toFixed(0) + " nm ≈ " + (t / (lam / 2)).toFixed(2) + " × λ/2";
      els.wdBubbleT2.textContent = "第 " + k + " 条暗纹以内 · R = " + (pi.R * 100).toFixed(1) + "%";
      els.wdRay1.setAttribute("opacity", (0.25 + 0.75 * clamp01(pi.R / 0.16)).toFixed(3));
      els.wdRay2Down.setAttribute("opacity", "0.85"); els.wdRay2Up.setAttribute("opacity", "0.85");
      setMetricLabels("波长 λ", "劈尖角 θ", "暗纹间距 Δx", "探针处 R");
      setMetric(1, lam + " nm");
      setMetric(2, state.p.thetaMrad.toFixed(2) + " mrad");
      const spacingMm = lam * 1e-6 / (2 * state.p.thetaMrad * 1e-3) * 1e3;
      setMetric(3, spacingMm.toFixed(3) + " mm");
      setMetric(4, (pi.R * 100).toFixed(1) + " %");
      renderPhase(pi, "劈尖探针处");
      els.chDot.setAttribute("cx", chX(t)); els.chDot.setAttribute("cy", chY(pi.R));
      els.chMLine.setAttribute("x1", chX(t)); els.chMLine.setAttribute("x2", chX(t));
      els.insight.textContent = "同一条纹上厚度相同：暗纹在 t = k·λ/2（Δφ = 2kπ 需记入那一次 π 突变）。拖动探针可见 t 连续变化、亮暗周期性重复 —— 条纹是「等厚线」。";
    }
    function renderCoat() {
      const lam = state.p.lambdaW, t = state.p.coatT, n1 = state.p.coatN;
      const pi = phaseInfo(1, n1, 1.5, t, lam);
      els.coatFilmLabel.textContent = "膜 n₁=" + n1.toFixed(2) + " · t=" + t.toFixed(0) + "nm（λ膜内=" + (lam / n1).toFixed(0) + "nm）";
      els.coatFace1.textContent = pi.inv1 ? "① 空气→膜：光疏→光密 · π 突变" : "① 空气→膜：光密→光疏 · 无 π 突变";
      els.coatFace2.textContent = pi.inv2 ? "② 膜→玻璃：光疏→光密 · π 突变" : "② 膜→玻璃：光密→光疏 · 无 π 突变";
      // fixed layer bands (thickness not to scale, annotated in text): faces at y=160 / y=220
      setLine("ctIncident", 414, 20, 460, 160);
      setLine("ctRay1", 460, 160, 506, 20);
      setLine("ctRay2Down", 460, 160, 500, 220);
      setLine("ctRay2Up", 500, 220, 556, 20);
      setLine("ctTrans", 500, 220, 572, 596);
      arrowPoly("ctArrInc", 414, 20, 460, 160);
      arrowPoly("ctArr1", 460, 160, 506, 20);
      arrowPoly("ctArr2", 460, 160, 500, 220);
      arrowPoly("ctArr2Up", 500, 220, 556, 20);
      arrowPoly("ctArrT", 500, 220, 572, 596);
      els.ctDot2.setAttribute("cx", 500); els.ctDot2.setAttribute("cy", 220);
      els.ctBadge2.setAttribute("transform", "translate(518,240)");
      els.ctNum1.setAttribute("transform", "translate(472,140)");
      els.ctNum2.setAttribute("transform", "translate(482,200)");
      els.ctWaveAir.setAttribute("points", wavePath(105, 15, 0, 300, 560, 124));
      els.ctWaveFilm.setAttribute("points", wavePath(190, 9, pi.path, 300, 560, 62));
      els.ctWaveFilmLab.setAttribute("y", 155);
      els.ctWaveFilmLab.textContent = "膜内往返相位 4πn₁t/λ = " + normPi(pi.path).toFixed(2) + "π";
      const rBarW = clamp01(pi.R / 0.30) * 150;
      els.ctRefBar.setAttribute("width", rBarW.toFixed(1));
      els.ctRefVal.textContent = "反射 R = " + (pi.R * 100).toFixed(2) + " %";
      const T = 1 - pi.R;
      els.ctTransBar.setAttribute("width", (clamp01(T) * 150).toFixed(1));

      setMetric(4, qMin.toFixed(1) + " nm");
      renderPhase(pi, "增透膜");
      els.chDot.setAttribute("cx", chX(t)); els.chDot.setAttribute("cy", chY(pi.R));
      els.chMLine.setAttribute("x1", chX(t)); els.chMLine.setAttribute("x2", chX(t));
      els.insight.textContent = pi.inv1 !== pi.inv2
        ? "增透不是把 t 算成 λ/4，而是让 Δφ = (2k+1)π：膜内往返 4πn₁t/λ 加上「恰好一处」π 突变。正入射、n空气<n₁<n玻璃 时才解出 t = λ/(4n₁)。"
        : "反例时刻：n₁ 抬到玻璃之上后同一厚度公式失效 —— λ/4 处变成反射极大。死记 λ/4 在这里会给出完全错误的结论。";
    }
    function renderSoap() {
      const tau = state.tau;
      const rows = els.soapRows.children, N = rows.length;
      let nBlack = 0;
      for (let i = 0; i < N; i++) {
        const u = i / (N - 1);
        const t = soapThickness(u, tau);
        if (t <= 20) nBlack++;
        const c = soapColorLinear(t);
        rows[i].setAttribute("fill", cssRGB(c));
      }
      const tTop = soapTop(tau), tBot = soapThickness(1, tau);
      els.soapTopT.textContent = "顶部 t ≈ " + tTop.toFixed(0) + " nm" + (tTop <= 20 ? "（黑）" : "");
      const frac = nBlack / N;
      els.soapState.textContent = frac > 0.92 ? "膜几乎全黑 —— 快破了" : frac > 0.3 ? "顶部变灰发黑，向下蔓延" : "彩带向下移动，条纹变宽";
      // black threshold curve: t(u) profile
      const pts = [];
      for (let i = 0; i <= 80; i++) {
        const u = i / 80;
        const t = soapThickness(u, tau);
        const x = 700 + clamp01(t / 200) * 208;
        pts.push(x.toFixed(1) + "," + (494 - u * 428).toFixed(1));
      }
      els.soapTCurve.setAttribute("points", pts.join(" "));
      // black-threshold boundary: bisect where t(u) crosses 20 nm (top is thin, bottom thick)
      let lo = 0, hi = 1;
      const allBlack = soapThickness(1, tau) <= 20;
      if (!allBlack) { for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (soapThickness(m, tau) > 20) lo = m; else hi = m; } }
      const yb = allBlack ? 494 : 66 + ((lo + hi) / 2) * 428;
      els.soapBlackLine.setAttribute("y1", yb); els.soapBlackLine.setAttribute("y2", yb);
      els.soapBlackText.setAttribute("y", yb - 5);
      // sample marker
      const su = state.sampleU, st = soapThickness(su, tau);
      const sy = 66 + su * 428;
      els.soapSampleLine.setAttribute("y1", sy); els.soapSampleLine.setAttribute("y2", sy);
      els.soapSampleDot.setAttribute("cy", sy);
      els.soapSampleDot.setAttribute("cx", 700 + clamp01(st / 200) * 208);
      els.soapSampleT.setAttribute("y", sy - 6);
      els.soapSampleT.textContent = "采样线 t = " + st.toFixed(0) + " nm · R(550) = " + (filmReflectance(1, N_SOAP, 1, st, 550) * 100).toFixed(2) + "%";

      setMetric(1, tTop.toFixed(0) + " nm");

      renderPhase(pi, "肥皂膜采样处");
      let yMax = 0;
      for (const lam of [610, 550, 465]) yMax = Math.max(yMax, filmReflectance(1, N_SOAP, 1, st, lam));
      els.chDot.setAttribute("cx", chX(st)); els.chDot.setAttribute("cy", chY(yMax));
      els.chMLine.setAttribute("x1", chX(st)); els.chMLine.setAttribute("x2", chX(st));
      els.insight.textContent = tTop <= 20
        ? "顶部的膜薄到 t ≲ 20nm（≪ λ/8）：两界面各一次 π 突变恰好相抵，往返相位又≈0 → Δφ≈0 → 反射相消，R→0。没有光反射回来，所以「发黑」= 看向透射光。"
        : "排水让 t 持续变小：同一高度处条纹对应的 λ/2 逐个消失，彩带下移、变宽，最后顶部 R→0 发黑 —— 快破了。";
    }
    function render() {
      if (dirty.wedge) { rebuildWedge(); dirty.wedge = false; }
      if (dirty.chart) { rebuildChart(); dirty.chart = false; }
      els.chDot.style.display = ""; els.chMLine.style.display = "";
      els.gWedge.style.display = state.scene === "wedge" ? "" : "none";
      els.gCoat.style.display = state.scene === "coat" ? "" : "none";
      els.gSoap.style.display = state.scene === "soap" ? "" : "none";
      if (state.scene === "wedge") renderWedge();
      else if (state.scene === "coat") renderCoat();
      else renderSoap();
    }

    /* ---------------- interactions ---------------- */
    function init() {
      els = {};
      const ids = ["status", "stageSvg", "stageHint", "gWedge", "gCoat", "gSoap",
        "wdIncident", "wdRay1", "wdRay2Down", "wdRay2Up", "wBadge1", "wBadge2Cap", "wBadge2",
        "wdArrInc", "wdArr1", "wdArr2", "wdDot1", "wdDot2", "wdNum1", "wdNum2",
        "wdProbeLine", "wdProbeKnob", "wdBubble", "wdBubbleT1", "wdBubbleT2",
        "wedgeStrip", "wedgeTAxis", "wedgeKLabels", "wedgeXAxis",
        "coatFilmRect", "coatFilmLabel", "coatFace1", "coatFace2", "coatSummary",
        "ctIncident", "ctRay1", "ctRay2Down", "ctRay2Up", "ctTrans", "ctRefBar", "ctRefVal", "ctTransBar", "ctTransVal",
        "ctArrInc", "ctArr1", "ctArr2", "ctArr2Up", "ctArrT", "ctDot2", "ctNum1", "ctNum2", "ctBadge2",
        "ctWaveAir", "ctWaveFilm", "ctWaveFilmLab",
        "soapRows", "soapTopT", "soapState", "soapBlackLine", "soapBlackText", "soapGrid", "soapTCurve", "soapAxisLabels",
        "soapSampleLine", "soapSampleDot", "soapSampleT",
        "phW1", "phW2", "phW3", "phB1", "phB2", "phL1", "phL2", "phS1", "phS2", "phDphi", "phVerdict", "phFormula", "phFormula2",
        "chRoot", "chTitle", "chSub", "chDot", "chMLine", "insight",
        "mL1", "mL2", "mL3", "mL4", "mV1", "mV2", "mV3", "mV4",
        "startBtn", "pauseBtn", "resetBtn",
        "thetaInput", "thetaOutput", "lambdaInput", "lambdaOutput",
        "coatTInput", "coatTOutput", "coatNInput", "coatNOutput",
        "speedInput", "speedOutput", "soapTInput", "soapTOutput",
        "ctlWedge", "ctlCoat", "ctlSoap", "dockHint"];
      for (const id of ids) els[id] = document.getElementById(id);
      buildWedgeStatics(); buildSoapStatics();
      bindControls();
      reset();
      requestAnimationFrame(frame);
    }
    function bindControls() {
      els.startBtn.addEventListener("click", start);
      els.pauseBtn.addEventListener("click", pause);
      els.resetBtn.addEventListener("click", reset);
      els.thetaInput.addEventListener("input", () => {
        state.p.thetaMrad = Number(els.thetaInput.value);
        els.thetaOutput.textContent = state.p.thetaMrad.toFixed(2) + " mrad";
        dirty.wedge = true; dirty.chart = true; render();
      });
      els.lambdaInput.addEventListener("input", () => {
        state.p.lambdaW = Number(els.lambdaInput.value);
        els.lambdaOutput.textContent = state.p.lambdaW + " nm";
        dirty.wedge = true; dirty.chart = true; render();
      });
      els.coatTInput.addEventListener("input", () => {
        state.p.coatT = Number(els.coatTInput.value);
        els.coatTOutput.textContent = state.p.coatT + " nm";
        dirty.chart = true; render();
      });
      els.coatNInput.addEventListener("input", () => {
        state.p.coatN = Number(els.coatNInput.value);
        els.coatNOutput.textContent = state.p.coatN.toFixed(2);
        dirty.chart = true; render();
      });
      els.speedInput.addEventListener("input", () => {
        state.p.soapSpeed = Number(els.speedInput.value);
        els.speedOutput.textContent = state.p.soapSpeed.toFixed(2) + "×";
      });
      els.soapTInput.addEventListener("input", () => { // two-way: slider rewinds drainage time
        const v = Number(els.soapTInput.value);
        state.tau = v <= 0.5 ? 400 : clamp(-8 * Math.log(v / 140), 0, 400);
        els.soapTOutput.textContent = Math.min(v, 140) + " nm";
        render();
      });
      document.querySelectorAll("[data-scene]").forEach(btn =>
        btn.addEventListener("click", () => switchScene(btn.dataset.scene)));
      const svg = els.stageSvg;
      const svgPoint = evt => {
        const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      };
      svg.addEventListener("pointerdown", evt => {
        const p = svgPoint(evt);
        if (state.scene === "wedge" && p.y >= 400 && p.y <= 530 && p.x >= WD.stripX && p.x <= WD.stripX + WD.stripW) {
          state.probePx = p.x; svg.setPointerCapture(evt.pointerId); render();
        } else if (state.scene === "soap" && p.x >= 250 && p.x <= 630 && p.y >= 56 && p.y <= 560) {
          state.sampleU = clamp01((p.y - 66) / 428); svg.setPointerCapture(evt.pointerId); render();
        }
      });
      svg.addEventListener("pointermove", evt => {
        if (!svg.hasPointerCapture || !svg.hasPointerCapture(evt.pointerId)) return;
        const p = svgPoint(evt);
        if (state.scene === "wedge") { state.probePx = clamp(p.x, WD.x0 + 6, WD.x1 - 6); render(); }
        else if (state.scene === "soap") { state.sampleU = clamp01((p.y - 66) / 428); render(); }
      });
      svg.addEventListener("keydown", evt => {
        if (state.scene === "wedge" && (evt.key === "ArrowLeft" || evt.key === "ArrowRight")) {
          state.probePx = clamp(state.probePx + (evt.key === "ArrowRight" ? 12 : -12), WD.x0 + 6, WD.x1 - 6);
          evt.preventDefault(); render();
        } else if (state.scene === "soap" && (evt.key === "ArrowUp" || evt.key === "ArrowDown")) {
          state.sampleU = clamp01(state.sampleU + (evt.key === "ArrowDown" ? 0.03 : -0.03));
          evt.preventDefault(); render();
        }
      });
    }
    const SCENE_HINT = {
      wedge: "拖动条纹带上的探针（或点击/用 ←→ 键）：读出每处的厚度 t 与反射率 R",
      coat: "调膜厚 t 与膜折射率 n₁：看 Δφ 如何决定 R；把 n₁ 抬过 1.5 看 λ/4 反例",
      soap: "点 ▶ 开始排水；点击膜面放置采样线；拖「顶部膜厚」滑杆可倒回时间"
    };
    function switchScene(scene) {
      state.scene = scene;
      document.querySelectorAll("[data-scene]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.scene === scene)));
      els.ctlWedge.hidden = scene !== "wedge";
      els.ctlCoat.hidden = scene !== "coat";
      els.ctlSoap.hidden = scene !== "soap";
      els.dockHint.textContent = SCENE_HINT[scene];
      els.stageHint.textContent = SCENE_HINT[scene];
      dirty.chart = true; render();
    }

    /* ---------------- lifecycle ---------------- */
    function update(dt) {
      if (!state.running) return;
      const d = clamp(Number.isFinite(dt) ? dt : 0, 0, 0.05);
      state.clock += d * 1.15;
      state.tau = Math.min(400, state.tau + d * state.p.soapSpeed);
      if (state.scene === "soap") {
        els.soapTOutput.textContent = Math.round(Math.min(soapTop(state.tau), 140)) + " nm";
        els.soapTInput.value = String(Math.round(clamp(soapTop(state.tau), 0, 140)));
      }
    }
    function frame(ts) {
      if (state.lastTs == null) state.lastTs = ts;
      const dt = (ts - state.lastTs) / 1000;
      state.lastTs = ts;
      update(dt);
      if (state.scene === "soap") render();
      requestAnimationFrame(frame);
    }
    function start() {
      state.running = true;
      els.status.textContent = "运行中";
      els.status.classList.add("on");
      els.startBtn.setAttribute("aria-pressed", "true");
    }
    function pause() {
      state.running = false;
      els.status.textContent = "已暂停";
      els.status.classList.remove("on");
      els.startBtn.setAttribute("aria-pressed", "false");
    }
    function reset() {
      pause();
      state.clock = 0; state.tau = 0; state.lastTs = null;
      state.probePx = 430; state.sampleU = 0.2;
      state.p = { thetaMrad: 0.25, lambdaW: 550, coatT: 20, coatN: 1.38, soapSpeed: 1 };
      els.thetaInput.value = "0.25"; els.thetaOutput.textContent = "0.25 mrad";
      els.lambdaInput.value = "550"; els.lambdaOutput.textContent = "550 nm";
      els.coatTInput.value = "20"; els.coatTOutput.textContent = "20 nm";
      els.coatNInput.value = "1.38"; els.coatNOutput.textContent = "1.38";
      els.speedInput.value = "1"; els.speedOutput.textContent = "1.00×";
      els.soapTInput.value = "140"; els.soapTOutput.textContent = "140 nm";
      dirty = { wedge: true, coat: true, soap: true, chart: true, phase: true };
      render();
    }
    function setParameters(values) {
      if (!els) return;
      const v = values || {};
      if (v.thetaMrad !== undefined) { state.p.thetaMrad = clamp(Number(v.thetaMrad) || 0.25, 0.1, 0.8); els.thetaInput.value = String(state.p.thetaMrad); }
      if (v.lambdaW !== undefined) { state.p.lambdaW = clamp(Number(v.lambdaW) || 550, 400, 700); els.lambdaInput.value = String(state.p.lambdaW); }
      if (v.coatT !== undefined) { state.p.coatT = clamp(Number(v.coatT) || 20, 0, 300); els.coatTInput.value = String(state.p.coatT); }
      if (v.coatN !== undefined) { state.p.coatN = clamp(Number(v.coatN) || 1.38, 1.15, 2.45); els.coatNInput.value = String(state.p.coatN); }
      if (v.soapSpeed !== undefined) { state.p.soapSpeed = clamp(Number(v.soapSpeed) || 1, 0.25, 3); els.speedInput.value = String(state.p.soapSpeed); }
      dirty.wedge = true; dirty.chart = true; render();
    }
    function getState() {
      return {
        scene: state.scene, running: state.running, clock: state.clock, tau: state.tau,
        probePx: state.probePx, sampleU: state.sampleU,
        parameters: { ...state.p }
      };
    }
    function getReadouts() {
      if (state.scene === "wedge") {
        const t = WD.xToT(clamp(state.probePx, WD.x0 + 6, WD.x1 - 6));
        return { scene: "wedge", t_nm: t, R: filmReflectance(1.5, 1, 1.5, t, state.p.lambdaW), lambda_nm: state.p.lambdaW };
      }
      if (state.scene === "coat") {
        return { scene: "coat", t_nm: state.p.coatT, R: filmReflectance(1, state.p.coatN, 1.5, state.p.coatT, state.p.lambdaW), lambda_nm: state.p.lambdaW };
      }
      const t = soapThickness(state.sampleU, state.tau);
      return { scene: "soap", t_nm: t, tau: state.tau, R: filmReflectance(1, N_SOAP, 1, t, 550) };
    }

    window.simulation = { init, start, pause, reset, update, render, setParameters, getState, getReadouts, runModelChecks, switchScene };
    if (typeof document !== "undefined" && typeof document.getElementById === "function" && document.getElementById("simRoot")) init();
  })();
  </script>
</body>
</html>
